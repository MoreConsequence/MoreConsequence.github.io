<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">HTTP 缓存协商决策模型：强缓存 (Max-Age) 与协商缓存 (304 Not Modified)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Cache-Control: max-age (本地内存/磁盘直读 200 OK From Disk) ──► If-None-Match: ETag 协商验证 ──► 304 节省 99% 带宽</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 强缓存阶段：本地直接命中 (Fresh: 200 OK from disk cache, 0ms)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">检查 Cache-Control: max-age=31536000, immutable ──► 当前时间未过期 ──► 0 网络请求直接复用本地资源</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">带 Hash 指纹的静态资源（JS/CSS/SVG）的黄金配置，秒开的核心奥秘！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 协商缓存阶段：条件请求发出 (Stale: If-None-Match / If-Modified-Since)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">强缓存过期或标记了 no-cache ──► 客户端携带 If-None-Match: "w/9f8a7b" 发送极小的 HTTP Header</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">向源站或边缘 CDN 发起一次微秒级轻量验证！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 源站快速比对与 304 响应 (Server Verification: 304 Not Modified)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">服务端比对 Hash 一致 ──► 0 Body 传输，仅返回 304 响应头 ──► 客户端刷新本地缓存有效期</text>
        <text x="15" y="62" font-size="8" fill="#047857">带宽开销降低 99.8%，HTML 入口文档的标准最佳实践！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">4. 资源变更与全量回包 (Content Mutated: 200 OK + New ETag)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">内容已被修改 ──► 返回全新数据 Body 与新 ETag ──► 客户端更新缓存并渲染最新页面</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">保证用户永远能立即获取最新版本的网站更新，彻底告别“强制刷新”！</text>
      </g>
    </g>
  </g>
</svg>