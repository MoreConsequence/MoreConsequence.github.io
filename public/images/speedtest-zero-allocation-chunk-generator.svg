<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="speedtest-zero-allocation-chunk-generator-title speedtest-zero-allocation-chunk-generator-desc"><title id="speedtest-zero-allocation-chunk-generator-title">测速服务端 0 分配数据生成器：预分配 64MB 循环缓冲区与零拷贝直接下发</title><desc id="speedtest-zero-allocation-chunk-generator-desc">测速服务端 0 分配数据生成器：预分配 64MB 循环缓冲区与零拷贝直接下发</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">测速服务端 100Gbps 吞吐 0 内存分配引擎 (Zero-Alloc Stream Engine)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">每次动态 make/rand 生成数据 (CPU 100% 打满，GC 频繁卡顿) vs 预分配全局不可压缩伪随机 RingBuffer + splice 零拷贝直发网卡</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 动态生成与全量堆分配：CPU 与 GC 崩溃</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">for {</text>
          <text y="28" fill="#f5f5f5">  chunk := make([]byte, 1024*1024) // 每次申请 1MB 堆内存</text>
          <text y="42" fill="#f5f5f5">  rand.Read(chunk)                 // 消耗海量 CPU 生成随机数</text>
          <text y="56" fill="#f5f5f5">  conn.Write(chunk)</text>
          <text y="70" fill="#f5f5f5">}</text>

          <text y="92" fill="#f5f5f5">💥 10Gbps 并发下产生 1.25GB/s 的堆垃圾！</text>
          <text y="106" fill="#f5f5f5">🔴 GC STW 频繁卡顿，测速服务端自身成为最大瓶颈！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 单机只能跑满 2Gbps 网卡带宽；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• CPU 全在做无意义的随机数运算与垃圾回收；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 严重限制单机并发承载上限！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 预热 RingBuffer + 0 分配复用直发</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 启动时预分配全局 64MB 不可压缩高质量随机数据</text>
          <text y="28" fill="#f5f5f5">var GlobalPayload = makeRandomBytes(64 * 1024 * 1024)</text>

          <text y="48" fill="#f5f5f5">发送流水线 (0 Allocs):</text>
          <text y="62" fill="#f5f5f5">for {</text>
          <text y="76" fill="#f5f5f5">  // 纯只读切片引用，0 堆内存分配！</text>
          <text y="90" fill="#f5f5f5">  _, err := conn.Write(GlobalPayload[offset : offset+64*1024])</text>
          <text y="104" fill="#f5f5f5">}</text>

          <text y="122" fill="#f5f5f5">✓ 单机轻松压榨跑满 100Gbps 物理网卡！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• CPU 利用率从 100% 暴降至 3%；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 彻底消灭 GC 干扰，测速曲线绝对平滑；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 顶级网络测量服务器架构范式！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
