<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="vector-index-hnsw-ivf-pq-tradeoff-title vector-index-hnsw-ivf-pq-tradeoff-desc"><title id="vector-index-hnsw-ivf-pq-tradeoff-title">向量检索三大索引架构：HNSW 图、IVF 倒排桶与 PQ 量化对比</title><desc id="vector-index-hnsw-ivf-pq-tradeoff-desc">向量检索三大索引架构：HNSW 图、IVF 倒排桶与 PQ 量化对比</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">向量检索三大索引架构原理与物理权衡</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">HNSW 分层图 (极致召回与低延迟) vs IVF 倒排聚类桶 (动态平衡) vs PQ 乘积量化 (8x~16x 显存压缩)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. HNSW (分层可导航小世界图)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 多层图 Skip-List 拓扑</text>
          <text x="10" y="34" fill="#f5f5f5">Layer 2 (稀疏顶层): 快速大跨步跳跃</text>
          <text x="10" y="48" fill="#f5f5f5">Layer 1 (中层过渡): 逼近目标局部区域</text>
          <text x="10" y="62" fill="#f5f5f5">Layer 0 (稠密底层): 局部贪心搜索最近邻</text>
          <text x="10" y="82" fill="#f5f5f5">✓ 召回率 (Recall@10): 98% ~ 99.5%</text>
          <text x="10" y="98" fill="#f5f5f5">✓ 检索延迟: 亚毫秒级 (0.8ms)</text>
          <text x="10" y="118" fill="#f5f5f5">❌ 内存开销: 原始向量 + 1.5x~2x 图指针</text>
          <text x="10" y="134" fill="#f5f5f5">1亿 768维向量需要 300GB+ 内存！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">🎯 最佳适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 核心低延迟 RAG 在线召回</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 向量规模在千万级以内，内存预算充足</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 要求 98% 以上极高召回率保证</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">2. IVF (倒排文件聚类索引)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// K-Means 聚类与倒排桶</text>
          <text x="10" y="34" fill="#f5f5f5">1. 将向量空间划分为 K 个 Voronoi 质心</text>
          <text x="10" y="48" fill="#f5f5f5">2. 查询时仅扫描最近的 nprobe 个桶</text>
          <text x="10" y="62" fill="#f5f5f5">3. 大幅减少全量暴力比对计算量</text>
          <text x="10" y="82" fill="#f5f5f5">✓ 内存开销小：仅需存储质心与倒排表</text>
          <text x="10" y="98" fill="#f5f5f5">✓ 召回与延迟受 nprobe 动态调节</text>
          <text x="10" y="118" fill="#f5f5f5">❌ 边界效应：质心附近的边缘点易漏召</text>
          <text x="10" y="134" fill="#f5f5f5">召回率通常在 85% ~ 95%</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">🎯 最佳适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 亿级海量向量搜索与中等内存成本</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 支持在线动态调参（调整 nprobe 换速度）</text>
        <text x="10" y="224" font-size="7.5" fill="#2d3142">• 适合粗排过滤与两阶段检索候选集</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. PQ / IVF-PQ (乘积量化压缩)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 子空间切分与码本编码</text>
          <text x="10" y="34" fill="#f5f5f5">1. 将 768 维切分为 M=96 个 8 维子向量</text>
          <text x="10" y="48" fill="#f5f5f5">2. 每个子空间训练 256 个聚类中心 (1 Byte)</text>
          <text x="10" y="62" fill="#f5f5f5">3. 原始 3072 Byte 压缩为仅 96 Byte！</text>
          <text x="10" y="82" fill="#f5f5f5">✓ 显存/内存压缩 8x ~ 32x 倍！</text>
          <text x="10" y="98" fill="#f5f5f5">✓ 亿级向量仅需 16GB 单机全内存装载</text>
          <text x="10" y="118" fill="#f5f5f5">❌ 有损量化：距离计算为近似非对称距离</text>
          <text x="10" y="134" fill="#f5f5f5">必须配合原始向量精排重打分！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">🎯 最佳适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 10 亿级以上超大规模向量搜索引擎</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 内存预算极度受限（如端侧或廉价云机）</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业界标准：“IVF-PQ 粗召回 + HNSW 精排”</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
