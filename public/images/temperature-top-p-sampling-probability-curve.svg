<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="temperature-top-p-sampling-probability-curve-title temperature-top-p-sampling-probability-curve-desc"><title id="temperature-top-p-sampling-probability-curve-title">大模型采样参数物理机理：Temperature 平滑 Logits vs Top-P 核采样截断</title><desc id="temperature-top-p-sampling-probability-curve-desc">大模型采样参数物理机理：Temperature 平滑 Logits vs Top-P 核采样截断</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">大模型解码采样参数机理：Temperature 与 Top-P 协同拓扑</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Raw Logits ──► Temperature 缩放 Softmax 概率分布 ──► Top-P 累积概率核截断 ──► 伪随机数发生器 (PRNG Seed) 采样输出下一个 Token</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 原始对数几率计算 (Raw Logits Output: z_i)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Transformer 最后一层线性投影输出词表中每个 Token 的无界实数得分 z_i (例如 vocab_size = 128,000)</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">反映模型对下一个词的原始置信倾向！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 温度缩放 Softmax 概率塑形 (Temperature Scaling: P_i = softmax(z_i / T))</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">T=0 极度陡峭 (贪婪解码 Greedy) ｜ T=0.7 适度平滑平衡创意 ｜ T=2.0 趋近均匀分布 (胡言乱语)</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">代码生成与 JSON 结构化提取强烈推荐固定 T=0！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. Top-P 核采样动态长尾截断 (Nucleus Filtering: Σ P_i &lt;= P)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">按概率降序累加至 Top-P (如 0.9) ──► 动态丢弃累计概率超过 90% 之外的长尾荒谬词 ──► 重归一化</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">彻底斩断低置信度垃圾 Token 的误选可能！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 确定性随机数种子与硬件非确定性 (Seed &amp; GPU Non-Determinism)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">固定 seed: 42 ──► 但多 GPU 并行 FlashAttention 浮点加法不满足结合律 ──► 仍有微小偶发偏差！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">深入理解现代大模型推理解码的底层物理本质！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
