<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="testcontainers-ephemeral-database-pipeline-title testcontainers-ephemeral-database-pipeline-desc"><title id="testcontainers-ephemeral-database-pipeline-title">Testcontainers 临时真实数据库流水线：Docker 动态起停 -&gt; 隔离测试 -&gt; 自动销毁</title><desc id="testcontainers-ephemeral-database-pipeline-desc">Testcontainers 临时真实数据库流水线：Docker 动态起停 -&gt; 隔离测试 -&gt; 自动销毁</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Testcontainers 真实容器化集成测试生命周期流水线</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 单元测试启动 ──► 2. Ryuk 自动在 Docker 启动临时 Postgres/Redis 容器 ──► 3. 执行真实 SQL 与事务并发断言 ──► 4. 测试结束瞬间自动 100% 清理销毁</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 测试启动与守护进程就绪 (Ryuk Moby Container Daemon)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Testcontainers 启动轻量守护进程 Ryuk ──► 监控测试进程生命周期 ──► 保证即使测试强杀也不会残留僵尸容器</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">0 污染本地开发环境！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 毫秒级拉起真实镜像 (postgres:16-alpine on Random Port)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">分配随机空闲端口 ──► 执行 Schema Migration 脚本建表 ──► 获取动态 DSN 注入测试上下文</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">支持多测试套件 100% 并发并行运行，0 端口冲突！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 运行真实 SQL 物理断言 (Real Postgres Execution &amp; ACID Proof)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">执行真实复杂查询、JSONB 操作、死锁并发竞争与唯一键约束测试 ──► 彻底消灭 H2/Mock 的语法偏差</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">100% 还原生产环境行为的钢铁信心！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 极速无损自动销毁 (Teardown &amp; Automatic Self-Pruning)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">测试函数执行完毕 ──► 容器瞬间停止并移除 ──► 0 数据垃圾残留，本地与 CI 流水线完全一致！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">现代化工程集成测试的革命性突破！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
