<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Testcontainers 真实容器化集成测试生命周期流水线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 单元测试启动 ──► 2. Ryuk 自动在 Docker 启动临时 Postgres/Redis 容器 ──► 3. 执行真实 SQL 与事务并发断言 ──► 4. 测试结束瞬间自动 100% 清理销毁</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 测试启动与守护进程就绪 (Ryuk Moby Container Daemon)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Testcontainers 启动轻量守护进程 Ryuk ──► 监控测试进程生命周期 ──► 保证即使测试强杀也不会残留僵尸容器</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">0 污染本地开发环境！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 毫秒级拉起真实镜像 (postgres:16-alpine on Random Port)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">分配随机空闲端口 ──► 执行 Schema Migration 脚本建表 ──► 获取动态 DSN 注入测试上下文</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">支持多测试套件 100% 并发并行运行，0 端口冲突！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 运行真实 SQL 物理断言 (Real Postgres Execution &amp; ACID Proof)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">执行真实复杂查询、JSONB 操作、死锁并发竞争与唯一键约束测试 ──► 彻底消灭 H2/Mock 的语法偏差</text>
        <text x="15" y="62" font-size="8" fill="#047857">100% 还原生产环境行为的钢铁信心！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 极速无损自动销毁 (Teardown &amp; Automatic Self-Pruning)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">测试函数执行完毕 ──► 容器瞬间停止并移除 ──► 0 数据垃圾残留，本地与 CI 流水线完全一致！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代化工程集成测试的革命性突破！</text>
      </g>
    </g>
  </g>
</svg>