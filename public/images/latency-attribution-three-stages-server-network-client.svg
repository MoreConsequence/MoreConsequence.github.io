<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%" role="img" aria-labelledby="latency-attribution-three-stages-server-network-client-title latency-attribution-three-stages-server-network-client-desc"><title id="latency-attribution-three-stages-server-network-client-title">端到端时延归因实测：服务端处理、网络往返 (RTT) 与客户端事件循环调度</title><desc id="latency-attribution-three-stages-server-network-client-desc">端到端时延归因实测：服务端处理、网络往返 (RTT) 与客户端事件循环调度</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">端到端 27ms 时延三段拆解归因：为什么服务端日志只记了 2ms</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 客户端排队与 TCP 建连 (3ms) ｜ 2. 物理网络 RTT 传输 (20ms) ｜ 3. 服务端计算 (2ms) ｜ 4. 客户端 JS 主线程调度 (2ms)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 20)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="270" height="345" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="270" height="30" rx="6" fill="#ffffff" />
      <text x="135" y="20" font-size="11" font-weight="700" fill="#2d3142" text-anchor="middle">1. 网络传输与 RTT (20ms)</text>

      <g transform="translate(12, 42)" font-size="8">
        <text y="14" font-weight="700" fill="#2d3142">• 物理光纤距离与光速物理极限</text>
        <text y="30" fill="#4f5d75">北京到上海往返物理光纤延时 ~20ms；</text>
        <text y="50" font-weight="700" fill="#4f5d75">耗时占比：74% (全链路最大头)</text>
        <text y="68" fill="#4f5d75">• 无论后端算法如何从 2ms 优化到 1ms；</text>
        <text y="86" fill="#4f5d75">• 用户体感时延依然纹丝不动！</text>
        <text y="108" font-weight="700" fill="#2d3142">✓ 解法：边缘 CDN 部署，拉近物理距离。</text>
      </g>

      
      <g transform="translate(290, 0)">
        <rect width="270" height="345" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <rect width="270" height="30" rx="6" fill="#ffffff" />
        <text x="135" y="20" font-size="11" font-weight="700" fill="#2d3142" text-anchor="middle">2. 服务端真实耗时 (2ms)</text>

        <g transform="translate(12, 42)" font-size="8">
          <text y="14" font-weight="700" fill="#2d3142">• Nginx / Go 服务端计算时间</text>
          <text y="30" fill="#4f5d75">Server-Timing: app;dur=2.1ms</text>
          <text y="50" font-weight="700" fill="#4f5d75">耗时占比：仅 7%</text>
          <text y="68" fill="#4f5d75">• 服务端仅记录 socket 读完到写出时间；</text>
          <text y="86" fill="#4f5d75">• 无法反映客户端真实受到的网络颠簸！</text>
          <text y="108" font-weight="700" fill="#2d3142">✓ 解法：严禁仅凭后端日志评估用户体验。</text>
        </g>
      </g>

      
      <g transform="translate(580, 0)">
        <rect width="280" height="345" rx="6" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <rect width="280" height="30" rx="6" fill="#ffffff" />
        <text x="140" y="20" font-size="11" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 客户端主线程排队 (5ms)</text>

        <g transform="translate(12, 42)" font-size="8">
          <text y="14" font-weight="700" fill="#4f5d75">• 浏览器/移动端渲染与事件循环</text>
          <text y="30" fill="#4f5d75">Socket 收到数据 ──► 推入微任务队列 ──► 主线程执行回调</text>
          <text y="50" font-weight="700" fill="#2d3142">耗时占比：19%</text>
          <text y="68" fill="#4f5d75">• 若当前主线程被大 DOM 重绘或复杂计算阻塞；</text>
          <text y="86" fill="#4f5d75">• 回调函数被严重推迟，产生显著体感延迟！</text>
          <text y="108" font-weight="700" fill="#2d3142">✓ 解法：Web Worker 分离计算，保障主线程轻量。</text>
        </g>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
