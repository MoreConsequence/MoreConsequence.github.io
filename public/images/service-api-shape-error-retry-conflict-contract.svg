<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="service-api-shape-error-retry-conflict-contract-title service-api-shape-error-retry-conflict-contract-desc"><title id="service-api-shape-error-retry-conflict-contract-title">API 形状即服务合同：错误形状、可重试性标记、版本冲突与幂等契约定义</title><desc id="service-api-shape-error-retry-conflict-contract-desc">API 形状即服务合同：错误形状、可重试性标记、版本冲突与幂等契约定义</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">微服务 API 契约设计：错误模型、重试语义与并发版本控制</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">标准成功响应 DTO ｜ 显式区分可重试性 (Retryable: true/false) ｜ ETag / If-Match 乐观并发冲突 ｜ 严格强类型 Schema 演进</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 统一错误形状 (Error Shape)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// RFC 7807 Problem Details 规范</text>
          <text x="10" y="32" fill="#f5f5f5">{</text>
          <text x="16" y="46" fill="#f5f5f5">  "type": "https://api.site/errors/locked",</text>
          <text x="16" y="60" fill="#f5f5f5">  "title": "Resource Locked",</text>
          <text x="16" y="74" fill="#f5f5f5">  "status": 409,</text>
          <text x="16" y="88" fill="#f5f5f5">  "retryable": false, // 显式声明不可盲目重试！</text>
          <text x="16" y="102" fill="#f5f5f5">  "trace_id": "7a8b9c1d2e"</text>
          <text x="10" y="116" fill="#f5f5f5">}</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 客户端无需解析字符串猜错误；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 自动化重试拦截器根据 retryable 精确决策；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 全局 TraceID 串联客户端与服务端日志。</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 指数退避与抖动重试策略</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// Full Jitter 指数退避公式</text>
          <text x="10" y="34" fill="#f5f5f5">t = min(t_max, t_base * 2^attempt)</text>
          <text x="10" y="50" fill="#f5f5f5">sleep = random_between(0, t)</text>

          <text x="10" y="74" fill="#f5f5f5">1. 仅对 503 / 429 且带 Retry-After 响应重试</text>
          <text x="10" y="90" fill="#f5f5f5">2. 400 Bad Request 坚决 0 次重试</text>
          <text x="10" y="108" fill="#f5f5f5">✓ 彻底避免十万客户端同时重试冲垮故障节点！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 避免重试风暴 (Retry Storm)；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 重试预算 (Retry Budget) 限制在总请求量 10% 内；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造具备自愈弹性的分布式调用链。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 乐观并发版本控制 (CAS)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// HTTP If-Match 与 ETag 机制</text>
          <text x="10" y="34" fill="#f5f5f5">GET /doc/1 ──► ETag: "v3_hash"</text>

          <text x="10" y="56" fill="#f5f5f5">PUT /doc/1</text>
          <text x="10" y="70" fill="#f5f5f5">If-Match: "v3_hash"</text>

          <text x="10" y="92" fill="#f5f5f5">1. 若版本匹配 ──► 成功更新并派发 "v4_hash"</text>
          <text x="10" y="108" fill="#f5f5f5">2. 若已被篡改 ──► 412 Precondition Failed！</text>
          <text x="10" y="124" fill="#f5f5f5">✓ 0 锁开销杜绝多人编辑时的数据相互覆盖！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 优雅解决高并发写入的 Lost Update 难题；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 纯标准 HTTP 语义，无需额外锁协议；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 资深架构师设计 API 合同的核心标尺。</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
