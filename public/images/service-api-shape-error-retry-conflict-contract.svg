<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">微服务 API 契约设计：错误模型、重试语义与并发版本控制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">标准成功响应 DTO ｜ 显式区分可重试性 (Retryable: true/false) ｜ ETag / If-Match 乐观并发冲突 ｜ 严格强类型 Schema 演进</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 统一错误形状 (Error Shape)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// RFC 7807 Problem Details 规范</text>
          <text x="10" y="32" fill="#86efac">{</text>
          <text x="16" y="46" fill="#38bdf8">  "type": "https://api.site/errors/locked",</text>
          <text x="16" y="60" fill="#86efac">  "title": "Resource Locked",</text>
          <text x="16" y="74" fill="#f87171">  "status": 409,</text>
          <text x="16" y="88" fill="#4ade80">  "retryable": false, // 显式声明不可盲目重试！</text>
          <text x="16" y="102" fill="#fed7aa">  "trace_id": "7a8b9c1d2e"</text>
          <text x="10" y="116" fill="#86efac">}</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 客户端无需解析字符串猜错误；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 自动化重试拦截器根据 retryable 精确决策；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 全局 TraceID 串联客户端与服务端日志。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 指数退避与抖动重试策略</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// Full Jitter 指数退避公式</text>
          <text x="10" y="34" fill="#86efac">t = min(t_max, t_base * 2^attempt)</text>
          <text x="10" y="50" fill="#38bdf8">sleep = random_between(0, t)</text>
          
          <text x="10" y="74" fill="#34d399">1. 仅对 503 / 429 且带 Retry-After 响应重试</text>
          <text x="10" y="90" fill="#f87171">2. 400 Bad Request 坚决 0 次重试</text>
          <text x="10" y="108" fill="#4ade80">✓ 彻底避免十万客户端同时重试冲垮故障节点！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免重试风暴 (Retry Storm)；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 重试预算 (Retry Budget) 限制在总请求量 10% 内；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造具备自愈弹性的分布式调用链。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 乐观并发版本控制 (CAS)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// HTTP If-Match 与 ETag 机制</text>
          <text x="10" y="34" fill="#fed7aa">GET /doc/1 ──► ETag: "v3_hash"</text>
          
          <text x="10" y="56" fill="#38bdf8">PUT /doc/1</text>
          <text x="10" y="70" fill="#93c5fd">If-Match: "v3_hash"</text>
          
          <text x="10" y="92" fill="#34d399">1. 若版本匹配 ──► 成功更新并派发 "v4_hash"</text>
          <text x="10" y="108" fill="#f87171">2. 若已被篡改 ──► 412 Precondition Failed！</text>
          <text x="10" y="124" fill="#4ade80">✓ 0 锁开销杜绝多人编辑时的数据相互覆盖！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 优雅解决高并发写入的 Lost Update 难题；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 纯标准 HTTP 语义，无需额外锁协议；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 资深架构师设计 API 合同的核心标尺。</text>
      </g>
    </g>
  </g>
</svg>