<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="llm-sampling-temperature-topp-geometry-logits-title llm-sampling-temperature-topp-geometry-logits-desc"><title id="llm-sampling-temperature-topp-geometry-logits-title">大模型采样几何语义：Temperature 退火拉平、Top-P 累积截断与 Seed 确定性复现</title><desc id="llm-sampling-temperature-topp-geometry-logits-desc">大模型采样几何语义：Temperature 退火拉平、Top-P 累积截断与 Seed 确定性复现</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">LLM 采样几何物理模型：Temperature 缩放与 Top-P 核采样截断</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Logits / T ──► Softmax 概率分布 ──► Top-P (按累积概率截断长尾) ──► 伪随机采样与 GPU 非确定性浮点累加</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Temperature 能量退火</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">P(x_i) = exp(z_i / T) / ∑ exp(z_j / T)</text>

          <text x="10" y="44" fill="#f5f5f5">1. T ──► 0 (极寒 Greed):</text>
          <text x="16" y="58" fill="#f5f5f5">   最大 Logit 概率趋近 100%，绝对确定</text>

          <text x="10" y="80" fill="#f5f5f5">2. T = 1.0 (标准分布): 保留原始 logits 梯度</text>

          <text x="10" y="104" fill="#f5f5f5">3. T &gt;&gt; 1 (高温退火):</text>
          <text x="16" y="118" fill="#f5f5f5">   概率趋向均匀分布，胡言乱语发散！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">选型铁律：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 代码生成、数学推理、提取 JSON: 坚决设为 T = 0；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 文案创作、发散头脑风暴: T = 0.7 ~ 0.9；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 严禁生产环境随意配置大于 1.0！</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. Top-P (Nucleus) 核截断</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 动态累积概率截断</text>
          <text x="10" y="34" fill="#f5f5f5">1. 将候选词按概率由大到小排序</text>
          <text x="10" y="50" fill="#f5f5f5">2. 累加概率直到超过阈值 P (如 0.9)</text>
          <text x="10" y="68" fill="#f5f5f5">3. 彻底丢弃后 10% 的长尾低概率词！</text>
          <text x="10" y="88" fill="#f5f5f5">✓ 动态适应不同上下文预测的置信度：</text>
          <text x="16" y="102" fill="#cbd5e1">• 确定上下文仅保留 1~2 个候选词</text>
          <text x="16" y="116" fill="#cbd5e1">• 开放上下文保留更多可能分支</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制优势：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 远优于固定词数的 Top-K 静态截断；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 兼顾语言丰富性与合规安全性；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代大模型最通用的标配采样策略。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 浮点非确定性与复现真相</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 为什么设定了 seed 依然偶尔有偏差？</text>
          <text x="10" y="34" fill="#f5f5f5">1. GPU 并发规约 (Reduction) 执行顺序随机</text>
          <text x="10" y="50" fill="#f5f5f5">2. IEEE 754 浮点加法不满足结合律：</text>
          <text x="16" y="66" fill="#f5f5f5">(a + b) + c != a + (b + c)</text>
          <text x="10" y="86" fill="#f5f5f5">3. 微小的 1e-7 尾数差异导致 Softmax 翻转！</text>
          <text x="10" y="106" fill="#f5f5f5">✓ 严格复现需开启确定性计算 (Deterministic Kernel)！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">工程建议：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 评测基准必须锁定 seed 与模型 exact checkpoint；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 认知到 GPU 硬件并行带来的固有随机微抖动；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造科学、严谨的 LLM 实验标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
