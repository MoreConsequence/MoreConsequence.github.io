<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">SQLite 双写冲突 (SQLITE_BUSY) 与忙等待 (busy_timeout) 治理</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">默认 0ms 等待立即抛错 SQLITE_BUSY ｜ 配置 PRAGMA busy_timeout = 5000 ｜ 配合 BEGIN IMMEDIATE 彻底终结写锁升级死锁</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Default Failure -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 默认未调优：瞬间抛出 SQLITE_BUSY</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. Writer 1 执行 INSERT ──► 持有独占写锁</text>
          <text y="28" fill="#fca5a5">2. Writer 2 几乎同时发起 UPDATE</text>
          
          <text y="50" fill="#ef4444">💥 默认行为：</text>
          <text y="66" fill="#ef4444">• SQLite 发现写锁被占用，0 毫秒等待！</text>
          <text y="82" fill="#ef4444">• 立即向 Writer 2 抛出: "database is locked (5)"</text>
          <text y="98" fill="#ef4444">• 导致应用层出现大量不可控的突发报错！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 并发写入极易报错；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 应用层手写重试逻辑容易引发活锁雪崩；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须开启内核级 busy_timeout！</text>
      </g>
    </g>

    <!-- Right: Configured Timeout & Immediate -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ busy_timeout + BEGIN IMMEDIATE 黄金准则</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 步骤 1: 开启内核级自动重试 (等待最多 5000ms)</text>
          <text y="28" fill="#86efac">PRAGMA busy_timeout = 5000;</text>
          
          <text y="50" fill="#38bdf8">// 步骤 2: 写事务一开始就声明排他意向</text>
          <text y="64" fill="#34d399">BEGIN IMMEDIATE; // 杜绝读锁升级为写锁时的死锁！</text>
          
          <text y="86" fill="#4ade80">1. Writer 2 自动在内核以指数退避平滑排队</text>
          <text y="100" fill="#4ade80">2. Writer 1 提交后，Writer 2 瞬间自动解套执行！</text>
          <text y="114" fill="#4ade80">✓ 应用层 0 报错，写入成功率 100%！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 支撑单机 SQLite 承受数百并发写入；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底消灭 SQLITE_BUSY 偶发异常；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚不可摧的嵌入式存储服务！</text>
      </g>
    </g>
  </g>
</svg>