<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="transactional-outbox-cdc-binlog-dual-write-title transactional-outbox-cdc-binlog-dual-write-desc"><title id="transactional-outbox-cdc-binlog-dual-write-title">双写一致性取舍：本地事务 Outbox 表模式 vs Debezium Binlog CDC 管道架构</title><desc id="transactional-outbox-cdc-binlog-dual-write-desc">双写一致性取舍：本地事务 Outbox 表模式 vs Debezium Binlog CDC 管道架构</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">数据库与消息队列双写原子性：Transactional Outbox vs Binlog CDC</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">直接业务双写 (DB 成功但 MQ 发送失败导致状态永久撕裂) ｜ 本地事务 Outbox 表 + Debezium CDC 零丢失投递</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 朴素业务双写：物理上必有一扇不一致窗</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 典型反模式</text>
          <text y="28" fill="#f5f5f5">1. db.SaveOrder(order) ──► 本地事务提交成功</text>
          <text y="44" fill="#f5f5f5">2. kafka.Send(orderMsg) ──► 网络断开或进程 OOM 崩溃！</text>

          <text y="68" fill="#f5f5f5">🔴 灾难性状态撕裂：</text>
          <text y="84" fill="#fb7185">• 数据库里订单已扣款，下游库存/积分系统却永远收不到消息！</text>
          <text y="100" fill="#f5f5f5">• 若颠倒顺序先发 MQ 再写 DB，DB 报错时同样引发虚假消费！</text>
          <text y="118" fill="#f5f5f5">► 无法在没有分布式事务的前提下保证跨组件原子性！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">根本矛盾：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 单机数据库事务无法跨越网络覆盖到消息队列；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 网络抖动是分布式系统的常态；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 业务直写双写模式严禁在生产使用！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ Transactional Outbox + CDC 模式</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 1. 在同一个本地事务内同时写入业务表与 Outbox 表</text>
          <text y="28" fill="#f5f5f5">BEGIN;</text>
          <text y="42" fill="#f5f5f5">INSERT INTO orders ...;</text>
          <text y="56" fill="#f5f5f5">INSERT INTO outbox_table (msg_id, payload, status) ...;</text>
          <text y="70" fill="#f5f5f5">COMMIT; // 本地 ACID 保证 100% 绝对原子性！</text>

          <text y="92" fill="#f5f5f5">// 2. Debezium / Flink CDC 实时监听 MySQL Binlog</text>
          <text y="106" fill="#f5f5f5">捕获 Outbox 变更 ──► 投递至 Kafka ──► 消费端幂等消费！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 彻底解耦业务逻辑与消息队列可用性；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 毫秒级异步投递，吞吐量极高；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 现代微服务领域事件 (Domain Events) 发布的绝对权威标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
