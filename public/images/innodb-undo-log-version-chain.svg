<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">InnoDB MVCC 行级版本链拓扑 (Undo Log Version Chain)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">聚簇索引最新物理行 (DB_TRX_ID: 120, DB_ROLL_PTR) ──► 指向 Undo Log 历史镜像 (Trx 110) ──► 递归串联成单向链表</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 聚簇索引最新记录 (Clustered Index: Current Row)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">id: 1 | name: 'David' | DB_TRX_ID: 120 (最近修改它的事务) | DB_ROLL_PTR: 指向 Undo Page #402</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">表中只存最新的数据副本，历史版本全在 Undo Log 内存/磁盘中！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. Undo Log 一级历史版本 (Undo Record V2: Trx 110)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">name: 'Charlie' | DB_TRX_ID: 110 | DB_ROLL_PTR: 指向 Undo Page #318</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">当 Trx 120 未提交或对当前读不可见时，沿回滚指针向前回溯！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. Undo Log 二级历史版本 (Undo Record V1: Trx 100)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">name: 'Bob' | DB_TRX_ID: 100 | DB_ROLL_PTR: 指向 Undo Page #105 (最初 INSERT 版本)</text>
        <text x="15" y="62" font-size="8" fill="#047857">多版本并发控制的核心精髓：写不阻塞读，读不阻塞写！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. ReadView 可见性过滤裁决 (ReadView Visibility Evaluation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">比对 m_ids 活跃事务数组 ──► 瞬间截取属于当前事务可见的合法快照 ──► 0 锁并发极速返回！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代关系型数据库事务隔离机制的基石！</text>
      </g>
    </g>
  </g>
</svg>