<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">TCP 重传超时 (RTO) 精算模型与 Karn 算法消除模糊性</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">SRTT 平滑均值 + 4 × RTTVAR 方差加权 ｜ 重传样本不采样 RTT 避免正负反馈失控 ｜ 指数避退 (Exponential Backoff)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left: Jacobson Algorithm (420px) -->
    <g transform="translate(20, 20)">
      <rect width="420" height="345" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="420" height="30" rx="6" fill="#dbeafe"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">1. RFC 6298: Jacobson/Karels 计算公式</text>

      <g transform="translate(15, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="390" height="110" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// 每次收到 ACK 测量新样本 R'</text>
          <text y="32" fill="#93c5fd">1. Err = R' - SRTT</text>
          <text y="48" fill="#93c5fd">2. SRTT = SRTT + 0.125 × Err</text>
          <text y="64" fill="#93c5fd">3. RTTVAR = RTTVAR + 0.25 × (|Err| - RTTVAR)</text>
          <text y="84" fill="#34d399">4. RTO = SRTT + max(G, 4 × RTTVAR)</text>
        </g>

        <rect y="125" width="390" height="85" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#1e40af">为什么乘 4 倍方差？</text>
        <text x="10" y="34" font-size="7.5" fill="#2563eb">• 根据切比雪夫不等式，4 倍方差覆盖 93.75% 抖动</text>
        <text x="10" y="48" font-size="7.5" fill="#2563eb">• 既能快速适应网络轻微抖动，又避免过早触发伪重传</text>
        <text x="10" y="64" font-size="7.5" font-weight="700" fill="#1d4ed8">• Linux 内核默认下限 min_RTO = 200ms</text>
      </g>
    </g>

    <!-- Right: Karn Algorithm & Exponential Backoff (420px) -->
    <g transform="translate(460, 20)">
      <rect width="420" height="345" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
      <rect width="420" height="30" rx="6" fill="#fecaca"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">2. Karn 算法与重传指数退避</text>

      <g transform="translate(15, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="390" height="110" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">Karn 消除二义性铁律：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">🔴 致命问题：发送了重传包后收到 ACK，到底是对第一次还是第二次的确认？</text>
        <text x="10" y="50" font-size="7.5" fill="#7f1d1d">► 若把旧确认算作新包，RTT 会被严重低估引发重传风暴！</text>
        <text x="10" y="66" font-size="7.5" font-weight="700" fill="#dc2626">► 解法：凡是发生过重传的报文，一律禁止用来更新 SRTT/RTTVAR！</text>
        <text x="10" y="82" font-size="7.5" fill="#7f1d1d">直到后续收到一个全新未重传包的 ACK 为止。</text>

        <rect y="125" width="390" height="85" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">// 指数退避 (Exponential Backoff)</text>
          <text y="30" fill="#fed7aa">发生超时重传时：RTO = RTO × 2 (200ms → 400ms → 800ms...)</text>
          <text y="48" fill="#fb7185">防止网络严重堵塞时重传包雪上加霜，给予路由器队列排空时间</text>
          <text y="64" fill="#34d399">配合 TCP Timestamps 选项 (TSval/TSecr) 完美破除二义性！</text>
        </g>
      </g>
    </g>
  </g>
</svg>