<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go GMP 调度器工作窃取与优先级检索流水线 (Work Stealing Pipeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 本地 runnext &amp; runq (256 环形无锁) ──► 2. 每 61 次查全局 sched.runq 防饥饿 ──► 3. 查 netpoll 网络就绪 ──► 4. 随机窃取其他 P 一半任务</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 本地私有运行队列 (Local runnext &amp; runq: 256 Capacity)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">优先获取 runnext 插队协程 ──► 未命中则从 256 容量的无锁环形队列 head 弹出 G</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">90% 以上任务获取 0 锁并发开销，纳秒级极速流转！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 调度计数器防饥饿检查 (Every 61 Ticks: Global Runq Check)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">每执行 61 次调度 ──► 强制加锁检查全局 sched.runq 队列 ──► 提取 1 个 G 执行</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">彻底杜绝全局队列中的协程被本地循环任务永久饿死！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 网络轮询器事件捕获 (runtime.netpoll Check)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">本地队列为空 ──► 检查 netpoll 是否有因网络 I/O 就绪的协程 ──► 提取并注入可运行状态</text>
        <text x="15" y="62" font-size="8" fill="#047857">无缝桥接网络异步事件与计算协程！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 跨 P 随机工作窃取 (Work Stealing: Steal Half from Random P)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">随机选取另一个 P ──► 通过 CAS 原子操作从其本地队列尾部窃取一半 (1/2) 的待运行 G ──► 全负载均衡！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Go 语言在多核 CPU 算力压榨上的终极武器！</text>
      </g>
    </g>
  </g>
</svg>