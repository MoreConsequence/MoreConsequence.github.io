<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Oract 分布式租约 (Lease) 与栅栓令牌 (Fencing Token) 防脑裂模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 节点抢占 10s 租约 ──► 2. 获取单调自增 Fencing Token (token=42) ──► 3. GC 假死导致租约过期被节点 B 抢占 (token=43) ──► 4. 存储层拒绝老 Token 写入</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 分布式租约持有 (Distributed Lease Acquisition)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Agent Worker A 在 etcd 成功注册带有 TTL=10s 的分布式锁 ──► 获得任务独占执行权并周期性续租 (Heartbeat)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">确保同一时刻仅有单主执行！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 栅栓令牌单调递增签发 (Monotonic Fencing Token Generation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">中心协调器为 Worker A 签发 fencing_token = 42 ──► 之后的所有文件系统与数据库写请求必须附带该令牌</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将时间依赖转化为因果顺序依赖！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fef2f2" stroke="#f87171"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 节点假死与新主选举 (GC Pause &amp; Lease Stealing by Worker B)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#ef4444">Worker A 发生 15s Full GC 假死 ──► 租约超时 ──► Worker B 接管并获得递增的 fencing_token = 43</text>
        <text x="15" y="62" font-size="8" fill="#dc2626">经典分布式脑裂与双主并发危机！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 存储层原子拒收过时写 (Storage Fencing Validation &amp; Rejection)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Worker A 苏醒试图写入旧数据 (token=42) ──► 存储层判定 42 &lt; 43 强行抛出 StaleTokenError 拒收！</text>
        <text x="15" y="62" font-size="8" fill="#047857">彻底封死幽灵写入与脏数据覆盖！</text>
      </g>
    </g>
  </g>
</svg>