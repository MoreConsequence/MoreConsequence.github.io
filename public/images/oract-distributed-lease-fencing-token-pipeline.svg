  <title id="fp-title">Fencing 纪元栅栏脑裂防御与 OEP 跨语言管道</title>
  <desc id="fp-desc">流程架构图展示 ORACT 解决分布式脑裂与幽灵写入的 Fencing Token 纪元门禁防御模型，以及 Go 控制面与 Python 异构 Worker 间的 OEP 跨语言双向 mTLS 协议架构。</desc>
  <defs>
    <marker id="fp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="fp-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
