<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">并发世界两种等待：Go GMP 多线程抢占 vs Node.js 单线程事件循环</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Go (同步阻塞写法 + 运行时多核 M 协程调度) vs Node.js (单线程主循环 + libuv 线程池 + 微任务/宏任务回调队列)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Go GMP -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Go: GMP 多核物理并行模型</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">• 真正的多核多线程并行计算 (Parallelism)</text>
          <text y="30" fill="#93c5fd">• 同步顺序心智：data := db.Query()</text>
          <text y="46" fill="#34d399">• 遇到 I/O 阻塞时，当前 G 自动让出 P 挂起</text>
          <text y="62" fill="#34d399">• 线程 M 立即调度其他 G，充分榨干多核 CPU</text>
          <text y="80" fill="#fbbf24">• 密集 CPU 计算会被 sysmon 信号强制抢占</text>
          
          <text y="104" fill="#38bdf8">✓ 优势：天然吃满 64 核 CPU，极强的高吞吐能力</text>
          <text y="120" fill="#f87171">⚠️ 挑战：必须严格处理并发锁、Race 争用与内存屏障</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">心智模型：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• "多个工人在多个工位上并行干活"；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 适合 CPU 密集、高并发分布式后端、网络代理；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 锁竞争是主要的性能调优瓶颈。</text>
      </g>
    </g>

    <!-- Right: Node Event Loop -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Node.js: 单主线程事件循环模型</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">• 单一主线程 (Single Main Thread) 执行 JS 代码</text>
          <text y="30" fill="#86efac">• 异步非阻塞心智：const data = await db.query()</text>
          <text y="46" fill="#34d399">• await 挂起当前协程并将回调推入微任务队列</text>
          <text y="62" fill="#34d399">• 主线程立刻去执行其他用户的请求事件！</text>
          <text y="80" fill="#ef4444">• 🔴 致命软肋：严禁在主线程执行密集计算 (for 循环)</text>
          <text y="96" fill="#fca5a5">  一个死循环会直接卡死全站所有用户的请求！</text>
          
          <text y="120" fill="#4ade80">✓ 优势：完全没有多线程 Data Race 竞争，无需加互斥锁！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">心智模型：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• "一个超级收银员 + 后厨 libuv 多线程异步出餐"；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 极度适合 I/O 密集型 API 网关、BFF 与 Agent 编排；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 善用 Cluster 多进程充分利用多核硬件。</text>
      </g>
    </g>
  </g>
</svg>