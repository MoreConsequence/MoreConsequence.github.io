<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 开发者踩坑之一：原型链隐式继承与 Object.create(null) 纯字典</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">普通对象自带 toString/hasOwnProperty 原型 ──► 恶意请求注入 __proto__ 造成污染 ──► 使用 Map / Object.create(null) 破局</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 裸对象作 Map：原型污染与键名冲突</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">const dict: Record&lt;string, any&gt; = {};</text>
          <text y="36" fill="#fca5a5">1. dict['toString'] 竟然不是 undefined！</text>
          <text y="50" fill="#ef4444">   它沿着原型链查到了 Object.prototype.toString！</text>
          <text y="74" fill="#ef4444">2. 原型污染 (Prototype Pollution):</text>
          <text y="90" fill="#ef4444">   攻击者传入 key = '__proto__.isAdmin'</text>
          <text y="106" fill="#ef4444">   导致全系统所有对象的 isAdmin 属性全部变为 true！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Go 开发者常犯错误：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 以为 JS 的 {} 等同于 Go 的 map[string]T；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 裸对象带有复杂的继承原型链与内部方法；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 极易引入严重越权安全漏洞！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正解：Map / Object.create(null)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 方案 A: 原生 Map (真正具备 Go 语义的哈希表)</text>
          <text y="28" fill="#86efac">const map = new Map&lt;string, User&gt;();</text>
          <text y="42" fill="#86efac">map.get('toString'); // 正确返回 undefined！</text>
          <text y="66" fill="#38bdf8">// 方案 B: 纯净无原型对象 (0 原型链)</text>
          <text y="80" fill="#34d399">const pureDict = Object.create(null);</text>
          <text y="94" fill="#34d399">pureDict.__proto__ 没有任何特殊魔法！</text>
          <text y="118" fill="#4ade80">✓ 100% 物理免疫任何原型链投毒与键名污染！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 纯粹的键值映射语义；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• Map 支持任意类型作为 Key（包括对象和函数）；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高安全标准的现代服务端工程！</text>
      </g>
    </g>
  </g>
</svg>