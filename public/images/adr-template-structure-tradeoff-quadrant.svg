<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="adr-template-structure-tradeoff-quadrant-title adr-template-structure-tradeoff-quadrant-desc"><title id="adr-template-structure-tradeoff-quadrant-title">ADR 标准模板五大核心结构：Title, Context, Decision, Consequences 与…</title><desc id="adr-template-structure-tradeoff-quadrant-desc">ADR 标准模板五大核心结构：Title, Context, Decision, Consequences 与 Status</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">ADR (架构决策记录) 标准模板与核心五要素拓扑</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 状态 (Status) ｜ 2. 业务与技术背景 (Context) ｜ 3. 裁决方案 (Decision) ｜ 4. 收益与代价 (Consequences) ｜ 5. 替代方案 (Alternatives)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Context (背景)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">问题约束阐述：</text>

          <text x="8" y="38" fill="#f5f5f5">• 为什么要做此决定？</text>
          <text x="8" y="54" fill="#cbd5e1">• 业务 QPS 增长至 50k</text>
          <text x="8" y="70" fill="#f5f5f5">• 现有 MySQL 出现瓶颈</text>
          <text x="8" y="86" fill="#f5f5f5">• 预算与团队能力限制</text>

          <text x="8" y="114" fill="#f5f5f5">✓ 锚定历史客观背景！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 拒绝马后炮与经验主义；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 还原当年的信息输入与约束；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 建立同理心。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. Decision (决策)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">明确行动纲领：</text>

          <text x="8" y="38" fill="#f5f5f5">• 选用 Redis Cluster</text>
          <text x="8" y="54" fill="#f5f5f5">• 引入一致性哈希分片</text>
          <text x="8" y="70" fill="#f5f5f5">• 使用 Canal CDC 异步双写</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 笃定清晰的技术路线！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 语言干脆果断，避免模糊词汇；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 统一团队全员认知；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 落地执行标准。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. Pros &amp; Cons (权衡)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">正面收益与代价：</text>

          <text x="8" y="38" fill="#f5f5f5">• (+) 读 QPS 提升 10 倍</text>
          <text x="8" y="54" fill="#f5f5f5">• (+) 数据库 CPU 降至 20%</text>
          <text x="8" y="70" fill="#f5f5f5">• (-) 存在 100ms 最终一致延迟</text>
          <text x="8" y="86" fill="#f5f5f5">• (-) 增加 Redis 运维监控成本</text>

          <text x="8" y="114" fill="#f5f5f5">✓ 正视代价方得长治久安！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 没有完美的方案，只有合适的权衡；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 提前准备应对负面代价的预案；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 资深工程师核心素养。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">4. Alternatives (未选方案)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">否决方案与理由：</text>

          <text x="8" y="38" fill="#f5f5f5">• 方案 1: 全表加内存缓存</text>
          <text x="8" y="54" fill="#f5f5f5">  - 理由: 内存开销超预算 5 倍</text>
          <text x="8" y="70" fill="#f5f5f5">• 方案 2: 直接上分库分表</text>
          <text x="8" y="86" fill="#f5f5f5">  - 理由: 跨库事务研发周期过长</text>

          <text x="8" y="114" fill="#f5f5f5">✓ 避免未来团队反复无意义争论！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">沉淀效益：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 记录“为什么当年没选方案 X”；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 杜绝后人推倒重来踩同样的坑；</text>
        <text x="10" y="224" font-size="7.5" fill="#2d3142">• 顶级团队技术沉淀！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
