<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ADR (架构决策记录) 标准模板与核心五要素拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 状态 (Status) ｜ 2. 业务与技术背景 (Context) ｜ 3. 裁决方案 (Decision) ｜ 4. 收益与代价 (Consequences) ｜ 5. 替代方案 (Alternatives)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Context (背景)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">问题约束阐述：</text>
          
          <text x="8" y="38" fill="#86efac">• 为什么要做此决定？</text>
          <text x="8" y="54" fill="#cbd5e1">• 业务 QPS 增长至 50k</text>
          <text x="8" y="70" fill="#34d399">• 现有 MySQL 出现瓶颈</text>
          <text x="8" y="86" fill="#34d399">• 预算与团队能力限制</text>
          
          <text x="8" y="114" fill="#4ade80">✓ 锚定历史客观背景！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 拒绝马后炮与经验主义；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 还原当年的信息输入与约束；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 建立同理心。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Decision (决策)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">明确行动纲领：</text>
          
          <text x="8" y="38" fill="#86efac">• 选用 Redis Cluster</text>
          <text x="8" y="54" fill="#38bdf8">• 引入一致性哈希分片</text>
          <text x="8" y="70" fill="#34d399">• 使用 Canal CDC 异步双写</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 笃定清晰的技术路线！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 语言干脆果断，避免模糊词汇；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 统一团队全员认知；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 落地执行标准。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Pros &amp; Cons (权衡)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">正面收益与代价：</text>
          
          <text x="8" y="38" fill="#fed7aa">• (+) 读 QPS 提升 10 倍</text>
          <text x="8" y="54" fill="#38bdf8">• (+) 数据库 CPU 降至 20%</text>
          <text x="8" y="70" fill="#f87171">• (-) 存在 100ms 最终一致延迟</text>
          <text x="8" y="86" fill="#f87171">• (-) 增加 Redis 运维监控成本</text>
          
          <text x="8" y="114" fill="#4ade80">✓ 正视代价方得长治久安！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 没有完美的方案，只有合适的权衡；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 提前准备应对负面代价的预案；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 资深工程师核心素养。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. Alternatives (未选方案)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">否决方案与理由：</text>
          
          <text x="8" y="38" fill="#e9d5ff">• 方案 1: 全表加内存缓存</text>
          <text x="8" y="54" fill="#f87171">  - 理由: 内存开销超预算 5 倍</text>
          <text x="8" y="70" fill="#e9d5ff">• 方案 2: 直接上分库分表</text>
          <text x="8" y="86" fill="#f87171">  - 理由: 跨库事务研发周期过长</text>
          
          <text x="8" y="114" fill="#4ade80">✓ 避免未来团队反复无意义争论！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">沉淀效益：</text>
        <text x="10" y="34" font-size="7.5" fill="#6b21a8">• 记录“为什么当年没选方案 X”；</text>
        <text x="10" y="48" font-size="7.5" fill="#6b21a8">• 杜绝后人推倒重来踩同样的坑；</text>
        <text x="10" y="62" font-size="7.5" fill="#6b21a8">• 顶级团队技术沉淀！</text>
      </g>
    </g>
  </g>
</svg>