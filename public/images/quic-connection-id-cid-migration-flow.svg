<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">QUIC / HTTP/3 连接迁移 (Connection Migration) 物理机理</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">TCP (绑定 IP+Port 四元组，切 Wi-Fi 必断线重连) vs QUIC (基于 64 位 Connection ID，四元组改变 0ms 无缝秒级续传)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: TCP Breakdown -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ TCP 强绑定四元组：切换 Wi-Fi 全局重断</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">1. 手机在 Wi-Fi 下建立 TCP 连接: (192.168.1.100:54321 ⇄ Server)</text>
          <text y="28" fill="#f87171">2. 用户走出家门，手机网络瞬间切换为 5G (IP 变为: 114.248.10.5)</text>
          
          <text y="50" fill="#ef4444">💥 灾难性后果：</text>
          <text y="66" fill="#ef4444">• TCP 内核根据四元组寻找套接字，找不到对应 session</text>
          <text y="82" fill="#ef4444">• 必须强制断开现有连接，重新进行三次握手 + TLS 1.3 握手！</text>
          <text y="98" fill="#f87171">• 视频直播/游戏卡顿 3~5 秒甚至直接报错中断！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">移动端痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 地铁、电梯与信号切换时体验极差；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 频繁握手造成巨量首包时延；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 倒逼传输层协议革命！</text>
      </g>
    </g>

    <!-- Right: QUIC Migration -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ QUIC Connection ID：0ms 物理无缝漂移</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">QUIC 采用应用层 Connection ID (CID: 0x9f8a7b6c)</text>
          
          <text y="36" fill="#86efac">网络发生切换 (Wi-Fi ──► 5G):</text>
          <text y="50" fill="#38bdf8">1. 手机直接从新 5G IP 发送带有相同 CID 的 UDP 包</text>
          <text y="64" fill="#34d399">2. 服务端通过 PATH_CHALLENGE 极速验证对端合法性</text>
          <text y="78" fill="#34d399">3. 自动将现有流状态绑定至新 IP，0 毫秒重建连接！</text>
          
          <text y="104" fill="#4ade80">✓ 正在播放的 4K 视频丝毫不受影响，0 帧卡顿！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底颠覆移动互联网传输体验；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支持 0-RTT 极速恢复与拥塞状态延续；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• HTTP/3 核心竞争力！</text>
      </g>
    </g>
  </g>
</svg>