<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">静态博客严格内容工程管线 (Content Engineering Pipeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Markdown Source ──► gray-matter 解析 ──► Zod Schema 运行时强校验 ──► Draft 隔离闸门 ──► Vitest 45 项全自动 CI 回归</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Markdown 源码与 Frontmatter 提取 (Source Extraction)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">递归遍历 content/posts/**/*.md ──► 提取 YAML 元数据 (title, publishedAt, tags, draft)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">建立纯净的一手内容数据流！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. Zod 强类型元数据运行时校验 (Zod Schema Validation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">PostFrontmatterSchema.parse(data) ──► 严查日期格式 YYYY-MM-DD、标签非空数组、slug 规范</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">只要有 1 篇元数据缺漏，构建立即红标阻断，绝不带病上线！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 生产发布草稿隔离闸门 (Draft Isolation Gate)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">NODE_ENV === 'production' 模式下 ──► 自动过滤 draft: true 文章 ──► 仅编译正式就绪作品</text>
        <text x="15" y="62" font-size="8" fill="#047857">开发环境所见即所得，生产环境绝对安全纯洁！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. Vitest 单元测试与构建断言 (Continuous Testing: 45 Tests Passing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">运行 content.test.ts ──► 校验所有文章 slug 唯一性、系列路由连续性与 SVG 矢量图完整引用！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">软件工程级严密保障的高质量技术博客平台！</text>
      </g>
    </g>
  </g>
</svg>