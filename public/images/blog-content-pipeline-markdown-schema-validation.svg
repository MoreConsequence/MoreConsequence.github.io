<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="blog-content-pipeline-markdown-schema-validation-title blog-content-pipeline-markdown-schema-validation-desc"><title id="blog-content-pipeline-markdown-schema-validation-title">博客内容工程管线：Zod 强类型 Frontmatter 校验与 Draft 生产隔离</title><desc id="blog-content-pipeline-markdown-schema-validation-desc">博客内容工程管线：Zod 强类型 Frontmatter 校验与 Draft 生产隔离</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">静态博客严格内容工程管线 (Content Engineering Pipeline)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Markdown Source ──► gray-matter 解析 ──► Zod Schema 运行时强校验 ──► Draft 隔离闸门 ──► Vitest 45 项全自动 CI 回归</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. Markdown 源码与 Frontmatter 提取 (Source Extraction)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">递归遍历 content/posts/**/*.md ──► 提取 YAML 元数据 (title, publishedAt, tags, draft)</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">建立纯净的一手内容数据流！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. Zod 强类型元数据运行时校验 (Zod Schema Validation)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">PostFrontmatterSchema.parse(data) ──► 严查日期格式 YYYY-MM-DD、标签非空数组、slug 规范</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">只要有 1 篇元数据缺漏，构建立即红标阻断，绝不带病上线！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 生产发布草稿隔离闸门 (Draft Isolation Gate)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">NODE_ENV === 'production' 模式下 ──► 自动过滤 draft: true 文章 ──► 仅编译正式就绪作品</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">开发环境所见即所得，生产环境绝对安全纯洁！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. Vitest 单元测试与构建断言 (Continuous Testing: 45 Tests Passing)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">运行 content.test.ts ──► 校验所有文章 slug 唯一性、系列路由连续性与 SVG 矢量图完整引用！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">软件工程级严密保障的高质量技术博客平台！</text>
      </g>
    </g>
  </g>
