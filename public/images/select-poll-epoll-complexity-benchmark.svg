<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">I/O 多路复用机制全景对比：select vs poll vs epoll</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">从底层数据结构、最大并发限制、内存拷贝机制到内核时间复杂度全维度量化</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. select (POSIX 标准)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">• 数据结构: 1024 位图 (fd_set)</text>
          <text x="10" y="34" fill="#fca5a5">• 最大连接数: 硬限制 1024 个！</text>
          <text x="10" y="54" fill="#ef4444">• 内存拷贝: 每次调用全量双向拷贝</text>
          <text x="10" y="74" fill="#ef4444">• 时间复杂度: O(N) 全局线性遍历</text>
          <text x="10" y="94" fill="#f87171">• 触发模式: 仅支持水平触发 (LT)</text>
          
          <text x="10" y="118" fill="#ef4444">🔴 性能随连接数暴跌！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 跨平台兼容性（如 Windows/嵌入式）；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 连接数极少（&lt; 10 个）的简单脚本；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 历史遗留协议。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. poll (数组优化)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">• 数据结构: pollfd 动态结构体数组</text>
          <text x="10" y="34" fill="#86efac">• 最大连接数: 无上限 (受内存限制)</text>
          <text x="10" y="54" fill="#f87171">• 内存拷贝: 每次调用仍需全量拷贝</text>
          <text x="10" y="74" fill="#f87171">• 时间复杂度: O(N) 线性遍历数组</text>
          <text x="10" y="94" fill="#fed7aa">• 触发模式: 仅支持水平触发 (LT)</text>
          
          <text x="10" y="118" fill="#fb923c">⚠️ 解决了连接上限，未解决 O(N) 瓶颈！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 连接数适中（数百到数千）；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 突破 1024 限制的简单场景；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 过渡期架构。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. epoll (Linux 性能之王)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">• 数据结构: 红黑树 + 双向就绪链表</text>
          <text x="10" y="34" fill="#86efac">• 最大连接数: 100 万+ (单机内存极限)</text>
          <text x="10" y="54" fill="#34d399">• 内存拷贝: 0 重复拷贝，仅返回活跃项</text>
          <text x="10" y="74" fill="#4ade80">• 时间复杂度: O(1) 中断回调就绪</text>
          <text x="10" y="94" fill="#34d399">• 触发模式: 完美支持 LT 与 ET 模式！</text>
          
          <text x="10" y="118" fill="#4ade80">✓ 性能保持一条平直水平线！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 工业级高并发网关、Web 服务器；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑现代互联网百万连接基建；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Linux 平台无冕之王！</text>
      </g>
    </g>
  </g>
</svg>