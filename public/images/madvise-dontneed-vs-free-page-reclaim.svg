<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="madvise-dontneed-vs-free-page-reclaim-title madvise-dontneed-vs-free-page-reclaim-desc"><title id="madvise-dontneed-vs-free-page-reclaim-title">Linux 内存释放系统调用：madvise(MADV_DONTNEED) 瞬间降 RSS vs MADV_FREE…</title><desc id="madvise-dontneed-vs-free-page-reclaim-desc">Linux 内存释放系统调用：madvise(MADV_DONTNEED) 瞬间降 RSS vs MADV_FREE 延迟懒回收</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2d3142" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f5f5f5"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Linux 页面归还系统调用：MADV_DONTNEED vs MADV_FREE</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">MADV_FREE (标记懒释放，系统不缺内存时不扣减 RSS，易引发 K8s 误杀) vs MADV_DONTNEED (强制立即解除页表映射，RSS 瞬间暴降归还)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: MADV_FREE -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ MADV_FREE (延迟懒惰释放)：RSS 虚高陷阱</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f87171">Go 1.12~1.15 默认行为：madvise(addr, size, MADV_FREE)</text>

          <text y="38" fill="#ef4444">致命虚假繁荣：</text>
          <text y="52" fill="#fca5a5">• 内核仅标记“可释放”，页表依然保留映射！</text>
          <text y="68" fill="#ef4444">• 外部监控与 K8s cgroup 观察到 RSS 持续居高不下</text>
          <text y="84" fill="#ef4444">• 容器被 K8s 判定超标并残酷 OOM-Killed 强杀！</text>

          <text y="106" fill="#f87171">🔴 导致无数 Go 线上微服务莫名其妙被误杀！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">历史教训：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 云原生与容器环境下内存指标严重失真；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 倒逼 Go 1.16 将默认系统调用彻底改回 DONTNEED；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 经典 Linux 虚拟内存演进史！</text>
      </g>
    </g>

    <!-- Right: MADV_DONTNEED -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ MADV_DONTNEED (强制立即归还)：RSS 精准回落</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#4ade80">Go 1.16+ 默认标准：madvise(addr, size, MADV_DONTNEED)</text>

          <text y="38" fill="#86efac">物理精准释放：</text>
          <text y="52" fill="#38bdf8">1. 内核立即擦除 PTE 页表条目映射</text>
          <text y="66" fill="#34d399">2. 物理 RAM 内存瞬间归还操作系统自由池</text>
          <text y="80" fill="#34d399">3. RSS 监控曲线实时平滑回落至 10MB 基线！</text>

          <text y="106" fill="#4ade80">✓ K8s 容器观测指标 100% 真实透明！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底消除云原生容器下的幽灵 OOM 误杀；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 让监控告警与实际资源消耗精准对齐；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代语言运行时内存回收的完美解答！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
