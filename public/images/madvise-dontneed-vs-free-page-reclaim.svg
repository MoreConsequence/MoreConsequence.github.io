<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="madvise-dontneed-vs-free-page-reclaim-title madvise-dontneed-vs-free-page-reclaim-desc"><title id="madvise-dontneed-vs-free-page-reclaim-title">Linux 内存释放系统调用：madvise(MADV_DONTNEED) 瞬间降 RSS vs MADV_FREE…</title><desc id="madvise-dontneed-vs-free-page-reclaim-desc">Linux 内存释放系统调用：madvise(MADV_DONTNEED) 瞬间降 RSS vs MADV_FREE 延迟懒回收</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Linux 页面归还系统调用：MADV_DONTNEED vs MADV_FREE</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">MADV_FREE (标记懒释放，系统不缺内存时不扣减 RSS，易引发 K8s 误杀) vs MADV_DONTNEED (强制立即解除页表映射，RSS 瞬间暴降归还)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ MADV_FREE (延迟懒惰释放)：RSS 虚高陷阱</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">Go 1.12~1.15 默认行为：madvise(addr, size, MADV_FREE)</text>

          <text y="38" fill="#f5f5f5">致命虚假繁荣：</text>
          <text y="52" fill="#f5f5f5">• 内核仅标记“可释放”，页表依然保留映射！</text>
          <text y="68" fill="#f5f5f5">• 外部监控与 K8s cgroup 观察到 RSS 持续居高不下</text>
          <text y="84" fill="#f5f5f5">• 容器被 K8s 判定超标并残酷 OOM-Killed 强杀！</text>

          <text y="106" fill="#f5f5f5">🔴 导致无数 Go 线上微服务莫名其妙被误杀！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">历史教训：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 云原生与容器环境下内存指标严重失真；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 倒逼 Go 1.16 将默认系统调用彻底改回 DONTNEED；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 经典 Linux 虚拟内存演进史！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ MADV_DONTNEED (强制立即归还)：RSS 精准回落</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">Go 1.16+ 默认标准：madvise(addr, size, MADV_DONTNEED)</text>

          <text y="38" fill="#f5f5f5">物理精准释放：</text>
          <text y="52" fill="#f5f5f5">1. 内核立即擦除 PTE 页表条目映射</text>
          <text y="66" fill="#f5f5f5">2. 物理 RAM 内存瞬间归还操作系统自由池</text>
          <text y="80" fill="#f5f5f5">3. RSS 监控曲线实时平滑回落至 10MB 基线！</text>

          <text y="106" fill="#f5f5f5">✓ K8s 容器观测指标 100% 真实透明！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 彻底消除云原生容器下的幽灵 OOM 误杀；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 让监控告警与实际资源消耗精准对齐；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代语言运行时内存回收的完美解答！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
