<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">大模型服务商多源流式事件归一化管道 (Stream Event Normalization)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Anthropic content_block_delta ｜ OpenAI delta.tool_calls ｜ DeepSeek thinking ──► 适配器统一抹平 ──► 标准 AgentStreamChunk</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 多厂商异构 SSE 原始字节流 (Raw SSE Byte Stream)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Claude (content_block_start) ｜ OpenAI (choices[0].delta) ｜ 本地 Ollama (message.content) 各自格式截然不同</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">异构数据流接入第一现场！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 协议适配器差异消除 (Provider Adapter Normalization)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">提取增量文本 text_delta、推理思考过程 thinking_delta、工具调用参数片段 tool_call_chunk</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将混乱的厂商私有协议在最外层彻底消化！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 标准化事件领域对象 (Unified AgentStreamChunk Enum)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">组装统一强类型结构: ChunkText(str) | ChunkToolCall(id, name, json_chunk) | ChunkUsage(in, out, cached)</text>
        <text x="15" y="62" font-size="8" fill="#047857">核心引擎代码享受 100% 纯粹强类型保障！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 终端 TUI 实时渲染与工具流式聚合 (Streaming Consumer)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">终端 0 延迟逐字打字机渲染，同时在后台无缝拼装完整 JSON 参数 ──► 结束瞬间无缝触发工具执行！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代多模型架构集成核心枢纽！</text>
      </g>
    </g>
  </g>
</svg>