<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">KV Cache 显存碎片模型：静态连续分配 vs PagedAttention 虚拟分页</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">传统方案浪费 60%~80% 显存于内部与外部碎片 ｜ PagedAttention 实现 96% 极限有效显存利用率</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Fragmentation -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统静态分配：内部碎片与过早预留</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. 内部碎片 (Internal Fragmentation):</text>
          <text y="28" fill="#fca5a5">   为请求预先分配 max_len=2048 空间，实际只生成 50 Token</text>
          <text y="44" fill="#ef4444">   ► 97.5% 的分配显存处于死锁闲置状态！</text>
          
          <text y="68" fill="#f87171">2. 外部碎片 (External Fragmentation):</text>
          <text y="82" fill="#fca5a5">   不同生命周期的请求在连续显存中频繁申请与释放</text>
          <text y="98" fill="#ef4444">   ► 形成大量无法容纳大请求的离散夹缝死空间！</text>
          
          <text y="122" fill="#ef4444">🔴 最终有效显存利用率仅 20%~35%！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">恶果：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 80GB A100 只能可怜地并发跑 8 个请求；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 大量请求被排队阻塞在调度器外部；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 算力成本极其高昂！</text>
      </g>
    </g>

    <!-- Right: Paged Solution -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ PagedAttention：零外部碎片与按需追加</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">1. 固定块划分 (Block Size = 16):</text>
          <text y="28" fill="#86efac">   仅在当前块填满时才申请下一个 16-Token 物理页</text>
          <text y="44" fill="#38bdf8">   ► 内部碎片被物理限制在最后一个块（最多 15 Token）！</text>
          
          <text y="68" fill="#34d399">2. 零外部碎片 (Zero External Fragmentation):</text>
          <text y="82" fill="#86efac">   所有物理页大小完全一致，任意空闲页均可立即复用！</text>
          
          <text y="106" fill="#4ade80">✓ 真实显存利用率提升至 96.3%！</text>
          <text y="122" fill="#4ade80">✓ 单卡并发量直接翻 4~5 倍！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底消灭显存碎片瓶颈；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑数千并发的长文本问答与 Agent 交互；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造最具商业竞争力的推理集群！</text>
      </g>
    </g>
  </g>
</svg>