<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 错误链 (Error Chain) 账本：构造税 (142ns) vs 遍历税 (4ns)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">fmt.Errorf 格式化与包装分配 ──► errors.Is / As 递归 Unwrap 链表 ──► 真正的性能税在构造而不是查询！</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Wrap Construction Tax -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 包装构造税：fmt.Errorf(%w) 昂贵 (142ns)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">return fmt.Errorf("read db failed: %w", err)</text>
          <text y="34" fill="#fca5a5">1. 解析格式化字符串 %w 语法树 (反射/解析开销)</text>
          <text y="50" fill="#fca5a5">2. 生成 wrapError 结构体对象 (heap alloc)</text>
          <text y="66" fill="#fca5a5">3. 拼接字符串 msg (string alloc)</text>
          <text y="86" fill="#ef4444">► 每次包装产生 2 次堆内存分配 (约 64B)！</text>
          <text y="104" fill="#fb7185">► 耗时高达 ~142ns！</text>
          <text y="124" fill="#f87171">在热点循环中频繁 wrap 会剧烈拉高 GC 压力！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">性能关键点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 不要把 fmt.Errorf 当作零成本宏；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 高频热路径优先定义静态哨兵错误 (Sentinel Error)；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 只有真正发生异常跨层上抛时才执行包装！</text>
      </g>
    </g>

    <!-- Right: Unwrap Lookup -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 查询遍历税：errors.Is / As 极轻量 (4ns)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">if errors.Is(err, sql.ErrNoRows) { ... }</text>
          <text y="34" fill="#86efac">1. 检查当前 err == target (指针/值比对)</text>
          <text y="50" fill="#86efac">2. 若不匹配，调用 err.Unwrap() 取出内层错误</text>
          <text y="66" fill="#86efac">3. 循环遍历单向链表 (无任何额外内存分配)</text>
          <text y="86" fill="#38bdf8">► 每穿透 1 层链表仅耗时约 4.2ns！</text>
          <text y="104" fill="#34d399">► 即使穿透 5 层也仅需 20ns，0 内存分配！</text>
          <text y="124" fill="#4ade80">✓ 放心使用 errors.Is 判定业务哨兵错误！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">现代最佳实践：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 废弃旧时代直接 err == ErrX，统一采用 errors.Is；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 自定义结构体实现 Unwrap() []error (Go 1.20+ 支持 join)；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 既保证丰富的上下文排查信息，又兼顾极速判断！</text>
      </g>
    </g>
  </g>
</svg>