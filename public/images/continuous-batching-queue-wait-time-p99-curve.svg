<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="continuous-batching-queue-wait-time-p99-curve-title continuous-batching-queue-wait-time-p99-curve-desc"><title id="continuous-batching-queue-wait-time-p99-curve-title">连续批处理 QPS 负载与 P99 排队延迟拐点相图</title><desc id="continuous-batching-queue-wait-time-p99-curve-desc">连续批处理 QPS 负载与 P99 排队延迟拐点相图</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Continuous Batching 排队延迟拐点：静态 Batching vs 动态调度</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">传统静态批处理在 QPS &gt; 15 时排队延迟发生指数级恶化暴增 ｜ 连续批处理在 QPS 达 60 时仍将 P99 压制在 300ms 以内</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 静态批处理 (Static Batching)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 必须等待整批完全结束</text>
          <text x="10" y="34" fill="#f5f5f5">• 短请求被迫陪跑长请求 (木桶短板)</text>
          <text x="10" y="50" fill="#f5f5f5">• 新请求必须等整批释放才能进场</text>

          <text x="10" y="74" fill="#f5f5f5">QPS 临界拐点 = 18 req/s:</text>
          <text x="10" y="90" fill="#f5f5f5">• P99 排队延迟从 200ms 飙升至 8000ms！</text>
          <text x="10" y="108" fill="#f5f5f5">🔴 发生级联超时雪崩！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产死穴：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• GPU 算力严重闲置浪费（大量 Padding）；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 首字时延 TTFT 极度不稳定；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 无法应对突发流量洪峰！</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. Continuous Batching (动态流水)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 迭代级别随来随走 (In-Flight)</text>
          <text x="10" y="34" fill="#f5f5f5">• 某请求结束立即插入新就绪请求</text>
          <text x="10" y="50" fill="#f5f5f5">• GPU 计算核心始终保持 100% 满载</text>

          <text x="10" y="74" fill="#f5f5f5">QPS 承载能力提升至 65 req/s:</text>
          <text x="10" y="90" fill="#f5f5f5">• P99 排队延迟平稳控制在 240ms！</text>
          <text x="10" y="108" fill="#f5f5f5">✓ 吞吐量提升 360%！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 细粒度 Iteration-Level 抢占与调度；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 彻底解耦不同请求的长度差异；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造超低抖动的服务体验。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 极限容量规划 (Capacity Planning)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// Little 定律容量黄金法则</text>
          <text x="10" y="34" fill="#f5f5f5">Max_Concur = VRAM_Avail / Avg_KV_Size</text>

          <text x="10" y="58" fill="#f5f5f5">1. 结合 SLO 目标 (P99 &lt; 500ms)</text>
          <text x="10" y="74" fill="#f5f5f5">2. 设定过载保护门限 (High Watermark)</text>
          <text x="10" y="92" fill="#f5f5f5">3. 超限自动触发网关层平滑排队/切流</text>

          <text x="10" y="112" fill="#f5f5f5">✓ 保持系统永远运行在最高效区！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 精准预估单机与集群算力采购规模；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 科学量化性能优化产生的商业价值；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 资深 AI 架构师的核心能力标尺！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
