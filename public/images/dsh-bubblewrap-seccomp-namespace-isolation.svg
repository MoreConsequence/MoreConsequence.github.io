<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH Linux Bubblewrap 内核命名空间与 Seccomp 物理沙箱拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Mount Namespace (挂载隔离) ｜ Network Namespace (网络封锁) ｜ PID Namespace (进程查杀) ｜ Seccomp BPF (拦截破坏性 Syscall)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Mount Namespace</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">文件系统视界隔离：</text>
          
          <text x="8" y="38" fill="#86efac">• --ro-bind /usr /usr (只读)</text>
          <text x="8" y="54" fill="#38bdf8">• --bind ./workspace (读写)</text>
          <text x="8" y="70" fill="#f87171">• --tmpfs /tmp (内存临时)</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 宿主系统 0 污染！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 无法访问 ~/.ssh 或 /etc；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 退出时自动清空 tmpfs；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 纯净环境。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Net Namespace</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">网络完全封锁：</text>
          
          <text x="8" y="38" fill="#86efac">• --unshare-net</text>
          <text x="8" y="54" fill="#38bdf8">• 仅保留 lo 回环网卡</text>
          <text x="8" y="70" fill="#4ade80">• 禁用外部公网出站流量</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 杜绝机密数据外泄！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底切断反弹 Shell 链路；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 阻止任何未知网络请求；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 物理防线。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. PID Namespace</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">进程树查杀与控制：</text>
          
          <text x="8" y="38" fill="#fed7aa">• --unshare-pid</text>
          <text x="8" y="54" fill="#38bdf8">• 沙箱内进程作为 PID 1</text>
          <text x="8" y="70" fill="#4ade80">• 退出时瞬间杀死所有子进程</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 0 僵尸孤儿进程！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 杜绝 fork 炸弹耗尽系统资源；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 保持宿主机器轻盈稳定；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 资源掌控力。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. Seccomp BPF</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">系统调用白名单：</text>
          
          <text x="8" y="38" fill="#e9d5ff">• 禁用 ptrace (反调试)</text>
          <text x="8" y="54" fill="#f87171">• 禁用 reboot, mount 等高危调用</text>
          <text x="8" y="70" fill="#4ade80">• 违规调用直接触发 SIGKILL</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 硬件级物理防护铁壁！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">安全底线：</text>
        <text x="10" y="34" font-size="7.5" fill="#6b21a8">• 阻断已知所有内核提权漏洞；</text>
        <text x="10" y="48" font-size="7.5" fill="#6b21a8">• 支撑多租户代码安全执行；</text>
        <text x="10" y="62" font-size="7.5" fill="#6b21a8">• 最高工业标准！</text>
      </g>
    </g>
  </g>
</svg>