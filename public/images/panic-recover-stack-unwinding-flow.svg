<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Panic 触发与栈展开 (Stack Unwinding) 核心流转</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">gopanic() ──► 逆向遍历 g._defer 链表执行清理 ──► 若遇到 recover() 则中止栈展开并恢复正常执行 ──► 未捕获则打印崩溃调用栈并 fatal 退出</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">1. 抛出恐慌 (panic(err) -&gt; gopanic)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">创建 struct _panic 结构体 ──► 挂载到当前 Goroutine 的 g._panic 链表头 ──► 立即中断正常指令流</text>
      <text x="15" y="62" font-size="8" fill="#7f1d1d">开启紧急状态下的栈反向回溯！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 逆序执行已注册的 Defer 函数 (Stack Unwinding)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">从 g._defer 链表头逐个弹出 defer 函数执行 ──► 释放文件句柄、释放互斥锁、写出审计日志</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">哪怕发生未捕获异常，也能 100% 保证资源优雅释放！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. Recover 捕获拦截 (gorecover: p.recovered = true)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">若 defer 内部调用 recover() ──► 标记 panic 已被恢复 ──► 立即终止后续栈展开销毁流程！</text>
        <text x="15" y="62" font-size="8" fill="#047857">将系统从崩溃边缘拉回，保住主进程不挂！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">4. 恢复正常控制流 (mcall(recovery))</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">通过 runtime.recovery 重新设置 SP 与 PC 寄存器 ──► 协程跳转到 defer 声明函数的返回指令处继续执行！</text>
        <text x="15" y="62" font-size="8" fill="#1d4ed8">工业级微服务框架 HTTP 中间件保命核心！</text>
      </g>
    </g>
  </g>
</svg>