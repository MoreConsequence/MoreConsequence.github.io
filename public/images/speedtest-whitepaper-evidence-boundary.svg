 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">SOURCE-SUPPORTED</text><rect x="376" y="556" width="12" height="12" rx="2" fill="#4f5d75" stroke="#4f5d75" stroke-width="0.8"/><text x="396" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">LOCAL EVIDENCE</text><rect x="600" y="556" width="12" height="12" rx="2" fill="#eb6c36" stroke="#eb6c36" stroke-width="0.8"/><text x="620" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">UNVERIFIED CLAIM</text>

