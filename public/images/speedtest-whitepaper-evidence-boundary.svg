<title id="speedtest-whitepaper-evidence-boundary-title">源码事实、运行观察和生产证明要分开</title>
<desc id="speedtest-whitepaper-evidence-boundary-desc">证据边界图把 speedtest-go 的源码事实、本机 Darwin/arm64 loopback 运行观察，以及尚未验证的公网容量、Linux、TLS 和高可用部署分开。</desc>
