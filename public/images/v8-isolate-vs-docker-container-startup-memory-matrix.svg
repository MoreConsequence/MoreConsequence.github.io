<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">边缘 Serverless 架构演进：传统 Docker 容器 vs V8 Isolate 微隔离沙箱</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Docker 容器 (启动 500ms, 内存 100MB, 边缘 PoP 节点最多跑 50 个) vs V8 Isolate (启动 5ms, 内存 3MB, 单机轻松并发 10,000 个)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Docker -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 Docker / 容器方案：在边缘彻底失效</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">• 启动耗时: 300ms ~ 1500ms (严重冷启动延误！)</text>
          <text y="30" fill="#fca5a5">• 基础内存: 80MB ~ 250MB (包含 guest OS 与 node 运行时)</text>
          <text y="48" fill="#ef4444">• 镜像分发: 需拉取 200MB 镜像至全球 300 个 PoP 节点</text>
          <text y="64" fill="#ef4444">• 单机密度: 16GB 内存节点最多容纳 60 个容器</text>
          
          <text y="88" fill="#ef4444">🔴 恶果：边缘节点资源迅速枯竭，根本无法支撑千人千面！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">架构死穴：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 冷启动时间甚至远超过跨洋请求本身的耗时；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 边缘分布式环境下的资源开销不可承受；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法满足现代边缘敏捷计算诉求！</text>
      </g>
    </g>

    <!-- Right: V8 Isolate -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ V8 Isolate / WebAssembly：极致微秒级沙箱</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">• 启动耗时: 仅 5 毫秒 (近乎 0 冷启动！)</text>
          <text y="30" fill="#86efac">• 基础内存: 仅 3MB ~ 5MB / 实例 (共享宿主运行时)</text>
          <text y="48" fill="#38bdf8">• 代码分发: 仅推送几 KB 的纯 JS/Wasm 字节码</text>
          <text y="64" fill="#34d399">• 单机密度: 单台服务器可同时常驻 10,000+ 个租户沙箱！</text>
          
          <text y="88" fill="#4ade80">✓ 真正的全球无缝部署，秒级生效至全球 300+ 边缘机房！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Cloudflare Workers / Deno Deploy 核心革命；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 让轻量函数在离用户最近的 1 毫秒处执行；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 彻底重塑现代 Web 基础架构版图！</text>
      </g>
    </g>
  </g>
</svg>