<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="service-release-checklist-evidence-gate-title service-release-checklist-evidence-gate-desc"><title id="service-release-checklist-evidence-gate-title">发布清单与客观证据闸门：把每一项打勾与自动化机器证据强绑定</title><desc id="service-release-checklist-evidence-gate-desc">发布清单与客观证据闸门：把每一项打勾与自动化机器证据强绑定</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">生产发布清单证据化：拒绝主观打勾，构建全自动机器证据链</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 依赖与环境固化证据 ──► 2. 数据库 DDL 逆向兼容脚本 ──► 3. 混沌故障注入报告 ──► 4. 生产灰度指标健康度机器断言</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 依赖版本与构建产物唯一不可变哈希 (Build Artifact Hash)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Git Commit: 9c8a7b ──► Docker Image SHA256: e3b0c44... ──► Lockfile 100% 锁定</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">严禁使用 latest 标签！构建工件与代码版本严格双向绑定，确保发布产物完全确定！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. 数据库 Schema 迁移 Expand-Contract 双向兼容验证 (DB Migration)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">ALTER TABLE orders ADD COLUMN status_v2 ... ──► 兼容新旧双版本读写 ──► 附带即时回滚 SQL</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">所有 DDL 变更必须在预发环境影子库执行耗时演练，杜绝锁表阻塞生产主库！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. 回滚方案与灾难恢复自动化演练凭证 (Automated Rollback Proof)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">kubectl rollout undo deployment/app ──► 自动化模拟一键回滚耗时 &lt; 30s 且数据 0 损坏！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">无法自动回滚的系统坚决不准上线！必须具备成熟的一键秒级降级与回滚兜底策略！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 生产金丝雀 SLO 观测通过性机器签名 (Canary SLO Sign-off)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Prometheus 5 分钟采样: ErrorRate &lt; 0.01% &amp;&amp; Latency P99 &lt; 50ms ──► 机器授权全量发布！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">用客观监控数据取代主管审批，打造高度严谨、数据驱动的现代发布工程文化！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
