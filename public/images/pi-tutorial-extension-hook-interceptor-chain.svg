<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 插件系统洋葱模型拦截链架构 (Onion Middleware Chain)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">请求进入 ──► 插件 1 (安全审计) ──► 插件 2 (参数脱敏) ──► 核心工具执行 ──► 插件 2 (结果增强) ──► 插件 1 (日志上报) ──► 输出</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 前置拦截外层 (Outer Pre-Hook: Security &amp; Permissions)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">安全插件拦截即将执行的 Tool Call ──► 检查是否越权访问未授权路径 ──► 违规立即短路熔断返回拒绝</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">第一道洋葱安全外皮！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 前置拦截内层 (Inner Pre-Hook: Parameter Enrichment &amp; Lint)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">自动修正代码格式或补齐绝对路径参数 ──► 将优化后的 Clean 参数传递给核心执行器</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">参数自愈与增强层！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 核心工具安全执行 (Core Tool Execution)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">在安全沙箱内执行底层操作 ──► 捕获 stdout/stderr 原始数据 ──► 开始逆向穿透后置中间件</text>
        <text x="15" y="62" font-size="8" fill="#047857">核心业务逻辑执行中心！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 后置拦截出栈 (Post-Hook: Output Sanitization &amp; Metrics Telemetry)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">自动脱敏 API Key、截断超长日志、上报执行耗时指标 ──► 最终装配为 Observation 回传大模型！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">经典洋葱模型的终极工程实践！</text>
      </g>
    </g>
  </g>
</svg>