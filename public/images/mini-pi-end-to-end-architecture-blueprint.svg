<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Mini Pi：300 行代码麻雀虽小五脏俱全的 Agent 全景蓝图</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. CLI 命令行入口 ──► 2. ReAct 状态机循环 ──► 3. LLMProvider 适配 ──► 4. Tool Registry (fs/shell) ──► 5. JSONL 会话持久化</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. CLI &amp; TUI (50 行)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">终端交互与流式打字：</text>
          
          <text x="8" y="38" fill="#86efac">• readline 接收输入</text>
          <text x="8" y="54" fill="#38bdf8">• ANSI 语法着色高亮</text>
          <text x="8" y="70" fill="#34d399">• Ctrl+C 优雅取消</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 极简交互入口！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 0 庞大外部重依赖；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 原生 Node/Python 极速秒跑；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 纯粹轻量。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. ReAct Loop (80 行)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">自主思维闭环：</text>
          
          <text x="8" y="38" fill="#86efac">• while (!done &amp;&amp; step&lt;20)</text>
          <text x="8" y="54" fill="#38bdf8">• 解析 tool_calls JSON</text>
          <text x="8" y="70" fill="#34d399">• 派发执行并回填观测</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 核心状态机发动机！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 凝练出 Agent 运行本质；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 步数保护与死循环熔断；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 简单即是美。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Tools (100 行)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">核心系统工具集：</text>
          
          <text x="8" y="38" fill="#fed7aa">• view_file / write_file</text>
          <text x="8" y="54" fill="#38bdf8">• run_command (execa)</text>
          <text x="8" y="70" fill="#4ade80">• 智能 Head-Tail 截断</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 赋予操作真实世界能力！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 严守沙箱相对路径边界；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 捕获真实 stdout/stderr 铁证；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 最小必要能力集。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. Session (70 行)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">会话与持久化：</text>
          
          <text x="8" y="38" fill="#e9d5ff">• Append-only session.jsonl</text>
          <text x="8" y="54" fill="#38bdf8">• 启动顺序回放恢复历史</text>
          <text x="8" y="70" fill="#4ade80">• Token 预算与自动裁剪</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 保证断点续跑与数据持久！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">沉淀效益：</text>
        <text x="10" y="34" font-size="7.5" fill="#6b21a8">• 帮助开发者彻底掌握底层细节；</text>
        <text x="10" y="48" font-size="7.5" fill="#6b21a8">• 0 黑盒，每一个机制均亲手实现；</text>
        <text x="10" y="62" font-size="7.5" fill="#6b21a8">• 终极实战项目！</text>
      </g>
    </g>
  </g>
</svg>