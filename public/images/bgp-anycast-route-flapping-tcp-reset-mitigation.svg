<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">BGP Anycast 路由抖动防御：跨 PoP 节点一致性转发与 QUIC 连接迁移</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">路由震荡导致 TCP 包飞往错误 POP 触发 RST ｜ BGP 抑制衰减 (Dampening) + QUIC Connection ID 0 断连自愈</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: TCP Reset Flaw -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 TCP：路由漂移触发 RST 强断</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. 客户端在 PoP-A (北京) 建立 TCP 三次握手</text>
          <text y="30" fill="#fca5a5">2. 骨干网抖动导致 BGP 路由表切换至 PoP-B (保定)</text>
          <text y="48" fill="#ef4444">3. 客户端后续数据包被送往 PoP-B</text>
          <text y="64" fill="#ef4444">4. PoP-B 内核无该 TCP 四元组连接上下文！</text>
          
          <text y="88" fill="#ef4444">🔴 PoP-B 直接回送 TCP RST 强制重置连接！</text>
          <text y="104" fill="#f87171">用户下载中断、视频卡死、请求失败！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• Anycast 天然对有状态 TCP 长连接不友好；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 跨国跨运营商链路抖动导致连接成活率跌至 92%；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须引入现代传输层架构演进！</text>
      </g>
    </g>

    <!-- Right: QUIC + BGP Dampening -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ QUIC Connection ID + BGP 路由平滑</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">1. QUIC 协议基于 64-bit Connection ID 寻址</text>
          <text y="30" fill="#86efac">2. 即使 IP 路由漂移至 PoP-B:</text>
          <text y="48" fill="#38bdf8">   • PoP-B 校验 CID 路由转发至原始后端集群</text>
          <text y="64" fill="#34d399">   • 会话无感接续，0 次重连、0 丢包！</text>
          
          <text y="88" fill="#4ade80">3. BGP 开启 Route Dampening 路由衰减抑制:</text>
          <text y="104" fill="#4ade80">   • 消除高频振荡，保证路由收敛平稳度 &gt; 99.99%！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Cloudflare / Fastly 全球边缘网络标配方案；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 弱网移动端连接成功率提升至 99.98%；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造无坚不摧的全球边缘网络基座！</text>
      </g>
    </g>
  </g>
</svg>