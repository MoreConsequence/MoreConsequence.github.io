<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d7a4f"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="40" y="28" fill="#2d3142" font-size="20" font-weight="400" font-family="'Instrument Serif', serif">BGP Anycast 路由抖动防御</text>
  <text x="40" y="48" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">路由震荡触发 RST | BGP 抑制衰减 + QUIC Connection ID 0 断连自愈</text>

  <!-- Left Panel -->
  <g transform="translate(40, 60)">
    <rect width="420" height="300" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <rect x="12" y="12" width="396" height="20" rx="2" fill="transparent" stroke="rgba(196,52,45,0.40)" stroke-width="0.8"/>
    <text x="210" y="26" fill="#c4342d" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">TCP RESET FLAW</text>
    <text x="210" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">传统 TCP: 路由漂移触发 RST 强断</text>

    <g transform="translate(16, 60)">
      <rect width="388" height="40" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="12" y="16" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">1. 客户端在 PoP-A (北京) 建立 TCP</text>
      <text x="12" y="30" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">SYN - SYN-ACK - ACK RTT=4ms</text>
    </g>

    <line x1="210" y1="100" x2="210" y2="112" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <g transform="translate(16, 116)">
      <rect width="388" height="40" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="12" y="16" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">2. 骨干网抖动: BGP 路由切换至 PoP-B</text>
      <text x="12" y="30" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">AS-Path 重收敛 最短路径变更</text>
    </g>

    <line x1="210" y1="156" x2="210" y2="168" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <g transform="translate(16, 172)">
      <rect width="388" height="40" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="12" y="16" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">3. 客户端后续数据包被送往 PoP-B</text>
      <text x="12" y="30" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">IP 路由已切换 报文误入新节点</text>
    </g>

    <line x1="210" y1="212" x2="210" y2="224" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <g transform="translate(16, 228)">
      <rect width="388" height="44" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="12" y="16" fill="#c4342d" font-size="11" font-weight="600" font-family="'Geist', sans-serif">4. PoP-B 无 TCB 上下文!</text>
      <text x="12" y="32" fill="#c4342d" font-size="11" font-weight="600" font-family="'Geist', sans-serif">PoP-B 回送 TCP RST 重置连接</text>
    </g>

    <g transform="translate(16, 280)">
      <rect width="388" height="24" rx="4" fill="rgba(196,52,45,0.06)" stroke="rgba(196,52,45,0.30)" stroke-width="0.8"/>
      <text x="194" y="16" fill="#c4342d" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">用户下载中断 视频卡死 请求失败</text>
    </g>
  </g>

  <!-- Right Panel -->
  <g transform="translate(500, 60)">
    <rect width="420" height="300" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <rect x="12" y="12" width="396" height="20" rx="2" fill="transparent" stroke="rgba(45,122,79,0.40)" stroke-width="0.8"/>
    <text x="210" y="26" fill="#2d7a4f" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">QUIC + BGP DAMPENING</text>
    <text x="210" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QUIC Connection ID + BGP 路由平滑</text>

    <g transform="translate(16, 60)">
      <rect width="388" height="40" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="12" y="16" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">1. QUIC 基于 64-bit Connection ID 寻址</text>
      <text x="12" y="30" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">CID 绑定会话 不依赖 IP 四元组</text>
    </g>

    <line x1="210" y1="100" x2="210" y2="112" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <g transform="translate(16, 116)">
      <rect width="388" height="40" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="12" y="16" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">2. 即使 IP 路由漂移至 PoP-B:</text>
      <text x="12" y="30" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">PoP-B 校验 CID 转发至原始后端</text>
    </g>

    <line x1="210" y1="156" x2="210" y2="168" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <g transform="translate(16, 172)">
      <rect width="388" height="44" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="12" y="16" fill="#2d7a4f" font-size="11" font-weight="600" font-family="'Geist', sans-serif">3. 会话无感接续: 0 次重连 0 丢包!</text>
      <text x="12" y="32" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">连接保持 100% 连通 用户无感知</text>
    </g>

    <line x1="210" y1="216" x2="210" y2="228" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <g transform="translate(16, 232)">
      <rect width="388" height="40" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="12" y="16" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">4. BGP Route Dampening 路由衰减抑制</text>
      <text x="12" y="30" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">消除高频振荡 路由收敛平稳度 >99.99%</text>
    </g>

    <g transform="translate(16, 280)">
      <rect width="388" height="24" rx="4" fill="rgba(45,122,79,0.06)" stroke="rgba(45,122,79,0.30)" stroke-width="0.8"/>
      <text x="194" y="16" fill="#2d7a4f" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">连接成功率 99.98% 全球边缘网络标配</text>
    </g>
  </g>
</svg>
