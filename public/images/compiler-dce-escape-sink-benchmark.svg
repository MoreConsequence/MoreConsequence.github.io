<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Benchmark 编译器死码消除 (DCE) 与全局逃逸槽 (Sink)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">未使用的计算结果会被编译器直接优化删除 (0.3ns 假象) ──► 将结果赋值给包级全局导出变量 var Sink ──► 强行阻止优化</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: DCE Trap -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 编译器死码消除 (Dead Code Elimination)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">func BenchmarkFib(b *testing.B) {</text>
          <text y="28" fill="#f87171">  for i := 0; i &lt; b.N; i++ {</text>
          <text y="42" fill="#ef4444">    fib(30) // 返回值未被任何代码使用！</text>
          <text y="56" fill="#f87171">  }</text>
          <text y="70" fill="#f87171">}</text>
          
          <text y="92" fill="#ef4444">💥 编译器内联与优化：</text>
          <text y="106" fill="#ef4444">• 编译器发现函数无副作用且结果无人读取，整行直接抹除！</text>
          <text y="120" fill="#f87171">🔴 测出 0.28 ns/op 的荒谬假象！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">常见陷阱：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 自欺欺人的超高性能报告；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 上线后实际吞吐直接崩塌；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须防范编译器过度内联！</text>
      </g>
    </g>

    <!-- Right: Global Sink Solution -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 包级全局逃逸槽 (Global Sink Pattern)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">var Sink int // 包级全局变量，强行迫使编译器保留计算</text>
          
          <text y="36" fill="#86efac">func BenchmarkFib(b *testing.B) {</text>
          <text y="50" fill="#38bdf8">  var r int</text>
          <text y="64" fill="#34d399">  for i := 0; i &lt; b.N; i++ { r = fib(30) }</text>
          <text y="78" fill="#4ade80">  Sink = r // 赋值给全局变量，防止 DCE 优化！</text>
          <text y="92" fill="#86efac">}</text>
          
          <text y="114" fill="#4ade80">✓ 真实测出真实的 142,500 ns/op 开销！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 获得 100% 真实可信的物理性能基准；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• Go 官方标准库（runtime / math）标准编写范式；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 严谨工程测试修养！</text>
      </g>
    </g>
  </g>
</svg>