<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="leveled-compaction-space-amplification-title leveled-compaction-space-amplification-desc"><title id="leveled-compaction-space-amplification-title">分层压缩 (Leveled Compaction) 机制：空间放大与读写放大权衡</title><desc id="leveled-compaction-space-amplification-desc">对比图展示 Leveled Compaction 键互斥不重叠带来的极致 0.04 次读探测与低空间放大，对比 Size-Tiered 大批合并带来的低写放大与高读放大的物理权衡。</desc>
  <defs>
    <marker id="lc-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="lc-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">LSM COMPACTION STRATEGY · LEVELED VS SIZE-TIERED</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">分层压缩 (Leveled Compaction) 机制与权衡</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">Leveled (Key 域不重叠，读探测低至 0.04 次，写放大 ~5.38) vs Size-Tiered (大批合并，写放大低至 1.60，多重叠读放大高)</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#eb6c36" />
    <text x="79" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">LEVELED (RECOMMENDED)</text>
    <text x="154" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Leveled Compaction (分层压缩)</text>

    
    <rect x="14" y="42" width="392" height="74" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">L1+ 各层 Key 范围严格互斥不重叠</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">L1: [a..g] ➔ [h..p] ➔ [q..z] (每个 Key 仅存在于 1 个文件)</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">点查命中率极高：单层只需探测最多 1 个 SSTable！</text>

    
    <rect x="14" y="126" width="392" height="120" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">30 万行 Sweep 基准实测数据 (T=8)</text>
    <text x="24" y="168" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 读探测 (不存在键): 仅 0.04 次！(极度优秀)</text>
    <text x="24" y="186" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• 空间放大 (SA): 1.19 (磁盘空间利用率高)</text>
    <text x="24" y="204" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">• 写放大 (WA): 5.38 (下沉需与下层重写)</text>
    <text x="24" y="224" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">读尾延迟平稳，消灭多文件重叠查找</text>

    
    <rect x="14" y="256" width="392" height="104" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="278" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">适用最佳实践</text>
    <text x="24" y="298" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">RocksDB 生产默认策略。适合读写混合、范围扫描频繁、对 P99 读延迟与磁盘空间成本敏感的通用场景。</text>
    <text x="24" y="322" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Predictable Low Read Latency &amp; Space</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Standard OLTP / KV Workload Default</text>
  </g>

  
  <g transform="translate(480, 136)">
    <rect width="440" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="69" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SIZE-TIERED</text>
    <text x="134" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Size-Tiered Compaction (分级压缩)</text>

    
    <rect x="14" y="42" width="412" height="74" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">同层积攒多个大小相近的重叠 SSTable</text>
    <text x="24" y="82" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Tier 1: [a..z] ⇄ [a..z] ⇄ [a..z] ⇄ [a..z] (范围重叠)</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">点查必须探测全部重叠文件 ➔ 读放大严重！</text>

    
    <rect x="14" y="126" width="412" height="120" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">30 万行 Sweep 基准实测数据 (T=8)</text>
    <text x="24" y="168" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 写放大 (WA): 2.69 (极低，大批合并重写少)</text>
    <text x="24" y="186" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• 空间放大 (SA): 1.27 (合并期间峰值可达 2.0x 翻倍)</text>
    <text x="24" y="204" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 读探测 (无 Bloom): 高达 4.0 ~ 28.0 次！</text>
    <text x="24" y="224" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">劣势: 点查抖动大，空间峰值翻倍风险高</text>

    
    <rect x="14" y="256" width="412" height="104" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="278" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">适用场景</text>
    <text x="24" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">Cassandra / ScyllaDB 默认。适合高吞吐纯日志追加写入、极少更新删除、点查要求不苛刻的大数据管道。</text>
    <text x="24" y="322" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Ultra-High Ingestion Throughput</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Cassandra Time-Series Storage</text>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Size-Tiered 大批重写</text>
  <rect x="330" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="350" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Leveled 键不重叠与 0.04 次极速点查核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
