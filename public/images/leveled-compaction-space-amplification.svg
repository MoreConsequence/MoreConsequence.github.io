<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LSM 分层压缩 (Leveled Compaction) 与三维放大权衡</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">L0 (SST 间 Key 范围重叠) ──► 归并排序下推至 L1 (10MB, Key 无重叠) ──► 10 倍放大至 L2 (100MB) ──► 权衡写放大 (WA)、读放大 (RA) 与空间放大 (SA)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 写放大 (Write Amplification - WA)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">WA = 写入磁盘总字节 / 用户实际写入字节</text>
          
          <text x="10" y="42" fill="#86efac">物理代价：</text>
          <text x="10" y="58" fill="#cbd5e1">• 数据在每层 Compaction 需重新读写</text>
          <text x="10" y="74" fill="#cbd5e1">• Leveled Compaction 的 WA 约 10~30 倍</text>
          <text x="10" y="90" fill="#34d399">• 但相比 B+ 树的随机写仍具压倒性吞吐优势</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 适合以写入为主的大吞吐系统！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 顺序 I/O 效率远超随机 I/O；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 合理设置分层倍数（10x）平衡代价；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造超强吸星大法。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 读放大 (Read Amplification - RA)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">RA = 读取磁盘总字节 / 实际数据字节</text>
          
          <text x="10" y="42" fill="#fed7aa">查找链路：MemTable ──► L0 ──► L1 ──► L2...</text>
          <text x="10" y="58" fill="#38bdf8">必须依次探查多个 SSTable</text>
          
          <text x="10" y="80" fill="#34d399">硬核加速利器：</text>
          <text x="10" y="96" fill="#4ade80">布隆过滤器 (Bloom Filter) 1 次计算排除 99% SST！</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 将读放大压制在常数级别！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 利用位图哈希消除多余磁盘探查；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 点查性能接近 B+ 树；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 空间换时间的绝妙设计！</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 空间放大 (Space Amplification - SA)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">SA = 磁盘实际占用 / 有效数据总大小</text>
          
          <text x="10" y="42" fill="#86efac">存储表现：</text>
          <text x="10" y="58" fill="#cbd5e1">• 旧版本与删除标记 (Tombstone) 在 Compaction 中彻底清理</text>
          <text x="10" y="74" fill="#cbd5e1">• Leveled 模式的 SA 仅约 1.1~1.2 倍</text>
          <text x="10" y="90" fill="#34d399">• 远优于 B+ 树的 50% 内部碎片 (SA 1.5~2.0)</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 磁盘空间利用率达到物理极致！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 紧凑的数据布局节省海量存储成本；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 成为现代分布式数据库（TiDB、CockroachDB）首选；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级存储引擎架构典范！</text>
      </g>
    </g>
  </g>
</svg>