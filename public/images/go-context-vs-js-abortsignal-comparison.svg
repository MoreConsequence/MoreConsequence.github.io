<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="go-context-vs-js-abortsignal-comparison-title go-context-vs-js-abortsignal-comparison-desc"><title id="go-context-vs-js-abortsignal-comparison-title">Go Context 与 JS AbortSignal 取消模型对比：显式通道拉取 vs 事件监听回调</title><desc id="go-context-vs-js-abortsignal-comparison-desc">Go Context 与 JS AbortSignal 取消模型对比：显式通道拉取 vs 事件监听回调</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">两种语言的取消模型分界：Go Context (拉取) vs JS AbortSignal (推送)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Go ctx.Done() (显式 select Channel 阻塞监听) vs JS signal.addEventListener (事件驱动订阅回调与内存泄漏防范)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Go: Context 树与 Channel 显式拉取</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">select {</text>
          <text y="28" fill="#f5f5f5">case &lt;-ctx.Done():</text>
          <text y="42" fill="#f5f5f5">    return ctx.Err() // 主动检查取消信号</text>
          <text y="56" fill="#f5f5f5">case res := &lt;-ch:</text>
          <text y="70" fill="#f5f5f5">    process(res)</text>
          <text y="84" fill="#f5f5f5">}</text>

          <text y="108" fill="#f5f5f5">✓ 显式同步控制流，代码走向一目了然</text>
          <text y="124" fill="#f5f5f5">✓ 协程树级联关闭，支持 Value 跨层透传</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 必须作为第一入参显式传递：func Do(ctx context.Context)；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 协程不退出 ctx 也会常驻，必须记得 defer cancel()；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造高并发后端最严格的生命周期控制。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. JS: AbortSignal 事件发布订阅</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">signal.addEventListener('abort', () =&gt; {</text>
          <text y="28" fill="#f5f5f5">    socket.destroy(); // 响应式回调推模式</text>
          <text y="42" fill="#f5f5f5">}, { once: true });</text>

          <text y="68" fill="#f5f5f5">if (signal.aborted) throw new AbortError();</text>

          <text y="94" fill="#f5f5f5">✓ 完美集成 Fetch API / Node Streams / EventTarget</text>
          <text y="110" fill="#f5f5f5">⚠️ 监听未移除易造成内存泄漏 (Memory Leak)</text>
          <text y="126" fill="#f5f5f5">✓ 推荐使用 AbortSignal.any([...]) 多源组合！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 适合 I/O 驱动的异步微任务回调体系；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 避免长生命周期 signal 挂载过多短生命周期监听；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代全栈前端与 Node 统一的标准取消协议！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
