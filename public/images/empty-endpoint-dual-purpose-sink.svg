<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Empty 端点双模机制：GET 零延迟往返 vs POST 极速黑洞吸收</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">GET /empty: 仅返回 200 OK + 0 Body 用于纳秒级 RTT 测算 ｜ POST /empty: io.Copy(io.Discard, req.Body) 吞噬 40Gbps 上行流量</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. GET /empty：延迟与抖动计量标尺</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">func EmptyHandler(w http.ResponseWriter, r *http.Request) {</text>
          <text y="28" fill="#86efac">  w.Header().Set("Cache-Control", "no-store, no-cache");</text>
          <text y="42" fill="#86efac">  w.WriteHeader(http.StatusOK); // 0 Body 回包！</text>
          <text y="56" fill="#38bdf8">}</text>
          
          <text y="80" fill="#34d399">核心价值：</text>
          <text y="94" fill="#cbd5e1">• 排除任何内容传输与解码耗时</text>
          <text y="108" fill="#4ade80">✓ 纯粹测量真实的物理链路 RTT 往返时延！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 单次会话连续发起 10 次 ping 请求；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 剔除最大最小值，计算 RFC 3550 一阶滤波抖动；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高精度网络时延基准。</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. POST /empty：上行数据黑洞 (Sink Buffer)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">// 上行测试：客户端上传数百 MB 垃圾数据</text>
          <text y="28" fill="#fed7aa">io.Copy(io.Discard, r.Body); // 极速吸收并丢弃</text>
          <text y="42" fill="#fed7aa">r.Body.Close();</text>
          
          <text y="66" fill="#34d399">性能奇迹：</text>
          <text y="80" fill="#cbd5e1">• 数据直接在内核 socket 缓冲区读出并废弃</text>
          <text y="94" fill="#cbd5e1">• 0 磁盘写入、0 内存持久化、0 内存泄漏！</text>
          
          <text y="118" fill="#4ade80">✓ 单核支撑 40Gbps 上行极限洪峰吞噬！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底避免服务端内存被海量上传数据撑爆；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 维持极高的 TCP 接收窗口，防止反压阻断测速；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级吞吐测量核心架构！</text>
      </g>
    </g>
  </g>
</svg>