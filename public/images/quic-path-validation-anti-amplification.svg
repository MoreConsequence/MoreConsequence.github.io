<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">QUIC 路径验证 (Path Validation) 与防反射放大攻击 (Anti-Amplification)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">PATH_CHALLENGE (8 字节随机载荷) ──► 验证新地址真实可达 ──► 在收到 PATH_RESPONSE 前强制限制下行数据量 ≤ 接收量的 3 倍</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 新网络路径探测 (New Path Migration Detected)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">客户端从新 IP (如 114.248.10.5) 发送 UDP 数据包 ──► 服务端捕获到未知的新四元组</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">服务端必须防范恶意伪造 IP 的反射放大 DDoS 攻击！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">2. 3 倍下行放大限制 (Anti-Amplification Limit: Max 3x Ingress Bytes)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">在路径验证通过前 ──► 服务端向该新 IP 发送的字节总数严格限制为已收到字节数的 3 倍</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">彻底剥夺攻击者利用大文件推流攻击第三方受害者的能力！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 挑战与应答交互 (PATH_CHALLENGE ⇄ PATH_RESPONSE)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">服务端发射 8 字节加密随机数 PATH_CHALLENGE ──► 真实客户端原样回送 PATH_RESPONSE</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">证明该新 IP 真实可达且确实属于当前合法客户端！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 路径全面激活与全速恢复 (Path Validated &amp; Congestion Reset)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">解除 3 倍限制 ──► 重新初始化该路径的 RTT 与拥塞控制窗口 (BBR) ──► 恢复万兆全速推流！</text>
        <text x="15" y="62" font-size="8" fill="#047857">兼具极速连接迁移与绝对网络安全的工业级协议典范！</text>
      </g>
    </g>
  </g>
</svg>