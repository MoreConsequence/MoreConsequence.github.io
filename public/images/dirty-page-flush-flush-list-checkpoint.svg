<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="dirty-page-flush-flush-list-checkpoint-title dirty-page-flush-flush-list-checkpoint-desc"><title id="dirty-page-flush-flush-list-checkpoint-title">脏页刷盘与 Flush 链表：LSN 序号推进与 Sharp vs Fuzzy Checkpoint</title><desc id="dirty-page-flush-flush-list-checkpoint-desc">架构流程图展示 InnoDB Flush 链表按 oldest_modification_lsn 组织脏页，Page Cleaner 异步执行 Fuzzy Checkpoint 推进 LSN 与 75% Redo 日志满载时触发 Sharp Checkpoint 同步刷盘的全过程。</desc>
  <defs>
    <marker id="fl-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="fl-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">DIRTY PAGE FLUSHING · FLUSH LIST &amp; CHECKPOINT ARCHITECTURE</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">脏页刷盘与 Flush 链表推进机制</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">Flush 链表按 oldest_modification_lsn 单调组织 ➔ Page Cleaner 推进 Checkpoint ➔ Fuzzy 平滑落盘 vs 75% Redo Sharp 警戒</text>

  <!-- 3 Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Flush List Organization (x=40..310, w=270) -->
  <g transform="translate(40, 136)">
    <rect width="270" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="14" y="12" width="80" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="54" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 1</text>
    <text x="104" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Flush List 脏页组织</text>

    <!-- Visual Box -->
    <rect x="14" y="42" width="242" height="110" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">oldest_modification_lsn</text>
    <text x="24" y="82" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">页第一次被修改时打标 LSN_0</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">按 LSN 从大到小插入链表头部</text>
    <text x="24" y="118" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">Tail 始终是最早未刷盘脏页 (LSN_min)</text>
    <text x="24" y="136" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Monotonic LSN Ordering</text>

    <!-- Details -->
    <rect x="14" y="162" width="242" height="198" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">写账的核心属性：</text>
    <text x="24" y="204" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 读账 LRU 决定淘汰谁；</text>
    <text x="24" y="222" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 写账 Flush List 决定刷盘谁；</text>
    <text x="24" y="240" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 两个链表包含相同的脏页指针，但依据完全解耦！</text>
    <line x1="24" y1="254" x2="246" y2="254" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
    <text x="24" y="274" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">Dirty Watermark Trigger:</text>
    <text x="24" y="292" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">max_dirty_pages_pct_lwm=10%</text>
    <text x="24" y="310" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">max_dirty_pages_pct=90%</text>
    <text x="24" y="330" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">后台自适应调节刷盘强度</text>
  </g>

  <!-- Arrow 1 (x=310..340) -->
  <text x="325" y="225" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Flush</text>
  <line x1="310" y1="233" x2="340" y2="233" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fl-arr-accent)"/>

  <!-- Col 2: Checkpoint Engine (x=340..630, w=290) - Focal -->
  <g transform="translate(340, 136)">
    <rect width="290" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="14" y="12" width="100" height="18" rx="2" fill="#eb6c36"/>
    <text x="64" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STEP 2 · CORE</text>
    <text x="124" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Checkpoint 推进与持久化</text>

    <!-- Page Cleaner Action -->
    <rect x="14" y="42" width="262" height="110" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
    <text x="24" y="64" fill="#eb6c36" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Page Cleaner 后台线程调度</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">根据 io_capacity 预算批量落盘</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">从 Flush List 尾部依次写回磁盘</text>
    <text x="24" y="118" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">Checkpoint LSN 推进至已落盘点</text>
    <text x="24" y="136" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">innodb_io_capacity = 10000</text>

    <!-- Recovery Principle -->
    <rect x="14" y="162" width="262" height="198" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="184" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">崩溃恢复的第一性原理：</text>
    <text x="24" y="204" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Checkpoint LSN 之前的 Redo 全部作废！</text>
    <text x="24" y="224" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">因为对应的脏数据已经物理刷入磁盘；</text>
    <text x="24" y="242" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">系统断电重启时，只需从 Checkpoint LSN 开始向后重放 Redo 日志！</text>
    <line x1="24" y1="256" x2="266" y2="256" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="24" y="276" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Checkpoint 推进越快 ➔ 崩溃恢复越快！</text>
    <text x="24" y="294" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Redo Log Space Recycling</text>
    <text x="24" y="312" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">循环写入日志文件的安全屏障</text>
  </g>

  <!-- Arrow 2 (x=630..660) -->
  <text x="645" y="225" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Modes</text>
  <line x1="630" y1="233" x2="660" y2="233" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fl-arr-accent)"/>

  <!-- Col 3: Sharp vs Fuzzy (x=660..920, w=260) -->
  <g transform="translate(660, 136)">
    <rect width="260" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="14" y="12" width="80" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="54" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">MODES</text>
    <text x="104" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">两种刷盘形态</text>

    <!-- Fuzzy Mode -->
    <rect x="14" y="42" width="232" height="130" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="64" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Fuzzy Checkpoint (日常)</text>
    <text x="24" y="84" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 异步分批温和落盘；</text>
    <text x="24" y="102" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 前台业务 0 停顿 0 阻塞；</text>
    <text x="24" y="120" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 脏页水位维持在 10%~90%；</text>
    <text x="24" y="138" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace">Smooth I/O Throttling</text>
    <text x="24" y="154" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Normal Background Operation</text>

    <!-- Sharp Mode -->
    <rect x="14" y="182" width="232" height="178" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
    <text x="24" y="204" fill="#eb6c36" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Sharp Checkpoint (风暴)</text>
    <text x="24" y="224" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 触发条件 1: Redo 达 75% 警戒线</text>
    <text x="24" y="242" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 触发条件 2: MySQL 正常停机</text>
    <text x="24" y="260" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 强制挂起全部业务写入！</text>
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 同步倾泻刷盘直到日志缓解</text>
    <line x1="24" y1="290" x2="236" y2="290" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="24" y="310" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">引发 P99 秒级卡顿尖刺！</text>
    <text x="24" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Avoid Sharp by IO Tuning</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Flush 组织与 Fuzzy 平滑落盘</text>
  <rect x="310" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="330" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Checkpoint 推进与 75% Redo 刷盘风暴警戒</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
