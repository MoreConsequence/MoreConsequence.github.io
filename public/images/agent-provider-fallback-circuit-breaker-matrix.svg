<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">模型服务商高可用降级自愈矩阵 (Provider Fallback FSM)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">主模型 Claude 3.7 (遇到 429 限流或 503 宕机) ──► 指数退避重试 2 次 ──► 自动无缝漂移至备用模型 DeepSeek / GPT-4o ──► 业务 0 中断</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Primary: 优先主选模型</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">Claude 3.7 Sonnet (主力):</text>
          
          <text x="10" y="38" fill="#86efac">• 承担 95% 日常高精度 Coding 任务</text>
          <text x="10" y="54" fill="#38bdf8">• 享受最高缓存命中率与最快推理</text>
          <text x="10" y="70" fill="#f87171">• 若突发 429 RateLimit / 500 Error</text>
          <text x="10" y="86" fill="#f87171">• 触发重试器与熔断计数器！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 常规首选高性能基线！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 优先满足最严苛的编码质量要求；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 连续健康状态监测；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 主干通道。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. Jitter Retry: 抖动退避重试</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">Exponential Backoff with Jitter:</text>
          
          <text x="10" y="38" fill="#fed7aa">• 第 1 次重试: 500ms + random(200ms)</text>
          <text x="10" y="54" fill="#fed7aa">• 第 2 次重试: 1500ms + random(500ms)</text>
          <text x="10" y="70" fill="#34d399">• 顺利平抑 80% 的服务商瞬间并发尖峰</text>
          <text x="10" y="86" fill="#f87171">• 若仍失败 ──► 果断触发跨厂商漂移！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 智能平滑毛刺！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 随机抖动避免全客户端同步共振重试；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 控制总重试耗时 &lt; 3 秒；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 网络工程标准实践。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. Fallback: 备用厂商秒级兜底</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">DeepSeek V3 / OpenAI GPT-4o:</text>
          
          <text x="10" y="38" fill="#86efac">• 自动将 Prompt 协议转化为目标格式</text>
          <text x="10" y="54" fill="#38bdf8">• 0 报错继续完成当前 Step 推理</text>
          <text x="10" y="70" fill="#4ade80">• 终端输出轻量提示: "已自动切换备用模型"</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 达成 99.99% 企业级高可用！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 终结因单一模型 API 宕机导致的工作停摆；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 赋予自主 Agent 极其顽强的生命力；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级可用性终极解答！</text>
      </g>
    </g>
  </g>
</svg>