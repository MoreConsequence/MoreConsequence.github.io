<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">代码编辑策略对决：全文件重写 vs 单块精准替换 (Exact Chunk Replacement)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">全量重写 (修改 2 行需输出 3,000 行，极慢且经常因截断破坏代码) vs replace_file_content (仅输出目标 5 行，速度提升 50 倍，100% 字节精准)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Full Rewrite -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ write_file 全量重写：极慢且容易损坏代码</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">修改 2,000 行文件中的 1 个常量：</text>
          
          <text y="38" fill="#ef4444">致命工程缺陷：</text>
          <text y="52" fill="#fca5a5">• 模型必须重新吐出全部 2,000 行代码</text>
          <text y="68" fill="#ef4444">• 耗时长达 40 秒，消耗数万 Tokens</text>
          <text y="84" fill="#ef4444">• 极易在中途使用 "// ... existing code ..." 导致丢代码！</text>
          
          <text y="106" fill="#f87171">🔴 早期 Coding Agent 最严重的通病！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 极高概率意外删除不相关的函数；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 延迟极高、费用昂贵；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 严禁在大文件使用全量重写！</text>
      </g>
    </g>

    <!-- Right: Exact Chunk Replacement -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ replace_file_content：块级精准定位替换</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">通过唯一上下文锚点精确定位：</text>
          
          <text y="36" fill="#86efac">1. 指定 TargetContent: 待替换的 3 行代码</text>
          <text y="50" fill="#38bdf8">2. 指定 ReplacementContent: 修复后的 3 行代码</text>
          <text y="64" fill="#34d399">3. 校验匹配唯一性 (Uniqueness Check) ──► 0 歧义替换</text>
          <text y="78" fill="#4ade80">4. 仅耗时 300ms，Token 消耗降低 99%！</text>
          
          <text y="104" fill="#4ade80">✓ 兼具极致速度与 100% 字节级代码安全！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底根除代码意外丢失与截断事故；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑数万行超大单体代码库的极速编辑；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代 Coding Agent 标准编辑工具！</text>
      </g>
    </g>
  </g>
</svg>