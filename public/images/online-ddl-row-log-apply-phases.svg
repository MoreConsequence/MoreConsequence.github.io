<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">InnoDB Online DDL 核心三阶段与 row_log 增量应用</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. Prepare 阶段 (短暂加 MDL 锁初始化 row_log) ──► 2. Execution 阶段 (全量搬迁 + 增量 DML 写入 row_log) ──► 3. Commit 阶段 (回放 row_log 并原子切换)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Prepare 准备阶段 (毫秒级)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">1. 升级获取 MDL 独占写锁 (瞬时)</text>
          <text x="10" y="34" fill="#86efac">2. 评估变更模式: INPLACE vs COPY</text>
          <text x="10" y="50" fill="#86efac">3. 创建临时 frm / ibd 新表字典结构</text>
          <text x="10" y="66" fill="#38bdf8">4. 分配 row_log 内存日志缓冲区</text>
          <text x="10" y="82" fill="#4ade80">5. 降级 MDL 锁为 SHARED (允许业务读写)</text>
          
          <text x="10" y="112" fill="#4ade80">✓ 耗时 &lt; 1ms，对业务几乎 0 感知！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 建立变更基线与增量捕获机制；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 迅速释放排他锁保障并发；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造平滑接入通道。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Execution 执行阶段 (异步搬迁)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 全量数据后台按序扫描与重建</text>
          <text x="10" y="34" fill="#86efac">InnoDB 读取原表构建新索引 B+ 树</text>
          
          <text x="10" y="58" fill="#38bdf8">// 前台并发业务 DML 持续发生：</text>
          <text x="10" y="74" fill="#34d399">INSERT / UPDATE / DELETE 产生的变更</text>
          <text x="10" y="90" fill="#34d399">实时追加写入 row_log 增量缓冲区！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 业务读写 100% 完全不中断！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 增量捕获与全量迁移并行推进；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 受 innodb_online_alter_log_max_size 保护；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 数据库内核最精妙的并发工程。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Commit 提交阶段 (原子切换)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">1. 再次升级获取 MDL 独占写锁 (瞬时)</text>
          <text x="10" y="34" fill="#fed7aa">2. 重放 row_log 中最后的增量变更</text>
          <text x="10" y="50" fill="#fed7aa">3. 原子重命名表空间文件 (rename ibd)</text>
          <text x="10" y="66" fill="#34d399">4. 释放旧表物理空间与数据字典</text>
          <text x="10" y="82" fill="#4ade80">5. 彻底释放 MDL 锁，DDL 宣告完成！</text>
          
          <text x="10" y="112" fill="#4ade80">✓ 零停机完成亿级大表平滑加字段！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底终结传统加字段停机维护时代；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 支撑现代互联网 7x24 小时持续演进；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级高可用基石！</text>
      </g>
    </g>
  </g>
</svg>