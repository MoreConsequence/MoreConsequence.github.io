<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">P99 分位数样本量与统计置信区间数学模型 (Sample Size &amp; Confidence)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">100 个样本算 P99 (被最大值极端绑架，误差 ±80%) vs 3,000+ 样本 (Clopper-Pearson 95% 置信区间收敛在真实 P99 核心区间)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Too few samples -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ N=100 样本算 P99：毫无统计意义的数字游戏</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">仅采集 100 个压测请求：</text>
          <text y="28" fill="#ef4444">• P99 恰好等于全量样本中排名倒数第 2 的值！</text>
          
          <text y="50" fill="#ef4444">二项分布置信区间 (Binomial CI):</text>
          <text y="64" fill="#fca5a5">• 真实百分位点落在 [P95.1, P99.9] 的巨大鸿沟中</text>
          <text y="78" fill="#ef4444">• 只要有 1 个请求遇到 GC 抖动，P99 瞬间暴涨 500%！</text>
          
          <text y="106" fill="#f87171">🔴 绝不能据此得出任何生产容量判断！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 被单次压测的偶然极值严重误导；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• SLA 达标率沦为掷骰子；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 统计学常识性低级错误！</text>
      </g>
    </g>

    <!-- Right: N=3000 Standard -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ N ≥ 3000 黄金样本量：95% 置信度数学收敛</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">采集 3,000 个以上压测请求：</text>
          
          <text y="36" fill="#86efac">严谨统计收敛：</text>
          <text y="50" fill="#38bdf8">1. P99 对应第 2,970 个样本位置</text>
          <text y="64" fill="#34d399">2. 95% 置信区间收窄至 [P98.6, P99.4] 极窄范围</text>
          <text y="78" fill="#4ade80">3. 彻底平抑长尾单次随机抖动，数据绝对可信！</text>
          
          <text y="104" fill="#4ade80">✓ 达到国际工业级 Benchmark 准入标准！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 真实反映微服务长尾时延分布；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑严苛 SLA/SLO 承诺与履约；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 性能压测的金科玉律！</text>
      </g>
    </g>
  </g>
</svg>