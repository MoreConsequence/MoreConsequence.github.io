<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Git PR 并发合并语义冲突与 Merge Queue 队列模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">两个 PR 各自 CI 全绿通过 ──► 并发合并产生隐式语义破坏导致 main 分支构建失败 ──► 引入 GitHub Merge Queue 串行推演测试</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. PR 独立分支测试假象 (PR A &amp; PR B Green in Isolation)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">PR A 重命名了函数 Foo() -&gt; Bar() ｜ PR B 同时基于旧基线新增了调用 Foo() 的代码 ──► 各自独立 CI 运行 100% 绿标！</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">各自自洽，但隐藏致命语义冲突！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fef2f2" stroke="#f87171"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">2. 并发合并引发 Main 分支瞬间红标崩溃 (Concurrent Merge Breakdown)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#ef4444">Git 文本级无冲突自动合并 ──► Main 分支编译立即报错: undefined: Foo ──► 阻塞全团队几十人后续发布！</text>
        <text x="15" y="62" font-size="8" fill="#dc2626">大规模团队协作中最常见的幽灵冲突！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 引入 Merge Queue 虚拟预测队列 (Merge Queue Simulation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">将 PR A 和 PR B 压入合并队列 ──► 在虚拟分支自动执行 Rebase (Main + A + B) ──► 重新触发 CI 完整验证</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将并发竞态转化为有序串行预测执行！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 自动剔除冲突与 Main 永恒绿标 (Auto-Eject Bad PR &amp; Green Main)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">捕获 PR B 报错 ──► 自动将 PR B 弹出队列通知作者 ──► 仅安全合并 PR A ──► Main 分支 100% 保持坚不可摧！</text>
        <text x="15" y="62" font-size="8" fill="#047857">现代软件工程持续集成防线的黄金标准！</text>
      </g>
    </g>
  </g>
</svg>