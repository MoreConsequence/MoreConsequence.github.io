<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Linux epoll 内核数据结构：红黑树 (rbr) + 双向就绪链表 (rdllist)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">epoll_ctl (在红黑树 O(log N) 增删改监听 fd) ｜ 网卡中断触发回调 ep_poll_callback ──► 将 epitem 插入 rdllist ｜ epoll_wait 仅需 O(1) 拷贝就绪链表</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: RB-Tree -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 内核红黑树 (eventpoll.rbr: 监听集合)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">struct eventpoll { struct rb_root_cached rbr; ... };</text>
          
          <text y="38" fill="#86efac">数据结构特征：</text>
          <text y="52" fill="#cbd5e1">• 每一个监听的 socket 封装为一个 struct epitem 节点</text>
          <text y="66" fill="#cbd5e1">• 依 (fd, file*) 为 Key 组织为红黑树</text>
          <text y="80" fill="#34d399">• epoll_ctl 增删改查仅需 O(log N) 极速完成！</text>
          
          <text y="106" fill="#4ade80">✓ 仅注册 1 次，彻底告别 select 每次全量内存拷贝！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 支撑百万级空闲长连接常驻内存；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 内存开销极小（每个 epitem 约 128 字节）；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造稳固的监听树。</text>
      </g>
    </g>

    <!-- Right: Ready List -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 双向就绪链表 (eventpoll.rdllist: 活跃事件)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">struct list_head rdllist;</text>
          
          <text y="38" fill="#86efac">中断驱动流转：</text>
          <text y="52" fill="#38bdf8">1. 网卡收到数据包 ──► 触发内核硬/软中断</text>
          <text y="66" fill="#34d399">2. 执行等待队列回调 ep_poll_callback()</text>
          <text y="80" fill="#34d399">3. 将对应 epitem 节点直接挂入 rdllist 双向就绪链表</text>
          
          <text y="106" fill="#4ade80">✓ epoll_wait 仅需 O(1) 拷贝 rdllist 中的活跃节点！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 性能与连接总数完全解耦，仅与活跃连接数正相关；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底释放 CPU 算力；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代操作系统最伟大的 I/O 架构发明！</text>
      </g>
    </g>
  </g>
</svg>