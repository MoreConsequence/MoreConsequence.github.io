<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AbortSignal 级联组合治理：避免 MaxListenersExceeded 内存泄漏</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">手动 addEventListener 挂载未解绑 (导致闭包常驻内存) ──► AbortSignal.any() 原生单向组合 ──► once 自动解绑</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 朴素实现：监听器未解绑引发内存泄漏</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 循环调用 fetchWithTimeout(globalSignal)</text>
          <text y="28" fill="#fca5a5">parentSignal.addEventListener('abort', () =&gt; ...);</text>
          
          <text y="50" fill="#ef4444">🔴 致命漏洞：</text>
          <text y="66" fill="#fb7185">1. 请求成功完成，但 'abort' 监听器未被 remove！</text>
          <text y="82" fill="#ef4444">2. 循环 10,000 次后，parent 挂载 10,000 个闭包！</text>
          <text y="98" fill="#ef4444">3. 导致整个子任务上下文在堆中永久无法 GC！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• Node.js 触发 MaxListenersExceededWarning；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 运行数小时后常驻内存 (RSS) 飙升 OOM 崩溃；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 必须规范生命周期管理！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 原生 AbortSignal.any() + 析构解绑</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 现代 Web API 原生多路组合 (Node 20+)</text>
          <text y="28" fill="#86efac">const combined = AbortSignal.any([userSignal, timeoutSignal]);</text>
          
          <text y="50" fill="#38bdf8">1. 只要任一 Signal 触发，combined 立即中止</text>
          <text y="66" fill="#34d399">2. 内部由 C++ 引擎级自动挂载与解除引用</text>
          <text y="82" fill="#34d399">3. 无论请求正常完成或超时，零遗留闭包！</text>
          
          <text y="108" fill="#4ade80">✓ 堆内存占用平稳如一条直线，完美自愈！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 纯标准 API，无需三方库 hack；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 高并发 Agent 与长轮询任务的绝对保障；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚不可摧的 TypeScript 服务！</text>
      </g>
    </g>
  </g>
</svg>