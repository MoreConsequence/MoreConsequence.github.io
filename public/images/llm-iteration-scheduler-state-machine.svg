<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">连续批处理调度状态机与分块预填充（Chunked Prefill）混部</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">三队列流转（Waiting ──► Running ◄──► Swapped）与 Prefill/Decode 混合批次算力配平</text>
  </g>

  <!-- Main Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Top: 3-Queue Lifecycle Flow (400px x 140px) -->
    <g transform="translate(40, 20)">
      <!-- Queue: Waiting -->
      <g transform="translate(0, 0)">
        <rect width="180" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="90" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Waiting 队列</text>
        <text x="90" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">新请求排队等待分配 Block</text>
      </g>

      <!-- Queue: Running -->
      <g transform="translate(260, 0)">
        <rect width="200" height="60" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
        <text x="100" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">⚡ Running 队列 (GPU)</text>
        <text x="100" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#059669" text-anchor="middle">每个 Iteration 执行 Forward</text>
      </g>

      <!-- Queue: Swapped (CPU RAM) -->
      <g transform="translate(540, 0)">
        <rect width="200" height="60" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
        <text x="100" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Swapped 队列 (CPU)</text>
        <text x="100" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#ea580c" text-anchor="middle">显存不足时换出至主机内存</text>
      </g>

      <!-- Transitions -->
      <!-- Waiting -> Running -->
      <path d="M 180 30 L 255 30" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
      <text x="218" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">调度加入</text>

      <!-- Running -> Swapped -->
      <path d="M 460 20 L 535 20" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
      <text x="498" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#ea580c" text-anchor="middle">显存耗尽抢占</text>

      <!-- Swapped -> Running -->
      <path d="M 540 45 L 465 45" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
      <text x="498" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#10b981" text-anchor="middle">换回恢复</text>
    </g>

    <!-- Bottom: Chunked Prefill Mechanics (2 Columns) -->
    <g transform="translate(20, 110)">
      <!-- Left: The Problem of Prefill Bubble -->
      <g>
        <rect width="420" height="135" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect width="420" height="28" rx="6" fill="#f1f5f9"/>
        <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">1. 长 Prompt 预填充引发的“卡顿气泡”</text>

        <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">
          <text x="0" y="16">• 当 32K 超长 Prompt 进入系统时，传统 Prefill 需独占 GPU 几百毫秒；</text>
          <text x="0" y="32">• 正在平稳 Decode 输出的几十个在途请求被强制冻结等待；</text>
          <text x="0" y="48" font-weight="700" fill="#dc2626">• 结果：客户端流式文字输出出现严重卡顿，ITL（逐字时延）严重劣化！</text>
        </g>
      </g>

      <!-- Right: Chunked Prefill Solution -->
      <g transform="translate(440, 0)">
        <rect width="420" height="135" rx="6" fill="#f0fdf4" stroke="#86efac"/>
        <rect width="420" height="28" rx="6" fill="#dcfce7"/>
        <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">2. 分块预填充（Chunked Prefill）混部</text>

        <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#14532d">
          <text x="0" y="16">• 将 32K Prompt 拆分为例如 512 Tokens 的微块（Chunk）；</text>
          <text x="0" y="32">• 每个 Iteration：<tspan font-weight="700" fill="#2563eb">“1 个 512 预填充块 + 40 个在途 Decode Tokens”</tspan> 混部！</text>
          <text x="0" y="48" font-weight="700" fill="#047857">• 既跑满了 GPU 计算核心，又保证了在线用户的逐字输出极其丝滑！</text>
        </g>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">工业级调度哲学：</tspan> 大模型推理后端的核心目标是 <tspan font-weight="700" fill="#2563eb">“首字时延 TTFT 与逐字时延 ITL 的双重 Pareto 最优”</tspan>；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
        Chunked Prefill 完美平衡了计算密集型（Compute-bound）与带宽受限型（Memory-bound）任务。
      </text>
    </g>
  </g>
</svg>
