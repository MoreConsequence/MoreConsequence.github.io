<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="proxy-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr-blue-prx" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber-prx" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#proxy-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="34" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">MULTI-HOP PROXY TRAVERSAL · IP EXTRACTION PIPELINE</text>
  <text x="40" y="54" fill="#0f172a" font-size="16" font-weight="700">五级代理链穿透与真实客户端公网 IP 安全提取管线</text>

  <!-- ================= TOP: 4-HOP FLOW CARDS (x: 40 ~ 920, w: 880) ================= -->
  
  <!-- Hop 1: Real Client [x: 40 ~ 240, w: 200] -->
  <g transform="translate(40, 80)">
    <rect width="200" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="5" rx="2" fill="#3b82f6"/>
    <text x="14" y="26" fill="#1e40af" font-size="9" font-weight="700" class="mono">HOP 1 · ORIGIN CLIENT</text>
    <text x="14" y="46" fill="#0f172a" font-size="13" font-weight="700">真实用户发起端</text>
    <line x1="14" y1="58" x2="186" y2="58" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="78" fill="#475569" font-size="11">公网出口真实 IP：</text>
    <rect x="14" y="86" width="172" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="100" y="102" fill="#1e40af" font-size="11" font-weight="700" class="mono" text-anchor="middle">222.128.1.1</text>
    <text x="14" y="130" fill="#64748b" font-size="10">中国联通 · 宽带发起</text>
  </g>

  <!-- Arrow 1 -> 2 [x: 240 -> 266] -->
  <path d="M 240,152 H 264" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-prx)"/>

  <!-- Hop 2: Cloudflare Edge [x: 266 ~ 466, w: 200] -->
  <g transform="translate(266, 80)">
    <rect width="200" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="5" rx="2" fill="#2563eb"/>
    <text x="14" y="26" fill="#1d4ed8" font-size="9" font-weight="700" class="mono">HOP 2 · CDN EDGE</text>
    <text x="14" y="46" fill="#0f172a" font-size="13" font-weight="700">CDN / 边缘加速节点</text>
    <line x1="14" y1="58" x2="186" y2="58" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="78" fill="#475569" font-size="11">自动注入专用标头：</text>
    <rect x="14" y="86" width="172" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="100" y="102" fill="#0f172a" font-size="9.5" font-weight="600" class="mono" text-anchor="middle">CF-Connecting-IP</text>
    <text x="14" y="130" fill="#64748b" font-size="10">透传原始真实 IP</text>
  </g>

  <!-- Arrow 2 -> 3 [x: 466 -> 493] -->
  <path d="M 466,152 H 491" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-prx)"/>

  <!-- Hop 3: SLB & Nginx Gateway [x: 493 ~ 693, w: 200] -->
  <g transform="translate(493, 80)">
    <rect width="200" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="5" rx="2" fill="#1d4ed8"/>
    <text x="14" y="26" fill="#1e40af" font-size="9" font-weight="700" class="mono">HOP 3 · SLB &amp; NGINX</text>
    <text x="14" y="46" fill="#0f172a" font-size="13" font-weight="700">负载均衡与反向代理</text>
    <line x1="14" y1="58" x2="186" y2="58" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="78" fill="#475569" font-size="11">追加多级转发代理链：</text>
    <rect x="14" y="86" width="172" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="100" y="102" fill="#0f172a" font-size="9" font-weight="600" class="mono" text-anchor="middle">X-Forwarded-For</text>
    <text x="14" y="130" fill="#64748b" font-size="10">追加 10.0.1.20 内网跳数</text>
  </g>

  <!-- Arrow 3 -> 4 [x: 693 -> 720] -->
  <path d="M 693,152 H 718" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arr-amber-prx)"/>

  <!-- Hop 4: Go Speed-Node Engine [x: 720 ~ 920, w: 200] -->
  <g transform="translate(720, 80)">
    <rect width="200" height="145" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="5" rx="2" fill="#ea580c"/>
    <text x="14" y="26" fill="#c2410c" font-size="9" font-weight="700" class="mono">HOP 4 · SPEED-NODE</text>
    <text x="14" y="46" fill="#0f172a" font-size="13" font-weight="700">Go 测速服务核心</text>
    <line x1="14" y1="58" x2="186" y2="58" stroke="#fed7aa" stroke-width="1"/>
    <text x="14" y="78" fill="#9a3412" font-size="11" font-weight="700">安全决策优先级提取：</text>
    <rect x="14" y="86" width="172" height="24" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
    <text x="100" y="102" fill="#ea580c" font-size="10" font-weight="700" class="mono" text-anchor="middle">!ip.IsPrivate() 过滤</text>
    <text x="14" y="130" fill="#9a3412" font-size="10" font-weight="700">锁定真实 222.128.1.1</text>
  </g>

  <!-- ================= BOTTOM: PRIORITY DECISION FLOW BAR (x: 40, y: 245, w: 880, h: 105) ================= -->
  <g transform="translate(40, 245)">
    <rect width="880" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="12" width="130" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="81" y="26" fill="#1e40af" font-size="9" font-weight="700" class="mono" text-anchor="middle">DECISION LADDER</text>
    <text x="156" y="27" fill="#0f172a" font-size="13" font-weight="700">ExtractRealClientIP 四级降级决策梯形流</text>

    <!-- Step 1 Badge -->
    <rect x="16" y="44" width="195" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="62" fill="#1e40af" font-size="10" font-weight="700" class="mono">1. CF-Connecting-IP</text>
    <text x="28" y="80" fill="#475569" font-size="9.5">存在且有效公网 IP 则直取</text>

    <!-- Mini Arrow 1 -> 2 -->
    <path d="M 211,68 H 229" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue-prx)"/>

    <!-- Step 2 Badge -->
    <rect x="229" y="44" width="195" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="241" y="62" fill="#1e40af" font-size="10" font-weight="700" class="mono">2. X-Real-IP</text>
    <text x="241" y="80" fill="#475569" font-size="9.5">Nginx 标准代理最可信客户端</text>

    <!-- Mini Arrow 2 -> 3 -->
    <path d="M 424,68 H 442" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue-prx)"/>

    <!-- Step 3 Badge -->
    <rect x="442" y="44" width="205" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="454" y="62" fill="#1e40af" font-size="10" font-weight="700" class="mono">3. X-Forwarded-For 链</text>
    <text x="454" y="80" fill="#475569" font-size="9.5">从左往右剔除私有私网 IP</text>

    <!-- Mini Arrow 3 -> 4 -->
    <path d="M 647,68 H 665" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-amber-prx)"/>

    <!-- Step 4 Badge -->
    <rect x="665" y="44" width="199" height="48" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="677" y="62" fill="#9a3412" font-size="10" font-weight="700" class="mono">4. RemoteAddr 底线</text>
    <text x="677" y="80" fill="#ea580c" font-size="9.5" font-weight="700">直连兜底并拆解端口号</text>
  </g>
</svg>
