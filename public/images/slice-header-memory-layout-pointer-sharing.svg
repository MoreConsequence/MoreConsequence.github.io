<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Slice 头部结构体与底层数组指针脱钩陷阱 (Pointer Decoupling)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">扩容前 (s1 与 s2 指向同一数组，修改相互污染) vs 扩容后 (s2 分配独立新数组，指针脱钩，修改 s2 对 s1 0 影响)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Before Growth -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 扩容前：隐式共享底层数组踩踏</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">s1 := []int{1, 2, 3}; s2 := s1[0:2]</text>
          
          <text y="38" fill="#ef4444">内存状态：</text>
          <text y="52" fill="#fca5a5">• s1 和 s2 的 Data 指针指向同一块堆内存！</text>
          <text y="68" fill="#ef4444">• s2 = append(s2, 999) ──► 恰好未超过 cap(s2)=3</text>
          
          <text y="92" fill="#f87171">💥 恶性副作用：</text>
          <text y="106" fill="#ef4444">• s1[2] 原本的 3 被强行篡改成了 999！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 极隐蔽的数据污染与逻辑穿透；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 并发读写时会直接触发 data race 恐慌；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须使用三索引切片 s[i:j:k] 防御！</text>
      </g>
    </g>

    <!-- Right: After Growth -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 扩容后：指针完全脱钩物理隔离</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">s2 = append(s2, 888) ──► 超出当前 cap 触发 growslice</text>
          
          <text y="38" fill="#86efac">自愈隔离机制：</text>
          <text y="52" fill="#38bdf8">1. runtime 为 s2 分配全新的独立底层数组</text>
          <text y="66" fill="#34d399">2. 将旧数据拷贝到新数组，s2.Data 指向新地址</text>
          <text y="80" fill="#34d399">3. s1 依然保留对旧底层数组的引用，不受丝毫影响！</text>
          
          <text y="106" fill="#4ade80">✓ 双方底层内存彻底解耦，互不干扰！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 掌握切片生命周期与内存脱钩本质；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 消除无意识的浅拷贝副作用；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 资深工程师核心语言内功！</text>
      </g>
    </g>
  </g>
</svg>