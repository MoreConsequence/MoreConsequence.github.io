<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Mini-LSM 读路径四级拦截管线 (Four-Stage Read Pipeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 内存 MemTable 跳表 ──► 2. 布隆过滤器快速排除 ──► 3. Block Cache 内存块直出 ──► 4. SSTable 二分查找 (99% 读操作 0 磁盘 I/O)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 内存 MemTable &amp; Immutable 优先探查 (In-Memory SkipList: 0ms)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">首先在活跃 MemTable 与只读 Immutable 中检索 ──► 命中直接返回（包括 Tombstone 删除标记）</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">热点最近写入数据 100% 内存直出！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. Bloom Filter 布隆过滤器极速拦截 (Negative Filter: 1μs)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">对磁盘上的每个 SSTable 计算 k 个哈希 ──► 若位图为 0，绝对可以 100% 断定该文件不存在该 Key</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">单次计算瞬间排除 99% 的无关 SSTable，消除读放大！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. Block Cache 解压数据块缓存 (LRU Block Cache: 5μs)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">根据 Block Index 定位到目标 4KB Block ──► 检查 Block Cache 内存 ──► 命中则直接内存解析</text>
        <text x="15" y="62" font-size="8" fill="#047857">避免重复进行慢速磁盘解压与解密！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. SSTable 磁盘二分查找兜底 (Direct Disk Binary Search)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">仅在极少数冷数据未命中时读取磁盘 ──► 在 4KB Block 内执行二分查找 ──► 提取目标 Value！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">精妙的四级拦截设计，打造极致的存储引擎读性能！</text>
      </g>
    </g>
  </g>
</svg>