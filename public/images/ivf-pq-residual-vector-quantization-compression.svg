<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="ivf-pq-residual-vector-quantization-compression-title ivf-pq-residual-vector-quantization-compression-desc"><title id="ivf-pq-residual-vector-quantization-compression-title">倒排乘积量化 (IVF-PQ) 残差量化与非对称距离计算 (ADC) 架构</title><desc id="ivf-pq-residual-vector-quantization-compression-desc">倒排乘积量化 (IVF-PQ) 残差量化与非对称距离计算 (ADC) 架构</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">IVF-PQ 倒排乘积量化：1536 维向量压缩 97% 与非对称查表计算 (ADC)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">IVF 倒排分桶粗筛 (K-Means) ──► PQ 子空间正交切分与码本量化 ──► ADC 非对称查表 (0 浮点乘法，吞吐飙升 10 倍)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. PQ (Product Quantization) 极限压缩</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 原始 1536 维 FP32 向量: 6,144 字节</text>
          <text y="28" fill="#f5f5f5">1. 切分为 M=64 个子空间 (每个 24 维)</text>
          <text y="44" fill="#f5f5f5">2. 每个子空间聚类出 256 个质心 (8-bit 索引)</text>
          <text y="60" fill="#f5f5f5">3. 向量被压缩为 64 个字节的 Uint8 数组！</text>

          <text y="88" fill="#f5f5f5">✓ 内存占用从 6.1KB 骤降至 64B (压缩比 96:1)！</text>
          <text y="106" fill="#f5f5f5">✓ 1 亿向量仅需 6.4GB 内存，单机即可装下！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 彻底解决海量向量内存爆炸难题；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 牺牲约 3%~5% 召回率换取百倍容量；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造低成本海量向量检索基座。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. ADC (Asymmetric Distance) 非对称查表</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 查询向量保持 FP32 原始高精度</text>
          <text y="28" fill="#f5f5f5">1. 预先计算 Query 与 64 个码本各 256 质心的距离表</text>
          <text y="44" fill="#f5f5f5">   构建 64 x 256 查找表 (仅 16KB，完美装入 L1 Cache！)</text>

          <text y="68" fill="#f5f5f5">2. 遍历底库向量时: 0 浮点乘加！仅需 64 次内存查表累加！</text>
          <text y="84" fill="#f5f5f5">   Dist = LUT[0][v[0]] + LUT[1][v[1]] + ... + LUT[63][v[63]]</text>

          <text y="108" fill="#f5f5f5">✓ 检索计算速度提升 20 倍以上！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 纯查表操作对 CPU 缓存极其友好；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 结合 IVF 粗筛进一步将搜索范围缩小 99%；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 支撑十亿级超大规模图像与文本检索引擎！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
