<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Cilium eBPF Socket 旁路重定向极速数据流 (Socket Layer Bypass)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">传统路径 (Socket -&gt; TCP/IP -&gt; Qdisc -&gt; veth 虚拟网卡对 -&gt; Bridge -&gt; 目标协议栈: 12 次跨层) vs eBPF sockmap (跨 Pod 内存直接管道对接)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Traditional Veth -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 veth 虚拟网卡对：繁琐协议栈折返跑</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">Pod A ──► 同节点 Pod B 通信链路：</text>
          
          <text y="36" fill="#fca5a5">1. Pod A 用户态写入 Socket</text>
          <text y="50" fill="#ef4444">2. 封装 TCP 报头 ──► IP 报头 ──► 进 veth 虚拟网卡</text>
          <text y="64" fill="#ef4444">3. 陷入 Linux 主机内核协议栈 ──► 查 iptables 规则</text>
          <text y="78" fill="#ef4444">4. 穿过网桥 ──► 进入 Pod B 的 veth ──► 逐层解包</text>
          
          <text y="104" fill="#f87171">🔴 经历 12 次内核层级跨越，产生海量 sk_buff 拷贝！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">性能瓶颈：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 单机内两个容器通信却走了全套物理网络封包流程；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• CPU 消耗严重，微服务调用链长时时延恶化；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 传统 Linux 容器网络的最大开销！</text>
      </g>
    </g>

    <!-- Right: eBPF Sockmap -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Cilium eBPF Sockmap：跨 Pod 内存直接管道直通</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">eBPF sock_ops 内存短路直发：</text>
          
          <text y="36" fill="#86efac">1. TCP 建联时 eBPF 将两个 Socket 存入 sockmap</text>
          <text y="50" fill="#38bdf8">2. Pod A 发送数据到达 Socket 层</text>
          <text y="64" fill="#34d399">3. bpf_msg_redirect_hash 直接将数据包压入 Pod B 的接收队列！</text>
          <text y="78" fill="#4ade80">4. 彻底抹去整个 TCP/IP、veth、Netfilter 协议栈！</text>
          
          <text y="104" fill="#4ade80">✓ 耗时从 120μs 暴降至 15μs (提速 8 倍)！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 纯内存级极速传输，媲美原生 IPC 管道；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 赋予微服务集群接近单机内直接函数调用的极致性能；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 云原生数据平面最高技术丰碑！</text>
      </g>
    </g>
  </g>
</svg>