<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="code-refactoring-risk-mitigation-strangler-fig-title code-refactoring-risk-mitigation-strangler-fig-desc"><title id="code-refactoring-risk-mitigation-strangler-fig-title">绞杀者模式 (Strangler Fig Pattern)：旧单体渐进式路由切流与无缝退役</title><desc id="code-refactoring-risk-mitigation-strangler-fig-desc">绞杀者模式 (Strangler Fig Pattern)：旧单体渐进式路由切流与无缝退役</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">绞杀者模式 (Strangler Fig Pattern) 渐进式架构迁移模型</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">一次性全量推倒重写 (Big Bang Rewrite: 90% 失败率) vs API 网关按路由渐进切流 (10% -&gt; 50% -&gt; 100%，平滑绞杀老系统)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 大爆炸式全量重写：项目烂尾与灾难性风险</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">闭门造车 6 个月完全重新开发：</text>
          <text y="28" fill="#f5f5f5">• 老系统仍在不断演进新增业务功能</text>
          <text y="44" fill="#f5f5f5">• 新系统始终追赶不上老系统的特化逻辑</text>
          <text y="60" fill="#f5f5f5">• 一次性上线切流时突发海量未知 Bug</text>
          <text y="76" fill="#f5f5f5">• 无法局部回滚，被迫整体倒退，项目宣告失败！</text>

          <text y="102" fill="#f5f5f5">🔴 软件工程史上最常见的大型翻车现场！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">典型后果：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 研发团队士气遭受毁灭性打击；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 业务需求长期被冻结无法交付；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 严厉禁止大爆炸式推倒重来！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 绞杀者模式：按路由渐进吞噬与无感替换</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">API Gateway 路由分治流转：</text>

          <text y="36" fill="#f5f5f5">1. 第一步: 重构 /api/v2/orders 并配置网关转发</text>
          <text y="50" fill="#f5f5f5">2. 第二步: 双写验证与影子流量 (Dark Launch)</text>
          <text y="64" fill="#f5f5f5">3. 第三步: 逐步绞杀旧单体中的订单模块代码</text>
          <text y="78" fill="#f5f5f5">4. 第四步: 循环往复，直至老系统完全萎缩下线！</text>

          <text y="104" fill="#f5f5f5">✓ 每一个迭代均有实际生产业务价值产出！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 风险被拆解至单接口级别，随时可秒级回滚；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 业务功能开发与底层重构并行不悖；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 大型系统重构终极成功范式！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
