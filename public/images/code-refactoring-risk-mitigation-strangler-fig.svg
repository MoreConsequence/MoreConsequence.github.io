<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">绞杀者模式 (Strangler Fig Pattern) 渐进式架构迁移模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">一次性全量推倒重写 (Big Bang Rewrite: 90% 失败率) vs API 网关按路由渐进切流 (10% -&gt; 50% -&gt; 100%，平滑绞杀老系统)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Big Bang -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 大爆炸式全量重写：项目烂尾与灾难性风险</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">闭门造车 6 个月完全重新开发：</text>
          <text y="28" fill="#ef4444">• 老系统仍在不断演进新增业务功能</text>
          <text y="44" fill="#ef4444">• 新系统始终追赶不上老系统的特化逻辑</text>
          <text y="60" fill="#fca5a5">• 一次性上线切流时突发海量未知 Bug</text>
          <text y="76" fill="#ef4444">• 无法局部回滚，被迫整体倒退，项目宣告失败！</text>
          
          <text y="102" fill="#f87171">🔴 软件工程史上最常见的大型翻车现场！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">典型后果：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 研发团队士气遭受毁灭性打击；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 业务需求长期被冻结无法交付；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严厉禁止大爆炸式推倒重来！</text>
      </g>
    </g>

    <!-- Right: Strangler Fig -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 绞杀者模式：按路由渐进吞噬与无感替换</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">API Gateway 路由分治流转：</text>
          
          <text y="36" fill="#86efac">1. 第一步: 重构 /api/v2/orders 并配置网关转发</text>
          <text y="50" fill="#38bdf8">2. 第二步: 双写验证与影子流量 (Dark Launch)</text>
          <text y="64" fill="#34d399">3. 第三步: 逐步绞杀旧单体中的订单模块代码</text>
          <text y="78" fill="#4ade80">4. 第四步: 循环往复，直至老系统完全萎缩下线！</text>
          
          <text y="104" fill="#4ade80">✓ 每一个迭代均有实际生产业务价值产出！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 风险被拆解至单接口级别，随时可秒级回滚；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 业务功能开发与底层重构并行不悖；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 大型系统重构终极成功范式！</text>
      </g>
    </g>
  </g>
</svg>