<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="memory-metrics-rss-heapused-gc-retention-table-title memory-metrics-rss-heapused-gc-retention-table-desc"><title id="memory-metrics-rss-heapused-gc-retention-table-title">内存指标三剑客：RSS、heapUsed 与 GC 后保留量的物理意义与排查矩阵</title><desc id="memory-metrics-rss-heapused-gc-retention-table-desc">内存指标三剑客：RSS、heapUsed 与 GC 后保留量的物理意义与排查矩阵</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">内存指标三剑客：RSS、heapUsed 与 GC 后存活量各回答什么问题</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">RSS (操作系统物理常驻内存，回答 OOM 风险) ｜ heapTotal (申请堆空间) ｜ heapUsed (真实对象占用) ｜ GC 后保留量 (真实泄漏指标)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. RSS (物理常驻内存)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 核心回答：进程会不会被 OOM Killer 杀掉？</text>
          <text x="10" y="34" fill="#f5f5f5">• 包含全部物理页 (V8 Heap + C++ 扩展</text>
          <text x="10" y="48" fill="#f5f5f5">  + Buffer 外部内存 + 线程栈 + 共享库)</text>

          <text x="10" y="70" fill="#f5f5f5">特点：</text>
          <text x="10" y="86" fill="#cbd5e1">• GC 回收后，内存并不一定归还 OS</text>
          <text x="10" y="100" fill="#cbd5e1">• 会保留在 glibc / jemalloc 内存池中</text>
          <text x="10" y="118" fill="#f5f5f5">► RSS 高不等于内存泄漏！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">排查场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 容器 Cgroup 内存限制达到 95% 时告警；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 检查 Buffer / C++ Addon 是否未释放；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 服务运维容量规划的核心依据。</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. heapUsed (堆对象占用)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 核心回答：业务代码当前存活了多少 JS 对象？</text>
          <text x="10" y="34" fill="#f5f5f5">• 包含 String、Object、Array、Closure 闭包</text>

          <text x="10" y="56" fill="#f5f5f5">特点：</text>
          <text x="10" y="70" fill="#cbd5e1">• 随着业务请求快速波动（锯齿状锯齿图）</text>
          <text x="10" y="86" fill="#cbd5e1">• 包含大量"即将被回收的临时短命对象"</text>

          <text x="10" y="108" fill="#f5f5f5">► 瞬间峰值高代表瞬时吞吐大，不代表泄漏！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">排查场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 评估单次请求产生的内存垃圾量；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 指导代码进行对象复用与 Buffer 优化；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 优化 CPU GC 消耗。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. GC 后保留量 (真实泄漏指标)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 核心回答：代码是否存在真正的内存泄漏？</text>
          <text x="10" y="34" fill="#f5f5f5">• 每次 Full GC 结束后的基线内存水平</text>

          <text x="10" y="56" fill="#f5f5f5">判断标准：</text>
          <text x="10" y="70" fill="#f5f5f5">• 正常系统: 每次 GC 后基线保持平稳</text>
          <text x="10" y="86" fill="#f5f5f5">• 泄漏系统: 每次 GC 后的基线单调持续上升！</text>

          <text x="10" y="108" fill="#f5f5f5">✓ 唯有 GC 后保留量持续上涨才是铁证！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">排查军规：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 抓取两次 Full GC 后的 Heap Snapshot 做对比；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 排查全局 Map、事件未注销、闭包引用；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 彻底根治生产内存泄漏恶疾！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
