<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="k8s-pod-prestop-hook-sleep-mitigation-title k8s-pod-prestop-hook-sleep-mitigation-desc"><title id="k8s-pod-prestop-hook-sleep-mitigation-title">K8s 滚动发布 502 根因与 preStop sleep 补丁对比</title><desc id="k8s-pod-prestop-hook-sleep-mitigation-desc">K8s 滚动发布 502 根因与 preStop sleep 补丁对比</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">K8s 发布 502 Bad Gateway 产生根因与 preStop 解决模型</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">无 preStop (进程收到 SIGTERM 立即关闭端口，Ingress 路由未及刷新依然派发流量，产生 502) vs 加 preStop 15s (流量平滑过渡，0 报错发布)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 缺 preStop 钩子：滚动发布频繁 502 报警</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">滚动更新触发时序：</text>
          <text y="28" fill="#f5f5f5">1. Pod 收到 SIGTERM 瞬间关闭监听 Socket</text>
          <text y="44" fill="#f5f5f5">2. 但 Ingress / Envoy 网关由于分布式同步延迟</text>
          <text y="60" fill="#f5f5f5">   • 在接下来的 3 秒内依然将用户请求路由发往该 Pod！</text>
          <text y="76" fill="#f5f5f5">3. 操作系统内核返回 TCP RST ──► 客户端收到 502 错误！</text>

          <text y="102" fill="#f5f5f5">🔴 每次线上发布必触发大面积报警与客诉！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产痛点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 业务代码写了优雅停机依然报错；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 忽视了控制平面与数据平面的物理传播时延；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 生产环境必须修复！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 配置 preStop sleep 15s：真正 0 报错平滑发布</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">lifecycle.preStop: exec: command: ["/bin/sleep", "15"]</text>

          <text y="36" fill="#f5f5f5">完美平滑流转：</text>
          <text y="50" fill="#f5f5f5">1. preStop 强制 Pod 继续保持存活并正常服务 15 秒</text>
          <text y="64" fill="#f5f5f5">2. 期间 Ingress 与 kube-proxy 充分完成 Endpoints 剔除</text>
          <text y="78" fill="#f5f5f5">3. 15 秒后新流量已为 0 ──► 发送 SIGTERM 排空老连接退出！</text>

          <text y="104" fill="#f5f5f5">✓ 线上发布成功率 100%，错误率恒为 0.00%！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 终结云原生微服务发布抖动；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 赋予 CI/CD 流水线随时白天发布的强大底气；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 资深 SRE 架构必备黄金配置！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
