<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Jepsen Knossos 线性一致性判定算法：WGL 状态搜索与非法重排序剪枝</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">并发历史日志 (Invoke ──► OK) ──► 寻找全局单调递增的线性化点 (Linearization Point) ──► 发现时序悖论立即精准定位一致性 Bug</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Linearizable Valid -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 合法线性历史：存在有效的顺序状态机</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">Client 1: [invoke: write(x, 1)] ───────► [ok: write(x, 1)]</text>
          <text y="28" fill="#38bdf8">Client 2:         [invoke: read(x)] ──► [ok: read(x) =&gt; 1]</text>
          
          <text y="54" fill="#86efac">验证逻辑：</text>
          <text y="68" fill="#cbd5e1">1. read(x) 的调用区间与 write(x, 1) 重叠</text>
          <text y="82" fill="#cbd5e1">2. 线性化点被安置在写操作完成前夕</text>
          <text y="96" fill="#34d399">3. 读到新值 1 满足寄存器模型语义</text>
          
          <text y="120" fill="#4ade80">✓ Knossos 判定: Linearizable (线性一致性成立！)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">判定原则：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 每一个操作都在其调用与响应之间的某一点瞬间生效；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 任何后发生的操作绝不能读到陈旧状态；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 强共识系统最高标准。</text>
      </g>
    </g>

    <!-- Right: Linearization Violation Bug -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 线性一致性破产：时序时光倒流 Bug</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#86efac">Client 1: [write(x, 1) OK] ── (已彻底完成并响应成功)</text>
          <text y="28" fill="#f87171">Client 2:                    [invoke: read(x)] ──► [read(x) =&gt; 0]</text>
          
          <text y="54" fill="#ef4444">🔴 致命冲突：</text>
          <text y="68" fill="#fca5a5">1. Client 2 在 Client 1 结束后才发起读请求</text>
          <text y="82" fill="#ef4444">2. 却读到了旧值 0！(读取了已灭亡的历史！)</text>
          <text y="96" fill="#ef4444">3. 无法找到任何一条满足全序的合法线性化执行路径！</text>
          
          <text y="120" fill="#ef4444">❌ Knossos 报错: Linearizability Violation Detected!</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">揭露真相：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 精准揪出脏读、幻读、脑裂与复制延迟导致的假强一致；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 曾击溃包括早期 MongoDB、Elasticsearch 等在内的数十款系统；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 分布式系统最严苛的照妖镜！</text>
      </g>
    </g>
  </g>
</svg>