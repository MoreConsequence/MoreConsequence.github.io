<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="rsm-title rsm-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="rsm-title">复制状态机（RSM）分层架构与共识日志驱动模型</title>
  <desc id="rsm-desc">架构图展示客户端写请求经由 Raft 共识模块达成多数派复制、WAL 顺序追加落盘并最终应用至确定性状态机计算的闭环机理。</desc>
  <defs>
    <marker id="rsm-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="rsm-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">DISTRIBUTED CONSENSUS · REPLICATED STATE MACHINE</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">复制状态机（RSM）分层架构与共识日志模型</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">确定性状态机 + 相同顺序的共识日志序列 = 严格一致的分布式内存状态（线性一致性保证）</text>

  <!-- Left: Client (x=40..230, w=190) -->
  <g transform="translate(40, 140)">
    <rect width="190" height="330" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="14" width="68" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="48" y="27" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CLIENT</text>
    <text x="90" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">客户端终端</text>

    <rect x="14" y="48" width="162" height="74" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="70" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">确定性写操作指令</text>
    <text x="24" y="90" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">Write: Set(x, 100)</text>
    <text x="24" y="108" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">OpID: #1024</text>

    <rect x="14" y="132" width="162" height="74" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="154" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">通信语义要求</text>
    <text x="24" y="174" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 线性一致性 (Linearizability)</text>
    <text x="24" y="192" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 严格杜绝读旧值与脏写</text>

    <rect x="14" y="216" width="162" height="96" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="238" fill="#e85d3f" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">最终响应返回</text>
    <text x="24" y="258" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">仅在多数派达成且</text>
    <text x="24" y="278" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">Apply 状态机后</text>
    <text x="24" y="296" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">才向客户端回复 Success</text>
  </g>

  <!-- Arrow Client -> Node (x=230..280) -->
  <text x="254" y="202" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">1. 写指令</text>
  <line x1="230" y1="210" x2="280" y2="210" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#rsm-arr-accent)"/>

  <!-- Middle: Replicated State Machine Node (x=280..640, w=360) - Focal Card -->
  <g transform="translate(280, 140)">
    <rect width="360" height="330" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="14" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="27" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">RSM NODE</text>
    <text x="100" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Raft Leader 节点三层执行内核</text>

    <!-- Layer 1: Consensus Module -->
    <rect x="14" y="46" width="332" height="74" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="26" y="68" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 共识模块 (Raft Consensus Engine)</text>
    <text x="26" y="86" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">全权负责: Leader 选举 · Term 单调性 · 多数派决议判定</text>
    <text x="26" y="104" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">向 Follower 广播 AppendEntries RPC，统计 Quorum ACK</text>

    <!-- Layer 2: WAL Log -->
    <rect x="14" y="128" width="332" height="88" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="148" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. WAL 顺序共识日志 (Append-Only Log)</text>

    <!-- Log Blocks -->
    <rect x="26" y="158" width="90" height="24" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="71" y="174" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">[Idx:1, T:1] x=10</text>

    <rect x="122" y="158" width="90" height="24" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="167" y="174" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">[Idx:2, T:1] y=20</text>

    <rect x="218" y="158" width="118" height="24" rx="2" fill="rgba(232,93,63,0.12)" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="277" y="174" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">[Idx:3, T:2] Set(x,100)</text>

    <text x="26" y="202" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">commitIndex = 3 (达成多数派落盘)</text>

    <!-- Layer 3: State Machine -->
    <rect x="14" y="224" width="332" height="92" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="26" y="244" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">3. 确定性状态机 (Deterministic State Machine)</text>
    <text x="26" y="262" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">按 commitIndex 顺序依次计算：</text>
    <text x="26" y="280" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">Apply(Index 3) ➔ 内存变量更新为 x = 100</text>
    <text x="26" y="298" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">任何节点以相同顺序执行必定得到相同状态</text>
  </g>

  <!-- Arrow Node -> Followers (x=640..710) -->
  <text x="674" y="172" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">2. 复制日志</text>
  <line x1="640" y1="180" x2="710" y2="180" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#rsm-arr-accent)"/>

  <text x="674" y="222" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">3. 多数派ACK</text>
  <line x1="710" y1="230" x2="640" y2="230" stroke="#6b6a64" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#rsm-arr)"/>

  <!-- Right: Followers (x=710..920, w=210) -->
  <g transform="translate(710, 140)">
    <rect width="210" height="330" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="14" width="68" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="48" y="27" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">PEERS</text>
    <text x="90" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Follower 多数派副本</text>

    <!-- Peer 1 -->
    <rect x="14" y="46" width="182" height="126" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="68" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Node 2 (Follower A)</text>
    <text x="24" y="88" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Log: [Idx 1, Idx 2, Idx 3]</text>
    <text x="24" y="106" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Status: Match ✓ (ACK 发送)</text>
    <text x="24" y="124" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">跟随 Leader 推进 commitIndex</text>
    <text x="24" y="142" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">State: x = 100 (一致)</text>

    <!-- Peer 2 -->
    <rect x="14" y="180" width="182" height="132" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="202" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Node 3 (Follower B)</text>
    <text x="24" y="222" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Log: [Idx 1, Idx 2, Idx 3]</text>
    <text x="24" y="240" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Status: Match ✓ (ACK 发送)</text>
    <text x="24" y="258" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">法定多数派达成 (3/3 &gt; 2)</text>
    <text x="24" y="276" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">State: x = 100 (一致)</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="562" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="550" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">客户端与从节点</text>
  <rect x="280" y="550" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="300" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Raft 共识状态机执行核心</text>
  <line x1="510" y1="556" x2="534" y2="556" stroke="#e85d3f" stroke-width="1.5" marker-end="url(#rsm-arr-accent)"/>
  <text x="542" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">共识全序数据流</text>
</svg>
