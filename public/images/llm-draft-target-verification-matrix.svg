<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">投机采样数学无损证明：接受-拒绝采样算法（Acceptance/Rejection Sampling）</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">目标分布 $p(x)$ 与草稿分布 $q(x)$ 的概率比值修正 ──► 严谨证明采样质量零衰减、输出分布严格无损</text>
  </g>

  <!-- Main Content Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Box: Sampling Formula & Mechanics (420px) -->
    <g transform="translate(20, 20)">
      <rect width="420" height="230" rx="6" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="420" height="32" rx="6" fill="#eff6ff"/>
      <text x="210" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">一、 接受概率公式与拒绝修正分布</text>

      <g transform="translate(16, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Acceptance Probability -->
        <rect width="388" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="18" font-weight="700" fill="#0f172a">1. 接受概率 (Acceptance Probability)：</text>
        <text x="12" y="34" font-family="ui-monospace, monospace" font-size="11" fill="#1e40af">P(accept) = min(1,  p(x) / q(x) )</text>

        <!-- Rejection Resampling -->
        <g transform="translate(0, 50)">
          <rect width="388" height="58" rx="4" fill="#f0fdf4" stroke="#86efac"/>
          <text x="12" y="18" font-weight="700" fill="#166534">2. 拒绝时的重采样分布 (Residual Distribution)：</text>
          <text x="12" y="34" font-size="9.5" fill="#14532d">若 Token $x$ 被拒绝，从残差分布重采样：</text>
          <text x="12" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#047857">p'(x) = norm( max(0, p(x) - q(x)) )</text>
        </g>

        <!-- Math invariant -->
        <g transform="translate(0, 114)">
          <rect width="388" height="32" rx="4" fill="#d1fae5"/>
          <text x="194" y="20" font-weight="700" fill="#065f46" text-anchor="middle">数学定理：边缘采样分布严格满足 P(final = x) ≡ p(x)</text>
        </g>
      </g>
    </g>

    <!-- Right Box: Speedup vs Acceptance Rate Alpha (420px) -->
    <g transform="translate(460, 20)">
      <rect width="420" height="230" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect width="420" height="32" rx="6" fill="#f1f5f9"/>
      <text x="210" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">二、 理论加速比与草稿命中率 $\alpha$ 关系</text>

      <g transform="translate(16, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Expected Speedup Formula -->
        <rect width="388" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="18" font-weight="700" fill="#0f172a">📐 单步期望产出 Token 数：</text>
        <text x="12" y="34" font-family="ui-monospace, monospace" font-size="11" fill="#ea580c">E[Tokens] = (1 - α^(K+1)) / (1 - α)</text>

        <!-- Matrix table -->
        <g transform="translate(0, 52)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
          <rect width="388" height="92" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <!-- Row 1 -->
          <text x="12" y="20" font-weight="700" fill="#334155">• 代码生成/结构化 JSON ($\alpha \approx 0.85$):</text>
          <text x="260" y="20" font-weight="700" fill="#16a34a">🚀 真实加速 3.0x ~ 3.8x</text>

          <!-- Row 2 -->
          <text x="12" y="44" font-weight="700" fill="#334155">• 通用自然语言对话 ($\alpha \approx 0.65$):</text>
          <text x="260" y="44" font-weight="700" fill="#2563eb">⚡ 真实加速 2.0x ~ 2.5x</text>

          <!-- Row 3 -->
          <text x="12" y="68" font-weight="700" fill="#334155">• 强数学推导/低确定性 ($\alpha \approx 0.40$):</text>
          <text x="260" y="68" font-weight="700" fill="#64748b">🐢 真实加速 1.2x ~ 1.4x</text>
        </g>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">零代价白嫖算力：</tspan> 投机采样是深度学习领域极少见的 <tspan font-weight="700" fill="#2563eb">“既不需要重新微调训练、又完全无损精度”</tspan> 的纯推理工程优化；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
        特别适合代码补全（Copilot）、SQL 生成和 JSON 提取等模式确定性极高的高价值后端场景。
      </text>
    </g>
  </g>
</svg>
