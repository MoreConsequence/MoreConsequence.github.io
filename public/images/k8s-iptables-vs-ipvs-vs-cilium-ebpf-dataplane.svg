<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="k8s-iptables-vs-ipvs-vs-cilium-ebpf-dataplane-title k8s-iptables-vs-ipvs-vs-cilium-ebpf-dataplane-desc"><title id="k8s-iptables-vs-ipvs-vs-cilium-ebpf-dataplane-title">K8s 容器网络数据平面演进：iptables (O(N) 链) vs IPVS (哈希表) vs Cilium…</title><desc id="k8s-iptables-vs-ipvs-vs-cilium-ebpf-dataplane-desc">K8s 容器网络数据平面演进：iptables (O(N) 链) vs IPVS (哈希表) vs Cilium eBPF (XDP 零拷贝)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Kubernetes Service 网络数据平面三代演进拓扑</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">第 1 代 iptables (O(N) 线性链表扫描，5000 服务时内核 CPU 锁死) ──► 第 2 代 IPVS (IPSet 哈希表 O(1)) ──► 第 3 代 Cilium eBPF (Bypass TCP/IP 栈直通)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. iptables 模式 (O(N) 线性链)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">kube-proxy 维护庞大规则链：</text>

          <text x="10" y="38" fill="#f5f5f5">• 5,000 个 Service 产生 25,000 条规则</text>
          <text x="10" y="54" fill="#f5f5f5">• 数据包逐条线性遍历比对 (O(N))</text>
          <text x="10" y="70" fill="#f5f5f5">• 每次规则更新全量加锁重写内核表</text>

          <text x="10" y="100" fill="#f5f5f5">🔴 导致内核软中断 CPU 打满卡死！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产痛点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 大规模集群网络性能断崖式下跌；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• Pod 滚动发布时网络频繁丢包；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 早期 K8s 最大扩展瓶颈。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. IPVS 模式 (IPSet O(1) 哈希)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">Linux 内核 LVS 负载均衡：</text>

          <text x="10" y="38" fill="#f5f5f5">• 采用 IPSet 哈希表存储服务映射</text>
          <text x="10" y="54" fill="#f5f5f5">• 路由查找复杂度降至 O(1) 常数级</text>
          <text x="10" y="70" fill="#f5f5f5">• 增量更新规则，0 全量重锁</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 轻松支撑万级 Service 规模！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 传统 K8s 大规模集群标准首选；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 支持加权轮询、最小连接等高级算法；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 性能平稳可靠。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. Cilium eBPF (旁路网络栈直发)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">Socket 层 eBPF 字节码劫持：</text>

          <text x="10" y="38" fill="#f5f5f5">• 彻底移除 kube-proxy 与 iptables！</text>
          <text x="10" y="54" fill="#f5f5f5">• 在 sock_ops 阶段直接重写对端 Socket</text>
          <text x="10" y="70" fill="#f5f5f5">• 绕过整个复杂的 Linux TCP/IP 协议栈</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 吞吐提升 300%，延迟降低 50%！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 云原生容器网络终极革命形态；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 深度集成 L7 流量安全与 Hubble 可观测；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代化云原生基础设施巅峰！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
