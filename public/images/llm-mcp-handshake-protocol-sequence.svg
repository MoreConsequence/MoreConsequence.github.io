<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="llm-mcp-handshake-protocol-sequence-title llm-mcp-handshake-protocol-sequence-desc"><title id="llm-mcp-handshake-protocol-sequence-title">Model Context Protocol (MCP) 标准 JSON-RPC 握手与能力协商时序图</title><desc id="llm-mcp-handshake-protocol-sequence-desc">时序流程图展示 MCP Client 与 Server 之间通过 initialize 请求协商协议版本、对齐 capabilities、发送 initialized 通知以及执行 tools/list 工具发现的完整握手协议链。</desc>
  <defs>
    <marker id="hs-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="hs-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">JSON-RPC 2.0 PROTOCOL HANDSHAKE · CAPABILITIES NEGOTIATION</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">MCP 标准 JSON-RPC 握手与能力协商时序</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">initialize (Client 宣告版本与能力) ➔ initialize 响应 (Server 宣告能力表) ➔ notifications/initialized ➔ tools/list</text>

  <!-- 3 Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Step 1 Init (x=40..310, w=270) -->
  <g transform="translate(40, 136)">
    <rect width="270" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="69" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STEP 1 · INIT</text>
    <text x="134" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Client 发起握手</text>

    <!-- Content Box -->
    <rect x="14" y="42" width="242" height="110" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600">method: "initialize"</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• protocolVersion: "2024-11-05"</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• capabilities: { roots: { ... } }</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• clientInfo: { name: "cursor", v: "0.42" }</text>
    <text x="24" y="136" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Strict Schema Compatibility Check</text>

    <!-- Details -->
    <rect x="14" y="162" width="242" height="198" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">握手首帧语义：</text>
    <text x="24" y="204" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 客户端主动宣告自身协议版本与客户端标识；</text>
    <text x="24" y="224" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 声明自己具备的工作区边界感知能力；</text>
    <text x="24" y="244" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 等待服务端协商对齐。</text>
    <line x1="24" y1="258" x2="246" y2="258" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Client-Side Capability Declaration</text>
    <text x="24" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Standard JSON-RPC 2.0 Request</text>
  </g>

  <!-- Arrow 1 (x=310..340) -->
  <text x="325" y="225" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Reply</text>
  <line x1="310" y1="233" x2="340" y2="233" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#hs-arr-accent)"/>

  <!-- Col 2: Step 2 Server Caps (x=340..630, w=290) - Focal -->
  <g transform="translate(340, 136)">
    <rect width="290" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#eb6c36"/>
    <text x="79" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STEP 2 · CAPABILITIES</text>
    <text x="154" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Server 响应能力表</text>

    <!-- Content Box -->
    <rect x="14" y="42" width="262" height="110" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">result.capabilities 声明表</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• tools: { listChanged: true }</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• resources: { subscribe: true }</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• serverInfo: { name: "postgres-mcp" }</text>
    <text x="24" y="136" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Deterministic Capabilities Alignment</text>

    <!-- Details -->
    <rect x="14" y="162" width="262" height="198" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">能力对齐关键：</text>
    <text x="24" y="204" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 服务端明确告知客户端自己支持哪些原语；</text>
    <text x="24" y="224" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 是否支持资源动态订阅与工具列表变更推送；</text>
    <text x="24" y="244" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 建立起类型安全的通信契约！</text>
    <line x1="24" y1="258" x2="266" y2="258" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Contract Negotiation Complete</text>
    <text x="24" y="296" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">能力明确方可进入操作执行期</text>
  </g>

  <!-- Arrow 2 (x=630..660) -->
  <text x="645" y="225" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Ready</text>
  <line x1="630" y1="233" x2="660" y2="233" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#hs-arr-accent)"/>

  <!-- Col 3: Step 3 Tools List (x=660..920, w=260) - Focal -->
  <g transform="translate(660, 136)">
    <rect width="260" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#2d3142"/>
    <text x="69" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STEP 3 · DISCOVER</text>
    <text x="134" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">工具发现与就绪</text>

    <!-- Content Box -->
    <rect x="14" y="42" width="232" height="110" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">notifications/initialized</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1. Client 发送 initialized 确认通知</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. 发起 tools/list 拉取工具 JSON Schema</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">3. 注入 LLM 上下文，会话正式就绪！</text>
    <text x="24" y="136" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Session Enters Steady State</text>

    <!-- Details -->
    <rect x="14" y="162" width="232" height="198" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">稳态运行保障：</text>
    <text x="24" y="204" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 工具 Schema 自动转化为大模型入参；</text>
    <text x="24" y="224" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 任何工具变更通过 notification 动态热更新；</text>
    <text x="24" y="244" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 杜绝重启 Host，实现优雅无感刷新！</text>
    <line x1="24" y1="258" x2="236" y2="258" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Zero-Restart Hot Dynamic Reload</text>
    <text x="24" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Standard Handshake Protocol</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Client 发起握手与 tools/list 工具发现</text>
  <rect x="370" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="390" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Server capabilities 能力表对齐与契约就绪核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
