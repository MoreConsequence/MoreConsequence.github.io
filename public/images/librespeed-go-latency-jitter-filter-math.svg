<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jitter-title jitter-desc">
      <title id="jitter-title">ping 取最小值，jitter 按尖峰方向加权</title>
      <desc id="jitter-desc">Flowchart and worked trace showing instant ping differences feeding an asymmetric jitter update, with ping selected as the minimum measured instant speed.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="jitter-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="jitter-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <text x="40" y="32" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-weight="500" letter-spacing="0.18em">FLOWCHART · PING / JITTER · 59CFF12</text>
      <text x="40" y="68" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400">ping 取最小值，jitter 按尖峰方向加权</text>
      <text x="40" y="96" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">正文假设样本：12、14、11、13 ms；第一 pong 只校准，后续按 instspd 递推</text>

      <!-- Worked trace: the numbers are the article's explicit assumption, not a benchmark. -->
      <rect x="40" y="124" width="880" height="128" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="64" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" letter-spacing="0.12em">WORKED TRACE · ARTICLE ASSUMPTION</text>
      <line x1="112" y1="212" x2="848" y2="212" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <polyline points="160,196 360,164 560,220 760,188" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="160" cy="196" r="4" fill="#4f5d75"/>
      <circle cx="360" cy="164" r="4" fill="#4f5d75"/>
      <circle cx="560" cy="220" r="4" fill="#4f5d75"/>
      <circle cx="760" cy="188" r="4" fill="#4f5d75"/>
      <text x="160" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pong0 = 12</text>
      <text x="360" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">instspd1 = 14</text>
      <text x="560" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">instspd2 = 11</text>
      <text x="760" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">instspd3 = 13</text>
      <text x="160" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">i = 0 · calibrate</text>
      <text x="360" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">i = 1</text>
      <text x="560" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">i = 2</text>
      <text x="760" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">i = 3</text>

      <!-- Orthogonal flowchart connectors are drawn before the nodes. -->
      <line x1="240" y1="320" x2="272" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#jitter-arrow)"/>
      <line x1="520" y1="320" x2="568" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#jitter-arrow)"/>
      <line x1="712" y1="320" x2="744" y2="320" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#jitter-arrow-accent)"/>
      <path d="M 640 360 V 384 Q 640 392 632 392 H 560 Q 552 392 552 400 V 408 Q 552 416 544 416 H 540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#jitter-arrow)"/>

      <!-- Branch labels are masked and kept in open canvas. -->
      <rect x="712" y="272" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="728" y="282" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRUE</text>
      <rect x="576" y="372" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FALSE</text>

      <!-- Flowchart nodes: sample → difference → decision → two weighted updates. -->
      <rect x="48" y="292" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="56" y="300" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="88" y="310" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="144" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif" text-anchor="middle">instspd_i</text>
      <text x="144" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">当前往返耗时</text>

      <rect x="272" y="292" width="248" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="280" y="300" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="312" y="310" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DELTA</text>
      <text x="396" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif" text-anchor="middle">instjitter_i</text>
      <text x="396" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">|instspd_i − instspd_(i−1)|</text>

      <polygon points="640,280 712,320 640,360 568,320" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif" text-anchor="middle">instjitter_i</text>
      <text x="640" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif" text-anchor="middle">&gt; jitter_(i−1)?</text>

      <rect x="744" y="292" width="168" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="752" y="300" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="776" y="310" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPIKE</text>
      <text x="828" y="326" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">jitter_i = 0.3 jitter_(i−1)</text>
      <text x="828" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+ 0.7 instjitter_i</text>

      <rect x="316" y="388" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="324" y="396" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="356" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECOVER</text>
      <text x="428" y="422" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">jitter_i = 0.8 jitter_(i−1)</text>
      <text x="428" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+ 0.2 instjitter_i</text>

      <!-- Worked outputs, distinct from the flow nodes. -->
      <rect x="48" y="468" width="320" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="64" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">PING OUTPUT</text>
      <text x="64" y="512" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">ping = min(14, 11, 13) = 11 ms</text>

      <rect x="392" y="468" width="520" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="408" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">WORKED JITTER UPDATE</text>
      <text x="408" y="512" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">i=2: 3 → jitter=3  ·  i=3: 3×0.8 + 2×0.2 = 2.8 ms</text>

      <!-- Legend: horizontal strip at the bottom. -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="572" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="68" y="582" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">Calculation step</text>

      <polygon points="224,578 236,572 248,578 236,584" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="582" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">Direction check</text>

      <line x1="416" y1="578" x2="448" y2="578" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#jitter-arrow-accent)"/>
      <text x="460" y="582" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">Spike branch · 0.7</text>

      <line x1="672" y1="578" x2="704" y2="578" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#jitter-arrow)"/>
      <text x="716" y="582" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">Recovery branch · 0.2</text>
    </svg>
