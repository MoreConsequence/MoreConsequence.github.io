<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">乐观锁冲突重试税 (CAS Retry) vs 悲观锁排队阻塞税 (SELECT FOR UPDATE)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">低冲突场景 (乐观锁高并发) vs 极高争用场景 (乐观锁重试放大击垮 CPU，悲观锁排队胜出)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Comparison Panes (435px each) -->
    <!-- Left: Optimistic Lock -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 乐观锁 (CAS Version 机制)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="50" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text y="14" fill="#38bdf8">UPDATE account SET balance=balance-10, version=version+1</text>
          <text y="28" fill="#34d399">WHERE id = 888 AND version = 5;</text>
        </g>

        <!-- Pros & Cons -->
        <g transform="translate(0, 60)">
          <rect width="405" height="85" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#1e40af">✓ 低冲突场景 (冲突率 &lt; 10%):</text>
          <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 读写全程无排他行锁，吞吐量极高</text>
          <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 适合读多写少、用户各自修改私有数据的场景</text>
          <text x="10" y="66" font-size="8" font-weight="700" fill="#047857">吞吐可达 50,000+ QPS！</text>
        </g>

        <g transform="translate(0, 155)">
          <rect width="405" height="105" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">❌ 秒杀高争用场景 (重试放大风暴):</text>
          <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 1000 个请求同时抢购 1 件库存：1 个成功，999 个失败！</text>
          <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 999 个客户端全部触发自旋重试，再次打爆数据库 CPU</text>
          <text x="10" y="62" font-size="7.5" fill="#dc2626">• 产生 N^2 级无效查询放大与网络雪崩！</text>
        </g>
      </g>
    </g>

    <!-- Right: Pessimistic Lock -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 悲观锁 (SELECT FOR UPDATE)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="50" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text y="14" fill="#fb923c">BEGIN;</text>
          <text y="28" fill="#fca5a5">SELECT stock FROM items WHERE id = 1 FOR UPDATE;</text>
        </g>

        <!-- Pros & Cons -->
        <g transform="translate(0, 60)">
          <rect width="405" height="85" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#c2410c">✓ 高争用秒杀场景 (争用率 &gt; 90%):</text>
          <text x="10" y="34" font-size="7.5" fill="#9a3412">• 行锁强行串行化排队，1000 个请求排队依次扣减</text>
          <text x="10" y="48" font-size="7.5" fill="#9a3412">• 零无效重试，零网络/CPU 浪费</text>
          <text x="10" y="66" font-size="8" font-weight="700" fill="#ea580c">在热点单行争用下实际吞吐远超乐观锁！</text>
        </g>

        <g transform="translate(0, 155)">
          <rect width="405" height="105" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">❌ 排队等待税与死锁风险：</text>
          <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 持有锁期间若包含慢 RPC 调用，导致整行长时间挂死；</text>
          <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 连接池瞬间被排队线程耗尽；</text>
          <text x="10" y="62" font-size="7.5" fill="#dc2626">• 多资源加锁顺序不一致时极易引发死锁！</text>
        </g>
      </g>
    </g>
  </g>
</svg>