<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="package-json-conditional-exports-dual-hazard-title package-json-conditional-exports-dual-hazard-desc"><title id="package-json-conditional-exports-dual-hazard-title">package.json conditional exports 双包陷阱 (Dual Package Hazard)…</title><desc id="package-json-conditional-exports-dual-hazard-desc">package.json conditional exports 双包陷阱 (Dual Package Hazard) 与 types 排序准则</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">package.json 条件导出 (exports) 与双包单例陷阱消解方案</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">双包陷阱 (ESM 与 CJS 同时加载导致单例分裂产生 2 个全局状态) vs 包装器转发架构 (CJS 包裹 ESM 或统一使用 CJS 状态中枢)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 双包陷阱 (Dual Package Hazard)：单例分裂</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">"exports": { "import": "./esm/index.js", "require": "./cjs/index.js" }</text>

          <text y="36" fill="#f5f5f5">当依赖树中同时存在 import 和 require 时：</text>
          <text y="52" fill="#f5f5f5">1. Node.js 分别实例化 esm/index.js 与 cjs/index.js</text>
          <text y="68" fill="#f5f5f5">2. 内存中存在 2 份独立的全局状态与 Class 定义！</text>
          <text y="84" fill="#f5f5f5">3. a instanceof MyClass 判定为 false！</text>

          <text y="106" fill="#f5f5f5">🔴 导致 Redux/Zustand 全局状态错乱、Symbol 匹配失效！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 极隐蔽的 npm 依赖幽灵 Bug；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 用户端运行时状态互相隔离无法同步；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 开源库维护者第一高频重灾区！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 正确防御：状态单例下沉与严格 types 排序</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// package.json exports 黄金配置准则：</text>
          <text y="28" fill="#f5f5f5">"exports": {</text>
          <text y="42" fill="#f5f5f5">  ".": {</text>
          <text y="56" fill="#f5f5f5">    "types": "./dist/index.d.ts", // 必须写在最前！</text>
          <text y="70" fill="#f5f5f5">    "import": "./dist/index.mjs",</text>
          <text y="84" fill="#f5f5f5">    "require": "./dist/index.cjs"</text>
          <text y="98" fill="#f5f5f5">  }</text>
          <text y="112" fill="#f5f5f5">}</text>
          <text y="126" fill="#f5f5f5">// 内部共享单一 CJS 状态实例，保证 100% 单例一致！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 彻底根除 instanceof 失效与单例分裂；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 兼容 Node.js、Vite、Webpack、Next.js 全生态；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• npm 双包分发金牌标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
