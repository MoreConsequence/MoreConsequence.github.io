<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Tool Calling 自愈闭环：错误反馈注入与模型自主修复时序</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">模型生成残缺入参 ──► Zod 捕获并输出结构化提示 ──► 注入对话历史让模型在下一轮自动修补 ──► 成功率提升至 99.4%</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统粗暴抛错：直接中断整个会话</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 模型输出缺少必填字段: {"path": "main.go"}</text>
          <text y="30" fill="#fca5a5">工具层直接抛出异常: throw new Error("Missing old_str!");</text>
          
          <text y="54" fill="#ef4444">🔴 恶劣后果：</text>
          <text y="70" fill="#ef4444">1. 会话直接崩溃退出，用户看到一堆红字错误栈</text>
          <text y="86" fill="#ef4444">2. 前面耗费数十万 Token 的分析过程彻底白费！</text>
          <text y="102" fill="#f87171">3. 模型根本没有机会了解自己错在哪里并修正！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 大模型复杂多步任务失败率高达 35%；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 用户体验极差；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法投入严苛生产环境！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 自愈反馈流：将错误转化为上下文提示</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 捕获 ZodError 并格式化为工具响应返回</text>
          <text y="28" fill="#86efac">ToolResult: "Error: Missing required parameter 'old_str'.</text>
          <text y="42" fill="#86efac">Expected schema: { path: string, old_str: string, new_str: string }"</text>
          
          <text y="66" fill="#38bdf8">1. 模型收到明确的参数结构指导</text>
          <text y="80" fill="#34d399">2. 下一轮立即生成补齐了 old_str 的正确工具调用！</text>
          <text y="94" fill="#4ade80">3. 整个过程对人类用户完全无感自动修复！</text>
          
          <text y="118" fill="#4ade80">✓ 复杂长任务完成率从 65% 跃升至 99.4%！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 现代编程智能体（Claude Code / Pi）的核心灵魂；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 容错性与自愈力达到工业顶尖水准；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚不可摧的 AI Harness！</text>
      </g>
    </g>
  </g>
</svg>