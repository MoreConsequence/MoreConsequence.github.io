<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Transactional Outbox 模式：PostgreSQL ACID 与 CDC 消息投递</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">在同一个本地事务内同时写入业务数据与 outbox 表 ──► Debezium / WAL 监听捕获 ──► At-Least-Once 投递至消息队列</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Dual Write Bug -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 双写破产：DB 成功但 MQ 发送失败</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">await db.orders.create(order); // DB 写入成功</text>
          <text y="30" fill="#f87171">await kafka.send("order_topic", event); // 💥 网络异常抛错！</text>
          
          <text y="54" fill="#ef4444">🔴 致命不一致：</text>
          <text y="70" fill="#fca5a5">• 订单已在数据库生成，但下游库存服务永远收不到事件！</text>
          <text y="86" fill="#ef4444">• 若先发 MQ 后写 DB，DB 崩溃将导致幽灵消息！</text>
          <text y="102" fill="#f87171">• 分布式环境下无法保证两步原子性！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 数据产生永久性逻辑断层；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 必须耗费海量人工对账脚本修数据；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严禁在生产系统中采用裸双写！</text>
      </g>
    </g>

    <!-- Right: Outbox Solution -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Transactional Outbox + CDC 流水线</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">await db.transaction(async (tx) =&gt; {</text>
          <text y="28" fill="#86efac">  await tx.orders.create(order);</text>
          <text y="42" fill="#86efac">  await tx.outbox.create({ event: "OrderCreated", ... });</text>
          <text y="56" fill="#4ade80">}); // 100% 本地事务原子性！</text>
          
          <text y="78" fill="#38bdf8">► CDC Relay 读取 PostgreSQL WAL 日志投递至 MQ</text>
          <text y="94" fill="#34d399">► 即使 Node.js 进程瞬间断电，0 消息丢失！</text>
          <text y="110" fill="#4ade80">✓ 优雅解耦高并发写与异步消息通信！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 兼具单机事务的简单性与分布式高可用；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑复杂 Agent 长流程可靠执行；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级微服务事件驱动设计典范！</text>
      </g>
    </g>
  </g>
</svg>