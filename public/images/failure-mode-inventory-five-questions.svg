<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fmiqTitle fmiqDesc">
<title id="fmiqTitle">失败模式清单：拿到抽象要填的五个问题</title>
<desc id="fmiqDesc">五问清单包含会不会超时、会不会部分成功、会不会重复执行、会不会重排、失败能不能区分。第五问是前四问的地基，图中用左侧橙色竖线连接，表示失败不可区分时前四问造成的后果都无法在调用点处理。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="32" y="38" fill="#2d3142" font-size="19" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">失败模式清单：拿到任何抽象先填这五问</text>
<text x="32" y="58" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">答不上任何一问，就说明这个抽象在对你隐瞒它没告诉你的东西</text>

<!-- headers -->
<text x="32" y="84" fill="#7a8399" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">问题</text>
<text x="382" y="84" fill="#7a8399" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">通常藏在哪个抽象里</text>
<text x="646" y="84" fill="#7a8399" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">判据</text>

<!-- Row 3.1 -->
<rect x="32" y="96" width="320" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="48" y="118" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">3.1  它会超时吗？</text>
<text x="48" y="136" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">取消的是等待，还是操作本身</text>
<rect x="368" y="96" width="248" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="382" y="126" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">数据库驱动、gRPC deadline</text>
<rect x="632" y="96" width="296" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="646" y="126" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">取消之后底层副作用还在继续吗</text>

<!-- Row 3.2 -->
<rect x="32" y="160" width="320" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="48" y="182" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">3.2  它会部分成功吗？</text>
<text x="48" y="200" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">做了一半时，状态是什么</text>
<rect x="368" y="160" width="248" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="382" y="182" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">批量消费、流式响应</text>
<text x="382" y="198" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">跨资源事务</text>
<rect x="632" y="160" width="296" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="646" y="190" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">失败返回时系统处于什么状态</text>

<!-- Row 3.3 -->
<rect x="32" y="224" width="320" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="48" y="246" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">3.3  它会被重复执行吗？</text>
<text x="48" y="264" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">重试边界在谁那一层</text>
<rect x="368" y="224" width="248" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="382" y="246" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">HTTP client 自动重试</text>
<text x="382" y="262" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">消息队列重投、网关 failover</text>
<rect x="632" y="224" width="296" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="646" y="238" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">重试边界在哪；多层重试</text>
<text x="646" y="254" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">叠加时是乘法还是加法</text>

<!-- Row 3.4 -->
<rect x="32" y="288" width="320" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="48" y="310" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">3.4  它会重排吗？</text>
<text x="48" y="328" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">有因果的调用会乱序抵达吗</text>
<rect x="368" y="288" width="248" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="382" y="302" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">连接池并发、MQ 分区</text>
<text x="382" y="318" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">并发 RPC</text>
<rect x="632" y="288" width="296" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="646" y="318" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">乱序时，谁负责排序</text>

<!-- Row 3.5 (accent) -->
<rect x="32" y="352" width="320" height="52" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
<text x="48" y="374" fill="#eb6c36" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">3.5  失败可以区分吗？</text>
<text x="48" y="392" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">未执行 / 已执行 / 状态未知</text>
<rect x="368" y="352" width="248" height="52" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
<text x="382" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">tx.Commit() 超时</text>
<text x="382" y="390" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">连接重置、HTTP 504</text>
<rect x="632" y="352" width="296" height="52" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
<text x="646" y="382" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">错误类型能让你分辨这三类吗</text>

<!-- foundation bracket: 3.5 underpins 3.1-3.4 -->
<path d="M 20 378 L 20 122 L 32 122" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<line x1="20" y1="186" x2="32" y2="186" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
<line x1="20" y1="250" x2="32" y2="250" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
<line x1="20" y1="314" x2="32" y2="314" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>

<!-- callout -->
<line x1="32" y1="428" x2="928" y2="428" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="32" y="448" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">3.5 是地基：失败不可区分时，前四问造成的后果都无法在调用点处理，唯一的出路是让操作本身幂等。</text>
</svg>