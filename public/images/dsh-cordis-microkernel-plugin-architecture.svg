<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DeepSeek Harness (DSH) 微内核架构：Cordis 驱动的插件化生态</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Cordis 纯净内核 (仅提供生命周期与事件总线) ｜ 一切皆插件 (LLM Client、Tools、Session、UI 全为解耦插件)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Cordis 微内核容器 (Context &amp; Service Registry)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">ctx.provide('llm', new DeepSeekProvider()) ──► ctx.inject(['llm', 'tools'], (ctx) =&gt; ...)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">基于依赖注入 (IoC) 与服务定位器模式，实现核心组件零耦合声明与动态绑定！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 事件广播总线与拦截流水线 (Lifecycle Event Bus)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">ctx.on('before_llm_request') ──► [Prompt Caching 优化插件] ──► [Secret 动态脱敏插件] ──► LLM</text>
        <text x="15" y="62" font-size="8" fill="#047857">任意插件可自由插入请求处理流水线，实现风控、遥测与上下文裁剪的完全解耦！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. MCP (Model Context Protocol) 插件化协议桥接器</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">mcpPlugin.connect('github.com/mcp/postgres') ──► 自动注册为 DSH 运行时标准工具</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">一键连接全球开源 MCP 生态，瞬间获得数百种企业级数据源与 SaaS 自动化操作能力！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 热插拔与自愈更新 (/reload &amp; Plugin Forking)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">plugin.dispose() ──► 卸载旧代码 ──► require.cache 刷新 ──► plugin.apply() 秒级热加载生效！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">无需重启 Agent 主进程，实时热重载开发新插件，打造极致高效的 Agentic 研发体验！</text>
      </g>
    </g>
  </g>
</svg>