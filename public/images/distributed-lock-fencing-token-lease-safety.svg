<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="distributed-lock-fencing-token-lease-safety-title distributed-lock-fencing-token-lease-safety-desc"><title id="distributed-lock-fencing-token-lease-safety-title">分布式锁的物理本质：GC 停顿导致租约过期、互斥失效与 Fencing Token 击穿防线</title><desc id="distributed-lock-fencing-token-lease-safety-desc">分布式锁的物理本质：GC 停顿导致租约过期、互斥失效与 Fencing Token 击穿防线</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分布式锁安全本质：GC 停顿导致租约失效 vs Fencing Token 单调栅栏</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">客户端 A 发生 GC STW (锁租约过期) ──► 客户端 B 抢到新锁 ──► 客户端 A 苏醒写入导致数据损坏 ──► Fencing Token 拒绝旧写入</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 裸分布式锁：无法抵御进程挂起 (STW)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">1. Client 1 成功获取 Redis 锁 (TTL = 10s)</text>
          <text y="30" fill="#f5f5f5">2. Client 1 触发 Full GC，发生 15 秒 Stop-the-world 停顿！</text>
          <text y="46" fill="#f5f5f5">3. 10 秒后 Redis 锁自动过期释放</text>
          <text y="62" fill="#f5f5f5">4. Client 2 成功获取同一把锁并开始写入存储！</text>
          <text y="80" fill="#f5f5f5">5. Client 1 GC 结束苏醒，以为自己仍持有锁，强行写入存储！</text>

          <text y="106" fill="#f5f5f5">🔴 灾难：并发双写引发严重数据脏写覆盖！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">Martin Kleppmann 论断：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 分布式锁卖的不是绝对互斥，而是一段带有效期的可变租约；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 在不可靠网络和非实时操作系统下，锁租约无法保证临界区安全；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 必须在存储端增加最后一道防御栅栏！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ Fencing Token：单调递增版本号物理拦截</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">1. 获取锁时由发号器派发严格单调递增 token:</text>
          <text y="28" fill="#f5f5f5">   Client 1 获得 token = 33; Client 2 获得 token = 34;</text>

          <text y="50" fill="#f5f5f5">2. Client 2 (token=34) 先完成写入，存储记录 max_token = 34</text>
          <text y="68" fill="#f5f5f5">3. Client 1 苏醒发起写入 (携带 token=33):</text>
          <text y="82" fill="#f5f5f5">   存储层判定 33 &lt; max_token(34) ──► 坚决拒绝执行！</text>

          <text y="106" fill="#f5f5f5">✓ 存储端 CAS 比较，从物理法则上 100% 杜绝脏写覆盖！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 结合 Redlock 或 Raft/Etcd Lease 实现两级安全；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 让分布式锁与持久化存储形成安全闭环；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造银行级绝对一致性的分布式互斥保障！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
