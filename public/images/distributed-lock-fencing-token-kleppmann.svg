<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="distributed-lock-fencing-token-kleppmann-title distributed-lock-fencing-token-kleppmann-desc"><title id="distributed-lock-fencing-token-kleppmann-title">分布式锁 Fencing Token 防护模型：Martin Kleppmann 提出的单调递增版本防护</title><desc id="distributed-lock-fencing-token-kleppmann-desc">分布式锁 Fencing Token 防护模型：Martin Kleppmann 提出的单调递增版本防护</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分布式锁 GC 停顿双写危机与 Fencing Token 终极防护</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">GC STW 导致租约过期 (Client 1 复活后踩踏 Client 2) vs Fencing Token (单调递增令牌 + 存储端乐观版本校验，彻底拦截晚到写请求)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ GC STW 停顿：锁自动过期引发并发双写</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">1. Client 1 获取分布式锁 (Lease = 5s)</text>
          <text y="28" fill="#f5f5f5">2. Client 1 触发 Full GC STW 严重卡顿 10 秒！</text>
          <text y="42" fill="#f5f5f5">3. 5 秒后 Redis 锁自动过期释放！</text>
          <text y="56" fill="#f5f5f5">4. Client 2 成功获取锁 ──► 写入存储数据 Data_2</text>
          <text y="70" fill="#f5f5f5">5. Client 1 从 GC 中苏醒 (误以为自己仍持锁！)</text>
          <text y="84" fill="#f5f5f5">6. Client 1 将旧数据 Data_1 强行写入覆盖！</text>

          <text y="108" fill="#f5f5f5">💥 存储数据被严重破坏与脏写污染！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• Martin Kleppmann 提出的经典分布式锁死穴；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 纯依赖时间戳与超时的分布式锁无法防御此问题；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 必须引入服务端版本屏障！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ Fencing Token 栅栏令牌：存储层终极守卫</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">单调递增令牌校验流转：</text>
          <text y="28" fill="#f5f5f5">1. Client 1 获锁 ──► 取得 Token = 33 ──► GC 卡死</text>
          <text y="42" fill="#f5f5f5">2. Client 2 获锁 ──► 取得 Token = 34</text>
          <text y="56" fill="#f5f5f5">3. Client 2 写入存储: Store.Write(Token=34, Data_2)</text>
          <text y="70" fill="#f5f5f5">   • 存储记录最大生效 Token = 34</text>

          <text y="92" fill="#f5f5f5">4. Client 1 苏醒发起写入: Store.Write(Token=33, Data_1)</text>
          <text y="106" fill="#f5f5f5">   • 存储层判定 33 &lt; 34 ──► 坚决拒绝并抛出异常！</text>

          <text y="124" fill="#f5f5f5">✓ 存储数据 100% 绝对安全！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 终结分布式锁被 STW/网络分区击穿的顽疾；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 将并发安全的最后一道防线交由存储端乐观版本守卫；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 分布式系统设计的黄金典范！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
