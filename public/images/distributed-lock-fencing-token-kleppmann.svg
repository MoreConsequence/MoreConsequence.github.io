<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">分布式锁 GC 停顿双写危机与 Fencing Token 终极防护</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">GC STW 导致租约过期 (Client 1 复活后踩踏 Client 2) vs Fencing Token (单调递增令牌 + 存储端乐观版本校验，彻底拦截晚到写请求)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: STW Disaster -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ GC STW 停顿：锁自动过期引发并发双写</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">1. Client 1 获取分布式锁 (Lease = 5s)</text>
          <text y="28" fill="#f87171">2. Client 1 触发 Full GC STW 严重卡顿 10 秒！</text>
          <text y="42" fill="#ef4444">3. 5 秒后 Redis 锁自动过期释放！</text>
          <text y="56" fill="#86efac">4. Client 2 成功获取锁 ──► 写入存储数据 Data_2</text>
          <text y="70" fill="#f87171">5. Client 1 从 GC 中苏醒 (误以为自己仍持锁！)</text>
          <text y="84" fill="#ef4444">6. Client 1 将旧数据 Data_1 强行写入覆盖！</text>
          
          <text y="108" fill="#ef4444">💥 存储数据被严重破坏与脏写污染！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• Martin Kleppmann 提出的经典分布式锁死穴；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 纯依赖时间戳与超时的分布式锁无法防御此问题；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须引入服务端版本屏障！</text>
      </g>
    </g>

    <!-- Right: Fencing Token Fix -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Fencing Token 栅栏令牌：存储层终极守卫</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">单调递增令牌校验流转：</text>
          <text y="28" fill="#86efac">1. Client 1 获锁 ──► 取得 Token = 33 ──► GC 卡死</text>
          <text y="42" fill="#38bdf8">2. Client 2 获锁 ──► 取得 Token = 34</text>
          <text y="56" fill="#34d399">3. Client 2 写入存储: Store.Write(Token=34, Data_2)</text>
          <text y="70" fill="#4ade80">   • 存储记录最大生效 Token = 34</text>
          
          <text y="92" fill="#fb923c">4. Client 1 苏醒发起写入: Store.Write(Token=33, Data_1)</text>
          <text y="106" fill="#ef4444">   • 存储层判定 33 &lt; 34 ──► 坚决拒绝并抛出异常！</text>
          
          <text y="124" fill="#4ade80">✓ 存储数据 100% 绝对安全！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 终结分布式锁被 STW/网络分区击穿的顽疾；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 将并发安全的最后一道防线交由存储端乐观版本守卫；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 分布式系统设计的黄金典范！</text>
      </g>
    </g>
  </g>
</svg>