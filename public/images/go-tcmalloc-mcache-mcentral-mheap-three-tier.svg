<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 内存分配器三级分层架构 (TCMalloc-Derived Allocator)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">mcache (每个 P 独立持有，0 锁纳秒级分配) ──► mcentral (按 68 种 spanClass 全局中心缓存) ──► mheap (页级大内存与 OS 交互)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. mcache (P 私有无锁缓存)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">微小对象分配 (&lt; 32KB):</text>
          
          <text x="10" y="38" fill="#86efac">• 绑定在当前 P 上，单线程独占</text>
          <text x="10" y="54" fill="#38bdf8">• 0 锁并发竞争、0 原子操作</text>
          <text x="10" y="70" fill="#34d399">• tiny 分配器甚至将多个 &lt;16B 变量</text>
          <text x="10" y="86" fill="#34d399">  合并打包在同一个 16 字节槽位！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 单次分配仅需 ~4.5 纳秒！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 99% 的对象分配直接在此命中；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底消灭多核内存锁冲突；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极速分配通道。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. mcentral (全局规格中心)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">当 mcache 的 mspan 耗尽时：</text>
          
          <text x="10" y="38" fill="#86efac">• 依据 spanClass 查找对应 mcentral</text>
          <text x="10" y="54" fill="#cbd5e1">• 分为 partial (有空闲) 与 full 链表</text>
          <text x="10" y="70" fill="#34d399">• 加细粒度互斥锁提取一个新 mspan</text>
          <text x="10" y="86" fill="#34d399">• 充能补充给当前 P 的 mcache</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 锁粒度仅局限在单规格！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 跨 P 共享与协调内存跨度；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 配合 GC 清扫 (Sweep) 回收空间；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 空间利用率中枢。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. mheap (堆与页分配底座)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">大对象 (&gt; 32KB) 或全局补仓：</text>
          
          <text x="10" y="38" fill="#fed7aa">• 以 8KB 物理 Page 为基础粒度</text>
          <text x="10" y="54" fill="#38bdf8">• pageAlloc 基数树极速二分查找空闲页</text>
          <text x="10" y="70" fill="#34d399">• 不足时通过 sysAlloc 向 OS 调用 mmap</text>
          <text x="10" y="86" fill="#4ade80">• 维护全局虚拟内存地址空间映射</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 统一管控数十 GB 巨型堆！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 统一管理虚拟地址与 GC 位图；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 极大减少向操作系统发起 brk/mmap 开销；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级运行时内存管理器最高标杆！</text>
      </g>
    </g>
  </g>
</svg>