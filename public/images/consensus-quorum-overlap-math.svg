<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="quorum-title quorum-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="quorum-title">Quorum 多数派重叠数学原理与鸽巢原理模型</title>
  <desc id="quorum-desc">数学模型图展示 N=5 节点下 R=3 与 W=3 的鸽巢交集重叠，证明读写集合必定存在至少 1 个节点见证最新写入。</desc>
  <defs>
    <marker id="qm-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="qm-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">DISTRIBUTED QUORUM · PIGEONHOLE PRINCIPLE</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">Quorum 多数派重叠数学原理与鸽巢模型</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">只要满足 R + W &gt; N，读集合 S_R 与写集合 S_W 必定至少交叠 1 个物理节点，保证读到最新写入版本</text>

  <!-- Central Cluster Box (y=136..336, h=200) -->
  <g transform="translate(40, 136)">
    <rect width="880" height="200" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>

    <!-- Zone Write Set (x=14..530) -->
    <rect x="14" y="14" width="516" height="172" rx="4" fill="rgba(20,20,19,0.03)" stroke="#141413" stroke-width="0.8" stroke-dasharray="4 4"/>
    <text x="24" y="32" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">WRITE QUORUM SET (W = 3)</text>

    <!-- Zone Read Set (x=350..866) -->
    <rect x="350" y="14" width="516" height="172" rx="4" fill="rgba(232,93,63,0.04)" stroke="#e85d3f" stroke-width="0.8" stroke-dasharray="4 4"/>
    <text x="856" y="32" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">READ QUORUM SET (R = 3)</text>

    <!-- 5 Replicas inside -->
    <!-- Node 1 (Write only) -->
    <g transform="translate(30, 48)">
      <rect width="150" height="120" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="14" y="24" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Node 1 (写确认)</text>
      <text x="14" y="44" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">Val: v2 @ t=100</text>
      <line x1="14" y1="56" x2="136" y2="56" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
      <text x="14" y="74" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Status: Up to date</text>
      <text x="14" y="92" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">成功持久化写事务</text>
    </g>

    <!-- Node 2 (Write only) -->
    <g transform="translate(195, 48)">
      <rect width="150" height="120" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="14" y="24" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Node 2 (写确认)</text>
      <text x="14" y="44" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">Val: v2 @ t=100</text>
      <line x1="14" y1="56" x2="136" y2="56" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
      <text x="14" y="74" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Status: Up to date</text>
      <text x="14" y="92" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">成功持久化写事务</text>
    </g>

    <!-- Node 3 (Intersection Focal Node!) -->
    <g transform="translate(365, 42)">
      <rect width="160" height="132" rx="4" fill="rgba(232,93,63,0.12)" stroke="#e85d3f" stroke-width="1.5"/>
      <rect x="14" y="10" width="132" height="16" rx="2" fill="#e85d3f"/>
      <text x="80" y="22" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">OVERLAP NODE (交集)</text>
      <text x="14" y="46" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Node 3 (见证节点)</text>
      <text x="14" y="66" fill="#e85d3f" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">Val: v2 @ t=100</text>
      <line x1="14" y1="78" x2="146" y2="78" stroke="#e85d3f" stroke-width="0.8"/>
      <text x="14" y="96" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">既参与写又参与读</text>
      <text x="14" y="114" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">|S_W ∩ S_R| ≥ 1 保证！</text>
    </g>

    <!-- Node 4 (Read only - Lagging) -->
    <g transform="translate(540, 48)">
      <rect width="150" height="120" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="14" y="24" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Node 4 (读采样)</text>
      <text x="14" y="44" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">Val: v1 @ t=80</text>
      <line x1="14" y1="56" x2="136" y2="56" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
      <text x="14" y="74" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Status: Lagging</text>
      <text x="14" y="92" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">未收到写，持有旧值</text>
    </g>

    <!-- Node 5 (Read only - Lagging) -->
    <g transform="translate(705, 48)">
      <rect width="150" height="120" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="14" y="24" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Node 5 (读采样)</text>
      <text x="14" y="44" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">Val: v1 @ t=80</text>
      <line x1="14" y1="56" x2="136" y2="56" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
      <text x="14" y="74" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Status: Lagging</text>
      <text x="14" y="92" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">未收到写，持有旧值</text>
    </g>
  </g>

  <!-- Bottom 3 Classic Config Columns (y=356..516, h=160) -->
  <!-- Config A: Balanced -->
  <g transform="translate(40, 356)">
    <rect width="280" height="160" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="80" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="54" y="25" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CONFIG A</text>
    <text x="102" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">均衡强一致 (W=3, R=3)</text>
    <line x1="14" y1="38" x2="266" y2="38" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="14" y="58" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">标准多数派对称配置</text>
    <text x="14" y="76" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">容忍节点故障数: F ≤ ⌊N/2⌋ = 2</text>
    <text x="14" y="94" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">读写时延各消耗 3 节点 RTT</text>
    <text x="14" y="114" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">工业标准：Raft / Paxos / etcd</text>
  </g>

  <!-- Config B: Fast Read -->
  <g transform="translate(340, 356)">
    <rect width="280" height="160" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="80" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="54" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CONFIG B</text>
    <text x="102" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">极致快读 (W=5, R=1)</text>
    <line x1="14" y1="38" x2="266" y2="38" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="14" y="58" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">读多写极少业务模型</text>
    <text x="14" y="76" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">读只需 1 节点响应 (0 延迟)</text>
    <text x="14" y="94" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">写必须 100% 全员确认</text>
    <text x="14" y="114" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">单节点故障即阻塞写入</text>
  </g>

  <!-- Config C: Fast Write -->
  <g transform="translate(640, 356)">
    <rect width="280" height="160" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="80" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="54" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CONFIG C</text>
    <text x="102" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">极致快写 (W=1, R=5)</text>
    <line x1="14" y1="38" x2="266" y2="38" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="14" y="58" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">写密集高并发模型</text>
    <text x="14" y="76" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">写只需 1 节点确认 (超高吞吐)</text>
    <text x="14" y="94" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">读必须全量遍历 5 节点</text>
    <text x="14" y="114" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">读需依赖时间戳现场仲裁</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="538" x2="920" y2="538" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="566" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="554" width="12" height="12" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="1"/>
  <text x="140" y="566" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">普通单向读写节点</text>
  <rect x="290" y="554" width="12" height="12" rx="2" fill="rgba(232,93,63,0.12)" stroke="#e85d3f" stroke-width="1"/>
  <text x="310" y="566" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">多数派交叠节点 (|S_W ∩ S_R| ≥ 1)</text>
</svg>
