<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 切片截断隐式持有：小切片导致 64MB 底层大数组无法被 GC 回收</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">sub := bigSlice[:2] 仍指向原数组指针 ──► GC 判定整个底层大数组存活 ──► copy 独立深拷贝彻底解绑</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Leak Trap -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 截断持有陷阱：64MB 内存被 2 字节锁死</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">func ReadHeader(r io.Reader) []byte {</text>
          <text y="30" fill="#fca5a5">    buf := make([]byte, 64*1024*1024) // 申请 64MB 大缓冲</text>
          <text y="46" fill="#cbd5e1">    r.Read(buf)</text>
          <text y="62" fill="#f87171">    return buf[:2] // 仅返回 2 字节魔数 header</text>
          <text y="78" fill="#f87171">}</text>
          
          <text y="102" fill="#ef4444">🔴 物理内存灾难：</text>
          <text y="118" fill="#fca5a5">返回的切片 array 指针牢牢锁住 64MB 底层数组！</text>
          <text y="134" fill="#fb7185">► 只要该 2 字节切片存活，整个 64MB 永远无法被 GC！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产真实翻车案：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 读取超大日志文件截取 trace_id 存入常驻 map；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 存了 1000 个 16B 字符串，堆内存竟然暴涨到 60GB 撑爆 OOM；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 罪魁祸首：字符串/切片底层大数组全被常驻引用！</text>
      </g>
    </g>

    <!-- Right: copy Solution -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正确姿势：copy 分离分配或三索引截断</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">func ReadHeaderSafe(r io.Reader) []byte {</text>
          <text y="30" fill="#86efac">    buf := make([]byte, 64*1024*1024)</text>
          <text y="46" fill="#cbd5e1">    r.Read(buf)</text>
          <text y="62" fill="#38bdf8">    header := make([]byte, 2) // 分配独立 2 字节小切片</text>
          <text y="78" fill="#34d399">    copy(header, buf[:2])     // 仅拷贝 2 字节内容</text>
          <text y="94" fill="#34d399">    return header             // 64MB buf 瞬间在函数退出后被 GC 回收！</text>
          <text y="110" fill="#34d399">}</text>
          <text y="130" fill="#4ade80">✓ 64MB 临时缓冲准时进入下一次垃圾回收！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级标准：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 任何从大缓冲区截取长生命周期数据的场景，必须 copy 独立存储；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 字符串截取可通过 string(byteSlice) 触发重新分配解绑；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 彻底消除大块内存隐式泄漏！</text>
      </g>
    </g>
  </g>
</svg>