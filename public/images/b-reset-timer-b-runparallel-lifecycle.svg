<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Benchmark 黄金生命周期与并发度量模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 数据集初始化与预热 ──► 2. b.ResetTimer() 重置计时与分配统计 ──► 3. b.RunParallel 多核并发压测 ──► 4. b.ReportAllocs()</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 前期繁重环境准备 (Expensive Setup &amp; Warming)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">加载 100MB 字典、建立数据库连接池、预填充 100 万缓存数据</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">耗时几秒的前置准备工作，绝不能计入核心函数的单次耗时！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 核心隔离：b.ResetTimer() 清零计时器</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">b.ResetTimer() ──► 将当前已耗时间与已分配内存全部抹平归零 ──► 开启真正测量窗口</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">精准剥离初始化噪声的标准动作！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 多核并发真实压测 (b.RunParallel for Multithread Testing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">b.RunParallel(func(pb *testing.PB) { for pb.Next() { ... } }) ──► 创建 GOMAXPROCS 个 Goroutine 并发抢占</text>
        <text x="15" y="62" font-size="8" fill="#047857">真实暴露锁竞争与缓存行伪共享问题！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 堆分配指标输出 (b.ReportAllocs: B/op &amp; allocs/op)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">输出每次调用的堆分配字节与次数 ──► 追求 0 B/op 与 0 allocs/op 的极致无逃逸性能！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Go 高性能工程验收第一金标准！</text>
      </g>
    </g>
  </g>
</svg>