<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="nli-natural-language-inference-entailment-check-title nli-natural-language-inference-entailment-check-desc"><title id="nli-natural-language-inference-entailment-check-title">基于 NLI 自然语言推理的事实蕴含检验：Entailment, Neutral 与 Contradiction</title><desc id="nli-natural-language-inference-entailment-check-desc">基于 NLI 自然语言推理的事实蕴含检验：Entailment, Neutral 与 Contradiction</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">基于 NLI 自然语言推理的三态事实核验状态机 (NLI Verification Engine)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Premise 前提 ──► Hypothesis 假设 ──► 蕴含 Entailment ｜ 中立 Neutral ｜ 矛盾 Contradiction</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 严格蕴含 (Entailment: 100% 真实)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">前提: "Go 1.23 定时器改为无缓冲"</text>
          <text x="10" y="34" fill="#f5f5f5">回答: "Go 1.23 移除了 timer.C 缓冲"</text>

          <text x="10" y="58" fill="#f5f5f5">NLI 逻辑判定：</text>
          <text x="10" y="74" fill="#f5f5f5">• 逻辑上 100% 能够由前提推导成立</text>
          <text x="10" y="90" fill="#f5f5f5">• 赋予最高置信度评分 (1.0)</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 权威事实无误，安全输出！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 具备坚如磐石的物理证据支撑；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 语义等价且 0 篡改；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造可信技术内容。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">2. 事实中立 (Neutral: 证据不足)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">前提: "项目已在 GitHub 开源"</text>
          <text x="10" y="34" fill="#f5f5f5">回答: "项目获得了 10,000 个 Star"</text>

          <text x="10" y="58" fill="#f5f5f5">NLI 逻辑判定：</text>
          <text x="10" y="74" fill="#f5f5f5">• 前提未提及 Star 数，既未证实也未证伪</text>
          <text x="10" y="90" fill="#f5f5f5">• 属于大模型自带先验引发的超范围延伸</text>

          <text x="10" y="114" fill="#f5f5f5">⚠️ 标记为潜在未证实风险！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">处理策略：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 触发二次联网检索补齐证据；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 或在回答中显式注明假设边界；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 严控证据边界。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. 事实矛盾 (Contradiction: 恶性幻觉)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">前提: "该接口默认超时 3 秒"</text>
          <text x="10" y="34" fill="#f5f5f5">回答: "该接口默认无超时永久阻塞"</text>

          <text x="10" y="58" fill="#f5f5f5">NLI 逻辑判定：</text>
          <text x="10" y="74" fill="#f5f5f5">• 与真实依据发生直接颠倒与冲突！</text>
          <text x="10" y="90" fill="#f5f5f5">• 100% 确凿的恶性致命幻觉！</text>

          <text x="10" y="114" fill="#f5f5f5">🔴 立即阻断并触发自动重生成！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 导致开发者写出生产事故级 Bug；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 必须在网关层彻底拦截屏蔽；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 企业级 AI 质量红线！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
