<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">基于 NLI 自然语言推理的三态事实核验状态机 (NLI Verification Engine)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Premise 前提事实 ──► Hypothesis 假设命题 ──► 1. 严格蕴含 (Entailment: 事实成立) ｜ 2. 事实中立 (Neutral: 证据不足) ｜ 3. 事实矛盾 (Contradiction: 严重幻觉)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. 严格蕴含 (Entailment: 100% 真实)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">前提: "Go 1.23 定时器改为无缓冲"</text>
          <text x="10" y="34" fill="#86efac">回答: "Go 1.23 移除了 timer.C 缓冲"</text>
          
          <text x="10" y="58" fill="#38bdf8">NLI 逻辑判定：</text>
          <text x="10" y="74" fill="#34d399">• 逻辑上 100% 能够由前提推导成立</text>
          <text x="10" y="90" fill="#34d399">• 赋予最高置信度评分 (1.0)</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 权威事实无误，安全输出！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 具备坚如磐石的物理证据支撑；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 语义等价且 0 篡改；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造可信技术内容。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 事实中立 (Neutral: 证据不足)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">前提: "项目已在 GitHub 开源"</text>
          <text x="10" y="34" fill="#fed7aa">回答: "项目获得了 10,000 个 Star"</text>
          
          <text x="10" y="58" fill="#38bdf8">NLI 逻辑判定：</text>
          <text x="10" y="74" fill="#fed7aa">• 前提未提及 Star 数，既未证实也未证伪</text>
          <text x="10" y="90" fill="#fb923c">• 属于大模型自带先验引发的超范围延伸</text>
          
          <text x="10" y="114" fill="#fb923c">⚠️ 标记为潜在未证实风险！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">处理策略：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 触发二次联网检索补齐证据；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 或在回答中显式注明假设边界；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 严控证据边界。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">3. 事实矛盾 (Contradiction: 恶性幻觉)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">前提: "该接口默认超时 3 秒"</text>
          <text x="10" y="34" fill="#ef4444">回答: "该接口默认无超时永久阻塞"</text>
          
          <text x="10" y="58" fill="#ef4444">NLI 逻辑判定：</text>
          <text x="10" y="74" fill="#fca5a5">• 与真实依据发生直接颠倒与冲突！</text>
          <text x="10" y="90" fill="#ef4444">• 100% 确凿的恶性致命幻觉！</text>
          
          <text x="10" y="114" fill="#ef4444">🔴 立即阻断并触发自动重生成！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 导致开发者写出生产事故级 Bug；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 必须在网关层彻底拦截屏蔽；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 企业级 AI 质量红线！</text>
      </g>
    </g>
  </g>
</svg>