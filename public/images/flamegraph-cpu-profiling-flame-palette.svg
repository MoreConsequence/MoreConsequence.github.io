<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">火焰图 (Flamegraph) 核心坐标系与平顶山 (Flat Peak) 瓶颈定位</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Y 轴自底向上代表函数调用栈 (Call Stack) ｜ X 轴宽度代表采样总耗时占比 (按字母字典序排列而非时间序) ｜ 顶层宽条即为 CPU 性能热点</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Y 轴：调用栈深度 (Call Stack Depth: Bottom-Up)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">最底部是 main / entrypoint ──► 每一层向上叠加一级子函数调用 ──► 顶层是当前正在执行指令的叶子函数</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">纵向直观展示完整的调用溯源路径！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. X 轴：采样抽样命中占比 (Sample Frequency Width)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">矩形宽度 = 该函数在全量 99Hz 采样中出现的次数比例 (Width = Samples / Total)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">特别警示：X 轴不代表时间先后流逝，而是按字母排序聚合！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 平顶山识别：定位真凶 (Flat Plateau: Direct CPU Consumer)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">若某个顶层函数拥有极宽的“平顶”，说明它自身没有调用子函数却长期占据 CPU 运算！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">典型的密集正则计算、JSON 反序列化或哈希计算瓶颈！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 优化剪枝与收益验收 (Targeted Optimization &amp; Verification)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">针对平顶函数进行算法替换或无拷贝优化 ──► 再次压测对比火焰图宽度缩减 ──► 系统性能飙升！</text>
        <text x="15" y="62" font-size="8" fill="#047857">性能优化工程师最锋利的诊断利剑！</text>
      </g>
    </g>
  </g>
</svg>