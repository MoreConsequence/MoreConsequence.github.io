<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="snowflake-64-bit-binary-layout-title snowflake-64-bit-binary-layout-desc"><title id="snowflake-64-bit-binary-layout-title">Snowflake 雪花算法 64-bit 结构体：1 位符号 + 41 位时间戳 + 10 位机器 ID + 12…</title><desc id="snowflake-64-bit-binary-layout-desc">Snowflake 雪花算法 64-bit 结构体：1 位符号 + 41 位时间戳 + 10 位机器 ID + 12 位序列号</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Snowflake 64 位分布式唯一 ID 底层二进制结构</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1-bit 符号位(恒为0) ｜ 41-bit 毫秒时间戳(支持69年) ｜ 10-bit 工作机器ID(支持1024台) ｜ 12-bit 序列号(单机每毫秒4096个并发)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 1-bit 符号位 (Sign Bit)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">bit [63]: 恒定为 0</text>

          <text x="8" y="38" fill="#f5f5f5">物理意义：</text>
          <text x="8" y="54" fill="#cbd5e1">• 保证生成的 64 位整型</text>
          <text x="8" y="70" fill="#f5f5f5">• 在 Java (long) / Go (int64)</text>
          <text x="8" y="86" fill="#f5f5f5">• 始终为非负正整数！</text>

          <text x="8" y="114" fill="#f5f5f5">✓ 跨语言类型兼容保障！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 避免负数在数据库索引排序混乱；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 简化前后端 JSON 序列化；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 规范化符号位约束。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 41-bit 毫秒时间戳</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">bits [62..22]: (now - epoch)</text>

          <text x="8" y="38" fill="#f5f5f5">容量与寿命：</text>
          <text x="8" y="54" fill="#f5f5f5">• 2^41 毫秒 ≈ 69.7 年</text>
          <text x="8" y="70" fill="#f5f5f5">• 自定义基准时间 (如 2026-01-01)</text>
          <text x="8" y="86" fill="#f5f5f5">• 保证生成的 ID 天然趋势递增！</text>

          <text x="8" y="114" fill="#f5f5f5">✓ 完美适配 B+ 树顺序写入！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 避免数据库聚簇索引页分裂；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 支持直接从 ID 反解生成时间；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 时序自描述能力。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 10-bit 工作机器 ID</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">bits [21..12]: worker_id</text>

          <text x="8" y="38" fill="#f5f5f5">节点规模：</text>
          <text x="8" y="54" fill="#f5f5f5">• 2^10 = 1024 个独立节点</text>
          <text x="8" y="70" fill="#f5f5f5">• 划分: 5 位机房 ID + 5 位机器 ID</text>
          <text x="8" y="86" fill="#f5f5f5">• 通过 ZK/Etcd 启动时租约自动注册</text>

          <text x="8" y="114" fill="#f5f5f5">✓ 杜绝跨节点 ID 碰撞！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 分布式去中心化独立生成；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 0 跨网络 RPC 协调开销；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 纯内存纳秒级极速产出。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">4. 12-bit 毫秒内序列号</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">bits [11..0]: sequence</text>

          <text x="8" y="38" fill="#f5f5f5">并发吞吐极限：</text>
          <text x="8" y="54" fill="#f5f5f5">• 2^12 = 4096 个自增序列</text>
          <text x="8" y="70" fill="#f5f5f5">• 单节点每秒可生成: 409.6 万 ID</text>
          <text x="8" y="86" fill="#f5f5f5">• 溢出时自旋等待至下一毫秒！</text>

          <text x="8" y="114" fill="#f5f5f5">✓ 轻松承载双十一极限洪峰！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 支撑单集群每秒数十亿 ID 生成；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 兼具超高吞吐与全局唯一性；</text>
        <text x="10" y="224" font-size="7.5" fill="#2d3142">• 工业级分布式主键首选方案！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
