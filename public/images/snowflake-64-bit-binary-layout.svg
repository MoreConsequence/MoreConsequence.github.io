<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Snowflake 64 位分布式唯一 ID 底层二进制结构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1-bit 符号位(恒为0) ｜ 41-bit 毫秒时间戳(支持69年) ｜ 10-bit 工作机器ID(支持1024台) ｜ 12-bit 序列号(单机每毫秒4096个并发)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 1-bit 符号位 (Sign Bit)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">bit [63]: 恒定为 0</text>
          
          <text x="8" y="38" fill="#86efac">物理意义：</text>
          <text x="8" y="54" fill="#cbd5e1">• 保证生成的 64 位整型</text>
          <text x="8" y="70" fill="#34d399">• 在 Java (long) / Go (int64)</text>
          <text x="8" y="86" fill="#34d399">• 始终为非负正整数！</text>
          
          <text x="8" y="114" fill="#4ade80">✓ 跨语言类型兼容保障！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 避免负数在数据库索引排序混乱；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 简化前后端 JSON 序列化；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 规范化符号位约束。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 41-bit 毫秒时间戳</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">bits [62..22]: (now - epoch)</text>
          
          <text x="8" y="38" fill="#86efac">容量与寿命：</text>
          <text x="8" y="54" fill="#38bdf8">• 2^41 毫秒 ≈ 69.7 年</text>
          <text x="8" y="70" fill="#34d399">• 自定义基准时间 (如 2026-01-01)</text>
          <text x="8" y="86" fill="#4ade80">• 保证生成的 ID 天然趋势递增！</text>
          
          <text x="8" y="114" fill="#4ade80">✓ 完美适配 B+ 树顺序写入！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免数据库聚簇索引页分裂；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支持直接从 ID 反解生成时间；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 时序自描述能力。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 10-bit 工作机器 ID</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">bits [21..12]: worker_id</text>
          
          <text x="8" y="38" fill="#fed7aa">节点规模：</text>
          <text x="8" y="54" fill="#38bdf8">• 2^10 = 1024 个独立节点</text>
          <text x="8" y="70" fill="#34d399">• 划分: 5 位机房 ID + 5 位机器 ID</text>
          <text x="8" y="86" fill="#4ade80">• 通过 ZK/Etcd 启动时租约自动注册</text>
          
          <text x="8" y="114" fill="#4ade80">✓ 杜绝跨节点 ID 碰撞！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 分布式去中心化独立生成；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 0 跨网络 RPC 协调开销；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 纯内存纳秒级极速产出。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. 12-bit 毫秒内序列号</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">bits [11..0]: sequence</text>
          
          <text x="8" y="38" fill="#e9d5ff">并发吞吐极限：</text>
          <text x="8" y="54" fill="#38bdf8">• 2^12 = 4096 个自增序列</text>
          <text x="8" y="70" fill="#34d399">• 单节点每秒可生成: 409.6 万 ID</text>
          <text x="8" y="86" fill="#4ade80">• 溢出时自旋等待至下一毫秒！</text>
          
          <text x="8" y="114" fill="#4ade80">✓ 轻松承载双十一极限洪峰！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#6b21a8">• 支撑单集群每秒数十亿 ID 生成；</text>
        <text x="10" y="48" font-size="7.5" fill="#6b21a8">• 兼具超高吞吐与全局唯一性；</text>
        <text x="10" y="62" font-size="7.5" fill="#6b21a8">• 工业级分布式主键首选方案！</text>
      </g>
    </g>
  </g>
</svg>