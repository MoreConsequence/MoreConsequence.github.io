<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="static-site-search-indexing-pipeline-title static-site-search-indexing-pipeline-desc"><title id="static-site-search-indexing-pipeline-title">静态博客端侧搜索索引生成：构建期分词、轻量 JSON 载荷与 Fuse.js 模糊匹配</title><desc id="static-site-search-indexing-pipeline-desc">静态博客端侧搜索索引生成：构建期分词、轻量 JSON 载荷与 Fuse.js 模糊匹配</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">静态博客 0 服务端依赖全文搜索架构 (Zero-Backend Client Search)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">构建期提取正文摘要与标题 ──► 压缩生成 150KB search-index.json ──► 客户端首次聚焦延迟加载 ──► Fuse.js 5ms 实时模糊高亮</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 构建期索引精简萃取</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">buildSearchIndex() 算法：</text>

          <text x="10" y="38" fill="#f5f5f5">• 提取 title, description, tags, slug</text>
          <text x="10" y="54" fill="#f5f5f5">• 剥离 Markdown 语法标记提取纯文本</text>
          <text x="10" y="70" fill="#cbd5e1">• 截取前 200 字正文摘要</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 200 篇文章索引压缩至 &lt; 150KB！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 0 运行时数据库查询；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 配合 Brotli 传输体积仅 ~30KB；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 极轻量静态化分发。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 按需延迟加载 (Lazy Fetch)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">客户端交互策略：</text>

          <text x="10" y="38" fill="#f5f5f5">• 首页加载时 0 请求该索引</text>
          <text x="10" y="54" fill="#f5f5f5">• 用户按下 ⌘K 或聚焦搜索框时</text>
          <text x="10" y="70" fill="#f5f5f5">• 触发 fetch('/search-index.json')</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 保证首屏 Lighthouse 性能 100 分！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 杜绝无意义的网络带宽浪费；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 浏览器 HTTP 强缓存一劳永逸；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 体验丝滑无感。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. Fuse.js 模糊匹配与高亮</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">端侧毫秒级匹配：</text>

          <text x="10" y="38" fill="#f5f5f5">• Bitap 算法支持拼写容错</text>
          <text x="10" y="54" fill="#f5f5f5">• 权重矩阵: title(0.5) &gt; tags(0.3) &gt; desc(0.2)</text>
          <text x="10" y="70" fill="#f5f5f5">• 键盘上下键即时定位跳转</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 单次按键响应时延 &lt; 5ms！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 完全离线可用，弱网/断网依然可搜；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 媲美本地原生客户端的极速体验；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 纯静态站点的巅峰工程设计！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
