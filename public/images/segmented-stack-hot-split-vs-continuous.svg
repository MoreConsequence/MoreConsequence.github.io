<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">栈模型架构革命：分段栈 (Segmented) vs 连续栈 (Continuous)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">旧版分段栈 (双向链表挂载，循环处于边界时疯狂触发 allocate/free 热分裂) vs 现代连续栈 (2x 翻倍扩容+数据搬迁，彻底消灭震荡)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Segmented Stack -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ Go ≤ 1.2 分段栈：热分裂 (Hot-Split) 灾难</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">for i := 0; i &lt; 1000000; i++ {</text>
          <text y="28" fill="#ef4444">  heavyCall() // 每次调用恰好跨越当前栈段边界！</text>
          <text y="42" fill="#f87171">}</text>
          
          <text y="66" fill="#ef4444">恶性震荡循环：</text>
          <text y="80" fill="#fca5a5">1. 进入函数: 栈不足 ──► 分配新栈段 (morestack: ~40ns)</text>
          <text y="94" fill="#ef4444">2. 退出函数: 栈段空 ──► 释放新栈段 (lessstack: ~40ns)</text>
          <text y="114" fill="#f87171">🔴 循环内疯狂反复分配释放，性能暴跌 100 倍！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">历史危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 极隐蔽的性能地雷，微小代码改动导致性能崩塌；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 栈段指针不连续导致 Cgo 交互极其痛苦；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• Go 1.3 坚决将其废弃！</text>
      </g>
    </g>

    <!-- Right: Continuous Stack -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Go 1.4+ 连续栈：平滑单调扩容与收缩</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">连续栈空间模型：[ 2KB ──► 4KB ──► 8KB ──► ... ]</text>
          
          <text y="38" fill="#86efac">抗震荡机制：</text>
          <text y="52" fill="#38bdf8">1. 扩容时一次性分配 2x 连续新栈，旧栈数据整体拷贝</text>
          <text y="66" fill="#34d399">2. 函数返回时绝不立即缩栈！</text>
          <text y="80" fill="#34d399">3. 仅在 GC 标记期间发现栈利用率 &lt; 1/4 时才平缓减半收缩</text>
          
          <text y="106" fill="#4ade80">✓ 彻底消灭任何热分裂震荡，执行平稳如镜！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 内存地址绝对物理连续，CPU 缓存预取效率极高；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 兼顾极小内存起点 (2KB) 与超高运行稳定性；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 运行时最成功的架构重构！</text>
      </g>
    </g>
  </g>
</svg>