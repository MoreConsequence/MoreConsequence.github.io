<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="opentelemetry-w3c-trace-context-propagation-title opentelemetry-w3c-trace-context-propagation-desc"><title id="opentelemetry-w3c-trace-context-propagation-title">OpenTelemetry 跨服务链路传播：W3C traceparent (TraceID + SpanID) 与…</title><desc id="opentelemetry-w3c-trace-context-propagation-desc">OpenTelemetry 跨服务链路传播：W3C traceparent (TraceID + SpanID) 与 Baggage 协议</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">OpenTelemetry 跨进程上下文透传机制 (W3C TraceContext)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">HTTP Header: traceparent = 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01 ｜ TraceID 全局统一 ｜ SpanID 父子层级链</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 网关根节点生成 TraceID (Root Span Generation)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">用户 HTTP 请求到达 Ingress ──► 生成全局唯一 128 位 TraceID ──► 开启 Root Span (Span A: 200ms)</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">全链路追踪故事线的起点！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 协议注入与网络透传 (Context Inject: W3C traceparent)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">OTel SDK 自动将 TraceID + 当前 SpanID 注入 gRPC metadata / HTTP Header ──► 跨网传输至订单服务</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">W3C 国际工业级标准透传格式！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 下游提取与子 Span 绑定 (Context Extract &amp; Child Span)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">订单服务提取 Header ──► 创建子 Span B (ParentSpanID = Span A) ──► 挂载业务 Tag 与 Events</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">自动编织成清晰的 DAG 有向无环调用拓扑树！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 异步批处理上报 Jaeger / Tempo (OTLP Export &amp; Visualization)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">后台 Worker 批量上报 OTLP Collector ──► 0 业务主流程阻塞 ──► 监控大盘毫秒级精确定位慢 RPC 瓶颈！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">现代分布式微服务可观测性的终极支柱！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
