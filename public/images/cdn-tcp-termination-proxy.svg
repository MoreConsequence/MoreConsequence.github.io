<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" role="img" aria-labelledby="proxy-title proxy-desc">
<title id="proxy-title">四层 TCP/TLS 终结代理与连接分段 · 时延对比</title>
<desc id="proxy-desc">对比图：左侧直连跨洋 3.0 RTT 约 560ms；右侧边缘终结将握手压缩至本地 15ms，配合预热连接池，命中 17ms、未命中 185ms，期望 33.8ms。</desc>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<text x="40" y="28" fill="#2d3142" font-size="16" font-weight="400" font-family="'Instrument Serif', serif">边缘四层终结代理：把 560ms 斩至 17ms 的分段隔离</text>
<text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" letter-spacing="0.02em">Local Leg 5ms RTT 就近终结 + Backhaul Leg 私网池化复用(0ms 建连) · Mathis 公式 36× 吞吐跃升</text>
