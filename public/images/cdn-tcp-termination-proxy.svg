<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Crisp Tech Editorial Filter -->
    <filter id="soft-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <!-- Markers: 正向定义契约 (No Manual Inversion) -->
    <marker id="seq-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="seq-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="seq-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="seq-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>

    <!-- Subtle Editorial Grid -->
    <pattern id="editorial-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#cbd5e1" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="960" height="560" fill="#ffffff"/>
  <rect width="960" height="560" fill="url(#editorial-grid)"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 24)">
    <text x="0" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#0f172a">
      传统直连握手 vs CDN 边缘四层 TCP/TLS 终结代理物理时序对比
    </text>
    <text x="0" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">
      RTT 物理距离消除 · 分段握手隔离 · 预热保活连接池消除回源握手
    </text>
  </g>

  <!-- 2. Region Stage Panels (底板先画) -->
  <!-- Left Mode: Direct Origin Handshake (Slate/Warning) -->
  <rect x="40" y="80" width="420" height="440" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="52" y="92" width="135" height="22" rx="4" fill="#64748b"/>
  <text x="62" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
    🔴 模式 A：跨洋直连源站
  </text>
  <text x="200" y="107" font-family="ui-monospace, monospace" font-size="11" fill="#dc2626" font-weight="600">
    TTFB = ~630ms (3.5 RTT)
  </text>

  <!-- Right Mode: Edge Termination Proxy (Blue/Production) -->
  <rect x="500" y="80" width="420" height="440" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="512" y="92" width="135" height="22" rx="4" fill="#2563eb"/>
  <text x="522" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
    🟢 模式 B：边缘终结代理
  </text>
  <text x="660" y="107" font-family="ui-monospace, monospace" font-size="11" fill="#059669" font-weight="600">
    TTFB = ~25ms (命中) / ~180ms
  </text>

  <!-- 3. Lifelines: 纵向虚线生命线 (严禁被实体底板遮挡) -->
  <!-- Mode A Lifelines -->
  <line x1="120" y1="160" x2="120" y2="480" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="380" y1="160" x2="380" y2="480" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Mode B Lifelines -->
  <line x1="560" y1="160" x2="560" y2="480" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="710" y1="160" x2="710" y2="480" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="860" y1="160" x2="860" y2="480" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 4. Mode A Sequence Arrows & Messages (直连握手) -->
  <!-- TCP SYN -->
  <path d="M 120 180 L 375 210" stroke="#64748b" stroke-width="1.8" marker-end="url(#seq-slate)"/>
  <rect x="210" y="180" width="80" height="15" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="191" font-family="ui-monospace, monospace" font-size="9" fill="#475569" font-weight="600" text-anchor="middle">TCP SYN (90ms)</text>

  <!-- TCP SYN-ACK -->
  <path d="M 380 220 L 125 250" stroke="#64748b" stroke-width="1.8" marker-end="url(#seq-slate)"/>
  <rect x="200" y="220" width="100" height="15" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="231" font-family="ui-monospace, monospace" font-size="9" fill="#475569" font-weight="600" text-anchor="middle">SYN-ACK (90ms)</text>

  <!-- TLS 1.3 ClientHello -->
  <path d="M 120 265 L 375 295" stroke="#ea580c" stroke-width="1.8" marker-end="url(#seq-orange)"/>
  <rect x="185" y="265" width="130" height="15" rx="3" fill="#ffffff" stroke="#fdba74" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="276" font-family="ui-monospace, monospace" font-size="9" fill="#ea580c" font-weight="600" text-anchor="middle">TLS 1.3 ClientHello</text>

  <!-- TLS 1.3 ServerHello -->
  <path d="M 380 305 L 125 335" stroke="#ea580c" stroke-width="1.8" marker-end="url(#seq-orange)"/>
  <rect x="185" y="305" width="130" height="15" rx="3" fill="#ffffff" stroke="#fdba74" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="316" font-family="ui-monospace, monospace" font-size="9" fill="#ea580c" font-weight="600" text-anchor="middle">ServerHello + Cert</text>

  <!-- HTTP GET + Response -->
  <path d="M 120 350 L 375 380" stroke="#2563eb" stroke-width="1.8" marker-end="url(#seq-blue)"/>
  <rect x="195" y="350" width="110" height="15" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="361" font-family="ui-monospace, monospace" font-size="9" fill="#1d4ed8" font-weight="600" text-anchor="middle">HTTP/2 GET Request</text>

  <path d="M 380 395 L 125 425" stroke="#2563eb" stroke-width="2" marker-end="url(#seq-blue)"/>
  <rect x="195" y="395" width="110" height="15" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="406" font-family="ui-monospace, monospace" font-size="9" fill="#1d4ed8" font-weight="600" text-anchor="middle">200 OK + 1st Byte</text>

  <!-- Mode A Total Bracket -->
  <line x1="90" y1="180" x2="90" y2="425" stroke="#dc2626" stroke-width="2"/>
  <line x1="85" y1="180" x2="95" y2="180" stroke="#dc2626" stroke-width="2"/>
  <line x1="85" y1="425" x2="95" y2="425" stroke="#dc2626" stroke-width="2"/>
  <text x="75" y="305" font-family="ui-monospace, monospace" font-size="11" fill="#dc2626" font-weight="700" text-anchor="end">
    630ms
  </text>

  <!-- 5. Mode B Sequence Arrows & Messages (边缘终结) -->
  <!-- Fast Local TCP (5ms) -->
  <path d="M 560 180 L 705 190" stroke="#059669" stroke-width="2" marker-end="url(#seq-emerald)"/>
  <rect x="585" y="174" width="100" height="14" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="635" y="184" font-family="ui-monospace, monospace" font-size="8.5" fill="#059669" font-weight="600" text-anchor="middle">SYN (5ms 本地)</text>

  <path d="M 710 195 L 565 205" stroke="#059669" stroke-width="2" marker-end="url(#seq-emerald)"/>
  <rect x="585" y="190" width="100" height="14" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="635" y="200" font-family="ui-monospace, monospace" font-size="8.5" fill="#059669" font-weight="600" text-anchor="middle">SYN-ACK (5ms)</text>

  <!-- Fast Local TLS 1.3 (5ms) -->
  <path d="M 560 215 L 705 225" stroke="#059669" stroke-width="2" marker-end="url(#seq-emerald)"/>
  <path d="M 710 230 L 565 240" stroke="#059669" stroke-width="2" marker-end="url(#seq-emerald)"/>
  <rect x="585" y="218" width="100" height="14" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="635" y="228" font-family="ui-monospace, monospace" font-size="8.5" fill="#059669" font-weight="600" text-anchor="middle">TLS 1.3 握手完成</text>

  <!-- L7 Cache Hit Branch (Orange Highlight) -->
  <rect x="545" y="255" width="180" height="50" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="635" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">
    ⚡ 场景 1：边缘静态缓存命中
  </text>
  <text x="635" y="292" font-family="ui-monospace, monospace" font-size="9" fill="#047857" font-weight="600" text-anchor="middle">
    HTTP GET → 200 OK (TTFB = 25ms!)
  </text>

  <!-- Pre-warmed Connection to Origin (Long-lived Pool) -->
  <path d="M 710 340 L 855 365" stroke="#2563eb" stroke-width="2" marker-end="url(#seq-blue)"/>
  <rect x="735" y="340" width="100" height="15" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="785" y="351" font-family="ui-monospace, monospace" font-size="8.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">预热长连接复用</text>

  <path d="M 860 380 L 715 405" stroke="#2563eb" stroke-width="2" marker-end="url(#seq-blue)"/>
  <rect x="735" y="380" width="100" height="15" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="785" y="391" font-family="ui-monospace, monospace" font-size="8.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">源站 API 计算结果</text>

  <path d="M 710 415 L 565 425" stroke="#2563eb" stroke-width="2" marker-end="url(#seq-blue)"/>
  <rect x="585" y="410" width="100" height="14" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="635" y="420" font-family="ui-monospace, monospace" font-size="8.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">极速转发给客户端</text>

  <!-- Mode B Total Comparison Callout -->
  <g transform="translate(535, 445)">
    <rect width="350" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <text x="175" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1e40af" font-weight="700" text-anchor="middle">
      🚀 动态回源免 4 次跨洋握手，冷启动首包延迟从 630ms 降至 180ms
    </text>
  </g>

  <!-- 6. Actor Cards (顶层绘制) -->
  <!-- Mode A Actors -->
  <g transform="translate(70, 125)" filter="url(#soft-shadow)">
    <rect width="100" height="35" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="50" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">📱 终端用户</text>
  </g>

  <g transform="translate(330, 125)" filter="url(#soft-shadow)">
    <rect width="100" height="35" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="50" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">🏢 远端源站</text>
  </g>

  <!-- Mode B Actors -->
  <g transform="translate(510, 125)" filter="url(#soft-shadow)">
    <rect width="100" height="35" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="50" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">📱 终端用户</text>
  </g>

  <g transform="translate(660, 125)" filter="url(#soft-shadow)">
    <rect width="100" height="35" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="50" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">⚡ CDN 边缘</text>
  </g>

  <g transform="translate(810, 125)" filter="url(#soft-shadow)">
    <rect width="100" height="35" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="50" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">🏢 远端源站</text>
  </g>
</svg>
