<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <defs>
    <!-- Crisp Tech Editorial Filter -->
    <filter id="soft-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Markers: 正向定义契约 (No Manual Inversion) -->
    <marker id="seq-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="seq-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="seq-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="seq-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>

    <!-- Subtle Editorial Grid -->
    <pattern id="editorial-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#cbd5e1" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="960" height="580" fill="#ffffff"/>
  <rect width="960" height="580" fill="url(#editorial-grid)"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 24)">
    <text x="0" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#0f172a">
      传统直连握手 vs CDN 边缘四层 TCP/TLS 终结代理物理时序对比
    </text>
    <text x="0" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">
      RTT 物理距离消除 · 分段握手隔离 · 预热保活连接池消除回源握手
    </text>
  </g>

  <!-- 2. Region Stage Panels (Painter's Algorithm: 底板先画) -->
  <!-- Left Mode: Direct Origin Handshake (Slate/Warning) -->
  <rect x="40" y="76" width="420" height="476" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="54" y="90" width="145" height="24" rx="4" fill="#64748b"/>
  <text x="64" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
    🔴 模式 A：跨洋直连源站
  </text>
  <text x="210" y="106" font-family="ui-monospace, monospace" font-size="11" fill="#dc2626" font-weight="600">
    TTFB ≈ 630ms (3.5 RTT)
  </text>

  <!-- Right Mode: Edge Termination Proxy (Blue/Production) -->
  <rect x="490" y="76" width="430" height="476" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="504" y="90" width="145" height="24" rx="4" fill="#2563eb"/>
  <text x="514" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
    🟢 模式 B：边缘终结代理
  </text>
  <text x="660" y="106" font-family="ui-monospace, monospace" font-size="11" fill="#059669" font-weight="600">
    TTFB ≈ 25ms(命中) / 180ms
  </text>

  <!-- 3. Lifelines: 纵向虚线生命线 (严禁被实体底板遮挡) -->
  <!-- Mode A Lifelines -->
  <line x1="115" y1="165" x2="115" y2="485" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="385" y1="165" x2="385" y2="485" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Mode B Lifelines -->
  <line x1="550" y1="165" x2="550" y2="485" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="705" y1="165" x2="705" y2="485" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="860" y1="165" x2="860" y2="485" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 4. Mode A Sequence Arrows & Messages (直连握手) -->
  <!-- TCP SYN -->
  <path d="M 115 180 L 380 205" stroke="#64748b" stroke-width="1.8" marker-end="url(#seq-slate)"/>
  <rect x="185" y="180" width="130" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="193" font-family="ui-monospace, monospace" font-size="9" fill="#475569" font-weight="600" text-anchor="middle">TCP SYN (90ms)</text>

  <!-- TCP SYN-ACK -->
  <path d="M 385 215 L 120 240" stroke="#64748b" stroke-width="1.8" marker-end="url(#seq-slate)"/>
  <rect x="180" y="215" width="140" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="228" font-family="ui-monospace, monospace" font-size="9" fill="#475569" font-weight="600" text-anchor="middle">SYN-ACK (90ms)</text>

  <!-- TLS 1.3 ClientHello -->
  <path d="M 115 255 L 380 280" stroke="#ea580c" stroke-width="1.8" marker-end="url(#seq-orange)"/>
  <rect x="170" y="255" width="160" height="18" rx="4" fill="#ffffff" stroke="#fdba74" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="268" font-family="ui-monospace, monospace" font-size="9" fill="#ea580c" font-weight="600" text-anchor="middle">TLS 1.3 ClientHello</text>

  <!-- TLS 1.3 ServerHello -->
  <path d="M 385 290 L 120 315" stroke="#ea580c" stroke-width="1.8" marker-end="url(#seq-orange)"/>
  <rect x="170" y="290" width="160" height="18" rx="4" fill="#ffffff" stroke="#fdba74" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="303" font-family="ui-monospace, monospace" font-size="9" fill="#ea580c" font-weight="600" text-anchor="middle">ServerHello + Cert</text>

  <!-- HTTP GET + Response -->
  <path d="M 115 330 L 380 355" stroke="#2563eb" stroke-width="1.8" marker-end="url(#seq-blue)"/>
  <rect x="170" y="330" width="160" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="343" font-family="ui-monospace, monospace" font-size="9" fill="#1d4ed8" font-weight="600" text-anchor="middle">HTTP/2 GET Request</text>

  <path d="M 385 365 L 120 390" stroke="#2563eb" stroke-width="2" marker-end="url(#seq-blue)"/>
  <rect x="175" y="365" width="150" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="250" y="378" font-family="ui-monospace, monospace" font-size="9" fill="#1d4ed8" font-weight="600" text-anchor="middle">200 OK + 1st Byte</text>

  <!-- Mode A Total Bracket -->
  <line x1="72" y1="180" x2="72" y2="390" stroke="#dc2626" stroke-width="2"/>
  <line x1="66" y1="180" x2="78" y2="180" stroke="#dc2626" stroke-width="2"/>
  <line x1="66" y1="390" x2="78" y2="390" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="290" font-family="ui-monospace, monospace" font-size="11" fill="#dc2626" font-weight="700" text-anchor="end">
    630ms
  </text>

  <!-- 5. Mode B Sequence Arrows & Messages (边缘终结) -->
  <!-- Fast Local TCP (5ms) -->
  <path d="M 550 180 L 700 190" stroke="#059669" stroke-width="2" marker-end="url(#seq-emerald)"/>
  <rect x="575" y="174" width="110" height="18" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="630" y="187" font-family="ui-monospace, monospace" font-size="8.5" fill="#059669" font-weight="600" text-anchor="middle">SYN (5ms 本地)</text>

  <path d="M 705 198 L 555 208" stroke="#059669" stroke-width="2" marker-end="url(#seq-emerald)"/>
  <rect x="575" y="194" width="110" height="18" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="630" y="207" font-family="ui-monospace, monospace" font-size="8.5" fill="#059669" font-weight="600" text-anchor="middle">SYN-ACK (5ms)</text>

  <!-- Fast Local TLS 1.3 (5ms) -->
  <path d="M 550 220 L 700 230" stroke="#059669" stroke-width="2" marker-end="url(#seq-emerald)"/>
  <path d="M 705 235 L 555 245" stroke="#059669" stroke-width="2" marker-end="url(#seq-emerald)"/>
  <rect x="570" y="222" width="120" height="18" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="630" y="235" font-family="ui-monospace, monospace" font-size="8.5" fill="#059669" font-weight="600" text-anchor="middle">TLS 1.3 本地握手</text>

  <!-- L7 Cache Hit Branch (Green Box) -->
  <rect x="530" y="258" width="200" height="52" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="630" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">
    ⚡ 场景 1：边缘静态缓存命中
  </text>
  <text x="630" y="296" font-family="ui-monospace, monospace" font-size="9" fill="#047857" font-weight="600" text-anchor="middle">
    HTTP GET → 200 OK (TTFB = 25ms)
  </text>

  <!-- Pre-warmed Connection to Origin (Long-lived Pool) -->
  <path d="M 705 335 L 855 355" stroke="#2563eb" stroke-width="2" marker-end="url(#seq-blue)"/>
  <rect x="730" y="333" width="120" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="790" y="346" font-family="ui-monospace, monospace" font-size="8.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">预热长连接池复用</text>

  <path d="M 860 370 L 710 390" stroke="#2563eb" stroke-width="2" marker-end="url(#seq-blue)"/>
  <rect x="730" y="368" width="120" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="790" y="381" font-family="ui-monospace, monospace" font-size="8.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">源站动态 API 计算</text>

  <path d="M 705 405 L 555 415" stroke="#2563eb" stroke-width="2" marker-end="url(#seq-blue)"/>
  <rect x="575" y="400" width="110" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#badge-shadow)"/>
  <text x="630" y="413" font-family="ui-monospace, monospace" font-size="8.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">极速转发客户端</text>

  <!-- Mode B Total Comparison Callout (宽卡片双行排版，彻底避免文字触碰边框) -->
  <g transform="translate(515, 438)">
    <rect width="380" height="42" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <text x="190" y="17" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1e40af" font-weight="700" text-anchor="middle">
      🚀 消除 4 次跨洋握手，动态回源冷启动从 630ms 降至 180ms
    </text>
    <text x="190" y="33" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#059669" font-weight="600" text-anchor="middle">
      ⚡ 静态资源边缘秒级就近命中，首包 TTFB ≤ 25ms
    </text>
  </g>

  <!-- 6. Actor Cards (顶层绘制，加宽至 110~116px 留出 30% 安全边距) -->
  <!-- Mode A Actors -->
  <g transform="translate(60, 125)" filter="url(#soft-shadow)">
    <rect width="110" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="55" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">📱 终端用户</text>
  </g>

  <g transform="translate(330, 125)" filter="url(#soft-shadow)">
    <rect width="110" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="55" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">🏢 远端源站</text>
  </g>

  <!-- Mode B Actors -->
  <g transform="translate(495, 125)" filter="url(#soft-shadow)">
    <rect width="110" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="55" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">📱 终端用户</text>
  </g>

  <g transform="translate(650, 125)" filter="url(#soft-shadow)">
    <rect width="110" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="55" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">⚡ CDN 边缘</text>
  </g>

  <g transform="translate(805, 125)" filter="url(#soft-shadow)">
    <rect width="110" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="55" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">🏢 远端源站</text>
  </g>
</svg>
