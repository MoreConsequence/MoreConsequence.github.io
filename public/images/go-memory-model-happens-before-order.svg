<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 内存模型 Happens-Before 偏序关系四大铁律</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 单协程内按序执行 ｜ 2. go 语句执行先行于新协程运行 ｜ 3. Channel 发送完成先行于对应接收完成 ｜ 4. Mutex Unlock 先行于后续 Lock</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Goroutine 创建保序</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">a = "hello"</text>
          <text x="8" y="34" fill="#86efac">go func() { print(a) }()</text>
          
          <text x="8" y="60" fill="#4ade80">Happens-Before 规则：</text>
          <text x="8" y="76" fill="#cbd5e1">• go 语句本身的执行</text>
          <text x="8" y="92" fill="#cbd5e1">• 绝对先行于新协程的第一行执行</text>
          
          <text x="8" y="118" fill="#4ade80">✓ 保证必能打印 "hello"！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• 协程参数传递时的隐式同步屏障；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 初始化数据 100% 对新协程可见；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 语言级安全承诺。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Channel 同步屏障</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">a = "data"; ch &lt;- 0</text>
          <text x="8" y="34" fill="#38bdf8">&lt;-ch; print(a)</text>
          
          <text x="8" y="60" fill="#86efac">通信同步语义：</text>
          <text x="8" y="76" fill="#cbd5e1">• 发送完成先行于接收完成</text>
          <text x="8" y="92" fill="#34d399">• 充当跨协程 Full Memory Barrier</text>
          
          <text x="8" y="118" fill="#4ade80">✓ 杜绝指令重排可见性问题！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• 无缓冲通道还保障接收先行于发送结束；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• Go CSP 并发哲学的物理基础；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 打造可靠同步桥梁。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 锁解锁与加锁传递</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">mu.Lock(); a = "safe"</text>
          <text x="8" y="34" fill="#fb923c">mu.Unlock()</text>
          
          <text x="8" y="58" fill="#fed7aa">后续加锁：</text>
          <text x="8" y="74" fill="#34d399">• 第 N 次 Unlock</text>
          <text x="8" y="90" fill="#34d399">• 先行于第 N+1 次 Lock 完成</text>
          
          <text x="8" y="118" fill="#4ade80">✓ 临界区状态严格单调收敛！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• Acquire-Release 内存顺序语义；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 跨线程 CPU 缓存一致性强行同步；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 临界区安全守卫。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fef2f2"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">4. 缺少同步的重排陷阱</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#f87171">var a, b int</text>
          <text x="8" y="34" fill="#fca5a5">go func() { a=1; b=2 }()</text>
          <text x="8" y="50" fill="#fca5a5">go func() { if b==2 { print(a) } }()</text>
          
          <text x="8" y="74" fill="#ef4444">💥 无任何同步原语：</text>
          <text x="8" y="90" fill="#ef4444">• CPU 重排可能导致 b=2 先执行！</text>
          <text x="8" y="106" fill="#f87171">• 极其诡异地打印出 a = 0！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产警示：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 不要试图依赖裸标志位自旋通信；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 必须开启 -race 编译检测；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 严防数据竞争 Bug！</text>
      </g>
    </g>
  </g>
</svg>