<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="pool-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr-pool-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-pool-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="pool-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#pool-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="32" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">DYNAMIC ACCELERATION · PRE-WARMED CONNECTION POOL</text>
  <text x="40" y="52" fill="#0f172a" font-size="16" font-weight="700">边缘动态请求终结与私有骨干预热长连接池复用拓扑</text>

  <!-- ================= TOP: THREE STAGE INTERACTION FLOW (x: 40 ~ 920, w: 880) ================= -->
  
  <!-- Left Actor: Client [x: 40 ~ 230, w: 190] -->
  <g transform="translate(40, 75)" filter="url(#pool-shadow)">
    <rect width="190" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="190" height="5" rx="2" fill="#3b82f6"/>
    <text x="14" y="24" fill="#1e40af" font-size="9" font-weight="700" class="mono">CLIENT ENDPOINT</text>
    <text x="14" y="44" fill="#0f172a" font-size="13" font-weight="700">🇨🇳 北京客户端</text>
    <line x1="14" y1="56" x2="176" y2="56" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="74" fill="#475569" font-size="10.5">接入运营商：<tspan font-weight="600">中国联通 AS4837</tspan></text>
    <text x="14" y="94" fill="#475569" font-size="10.5">请求类型：<tspan fill="#ea580c" font-weight="700">POST /api/v1/order</tspan></text>
    <rect x="14" y="104" width="162" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="95" y="121" fill="#1d4ed8" font-size="10" font-weight="700" text-anchor="middle">100% 动态不可缓存请求</text>
  </g>

  <!-- Arrow 1: Local Handshake [x: 230 -> 370] -->
  <path d="M 230,135 H 367" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-pool-blue)"/>
  <rect x="245" y="116" width="105" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="297" y="129" fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle">Local Leg: 4ms 极速握手</text>

  <path d="M 367,165 H 230" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-pool-blue)"/>
  <text x="297" y="180" fill="#64748b" font-size="8.5" text-anchor="middle">POST Payload 数据流</text>

  <!-- Middle Actor: Edge PoP Proxy & Pool Hub [x: 370 ~ 610, w: 240] -->
  <g transform="translate(370, 75)" filter="url(#pool-shadow)">
    <rect width="240" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="5" rx="2" fill="#2563eb"/>
    <text x="14" y="24" fill="#1d4ed8" font-size="9" font-weight="700" class="mono">EDGE PROXY &amp; POOL HUB</text>
    <text x="14" y="44" fill="#0f172a" font-size="13" font-weight="700">⚡ PEK-PoP 代理连接池枢纽</text>
    <line x1="14" y1="56" x2="226" y2="56" stroke="#bfdbfe" stroke-width="1"/>
    
    <!-- Connection Pool Box inside -->
    <rect x="14" y="66" width="212" height="42" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="22" y="82" fill="#1e40af" font-size="9.5" font-weight="700">预热长连接池 (HTTP/2 Multiplex):</text>
    <text x="22" y="98" fill="#059669" font-size="9" font-weight="600" class="mono">Pipe #1 (Active) | Pipe #2 (Warm) | Pipe #3</text>

    <rect x="14" y="114" width="212" height="22" rx="4" fill="#2563eb"/>
    <text x="120" y="129" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">协议终结 + 头部压缩 (HPACK)</text>
  </g>

  <!-- Arrow 2: Backhaul Pipeline [x: 610 -> 750] -->
  <path d="M 610,135 H 747" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-pool-orange)"/>
  <rect x="625" y="116" width="105" height="18" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="0.8"/>
  <text x="677" y="129" fill="#ea580c" font-size="9" font-weight="700" text-anchor="middle">Backhaul: 0ms 建连复用</text>

  <path d="M 747,165 H 610" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-pool-orange)"/>
  <text x="677" y="180" fill="#c2410c" font-size="8.5" text-anchor="middle">跨洋骨干专线即时回包</text>

  <!-- Right Actor: Origin Server [x: 750 ~ 920, w: 170] -->
  <g transform="translate(750, 75)" filter="url(#pool-shadow)">
    <rect width="170" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="5" rx="2" fill="#701a75"/>
    <text x="14" y="24" fill="#701a75" font-size="9" font-weight="700" class="mono">ORIGIN BACKEND</text>
    <text x="14" y="44" fill="#0f172a" font-size="13" font-weight="700">🏢 弗吉尼亚源站</text>
    <line x1="14" y1="56" x2="156" y2="56" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="74" fill="#475569" font-size="10.5">业务处理：<tspan font-weight="700">20ms 计算</tspan></text>
    <text x="14" y="94" fill="#475569" font-size="10.5">入站建连：<tspan fill="#059669" font-weight="700">0 次重复握手</tspan></text>
    <rect x="14" y="104" width="142" height="26" rx="4" fill="#fdf4ff" stroke="#f0abfc" stroke-width="0.8"/>
    <text x="85" y="121" fill="#86198f" font-size="10" font-weight="700" text-anchor="middle">数据库与核心业务</text>
  </g>


  <!-- ================= BOTTOM: QUANTITATIVE BENEFIT SUMMARY (x: 40, y: 245, w: 880, h: 185) ================= -->
  <g transform="translate(40, 245)">
    <rect width="880" height="185" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Title -->
    <rect x="16" y="12" width="220" height="22" rx="4" fill="#1e40af"/>
    <text x="126" y="27" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">动态请求加速量化物理收益推导</text>

    <!-- Column 1: Direct Origin (Red Alert) [x: 16 ~ 430, w: 414] -->
    <g transform="translate(16, 44)">
      <rect width="414" height="125" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="24" fill="#991b1b" font-size="11.5" font-weight="700">无 CDN 加速：跨洋端到端全量握手</text>
      <line x1="14" y1="34" x2="400" y2="34" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="54" fill="#475569" font-size="10.5">1. TCP 3 次握手跨洋往返：<tspan font-weight="700" fill="#dc2626">1.0 RTT = 180 ms</tspan></text>
      <text x="14" y="74" fill="#475569" font-size="10.5">2. TLS 1.3 密钥协商跨洋往返：<tspan font-weight="700" fill="#dc2626">1.0 RTT = 180 ms</tspan></text>
      <text x="14" y="94" fill="#475569" font-size="10.5">3. 动态 HTTP POST 请求与响应传输：<tspan font-weight="700" fill="#dc2626">1.0 RTT + 20ms = 200 ms</tspan></text>
      <text x="14" y="114" fill="#dc2626" font-size="11" font-weight="700">端到端总时延 TTFB = 180 + 180 + 200 = 560 ms</text>
    </g>

    <!-- Column 2: CDN DCA Acceleration (Green Success) [x: 450 ~ 864, w: 414] -->
    <g transform="translate(450, 44)">
      <rect width="414" height="125" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
      <text x="14" y="24" fill="#9a3412" font-size="11.5" font-weight="700">CDN 动态加速：边缘终结 + 预热连接池</text>
      <line x1="14" y1="34" x2="400" y2="34" stroke="#fed7aa" stroke-width="1"/>
      <text x="14" y="54" fill="#475569" font-size="10.5">1. 本地边缘 TCP 握手 + TLS 1.3 协商：<tspan font-weight="700" fill="#059669">2.0 Local RTT = 8 ms</tspan></text>
      <text x="14" y="74" fill="#475569" font-size="10.5">2. 跨洋骨干长连接池复用：<tspan font-weight="700" fill="#059669">0 ms 握手建连开销</tspan></text>
      <text x="14" y="94" fill="#475569" font-size="10.5">3. 智能多跳专网传输 + 业务计算：<tspan font-weight="700" fill="#059669">1.0 Backhaul RTT + 20ms = 175 ms</tspan></text>
      <text x="14" y="114" fill="#059669" font-size="11" font-weight="700">端到端总时延 TTFB = 8 + 175 = 183 ms (时延暴降 67%！)</text>
    </g>
  </g>
</svg>
