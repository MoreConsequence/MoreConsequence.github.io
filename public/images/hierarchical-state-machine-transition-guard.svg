<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 状态机强类型守卫：XState 模式与编译期非法跃迁拦截</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Idle ──► Thinking ──► ToolExecuting ──► ErrorHealing ──► Finished ｜ 严格有限状态集合与 TypeScript Discriminated Unions 窄化</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Discriminated Union 联合类型定义 (Strict State Contract)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">type State = { status: 'idle' } | { status: 'thinking', prompt: string } | { status: 'executing', tool: ToolCall }</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">每个状态绑定其专属的上下文负载（Context Payload），消除非法字段访问！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 状态转移守卫函数 (Transition Guards &amp; Reducer)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">transition(currentState, event): State ──► 仅允许声明过的合法边跃迁，非法事件抛出编译错误</text>
        <text x="15" y="62" font-size="8" fill="#047857">杜绝直接在代码中通过 obj.status = '...' 进行野指针式修改！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 异常自愈环路 (Error Self-Healing Loop)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">ToolExecuting 抛错 ──► 状态原子迁移至 ErrorHealing(retryCount &lt; 3) ──► 组装错误反馈重新思考</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将故障作为确定性状态纳入状态机模型，而非不可控的全局崩塌！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 时空回溯与快照恢复 (Time-Travel Debugging)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">每次状态转移产生不可变 StateEvent ──► 存入会话日志 ──► 随时重放任意历史瞬间</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">为复杂多步 Agent 提供完美的调试可视化与确定性复现能力！</text>
      </g>
    </g>
  </g>
</svg>