<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ORACT 混沌实验实验室：给 Agent 注入确定性崩溃与时钟漂移</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 进程强杀 (Kill-9) ──► 2. 网络丢包与超时 ──► 3. 磁盘 I/O 错误注入 ──► 4. 自动化恢复断言 100% 0 幽灵副作用</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">1. 临界区强杀故障注入 (Mid-Flight SIGKILL Injection)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">在 LLM 生成一半、工具执行途中、日志落盘瞬时等 100 个随机临界点注入 kill -9 强杀进程</text>
      <text x="15" y="62" font-size="8" fill="#7f1d1d">检验系统是否会在极端掉电情况下留下半损坏文件或状态锁死死结！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">2. 虚拟网络混沌与超时模拟 (Simulated Network Chaos)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">注入 30% 丢包率、5 秒随机时延、HTTP 429 速率限制与 503 网关不可用</text>
        <text x="15" y="62" font-size="8" fill="#1d4ed8">断言指数退避、熔断保护与取消信号传递链条全部正常生效，0 协程泄漏！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 存储层断电与坏块注入 (Disk Failure Injection)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">模拟 SQLite 写入返回 SQLITE_BUSY / SQLITE_IOERR，以及磁盘写满 ENOSPC</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">断言 WAL 事务优雅回滚，待磁盘恢复后无损重新接续任务！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 自动化回归一致性验收 (Automated Recovery Verification)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">进程自愈启动 ──► assert(recoveredState == expectedState) ──► 副作用重试 Exactly-Once</text>
        <text x="15" y="62" font-size="8" fill="#047857">10,000 次混沌随机测试 100% 绿灯，方可打上"生产级高可靠"发布认证！</text>
      </g>
    </g>
  </g>
</svg>