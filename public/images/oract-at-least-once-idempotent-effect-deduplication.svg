<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Oract 副作用至少一次 (At-Least-Once) 投递与幂等去重防线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">网络抖动重发请求 ──► 携带全局唯一 Idempotency-Key: eff_101 ──► 目标系统去重表拦截 ──► 保证物理世界 Exactly-Once</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Non-Idempotent Hazard -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 无幂等重试：网络抖动引发重复扣款</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">POST /api/charge 成功执行但 ACK 网络丢包：</text>
          
          <text y="38" fill="#ef4444">灾难后果：</text>
          <text y="52" fill="#fca5a5">• Agent 收到超时错误，判定发送失败</text>
          <text y="68" fill="#ef4444">• 自动发起第 2 次重试请求！</text>
          <text y="84" fill="#ef4444">• 导致用户信用卡被重复扣除两笔 $100 费用！</text>
          
          <text y="106" fill="#f87171">🔴 分布式网络中最经典的假失败 (False-Failure) 陷阱！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 在异步分布式网络中单纯重试极其危险；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 带来灾难性的脏数据与法律合规风险；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 严禁裸重试！</text>
      </g>
    </g>

    <!-- Right: Idempotent Protection -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Oract 幂等键去重：绝对安全的原子执行</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">携带唯一业务幂等凭证：</text>
          <text y="28" fill="#86efac">Header: Idempotency-Key: oract_eff_7a8b9c</text>
          
          <text y="50" fill="#38bdf8">目标服务去重网关：</text>
          <text y="64" fill="#34d399">1. 首次请求: 正常扣款并缓存结果哈希</text>
          <text y="78" fill="#4ade80">2. 重试请求: 命中幂等缓存，直接返回 200 OK 历史结果</text>
          
          <text y="104" fill="#4ade80">✓ 达成物理系统绝对的 Exactly-Once 语义！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底化解网络丢包与重试带来的副作用双重执行危机；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 工业级分布式系统与 Agent 交互的黄金法则；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚如磐石的可靠系统！</text>
      </g>
    </g>
  </g>
</svg>