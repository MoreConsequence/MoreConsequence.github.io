<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi TUI 流式增量 Markdown 解析与 ANSI 终端渲染流水线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 流式接收 Token ──► 2. 状态机增量解析 Markdown 语法块 ──► 3. 动态注入 ANSI 颜色转义序列 ──► 4. 终端硬件极速直接绘制</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 流式增量 Token 流 (Incremental Token Stream)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">大模型逐字吐出: ---, go, /n, func, main() ──► 0 完整接收等待</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">流式渲染第一现场！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 语法状态机增量闭合 (Incremental AST State Machine)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">识别处于 CodeBlock 内部 ──► 自动追踪当前未闭合的语法范围 ──► 绝不因为跨 Chunk 发生格式错乱</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将流式片段精准还原为结构化语法树！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 语法高亮与 ANSI 序列生成 (Chroma / Prism Syntax Highlighting)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">为关键字注入 [38;2;... 24-bit TrueColor 转义码 ──► 行号、注释、字符串色彩绚丽分明</text>
        <text x="15" y="62" font-size="8" fill="#047857">赋予终端媲美 VS Code 的精美代码高亮！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 终端屏幕极速双缓冲渲染 (Double-Buffered Terminal Draw)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">仅重绘发生变化的行 (Diff Render) ──► 彻底消除闪烁 ──► 达成 60 FPS 电竞级丝滑刷新体验！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">顶级工程师命令行交互的艺术巅峰！</text>
      </g>
    </g>
  </g>
</svg>