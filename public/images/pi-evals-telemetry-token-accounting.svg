<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">全链路遥测与企业级 Token 记账：精准度量每一分钱与性能指标</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">OpenTelemetry Tracing ──► 粒度统计 (Input, Output, Cached Tokens) ──► 部门/项目成本分摊账单 ──► 自动化基准回归评分</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. OpenTelemetry 分布式链路追踪 (Distributed Spans)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Trace: Turn-042 ──► Span: LLM_Request (TTFT: 210ms) ──► Span: Tool_Exec (go test: 1200ms)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">精准可视化每一轮决策的耗时瓶颈，告别盲人摸象式黑盒排查！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 细粒度 Token 消耗分类度量 (Multi-Tier Token Metrics)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Input: 15,200 | Cache_Read: 14,800 (97.3%) | Output: 450 | Reasoning: 1,200</text>
        <text x="15" y="62" font-size="8" fill="#047857">区分缓存命中与未命中 Token 费率，实时手算审计每一笔 API 支出！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 多租户部门与项目成本归因 (Cost Allocation Ledger)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">按 Team / Project / User 维度聚合 Prometheus 账本 ──► 自动生成 FinOps 财务分摊报告</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">杜绝公地悲剧与预算失控，让企业级 Agent 规模化落地真正具备财务可行性！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 持续 CI 回归与 Pass@1 效能看板 (Continuous Evaluation Dashboard)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">每次 Harness 代码更新自动跑 50 个基准 PR ──► 生成 PassRate、CostPerPR 趋势大盘！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">用客观严密的数据驱动工程演进，打造工业级最高水准的技术博客与工程体系！</text>
      </g>
    </g>
  </g>
</svg>