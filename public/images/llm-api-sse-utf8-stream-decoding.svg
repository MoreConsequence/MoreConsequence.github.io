<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">HTTP/SSE 流式分块传输与 UTF-8 多字节截断乱码机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Byte-level BPE 跨 Chunk 切分 ──► 无状态解码产生 \uFFFD 乱码 ──► 持态 TextDecoder(stream:true) 缓冲拼装</text>
  </g>

  <!-- Main Comparison Panes (435px each) -->
  <g transform="translate(30, 70)">
    <!-- Left Pane: Flawed Stateless Decoding (435px) -->
    <g filter="url(#card-shadow)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 错误做法：无状态逐 Chunk 独立解码</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <!-- Physical Byte Sequence -->
        <rect width="405" height="36" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="16" font-size="9" font-weight="700" fill="#991b1b">汉字「你」的 UTF-8 编码为 3 字节：</text>
        <text x="10" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#7f1d1d">0xE4 (字节1) | 0xBD (字节2) | 0xA0 (字节3)</text>

        <!-- SSE Chunk 1 -->
        <g transform="translate(0, 48)">
          <rect width="405" height="64" rx="4" fill="#ffffff" stroke="#fca5a5"/>
          <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">SSE Chunk 1 到达: [ 0xE4, 0xBD ] (仅前2字节)</text>
          <rect x="10" y="24" width="220" height="20" rx="3" fill="#fee2e2"/>
          <text x="15" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">chunk.toString('utf-8')</text>
          <text x="240" y="38" font-size="9" font-weight="700" fill="#dc2626">──► 乱码 \uFFFD ()</text>
          <text x="10" y="56" font-size="7.5" fill="#7f1d1d">解码器发现残缺字节，强行替换为非法字符占位符！</text>
        </g>

        <!-- SSE Chunk 2 -->
        <g transform="translate(0, 122)">
          <rect width="405" height="64" rx="4" fill="#ffffff" stroke="#fca5a5"/>
          <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">SSE Chunk 2 到达: [ 0xA0 ] (剩余尾字节)</text>
          <rect x="10" y="24" width="220" height="20" rx="3" fill="#fee2e2"/>
          <text x="15" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">chunk.toString('utf-8')</text>
          <text x="240" y="38" font-size="9" font-weight="700" fill="#dc2626">──► 乱码 \uFFFD ()</text>
          <text x="10" y="56" font-size="7.5" fill="#7f1d1d">单字节 0xA0 同样非法，再次生成第二个乱码占位符！</text>
        </g>

        <!-- Final Render Result -->
        <g transform="translate(0, 196)">
          <rect width="405" height="60" rx="4" fill="#fee2e2" stroke="#dc2626"/>
          <text x="10" y="18" font-size="9.5" font-weight="700" fill="#991b1b">前端 UI 最终渲染灾难：</text>
          <rect x="10" y="26" width="385" height="26" rx="3" fill="#ffffff"/>
          <text x="20" y="43" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">"你好" 变成了 "好" 乱码！</text>
        </g>

        <text x="0" y="278" font-size="8.5" fill="#991b1b">
          • 物理根因：无状态解码器丢弃了上下文未闭合的字节流。
        </text>
      </g>
    </g>

    <!-- Right Pane: Stateful Stream Decoding (435px) -->
    <g transform="translate(465, 0)" filter="url(#card-shadow)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 生产解法：持态 TextDecoder({ stream: true })</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <!-- Decoder Init -->
        <rect width="405" height="36" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="16" font-size="9" font-weight="700" fill="#166534">创建持态解码器：</text>
        <text x="10" y="28" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">const decoder = new TextDecoder('utf-8');</text>

        <!-- Step 1 Buffer Hang -->
        <g transform="translate(0, 48)">
          <rect width="405" height="64" rx="4" fill="#ffffff" stroke="#86efac"/>
          <text x="10" y="16" font-size="8.5" font-weight="700" fill="#166534">Chunk 1 到达: [ 0xE4, 0xBD ]</text>
          <rect x="10" y="24" width="240" height="20" rx="3" fill="#dcfce7"/>
          <text x="15" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#166534">decoder.decode(c1, { stream: true })</text>
          <text x="260" y="38" font-size="9" font-weight="700" fill="#15803d">──► 返回 ""</text>
          <text x="10" y="56" font-size="7.5" fill="#047857">✓ 识别为不完整前缀，自动将 2 字节保存在内部 Buffer 中挂起！</text>
        </g>

        <!-- Step 2 Merge Decode -->
        <g transform="translate(0, 122)">
          <rect width="405" height="64" rx="4" fill="#ffffff" stroke="#86efac"/>
          <text x="10" y="16" font-size="8.5" font-weight="700" fill="#166534">Chunk 2 到达: [ 0xA0 ]</text>
          <rect x="10" y="24" width="240" height="20" rx="3" fill="#dcfce7"/>
          <text x="15" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#166534">decoder.decode(c2, { stream: true })</text>
          <text x="260" y="38" font-size="9" font-weight="700" fill="#10b981">──► 返回 "你"！</text>
          <text x="10" y="56" font-size="7.5" fill="#047857">✓ 内部 Buffer [E4, BD] + 新字节 [A0] 凑齐 3 字节，瞬间解码为「你」！</text>
        </g>

        <!-- Final Correct UI -->
        <g transform="translate(0, 196)">
          <rect width="405" height="60" rx="4" fill="#d1fae5" stroke="#10b981"/>
          <text x="10" y="18" font-size="9.5" font-weight="700" fill="#065f46">前端 UI 完美渲染：</text>
          <rect x="10" y="26" width="385" height="26" rx="3" fill="#ffffff"/>
          <text x="20" y="43" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">"你好" 完整呈现，0 乱码！</text>
        </g>

        <text x="0" y="278" font-size="8.5" fill="#166534">
          • 生产规范：流结束时调用一次无参 `decoder.decode()` 刷新残余。
        </text>
      </g>
    </g>
  </g>
</svg>
