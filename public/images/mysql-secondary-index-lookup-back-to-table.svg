<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="ci-title ci-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="ci-title">InnoDB 二级索引回表 (Lookup) 链路 vs 覆盖索引 (Covering Index) 零回表</title>
  <desc id="ci-desc">对比图展示普通二级索引查出主键后二次访问聚簇索引的回表路径与联合覆盖索引在叶子节点直接返回所需字段、实现零回表的物理差异。</desc>
  <defs>
    <marker id="ci-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="ci-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">INNODB SECONDARY INDEX · COVERING INDEX &amp; ROW LOOKUP</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">InnoDB 二级索引回表 vs 覆盖索引零回表</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">非覆盖查询 (二级索引查 ID ➔ 聚簇索引二次随机 I/O 回表) vs 覆盖索引 (Using index，叶子直接供给字段，0 回表)</text>

  <!-- 2 Main Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Secondary Index Lookup (x=40..460, w=420) -->
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="100" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="64" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LOOKUP PATH</text>
    <text x="124" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">非覆盖查询：二次 B+Tree 回表</text>

    <!-- Query Info -->
    <rect x="14" y="42" width="392" height="34" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="24" y="62" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">SELECT id, amount FROM orders WHERE user_id=123; (idx_user)</text>

    <!-- Step 1 Box -->
    <rect x="14" y="86" width="392" height="80" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="108" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Step 1: 二级索引 idx_user 遍历</text>
    <text x="24" y="126" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">检索 user_id=123 ➔ 叶子节点仅保存 (user_id, 主键 id)</text>
    <text x="24" y="144" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">缺少 amount 列数据 ➔ 必须向聚簇索引发起回表！</text>
    <text x="24" y="158" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Found Candidate: id = 1001</text>

    <!-- Step 2 Box (Focal Lookup) -->
    <rect x="14" y="176" width="392" height="96" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="198" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Step 2: 聚簇索引二次点查 (回表 Row Lookup)</text>
    <text x="24" y="216" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">利用 id=1001 检索主键 B+Tree ➔ 读取整行数据</text>
    <text x="24" y="234" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">若产生 N 条候选行 ➔ 触发 N 次离散随机 I/O！</text>
    <text x="24" y="252" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">冷页未命中 Buffer Pool 时耗时飙升至数毫秒</text>
    <text x="24" y="266" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">EXPLAIN Extra: (None) / Using where</text>

    <!-- Penalty Summary -->
    <rect x="14" y="282" width="392" height="78" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="304" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">物理开销模型</text>
    <text x="24" y="322" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">遍历 2 棵独立 B+Tree ➔ 2 次深度寻道 ➔ 缓存局部性差</text>
    <text x="24" y="342" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">Total I/O: 2x B+Tree Height (6~8 Page Accesses)</text>
  </g>

  <!-- Col 2: Covering Index (x=480..920, w=440) - Focal -->
  <g transform="translate(480, 136)">
    <rect width="440" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#e85d3f"/>
    <text x="79" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">COVERING INDEX</text>
    <text x="154" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">覆盖索引：一次 B+Tree 零回表</text>

    <!-- Query Info -->
    <rect x="14" y="42" width="412" height="34" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="62" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">SELECT user_id, amount FROM orders WHERE user_id=123; (idx_user_amount)</text>

    <!-- Step 1 Box (Focal) -->
    <rect x="14" y="86" width="412" height="170" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1.2"/>
    <text x="24" y="108" fill="#e85d3f" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">联合索引 idx_user_amount(user_id, amount) 单次命中</text>
    <text x="24" y="128" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">叶子节点物理结构: [user_id | amount | id (主键)]</text>
    <text x="24" y="146" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">✓ 所需字段 (user_id, amount) 100% 已在叶子节点！</text>
    <line x1="24" y1="158" x2="396" y2="158" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="24" y="178" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">存储引擎直接提取数据打包返回 Server 层：</text>
    <text x="24" y="196" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">彻底跳过聚簇索引回表（0 Row Lookup）！</text>
    <text x="24" y="214" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">EXPLAIN Extra: Using index (覆盖命中奖章)</text>
    <text x="24" y="232" fill="#6b6a64" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">连续物理页顺序扫描，极速响应</text>
    <text x="24" y="248" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Zero Secondary Random Lookups</text>

    <!-- Benefit Summary -->
    <rect x="14" y="266" width="412" height="94" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="288" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">性能压倒性优势</text>
    <text x="24" y="306" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 消除 100% 聚簇回表 I/O ➔ QPS 吞吐提升 3~8 倍；</text>
    <text x="24" y="324" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 仅遍历 1 棵 B+Tree，极大减轻 Buffer Pool 争用；</text>
    <text x="24" y="344" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">Total I/O: 1x B+Tree Height (仅 3~4 Page Accesses)</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">非覆盖查询与聚簇二次回表</text>
  <rect x="340" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="360" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">覆盖索引 Using index 零回表核心</text>
</svg>
