<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">InnoDB 二级索引回表机制 vs 覆盖索引 (Covering Index)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">二级索引 (叶子存主键ID) ──► 聚簇索引树回表 (二次 B+Tree 遍历) vs 覆盖索引直接内存返回</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Secondary Index Back-to-Table -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统二级索引：回表查询 (2次 B+Tree 遍历)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="40" rx="4" fill="#fee2e2"/>
        <text x="10" y="18" font-family="ui-monospace, monospace" font-size="8.5" fill="#991b1b">SELECT id, age, name FROM users WHERE age = 25;</text>
        <text x="10" y="32" font-size="7.5" fill="#7f1d1d">索引仅建在 idx_age(age) 上</text>

        <!-- Step 1 & Step 2 -->
        <g transform="translate(0, 50)">
          <rect width="405" height="150" rx="4" fill="#0f172a"/>
          <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
            <text y="14" fill="#38bdf8">1. 遍历 idx_age B+Tree (高度 h=3):</text>
            <text y="28" fill="#94a3b8">   叶子节点仅包含 (age=25, 主键 id=888)</text>
            
            <text y="50" fill="#f87171">2. 触发回表 (Random IO 致命点):</text>
            <text y="64" fill="#fca5a5">   拿 id=888 重新遍历聚簇索引树 (高度 h=3)</text>
            <text y="78" fill="#fca5a5">   提取 name 完整行数据</text>

            <text y="100" fill="#fb7185">► 总计遍历 3 + 3 = 6 次节点页面！</text>
            <text y="116" fill="#fca5a5">当命中 10,000 行时，产生 10,000 次随机回表！</text>
          </g>
        </g>

        <rect y="210" width="405" height="60" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">性能隐患：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 回表产生的随机 I/O 导致磁盘磁头剧烈寻道；</text>
        <text x="10" y="48" font-size="7.5" fill="#dc2626">• 优化器一旦估算回表成本过高，会直接放弃索引转为全表扫描！</text>
      </g>
    </g>

    <!-- Right: Covering Index -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 覆盖索引 (Covering Index) 零回表直出</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="40" rx="4" fill="#dcfce7"/>
        <text x="10" y="18" font-family="ui-monospace, monospace" font-size="8.5" fill="#166534">SELECT id, age, name FROM users WHERE age = 25;</text>
        <text x="10" y="32" font-size="7.5" fill="#15803d">建立联合索引 idx_age_name(age, name)</text>

        <!-- Step 1 Only -->
        <g transform="translate(0, 50)">
          <rect width="405" height="150" rx="4" fill="#0f172a"/>
          <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
            <text y="14" fill="#34d399">1. 遍历 idx_age_name B+Tree (高度 h=3):</text>
            <text y="32" fill="#86efac">   叶子节点已包含 (age=25, name='Alice', id=888)</text>
            
            <text y="58" fill="#34d399">2. 索引已包含查询所需的全部字段 (Using index):</text>
            <text y="76" fill="#4ade80">   ✓ 无需回表！直接在叶子节点完成数据装配返回！</text>

            <text y="104" fill="#38bdf8">► 总计仅需 3 次内存页面访问！</text>
            <text y="120" fill="#34d399">► 性能提升 5x ~ 20x 倍，消除所有回表随机 IO！</text>
          </g>
        </g>

        <rect y="210" width="405" height="60" rx="4" fill="#d1fae5" stroke="#34d399"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#065f46">生产建表军规：</text>
        <text x="10" y="34" font-size="7.5" fill="#047857">• 高频查询利用复合索引将字段覆盖完整；</text>
        <text x="10" y="48" font-size="7.5" fill="#166534">• EXPLAIN 看到 Extra: Using index 即代表达成覆盖索引零回表！</text>
      </g>
    </g>
  </g>
</svg>