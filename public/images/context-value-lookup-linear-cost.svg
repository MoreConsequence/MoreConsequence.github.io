<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Context.Value 性能开销：valueCtx 单向链表 O(N) 递归回溯</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">WithValue 不是 Map 而是单向链表包装 ｜ 每层查找需比对 key 是否相等 ｜ 滥用会导致深度 N=20 时单次读取耗费 20 次接口类型断言与递归</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Anti-pattern -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 滥用 Context 传递业务参数：O(N) 递归灾难</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">ctx = context.WithValue(ctx, "k1", v1)</text>
          <text y="28" fill="#f87171">ctx = context.WithValue(ctx, "k2", v2)... (包装 20 层！)</text>
          
          <text y="50" fill="#ef4444">💥 ctx.Value("k1") 执行逻辑：</text>
          <text y="64" fill="#fca5a5">• 顺着 parent 指针递归向上回溯 20 次</text>
          <text y="78" fill="#ef4444">• 每次触发 interface{} 运行时动态反射比较！</text>
          <text y="94" fill="#ef4444">• 内存逃逸产生 20 个 valueCtx 堆对象，GC 剧烈抖动！</text>
          
          <text y="116" fill="#f87171">🔴 性能比结构体传参慢 100 倍！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 代码类型不安全，取值需强行类型断言；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 极隐蔽的 CPU 消耗与内存放大；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严禁用于传递函数入参！</text>
      </g>
    </g>

    <!-- Right: Best Practice -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正确规范：仅用于跨进程元数据与单一聚合</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 策略 1: 仅传递链路追踪 TraceID / 用户 AuthSession</text>
          <text y="28" fill="#86efac">type traceKey struct{} // 私有结构体作为 Key，防外部覆盖</text>
          
          <text y="50" fill="#38bdf8">// 策略 2: 多个元数据合并为单个结构体指针传递：</text>
          <text y="64" fill="#34d399">type RequestContext struct { UserID string; TraceID string }</text>
          <text y="78" fill="#34d399">ctx = context.WithValue(ctx, traceKey{}, &amp;reqCtx)</text>
          
          <text y="104" fill="#4ade80">✓ 无论传多少字段，Context 链深度仅增加 1 层！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 保持 Context 树扁平整洁；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 兼顾链路追踪通用性与系统极限性能；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 标准库设计初衷典范！</text>
      </g>
    </g>
  </g>
</svg>