<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="cdn-four-copy-title cdn-four-copy-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="cdn-four-copy-title">传统 4 次内核数据拷贝与零拷贝 Direct I/O 对比</title>
  <desc id="cdn-four-copy-desc">架构流程图对比传统 read/write 系统的 4 次拷贝与 4 次上下文切换，以及 sendfile/io_uring 零 CPU 拷贝直通网卡机制。</desc>
  <defs>
    <marker id="cdn-copy-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="cdn-copy-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">LINUX I/O &amp; ZERO-COPY PIPELINE</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">传统 4 次数据拷贝与零拷贝 Direct I/O 对比</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">传统 read() + write() 触发 2 次 DMA + 2 次 CPU 拷贝；sendfile / io_uring 实现 0 次 CPU 拷贝直达网卡</text>

  <!-- Track 1: Traditional 4-Copy I/O -->
  <rect x="40" y="140" width="880" height="164" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <rect x="56" y="154" width="96" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
  <text x="104" y="167" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">TRADITIONAL I/O</text>
  <text x="162" y="168" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">传统 read() + write()：4 次上下文切换 + 2 次 CPU 拷贝瓶颈</text>

  <!-- Trad Stage 1: Disk -->
  <rect x="56" y="186" width="160" height="76" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
  <text x="70" y="208" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">NVMe SSD 磁盘</text>
  <text x="70" y="228" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">硬件介质存储</text>
  <text x="70" y="246" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">read() 发起 I/O</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="216" y1="224" x2="276" y2="224" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#cdn-copy-arr)"/>
  <rect x="226" y="210" width="40" height="14" rx="2" fill="#f5f4ed"/>
  <text x="246" y="220" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">① DMA</text>

  <!-- Trad Stage 2: PageCache -->
  <rect x="276" y="186" width="160" height="76" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
  <text x="290" y="208" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">内核 PageCache</text>
  <text x="290" y="228" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">内核空间缓冲区</text>
  <text x="290" y="246" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">页缓存预读</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="436" y1="224" x2="496" y2="224" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#cdn-copy-arr)"/>
  <rect x="446" y="210" width="40" height="14" rx="2" fill="#f5f4ed"/>
  <text x="466" y="220" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">② CPU 拷贝</text>

  <!-- Trad Stage 3: User Space -->
  <rect x="496" y="186" width="160" height="76" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
  <text x="510" y="208" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">用户态 Buffer</text>
  <text x="510" y="228" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">进程堆空间内存</text>
  <text x="510" y="246" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">write() 系统调用</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="656" y1="224" x2="716" y2="224" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#cdn-copy-arr)"/>
  <rect x="666" y="210" width="40" height="14" rx="2" fill="#f5f4ed"/>
  <text x="686" y="220" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">③ CPU 拷贝</text>

  <!-- Trad Stage 4: Socket & NIC -->
  <rect x="716" y="186" width="188" height="76" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
  <text x="730" y="208" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Socket Buffer → 网卡</text>
  <text x="730" y="228" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">④ DMA 写入网卡环形队列</text>
  <text x="730" y="246" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">消耗大量 CPU 周期与带宽</text>

  <text x="56" y="286" fill="#6b6a64" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif">4 次上下文切换（User ↔ Kernel 2 次往返）+ 2 次 CPU 拷贝，大文件吞吐受 CPU/内存总线严格钳制</text>

  <!-- Track 2: Zero-Copy sendfile (Focal Track) -->
  <rect x="40" y="324" width="880" height="184" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
  <rect x="56" y="338" width="96" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
  <text x="104" y="351" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.08em">ZERO-COPY I/O</text>
  <text x="162" y="352" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">现代 CDN sendfile + io_uring：0 次 CPU 拷贝 + 2 次轻量切换</text>

  <!-- Zero Stage 1: Disk -->
  <rect x="56" y="372" width="200" height="84" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
  <text x="70" y="396" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">NVMe SSD 磁盘</text>
  <text x="70" y="416" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">NVMe Direct I/O</text>
  <text x="70" y="436" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">大块连续无碎片读取</text>

  <!-- Arrow Zero 1 -> 2 -->
  <line x1="256" y1="414" x2="336" y2="414" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#cdn-copy-arr-accent)"/>
  <rect x="270" y="400" width="52" height="14" rx="2" fill="#f5f4ed"/>
  <text x="296" y="410" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">① DMA 拷贝</text>

  <!-- Zero Stage 2: Kernel PageCache & SG-DMA -->
  <rect x="336" y="372" width="280" height="84" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
  <text x="350" y="396" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">内核 PageCache + 描述符直通</text>
  <text x="350" y="416" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">sendfile(out_fd, in_fd, offset, count)</text>
  <text x="350" y="436" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">仅向 Socket 传递文件描述符与长度（0 字节内存拷贝）</text>

  <!-- Arrow Zero 2 -> 3 -->
  <line x1="616" y1="414" x2="696" y2="414" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#cdn-copy-arr-accent)"/>
  <rect x="626" y="400" width="60" height="14" rx="2" fill="#f5f4ed"/>
  <text x="656" y="410" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">② Scatter-Gather</text>

  <!-- Zero Stage 3: NIC Ring Buffer -->
  <rect x="696" y="372" width="208" height="84" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
  <text x="710" y="396" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">网卡 100Gbps Ring Buffer</text>
  <text x="710" y="416" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">网卡 DMA 直接从页缓存聚合发包</text>
  <text x="710" y="436" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">CPU 拷贝次数严格为 0</text>

  <text x="56" y="488" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="500">仅需 2 次上下文切换，数据包从磁盘经由 DMA 描述符直通网卡，轻松跑满 100Gbps 线速</text>

  <!-- Legend Strip -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="562" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="556" x2="144" y2="556" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#cdn-copy-arr)"/>
  <text x="152" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">传统内存拷贝路径</text>
  <line x1="290" y1="556" x2="314" y2="556" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#cdn-copy-arr-accent)"/>
  <text x="322" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">零拷贝硬件直通路径</text>
  <rect x="470" y="550" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="490" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">零拷贝优化方案</text>
</svg>
