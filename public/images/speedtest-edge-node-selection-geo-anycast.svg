<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">全球分布式测速边缘节点动态调度拓扑 (Edge Node Selection)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. GeoIP 粗筛地理临近 5 个 PoP 节点 ──► 2. 客户端并发发起 TCP/HTTP Ping ──► 3. 选取物理 RTT 最短且负载最低的最优测速服</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. GeoDNS 与 Client Subnet 地理初筛 (GeoIP &amp; EDNS0)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">通过客户端出口 IP 识别所属国家、省份、运营商 (ISP) ──► 筛选半径 300km 内的 5 个边缘测速 PoP 点</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">从全球数百个节点中快速收敛候选集！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 客户端并发轻量探测 (Parallel Lightweight Ping Probing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">客户端向 5 个候选节点并发发送 3 次微型 HTTP GET /ping ──► 准确度量实际网络链路 RTT 与抖动 (Jitter)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">消除仅凭地理距离误判（如跨运营商绕路、跨海光缆故障）的致命失真！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 服务端实时健康与带宽水位仲裁 (Server Capacity Arbitration)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">节点上报当前出口带宽利用率 ──► 若某节点出口已占用 &gt; 85% ──► 自动降权踢出，调度至次优可用节点</text>
        <text x="15" y="62" font-size="8" fill="#047857">杜绝测速服自身被打爆导致用户测速结果严重偏低！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 极速锁定并建立测速长连接 (Lock Optimal Node &amp; Stream Test)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">客户端与最优目标节点建立 WebSocket / HTTP/2 多路并发流 ──► 开启高精度吞吐测量！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">工业级全球网络性能评估体系基石！</text>
      </g>
    </g>
  </g>
</svg>