<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="k8s-pod-sigterm-prestop-endpoint-drain-title k8s-pod-sigterm-prestop-endpoint-drain-desc"><title id="k8s-pod-sigterm-prestop-endpoint-drain-title">Kubernetes Pod 优雅停机全景时序：preStop 钩子 -&gt; Ingress/Endpoints 摘除…</title><desc id="k8s-pod-sigterm-prestop-endpoint-drain-desc">Kubernetes Pod 优雅停机全景时序：preStop 钩子 -&gt; Ingress/Endpoints 摘除 -&gt; SIGTERM 优雅退出</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Kubernetes Pod 优雅停机四阶段异步竞态与消解 (Pod Graceful Termination)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 状态置为 Terminating ──► 2. 控制平面异步摘除 Endpoints ｜ 节点并行执行 preStop sleep 15s ──► 3. SIGTERM 内部连接排空 ──► 4. 0 报错平滑销毁</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 触发删除与状态流转 (Pod Status -&gt; Terminating)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">kubectl delete / 滚动升级触发 ──► API Server 将 Pod 标记为 Terminating ──► 开启 terminationGracePeriodSeconds (30s)</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">启动全局停机倒计时！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 核心异步竞态消解 (The Endpoints vs SIGTERM Race Condition)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">kube-proxy 摘除 iptables 需耗时 3~5 秒 ──► 若容器瞬间退出必产生 502/504 ──► 必须配置 preStop: sleep 15 等待流量完全切走！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">消除云原生滚动发布 502 报错的唯一真理！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 发送 SIGTERM 与业务连接排空 (SIGTERM &amp; Server.Shutdown)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Kubelet 向主进程发送 SIGTERM ──► 框架拒绝新请求 ──► 优雅等待处理中的长请求与事务安全完成</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">保障 0 业务事务中断与数据半写！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 资源清理与终极保底 (Graceful Exit or SIGKILL Guard)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">进程正常退出 0 ──► 若 30 秒超时未退出则发送 SIGKILL 强杀 ──► 容器运行时销毁 cgroup</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">企业级生产发布 0 故障金牌规范！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
