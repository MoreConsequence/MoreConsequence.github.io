<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">TypeScript DTO 边界真相：类型系统无法在运行时替你丢掉敏感字段</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">编译后类型全部擦除 ──► res.json(user as PublicUserDTO) 依然会全量返回 password_hash ──► 必须运行时白名单过滤</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Type Assertion Illusion -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 类型断言假象：password 泄漏惨案</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">type PublicDTO = { id: string; name: string };</text>
          <text y="30" fill="#fca5a5">const user = await db.users.findFirst();</text>
          <text y="46" fill="#cbd5e1">// 以为 as PublicDTO 就安全了？</text>
          <text y="62" fill="#f87171">res.json(user as PublicDTO);</text>
          
          <text y="86" fill="#ef4444">🔴 编译为 JS 后的物理真实代码：</text>
          <text y="102" fill="#fb7185">res.json(user); // "as PublicDTO" 在编译期被完全删空！</text>
          <text y="120" fill="#fca5a5">► 客户端 HTTP 响应直接包含了 password_hash、phone！</text>
          <text y="136" fill="#ef4444">► 造成严重的生产安全与隐私合规事故！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">从 Go 转型 TS 常见误区：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• Go 强类型结构体 json.Marshal 会自动丢弃未定义字段；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• TS 的 interface/type 在运行时是空气，JSON.stringify 会序列化全部对象属性；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须在数据出口处建立物理防火墙！</text>
      </g>
    </g>

    <!-- Right: Runtime DTO Firewall -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 生产标准：运行时白名单 Schema 过滤</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">const PublicDTOSchema = z.object({</text>
          <text y="28" fill="#86efac">  id: z.string(),</text>
          <text y="42" fill="#86efac">  name: z.string(),</text>
          <text y="56" fill="#38bdf8">  phone: z.string().transform(v =&gt; maskPhone(v)) // 自动掩码脱敏</text>
          <text y="70" fill="#34d399">});</text>
          
          <text y="92" fill="#4ade80">// 运行时物理过滤：</text>
          <text y="108" fill="#86efac">const cleanData = PublicDTOSchema.parse(user);</text>
          <text y="124" fill="#34d399">res.json(cleanData); // 100% 仅输出声明字段，敏感字段物理剔除！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">出口治理三大军规：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">1. 所有对外 API 必须经过 Zod / class-transformer 显式白名单过滤；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">2. ORM 查询结果严禁直接透传给客户端；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">3. 在 CI/CD 中加入响应 Schema 自动化安全扫描！</text>
      </g>
    </g>
  </g>
</svg>