<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">分布式脑裂 (Split-Brain) 幽灵写入与 Fencing 铁壁防御</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">无 Fencing 裸锁 (旧主苏醒后覆盖新主的正确数据导致静默数据损坏) vs Fencing Token 栅栓 (存储层基于单调版本号直接拒绝任何过时写)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Split-Brain Catastrophe -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 无 Fencing 裸锁：幽灵写入破坏数据</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">Worker A 以为自己仍然持有分布式锁：</text>
          
          <text y="38" fill="#ef4444">致命脏数据覆写：</text>
          <text y="52" fill="#fca5a5">• Worker B 已经接管并生成了最新的代码 v2</text>
          <text y="68" fill="#ef4444">• Worker A 从长 GC 恢复，向磁盘写入过期的代码 v1</text>
          <text y="84" fill="#ef4444">• 新版本代码被老版本硬生生覆盖破坏！</text>
          
          <text y="106" fill="#f87171">🔴 难以排查的幽灵数据丢失灾难！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 单纯依靠分布式锁 TTL 无法防范假死；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• Martin Kleppmann 经典分布式论文指出的死穴；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 严禁使用裸锁！</text>
      </g>
    </g>

    <!-- Right: Fencing Defense -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Fencing Token 栅栓：存储层绝对拒收</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">存储层单调版本原子校验：</text>
          
          <text y="36" fill="#86efac">1. 存储层当前记录 max_fencing_token = 43 (Worker B)</text>
          <text y="50" fill="#38bdf8">2. Worker A 携带 token = 42 发起写入</text>
          <text y="64" fill="#34d399">3. 比较: 42 &lt; 43 ──► 立即返回 409 Conflict 拒绝并抛弃！</text>
          <text y="78" fill="#4ade80">4. Worker A 捕获错误主动自杀退出！</text>
          
          <text y="104" fill="#4ade80">✓ 数据一致性与正确性获得数学级 100% 捍卫！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 终结分布式多节点并发竞争导致的所有脏写可能；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑多机器、大规模集群 Agent 的超高并发安全调度；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级分布式系统工程典范！</text>
      </g>
    </g>
  </g>
</svg>