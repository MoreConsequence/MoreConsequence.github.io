<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 1.21+ 切片复制与内存脱钩标准策略 (Memory Detach Pipeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 传统 copy(dst, src) ｜ 2. Go 1.21+ 标准库 slices.Clone(s) ｜ 3. 彻底释放上游大数组指针引用 ｜ 4. 辅助 GC 极速回收</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 经典 make + copy 范式</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">detached := make([]byte, len(sub))</text>
          <text x="10" y="34" fill="#86efac">copy(detached, sub)</text>
          <text x="10" y="50" fill="#4ade80">return detached</text>
          
          <text x="10" y="74" fill="#cbd5e1">机制特性：</text>
          <text x="10" y="90" fill="#34d399">• 精准分配目标大小的新内存</text>
          <text x="10" y="106" fill="#34d399">• 截断对原 100MB 大数组的引用</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 任何 Go 版本均通用的稳健写法；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 0 指针交叉残留；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造清晰生命周期边界。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Go 1.21+ slices.Clone()</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">import "slices"</text>
          <text x="10" y="34" fill="#38bdf8">return slices.Clone(sub)</text>
          
          <text x="10" y="58" fill="#86efac">标准库泛型实现：</text>
          <text x="10" y="74" fill="#34d399">• 内部自动调用 append 并优化汇编</text>
          <text x="10" y="90" fill="#34d399">• 1 行代码兼顾代码整洁与极致性能</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 现代化 Go 首选语法糖！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 消除重复样板代码；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 泛型保障 100% 静态类型安全；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 官方推荐现代编码标准。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. GC 垃圾回收效益</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">脱钩前 vs 脱钩后对比：</text>
          
          <text x="10" y="38" fill="#f87171">• 脱钩前: 存活 100MB (常驻内存高企)</text>
          <text x="10" y="58" fill="#4ade80">• 脱钩后: 存活仅 16B！</text>
          <text x="10" y="78" fill="#34d399">• 原 100MB 数组在下一轮 GC 立即被回收</text>
          
          <text x="10" y="112" fill="#4ade80">✓ 内存开销降低 99.999%！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底解决海量数据解析时的内存暴涨；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 赋予系统超强的吞吐稳定性；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级代码质量关键指标！</text>
      </g>
    </g>
  </g>
</svg>