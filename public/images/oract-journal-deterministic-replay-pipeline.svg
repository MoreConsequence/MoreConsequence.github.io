<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Oract 确定性事件日志重放与状态投影流水线 (Deterministic Playback)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 顺序读取不可变 Journal ──► 2. 注入固定种子与时间桩 ──► 3. 状态机函数纯运算 F(State, Event) ──► 4. 派生出 100% 确定性的内存投影</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 不可变事件序列存储 (Immutable Journal Log on Disk)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">每一条事件均包含唯一的全局单调自增序号 seq_id 与时间戳 timestamp ──► 绝对只写不改</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">事件溯源的原始数据源头！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 纯函数状态转移演算 (Pure State Transition: State' = apply(State, Event))</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">状态转移函数严禁包含任何外部 I/O ──► 纯内存变量数学运算 ──► 保证 1,000 次执行输出 1,000 次完全相同</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">函数式响应与状态机的优雅融合！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 时光机分支分叉衍生 (Time-Travel Branching &amp; DAG Forking)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">在任意 seq_id = 42 处派生分支 ──► 共享 1..42 历史事件 ──► 开启新的事件线，0 磁盘文件拷贝开销</text>
        <text x="15" y="62" font-size="8" fill="#047857">极速创建轻量级平行推演宇宙！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 动态派生视图实时聚合 (Real-Time Projection Views Serving)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">即时提供用于 LLM Prompt 组装的上下文、用于前端展示的进度条与错误汇总 ──► 达成毫秒级只读查询！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">工业级事件溯源核心引擎架构！</text>
      </g>
    </g>
  </g>
</svg>