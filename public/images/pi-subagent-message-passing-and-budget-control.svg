<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Subagent 消息通信与 Token 预算层级配额模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">全局总预算 $5.0 ──► Root 划分: Research ($1.0) + Coder ($3.0) + Reviewer ($1.0) ──► 各自独立熔断，严禁超支</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Research Subagent ($1.0)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">预算硬上限: 200k Tokens</text>
          
          <text x="10" y="38" fill="#86efac">• 快速扫描全库 50 个文件</text>
          <text x="10" y="54" fill="#38bdf8">• 过滤无关代码，提取核心接口</text>
          <text x="10" y="70" fill="#34d399">• 若接近 $1.0 立即强制提炼交付</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 预算内高效完成调研！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 专注于信息检索与摘要；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 消耗完毕自动终结；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 成本可控。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Coder Subagent ($3.0)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">预算硬上限: 600k Tokens</text>
          
          <text x="10" y="38" fill="#86efac">• 编写核心业务与单测用例</text>
          <text x="10" y="54" fill="#38bdf8">• 允许最多 10 次沙箱测试重试</text>
          <text x="10" y="70" fill="#4ade80">• 达成 100% 测试通过率</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 核心代码攻坚主力！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 获得最大预算倾斜；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 专注代码实现与自愈；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 质量保障。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Reviewer Subagent ($1.0)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">预算硬上限: 200k Tokens</text>
          
          <text x="10" y="38" fill="#fed7aa">• 审查代码 Diff 与规范契约</text>
          <text x="10" y="54" fill="#38bdf8">• 静态安全扫描与边界检查</text>
          <text x="10" y="70" fill="#4ade80">• 签发通过证书交付 Root</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 最终质量守门人！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 严谨的分工与预算隔离机制；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 彻底消灭单 Agent 容易产生的死循环失控；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级团队协同模拟！</text>
      </g>
    </g>
  </g>
</svg>