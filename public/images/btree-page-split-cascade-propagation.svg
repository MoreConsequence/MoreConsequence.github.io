<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">B+ 树页分裂与级联传播 (B-Tree Page Split &amp; Cascade)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">16KB 页满 ──► 申请新页 ──► 50% 数据搬迁 ──► 父节点插入新索引 Key ──► 根节点分裂导致树增高一层</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 叶子节点填满与插入冲突 (Page Full: Free Space &lt; Record Size)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">16KB 叶子页已存满 500 条记录 ──► 随机 UUID 插入命中该页中段 ──► 空间不足触发分裂！</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">随机主键插入是导致 B+ 树频繁分裂的元凶！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 申请全新 16KB 页并搬迁 50% 记录 (Page Allocation &amp; 50/50 Split)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">从表空间申请 Page N+1 ──► 拷贝原页后半部分 250 条记录 ──► 修改双向链表 Prev/Next 指针</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">单条小数据写入触发 32KB 的巨大磁盘 I/O 放大！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 父节点级联更新与悲观分裂 (Parent Split Cascade)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">向父节点插入新页的起始 Key ──► 若父节点也满，继续向上递归分裂 ──► 直至根节点！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">需要持有全局索引写锁 (SX/X Lock)，严重堵塞并发读写！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 优化解法：自增 ID 与页填充因子 (Sequential ID &amp; Fill Factor)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">严格按主键自增顺序追加 ──► 每次只在末尾页追加，0 历史页分裂 ──► 页填充率稳定在 93% 以上！</text>
        <text x="15" y="62" font-size="8" fill="#047857">关系型数据库最核心的表设计铁律！</text>
      </g>
    </g>
  </g>
</svg>