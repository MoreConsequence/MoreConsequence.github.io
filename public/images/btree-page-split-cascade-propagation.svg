<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="btree-page-split-cascade-propagation-title btree-page-split-cascade-propagation-desc"><title id="btree-page-split-cascade-propagation-title">B+ Tree 页分裂与级联向上传播：空间开销与父节点分裂</title><desc id="btree-page-split-cascade-propagation-desc">树状架构图展示 B+ 树叶节点满载分裂时向上推入路由 Key，若内部非叶节点满载则引发级联向上分裂直至根节点分裂、增加树高的全过程。</desc>
  <defs>
    <marker id="cs-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="cs-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">BTREE CASCADE PROPAGATION · NON-LEAF SPLIT &amp; HEIGHT INCREASE</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">B+ Tree 页分裂与级联向上传播机制</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">叶页满载分裂 ➔ 向父节点插入路由 Key ➔ 父节点满载触发非叶页分裂 ➔ 级联传播至根节点 ➔ B+ 树层高增加</text>

  
  <g transform="translate(40, 136)">
    <rect width="880" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="10" width="90" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="59" y="21" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LEVEL 1 · ROOT</text>
    <text x="114" y="22" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">根节点分裂 (Root Page #1) ➔ B+ 树层高从 3 增至 4</text>

    
    <g transform="translate(14, 34)">
      <rect x="0" y="0" width="410" height="54" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
      <text x="12" y="20" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Root Node 满载触发分裂条件：</text>
      <text x="12" y="34" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">当下层内部节点全部满载、上推的新 Key 无处可塞时，根节点被迫切开。</text>
      <text x="12" y="46" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">唯一会导致整棵 B+ 树增高（Height++）的物理操作！</text>

      <rect x="424" y="0" width="428" height="54" rx="3" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
      <text x="436" y="20" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">新根节点分配与指针拓扑：</text>
      <text x="436" y="34" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">新建新根节点 Page #100，原根节点切为两个子节点，新根节点仅包含 2 个路由指针。</text>
      <text x="436" y="46" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Fan-out: 1200+ ➔ 4 层 B+ Tree 可容纳百亿行！</text>
    </g>
  </g>

  
  <text x="480" y="248" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Cascade Split</text>

  
  <g transform="translate(40, 256)">
    <rect width="880" height="110" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="10" width="110" height="16" rx="2" fill="#eb6c36" />
    <text x="69" y="21" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">LEVEL 2 · INTERNAL</text>
    <text x="134" y="22" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">内部非叶节点层 (Internal Pages: 只存 Key + Child Page Ptr)</text>

    
    <g transform="translate(14, 32)">
      
      <rect x="0" y="0" width="270" height="66" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="10" y="18" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Internal Page #2</text>
      <text x="10" y="32" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">[K:100 ➔ P#4] [K:200 ➔ P#5]</text>
      <text x="10" y="46" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">有空闲空间 ➔ 正常容纳</text>
      <text x="10" y="58" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">No Split Needed ✓</text>

      
      <rect x="284" y="0" width="280" height="66" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
      <text x="294" y="18" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Internal Page #3 (满载分裂!)</text>
      <text x="294" y="32" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace">接收下层上推的 Key=452 ➔ 满载！</text>
      <text x="294" y="46" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">50/50 分裂为 Page #3 与 Page #8</text>
      <text x="294" y="58" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace">➔ 继续向 Root 上推中间 Key</text>

      
      <rect x="578" y="0" width="274" height="66" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="588" y="18" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Internal Page #8 (分裂新生)</text>
      <text x="588" y="32" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">[K:452 ➔ P#11] [K:600 ➔ P#12]</text>
      <text x="588" y="46" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">承接后半部分子节点路由</text>
      <text x="588" y="58" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Half-full Internal Page</text>
    </g>
  </g>

  
  <text x="480" y="378" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Push Key=452</text>

  
  <g transform="translate(40, 386)">
    <rect width="880" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="10" width="90" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="59" y="21" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LEVEL 3 · LEAF</text>
    <text x="114" y="22" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">叶子节点层 (Leaf Pages: 存放真实 128B 数据行 + 双向链表有序贯通)</text>

    
    <g transform="translate(14, 32)">
      
      <rect x="0" y="0" width="195" height="74" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
      <text x="10" y="18" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Leaf Page #9</text>
      <text x="10" y="34" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Keys: [1 .. 128]</text>
      <text x="10" y="50" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">100% 满载，正常读取</text>
      <text x="10" y="64" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Next ➔ Page #10</text>

      <line x1="195" y1="37" x2="215" y2="37" stroke="#4f5d75" stroke-width="1" marker-end="url(#cs-arr)" />

      
      <rect x="215" y="0" width="205" height="74" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
      <text x="225" y="18" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Leaf Page #10 (分裂前半)</text>
      <text x="225" y="34" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace">Keys: [129 .. 451] (64行)</text>
      <text x="225" y="50" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">50% 填充率 (8KB 空闲)</text>
      <text x="225" y="64" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace">Next ➔ Page #11</text>

      <line x1="420" y1="37" x2="440" y2="37" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#cs-arr-accent)" />

      
      <rect x="440" y="0" width="205" height="74" rx="3" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
      <text x="450" y="18" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Leaf Page #11 (分裂后半)</text>
      <text x="450" y="34" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace">Keys: [452 .. 512] (65行)</text>
      <text x="450" y="50" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">50% 填充率 (8KB 空闲)</text>
      <text x="450" y="64" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace">Next ➔ Page #12</text>

      <line x1="645" y1="37" x2="665" y2="37" stroke="#4f5d75" stroke-width="1" marker-end="url(#cs-arr)" />

      
      <rect x="665" y="0" width="187" height="74" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
      <text x="675" y="18" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Leaf Page #12</text>
      <text x="675" y="34" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Keys: [513 .. 640]</text>
      <text x="675" y="50" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">100% 满载，正常读取</text>
      <text x="675" y="64" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Double-Linked Chain</text>
    </g>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">常规根节点与未分裂叶页</text>
  <rect x="290" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="310" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">叶节点分裂、Key 上推与内部非叶级联分裂核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
