<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="prometheus-histogram-exponential-vs-linear-buckets-title prometheus-histogram-exponential-vs-linear-buckets-desc"><title id="prometheus-histogram-exponential-vs-linear-buckets-title">Prometheus 直方图分桶拓扑：线性分桶 (Linear) vs 指数分桶 (Exponential) 误差对比</title><desc id="prometheus-histogram-exponential-vs-linear-buckets-desc">Prometheus 直方图分桶拓扑：线性分桶 (Linear) vs 指数分桶 (Exponential) 误差对比</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2d3142" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f5f5f5"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Prometheus 直方图分桶策略：线性 (Linear) vs 指数 (Exponential)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">线性分桶 (高分位线性外推误差极大) vs 指数分桶 (1.5x/2x 对数递增，在长尾 100ms~10s 维持恒定相对精度)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Linear -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 线性分桶：长尾盲区与误差失真</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f87171">prometheus.LinearBuckets(10ms, 10ms, 10) // 10ms~100ms</text>

          <text y="38" fill="#ef4444">致命盲区陷阱：</text>
          <text y="52" fill="#fca5a5">• 95% 的请求在 5ms，全挤在第一桶无法分辨细微劣化</text>
          <text y="68" fill="#ef4444">• 尾部请求突增至 500ms、2000ms 均跌入 +Inf 桶</text>
          <text y="84" fill="#ef4444">• histogram_quantile(0.99) 线性插值计算出荒谬的伪造数据！</text>

          <text y="106" fill="#f87171">🔴 生产 P99 告警彻底失效沦为摆设！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 无法精准定位慢 SQL 与网络抖动；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 桶数固定导致跨数量级吞吐失真；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 可观测性重大设计缺陷！</text>
      </g>
    </g>

    <!-- Right: Exponential -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 指数分桶：全范围恒定相对误差</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#4ade80">prometheus.ExponentialBuckets(0.005, 2.0, 12)</text>
          <text y="28" fill="#86efac">// [5ms, 10ms, 20ms, 40ms, 80ms, 160ms, 320ms, 640ms, 1.28s, 2.56s, 5.12s, 10.24s]</text>

          <text y="50" fill="#38bdf8">对数级精度优势：</text>
          <text y="64" fill="#34d399">• 完美覆盖从 5ms 极速到 10s 极限超时全跨度！</text>
          <text y="78" fill="#34d399">• 任何区间的插值误差被数学严格限制在 ±5% 以内</text>
          <text y="92" fill="#4ade80">• 仅需 12 个指标序列，时序库存储开销极低！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• P90/P95/P99 全分位指标 100% 真实可信；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 成为 Google SRE 与 CNCF 标准推荐实践；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级监控分桶金标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
