<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">大模型函数调用 (Tool Calling) 严密双向契约流水线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. JSON Schema 静态定义 ──► 2. LLM 输出 tool_calls 参数 ──► 3. Zod / Pydantic 严格校验 ──► 4. 沙箱执行并将 Observation 回传模型</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 工具元数据声明 (Tool Definition via JSON Schema)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">通过 name, description, parameters 严密声明参数类型、枚举约束与 required 字段</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将代码接口转化为模型可理解的精确语义规范！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 模型结构化决策生成 (Model Structured Call Generation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">LLM 判断需要调用工具 ──► 触发 tool_calls 语法槽位 ──► 输出严格格式的 JSON 参数对象</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">杜绝传统正则从自然语言中抠取参数的极高出错率！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 服务端强类型契约校验 (Schema Validation &amp; Boundary Guard)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Zod/Pydantic 解析参数 ──► 若字段缺失或类型错误 ──► 立即返回标准结构化错误提示模型自纠错</text>
        <text x="15" y="62" font-size="8" fill="#047857">构筑绝对防范非法输入的安全隔离护栏！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 沙箱执行与结果观测回填 (Sandbox Execution &amp; Observation Feed)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">安全沙箱调用真实 API / DB ──► 组装 role: "tool" 消息注入对话上下文 ──► 模型继续完成最终推理！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代自主 Agent 与数字系统交互的标准枢纽！</text>
      </g>
    </g>
  </g>
</svg>