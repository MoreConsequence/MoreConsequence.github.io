<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="json-schema-tool-calling-dispatch-pipeline-title json-schema-tool-calling-dispatch-pipeline-desc"><title id="json-schema-tool-calling-dispatch-pipeline-title">大模型 Tool Calling 双向契约流水线：JSON Schema 约束、参数校验与工具执行分发</title><desc id="json-schema-tool-calling-dispatch-pipeline-desc">大模型 Tool Calling 双向契约流水线：JSON Schema 约束、参数校验与工具执行分发</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">大模型函数调用 (Tool Calling) 严密双向契约流水线</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. JSON Schema 静态定义 ──► 2. LLM 输出 tool_calls 参数 ──► 3. Zod / Pydantic 严格校验 ──► 4. 沙箱执行并将 Observation 回传模型</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 工具元数据声明 (Tool Definition via JSON Schema)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">通过 name, description, parameters 严密声明参数类型、枚举约束与 required 字段</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">将代码接口转化为模型可理解的精确语义规范！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 模型结构化决策生成 (Model Structured Call Generation)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">LLM 判断需要调用工具 ──► 触发 tool_calls 语法槽位 ──► 输出严格格式的 JSON 参数对象</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">杜绝传统正则从自然语言中抠取参数的极高出错率！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 服务端强类型契约校验 (Schema Validation &amp; Boundary Guard)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Zod/Pydantic 解析参数 ──► 若字段缺失或类型错误 ──► 立即返回标准结构化错误提示模型自纠错</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">构筑绝对防范非法输入的安全隔离护栏！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 沙箱执行与结果观测回填 (Sandbox Execution &amp; Observation Feed)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">安全沙箱调用真实 API / DB ──► 组装 role: "tool" 消息注入对话上下文 ──► 模型继续完成最终推理！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">现代自主 Agent 与数字系统交互的标准枢纽！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
