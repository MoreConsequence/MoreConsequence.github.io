<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">JavaScript 现代生态四层分层架构 (Ecosystem Stack)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">从 TC39 标准规范 ──► V8 / JavaScriptCore 虚拟机引擎 ──► Node / Deno / Bun 系统运行时 ──► Next.js / Nest 全栈框架</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 标准与规范层 (ECMAScript / TC39 &amp; WinterCG Standards)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">定义语法 AST、数据结构、原型语义与标准 Web API (fetch, AbortSignal, ReadableStream)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">全生态互联互通的技术宪法，跨平台一致性的坚实基石！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 字节码与虚拟机执行引擎 (JS Engines: V8 / JSC / SpiderMonkey)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">Ignition 解释器生成字节码 ──► TurboFan JIT 动态编译为机器指令 ──► Orinoco 精确垃圾回收</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将纯文本代码转化为纳秒级极限执行效率的原动力！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 系统 I/O 与运行时环境 (Runtimes: Node.js / Deno / Bun / Cloudflare Workers)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">绑定 Libuv / Tokio ──► 提供文件读写、TCP/UDP Socket、进程线程管理与加密硬件加速</text>
        <text x="15" y="62" font-size="8" fill="#047857">让 JavaScript 走出浏览器沙箱，统治现代服务端基建！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 应用框架与构建工具链 (Frameworks &amp; Tooling: Next.js / Fastify / Vite)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">组件化封装、全栈路由、RPC 强类型推导、代码摇树与产物极致优化打包</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">赋能全球开发者构建百万级高可用生产级应用！</text>
      </g>
    </g>
  </g>
</svg>