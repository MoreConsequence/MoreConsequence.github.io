<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go string 与 []byte 内存结构与不可变性契约</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">StringHeader (Data + Len: 16 字节，只读不可变) vs SliceHeader (Data + Len + Cap: 24 字节，可读可写可扩容)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: string -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. string 结构体 (16 字节只读)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">type StringHeader struct {</text>
          <text y="28" fill="#86efac">    Data unsafe.Pointer // 8 字节: 底层字节数组指针</text>
          <text y="42" fill="#34d399">    Len  int            // 8 字节: 字符串长度 (字节数)</text>
          <text y="56" fill="#38bdf8">}</text>
          
          <text y="80" fill="#fb923c">核心语义契约：</text>
          <text y="94" fill="#fed7aa">• 语言级保证：只读不可变 (Immutable)！</text>
          <text y="108" fill="#34d399">• 底层数据可安全存放在 OS 只读常量数据段 (.rodata)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 赋值与切片截取仅为 16 字节结构体拷贝（0 数据拷贝）；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 并发只读 100% 绝对线程安全；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造可靠文本抽象。</text>
      </g>
    </g>

    <!-- Right: slice -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. []byte 结构体 (24 字节可变)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">type SliceHeader struct {</text>
          <text y="28" fill="#86efac">    Data unsafe.Pointer // 8 字节: 堆/栈底层数组指针</text>
          <text y="42" fill="#34d399">    Len  int            // 8 字节: 当前有效长度</text>
          <text y="56" fill="#38bdf8">    Cap  int            // 8 字节: 最大容量容量上限</text>
          <text y="70" fill="#4ade80">}</text>
          
          <text y="94" fill="#38bdf8">可变性与转换代价：</text>
          <text y="108" fill="#fca5a5">• 普通 string([]byte) 必须强制深拷贝以捍卫不可变性！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 赋予 I/O 缓冲区原地读写与原地修改能力；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 强制深拷贝保证了字符串不可变契约不被渗透；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 安全与灵活性的经典平衡。</text>
      </g>
    </g>
  </g>
</svg>