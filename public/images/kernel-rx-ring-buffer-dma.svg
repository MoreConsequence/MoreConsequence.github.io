<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" role="img" aria-labelledby="kernel-rx-ring-buffer-dma-title kernel-rx-ring-buffer-dma-desc">
  <title id="kernel-rx-ring-buffer-dma-title">Linux 网络收包物理全景：网卡 DMA、Ring Buffer 与 NAPI 软中断</title>
  <desc id="kernel-rx-ring-buffer-dma-desc">高对比度工程物理架构图：网络光电信号经网卡 DMA 直传主机 RAM，触发硬中断后转入 NAPI 软中断批量轮询并封装 sk_buff 交付协议栈的全流程。</desc>
  <defs>
    <marker id="rx-arr-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f172a" />
    </marker>
    <marker id="rx-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d9531e" />
    </marker>
    <marker id="rx-arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Linux 网络收包物理全景：DMA 直传与 NAPI 轮询</text>
    <text x="0" y="26" fill="#475569" font-size="13" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">光电信号 ➔ 网卡 DMA 直传主机主存 ➔ 硬中断拉起 ➔ NAPI 软中断批量轮询并封装 sk_buff 交付协议栈</text>
  </g>

  <!-- Connectors Between Stages -->
  <!-- Link 1 -> 2: PCIe DMA -->
  <g>
    <line x1="242" y1="260" x2="268" y2="260" stroke="#0284c7" stroke-width="2" marker-end="url(#rx-arr-link)" />
    <rect x="238" y="226" width="34" height="18" rx="3" fill="#0284c7" />
    <text x="255" y="239" fill="#ffffff" font-size="10.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">DMA</text>
  </g>

  <!-- Link 2 -> 3: Poll / IRQ -->
  <g>
    <line x1="487" y1="260" x2="513" y2="260" stroke="#d9531e" stroke-width="2" marker-end="url(#rx-arr-accent)" />
    <rect x="482" y="226" width="36" height="18" rx="3" fill="#d9531e" />
    <text x="500" y="239" fill="#ffffff" font-size="10.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">POLL</text>
  </g>

  <!-- Link 3 -> 4: sk_buff -->
  <g>
    <line x1="732" y1="260" x2="758" y2="260" stroke="#0284c7" stroke-width="2" marker-end="url(#rx-arr-link)" />
    <rect x="730" y="226" width="30" height="18" rx="3" fill="#0284c7" />
    <text x="745" y="239" fill="#ffffff" font-size="10.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">SKB</text>
  </g>

  <!-- 4 Pipeline Columns (y=96..496, h=400) -->

  <!-- Col 1: NIC Hardware (x=40..240, w=200) -->
  <g transform="translate(40, 96)">
    <rect width="200" height="400" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <!-- Col Header Badge -->
    <rect x="14" y="14" width="70" height="22" rx="4" fill="#334155" />
    <text x="49" y="29" fill="#ffffff" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">STAGE 1</text>
    <text x="92" y="30" fill="#0f172a" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">网卡物理芯片</text>

    <!-- Sub-block 1: PHY & MAC -->
    <text x="14" y="66" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">PHY / MAC 校验</text>
    <text x="14" y="90" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 光电信号转数字比特流</text>
    <text x="14" y="112" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 硬件校验以太网 FCS</text>
    <text x="14" y="134" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 瞬时存入 RX FIFO</text>

    <!-- Divider -->
    <line x1="14" y1="154" x2="186" y2="154" stroke="#cbd5e1" stroke-width="1" />

    <!-- Sub-block 2: DMA Engine -->
    <text x="14" y="180" fill="#0284c7" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">DMA 控制器直传</text>
    <text x="14" y="204" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 绕过 CPU 介入</text>
    <text x="14" y="226" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 经 PCIe 直写主机主存</text>
    <text x="14" y="248" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 零 CPU 额外计算负载</text>

    <!-- Divider -->
    <line x1="14" y1="268" x2="186" y2="268" stroke="#cbd5e1" stroke-width="1" />

    <!-- Sub-block 3: Hard IRQ -->
    <text x="14" y="294" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">硬中断 (Hard IRQ)</text>
    <text x="14" y="318" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• MSI-X 信号触发中断线</text>
    <text x="14" y="340" fill="#d9531e" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 仅通知 1 次即拉起软中断</text>
    <text x="14" y="362" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 随后立即屏蔽硬件中断</text>
  </g>

  <!-- Col 2: RX Ring Buffer (x=268..488, w=220) - Focal Point -->
  <g transform="translate(268, 96)">
    <rect width="220" height="400" rx="8" fill="rgba(217, 83, 30, 0.04)" stroke="#d9531e" stroke-width="2" />
    <!-- Col Header Badge -->
    <rect x="14" y="14" width="70" height="22" rx="4" fill="#d9531e" />
    <text x="49" y="29" fill="#ffffff" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">STAGE 2</text>
    <text x="92" y="30" fill="#d9531e" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">RX Ring Buffer</text>

    <!-- Sub-block 1: Ring Array -->
    <text x="14" y="66" fill="#d9531e" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">环形描述符队列 (RAM)</text>
    <text x="14" y="90" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 4096 组连续物理内存页</text>
    <text x="14" y="112" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 每个描述符存 DMA 物理地址</text>
    <text x="14" y="134" fill="#d9531e" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 网卡写入数据并置 Ready 位</text>

    <!-- Mini Ring Card inside -->
    <rect x="14" y="146" width="192" height="66" rx="4" fill="#ffffff" stroke="#d9531e" stroke-width="1.2" />
    <text x="22" y="166" fill="#0f172a" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">[Desc 0] 0x8800 | Ready ✓</text>
    <text x="22" y="184" fill="#d9531e" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700">[Desc 1] 0x8840 | Writing...</text>
    <text x="22" y="202" fill="#64748b" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">[Desc 2] 0x8880 | Empty</text>

    <!-- Divider -->
    <line x1="14" y1="226" x2="206" y2="226" stroke="rgba(217, 83, 30, 0.25)" stroke-width="1" />

    <!-- Sub-block 2: Protection -->
    <text x="14" y="252" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">防丢包第一防线</text>
    <text x="14" y="276" fill="#d9531e" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">⚠️ 队列满载 ➔ 网卡硬件强丢包！</text>
    <text x="14" y="298" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 监控：overruns / rx_dropped</text>
    <text x="14" y="320" fill="#0f172a" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="600">ethtool -G eth0 rx 4096</text>
    <text x="14" y="342" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">调大 Ring Buffer 吸收微突发</text>
  </g>

  <!-- Col 3: NAPI SoftIRQ (x=513..733, w=220) -->
  <g transform="translate(513, 96)">
    <rect width="220" height="400" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <!-- Col Header Badge -->
    <rect x="14" y="14" width="70" height="22" rx="4" fill="#0f172a" />
    <text x="49" y="29" fill="#ffffff" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">STAGE 3</text>
    <text x="92" y="30" fill="#0f172a" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">NAPI 轮询引擎</text>

    <!-- Sub-block 1: Polling Action -->
    <text x="14" y="66" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">net_rx_action 批量轮询</text>
    <text x="14" y="90" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">1. 禁用网卡硬中断 (消灭风暴)</text>
    <text x="14" y="112" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">2. 遍历 Poll 队列批量消费描述符</text>
    <text x="14" y="134" fill="#0284c7" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">3. 预算机制：netdev_budget=64</text>
    <text x="14" y="156" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">防止网络软中断饿死用户进程</text>

    <!-- Divider -->
    <line x1="14" y1="174" x2="206" y2="174" stroke="#e2e8f0" stroke-width="1" />

    <!-- Sub-block 2: SKB Packaging -->
    <text x="14" y="200" fill="#0284c7" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">sk_buff 封装与传递</text>
    <text x="14" y="224" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 从 Slab 分配 230B 控制头</text>
    <text x="14" y="246" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 绑定 DMA 主存页，零内存拷贝</text>
    <text x="14" y="268" fill="#334155" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">napi_gro_receive(skb)</text>

    <!-- Divider -->
    <line x1="14" y1="286" x2="206" y2="286" stroke="#e2e8f0" stroke-width="1" />

    <!-- Sub-block 3: GRO -->
    <text x="14" y="312" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">GRO 大包聚合优化</text>
    <text x="14" y="336" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 聚合微小数据包至 64KB 大包</text>
    <text x="14" y="358" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 显著减少协议栈函数遍历开销</text>
  </g>

  <!-- Col 4: Protocol Stack Delivery (x=758..920, w=162) -->
  <g transform="translate(758, 96)">
    <rect width="162" height="400" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <!-- Col Header Badge -->
    <rect x="14" y="14" width="70" height="22" rx="4" fill="#334155" />
    <text x="49" y="29" fill="#ffffff" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">STAGE 4</text>
    <text x="92" y="30" fill="#0f172a" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">协议栈交付</text>

    <!-- Sub-block 1: L3/L4 -->
    <text x="14" y="66" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">L3 / L4 协议拆包</text>
    <text x="14" y="90" fill="#334155" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">ip_rcv() 校验路由</text>
    <text x="14" y="112" fill="#334155" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">tcp_v4_rcv() 滑窗</text>

    <!-- Divider -->
    <line x1="14" y1="130" x2="148" y2="130" stroke="#cbd5e1" stroke-width="1" />

    <!-- Sub-block 2: Socket Queue -->
    <text x="14" y="156" fill="#0284c7" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">Socket 队列</text>
    <text x="14" y="180" fill="#334155" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">sk_receive_queue</text>
    <text x="14" y="202" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 唤醒阻塞线程</text>
    <text x="14" y="224" fill="#334155" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">sk_data_ready()</text>

    <!-- Divider -->
    <line x1="14" y1="242" x2="148" y2="242" stroke="#cbd5e1" stroke-width="1" />

    <!-- Sub-block 3: App Read -->
    <text x="14" y="268" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">用户态应用读取</text>
    <text x="14" y="292" fill="#334155" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">read() / recv()</text>
    <text x="14" y="314" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 拷贝至用户缓冲区</text>
    <text x="14" y="336" fill="#0284c7" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 全链路延迟 ~5μs</text>
    <text x="14" y="358" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">完成整个物理流转</text>
  </g>

  <!-- Legend Strip at Bottom -->
  <g transform="translate(40, 514)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="0" y="24" fill="#64748b" font-size="12" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">图例规范：</text>

    <rect x="75" y="11" width="14" height="14" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="96" y="23" fill="#334155" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">物理网卡与协议栈基础组件</text>

    <rect x="300" y="11" width="14" height="14" rx="3" fill="rgba(217, 83, 30, 0.08)" stroke="#d9531e" stroke-width="1.8" />
    <text x="321" y="23" fill="#d9531e" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">核心缓冲区与防丢包关键节点 (Ring Buffer)</text>

    <rect x="635" y="11" width="14" height="14" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <text x="656" y="23" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">NAPI 批量软中断轮询处理引擎</text>
  </g>
</svg>
