<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lrdmTitle lrdmDesc">
<title id="lrdmTitle">老代码重写决策矩阵</title>
<desc id="lrdmDesc">横轴是约束能否从老代码里解出来（可逆性），纵轴是重写后能否重新压缩约束（价值保存）。右上角（左上：高可逆 + 低价值）解出后写 spec 后删除老代码；右下角（右下：低可逆 + 低价值）是绝对不要碰的区域；左下角（高价值 + 低可逆）不要重写，要写解释性 spec；左上角（高可逆 + 高价值）按 spec 重写并保留老代码作契约对照。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">重写决策矩阵</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不凭年龄，凭两件事：约束能否解出来（可逆性）、重写后能否重新压缩（价值保存）</text>

<!-- axes -->
<line x1="120" y1="448" x2="880" y2="448" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow-ink)"/>
<line x1="120" y1="448" x2="120" y2="120" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow-ink)"/>

<!-- axis labels -->
<text x="900" y="452" fill="#2d3142" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">价值保存 ↑</text>
<text x="120" y="108" fill="#2d3142" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em" text-anchor="middle">价值保存</text>
<text x="40" y="452" fill="#2d3142" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em" text-anchor="middle" transform="rotate(-90, 40, 452)">可逆性</text>

<!-- Q1 (high value + high reversibility): accent -->
<rect x="160" y="148" width="340" height="142" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="176" y="174" fill="#eb6c36" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">左上 · 行动 A</text>
<text x="176" y="198" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">按 spec 重写 + 保留老代码</text>
<text x="176" y="220" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">约束能解出来，重写能保留</text>
<text x="176" y="238" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">对照老代码做契约验证，</text>
<text x="176" y="256" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">新老并行 6-12 个月</text>
<text x="176" y="278" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">改写速度慢，价值最高</text>

<!-- Q2 (low value + high reversibility) -->
<rect x="540" y="148" width="340" height="142" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="556" y="174" fill="#7a8399" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">右上 · 行动 B</text>
<text x="556" y="198" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">解出后写 spec，删除老代码</text>
<text x="556" y="220" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">约束能被新代码天然表达，</text>
<text x="556" y="238" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">老代码只是"丑陋"但</text>
<text x="556" y="256" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不是不可替代</text>
<text x="556" y="278" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">真正该删的代码</text>

<!-- Q3 (high value + low reversibility): accent -->
<rect x="160" y="306" width="340" height="142" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="176" y="332" fill="#eb6c36" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">左下 · 行动 C</text>
<text x="176" y="356" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不要重写，写解释性 spec</text>
<text x="176" y="378" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">约束价值高但解不出来</text>
<text x="176" y="396" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">（反熵增战役）：把每一行</text>
<text x="176" y="414" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">反直觉分支都注释清楚</text>
<text x="176" y="436" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">多数"必删"代码的真相</text>

<!-- Q4 (low value + low reversibility): DO NOT TOUCH focal -->
<rect x="540" y="306" width="340" height="142" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
<text x="556" y="332" fill="#eb6c36" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">右下 · 行动 D</text>
<text x="556" y="356" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">千万不要重写</text>
<text x="556" y="378" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">约束解不出来，重写又保</text>
<text x="556" y="396" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">留不住——事故指纹会丢</text>
<text x="556" y="414" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">这种代码一旦没了，事故</text>
<text x="556" y="432" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">也会以另一种形式回来</text>

<!-- axis labels: low/high -->
<text x="120" y="464" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">不可逆</text>
<text x="880" y="464" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">可逆</text>
<text x="100" y="296" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">低</text>
<text x="100" y="148" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">高</text>

<!-- footer -->
<line x1="48" y1="496" x2="912" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="48" y="514" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">"价值保存"由重写后约束能否被等价保留决定；"可逆性"由约束能否从老代码里解出来决定。</text>
<text x="48" y="530" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">年龄不在这张图里，因为年龄不是决策依据</text>

</svg>
