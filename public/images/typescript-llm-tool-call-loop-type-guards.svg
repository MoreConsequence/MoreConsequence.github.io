<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="typescript-llm-tool-call-loop-type-guards-title typescript-llm-tool-call-loop-type-guards-desc"><title id="typescript-llm-tool-call-loop-type-guards-title">TypeScript LLM 工具循环与类型收窄</title><desc id="typescript-llm-tool-call-loop-type-guards-desc">TypeScript LLM 工具循环架构图展示不可信 JSON 边界、运行时类型守卫收窄、并发批处理编排以及部分失败强类型可辨识表达全景。</desc>
  <defs>
    <marker id="tl-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
