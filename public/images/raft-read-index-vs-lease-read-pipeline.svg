<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="raft-read-index-vs-lease-read-pipeline-title raft-read-index-vs-lease-read-pipeline-desc"><title id="raft-read-index-vs-lease-read-pipeline-title">Raft 线性一致性读：ReadIndex 心跳确认 vs Leader Lease 0 网络往返极速读</title><desc id="raft-read-index-vs-lease-read-pipeline-desc">Raft 线性一致性读：ReadIndex 心跳确认 vs Leader Lease 0 网络往返极速读</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Raft 线性一致性读优化：ReadIndex vs Lease Read</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">走全量 Raft 日志 (吞吐断崖下跌) vs ReadIndex (0 写日志，仅广播一轮心跳确认多数派) vs Lease Read (基于物理时钟租约，0 网络 RPC 纯本地读出)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">ReadIndex 模式 (0 磁盘 I/O 确认)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">1. Leader 记录当前 commitIndex 为 ReadIndex</text>
          <text y="28" fill="#f5f5f5">2. Leader 向多数派节点广播一轮轻量空心跳 RPC</text>

          <text y="50" fill="#f5f5f5">3. 收到多数派确认：</text>
          <text y="64" fill="#f5f5f5">   • 证明自己依然是合法 Leader (未被网络分区隔离)</text>
          <text y="78" fill="#f5f5f5">4. 等待状态机 applyIndex &gt;= ReadIndex</text>
          <text y="92" fill="#f5f5f5">5. 直接从内存状态机读取结果回传客户端！</text>

          <text y="116" fill="#f5f5f5">✓ 0 磁盘 WAL 开销，严格线性一致！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制特性：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 0 物理时钟依赖，绝对数学级安全；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 读请求开销从磁盘 I/O 降为 1 次网络 RTT；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• etcd 默认线性读标准实现！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">Lease Read 模式 (0 网络 RPC 纯本地直读)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">基于心跳超时的领导者租约 (Leader Lease):</text>

          <text y="38" fill="#f5f5f5">1. 选举成功后获得租约 Lease = [start, start + 200ms]</text>
          <text y="52" fill="#f5f5f5">2. 在租约期内：Follower 绝不可能发起选举选出新 Leader</text>
          <text y="66" fill="#f5f5f5">3. 读请求到达 ──► 0 网络 RPC 协调，直接纯内存读取！</text>

          <text y="90" fill="#f5f5f5">✓ 读吞吐量提升 100 倍，延迟 &lt; 0.1ms！</text>
          <text y="106" fill="#f5f5f5">⚠️ 依赖系统时钟漂移边界受控 (Clock Drift Bound)</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 压榨出分布式共识系统极端极致的读性能；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• TiKV / CockroachDB 超高吞吐读核心；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 顶级分布式存储工程艺术！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
