<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 流式 Token 背压缓冲与平滑帧率渲染管道 (Streaming Backpressure)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 异构 SSE Chunk 解析 ──► 2. 环形 Token 缓冲区 (Ring Buffer) ──► 3. 动态背压速率调节 ──► 4. 60 FPS 丝滑打字机终端渲染</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 高速网络 Token 涌入 (High-Speed SSE Stream: 120 Tokens/s)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Claude / DeepSeek 高并发吐字 ──► 网络层瞬间产生大量微小数据包</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">流式数据的输入起点！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 环形缓冲队列平滑吸收 (Lock-Free Ring Buffer)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">无锁环形队列存储待渲染字符 ──► 吸收网络瞬时抖动 ──► 杜绝终端由于频繁重绘导致的画面撕裂卡顿</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将网络毛刺转化为稳定平滑字符流！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 自适应背压速率调节 (Adaptive Rate Limiting &amp; Batching)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">根据当前堆积量动态合并 Frame ──► 堆积严重时自动启用批量渲染 ──► 确保 UI 响应时间恒定 &lt; 16ms</text>
        <text x="15" y="62" font-size="8" fill="#047857">保障主事件循环永不被终端渲染阻塞！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 丝滑 ANSI/CJK 终端输出 (Smooth 60FPS Terminal Render)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">精准计算中英文字符宽度 (wcwidth) ──► 完美打字机动画呈现 ──► 给开发者带来极致沉浸的视觉体验！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">顶级工程师命令行工具必备的工匠精神！</text>
      </g>
    </g>
  </g>
</svg>