<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">巨型帧 (Jumbo Frames) 效能革命：MTU 1500 vs MTU 9000</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">标准帧 MTU 1500 (有效载荷率 94.1%，每秒处理 82 万个中断包) vs 巨型帧 MTU 9000 (有效载荷率 99.1%，中断骤降 83%)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 标准帧 (Standard MTU: 1500 字节)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">万兆 10Gbps 全速推流时：</text>
          
          <text y="38" fill="#86efac">• 帧大小: 1538 字节 (含物理帧间隙)</text>
          <text y="54" fill="#f87171">• 包转发率: 812,744 帧/秒 (81.2 万 PPS！)</text>
          <text y="70" fill="#f87171">• CPU 需处理 81 万次网卡软中断与切包</text>
          
          <text y="96" fill="#cbd5e1">有效载荷率: 1440 / 1538 = 93.6%</text>
          <text y="112" fill="#38bdf8">最高应用吞吐: 9.36 Gbps</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 公网互联网路由的标准配置；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 保证跨运营商与家庭宽带 100% 互通；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 兼容性之王。</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 巨型帧 (Jumbo Frame MTU: 9000 字节)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">万兆 10Gbps 全速推流时：</text>
          
          <text y="38" fill="#86efac">• 帧大小: 9038 字节</text>
          <text y="54" fill="#4ade80">• 包转发率: 138,304 帧/秒 (骤降 83%！)</text>
          <text y="70" fill="#4ade80">• CPU 中断负载大幅减轻，释放 70% 算力</text>
          
          <text y="96" fill="#cbd5e1">有效载荷率: 8940 / 9038 = 98.9%</text>
          <text y="112" fill="#4ade80">最高应用吞吐: 9.89 Gbps (接近物理极限！)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 数据中心内部服务器互联与机房测速；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 存储网络 (iSCSI / NFS / Ceph) 高速传输；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极限性能基础设施！</text>
      </g>
    </g>
  </g>
</svg>