<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 模型上下文协议 (Model Context Protocol: MCP) 架构拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">MCP Host (DSH 宿主) ──► MCP Client 客户端池 ──► 标准 JSON-RPC 2.0 (stdio / SSE) ──► MCP Servers (Postgres, GitHub, Filesystem)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. MCP Host 宿主调度层 (DSH Agent Engine: Central Host)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">管理全部外部数据源与工具注册表 ──► 动态将 MCP Tools 转化为大模型 Prompt 契约</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">全网统一上下文协议的接入宿主！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 双向标准协议通道 (JSON-RPC 2.0 over stdio / SSE Transport)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">规范定义 tools/list, tools/call, resources/read ──► 抹平本地与远程服务器通信差异</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">工业级跨语言、跨进程标准通信通道！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 隔离运行的 MCP Server 服务集群 (Isolated MCP Servers)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">GitHub Server (PR/Issue 管理) ｜ Database Server (只读查询) ｜ Sentry Server (崩溃堆栈分析)</text>
        <text x="15" y="62" font-size="8" fill="#047857">每个 Server 独立进程运行，单点崩溃 0 影响宿主！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 动态资源上下文注入 (Dynamic Resource Prompt Augmentation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">模型按需即时读取数据库表结构与日志 ──► 0 预先全量加载开销 ──► 达成无限扩展的生态互联！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Anthropic 推动的 AI 时代通用开放接口标准！</text>
      </g>
    </g>
  </g>
</svg>