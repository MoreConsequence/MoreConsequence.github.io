<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi Agent 五层精简架构：仅凭 4 个基础工具撬动复杂工程开发</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">UI 渲染层 ──► 会话调度层 ──► 核心 Harness 引擎 ──► 4 基础工具 (read, write, edit, bash) ──► 供应商多模型抽象网关</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 5 Horizontal Layer Cards (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Layer 1 -->
      <rect width="860" height="60" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="22" font-size="10" font-weight="700" fill="#1e40af">第 1 层: 用户交互与无头协议层 (TUI / RPC / Web Headless)</text>
      <text x="15" y="44" font-size="8" fill="#1d4ed8">终端流式 Markdown 高亮渲染、Thinking 思考链折叠、JSON-RPC 2.0 双向协议暴露，无缝嵌入 IDE 与 CI 流水线！</text>

      <!-- Layer 2 -->
      <g transform="translate(0, 68)">
        <rect width="860" height="60" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="22" font-size="10" font-weight="700" fill="#166534">第 2 层: 会话树与扩展系统 (Session Tree &amp; Extensions)</text>
        <text x="15" y="44" font-size="8" fill="#047857">基于 Append-Only JSONL 维护多版本分支会话，支持任意历史点无损回退与基于钩子的进程内插件扩展体系！</text>
      </g>

      <!-- Layer 3 -->
      <g transform="translate(0, 136)">
        <rect width="860" height="60" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="22" font-size="10" font-weight="700" fill="#c2410c">第 3 层: 核心调度状态机 (Core Harness Engine - 805 行精简循环)</text>
        <text x="15" y="44" font-size="8" fill="#ea580c">Turn &amp; Step 双层循环调度，严格管控 Token 预算熔断、工具死循环检测与确定性终止闸门收敛！</text>
      </g>

      <!-- Layer 4 -->
      <g transform="translate(0, 204)">
        <rect width="860" height="60" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="22" font-size="10" font-weight="700" fill="#7e22ce">第 4 层: 4 个基础工具集 (read, write, edit, bash) 与容器沙箱</text>
        <text x="15" y="44" font-size="8" fill="#6b21a8">「刻意不做 50 个专用工具」！read (读)、write (写)、edit (差分改)、bash (万能命令执行)，结合 Linux 沙箱完成一切操作！</text>
      </g>

      <!-- Layer 5 -->
      <g transform="translate(0, 272)">
        <rect width="860" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="15" y="22" font-size="10" font-weight="700" fill="#334155">第 5 层: 统一多模型供应商抽象网关 (pi-ai Provider Gateway)</text>
        <text x="15" y="44" font-size="8" fill="#475569">将 47 家主流 LLM 厂商的 API 差异折叠为单层标准 SSE 流式接口，内置指数退避与可中断超时重试！</text>
      </g>
    </g>
  </g>
</svg>