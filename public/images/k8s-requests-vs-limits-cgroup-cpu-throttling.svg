<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">K8s 资源两本账：Requests (调度准入) vs Limits (Cgroup 运行时硬惩罚)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Requests (调度器静态加减法账本) ｜ CPU Limits (CFS 周期配额导致 CPU Throttling 延迟暴涨) ｜ 内存 Limits (直接触发 OOM-Killer 物理枪决)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Requests Ledger -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Requests: 调度器的静态加法账本</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// 节点总容量 NodeAllocatable: 8 核 CPU, 16GB 内存</text>
          <text y="28" fill="#93c5fd">调度器只做简单加法：∑ Pod.Requests &lt;= NodeCapacity</text>
          
          <text y="50" fill="#4ade80">核心事实：</text>
          <text y="64" fill="#86efac">• 即使物理机当前 CPU 使用率只有 5%：</text>
          <text y="78" fill="#cbd5e1">  若 Requests 累加已达 8 核，新 Pod 坚决拒绝调度！</text>
          <text y="94" fill="#38bdf8">• 映射为 Linux cgroups 的 cpu.shares (权重调度)</text>
          <text y="110" fill="#34d399">✓ 决定了机器争抢时的保底 CPU 资源倾斜比例！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• Requests 决定 QoS 等级 (Guaranteed / Burstable)；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 决定节点驱逐时的牺牲品顺序；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 调度账本与实际运行消耗完全解耦。</text>
      </g>
    </g>

    <!-- Right: Limits Cgroup -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. Limits: Linux Cgroups 运行时的严酷枷锁</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// CPU Limits: CFS 配额 (cpu.cfs_quota_us)</text>
          <text y="28" fill="#fca5a5">100ms 周期内若用满配额，容器线程强行被内核挂起！</text>
          <text y="44" fill="#ef4444">► 导致接口延迟从 5ms 瞬间飙涨至 100ms+ (CPU Throttling)！</text>
          
          <text y="68" fill="#fb923c">// Memory Limits: (memory.limit_in_bytes)</text>
          <text y="82" fill="#ef4444">物理内存超限，OOM-Killer 毫秒级直接杀死进程 (ExitCode 137)！</text>
          <text y="104" fill="#34d399">✓ 生产建议: CPU 可不设 Limit，内存必须按实际峰值留足 1.5 倍裕量！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产踩坑避雷：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 不要盲目给多线程 Go/Java 服务设过小的 CPU Limits (如 1 核)；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 监控 container_cpu_cfs_throttled_periods_total 指标；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 彻底根除假死与延迟抖动顽疾！</text>
      </g>
    </g>
  </g>
</svg>