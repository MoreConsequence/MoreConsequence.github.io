<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="k8s-requests-vs-limits-cgroup-cpu-throttling-title k8s-requests-vs-limits-cgroup-cpu-throttling-desc"><title id="k8s-requests-vs-limits-cgroup-cpu-throttling-title">Kubernetes 资源两本账：Requests 调度分配 vs Limits Cgroup 限流与 CPU…</title><desc id="k8s-requests-vs-limits-cgroup-cpu-throttling-desc">Kubernetes 资源两本账：Requests 调度分配 vs Limits Cgroup 限流与 CPU Throttling 踩坑</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">K8s 资源两本账：Requests (调度准入) vs Limits (Cgroup 运行时硬惩罚)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Requests (调度器静态加减法账本) ｜ CPU Limits (CFS 周期配额导致 CPU Throttling 延迟暴涨) ｜ 内存 Limits (直接触发 OOM-Killer 物理枪决)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Requests: 调度器的静态加法账本</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 节点总容量 NodeAllocatable: 8 核 CPU, 16GB 内存</text>
          <text y="28" fill="#f5f5f5">调度器只做简单加法：∑ Pod.Requests &lt;= NodeCapacity</text>

          <text y="50" fill="#f5f5f5">核心事实：</text>
          <text y="64" fill="#f5f5f5">• 即使物理机当前 CPU 使用率只有 5%：</text>
          <text y="78" fill="#cbd5e1">  若 Requests 累加已达 8 核，新 Pod 坚决拒绝调度！</text>
          <text y="94" fill="#f5f5f5">• 映射为 Linux cgroups 的 cpu.shares (权重调度)</text>
          <text y="110" fill="#f5f5f5">✓ 决定了机器争抢时的保底 CPU 资源倾斜比例！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• Requests 决定 QoS 等级 (Guaranteed / Burstable)；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 决定节点驱逐时的牺牲品顺序；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 调度账本与实际运行消耗完全解耦。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. Limits: Linux Cgroups 运行时的严酷枷锁</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// CPU Limits: CFS 配额 (cpu.cfs_quota_us)</text>
          <text y="28" fill="#f5f5f5">100ms 周期内若用满配额，容器线程强行被内核挂起！</text>
          <text y="44" fill="#f5f5f5">► 导致接口延迟从 5ms 瞬间飙涨至 100ms+ (CPU Throttling)！</text>

          <text y="68" fill="#f5f5f5">// Memory Limits: (memory.limit_in_bytes)</text>
          <text y="82" fill="#f5f5f5">物理内存超限，OOM-Killer 毫秒级直接杀死进程 (ExitCode 137)！</text>
          <text y="104" fill="#f5f5f5">✓ 生产建议: CPU 可不设 Limit，内存必须按实际峰值留足 1.5 倍裕量！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产踩坑避雷：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 不要盲目给多线程 Go/Java 服务设过小的 CPU Limits (如 1 核)；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 监控 container_cpu_cfs_throttled_periods_total 指标；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 彻底根除假死与延迟抖动顽疾！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
