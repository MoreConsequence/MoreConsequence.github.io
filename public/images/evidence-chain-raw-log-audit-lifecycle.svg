<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">工程证据学 (Evidence Engineering) 四级证据链模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">口头声称 (0 证据) ──► 1. 原始执行输出 (Raw Output) ──► 2. 环境版本快照 (Env Snapshot) ──► 3. 独立可复现脚本 ──► 4. 生产证据闭环</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 不可篡改的原始输出捕获 (Raw Command Output Capture)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">禁止人工手工抄写总结数字 ──► 完整保留 stdout/stderr 命令原始回显与退出码 exit_code: 0</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将一手证据原汁原味永久封存！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 严密的运行环境元数据 (Environment Context Ledger)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">记录: Git Commit SHA ｜ OS 内核 uname -a ｜ Go/Node 版本 ｜ CPU 型号与内存容量 ｜ 执行时间戳</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">杜绝因环境不一致导致的“在我机器上是好的”无休止推诿！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 单一变量实验与对照组 (Single-Variable Baseline vs Experiment)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">严格控制仅有 1 个变更变量 ──► 保持测试输入、并发数与硬件负载绝对同构 ──► 执行 10 轮以上重复试验</text>
        <text x="15" y="62" font-size="8" fill="#047857">数学级严谨对照，证实因果关系！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 自动化回归测试与长期归档 (Reproducible CI Matrix)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">将实验固化为 tests/xxx.test.ts ──► 接入 CI 每次构建自动断言 ──► 输出 dated evidence 归档！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">一流工程团队的立身之本与信任基石！</text>
      </g>
    </g>
  </g>
</svg>