<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 调度循环三大终止闸门：为什么大模型不会自己停下来</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">闸门 1: 自然完成判定 (finish_reason = stop) ｜ 闸门 2: 最大步数硬顶 (Max Steps = 50) ｜ 闸门 3: 重复调用哈希检测 (Anti-Loop Hash)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 闸门一：自然完成判定</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 正常结束条件</text>
          <text x="10" y="34" fill="#93c5fd">if (response.toolCalls.length === 0 &amp;&amp;</text>
          <text x="16" y="48" fill="#93c5fd">    response.finishReason === 'stop') {</text>
          <text x="16" y="66" fill="#34d399">  return Result.Done(response.text);</text>
          <text x="10" y="80" fill="#93c5fd">}</text>
          
          <text x="10" y="104" fill="#4ade80">✓ 模型已得出最终结论，不再请求工具执行</text>
          <text x="10" y="120" fill="#38bdf8">✓ 调度循环正常收敛退出。</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 理想状态下的成功路径；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 此时向用户输出最终回答 Markdown；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 结束本轮 Turn 生命周期。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 闸门二：最大步数硬顶</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 兜底最大循环次数</text>
          <text x="10" y="34" fill="#86efac">const MAX_STEPS = 50;</text>
          <text x="10" y="50" fill="#86efac">if (currentStep &gt;= MAX_STEPS) {</text>
          <text x="16" y="66" fill="#f87171">  throw new MaxStepsExceededError(</text>
          <text x="22" y="80" fill="#fca5a5">    '达到最大步数限制，已强制终止'</text>
          <text x="16" y="94" fill="#f87171">  );</text>
          <text x="10" y="108" fill="#86efac">}</text>
          <text x="10" y="124" fill="#34d399">✓ 物理级兜底，防止耗尽用户所有余额！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 限制单次任务的最大爆炸半径；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 防止模型陷入无休止的代码尝试；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 保证系统确定性运行。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 闸门三：重复调用哈希防死锁</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 检测相同工具参数连续调用</text>
          <text x="10" y="34" fill="#fed7aa">hash = sha256(toolName + jsonArgs)</text>
          <text x="10" y="50" fill="#fed7aa">if (historyHashes.count(hash) &gt;= 3) {</text>
          <text x="16" y="68" fill="#f87171">  // 连续 3 次传入相同错误入参！</text>
          <text x="16" y="84" fill="#34d399">  injectSystemFeedback(</text>
          <text x="22" y="98" fill="#34d399">    '警告: 你正在陷入死循环，请尝试换一种方案'</text>
          <text x="16" y="112" fill="#34d399">  );</text>
          <text x="10" y="126" fill="#fed7aa">}</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 智能识别模型卡死在特定报错上的死结；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 动态注入系统反思提示词强制模型跳出死循环；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 打造极其聪慧自愈的 Agent 引擎！</text>
      </g>
    </g>
  </g>
</svg>