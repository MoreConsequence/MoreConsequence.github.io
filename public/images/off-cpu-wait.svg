<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Off-CPU 阻塞耗时度量机理：On-CPU 盲区与 eBPF 记账时序</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">为什么 CPU 利用率仅 15% 但 P99 延迟高达数秒？—— 捕获线程被换下 CPU 时的锁、I/O 与调度等待</text>
  </g>

  <!-- Main Timeline Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section 1: Thread Execution Timeline Stream -->
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">1. 线程真实生命周期状态流（采样窗口时间线）</text>
      <text x="860" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#64748b" text-anchor="end">时间流逝 t ──►</text>

      <!-- Timeline Blocks -->
      <g transform="translate(0, 26)">
        <!-- Running 1 -->
        <rect x="0" y="0" width="120" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
        <text x="60" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">On-CPU (12%)</text>
        <text x="60" y="30" font-family="ui-monospace, monospace" font-size="9.5" fill="#065f46" text-anchor="middle">CPU 计算执行</text>

        <!-- Blocked Lock -->
        <rect x="126" y="0" width="190" height="36" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="221" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Off-CPU: 等锁 (35%)</text>
        <text x="221" y="30" font-family="ui-monospace, monospace" font-size="9.5" fill="#7f1d1d" text-anchor="middle">futex_wait / mutex</text>

        <!-- Running 2 -->
        <rect x="322" y="0" width="100" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
        <text x="372" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">On-CPU (8%)</text>
        <text x="372" y="30" font-family="ui-monospace, monospace" font-size="9.5" fill="#065f46" text-anchor="middle">业务逻辑</text>

        <!-- Blocked Disk -->
        <rect x="428" y="0" width="170" height="36" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
        <text x="513" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">Off-CPU: 等磁盘 (25%)</text>
        <text x="513" y="30" font-family="ui-monospace, monospace" font-size="9.5" fill="#9a3412" text-anchor="middle">fsync / ext4_write</text>

        <!-- Running 3 -->
        <rect x="604" y="0" width="90" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
        <text x="649" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">On-CPU</text>
        <text x="649" y="30" font-family="ui-monospace, monospace" font-size="9.5" fill="#065f46" text-anchor="middle">封包解析</text>

        <!-- Blocked Net -->
        <rect x="700" y="0" width="160" height="36" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="780" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Off-CPU: 等网络 (20%)</text>
        <text x="780" y="30" font-family="ui-monospace, monospace" font-size="9.5" fill="#1e40af" text-anchor="middle">epoll_wait / socket recv</text>
      </g>
    </g>

    <!-- Section 2: Two Sampling Observability Perspectives -->
    <g transform="translate(20, 110)">
      <!-- Left Box: Standard Perf Sampling -->
      <rect x="0" y="0" width="420" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">视角 A：传统 Linux Perf (99Hz 定时采样)</text>
      <text x="14" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">• 仅在时钟中断到来时，抓取正在 CPU 上执行的代码调用栈</text>
      <text x="14" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">• 缺点：线程等锁、等磁盘时被操作系统移出运行队列，采样器</text>
      <text x="14" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">  👉 采样命中率为 0！在 On-CPU 火焰图上留下大片无法解释的空白</text>

      <!-- Right Box: eBPF offcputime -->
      <rect x="440" y="0" width="420" height="100" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="454" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">视角 B：bcc / bpftrace `offcputime` (内核调度器探针)</text>
      <text x="454" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#166534">• 挂载在 Linux 内核调度函数 `finish_task_switch()` 执行点</text>
      <text x="454" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#166534">• 线程换下 CPU 时记录当前时间戳与用户态/内核态栈；</text>
      <text x="454" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">  👉 重新唤醒换回 CPU 时结算 `Δt = t_wake - t_sleep`，按调用栈聚合并绘制</text>
    </g>

    <!-- Section 3: Diagnostic Decision Bar -->
    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="860" height="85" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      
      <g transform="translate(16, 16)" font-family="ui-sans-serif, system-ui, sans-serif">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#0f172a">💡 生产性能排查决策定式（双视角联合分析）：</text>
        <g font-size="11.5">
          <text x="0" y="36" fill="#334155"><tspan font-weight="700" fill="#ea580c">【CPU 打满 100% + 延迟高】</tspan> ──► 直接抓 <tspan font-weight="700">On-CPU 火焰图</tspan>，寻找算法复杂度 $O(N^2)$、密集 JSON 解析或内存拷贝热点</text>
          <text x="0" y="56" fill="#334155"><tspan font-weight="700" fill="#2563eb">【CPU 空闲 &lt;20% + P99 飙升】</tspan> ──► 必须抓 <tspan font-weight="700">Off-CPU 火焰图</tspan>，排查数据库行锁竞争、同步 fsync 阻塞或下游网络超时</text>
        </g>
      </g>
    </g>
  </g>
</svg>
