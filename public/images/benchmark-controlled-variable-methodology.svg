<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="benchmark-controlled-variable-methodology-title benchmark-controlled-variable-methodology-desc"><title id="benchmark-controlled-variable-methodology-title">基准测试控制变量法则：消除 CPU 降频、GC 干扰与预热不足的科学矩阵</title><desc id="benchmark-controlled-variable-methodology-desc">基准测试控制变量法则：消除 CPU 降频、GC 干扰与预热不足的科学矩阵</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">基准测试控制变量法四大物理防线 (Single-Variable Benchmark)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 固定 CPU 频率 (禁用动态睿频) ｜ 2. 充足预热 (JIT 编译/分支预测) ｜ 3. 重复执行多次 (统计置信度) ｜ 4. benchstat 统计假设检验</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. CPU 频率与核心绑定</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">消除硬件环境抖动：</text>

          <text x="8" y="38" fill="#f5f5f5">• 禁用 Intel Turbo Boost 睿频</text>
          <text x="8" y="54" fill="#f5f5f5">• taskset -c 2 绑定独立核心</text>
          <text x="8" y="70" fill="#cbd5e1">• 设置 governor=performance</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 保证基准始终在恒定算力下运行！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 消除 CPU 发热降频带来的伪劣结果；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 杜绝跨核迁移上下文开销；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 硬件级基线锁死。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 充分系统预热</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">热身与状态稳态：</text>

          <text x="8" y="38" fill="#f5f5f5">• 提前执行 100,000 次预热循环</text>
          <text x="8" y="54" fill="#f5f5f5">• 填充 CPU L1/L2/L3 缓存</text>
          <text x="8" y="70" fill="#f5f5f5">• 训练 CPU 分支预测器 (BPU)</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 剥离冷启动第一拍噪音！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 避免冷启动分页故障 (Page Fault)；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 让 JIT/编译器彻底进入优化态；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 捕捉真实稳态性能。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 内存与 GC 隔离</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">垃圾回收干扰剔除：</text>

          <text x="8" y="38" fill="#f5f5f5">• b.ResetTimer() 排除准备阶段</text>
          <text x="8" y="54" fill="#f5f5f5">• b.ReportAllocs() 监视 allocs/op</text>
          <text x="8" y="70" fill="#f5f5f5">• runtime.GC() 统一在轮次间执行</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 纯净度量算法本身开销！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 明确区分 CPU 计算耗时与 GC 停顿；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 杜绝前置对象残留引发连锁清扫；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 保证每次样本同一起跑线。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">4. benchstat 统计检验</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">双样本统计假设检验：</text>

          <text x="8" y="38" fill="#f5f5f5">• go test -count=10 重复采样</text>
          <text x="8" y="54" fill="#f5f5f5">• 运行 benchstat old.txt new.txt</text>
          <text x="8" y="70" fill="#f5f5f5">• 验证 p-value &lt; 0.05 统计显著性</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 杜绝“碰巧变快”的虚假优化！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 科学量化性能提升百分比；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 建立不可辩驳的工程证据链；</text>
        <text x="10" y="224" font-size="7.5" fill="#2d3142">• 严谨工程科学的最高典范！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
