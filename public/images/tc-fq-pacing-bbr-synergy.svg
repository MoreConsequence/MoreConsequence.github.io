<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="tc-fq-pacing-bbr-synergy-title tc-fq-pacing-bbr-synergy-desc"><title id="tc-fq-pacing-bbr-synergy-title">Fair Queueing (fq) 匀速起搏与 Google BBR 拥塞控制深度联动</title><desc id="tc-fq-pacing-bbr-synergy-desc">对比图展示传统 CUBIC 突发大包引发交换机 Bufferbloat 延迟膨胀与 Google BBR 联动 fq 纳秒级 EDT 匀速起搏消灭排队延迟的物理机理。</desc>
  <defs>
    <marker id="fb-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="fb-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">TCP PACING &amp; CONGESTION CONTROL · FQ &amp; BBR SYNERGY</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">Fair Queueing 匀速起搏与 Google BBR 深度联动</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">传统 CUBIC 突发丢包与 Bufferbloat 延迟膨胀 vs Google BBR 测算 BDP 联动 fq 纳秒级 EDT 匀速发包</text>

  
  <g transform="translate(40, 136)">
    <rect width="880" height="170" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="150" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="89" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CUBIC + PFIFO_FAST</text>
    <text x="174" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">传统 CUBIC 突发发包引发 Bufferbloat 灾难</text>

    
    <g transform="translate(14, 42)">
      
      <rect x="0" y="0" width="195" height="74" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
      <text x="12" y="22" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. CWND 突发释放</text>
      <text x="12" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">一口气释放整窗数据包</text>
      <text x="12" y="56" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Burst: 64KB+ 瞬间涌入</text>

      <line x1="195" y1="37" x2="220" y2="37" stroke="#4f5d75" stroke-width="1" marker-end="url(#fb-arr)" />

      
      <rect x="220" y="0" width="200" height="74" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="232" y="22" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 交换机队列填满</text>
      <text x="232" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">中间路由器 FIFO 队列溢出</text>
      <text x="232" y="56" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Bufferbloat 缓冲区膨胀</text>

      <line x1="420" y1="37" x2="445" y2="37" stroke="#4f5d75" stroke-width="1" marker-end="url(#fb-arr)" />

      
      <rect x="445" y="0" width="200" height="74" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="457" y="22" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">3. 排队时延暴增</text>
      <text x="457" y="40" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">RTT: 10ms ➔ 500ms+</text>
      <text x="457" y="56" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">微秒级接口被长尾挤爆</text>

      <line x1="645" y1="37" x2="670" y2="37" stroke="#4f5d75" stroke-width="1" marker-end="url(#fb-arr)" />

      
      <rect x="670" y="0" width="182" height="74" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
      <text x="682" y="22" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">4. 丢包与窗口减半</text>
      <text x="682" y="40" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">CWND 腰斩 50%</text>
      <text x="682" y="56" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">带宽剧烈颠簸震荡</text>
    </g>

    
    <rect x="14" y="126" width="852" height="32" rx="2" fill="#f5f5f5" />
    <text x="24" y="146" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">致命痛点：基于丢包反馈的传统拥塞控制无法区分“丢包”与“排队”，导致高吞吐下延迟不可控！</text>
  </g>

  
  <g transform="translate(40, 320)">
    <rect width="880" height="186" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="120" height="18" rx="2" fill="#eb6c36" />
    <text x="74" y="25" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">BBR + FQ PACING</text>
    <text x="144" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Google BBR 联动 fq 纳秒级匀速起搏 (0 排队延迟)</text>

    
    <g transform="translate(14, 42)">
      
      <rect x="0" y="0" width="200" height="88" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
      <text x="12" y="24" fill="#eb6c36" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">1. BDP 物理建模测算</text>
      <text x="12" y="42" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">BDP = BtlBw * RTprop</text>
      <text x="12" y="58" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">测得瓶颈带宽与最小时延</text>
      <text x="12" y="74" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">Pacing Rate = BtlBw (线速)</text>

      <line x1="200" y1="44" x2="225" y2="44" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fb-arr-accent)" />

      
      <rect x="225" y="0" width="200" height="88" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
      <text x="237" y="22" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">2. EDT 时间戳打标</text>
      <text x="237" y="38" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Earliest Departure Time</text>
      <text x="237" y="54" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">skb-&gt;tstamp = now + Δt</text>
      <text x="237" y="70" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">按微秒均匀间隔打标</text>

      <line x1="425" y1="44" x2="450" y2="44" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fb-arr-accent)" />

      
      <rect x="450" y="0" width="200" height="88" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
      <text x="462" y="22" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">3. fq 红黑树起搏调度</text>
      <text x="462" y="38" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Fair Queueing Flow Hash</text>
      <text x="462" y="54" fill="#2d3142" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">高精度定时器严格定序</text>
      <text x="462" y="70" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">每 20μs 平滑推入 1 包</text>

      <line x1="650" y1="44" x2="675" y2="44" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fb-arr-accent)" />

      
      <rect x="675" y="0" width="177" height="88" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
      <text x="687" y="22" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">4. 交换机 0 积压</text>
      <text x="687" y="38" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">Queue Backlog = 0</text>
      <text x="687" y="54" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">RTT 恒定 10ms 极限</text>
      <text x="687" y="70" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">100% 满带宽无损吞吐</text>
    </g>

    
    <rect x="14" y="140" width="852" height="34" rx="2" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="161" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">调优铁律：开启 BBR 时必须配置 net.core.default_qdisc = fq，提供内核硬件时钟 Pacing 支撑！</text>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">传统突发拥塞路径</text>
  <rect x="290" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="310" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">BBR 测算与 fq 纳秒起搏核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
