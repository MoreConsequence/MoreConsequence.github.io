<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Fair Queueing (fq) 匀速起搏（Pacing）与 Google BBR 拥塞控制深度联动</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">传统突发大包打爆交换机 Buffer (Bufferbloat) vs fq 排队规则按 BDP 速率纳秒级匀速发送消除排队时延</text>
  </g>

  <!-- Main Comparison Panes (435px each) -->
  <g transform="translate(30, 75)">
    <!-- Pane 1: Traditional Burst & Bufferbloat (435px) -->
    <g filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
      <rect width="435" height="36" rx="8" fill="#fef2f2"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统无 Pacing：突发大包与 Bufferbloat 拥塞</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Steps -->
        <rect width="403" height="36" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="12" y="16" fill="#991b1b" font-weight="700">1. TCP 窗口一次性释放一整组数据包 (Burst)</text>
        <text x="12" y="28" font-size="9.5" fill="#7f1d1d">几十个数据包瞬间并发涌向网卡队列</text>

        <rect y="42" width="403" height="42" rx="4" fill="#fee2e2" stroke="#f87171"/>
        <text x="12" y="16" fill="#7f1d1d" font-weight="700">2. 中间交换机缓冲区瞬间被填满 (Bufferbloat)</text>
        <text x="12" y="30" font-size="9.5" fill="#991b1b">引发高达数百毫秒的排队延迟，甚至突发丢包！</text>

        <rect y="92" width="403" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="12" y="16" fill="#0f172a" font-weight="700">3. CUBIC 算法误判为网络拥塞</text>
        <text x="12" y="30" font-size="9.5" fill="#64748b">拥塞窗口断崖式减半，吞吐发生剧烈震荡！</text>
      </g>
    </g>

    <!-- Pane 2: fq Pacing + BBR (435px) -->
    <g transform="translate(465, 0)" filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="36" rx="8" fill="#f0fdf4"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">⚡ fq 匀速 Pacing + BBR 算法：极速且平滑</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Steps -->
        <rect width="403" height="36" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
        <text x="12" y="16" fill="#14532d" font-weight="700">1. BBR 精确测量网络瓶颈带宽 (BtlBw) 与 RTT</text>
        <text x="12" y="28" font-size="9.5" fill="#15803d">计算出最优发包速率 Pacing Rate = BtlBw × 1.0</text>

        <rect y="42" width="403" height="42" rx="4" fill="#ecfdf5" stroke="#10b981"/>
        <text x="12" y="16" fill="#047857" font-weight="700">2. fq 排队规则负责微秒级定时起搏发送 (Pacing)</text>
        <text x="12" y="30" font-size="9.5" fill="#065f46">将数据包严格均匀间隔（如每 20μs 发 1 包），零突发！</text>

        <rect y="92" width="403" height="42" rx="4" fill="#d1fae5"/>
        <text x="12" y="16" fill="#065f46" font-weight="700">3. 交换机队列排队时延趋近于 0</text>
        <text x="12" y="30" font-size="9.5" font-weight="700" fill="#047857">吞吐跑满带宽的同时，网络往返延迟降至物理光纤极限！</text>
      </g>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(30, 375)">
    <rect width="900" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <text x="450" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      💡 <tspan font-weight="700" fill="#0f172a">内核网络调优铁律：</tspan> 开启 BBR 时必须配置 <tspan font-weight="700" fill="#2563eb">`net.core.default_qdisc = fq`</tspan>；
      BBR 负责计算大脑，fq 负责物理肢体匀速发包，二者双剑合璧方能发挥真正威力。
    </text>
  </g>
</svg>
