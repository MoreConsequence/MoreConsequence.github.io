<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dependency-upgrade-resource-drift-title dependency-upgrade-resource-drift-desc"><title id="dependency-upgrade-resource-drift-title">四类资源特征漂移的捕获指标映射</title><desc id="dependency-upgrade-resource-drift-desc">四类漂移互不替代：分配型改变堆分配与峰值存活内存，唯一能抓住它的是堆占用的 p99 与最大值；占有时长型改变持有时间，唯一指标是 in-use 分布尾部；扇出放大型改变下游调用次数，唯一指标是扇出比；唤醒节拍型改变定时器与心跳频率，唯一指标是空闲时段的基线 CPU 与系统调用率。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">四类漂移互不替代，每一类只有一个指标能抓住它</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">只盯延迟，等于放弃了分配型与占有时长型的早期预警</text>

<text x="48" y="100" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">漂移类型</text>
<text x="568" y="100" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">唯一能抓住它的指标</text>

<!-- row 1: allocation -->
<rect x="48" y="116" width="432" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="142" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.10em">类型一 · ALLOCATION</text>
<text x="64" y="166" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">分配型</text>
<text x="64" y="188" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">堆分配次数与峰值存活内存，经 GC 耦合到全部请求</text>
<line x1="480" y1="158" x2="544" y2="158" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="568" y="116" width="344" height="84" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="584" y="148" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">堆占用的 p99 与最大值</text>
<text x="584" y="170" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不看均值——抬头的是所有接口的尾延迟</text>

<!-- row 2: hold duration -->
<rect x="48" y="216" width="432" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="242" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.10em">类型二 · HOLD DURATION</text>
<text x="64" y="266" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">占有时长型</text>
<text x="64" y="288" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">连接、锁、goroutine 的持有时间；每次久一点 = 并发上升</text>
<line x1="480" y1="258" x2="544" y2="258" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="568" y="216" width="344" height="84" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="584" y="248" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">in-use 数量的分布尾部</text>
<text x="584" y="270" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">在资源被抢光之前完全不可见</text>

<!-- row 3: amplification -->
<rect x="48" y="316" width="432" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="342" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.10em">类型三 · AMPLIFICATION</text>
<text x="64" y="366" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">扇出放大型</text>
<text x="64" y="388" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">一次业务调用触发的下游调用次数；下游按旧扇出规划容量</text>
<line x1="480" y1="358" x2="544" y2="358" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="568" y="316" width="344" height="84" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="584" y="348" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">每入站请求对应的出站请求数</text>
<text x="584" y="370" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">扇出比 amplification ratio</text>

<!-- row 4: wake-up cadence (focal - invisible until idle) -->
<rect x="48" y="416" width="432" height="84" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
<text x="64" y="442" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.10em">类型四 · WAKE-UP CADENCE</text>
<text x="64" y="466" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">唤醒节拍型</text>
<text x="64" y="488" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">定时器、心跳、轮询、keepalive；低峰期 CPU 不降才显形</text>
<line x1="480" y1="458" x2="544" y2="458" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="568" y="416" width="344" height="84" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="584" y="448" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">空闲时段的基线 CPU 与系统调用率</text>
<text x="584" y="470" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">余量在最需要它的时刻已被吃掉</text>

<text x="48" y="536" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">升级对照实验的四张图：堆峰值、in-use 尾部、扇出比、空闲基线——一变量一图，缺席即漂移</text>

</svg>
