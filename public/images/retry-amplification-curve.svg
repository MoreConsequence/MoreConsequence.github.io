<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="retry-amp-title retry-amp-desc"><title id="retry-amp-title">重试放大量随失败率曲线</title><desc id="retry-amp-desc">最多 3 次重试下，下游额外负载随失败率从 0.1% 到 20% 由 0.1% 爬到 24.8%，10% 处画熔断线，之后放大恒为零。</desc>
  <defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="40" y="48" fill="#2d3142" font-size="24" font-family="'Instrument Serif', Georgia, serif">重试放大量：p=20% 时多付 25% 负载</text>
  <text x="40" y="72" fill="#4f5d75" font-size="12" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">额外负载 = p+p²+p³，最多 3 次重试（retry.py 纯算术）</text>

  <!-- Gridlines + Y labels (extra-load %, y = 420 - 14.4v) -->
  <line x1="120" y1="420" x2="904" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">0%</text>
  <line x1="120" y1="348" x2="904" y2="348" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">5%</text>
  <line x1="120" y1="276" x2="904" y2="276" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">10%</text>
  <line x1="120" y1="204" x2="904" y2="204" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">15%</text>
  <line x1="120" y1="132" x2="904" y2="132" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">20%</text>
  <line x1="120" y1="60" x2="904" y2="60" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">25%</text>

  <!-- Fuse line at p=10% (x=680) -->
  <line x1="680" y1="60" x2="680" y2="420" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="692" y="88" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="752" y="97" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">p&gt;10% 熔断</text>

  <!-- Focal series: [0.1,0.5,1.01,2.04,5.26,11.1,17.59,24.8] -->
  <polyline points="120,419 232,413 344,405 456,391 568,344 680,260 792,167 904,63"
            fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="120" cy="419" r="4" fill="#eb6c36"/>
  <circle cx="232" cy="413" r="4" fill="#eb6c36"/>
  <circle cx="344" cy="405" r="4" fill="#eb6c36"/>
  <circle cx="456" cy="391" r="4" fill="#eb6c36"/>
  <circle cx="568" cy="344" r="4" fill="#eb6c36"/>
  <circle cx="680" cy="260" r="4" fill="#eb6c36"/>
  <circle cx="792" cy="167" r="4" fill="#eb6c36"/>
  <circle cx="904" cy="63" r="4" fill="#eb6c36"/>
  <rect x="832" y="40" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="868" y="49" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">+24.8%</text>

  <!-- X labels -->
  <text x="120" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">0.1%</text>
  <text x="232" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">0.5%</text>
  <text x="344" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">1%</text>
  <text x="456" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">2%</text>
  <text x="568" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">5%</text>
  <text x="680" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">10%</text>
  <text x="792" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">15%</text>
  <text x="904" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">20%</text>

  <!-- Legend -->
  <line x1="40" y1="472" x2="960" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="484" width="16" height="8" fill="#eb6c36"/>
  <text x="144" y="492" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">额外负载</text>
  <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">SOURCE: retry.py 1+p+p*p+p*p*p, domain p 0.1-20%</text>
</svg>
