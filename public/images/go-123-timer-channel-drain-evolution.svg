<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 1.23 定时器运行时重大革命 (Timer Overhaul)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">老版本 (1 容量缓冲通道 + 复杂的 if !t.Stop() &lt;-t.C 样板代码) ──► Go 1.23+ (无缓冲同步通道 + 无引用自动 GC 回收 + Reset 0 竞态安全)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Pre-1.23 -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ Go ≤ 1.22：复杂的排空样板代码陷阱</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 历史遗留正确 Reset 样板代码：</text>
          <text y="28" fill="#fca5a5">if !t.Stop() {</text>
          <text y="42" fill="#ef4444">    select {</text>
          <text y="56" fill="#ef4444">    case &lt;-t.C: // 必须手动排空缓冲通道！</text>
          <text y="70" fill="#f87171">    default:</text>
          <text y="84" fill="#ef4444">    }</text>
          <text y="98" fill="#fca5a5">}</text>
          <text y="112" fill="#f87171">t.Reset(d)</text>
          
          <text y="130" fill="#ef4444">💥 稍有不慎漏写就会导致通道遗留旧事件或死锁挂起！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">历史痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 心智负担极其沉重，极易写出偶发性 Bug；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 未触发的 Timer 即使毫无引用也无法被 GC 提前回收；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 倒逼 Go 核心团队重构整个定时器！</text>
      </g>
    </g>

    <!-- Right: Go 1.23+ -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Go 1.23+ 重构：直观、安全、自动 GC</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// Go 1.23+ 现代标准：直接调用 Reset！</text>
          <text y="28" fill="#86efac">t.Reset(d) // 0 手工排空、0 样板代码！</text>
          
          <text y="50" fill="#38bdf8">三大划时代改进：</text>
          <text y="64" fill="#34d399">1. timer.C 改为同步无缓冲通道，消除脏事件残留</text>
          <text y="78" fill="#34d399">2. 未到期的 Timer 若无引用，GC 可自动将其彻底回收！</text>
          <text y="92" fill="#34d399">3. time.After 泄漏问题在语言底层被大幅缓解</text>
          
          <text y="116" fill="#4ade80">✓ 编写完全符合直觉，彻底告别历史包袱！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 语言与运行时演进最亮眼的成果之一；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 极大简化复杂超时与心跳控制逻辑；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化 Go 规范标准！</text>
      </g>
    </g>
  </g>
</svg>