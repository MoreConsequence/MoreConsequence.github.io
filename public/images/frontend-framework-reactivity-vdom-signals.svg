<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">现代三大响应式更新粒度对比：React vs Vue vs SolidJS</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">React (组件级全量 Re-render + Fiber 调度) vs Vue (Proxy 依赖收集 + 组件级 VDOM) vs SolidJS (Signal 点对点精准绑定)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- React -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. React: 粗粒度组件级刷新</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// setState 触发整个函数重新执行</text>
          <text x="10" y="34" fill="#93c5fd">1. 调用 setState(newValue)</text>
          <text x="10" y="48" fill="#93c5fd">2. 该组件函数从头到尾全部重跑一遍！</text>
          <text x="10" y="64" fill="#93c5fd">3. 子组件默认随父组件一同全部重跑</text>
          <text x="10" y="80" fill="#fbbf24">4. Fiber 架构可中断时间切片调度</text>
          <text x="10" y="98" fill="#34d399">✓ 纯纯的不可变数据流 (Immutable)</text>
          <text x="10" y="114" fill="#f87171">❌ 依赖 useMemo / useCallback 手工优化</text>
          <text x="10" y="130" fill="#fca5a5">容易产生大量无效闭包与重渲染！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">心智特征：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 崇尚函数式与单一数据流</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 并发模式 (Concurrent Mode) 削峰填谷</text>
        <text x="10" y="62" font-size="7.5" fill="#1d4ed8">• 适合超大型复杂企业级中后台</text>
      </g>
    </g>

    <!-- Vue -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Vue 3: Proxy 自动依赖收集</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 响应式代理与精确到组件的更新</text>
          <text x="10" y="34" fill="#86efac">1. reactive() 基于 ES6 Proxy 拦截 get/set</text>
          <text x="10" y="48" fill="#86efac">2. 读属性时 track() 收集当前 Component Effect</text>
          <text x="10" y="62" fill="#86efac">3. 写属性时 trigger() 仅通知该组件自身更新</text>
          <text x="10" y="78" fill="#38bdf8">4. 配合 Block Tree 静态标记靶向 Diff</text>
          <text x="10" y="98" fill="#34d399">✓ 子组件绝不无故重新渲染！</text>
          <text x="10" y="114" fill="#34d399">✓ 零手写 useMemo，心智极其舒适！</text>
          <text x="10" y="130" fill="#86efac">✓ 内部依然存在轻量级 VDOM Diff</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">心智特征：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 渐进式与极致的开箱即用易用性</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 编译期静态分析 + 运行时 Proxy 完美融合</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 国内外工业界普及率极高</text>
      </g>
    </g>

    <!-- SolidJS -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. SolidJS: 微观 Signals 节点直达</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 组件只执行一次！零 VDOM！</text>
          <text x="10" y="34" fill="#fed7aa">1. 组件函数在初始化时仅执行一次建图</text>
          <text x="10" y="48" fill="#fed7aa">2. createSignal 自动绑定到底层 DOM TextNode</text>
          <text x="10" y="64" fill="#34d399">3. 修改 signal 时：整个组件绝不重跑！</text>
          <text x="10" y="80" fill="#34d399">4. 仅触发闭包内的 textNode.data = val;</text>
          <text x="10" y="100" fill="#4ade80">✓ 内存占用极低，零 VDOM 树比对开销！</text>
          <text x="10" y="116" fill="#4ade80">✓ JS Benchmark 跑分全球顶级！</text>
          <text x="10" y="132" fill="#38bdf8">► 代表了现代前端响应式演进的终极形态！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">心智特征：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• JSX 语法的简洁性 + 细粒度响应性能</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 彻底摆脱 Hooks 闭包陷阱与依赖数组</text>
        <text x="10" y="62" font-size="7.5" fill="#9a3412">• 成为新一代全栈框架 (SolidStart) 基石</text>
      </g>
    </g>
  </g>
</svg>