<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 会话预算三级刹车模型：为什么到限额才刹车 100% 会超支</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">事后统计 (超支 40%+) ──► 单次最大预估扣除 (提前拒绝) ──► 双轨预算：硬上限 (Hard Limit) + 软上限 (Soft Compact)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Brake 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 事后刹车：100% 必然超支</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// 传统天真写法</text>
          <text x="10" y="34" fill="#fca5a5">if (usedTokens &gt;= MAX_BUDGET) break;</text>
          <text x="10" y="48" fill="#cbd5e1">const resp = await llm.generate();</text>
          <text x="10" y="64" fill="#cbd5e1">usedTokens += resp.usage.total;</text>
          
          <text x="10" y="86" fill="#ef4444">🔴 致命缺陷：</text>
          <text x="10" y="102" fill="#fca5a5">当前已用 99,000 / 100,000 (未超)</text>
          <text x="10" y="118" fill="#fb7185">最后一次 LLM 调用生成了 8,000 Tokens</text>
          <text x="10" y="134" fill="#ef4444">► 最终消耗 107,000，超支 7% ~ 50%！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• API 账单月末严重超额；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 极端情况死循环调用引发万元天价账单；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法给多租户提供严密额度保障！</text>
      </g>
    </g>

    <!-- Brake 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 预估预扣款刹车 (Pre-Check)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 每次调用前预估最坏情况</text>
          <text x="10" y="34" fill="#fed7aa">const maxOutput = model.maxTokens;</text>
          <text x="10" y="50" fill="#fed7aa">const promptTokens = count(messages);</text>
          <text x="10" y="68" fill="#38bdf8">const estimatedWorst = promptTokens + maxOutput;</text>
          
          <text x="10" y="90" fill="#34d399">if (used + estimatedWorst &gt; MAX) {</text>
          <text x="16" y="106" fill="#4ade80">  gracefulExit("预算不足以支撑完整轮次");</text>
          <text x="10" y="122" fill="#34d399">}</text>
          <text x="10" y="138" fill="#86efac">✓ 100% 绝对不会超出硬预算上限！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">优缺点评估：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 优点：严格零超支安全；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 缺点：预估过保守可能导致任务提前中断；</text>
        <text x="10" y="62" font-size="7.5" fill="#9a3412">• 适合按量计费的 SaaS 商业化场景。</text>
      </g>
    </g>

    <!-- Brake 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 双轨平滑自适应压缩 (生产黄金解)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 软硬双阈值分级治理</text>
          <text x="10" y="34" fill="#86efac">1. 超过 70% 软阈值 (Soft Limit):</text>
          <text x="16" y="48" fill="#38bdf8">   自动触发历史消息摘要压缩 (Compact)</text>
          <text x="16" y="62" fill="#38bdf8">   将 20 轮上下文精简为 1 份结构化记忆！</text>
          
          <text x="10" y="82" fill="#86efac">2. 超过 90% 预警阈值:</text>
          <text x="16" y="96" fill="#fbbf24">   禁用高消耗 Tools，强制 Agent 生成总结！</text>
          
          <text x="10" y="116" fill="#34d399">3. 达 100% 硬上限: 优雅停机并保存快照</text>
          <text x="10" y="132" fill="#34d399">✓ 既保证任务完成率，又绝不超支！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 上下文利用率提升 300%；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 避免了直接硬截断导致的回答残缺；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造生产级企业智能体最核心的成本护城河！</text>
      </g>
    </g>
  </g>
</svg>