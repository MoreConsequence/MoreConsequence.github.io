  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">间接提示词注入与物理沙箱隔离体系</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">第三方代码注入 ➔ 突破应用层正则 ➔ Bubblewrap (5ms 命名空间) ➔ Docker 容器 ➔ Gondolin MicroVM 硬件隔离</text>

