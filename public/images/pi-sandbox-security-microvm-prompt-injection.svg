  <title id="sb-title">间接提示词注入攻击面与物理沙箱隔离架构</title>
  <desc id="sb-desc">全景架构图展示第三方开源仓库间接提示词注入攻击路径，以及从本机裸奔到 Linux Bubblewrap、Docker 容器与 Gondolin 硬件级微虚拟机 MicroVM 的多层次物理安全隔离防护体系。</desc>
  <defs>
