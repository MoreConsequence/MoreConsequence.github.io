<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" width="960" height="480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dependency-upgrade-four-layers-title dependency-upgrade-four-layers-desc"><title id="dependency-upgrade-four-layers-title">兼容的四个层次</title><desc id="dependency-upgrade-four-layers-desc">兼容分四层：语法兼容由编译器强制守卫，语义兼容由测试部分守卫，资源特征兼容与并发节拍兼容没有任何自动化守卫。编译器与测试的覆盖到第二层为止，而升级事故几乎全部来自后两层的静默漂移。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">「兼容」这个词混杂了四件互不相关的事</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">工具链能守住前两层，而升级事故几乎全部来自后两层</text>

<!-- column headers -->
<text x="104" y="100" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">层次</text>
<text x="280" y="100" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">漂移的内容</text>
<text x="668" y="100" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">自动化守卫</text>

<!-- left direction indicator -->
<line x1="72" y1="136" x2="72" y2="352" stroke="#7a8399" stroke-width="1" marker-end="url(#arrow)"/>
<text x="60" y="248" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" transform="rotate(-90 60 248)" text-anchor="middle" letter-spacing="0.10em">自动化越往下越守不住</text>

<!-- stack silhouette -->
<rect x="104" y="128" width="800" height="248" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<!-- L1 -->
<rect x="105" y="129" width="798" height="60" fill="#f5f5f5"/>
<text x="124" y="164" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">L1</text>
<text x="164" y="165" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">语法兼容</text>
<text x="280" y="154" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">函数签名、类型、导出符号</text>
<text x="280" y="172" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">破坏它的代价是编译失败</text>
<text x="668" y="154" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">编译器</text>
<text x="668" y="172" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">强制</text>

<!-- L2 -->
<rect x="105" y="189" width="798" height="60" fill="#ffffff"/>
<text x="124" y="224" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">L2</text>
<text x="164" y="225" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">语义兼容</text>
<text x="280" y="214" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">输入输出、错误分类、边界行为</text>
<text x="280" y="232" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">没写进测试的那部分没有守卫</text>
<text x="668" y="214" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">测试</text>
<text x="668" y="232" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">只覆盖测到的</text>

<!-- guard boundary between L2 and L3 -->
<line x1="104" y1="249" x2="904" y2="249" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="904" y="242" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">编译器与测试的覆盖到此为止</text>

<!-- L3 (focal) -->
<rect x="105" y="250" width="798" height="62" fill="rgba(235,108,54,0.06)"/>
<text x="124" y="286" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">L3</text>
<text x="164" y="287" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">资源特征兼容</text>
<text x="280" y="276" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">堆分配量、锁与连接的持有时长</text>
<text x="280" y="294" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">文件描述符与 goroutine 的生命周期</text>
<text x="668" y="285" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">无</text>

<!-- L4 -->
<rect x="105" y="313" width="798" height="62" fill="#ffffff"/>
<text x="124" y="349" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">L4</text>
<text x="164" y="350" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">并发与节拍兼容</text>
<text x="280" y="339" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">重试次数、批处理大小</text>
<text x="280" y="357" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">keepalive 与轮询频率，只在空闲时显形</text>
<text x="668" y="348" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">无</text>

<!-- bottom takeaway -->
<line x1="48" y1="412" x2="912" y2="412" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="48" y="442" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">升级验证因此不是「再跑一遍回归测试」，而是一次只换一个变量的资源特征对比实验</text>

</svg>
