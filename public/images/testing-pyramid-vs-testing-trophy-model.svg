<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="testing-pyramid-vs-testing-trophy-model-title testing-pyramid-vs-testing-trophy-model-desc"><title id="testing-pyramid-vs-testing-trophy-model-title">测试分层模型演进：经典测试金字塔 (Testing Pyramid) vs 现代测试奖杯 (Testing…</title><desc id="testing-pyramid-vs-testing-trophy-model-desc">测试分层模型演进：经典测试金字塔 (Testing Pyramid) vs 现代测试奖杯 (Testing Trophy)</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2d3142" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f5f5f5"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">软件工程测试策略模型对决：测试金字塔 vs 现代测试奖杯 (Testing Trophy)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">经典金字塔 (70% 纯 Mock 单元测试 + 20% 集成 + 10% E2E) vs 现代测试奖杯 (静态类型 + 集成测试作为核心中坚，最大化投入产出比 ROI)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Classic Pyramid -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">经典测试金字塔 (Testing Pyramid: Mike Cohn)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#38bdf8">1. 顶层: 端到端 E2E 测试 (10% - 极慢且极其脆弱容易误报)</text>
          <text y="28" fill="#86efac">2. 中层: 服务集成测试 (20% - 跨组件验证)</text>
          <text y="42" fill="#4ade80">3. 底座: 单元测试 Unit Tests (70% - 纯函数极速秒跑)</text>

          <text y="66" fill="#fb923c">现代微服务痛点：</text>
          <text y="80" fill="#fca5a5">• 过度 Mock 数据库与网络导致“单测全绿，线上全崩”！</text>
          <text y="94" fill="#ef4444">• 测试代码严重与内部实现细节过度耦合，阻碍重构。</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制特性：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 传统单体代码库时代经典标准；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 单元测试反馈速度极快 (毫秒级)；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 纯算法密集型模块仍然适用。</text>
      </g>
    </g>

    <!-- Right: Modern Trophy -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">现代测试奖杯 (Testing Trophy: Kent C. Dodds)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#4ade80">以集成测试为中流砥柱 (Write tests, not too many, mostly integration):</text>

          <text y="38" fill="#38bdf8">• Static: TypeScript / ESLint 编译期干掉 50% 低级语法错误</text>
          <text y="52" fill="#86efac">• Unit: 专注复杂状态机与纯数学边界证明</text>
          <text y="66" fill="#4ade80">• Integration (核心胖腰身): 基于真实 Testcontainers 跑完整流程</text>
          <text y="80" fill="#38bdf8">• E2E: 仅覆盖冒烟主链路 (如登录与下单)</text>

          <text y="106" fill="#4ade80">✓ 投资回报率 (ROI) 与生产置信度最高！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 真实测试系统行为而非实现细节，重构 0 阻碍；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 现代化云原生与全栈 Web 事实标准；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 软件质量工程最高指导范式！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
