<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">向量时钟（Vector Clock）时空流转与并发分叉判定全景</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">三节点时空生命线：本地事件递增自自分量 ──► 跨节点消息携带全局向量 ──► 并发无序分支 ($V_A \parallel V_B$) 精准捕获</text>
  </g>

  <!-- Main Timeline Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Spacetime Timeline Area (560px) -->
    <g transform="translate(20, 20)">
      <!-- 3 Node Lifelines -->
      <!-- Node A -->
      <g transform="translate(0, 30)">
        <rect x="0" y="-12" width="70" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="35" y="4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">节点 A</text>
        <line x1="80" y1="0" x2="520" y2="0" stroke="#cbd5e1" stroke-width="2"/>

        <!-- Event a1: [1, 0, 0] -->
        <circle cx="130" cy="0" r="5" fill="#2563eb"/>
        <rect x="105" y="-30" width="50" height="18" rx="3" fill="#2563eb"/>
        <text x="130" y="-18" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">[1, 0, 0]</text>

        <!-- Event a2: [2, 0, 0] -->
        <circle cx="340" cy="0" r="5" fill="#ea580c"/>
        <rect x="315" y="-30" width="50" height="18" rx="3" fill="#ea580c"/>
        <text x="340" y="-18" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">[2, 0, 0]</text>
      </g>

      <!-- Node B -->
      <g transform="translate(0, 105)">
        <rect x="0" y="-12" width="70" height="24" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="35" y="4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">节点 B</text>
        <line x1="80" y1="0" x2="520" y2="0" stroke="#cbd5e1" stroke-width="2"/>

        <!-- Event b1: Receive from A -> [1, 1, 0] -->
        <circle cx="230" cy="0" r="5" fill="#10b981"/>
        <rect x="205" y="-30" width="50" height="18" rx="3" fill="#10b981"/>
        <text x="230" y="-18" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">[1, 1, 0]</text>

        <!-- Event b2: Local event -> [1, 2, 0] -->
        <circle cx="440" cy="0" r="5" fill="#ea580c"/>
        <rect x="415" y="-30" width="50" height="18" rx="3" fill="#ea580c"/>
        <text x="440" y="-18" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">[1, 2, 0]</text>
      </g>

      <!-- Node C -->
      <g transform="translate(0, 180)">
        <rect x="0" y="-12" width="70" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="35" y="4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">节点 C</text>
        <line x1="80" y1="0" x2="520" y2="0" stroke="#cbd5e1" stroke-width="2"/>

        <!-- Event c1: [0, 0, 1] -->
        <circle cx="160" cy="0" r="5" fill="#64748b"/>
        <rect x="135" y="10" width="50" height="18" rx="3" fill="#64748b"/>
        <text x="160" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">[0, 0, 1]</text>
      </g>

      <!-- Message Arrow: a1 -> b1 -->
      <line x1="130" y1="30" x2="225" y2="100" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
      <rect x="155" y="55" width="60" height="16" rx="2" fill="#dbeafe"/>
      <text x="185" y="66" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e40af" text-anchor="middle">msg: [1,0,0]</text>
    </g>

    <!-- Right Side: Conflict Analysis Panel (320px) -->
    <g transform="translate(560, 20)">
      <rect width="320" height="230" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="320" height="32" rx="6" fill="#ffedd5"/>
      <text x="160" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">⚡ 并发冲突判定算法 ($V_A \parallel V_B$)</text>

      <g transform="translate(12, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
        <rect width="296" height="46" rx="4" fill="#ffffff" stroke="#fed7aa"/>
        <text x="10" y="16" font-weight="700" fill="#9a3412">1. 观察事件 a2 与 b2 的向量值：</text>
        <text x="10" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#c2410c">$V_{a2} = [2, 0, 0]$  vs  $V_{b2} = [1, 2, 0]$</text>

        <rect y="54" width="296" height="52" rx="4" fill="#ffffff" stroke="#fed7aa"/>
        <text x="10" y="16" font-weight="700" fill="#9a3412">2. 偏序关系数学比对：</text>
        <text x="10" y="30" font-size="9.5" fill="#475569">• 维度 1: $2 > 1$ ($V_{a2}$ 占优)</text>
        <text x="10" y="44" font-size="9.5" fill="#475569">• 维度 2: $0 &lt; 2$ ($V_{b2}$ 占优)</text>

        <rect y="114" width="296" height="56" rx="4" fill="#ffedd5"/>
        <text x="10" y="18" font-weight="700" fill="#c2410c">判定结果：$V_{a2} \parallel V_{b2}$（无绝对因果先后！）</text>
        <text x="10" y="32" font-size="9" fill="#9a3412">系统发生并行分叉，不执行粗暴 LWW 覆盖，</text>
        <text x="10" y="44" font-size="9" font-weight="700" fill="#ea580c">保留两份兄弟版本（Siblings）交由应用层合并！</text>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">向量时钟本质：</tspan> 它用 $O(N)$ 空间开销完整记录了 <tspan font-weight="700" fill="#2563eb">“每个节点见证过的因果历史”</tspan>；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
        既能 100% 识别 $A \to B$ 因果依赖，又能精准捕获 $A \parallel B$ 并发冲突，是 DynamoDB 等无中心存储的物理基石。
      </text>
    </g>
  </g>
</svg>
