<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">HTTP/2 HPACK 头部压缩：静态表索引 + 动态滑动窗口表 + Huffman 编码</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">重复请求 Header (1.5KB) ──► 动态表差量索引 (仅传输 1 个字节 Index: 62) ──► 头部体积压缩率高达 95%</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 静态预置表 (Static Table: 1~61)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">RFC 7541 预定义的 61 个高频头部：</text>
          <text x="10" y="38" fill="#86efac">1: :authority</text>
          <text x="10" y="54" fill="#86efac">2: :method = GET</text>
          <text x="10" y="70" fill="#86efac">3: :method = POST</text>
          <text x="10" y="86" fill="#86efac">8: :status = 200</text>
          
          <text x="10" y="112" fill="#4ade80">✓ 仅传输单个整数即可表达完整键值！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 双方连接建立时内置，0 网络传输；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 覆盖 80% 常用 HTTP 协议伪头；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极简传输起点。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 动态滑动窗口表 (Dynamic Table: 62+)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 请求 1 携带了 500 字节 Cookie/Token</text>
          <text x="10" y="34" fill="#86efac">服务端将其存入动态表: Index 62</text>
          
          <text x="10" y="58" fill="#38bdf8">// 请求 2 再次发送时：</text>
          <text x="10" y="74" fill="#34d399">仅发送: [Index: 62] (1 字节！)</text>
          <text x="10" y="90" fill="#34d399">无需重复传输 500 字节字符串！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 动态表随连接双向同步维护！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 按 FIFO 队列维护 4KB 大小上限；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 连续请求复用率达到 95% 以上；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 极致降低移动端上行流量。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 霍夫曼编码 (Huffman Coding)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 未命中字典的新字符串 (如 Path)</text>
          <text x="10" y="34" fill="#fed7aa">采用基于 ASCII 字符频率的静态霍夫曼树</text>
          
          <text x="10" y="58" fill="#34d399">高频字符 (如 '/', 'a', 'e'): 5~6 bits</text>
          <text x="10" y="74" fill="#cbd5e1">低频字符: 10~15 bits</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 字符串体积再额外压缩 30%！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• CRIME 攻击防御安全加固；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 高频微服务调用的关键加速技术；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级协议设计的艺术典范！</text>
      </g>
    </g>
  </g>
</svg>