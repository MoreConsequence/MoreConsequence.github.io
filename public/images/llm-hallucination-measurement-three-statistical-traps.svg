<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LLM 幻觉科学度量：三大统计学陷阱与形式化原子事实评估</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">基准污染 (Data Contamination) ｜ 拒绝回答率与召回率权衡 ｜ 原子事实三元组拆解 (Atomic Fact Triplets) 评估管线</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 统计陷阱：拒绝率与幻觉率</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// 虚假的"零幻觉"假象</text>
          <text x="10" y="34" fill="#fca5a5">模型对 80% 的问题全部回答：</text>
          <text x="10" y="48" fill="#cbd5e1">"抱歉，我无法回答该问题。"</text>
          
          <text x="10" y="70" fill="#ef4444">🔴 表面数据：幻觉率仅 1%！</text>
          <text x="10" y="86" fill="#fb7185">► 真实后果：模型可用性彻底归零！</text>
          <text x="10" y="106" fill="#34d399">✓ 必须结合 覆盖率 (Coverage) 与</text>
          <text x="10" y="122" fill="#34d399">   正确率 (Precision) 联合评估！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">评估警戒：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 不谈响应率的幻觉率纯属数字游戏；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 防范评测集被预训练语料污染泄漏；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须使用动态合成新事件评测！</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 原子事实三元组拆解</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 文本拆解为独立断言 (Assertions)</text>
          <text x="10" y="34" fill="#86efac">"张三在 2021 年创立了 A 公司"</text>
          <text x="10" y="52" fill="#38bdf8">├── Fact 1: [张三, 创立, A 公司]</text>
          <text x="10" y="68" fill="#38bdf8">└── Fact 2: [A 公司, 创立时间, 2021]</text>
          
          <text x="10" y="92" fill="#34d399">1. 对每个 Fact 单独检索知识图谱核验</text>
          <text x="10" y="108" fill="#4ade80">2. 计算幻觉分数 = 错误 Facts / 总 Facts</text>
          <text x="10" y="124" fill="#34d399">✓ 细粒度定位具体哪句话出现捏造！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 摆脱粗糙的整个段落二元判断；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支持自动化知识库纠错回填；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造生产级企业 RAG 质检流水线！</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">3. 连续统计置信区间</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 样本量与 Wilson 置信区间</text>
          <text x="10" y="34" fill="#93c5fd">1. 测试 10 条样本: 幻觉率 10% ± 18%</text>
          <text x="10" y="48" fill="#cbd5e1">   (置信区间过宽，毫无参考价值)</text>
          
          <text x="10" y="70" fill="#4ade80">2. 测试 1000 条样本: 幻觉率 5.2% ± 1.1%</text>
          <text x="10" y="86" fill="#34d399">   (95% 置信度，具备生产发布依据)</text>
          
          <text x="10" y="108" fill="#38bdf8">✓ 拒绝单次盲测，用统计显著性说话！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">评测军规：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 样本量 N &gt;= 500 才能得出稳定结论；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 固定采样参数 (Temperature=0)；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚不可摧的 LLM 评估科学标准！</text>
      </g>
    </g>
  </g>
</svg>