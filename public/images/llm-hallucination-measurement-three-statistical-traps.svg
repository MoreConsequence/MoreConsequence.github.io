<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="llm-hallucination-measurement-three-statistical-traps-title llm-hallucination-measurement-three-statistical-traps-desc"><title id="llm-hallucination-measurement-three-statistical-traps-title">大模型幻觉度量体系：三大统计学陷阱、事实核查与置信区间度量</title><desc id="llm-hallucination-measurement-three-statistical-traps-desc">大模型幻觉度量体系：三大统计学陷阱、事实核查与置信区间度量</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">LLM 幻觉科学度量：三大统计学陷阱与形式化原子事实评估</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">基准污染 (Data Contamination) ｜ 拒绝回答率与召回率权衡 ｜ 原子事实三元组拆解 (Atomic Fact Triplets) 评估管线</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 统计陷阱：拒绝率与幻觉率</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 虚假的"零幻觉"假象</text>
          <text x="10" y="34" fill="#f5f5f5">模型对 80% 的问题全部回答：</text>
          <text x="10" y="48" fill="#cbd5e1">"抱歉，我无法回答该问题。"</text>

          <text x="10" y="70" fill="#f5f5f5">🔴 表面数据：幻觉率仅 1%！</text>
          <text x="10" y="86" fill="#fb7185">► 真实后果：模型可用性彻底归零！</text>
          <text x="10" y="106" fill="#f5f5f5">✓ 必须结合 覆盖率 (Coverage) 与</text>
          <text x="10" y="122" fill="#f5f5f5">   正确率 (Precision) 联合评估！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">评估警戒：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 不谈响应率的幻觉率纯属数字游戏；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 防范评测集被预训练语料污染泄漏；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 必须使用动态合成新事件评测！</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 原子事实三元组拆解</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 文本拆解为独立断言 (Assertions)</text>
          <text x="10" y="34" fill="#f5f5f5">"张三在 2021 年创立了 A 公司"</text>
          <text x="10" y="52" fill="#f5f5f5">├── Fact 1: [张三, 创立, A 公司]</text>
          <text x="10" y="68" fill="#f5f5f5">└── Fact 2: [A 公司, 创立时间, 2021]</text>

          <text x="10" y="92" fill="#f5f5f5">1. 对每个 Fact 单独检索知识图谱核验</text>
          <text x="10" y="108" fill="#f5f5f5">2. 计算幻觉分数 = 错误 Facts / 总 Facts</text>
          <text x="10" y="124" fill="#f5f5f5">✓ 细粒度定位具体哪句话出现捏造！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">工业级收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 摆脱粗糙的整个段落二元判断；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 支持自动化知识库纠错回填；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 打造生产级企业 RAG 质检流水线！</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. 连续统计置信区间</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 样本量与 Wilson 置信区间</text>
          <text x="10" y="34" fill="#f5f5f5">1. 测试 10 条样本: 幻觉率 10% ± 18%</text>
          <text x="10" y="48" fill="#cbd5e1">   (置信区间过宽，毫无参考价值)</text>

          <text x="10" y="70" fill="#f5f5f5">2. 测试 1000 条样本: 幻觉率 5.2% ± 1.1%</text>
          <text x="10" y="86" fill="#f5f5f5">   (95% 置信度，具备生产发布依据)</text>

          <text x="10" y="108" fill="#f5f5f5">✓ 拒绝单次盲测，用统计显著性说话！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">评测军规：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 样本量 N &gt;= 500 才能得出稳定结论；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 固定采样参数 (Temperature=0)；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造坚不可摧的 LLM 评估科学标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
