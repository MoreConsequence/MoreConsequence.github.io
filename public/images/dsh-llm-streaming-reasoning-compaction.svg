<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 流式流控与上下文压缩：&lt;think&gt; 提取与 Compaction 算法</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">DeepSeek-R1 原始 SSE ──► 思考链提取状态机 ──► 增量 Token 预算监控 ──► 触发滑动窗口 Compaction 压缩摘要 ──► 保证 100 轮长对话稳如泰山</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 流式分词与思考链提取状态机 (Reasoning Stream Demux)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">解析 &lt;think&gt; ... &lt;/think&gt; 标签 ──► 分流输出至 thinking 事件与 text 事件</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">终端在灰色折叠卡片中高频平滑渲染思考过程，正文 Markdown 仅输出最终回答！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 结构化工具调用增量解析器 (Incremental ToolCall Parser)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">流式累加 JSON 碎片 ──► 正则快速校验闭合性 ──► 提前预拉取目标文件加速 I/O</text>
        <text x="15" y="62" font-size="8" fill="#047857">在流式接收的同时并行预热磁盘与依赖，将工具调用的执行端到端延迟压缩到极致！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 上下文预算溢出水位监控 (Token Watermark &amp; Trigger)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">当前上下文 &gt; 80% MaxTokens (如 100k/128k) ──► 自动打上 isCompactionNeeded 标记</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">杜绝等到发生 400 Context Length Exceeded 报错才被动处理，实现优雅的主动预防！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 结构化 Compaction 摘要压缩与历史截断 (KV Cache Friendly)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">保留前 20% 核心指令 + 后 30% 最近轮次 ──► 中间 50% 历史摘要压缩为一条精炼结构化 Summary</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">上下文瞬间释放 60% 空间，且完全保留核心变量与已修改文件列表，长征级任务永不中断！</text>
      </g>
    </g>
  </g>
</svg>