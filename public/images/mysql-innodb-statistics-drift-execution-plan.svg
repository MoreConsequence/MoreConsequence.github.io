<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="mysql-innodb-statistics-drift-execution-plan-title mysql-innodb-statistics-drift-execution-plan-desc"><title id="mysql-innodb-statistics-drift-execution-plan-title">MySQL InnoDB 统计信息漂移：统计过期不改变物理计划 vs 坏统计引发慢查询索引误选</title><desc id="mysql-innodb-statistics-drift-execution-plan-desc">MySQL InnoDB 统计信息漂移：统计过期不改变物理计划 vs 坏统计引发慢查询索引误选</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">MySQL 统计信息漂移真相：统计过期不改计划，坏的重新采样才导致索引跳变</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">mysql.innodb_index_stats ｜ 随机 20 个采样页 Cardinality 基数估算偏差 ｜ ANALYZE TABLE 触发执行计划突变</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. InnoDB 统计信息采样物理机制</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// InnoDB 默认参数</text>
          <text y="28" fill="#f5f5f5">innodb_stats_persistent = ON (持久化到磁盘)</text>
          <text y="42" fill="#f5f5f5">innodb_stats_persistent_sample_pages = 20 (随机采样 20 页)</text>

          <text y="66" fill="#f5f5f5">基数估算算法 (Cardinality):</text>
          <text y="80" fill="#f5f5f5">基数 = (20 个采样页的不同值总数 / 20) × B+ 树总叶子节点数</text>

          <text y="104" fill="#f5f5f5">⚠️ 随机抽样固有误差：当数据分布严重不均匀时，</text>
          <text y="118" fill="#f5f5f5">两次采样计算出的基数可能相差 10 倍以上！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">重要事实澄清：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 即使数据变了，只要没触发采样，旧执行计划坚如磐石；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 真正引发灾难的是 变更超过 1/16 触发自动重新采样；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 采样算出的坏基数导致优化器抛弃正确索引！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 坏统计诱导优化器走全表扫描</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">SELECT * FROM orders WHERE status = 1 AND uid = 100;</text>

          <text y="36" fill="#cbd5e1">1. 原计划: 走 idx_uid 索引 (扫描 5 行，耗时 0.2ms)</text>
          <text y="52" fill="#f5f5f5">2. 统计刷新后: 误判 idx_uid 基数极低，回表代价过高！</text>
          <text y="68" fill="#f5f5f5">3. 优化器决策: 改走全表扫描或 idx_status 慢索引！</text>
          <text y="84" fill="#f5f5f5">► 扫描行数暴涨到 500 万行，数据库 CPU 瞬间 100% 锁死！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产生产防线：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 将 sample_pages 调大至 100~200 提升采样精度；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 关闭 innodb_stats_auto_recalc，改在业务低峰期定时 ANALYZE；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 核心高频 SQL 结合 FORCE INDEX 锁定最优路径！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
