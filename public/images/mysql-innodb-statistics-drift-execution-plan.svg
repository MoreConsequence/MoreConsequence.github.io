<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL 统计信息漂移真相：统计过期不改计划，坏的重新采样才导致索引跳变</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">mysql.innodb_index_stats ｜ 随机 20 个采样页 Cardinality 基数估算偏差 ｜ ANALYZE TABLE 触发执行计划突变</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Statistics Drift Mechanism -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. InnoDB 统计信息采样物理机制</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// InnoDB 默认参数</text>
          <text y="28" fill="#93c5fd">innodb_stats_persistent = ON (持久化到磁盘)</text>
          <text y="42" fill="#93c5fd">innodb_stats_persistent_sample_pages = 20 (随机采样 20 页)</text>
          
          <text y="66" fill="#fb923c">基数估算算法 (Cardinality):</text>
          <text y="80" fill="#fed7aa">基数 = (20 个采样页的不同值总数 / 20) × B+ 树总叶子节点数</text>
          
          <text y="104" fill="#f87171">⚠️ 随机抽样固有误差：当数据分布严重不均匀时，</text>
          <text y="118" fill="#fca5a5">两次采样计算出的基数可能相差 10 倍以上！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">重要事实澄清：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 即使数据变了，只要没触发采样，旧执行计划坚如磐石；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 真正引发灾难的是 变更超过 1/16 触发自动重新采样；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 采样算出的坏基数导致优化器抛弃正确索引！</text>
      </g>
    </g>

    <!-- Right: Optimizer Index Mutation -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. 坏统计诱导优化器走全表扫描</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">SELECT * FROM orders WHERE status = 1 AND uid = 100;</text>
          
          <text y="36" fill="#cbd5e1">1. 原计划: 走 idx_uid 索引 (扫描 5 行，耗时 0.2ms)</text>
          <text y="52" fill="#ef4444">2. 统计刷新后: 误判 idx_uid 基数极低，回表代价过高！</text>
          <text y="68" fill="#f87171">3. 优化器决策: 改走全表扫描或 idx_status 慢索引！</text>
          <text y="84" fill="#ef4444">► 扫描行数暴涨到 500 万行，数据库 CPU 瞬间 100% 锁死！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产生产防线：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 将 sample_pages 调大至 100~200 提升采样精度；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 关闭 innodb_stats_auto_recalc，改在业务低峰期定时 ANALYZE；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 核心高频 SQL 结合 FORCE INDEX 锁定最优路径！</text>
      </g>
    </g>
  </g>
</svg>