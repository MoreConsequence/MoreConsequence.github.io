<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Map 底层 hmap 结构与 bmap 桶内 8 槽位内存排布</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">高 8 位哈希 tophash 极速过滤 ｜ keys 与 values 分离排列消除内存对齐填充 ｜ 渐进式扩容与并发写 panic 崩溃检测</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Bucket Memory Layout -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. bmap (8 槽位桶) 紧凑物理排布</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// 单个 bmap 桶内存布局设计精妙：</text>
          <text y="32" fill="#93c5fd">1. tophash: [8]uint8 (存储 8 个 Key 的哈希高 8 位)</text>
          <text y="48" fill="#34d399">2. keys:    [8]keytype (8 个键连续排列)</text>
          <text y="64" fill="#34d399">3. values:  [8]elemtype (8 个值连续排列)</text>
          <text y="80" fill="#fb923c">4. overflow: *bmap (溢出桶指针，拉链法解决冲突)</text>
          
          <text y="104" fill="#4ade80">为什么不按 key/value/key/value 交替排列？</text>
          <text y="120" fill="#cbd5e1">• map[int64]int8：若交替排列，每个 int8 需填充 7B 对齐！</text>
          <text y="136" fill="#34d399">• 键值分离打包彻底消除了所有的内存对齐浪费！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">查找极速路径：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 哈希低 B 位定位桶号，高 8 位比对 tophash 数组；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• tophash 匹配成功才触发真正的 key 等值比对；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 单次未命中仅需 1 次 CPU 缓存行加载与 8 次字节比对！</text>
      </g>
    </g>

    <!-- Right: Evacuate & Concurrency -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 渐进式扩容与并发写致命 Panic</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">// 触发扩容条件 (growWork):</text>
          <text y="30" fill="#fed7aa">1. 负载因子 &gt; 6.5 ──► 翻倍扩容 (B = B + 1)</text>
          <text y="46" fill="#fed7aa">2. 溢出桶过多 (overflow &gt;= 2^B) ──► 等量扩容 (整理碎片)</text>
          <text y="66" fill="#38bdf8">3. 渐进式搬迁 (Evacuate):</text>
          <text y="80" fill="#86efac">   每次写/删 map 操作仅搬迁 2 个旧桶，摊薄延迟！</text>
          
          <text y="104" fill="#f87171">🔴 并发读写检测 (h.flags &amp; hashWriting):</text>
          <text y="120" fill="#ef4444">   读写未加锁瞬间触发不可捕获的 fatal error:</text>
          <text y="136" fill="#fb7185">   --&gt; concurrent map read and map write (程序秒崩！)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">生产建表与并发法则：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 初始化务必指定容量 make(map[K]V, hint) 规避多次翻倍搬迁；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 多协程并发访问必须使用 sync.RWMutex 或 sync.Map；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严禁用 recover() 试图拦截并发 map 写崩溃（直接杀死进程）！</text>
      </g>
    </g>
  </g>
</svg>