<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="pi-provider-gateway-exponential-backoff-title pi-provider-gateway-exponential-backoff-desc"><title id="pi-provider-gateway-exponential-backoff-title">多供应商统一网关与 Full Jitter 指数退避可中断睡眠</title><desc id="pi-provider-gateway-exponential-backoff-desc">架构与流程图展示多模型供应商 API 统一适配层、Full Jitter 消除惊群重试碰撞公式，以及通过 AbortSignal 实现可中断睡眠与毫秒级取消的弹性机制。</desc>
