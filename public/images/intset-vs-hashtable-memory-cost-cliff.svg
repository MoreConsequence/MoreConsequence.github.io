<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Redis Set 底层编码演进：intset 紧凑数组 vs dict 哈希表</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">intset (连续内存，每个元素仅 2~8 字节，0 指针开销) vs dict (dictEntry 节点 24 字节 + robj 16 字节 + jemalloc 内存碎片，开销膨胀 10 倍)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: intset -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ intset 紧凑编码 (len ≤ 512 且纯整数)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">存储 500 个 16 位整数 ID：</text>
          
          <text y="38" fill="#86efac">物理开销构成：</text>
          <text y="52" fill="#38bdf8">• Header: 8 字节</text>
          <text y="66" fill="#34d399">• Contents: 500 * 2B = 1,000 字节</text>
          <text y="80" fill="#4ade80">• 总内存消耗: 仅 1,008 字节 (约 1KB)！</text>
          
          <text y="106" fill="#4ade80">✓ 内存利用率逼近 100% 理论极限！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 纯连续物理数组，0 指针间接寻址；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 极大幅度减轻操作系统内存碎片；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造超强标签与关系统计池。</text>
      </g>
    </g>

    <!-- Right: dict -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ dict 哈希表编码 (混入字符串或 &gt; 512)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">存储 500 个相同整数 ID：</text>
          
          <text y="38" fill="#ef4444">物理开销构成：</text>
          <text y="52" fill="#fca5a5">• dictEntry 节点: 500 * 24B = 12,000B</text>
          <text y="66" fill="#ef4444">• sds 字符串对象: 500 * (16B + 8B) = 12,000B</text>
          <text y="80" fill="#ef4444">• 哈希表桶数组与 jemalloc padding: ~8,000B</text>
          <text y="94" fill="#f87171">• 总内存消耗: 暴涨至 32,000 字节 (32KB)！</text>
          
          <text y="118" fill="#f87171">🔴 内存开销膨胀整整 32 倍！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产警示：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 不要向纯整数 Set 中随意写入字符串（如 "123"）；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 合理调大 set-max-intset-entries 至 1024；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 生产级 Redis 降本关键技巧！</text>
      </g>
    </g>
  </g>
</svg>