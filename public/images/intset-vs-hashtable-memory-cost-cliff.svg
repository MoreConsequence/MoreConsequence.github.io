<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="intset-vs-hashtable-memory-cost-cliff-title intset-vs-hashtable-memory-cost-cliff-desc"><title id="intset-vs-hashtable-memory-cost-cliff-title">intset 紧凑数组 vs dict 哈希表内存膨胀悬崖对比</title><desc id="intset-vs-hashtable-memory-cost-cliff-desc">intset 紧凑数组 vs dict 哈希表内存膨胀悬崖对比</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Redis Set 底层编码演进：intset 紧凑数组 vs dict 哈希表</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">intset (连续内存，每个元素仅 2~8 字节，0 指针开销) vs dict (dictEntry 节点 24 字节 + robj 16 字节 + jemalloc 内存碎片，开销膨胀 10 倍)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ intset 紧凑编码 (len ≤ 512 且纯整数)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">存储 500 个 16 位整数 ID：</text>

          <text y="38" fill="#f5f5f5">物理开销构成：</text>
          <text y="52" fill="#f5f5f5">• Header: 8 字节</text>
          <text y="66" fill="#f5f5f5">• Contents: 500 * 2B = 1,000 字节</text>
          <text y="80" fill="#f5f5f5">• 总内存消耗: 仅 1,008 字节 (约 1KB)！</text>

          <text y="106" fill="#f5f5f5">✓ 内存利用率逼近 100% 理论极限！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 纯连续物理数组，0 指针间接寻址；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 极大幅度减轻操作系统内存碎片；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造超强标签与关系统计池。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ dict 哈希表编码 (混入字符串或 &gt; 512)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">存储 500 个相同整数 ID：</text>

          <text y="38" fill="#f5f5f5">物理开销构成：</text>
          <text y="52" fill="#f5f5f5">• dictEntry 节点: 500 * 24B = 12,000B</text>
          <text y="66" fill="#f5f5f5">• sds 字符串对象: 500 * (16B + 8B) = 12,000B</text>
          <text y="80" fill="#f5f5f5">• 哈希表桶数组与 jemalloc padding: ~8,000B</text>
          <text y="94" fill="#f5f5f5">• 总内存消耗: 暴涨至 32,000 字节 (32KB)！</text>

          <text y="118" fill="#f5f5f5">🔴 内存开销膨胀整整 32 倍！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产警示：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 不要向纯整数 Set 中随意写入字符串（如 "123"）；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 合理调大 set-max-intset-entries 至 1024；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 生产级 Redis 降本关键技巧！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
