<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="dot-grid-1" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr-blue-pipe" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber-pipe" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#dot-grid-1)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="36" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">PHYSICAL BOTTLENECK MODEL</text>
  <text x="40" y="56" fill="#0f172a" font-size="16" font-weight="700">端到端传输全链路“木桶最短板”物理模型</text>

  <!-- Box 1: Client [x: 40 ~ 235, w: 195] -->
  <g transform="translate(40, 82)">
    <rect width="195" height="156" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="5" rx="2" fill="#3b82f6"/>
    <text x="14" y="26" fill="#1e40af" font-size="9" font-weight="700" class="mono">STAGE 1: CLIENT</text>
    <text x="14" y="46" fill="#0f172a" font-size="13" font-weight="700">1. 客户端接入能力</text>
    <line x1="14" y1="60" x2="181" y2="60" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="82" fill="#334155" font-size="11">• 签约带宽：1000 Mbps</text>
    <text x="14" y="102" fill="#334155" font-size="11">• 局域网衰减：无线抖动</text>
    <text x="14" y="122" fill="#334155" font-size="11">• 协议栈套接字限制</text>
    <text x="14" y="142" fill="#64748b" font-size="9" class="mono">Wi-Fi 6 / 5G / 光纤</text>
  </g>

  <!-- Arrow 1 -> 2 [x: 235 -> 268] -->
  <path d="M 235,160 H 268" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-pipe)"/>

  <!-- Box 2: Line [x: 268 ~ 463, w: 195] -->
  <g transform="translate(268, 82)">
    <rect width="195" height="156" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="5" rx="2" fill="#2563eb"/>
    <text x="14" y="26" fill="#1d4ed8" font-size="9" font-weight="700" class="mono">STAGE 2: NETWORK</text>
    <text x="14" y="46" fill="#0f172a" font-size="13" font-weight="700">2. 城域 / 骨干链路</text>
    <line x1="14" y1="60" x2="181" y2="60" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="82" fill="#334155" font-size="11">• 物理时延：RTT = 40ms</text>
    <text x="14" y="102" fill="#334155" font-size="11">• 管道容量：BDP = 5.0 MB</text>
    <text x="14" y="122" fill="#334155" font-size="11">• 中继硬件压缩特征</text>
    <text x="14" y="142" fill="#64748b" font-size="9" class="mono">跨省光缆 / 路由器</text>
  </g>

  <!-- Arrow 2 -> 3 [x: 463 -> 497] -->
  <path d="M 463,160 H 497" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-pipe)"/>

  <!-- Box 3: Server [x: 497 ~ 692, w: 195] -->
  <g transform="translate(497, 82)">
    <rect width="195" height="156" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="5" rx="2" fill="#1d4ed8"/>
    <text x="14" y="26" fill="#1e40af" font-size="9" font-weight="700" class="mono">STAGE 3: SERVER</text>
    <text x="14" y="46" fill="#0f172a" font-size="13" font-weight="700">3. 测速服务端节点</text>
    <line x1="14" y1="60" x2="181" y2="60" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="82" fill="#334155" font-size="11">• 网卡线速：40 Gbps</text>
    <text x="14" y="102" fill="#334155" font-size="11">• 64MB 静态随机内存池</text>
    <text x="14" y="122" fill="#334155" font-size="11">• 64KB 栈黑洞 0 堆分配</text>
    <text x="14" y="142" fill="#64748b" font-size="9" class="mono">Go Speed-Node 实例</text>
  </g>

  <!-- Arrow 3 -> 4 [x: 692 -> 725] -->
  <path d="M 692,160 H 725" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arr-amber-pipe)"/>

  <!-- Box 4: Goodput Result [x: 725 ~ 920, w: 195] -->
  <g transform="translate(725, 82)">
    <rect width="195" height="156" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="5" rx="2" fill="#ea580c"/>
    <text x="14" y="26" fill="#c2410c" font-size="9" font-weight="700" class="mono">FINAL GOODPUT</text>
    <text x="14" y="46" fill="#0f172a" font-size="13" font-weight="700">端到端实测速率</text>
    <line x1="14" y1="60" x2="181" y2="60" stroke="#fed7aa" stroke-width="1"/>
    <text x="14" y="82" fill="#ea580c" font-size="12" font-weight="700">严格等于</text>
    <text x="14" y="102" fill="#0f172a" font-size="12" font-weight="700">全链路最短板</text>
    <text x="14" y="122" fill="#64748b" font-size="10" class="mono">min(接入, 链路, 节点)</text>
    <text x="14" y="142" fill="#ea580c" font-size="9" font-weight="700" class="mono">决定最终用户测速结果</text>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(40, 260)">
    <rect width="880" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="18" width="85" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="58" y="34" fill="#1e40af" font-size="9" font-weight="700" class="mono" text-anchor="middle">KEY INSIGHT</text>
    <text x="115" y="35" fill="#1e293b" font-size="11.5">测速测量的是特定时间窗口内通过特定链路的 <tspan font-weight="700" fill="#2563eb">端到端有效吞吐能力（Goodput）</tspan>，而非单点网卡极限。</text>
  </g>
</svg>
