<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">边缘回源风暴治理：Singleflight 请求坍缩与 RFC 5861 SWR 异步重校验</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">热点 Key 瞬间失效 ──► 10,000 并发回源坍缩为单条请求 ──► stale-while-revalidate 毫秒级旧值直出 + 后台静默刷新</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 热点突发并发命中缓存过期 (Cache Miss Spike)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">10,000 req/s 同时请求 /api/v1/hot-news ──► 边缘缓存刚过期 0.1 秒</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">若无控制，上万并发将直击源站，导致源站数据库连接池瞬间打满熔断！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. Singleflight 互斥锁与请求坍缩 (Request Coalescing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Leader 请求获得回源锁发起 Fetch ──► 其余 9,999 个请求在内存中挂起监听同一个 Channel</text>
        <text x="15" y="62" font-size="8" fill="#047857">将万级回源压力在边缘节点内部完美坍缩为仅仅 1 次真实源站请求！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. RFC 5861 Stale-While-Revalidate (SWR) 零等待响应</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">Cache-Control: max-age=60, stale-while-revalidate=30 ──► 前端用户 0ms 拿到旧缓存瞬间打开页面</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">边缘节点在后台异步发起源站数据更新，实现用户感知延迟绝对为 0！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. Surrogate-Key 标签化秒级精准失效 (Surrogate-Key Purge)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">源站发布新文章时推送 Purge: tag-news-123 ──► 全球 PoP 节点在 150ms 内完成软失效</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">兼顾极致性能加速与强实时性数据一致性！</text>
      </g>
    </g>
  </g>
</svg>