<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="seckill-four-tier-defense-gate-pipeline-title seckill-four-tier-defense-gate-pipeline-desc"><title id="seckill-four-tier-defense-gate-pipeline-title">秒杀系统四层漏斗拦截拓扑：CDN 静态化 -&gt; 网关限流 -&gt; Redis Lua 原子预扣 -&gt; MQ 异步入库</title><desc id="seckill-four-tier-defense-gate-pipeline-desc">秒杀系统四层漏斗拦截拓扑：CDN 静态化 -&gt; 网关限流 -&gt; Redis Lua 原子预扣 -&gt; MQ 异步入库</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">电商秒杀系统四层高并发漏斗拦截架构</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">100 万 QPS 流量 ──► 1. CDN 静态页面拦截 90% ──► 2. API 网关令牌桶限流 ──► 3. Redis Lua 纯内存原子扣库存 ──► 4. MQ 异步写 DB 保护底座</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 第 1 层: CDN 边缘静态化与动态路径混淆 (Edge Caching: 1,000,000 -&gt; 100,000 QPS)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">商品详情页 HTML/JS/CSS 100% 命中 CDN 边缘 ──► 秒杀按钮时间未到前置灰 ──► 动态下发随机 md5 抢购路径</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">将 90% 的疯狂刷新请求在最外层直接挡回！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 第 2 层: API 网关多维度风控与黑产拦截 (Gateway Anti-Bot: 100,000 -&gt; 20,000 QPS)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">校验用户 Token 与设备指纹 ──► 单用户单 IP 频次限制 ──► 识别自动化脚本与黑产黄牛并直接拒绝</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">保障真实正常用户的公平抢购权益！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 第 3 层: Redis Lua 脚本纯内存原子扣减 (Atomic In-Memory Lua: 20,000 -&gt; 100 QPS)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">EVAL lua_script ──► 单线程校验 stock &gt; 0 并 DECR ──► 仅 100 位真实抢中库存的用户获得下单权！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">0 数据库行锁竞争，0 超卖发生！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 第 4 层: 消息队列异步削峰入库 (RocketMQ / Kafka DB Writer: 100 QPS)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">将成功订单投递至 MQ ──► 后台 Worker 平稳插入 MySQL 创建正式订单并锁定 15 分钟待支付！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">百万流量冲击下数据库依然如丝般平稳呼吸！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
