<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="100%" height="100%" role="img" aria-labelledby="llm-continuous-batching-step-iteration-title llm-continuous-batching-step-iteration-desc"><title id="llm-continuous-batching-step-iteration-title">静态批处理 (Static Batching) 气泡浪费 vs 迭代级动态连续批处理 (Continuous…</title><desc id="llm-continuous-batching-step-iteration-desc">静态批处理 (Static Batching) 气泡浪费 vs 迭代级动态连续批处理 (Continuous Batching)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">静态批处理 (Static Batching) vs 迭代级连续批处理 (Continuous Batching)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">消除最长序列木桶效应与气泡浪费 (Bubble Waste) ──► 提升 GPU 吞吐量 3x ~ 5x 倍</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 传统静态批处理 (Static Batching) 气泡浪费</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="155" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="8" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// Batch Size = 3 (受限于最长请求)</text>

          <rect y="24" width="80" height="20" rx="2" fill="#2563eb" />
          <text x="10" y="38" fill="#ffffff">Req 1 (20 Tok)</text>
          <rect x="85" y="24" width="230" height="20" rx="2" fill="#334155" stroke="#eb6c36" stroke-dasharray="2 2" stroke-width="1" />
          <text x="120" y="38" fill="#f5f5f5">Padding Bubble (空转 60 Tok!)</text>

          <rect y="50" width="160" height="20" rx="2" fill="#2563eb" />
          <text x="10" y="64" fill="#ffffff">Req 2 (40 Tok)</text>
          <rect x="165" y="50" width="150" height="20" rx="2" fill="#334155" stroke="#eb6c36" stroke-dasharray="2 2" stroke-width="1" />
          <text x="180" y="64" fill="#f5f5f5">Padding Bubble (空转 40 Tok!)</text>

          <rect y="76" width="315" height="20" rx="2" fill="#2563eb" />
          <text x="10" y="90" fill="#ffffff">Req 3 (最长 80 Tok 决定整个 Batch 结束时间)</text>

          <text y="122" fill="#f5f5f5">► 必须等 Req 3 跑完，新请求才能进入！</text>
          <text y="136" fill="#f5f5f5">► GPU 算力利用率极低 (大量矩阵乘法在算 0)</text>
        </g>

        <rect y="168" width="405" height="90" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="186" font-size="9" font-weight="700" fill="#2d3142">木桶效应瓶颈：</text>
        <text x="10" y="202" font-size="7.5" fill="#2d3142">• 短请求早已生成结束，但无法提前返回给用户；</text>
        <text x="10" y="216" font-size="7.5" fill="#2d3142">• 新到的高优先级请求被阻塞在外，排队延迟巨高；</text>
        <text x="10" y="230" font-size="7.5" font-weight="700" fill="#eb6c36">• 算力浪费率高达 40% ~ 70%！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 迭代级连续批处理 (Continuous / In-Flight)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="155" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="8" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 步进级动态插入与驱逐 (Iteration-Level)</text>

          <rect y="24" width="80" height="20" rx="2" fill="#2563eb" />
          <text x="8" y="38" fill="#ffffff">Req 1 结束</text>
          <rect x="85" y="24" width="120" height="20" rx="2" fill="#10b981" />
          <text x="92" y="38" fill="#ffffff">插新 Req 4 (30 Tok)</text>
          <rect x="210" y="24" width="105" height="20" rx="2" fill="#4f5d75" />
          <text x="218" y="38" fill="#ffffff">插新 Req 5</text>

          <rect y="50" width="160" height="20" rx="2" fill="#2563eb" />
          <text x="10" y="64" fill="#ffffff">Req 2 (40 Tok)</text>
          <rect x="165" y="50" width="150" height="20" rx="2" fill="#10b981" />
          <text x="175" y="64" fill="#ffffff">动态插新 Req 6 (35 Tok)</text>

          <rect y="76" width="315" height="20" rx="2" fill="#2563eb" />
          <text x="10" y="90" fill="#ffffff">Req 3 持续解码 (80 Tok)</text>

          <text y="122" fill="#f5f5f5">✓ 步进粒度调度：任何请求生成完成立即弹出！</text>
          <text y="136" fill="#f5f5f5">✓ 新请求在下一个 Step 瞬间填补空位，零气泡！</text>
        </g>

        <rect y="168" width="405" height="90" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="186" font-size="9" font-weight="700" fill="#2d3142">工业级收益 (vLLM / TGI 标配)：</text>
        <text x="10" y="202" font-size="7.5" fill="#4f5d75">• GPU 算力利用率由 30% 提升至 85% 以上；</text>
        <text x="10" y="216" font-size="7.5" fill="#4f5d75">• 系统吞吐量提升 3x ~ 5x 倍；</text>
        <text x="10" y="230" font-size="7.5" font-weight="700" fill="#4f5d75">• 首字延迟 (TTFT) 与解码延迟 (ITL) 显著降低！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
