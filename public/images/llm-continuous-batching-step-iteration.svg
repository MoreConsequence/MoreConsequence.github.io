<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">静态批处理 (Static Batching) vs 迭代级连续批处理 (Continuous Batching)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">消除最长序列木桶效应与气泡浪费 (Bubble Waste) ──► 提升 GPU 吞吐量 3x ~ 5x 倍</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Comparison Columns (435px each) -->
    <!-- Left: Static Batching -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统静态批处理 (Static Batching) 气泡浪费</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="155" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// Batch Size = 3 (受限于最长请求)</text>
          
          <rect y="24" width="80" height="20" rx="2" fill="#2563eb"/>
          <text x="10" y="38" fill="#ffffff">Req 1 (20 Tok)</text>
          <rect x="85" y="24" width="230" height="20" rx="2" fill="#334155" stroke="#ef4444" stroke-dasharray="2 2"/>
          <text x="120" y="38" fill="#fca5a5">Padding Bubble (空转 60 Tok!)</text>

          <rect y="50" width="160" height="20" rx="2" fill="#2563eb"/>
          <text x="10" y="64" fill="#ffffff">Req 2 (40 Tok)</text>
          <rect x="165" y="50" width="150" height="20" rx="2" fill="#334155" stroke="#ef4444" stroke-dasharray="2 2"/>
          <text x="180" y="64" fill="#fca5a5">Padding Bubble (空转 40 Tok!)</text>

          <rect y="76" width="315" height="20" rx="2" fill="#2563eb"/>
          <text x="10" y="90" fill="#ffffff">Req 3 (最长 80 Tok 决定整个 Batch 结束时间)</text>
          
          <text y="122" fill="#f87171">► 必须等 Req 3 跑完，新请求才能进入！</text>
          <text y="136" fill="#f87171">► GPU 算力利用率极低 (大量矩阵乘法在算 0)</text>
        </g>

        <rect y="168" width="405" height="90" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">木桶效应瓶颈：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 短请求早已生成结束，但无法提前返回给用户；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 新到的高优先级请求被阻塞在外，排队延迟巨高；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 算力浪费率高达 40% ~ 70%！</text>
      </g>
    </g>

    <!-- Right: Continuous Batching -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 迭代级连续批处理 (Continuous / In-Flight)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="155" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text y="14" fill="#34d399">// 步进级动态插入与驱逐 (Iteration-Level)</text>
          
          <rect y="24" width="80" height="20" rx="2" fill="#2563eb"/>
          <text x="8" y="38" fill="#ffffff">Req 1 结束</text>
          <rect x="85" y="24" width="120" height="20" rx="2" fill="#10b981"/>
          <text x="92" y="38" fill="#ffffff">插新 Req 4 (30 Tok)</text>
          <rect x="210" y="24" width="105" height="20" rx="2" fill="#059669"/>
          <text x="218" y="38" fill="#ffffff">插新 Req 5</text>

          <rect y="50" width="160" height="20" rx="2" fill="#2563eb"/>
          <text x="10" y="64" fill="#ffffff">Req 2 (40 Tok)</text>
          <rect x="165" y="50" width="150" height="20" rx="2" fill="#10b981"/>
          <text x="175" y="64" fill="#ffffff">动态插新 Req 6 (35 Tok)</text>

          <rect y="76" width="315" height="20" rx="2" fill="#2563eb"/>
          <text x="10" y="90" fill="#ffffff">Req 3 持续解码 (80 Tok)</text>
          
          <text y="122" fill="#34d399">✓ 步进粒度调度：任何请求生成完成立即弹出！</text>
          <text y="136" fill="#34d399">✓ 新请求在下一个 Step 瞬间填补空位，零气泡！</text>
        </g>

        <rect y="168" width="405" height="90" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#166534">工业级收益 (vLLM / TGI 标配)：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• GPU 算力利用率由 30% 提升至 85% 以上；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 系统吞吐量提升 3x ~ 5x 倍；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 首字延迟 (TTFT) 与解码延迟 (ITL) 显著降低！</text>
      </g>
    </g>
  </g>
</svg>