<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">模板字面量递归模式匹配：URL 路由参数编译期类型解析</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">ParseRoute 递归 infer 提取参数名 ──► 生成强类型对象 { userId: string, postId: string }</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 路由字符串字面量输入 (Route Template Literal Input)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">const route = "/api/v1/orgs/:orgId/members/:memberId" ──► 纯字符串输入</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">利用 TypeScript 图灵完备的类型系统，在编译期将字符串当作代码语法树进行解析！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 递归 infer 提取冒号参数 (Recursive Pattern Matching)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Route extends PatternMatching&lt;Path, Param&gt; ? Param | Parse&lt;Rest&gt; : ...</text>
        <text x="15" y="62" font-size="8" fill="#047857">类型推导器自动切分路径片段，精准捕获每一个由 : 开头的动态参数名！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 映射类型重组为强类型参数字典 (Mapped Type Object Synthesis)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">type Params = { [K in ExtractParams&lt;Route&gt;]: string } ──► { orgId: string; memberId: string }</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将提取的联合类型瞬间转化为键值约束明确的类型字典！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 前后端 RPC 0 接口契约漂移 (End-to-End Type Safety)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">client.get(route, { params: { orgId: "123", memberId: "456" } }) ──► 传错参数名瞬间红线报错！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代化全栈框架（Next.js / tRPC / Hono）的核心技术秘籍！</text>
      </g>
    </g>
  </g>
</svg>