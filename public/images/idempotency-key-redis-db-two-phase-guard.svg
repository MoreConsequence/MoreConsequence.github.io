<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="idempotency-key-redis-db-two-phase-guard-title idempotency-key-redis-db-two-phase-guard-desc"><title id="idempotency-key-redis-db-two-phase-guard-title">接口幂等性两阶段防御：Redis 分布式锁快速抢占 + 数据库唯一索引兜底</title><desc id="idempotency-key-redis-db-two-phase-guard-desc">接口幂等性两阶段防御：Redis 分布式锁快速抢占 + 数据库唯一索引兜底</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">企业级支付与下单接口幂等性两阶段防御流水线</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 客户端生成 Idempotency-Key ──► 2. Redis SETNX 毫秒级防重抢占 ──► 3. 业务执行 ──► 4. 数据库 UNIQUE 唯一约束防线兜底</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 客户端发起请求携带唯一键 (Header: Idempotency-Key: UUID)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">用户点击支付按钮 ──► 客户端生成唯一 Idempotency-Key (如商户号+订单号+随机串) ──► 注入 HTTP Header</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">从发端确立全生命周期唯一标识符！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 前置 Redis 毫秒级快速去重 (Redis SETNX lock_key 30s)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">若 Key 存在: 判定为高频重复连击 ──► 直接返回 HTTP 409 Conflict 或直接返回上次缓存的处理结果</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">将 99.9% 的用户狂点与重试流量在最外层极速挡掉！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 数据库原子唯一索引物理兜底 (DB UNIQUE KEY Constraint)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">插入幂等流水表: INSERT INTO idempotency_records (key, status) ──► 触发 Duplicate Key 错误则安全回滚</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">即使 Redis 挂掉，关系型数据库 ACID 也能提供钢铁般防御！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 结果缓存与幂等终态持久化 (Response Caching &amp; Return)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">将业务成功处理结果写入 Redis 缓存 24 小时 ──► 无论后续网络重试多少次，永远返回完全一致的成功回执！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">金融级交易系统核心防线！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
