<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="arch-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="m-blue-arch" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="m-orange-arch" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#arch-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="34" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">ARCHITECTURE TOPOLOGY · THREE-LANE FLOW</text>
  <text x="40" y="54" fill="#0f172a" font-size="16" font-weight="700">测速系统核心架构：控制面与数据面三通道解耦拓扑</text>

  <!-- ================= LEFT COLUMN: CLIENT ENGINE [x: 40 ~ 340] ================= -->
  <rect x="40" y="70" width="300" height="365" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="56" y="64" width="130" height="14" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="121" y="75" fill="#475569" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">CLIENT ENGINE (客户端)</text>

  <!-- Client Lane 1: Control -->
  <g transform="translate(55, 90)">
    <rect width="270" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="24" fill="#1e40af" font-size="12" font-weight="700">1. 身份与参数协商模块</text>
    <text x="14" y="44" fill="#475569" font-size="10" class="mono">• 调度探测公网真实 IP</text>
    <text x="14" y="64" fill="#475569" font-size="10" class="mono">• 连续 20 次轻量 Ping 空闲探针</text>
  </g>

  <!-- Client Lane 2: Downlink -->
  <g transform="translate(55, 195)">
    <rect width="270" height="98" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="14" y="24" fill="#1d4ed8" font-size="12" font-weight="700">2. 下行并发消费引擎</text>
    <text x="14" y="44" fill="#2563eb" font-size="10" class="mono">• 4~8 TCP 并发全速拉流</text>
    <text x="14" y="62" fill="#2563eb" font-size="10" class="mono">• 纯内存只读接收 (0 磁盘 I/O)</text>
    <text x="14" y="80" fill="#1e40af" font-size="10" font-weight="600" class="mono">✓ 100ms 离散采样 + P90 滤波</text>
  </g>

  <!-- Client Lane 3: Uplink -->
  <g transform="translate(55, 312)">
    <rect width="270" height="98" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="14" y="24" fill="#9a3412" font-size="12" font-weight="700">3. 上行并发推流引擎</text>
    <text x="14" y="44" fill="#ea580c" font-size="10" class="mono">• 2~4 TCP 并发持续灌流</text>
    <text x="14" y="62" fill="#ea580c" font-size="10" class="mono">• 生成高随机 Chunk 阻断压缩</text>
    <text x="14" y="80" fill="#64748b" font-size="10" class="mono">• 稳态持续推流 10 秒</text>
  </g>


  <!-- ================= RIGHT COLUMN: SERVER ENGINE [x: 620 ~ 920] ================= -->
  <rect x="620" y="70" width="300" height="365" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="636" y="64" width="160" height="14" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="716" y="75" fill="#475569" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">GO SPEED-NODE (服务端)</text>

  <!-- Server Lane 1: Control -->
  <g transform="translate(635, 90)">
    <rect width="270" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="24" fill="#1e40af" font-size="12" font-weight="700">控制面端点 (/getIP &amp; /empty)</text>
    <text x="14" y="44" fill="#0f172a" font-size="10" class="mono">GET /backend/getIP (提取真实IP)</text>
    <text x="14" y="64" fill="#475569" font-size="10" class="mono">GET /backend/empty (Content-Length:0)</text>
  </g>

  <!-- Server Lane 2: Downlink -->
  <g transform="translate(635, 195)">
    <rect width="270" height="98" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="14" y="24" fill="#1d4ed8" font-size="12" font-weight="700">下行数据面端点 (/garbage)</text>
    <text x="14" y="44" fill="#0f172a" font-size="10" class="mono">GET /backend/garbage?ckSize=4</text>
    <text x="14" y="64" fill="#1e40af" font-size="10" class="mono">✓ 静态 64MB 随机池并发只读复用</text>
    <text x="14" y="82" fill="#1e40af" font-size="10" class="mono">✓ 0 堆分配 · 100% 免疫硬件压缩</text>
  </g>

  <!-- Server Lane 3: Uplink -->
  <g transform="translate(635, 312)">
    <rect width="270" height="98" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="180" y="10" width="76" height="16" rx="3" fill="#ea580c"/>
    <text x="218" y="21" fill="#ffffff" font-size="8" class="mono" font-weight="700" text-anchor="middle">KEY SINK</text>

    <text x="14" y="24" fill="#9a3412" font-size="12" font-weight="700">上行极速黑洞端点 (/empty)</text>
    <text x="14" y="44" fill="#0f172a" font-size="10" class="mono">POST /backend/empty</text>
    <text x="14" y="64" fill="#ea580c" font-size="10" font-weight="700" class="mono">✓ 64KB 栈内存循环即收即丢</text>
    <text x="14" y="82" fill="#475569" font-size="9.5" class="mono">40Gbps+ 吞吐 · 杜绝 ZeroWindow 反压</text>
  </g>


  <!-- ================= MIDDLE CONNECTING PIPES (x: 340 ~ 620) ================= -->
  <!-- Pipe 1: Control (Left -> Right) -->
  <rect x="390" y="104" width="180" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="480" y="118" fill="#1e40af" font-size="9.5" font-weight="600" class="mono" text-anchor="middle">1. 控制协商与时延探测</text>
  <path d="M 340,132 H 620" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue-arch)"/>

  <!-- Pipe 2: Downlink Stream (Right -> Left) -->
  <rect x="385" y="216" width="190" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="480" y="230" fill="#1d4ed8" font-size="9.5" font-weight="700" class="mono" text-anchor="middle">2. 下行高随机数据流 (拉取)</text>
  <path d="M 620,244 H 340" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#m-blue-arch)"/>

  <!-- Pipe 3: Uplink Stream (Left -> Right) -->
  <rect x="385" y="333" width="190" height="20" rx="3" fill="#fff7ed" stroke="#fed7aa" stroke-width="0.8"/>
  <text x="480" y="347" fill="#9a3412" font-size="9.5" font-weight="700" class="mono" text-anchor="middle">3. 上行大载荷推流 (黑洞吸收)</text>
  <path d="M 340,361 H 620" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#m-orange-arch)"/>
</svg>
