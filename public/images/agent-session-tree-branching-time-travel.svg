<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 树状会话拓扑与时光机回溯模型 (Session Tree &amp; Forking)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">线性会话 (历史一旦写错只能全盘推翻重来) vs 树状会话 (以 DAG 树状节点组织，随时在任意节点 checkout 开启平行宇宙分支)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Linear Session Limit -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统线性数组：无法回溯历史与分支探索</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">messages: [m1, m2, m3, m4, m5]</text>
          
          <text y="38" fill="#ef4444">死板线性局限：</text>
          <text y="52" fill="#fca5a5">• 在 m3 处 Agent 选错了重构策略走向死胡同</text>
          <text y="68" fill="#ef4444">• 用户想尝试另一种重构方案只能把 m4, m5 彻底删掉</text>
          <text y="84" fill="#ef4444">• 无法对比两个方案的代码优劣，历史不可逆丢失！</text>
          
          <text y="106" fill="#f87171">🔴 极大限制了资深开发者的探索效率！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">交互痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 只能一条道走到黑；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 无法满足复杂架构的多方案并行推演；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 传统 Chatbot 典型缺陷！</text>
      </g>
    </g>

    <!-- Right: Tree Forking -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Git 风格会话树：多分支探索与时光机</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">DAG 树状父子节点指针结构：</text>
          <text y="28" fill="#86efac">Root (m1) ──► Node (m2) ──► Fork Point (m3)</text>
          
          <text y="50" fill="#38bdf8">分支 A: m3 ──► m4_A (选用 Redis 方案)</text>
          <text y="64" fill="#34d399">分支 B: m3 ──► m4_B (选用 Memcached 方案)</text>
          
          <text y="88" fill="#4ade80">随时 checkout 分支，共享 m1..m3 共同历史！</text>
          <text y="104" fill="#4ade80">✓ 完美对比两套方案的性能与测试结果！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 赋予 AI 编程环境媲美版本控制系统的强大分支能力；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支持复杂代码重构的多路径无损回退；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级 AI IDE 核心架构设计！</text>
      </g>
    </g>
  </g>
</svg>