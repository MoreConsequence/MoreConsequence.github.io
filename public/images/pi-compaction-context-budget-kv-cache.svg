<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Compaction 上下文压缩算法：滑动窗口、结构化摘要与 KV Cache 保活</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">静态前缀 (100% 缓存保留) ──► 中间历史区 (触发 Compaction 压缩为结构化 Summary) ──► 最新活跃区 (保留完整细节上下文)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 静态前缀区 (Static Prefix)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 包含核心设定与工具</text>
          <text x="10" y="34" fill="#93c5fd">• System Prompt &amp; AGENTS.md</text>
          <text x="10" y="50" fill="#93c5fd">• 所有 Tool Definitions (JSON)</text>
          
          <text x="10" y="74" fill="#34d399">治理原则：</text>
          <text x="10" y="90" fill="#4ade80">• 字节级不可变，严禁动态修改！</text>
          <text x="10" y="106" fill="#4ade80">• 100% 享受 GPU KV Cache 命中！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 奠定 Agent 认知基准；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 缓存命中率达到 98% 以上；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造超低延迟推理通道。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 中间历史压缩区 (Compacted)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 结构化压缩摘要模版</text>
          <text x="10" y="32" fill="#fed7aa">【历史执行摘要】:</text>
          <text x="10" y="46" fill="#fed7aa">• 已修改文件: auth.ts, db.ts</text>
          <text x="10" y="60" fill="#fed7aa">• 解决问题: 修复 Token 过期崩溃</text>
          <text x="10" y="74" fill="#fed7aa">• 当前未决状态: 待运行集成测试</text>
          
          <text x="10" y="98" fill="#34d399">✓ 释放 80k 冗长日志 Token！</text>
          <text x="10" y="114" fill="#4ade80">✓ 核心业务事实 100% 精准留存！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">压缩原则：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 异步后台总结，不阻塞主流程；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 提取关键状态事实，丢弃冗长工具输出；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 保证超长长程记忆不断层！</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 最新活跃区 (Active Tail)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 最近 5 轮全量交互细节</text>
          <text x="10" y="34" fill="#86efac">• 完整的工具入参与错误栈信息</text>
          <text x="10" y="50" fill="#86efac">• 用户的最新指令细节</text>
          
          <text x="10" y="74" fill="#38bdf8">调度机制：</text>
          <text x="10" y="90" fill="#34d399">• 提供高精度的局部调试感知</text>
          <text x="10" y="106" fill="#4ade80">• 随着步数推进自动向中间区滚动！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 兼顾长程全局认知与短程微观操作；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支持 Agent 持续运转数百轮长线任务；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造永不内存溢出的强健智能体！</text>
      </g>
    </g>
  </g>
</svg>