<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="hdrhistogram-high-dynamic-range-compressed-storage-title hdrhistogram-high-dynamic-range-compressed-storage-desc"><title id="hdrhistogram-high-dynamic-range-compressed-storage-title">HdrHistogram 高动态范围直方图：1 微秒到 1 小时 0 精度损失与极小内存压缩</title><desc id="hdrhistogram-high-dynamic-range-compressed-storage-desc">HdrHistogram 高动态范围直方图：1 微秒到 1 小时 0 精度损失与极小内存压缩</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">HdrHistogram 高动态范围直方图底层存储压缩架构</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">浮点对数分桶 (Logarithmic Sub-Bucketing) ──► 1μs 到 1 小时跨 9 个数量级 ──► 维持 3 位有效数字恒定 1% 相对精度 ──► 内存占用仅数十 KB</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 高动态范围与微秒级起点 (Dynamic Range: 1μs ~ 3600s)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">支持纳秒/微秒级极速 L1 缓存命中，同时无缝容纳 1 小时超长事务阻塞 ──► 跨越 10^9 巨大动态跨度</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">彻底消灭传统固定分桶在长尾溢出的物理瓶颈！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 对数桶与线性子桶两级寻址 (Two-Level Bucketing Indexing)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">通过前导 0 指令 CLZ (Count Leading Zeros) 瞬间计算指数层级 ──► 在 2048 个子桶内快速寻址累加</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">单次记录 recordValue() 仅需 3~6 个 CPU 周期，纳秒级 0 锁！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 恒定高精度 (Constant 3 Significant Digits: 1% Error)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">无论时延是 10μs 还是 10,000ms ──► 误差恒定在 ±1% 以内 ──► 彻底消除大分位数插值失真</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">数学级严密保障 P99 / P99.9 / P99.99 极致精准！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 协调遗漏修正 (Coordinated Omission Correction)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">自动识别系统停顿期间积压的请求 ──► 主动填充遗漏的时延样本 ──► 呈现绝对真实的客户端体验！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">Gil Tene 提出的世界顶级性能工程基石！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
