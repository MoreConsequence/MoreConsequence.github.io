<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Tool Calling 自愈重试与错误反哺闭环 (Self-Healing Tool Loop)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">直接抛异常终止 (脆弱不堪) vs 错误堆栈结构化回灌 (模型阅读错误并在下一轮自主修正参数，成功率提升至 99%)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Fragile Direct Fail -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统脆弱模式：参数错误直接抛异常崩溃</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">LLM 输出了错误的日期格式: "2026/08/30"</text>
          <text y="28" fill="#ef4444">后端执行: time.Parse("2006-01-02", dateStr)</text>
          
          <text y="50" fill="#ef4444">崩溃后果：</text>
          <text y="64" fill="#ef4444">• 后端直接 throw Error / 500 Internal Error</text>
          <text y="78" fill="#fca5a5">• Agent 整个任务执行链路瞬间中断被杀！</text>
          <text y="92" fill="#ef4444">• 前期消耗的所有 Token 与步骤彻底白费。</text>
          
          <text y="116" fill="#f87171">🔴 导致多步骤 Agent 成功率不足 30%！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 将确定性的语法小错误放大为系统级崩溃；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 缺乏工程容错与自我修复韧性；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 业余 Agent 实现典型通病！</text>
      </g>
    </g>

    <!-- Right: Self-Healing Loop -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 自愈重试闭环：结构化错误反哺与自纠错</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">自愈机制流转：</text>
          <text y="28" fill="#86efac">1. 捕获格式错误 ──► 0 崩溃！</text>
          
          <text y="50" fill="#38bdf8">2. 组装精美结构化 Observation 响应：</text>
          <text y="64" fill="#34d399">   {"error": "Invalid date format, expected YYYY-MM-DD"}</text>
          <text y="78" fill="#34d399">3. 模型阅读错误提示 ──► 立即理解自身偏差</text>
          <text y="92" fill="#4ade80">4. 自动修正参数为 "2026-08-30" 并再次成功发起调用！</text>
          
          <text y="116" fill="#4ade80">✓ 任务 100% 成功达成，健壮度极高！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 充分利用大模型强大的上下文纠错与理解力；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 复杂长链路 Agent 生产就绪必备规范；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级 Agent 鲁棒性最高典范！</text>
      </g>
    </g>
  </g>
</svg>