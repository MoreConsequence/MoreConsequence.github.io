<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="agent-tool-calling-self-healing-retry-loop-title agent-tool-calling-self-healing-retry-loop-desc"><title id="agent-tool-calling-self-healing-retry-loop-title">Tool Calling 失败自愈循环：参数异常捕获、错误反哺与自适应修复</title><desc id="agent-tool-calling-self-healing-retry-loop-desc">Tool Calling 失败自愈循环：参数异常捕获、错误反哺与自适应修复</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Tool Calling 自愈重试与错误反哺闭环 (Self-Healing Tool Loop)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">直接抛异常终止 (脆弱不堪) vs 错误堆栈结构化回灌 (模型阅读错误并在下一轮自主修正参数，成功率提升至 99%)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 传统脆弱模式：参数错误直接抛异常崩溃</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">LLM 输出了错误的日期格式: "2026/08/30"</text>
          <text y="28" fill="#f5f5f5">后端执行: time.Parse("2006-01-02", dateStr)</text>

          <text y="50" fill="#f5f5f5">崩溃后果：</text>
          <text y="64" fill="#f5f5f5">• 后端直接 throw Error / 500 Internal Error</text>
          <text y="78" fill="#f5f5f5">• Agent 整个任务执行链路瞬间中断被杀！</text>
          <text y="92" fill="#f5f5f5">• 前期消耗的所有 Token 与步骤彻底白费。</text>

          <text y="116" fill="#f5f5f5">🔴 导致多步骤 Agent 成功率不足 30%！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产痛点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 将确定性的语法小错误放大为系统级崩溃；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 缺乏工程容错与自我修复韧性；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 业余 Agent 实现典型通病！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 自愈重试闭环：结构化错误反哺与自纠错</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">自愈机制流转：</text>
          <text y="28" fill="#f5f5f5">1. 捕获格式错误 ──► 0 崩溃！</text>

          <text y="50" fill="#f5f5f5">2. 组装精美结构化 Observation 响应：</text>
          <text y="64" fill="#f5f5f5">   {"error": "Invalid date format, expected YYYY-MM-DD"}</text>
          <text y="78" fill="#f5f5f5">3. 模型阅读错误提示 ──► 立即理解自身偏差</text>
          <text y="92" fill="#f5f5f5">4. 自动修正参数为 "2026-08-30" 并再次成功发起调用！</text>

          <text y="116" fill="#f5f5f5">✓ 任务 100% 成功达成，健壮度极高！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 充分利用大模型强大的上下文纠错与理解力；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 复杂长链路 Agent 生产就绪必备规范；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级 Agent 鲁棒性最高典范！</text>
      </g>
    </g>
  </g>
