<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">万兆 (10Gbps) 测速架构：Linux 内核调优与极低成本服务器拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">BBR 拥塞控制 ｜ TCP 缓冲区调优 (rmem/wmem max 64MB) ｜ RSS 网卡多队列中断亲和性绑定 ｜ 4 核 8G 撑起 10Gbps 线速</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 内核 TCP 缓冲区调优</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8"># sysctl.conf 万兆参数</text>
          <text x="10" y="34" fill="#93c5fd">net.core.rmem_max = 67108864</text>
          <text x="10" y="48" fill="#93c5fd">net.core.wmem_max = 67108864</text>
          <text x="10" y="66" fill="#4ade80">net.ipv4.tcp_rmem = 4096 87380 67108864</text>
          <text x="10" y="80" fill="#4ade80">net.ipv4.tcp_wmem = 4096 65536 67108864</text>
          <text x="10" y="98" fill="#fbbf24">net.ipv4.tcp_congestion_control = bbr</text>
          <text x="10" y="116" fill="#34d399">✓ 支撑高 RTT 跨洋连接打满万兆！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 默认 4MB 缓冲区无法填满大 BDP；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• BBR 拥塞控制在轻微丢包下依然全速线速运行；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 彻底消除 Cubic 算法暴跌的缺陷。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 网卡中断与 CPU 亲和性</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80"># 多队列网卡 RSS 绑定</text>
          <text x="10" y="34" fill="#86efac">1. ethtool -L eth0 combined 8</text>
          <text x="10" y="50" fill="#86efac">2. 启用 RPS / RFS 跨核软中断分发</text>
          <text x="10" y="68" fill="#38bdf8">3. smp_affinity 将每个网卡队列中断</text>
          <text x="10" y="82" fill="#38bdf8">   硬绑定至独立的 CPU 物理核心！</text>
          <text x="10" y="104" fill="#34d399">✓ 消除 CPU0 单核软中断 100% 锁死瓶颈！</text>
          <text x="10" y="120" fill="#34d399">✓ 8 核心负载均衡极度均匀！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免单核陷入软中断 (si) 泥潭；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• NUMA 架构下将进程绑定同侧内存；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 获得极限稳定的发包吞吐性能。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 成本模型：极简配置撑起 10G</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 生产实测硬件成本清单</text>
          <text x="10" y="34" fill="#fed7aa">• CPU: 4 核心 AMD EPYC / Intel Xeon</text>
          <text x="10" y="48" fill="#fed7aa">• RAM: 8GB DDR4 (仅需 200MB 真实占用)</text>
          <text x="10" y="62" fill="#fed7aa">• NIC: 10Gbps SFP+ 光口网卡</text>
          <text x="10" y="80" fill="#4ade80">• 软件: Go 静态编译二进制 (无 JVM/Node 负担)</text>
          <text x="10" y="102" fill="#34d399">✓ 单月硬件成本仅数百元，即可向数十万用户提供满载万兆测速服务！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 将每 Gbps 带宽服务成本降低 90%；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 极致软件工程带来的算力与硬件压榨；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 这就是现代网络工程美学的终极展现！</text>
      </g>
    </g>
  </g>
</svg>