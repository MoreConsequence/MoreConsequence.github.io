<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">操作系统进程内存指标分层拓扑 (VSS ⊃ RSS ⊃ PSS ⊃ USS)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">VSS 虚拟耗尽 (虚拟地址空间) ──► RSS 常驻物理内存 (含动态共享库) ──► USS 进程独占物理内存 ──► Runtime heapUsed 真实对象数据</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. VSS (虚拟地址空间)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">Virtual Set Size:</text>
          
          <text x="8" y="38" fill="#86efac">• 进程能访问的全部地址空间</text>
          <text x="8" y="54" fill="#cbd5e1">• 包含未分配物理页的 mmap 预留</text>
          <text x="8" y="70" fill="#34d399">• 64 位系统通常数个 GB / TB</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 仅代表地址范围预定！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 不占用真实硬件 RAM 物理插条；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 绝不能作为 OOM 的判断标准；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 纯虚拟概念。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fef2f2"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. RSS (常驻物理内存)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#f87171">Resident Set Size:</text>
          
          <text x="8" y="38" fill="#fca5a5">• 真实加载在 RAM 中的物理内存</text>
          <text x="8" y="54" fill="#ef4444">• 包含独占堆栈 + 共享动态库 (.so)</text>
          <text x="8" y="70" fill="#ef4444">• K8s cgroup OOM-Killer 的直接触发源！</text>
          
          <text x="8" y="100" fill="#ef4444">🔴 运维监控第一核心指标</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• RSS 超过 limits 必被容器瞬间杀死；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 包含堆外内存与 Cgo 分配；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 生产防御核心。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. heapTotal (运行时申请)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">Runtime Total Heap:</text>
          
          <text x="8" y="38" fill="#fed7aa">• Node.js V8 / Go 内存池大小</text>
          <text x="8" y="54" fill="#38bdf8">• 包含已分配对象 + 内部空闲待用槽位</text>
          <text x="8" y="70" fill="#34d399">• 避免频繁向 OS 发起 brk/mmap</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 语言内部的高性能缓冲池！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 反映运行时的内存占有欲望；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• GC 触发阈值的计算基准；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 运行时中间状态。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">4. heapUsed (存活业务数据)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">Runtime In-Use Objects:</text>
          
          <text x="8" y="38" fill="#86efac">• 当前存活对象的纯物理净重</text>
          <text x="8" y="54" fill="#38bdf8">• 业务代码直接持有的结构体/闭包</text>
          <text x="8" y="70" fill="#4ade80">• 若单调上升 ──► 业务层内存泄漏！</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 代码级调优核心视界！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 辅助定位是业务泄漏还是堆外/Cgo 泄漏；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 全链路内存清晰透视；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造 0 崩溃坚实微服务！</text>
      </g>
    </g>
  </g>
</svg>