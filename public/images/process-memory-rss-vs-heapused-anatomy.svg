<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="process-memory-rss-vs-heapused-anatomy-title process-memory-rss-vs-heapused-anatomy-desc"><title id="process-memory-rss-vs-heapused-anatomy-title">进程内存全景物理剖析：VSS, RSS, PSS, USS 与 V8 / Go runtime 堆内存分层</title><desc id="process-memory-rss-vs-heapused-anatomy-desc">进程内存全景物理剖析：VSS, RSS, PSS, USS 与 V8 / Go runtime 堆内存分层</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">操作系统进程内存指标分层拓扑 (VSS ⊃ RSS ⊃ PSS ⊃ USS)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">VSS 虚拟耗尽 (虚拟地址空间) ──► RSS 常驻物理内存 (含动态共享库) ──► USS 进程独占物理内存 ──► Runtime heapUsed 真实对象数据</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. VSS (虚拟地址空间)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">Virtual Set Size:</text>

          <text x="8" y="38" fill="#f5f5f5">• 进程能访问的全部地址空间</text>
          <text x="8" y="54" fill="#cbd5e1">• 包含未分配物理页的 mmap 预留</text>
          <text x="8" y="70" fill="#f5f5f5">• 64 位系统通常数个 GB / TB</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 仅代表地址范围预定！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 不占用真实硬件 RAM 物理插条；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 绝不能作为 OOM 的判断标准；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 纯虚拟概念。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. RSS (常驻物理内存)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">Resident Set Size:</text>

          <text x="8" y="38" fill="#f5f5f5">• 真实加载在 RAM 中的物理内存</text>
          <text x="8" y="54" fill="#f5f5f5">• 包含独占堆栈 + 共享动态库 (.so)</text>
          <text x="8" y="70" fill="#f5f5f5">• K8s cgroup OOM-Killer 的直接触发源！</text>

          <text x="8" y="100" fill="#f5f5f5">🔴 运维监控第一核心指标</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• RSS 超过 limits 必被容器瞬间杀死；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 包含堆外内存与 Cgo 分配；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 生产防御核心。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. heapTotal (运行时申请)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">Runtime Total Heap:</text>

          <text x="8" y="38" fill="#f5f5f5">• Node.js V8 / Go 内存池大小</text>
          <text x="8" y="54" fill="#f5f5f5">• 包含已分配对象 + 内部空闲待用槽位</text>
          <text x="8" y="70" fill="#f5f5f5">• 避免频繁向 OS 发起 brk/mmap</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 语言内部的高性能缓冲池！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 反映运行时的内存占有欲望；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• GC 触发阈值的计算基准；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 运行时中间状态。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">4. heapUsed (存活业务数据)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">Runtime In-Use Objects:</text>

          <text x="8" y="38" fill="#f5f5f5">• 当前存活对象的纯物理净重</text>
          <text x="8" y="54" fill="#f5f5f5">• 业务代码直接持有的结构体/闭包</text>
          <text x="8" y="70" fill="#f5f5f5">• 若单调上升 ──► 业务层内存泄漏！</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 代码级调优核心视界！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 辅助定位是业务泄漏还是堆外/Cgo 泄漏；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 全链路内存清晰透视；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造 0 崩溃坚实微服务！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
