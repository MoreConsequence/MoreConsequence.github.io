<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="speedtest-multi-stream-socket-buffer-tuning-title speedtest-multi-stream-socket-buffer-tuning-desc"><title id="speedtest-multi-stream-socket-buffer-tuning-title">多并发 TCP 测速流与内核 Socket Buffer 调优：BDP 乘积与 BBR 拥塞控制</title><desc id="speedtest-multi-stream-socket-buffer-tuning-desc">多并发 TCP 测速流与内核 Socket Buffer 调优：BDP 乘积与 BBR 拥塞控制</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">测速内核网络栈与多流 BDP 压榨拓扑 (Multi-Stream TCP BDP)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">单流受限于 BDP (Bandwidth-Delay Product) 与单核软中断 ──► 动态 4~8 独立并发 TCP 流 ──► 开启 Linux BBR 算法 ──► 100% 填满千兆物理信道</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 初始 RTT 与 BDP 评估 (Initial Ping &amp; BDP Sizing)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">通过 WebSocket / TCP 三次握手精确测量物理往返时延 RTT ──► 计算理论 BDP = Bandwidth * RTT</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">为并发流数量与滑动窗口大小提供数学基准！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 动态多流阶梯建联 (Dynamic Multi-Stream Escalation: 1 -&gt; 4 -&gt; 8)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">从 2 条流快速启动 ──► 若 500ms 内吞吐增速仍处于斜率上限 ──► 阶梯扩增至 4~8 条流并行下载</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">突破客户端单线程处理上限与中间路由器的单流限速策略！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 服务端 Linux 内核参数与 BBR 调优 (Kernel Tuning: wmem &amp; BBR)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">tcp_wmem 调大至 16MB ──► 启用 BBR 拥塞控制 ──► 基于实时最大带宽与最小延迟建模，0 丢包退避</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">彻底克服 CUBIC 在高延迟长肥管道 (LFN) 下的吞吐崩塌！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 客户端聚合统计与 P95 峰值结算 (Aggregation &amp; P95 Settlement)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">汇总各流实时传输字节数 ──► 剔除前 1 秒慢启动抖动 ──► 提取稳定段 P95 吞吐作为最终测速结果！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">国际公认权威的宽带性能评估基准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
