<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 1.18+ 切片扩容算法演进 (growslice Algorithm)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">老版本 (cap &lt; 1024 翻倍，≥ 1024 陡降为 1.25x 存在断崖) ──► Go 1.18+ (newcap += (oldcap + 3*256)/4 平滑单调过渡) ──► 内存规格向上对齐</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 小容量翻倍阶段 (Small Slice: oldcap &lt; 256)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">doublecap = oldcap + oldcap ──► newcap = doublecap (保持 2.0x 激进翻倍)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">小切片迅速扩张，减少 append 触发内存重分配的频率！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 平滑过渡递推 (Smooth Transition: oldcap ≥ 256)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">newcap += (newcap + 3*256) / 4 ──► 扩容因子从 2.0x 平滑连续递减至 1.25x</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">彻底消灭了 Go 1.17 之前 cap=1024 处的突兀性能断崖！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 内存分配器规格向上对齐 (Roundupsize via mallocgc)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">capmem = roundupsize(newcap * elemsize) ──► newcap = capmem / elemsize</text>
        <text x="15" y="62" font-size="8" fill="#047857">匹配 runtime class_to_size 档位，不浪费哪怕 1 个字节的伙伴内存！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 物理底层重分配与数据迁移 (Memory Reallocation &amp; Copy)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">分配新底层数组 ──► memmove 复制旧数据 ──► 返回新 slice 头部结构体 (array, len, cap)</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Go 语言内存管理最精巧的基础设施！</text>
      </g>
    </g>
  </g>
</svg>