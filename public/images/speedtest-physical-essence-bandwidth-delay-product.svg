<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">测速的物理本质：测速不是测文件下载，而是灌满 BDP 管道容量</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">文件下载受限于 磁盘 I/O、协议解析、单 TCP 慢启动 ｜ 测速是利用高熵并发流快速压榨出物理链路的最大承载极限</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: File Download -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 普通文件下载：被多重非网络瓶颈扼杀</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. 服务端磁盘读取瓶颈 (HDD/SATA SSD 随机读限制)</text>
          <text y="30" fill="#fca5a5">2. 客户端磁盘写入瓶颈 (手机/电脑落盘 flush 开销)</text>
          <text y="46" fill="#fca5a5">3. 单 TCP 连接慢启动 (Slow Start 需数秒才能爬坡)</text>
          <text y="64" fill="#ef4444">4. 协议栈额外开销 (TLS 证书重协商、Content-Length 阻塞)</text>
          
          <text y="90" fill="#ef4444">🔴 测量结果：千兆宽带实测仅跑出 150 Mbps！</text>
          <text y="106" fill="#fca5a5">► 测出来的根本不是网络带宽，而是全链路最慢的木桶短板！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">常见误区：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 用百度网盘或浏览器下载大文件来评判宽带质量；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 忽略了 CDN 限速、对端服务器上行配额与拥塞窗口限制；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法反映真实底层物理介质的信道容量！</text>
      </g>
    </g>

    <!-- Right: Speedtest Essence -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 专业测速物理模型：灌满 BDP 管道容量</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">1. BDP 物理公式: BDP = Bandwidth × RTT</text>
          <text y="28" fill="#86efac">   (如 1Gbps × 20ms = 2.5MB 飞行中数据容量)</text>
          
          <text y="48" fill="#38bdf8">2. 零磁盘 I/O: 纯内存数据源 ──► 纯内存黑洞接收</text>
          <text y="64" fill="#38bdf8">3. 多路并发连接: 4~8 路 TCP 并行瞬间填满 BDP 管道！</text>
          <text y="80" fill="#4ade80">4. 高熵伪随机字节: 彻底绕过中间硬件/协议压缩干扰！</text>
          
          <text y="104" fill="#34d399">✓ 测量结果: 稳定呈现 940 Mbps 真实物理千兆极限！</text>
          <text y="120" fill="#34d399">✓ 测出的是纯粹的物理层与传输层容量！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级标准：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 测速的唯一目标是测量信道容量 (Channel Capacity)；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 必须在设计上剔除任何非网络瓶颈（CPU/内存/磁盘）；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造现代通信工程最严格的度量标尺！</text>
      </g>
    </g>
  </g>
</svg>