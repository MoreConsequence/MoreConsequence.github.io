<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="benchstat-delta-confidence-distribution-title benchstat-delta-confidence-distribution-desc"><title id="benchstat-delta-confidence-distribution-title">benchstat 统计分布与差异检验：p-value、置信区间与真实性能收益确认</title><desc id="benchstat-delta-confidence-distribution-desc">benchstat 统计分布与差异检验：p-value、置信区间与真实性能收益确认</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">benchstat 差异统计检验决策模型 (Statistical Significance)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">单次运行结果对比 (被抖动欺骗) vs 10 轮采样 + 曼-惠特尼 U 检验 (Mann-Whitney U Test, p &lt; 0.05 证明真实有效)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 单次基准对比：被系统随机噪音蒙蔽</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">Old: BenchmarkProcess-8   10000   120 ns/op</text>
          <text y="28" fill="#f5f5f5">New: BenchmarkProcess-8   10000   110 ns/op (-8.3%)</text>

          <text y="50" fill="#f5f5f5">致命的虚假繁荣：</text>
          <text y="64" fill="#f5f5f5">• 仅运行 1 次，恰逢后台 CronJob 结束导致 New 略快</text>
          <text y="78" fill="#f5f5f5">• 上线到生产环境后发现吞吐毫无变化甚至恶化！</text>
          <text y="92" fill="#f5f5f5">• 耗费团队数周时间排查幽灵优化。</text>

          <text y="116" fill="#f5f5f5">🔴 毫无统计学意义的伪实验！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 把噪音当优化，合并了劣化代码；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 缺乏科学严谨度；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 严禁将单次基准写入 PR 描述！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ benchstat 权威验证：置信度与方差收敛</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">$ benchstat old.txt new.txt</text>
          <text y="28" fill="#f5f5f5">name          old time/op    new time/op    delta</text>
          <text y="42" fill="#f5f5f5">Process-8     120ns ± 1%     95ns ± 2%      -20.83% (p=0.000 n=10)</text>
          <text y="56" fill="#f5f5f5">Process-8     24.0B ± 0%     0.0B           -100.00% (p=0.000 n=10)</text>

          <text y="80" fill="#f5f5f5">数学级铁证结论：</text>
          <text y="94" fill="#f5f5f5">• p=0.000 &lt; 0.05 证明差异并非偶然</text>
          <text y="108" fill="#f5f5f5">• 堆分配彻底归零，性能提升 20.8% 稳固可复现！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 获得团队与开源社区 100% 信任与通过；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 交付绝对确定性的性能收益；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 资深工程师核心专业素养！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
