  <text x="254" y="468" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">B₂</text>

  
  <circle cx="169" cy="400" r="11" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="169" y="403" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">C₂</text>

  
