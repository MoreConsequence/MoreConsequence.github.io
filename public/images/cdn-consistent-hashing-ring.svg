  <g transform="translate(560, 150)">
    <rect width="360" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="60" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="1" />
    <text x="44" y="24" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SLOTS</text>
    <text x="82" y="25" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">虚拟节点（Virtual Slots）消除倾斜</text>
    <text x="14" y="48" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif">每台物理机生成 160~256 个带权虚拟副本（A#1, A#2...）</text>
    <text x="14" y="66" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif">数万虚拟槽位均匀散落环上，流量分配标准差 &lt; 5%</text>
    <text x="14" y="84" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">大数定律消除热点物理倾斜</text>
  </g>

  
  <g transform="translate(560, 260)">
    <rect width="360" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="60" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="1" />
    <text x="44" y="24" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">ROUTING</text>
    <text x="82" y="25" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">顺时针二分查找与集群分片</text>
    <text x="14" y="48" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif">CacheKey 计算 Hash 后沿圆环顺时针寻找最近节点</text>
    <text x="14" y="66" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif">整机房 50 台机器聚合为单一逻辑分片缓存池</text>
    <text x="14" y="84" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">杜绝重复拉取，有效缓存容量扩大 50 倍</text>
  </g>

  
  <g transform="translate(560, 370)">
    <rect width="360" height="106" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="60" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-width="1" />
    <text x="44" y="24" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STABILITY</text>
    <text x="82" y="25" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">单机宕机最小迁移证明（Δ = 1/N）</text>
    <text x="14" y="48" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif">任一物理节点宕机时，仅紧随其后的弧段重新映射</text>
    <text x="14" y="66" fill="#eb6c36" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">全网数据迁移量严格约束为 1/N（如 50 节点仅迁移 2%）</text>
    <text x="14" y="86" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">其余 (N-1)/N (98%) 缓存 100% 稳定命中</text>
  </g>

  
