<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="ring-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr-ring-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-ring-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="ring-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#ring-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="32" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">CONSISTENT HASHING &amp; VIRTUAL SLOTS TOPOLOGY</text>
  <text x="40" y="52" fill="#0f172a" font-size="16" font-weight="700">Ketama 一致性哈希环与边缘虚拟节点分片调度机理</text>

  <!-- ================= LEFT: HASHING RING DIAGRAM (Center x: 260, y: 265, R: 135) ================= -->
  
  <!-- Outer Ring Circle -->
  <circle cx="260" cy="265" r="135" fill="#f8fafc" stroke="#cbd5e1" stroke-width="6"/>
  <circle cx="260" cy="265" r="135" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Center Hub Label -->
  <circle cx="260" cy="265" r="60" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#ring-shadow)"/>
  <text x="260" y="255" fill="#1e40af" font-size="11" font-weight="700" class="mono" text-anchor="middle">HASH RING</text>
  <text x="260" y="272" fill="#475569" font-size="9.5" class="mono" text-anchor="middle">[0 ~ 2³²-1]</text>
  <text x="260" y="287" fill="#64748b" font-size="9" text-anchor="middle">顺时针最近路由</text>

  <!-- Degree Indicator: 0 Point (Top) -->
  <line x1="260" y1="115" x2="260" y2="130" stroke="#64748b" stroke-width="1.5"/>
  <text x="260" y="108" fill="#64748b" font-size="9.5" class="mono" text-anchor="middle">0 / 2³²-1</text>

  <!-- Virtual Nodes on Ring (Angles: A1=30°, B1=90°, C1=150°, A2=210°, B2=270°, C2=330°) -->
  <!-- A1 (30 deg: x=260+135*sin30=327.5, y=265-135*cos30=148) -->
  <circle cx="328" cy="148" r="13" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <text x="328" y="152" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">A₁</text>

  <!-- B1 (90 deg: x=395, y=265) -->
  <circle cx="395" cy="265" r="13" fill="#059669" stroke="#ffffff" stroke-width="2"/>
  <text x="395" y="269" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">B₁</text>

  <!-- C1 (150 deg: x=328, y=382) -->
  <circle cx="328" cy="382" r="13" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
  <text x="328" y="386" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">C₁</text>

  <!-- A2 (210 deg: x=192, y=382) -->
  <circle cx="192" cy="382" r="13" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <text x="192" y="386" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">A₂</text>

  <!-- B2 (270 deg: x=125, y=265) -->
  <circle cx="125" cy="265" r="13" fill="#059669" stroke="#ffffff" stroke-width="2"/>
  <text x="125" y="269" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">B₂</text>

  <!-- C2 (330 deg: x=192, y=148) -->
  <circle cx="192" cy="148" r="13" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
  <text x="192" y="152" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">C₂</text>

  <!-- Key 1 Example (Angle 10 deg: x=283, y=132 -> routes clockwise to A1 at 30 deg) -->
  <rect x="260" y="80" width="105" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="312" y="96" fill="#1e40af" font-size="9.5" font-weight="700" class="mono" text-anchor="middle">Key 1 (/video.mp4)</text>
  <path d="M 312,104 L 324,135" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-ring-blue)"/>

  <!-- Key 2 Example (Angle 120 deg: x=377, y=332 -> routes clockwise to C1 at 150 deg) -->
  <rect x="360" y="340" width="105" height="24" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="412" y="356" fill="#c2410c" font-size="9.5" font-weight="700" class="mono" text-anchor="middle">Key 2 (/main.js)</text>
  <path d="M 370,364 L 341,377" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-ring-orange)"/>


  <!-- ================= RIGHT: THREE ENGINEERING MECHANISM CARDS (x: 510 ~ 920, w: 410) ================= -->
  
  <!-- Card 1: Virtual Nodes Anti-Skew [y: 75, h: 115] -->
  <g transform="translate(510, 75)" filter="url(#ring-shadow)">
    <rect width="410" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#2563eb"/>
    <text x="14" y="24" fill="#1e40af" font-size="10" font-weight="700" class="mono">1. VIRTUAL SLOTS · ANTI-SKEW</text>
    <text x="14" y="44" fill="#0f172a" font-size="12.5" font-weight="700">虚拟节点打散与消除数据倾斜</text>
    <line x1="14" y1="54" x2="396" y2="54" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="74" fill="#475569" font-size="10.5">每台物理机生成 <tspan font-weight="700" fill="#2563eb">160 ~ 256 个虚拟节点</tspan> 均匀散落环上；</text>
    <text x="14" y="94" fill="#475569" font-size="10.5">彻底消除由于物理节点过少导致的数据哈希偏斜与单机打爆。</text>
  </g>

  <!-- Card 2: Minimal Churn on Node Churn [y: 205, h: 115] -->
  <g transform="translate(510, 205)" filter="url(#ring-shadow)">
    <rect width="410" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#059669"/>
    <text x="14" y="24" fill="#059669" font-size="10" font-weight="700" class="mono">2. FAULT ISOLATION · MINIMAL CHURN</text>
    <text x="14" y="44" fill="#0f172a" font-size="12.5" font-weight="700">节点宕机/扩容时的最小化数据迁移</text>
    <line x1="14" y1="54" x2="396" y2="54" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="74" fill="#475569" font-size="10.5">传统模运算（Key % N）宕机导致 <tspan font-weight="700" fill="#dc2626">100% 缓存失效</tspan>；</text>
    <text x="14" y="94" fill="#475569" font-size="10.5">一致性哈希严格保证仅迁移 <tspan font-weight="700" fill="#059669">Δ = 1/N 数据</tspan>，其余节点 100% 稳定命中。</text>
  </g>

  <!-- Card 3: Memory Locality & Hit Ratio Boost [y: 335, h: 115] -->
  <g transform="translate(510, 335)" filter="url(#ring-shadow)">
    <rect width="410" height="115" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#ea580c"/>
    <text x="14" y="24" fill="#c2410c" font-size="10" font-weight="700" class="mono">3. HIT RATIO · ZERO REDUNDANCY</text>
    <text x="14" y="44" fill="#0f172a" font-size="12.5" font-weight="700">PoP 集群级内存复用与命中率最大化</text>
    <line x1="14" y1="54" x2="396" y2="54" stroke="#fed7aa" stroke-width="1"/>
    <text x="14" y="74" fill="#9a3412" font-size="10.5">PoP 内 50 台宿主机由随机分散变为 <tspan font-weight="700">分片协同</tspan>；</text>
    <text x="14" y="94" fill="#9a3412" font-size="10.5">消除重复热点占用，有效缓存空间扩大 50 倍，命中率从 65% 跃升至 98%+。</text>
  </g>
</svg>
