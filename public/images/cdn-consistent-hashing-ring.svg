<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="cdn-consistent-hashing-ring-title cdn-consistent-hashing-ring-desc"><title id="cdn-consistent-hashing-ring-title">Ketama 一致性哈希环与虚拟节点分片调度拓扑</title><desc id="cdn-consistent-hashing-ring-desc">环形架构图展示 [0, 2^32-1] 哈希空间、虚拟节点散列、顺时针请求最近路由以及单机故障仅影响 1/N 弧段的最小迁移证明。</desc><defs>
    <marker id="cdn-ring-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="cdn-ring-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">CONSISTENT HASHING &amp; VIRTUAL SLOTS</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">Ketama 一致性哈希环与虚拟节点分片调度拓扑</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">32 位整数环空间、顺时针最近路由、虚拟槽位大数均衡与单节点下线最小迁移定理（Δ = 1/N）</text>

  
  
  <circle cx="290" cy="330" r="140" fill="#ffffff" stroke="#2d3142" stroke-width="1.8" />
  <circle cx="290" cy="330" r="140" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="2.4" stroke-dasharray="4 8" />

  
  
  <path d="M 389 231 A 140 140 0 0 1 425 294" fill="none" stroke="#eb6c36" stroke-width="2.4" />

  
  <circle cx="290" cy="330" r="64" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
  <text x="290" y="318" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">HASH RING</text>
  <text x="290" y="336" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">[0 ~ 2³²-1]</text>
  <text x="290" y="354" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">顺时针最近路由</text>

  
  <line x1="290" y1="176" x2="290" y2="190" stroke="#2d3142" stroke-width="1" />
  <text x="290" y="170" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">0 / 2³²-1</text>

  
  
  <circle cx="290" cy="190" r="11" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="290" y="193" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">C₃</text>

  
  <circle cx="360" cy="209" r="11" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="360" y="212" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">A₁</text>

  
  <line x1="460" y1="180" x2="397" y2="225" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#cdn-ring-arr-accent)" />
