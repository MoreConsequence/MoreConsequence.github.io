<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="service-incident-drill-double-map-verification-title service-incident-drill-double-map-verification-desc"><title id="service-incident-drill-double-map-verification-title">构造事故演练与双 Map 验证：内存缓存与持久化存储在故障注入下的状态一致性</title><desc id="service-incident-drill-double-map-verification-desc">构造事故演练与双 Map 验证：内存缓存与持久化存储在故障注入下的状态一致性</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">构造事故演练：双 Map 内存与存储在混沌注入下的强校验模型</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Map 1 (内存状态机真实副本) ｜ Map 2 (底层存储/日志重构副本) ｜ 注入 50% 网络丢包与进程杀死 ──► 验证双 Map 0 字节漂移</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 极端故障注入 (Chaos Fault Injection)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 混沌工程测试框架注入故障</text>
          <text y="28" fill="#f5f5f5">1. 50% 随机网络丢包与 500ms 随机网络延迟</text>
          <text y="44" fill="#f5f5f5">2. 在写 WAL 关键临界区直接发送 kill -9 强杀进程！</text>
          <text y="60" fill="#f5f5f5">3. 磁盘 I/O 随机返回 EIO 写入错误</text>

          <text y="86" fill="#f5f5f5">🔴 核心检验目标：</text>
          <text y="102" fill="#fb7185">系统是否会在极端断电崩溃后留下死锁、半事务或幽灵数据？</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">演练标准：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 没有经过真实故障注入演练的代码绝不能声称高可用；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 崩溃恢复流程与正常业务路径享有同等测试优先级；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 暴露系统隐蔽的竞态死穴！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 双 Map 状态无损强一致验收</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 进程重启后执行双 Map 交叉比对</text>
          <text y="28" fill="#f5f5f5">1. Map A: 客户端记录的已收到成功 ACK 的所有订单</text>
          <text y="44" fill="#f5f5f5">2. Map B: 服务端从落盘 WAL 重放恢复出的最新状态机</text>

          <text y="68" fill="#f5f5f5">3. 严密断言: assert.deepStrictEqual(MapA, MapB)</text>
          <text y="84" fill="#f5f5f5">   • 0 漏单 (已确认请求 100% 存在)</text>
          <text y="98" fill="#f5f5f5">   • 0 幽灵单 (已拒绝请求 0 脏写入)</text>

          <text y="120" fill="#f5f5f5">✓ 证明分布式系统具备绝对不可动摇的崩溃一致性！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 给核心状态机代码披上最高等级的数学保险；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 自动化 CI 每次提交均运行千次混沌演练；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 打造生产级电信核心系统的品质保障！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
