<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">构造事故演练：双 Map 内存与存储在混沌注入下的强校验模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Map 1 (内存状态机真实副本) ｜ Map 2 (底层存储/日志重构副本) ｜ 注入 50% 网络丢包与进程杀死 ──► 验证双 Map 0 字节漂移</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Chaos Injection -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 极端故障注入 (Chaos Fault Injection)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 混沌工程测试框架注入故障</text>
          <text y="28" fill="#fca5a5">1. 50% 随机网络丢包与 500ms 随机网络延迟</text>
          <text y="44" fill="#ef4444">2. 在写 WAL 关键临界区直接发送 kill -9 强杀进程！</text>
          <text y="60" fill="#fca5a5">3. 磁盘 I/O 随机返回 EIO 写入错误</text>
          
          <text y="86" fill="#ef4444">🔴 核心检验目标：</text>
          <text y="102" fill="#fb7185">系统是否会在极端断电崩溃后留下死锁、半事务或幽灵数据？</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">演练标准：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 没有经过真实故障注入演练的代码绝不能声称高可用；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 崩溃恢复流程与正常业务路径享有同等测试优先级；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 暴露系统隐蔽的竞态死穴！</text>
      </g>
    </g>

    <!-- Right: Double Map Verification -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 双 Map 状态无损强一致验收</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 进程重启后执行双 Map 交叉比对</text>
          <text y="28" fill="#86efac">1. Map A: 客户端记录的已收到成功 ACK 的所有订单</text>
          <text y="44" fill="#38bdf8">2. Map B: 服务端从落盘 WAL 重放恢复出的最新状态机</text>
          
          <text y="68" fill="#34d399">3. 严密断言: assert.deepStrictEqual(MapA, MapB)</text>
          <text y="84" fill="#4ade80">   • 0 漏单 (已确认请求 100% 存在)</text>
          <text y="98" fill="#4ade80">   • 0 幽灵单 (已拒绝请求 0 脏写入)</text>
          
          <text y="120" fill="#34d399">✓ 证明分布式系统具备绝对不可动摇的崩溃一致性！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 给核心状态机代码披上最高等级的数学保险；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 自动化 CI 每次提交均运行千次混沌演练；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造生产级电信核心系统的品质保障！</text>
      </g>
    </g>
  </g>
</svg>