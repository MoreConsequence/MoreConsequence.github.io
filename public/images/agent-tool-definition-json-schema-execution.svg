<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 工具系统执行契约全景流水线 (Tool Execution Contract)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. JSON Schema 声明参数 ──► 2. LLM 输出 tool_calls 参数 ──► 3. 强类型运行时校验 ──► 4. 沙箱执行并将结果装配为 Observation 回传</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 严密 Schema 元数据描述 (Tool Definition via JSON Schema)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">通过 name, description, parameters 严密声明参数类型、必填项与字段枚举值</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将代码接口转化为大模型可精准理解的结构化语义规范！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 模型结构化调用生成 (Model Structured Call Generation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">LLM 判断需调用工具 ──► 触发 tool_calls 槽位 ──► 输出严格符合格式的 JSON 参数对象</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">彻底替代传统正则从文本中提取参数的高出错率！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 强类型边界防护与校验 (Zod / Pydantic Boundary Guard)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">服务端解析 JSON ──► 若字段缺失或类型不符立即返回结构化错误提示模型自主修复</text>
        <text x="15" y="62" font-size="8" fill="#047857">防范非法参数注入与系统崩溃！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 沙箱执行与结果观测回填 (Sandbox Execution &amp; Observation Feed)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">安全沙箱调用真实底层系统 ──► 组装 role: "tool" 消息注入对话上下文 ──► 模型继续后续推理！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代自主代理与操作系统交互的标准枢纽！</text>
      </g>
    </g>
  </g>
</svg>