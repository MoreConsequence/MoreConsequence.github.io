<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL 事务两阶段提交（2PC）时序与崩溃恢复裁决分支图</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">物理 Redo Prepare ──► 逻辑 Binlog 落盘 ──► Redo Commit ──► 崩溃重启时基于 XID 是否存在于 Binlog 执行分支裁决</text>
  </g>

  <!-- Main Split Layout: Left Lifecycle Sequence (540px), Right Crash Decision Tree (340px) -->
  <g transform="translate(30, 70)">
    <!-- Left Pane: 2PC Normal Sequence Lifecycle -->
    <g filter="url(#card-shadow)">
      <rect width="550" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="550" height="34" rx="8" fill="#f8fafc"/>
      <text x="20" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">【正常提交流水线】事务执行与日志两阶段落盘时序</text>

      <!-- Actors Header -->
      <g transform="translate(20, 48)">
        <rect width="150" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="75" y="17" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">客户端 / 执行器</text>

        <rect x="180" width="150" height="26" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="255" y="17" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">InnoDB 引擎 (Redo Log)</text>

        <rect x="360" width="150" height="26" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="435" y="17" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">Server 层 (Binlog)</text>
      </g>

      <!-- Lifelines -->
      <path d="M 95 85 L 95 365" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M 275 85 L 275 365" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M 455 85 L 455 365" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

      <!-- Step 1: Write Data & Redo Prepare -->
      <g transform="translate(95, 100)">
        <line x1="0" y1="0" x2="175" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <rect x="25" y="-18" width="130" height="16" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="90" y="-6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1d4ed8" text-anchor="middle">1. UPDATE 修改内存页</text>

        <rect x="180" y="-12" width="140" height="32" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
        <text x="250" y="3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1e40af" text-anchor="middle">写 Redo (PREPARE)</text>
        <text x="250" y="14" font-family="ui-monospace, monospace" font-size="8.5" fill="#2563eb" text-anchor="middle">生成全局唯一 XID: 10086</text>
      </g>

      <!-- Step 2: Write Binlog -->
      <g transform="translate(275, 160)">
        <line x1="0" y1="0" x2="175" y2="0" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <rect x="20" y="-18" width="140" height="16" rx="3" fill="#ffffff" stroke="#fed7aa"/>
        <text x="90" y="-6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#c2410c" text-anchor="middle">2. 写入包含 XID 的事件</text>

        <rect x="180" y="-12" width="80" height="36" rx="4" fill="#fff7ed" stroke="#f97316"/>
        <text x="220" y="5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#9a3412" text-anchor="middle">Binlog fsync</text>
        <text x="220" y="17" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#c2410c" text-anchor="middle">(持久化分水岭)</text>
      </g>

      <!-- Step 3: Commit Phase -->
      <g transform="translate(455, 220)">
        <line x1="0" y1="0" x2="-175" y2="0" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
        <rect x="-150" y="-18" width="125" height="16" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
        <text x="-87" y="-6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">3. 通知引擎已落盘</text>

        <rect x="-260" y="-12" width="80" height="32" rx="4" fill="#f0fdf4" stroke="#10b981"/>
        <text x="-220" y="3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Redo COMMIT</text>
        <text x="-220" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#15803d" text-anchor="middle">置事务为已提交</text>
      </g>

      <!-- Step 4: Return to Client -->
      <g transform="translate(275, 275)">
        <line x1="0" y1="0" x2="-175" y2="0" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
        <rect x="-140" y="-18" width="110" height="16" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
        <text x="-85" y="-6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#166534" text-anchor="middle">4. 返回 OK (释放锁)</text>
      </g>

      <!-- Crash Points Indicators -->
      <g transform="translate(20, 315)">
        <rect width="510" height="50" rx="4" fill="#fef2f2" stroke="#fecaca"/>
        <text x="12" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b">⚠️ 崩溃点标记：</text>
        <text x="12" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#7f1d1d">• <tspan font-weight="700">崩溃点 ①</tspan>：Redo Prepare 后、Binlog 写入前掉电 ──► <tspan font-weight="700" fill="#dc2626">必须 Rollback</tspan></text>
        <text x="12" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#7f1d1d">• <tspan font-weight="700">崩溃点 ②</tspan>：Binlog 写入后、Redo Commit 前掉电 ──► <tspan font-weight="700" fill="#166534">必须自动 Commit！</tspan></text>
      </g>
    </g>

    <!-- Right Pane: Crash Recovery Decision Tree -->
    <g transform="translate(570, 0)" filter="url(#card-shadow)">
      <rect width="330" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="330" height="34" rx="8" fill="#f8fafc"/>
      <text x="20" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">【崩溃恢复裁决决策树】</text>

      <!-- Decision Root -->
      <g transform="translate(20, 50)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="290" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="145" y="18" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">扫描 Redo Log 中的未完成事务</text>
        <text x="145" y="32" font-size="9" fill="#64748b" text-anchor="middle">发现状态处于 PREPARE 的事务 XID</text>

        <!-- Fork Arrow -->
        <path d="M 145 42 L 145 70" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

        <!-- Question Box -->
        <rect y="70" width="290" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="145" y="88" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">拿着 XID 去 Binlog 文件中查找是否存在？</text>

        <!-- Branch 1: NOT in Binlog -->
        <path d="M 60 106 L 60 135" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
        <rect y="135" width="135" height="130" rx="4" fill="#fef2f2" stroke="#f87171"/>
        <text x="67" y="152" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 否 (不存在)</text>
        <text x="10" y="172" font-size="8.5" fill="#7f1d1d">• Binlog 尚未写盘</text>
        <text x="10" y="188" font-size="8.5" fill="#7f1d1d">• 从库未收到该事务</text>
        <text x="10" y="204" font-size="8.5" fill="#7f1d1d">• 必须利用 Undo Log</text>
        <rect x="10" y="215" width="115" height="26" rx="3" fill="#dc2626"/>
        <text x="67" y="232" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">执行回滚 Rollback</text>
        <text x="67" y="255" font-size="8" fill="#991b1b" text-anchor="middle">保证主从数据一致</text>

        <!-- Branch 2: IN Binlog -->
        <path d="M 230 106 L 230 135" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
        <rect x="155" y="135" width="135" height="130" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="222" y="152" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">✓ 是 (存在 XID)</text>
        <text x="165" y="172" font-size="8.5" fill="#14532d">• Binlog 已先落盘</text>
        <text x="165" y="188" font-size="8.5" fill="#14532d">• 从库可能已复制执行</text>
        <text x="165" y="204" font-size="8.5" fill="#14532d">• 主库必须推进提交</text>
        <rect x="165" y="215" width="115" height="26" rx="3" fill="#10b981"/>
        <text x="222" y="232" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">自动提交 Commit</text>
        <text x="222" y="255" font-size="8" fill="#166534" text-anchor="middle">消除主从不一致与幽灵</text>

        <!-- Bottom Summary -->
        <rect y="280" width="290" height="38" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="145" y="296" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">终极数学一致性保证：</text>
        <text x="145" y="310" font-size="8.5" fill="#2563eb" text-anchor="middle">Redo 物理恢复与 Binlog 复制绝对对齐！</text>
      </g>
    </g>
  </g>
</svg>
