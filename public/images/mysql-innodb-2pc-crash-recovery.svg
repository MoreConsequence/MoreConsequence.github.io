<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="pc-title pc-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="pc-title">MySQL 事务两阶段提交 (2PC) 与崩溃恢复裁决全景</title>
  <desc id="pc-desc">流程架构图展示 MySQL 2PC 两阶段提交正常执行链路以及在不同崩溃点下利用 Binlog 中 XID 对账决定事务继续提交或执行回滚的裁决逻辑。</desc>
  <defs>
    <marker id="pc-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="pc-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">TWO-PHASE COMMIT &amp; CRASH RECOVERY · 2PC XID ARBITRATION</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">MySQL 两阶段提交 (2PC) 与崩溃恢复裁决</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">Phase 1 (Redo Prepare 标 XID) ➔ Phase 2 (Binlog 物理落盘) ➔ 崩溃依据 Binlog 中有效 XID 决定提交或回滚</text>

  <!-- Top: 2PC Normal Execution Pipeline (y=136..240, h=104) -->
  <g transform="translate(40, 136)">
    <rect width="880" height="104" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="10" width="130" height="16" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="79" y="21" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">NORMAL 2PC PIPELINE</text>
    <text x="154" y="22" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">正常两阶段提交执行流 (Normal Two-Phase Commit Steps)</text>

    <!-- 3 Pipeline Stages (y=34..90) -->
    <g transform="translate(14, 34)">
      <!-- Step 1: Prepare (w=260) -->
      <rect x="0" y="0" width="260" height="56" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="130" y="22" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Step 1: InnoDB Prepare</text>
      <text x="130" y="38" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">Redo 标记 PREPARED (写入 XID=101)</text>
      <text x="130" y="49" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">引擎状态置为准备就绪</text>

      <!-- Step 2: Binlog (w=300) - Focal -->
      <rect x="278" y="0" width="300" height="56" rx="3" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
      <text x="428" y="22" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">Step 2: Server Write Binlog</text>
      <text x="428" y="38" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Binlog 写入物理落盘 (记录 XID=101)</text>
      <text x="428" y="49" fill="#e85d3f" font-size="6.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">两阶段提交的核心仲裁点 (Arbitration Line)</text>

      <!-- Step 3: Commit (w=274) -->
      <rect x="596" y="0" width="270" height="56" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="731" y="22" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Step 3: InnoDB Commit</text>
      <text x="731" y="38" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Redo 标记 COMMITTED ➔ 响应成功</text>
      <text x="731" y="49" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">释放行锁并完成事务</text>
    </g>
  </g>

  <!-- Bottom: 2 Crash Recovery Arbitration Scenarios (y=256..506, h=250) -->
  <g transform="translate(40, 256)">
    <!-- Scenario A: Before Binlog (x=0..420, w=420) -->
    <g transform="translate(0, 0)">
      <rect width="420" height="250" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
      <rect x="14" y="12" width="120" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="74" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CRASH POINT 1</text>
      <text x="144" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">在写 Binlog 前崩溃</text>

      <rect x="14" y="42" width="392" height="66" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="24" y="62" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">Redo: PREPARED / Binlog: 无 XID 记录</text>
      <text x="24" y="80" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">裁决结果: 执行回滚 (Undo Rollback)！</text>
      <text x="24" y="96" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Transaction Aborted</text>

      <text x="14" y="130" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">裁决物理机制与原因：</text>
      <text x="14" y="148" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• Binlog 中没有该事务的完整 XID 记录；</text>
      <text x="14" y="166" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 说明从库绝对没有同步该事务变更；</text>
      <text x="14" y="184" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 主库必须利用 Undo Log 彻底回滚，保证主从一致！</text>
      <line x1="14" y1="196" x2="406" y2="196" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
      <text x="14" y="216" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">杜绝幽灵事务，维护分布式副本单调性</text>
      <text x="14" y="232" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Safe Rollback Execution</text>
    </g>

    <!-- Scenario B: After Binlog (x=440..880, w=440) - Focal -->
    <g transform="translate(440, 0)">
      <rect width="440" height="250" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
      <rect x="14" y="12" width="120" height="18" rx="2" fill="#e85d3f"/>
      <text x="74" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">CRASH POINT 2</text>
      <text x="144" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">写完 Binlog 后崩溃</text>

      <rect x="14" y="42" width="412" height="66" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
      <text x="24" y="62" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">Redo: PREPARED / Binlog: 存在完整 XID=101</text>
      <text x="24" y="80" fill="#e85d3f" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">裁决结果: 继续提交 (InnoDB Commit)！</text>
      <text x="24" y="96" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Complete Prepared Transaction</text>

      <text x="14" y="130" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">裁决物理机制与原因：</text>
      <text x="14" y="148" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• Binlog 已经物理落盘，该事务已被发送给从库；</text>
      <text x="14" y="166" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 从库一定会回放该事务！</text>
      <text x="14" y="184" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 主库通过 XID 对账发现存在，必须补齐 Commit！</text>
      <line x1="14" y1="196" x2="426" y2="196" stroke="#e85d3f" stroke-width="0.6"/>
      <text x="14" y="216" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">主从复制与单机崩溃恢复实现 100% 绝对一致！</text>
      <text x="14" y="232" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Zero Master-Slave Divergence</text>
    </g>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">2PC 准备阶段与无 XID 回滚</text>
  <rect x="330" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="350" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Binlog 物理落盘与 XID 对账继续提交核心</text>
</svg>
