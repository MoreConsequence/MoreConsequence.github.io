<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">HTTP/2 传输层队头阻塞 (TCP HOL Blocking) 物理机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">单 TCP 连接复用 100 个 Stream ──► 单个 TCP 数据包丢包 ──► 内核强行阻塞全部 100 个 Stream 等待重传！</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: TCP HOL -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ HTTP/2 在偶发丢包下的全局冻结</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">单个 TCP 连接承载: Stream 1, Stream 3, Stream 5...</text>
          
          <text y="36" fill="#f87171">💥 Stream 1 的第 2 号 TCP 数据包在公网丢失！</text>
          
          <text y="60" fill="#ef4444">TCP 内核协议栈铁律：</text>
          <text y="76" fill="#ef4444">• 必须保证字节流绝对连续有序！</text>
          <text y="92" fill="#ef4444">• 即使 Stream 3/5 数据包已到达，也必须在内核缓冲区排队！</text>
          <text y="108" fill="#ef4444">• 导致全站所有请求同时陷入等待重传的停滞！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">弱网与移动网络恶果：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 丢包率 2% 时，HTTP/2 性能竟然劣于 HTTP/1.1；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 产生假死卡顿体验；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 倒逼 QUIC / HTTP/3 诞生！</text>
      </g>
    </g>

    <!-- Right: HTTP/3 QUIC -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ HTTP/3 (QUIC/UDP)：单流独立物理隔离</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">基于 UDP 实现的多路独立流控制</text>
          
          <text y="36" fill="#86efac">💥 Stream 1 发生丢包：</text>
          
          <text y="60" fill="#38bdf8">QUIC 协议栈机制：</text>
          <text y="76" fill="#34d399">1. 仅 Stream 1 单独等待丢包重传</text>
          <text y="92" fill="#34d399">2. Stream 3, 5, 7 零受阻，立即直接交付应用层！</text>
          <text y="108" fill="#4ade80">3. 彻底根除传输层队头阻塞（Zero HOL Blocking）！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 弱网与移动网络吞吐量提升 400%；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支持 0-RTT 极速握手与连接迁移；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 下一代互联网传输基石！</text>
      </g>
    </g>
  </g>
</svg>