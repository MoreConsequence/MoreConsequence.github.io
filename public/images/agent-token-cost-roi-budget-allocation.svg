<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 经济学：多级模型路由与成本 ROI 优化矩阵</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">全部无脑调用顶级旗舰模型 (单任务消耗 $2.5，经济上不可行) vs 分级级联路由 (轻量意图分类 + 中型工具调用 + 旗舰最终攻坚，成本暴降 85%)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Tier 1: 轻量路由 (Flash / Mini)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">成本: $0.05 / 1M Tokens (极低)</text>
          
          <text x="10" y="38" fill="#86efac">承担任务：</text>
          <text x="10" y="54" fill="#cbd5e1">• 用户意图识别与安全护栏审查</text>
          <text x="10" y="70" fill="#34d399">• 历史会话后台压缩摘要提炼</text>
          <text x="10" y="86" fill="#34d399">• 简单信息提取与格式转换</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 承载 60% 基础杂务流量！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 极速响应，延迟 &lt; 300ms；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 极大保护核心大模型额度预算；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 成本过滤器。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Tier 2: 中坚工具 (Sonnet / GPT-4o)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">成本: $3.0 / 1M Tokens (中等)</text>
          
          <text x="10" y="38" fill="#86efac">承担任务：</text>
          <text x="10" y="54" fill="#38bdf8">• 绝大多数多步骤 Tool Calling 调度</text>
          <text x="10" y="70" fill="#34d399">• 代码编写、测试用例生成与单测回归</text>
          <text x="10" y="86" fill="#4ade80">• 复杂业务逻辑解析与 JSON 结构化输出</text>
          
          <text x="10" y="114" fill="#4ade80">✓ Agent 任务日常主力军 (35%)！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 兼具强大逻辑推理与合理经济成本；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 工业级 Agent 最完美的平衡点；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 业务中流砥柱。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Tier 3: 旗舰推理 (Opus / o1 / R1)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">成本: $15.0 / 1M Tokens (高价值)</text>
          
          <text x="10" y="38" fill="#fed7aa">承担任务：</text>
          <text x="10" y="54" fill="#38bdf8">• 复杂架构重构规划与数学证明</text>
          <text x="10" y="70" fill="#fb923c">• 遇到多次 Tool 报错后的最终自愈攻坚</text>
          <text x="10" y="86" fill="#4ade80">• 关键安全审计与高风险操作裁决</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 仅在关键 5% 瓶颈处精准出鞘！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 将旗舰算力用在刀刃上；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 实现整体任务成功率 99% + 成本降 85%；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 商业化 Agent 必胜法宝！</text>
      </g>
    </g>
  </g>
</svg>