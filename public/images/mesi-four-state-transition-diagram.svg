<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">CPU 缓存一致性 MESI 四态跃迁模型 (Cache Coherence)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Modified (已修改/脏行) ｜ Exclusive (独占/与内存一致) ｜ Shared (多核共享只读) ｜ Invalid (已失效/必须重新从总线嗅探或读内存)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fef2f2"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. Modified (M: 已修改)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#f87171">独占且脏数据：</text>
          
          <text x="8" y="38" fill="#fca5a5">• 仅当前核心 Cache 拥有最新数据</text>
          <text x="8" y="62" fill="#fca5a5">• 主内存数据已过时！</text>
          <text x="8" y="86" fill="#38bdf8">• 其他核请求时必须窥探写回内存</text>
          
          <text x="8" y="116" fill="#4ade80">✓ 单核私有极速写！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#991b1b">跃迁路径：</text>
        <text x="8" y="34" font-size="7.5" fill="#7f1d1d">• 本地读写: 保持 M 状态；</text>
        <text x="8" y="48" font-size="7.5" fill="#7f1d1d">• 他核读请求: 窥探写回 ──► 降级 S；</text>
        <text x="8" y="62" font-size="7.5" fill="#dc2626">• 他核写请求: 窥探写回 ──► 降级 I。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. Exclusive (E: 独占洁净)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">独占且与内存一致：</text>
          
          <text x="8" y="38" fill="#86efac">• 仅当前核心拥有该缓存行</text>
          <text x="8" y="62" fill="#86efac">• 数据与主内存完全一致</text>
          <text x="8" y="86" fill="#34d399">• 本地写入可瞬间升级为 M (0 广播)</text>
          
          <text x="8" y="116" fill="#4ade80">✓ 写入零总线开销！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">跃迁路径：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• 本地写: 瞬间跃迁为 M (0 锁)；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 他核读请求: 降级为 S 共享；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 打造极速单线程性能。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. Shared (S: 多核共享)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">多核只读共享：</text>
          
          <text x="8" y="38" fill="#86efac">• 多个 CPU 核心同时缓存该行</text>
          <text x="8" y="62" fill="#86efac">• 数据与主内存一致</text>
          <text x="8" y="86" fill="#f87171">• 若任一核尝试写入，必须向总线广播 Invalidate 消息！</text>
          
          <text x="8" y="116" fill="#4ade80">✓ 多核并发只读 0 冲突！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">跃迁路径：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• 本地写: 广播失效 ──► 升级 M；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• 收到他核写广播: 强制降级 I；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 维持全局一致性。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. Invalid (I: 已失效)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">缓存行已作废：</text>
          
          <text x="8" y="38" fill="#e9d5ff">• 内部数据已被其他核心修改作废</text>
          <text x="8" y="62" fill="#f87171">• 当前核无法直接读取该行数据！</text>
          <text x="8" y="86" fill="#38bdf8">• 必须向总线发起 Read 请求重新拉取最新数据</text>
          
          <text x="8" y="116" fill="#ef4444">🔴 触发 Cache Miss 延迟！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">跃迁路径：</text>
        <text x="8" y="34" font-size="7.5" fill="#6b21a8">• 本地读: 总线重新拉取 ──► S/E；</text>
        <text x="8" y="48" font-size="7.5" fill="#6b21a8">• 本地写: 总线拉取并独占 ──► M；</text>
        <text x="8" y="62" font-size="7.5" fill="#6b21a8">• 硬件物理铁律。</text>
      </g>
    </g>
  </g>
</svg>