<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="kv-cache-fp16-int8-fp8-quantization-compression-title kv-cache-fp16-int8-fp8-quantization-compression-desc"><title id="kv-cache-fp16-int8-fp8-quantization-compression-title">KV Cache 量化压缩演进：FP16、INT8 到 FP8 显存节省与精度保持</title><desc id="kv-cache-fp16-int8-fp8-quantization-compression-desc">KV Cache 量化压缩演进：FP16、INT8 到 FP8 显存节省与精度保持</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">KV Cache 量化压缩演进：FP16 vs INT8 vs FP8 (E4M3/E5M2)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">FP16 (2 字节/元素，显存吞噬大户) ──► INT8 (1 字节/元素，需动态缩放因子) ──► FP8 (硬件级原生支持，显存直降 50% 且精度 0 损失)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 标准 FP16 (2 Bytes/Elem)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// Llama-3-70B 单 Token 显存公式</text>
          <text x="10" y="34" fill="#f5f5f5">Size = 2 * n_layers * n_kv_heads * d_head * 2</text>
          <text x="10" y="50" fill="#f5f5f5">Size = 2 * 80 * 8 * 128 * 2 = 327.68 KB</text>

          <text x="10" y="74" fill="#f5f5f5">100 个 4k 上下文请求:</text>
          <text x="10" y="90" fill="#f5f5f5">消耗 131 GB 显存！直接撑爆 80GB A100！</text>

          <text x="10" y="112" fill="#cbd5e1">• 精度完美无损，但显存开销沉重。</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 传统默认基准精度；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 内存带宽受限（Memory-Bound）；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 亟需轻量化压缩。</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. INT8 量化 (1 Byte/Elem)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 线性缩放映射: x_q = round(x / scale)</text>
          <text x="10" y="34" fill="#f5f5f5">• 显存占用直接砍半: 163.84 KB / Token</text>

          <text x="10" y="58" fill="#f5f5f5">⚠️ 精度挑战:</text>
          <text x="10" y="74" fill="#f5f5f5">• 存在 Outlier 离群极大值点时，</text>
          <text x="10" y="90" fill="#f5f5f5">  线性量化导致正常小数值精度严重失真！</text>
          <text x="10" y="108" fill="#f5f5f5">✓ 需按 Head/Channel 分块独立缩放补偿。</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 广泛兼容旧架构 GPU (T4 / V100 / A100)；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 需额外的反量化算子计算开销；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 显存与精度的经典折中方案。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. FP8 原生量化 (Ada/Hopper 架构)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// E4M3 (1位符号+4位指数+3位尾数)</text>
          <text x="10" y="34" fill="#f5f5f5">• 指数位天然提供超大动态范围</text>
          <text x="10" y="50" fill="#f5f5f5">• 完美容纳 Attention 离群异常值！</text>
          <text x="10" y="68" fill="#f5f5f5">• H100 Tensor Core 硬件级原生直算！</text>

          <text x="10" y="92" fill="#f5f5f5">✓ 显存节省 50%，吞吐提升 2.1x！</text>
          <text x="10" y="108" fill="#f5f5f5">✓ MMLU 评测精度损失 &lt; 0.1% (近乎 0 损)！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 现代大模型推理加速绝对主流标准；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 让单卡承载并发量直接翻倍；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级 AI 基建降本增效核心利刃！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
