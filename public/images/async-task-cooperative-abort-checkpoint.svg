<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">副作用安全熔断：协作式中止检查点与事务逆向回滚 (Compensating Saga)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">检查 signal.throwIfAborted() ──► 拦截未生效外部调用 ──► 若不可逆操作已发出则启动补偿事务恢复数据一致性</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 检查点 1：本地只读预检 (Local Read-Only Pre-flight Check)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">signal.throwIfAborted() ──► 校验入参并准备资源 ──► 0 外部副作用</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">若收到中止信号直接抛出 AbortError，极速退出且 0 资源浪费！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 检查点 2：可逆准备阶段 (Reversible Preparation Stage)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">申请临时工作区 /tmp/build-123 ──► signal.throwIfAborted() ──► 若中止则自动触发 rm -rf 清理</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">严格绑定 RAII / using 资源自动释放守卫！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 临界区：不可逆写操作 (Critical Effect Execution)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">执行银行转账 / 发送外部 Webhook ──► 此时严禁强制 kill 进程！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">必须等待网络包确认收到或超时，明确获取操作的确定性结果！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 逆向补偿与最终一致性收敛 (Compensating SAGA Rollback)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">若后续步骤中止，执行对应逆向动作: Refund() / RevokeToken() ──► 恢复系统全局稳态</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">打造工业级 Agent 在面对用户狂按 Stop 时的绝对数据一致性！</text>
      </g>
    </g>
  </g>
</svg>