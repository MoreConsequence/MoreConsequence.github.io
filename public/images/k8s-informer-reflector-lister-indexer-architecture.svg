<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="k8s-informer-reflector-lister-indexer-architecture-title k8s-informer-reflector-lister-indexer-architecture-desc"><title id="k8s-informer-reflector-lister-indexer-architecture-title">Kubernetes client-go Informer 核心架构：Reflector (List-Watch)…</title><desc id="k8s-informer-reflector-lister-indexer-architecture-desc">Kubernetes client-go Informer 核心架构：Reflector (List-Watch), DeltaFIFO, Indexer 与 WorkQueue</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Kubernetes client-go Informer 底层核心工作流水线</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">API Server (etcd) ──► Reflector (List-Watch) ──► DeltaFIFO ──► Indexer (本地只读内存缓存) ──► WorkQueue ──► Controller Reconcile()</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. Reflector 建立 List-Watch 长连接 (Reflector: List + Watch HTTP/2 Stream)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">首次启动 List 获取全量资源快照 ──► 随后建立 Watch 长连接基于 resourceVersion 增量接收事件流</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">0 轮询开销，毫秒级感知集群资源变更！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. DeltaFIFO 增量事件缓冲队列 (DeltaFIFO Buffering &amp; Deduplication)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">将 Added, Updated, Deleted 事件压入 DeltaFIFO ──► 自动对同一对象的连续更新执行合并去重</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">保障事件传递的严格保序与防洪峰缓冲！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. Indexer 本地线程安全内存缓存 (Indexer / Lister Cache)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">从 DeltaFIFO 弹出对象更新 Indexer ──► 控制器所有只读查询 100% 命中本地 Indexer 内存！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">彻底保护 API Server 与 etcd 不被成千上万个控制器查爆！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. WorkQueue 与 Reconcile 调谐循环 (WorkQueue &amp; Reconciler)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">ResourceEventHandler 将 "namespace/name" 压入 WorkQueue ──► 触发 Reconcile() 对齐实际状态与期望状态！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">Kubernetes 声明式自愈控制平面的核心发动机！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
