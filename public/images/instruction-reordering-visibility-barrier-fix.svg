<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">CPU 乱序执行与可见性修复：从裸标志位到 sync/atomic</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">裸变量自旋 (编译器重排与 CPU Store Buffer 延迟导致幽灵 Bug) vs atomic.Store / Load (硬件内存屏障，强制冲刷全局可见)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Race Bug -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 裸变量自旋检测：指令重排与不可见陷阱</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">var ready bool; var config *Config</text>
          
          <text y="36" fill="#ef4444">协程 A 初始化 ｜ 协程 B 轮询：</text>
          <text y="50" fill="#fca5a5">1. 协程 A: config = init(); ready = true</text>
          <text y="64" fill="#ef4444">2. CPU 乱序优化将 ready = true 提前写入 Store Buffer！</text>
          <text y="78" fill="#ef4444">3. 协程 B 观察到 ready == true ──► 立即读取 config.Data</text>
          <text y="92" fill="#f87171">4. 此时 config 指针实际尚未写入内存！</text>
          
          <text y="114" fill="#ef4444">💥 触发致命 panic: runtime error: invalid memory address</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 本地单核无法复现，上线多核服务器偶发崩溃；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 经典的无锁并发反模式；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须使用标准同步原语！</text>
      </g>
    </g>

    <!-- Right: Atomic Fix -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ atomic.Pointer / sync.Once：内存屏障保障</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">var cfgHolder atomic.Pointer[Config]</text>
          
          <text y="36" fill="#86efac">安全原子发布：</text>
          <text y="50" fill="#38bdf8">1. c := init() // 完全构建好对象</text>
          <text y="64" fill="#34d399">2. cfgHolder.Store(c) // 硬件释放屏障 (Release Barrier)</text>
          <text y="78" fill="#34d399">3. 消费端: cfg := cfgHolder.Load() // 获取屏障 (Acquire)</text>
          
          <text y="106" fill="#4ade80">✓ 保证读到非空指针时，结构体内部所有字段 100% 完整！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 兼具无锁极速并发与绝对内存安全；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 动态热更新配置中心（如 Viper）标准实现方案；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级高性能并发典范！</text>
      </g>
    </g>
  </g>
</svg>