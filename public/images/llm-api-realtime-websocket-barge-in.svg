<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">OpenAI Realtime API 双向全双工长连接与打断（Barge-in）时序</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">24kHz PCM 音频并发流送 ──► 客户端随时开嗓插话 ──► conversation.item.truncate 毫秒级刹车与记忆时间轴裁剪</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Actors Header (Client vs Server) -->
    <g transform="translate(60, 20)">
      <rect width="260" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="130" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">📱 客户端 (Browser / App Audio Client)</text>

      <rect x="520" width="260" height="30" rx="4" fill="#f0fdf4" stroke="#86efac"/>
      <text x="650" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">⚡ 服务端 Realtime Engine (GPU VAD &amp; Decoder)</text>
    </g>

    <!-- Lifelines -->
    <line x1="190" y1="55" x2="190" y2="360" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="710" y1="55" x2="710" y2="360" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- WebSocket Message Flow -->
    <g transform="translate(190, 70)">
      <!-- 1. Handshake & Session Update -->
      <g>
        <line x1="0" y1="0" x2="520" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <rect x="160" y="-14" width="200" height="24" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="260" y="2" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e40af" text-anchor="middle">session.update (配置 VAD 与模型)</text>
      </g>

      <!-- 2. Stream Audio Input -->
      <g transform="translate(0, 35)">
        <line x1="0" y1="0" x2="520" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <rect x="150" y="-14" width="220" height="24" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="260" y="2" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e40af" text-anchor="middle">input_audio_buffer.append (PCM16 24kHz)</text>
      </g>

      <!-- 3. Server Audio Output -->
      <g transform="translate(0, 75)">
        <line x1="520" y1="0" x2="0" y2="0" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
        <rect x="140" y="-14" width="240" height="24" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
        <text x="260" y="2" font-family="ui-monospace, monospace" font-size="8.5" fill="#166534" text-anchor="middle">response.audio.delta (AI 正在语音播报...)</text>
      </g>

      <!-- 4. Barge-in Event (Red Flag) -->
      <g transform="translate(0, 120)">
        <!-- Interrupt Action on Client -->
        <rect x="-140" y="-10" width="130" height="40" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="-75" y="6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">🔴 用户突然开嗓打断！</text>
        <text x="-75" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#7f1d1d" text-anchor="middle">扬声器播报到 1240ms</text>

        <!-- Truncate Message -->
        <line x1="0" y1="10" x2="520" y2="10" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
        <rect x="110" y="-4" width="300" height="24" rx="3" fill="#fee2e2" stroke="#f87171"/>
        <text x="260" y="12" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">conversation.item.truncate (audio_end_ms: 1240)</text>
      </g>

      <!-- 5. Response Cancel -->
      <g transform="translate(0, 165)">
        <line x1="0" y1="0" x2="520" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
        <rect x="180" y="-14" width="160" height="24" rx="3" fill="#ffffff" stroke="#fca5a5"/>
        <text x="260" y="2" font-family="ui-monospace, monospace" font-size="8.5" fill="#991b1b" text-anchor="middle">response.cancel (刹车信号)</text>
      </g>

      <!-- 6. Server Ack and Context Truncation -->
      <g transform="translate(0, 205)">
        <!-- Server Truncation Box -->
        <rect x="530" y="-12" width="170" height="42" rx="4" fill="#fff7ed" stroke="#f97316"/>
        <text x="615" y="6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#9a3412" text-anchor="middle">服务端瞬间中断 GPU 解码</text>
        <text x="615" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#c2410c" text-anchor="middle">裁剪历史记忆至 1240ms 处</text>

        <line x1="520" y1="10" x2="0" y2="10" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
        <rect x="160" y="-4" width="200" height="24" rx="3" fill="#ffffff" stroke="#fed7aa"/>
        <text x="260" y="12" font-family="ui-monospace, monospace" font-size="8.5" fill="#9a3412" text-anchor="middle">response.cancelled (确认停止)</text>
      </g>

      <!-- 7. New Audio Input Stream -->
      <g transform="translate(0, 250)">
        <line x1="0" y1="0" x2="520" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <rect x="140" y="-14" width="240" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="260" y="2" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#1e40af" text-anchor="middle">input_audio_buffer.append (新用户语音输入...)</text>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 335)">
      <rect width="860" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="430" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">全双工协议核心精髓：</tspan> 打断不仅是“让扬声器闭嘴”，更关键是通过 <tspan font-weight="700" fill="#2563eb">`conversation.item.truncate` 精确裁剪服务端上下文记忆时间轴</tspan>，防止大模型产生认知幻觉！
      </text>
    </g>
  </g>
</svg>
