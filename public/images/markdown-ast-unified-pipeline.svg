<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="markdown-ast-unified-pipeline-title markdown-ast-unified-pipeline-desc"><title id="markdown-ast-unified-pipeline-title">统一 Markdown AST 编译流水线：Remark (mdast) -&gt; Rehype (hast) -&gt;…</title><desc id="markdown-ast-unified-pipeline-desc">统一 Markdown AST 编译流水线：Remark (mdast) -&gt; Rehype (hast) -&gt; React 静态导出</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">现代 Markdown 静态博客统一 AST 编译流水线 (Unified AST Pipeline)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Raw Markdown ──► Remark (mdast: GFM / Math) ──► remark-rehype (hast) ──► Rehype (Shiki 代码高亮 / 图片路径规范化) ──► React / HTML</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. Markdown 源码解析与 MDAST 构建 (Remark Phase: mdast)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">gray-matter 提取 Frontmatter 元数据 ──► remark-parse 解析 Markdown ──► remark-gfm 表格与任务列表</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">构建语法树抽象表示 (MDAST)！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 抽象语法树跨域桥接 (Bridge: remark-rehype)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">将 Markdown 语法树 (mdast) 映射转换为 HTML 语法树 (hast) ──► 保持结构纯净</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">完成从 Markdown 语义向 Web DOM 语义的优雅跨越！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. HAST 插件化转换与富媒体增强 (Rehype Phase: hast)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">rehype-slug 自动注入锚点 ──► Shiki 极速服务端代码着色 ──► 自定义 rehypeNormalizeImagePaths 修复 3 级相对路径</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">兼顾本地 Markdown 实时预览与 Next.js 静态站点无缝渲染！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. Next.js 静态生成与增量打包 (SSG HTML &amp; Fast Search Index)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">generateStaticParams 全量构建 ──► 输出 0 JS 纯净极速 HTML 页面 ──► 生成 search-index.json 客户端秒级检索！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">打造现代技术出版物级别的顶级工程博客！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
