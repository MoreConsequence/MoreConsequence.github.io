<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">现代 Markdown 静态博客统一 AST 编译流水线 (Unified AST Pipeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Raw Markdown ──► Remark (mdast: GFM / Math) ──► remark-rehype (hast) ──► Rehype (Shiki 代码高亮 / 图片路径规范化) ──► React / HTML</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Markdown 源码解析与 MDAST 构建 (Remark Phase: mdast)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">gray-matter 提取 Frontmatter 元数据 ──► remark-parse 解析 Markdown ──► remark-gfm 表格与任务列表</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">构建语法树抽象表示 (MDAST)！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 抽象语法树跨域桥接 (Bridge: remark-rehype)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">将 Markdown 语法树 (mdast) 映射转换为 HTML 语法树 (hast) ──► 保持结构纯净</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">完成从 Markdown 语义向 Web DOM 语义的优雅跨越！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. HAST 插件化转换与富媒体增强 (Rehype Phase: hast)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">rehype-slug 自动注入锚点 ──► Shiki 极速服务端代码着色 ──► 自定义 rehypeNormalizeImagePaths 修复 3 级相对路径</text>
        <text x="15" y="62" font-size="8" fill="#047857">兼顾本地 Markdown 实时预览与 Next.js 静态站点无缝渲染！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. Next.js 静态生成与增量打包 (SSG HTML &amp; Fast Search Index)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">generateStaticParams 全量构建 ──► 输出 0 JS 纯净极速 HTML 页面 ──► 生成 search-index.json 客户端秒级检索！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">打造现代技术出版物级别的顶级工程博客！</text>
      </g>
    </g>
  </g>
</svg>