<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Channel 底层 struct hchan 数据结构全景解剖</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">lock (保护所有字段的互斥锁) ｜ buf (环形数组: qcount, dataqsiz, sendx, recvx) ｜ recvq / sendq (sudog 双向阻塞等待链表)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 环形缓冲区 (Circular Buffer)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">buf unsafe.Pointer // 连续内存数组</text>
          
          <text x="10" y="38" fill="#86efac">• qcount: 当前存储的元素总数</text>
          <text x="10" y="54" fill="#86efac">• dataqsiz: 缓冲区容量 cap(ch)</text>
          <text x="10" y="70" fill="#34d399">• sendx: 下一个写入槽位游标</text>
          <text x="10" y="86" fill="#34d399">• recvx: 下一个读取槽位游标</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 环形复用，0 额外内存重分配！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 经典环形 FIFO 队列；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 读写指针单调前进并在末尾取模绕回；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高性能缓冲槽。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 双向阻塞队列 (waitq)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">recvq / sendq waitq // sudog 链表</text>
          
          <text x="10" y="40" fill="#fed7aa">当 Channel 满发送或空读取时：</text>
          <text x="10" y="56" fill="#cbd5e1">1. 当前 G 封装为 struct sudog 节点</text>
          <text x="10" y="72" fill="#cbd5e1">2. 挂入 recvq 或 sendq 链表尾部</text>
          <text x="10" y="88" fill="#34d399">3. 调用 gopark() 将 Goroutine 沉睡挂起</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 0 CPU 盲目轮询自旋！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">调度联动：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 与 GMP 调度器深度融合；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 挂起后主动让出线程 P 执行其他 G；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• Go 协程并发灵魂。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 零拷贝直传优化 (Direct Copy)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">当 recvq 中有正在等待的读 G 时：</text>
          
          <text x="10" y="42" fill="#86efac">发送端写入优化：</text>
          <text x="10" y="58" fill="#38bdf8">• 绕过 buf 环形缓冲区！</text>
          <text x="10" y="74" fill="#34d399">• runtime 直接将数据从发送 G 的栈内存</text>
          <text x="10" y="90" fill="#34d399">  跨协程 memmove 拷贝到接收 G 的栈上！</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 单次内存拷贝直接完成交付！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 消除无缓冲通道的二次内存复制开销；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 配合 goready() 瞬间唤醒接收端；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化通信并发极简工程！</text>
      </g>
    </g>
  </g>
</svg>