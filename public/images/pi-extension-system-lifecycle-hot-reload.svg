<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 扩展插件系统：生命周期事件流与 /reload 毫秒级热重载</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">onTurnStart ──► beforeLLM ──► beforeTool ──► afterTool ──► onTurnEnd ｜ /reload 动态清空模块缓存并重新挂载插件</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 进程内生命周期钩子链条 (In-Process Lifecycle Hooks)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">api.on('before_tool_call', fn) ──► 支持修改入参、动态注入环境变量、甚至抛错拦截执行</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">纯函数式洋葱模型，以极简 API 赋予扩展插件控制整个执行流的强大能力！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. Agent 自编写扩展与自我进化 (Self-Modification Loop)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Agent 调用 write 工具在 .pi/extensions/ 编写新插件 ──► 自动扩展自身从未具备的新功能</text>
        <text x="15" y="62" font-size="8" fill="#047857">打破固化工具集束缚，实现真正意义上的智能体自主工具构建与自我进化！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. /reload 模块缓存物理清理与热重载 (Hot-Reload Mechanism)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">delete require.cache[path] ──► 触发旧插件 dispose() ──► 动态 import() 重新装配生效！</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">重载耗时仅 10 毫秒，且完整保留已有会话历史与上下文树，0 重启主进程！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 权限隔离与安全沙箱门禁 (Extension Security Gate)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">限制第三方不可信插件仅能访问只读 API ──► 危险宿主调用需显式申请权限令牌</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">兼顾极致灵活的扩展性与企业级生产安全合规底线！</text>
      </g>
    </g>
  </g>
</svg>