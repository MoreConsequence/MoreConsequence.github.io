<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="pi-extension-system-lifecycle-hot-reload-title pi-extension-system-lifecycle-hot-reload-desc"><title id="pi-extension-system-lifecycle-hot-reload-title">进程内扩展架构（In-Process）与 5 组全生命周期事件总线</title><desc id="pi-extension-system-lifecycle-hot-reload-desc">架构对比图展示进程外 RPC 插件的高开销与干预局限，对比 Pi 进程内原生 TypeScript 扩展架构在零开销内存调用、5 组生命周期事件总线与深度 TUI 交互方面的核心优势。</desc>
  <defs>
    <marker id="ex-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="ex-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">IN-PROCESS EXTENSION ARCHITECTURE · LIFECYCLE EVENT BUS</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">进程内原生扩展与生命周期事件总线</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">进程外 RPC 局限 vs 进程内 TypeScript 共享堆 (零开销/5 组生命周期事件流/TUI 菜单直接唤起)</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="79" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">OUT-OF-PROCESS</text>
    <text x="154" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">进程外 RPC 模式 (MCP / IPC)</text>

    
    <rect x="14" y="42" width="392" height="74" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">独立子进程 + JSON-RPC 管道通信</text>
    <text x="24" y="82" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 通信开销: 毫秒级进程间序列化与管道 IO</text>
    <text x="24" y="100" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 仅能被动提供工具，无法深度干预生命周期</text>

    
    <rect x="14" y="126" width="392" height="120" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">主要局限：</text>
    <text x="24" y="168" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 无法拦截 Turn 循环或动态改写 Prompt；</text>
    <text x="24" y="186" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 难以无缝嵌入终端 TUI 原生交互组件；</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 插件自修改与重启极其繁重复杂。</text>
    <text x="24" y="224" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Limited Observability &amp; High IPC Latency</text>

    
    <rect x="14" y="256" width="392" height="104" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="278" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">适用场景</text>
    <text x="24" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">跨多语言（Python/Rust）外部工具集成、企业级不可信远程微服务沙箱调用。</text>
    <text x="24" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Good for Cross-Language Tools</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Heavier Process Footprint</text>
  </g>

  
  <g transform="translate(480, 136)">
    <rect width="440" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="140" height="18" rx="2" fill="#eb6c36" />
    <text x="84" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">IN-PROCESS</text>
    <text x="164" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Pi 进程内原生扩展 (Native)</text>

    
    <rect x="14" y="42" width="412" height="74" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">同进程内存共享 + 5 组生命周期事件总线</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• session_start / before_turn / tool_call / tool_result</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 零通信开销: 原生 TypeScript 函数调用 (0 延迟)</text>

    
    <rect x="14" y="126" width="412" height="120" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">极致干预与自省能力：</text>
    <text x="24" y="168" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 深度拦截：修改 Prompt、拦截重写危险工具入参；</text>
    <text x="24" y="186" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">2. 原生 TUI 交互：直接调用 ctx.ui.select 弹出确认菜单；</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 自修改闭环：Agent 自己改代码，一条 /reload 毫秒热载！</text>
    <text x="24" y="224" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Deep Lifecycle Interception &amp; Instant Hot-Reload</text>

    
    <rect x="14" y="256" width="412" height="104" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="278" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">工业级评价</text>
    <text x="24" y="298" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">为个人开发者与单机 Agent 提供无与伦比的自省与自进化能力，开发心智极其轻巧。</text>
    <text x="24" y="322" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Zero-Overhead In-Process Native Extension</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Self-Evolving Agent Framework Design</text>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">进程外 RPC 插件模式与局限</text>
  <rect x="370" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="390" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Pi 进程内原生扩展与 5 组生命周期事件总线核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
