<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">PostgreSQL 表膨胀 (Bloat)、Autovacuum 与 XID 冻结机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">死元组 (Dead Tuples) 空间浪费 ｜ Free Space Map (FSM) 空间重用 ｜ 20亿 XID 回卷与全表只读保护</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Panes (285px each) -->
    <!-- Col 1: Dead Tuples -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. MVCC 死元组膨胀 (Bloat)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// PG 的 UPDATE = DELETE + INSERT</text>
          <text x="10" y="34" fill="#fca5a5">1. 更新一行：旧行被标记为 Dead Tuple</text>
          <text x="10" y="48" fill="#fca5a5">2. 新行作为全新 Tuple 写入页尾部</text>
          <text x="10" y="62" fill="#fca5a5">3. 旧行物理空间不会立刻释放给操作系统！</text>
          <text x="10" y="82" fill="#fbbf24">► 高频 UPDATE 导致 Dead Tuples 占 40%+</text>
          <text x="10" y="98" fill="#f87171">► 扫描 100 行真实数据需读 1000 个物理页！</text>
          <text x="10" y="118" fill="#94a3b8">产生巨大空间与 Buffer 缓存浪费</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">膨胀危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 顺序扫描 (Seq Scan) 耗时成倍放大；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 索引树同样膨胀，B-Tree 高度加深；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 内存缓存命中率急剧恶化。</text>
      </g>
    </g>

    <!-- Col 2: Autovacuum -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Autovacuum 清理机制</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#34d399">// 后台自动清理守护进程</text>
          <text x="10" y="34" fill="#86efac">1. 扫描页面，将 Dead Tuples 空间回收</text>
          <text x="10" y="48" fill="#86efac">2. 登记到 Free Space Map (FSM)</text>
          <text x="10" y="62" fill="#86efac">3. 供后续 INSERT 重新复用该空闲空间</text>
          <text x="10" y="82" fill="#38bdf8">✓ 阻止表体积继续无底线膨胀</text>
          <text x="10" y="102" fill="#fbbf24">⚠️ 注意：标准 VACUUM 不会归还磁盘给 OS</text>
          <text x="10" y="118" fill="#94a3b8">只有 VACUUM FULL 或 pg_repack 才会缩容</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">调优关键参数：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• autovacuum_vacuum_scale_factor = 0.05</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• autovacuum_vacuum_cost_limit = 2000</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 避免默认配置过于保守导致清理赶不上写入！</text>
      </g>
    </g>

    <!-- Col 3: XID Freeze -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#faf5ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">3. 事务 ID (XID) 冻结风暴</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#c084fc">// 32位 XID 回卷 (Wraparound 危机)</text>
          <text x="10" y="34" fill="#f8fafc">1. 32位 XID 上限 42 亿，20 亿产生回卷</text>
          <text x="10" y="48" fill="#fca5a5">2. 若旧行 XID 被判定为"未来"，数据瞬间隐形！</text>
          <text x="10" y="68" fill="#38bdf8">3. Freeze 机制：将老旧行打上 FrozenXID 标记</text>
          <text x="10" y="88" fill="#f87171">🔴 当 XID 差值达到 2 亿且未冻结时：</text>
          <text x="10" y="104" fill="#ef4444">触发 Emergency Autovacuum (全库强制只读！)</text>
          <text x="10" y="120" fill="#dc2626">业务所有写操作全部被拒绝！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">监控铁律：</text>
        <text x="10" y="34" font-size="7.5" fill="#6b21a8">• 严密监控 age(datfrozenxid) 告警水位</text>
        <text x="10" y="48" font-size="7.5" fill="#6b21a8">• 杜绝未提交的长事务阻止 XID 推进</text>
        <text x="10" y="62" font-size="7.5" fill="#9333ea">• 确保 autovacuum 具备足够的 IO 预算！</text>
      </g>
    </g>
  </g>
</svg>