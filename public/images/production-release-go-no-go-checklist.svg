<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">生产发布 Go / No-Go 四重门禁防御检查模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 数据库 Schema 前向后向双向兼容 ──► 2. 一键秒级可执行回滚预案 ──► 3. 动态功能特性降级开关就绪 ──► 4. 监控告警大盘与 On-Call 在线</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Gate 1: 数据库 Schema 迁移双向兼容性 (Database Migration Invariant)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">检查 DDL 是否锁表、是否仅添加可空列 ──► 确保老版本代码在读取新 Schema 时绝对正常运行</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">彻底保证无论何时回滚代码都不会因为数据库表结构变化而崩溃！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. Gate 2: 一键秒级可执行回滚预案 (Tested 1-Click Rollback Plan)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">提供确切的上一版本镜像 Tag 与回滚命令 ──► 在预发演练过回滚流程 ──► 杜绝发布失败时现场手忙脚乱编写回滚脚本</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">没有成熟回滚预案的发布一律判定为 No-Go！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. Gate 3: 动态业务特性开关与降级保护 (Feature Flags &amp; Fallback Ready)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">核心重大新功能必须使用 LaunchDarkly / 自研配置中心包裹 ──► 线上突发异常可在 1 秒内配置置为 false 优雅关闭</text>
        <text x="15" y="62" font-size="8" fill="#047857">用业务开关将重大系统故障化解为无感静默降级！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. Gate 4: 监控观测看板与应急值班在线 (Observability Dashboard &amp; On-Call)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">发布窗口期开启专用变更大盘 ──► 核心负责工程师与 SRE 必须在群内实时待命 ──► 观察 30 分钟无异常方可宣布发布成功！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">严苛工业级生产运维的最高敬畏之心！</text>
      </g>
    </g>
  </g>
</svg>