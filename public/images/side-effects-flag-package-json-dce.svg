<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="side-effects-flag-package-json-dce-title side-effects-flag-package-json-dce-desc"><title id="side-effects-flag-package-json-dce-title">package.json sideEffects 声明对 Webpack/Rollup 模块剔除的影响</title><desc id="side-effects-flag-package-json-dce-desc">package.json sideEffects 声明对 Webpack/Rollup 模块剔除的影响</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">副作用声明魔法：package.json 中的 sideEffects 标志位</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">未声明 sideEffects: 打包器因畏惧顶层副作用 (如修改 window) 不敢剔除 ｜ 声明 "sideEffects": false: 授权打包器无死角剪枝</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 打包器的保守原则：安全重于剪枝 (Safety First Principle)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">即使一个模块导出的函数没人使用，若其内部包含 window.pollyfill = ... 顶层执行代码</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">打包器为了保证程序运行正确性，绝不敢擅自删除该模块！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 声明式授权：sideEffects: false (Explicit No-Side-Effects Guarantee)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">在 package.json 中显式声明: "sideEffects": false ──► 向 Webpack/Rollup 承诺本包纯粹无黑魔法</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">打包器获得最高授权，只要导出未被直接引用，立即整文件彻底抹除！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 常见暗坑：误杀 CSS 样式文件 (Accidental CSS Pruning Trap)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">import './style.css' 属于典型的纯副作用导入！若配置了 false，CSS 会被直接摇掉！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">必须配置: "sideEffects": ["*.css", "*.scss"] 进行白名单保护！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">4. 工业级组件库发包规范 (Publishing Standard)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">纯函数化无副作用设计 + 精确 sideEffects 白名单 ──► 打造被全球开发者热爱的极简依赖库！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">现代开源工程的顶尖素养！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
