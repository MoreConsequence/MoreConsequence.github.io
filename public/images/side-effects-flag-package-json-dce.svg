<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">副作用声明魔法：package.json 中的 sideEffects 标志位</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">未声明 sideEffects: 打包器因畏惧顶层副作用 (如修改 window) 不敢剔除 ｜ 声明 "sideEffects": false: 授权打包器无死角剪枝</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 打包器的保守原则：安全重于剪枝 (Safety First Principle)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">即使一个模块导出的函数没人使用，若其内部包含 window.pollyfill = ... 顶层执行代码</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">打包器为了保证程序运行正确性，绝不敢擅自删除该模块！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 声明式授权：sideEffects: false (Explicit No-Side-Effects Guarantee)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">在 package.json 中显式声明: "sideEffects": false ──► 向 Webpack/Rollup 承诺本包纯粹无黑魔法</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">打包器获得最高授权，只要导出未被直接引用，立即整文件彻底抹除！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 常见暗坑：误杀 CSS 样式文件 (Accidental CSS Pruning Trap)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">import './style.css' 属于典型的纯副作用导入！若配置了 false，CSS 会被直接摇掉！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">必须配置: "sideEffects": ["*.css", "*.scss"] 进行白名单保护！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 工业级组件库发包规范 (Publishing Standard)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">纯函数化无副作用设计 + 精确 sideEffects 白名单 ──► 打造被全球开发者热爱的极简依赖库！</text>
        <text x="15" y="62" font-size="8" fill="#047857">现代开源工程的顶尖素养！</text>
      </g>
    </g>
  </g>
</svg>