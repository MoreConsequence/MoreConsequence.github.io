<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 1.14+ 基于系统信号的非协作异步抢占 (Asynchronous Preemption)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">sysmon 发现单协程运行超 10ms ──► 发送 POSIX SIGURG 信号中断目标线程 M ──► sighandler 插入 asyncPreempt ──► 彻底打破死循环锁死 GC</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Pre-1.14 Problem -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ Go ≤ 1.13 协作式抢占：紧凑死循环挂死全站</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">go func() { for { /* 无任何函数调用的死循环 */ } }()</text>
          
          <text y="38" fill="#ef4444">致命死锁陷阱：</text>
          <text y="52" fill="#fca5a5">• 协作式抢占依赖函数序言插入的 morestack 检查点</text>
          <text y="68" fill="#ef4444">• 纯计算死循环 0 函数调用，永远无法主动让出 P！</text>
          <text y="84" fill="#ef4444">• 导致 GC STW 标记阶段永久等待该 P 停顿</text>
          
          <text y="106" fill="#f87171">🔴 整个程序瞬间彻底卡死失去响应！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 数值计算密集型任务导致全站 GC 假死；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 协程调度公平性彻底丧失；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 早期 Go 运行时最著名的痛点！</text>
      </g>
    </g>

    <!-- Right: Go 1.14+ SIGURG -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Go 1.14+ SIGURG 异步抢占：10ms 强制解套</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">1. sysmon 监控后台发现某协程连续占用 P 超过 10ms</text>
          <text y="28" fill="#86efac">2. 立即向运行该 G 的系统线程 M 发送 tgkill(SIGURG)</text>
          
          <text y="50" fill="#38bdf8">3. OS 硬件中断当前指令：</text>
          <text y="64" fill="#34d399">   • sighandler 检查指令安全点 (Safe-point)</text>
          <text y="78" fill="#34d399">   • 修改 PC 寄存器注入 runtime.asyncPreempt 调用</text>
          <text y="92" fill="#34d399">   • 强行保存当前寄存器现场，将 G 挂回队列！</text>
          
          <text y="116" fill="#4ade80">✓ 10ms 强行剥夺 CPU，保证调度与 GC 绝对平滑！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底终结死循环卡死 GC 的历史遗留顽疾；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 真正实现工业级多任务分时公平调度；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 调度器发展史上的巅峰杰作！</text>
      </g>
    </g>
  </g>
</svg>