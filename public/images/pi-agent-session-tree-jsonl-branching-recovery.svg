<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">会话是树不是日志：Append-Only JSONL 树状结构与分支任意回溯</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">每个 Entry 包含 parent_id 构成不可变树 ｜ 随时创建 Branch 探索不同重构路线 ｜ 崩溃重启自动截断未完成残行自愈</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Append-Only JSONL 存储</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 每行一条完整不可变 JSON</text>
          <text x="10" y="32" fill="#86efac">{"id":"n1","parent":null,"role":"user"}</text>
          <text x="10" y="46" fill="#86efac">{"id":"n2","parent":"n1","role":"assistant"}</text>
          <text x="10" y="60" fill="#fed7aa">{"id":"n3","parent":"n2","role":"tool_call"}</text>
          <text x="10" y="74" fill="#86efac">{"id":"n4","parent":"n3","role":"tool_result"}</text>
          
          <text x="10" y="98" fill="#34d399">✓ 0 覆盖，0 数据库锁争用！</text>
          <text x="10" y="114" fill="#4ade80">✓ 顺序写入速度达 100MB/s，物理极速！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 纯文本格式，人类可读且 Git 友好；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 崩溃断电不损坏已有历史记录；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚不可摧的本地存储引擎。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 多分支与时光回溯 (Branching)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 从 n2 分叉出探索新分支</text>
          <text x="10" y="34" fill="#86efac">{"id":"n5","parent":"n2","text":"换用方案 B"}</text>
          
          <text x="10" y="58" fill="#38bdf8">树状分叉拓扑：</text>
          <text x="10" y="72" fill="#cbd5e1">   n1 ──► n2 ──┬──► n3 ──► n4 (主干方案 A)</text>
          <text x="10" y="86" fill="#4ade80">               └──► n5 ──► n6 (探索分支 B)</text>
          
          <text x="10" y="110" fill="#34d399">✓ 随时切换活跃分支指针 (Active Leaf)！</text>
          <text x="10" y="124" fill="#34d399">✓ 像 Git 一样自由回滚与多方案试错！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免直接截断历史导致丢失思考上下文；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支持多 Agent 并行从同一点分头探索；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代智能体协作树状演进标杆。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 崩溃残行自愈修复</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 进程异常断电残行</text>
          <text x="10" y="32" fill="#f87171">{"id":"n7","parent":"n6","content":"半截文本...</text>
          
          <text x="10" y="56" fill="#38bdf8">启动自愈流程：</text>
          <text x="10" y="70" fill="#34d399">1. 逐行执行 JSON.parse() 校验</text>
          <text x="10" y="86" fill="#34d399">2. 捕获末尾不完整 SyntaxError</text>
          <text x="10" y="102" fill="#4ade80">3. 自动 truncate 抹除最后损坏半行</text>
          <text x="10" y="118" fill="#4ade80">✓ 100% 保证会话加载绝不因崩溃报错！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 面对断电、强制 kill 进程具备绝对容灾弹性；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 零手工干预自愈恢复；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 打造极其健壮的本地桌面级工具！</text>
      </g>
    </g>
  </g>
</svg>