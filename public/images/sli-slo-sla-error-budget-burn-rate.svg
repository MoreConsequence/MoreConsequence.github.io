<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">SRE 体系 SLI / SLO 与错误预算 (Error Budget) 燃烧率模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">SLI (实际测量值: 99.95%) ｜ SLO (内部追求目标: 99.9%) ｜ 错误预算 Error Budget (0.1% 允许试错空间) ｜ 燃烧率 (Burn Rate) 触发多窗口智能告警</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. SLI: 服务质量指标定义 (Service Level Indicator)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">通过 PromQL 计算: 过去 30 天内 (HTTP 状态码 &lt; 500 且 Latency &lt; 200ms 的请求数) / 总请求数 = 99.95%</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">客观衡量用户真实体验的精准数学度量！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. SLO: 内部服务质量目标 (Service Level Objective: 99.9%)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">团队共同签署的可靠性契约 ──► 设定 99.9% 目标 ──► 剩余的 0.1% (即 43 分钟/月) 作为团队合法的错误预算 (Error Budget)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将“100% 绝对可用”的盲目执念转化为科学理性的工程预算！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 错误预算驱动研发与发布策略 (Error Budget Policy)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">预算充足时: 快速迭代推进新业务功能 ｜ 预算消耗殆尽 (&lt; 0): 强制冻结发布，全员转入稳定性与技术债治理！</text>
        <text x="15" y="62" font-size="8" fill="#047857">终结研发要迭代与运维要稳定的世纪矛盾！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 多窗口多燃烧率智能告警 (Multi-Window Multi-Burn-Rate Alerts)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">1 小时消耗 5% 预算 (Burn Rate = 14.4) ──► 立即 PagerDuty 呼叫 On-Call ｜ 彻底消除传统毛刺报警风暴！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Google SRE 体系最伟大、最优雅的工业级度量！</text>
      </g>
    </g>
  </g>
</svg>