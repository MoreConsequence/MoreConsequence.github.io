<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="sli-slo-sla-error-budget-burn-rate-title sli-slo-sla-error-budget-burn-rate-desc"><title id="sli-slo-sla-error-budget-burn-rate-title">SRE 可观测性指标度量体系：SLI (服务指标) -&gt; SLO (目标承诺) -&gt; 错误预算 (Error…</title><desc id="sli-slo-sla-error-budget-burn-rate-desc">SRE 可观测性指标度量体系：SLI (服务指标) -&gt; SLO (目标承诺) -&gt; 错误预算 (Error Budget) 消耗率</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">SRE 体系 SLI / SLO 与错误预算 (Error Budget) 燃烧率模型</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">SLI (实际测量值: 99.95%) ｜ SLO (内部追求目标: 99.9%) ｜ 错误预算 Error Budget (0.1% 允许试错空间) ｜ 燃烧率 (Burn Rate) 触发多窗口智能告警</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. SLI: 服务质量指标定义 (Service Level Indicator)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">通过 PromQL 计算: 过去 30 天内 (HTTP 状态码 &lt; 500 且 Latency &lt; 200ms 的请求数) / 总请求数 = 99.95%</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">客观衡量用户真实体验的精准数学度量！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. SLO: 内部服务质量目标 (Service Level Objective: 99.9%)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">团队共同签署的可靠性契约 ──► 设定 99.9% 目标 ──► 剩余的 0.1% (即 43 分钟/月) 作为团队合法的错误预算 (Error Budget)</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">将“100% 绝对可用”的盲目执念转化为科学理性的工程预算！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 错误预算驱动研发与发布策略 (Error Budget Policy)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">预算充足时: 快速迭代推进新业务功能 ｜ 预算消耗殆尽 (&lt; 0): 强制冻结发布，全员转入稳定性与技术债治理！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">终结研发要迭代与运维要稳定的世纪矛盾！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 多窗口多燃烧率智能告警 (Multi-Window Multi-Burn-Rate Alerts)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">1 小时消耗 5% 预算 (Burn Rate = 14.4) ──► 立即 PagerDuty 呼叫 On-Call ｜ 彻底消除传统毛刺报警风暴！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">Google SRE 体系最伟大、最优雅的工业级度量！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
