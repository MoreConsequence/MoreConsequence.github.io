<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go runtime.selectgo 核心双排序算法 (pollorder &amp; lockorder)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. pollorder (洗牌算法随机轮询保证 case 公平性) ──► 2. lockorder (按 Channel 内存地址严格升序排序加锁，彻底杜绝死锁)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 轮询顺序生成 (pollorder: Fast Pseudo-Random Shuffle)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">通过 fastrandn 洗牌算法将 N 个 case 随机打乱 ──► 保证多个 channel 同时就绪时随机均等被选中</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">语言级公平性承诺，防止靠前的 case 独占饥饿！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 加锁顺序排序 (lockorder: Heap Sort by Channel Address)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">提取所有涉及的 hchan 地址 ──► 按指针绝对内存地址从小到大排序 ──► 去重处理相同通道</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">打破死锁必备的“破坏循环等待条件”数学准则！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 升序加锁与就绪扫描 (Sequential Locking &amp; Polling)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">按 lockorder 顺序锁住所有 channel ──► 顺着 pollorder 依次扫描 ──► 若有就绪立即解锁并返回对应 case！</text>
        <text x="15" y="62" font-size="8" fill="#047857">哪怕两个协程反向 select (ch1, ch2) 与 (ch2, ch1)，也绝不会死锁！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 全未就绪入队沉睡 (All Blocked: Enqueue sudog to All Channels)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">无 default 分支 ──► 将当前 G 生成多个 sudog 挂入全部涉及 channel 的等待队列 ──► gopark 沉睡！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">多路复用在微观语言内核中的终极设计！</text>
      </g>
    </g>
  </g>
</svg>