<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="hlc-hybrid-logical-clock-state-machine-title hlc-hybrid-logical-clock-state-machine-desc"><title id="hlc-hybrid-logical-clock-state-machine-title">分布式时钟模型：TrueClock 与 HLC 状态机</title><desc id="hlc-hybrid-logical-clock-state-machine-desc">分布式时钟架构图展示物理时钟误差困境、Google TrueClock 不确定性区间 Commit Wait 等待机制、CockroachDB HLC 混合逻辑时钟状态机流转，以及因果全序裁决模型。</desc>
  <defs>
    <marker id="hlc-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
