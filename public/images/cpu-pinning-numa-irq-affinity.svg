<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">万兆网络硬件调优：NUMA 亲和性与网卡中断绑核 (CPU Affinity)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">跨 NUMA 节点访问 (通过 UPI/QPI 总线增加 30ns 延迟，吞吐打折) vs 同 NUMA 节点绑核 (网卡 IRQ + 测速进程绑定同一 CPU Socket)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">1. 跨 NUMA 节点远程访问陷阱 (Cross-NUMA Memory Penalty)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">网卡插在 PCIe Node 0 ──► 测速进程运行在 CPU Node 1 ──► 数据必须跨越 UPI 互联总线！</text>
      <text x="15" y="62" font-size="8" fill="#7f1d1d">内存延迟暴增 300%，总线拥塞导致丢包与抖动骤增！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">2. 网卡物理拓扑探测 (PCIe Locality: lstopo &amp; numactl)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">cat /sys/class/net/eth0/device/numa_node ──► 确认网卡绑定的物理 NUMA 节点 (如 Node 0)</text>
        <text x="15" y="62" font-size="8" fill="#1d4ed8">将全部网络与计算资源约束在同一个本地 NUMA 域内！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 网卡中断亲和性绑定 (IRQ Affinity: /proc/irq/*/smp_affinity)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">set_irq_affinity 1-16 eth0 ──► 将网卡多队列（RSS）硬中断严格绑定在 Node 0 的 Core 1~16</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">消除中断在不同核心之间漂移引发的 L1/L2 Cache 击穿！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 测速进程隔离绑核 (numactl --cpunodebind=0 ./speedtest)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">测速服务 100% 使用本地内存通道 ──► L3 缓存命中率达到 99.2% ──► 吞吐量直线拉满 100Gbps！</text>
        <text x="15" y="62" font-size="8" fill="#047857">榨干现代多路服务器硬件极限的硬核工程！</text>
      </g>
    </g>
  </g>
</svg>