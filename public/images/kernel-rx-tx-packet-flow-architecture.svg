<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="kernel-rx-tx-packet-flow-architecture-title kernel-rx-tx-packet-flow-architecture-desc"><title id="kernel-rx-tx-packet-flow-architecture-title">kernel rx tx packet flow architecture</title><desc id="kernel-rx-tx-packet-flow-architecture-desc">kernel rx tx packet flow architecture</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Linux 内核网络包收发全链路与各层挂载点拓扑 (RX/TX Packet Flow)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">从物理光电信号、DMA Ring Buffer、NAPI 轮询、XDP 极速旁路，到 sk_buff、TC Qdisc、L3/L4 协议栈与套接字队列</text>
  </g>

  
  <g transform="translate(40, 75)" font-family="'Geist', 'Noto Sans SC', sans-serif">
    
    <g transform="translate(0, 0)">
      <rect width="880" height="55" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="25" y="22" font-size="11" font-weight="700" fill="#2d3142">6. 用户态应用层 (Socket Buffer / epoll / io_uring)</text>
      <text x="25" y="40" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">应用程序通过 read() / recvmsg() 消费已排序的 TCP 字节流 ──► 触发 EPOLLIN 事件唤醒</text>
    </g>

    
    <g transform="translate(0, 65)">
      <rect width="880" height="55" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="25" y="22" font-size="11" font-weight="700" fill="#2d3142">5. 传输层与网络层协议栈 (TCP / IP / BBR / eBPF Kprobe &amp; Tracepoint)</text>
      <text x="25" y="40" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">TCP 重组与滑动窗口校验 ──► IP 路由查找 (FIB) ──► eBPF Kprobe 动态追踪 Off-CPU 与调度延迟</text>
    </g>

    
    <g transform="translate(0, 130)">
      <rect width="880" height="55" rx="6" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
      <text x="25" y="22" font-size="11" font-weight="700" fill="#4f5d75">4. 流量控制系统 (Linux TC Qdisc: fq Pacing + HTB 分层令牌桶)</text>
      <text x="25" y="40" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">fq (Fair Queueing) 纳秒级匀速发包 ──► 彻底消除 Bufferbloat 缓冲区膨胀排队时延</text>
    </g>

    
    <g transform="translate(0, 195)">
      <rect width="880" height="55" rx="6" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
      <text x="25" y="22" font-size="11" font-weight="700" fill="#2d3142">3. sk_buff 内存构建 &amp; XDP 极速旁路 (eBPF XDP_DROP / TX / REDIRECT)</text>
      <text x="25" y="40" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">XDP 在分配 sk_buff 之前线速丢包 (40Mpps) ──► 正常包分配 sk_buff 进入 Linux 协议栈</text>
    </g>

    
    <g transform="translate(0, 260)">
      <rect width="880" height="55" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
      <text x="25" y="22" font-size="11" font-weight="700" fill="#4f5d75">2. NAPI 软中断轮询机制 (net_rx_action &amp; Ring Buffer Ingestion)</text>
      <text x="25" y="40" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">硬中断触发后关闭中断并切入 NAPI 轮询 ──► 批量收割 64 个报文 ──► 彻底避免中断风暴击穿 CPU</text>
    </g>

    
    <g transform="translate(0, 325)">
      <rect width="880" height="55" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
      <text x="25" y="22" font-size="11" font-weight="700" fill="#4f5d75">1. 物理网卡与 DMA 传输 (PHY / MAC / PCIe DMA Controller)</text>
      <text x="25" y="40" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">光纤光电信号转换 ──► 硬件 DMA 控制器直接将数据写入主机内存 RX Ring Buffer ──► 0 CPU 拷贝</text>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
