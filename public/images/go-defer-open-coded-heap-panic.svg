<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go defer 三代技术演进：从 50ns 降至 3ns 开放编码</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">堆分配 _defer 链表 (Go 1.12) ──► 栈分配 _defer (Go 1.13) ──► 开放编码 (Open-Coded Defer, Go 1.14+ 内联指令)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1: Heap Defer -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 堆上 defer (Go 1.12 之前)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// 每次 defer 均在堆上 newobject</text>
          <text x="10" y="34" fill="#fca5a5">1. 调用 runtime.deferproc</text>
          <text x="10" y="48" fill="#fca5a5">2. 申请 runtime._defer 结构体 (48B)</text>
          <text x="10" y="64" fill="#fca5a5">3. 挂入当前 G._defer 单向链表表头</text>
          <text x="10" y="80" fill="#fca5a5">4. 函数退出调用 deferreturn 逐个出链</text>
          <text x="10" y="102" fill="#ef4444">❌ 单次耗时高达 ~50ns！</text>
          <text x="10" y="118" fill="#ef4444">❌ 产生大量小对象堆分配与 GC 压力</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">历史痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 早年 Go 社区形成"热路径禁用 defer"共识</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 循环内写 defer 导致内存瞬间暴涨</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 成为 Go 早期性能最大槽点之一</text>
      </g>
    </g>

    <!-- Col 2: Stack Defer -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. 栈上 defer (Go 1.13)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 栈上预分配 _defer 空间</text>
          <text x="10" y="34" fill="#93c5fd">1. 调用 runtime.deferprocStack</text>
          <text x="10" y="48" fill="#93c5fd">2. 在当前函数栈帧预留 _defer 内存</text>
          <text x="10" y="64" fill="#93c5fd">3. 直接初始化栈上结构体并挂入链表</text>
          <text x="10" y="82" fill="#34d399">✓ 耗时降至约 30ns</text>
          <text x="10" y="100" fill="#34d399">✓ 0 堆内存分配！</text>
          <text x="10" y="118" fill="#fbbf24">⚠️ 依然存在函数调用与链表维护开销</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 循环中显式书写的 defer</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• defer 数量超过 8 个的函数</text>
        <text x="10" y="62" font-size="7.5" fill="#1d4ed8">• 无法在编译期确定静态执行顺序的场景</text>
      </g>
    </g>

    <!-- Col 3: Open-Coded Defer -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 开放编码内联 (Go 1.14+, 3ns)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 编译期内联位图 (Open-Coded)</text>
          <text x="10" y="34" fill="#86efac">1. 使用 1 字节 deferBits 位图记录执行状态</text>
          <text x="10" y="48" fill="#86efac">2. 遇到 defer mu.Unlock(): deferBits |= 1</text>
          <text x="10" y="64" fill="#34d399">3. 在每个 return 退出点直接插入内联代码：</text>
          <text x="16" y="78" fill="#38bdf8">   if deferBits &amp; 1 != 0 { mu.Unlock() }</text>
          <text x="10" y="98" fill="#34d399">► 彻底消灭 _defer 结构体与运行时函数调用！</text>
          <text x="10" y="114" fill="#34d399">► 耗时仅需 ~3ns (几乎等同于直接写调用)！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 开启条件: 单函数 defer &lt;= 8 个且非循环；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 99% 的日常业务代码均享受 3ns 极速收益；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 彻底放心大胆在任何地方使用 defer！</text>
      </g>
    </g>
  </g>
</svg>