<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Haversine 半正矢大圆球面测距数学模型 (Great-Circle Distance)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">a = sin²(Δφ/2) + cos φ1 ⋅ cos φ2 ⋅ sin²(Δλ/2) ｜ c = 2 ⋅ atan2(√a, √(1−a)) ｜ d = R ⋅ c (地球平均半径 R = 6,371 km)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 客户端与边缘节点经纬度提取 (GeoIP Coordinate Extraction)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Client (lat1, lon1: 北京 39.9042, 116.4074) ──► Node (lat2, lon2: 上海 31.2304, 121.4737)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将角度值统一转换为弧度制 (rad = deg × π / 180)！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 球面三角半正矢公式演算 (Haversine Formula Calculation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">计算纬度差 Δlat 与经度差 Δlon ──► 求取弦长参数 a 与球面中央角 c</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">规避反余弦 acos 在极小距离下的浮点舍入严重误差！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 物理距离收敛 (Distance d = 6,371 × c = 1,068.5 km)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">手算北京至上海物理球面大圆距离为 1,068.5 公里 ──► 理论光纤单向传播下限约 5.34ms</text>
        <text x="15" y="62" font-size="8" fill="#047857">为网络时延合理性提供严格的物理基准锚点！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 全球边缘节点按距离升序智能调度 (Top-K Nearest Selection)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">毫秒级排序全球 500 个测速节点 ──► 优选前 3 个最近机房发起并发 Ping 探测</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">构建工业级智能选路调度引擎！</text>
      </g>
    </g>
  </g>
</svg>