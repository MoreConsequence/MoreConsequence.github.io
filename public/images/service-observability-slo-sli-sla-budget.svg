<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">SRE 可靠性度量工程：SLI、SLO、SLA 与错误预算 (Error Budget) 闭环</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">SLI (服务质量指标) ──► SLO (内部可靠性目标 99.9%) ──► 错误预算消耗模型 ──► 驱动系统发布节奏与稳定性治理</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. SLI: 物理度量指标</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 真实客观的量化指标 (PromQL)</text>
          <text x="10" y="34" fill="#93c5fd">1. 可用性 SLI:</text>
          <text x="16" y="48" fill="#86efac">   成功请求数 (HTTP != 5xx) / 总请求数</text>
          
          <text x="10" y="70" fill="#38bdf8">2. 延迟 SLI:</text>
          <text x="16" y="84" fill="#86efac">   响应时间 &lt; 200ms 的请求数 / 总请求数</text>
          
          <text x="10" y="108" fill="#34d399">✓ 必须在网关最外层采集，反映真实用户体感！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 剔除 4xx 客户端参数错误；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 告别模糊的单机 CPU/内存指标；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造直指业务价值的观测标尺。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. SLO: 内部目标与错误预算</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 设定 30 天滚动 SLO = 99.9%</text>
          <text x="10" y="34" fill="#86efac">错误预算 Error Budget = 100% - 99.9% = 0.1%</text>
          
          <text x="10" y="58" fill="#38bdf8">这意味着每 1000 万次请求中：</text>
          <text x="10" y="74" fill="#cbd5e1">• 允许出现 10,000 次 5xx 失败或慢请求</text>
          
          <text x="10" y="98" fill="#34d399">✓ 错误预算是研发与运维之间唯一的和平协议！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 预算充沛时：全力支持新业务迭代与实验；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 预算耗尽时：立即冻结发布，全员修稳定性；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 科学化解敏捷与稳定的冲突。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 燃尽率 (Burn Rate) 智能告警</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// Google SRE 阶梯告警算法</text>
          <text x="10" y="34" fill="#fed7aa">1. 燃尽率 = 1 (30 天刚好烧完 100% 预算)</text>
          
          <text x="10" y="56" fill="#f87171">2. 燃尽率 = 14.4 (1 小时烧掉 2% 预算):</text>
          <text x="16" y="70" fill="#ef4444">   ► 触发 Page 级深夜电话紧急呼叫！</text>
          
          <text x="10" y="92" fill="#fbbf24">3. 燃尽率 = 3 (6 小时烧掉 5% 预算):</text>
          <text x="16" y="106" fill="#cbd5e1">   ► 发送工单通知工作时间排查！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底消灭无效告警风暴与误报骚扰；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 在故障造成大面积瘫痪前毫秒级拦截；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 现代分布式工程可观测性的最高境界！</text>
      </g>
    </g>
  </g>
</svg>