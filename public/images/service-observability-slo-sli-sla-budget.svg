<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="service-observability-slo-sli-sla-budget-title service-observability-slo-sli-sla-budget-desc"><title id="service-observability-slo-sli-sla-budget-title">服务可观测性与可靠性工程：SLI 指标度量、SLO 目标设定与错误预算 (Error Budget) 消耗模型</title><desc id="service-observability-slo-sli-sla-budget-desc">服务可观测性与可靠性工程：SLI 指标度量、SLO 目标设定与错误预算 (Error Budget) 消耗模型</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">SRE 可靠性度量工程：SLI、SLO、SLA 与错误预算 (Error Budget) 闭环</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">SLI (服务质量指标) ──► SLO (内部可靠性目标 99.9%) ──► 错误预算消耗模型 ──► 驱动系统发布节奏与稳定性治理</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. SLI: 物理度量指标</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 真实客观的量化指标 (PromQL)</text>
          <text x="10" y="34" fill="#f5f5f5">1. 可用性 SLI:</text>
          <text x="16" y="48" fill="#f5f5f5">   成功请求数 (HTTP != 5xx) / 总请求数</text>

          <text x="10" y="70" fill="#f5f5f5">2. 延迟 SLI:</text>
          <text x="16" y="84" fill="#f5f5f5">   响应时间 &lt; 200ms 的请求数 / 总请求数</text>

          <text x="10" y="108" fill="#f5f5f5">✓ 必须在网关最外层采集，反映真实用户体感！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 剔除 4xx 客户端参数错误；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 告别模糊的单机 CPU/内存指标；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造直指业务价值的观测标尺。</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. SLO: 内部目标与错误预算</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 设定 30 天滚动 SLO = 99.9%</text>
          <text x="10" y="34" fill="#f5f5f5">错误预算 Error Budget = 100% - 99.9% = 0.1%</text>

          <text x="10" y="58" fill="#f5f5f5">这意味着每 1000 万次请求中：</text>
          <text x="10" y="74" fill="#cbd5e1">• 允许出现 10,000 次 5xx 失败或慢请求</text>

          <text x="10" y="98" fill="#f5f5f5">✓ 错误预算是研发与运维之间唯一的和平协议！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 预算充沛时：全力支持新业务迭代与实验；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 预算耗尽时：立即冻结发布，全员修稳定性；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 科学化解敏捷与稳定的冲突。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 燃尽率 (Burn Rate) 智能告警</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// Google SRE 阶梯告警算法</text>
          <text x="10" y="34" fill="#f5f5f5">1. 燃尽率 = 1 (30 天刚好烧完 100% 预算)</text>

          <text x="10" y="56" fill="#f5f5f5">2. 燃尽率 = 14.4 (1 小时烧掉 2% 预算):</text>
          <text x="16" y="70" fill="#f5f5f5">   ► 触发 Page 级深夜电话紧急呼叫！</text>

          <text x="10" y="92" fill="#f5f5f5">3. 燃尽率 = 3 (6 小时烧掉 5% 预算):</text>
          <text x="16" y="106" fill="#cbd5e1">   ► 发送工单通知工作时间排查！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 彻底消灭无效告警风暴与误报骚扰；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 在故障造成大面积瘫痪前毫秒级拦截；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代分布式工程可观测性的最高境界！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
