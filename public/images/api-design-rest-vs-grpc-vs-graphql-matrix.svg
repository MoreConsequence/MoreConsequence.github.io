<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">微服务 API 契约范式对比矩阵 (API Design Paradigms)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">RESTful JSON (通用公网接入) ｜ gRPC HTTP/2 Protobuf (微服务集群内部极速低延迟 RPC) ｜ GraphQL (BFF 聚合多源精准裁剪)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. RESTful / HTTP+JSON</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">GET /api/v1/users/1001</text>
          
          <text x="10" y="38" fill="#86efac">核心优势：</text>
          <text x="10" y="54" fill="#38bdf8">• 浏览器原生秒级调用，人眼可读性极高</text>
          <text x="10" y="70" fill="#34d399">• 完美利用 CDN / Nginx 标准 HTTP 缓存</text>
          <text x="10" y="86" fill="#f87171">• 缺点: 文本 JSON 解析与序列化开销较大</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 对外公网 Open API 绝对首选！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 生态最繁荣，0 客户端 SDK 强依赖；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 配合 OpenAPI / Swagger 自动生成文档；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化 Web 标准通用基石。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. gRPC / Protobuf (极速 RPC)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">rpc GetUser(UserReq) returns (UserResp);</text>
          
          <text x="10" y="38" fill="#86efac">极致性能特征：</text>
          <text x="10" y="54" fill="#38bdf8">• Protobuf 紧凑二进制编码，体积小 70%</text>
          <text x="10" y="70" fill="#34d399">• HTTP/2 单连接多路复用流式传输</text>
          <text x="10" y="86" fill="#4ade80">• 强类型契约与多语言代码全自动生成！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 微服务集群内部东-西向流量统治者！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 吞吐提升 5~10 倍，CPU 占用暴降；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支持双向流式 (Streaming) 通信；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代分布式后台通信金牌标准。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. GraphQL (BFF 按需聚合)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">query { user(id: 1) { name, avatar } }</text>
          
          <text x="10" y="38" fill="#fed7aa">按需裁剪优势：</text>
          <text x="10" y="54" fill="#38bdf8">• 彻底消灭 Over-fetching (冗余字段)</text>
          <text x="10" y="70" fill="#34d399">• 一次网络请求聚合 10 个微服务数据</text>
          <text x="10" y="86" fill="#fb923c">• 缺点: 服务端解析复杂，防范 N+1 查询</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 复杂前端/移动端 BFF 网关神器！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 前端自由定义数据形状，极大提升迭代效率；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 适合多端 (iOS/Android/Web) 差异化展现；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 现代全栈开发利器！</text>
      </g>
    </g>
  </g>
</svg>