<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="api-design-rest-vs-grpc-vs-graphql-matrix-title api-design-rest-vs-grpc-vs-graphql-matrix-desc"><title id="api-design-rest-vs-grpc-vs-graphql-matrix-title">API 范式全景架构对比：RESTful (通用资源) vs gRPC (高性能二进制 Protobuf) vs…</title><desc id="api-design-rest-vs-grpc-vs-graphql-matrix-desc">API 范式全景架构对比：RESTful (通用资源) vs gRPC (高性能二进制 Protobuf) vs GraphQL (按需查询)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">微服务 API 契约范式对比矩阵 (API Design Paradigms)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">RESTful JSON (通用公网接入) ｜ gRPC HTTP/2 Protobuf (微服务集群内部极速低延迟 RPC) ｜ GraphQL (BFF 聚合多源精准裁剪)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. RESTful / HTTP+JSON</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">GET /api/v1/users/1001</text>

          <text x="10" y="38" fill="#f5f5f5">核心优势：</text>
          <text x="10" y="54" fill="#f5f5f5">• 浏览器原生秒级调用，人眼可读性极高</text>
          <text x="10" y="70" fill="#f5f5f5">• 完美利用 CDN / Nginx 标准 HTTP 缓存</text>
          <text x="10" y="86" fill="#f5f5f5">• 缺点: 文本 JSON 解析与序列化开销较大</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 对外公网 Open API 绝对首选！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 生态最繁荣，0 客户端 SDK 强依赖；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 配合 OpenAPI / Swagger 自动生成文档；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代化 Web 标准通用基石。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. gRPC / Protobuf (极速 RPC)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">rpc GetUser(UserReq) returns (UserResp);</text>

          <text x="10" y="38" fill="#f5f5f5">极致性能特征：</text>
          <text x="10" y="54" fill="#f5f5f5">• Protobuf 紧凑二进制编码，体积小 70%</text>
          <text x="10" y="70" fill="#f5f5f5">• HTTP/2 单连接多路复用流式传输</text>
          <text x="10" y="86" fill="#f5f5f5">• 强类型契约与多语言代码全自动生成！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 微服务集群内部东-西向流量统治者！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 吞吐提升 5~10 倍，CPU 占用暴降；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 支持双向流式 (Streaming) 通信；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代分布式后台通信金牌标准。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. GraphQL (BFF 按需聚合)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">query { user(id: 1) { name, avatar } }</text>

          <text x="10" y="38" fill="#f5f5f5">按需裁剪优势：</text>
          <text x="10" y="54" fill="#f5f5f5">• 彻底消灭 Over-fetching (冗余字段)</text>
          <text x="10" y="70" fill="#f5f5f5">• 一次网络请求聚合 10 个微服务数据</text>
          <text x="10" y="86" fill="#f5f5f5">• 缺点: 服务端解析复杂，防范 N+1 查询</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 复杂前端/移动端 BFF 网关神器！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 前端自由定义数据形状，极大提升迭代效率；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 适合多端 (iOS/Android/Web) 差异化展现；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代全栈开发利器！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
