<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 基于能力安全缝隙 (Capability Seams) 的细粒度权限控制模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 声明所需能力清单 ──► 2. 运行时签发不可伪造 Capability Handle ──► 3. 沙箱内核级校验 ──► 4. 阻断任何无 Token 越权调用</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 声明式能力清单 (Capability Manifest: Zero Ambient Authority)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Agent 初始化时默认 0 任何操作系统权限 ──► 显式声明仅需: FileRead("./src"), NetListen(":3000")</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">根除传统进程无限制继承所有权限的漏洞！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 不可伪造的能力凭证 (Cryptographic Capability Token)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">内核签发只读文件句柄或受限 Socket ──► 仅在当前 Step 生命周期内生效 ──► 跨步骤自动失效作废</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将权限控制收敛到毫秒级短生命周期！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 沙箱内核拦截与校验 (Sandbox Kernel Enforcement)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Tool 发起 openat() 系统调用 ──► Bubblewrap seccomp 过滤器核对 Capability ──► 非法路径立即拒绝</text>
        <text x="15" y="62" font-size="8" fill="#047857">即使大模型被黑客 Prompt 注入也无法越狱！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 审计追踪与动态提权 (Audit Trail &amp; Dynamic Escalation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">每一次文件读写与网络连接均记录审计日志 ──► 遇到高危操作时主动向用户申请动态提权！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">面向下一代安全 Agent 的终极架构方案！</text>
      </g>
    </g>
  </g>
</svg>