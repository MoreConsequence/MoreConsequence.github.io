<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">边缘调度双引擎对比：BGP Anycast vs GeoDNS</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">BGP Anycast (路由级就近宣告，毫秒自愈，抗 DDoS 极强) vs GeoDNS (基于客户端 Local DNS 解析，成本极低，配置灵活)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. BGP Anycast：路由器原生物理选路</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">全球 200 个 POP 点共享同一个公网 IP: 1.1.1.1</text>
          
          <text y="38" fill="#86efac">物理机制：</text>
          <text y="52" fill="#cbd5e1">• 互联网骨干网 BGP 协议自动计算最短 AS-Path</text>
          <text y="66" fill="#cbd5e1">• 节点宕机 BGP 撤发路由，毫秒级自动切换至临近节点</text>
          <text y="80" fill="#cbd5e1">• 洪峰流量天然被全球 200 个机房物理稀释！</text>
          
          <text y="106" fill="#4ade80">✓ Cloudflare / Google DNS 工业级事实标准！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制特性：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 0 DNS 缓存 TTL 延迟；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 需持有自主 ASN 与 /24 公网 IP 段，基建门槛较高；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级性能与容灾标杆。</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. GeoDNS：应用层精细化调度</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">基于客户端递归 DNS / EDNS0 Client Subnet</text>
          
          <text y="38" fill="#86efac">机制特性：</text>
          <text y="52" fill="#cbd5e1">• DNS 权威服务器根据来源 IP 所在省份/运营商解析</text>
          <text y="66" fill="#cbd5e1">• 电信用户解析电信 IP，联通解析联通 IP</text>
          <text y="80" fill="#cbd5e1">• 0 硬件基建投资，普通云服务器即可部署！</text>
          
          <text y="106" fill="#4ade80">✓ 性价比极高，中小企业与私有化测速首选！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制特性：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 成本极其亲民，开箱即用；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 依赖 ECS (RFC 7871) 规避公共 DNS 跨区误调度；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 灵活高效的现代方案！</text>
      </g>
    </g>
  </g>
</svg>