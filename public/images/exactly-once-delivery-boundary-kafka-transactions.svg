<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="exactly-once-delivery-boundary-kafka-transactions-title exactly-once-delivery-boundary-kafka-transactions-desc"><title id="exactly-once-delivery-boundary-kafka-transactions-title">Exactly-Once 消息语义的物理边界：生产幂等性、Kafka 事务与消费端去重表</title><desc id="exactly-once-delivery-boundary-kafka-transactions-desc">Exactly-Once 消息语义的物理边界：生产幂等性、Kafka 事务与消费端去重表</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Exactly-Once 语义系统边界：全链路三段式精确一次交付契约</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 生产者 PID + SequenceID 幂等 ──► 2. Kafka 2PC 跨分区事务提交 ──► 3. 消费端业务数据库唯一键去重防重复消费</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 生产端：PID 幂等写入</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">enable.idempotence = true</text>
          <text x="10" y="34" fill="#f5f5f5">1. Broker 为 Producer 分配唯一 PID</text>
          <text x="10" y="50" fill="#f5f5f5">2. 每条消息携带单调递增 SequenceNumber</text>
          <text x="10" y="68" fill="#f5f5f5">3. 网络丢包重试时：</text>
          <text x="16" y="82" fill="#f5f5f5">   Broker 自动去重丢弃重复 Seq 消息！</text>
          <text x="10" y="104" fill="#f5f5f5">✓ 保证单分区内单会话生产 0 重复！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 自动解决网络 ACK 超时引发的重发重复；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 零额外业务代码侵入；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 性能几乎无额外损耗。</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 管道层：跨分区原子事务</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">transactional.id = "tx_order_01"</text>
          <text x="10" y="34" fill="#f5f5f5">1. 事务协调器 (Transaction Coordinator)</text>
          <text x="10" y="50" fill="#f5f5f5">2. 写入 __transaction_state 事务日志</text>
          <text x="10" y="68" fill="#f5f5f5">3. "Consume-Transform-Produce" 流程：</text>
          <text x="16" y="82" fill="#f5f5f5">   消息发送与 Offset 提交原子绑定！</text>
          <text x="10" y="104" fill="#f5f5f5">✓ 确保下游 read_committed 仅见已提交数据！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 跨多个 Topic 和 Partition 的原子批写；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 结合 Flink/Kafka Streams 构建流计算闭环；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造强一致流处理基础设施。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 消费端：业务去重与幂等</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 消费端业务数据库防御</text>
          <text x="10" y="34" fill="#f5f5f5">1. 唯一业务键 (BizID / OrderID)</text>
          <text x="10" y="48" fill="#f5f5f5">2. 插入消息消费去重表 (唯一索引):</text>
          <text x="16" y="64" fill="#f5f5f5">   INSERT INTO msg_dedup (msg_id)...</text>
          <text x="10" y="84" fill="#f5f5f5">3. 业务扣减与去重表写入处于同一本地事务</text>
          <text x="10" y="104" fill="#f5f5f5">✓ 即使消息重发 100 次，业务状态绝对不漂移！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">终极事实：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 世界上没有离开消费端配合的绝对 Exactly-Once；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 消费端幂等是分布式系统的最终救赎；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造固若金汤的分布式消息工程体系！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
