<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="llm-embedding-cosine-vs-euclidean-geometry-title llm-embedding-cosine-vs-euclidean-geometry-desc"><title id="llm-embedding-cosine-vs-euclidean-geometry-title">向量检索的几何数学：余弦相似度 (Cosine) vs 欧氏距离 (L2) 与超球面归一化</title><desc id="llm-embedding-cosine-vs-euclidean-geometry-desc">向量检索的几何数学：余弦相似度 (Cosine) vs 欧氏距离 (L2) 与超球面归一化</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">LLM Embedding 检索几何数学：余弦夹角 vs 欧氏距离的等价性</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">L2 归一化 (|u|=1, |v|=1) ──► 欧氏距离平方 ||u-v||^2 = 2 - 2(u·v) ──► 向量检索直接退化为极速点积 (Dot Product)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 单位超球面上的几何对偶性</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 欧氏距离与余弦相似度换算公式</text>
          <text y="30" fill="#f5f5f5">||u - v||² = ||u||² + ||v||² - 2(u · v)</text>

          <text y="54" fill="#f5f5f5">当向量经过 L2 归一化后 (||u|| = ||v|| = 1):</text>
          <text y="70" fill="#f5f5f5">||u - v||² = 1 + 1 - 2 cos(θ) = 2(1 - cos(θ))</text>

          <text y="96" fill="#f5f5f5">✓ 欧氏距离最小 ⇐⇒ 余弦相似度最大 ⇐⇒ 点积 (Dot) 最大！</text>
          <text y="114" fill="#f5f5f5">✓ 向量数据库只需计算一次矩阵乘法 (BLAS GEMM)！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">工程性能跃迁：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 预先归一化，将复杂的开根号与模长除法在入库时提前完成；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 在线检索仅需单条 AVX-512 / ARM Neon FMA 向量点积指令；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• QPS 吞吐暴增 10 倍以上！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">2. 高维维度灾难与各向异性 (Anisotropy)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// LLM 向量空间的锥形退化现象</text>
          <text y="28" fill="#f5f5f5">1. 绝大多数文本 Embedding 挤在一个极其狭窄的圆锥体内</text>
          <text y="44" fill="#f5f5f5">2. 任意两个无关文本的 Cosine 相似度均高达 0.85+！</text>

          <text y="68" fill="#f5f5f5">3. 破局解法：</text>
          <text y="82" fill="#f5f5f5">   • 均值中心化减去全局均值 (u - μ)</text>
          <text y="96" fill="#f5f5f5">   • PCA / Whitening 白化消除主成分偏置</text>
          <text y="112" fill="#f5f5f5">   • 引入 Reranker 交叉重排进行二次深层打分！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">RAG 生产建议：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 严禁直接拿 0.8 相似度作为相关性过滤硬阈值；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 必须结合 BM25 稀疏检索 + 向量密集检索构建混合搜索 (Hybrid Search)；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 彻底规避纯向量检索的语义漂移与数字盲区！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
