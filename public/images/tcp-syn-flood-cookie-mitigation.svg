<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">SYN Queue 溢出与 SYN Cookie 防御机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">海量伪造源 IP SYN 包打满半连接队列 ──► 开启 tcp_syncookies = 1 ──► 不分配内存，将连接元数据编码进 ISN 序列号 ──► 收到 ACK 解密校验建立连接</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">1. 攻击流量涌入打满 SYN 队列 (SYN Queue Exhaustion)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">攻击者发送 100,000 SYN/s (从不回 ACK) ──► 半连接队列 (max_syn_backlog) 瞬间 100% 占满</text>
      <text x="15" y="62" font-size="8" fill="#7f1d1d">若无防御，正常用户发送的握手包将被直接静默丢弃，导致全站拒绝服务！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. SYN Cookie 紧急启动与零内存哈希计算 (Zero-Memory Stateless ISN)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">内核放弃在内存中分配 request_sock ──► 计算 ISN = Hash(SrcIP, DstIP, Secret) + Timestamp</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将四元组状态与 MSS 协商编码成一个 32 位初始序列号直接回包！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 正常客户端三次回包验证 (Stateless ACK Verification)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">正常客户端回送 ACK: ack_seq = ISN + 1 ──► 内核解密并验证哈希合法性且时间未超时</text>
        <text x="15" y="62" font-size="8" fill="#047857">直到此时才正式在 Accept Queue 中创建完整连接对象，0 资源浪费！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. DDoS 攻击流量自然消亡 (Attack Vanishes)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">伪造 IP 攻击者永远不会回送有效 ACK ──► 攻击包在服务端 0 内存占用瞬间蒸发！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Linux 内核最经典的以计算换空间的精妙防御设计！</text>
      </g>
    </g>
  </g>
</svg>