<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 四大核心工具矩阵：极简设计原则与 Bash 沙箱的万能延伸</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">read (只读探查) ｜ write (全量覆盖新建) ｜ edit (精准行级差分替换) ｜ bash (在安全沙箱中执行一切编译器与脚本)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">1. read (代码探查)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="16" fill="#38bdf8">read(path, offset, limit)</text>
          <text x="8" y="32" fill="#93c5fd">• 按行精准分页加载</text>
          <text x="8" y="48" fill="#34d399">• 附带全局行号标记</text>
          <text x="8" y="66" fill="#4ade80">• 自动过滤二进制乱码</text>
          <text x="8" y="84" fill="#cbd5e1">• 保护模型上下文预算</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8" font-weight="700" fill="#1e40af">工具职责：</text>
        <text x="8" y="34" font-size="7" fill="#1d4ed8">• 建立代码空间认知；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 获取行号用于后续差分；</text>
        <text x="8" y="62" font-size="7" fill="#047857">• 纯只读无副作用。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">2. write (全新创建)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="16" fill="#4ade80">write(path, content)</text>
          <text x="8" y="32" fill="#86efac">• 自动递归创建父目录</text>
          <text x="8" y="48" fill="#34d399">• 全量新建配置文件/代码</text>
          <text x="8" y="66" fill="#4ade80">• 覆盖前自动校验文件锁</text>
          <text x="8" y="84" fill="#38bdf8">• 保证写入原子性落盘</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8" font-weight="700" fill="#166534">工具职责：</text>
        <text x="8" y="34" font-size="7" fill="#15803d">• 创建全新模块与文件；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• 生成构建脚手架；</text>
        <text x="8" y="62" font-size="7" fill="#047857">• 简单直接，0 歧义。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(460, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">3. edit (行级差分)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="16" fill="#fb923c">edit(path, oldStr, newStr)</text>
          <text x="8" y="32" fill="#fed7aa">• 精准字符串模糊锚点匹配</text>
          <text x="8" y="48" fill="#34d399">• 仅替换局部 5 行代码</text>
          <text x="8" y="66" fill="#4ade80">• 节约 98% 输出 Token 消耗</text>
          <text x="8" y="84" fill="#fb923c">• 杜绝大文件重写时丢代码</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8" font-weight="700" fill="#c2410c">工具职责：</text>
        <text x="8" y="34" font-size="7" fill="#9a3412">• 精准 Bug 修复与重构；</text>
        <text x="8" y="48" font-size="7.5" fill="#9a3412">• 保持未修改部分绝对干净；</text>
        <text x="8" y="62" font-size="7" fill="#ea580c">• 代码重构的核心利刃。</text>
      </g>
    </g>

    <!-- Col 4 -->
    <g transform="translate(690, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">4. bash (沙箱执行)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="16" fill="#d8b4fe">bash(command)</text>
          <text x="8" y="32" fill="#e9d5ff">• 运行 pytest / go test</text>
          <text x="8" y="48" fill="#34d399">• git 状态检查与 commit</text>
          <text x="8" y="66" fill="#4ade80">• 覆盖任意编译与调试动作</text>
          <text x="8" y="84" fill="#38bdf8">• 替代数十个专用小工具！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="8" y="18" font-size="8" font-weight="700" fill="#7e22ce">工具职责：</text>
        <text x="8" y="34" font-size="7" fill="#6b21a8">• 赋予 Agent 执行能力；</text>
        <text x="8" y="48" font-size="7.5" fill="#6b21a8">• 自动化验证与闭环反馈；</text>
        <text x="8" y="62" font-size="7" fill="#6b21a8">• 真正的万能通用扩展口！</text>
      </g>
    </g>
  </g>
</svg>