<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 递归上下文智能压缩策略 (Smart Context Compaction)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">粗暴截断历史 (丢失关键变量定义导致后续推理幻觉) vs 结构化语义蒸馏 (保留系统提示 + 提炼历史决策摘要 + 原始近期窗口，兼具长记忆与低成本)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Naive Truncation -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 朴素硬截断：丢失关键历史与记忆失忆</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">当超出 Token 预算时直接丢弃前 20 条消息：</text>
          
          <text y="38" fill="#ef4444">致命失忆后果：</text>
          <text y="52" fill="#fca5a5">• 丢弃了第 1 轮用户设定的架构约束条件</text>
          <text y="68" fill="#ef4444">• 丢弃了已创建的核心数据库表结构定义</text>
          <text y="84" fill="#ef4444">• Agent 产生严重幻觉，反复要求用户重新输入！</text>
          
          <text y="106" fill="#f87171">🔴 长任务执行成功率几乎归零！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">架构痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 未能理解上下文不同信息的价值权重；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 粗暴处理带来严重的灾难性遗忘；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 业余 Agent 实现典型特征！</text>
      </g>
    </g>

    <!-- Right: Semantic Compaction -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ DSH 语义蒸馏：分级保留核心决策事实</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">三段式结构化压缩算法：</text>
          
          <text y="36" fill="#86efac">1. [Static System Prompt] (10k) ──► 0 压缩，100% 命中缓存</text>
          <text y="50" fill="#38bdf8">2. [Key Decisions Summary] (15k) ──► 提炼关键变量与架构裁决</text>
          <text y="64" fill="#34d399">3. [Recent Raw Window] (25k) ──► 保留最近 5 轮完整代码 Diff</text>
          <text y="78" fill="#4ade80">4. 动态控制总 Token 在 50k 黄金平衡区！</text>
          
          <text y="104" fill="#4ade80">✓ 兼具无限长任务记忆与极致经济性！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 保证 Agent 能够连续运行 24 小时 0 遗忘；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑复杂数万行大项目的自主重构；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• DSH 引擎核心黑科技！</text>
      </g>
    </g>
  </g>
</svg>