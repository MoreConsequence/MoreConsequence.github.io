<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go GC 三色标记并发回收与 gctrace 日志三段相位拆解</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">STW 1 (开启写屏障) ──► 并发标记 (Concurrent Mark 占 25% CPU) ──► STW 2 (标记终止) ──► 并发清扫 (Concurrent Sweep)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Top: Tri-color Model (860px) -->
    <g transform="translate(20, 20)">
      <rect width="860" height="155" rx="6" fill="#0f172a"/>
      <text x="15" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">
        三色标记法 (Tri-color Mark) 核心对象状态转移：
      </text>

      <g transform="translate(15, 45)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="260" height="95" rx="4" fill="#1e293b" stroke="#64748b"/>
        <text x="10" y="20" font-size="9" font-weight="700" fill="#cbd5e1">⚪ 白色对象 (潜在垃圾)</text>
        <text x="10" y="38" font-size="7.5" fill="#94a3b8">• 尚未被 GC 遍历扫描到的对象</text>
        <text x="10" y="54" font-size="7.5" fill="#94a3b8">• 标记阶段结束时仍为白色则属于垃圾</text>
        <text x="10" y="70" font-size="7.5" fill="#f87171">• 在清扫阶段将被物理回收内存</text>

        <g transform="translate(280, 0)">
          <rect width="260" height="95" rx="4" fill="#1e293b" stroke="#f59e0b"/>
          <text x="10" y="20" font-size="9" font-weight="700" fill="#fbbf24">🟡 灰色对象 (波面队列)</text>
          <text x="10" y="38" font-size="7.5" fill="#fed7aa">• 自身已被标记为存活</text>
          <text x="10" y="54" font-size="7.5" fill="#fed7aa">• 但其引用的子对象尚未被递归扫描</text>
          <text x="10" y="70" font-size="7.5" fill="#fbbf24">• 存放在 gcw (工作队列) 等待并发工作者消费</text>
        </g>

        <g transform="translate(560, 0)">
          <rect width="270" height="95" rx="4" fill="#1e293b" stroke="#10b981"/>
          <text x="10" y="20" font-size="9" font-weight="700" fill="#34d399">⚫ 黑色对象 (绝对存活)</text>
          <text x="10" y="38" font-size="7.5" fill="#86efac">• 自身存活，且其所有引用均已扫描完毕</text>
          <text x="10" y="54" font-size="7.5" fill="#86efac">• 强三色不变性：黑色对象绝不能直接指向白色！</text>
          <text x="10" y="70" font-size="7.5" fill="#34d399">• 混合写屏障 (Hybrid Write Barrier) 保证安全性</text>
        </g>
      </g>
    </g>

    <!-- Bottom: gctrace Anatomy (860px) -->
    <g transform="translate(20, 190)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="175" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="22" font-size="10.5" font-weight="700" fill="#1e40af">📊 GODEBUG=gctrace=1 日志精算与调优界线：</text>
      
      <g transform="translate(15, 36)">
        <rect width="830" height="40" rx="4" fill="#0f172a"/>
        <text x="12" y="24" font-family="ui-monospace, monospace" font-size="8" fill="#38bdf8">
          gc 18 @4.218s 2%: 0.045+1.2+0.038 ms clock, 0.36+0.85/1.1/0+0.30 ms cpu, 4-&gt;5-&gt;2 MB, 5 MB goal, 8 P
        </text>
      </g>

      <g transform="translate(15, 86)" font-size="8" fill="#334155">
        <text y="14">• <tspan font-weight="700" fill="#1e40af">0.045 + 1.2 + 0.038 ms</tspan>：STW 1 停顿 (45μs) + 并发标记 (1.2ms) + STW 2 停顿 (38μs)，STW 总停顿控制在亚毫秒级！</text>
        <text y="30">• <tspan font-weight="700" fill="#c2410c">4-&gt;5-&gt;2 MB</tspan>：GC 开始堆 4MB ──► 标记结束 5MB ──► 清扫后存活真实堆 2MB (垃圾回收率高达 60%)；</text>
        <text y="46">• <tspan font-weight="700" fill="#166534">GOMEMLIMIT (Go 1.19+)</tspan>：软内存上限，彻底解决 GOGC=100 在大内存容器下的 OOM 风险！</text>
      </g>
    </g>
  </g>
</svg>