<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">非对称计量权：客户端 Write vs 服务端 Read 测速失真真相</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">客户端 xhr.send() 仅代表写入本地 TCP 缓冲区 (瞬间完成产生 10Gbps 虚假飙升) ｜ 服务端真实 Read() 速率才是真实物理带宽！</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Client Write Trap -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 致命假象：客户端 onprogress 计量上行</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">xhr.upload.onprogress = (e) =&gt; {</text>
          <text y="28" fill="#fca5a5">  const speed = e.loaded / time; // 🔴 严重失真！</text>
          <text y="42" fill="#f87171">};</text>
          
          <text y="66" fill="#ef4444">🔴 物理机制真相：</text>
          <text y="80" fill="#ef4444">1. e.loaded 仅代表数据被 copy 进了操作系统发送缓冲区！</text>
          <text y="94" fill="#ef4444">2. 前 2 秒 64MB 数据瞬间填满内核 Buffer，测速虚标 5000Mbps！</text>
          <text y="108" fill="#ef4444">3. 随后缓冲区满触发 TCP 阻塞，速度断崖式跌至 0！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">恶劣后果：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 上行测速曲线剧烈锯齿状震荡；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 测速结果与用户实际网络严重不符；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 必须移交计量权至服务端！</text>
      </g>
    </g>

    <!-- Right: Server Read Authority -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 权威方案：服务端 Read 速率反向回传</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 服务端在 Socket 层统计真实到达字节数</text>
          <text y="28" fill="#86efac">bytesRead, duration := server.DrainBody(r.Body);</text>
          <text y="42" fill="#4ade80">w.Write(fmt.Sprintf("%.2f", realSpeedMbps));</text>
          
          <text y="66" fill="#38bdf8">1. 彻底剔除客户端发送缓冲区的虚假提前量</text>
          <text y="80" fill="#34d399">2. 真实反映跨越整个公网物理链路的实际吞吐</text>
          <text y="94" fill="#34d399">3. 曲线平滑如镜，测量精度达到工业 99.9% 准度！</text>
          
          <text y="118" fill="#4ade80">✓ LibreSpeed 与 Speedtest.net 权威标杆方案！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 树立无可辩驳的公信力；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 满足运营商宽带验收与 SLA 审计要求；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造严谨的测量科学工程！</text>
      </g>
    </g>
  </g>
</svg>