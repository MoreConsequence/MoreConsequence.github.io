<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="asymmetric-measurement-authority-flow-title asymmetric-measurement-authority-flow-desc">
        <title id="asymmetric-measurement-authority-flow-title">同一测试，两种可见性</title>
        <desc id="asymmetric-measurement-authority-flow-desc">Architecture diagram comparing the download path from the Go garbage handler to browser progress accounting with the upload path from browser upload progress to the Go empty sink, showing why a 200 response is not a reconciled byte count.</desc>
        <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;display=swap');</style>
          <style>
            .sans { font-family: 'Geist', 'Noto Sans KR', sans-serif; }
            .mono { font-family: 'Geist Mono', 'Noto Sans KR', monospace; }
            .serif { font-family: 'Instrument Serif', 'Noto Serif KR', serif; }
          </style>
          <marker id="librespeed-measurement-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
          </marker>
          <marker id="librespeed-measurement-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
          </marker>
          <marker id="librespeed-measurement-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />
          </marker>
        </defs>

        <rect width="960" height="600" fill="#f5f5f5" />

        <text x="40" y="40" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7a8399">LIBRESPEED GO · MEASUREMENT</text>
        <text x="40" y="72" class="serif" font-size="28" fill="#2d3142">同一测试，两种可见性</text>
        <text x="40" y="100" class="sans" font-size="12" fill="#4f5d75">下载看浏览器收到多少；上行看 Worker 发出多少，而 Go 端只读完请求体并返回 200。</text>
        <text x="40" y="124" class="mono" font-size="8" fill="#7a8399">completion ≠ byte authority · Worker aggregates dl / ul · no server-side reconciliation is returned</text>

        <!-- Ownership zones keep the two observation surfaces explicit. -->
        <rect x="40" y="152" width="344" height="380" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" />
        <rect x="424" y="152" width="496" height="380" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" />
        <rect x="52" y="156" width="112" height="12" rx="2" fill="#f5f5f5" />
        <text x="108" y="168" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.14em" fill="rgba(45,49,66,0.40)">BROWSER / MEASURE</text>
        <rect x="436" y="156" width="128" height="12" rx="2" fill="#f5f5f5" />
        <text x="500" y="168" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.14em" fill="rgba(45,49,66,0.40)">GO HTTP HANDLERS</text>

        <!-- Data paths first; the aggregation routes avoid the upload node and arrows. -->
        <path d="M 584,236 H 320" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#librespeed-measurement-arrow-link)" />
        <path d="M 320,396 H 584" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#librespeed-measurement-arrow-link)" />
        <path d="M 584,428 H 320" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#librespeed-measurement-arrow)" />
        <path d="M 144,276 V 296 Q 144,304 136,304 H 56 Q 48,304 48,312 V 448 Q 48,456 56,456 H 240 Q 248,456 248,464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#librespeed-measurement-arrow)" />
        <path d="M 208,436 V 456 Q 208,464 200,464 H 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#librespeed-measurement-arrow)" />

        <!-- Labels sit in the open inter-zone gap with opaque masks. -->
        <rect x="404" y="212" width="96" height="12" rx="4" fill="#f5f5f5" />
        <text x="452" y="220" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.06em" fill="#2e5aa8">BODY BYTES</text>
        <rect x="404" y="372" width="112" height="12" rx="4" fill="#f5f5f5" />
        <text x="460" y="380" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.06em" fill="#2e5aa8">REQUEST BODY</text>
        <rect x="424" y="404" width="56" height="12" rx="4" fill="#f5f5f5" />
        <text x="452" y="412" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.06em" fill="#4f5d75">200 OK</text>

        <!-- Browser-side observation nodes. -->
        <rect x="64" y="192" width="256" height="84" rx="6" fill="#f5f5f5" />
        <rect x="64" y="192" width="256" height="84" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1" />
        <rect x="76" y="200" width="72" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8" />
        <text x="112" y="212" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">OBSERVE</text>
        <text x="192" y="236" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Worker · download</text>
        <text x="192" y="256" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">xhr.onprogress → totLoaded → dlStatus</text>

        <rect x="64" y="352" width="256" height="84" rx="6" fill="#f5f5f5" />
        <rect x="64" y="352" width="256" height="84" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1" />
        <rect x="76" y="360" width="72" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8" />
        <text x="112" y="372" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">OBSERVE</text>
        <text x="192" y="396" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Worker · upload</text>
        <text x="192" y="416" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">xhr.upload.onprogress → ulStatus</text>

        <rect x="64" y="464" width="256" height="56" rx="6" fill="#f5f5f5" />
        <rect x="64" y="464" width="256" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" />
        <rect x="76" y="472" width="56" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" />
        <text x="104" y="484" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.08em" fill="#eb6c36">RESULT</text>
        <text x="192" y="508" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">client fields: dl / ul</text>

        <!-- Go-side endpoint nodes. -->
        <rect x="584" y="192" width="256" height="84" rx="6" fill="#f5f5f5" />
        <rect x="584" y="192" width="256" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <rect x="596" y="200" width="64" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8" />
        <text x="628" y="212" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">SOURCE</text>
        <text x="712" y="236" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">garbage handler</text>
        <text x="712" y="256" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">GET /backend/garbage.php · w.Write</text>

        <rect x="584" y="352" width="256" height="84" rx="6" fill="#f5f5f5" />
        <rect x="584" y="352" width="256" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <rect x="596" y="360" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8" />
        <text x="620" y="372" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">SINK</text>
        <text x="712" y="396" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">empty handler</text>
        <text x="712" y="416" class="mono" font-size="8" text-anchor="middle" fill="#4f5d75">POST /backend/empty.php · io.Copy(Discard)</text>

        <line x1="40" y1="556" x2="920" y2="556" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
        <text x="40" y="576" class="mono" font-size="8" letter-spacing="0.14em" fill="#4f5d75">LEGEND</text>
        <line x1="128" y1="572" x2="160" y2="572" stroke="#2e5aa8" stroke-width="1.2" />
        <text x="172" y="576" class="mono" font-size="8" fill="#4f5d75">byte path</text>
        <line x1="280" y1="572" x2="312" y2="572" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" />
        <text x="324" y="576" class="mono" font-size="8" fill="#4f5d75">status return</text>
        <rect x="472" y="564" width="8" height="16" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8" />
        <text x="492" y="576" class="mono" font-size="8" fill="#4f5d75">Worker-derived fields</text>
        <text x="704" y="576" class="mono" font-size="8" fill="#4f5d75">200 ≠ server byte count</text>
      </svg>
