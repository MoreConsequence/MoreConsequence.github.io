<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">缓冲区膨胀 (Bufferbloat) 灾难：为什么满载下载时游戏/通话彻底卡死？</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">家庭路由器为防止丢包配置超大 64MB 队列 ──► 满载推流将队列填满 ──► 关键语音/游戏包在队列死等 500ms ──► 产生恶性延迟劣化</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Bufferbloat Problem -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统超大 FIFO 队列：排队延迟失控</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">1. 用户全速开启迅雷/Steam 下载 (1000Mbps 吃满)</text>
          <text y="28" fill="#f87171">2. 路由器 64MB 缓冲区被 1500 字节大包死死塞满！</text>
          
          <text y="50" fill="#ef4444">3. 此时发起一个 64 字节的游戏按键包 (Ping):</text>
          <text y="66" fill="#ef4444">   必须在路由器队列排在 40,000 个大包之后！</text>
          
          <text y="90" fill="#ef4444">💥 结果：平时 10ms 的延迟瞬间暴涨至 850ms！</text>
          <text y="106" fill="#f87171">🔴 游戏直接掉线、腾讯会议/Zoom 严重机器人音！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 宽带速度虽快，但多任务并发体验极差；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 单纯扩大带宽无法解决根本问题；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须在测速中引入“工作负载延迟 (Loaded Latency)”！</text>
      </g>
    </g>

    <!-- Right: Cake/FQ-CoDel Solution -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 智能队列管理 (Cake / FQ-CoDel)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">FQ-CoDel 智能多流哈希公平调度算法：</text>
          
          <text y="36" fill="#38bdf8">1. 流量拆分: 识别出不同数据流 (Flows)</text>
          <text y="50" fill="#34d399">2. 稀疏流优先: 游戏/语音小包获得最高优先插队转发！</text>
          <text y="64" fill="#34d399">3. 主动丢包 (CoDel): 队列积压超过 5ms 立即主动标记 ECN</text>
          
          <text y="90" fill="#4ade80">✓ 满载下载时，游戏延迟依然稳稳保持在 12ms！</text>
          <text y="104" fill="#4ade80">✓ 彻底消灭 Bufferbloat 顽疾！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 现代路由器与 Linux 默认标配算法；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑 Cloudflare / LibreSpeed 评测宽带质量；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极致丝滑的网络体验！</text>
      </g>
    </g>
  </g>
</svg>