<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AbortSignal 取消真相：它只能管网络挂起，管不到已落地的副作用</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">controller.abort() 切断本地 HTTP 挂起 ──► 对端扣款/发货仍被成功处理 ──► 必须引入 Saga 补偿事务与幂等令牌</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: The Illusion -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 取消假象：以为 abort() 能回滚一切</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">const controller = new AbortController();</text>
          <text y="30" fill="#fca5a5">fetch('/api/pay', { signal: controller.signal });</text>
          <text y="46" fill="#f87171">controller.abort(); // 用户点击取消或超时</text>
          
          <text y="70" fill="#ef4444">🔴 物理真实交互过程：</text>
          <text y="86" fill="#fca5a5">1. 本地 Socket 收到 RST 抛出 AbortError 异常</text>
          <text y="102" fill="#fca5a5">2. 但 HTTP 请求报文早已完整抵达支付网关！</text>
          <text y="120" fill="#fb7185">3. 支付网关成功扣除 100 元，并入账完成！</text>
          <text y="136" fill="#ef4444">► 结果：客户端显示取消失败，用户钱却被扣走！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">副作用边界判定：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 只读操作 (GET)：AbortSignal 安全，直接丢弃无所谓；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 写操作 (POST/扣费/发邮件)：AbortSignal 绝不能保证原子回滚！</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严禁把 AbortSignal 当作分布式事务！</text>
      </g>
    </g>

    <!-- Right: Saga & Idempotency -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 生产闭环解法：幂等性 + 补偿事务 (Saga)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">1. 客户端生成全局唯一 idempotency_key</text>
          <text y="30" fill="#86efac">   fetch('/api/pay', { headers: { 'X-Idempotency-Key': id } })</text>
          
          <text y="52" fill="#38bdf8">2. 捕获 catch (err) if (err.name === 'AbortError'):</text>
          <text y="68" fill="#cbd5e1">   • 状态标记为 PENDING_CANCEL (取消中)</text>
          <text y="84" fill="#34d399">   • 触发后台 Saga 补偿反向任务：</text>
          <text y="100" fill="#4ade80">     POST /api/pay/cancel (带相同 idempotency_key)</text>
          
          <text y="122" fill="#34d399">3. 服务端若已扣款则执行自动退款，未执行则直接丢弃！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">Agent 工具调用设计规范：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">1. 每个 Tool 定义必须提供配对的 compensate() 逆向动作；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">2. 状态机持久化 Tool 执行记录与 Transaction ID；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">3. 任何中断均自动按逆序执行补偿回滚！</text>
      </g>
    </g>
  </g>
</svg>