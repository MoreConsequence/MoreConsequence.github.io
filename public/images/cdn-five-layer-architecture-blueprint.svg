<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="cdn-blueprint-title cdn-blueprint-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="cdn-blueprint-title">现代 CDN 与边缘加速架构五层技术栈工程全景蓝图</title>
  <desc id="cdn-blueprint-desc">分层全景架构蓝图展示从 L1 物理任播、L2 四层终结清洗、L3 七层分层缓存、L4 动态覆盖网到 L5 边缘计算运行时的完整技术栈。</desc>
  <defs>
    <marker id="cdn-bp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="cdn-bp-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">CDN FULL STACK BLUEPRINT · 5-TIER ENGINEERING ARCHITECTURE</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">现代 CDN 与边缘加速架构五层全景蓝图</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">从物理光速约束到边缘沙箱计算，覆盖 Anycast 路由、eBPF 清洗、一致性哈希分片、动态选路与状态编排</text>

  <!-- Layer 5: Edge Computing (y=136..196, h=60) -->
  <g transform="translate(40, 136)">
    <rect width="880" height="60" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="12" y="14" width="34" height="32" rx="3" fill="#e85d3f"/>
    <text x="29" y="34" fill="#ffffff" font-size="12" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">L5</text>

    <text x="60" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">边缘计算与 Serverless 运行时 (Edge Computing &amp; State)</text>
    <text x="60" y="46" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">V8 Isolate 轻量沙箱 (微秒级冷启动) · Edge KV 只读就近 · Durable Objects (Raft 强一致) · HTMLRewriter 流式拼装</text>
    <text x="866" y="34" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">≤ 5ms 边缘自治</text>
  </g>

  <!-- Layer 4: DCA & Smart Routing (y=206..266, h=60) -->
  <g transform="translate(40, 206)">
    <rect width="880" height="60" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="14" width="34" height="32" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="29" y="34" fill="#141413" font-size="12" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">L4</text>

    <text x="60" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">动态请求加速与智能覆盖网 (DCA &amp; Smart Overlay Routing)</text>
    <text x="60" y="46" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">预热多路复用连接池 (0-RTT 回源) · 动态加权 Dijkstra 毫秒级避障 · Brotli / HPACK / QPACK 头部字典压缩</text>
    <text x="866" y="34" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">时延暴降 67%</text>
  </g>

  <!-- Layer 3: L7 Caching & Consistent Hashing (y=276..336, h=60) -->
  <g transform="translate(40, 276)">
    <rect width="880" height="60" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="14" width="34" height="32" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="29" y="34" fill="#141413" font-size="12" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">L3</text>

    <text x="60" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">七层边缘分层存储与集群调度 (Layered Cache &amp; Consistent Hashing)</text>
    <text x="60" y="46" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">L1 内存 + L2 NVMe + L3 区域中心 · Ketama 一致性哈希 (160 虚拟槽) · Singleflight 请求合并 · RFC 5861 SWR</text>
    <text x="866" y="34" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">回源率 &lt; 1%</text>
  </g>

  <!-- Layer 2: L4 Transport & Security Mitigation (y=346..406, h=60) -->
  <g transform="translate(40, 346)">
    <rect width="880" height="60" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="14" width="34" height="32" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="29" y="34" fill="#141413" font-size="12" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">L2</text>

    <text x="60" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">四层传输终结与边缘安全清洗 (Transport Termination &amp; DDoS WAF)</text>
    <text x="60" y="46" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">TCP/TLS 4ms 极速终结 · eBPF/XDP 驱动层 40Mpps 丢包 · JA4 深度指纹 · 分布式滑动窗口令牌桶 · ACME 自动化</text>
    <text x="866" y="34" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">≥ 10Tbps 抗 D</text>
  </g>

  <!-- Layer 1: Physical & Anycast BGP (y=416..476, h=60) -->
  <g transform="translate(40, 416)">
    <rect width="880" height="60" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="14" width="34" height="32" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="29" y="34" fill="#141413" font-size="12" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">L1</text>

    <text x="60" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">物理网络与全球任播路由 (Physical Transit &amp; Anycast BGP Ingress)</text>
    <text x="60" y="46" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">全球 300+ PoP 共同宣告 · BGP AS-Path 最短路径吸附 · 跨洋海底光缆私网专线 · BBR 拥塞控制满速 Pacing</text>
    <text x="866" y="34" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">城域 4ms 接入</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="562" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="550" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">L1~L4 边缘网络与传输缓存基础设施</text>
  <rect x="420" y="550" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="440" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">L5 现代边缘无服务器计算运行层</text>
</svg>
