<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="consensus-redis-master-slave-failover-split-brain-title consensus-redis-master-slave-failover-split-brain-desc"><title id="consensus-redis-master-slave-failover-split-brain-title">Redis 异步复制与 Sentinel 故障切换丢锁脑裂拓扑</title><desc id="consensus-redis-master-slave-failover-split-brain-desc">拓扑架构图展示 Redis Master 在向 Slave 异步复制锁前宕机，Sentinel 提拔无锁 Slave 为新 Master 导致两个客户端同时持锁并发双写的致命缺陷。</desc>
  <defs>
    <marker id="ms-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="ms-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">REDIS ASYNC REPLICATION · FAILOVER LOCK LOSS HAZARD</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">Redis 异步复制与故障切换丢锁脑裂拓扑</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">Master 写入锁成功 ➔ 异步复制未达 Slave ➔ Master 宕机 ➔ Slave 晋升 ➔ Client 2 再次获锁 (双主持锁脑裂)</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="220" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#2d3142" stroke-width="1" />
    <text x="52" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CLIENTS</text>
    <text x="100" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">双客户端并发请求</text>

    
    <rect x="14" y="42" width="192" height="110" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Client 1 (已持锁)</text>
    <text x="24" y="84" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">SET lock:order uuid1 NX</text>
    <text x="24" y="100" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">向旧 Master 写入成功</text>
    <text x="24" y="118" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Status: Holding Lock ✓</text>
    <text x="24" y="136" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">正在执行临界区业务计算</text>

    
    <rect x="14" y="162" width="192" height="120" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="184" fill="#eb6c36" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Client 2 (新申请者)</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">SET lock:order uuid2 NX</text>
    <text x="24" y="222" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">向晋升后的新 Master 申请</text>
    <text x="24" y="240" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">新 Master 无此 key ➔ 获锁成功！</text>
    <text x="24" y="260" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">同时进入临界区执行写操作</text>

    
    <rect x="14" y="292" width="192" height="68" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="314" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">脑裂冲突结果</text>
    <text x="24" y="332" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">双客户端同时持锁并发双写！</text>
    <text x="24" y="348" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">互斥性保证彻底失效</text>
  </g>

  
  <line x1="260" y1="190" x2="300" y2="190" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ms-arr-accent)" />

  
  <g transform="translate(300, 136)">
    <rect width="330" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="96" height="18" rx="2" fill="none" stroke="#eb6c36" stroke-width="1" />
    <text x="62" y="25" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">REDIS NODES</text>
    <text x="120" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Redis 主从异步拓扑</text>

    
    <rect x="14" y="42" width="302" height="110" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <rect x="24" y="50" width="80" height="16" rx="2" fill="#eb6c36" />
    <text x="64" y="62" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">OLD MASTER</text>
    <text x="114" y="63" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Redis 节点 1 (崩溃前写成功)</text>
    <text x="24" y="86" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">Memory: key "lock:order" = uuid1</text>
    <text x="24" y="104" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">⚡ 异步复制未送出，机器突发掉电！</text>
    <text x="24" y="122" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">锁数据随着 Old Master 宕机而在集群中蒸发</text>
    <text x="24" y="140" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Repl Buffer: Empty / Dropped</text>

    
    <line x1="165" y1="152" x2="165" y2="182" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ms-arr-accent)" />
    <rect x="173" y="160" width="130" height="16" rx="2" fill="#f5f5f5" />
    <text x="238" y="172" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">异步复制延迟 (未同步！)</text>

    
    <rect x="14" y="190" width="302" height="170" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="24" y="198" width="90" height="16" rx="2" fill="#2d3142" />
    <text x="69" y="210" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">NEW MASTER</text>
    <text x="124" y="211" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Redis 节点 2 (Sentinel 提拔)</text>
    <text x="24" y="234" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Memory: key "lock:order" ➔ NOT FOUND</text>
    <text x="24" y="252" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">Sentinel 发现 Master 宕机，自动 Failover</text>
    <text x="24" y="270" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">Slave 成为新领袖，但内部无任何锁记录</text>
    <line x1="24" y1="282" x2="306" y2="282" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
    <text x="24" y="302" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Client 2 申请时直接授予锁！</text>
    <text x="24" y="322" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">AP 系统设计无法保证主从切换强一致</text>
    <text x="24" y="342" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Raft 共识系统 (etcd) 才能从根源避免</text>
  </g>

  
  <line x1="630" y1="280" x2="670" y2="280" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ms-arr-accent)" />

  
  <g transform="translate(670, 136)">
    <rect width="250" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#2d3142" stroke-width="1" />
    <text x="52" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STORAGE</text>
    <text x="100" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">数据库并发写入冲突</text>

    
    <rect x="14" y="42" width="222" height="160" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="10.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">MySQL / 共享业务存储</text>
    <text x="24" y="86" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">Client 1: Update(order, A)</text>
    <text x="24" y="104" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">Client 2: Update(order, B)</text>
    <line x1="24" y1="116" x2="226" y2="116" stroke="#eb6c36" stroke-width="1.2" />
    <text x="24" y="136" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">并发写冲突 / 脏数据覆盖！</text>
    <text x="24" y="156" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">锁服务失效导致后端数据</text>
    <text x="24" y="174" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">完全失去并发保护</text>

    
    <rect x="14" y="212" width="222" height="148" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="234" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">架构师防坑法则</text>
    <text x="24" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 严禁将 Redis 锁用于强资金</text>
    <text x="24" y="272" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">2. 资金扣减走数据库事务行锁</text>
    <text x="24" y="292" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">3. 强一致协调选 etcd Raft</text>
    <text x="24" y="312" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">4. 配合 Fencing Token 双重防护</text>
    <text x="24" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">End-to-End Safety Principle</text>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">正常业务与存储交互</text>
  <rect x="290" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="310" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">主从切换丢锁与脑裂冲突点</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
