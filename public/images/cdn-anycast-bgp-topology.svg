<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="topo-title topo-desc">
<title id="topo-title">Anycast BGP 广播与最短 AS-Path 边缘吸附拓扑</title>
<desc id="topo-desc">架构图：全球多 PoP 同播 198.51.100.0/24，BGP 按 AS-Path 最短选路将北京用户吸附至 PEK，展示 BGP Communities 与 AS-Prepending 的商业策略调优。</desc>
<defs>
