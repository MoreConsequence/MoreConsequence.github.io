<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%">
  <defs>
    <!-- Crisp Tech Editorial Filter -->
    <filter id="soft-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="focus-glow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>

    <!-- Markers: 正向定义契约 (No Manual Inversion) -->
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>

    <!-- Subtle Editorial Grid -->
    <pattern id="editorial-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#cbd5e1" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="960" height="550" fill="#ffffff"/>
  <rect width="960" height="550" fill="url(#editorial-grid)"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 24)">
    <text x="0" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#0f172a">
      全球 Anycast BGP 路由广播与最短 AS-Path 边缘吸附拓扑
    </text>
    <text x="0" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">
      同一 Anycast IP 全球多地宣告 · BGP 协议就近路由收敛 · 私有骨干专线回源
    </text>
  </g>

  <!-- 2. Region Stage Panels (Painter's Algorithm: 底板先画) -->
  <!-- Users Region -->
  <rect x="35" y="80" width="185" height="425" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">
    🌍 全球终端用户集群
  </text>

  <!-- ISP & BGP Mesh Region -->
  <rect x="245" y="80" width="210" height="425" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="260" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">
    🌐 运营商 BGP 选路网络
  </text>

  <!-- Anycast Edge PoPs Region -->
  <rect x="480" y="80" width="245" height="425" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#focus-glow)"/>
  <rect x="492" y="92" width="128" height="22" rx="4" fill="#2563eb"/>
  <text x="556" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    ⚡ Anycast 边缘 PoP
  </text>
  <text x="630" y="107" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#2563eb">
    198.51.100.1
  </text>

  <!-- Origin Shield Region -->
  <rect x="750" y="80" width="175" height="425" rx="10" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
  <text x="766" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#86198f">
    🏢 源站数据中心
  </text>

  <!-- 3. Connectors & Data Pipelines (连线层) -->
  <!-- Beijing Flow -->
  <path d="M 200 160 L 265 160" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <path d="M 430 160 L 495 160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Europe Flow -->
  <path d="M 200 280 L 265 280" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <path d="M 430 280 L 495 280" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- US Flow -->
  <path d="M 200 400 L 265 400" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <path d="M 430 400 L 495 400" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Backbone Backhaul Tunnels (Orange Accent) -->
  <path d="M 705 160 C 730 160, 735 240, 765 250" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-orange)"/>
  <path d="M 705 280 L 765 280" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-orange)"/>
  <path d="M 705 400 C 730 400, 735 320, 765 310" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-orange)"/>

  <!-- 4. Connector Badges & Labels (垂直上移 8px 防切线，加宽且留出充足内边距) -->
  <!-- Beijing Labels -->
  <rect x="204" y="144" width="60" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="234" y="157" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2563eb" font-weight="600" text-anchor="middle">
    DNS 解析
  </text>

  <rect x="434" y="144" width="62" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="465" y="157" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1d4ed8" font-weight="600" text-anchor="middle">
    1 跳 (4ms)
  </text>

  <!-- Europe Labels -->
  <rect x="434" y="264" width="62" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="465" y="277" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1d4ed8" font-weight="600" text-anchor="middle">
    2 跳 (8ms)
  </text>

  <!-- US Labels -->
  <rect x="434" y="384" width="62" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="465" y="397" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1d4ed8" font-weight="600" text-anchor="middle">
    1 跳 (3ms)
  </text>

  <!-- Backbone Label (加宽至 80px，彻底避免 6 汉字文字触碰边框) -->
  <rect x="696" y="270" width="80" height="18" rx="3" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <text x="736" y="283" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#c2410c" font-weight="600" text-anchor="middle">
    私网专线回源
  </text>

  <!-- 5. Node Entity Cards (Actor Cards: 顶层绘制，尺寸加宽，留足安全呼吸空间) -->
  <!-- User 1: Beijing -->
  <g transform="translate(50, 130)" filter="url(#soft-shadow)">
    <rect width="150" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">🇨🇳 北京用户端</text>
    <text x="14" y="46" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">AS4837 (中国联通)</text>
  </g>

  <!-- User 2: Frankfurt -->
  <g transform="translate(50, 250)" filter="url(#soft-shadow)">
    <rect width="150" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">🇩🇪 法兰克福用户端</text>
    <text x="14" y="46" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">AS3320 (DTAG)</text>
  </g>

  <!-- User 3: San Jose -->
  <g transform="translate(50, 370)" filter="url(#soft-shadow)">
    <rect width="150" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">🇺🇸 硅谷用户端</text>
    <text x="14" y="46" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">AS7922 (Comcast)</text>
  </g>

  <!-- BGP Routers -->
  <g transform="translate(265, 130)" filter="url(#soft-shadow)">
    <rect width="165" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">北京骨干路由器</text>
    <text x="14" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#059669">BGP 宣告: AS-Path=1</text>
  </g>

  <g transform="translate(265, 250)" filter="url(#soft-shadow)">
    <rect width="165" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">DE-CIX 交换中心</text>
    <text x="14" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#059669">BGP 宣告: AS-Path=2</text>
  </g>

  <g transform="translate(265, 370)" filter="url(#soft-shadow)">
    <rect width="165" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Equinix 交换中心</text>
    <text x="14" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#059669">BGP 宣告: AS-Path=1</text>
  </g>

  <!-- Anycast Edge PoPs (加宽至 205px) -->
  <g transform="translate(498, 125)" filter="url(#focus-glow)">
    <rect width="205" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="14" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">⚡ PEK-PoP (北京机房)</text>
    <text x="14" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">四层 TCP 终结 + L7 缓存</text>
    <text x="14" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#059669">RTT: ~3ms (命中率 95%)</text>
  </g>

  <g transform="translate(498, 245)" filter="url(#focus-glow)">
    <rect width="205" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="14" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">⚡ FRA-PoP (法兰克福)</text>
    <text x="14" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">四层 TCP 终结 + L7 缓存</text>
    <text x="14" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#059669">RTT: ~5ms (命中率 92%)</text>
  </g>

  <g transform="translate(498, 365)" filter="url(#focus-glow)">
    <rect width="205" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="14" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">⚡ SJC-PoP (硅谷机房)</text>
    <text x="14" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">四层 TCP 终结 + L7 缓存</text>
    <text x="14" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#059669">RTT: ~2ms (命中率 96%)</text>
  </g>

  <!-- Origin Server Card -->
  <g transform="translate(768, 230)" filter="url(#soft-shadow)">
    <rect width="140" height="100" rx="8" fill="#ffffff" stroke="#d946ef" stroke-width="1.8"/>
    <text x="14" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#701a75">🏢 弗吉尼亚源站</text>
    <text x="14" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">IAD DC (US-East)</text>
    <text x="14" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">动态业务 API 计算</text>
    <text x="14" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#a21caf">真实数据库存储</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(40, 520)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#2563eb" stroke-width="2.5"/>
    <text x="32" y="4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">公网 BGP Anycast 就近流量</text>

    <line x1="220" y1="0" x2="244" y2="0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="252" y="4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">CDN 内部私有骨干专网（长连接池）</text>

    <rect x="520" y="-8" width="12" height="12" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="540" y="4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">边缘就近吸附节点（同 IP 宣告）</text>
  </g>
</svg>
