<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 引擎纵深防御三层安全防护体系 (Defense-in-Depth)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 静态 AST 语法树风险规则过滤 ──► 2. Linux Bubblewrap / Docker 硬件级沙箱隔离 ──► 3. 敏感高危操作交互式人工确认 (HITL)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 静态 AST 命令语法审查</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">bash-parser AST 语义分析：</text>
          
          <text x="10" y="38" fill="#86efac">• 识别管道符、子 Shell 与环境变量注入</text>
          <text x="10" y="54" fill="#f87171">• 拦截破坏性指令 (如 rm -rf /, :(){ :|:&amp; };:)</text>
          <text x="10" y="70" fill="#ef4444">• 拦截敏感文件读取 (/etc/shadow, ~/.ssh)</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 毫秒级 0 成本第一道防线！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 静态拦截已知危险模式；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 阻止恶意 Prompt 注入诱导；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 极速过滤。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 内核级沙箱强隔离 (bwrap)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">Bubblewrap / Docker 隔离：</text>
          
          <text x="10" y="38" fill="#86efac">• 挂载命名空间: 仅绑定当前工程目录读写</text>
          <text x="10" y="54" fill="#38bdf8">• 根目录只读 (ro-bind /usr, /lib)</text>
          <text x="10" y="70" fill="#4ade80">• 禁用网络 (unshare-net) 彻底杜绝数据外传</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 即使逃逸也无法破坏宿主！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 依赖 Linux 内核 seccomp 与 cgroups；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 构筑铜墙铁壁般的物理隔离；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 终极安全支撑。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 人工在环审批 (HITL Guard)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">Human-in-the-Loop 机制：</text>
          
          <text x="10" y="38" fill="#fed7aa">• 涉及 git push / npm publish 等外部影响</text>
          <text x="10" y="54" fill="#38bdf8">• 强制暂停执行状态机 ──► 弹窗请求用户授权</text>
          <text x="10" y="70" fill="#4ade80">• 用户点击 [Allow] 方可继续推进！</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 人类工程师拥有最终绝对控制权！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 严守自主性与安全性的平衡红线；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 满足企业级严格合规与审计要求；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 资深工程必备安全底线！</text>
      </g>
    </g>
  </g>
</svg>