<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 引擎上下文预算分级与动态压缩流水线 (Context Compaction Pipeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 静态 System Prompt ──► 2. 长期记忆总结摘要 (Compacted Summary) ──► 3. 近期活跃消息滑动窗口 ──► 4. 严格受控在 128k Token 预算内</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 核心系统提示词层 (System Prompt Anchor: 10k Tokens)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">静态锁定模型角色、安全边界、可用 Tools 声明 ──► 利用 Provider Prompt Caching 达成 90% 降本加速</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">不可被驱逐的核心认知锚点！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 历史会话动态归纳压缩 (Recursive Background Compaction: 20k Tokens)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">当上下文超过 100k ──► 异步调用轻量模型将前 50 轮对话提炼为结构化关键事实摘要 ──► 消除 80% 冗余细节</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">以极小 Token 成本保留全生命周期关键决策上下文！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 近期活跃消息原生保留 (Recent Active Sliding Window: 30k Tokens)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">保留最近 10 轮原始用户输入与 Tool Call 完整结果 ──► 确保代码 Diff、错误堆栈等精细信息 100% 字节无损</text>
        <text x="15" y="62" font-size="8" fill="#047857">保障当前任务推理的最高精准度！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 输出预留与安全熔断护栏 (Output Reserve &amp; Hard Token Guard)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">严密预留 8k 响应生成空间 ──► 超过阈值触发自动截断与告警 ──► 绝不允许模型因 Context Window Overflow 崩溃！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">工业级 Agent 引擎无限长程任务运行基石！</text>
      </g>
    </g>
  </g>
</svg>