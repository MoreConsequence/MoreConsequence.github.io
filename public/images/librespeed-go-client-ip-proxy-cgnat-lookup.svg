      <line x1="424" y1="204" x2="464" y2="204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#librespeed-go-client-ip-proxy-cgnat-lookup-arrow)"/>
      <line x1="608" y1="204" x2="704" y2="204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#librespeed-go-client-ip-proxy-cgnat-lookup-arrow)"/>
      <line x1="536" y1="244" x2="536" y2="284" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#librespeed-go-client-ip-proxy-cgnat-lookup-arrow)"/>
      <path d="M464 324 H304 Q296 324 296 332 V408 Q296 416 288 416 H272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#librespeed-go-client-ip-proxy-cgnat-lookup-arrow)"/>
