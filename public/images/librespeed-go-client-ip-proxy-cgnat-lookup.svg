<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="librespeed-go-client-ip-proxy-cgnat-lookup-title librespeed-go-client-ip-proxy-cgnat-lookup-desc"><title id="librespeed-go-client-ip-proxy-cgnat-lookup-title">从请求到展示：候选 IP 的两条后续路径</title><desc id="librespeed-go-client-ip-proxy-cgnat-lookup-desc">Flowchart showing getIP selecting a candidate IP, short-circuiting on a special address, and otherwise using the isp flag and the API-to-mmdb fallback before rendering the result.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');</style>
        <marker id="librespeed-go-client-ip-proxy-cgnat-lookup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="librespeed-go-client-ip-proxy-cgnat-lookup-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="librespeed-go-client-ip-proxy-cgnat-lookup-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <text x="40" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">LIBRESPEED GO · /GETIP</text>
      <text x="40" y="92" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">从请求到展示：候选 IP 的两条后续路径</text>
      <text x="40" y="120" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">先按五级链取得候选值，再由 classifyPrivateIP 决定是否继续查询 ISP</text>

