      <text x="868" y="401" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="632" y="392" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="652" y="401" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

