      <line x1="768" y1="352" x2="768" y2="376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#librespeed-go-client-ip-proxy-cgnat-lookup-arrow)"/>
      <path d="M840 416 H896 Q904 416 904 424 V492 Q904 500 896 500 H880" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#librespeed-go-client-ip-proxy-cgnat-lookup-arrow)"/>
      <path d="M696 416 H616 Q608 416 608 424 V480 Q608 488 600 488 H168 Q160 488 160 480 V460" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#librespeed-go-client-ip-proxy-cgnat-lookup-arrow)"/>

