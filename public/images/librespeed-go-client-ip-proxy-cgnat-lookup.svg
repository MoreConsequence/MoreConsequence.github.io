      <text x="632" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="404" y="300" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
