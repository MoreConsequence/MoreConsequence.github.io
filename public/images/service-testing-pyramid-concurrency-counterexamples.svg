<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">测试值多少钱：先把并发反例与失败注入写进自动化断言</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">不仅要测 1+1=2 的正常分支 ｜ 更要把 100 并发重试、数据库超时断开、网络乱序写入断言作为核心防线</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 单元测试：纯函数与状态机</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 纯内存无 Mock 极速执行</text>
          <text x="10" y="34" fill="#93c5fd">1. 表格驱动测试 (Table-Driven Tests)</text>
          <text x="10" y="50" fill="#93c5fd">2. 覆盖所有边界输入 (0, NaN, 溢出)</text>
          <text x="10" y="68" fill="#34d399">3. FSM 状态机全状态迁移路径遍历</text>
          <text x="10" y="88" fill="#4ade80">✓ 执行耗时 &lt; 1 秒，每次保存秒级反馈！</text>
          <text x="10" y="104" fill="#38bdf8">✓ 奠定业务核心算法的底层基石。</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 业务逻辑与 I/O 严格解耦；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 单元测试数量占比 70% 以上；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极速的本地研发反馈循环。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 并发反例断言 (Race &amp; Chaos)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 构造极端并发与故障断言</text>
          <text x="10" y="34" fill="#86efac">go test -race -count=50</text>
          <text x="10" y="50" fill="#38bdf8">1. 100 协程并发扣同一账户余额</text>
          <text x="10" y="66" fill="#34d399">   • 断言余额严格扣减，0 超扣！</text>
          <text x="10" y="82" fill="#fb923c">2. 模拟 RPC 超时中途取消 Context</text>
          <text x="10" y="98" fill="#f87171">   • 断言 0 孤儿任务泄漏，0 锁残留！</text>
          <text x="10" y="116" fill="#4ade80">✓ 逼出所有隐蔽的分布式并发死锁！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 拒绝只测理想环境；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 把生产事故现场直接搬进集成测试用例；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高韧性的微服务系统。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 容器化真环境测试 (Testcontainers)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 抛弃脆弱易失真的 In-Memory Mock</text>
          <text x="10" y="34" fill="#fed7aa">1. Testcontainers 启动真实 MySQL/Redis</text>
          <text x="10" y="50" fill="#fed7aa">2. 验证真实 SQL 索引命中与行锁行为</text>
          <text x="10" y="68" fill="#38bdf8">3. 执行真实分布式事务与 CDC 监听</text>
          <text x="10" y="90" fill="#34d399">✓ 本地测试环境与生产环境 100% 行为一致！</text>
          <text x="10" y="106" fill="#4ade80">✓ 告别 "在我的机器上是好的" 世纪难题！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 将集成测试成本降低至单机自动化运行；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 彻底消灭 Mock 与真库行为偏差引发的线上惨案；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 资深工程师最强有力的质量护城河！</text>
      </g>
    </g>
  </g>
</svg>