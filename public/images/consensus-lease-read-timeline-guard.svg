<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="400" fill="#f8fafc"/>
  <rect width="960" height="400" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Raft Lease Read 租约读生命周期与时钟漂移防御时间轴</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">心跳 Quorum 成功即续租 Lease ｜ 租约期严格小于选举超时 (Lease &lt; ElectionTimeout) ｜ 杜绝旧 Leader 读到脏数据</text>
  </g>

  <!-- 3 Stage Timeline Cards -->
  <g transform="translate(40, 80)" filter="url(#card-shadow)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="270" height="260" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="270" height="34" rx="8" fill="#f0fdf4"/>
      <text x="135" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. 心跳确认与租约生效 (t0)</text>

      <g transform="translate(15, 50)" font-family="ui-monospace, monospace" font-size="8.5">
        <rect width="240" height="190" rx="4" fill="#0f172a"/>
        <text x="10" y="24" fill="#4ade80">• Leader 心跳获多数派响应</text>
        <text x="10" y="48" fill="#38bdf8">• 授予租约有效期: [t0, t0 + 200ms]</text>
        <text x="10" y="74" fill="#cbd5e1">• 本地极速读 0 网络开销</text>
        <text x="10" y="100" fill="#4ade80">• 状态: LEASE_ACTIVE</text>
        <text x="10" y="128" fill="#cbd5e1">• 吞吐暴增 10 倍！</text>
        <text x="10" y="160" fill="#4ade80">✓ 黄金加速区间</text>
      </g>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(305, 0)">
      <rect width="270" height="260" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
      <rect width="270" height="34" rx="8" fill="#fff7ed"/>
      <text x="135" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 网络隔离与租约倒计时</text>

      <g transform="translate(15, 50)" font-family="ui-monospace, monospace" font-size="8.5">
        <rect width="240" height="190" rx="4" fill="#0f172a"/>
        <text x="10" y="24" fill="#fb923c">• 突发网络分区隔离</text>
        <text x="10" y="48" fill="#cbd5e1">• Leader 无法续签下期心跳</text>
        <text x="10" y="74" fill="#fb923c">• 租约剩余时间单调递减</text>
        <text x="10" y="100" fill="#cbd5e1">• 选举超时阈值: 500ms</text>
        <text x="10" y="128" fill="#38bdf8">• 新 Leader 尚未诞生</text>
        <text x="10" y="160" fill="#4ade80">✓ 此时读取仍绝对安全</text>
      </g>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(610, 0)">
      <rect width="270" height="260" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="270" height="34" rx="8" fill="#fef2f2"/>
      <text x="135" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">3. 租约归零与硬降级 (t &gt; t0+200ms)</text>

      <g transform="translate(15, 50)" font-family="ui-monospace, monospace" font-size="8.5">
        <rect width="240" height="190" rx="4" fill="#0f172a"/>
        <text x="10" y="24" fill="#f87171">• 租约时间严格耗尽归零</text>
        <text x="10" y="48" fill="#fca5a5">• 强制拒绝本地读！</text>
        <text x="10" y="74" fill="#cbd5e1">• 自动退化为 ReadIndex 查心跳</text>
        <text x="10" y="100" fill="#ef4444">• 新分区新 Leader 安全选出</text>
        <text x="10" y="128" fill="#4ade80">• 0 脑裂、0 读脏数据！</text>
        <text x="10" y="160" fill="#4ade80">✓ 严密安全底线</text>
      </g>
    </g>
  </g>
</svg>
