<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">主动队列管理 (AQM) 决策模型：CoDel 驻留时间 (Sojourn Time) 判定</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">每个数据包记录入队时间戳 ──► 计算排队驻留耗时 ──► 超过 target (5ms) 且持续 interval (100ms) ──► 触发 ECN 拥塞通告或丢包</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 数据包入队打标 (Enqueue Timestamping: t_enqueue)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">数据包进入队列 ──► 内核记录纳秒级入队时间戳 skb-&gt;tstamp = ktime_get()</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">精确追踪每一个网络包在路由器内部的等待寿命！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 出队驻留时间核算 (Sojourn Time = t_dequeue - t_enqueue)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">数据包即将发射时计算实际排队耗时 ──► 若 Sojourn &lt; 5ms，说明队列健康，立即放行</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">以排队时延而非队列长度作为核心控制目标！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 拥塞状态机触发 (Persistent Queue State: 100ms)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">若连续 100ms 内所有包的驻留时间均超过 5ms ──► 判定发生了恶性 Bufferbloat 拥塞！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">坚决区分瞬时突发与持续性恶性积压！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. ECN 标记与控制丢包 (ECN Marking / Controlled Drop)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">设置 IP 头 CE 标志位 ──► 迫使发送端 TCP 立即主动缩减 cwnd ──► 队列瞬间抽空并恢复 5ms 极速！</text>
        <text x="15" y="62" font-size="8" fill="#047857">数学级精妙的主动拥塞控制艺术！</text>
      </g>
    </g>
  </g>
</svg>