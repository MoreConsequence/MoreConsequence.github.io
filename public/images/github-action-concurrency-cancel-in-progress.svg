<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="github-action-concurrency-cancel-in-progress-title github-action-concurrency-cancel-in-progress-desc"><title id="github-action-concurrency-cancel-in-progress-title">GitHub Actions 并发控制组：concurrency group 与 cancel-in-progress…</title><desc id="github-action-concurrency-cancel-in-progress-desc">GitHub Actions 并发控制组：concurrency group 与 cancel-in-progress 算力节约模型</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">CI/CD 并发流水线自动熔断优化 (cancel-in-progress)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">同一分支连续 Push 代码 (旧 Commit 的重型测试仍在浪费排队计算) vs concurrency group (自动秒级 cancel 旧 Run，算力 100% 聚焦最新提交)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 无并发控制：CI Runner 堆积与海量账单浪费</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">开发者在 5 分钟内连续 Push 3 次修正：</text>

          <text y="38" fill="#f5f5f5">无脑并行堆积：</text>
          <text y="52" fill="#f5f5f5">• Commit 1 的 20 分钟 E2E 测试仍在死板运行</text>
          <text y="68" fill="#f5f5f5">• Commit 2 紧接着霸占另一个 Runner 机器</text>
          <text y="84" fill="#f5f5f5">• 真正有意义的 Commit 3 被迫排队等待半小时！</text>

          <text y="106" fill="#f5f5f5">🔴 GitHub 算力分钟数急剧耗尽，开发反馈极其迟缓！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">典型后果：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 云端 CI 构建费用暴涨数倍；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 阻塞其他同事紧急 Hotfix 的 Runner 排队；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 必须规范并发组！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ concurrency group: 自动取消旧构建</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">concurrency:</text>
          <text y="28" fill="#f5f5f5">  group: ${{ github.workflow }}-${{ github.ref }}</text>
          <text y="42" fill="#f5f5f5">  cancel-in-progress: true</text>

          <text y="64" fill="#f5f5f5">极速智能流转：</text>
          <text y="78" fill="#f5f5f5">1. 新 Commit 3 到达 ──► 立即瞬间杀掉正在跑的 Commit 1 &amp; 2</text>
          <text y="92" fill="#f5f5f5">2. 立即将全部硬件资源调拨给最新代码！</text>

          <text y="114" fill="#f5f5f5">✓ 节省 70% CI 费用，反馈速度提升 300%！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 每一个工程师 PR 都能获得最高优先级资源响应；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 极佳的研发效能与成本控制规范；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 顶级工程实践标配！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
