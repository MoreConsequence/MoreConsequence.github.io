<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">丢包恢复双通道：3 冗余 ACK 快速重传 vs RTO 超时死等</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">快速重传 (收到 3 个重复 ACK 立即重传丢失包，耗时仅 1 个 RTT) vs RTO 超时重传 (管道彻底停滞死等 200ms+，且 cwnd 重置为 1)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: RTO Fallback -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ RTO 超时重传：管道彻底停滞死锁</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. 尾部数据包丢包 (Tail Drop)，后续无新包触发 ACK</text>
          <text y="28" fill="#ef4444">2. 发送端进入漫长的 RTO 定时器死等 (如 200ms~1000ms！)</text>
          
          <text y="50" fill="#ef4444">💥 定时器到期触发惩罚：</text>
          <text y="66" fill="#ef4444">1. 强行将拥塞窗口重置: cwnd = 1 (彻底推倒重来！)</text>
          <text y="82" fill="#ef4444">2. 重新进入慢启动爬坡阶段</text>
          <text y="98" fill="#f87171">3. 接口 P99 延迟离奇飙升数百毫秒！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 短连接或尾包丢失时的性能杀手；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 引发指数退避 (RTO × 2) 恶性卡顿；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须尽量通过 SACK / 快速重传解套！</text>
      </g>
    </g>

    <!-- Right: Fast Retransmit -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 快速重传 (Fast Retransmit &amp; SACK)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">连续收到 3 个相同的 Dup ACK: ack_seq = 100</text>
          
          <text y="38" fill="#86efac">极速自愈机制：</text>
          <text y="52" fill="#38bdf8">1. 发送端明确断定第 100 号包丢失，后续包已正常到达</text>
          <text y="66" fill="#34d399">2. 0 毫秒等待，立即重发第 100 号包！</text>
          <text y="80" fill="#34d399">3. 进入快速恢复 (Fast Recovery)，窗口不重置为 1！</text>
          
          <text y="106" fill="#4ade80">✓ 耗时仅需 1 个 RTT (10ms)，业务几乎 0 感知！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 维持物理管道持续高速流水线推流；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 配合 SACK 精准补发缺失空洞切片；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高弹性鲁棒网络！</text>
      </g>
    </g>
  </g>
</svg>