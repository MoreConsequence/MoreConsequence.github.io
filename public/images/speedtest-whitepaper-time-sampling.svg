<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="speedtest-whitepaper-time-sampling-title speedtest-whitepaper-time-sampling-desc">
<title id="speedtest-whitepaper-time-sampling-title">时间窗口先固定，统计量才有意义</title>
<desc id="speedtest-whitepaper-time-sampling-desc">时间图对比会跳变的墙上时钟与用于持续时间计算的平滑 elapsed clock，并展示测速的 grace、measurement、stop 窗口、200ms 更新和公式边界。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');</style><marker id="speedtest-whitepaper-time-sampling-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="speedtest-whitepaper-time-sampling-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="speedtest-whitepaper-time-sampling-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">MEASUREMENT · TIME</text>
<text x="40" y="76" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400" text-anchor="start">时间窗口先固定，统计量才有意义</text>
<text x="40" y="104" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">慢启动、时钟语义和统计选择是三个不同的问题，不能混成一个 P90 口号</text>
<text x="56" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.16em">CLOCKS · WINDOWS · SAMPLES</text><text x="72" y="190" fill="#7a8399" font-size="10" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">wall clock</text><path d="M176,184 H320 V168 H448 V192 H584 V176 H720 V184 H864" fill="none" stroke="#7a8399" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,4"/><text x="72" y="232" fill="#2e5aa8" font-size="10" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">elapsed clock</text><line x1="176" y1="224" x2="864" y2="224" fill="none" stroke="#2e5aa8" stroke-width="1.2"/><line x1="272" y1="216" x2="272" y2="232" fill="none" stroke="#2e5aa8" stroke-width="0.8"/><line x1="368" y1="216" x2="368" y2="232" fill="none" stroke="#2e5aa8" stroke-width="0.8"/><line x1="464" y1="216" x2="464" y2="232" fill="none" stroke="#2e5aa8" stroke-width="0.8"/><line x1="560" y1="216" x2="560" y2="232" fill="none" stroke="#2e5aa8" stroke-width="0.8"/><line x1="656" y1="216" x2="656" y2="232" fill="none" stroke="#2e5aa8" stroke-width="0.8"/><line x1="752" y1="216" x2="752" y2="232" fill="none" stroke="#2e5aa8" stroke-width="0.8"/><line x1="848" y1="216" x2="848" y2="232" fill="none" stroke="#2e5aa8" stroke-width="0.8"/><rect x="376" y="156" width="160" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="456" y="166" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">Date.now() can step</text><rect x="376" y="236" width="160" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="456" y="246" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">use elapsed duration</text><rect x="56" y="276" width="848" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><text x="72" y="300" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.16em">TEST WINDOW</text><rect x="176" y="320" width="184" height="32" rx="4" fill="#ececec" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><rect x="360" y="320" width="392" height="32" rx="4" fill="rgba(46,90,168,0.07)" stroke="#2e5aa8" stroke-width="0.8"/><rect x="752" y="320" width="112" height="32" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="268" y="341" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">grace / warm-up</text><text x="556" y="341" fill="#2e5aa8" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">measurement · totLoaded / elapsed</text><text x="808" y="341" fill="#eb6c36" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">stop / abort</text><text x="176" y="372" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">down 1.5s · up 3s</text><text x="552" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">Worker tick = 200ms</text><text x="864" y="372" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="end">time_auto</text><rect x="56" y="416" width="408" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><rect x="496" y="416" width="408" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="72" y="440" fill="#2d3142" font-size="12" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="600" text-anchor="start">speed = totLoaded / (t / 1000)</text><text x="72" y="464" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">Mbps = speed × 8 × factor ÷ unit</text><text x="512" y="440" fill="#eb6c36" font-size="12" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="600" text-anchor="start">P90 / median / mean</text><text x="512" y="464" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">统计量由问题决定；不是当前 Worker 的隐藏实现</text><line x1="40" y1="540" x2="920" y2="540" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="136" y="556" width="12" height="12" rx="2" fill="#7a8399" stroke="#7a8399" stroke-width="0.8"/><text x="156" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">WALL CLOCK RISK</text><rect x="368" y="556" width="12" height="12" rx="2" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="0.8"/><text x="388" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">ELAPSED WINDOW</text><rect x="584" y="556" width="12" height="12" rx="2" fill="#eb6c36" stroke="#eb6c36" stroke-width="0.8"/><text x="604" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">BOUNDARY / CHOICE</text>

</svg>
