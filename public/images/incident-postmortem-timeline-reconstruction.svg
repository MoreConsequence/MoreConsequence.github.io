<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">生产事故全景复盘四阶段时序模型 (Incident Evidence Timeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">T0 变更触发 ──► T1 监控报警 (MTTD: Mean-Time-To-Detect) ──► T2 止血隔离 (MTTR: Mean-Time-To-Mitigate) ──► T3 证据封存与根因定位</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. T0 触发点与变更引入 (T0: Root Trigger &amp; Release)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">14:02:15 灰度发布包含死锁隐患的 v2.4.1 版本 ──► 记录确切 Git Commit SHA 与发布人</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">精准锁定导致系统裂变的第一因！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. T1 报警触发与感知介入 (T1: Alert Fired &amp; MTTD: 3min)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">14:05:30 Prometheus 捕获 5xx 错误率 &gt; 1% ──► PagerDuty 电话呼叫值班 On-Call 工程师入群</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">衡量系统监控告警灵敏度与盲区防线的关键指标！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. T2 紧急止血与服务恢复 (T2: Rapid Mitigation &amp; Rollback)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">14:08:00 执行一键回滚 (Rollback to v2.4.0) ──► 流量摘除 ──► 14:10:00 业务大盘完全恢复绿标</text>
        <text x="15" y="62" font-size="8" fill="#047857">先止血再排查，绝对禁止在生产故障期间现场调试代码！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. T3 现场存证与五问根因分析 (T3: Evidence Preservation &amp; 5-Whys)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">封存 pprof dump、网络抓包与死锁日志 ──► 开展 5-Whys 根因分析 ──► 落实 CI 预防自动化 Action Items！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">将每一次事故转化为系统进化的顶级燃料！</text>
      </g>
    </g>
  </g>
</svg>