<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Oract 混沌可靠性实验室 (Chaos Engineering Lab) 故障注入矩阵</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. SIGKILL 随机瞬间强杀 ｜ 2. 磁盘写入 ENOSPC 模拟 ｜ 3. 网络分区与 100% 丢包 ｜ 4. 大模型 503 异常熔断与自愈验证</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 瞬间强杀 (SIGKILL)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">毫秒级断电模拟：</text>
          
          <text x="8" y="38" fill="#86efac">• 在 Tool 调用中途 kill -9</text>
          <text x="8" y="54" fill="#38bdf8">• 验证重启日志 0 损坏</text>
          <text x="8" y="70" fill="#34d399">• 验证断点续跑 100% 正确</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 证明抗崩溃韧性！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">验证指标：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 0 状态文件损坏；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 自动恢复时间 &lt; 5ms；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 钢铁防线。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 磁盘写满 (ENOSPC)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">存储满载注入：</text>
          
          <text x="8" y="38" fill="#86efac">• 模拟磁盘空间 0 字节可用</text>
          <text x="8" y="54" fill="#38bdf8">• 验证安全挂起而非乱改</text>
          <text x="8" y="70" fill="#34d399">• 腾挪空间后自动恢复运行</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 杜绝半写入脏数据！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">验证指标：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 保证原子回滚；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 优雅暂停并告警；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 存储安全。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 网络假死 (Timeout)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">黑洞丢包与超时：</text>
          
          <text x="8" y="38" fill="#fed7aa">• 注入 100% 丢包黑洞</text>
          <text x="8" y="54" fill="#38bdf8">• 验证指数退避重试触发</text>
          <text x="8" y="70" fill="#4ade80">• 验证备用模型秒级漂移</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 99.99% 可用性铁证！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 验证故障自愈闭环；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 杜绝死锁等待；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 网络高弹性。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. 双主脑裂 (Split-Brain)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">双主并发覆写注入：</text>
          
          <text x="8" y="38" fill="#e9d5ff">• 强行唤醒假死节点 A</text>
          <text x="8" y="54" fill="#f87171">• 验证 Fencing 令牌拦截</text>
          <text x="8" y="70" fill="#4ade80">• 验证数据 0 脏写破坏</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 分布式一致性铁壁！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">沉淀效益：</text>
        <text x="10" y="34" font-size="7.5" fill="#6b21a8">• 证明分布式算法严密性；</text>
        <text x="10" y="48" font-size="7.5" fill="#6b21a8">• 提供可量化混沌通过率；</text>
        <text x="10" y="62" font-size="7.5" fill="#6b21a8">• 工业级巅峰！</text>
      </g>
    </g>
  </g>
</svg>