<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Raft 健壮性演进：Pre-Vote 预投票机制与分区恢复 Term 暴增防御</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">孤立节点单相思自增 Term 达到 100 ──► 网络恢复瞬间废黜合法 Leader 造成集群震荡 ──► Pre-Vote 试探性拉票彻底平息风暴</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Without Pre-Vote -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 无 Pre-Vote：孤立节点打崩合法 Leader</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. Node E 被单向网络隔离，收不到心跳</text>
          <text y="28" fill="#fca5a5">2. Node E 每隔 150ms 选举超时，自增 Term:</text>
          <text y="44" fill="#f87171">   Term: 2 ──► 3 ──► 4 ──► ... ──► Term 50！</text>
          
          <text y="68" fill="#ef4444">3. 网络瞬间恢复，Node E 广播 RequestVote(Term=50)</text>
          <text y="84" fill="#ef4444">4. 合法 Leader(Term=2) 见高 Term 立即被迫退位为 Follower！</text>
          <text y="100" fill="#f87171">5. 但 Node E 日志落后根本选不上，引发集群剧烈反复震荡！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 业务读写中断数十秒；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 极易在跨机房弱网中发生幽灵降级；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 生产级 Raft 严禁裸奔！</text>
      </g>
    </g>

    <!-- Right: With Pre-Vote -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 引入 Pre-Vote：两阶段试探性拉票</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">1. Node E 选举超时先发起 Pre-Vote(Term=2, 不递增!)</text>
          <text y="28" fill="#86efac">2. 其它节点若在租约期内收到 Leader 心跳，直接拒绝 PreVote</text>
          <text y="44" fill="#38bdf8">3. Node E 收集不到多数派赞同，Term 维持 2 永远不膨胀！</text>
          
          <text y="68" fill="#34d399">4. 网络恢复后，Node E 默默作为 Follower 接收日志追赶</text>
          <text y="84" fill="#4ade80">✓ 现任合法 Leader 稳如泰山，业务读写 0 中断！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• etcd / TiKV / SOFA-JRaft 工业标配；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底免疫网络单向断联与抖动；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 共识系统高可用性的基石！</text>
      </g>
    </g>
  </g>
</svg>