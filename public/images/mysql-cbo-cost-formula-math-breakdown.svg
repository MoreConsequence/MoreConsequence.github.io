<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL 基于成本的优化器 (CBO) 数学计算模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Total Cost = I/O Cost (磁盘/BufferPool 页读取开销: 1.0) + CPU Cost (行比较与条件过滤开销: 0.2) ──► 选取总 Cost 最小的执行计划</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 全表扫描成本 (Table Scan Cost)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">Cost_scan = Pages * 1.0 + Records * 0.2</text>
          
          <text x="10" y="40" fill="#86efac">物理计算示例 (10,000 行 / 100 页):</text>
          <text x="10" y="56" fill="#cbd5e1">• I/O: 100 * 1.0 = 100.0</text>
          <text x="10" y="72" fill="#cbd5e1">• CPU: 10,000 * 0.2 = 2,000.0</text>
          <text x="10" y="88" fill="#4ade80">• Total Cost = 2,100.0</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 顺序大块连续读取基线！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 顺序 I/O 单页成本低；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 但 CPU 逐行扫描过滤代价随行数暴增；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 大表查询天敌。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 二级索引回表 (Index Lookup Cost)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">Cost_idx = Idx_Pages*1.0 + Match_Rows*1.2</text>
          
          <text x="10" y="40" fill="#86efac">回表计算示例 (命中 100 行 / 2 页):</text>
          <text x="10" y="56" fill="#38bdf8">• 索引 I/O: 2 * 1.0 = 2.0</text>
          <text x="10" y="72" fill="#34d399">• 回表随机 I/O: 100 * 1.0 = 100.0</text>
          <text x="10" y="88" fill="#4ade80">• CPU: 100 * 0.2 = 20.0 ──► Total = 122.0</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 成本 122 &lt; 2100 ──► 坚决选索引！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 过滤性高时索引优势极其巨大；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 每次回表产生一次聚簇索引随机跳跃；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 数据库性能生命线。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">3. 统计信息漂移误判 (Drift Pitfall)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">Cardinality 抽样严重偏低：</text>
          
          <text x="10" y="38" fill="#fca5a5">• 误以为该条件将命中 8,000 行</text>
          <text x="10" y="54" fill="#ef4444">• 估算回表成本: 8000 * 1.2 = 9,600 &gt; 2100</text>
          <text x="10" y="70" fill="#ef4444">• CBO 错误放弃索引，转而执行全表扫描！</text>
          
          <text x="10" y="100" fill="#f87171">🔴 SQL 查询耗时瞬间从 2ms 暴涨至 15s！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 导致数据库 CPU 100% 暴动与全站雪崩；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 必须 ANALYZE TABLE 或加 FORCE INDEX 抢救；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• DBA 重点排障阵地！</text>
      </g>
    </g>
  </g>
</svg>