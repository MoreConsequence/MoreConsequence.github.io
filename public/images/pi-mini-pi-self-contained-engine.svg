<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Mini-Pi 极简全栈架构：单文件 400 行自包含 Agent 引擎</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">LLM Provider 适配器 ──► Core Loop 状态机 ──► 4 基础工具集 (read, write, edit, bash) ──► JSONL 本地会话持久化</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. LLM Provider 极简封装 (50 行)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">fetch("https://api.openai.com/v1/chat/completions") ──► 处理 SSE 流式 chunks ──► 解析 ToolCall</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">零外部重型 SDK 依赖，纯原生 Node.js / Deno / Bun 即可直接运行！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 核心调度状态机 (Core Loop - 120 行)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">while(true) { const res = await llm.step(); if(res.done) break; await executeTool(res.tool); }</text>
        <text x="15" y="62" font-size="8" fill="#047857">包含最大步数限制 (MaxSteps=30)、死循环检测与 AbortController 取消中断！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 4 个基础工具实现 (read, write, edit, bash - 150 行)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">fs.readFileSync / writeFileSync + child_process.exec + 模糊字符串锚点替换算法</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">具备精准的文件修改与命令行执行能力，足以自主修复现实中的代码 Bug！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 会话树持久化与 CLI 交互 (80 行)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">fs.appendFileSync("session.jsonl") ──► readline 交互式输入 ──► 优雅高亮终端渲染</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">麻雀虽小五脏俱全，是学习和掌握 Agent 底层原理的最佳实践工程！</text>
      </g>
    </g>
  </g>
</svg>