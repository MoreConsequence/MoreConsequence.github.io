<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="node-package-managers-evolution-npm-yarn-pnpm-title node-package-managers-evolution-npm-yarn-pnpm-desc"><title id="node-package-managers-evolution-npm-yarn-pnpm-title">Node.js 包管理器三代演进：npm (嵌套大泥球) -&gt; Yarn (扁平化与幽灵依赖) -&gt; pnpm…</title><desc id="node-package-managers-evolution-npm-yarn-pnpm-desc">Node.js 包管理器三代演进：npm (嵌套大泥球) -&gt; Yarn (扁平化与幽灵依赖) -&gt; pnpm (硬链接内容寻址)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">JavaScript 包管理架构演进拓扑 (npm -&gt; Yarn -&gt; pnpm)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">第 1 代 npm 2 (深度嵌套, 路径超长) ──► 第 2 代 npm 3+ / Yarn (扁平化 Hoisting, 引发幽灵依赖与分身) ──► 第 3 代 pnpm (全局 CAS 硬链接 + 符号链接树)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. npm 2 (递归深度嵌套)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">node_modules/A/node_modules/B/...</text>

          <text x="10" y="38" fill="#f5f5f5">物理痛点：</text>
          <text x="10" y="54" fill="#f5f5f5">• 相同依赖在各个子目录被复制上百份</text>
          <text x="10" y="70" fill="#f5f5f5">• Windows 260 字符路径溢出直接报错</text>
          <text x="10" y="86" fill="#f5f5f5">• 安装耗时数十倍膨胀</text>

          <text x="10" y="114" fill="#f5f5f5">🔴 臭名昭著的 node_modules 黑洞！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">早期缺陷：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 磁盘空间极端浪费；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 目录树极度深邃且臃肿；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 倒逼社区全面重构架构！</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">2. npm 3+ / Yarn (扁平化 Hoist)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">所有二级依赖提升至根目录：</text>

          <text x="10" y="38" fill="#f5f5f5">幽灵依赖 (Phantom Dependency):</text>
          <text x="10" y="54" fill="#f5f5f5">• package.json 没声明却能直接 require()</text>
          <text x="10" y="70" fill="#f5f5f5">• 当上游依赖升级移除它时代码瞬间崩溃！</text>
          <text x="10" y="86" fill="#f5f5f5">• 多版本冲突导致依赖分身 (Doppelgangers)</text>

          <text x="10" y="114" fill="#f5f5f5">⚠️ 脆弱的扁平化假象！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 解决了嵌套路径，却带来了幽灵依赖；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 构建产物具有不确定性；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 过渡时期的妥协产物。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. pnpm (内容寻址硬链接)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">Global CAS Store + Symlinks:</text>

          <text x="10" y="38" fill="#f5f5f5">终极解决方案：</text>
          <text x="10" y="54" fill="#f5f5f5">• 全局磁盘仅存一份物理包 (节省 GB 空间)</text>
          <text x="10" y="70" fill="#f5f5f5">• 严格基于 package.json 构建软链接树</text>
          <text x="10" y="86" fill="#f5f5f5">• 彻底消灭幽灵依赖与多版本分身！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 安装提速 300%，严谨优雅！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 现代 Monorepo (Turborepo) 标配；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 兼具极致磁盘效率与严格类型契约；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 前端工程包管理终极形态！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
