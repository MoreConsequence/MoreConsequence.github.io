<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">JavaScript 包管理架构演进拓扑 (npm -&gt; Yarn -&gt; pnpm)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">第 1 代 npm 2 (深度嵌套, 路径超长) ──► 第 2 代 npm 3+ / Yarn (扁平化 Hoisting, 引发幽灵依赖与分身) ──► 第 3 代 pnpm (全局 CAS 硬链接 + 符号链接树)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. npm 2 (递归深度嵌套)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">node_modules/A/node_modules/B/...</text>
          
          <text x="10" y="38" fill="#fca5a5">物理痛点：</text>
          <text x="10" y="54" fill="#ef4444">• 相同依赖在各个子目录被复制上百份</text>
          <text x="10" y="70" fill="#ef4444">• Windows 260 字符路径溢出直接报错</text>
          <text x="10" y="86" fill="#f87171">• 安装耗时数十倍膨胀</text>
          
          <text x="10" y="114" fill="#f87171">🔴 臭名昭著的 node_modules 黑洞！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">早期缺陷：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 磁盘空间极端浪费；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 目录树极度深邃且臃肿；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 倒逼社区全面重构架构！</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. npm 3+ / Yarn (扁平化 Hoist)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">所有二级依赖提升至根目录：</text>
          
          <text x="10" y="38" fill="#fed7aa">幽灵依赖 (Phantom Dependency):</text>
          <text x="10" y="54" fill="#38bdf8">• package.json 没声明却能直接 require()</text>
          <text x="10" y="70" fill="#fb923c">• 当上游依赖升级移除它时代码瞬间崩溃！</text>
          <text x="10" y="86" fill="#f87171">• 多版本冲突导致依赖分身 (Doppelgangers)</text>
          
          <text x="10" y="114" fill="#fb923c">⚠️ 脆弱的扁平化假象！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 解决了嵌套路径，却带来了幽灵依赖；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 构建产物具有不确定性；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 过渡时期的妥协产物。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. pnpm (内容寻址硬链接)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">Global CAS Store + Symlinks:</text>
          
          <text x="10" y="38" fill="#86efac">终极解决方案：</text>
          <text x="10" y="54" fill="#38bdf8">• 全局磁盘仅存一份物理包 (节省 GB 空间)</text>
          <text x="10" y="70" fill="#4ade80">• 严格基于 package.json 构建软链接树</text>
          <text x="10" y="86" fill="#4ade80">• 彻底消灭幽灵依赖与多版本分身！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 安装提速 300%，严谨优雅！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 现代 Monorepo (Turborepo) 标配；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 兼具极致磁盘效率与严格类型契约；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 前端工程包管理终极形态！</text>
      </g>
    </g>
  </g>
</svg>