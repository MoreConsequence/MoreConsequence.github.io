    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. Token 预算 &lt;= 30,000 (成本受控)</text>
    <text x="24" y="118" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">3. 总耗时 &lt;= 120s (超限直接判负)</text>
