  <title id="ep-title">企业级 Agent 自动化评测流水线与 Pass@1 判定模型</title>
  <desc id="ep-desc">流程架构图展示从团队真实 PR 提取评测用例、在隔离沙箱中自动化运行与验证，以及结合 Pass@1 测试通过率与 Token 成本/时延硬约束的多维评测裁决模型。</desc>
  <defs>
