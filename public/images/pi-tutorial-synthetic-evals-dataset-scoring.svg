    <text x="24" y="82" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• Issue / PR 原始需求描述</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 待修复的 Base Commit 代码镜像</text>
