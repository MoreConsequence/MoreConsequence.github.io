<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 自动化 Evals 评测集构建与量化打分流水线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 历史故障提取合成 Case ──► 2. 沙箱并发批量跑任务 ──► 3. 运行隐藏单元测试 ──► 4. 统计 Pass@1、耗时、Token 并生成雷达图</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 评测集构建与用例注入 (Synthetic Dataset Formulation)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">从真实 Git 历史中提取 50 个经典 Bug 修复任务 ──► 注入初始脏代码与对应的验证测试脚本</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">高质量评测数据集基座！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 隔离沙箱并发驱动 (Parallel Headless Agent Execution)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">启动 16 个并发 Headless Pi 实例 ──► 各自独立执行完整 ReAct 循环 ──► 限制单任务 10 步与 $0.5 预算</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">快速完成海量用例全自动验证！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 隐藏测试用例断言打分 (Hidden Test Suite Assertion &amp; Scoring)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">向工作区静默注入隐藏测试用例并执行 ──► 严格判定 exitCode == 0 ──► 计算出真实客观的 Pass@1 指标</text>
        <text x="15" y="62" font-size="8" fill="#047857">杜绝代码过拟合与作弊！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 多维性能雷达图大盘沉淀 (Benchmark Analytics &amp; Regression Report)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">汇总通过率 92%、平均步数 5.4 步、单次成本 $0.18 ──► 指导下一代模型与提示词算法迭代！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">数据驱动 AI 工程进化的终极闭环！</text>
      </g>
    </g>
  </g>
</svg>