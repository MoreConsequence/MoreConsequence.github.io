<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="consistency-ladder-title consistency-ladder-desc"><title id="consistency-ladder-title">一致性阶梯示意图：从 TTL+容忍到直读数据库，越往上一致性与实现成本越高，缓存收益越稀薄</title><desc id="consistency-ladder-desc">一致性阶梯示意图：从 TTL+容忍到直读数据库，越往上一致性与实现成本越高，缓存收益越稀薄</desc>
  <defs>
    
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>

  
  <rect width="960" height="440" fill="#f5f5f5" />
  <rect width="960" height="440" fill="url(#dot-grid)" opacity="0" />

  
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分布式缓存一致性阶梯：成本、复杂度与收益衰减矩阵</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">一致性要求越高，系统复杂度呈指数上升，缓存带来的吞吐收益加速归零</text>
  </g>

  
  <g transform="translate(30, 75)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />

    
    <g transform="translate(25, 20)">
      <line x1="15" y1="235" x2="15" y2="15" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-blue)" />
      <text x="15" y="0" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="10.5" font-weight="700" fill="#4f5d75" text-anchor="middle">一致性强度 &amp; 实现成本 ↑</text>
    </g>

    
    <g transform="translate(70, 20)">
      
      <g transform="translate(0, 0)">
        <rect width="780" height="42" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="16" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75">第 5 阶：直读权威数据库 / 严格分布式锁</text>
        <text x="320" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#4f5d75">强一致（Linearizable）· 放弃一切缓存收益（“必须强一致”=“不该用缓存”）</text>
        <rect x="700" y="10" width="68" height="22" rx="4" fill="#ffffff" />
        <text x="734" y="25" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="10" font-weight="700" fill="#eb6c36" text-anchor="middle">收益归零</text>
      </g>

      
      <g transform="translate(0, 48)">
        <rect width="780" height="42" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="16" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75">第 4 阶：数据版本代数（Generation / ETag）比对</text>
        <text x="320" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#4f5d75">近强一致 · 读操作带版本比对，检测到落后强制重查源库，需全局版本生成器</text>
        <rect x="700" y="10" width="68" height="22" rx="4" fill="#ffffff" />
        <text x="734" y="25" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="10" font-weight="700" fill="#4f5d75" text-anchor="middle">吞吐减半</text>
      </g>

      
      <g transform="translate(0, 96)">
        <rect width="780" height="42" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="16" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142">第 3 阶：CDC (Canal/Debezium) 监听 Binlog 异步失效</text>
        <text x="320" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#4f5d75">最终一致 · 覆盖任何写路径，业务无侵入；代价是依赖 Kafka/Canal 基础设施链路</text>
        <rect x="700" y="10" width="68" height="22" rx="4" fill="#ffffff" />
        <text x="734" y="25" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="10" font-weight="700" fill="#4f5d75" text-anchor="middle">工业推荐</text>
      </g>

      
      <g transform="translate(0, 144)">
        <rect width="780" height="42" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="16" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75">第 2 阶：写后删缓存 + 读重建互斥（Singleflight）</text>
        <text x="320" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#2d3142">弱一致 · 根绝并发击穿与回源风暴；代码内聚，适合绝大部分高并发服务</text>
        <rect x="700" y="10" width="68" height="22" rx="4" fill="#ffffff" />
        <text x="734" y="25" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="10" font-weight="700" fill="#4f5d75" text-anchor="middle">高性价比</text>
      </g>

      
      <g transform="translate(0, 192)">
        <rect width="780" height="42" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="16" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142">第 1 阶：TTL 绝对生存期 + 容忍微量滞后（默认基石）</text>
        <text x="320" y="26" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#4f5d75">有界最终一致 · 零锁竞争、零外部协调、超万倍吞吐，90% 互联网业务停留于此</text>
        <rect x="700" y="10" width="68" height="22" rx="4" fill="#ffffff" />
        <text x="734" y="25" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="10" font-weight="700" fill="#4f5d75" text-anchor="middle">极限吞吐 🚀</text>
      </g>
    </g>

    
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
      <text x="430" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#4f5d75" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#2d3142">架构决策铁律：</tspan> 永远不要为了“假装强一致”引入复杂的分布式两阶段加锁；优先通过 <tspan font-weight="700" fill="#4f5d75">TTL + Singleflight + CDC 异步失效</tspan>，把不一致窗口收窄在业务容忍阈值内。
      </text>
      <text x="430" y="38" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#4f5d75" text-anchor="middle">
        （注：类似“延迟双删”仅将确定性竞态换成概率窗口，不建议作为生产核心依赖）
      </text>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
