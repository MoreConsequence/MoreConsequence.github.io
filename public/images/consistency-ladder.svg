<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#fafbff" stroke="#d7def0"/>

  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">一致性阶梯：越往上，缓存收益越稀薄，直到归零</text>

  <line x1="70" y1="370" x2="830" y2="370" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-x)"/>
  <text x="830" y="392" text-anchor="end" font-size="13" font-weight="600" fill="#475569">一致性 / 实现成本 →</text>
  <line x1="70" y1="370" x2="70" y2="70" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-y)"/>
  <text x="70" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">常见程度</text>

  <defs>
    <marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="90" y="330" width="720" height="40" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="110" y="355" font-size="14" font-weight="700" fill="#065f46">TTL + 容忍</text>
  <text x="330" y="355" font-size="13" fill="#065f46">最终一致，滞后有界——默认方案，绝大多数业务停在这里</text>

  <rect x="110" y="284" width="700" height="40" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="130" y="309" font-size="14" font-weight="700" fill="#1e40af">读重建互斥（singleflight）</text>
  <text x="380" y="309" font-size="13" fill="#1e40af">防击穿；配合写方锁可收窄竞态窗口</text>

  <rect x="130" y="238" width="680" height="40" rx="6" fill="#fefce8" stroke="#facc15"/>
  <text x="150" y="263" font-size="14" font-weight="700" fill="#854d0e">延迟双删</text>
  <text x="330" y="263" font-size="13" fill="#854d0e">把一个概率窗口换成另一个，临时缓解，不建议长期依赖</text>

  <rect x="150" y="192" width="660" height="40" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="170" y="217" font-size="14" font-weight="700" fill="#9a3412">CDC 主动失效</text>
  <text x="380" y="217" font-size="13" fill="#9a3412">数据库自己宣布变更，覆盖一切写路径，代价是基础设施</text>

  <rect x="170" y="146" width="640" height="40" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="190" y="171" font-size="14" font-weight="700" fill="#991b1b">版本号 + 互斥</text>
  <text x="380" y="171" font-size="13" fill="#991b1b">近强一致：每次读都比对版本，落后就重读</text>

  <rect x="190" y="100" width="620" height="40" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="210" y="125" font-size="14" font-weight="700" fill="#1e293b">直读数据库</text>
  <text x="380" y="125" font-size="13" fill="#1e293b">强一致，但放弃缓存收益——「必须强一致」的另一层意思是「不该用缓存」</text>

  <rect x="90" y="66" width="720" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="450" y="83" text-anchor="middle" font-size="12" fill="#64748b">▲ 最常见 · 成本最低      ▼ 最罕见 · 成本最高（甚至为负收益）</text>
</svg>
