<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">校验引擎选型权衡：Zod 纯函数组合 vs Ajv JIT 代码生成吞吐对比</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Zod (极佳的 TS 开发者体验，QPS 12,000) vs Ajv (预编译原生 JS if 校验代码，QPS 120,000 适合极限网关)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Zod：极致开发者体验 (DX King)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// 优雅的链式纯函数组合 API</text>
          <text y="28" fill="#86efac">z.object({ name: z.string().min(3) })</text>
          
          <text y="50" fill="#34d399">核心优势：</text>
          <text y="64" fill="#cbd5e1">• 零构建步骤，纯原生 TypeScript 代码</text>
          <text y="78" fill="#cbd5e1">• z.infer 自动推导极其强大的静态类型</text>
          <text y="92" fill="#cbd5e1">• 错误信息对人类极度友好，开箱即用！</text>
          
          <text y="116" fill="#4ade80">✓ 适合业务层接口、CLI 工具与 Agent 开发！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 90% 的企业级 Web 应用与微服务后端；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 全栈 RPC 框架（tRPC）核心基石；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 极致提升团队研发效率。</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Ajv：极限吞吐性能之王 (Raw Speed)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 启动时将 JSON Schema 编译为原生 JS 代码</text>
          <text y="28" fill="#86efac">const validate = ajv.compile(schema);</text>
          
          <text y="50" fill="#34d399">性能奇迹：</text>
          <text y="64" fill="#cbd5e1">• 生成原生 if (typeof data.name !== 'string')</text>
          <text y="78" fill="#cbd5e1">• 彻底内联，V8 TurboFan JIT 优化极佳</text>
          <text y="92" fill="#cbd5e1">• 校验吞吐量高达 120,000 req/s（快 10 倍！）</text>
          
          <text y="116" fill="#4ade80">✓ 适合百万 QPS 边缘 API 网关与高性能中间件！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Fastify 默认底层校验引擎；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 万级长连接与实时流媒体计费网关；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造性能极限的基建工程！</text>
      </g>
    </g>
  </g>
</svg>