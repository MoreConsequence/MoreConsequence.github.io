<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">投机采样加速比理论模型：草稿长度 K 与接受率 α 的权衡曲线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">加速比 Speedup = (1 - α^(K+1)) / ((1 - α) * (1 + c*K)) ｜ 代码/总结等高确定性任务 α &gt; 0.8 实现 2.8x 峰值加速</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1: Low Acceptance -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 低接受率场景 (α &lt; 0.5)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// 高发散文学创作/逻辑谜题</text>
          <text x="10" y="34" fill="#fca5a5">• 草稿预测几乎每次在第 1 个字被拒</text>
          <text x="10" y="50" fill="#fca5a5">• 大模型验证开销 &gt; 产出 Token 数</text>
          <text x="10" y="68" fill="#ef4444">• 加速比: 0.95x (负优化！)</text>
          
          <text x="10" y="94" fill="#fb7185">治理策略：</text>
          <text x="10" y="108" fill="#cbd5e1">• 动态调整 K=1 或自动回退直推！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">边界特征：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• Draft 与 Target 词表对齐度差；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 采样温度 Temperature &gt; 1.0；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 需配置自适应门限开闭投机！</text>
      </g>
    </g>

    <!-- Col 2: Medium Acceptance -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. 中接受率场景 (0.6 &lt; α &lt; 0.8)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 通用对话与知识问答</text>
          <text x="10" y="34" fill="#93c5fd">• 最佳草稿步数: K = 3~4</text>
          <text x="10" y="50" fill="#86efac">• 平均每轮验证接受 2.3 个 Tokens</text>
          <text x="10" y="68" fill="#34d399">• 端到端加速比: 1.8x ~ 2.2x！</text>
          
          <text x="10" y="94" fill="#4ade80">✓ 兼顾计算开销与吞吐收益！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 工业生产环境中最普遍的稳态分布；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 70B 大模型首字延迟降低 50%；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高性价比用户体验。</text>
      </g>
    </g>

    <!-- Col 3: High Acceptance -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 高接受率场景 (α &gt; 0.85)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 代码补全、结构化 JSON 输出</text>
          <text x="10" y="34" fill="#86efac">• 语法模式极度固定，草稿极准！</text>
          <text x="10" y="50" fill="#86efac">• 设置 K = 5~7</text>
          <text x="10" y="68" fill="#34d399">• 端到端加速比: 2.8x ~ 3.6x！</text>
          
          <text x="10" y="94" fill="#4ade80">✓ 单步直接吐出 5+ 个 Tokens！</text>
          <text x="10" y="110" fill="#4ade80">✓ 体验极其丝滑震撼！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 编程助手 (Copilot) 类产品的杀手锏；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底消灭代码生成的停顿卡顿感；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造顶级编程智能体！</text>
      </g>
    </g>
  </g>
</svg>