<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">BPF 通信架构演进：Perf Event Buffer vs BPF RingBuffer 无锁环形队列</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Per-CPU 独立缓冲区 (内存严重浪费且跨核事件乱序) vs 全局共享 BPF RingBuffer (多核无锁原子预留，天然保序且节省 90% 内存)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Perf Event Array -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 BPF_MAP_TYPE_PERF_EVENT_ARRAY</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. 为每个 CPU 核心分配独立定长 Buffer (如 128 核)</text>
          <text y="30" fill="#fca5a5">2. 内存开销 = 128 * 4MB = 512MB (内存占用巨大！)</text>
          <text y="48" fill="#ef4444">3. 某单核突发高频事件时 Buffer 瞬间溢出丢包！</text>
          <text y="64" fill="#ef4444">4. 跨 CPU 核心事件无法保证全局时间因果序！</text>
          
          <text y="88" fill="#ef4444">🔴 恶果：用户态收集到的跟踪日志前后颠倒！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 多核 CPU 下内存浪费极其严重；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 用户态 epoll 轮询复杂度高；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法满足高吞吐严格定序要求！</text>
      </g>
    </g>

    <!-- Right: BPF RingBuffer -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 现代 BPF_MAP_TYPE_RINGBUF (Linux 5.8+)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">1. 所有 CPU 核心共享单个全局 RingBuffer (如 8MB)</text>
          <text y="30" fill="#86efac">2. bpf_ringbuf_reserve() 原子预留内存，0 内存复制！</text>
          <text y="48" fill="#38bdf8">3. 天然支持跨核全序排列 (Global Ordering)</text>
          <text y="64" fill="#34d399">4. 动态自适应水位，突发流量由所有核心弹性共享！</text>
          
          <text y="88" fill="#4ade80">✓ 内存开销直降 90%，且 0 事件乱序！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Cilium / Datadog 顶级监控底座标配；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 用户态 mmap 单次直读，0 系统调用开销；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代 Linux 内核无锁 IPC 的巅峰之作！</text>
      </g>
    </g>
  </g>
</svg>