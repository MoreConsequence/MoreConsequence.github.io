<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="k8s-service-iptables-linear-vs-ebpf-o1-routing-title k8s-service-iptables-linear-vs-ebpf-o1-routing-desc"><title id="k8s-service-iptables-linear-vs-ebpf-o1-routing-title">K8s Service 路由转发进化：iptables O(N) 链式线性遍历 vs Cilium eBPF O(1)…</title><desc id="k8s-service-iptables-linear-vs-ebpf-o1-routing-desc">K8s Service 路由转发进化：iptables O(N) 链式线性遍历 vs Cilium eBPF O(1) BPF 映射</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Kubernetes Service 转发性能演进：iptables O(N) vs eBPF O(1)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">iptables 规则链 (5,000 个 Service 产生 25,000 条顺序规则，每个包线性遍历耗时暴涨) ｜ eBPF (BPF Hash Map 毫秒 O(1) 直达)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ iptables 模式：大规模集群性能断崖</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// KUBE-SERVICES 顺序规则链</text>
          <text y="28" fill="#f5f5f5">-A KUBE-SERVICES -d 10.96.0.1/32 -j KUBE-SVC-XXX</text>
          <text y="42" fill="#f5f5f5">-A KUBE-SERVICES -d 10.96.0.2/32 -j KUBE-SVC-YYY</text>
          <text y="56" fill="#f5f5f5">... (线性排列 20,000+ 条规则！)</text>

          <text y="80" fill="#f5f5f5">🔴 物理瓶颈：</text>
          <text y="96" fill="#f5f5f5">1. 每个数据包必须从头到尾线性比对，CPU 软中断被打满！</text>
          <text y="112" fill="#fb7185">2. 每次 Pod 变动触发 iptables-restore 全量全表加锁刷新！</text>
          <text y="128" fill="#f5f5f5">► 刷新耗时达 10s+，期间内核网络锁死造成大量丢包！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产死穴：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 集群规模超过 1,000 个节点或 5,000 个服务时无法承载；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 导致首包延迟飙升，吞吐量严重受限；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 成为云原生超大规模落地的最大拦路虎！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ Cilium eBPF：内核 BPF Map O(1) 极速哈希</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// eBPF TC / XDP 挂载点程序</text>
          <text y="28" fill="#f5f5f5">struct bpf_map_def cilium_lb4_services</text>
          <text y="42" fill="#f5f5f5">svc = bpf_map_lookup_elem(&amp;cilium_lb4_services, &amp;ip);</text>

          <text y="66" fill="#f5f5f5">1. O(1) 哈希表查找：无论 10 个还是 10 万个服务，耗时恒定 50ns！</text>
          <text y="82" fill="#f5f5f5">2. 增量更新：Pod 上下线仅修改单一 Map Key，零锁阻塞！</text>
          <text y="98" fill="#f5f5f5">3. Socket 级重定向 (sockops): 绕过 TCP/IP 协议栈直接内存直连！</text>
          <text y="114" fill="#f5f5f5">✓ 网络吞吐提升 300%，时延降低 40%！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 彻底解耦服务数量与网络转发性能；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 支撑数万 Pod 的超大规模 Kubernetes 集群；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 现代云原生网络数据平面的终极方向！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
