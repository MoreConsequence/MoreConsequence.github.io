<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">线性一致性（Linearizability）数学定义与实时执行轨迹检验模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">操作必须在其调用（Invoke）与返回（Ok）物理时间窗口内的某一点生效，且读操作永远不能读到倒退的旧版本</text>
  </g>

  <!-- Main Content Card -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Timeline Coordinate (Top Half) -->
    <g transform="translate(40, 20)">
      <!-- Client 1: Write(x=1) -->
      <g transform="translate(0, 10)">
        <text x="0" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">客户端 1 (Write x=1):</text>
        <line x1="160" y1="16" x2="360" y2="16" stroke="#3b82f6" stroke-width="3"/>
        <circle cx="160" cy="16" r="4" fill="#2563eb"/>
        <text x="160" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#2563eb" text-anchor="middle">Invoke(w1)</text>

        <!-- Linearization Point -->
        <circle cx="280" cy="16" r="6" fill="#ea580c"/>
        <text x="280" y="6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c2410c" text-anchor="middle">线性生效点 ★</text>

        <circle cx="360" cy="16" r="4" fill="#2563eb"/>
        <text x="360" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#2563eb" text-anchor="middle">Ok(w1)</text>
      </g>

      <!-- Client 2: Concurrent Read(x) -->
      <g transform="translate(0, 60)">
        <text x="0" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">客户端 2 (并发 Read):</text>
        <line x1="220" y1="16" x2="420" y2="16" stroke="#10b981" stroke-width="3"/>
        <circle cx="220" cy="16" r="4" fill="#059669"/>
        <text x="220" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#059669" text-anchor="middle">Invoke(r)</text>

        <!-- Read point can see 0 or 1 -->
        <circle cx="330" cy="16" r="5" fill="#10b981"/>
        <text x="330" y="6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">读点 (可读 1)</text>

        <circle cx="420" cy="16" r="4" fill="#059669"/>
        <text x="420" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#059669" text-anchor="middle">Return 1 ✓</text>
      </g>

      <!-- Client 3: Stale Read Violation (Bug) -->
      <g transform="translate(0, 110)">
        <text x="0" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">客户端 3 (写完成后的读):</text>
        <line x1="450" y1="16" x2="620" y2="16" stroke="#ef4444" stroke-width="3"/>
        <circle cx="450" cy="16" r="4" fill="#dc2626"/>
        <text x="450" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#dc2626" text-anchor="middle">Invoke(r)</text>

        <circle cx="620" cy="16" r="4" fill="#dc2626"/>
        <text x="620" y="34" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">Return 0 ❌ (破坏线性一致性!)</text>
      </g>
    </g>

    <!-- Bottom Breakdown -->
    <g transform="translate(20, 185)">
      <rect width="860" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <g transform="translate(16, 12)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <text x="0" y="14" font-weight="700" fill="#0f172a">🎯 线性一致性的三大铁律（Knossos 算法检验依据）：</text>
        <text x="0" y="30" fill="#334155"><tspan font-weight="700" fill="#2563eb">1. 全序性（Total Order）：</tspan> 所有操作可以排列在一个全局单一时间轴上，且符合单机顺序规约；</text>
        <text x="0" y="46" fill="#334155"><tspan font-weight="700" fill="#ea580c">2. 实时性（Real-time Precedence）：</tspan> 若写操作 $W_1$ 在物理时间上已经返回 Ok，其后发起的任何读操作必须读到 $W_1$ 或更新的值！</text>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">一致性层级真谛：</tspan> 顺序一致性（Sequential）只要求所有节点看到相同的操作顺序；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">
        线性一致性（Linearizability）则进一步强制绑定了真实的物理时间窗口，是分布式领域最高级别的一致性黄金标准。
      </text>
    </g>
  </g>
</svg>
