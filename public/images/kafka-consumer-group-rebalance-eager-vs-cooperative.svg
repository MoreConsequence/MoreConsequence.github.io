<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Kafka 消费组 Rebalance 演进：Eager 全量停摆 vs Cooperative 渐进协作</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Eager 模式 (全员放弃 Partition，长达数分钟消费彻底停滞) ｜ CooperativeStickyAssignor (仅迁移变动分区，未受影响节点 0 停顿持续消费)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Eager Rebalance STW -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ Eager 再平衡：全量 Stop-The-World 停摆</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 当集群新加入 1 个 Consumer 实例时</text>
          <text y="28" fill="#fca5a5">1. GroupCoordinator 触发 Eager Rebalance</text>
          <text y="44" fill="#ef4444">2. 所有的 100 个 Consumer 必须同时放弃所有持有的分区！</text>
          <text y="60" fill="#ef4444">3. 全组消费瞬间彻底停摆 (STW 持续 30s ~ 5 分钟)！</text>
          <text y="78" fill="#f87171">4. 全体重新发送 JoinGroup / SyncGroup 请求</text>
          
          <text y="104" fill="#ef4444">🔴 恶果：消息积压瞬间破千万，甚至引发级联超时雪崩！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 单个 Consumer 网络抖动导致全组几百个节点跟着陪葬；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 业务高峰期自动扩容反而成为压垮系统的致命一击；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 传统 Kafka 最臭名昭著的性能杀手！</text>
      </g>
    </g>

    <!-- Right: Cooperative Rebalance -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Cooperative Sticky：渐进式协作无感平移</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">partition.assignment.strategy = CooperativeStickyAssignor</text>
          
          <text y="38" fill="#38bdf8">1. 第一轮: 仅计算需要迁移的分区 (如仅 2 个分区需调整)</text>
          <text y="54" fill="#86efac">   • 其余 98 个分区继续全速拉取消费，0 停顿！</text>
          
          <text y="78" fill="#34d399">2. 第二轮: 原持有者安全 Revoke 提交 Offset，新成员接管！</text>
          
          <text y="104" fill="#4ade80">✓ 98% 的业务流量完全无感，彻底终结 STW 噩梦！</text>
          <text y="120" fill="#34d399">✓ 支撑上万分区集群极速无缝动态扩缩容！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免了全组雪崩式的惊群效应；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 将 Rebalance 对业务的影响半径缩小 95% 以上；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 现代 Kafka 消费端必须升级的杀手级特性！</text>
      </g>
    </g>
  </g>
</svg>