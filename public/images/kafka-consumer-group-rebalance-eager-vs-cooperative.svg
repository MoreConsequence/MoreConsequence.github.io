<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="kafka-consumer-group-rebalance-eager-vs-cooperative-title kafka-consumer-group-rebalance-eager-vs-cooperative-desc"><title id="kafka-consumer-group-rebalance-eager-vs-cooperative-title">Kafka 消费组再平衡演进：Eager 全量 STW 停摆 vs Cooperative 渐进式协作再平衡</title><desc id="kafka-consumer-group-rebalance-eager-vs-cooperative-desc">Kafka 消费组再平衡演进：Eager 全量 STW 停摆 vs Cooperative 渐进式协作再平衡</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Kafka 消费组 Rebalance 演进：Eager 全量停摆 vs Cooperative 渐进协作</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Eager 模式 (全员放弃 Partition，长达数分钟消费彻底停滞) ｜ CooperativeStickyAssignor (仅迁移变动分区，未受影响节点 0 停顿持续消费)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ Eager 再平衡：全量 Stop-The-World 停摆</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 当集群新加入 1 个 Consumer 实例时</text>
          <text y="28" fill="#f5f5f5">1. GroupCoordinator 触发 Eager Rebalance</text>
          <text y="44" fill="#f5f5f5">2. 所有的 100 个 Consumer 必须同时放弃所有持有的分区！</text>
          <text y="60" fill="#f5f5f5">3. 全组消费瞬间彻底停摆 (STW 持续 30s ~ 5 分钟)！</text>
          <text y="78" fill="#f5f5f5">4. 全体重新发送 JoinGroup / SyncGroup 请求</text>

          <text y="104" fill="#f5f5f5">🔴 恶果：消息积压瞬间破千万，甚至引发级联超时雪崩！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产痛点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 单个 Consumer 网络抖动导致全组几百个节点跟着陪葬；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 业务高峰期自动扩容反而成为压垮系统的致命一击；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 传统 Kafka 最臭名昭著的性能杀手！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ Cooperative Sticky：渐进式协作无感平移</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">partition.assignment.strategy = CooperativeStickyAssignor</text>

          <text y="38" fill="#f5f5f5">1. 第一轮: 仅计算需要迁移的分区 (如仅 2 个分区需调整)</text>
          <text y="54" fill="#f5f5f5">   • 其余 98 个分区继续全速拉取消费，0 停顿！</text>

          <text y="78" fill="#f5f5f5">2. 第二轮: 原持有者安全 Revoke 提交 Offset，新成员接管！</text>

          <text y="104" fill="#f5f5f5">✓ 98% 的业务流量完全无感，彻底终结 STW 噩梦！</text>
          <text y="120" fill="#f5f5f5">✓ 支撑上万分区集群极速无缝动态扩缩容！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 避免了全组雪崩式的惊群效应；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 将 Rebalance 对业务的影响半径缩小 95% 以上；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 现代 Kafka 消费端必须升级的杀手级特性！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
