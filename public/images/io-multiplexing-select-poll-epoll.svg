<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Linux I/O 多路复用三大代际机制：select / poll vs epoll</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">O(N) 用户态/内核态全量拷贝与暴力轮询 vs epoll 内核红黑树 + 双向就绪链表 O(1) 回调激活</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Panes (285px each) -->
    <!-- Col 1: select -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. select (POSIX.1g, 1983)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// fd_set 位图机制</text>
          <text x="10" y="34" fill="#fca5a5">1. 硬编码 1024 上限 (FD_SETSIZE=1024)</text>
          <text x="10" y="48" fill="#fca5a5">2. 每次调用需将 1024 位图从用户态拷入内核</text>
          <text x="10" y="64" fill="#fca5a5">3. 内核 O(N) 线性遍历 1024 个 fd 检查就绪</text>
          <text x="10" y="80" fill="#fca5a5">4. 返回后再拷回用户态，用户态再次 O(N) 扫描！</text>
          <text x="10" y="102" fill="#ef4444">❌ 每次调用必须重置 fd_set (无状态)</text>
          <text x="10" y="118" fill="#ef4444">❌ C10K 时代彻底崩溃</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">复杂度与瓶颈：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 时间复杂度: O(N)</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 空间复杂度: 1024 bit 固定开销</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 并发连接一多，CPU 全部消耗在无用遍历上</text>
      </g>
    </g>

    <!-- Col 2: poll -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. poll (System V, 1986)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// pollfd 结构体数组链表</text>
          <text x="10" y="34" fill="#fed7aa">1. 解除了 1024 文件描述符数量硬限制</text>
          <text x="10" y="48" fill="#fed7aa">2. 将 events 与 revents 字段分离</text>
          <text x="10" y="64" fill="#f87171">3. 核心机制未变：依然每次将全量 pollfd 数组</text>
          <text x="10" y="80" fill="#f87171">   在用户态与内核态之间来回完整拷贝！</text>
          <text x="10" y="98" fill="#f87171">4. 内核依然 O(N) 遍历整个数组轮询</text>
          <text x="10" y="118" fill="#ef4444">❌ 10万连接活跃1个时，依然傻遍历10万次！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">复杂度与瓶颈：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 时间复杂度: 依然 O(N)</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 内存拷贝: 随 FD 数量线性增长</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 仅解决了上限，未解决核心性能开销</text>
      </g>
    </g>

    <!-- Col 3: epoll -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. epoll (Linux 2.5.44+, 现代标配)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 内核有状态三大原语</text>
          <text x="10" y="34" fill="#86efac">1. epoll_create: 创建 eventpoll 内核对象</text>
          <text x="10" y="48" fill="#86efac">2. epoll_ctl (ADD/MOD/DEL):</text>
          <text x="16" y="62">红黑树 (rbr) 维护关注集合，O(log N) 增删改</text>
          <text x="16" y="76">仅注册时拷贝一次，永不重复拷贝！</text>
          <text x="10" y="94" fill="#34d399">3. epoll_wait: 网卡中断触发 ep_poll_callback</text>
          <text x="16" y="108" fill="#34d399">将就绪 socket 直接挂入就绪链表 (rdllist)</text>
          <text x="10" y="126" fill="#38bdf8">► O(1) 仅返回真正就绪的事件，零无用遍历！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级霸权 (Nginx / Redis / Netty):</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 无论 10 万还是 100 万长连接，开销只取决于活跃事件数！</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支持边缘触发 (ET) 与水平触发 (LT) 灵活调度</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 彻底支撑起现代高并发互联网底层基础设施！</text>
      </g>
    </g>
  </g>
</svg>