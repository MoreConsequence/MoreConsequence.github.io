<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 性能革命：接口装箱堆逃逸 vs 泛型单态化 0 分配</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">interface{} 装箱 (值拷贝至堆 + 虚函数间接调用，无法内联) vs 泛型 [T any] (GC Shape 单态化内联，纯栈分配 0 内存开销)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Interface Boxing -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 interface{}：装箱堆逃逸与虚调用</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">func PrintVal(v any) { ... } // 接收空接口</text>
          
          <text y="38" fill="#ef4444">调用: PrintVal(100) 发生什么：</text>
          <text y="52" fill="#fca5a5">1. convT64: 在堆上为整数 100 分配 8 字节内存！</text>
          <text y="68" fill="#ef4444">2. 包装为 eface{_type: int, data: 堆地址}</text>
          <text y="84" fill="#ef4444">3. 内部方法调用通过 itab 间接寻址，编译器无法内联！</text>
          
          <text y="106" fill="#f87171">🔴 吞吐量受堆分配与 GC 严重拖累！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 泛型出现前 Go 性能优化的最大痛点；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 频繁装箱产生海量堆分配垃圾；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法享受编译器激进内联优化。</text>
      </g>
    </g>

    <!-- Right: Generics -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Go 1.18+ 泛型：GC Shape 单态化 0 分配</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">func PrintVal[T any](v T) { ... } // 泛型函数</text>
          
          <text y="38" fill="#86efac">调用: PrintVal[int](100) 编译优化：</text>
          <text y="52" fill="#38bdf8">1. 0 堆内存分配！整数 100 直接通过 CPU 寄存器传递</text>
          <text y="66" fill="#34d399">2. 编译器实施深度代码内联 (Inlining)</text>
          <text y="80" fill="#34d399">3. 消除所有运行时虚表查找与反射开销！</text>
          
          <text y="106" fill="#4ade80">✓ 耗时从 18.5ns 暴降至 0.3ns (快 60 倍)！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 现代化 Go 容器与工具库首选范式；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 兼具静态类型编译期安全与纯 C 级极限性能；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 语言十年一遇的架构飞跃！</text>
      </g>
    </g>
  </g>
</svg>