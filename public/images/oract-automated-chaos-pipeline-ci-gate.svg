<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Oract CI/CD 自动化混沌测试质量门禁流水线 (Chaos Gate)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 启动并发测试集群 ──► 2. 注入 1,000 轮随机 Chaos Monkey 强杀 ──► 3. 严格断言最终状态一致性 100% ──► 4. 绿色通过方可合并发版</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 并发执行环境准备 (Parallel Testcontainers &amp; Mock Services)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">拉起 32 个并发 Agent 任务实例 ──► 模拟复杂的长程代码重构与多文件编辑流程</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">高并发混沌压测基座！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 混沌猴子高频破坏注入 (Jepsen-Style Random Fault Injection)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">随机发送 kill -9、注入 500ms 随机延迟、破坏 TCP 连接、截断日志尾部未同步字节</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将生产环境可能发生的极端恶劣情况在 CI 中全量模拟！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 状态一致性形式化数学断言 (Invariant Assertions: 100% Replay Match)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">断言恢复后的 AgentState 与正常跑完全部流程的结果 100% 逐字节一致 ──► 0 脏数据、0 重复 Side Effect</text>
        <text x="15" y="62" font-size="8" fill="#047857">取得无可辩驳的质量铁证！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 生产级发布放行门禁 (Production Release Gate Cleared)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">连续通过 1,000 轮混沌测试 ──► 自动生成稳定性报告并签名放行 ──► 达成最高工程可信度！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代软件工程与耐久计算的终极胜利！</text>
      </g>
    </g>
  </g>
</svg>