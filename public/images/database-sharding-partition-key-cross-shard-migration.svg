<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">分库分表不是扩容：分片键选择、跨片查询与平滑双写迁移全流程</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">分片键选择 (Sharding Key) ｜ 跨分片聚合 (Scatter-Gather 广播代价) ｜ 四步平滑双写迁移 (双写 ──► 历史搬家 ──► 校验 ──► 读切新库)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 分片键设计与路由拓扑 (Sharding Key &amp; Routing)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">hash(user_id) % 1024 ──► 映射至 32 个分库 1024 张物理分表 (基因分片法嵌入 order_id 后 4 位)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">通过基因算法让用户 ID 与订单 ID 完美路由至同一分片，彻底消灭 90% 的跨分片广播查询！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 第一阶段：双写开启与异步历史数据回填 (Dual Write &amp; Backfill)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">应用层同时向 [旧单库] 与 [新分库分表] 双写 ──► 后台迁移脚本分页搬运 1 亿条存量历史数据</text>
        <text x="15" y="62" font-size="8" fill="#047857">读流量依然 100% 走旧单库，保证迁移过程对线上核心业务绝对零干扰、零风险！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 第二阶段：增量数据对账与全量校验比对 (Data Reconciliation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">校验脚本逐行比对旧库与新分表数据: SHA256(row_old) === SHA256(row_new) ──► 自动修复差异</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">持续比对直至双库数据一致性达到 100.000%，产出不可篡改的数据平移对账凭证！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 第三阶段：读流量灰度切新库 ──► 停写旧库 ──► 优雅收尾 (Cutover)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">动态配置中心灰度切换读流量 ──► 观察 48 小时 0 异常 ──► 下线旧库双写 ──► 成功支撑百倍容量！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">全流程用户无感知、业务不停机、支持随时秒级回滚，工业级大型数据迁移的标准范式！</text>
      </g>
    </g>
  </g>
</svg>