<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="database-sharding-partition-key-cross-shard-migration-title database-sharding-partition-key-cross-shard-migration-desc"><title id="database-sharding-partition-key-cross-shard-migration-title">分库分表工程实战：分片键选择、跨分片聚合查询与平滑双写数据迁移</title><desc id="database-sharding-partition-key-cross-shard-migration-desc">分库分表工程实战：分片键选择、跨分片聚合查询与平滑双写数据迁移</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分库分表不是扩容：分片键选择、跨片查询与平滑双写迁移全流程</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">分片键选择 (Sharding Key) ｜ 跨分片聚合 (Scatter-Gather 广播代价) ｜ 四步平滑双写迁移 (双写 ──► 历史搬家 ──► 校验 ──► 读切新库)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 分片键设计与路由拓扑 (Sharding Key &amp; Routing)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">hash(user_id) % 1024 ──► 映射至 32 个分库 1024 张物理分表 (基因分片法嵌入 order_id 后 4 位)</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">通过基因算法让用户 ID 与订单 ID 完美路由至同一分片，彻底消灭 90% 的跨分片广播查询！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. 第一阶段：双写开启与异步历史数据回填 (Dual Write &amp; Backfill)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">应用层同时向 [旧单库] 与 [新分库分表] 双写 ──► 后台迁移脚本分页搬运 1 亿条存量历史数据</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">读流量依然 100% 走旧单库，保证迁移过程对线上核心业务绝对零干扰、零风险！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. 第二阶段：增量数据对账与全量校验比对 (Data Reconciliation)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">校验脚本逐行比对旧库与新分表数据: SHA256(row_old) === SHA256(row_new) ──► 自动修复差异</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">持续比对直至双库数据一致性达到 100.000%，产出不可篡改的数据平移对账凭证！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 第三阶段：读流量灰度切新库 ──► 停写旧库 ──► 优雅收尾 (Cutover)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">动态配置中心灰度切换读流量 ──► 观察 48 小时 0 异常 ──► 下线旧库双写 ──► 成功支撑百倍容量！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">全流程用户无感知、业务不停机、支持随时秒级回滚，工业级大型数据迁移的标准范式！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
