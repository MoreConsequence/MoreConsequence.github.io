<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="dual-write-race-condition-disaster-title dual-write-race-condition-disaster-desc"><title id="dual-write-race-condition-disaster-title">分布式双写致命反模式：写 DB + 发 MQ 竞态时序导致数据永久撕裂</title><desc id="dual-write-race-condition-disaster-desc">分布式双写致命反模式：写 DB + 发 MQ 竞态时序导致数据永久撕裂</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">直接双写反模式 (Dual-Write Anti-Pattern) 灾难推演</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">先更库再发 MQ (发 MQ 失败导致下游丢消息) ｜ 先发 MQ 再更库 (更库失败回滚但消息已发出造成幽灵消费) ｜ 无法两全其美</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 先写 DB，再发 MQ：网络超时丢消息</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">1. 订单 DB 事务提交成功 (状态: 已支付)</text>
          <text y="28" fill="#f5f5f5">2. 随后调用 kafkaProducer.send() 发送支付事件</text>

          <text y="50" fill="#f5f5f5">突发网络抖动 / 节点断电 / OOM 重启：</text>
          <text y="64" fill="#f5f5f5">• MQ 消息发送失败 throw Exception！</text>
          <text y="78" fill="#f5f5f5">• 但此时 DB 事务已无法回滚！</text>
          <text y="92" fill="#f5f5f5">• 下游积分/发货服务永久收不到通知！</text>

          <text y="116" fill="#f5f5f5">🔴 导致数据严重永久撕裂与客诉风暴！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 用户付款后货物迟迟不发；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 需要人工对账补单抢救；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 严禁在微服务中直接写双边！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">❌ 先发 MQ，再写 DB：幽灵消息与假付款</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">1. 先向 Kafka 发送 "支付成功" 消息</text>
          <text y="28" fill="#f5f5f5">2. 下游发货服务毫秒级消费并光速发货！</text>

          <text y="50" fill="#f5f5f5">悲剧发生：</text>
          <text y="64" fill="#f5f5f5">• 上游主业务执行 DB UPDATE 时触发锁等待超时！</text>
          <text y="78" fill="#f5f5f5">• 本地事务回滚，订单状态实际为“未支付”！</text>
          <text y="92" fill="#f5f5f5">• 用户未扣款却白嫖到了发货商品！</text>

          <text y="116" fill="#f5f5f5">🔴 造成直接巨大资金损失！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构结论：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 无论先更库还是先发 MQ 均无法保证一致性；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 必须依靠 Transactional Outbox 事务外箱彻底解决；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 分布式系统经典铁律！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
