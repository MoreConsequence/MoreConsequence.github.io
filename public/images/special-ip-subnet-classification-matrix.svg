<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="special-ip-subnet-classification-matrix-title special-ip-subnet-classification-matrix-desc"><title id="special-ip-subnet-classification-matrix-title">特殊地址先分类：命中返回描述，未命中才继续</title><desc id="special-ip-subnet-classification-matrix-desc">Flowchart and ordered table showing the classifyPrivateIP switch cases, their exact returned descriptions, and the empty-string path for an unmatched address.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');</style>
        <marker id="special-ip-subnet-classification-matrix-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="special-ip-subnet-classification-matrix-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="special-ip-subnet-classification-matrix-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <text x="40" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">LIBRESPEED GO · classifyPrivateIP</text>
      <text x="40" y="92" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">特殊地址先分类：命中返回描述，未命中才继续</text>
      <text x="40" y="120" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">classifyPrivateIP 的 switch 顺序；这张表只描述地址类别，不推断 ISP 或公网身份</text>

      <!-- Decision flow. -->
      <line x1="192" y1="204" x2="248" y2="204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#special-ip-subnet-classification-matrix-arrow)"/>
      <line x1="448" y1="204" x2="464" y2="204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#special-ip-subnet-classification-matrix-arrow)"/>
      <line x1="608" y1="204" x2="704" y2="204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#special-ip-subnet-classification-matrix-arrow)"/>
      <path d="M536 244 V296 Q536 304 544 304 H704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#special-ip-subnet-classification-matrix-arrow)"/>

      <rect x="636" y="184" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="193" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="548" y="256" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="564" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="48" y="176" width="144" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="48" y="176" width="144" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="202" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">clientIP</text>
      <text x="120" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">string from getClientIP</text>

      <rect x="248" y="176" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="176" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="260" y="184" width="48" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="284" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">FUNC</text>
      <text x="348" y="210" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">classifyPrivateIP</text>
      <text x="348" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">TrimPrefix("::ffff:")</text>

      <polygon points="536,164 608,204 536,244 464,204" fill="#f5f5f5"/>
      <polygon points="536,164 608,204 536,244 464,204" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="536" y="208" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">desc != ""?</text>

      <rect x="704" y="176" width="208" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="704" y="176" width="208" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="808" y="202" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">clientIP + desc</text>
      <text x="808" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">return JSON early</text>

      <rect x="704" y="276" width="208" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="704" y="276" width="208" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="808" y="302" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">desc == ""</text>
      <text x="808" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">caller continues</text>

      <!-- Ordered switch table. -->
      <text x="64" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.12em">SOURCE ORDER · FIRST MATCH WINS</text>
      <rect x="48" y="348" width="864" height="140" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="348" width="864" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="348" width="864" height="28" rx="6" fill="rgba(45,49,66,0.05)"/>
      <line x1="120" y1="348" x2="120" y2="488" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="512" y1="348" x2="512" y2="488" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="48" y1="376" x2="912" y2="376" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="48" y1="392" x2="912" y2="392" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="48" y1="408" x2="912" y2="408" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="48" y1="424" x2="912" y2="424" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="48" y1="440" x2="912" y2="440" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="48" y1="456" x2="912" y2="456" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="48" y1="472" x2="912" y2="472" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">ORDER</text>
      <text x="144" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.08em">MATCH</text>
      <text x="544" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.08em">RETURN DESCRIPTION</text>

      <text x="80" y="388" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">01</text>
      <text x="144" y="388" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">::1</text>
      <text x="544" y="388" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">localhost IPv6 access</text>

      <text x="80" y="404" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">02</text>
      <text x="144" y="404" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">fe80:</text>
      <text x="544" y="404" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">link-local IPv6 access</text>

      <text x="80" y="420" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">03</text>
      <text x="144" y="420" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">fc00::/7</text>
      <text x="544" y="420" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">ULA IPv6 access</text>

      <text x="80" y="436" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">04</text>
      <text x="144" y="436" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">127.</text>
      <text x="544" y="436" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">localhost IPv4 access</text>

      <text x="80" y="452" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">05</text>
      <text x="144" y="452" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">10. · 172.16–31. · 192.168.</text>
      <text x="544" y="452" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">private IPv4 access</text>

      <text x="80" y="468" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">06</text>
      <text x="144" y="468" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">169.254.</text>
      <text x="544" y="468" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">link-local IPv4 access</text>

      <text x="80" y="484" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">07</text>
      <text x="144" y="484" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">100.64.0.0/10</text>
      <text x="544" y="484" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">CGNAT IPv4 access</text>

      <text x="64" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">ULA: ip[0]&amp;0xFE == 0xFC</text>
      <text x="408" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">CGNAT: ^100\.([6-9][0-9]|1[0-2][0-7])\.</text>

      <!-- Horizontal legend strip. -->
      <line x1="40" y1="532" x2="920" y2="532" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
      <rect x="144" y="548" width="32" height="16" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="184" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">START / END</text>
      <rect x="304" y="548" width="40" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="352" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">STEP</text>
      <polygon points="456,556 472,548 488,556 472,564" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="504" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">FOCAL DECISION</text>
      <rect x="704" y="548" width="40" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="752" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">ORDERED TABLE</text>
    </svg>
