<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">TypeScript 数据流背压 (Backpressure)：从 async generator 到 Readable</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">生产者生产过快 ──► highWaterMark 缓冲区满 ──► push 返回 false 暂停读取 ──► drain 事件触发恢复消费</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: async generator -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. 拉取模型：async generator 天然自带背压</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">async function* readChunks() {</text>
          <text y="28" fill="#86efac">  while (hasMore) {</text>
          <text y="42" fill="#86efac">    const chunk = await fetchChunk();</text>
          <text y="56" fill="#38bdf8">    yield chunk; // 关键：暂停执行，等待下游消费者 next()！</text>
          <text y="70" fill="#86efac">  }</text>
          <text y="84" fill="#4ade80">}</text>
          
          <text y="106" fill="#34d399">for await (const chunk of readChunks()) {</text>
          <text y="120" fill="#cbd5e1">  await processSlowly(chunk); // 下游处理多慢，上游就暂停多久！</text>
          <text y="134" fill="#34d399">}</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">拉取模型优势：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 消费者驱动 (Pull-based)，内存使用量恒定为 O(1)；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 无需复杂的事件监听与状态机；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代 TypeScript 异步流的最佳首选语法！</text>
      </g>
    </g>

    <!-- Right: ReadableStream Push -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. 推送模型：Node / Web Streams 队列与水位线</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// Node.js stream.Readable 内部队列控制</text>
          <text y="28" fill="#93c5fd">1. 生产者调用 readable.push(data)</text>
          <text y="42" fill="#93c5fd">2. 数据推入内部 Buffer 队列 (默认 16KB highWaterMark)</text>
          <text y="60" fill="#f87171">3. 若队列满: push() 返回 false ──► 生产者必须停止读取底层 Socket</text>
          <text y="78" fill="#34d399">4. 消费者消费数据使队列水位降低 ──► 触发 drain 事件</text>
          <text y="96" fill="#34d399">5. 生产者监听到 drain 后恢复 push！</text>
          
          <text y="122" fill="#4ade80">✓ 结合 pipeline(src, dst) 自动处理全链路背压！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">生产防爆雷建议：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 严禁使用原始 data 事件监听无脑读取（会直接撑爆内存）；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 统一使用 stream.pipeline 或 pipe() 连接管道；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 支撑数十 GB 超大文件与 LLM 流式输出极致稳健！</text>
      </g>
    </g>
  </g>
</svg>