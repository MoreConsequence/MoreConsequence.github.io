<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">GODEBUG=gctrace=1 日志字段深度解析与核算模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">gc 1 @0.025s 2%: 0.08+1.2+0.05 ms clock, 0.64+0.5/1.2/0+0.4 ms cpu, 4-&gt;5-&gt;2 MB, 8 MB goal, 8 P</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 时钟耗时 (Clock Time)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">0.08 + 1.2 + 0.05 ms clock</text>
          
          <text x="8" y="38" fill="#86efac">• 0.08ms: 开启写屏障 (STW 1)</text>
          <text x="8" y="58" fill="#38bdf8">• 1.2ms: 并发三色标记 (Concurrent)</text>
          <text x="8" y="78" fill="#86efac">• 0.05ms: 标记终止 (STW 2)</text>
          
          <text x="8" y="108" fill="#4ade80">✓ 总 STW 仅 0.13ms！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• 墙上实际流逝物理时间；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 重点监控两次极短的 STW 耗时；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 打造亚毫秒级停顿。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. CPU 算力占用 (CPU Time)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">0.64 + 0.5/1.2/0 + 0.4 ms</text>
          
          <text x="8" y="38" fill="#fed7aa">标记阶段 CPU 分解：</text>
          <text x="8" y="54" fill="#38bdf8">• 0.5ms: 辅助 GC 标记 (Assist)</text>
          <text x="8" y="70" fill="#34d399">• 1.2ms: 背景 GC 标记 (25% CPU)</text>
          <text x="8" y="86" fill="#cbd5e1">• 0ms: 空闲 Mark 窃取</text>
          
          <text x="8" y="112" fill="#4ade80">✓ 2%: GC 占总 CPU 时间比</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="8" y="34" font-size="7.5" fill="#9a3412">• 默认严格限制 GC 占用 ≤ 25% CPU；</text>
        <text x="8" y="48" font-size="7.5" fill="#9a3412">• 若 Assist 过高说明前台写太猛；</text>
        <text x="8" y="62" font-size="7.5" fill="#ea580c">• 算力平衡晴雨表。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 堆内存收缩 (Heap Size)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">4 -&gt; 5 -&gt; 2 MB, 8 MB goal</text>
          
          <text x="8" y="38" fill="#86efac">• 4MB: GC 开始时的堆存活大小</text>
          <text x="8" y="58" fill="#fed7aa">• 5MB: GC 结束时的堆总大小</text>
          <text x="8" y="78" fill="#34d399">• 2MB: 清理后标记为存活的堆对象</text>
          <text x="8" y="98" fill="#38bdf8">• 8MB: 下次触发 GC 的目标堆阈值</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• 清晰呈现垃圾回收的真实减重效果；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• 2MB -&gt; 8MB 对应 GOGC=100 翻倍规则；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 空间控制核心指标。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. 调度环境 (Processors)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">8 P (GOMAXPROCS)</text>
          
          <text x="8" y="38" fill="#e9d5ff">• 运行环境拥有 8 个逻辑 P</text>
          <text x="8" y="62" fill="#38bdf8">• GC 专用 Dedicated P = 8 × 25% = 2 个</text>
          <text x="8" y="86" fill="#34d399">• 其余 6 个 P 持续处理前台业务</text>
          
          <text x="8" y="112" fill="#4ade80">✓ 业务吞吐绝对不中断！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">架构价值：</text>
        <text x="8" y="34" font-size="7.5" fill="#6b21a8">• 诊断容器内 CPU 限制与 P 核心数；</text>
        <text x="8" y="48" font-size="7.5" fill="#6b21a8">• 确认 GC 并发 worker 是否超额占用；</text>
        <text x="8" y="62" font-size="7.5" fill="#6b21a8">• 生产调优终极透视镜！</text>
      </g>
    </g>
  </g>
</svg>