<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="off-tr-title off-tr-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="off-tr-title">eBPF Off-CPU 溯源算法：调度器切出/切入追踪与阻塞火焰图</title>
  <desc id="off-tr-desc">流程架构图展示通过 eBPF 挂载 sched_switch 调度器，记录线程切出时间与栈 ID，并在唤醒时计算差值 Δt 累加生成 Off-CPU 阻塞火焰图的全流程。</desc>
  <defs>
    <marker id="of-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="of-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">EBPF SCHED_SWITCH TRACING · OFF-CPU FLAME GRAPH</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">eBPF Off-CPU 溯源算法与阻塞火焰图流水线</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">挂载 sched_switch ➔ 切出记 t_start 与调用栈 ➔ 唤醒算 Δt ➔ BPF Map 聚合 ➔ 生成 Off-CPU 火焰图</text>

  <!-- 4 Columns Grid (y=136..506, h=370) -->
  <!-- Col 1: Switch Out (x=40..220, w=180) -->
  <g transform="translate(40, 136)">
    <rect width="180" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 1</text>
    <text x="100" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">切出时刻追踪</text>

    <!-- Block Trigger -->
    <rect x="14" y="42" width="152" height="96" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="22" y="64" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">线程阻塞触发切出</text>
    <text x="22" y="84" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">pthread_mutex_lock</text>
    <text x="22" y="100" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">do_futex() ➔ 睡眠</text>
    <text x="22" y="118" fill="#6b6a64" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">调度器切出 prev_pid</text>

    <!-- Record Timestamp -->
    <rect x="14" y="150" width="152" height="110" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="22" y="172" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">记录切出时间戳</text>
    <text x="22" y="192" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">now = bpf_ktime_get_ns()</text>
    <text x="22" y="210" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">start_time_map[prev_pid]</text>
    <text x="22" y="226" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600"> = now;</text>
    <text x="22" y="246" fill="#141413" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">记录当前纳秒时间戳</text>

    <!-- Stack Capture -->
    <rect x="14" y="272" width="152" height="88" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="22" y="294" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">挂起堆栈捕获</text>
    <text x="22" y="314" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">bpf_get_stackid()</text>
    <text x="22" y="332" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">获取用户+内核调用栈</text>
    <text x="22" y="348" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">Stack ID 存入临时表</text>
  </g>

  <!-- Arrow 1 (x=220..250) -->
  <text x="235" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Sleep</text>
  <line x1="220" y1="230" x2="250" y2="230" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#of-arr-accent)"/>

  <!-- Col 2: Switch In (x=250..470, w=220) - Focal -->
  <g transform="translate(250, 136)">
    <rect width="220" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="25" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 2</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">切入唤醒耗时计算</text>

    <!-- Wakeup Box -->
    <rect x="14" y="42" width="192" height="150" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="24" y="50" width="80" height="16" rx="2" fill="#e85d3f"/>
    <text x="64" y="62" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">SWITCH IN</text>
    <text x="112" y="63" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">唤醒重新调度</text>

    <text x="24" y="86" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 锁释放 / 磁盘 I/O 结束</text>
    <text x="24" y="104" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. 调度器唤醒 next_pid</text>
    <text x="24" y="122" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">3. start_ts = lookup(next_pid)</text>
    <line x1="24" y1="134" x2="196" y2="134" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="152" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">精确计算阻塞时长：</text>
    <text x="24" y="170" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">delta_us = (now - *start_ts)/1000</text>
    <text x="24" y="186" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">bpf_map_delete_elem() 清理</text>

    <!-- Noise Filter -->
    <rect x="14" y="202" width="192" height="158" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="224" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">噪音毛刺过滤守卫</text>
    <text x="24" y="244" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">微秒级上下文切换为正常调度</text>
    <text x="24" y="262" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">if (delta_us &gt; 1000) {</text>
    <text x="24" y="280" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">  // 仅聚焦 &gt; 1ms 显著卡顿！</text>
    <text x="24" y="296" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">}</text>
    <line x1="24" y1="308" x2="196" y2="308" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="328" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">大幅压低 BPF Map 写入频次</text>
    <text x="24" y="346" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace">Zero CPU Overhead Trap</text>
  </g>

  <!-- Arrow 2 (x=470..500) -->
  <text x="485" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Sum</text>
  <line x1="470" y1="230" x2="500" y2="230" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#of-arr-accent)"/>

  <!-- Col 3: Map Aggregation (x=500..710, w=210) - Focal -->
  <g transform="translate(500, 136)">
    <rect width="210" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="25" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 3</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">内核 Map 极速聚合</text>

    <!-- Map Aggregation -->
    <rect x="14" y="42" width="182" height="142" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">BPF Map 直方图累加</text>
    <text x="24" y="84" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">Key: stack_id (调用栈)</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">Val: total_blocked_us</text>
    <text x="24" y="116" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">*total_time += delta_us;</text>
    <line x1="24" y1="128" x2="186" y2="128" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="148" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">100% 在内核态完成累加</text>
    <text x="24" y="166" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">0 单次事件用户态投递！</text>
    <text x="24" y="178" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Prevent Event Storm</text>

    <!-- Stack Table -->
    <rect x="14" y="196" width="182" height="164" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="218" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">堆栈表结构 (Stack Trace)</text>
    <text x="24" y="238" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">[Stack 104] ➔ 450,000us</text>
    <text x="24" y="254" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">  futex_wait ➔ mutex_lock</text>
    <text x="24" y="272" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">[Stack 208] ➔ 820,000us</text>
    <text x="24" y="288" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace">  vfs_fsync ➔ ext4_sync_file</text>
    <line x1="24" y1="300" x2="186" y2="300" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="320" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">内存占用受控固定</text>
    <text x="24" y="338" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace">Ready for Visualization</text>
  </g>

  <!-- Arrow 3 (x=710..740) -->
  <text x="725" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Render</text>
  <line x1="710" y1="230" x2="740" y2="230" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#of-arr-accent)"/>

  <!-- Col 4: Flame Graph (x=740..920, w=180) -->
  <g transform="translate(740, 136)">
    <rect width="180" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 4</text>
    <text x="100" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Off-CPU 火焰图</text>

    <!-- Symbol Resolution -->
    <rect x="14" y="42" width="152" height="142" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="22" y="64" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">用户态符号化解析</text>
    <text x="22" y="84" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">Go / BCC 控制面读取：</text>
    <text x="22" y="102" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">/proc/kallsyms</text>
    <text x="22" y="118" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">解析内核函数符号</text>
    <text x="22" y="136" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">ELF .symtab</text>
    <text x="22" y="152" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">解析应用代码行号</text>
    <text x="22" y="170" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace">Symbol Resolution Done</text>

    <!-- Flame Graph Box -->
    <rect x="14" y="196" width="152" height="164" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
    <text x="22" y="218" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">宽度 = 阻塞总耗时</text>
    <text x="22" y="238" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">排障直接定位真凶：</text>
    <text x="22" y="256" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">45% 等待连接池互斥锁</text>
    <text x="22" y="272" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">50% 等待 MySQL 刷盘</text>
    <text x="22" y="288" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">5% 实际计算耗时</text>
    <line x1="22" y1="300" x2="156" y2="300" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="22" y="320" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">P99 长尾延迟彻底破案！</text>
    <text x="22" y="338" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace">Pinpoint Root Cause</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">切出记录与符号化</text>
  <rect x="290" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="310" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">唤醒计算与内核 Map 预聚合核心</text>
</svg>
