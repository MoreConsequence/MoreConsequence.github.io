<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">大模型评测集数据污染检测流水线：N-Gram 与 MinHash 碰撞矩阵</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">万亿 Pretraining 预训练语料 ──► 13-gram 切片分词 ──► MinHash / LSH 快速指纹碰撞 ──► 剔除泄露样本确保真实泛化</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 13-Gram 切片与哈希分桶 (13-Gram Tokenization &amp; Shingling)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">将 Benchmark 测试集题目切分为 13 词长度连续片段 ──► 生成全局 64 位整型哈希序列</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">13-gram 经验长度能够精准区分通用常识与特定试题原型，杜绝误伤常规语料！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. MinHash 与局部敏感哈希 (LSH) 快速检索 (Scale Indexing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">在 10TB 预训练网页语料中进行 O(1) 桶碰撞 ──► 快速筛出重叠度 &gt; 80% 的疑似污染文档</text>
        <text x="15" y="62" font-size="8" fill="#047857">避免暴力逐字全文比对的天文级算力开销，单机数小时完成全量查重！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 污染度分类与置信度打分 (Contamination Grading)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">区分 [严格污染: 题干+答案完全相同] vs [弱污染: 仅背景资料重合] vs [干净样本]</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">输出污染度审计报告，揭示模型在被污染子集与干净子集上的真实成绩断崖！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 动态金丝雀注入与持续防泄露治理 (Canary Token Tracking)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">在评测集中埋入随机 UUID 金丝雀 (如 canary_guid_7a8b9c) ──► 预训练爬虫检测到即触发封杀！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">构建科学严谨、绝对可信的工业级 AI 评测基底！</text>
      </g>
    </g>
  </g>
</svg>