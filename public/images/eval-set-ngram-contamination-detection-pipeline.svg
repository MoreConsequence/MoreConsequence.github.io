<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="eval-set-ngram-contamination-detection-pipeline-title eval-set-ngram-contamination-detection-pipeline-desc"><title id="eval-set-ngram-contamination-detection-pipeline-title">评测集污染检测：N-Gram 词频重叠度分析与最小哈希 MinHash 查重管道</title><desc id="eval-set-ngram-contamination-detection-pipeline-desc">评测集污染检测：N-Gram 词频重叠度分析与最小哈希 MinHash 查重管道</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">大模型评测集数据污染检测流水线：N-Gram 与 MinHash 碰撞矩阵</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">万亿 Pretraining 预训练语料 ──► 13-gram 切片分词 ──► MinHash / LSH 快速指纹碰撞 ──► 剔除泄露样本确保真实泛化</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 13-Gram 切片与哈希分桶 (13-Gram Tokenization &amp; Shingling)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">将 Benchmark 测试集题目切分为 13 词长度连续片段 ──► 生成全局 64 位整型哈希序列</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">13-gram 经验长度能够精准区分通用常识与特定试题原型，杜绝误伤常规语料！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. MinHash 与局部敏感哈希 (LSH) 快速检索 (Scale Indexing)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">在 10TB 预训练网页语料中进行 O(1) 桶碰撞 ──► 快速筛出重叠度 &gt; 80% 的疑似污染文档</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">避免暴力逐字全文比对的天文级算力开销，单机数小时完成全量查重！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 污染度分类与置信度打分 (Contamination Grading)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">区分 [严格污染: 题干+答案完全相同] vs [弱污染: 仅背景资料重合] vs [干净样本]</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">输出污染度审计报告，揭示模型在被污染子集与干净子集上的真实成绩断崖！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 动态金丝雀注入与持续防泄露治理 (Canary Token Tracking)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">在评测集中埋入随机 UUID 金丝雀 (如 canary_guid_7a8b9c) ──► 预训练爬虫检测到即触发封杀！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">构建科学严谨、绝对可信的工业级 AI 评测基底！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
