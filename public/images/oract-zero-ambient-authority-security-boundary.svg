<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">零环境权威 (Zero Ambient Authority) vs 传统特权继承对比</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">传统进程模型 (默认继承运行用户的全部读写、网络和特权权限) vs Oract 零环境权威 (默认 0 权限，必须显式传递受限 Capability 句柄)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Ambient Authority Danger -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统环境权威：隐式继承全部宿主特权</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">Agent 进程以用户身份直接运行：</text>
          
          <text y="38" fill="#ef4444">巨大安全漏洞：</text>
          <text y="52" fill="#fca5a5">• 可以随意读取 ~/.aws/credentials 凭证</text>
          <text y="68" fill="#ef4444">• 可以向任意内网 IP 发起端口扫描与攻击</text>
          <text y="84" fill="#ef4444">• 只要诱导 Agent 执行一条指令即可全盘沦陷！</text>
          
          <text y="106" fill="#f87171">🔴 传统操作系统最脆弱的安全死穴！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 权限边界模糊无边界；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 无法抵御复杂的提示词注入与恶意依赖；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 严禁将此类 Agent 投入生产！</text>
      </g>
    </g>

    <!-- Right: Zero Ambient Authority -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Oract 零环境权威：显式能力凭证传递</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">基于 Capability-based Security 哲学：</text>
          
          <text y="36" fill="#86efac">1. 进程启动时不拥有任何环境变量与默认文件路径</text>
          <text y="50" fill="#38bdf8">2. 访问文件必须由内核显式传入 DirHandle 句柄</text>
          <text y="64" fill="#34d399">3. 无法通过相对路径 "../" 向上越狱</text>
          <text y="78" fill="#4ade80">4. 0 默认外网访问，所有出站调用强制过白名单审计！</text>
          
          <text y="104" fill="#4ade80">✓ 构筑理论数学级绝对安全隔离！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底根除提示词注入越权访问机密的风险；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 企业级多租户安全合规的终极金牌标准；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Oract 领先业界的顶尖安全内核！</text>
      </g>
    </g>
  </g>
</svg>