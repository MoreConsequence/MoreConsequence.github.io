<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 无头模式 (Headless) 与 JSON-RPC 2.0 双向协议总线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">IDE 插件 / Web 控制台 / CI 脚本 ──► Stdio / WebSocket JSON-RPC 2.0 ──► Pi Headless Server (流式推送事件与双向权限交互)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: RPC Protocol Architecture -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. JSON-RPC 2.0 双向全双工通信</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// 客户端启动任务</text>
          <text y="28" fill="#86efac">--&gt; {"jsonrpc":"2.0","method":"turn/start","params":{"prompt":"..."}}</text>
          
          <text y="50" fill="#fed7aa">// 服务端流式推送 Notification</text>
          <text y="64" fill="#fed7aa">&lt;-- {"jsonrpc":"2.0","method":"stream/chunk","params":{"text":"..."}}</text>
          
          <text y="88" fill="#f87171">// 服务端反向请求客户端确认权限 (Reverse Call)</text>
          <text y="102" fill="#f87171">&lt;-- {"jsonrpc":"2.0","id":10,"method":"ui/confirm","params":{...}}</text>
          <text y="118" fill="#4ade80">--&gt; {"jsonrpc":"2.0","id":10,"result":{"approved":true}}</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 纯标准 JSON-RPC 2.0 规范，跨任意编程语言；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 支持反向 RPC 调用，实现服务端向客户端请求授权；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高度通用的无头 Agent 内核。</text>
      </g>
    </g>

    <!-- Right: Multi-Host Integration -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 多宿主环境全景适配</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">1. VS Code / JetBrains 插件:</text>
          <text y="28" fill="#86efac">   通过 Stdio 子进程桥接，在侧边栏渲染原生 Webview！</text>
          
          <text y="50" fill="#38bdf8">2. Web 云端控制台:</text>
          <text y="64" fill="#38bdf8">   通过 WebSocket 连接远端 Docker 中的 Headless Server！</text>
          
          <text y="86" fill="#34d399">3. GitHub Actions CI 流水线:</text>
          <text y="100" fill="#34d399">   作为 CLI 无头运行，自动 Review PR 并生成审查报告！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 一份核心代码，通吃终端、桌面、Web 与云原生；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 极速集成，100 行代码即可写出专属 IDE 扩展；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造无处不在的 AI 编程助手！</text>
      </g>
    </g>
  </g>
</svg>