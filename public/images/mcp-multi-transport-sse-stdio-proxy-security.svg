<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MCP 协议多传输层与企业网关：Stdio 本地沙箱 vs SSE 远程微服务</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Stdio 进程间双向管道隔离 ｜ SSE/HTTP 远程反向鉴权代理 ｜ OAuth 2.0 动态作用域授权</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Stdio Transport -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Stdio 传输层 (本地桌面 / IDE)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// Client 作为父进程拉起 MCP Server</text>
          <text y="28" fill="#86efac">const child = spawn('docker', ['run', '-i', 'mcp-postgres']);</text>
          
          <text y="50" fill="#fed7aa">通信机制：</text>
          <text y="64" fill="#cbd5e1">• stdin: JSON-RPC 请求 (tools/call)</text>
          <text y="78" fill="#cbd5e1">• stdout: JSON-RPC 响应 (结果输出)</text>
          <text y="92" fill="#f87171">• stderr: 日志流 (不干扰协议通信！)</text>
          
          <text y="116" fill="#4ade80">✓ 进程崩溃随父进程自动销毁，零残留！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 纯单机管道，零网络端口暴露；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 延迟 &lt; 1ms，极速本地工具调用；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Claude Desktop / Cursor 标配底层方案。</text>
      </g>
    </g>

    <!-- Right: SSE Remote Transport -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. SSE + HTTP POST (企业远程网关)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 企业级分布式 MCP 网关通信</text>
          <text y="28" fill="#86efac">1. GET /sse (带 Bearer JWT 建立下行长连接)</text>
          <text y="44" fill="#38bdf8">2. POST /message (客户端上行发送请求)</text>
          
          <text y="68" fill="#34d399">3. 网关层执行 RBAC 权限与审计:</text>
          <text y="82" fill="#fed7aa">   • 校验用户是否有权限执行 DropTable</text>
          <text y="96" fill="#fed7aa">   • 动态注入租户上下文与数据脱敏</text>
          
          <text y="120" fill="#4ade80">✓ 支撑上千 Agent 统一安全访问企业微服务！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 集中化管理 API Key 与私有数据源；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 满足金融级审计、合规与风控追踪；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造生产级企业 Agent 开放平台！</text>
      </g>
    </g>
  </g>
</svg>