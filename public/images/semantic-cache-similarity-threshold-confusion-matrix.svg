<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">语义缓存相似度门限决策：余弦距离与假阳性 (False Positive) 灾难</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">门限过宽 (&lt;0.92) 导致张冠李戴（把北京天气答给上海用户） ｜ 门限过严 (&gt;0.98) 命中率跌归零 ｜ 动态双阈值 + 实体校验破局</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 门限过松：假阳性张冠李戴</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// 设定 threshold = 0.88</text>
          <text x="10" y="34" fill="#fca5a5">Query 1: "取消 2026 年订单"</text>
          <text x="10" y="50" fill="#fca5a5">Query 2: "取消 2025 年订单"</text>
          
          <text x="10" y="74" fill="#ef4444">余弦相似度 = 0.91 &gt; 0.88 命中缓存！</text>
          <text x="10" y="92" fill="#ef4444">🔴 灾难：直接把旧订单退订结果返回！</text>
          <text x="10" y="108" fill="#f87171">造成严重的业务数据错乱事故！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 向量相似不等于业务语义等价；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 数字、否定词（不/没有）在 Embedding 中常被稀释；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严禁单纯依赖单一向量距离！</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. 门限过严：假阴性缓存失效</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 设定 threshold = 0.98</text>
          <text x="10" y="34" fill="#93c5fd">Query 1: "今天北京天气怎样"</text>
          <text x="10" y="50" fill="#93c5fd">Query 2: "北京今天会下雨吗"</text>
          
          <text x="10" y="74" fill="#cbd5e1">余弦相似度 = 0.94 &lt; 0.98 未命中！</text>
          <text x="10" y="92" fill="#fb923c">⚠️ 缓存命中率跌至 &lt; 5%！</text>
          <text x="10" y="108" fill="#cbd5e1">语义缓存退化为纯精确哈希，失去意义！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 过于保守导致巨大基础设施开销无法平摊；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 无法抵御高频同义句的重复计算；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 需引入结构化重排序。 </text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 工业解法：双阶检验 (Bi-Encoder)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 向量初筛 + 实体严格比对</text>
          <text x="10" y="34" fill="#86efac">1. 粗筛: Vector Sim &gt; 0.90 (召回候选)</text>
          <text x="10" y="50" fill="#38bdf8">2. 精校: 提取实体槽位 (NER/Slot)</text>
          <text x="10" y="68" fill="#34d399">   • 城市: [北京] === [北京] (OK)</text>
          <text x="10" y="84" fill="#34d399">   • 时间: [2026] === [2026] (OK)</text>
          <text x="10" y="104" fill="#4ade80">3. 实体 100% 吻合才放行缓存！</text>
          <text x="10" y="120" fill="#4ade80">✓ 兼顾 40% 命中率与 0 业务误伤！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 打造坚如磐石的语义缓存防护堤；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑亿级 LLM 智能客服高频秒级响应；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级 RAG 系统核心架构标杆！</text>
      </g>
    </g>
  </g>
</svg>