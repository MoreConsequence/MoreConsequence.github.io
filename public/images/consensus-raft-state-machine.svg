<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Raft 节点角色状态机转换与日志复制仲裁全景</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">三态流转（Follower ──► Candidate ──► Leader）与基于 Quorum 多数派的单调提交点推进</text>
  </g>

  <!-- Main Card -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Box: State Machine Flow (400px) -->
    <g transform="translate(20, 20)">
      <rect width="390" height="230" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect width="390" height="32" rx="6" fill="#f1f5f9"/>
      <text x="195" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">一、 节点三态转换状态机 (Node Lifecycle)</text>

      <!-- State: Follower -->
      <g transform="translate(20, 48)">
        <rect width="100" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="50" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Follower</text>
        <text x="50" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2563eb" text-anchor="middle">(跟随者)</text>
      </g>

      <!-- State: Candidate -->
      <g transform="translate(260, 48)">
        <rect width="100" height="46" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
        <text x="50" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Candidate</text>
        <text x="50" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#ea580c" text-anchor="middle">(候选人)</text>
      </g>

      <!-- State: Leader -->
      <g transform="translate(140, 148)">
        <rect width="110" height="52" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
        <text x="55" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">⭐ Leader</text>
        <text x="55" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#059669" text-anchor="middle">(权威领导者)</text>
      </g>

      <!-- Transitions -->
      <!-- Follower -> Candidate -->
      <path d="M 120 62 L 250 62" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
      <text x="185" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#ea580c" text-anchor="middle">选举超时(150-300ms)</text>

      <!-- Candidate -> Leader -->
      <path d="M 310 94 L 310 174 L 255 174" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
      <text x="315" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#10b981">赢得多数派选票</text>

      <!-- Leader -> Follower -->
      <path d="M 140 174 L 70 174 L 70 98" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-slate)"/>
      <text x="50" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#64748b">发现更高 Term</text>

      <!-- Candidate -> Follower -->
      <path d="M 260 80 L 125 80" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-slate)"/>
      <text x="190" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">收到合法 Leader 心跳</text>
    </g>

    <!-- Right Box: Log Replication Quorum (450px) -->
    <g transform="translate(430, 20)">
      <rect width="450" height="230" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect width="450" height="32" rx="6" fill="#f1f5f9"/>
      <text x="225" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">二、 日志条目复制与多数派仲裁 (AppendEntries Quorum)</text>

      <!-- Leader Log -->
      <g transform="translate(16, 44)" font-family="ui-monospace, monospace" font-size="10">
        <text x="0" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" fill="#047857">Leader (Node 1):</text>
        <rect x="110" y="4" width="55" height="22" rx="3" fill="#d1fae5" stroke="#10b981"/>
        <text x="137" y="19" fill="#065f46" text-anchor="middle">[T1:k=a]</text>

        <rect x="170" y="4" width="55" height="22" rx="3" fill="#d1fae5" stroke="#10b981"/>
        <text x="197" y="19" fill="#065f46" text-anchor="middle">[T1:k=b]</text>

        <rect x="230" y="4" width="55" height="22" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
        <text x="257" y="19" fill="#1e40af" text-anchor="middle">[T2:k=c]</text>

        <rect x="290" y="4" width="55" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
        <text x="317" y="19" fill="#92400e" text-anchor="middle">[T2:k=d]*</text>
        <text x="350" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2563eb">matchIndex=4</text>
      </g>

      <!-- Follower 1 Log (Committed) -->
      <g transform="translate(16, 80)" font-family="ui-monospace, monospace" font-size="10">
        <text x="0" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" fill="#334155">Follower 2:</text>
        <rect x="110" y="4" width="55" height="22" rx="3" fill="#d1fae5" stroke="#10b981"/>
        <text x="137" y="19" fill="#065f46" text-anchor="middle">[T1:k=a]</text>

        <rect x="170" y="4" width="55" height="22" rx="3" fill="#d1fae5" stroke="#10b981"/>
        <text x="197" y="19" fill="#065f46" text-anchor="middle">[T1:k=b]</text>

        <rect x="230" y="4" width="55" height="22" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
        <text x="257" y="19" fill="#1e40af" text-anchor="middle">[T2:k=c]</text>

        <rect x="290" y="4" width="55" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
        <text x="317" y="19" fill="#92400e" text-anchor="middle">[T2:k=d]*</text>
        <text x="350" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#16a34a">✓ 达到多数派(3/5)</text>
      </g>

      <!-- Follower 2 Log (Lagging) -->
      <g transform="translate(16, 116)" font-family="ui-monospace, monospace" font-size="10">
        <text x="0" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" fill="#64748b">Follower 3:</text>
        <rect x="110" y="4" width="55" height="22" rx="3" fill="#d1fae5" stroke="#10b981"/>
        <text x="137" y="19" fill="#065f46" text-anchor="middle">[T1:k=a]</text>

        <rect x="170" y="4" width="55" height="22" rx="3" fill="#d1fae5" stroke="#10b981"/>
        <text x="197" y="19" fill="#065f46" text-anchor="middle">[T1:k=b]</text>

        <rect x="230" y="4" width="55" height="22" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
        <text x="257" y="19" fill="#1e40af" text-anchor="middle">[T2:k=c]</text>

        <rect x="290" y="4" width="55" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 3"/>
        <text x="317" y="19" fill="#94a3b8" text-anchor="middle">空缺</text>
        <text x="350" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#f59e0b">同步中...</text>
      </g>

      <!-- Quorum Bar -->
      <g transform="translate(16, 155)">
        <rect width="418" height="58" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">🎯 多数派提交安全准则 (Commit Invariants)：</text>
        <text x="12" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#047857">• 仅当当前 Term (T2) 的日志复制到多数派节点时，Leader 方可推进 commitIndex；</text>
        <text x="12" y="49" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#047857">• 一旦条目被 Commit 并应用至状态机，后续任何合法 Leader 必定包含此条目！</text>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">共识核心本质：</tspan> Raft 通过 <tspan font-weight="700" fill="#2563eb">“强 Leader 单向同步”</tspan> 彻底消除了 Multi-Paxos 的并发日志决议冲突，将共识简化为 Leader 选举与日志追加两阶段。
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
        （随机化心跳超时如 150-300ms 是打破 Candidate 选票平局 Split-Vote 的关键物理随机熵）
      </text>
    </g>
  </g>
</svg>
