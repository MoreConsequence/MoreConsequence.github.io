<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 引擎依赖倒置 (DIP) 与无缝模型热切换架构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">代码强绑定 OpenAI SDK (更换 Claude 或本地 Ollama 需重写全部逻辑) vs 依赖倒置 LLMProvider 抽象接口 (0 业务代码修改，秒级热插拔多模型)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Tight Coupling -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 强耦合厂商 SDK：厂商锁定与重构噩梦</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">业务代码内部散落 openai.ChatCompletion.create():</text>
          
          <text y="38" fill="#ef4444">架构恶果：</text>
          <text y="52" fill="#fca5a5">• 深度绑定特定厂商专有字段与响应格式</text>
          <text y="68" fill="#ef4444">• 当 OpenAI 突发故障时无法秒级降级切换至 Claude</text>
          <text y="84" fill="#ef4444">• 接入本地私有化 DeepSeek 需重构 50 个文件！</text>
          
          <text y="106" fill="#f87171">🔴 系统演进能力被单一云厂商彻底锁死！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 违反经典 SOLID 软件设计原则；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 缺乏业务韧性与故障转移能力；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 必须引入领域接口抽象！</text>
      </g>
    </g>

    <!-- Right: Inverted Interfaces -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 依赖倒置：统一 LLMProvider 领域契约</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">type LLMProvider interface {</text>
          <text y="28" fill="#86efac">    Stream(ctx, req) (&lt;-chan Chunk, error)</text>
          <text y="42" fill="#4ade80">}</text>
          
          <text y="64" fill="#38bdf8">多驱动适配器模式：</text>
          <text y="78" fill="#34d399">• AnthropicAdapter / OpenAIAdapter / OllamaAdapter</text>
          <text y="92" fill="#4ade80">• 故障时 1 毫秒自动熔断漂移至备用模型！</text>
          
          <text y="114" fill="#4ade80">✓ 核心业务代码 100% 纯净高可用！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 赋予系统自由选择最优性价比模型的主动权；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 单元测试通过 MockProvider 实现毫秒级 0 成本运行；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级 Agent 引擎核心架构标杆！</text>
      </g>
    </g>
  </g>
</svg>