<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">CPU MESI 缓存一致性状态机与 64B 伪共享（False Sharing）消除</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">4 态状态机有向流转 ──► 64-Byte Cache Line 粒度竞争 ──► 内存对齐填充（Padding）消灭总线乒乓风暴</text>
  </g>

  <!-- Main Comparison Panes (435px each) -->
  <g transform="translate(30, 70)">
    <!-- Left Pane: MESI 4-State Finite State Machine (435px) -->
    <g filter="url(#card-shadow)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">🧠 MESI 4 状态有向状态机（FSM）</text>

      <!-- FSM 4-Node Layout -->
      <g transform="translate(20, 50)" font-family="ui-sans-serif, system-ui, sans-serif">
        <!-- Node M (Top-Left) -->
        <g transform="translate(20, 10)">
          <rect width="135" height="48" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
          <text x="67" y="20" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">M (Modified)</text>
          <text x="67" y="36" font-size="8.5" fill="#7f1d1d" text-anchor="middle">独占已脏，与内存不同</text>
        </g>

        <!-- Node E (Top-Right) -->
        <g transform="translate(240, 10)">
          <rect width="135" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="67" y="20" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">E (Exclusive)</text>
          <text x="67" y="36" font-size="8.5" fill="#78350f" text-anchor="middle">独占干净，与内存一致</text>
        </g>

        <!-- Node S (Bottom-Right) -->
        <g transform="translate(240, 110)">
          <rect width="135" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
          <text x="67" y="20" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">S (Shared)</text>
          <text x="67" y="36" font-size="8.5" fill="#14532d" text-anchor="middle">多核共享，只读一致</text>
        </g>

        <!-- Node I (Bottom-Left) -->
        <g transform="translate(20, 110)">
          <rect width="135" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
          <text x="67" y="20" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">I (Invalid)</text>
          <text x="67" y="36" font-size="8.5" fill="#64748b" text-anchor="middle">数据失效，不可读写</text>
        </g>

        <!-- Transition Arcs -->
        <!-- E -> M (Local Write) -->
        <line x1="240" y1="26" x2="160" y2="26" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
        <text x="200" y="20" font-size="7.5" fill="#ea580c" text-anchor="middle">本核写</text>

        <!-- M -> I (Remote Write / BusRdX) -->
        <line x1="87" y1="58" x2="87" y2="105" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
        <text x="50" y="85" font-size="7.5" fill="#dc2626">他核写 (BusRdX)</text>

        <!-- I -> S (Local Read) -->
        <line x1="155" y1="134" x2="235" y2="134" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
        <text x="195" y="146" font-size="7.5" fill="#10b981" text-anchor="middle">本核读 (BusRd)</text>

        <!-- S -> M (Local Write / Invalidate Bus) -->
        <path d="M 270 110 L 120 58" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
        <text x="210" y="78" font-size="7.5" fill="#ea580c">写广播 (Invalidate)</text>

        <!-- Explanation Footer Box -->
        <g transform="translate(0, 175)">
          <rect width="395" height="140" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="10" y="18" font-size="9.5" font-weight="700" fill="#1e40af">总线嗅探（Bus Snooping）核心行为：</text>
          <text x="10" y="34" font-size="8.5" fill="#2563eb">• 当某一核心执行写操作时，必须在总线广播 <tspan font-weight="700">Invalidate 信号</tspan></text>
          <text x="10" y="48" font-size="8.5" fill="#2563eb">• 所有拥有该行副本的其他核心瞬间将自身状态降为 <tspan font-weight="700" fill="#dc2626">I (Invalid)</tspan></text>
          <text x="10" y="62" font-size="8.5" fill="#2563eb">• 下一次他核读取必须重新向 L3 / 主存发起漫长的高延迟内存事务！</text>
        </g>
      </g>
    </g>

    <!-- Right Pane: False Sharing & 64B Padding (435px) -->
    <g transform="translate(465, 0)" filter="url(#card-shadow)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">⚡ 伪共享（False Sharing）与 64B 内存对齐消除</text>

      <g transform="translate(20, 50)" font-family="ui-sans-serif, system-ui, sans-serif">
        <!-- Flawed Shared Cache Line -->
        <text x="0" y="14" font-size="10" font-weight="700" fill="#991b1b">❌ 灾难布局：变量 A 与 B 共享同一 64B 缓存行</text>
        <g transform="translate(0, 22)">
          <rect width="395" height="36" rx="4" fill="#fee2e2" stroke="#f87171"/>
          <!-- Var A -->
          <rect x="5" y="4" width="80" height="28" rx="3" fill="#dc2626"/>
          <text x="45" y="18" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">var A (8B)</text>
          <text x="45" y="27" font-size="6.5" fill="#fecaca" text-anchor="middle">Core 0 频繁写</text>

          <!-- Var B -->
          <rect x="90" y="4" width="80" height="28" rx="3" fill="#dc2626"/>
          <text x="130" y="18" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">var B (8B)</text>
          <text x="130" y="27" font-size="6.5" fill="#fecaca" text-anchor="middle">Core 1 频繁写</text>

          <rect x="175" y="4" width="215" height="28" rx="3" fill="#ffffff" stroke="#fca5a5"/>
          <text x="282" y="21" font-size="8" fill="#991b1b" text-anchor="middle">剩余 48 字节未填充空间</text>
        </g>
        <text x="0" y="72" font-size="8" fill="#dc2626">后果：Core 0 写 A 导致 Core 1 的整个 64B 行被迫失效，延迟暴涨 10x！</text>

        <!-- Solution: Padded Cache Line -->
        <text x="0" y="98" font-size="10" font-weight="700" fill="#166534">✓ 生产解法：64B 缓存行内存对齐填充（Padding）</text>
        <g transform="translate(0, 106)">
          <rect width="395" height="36" rx="4" fill="#f0fdf4" stroke="#86efac"/>
          <!-- Var A Padded -->
          <rect x="5" y="4" width="80" height="28" rx="3" fill="#10b981"/>
          <text x="45" y="18" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">var A (8B)</text>
          <text x="45" y="27" font-size="6.5" fill="#d1fae5" text-anchor="middle">Core 0 独占写</text>

          <!-- Pad 56B -->
          <rect x="90" y="4" width="300" height="28" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="240" y="21" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">_ [56]byte 填充 (Padding) 占满整行 64 字节！</text>
        </g>

        <!-- Code Snippet Box -->
        <g transform="translate(0, 155)">
          <rect width="395" height="150" rx="4" fill="#d1fae5" stroke="#86efac"/>
          <text x="10" y="18" font-size="9.5" font-weight="700" fill="#065f46">Go 工业级结构体写法：</text>
          <rect x="10" y="26" width="375" height="60" rx="3" fill="#0f172a"/>
          <text x="20" y="44" font-family="ui-monospace, monospace" font-size="8.5" fill="#38bdf8">type PaddedCounter struct {</text>
          <text x="35" y="58" font-family="ui-monospace, monospace" font-size="8.5" fill="#f8fafc">val int64</text>
          <text x="35" y="72" font-family="ui-monospace, monospace" font-size="8.5" fill="#94a3b8">_   [56]byte // 强制独占 64-Byte Cache Line</text>
          <text x="20" y="84" font-family="ui-monospace, monospace" font-size="8.5" fill="#38bdf8">}</text>

          <text x="10" y="104" font-size="8.5" fill="#047857">• 彻底消除总线 Ping-Pong 乒乓风暴</text>
          <text x="10" y="118" font-size="8.5" font-weight="700" fill="#166534">• 实测吞吐较未填充版提升 4.3 倍！</text>
        </g>
      </g>
    </g>
  </g>
</svg>
