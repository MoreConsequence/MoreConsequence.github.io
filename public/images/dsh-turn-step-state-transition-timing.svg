<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 引擎 Turn/Step 递归生命周期时序拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. Turn Start ──► 2. Step N: Streaming Thought ──► 3. Tool Dispatch &amp; Sandbox Run ──► 4. Append Journal &amp; Next Step / Turn Complete</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Turn 边界初始化 (Turn Scope Init)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">创建 Turn 上下文、分配全局 turn_id ──► 挂载 AbortSignal 级联取消监听器</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">会话顶层上下文范围！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. Step 推理与流式思考 (Step Reasoning &amp; SSE Streaming)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">流式接收 LLM Token ──► 实时渲染 TUI 思考过程 ──► 增量拼装 tool_calls JSON 结构</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">实现极致流畅的毫秒级终端交互！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. Step 执行与原子落盘 (Step Execution &amp; Journal Append)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">沙箱执行 Tool ──► 获取 stdout ──► 原子追加 ToolResult 事件至 session.jsonl ──► 状态机判定下一步</text>
        <text x="15" y="62" font-size="8" fill="#047857">每一步都拥有不可篡改的历史存证！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. Turn 汇聚交付 (Turn Final Output &amp; State Rest)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">模型判定无需再调工具 ──► 输出最终文本 ──► 触发 onSessionEnd 钩子 ──► 释放全局锁回归 Idle</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">完备且严丝合缝的状态机闭环！</text>
      </g>
    </g>
  </g>
</svg>