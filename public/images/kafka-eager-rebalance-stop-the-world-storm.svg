<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="kafka-eager-rebalance-stop-the-world-storm-title kafka-eager-rebalance-stop-the-world-storm-desc"><title id="kafka-eager-rebalance-stop-the-world-storm-title">Kafka 传统 Eager Rebalance 痛点：全量消费者停机 (Stop-the-World) 与分区争抢风暴</title><desc id="kafka-eager-rebalance-stop-the-world-storm-desc">Kafka 传统 Eager Rebalance 痛点：全量消费者停机 (Stop-the-World) 与分区争抢风暴</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Kafka 传统 Eager 重平衡全量停顿风暴 (Eager Rebalance STW)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">某一个 Consumer 闪退 ──► Group Coordinator 强制全员丢弃分区 (Revoke All) ──► 全集群消费暂停 30s ──► 消息积压与反复重平衡风暴</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 触发事件发生 (Trigger: Single Consumer Restart / GC Timeout)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">仅 1 台消费者发布重启或心跳超时 ──► GroupCoordinator 判定消费组成员发生变动 ──► 宣告开启全局重平衡</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">一只蝴蝶煽动翅膀引发全组海啸！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. 全员强制释放所有分区 (Stop-the-World: Revoke ALL Partitions)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">所有健康消费者被强制调用 onPartitionsRevoked() ──► 必须交出自己原本正常处理的全部 100 个分区！</text>
        <text x="15" y="62" font-size="8" fill="#eb6c36">整个消费组瞬间彻底瘫痪，消费吞吐断崖暴跌至 0！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. 全量重新加入与分配计算 (JoinGroup &amp; SyncGroup Roundtrip)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">所有消费者向 Coordinator 重新发起 JoinGroup ──► Leader 计算全新分配表 ──► 耗时数十秒甚至数分钟</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">产生海量消息积压 (Lag 暴涨上亿)！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 级联重平衡恶性循环 (Rebalance Storm Cascading Failure)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">恢复后由于积压巨大，拉取大批消息导致单次 poll() 超过 max.poll.interval.ms ──► 再次触发重平衡死循环！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">早期 Kafka 最令运维闻风丧胆的噩梦问题！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
