<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="evidence-engineering-pyramid-trust-model-title evidence-engineering-pyramid-trust-model-desc"><title id="evidence-engineering-pyramid-trust-model-title">工程信任金字塔：从口头声称到生产回放日志的可信度阶梯</title><desc id="evidence-engineering-pyramid-trust-model-desc">工程信任金字塔：从口头声称到生产回放日志的可信度阶梯</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">工程可信度阶梯：从主观臆断到生产物理闭环 (Trust Hierarchy)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Level 0: 概念假设 ──► Level 1: 本地单次运行 ──► Level 2: 严格控制变量与统计检验 ──► Level 3: 生产全链路遥测金标准</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">L0: 经验主观臆断</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">"我觉得这里应该加索引"</text>
          <text x="8" y="34" fill="#f5f5f5">"这段代码性能绝对没问题"</text>

          <text x="8" y="60" fill="#f5f5f5">致命缺陷：</text>
          <text x="8" y="76" fill="#f5f5f5">• 0 测量数据、0 慢日志</text>
          <text x="8" y="92" fill="#f5f5f5">• 盲目直觉导致生产灾难！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">可信度评价：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 0% 证据效力；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 禁止以此为依据合并代码；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 严厉拒绝臆断！</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">L1: 本地原型验证</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">本地写了个 demo.go 跑通：</text>

          <text x="8" y="38" fill="#f5f5f5">• 单机单线程 0 锁竞争</text>
          <text x="8" y="54" fill="#f5f5f5">• 缺少真实网络时延与脏数据</text>
          <text x="8" y="70" fill="#cbd5e1">• 仅能证明语法和基本逻辑</text>

          <text x="8" y="100" fill="#f5f5f5">⚠️ 距生产仍有巨大鸿沟</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">可信度评价：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 30% 证据效力；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 属于草稿与原型探索阶段；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 必须补充并发压力测试。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">L2: 严密基准与复现</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">可复现实验矩阵：</text>

          <text x="8" y="38" fill="#f5f5f5">• 包含完整依赖与一键启动脚本</text>
          <text x="8" y="54" fill="#f5f5f5">• 多轮采样与 p-value 统计显著性</text>
          <text x="8" y="70" fill="#f5f5f5">• 附带原始终端 log 存证</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 任何工程师均可 100% 复现！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">可信度评价：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 80% 证据效力；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 达到技术博客与开源 PR 标准；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 坚实的工程证据。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">L3: 生产遥测金标准</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">真实线上生产闭环：</text>

          <text x="8" y="38" fill="#f5f5f5">• 真实数亿级海量并发与流量洪峰</text>
          <text x="8" y="54" fill="#f5f5f5">• Prometheus/Grafana 观测指标</text>
          <text x="8" y="70" fill="#f5f5f5">• 故障注入与优雅熔断兜底</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 工业级终极可靠性证明！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 100% 工业级最高可信度；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 构筑核心系统坚不可摧的壁垒；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 资深工程师的终极追求！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
