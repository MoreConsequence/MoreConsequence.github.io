<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">工程可信度阶梯：从主观臆断到生产物理闭环 (Trust Hierarchy)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Level 0: 概念假设 ──► Level 1: 本地单次运行 ──► Level 2: 严格控制变量与统计检验 ──► Level 3: 生产全链路遥测金标准</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fef2f2"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">L0: 经验主观臆断</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#f87171">"我觉得这里应该加索引"</text>
          <text x="8" y="34" fill="#ef4444">"这段代码性能绝对没问题"</text>
          
          <text x="8" y="60" fill="#ef4444">致命缺陷：</text>
          <text x="8" y="76" fill="#fca5a5">• 0 测量数据、0 慢日志</text>
          <text x="8" y="92" fill="#ef4444">• 盲目直觉导致生产灾难！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">可信度评价：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 0% 证据效力；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 禁止以此为依据合并代码；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严厉拒绝臆断！</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">L1: 本地原型验证</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">本地写了个 demo.go 跑通：</text>
          
          <text x="8" y="38" fill="#fed7aa">• 单机单线程 0 锁竞争</text>
          <text x="8" y="54" fill="#38bdf8">• 缺少真实网络时延与脏数据</text>
          <text x="8" y="70" fill="#cbd5e1">• 仅能证明语法和基本逻辑</text>
          
          <text x="8" y="100" fill="#fb923c">⚠️ 距生产仍有巨大鸿沟</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">可信度评价：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 30% 证据效力；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 属于草稿与原型探索阶段；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 必须补充并发压力测试。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">L2: 严密基准与复现</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">可复现实验矩阵：</text>
          
          <text x="8" y="38" fill="#86efac">• 包含完整依赖与一键启动脚本</text>
          <text x="8" y="54" fill="#34d399">• 多轮采样与 p-value 统计显著性</text>
          <text x="8" y="70" fill="#34d399">• 附带原始终端 log 存证</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 任何工程师均可 100% 复现！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">可信度评价：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 80% 证据效力；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 达到技术博客与开源 PR 标准；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 坚实的工程证据。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">L3: 生产遥测金标准</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">真实线上生产闭环：</text>
          
          <text x="8" y="38" fill="#86efac">• 真实数亿级海量并发与流量洪峰</text>
          <text x="8" y="54" fill="#38bdf8">• Prometheus/Grafana 观测指标</text>
          <text x="8" y="70" fill="#4ade80">• 故障注入与优雅熔断兜底</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 工业级终极可靠性证明！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 100% 工业级最高可信度；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 构筑核心系统坚不可摧的壁垒；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 资深工程师的终极追求！</text>
      </g>
    </g>
  </g>
</svg>