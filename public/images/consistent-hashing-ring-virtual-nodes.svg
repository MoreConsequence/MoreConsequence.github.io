<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="consistent-hashing-ring-virtual-nodes-title consistent-hashing-ring-virtual-nodes-desc"><title id="consistent-hashing-ring-virtual-nodes-title">一致性哈希环与虚拟节点 (Virtual Nodes)：2^32 环拓扑与数据倾斜均衡</title><desc id="consistent-hashing-ring-virtual-nodes-desc">一致性哈希环与虚拟节点 (Virtual Nodes)：2^32 环拓扑与数据倾斜均衡</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">一致性哈希环与虚拟节点 (Consistent Hashing with Virtual Nodes)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">标准哈希 hash(k)%N (增删节点导致 100% 数据迁移) vs 一致性哈希环 (仅迁移 1/N 数据) + 每个物理节点 150 个虚拟节点 (负载方差 &lt; 2%)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 2^32 整数哈希环</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">环空间: [0, 2^32 - 1]</text>

          <text x="10" y="38" fill="#f5f5f5">寻址规则：</text>
          <text x="10" y="54" fill="#cbd5e1">• 计算 Key 的 Hash 值映射到环上某点</text>
          <text x="10" y="70" fill="#f5f5f5">• 顺时针方向 (Clockwise) 寻找</text>
          <text x="10" y="86" fill="#f5f5f5">• 第一个遇到的服务器节点负责存储！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 二分查找 O(log M) 极速定位！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 闭环首尾相连设计；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 建立稳定的空间映射坐标系；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 分布式存储理论核心。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">2. 节点增删最小化重映射</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">新增 Node D 插入环中：</text>

          <text x="10" y="38" fill="#f5f5f5">• 仅影响 Node D 与其逆时针前驱之间的 Key</text>
          <text x="10" y="54" fill="#f5f5f5">• 只有这部分数据需要重定位至 Node D</text>
          <text x="10" y="70" fill="#f5f5f5">• 其余 90% 的数据位置 100% 保持不动！</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 彻底消灭全量缓存雪崩！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 将扩容数据重平衡开销限制在 1/N；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 维持高并发缓存服务稳定性；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 水平弹性伸缩基石。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. 虚拟节点消除数据倾斜</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">单物理节点映射 150 个虚拟点：</text>

          <text x="10" y="38" fill="#f5f5f5">• NodeA#1, NodeA#2 ... NodeA#150</text>
          <text x="10" y="54" fill="#f5f5f5">• 虚拟节点交错均匀散落在环上的各个角落</text>
          <text x="10" y="70" fill="#f5f5f5">• 物理节点间负载标准差 &lt; 2%！</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 彻底解决数据倾斜与单点打爆！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 负载均衡与节点异构权重支持；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• Memcached, Cassandra, Dynamo 核心基石；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 分布式系统最经典的伟大算法！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
