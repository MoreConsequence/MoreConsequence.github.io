<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">一致性哈希环与虚拟节点 (Consistent Hashing with Virtual Nodes)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">标准哈希 hash(k)%N (增删节点导致 100% 数据迁移) vs 一致性哈希环 (仅迁移 1/N 数据) + 每个物理节点 150 个虚拟节点 (负载方差 &lt; 2%)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 2^32 整数哈希环</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">环空间: [0, 2^32 - 1]</text>
          
          <text x="10" y="38" fill="#86efac">寻址规则：</text>
          <text x="10" y="54" fill="#cbd5e1">• 计算 Key 的 Hash 值映射到环上某点</text>
          <text x="10" y="70" fill="#34d399">• 顺时针方向 (Clockwise) 寻找</text>
          <text x="10" y="86" fill="#34d399">• 第一个遇到的服务器节点负责存储！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 二分查找 O(log M) 极速定位！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 闭环首尾相连设计；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 建立稳定的空间映射坐标系；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 分布式存储理论核心。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 节点增删最小化重映射</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">新增 Node D 插入环中：</text>
          
          <text x="10" y="38" fill="#fed7aa">• 仅影响 Node D 与其逆时针前驱之间的 Key</text>
          <text x="10" y="54" fill="#38bdf8">• 只有这部分数据需要重定位至 Node D</text>
          <text x="10" y="70" fill="#34d399">• 其余 90% 的数据位置 100% 保持不动！</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 彻底消灭全量缓存雪崩！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 将扩容数据重平衡开销限制在 1/N；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 维持高并发缓存服务稳定性；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 水平弹性伸缩基石。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 虚拟节点消除数据倾斜</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">单物理节点映射 150 个虚拟点：</text>
          
          <text x="10" y="38" fill="#86efac">• NodeA#1, NodeA#2 ... NodeA#150</text>
          <text x="10" y="54" fill="#38bdf8">• 虚拟节点交错均匀散落在环上的各个角落</text>
          <text x="10" y="70" fill="#4ade80">• 物理节点间负载标准差 &lt; 2%！</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 彻底解决数据倾斜与单点打爆！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 负载均衡与节点异构权重支持；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• Memcached, Cassandra, Dynamo 核心基石；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 分布式系统最经典的伟大算法！</text>
      </g>
    </g>
  </g>
</svg>