<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Spanner TrueTime 物理不确定性区间与 Commit Wait 严格外部一致性</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">TT.now() 返回 [earliest, latest] 区间 (误差 ε = 7ms) ──► 事务提交时主动休眠等待 2ε ──► 确保因果先后顺序与物理时间 100% 绝对吻合</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. GPS + 原子钟硬件时钟同步 (Hardware-Anchored Time)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">每个数据中心部署 Master Time Daemon ──► 提供置信度极高的 [t.earliest, t.latest] (误差界限 ε &lt;= 7ms)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将物理时间从不可靠的猜想，变成具备严格数学误差上界的确定性区段！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 事务选定提交时间戳 (Commit Timestamp Selection)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">事务 T1 准备提交，调用 TT.now() ──► 选定 s = t.latest 作为自身提交版本号时间戳</text>
        <text x="15" y="62" font-size="8" fill="#047857">保证时间戳 s 绝对大于等于真实物理时间点，为后续因果定序奠定基准！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. Commit Wait 物理等待窗口 (Wait Until TT.now().earliest &gt; s)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">协调者主动将事务挂起，直到真实物理时间已经确信流逝过 s 之后（休眠约 2ε = 14ms）才放行提交！</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">用短暂的确定性等待，换取全球所有后续事务 T2 的时间戳 s2 必然严格大于 s1！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 全球分布式无锁快照读 (Lock-Free Global Snapshot Read)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">任意客户端在时间 t 发起读请求 ──► 0 加锁、0 协调者通信直读各分片 MVCC 历史 ──► 实现外部一致性！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">分布式系统史上最璀璨的工程奇迹之一！</text>
      </g>
    </g>
  </g>
</svg>