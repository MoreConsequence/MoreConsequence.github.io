<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Oract 耐久执行内核 (Durable Execution Kernel) 架构拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 状态机每步执行原子持久化 ──► 2. 宿主突发断电/崩溃 ──► 3. 确定性事件日志回放 ──► 4. 0 丢失从故障断点瞬间满血复活</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 确定性状态机契约 (Deterministic State Machine Contract)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">消除一切非确定性因素 (如随机数、系统时间强制由内核注入) ──► 保证同一事件序列重放结果 100% 绝对一致</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">耐久执行的数学理论基石！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 原子检查点与日志追加 (Atomic Journal &amp; Checkpoint)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">每执行一次 Side Effect (写文件、跑测试) ──► 必须先将 Operation 日志落盘 ──► 获得 WAL 事务级持久性保障</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">彻底告别内存状态意外丢失的恐慌！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 崩溃自愈与短路重放 (Crash Resuming &amp; Effect Short-Circuiting)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">进程重启 ──► 重放历史时直接从日志获取过去已执行的 Tool 结果 ──► 绝不重复发送外部真实网络请求！</text>
        <text x="15" y="62" font-size="8" fill="#047857">杜绝分布式系统重复副作用引发的灾难！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 无缝断点续跑 (Seamless Resume from Exact Point)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">在第 14 步崩溃 ──► 瞬间恢复到第 14 步继续向下执行 ──► 用户感知 0 任务中断！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Temporal / Oract 风格现代耐久计算的巅峰之作！</text>
      </g>
    </g>
  </g>
</svg>