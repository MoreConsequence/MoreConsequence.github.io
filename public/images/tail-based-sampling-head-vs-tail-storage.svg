<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">链路追踪采样架构演进：头部采样 (Head) vs 尾部智能采样 (Tail)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Head-based (入口固定 1% 随机采样，漏掉 99% 的核心报错) vs Tail-based (Collector 内存缓冲全量链路，错误 / 慢调用 100% 捕获入库)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Head Sampling -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 头部采样 (Head-based Sampling)：错失关键故障</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">在网关入口处随机抽样 1%：</text>
          
          <text y="38" fill="#ef4444">致命盲区：</text>
          <text y="52" fill="#fca5a5">• 线上发生偶发 500 严重错误或 10s 慢 SQL</text>
          <text y="68" fill="#ef4444">• 但在入口处因 99% 概率被直接丢弃！</text>
          <text y="84" fill="#ef4444">• 排障时去 Jaeger 搜索 TraceID 发现查无此人！</text>
          
          <text y="106" fill="#f87171">🔴 存了 99% 毫无价值的正常 200 链路，丢了核心报警证据！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 成本高昂却在关键时刻掉链子；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 无法满足 SRE 排障核心诉求；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 早期采样模型的局限。</text>
      </g>
    </g>

    <!-- Right: Tail Sampling -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 尾部采样 (Tail-based Sampling)：智能精准留存</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">OTel Collector 尾部智能过滤规则：</text>
          
          <text y="36" fill="#86efac">1. 全量链路在 Collector 内存中缓冲 30 秒</text>
          <text y="50" fill="#38bdf8">2. 规则 A: 状态码 status.code == ERROR ──► 100% 永久保留！</text>
          <text y="64" fill="#34d399">3. 规则 B: 总时延 latency &gt; 1000ms ──► 100% 永久保留！</text>
          <text y="78" fill="#4ade80">4. 规则 C: 极速普通正常请求 ──► 仅保留 0.1% 样本！</text>
          
          <text y="104" fill="#4ade80">✓ 存储成本降低 90%，排障准确率飙升至 100%！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 存储预算与高价值数据利用率的完美平衡；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 任何一次生产异常均能秒级回溯完整上下文；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化可观测性最高工程标准！</text>
      </g>
    </g>
  </g>
</svg>