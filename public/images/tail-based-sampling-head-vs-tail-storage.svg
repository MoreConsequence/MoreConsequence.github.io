<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="tail-based-sampling-head-vs-tail-storage-title tail-based-sampling-head-vs-tail-storage-desc"><title id="tail-based-sampling-head-vs-tail-storage-title">链路采样策略：Head-based 盲目丢弃 vs Tail-based 错误与慢调用 100% 保留</title><desc id="tail-based-sampling-head-vs-tail-storage-desc">链路采样策略：Head-based 盲目丢弃 vs Tail-based 错误与慢调用 100% 保留</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">链路追踪采样架构演进：头部采样 (Head) vs 尾部智能采样 (Tail)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Head-based (入口固定 1% 随机采样，漏掉 99% 的核心报错) vs Tail-based (Collector 内存缓冲全量链路，错误 / 慢调用 100% 捕获入库)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 头部采样 (Head-based Sampling)：错失关键故障</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">在网关入口处随机抽样 1%：</text>

          <text y="38" fill="#f5f5f5">致命盲区：</text>
          <text y="52" fill="#f5f5f5">• 线上发生偶发 500 严重错误或 10s 慢 SQL</text>
          <text y="68" fill="#f5f5f5">• 但在入口处因 99% 概率被直接丢弃！</text>
          <text y="84" fill="#f5f5f5">• 排障时去 Jaeger 搜索 TraceID 发现查无此人！</text>

          <text y="106" fill="#f5f5f5">🔴 存了 99% 毫无价值的正常 200 链路，丢了核心报警证据！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产痛点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 成本高昂却在关键时刻掉链子；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 无法满足 SRE 排障核心诉求；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 早期采样模型的局限。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 尾部采样 (Tail-based Sampling)：智能精准留存</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">OTel Collector 尾部智能过滤规则：</text>

          <text y="36" fill="#f5f5f5">1. 全量链路在 Collector 内存中缓冲 30 秒</text>
          <text y="50" fill="#f5f5f5">2. 规则 A: 状态码 status.code == ERROR ──► 100% 永久保留！</text>
          <text y="64" fill="#f5f5f5">3. 规则 B: 总时延 latency &gt; 1000ms ──► 100% 永久保留！</text>
          <text y="78" fill="#f5f5f5">4. 规则 C: 极速普通正常请求 ──► 仅保留 0.1% 样本！</text>

          <text y="104" fill="#f5f5f5">✓ 存储成本降低 90%，排障准确率飙升至 100%！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 存储预算与高价值数据利用率的完美平衡；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 任何一次生产异常均能秒级回溯完整上下文；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代化可观测性最高工程标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
