<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="librespeed-go-rest-curl-sequence-title librespeed-go-rest-curl-sequence-desc">
      <title id="librespeed-go-rest-curl-sequence-title">LibreSpeed Go curl session phases</title>
      <desc id="librespeed-go-rest-curl-sequence-desc">Sequence showing curl calls to speedtest-go for identity, measurement, telemetry, result reads, stats login, and the authenticated L100 view.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="librespeed-go-rest-curl-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="librespeed-go-rest-curl-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="librespeed-go-rest-curl-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <text x="40" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">SEQUENCE · LOCAL REPRODUCTION</text>
      <text x="40" y="92" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif" font-weight="400">LibreSpeed Go curl session phases</text>
      <text x="40" y="120" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" font-weight="400">Eight curl calls condensed into six readable phases; the returned ID feeds later result reads</text>

      <!-- lifelines -->
      <line x1="212" y1="204" x2="212" y2="540" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="744" y1="204" x2="744" y2="540" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- six request/response pairs; calls are blue, returns are dashed -->
      <line x1="212" y1="220" x2="744" y2="220" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#librespeed-go-rest-curl-sequence-arrow-link)"/>
      <line x1="744" y1="244" x2="212" y2="244" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#librespeed-go-rest-curl-sequence-arrow)"/>

      <line x1="212" y1="276" x2="744" y2="276" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#librespeed-go-rest-curl-sequence-arrow-link)"/>
      <line x1="744" y1="300" x2="212" y2="300" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#librespeed-go-rest-curl-sequence-arrow)"/>

      <line x1="212" y1="332" x2="744" y2="332" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#librespeed-go-rest-curl-sequence-arrow-link)"/>
      <line x1="744" y1="356" x2="212" y2="356" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#librespeed-go-rest-curl-sequence-arrow-accent)"/>

      <line x1="212" y1="388" x2="744" y2="388" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#librespeed-go-rest-curl-sequence-arrow-link)"/>
      <line x1="744" y1="412" x2="212" y2="412" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#librespeed-go-rest-curl-sequence-arrow)"/>

      <line x1="212" y1="444" x2="744" y2="444" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#librespeed-go-rest-curl-sequence-arrow-link)"/>
      <line x1="744" y1="468" x2="212" y2="468" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#librespeed-go-rest-curl-sequence-arrow)"/>

      <line x1="212" y1="500" x2="744" y2="500" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#librespeed-go-rest-curl-sequence-arrow-link)"/>
      <line x1="744" y1="524" x2="212" y2="524" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#librespeed-go-rest-curl-sequence-arrow)"/>

      <!-- call labels; masks leave an 8px gap before each call line -->
      <rect x="404" y="196" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="476" y="208" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">T0 GET /getIP</text>

      <rect x="412" y="252" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text x="476" y="264" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">T1/T2 MEASURE</text>

      <rect x="404" y="308" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="476" y="320" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">T3 TELEMETRY</text>

      <rect x="416" y="364" width="120" height="16" rx="2" fill="#f5f5f5"/>
      <text x="476" y="376" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">T4/T7 RESULTS</text>

      <rect x="428" y="420" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="476" y="432" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">T9 LOGIN</text>

      <rect x="416" y="476" width="120" height="16" rx="2" fill="#f5f5f5"/>
      <text x="476" y="488" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">T10 READ L100</text>

      <!-- response labels sit in an opaque outcome rail beyond the server lifeline -->
      <rect x="760" y="236" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text x="824" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 · JSON</text>

      <rect x="760" y="292" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="832" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 · 1MiB + sink</text>

      <rect x="760" y="348" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="832" y="360" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 · id &lt;ULID&gt;</text>

      <rect x="760" y="404" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="832" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 · JSON + PNG</text>

      <rect x="760" y="460" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="832" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">307 · Set-Cookie</text>

      <rect x="760" y="516" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="832" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 · HTML table</text>

      <!-- activation bars are painted after messages and before actor boxes -->
      <rect x="208" y="216" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="740" y="216" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="208" y="272" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="740" y="272" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="208" y="328" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="740" y="328" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="208" y="384" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="740" y="384" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="208" y="440" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="740" y="440" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="208" y="496" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="740" y="496" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- actor boxes -->
      <rect x="112" y="140" width="200" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="112" y="140" width="200" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="124" y="152" width="56" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
      <text x="152" y="164" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="212" y="176" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">curl script</text>
      <text x="212" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BASE=127.0.0.1:8915</text>

      <rect x="640" y="140" width="208" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="640" y="140" width="208" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="652" y="152" width="56" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
      <text x="680" y="164" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
      <text x="744" y="176" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">speedtest-go</text>
      <text x="744" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">chi router · handlers</text>

      <!-- horizontal legend strip -->
      <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
      <line x1="120" y1="572" x2="152" y2="572" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="164" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CALL</text>
      <line x1="264" y1="572" x2="296" y2="572" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="308" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETURN</text>
      <rect x="432" y="564" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="452" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ACTIVATION</text>
      <line x1="624" y1="572" x2="656" y2="572" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="668" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ID HANDOFF</text>
    </svg>
