  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">TOKEN ECONOMICS · DATABRICKS BENCHMARK &amp; HARNESS EFFICIENCY</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">Databricks 基准与极简 Harness 经济学</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">臃肿 Harness ($3.40/任务, 68k) vs Pi 极简架构 ($1.25/任务, 14.2k) ➔ 3x 上下文精简与 90% 最高通过率</text>

  
  
