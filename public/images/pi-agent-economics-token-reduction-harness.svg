    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• GLM 5.2 + Pi: $1.25 / 任务 | 14.2k tokens (87.5% 通过)</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• Opus 4.8 + Pi: $2.10 / 任务 | 90.0% 通过率 (全场第一)</text>

    
    <rect x="14" y="126" width="412" height="120" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">三大节约利器：</text>
    <text x="24" y="168" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 提示词克制：单行工具简述，每轮减少 3x 上下文；</text>
    <text x="24" y="186" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">2. 四工具极简主义：万能 bash + edit 行替换减少中间回填；</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 16384/20000 确定性 Compaction 双闸门！</text>
    <text x="24" y="224" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">3x Leaner Context &amp; Ultra-Low Cost Execution</text>

    
    <rect x="14" y="256" width="412" height="104" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="278" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">经济效益</text>
    <text x="24" y="298" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">用平价模型跑出旗舰质量，以透明工程控制实现真正的 Token 降本增效。</text>
    <text x="24" y="322" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Highest Cost/Performance Efficiency</text>
