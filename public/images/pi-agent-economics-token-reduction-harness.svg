    <text x="154" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">臃肿全能型 Harness</text>

    
    <rect x="14" y="42" width="392" height="74" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Databricks 实测基准数据 (GPT-5)</text>
    <text x="24" y="82" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 单任务成本: $3.40 / 任务 (高昂)</text>
    <text x="24" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">• 每轮上下文: 68.0k Tokens | Pass@1: 81.0%</text>

    
    <rect x="14" y="126" width="392" height="120" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">导致成本失控的根因：</text>
    <text x="24" y="168" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 工具 Schema 臃肿：注入几十个专用工具定义；</text>
    <text x="24" y="186" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">2. 全文件反复重写：缺少精准行级局部替换；</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 缺乏确定性截断：历史无效消息无限滚雪球。</text>
    <text x="24" y="224" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace">Context Avalanche &amp; Expensive Re-computation</text>

    
    <rect x="14" y="256" width="392" height="104" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="278" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">评级</text>
    <text x="24" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">过度包装的黑盒框架在企业大仓库中产生巨大的 Token 浪费与幻觉。</text>
    <text x="24" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Cost Inefficient &amp; High Hallucination</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Poor ROI for Monorepo Scaling</text>
