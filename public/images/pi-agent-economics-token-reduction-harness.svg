<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 经济学：少发 Token 才是硬道理，轻量 Harness 的成本对比</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">臃肿框架 (每轮全量重复发送 20 万 Token 堆砌上下文) vs Pi 精巧 Harness (增量差分 + Prompt 缓存对齐，成本骤降 83.5%)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Bloated Framework -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统臃肿 Agent：天价 Token 账单黑洞</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. 每次循环无脑注入整个代码仓库文件树 (50KB)</text>
          <text y="30" fill="#fca5a5">2. 动态随机插入 UUID 与时钟，100% 破坏 Prompt 缓存</text>
          <text y="46" fill="#fca5a5">3. 每次工具输出 10,000 行日志全部原封不动发给模型</text>
          <text y="64" fill="#ef4444">4. 50 轮对话累计消耗 12,000,000 Tokens！</text>
          
          <text y="90" fill="#ef4444">🔴 单个任务成本: $36.00 美元！</text>
          <text y="106" fill="#fb7185">► 企业级团队每天运行上千次，账单直接破产！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">恶性循环：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 上下文越长，模型注意力越涣散，幻觉率暴涨；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 首字生成时延 (TTFT) 恶化至 5 秒以上；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法在真实企业级工程中规模化落地！</text>
      </g>
    </g>

    <!-- Right: Pi Lean Harness -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Pi 极简 Harness：字节级缓存对齐与节流</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">1. 静态 System Prompt 严格前置，Prompt 缓存命中率 98%！</text>
          <text y="30" fill="#86efac">2. 工具输出严格截断与分页 (如仅保留前 100 行与错误栈)</text>
          <text y="48" fill="#38bdf8">3. 引入 KV Cache 友好的增量 Append 策略</text>
          <text y="66" fill="#4ade80">4. 50 轮对话真实结算 Token 仅 1,800,000 (且 90% 享受 1 折缓存价)</text>
          
          <text y="92" fill="#34d399">✓ 单个任务成本仅: $1.90 美元 (直降 94.7%！)</text>
          <text y="108" fill="#4ade80">✓ 首字时延 &lt; 300ms，极速丝滑响应！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工程经济学精要：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 优秀的 Agent 架构设计就是直接为公司省钱；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 上下文越聚焦，模型的代码修复准确率越高；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造兼具商业可行性与工业级性能的 Agent 底座！</text>
      </g>
    </g>
  </g>
</svg>