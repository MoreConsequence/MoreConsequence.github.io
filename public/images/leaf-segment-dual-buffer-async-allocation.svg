<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="leaf-segment-dual-buffer-async-allocation-title leaf-segment-dual-buffer-async-allocation-desc"><title id="leaf-segment-dual-buffer-async-allocation-title">美团 Leaf-segment 号段模式：双 Buffer 异步平滑预加载架构</title><desc id="leaf-segment-dual-buffer-async-allocation-desc">美团 Leaf-segment 号段模式：双 Buffer 异步平滑预加载架构</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">美团 Leaf-Segment 号段模式双 Buffer 异步预加载架构</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">单 Buffer 用尽同步阻塞查 DB (发生毛刺卡顿) vs 双 Buffer 异步机制 (当前 Buffer 消耗至 10% 异步线程自动加载下一个号段，业务请求 100% 纯内存 0ms 响应)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 单 Buffer 同步加载：突发时延毛刺</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">当前号段 [1..1000] 用尽：</text>
          <text y="28" fill="#f5f5f5">1. 第 1001 个并发请求到达 ──► 内存已空</text>
          <text y="42" fill="#f5f5f5">2. 业务线程被迫同步发起 DB UPDATE max_id = max_id + 1000</text>
          <text y="56" fill="#f5f5f5">3. 恰逢 DB 遇到锁等待或主从切换耗时 200ms</text>
          <text y="70" fill="#f5f5f5">4. 导致数百个前端请求全部阻塞挂起超时！</text>

          <text y="94" fill="#f5f5f5">💥 监控大盘周期性出现剧烈 P99 延迟尖刺！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产痛点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 数据库抖动直接反噬业务请求；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 无法满足苛刻金融级的低时延承诺；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 必须引入双缓冲解耦！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 双 Buffer 异步平滑换弹：100% 内存直出</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">双缓冲异步预热机制：</text>
          <text y="28" fill="#f5f5f5">1. 业务线程从 Buffer A [1..1000] 极速原子发号</text>

          <text y="50" fill="#f5f5f5">2. 当 Buffer A 消耗超过 10% (到达 100):</text>
          <text y="64" fill="#f5f5f5">   • 异步工作线程在后台静默向 DB 申请 Buffer B [1001..2000]</text>
          <text y="78" fill="#f5f5f5">3. Buffer A 用尽时 ──► 0ms 瞬间原子切换至 Buffer B！</text>

          <text y="104" fill="#f5f5f5">✓ 业务请求永远从内存中秒出，时延恒定 &lt; 0.1ms！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 彻底熨平数据库 I/O 抖动；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 即使数据库宕机 1 小时，内存号段仍可继续发号；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级分布式发号器最高架构典范！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
