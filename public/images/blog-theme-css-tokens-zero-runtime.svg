<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">博客 0 运行时现代排版系统与 CSS Design Tokens 拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">CSS 变量原生驱动 (0 CSS-in-JS 运行时 JS 体积) ｜ Editorial 浅色主题 ｜ 系统原生无衬线字体栈 ｜ 100% 纯静态秒开体验</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. CSS 变量设计令牌</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">:root {</text>
          <text x="10" y="34" fill="#86efac">  --bg-primary: #f8fafc;</text>
          <text x="10" y="50" fill="#86efac">  --text-primary: #0f172a;</text>
          <text x="10" y="66" fill="#34d399">  --accent-blue: #2563eb;</text>
          <text x="10" y="82" fill="#fed7aa">  --accent-orange: #ea580c;</text>
          <text x="10" y="98" fill="#38bdf8">}</text>
          
          <text x="10" y="122" fill="#4ade80">✓ 0 JS 介入，浏览器原生秒级切换！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 彻底消灭 Styled-Components 等运行时库；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 减少 50KB+ 客户端 JS 打包体积；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极简纯粹 Web 标准。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 系统原生字体栈 (0 网络字体)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">font-family: ui-sans-serif,</text>
          <text x="10" y="34" fill="#86efac">  system-ui, -apple-system,</text>
          <text x="10" y="50" fill="#38bdf8">  'PingFang SC', sans-serif;</text>
          
          <text x="10" y="74" fill="#34d399">性能收益：</text>
          <text x="10" y="90" fill="#34d399">• 0 网络字体请求 (FOIT/FOUT 0 闪烁)</text>
          <text x="10" y="106" fill="#4ade80">• 操作系统高分屏原生平滑抗锯齿！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">排版美学：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 契合苹果/微软操作系统原生质感；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 打造现代科技出版物经典风格；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 终极阅读舒适度。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 3 级相对路径双端兼容契约</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">![描述](../../../public/images/x.svg)</text>
          
          <text x="10" y="42" fill="#fed7aa">双端无缝兼容契约：</text>
          <text x="10" y="58" fill="#38bdf8">• 本地 IDE (Cursor/VSCode) 分栏秒预览</text>
          <text x="10" y="74" fill="#34d399">• Next.js 编译期 rehype 插件自动归一化</text>
          <text x="10" y="90" fill="#4ade80">• 线上 Web 站点 100% 绝对路径秒开！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 终结本地编辑看不见图的割裂体验；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 保持 Markdown 生态原生便携性；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 严谨内容工程契约典范！</text>
      </g>
    </g>
  </g>
</svg>