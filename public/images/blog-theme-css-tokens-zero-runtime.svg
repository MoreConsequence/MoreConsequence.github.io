<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="blog-theme-css-tokens-zero-runtime-title blog-theme-css-tokens-zero-runtime-desc"><title id="blog-theme-css-tokens-zero-runtime-title">博客主题设计系统：CSS 自定义属性 (Design Tokens) 与 0 运行时极速渲染</title><desc id="blog-theme-css-tokens-zero-runtime-desc">博客主题设计系统：CSS 自定义属性 (Design Tokens) 与 0 运行时极速渲染</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">博客 0 运行时现代排版系统与 CSS Design Tokens 拓扑</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">CSS 变量原生驱动 (0 CSS-in-JS 运行时 JS 体积) ｜ Editorial 浅色主题 ｜ 系统原生无衬线字体栈 ｜ 100% 纯静态秒开体验</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. CSS 变量设计令牌</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">:root {</text>
          <text x="10" y="34" fill="#f5f5f5">  --bg-primary: #f5f5f5;</text>
          <text x="10" y="50" fill="#f5f5f5">  --text-primary: #2d3142;</text>
          <text x="10" y="66" fill="#f5f5f5">  --accent-blue: #2563eb;</text>
          <text x="10" y="82" fill="#f5f5f5">  --accent-orange: #ea580c;</text>
          <text x="10" y="98" fill="#f5f5f5">}</text>

          <text x="10" y="122" fill="#f5f5f5">✓ 0 JS 介入，浏览器原生秒级切换！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 彻底消灭 Styled-Components 等运行时库；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 减少 50KB+ 客户端 JS 打包体积；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造极简纯粹 Web 标准。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 系统原生字体栈 (0 网络字体)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">font-family: ui-sans-serif,</text>
          <text x="10" y="34" fill="#f5f5f5">  system-ui, -apple-system,</text>
          <text x="10" y="50" fill="#f5f5f5">  'PingFang SC', sans-serif;</text>

          <text x="10" y="74" fill="#f5f5f5">性能收益：</text>
          <text x="10" y="90" fill="#f5f5f5">• 0 网络字体请求 (FOIT/FOUT 0 闪烁)</text>
          <text x="10" y="106" fill="#f5f5f5">• 操作系统高分屏原生平滑抗锯齿！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">排版美学：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 契合苹果/微软操作系统原生质感；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 打造现代科技出版物经典风格；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 终极阅读舒适度。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 3 级相对路径双端兼容契约</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">![描述](../../../public/images/x.svg)</text>

          <text x="10" y="42" fill="#f5f5f5">双端无缝兼容契约：</text>
          <text x="10" y="58" fill="#f5f5f5">• 本地 IDE (Cursor/VSCode) 分栏秒预览</text>
          <text x="10" y="74" fill="#f5f5f5">• Next.js 编译期 rehype 插件自动归一化</text>
          <text x="10" y="90" fill="#f5f5f5">• 线上 Web 站点 100% 绝对路径秒开！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 终结本地编辑看不见图的割裂体验；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 保持 Markdown 生态原生便携性；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 严谨内容工程契约典范！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
