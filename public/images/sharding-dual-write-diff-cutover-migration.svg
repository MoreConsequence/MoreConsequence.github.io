<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">数亿级分库分表 0 停机数据迁移流水线 (Four-Stage Data Migration)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 历史全量离线迁移 ──► 2. 增量 Binlog 双写并按分片键重哈希 ──► 3. 异步对账脚本 Diff 校验 100% 一致 ──► 4. 配置中心秒级切读切写</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 全量数据快照同步 (Full Snapshot Export &amp; Sharded Import)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">锁定起始位点 Binlog_Pos ──► 导出单库单表 5 亿行存量数据 ──► 计算 user_id % 64 批量灌入目标分库集群</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">完成数据基线建设！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 增量 Binlog 实时追平 (Incremental CDC &amp; Real-Time Re-Sharding)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">Canal 从 Binlog_Pos 开始消费 ──► 将在线增量写变更实时映射路由至目标分片 ──► 延迟迅速收敛至 &lt; 10ms</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">实现新老集群数据毫秒级镜像同步！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 连续对账与数据动态修复 (Continuous Diff Verification &amp; Repair)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">离线对比脚本全量扫描对比 MD5 校验和 ──► 自动捕获微小差异并补平 ──► 达到连续 48 小时 0 差异</text>
        <text x="15" y="62" font-size="8" fill="#047857">取得切流的铁证信心！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 动态配置秒级切流与老库退役 (Dynamic Switch &amp; Graceful Decommission)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">配置中心下发规则: 读写 100% 切换至新分库 ──► 观察 7 天无异常 ──► 彻底下线老旧单库单表！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">海量数据无感架构蜕变最高工程范式！</text>
      </g>
    </g>
  </g>
</svg>