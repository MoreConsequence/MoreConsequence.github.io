<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="sharding-dual-write-diff-cutover-migration-title sharding-dual-write-diff-cutover-migration-desc"><title id="sharding-dual-write-diff-cutover-migration-title">分库分表平滑迁移四部曲：全量数据同步 -&gt; 增量双写 -&gt; 数据校验 Diff 对齐 -&gt; 毫秒级无感切流</title><desc id="sharding-dual-write-diff-cutover-migration-desc">分库分表平滑迁移四部曲：全量数据同步 -&gt; 增量双写 -&gt; 数据校验 Diff 对齐 -&gt; 毫秒级无感切流</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">数亿级分库分表 0 停机数据迁移流水线 (Four-Stage Data Migration)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 历史全量离线迁移 ──► 2. 增量 Binlog 双写并按分片键重哈希 ──► 3. 异步对账脚本 Diff 校验 100% 一致 ──► 4. 配置中心秒级切读切写</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 全量数据快照同步 (Full Snapshot Export &amp; Sharded Import)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">锁定起始位点 Binlog_Pos ──► 导出单库单表 5 亿行存量数据 ──► 计算 user_id % 64 批量灌入目标分库集群</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">完成数据基线建设！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 增量 Binlog 实时追平 (Incremental CDC &amp; Real-Time Re-Sharding)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Canal 从 Binlog_Pos 开始消费 ──► 将在线增量写变更实时映射路由至目标分片 ──► 延迟迅速收敛至 &lt; 10ms</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">实现新老集群数据毫秒级镜像同步！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 连续对账与数据动态修复 (Continuous Diff Verification &amp; Repair)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">离线对比脚本全量扫描对比 MD5 校验和 ──► 自动捕获微小差异并补平 ──► 达到连续 48 小时 0 差异</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">取得切流的铁证信心！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 动态配置秒级切流与老库退役 (Dynamic Switch &amp; Graceful Decommission)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">配置中心下发规则: 读写 100% 切换至新分库 ──► 观察 7 天无异常 ──► 彻底下线老旧单库单表！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">海量数据无感架构蜕变最高工程范式！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
