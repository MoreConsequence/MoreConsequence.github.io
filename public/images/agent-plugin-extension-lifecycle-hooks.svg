<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 引擎插件系统微内核与扩展生命周期钩子 (Extension Hooks)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. onSessionStart (环境注入) ──► 2. beforeToolCall (参数拦截与安全审查) ──► 3. afterToolCall (结果脱敏与增强) ──► 4. onSessionEnd (日志归档)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 会话初始化钩子 (onSessionStart: Context Injection)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">读取用户本地配置与 Git 仓库元数据 ──► 动态向 System Prompt 注入插件专用指导规则与工具列表</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">赋予 Agent 针对特定领域知识的定制扩展能力！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 工具调用前置审查钩子 (beforeToolCall: Guardrail Interception)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">拦截即将执行的 Tool 请求 ──► 校验敏感命令 (如 rm -rf, git push) ──► 弹出交互确认框或静默拦截修改参数</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">实现企业级安全策略与合规审计的核心关卡！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 工具调用后置脱敏钩子 (afterToolCall: Observation Sanitization)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">读取 Tool 输出原始结果 ──► 自动正则过滤 API Key、手机号等敏感信息 ──► 压缩超长输出防止爆上下文</text>
        <text x="15" y="62" font-size="8" fill="#047857">保护数据隐私并极大节省后续推理 Token！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 会话完结与指标上报钩子 (onSessionEnd: Telemetry &amp; Storage)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">统计总耗时、Token 消耗、工具成功率 ──► 异步上报可观测平台 ──► 固化会话 Transcript 日志！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代微内核插件架构的优雅典范！</text>
      </g>
    </g>
  </g>
</svg>