<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">前端框架四代演进史：从命令式操作到编译期微观细粒度响应</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">jQuery (原生命令式) ──► AngularJS/Backbone (MVC 双向绑定) ──► React/Vue (VDOM 声明式) ──► Svelte/SolidJS (Signals 编译直达)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Generations Columns (210px each) -->
    <!-- Gen 1 -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f1f5f9"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">一代: jQuery (2006)</text>

      <g transform="translate(10, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="190" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="18" fill="#94a3b8">// 命令式精准 DOM 操纵</text>
          <text x="8" y="36" fill="#cbd5e1">$('#btn').on('click', () =&gt; {</text>
          <text x="14" y="52" fill="#cbd5e1">  $('#text').text('New');</text>
          <text x="14" y="68" fill="#cbd5e1">  $('#box').fadeIn();</text>
          <text x="8" y="84" fill="#cbd5e1">});</text>
          <text x="8" y="106" fill="#34d399">✓ 抹平各浏览器兼容差异</text>
          <text x="8" y="122" fill="#f87171">❌ 状态与 UI 割裂，面条代码</text>
          <text x="8" y="136" fill="#fca5a5">大规模应用维护成本灾难！</text>
        </g>
      </g>
    </g>

    <!-- Gen 2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">二代: AngularJS (2010)</text>

      <g transform="translate(10, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="190" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">// MVC 与双向数据绑定</text>
          <text x="8" y="36" fill="#fed7aa">&lt;input ng-model="name"&gt;</text>
          <text x="8" y="52" fill="#fed7aa">&lt;p&gt;Hello {{name}}&lt;/p&gt;</text>
          <text x="8" y="74" fill="#fb923c">• 脏检查机制 ($digest loop)</text>
          <text x="8" y="90" fill="#fed7aa">任何变更遍历检查所有 Watcher</text>
          <text x="8" y="112" fill="#34d399">✓ 首次实现数据驱动视图</text>
          <text x="8" y="128" fill="#f87171">❌ Watcher 破 2000 个后卡顿</text>
        </g>
      </g>
    </g>

    <!-- Gen 3 -->
    <g transform="translate(460, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">三代: React/Vue (2013+)</text>

      <g transform="translate(10, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="190" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">// Virtual DOM 与声明式</text>
          <text x="8" y="36" fill="#93c5fd">UI = f(state)</text>
          <text x="8" y="52" fill="#93c5fd">1. 状态改变生成新 VDOM 树</text>
          <text x="8" y="68" fill="#93c5fd">2. Diff 算法比对新旧 VDOM</text>
          <text x="8" y="84" fill="#93c5fd">3. 最小化 Patch 打补丁真实 DOM</text>
          <text x="8" y="106" fill="#34d399">✓ 开发心智模型极度清晰</text>
          <text x="8" y="122" fill="#fbbf24">⚠️ VDOM 存在不可忽视内存/Diff</text>
        </g>
      </g>
    </g>

    <!-- Gen 4 -->
    <g transform="translate(690, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">四代: Solid/Svelte (2019+)</text>

      <g transform="translate(10, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="190" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">// 无 VDOM / 编译期 Signals</text>
          <text x="8" y="36" fill="#86efac">const [count, setCount] = signal(0);</text>
          <text x="8" y="52" fill="#86efac">1. 编译期直接生成原生 DOM 更新指令</text>
          <text x="8" y="68" fill="#34d399">2. 细粒度 Signal 订阅单个 Text 节点</text>
          <text x="8" y="84" fill="#34d399">3. 变量变动直接点对点修改 textContent</text>
          <text x="8" y="106" fill="#34d399">✓ 零 VDOM Diff 开销！</text>
          <text x="8" y="122" fill="#34d399">✓ 运行速度逼近纯手工原生 JS！</text>
        </g>
      </g>
    </g>
  </g>
</svg>