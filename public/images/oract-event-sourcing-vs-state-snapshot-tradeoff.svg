<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">持久化范式对决：CRUD 状态快照 vs 事件溯源 (Event Sourcing)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">CRUD 覆盖更新 (仅保留最终状态，无法追溯中间推理过程与失败根因) vs 事件溯源 (保存完整时序事实链，天然支持审计、时光机与确定性重放)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: CRUD Snapshot -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. CRUD 状态覆盖模式 (State Overwrite)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">UPDATE agent_state SET status = 'FAILED' WHERE id = 1;</text>
          
          <text y="38" fill="#fb923c">致命信息丢失：</text>
          <text y="52" fill="#cbd5e1">• 数据库只记录当前是 FAILED 状态</text>
          <text y="68" fill="#f87171">• 彻底丢失了第 3 步为什么失败？调了什么 Tool？</text>
          <text y="84" fill="#f87171">• 无法还原事故现场，排查 Bug 犹如盲人摸象！</text>
          
          <text y="106" fill="#fb923c">⚠️ 传统关系型数据库常见通病！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制特性：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 存储体积小，直接读写当前快照；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 缺乏历史审计与分支回溯能力；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 仅适合简单无状态应用。</text>
      </g>
    </g>

    <!-- Right: Event Sourcing -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 事件溯源模式 (Event Sourcing: Source of Truth)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">不可变全息事件链：</text>
          
          <text y="36" fill="#86efac">1. TaskCreated(id=1, prompt="重构登录模块")</text>
          <text y="50" fill="#38bdf8">2. ToolExecuted(name="read_file", path="auth.go")</text>
          <text y="64" fill="#34d399">3. CodePatched(diff="- var a 
+ var b")</text>
          <text y="78" fill="#4ade80">4. 完美保留全生命周期每一步决策的“因”与“果”！</text>
          
          <text y="104" fill="#4ade80">✓ 法医级事故回溯与 100% 确定性重现！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 赋予系统时光机分支推演与完全可审计性；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑复杂分布式 Agent 的高置信度运行；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化 Agent 架构黄金基准！</text>
      </g>
    </g>
  </g>
</svg>