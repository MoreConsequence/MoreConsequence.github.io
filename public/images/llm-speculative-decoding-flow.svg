<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="llm-speculative-decoding-flow-title llm-speculative-decoding-flow-desc"><title id="llm-speculative-decoding-flow-title">投机采样（Speculative Decoding）推理全景：草稿推测与目标并行验证</title><desc id="llm-speculative-decoding-flow-desc">数据流全景图展示投机采样中小草稿模型极速自回归推测 K 个词、大目标模型单次前向并行矩阵验证以及接受-拒绝采样实现 2.5x~3.8x 无损加速的全流程。</desc>
  <defs>
    <marker id="sf-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="sf-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">SPECULATIVE DECODING PIPELINE · DRAFT SPECULATION &amp; TARGET VERIFICATION</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">投机采样 (Speculative Decoding) 推理全景</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">小草稿模型 (1B/推测 K=4 词) ➔ 大目标模型 (70B/单次前向并行验证全部概率) ➔ 接受-拒绝判定 ➔ 2.5x~3.8x 无损加速</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="270" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="69" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 1 · DRAFT</text>
    <text x="134" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">草稿模型推测</text>

    
    <rect x="14" y="42" width="242" height="110" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">LLaMA-3 1B (草稿模型)</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• 权重仅 2GB，显存搬运极快 (5ms)</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 快速自回归生成 K=4 个候选 Tokens</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• 输出分布: x1, x2, x3, x4 ~ q(x)</text>
    <text x="24" y="136" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Fast Speculative Probing</text>

    
    <rect x="14" y="162" width="242" height="152" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">机制特征：</text>
    <text x="24" y="204" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 算力开销极小，毫秒级产出一组猜测；</text>
    <text x="24" y="224" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 不要求草稿模型 100% 准确；</text>
    <text x="24" y="244" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 哪怕猜错后续也会被大模型瞬间修正。</text>
    <line x1="24" y1="258" x2="246" y2="258" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Low-Cost Forward Guessing</text>
    <text x="24" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Lightweight Draft Generation</text>
  </g>

  
  <text x="325" y="225" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Verify</text>
  <line x1="310" y1="233" x2="340" y2="233" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#sf-arr-accent)" />

  
  <g transform="translate(340, 136)">
    <rect width="290" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="120" height="18" rx="2" fill="#eb6c36" />
    <text x="74" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STAGE 2 · VERIFY</text>
    <text x="144" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">大模型单次并行验证</text>

    
    <rect x="14" y="42" width="262" height="110" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">LLaMA-3 70B (单次前向)</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1. 打包 Prompt + 4 个候选词</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. 仅做 1 次前向计算！搬运 70GB 权重 1 次</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">3. 并行输出 4 个位置真实分布 p(x)</text>
    <text x="24" y="136" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Single Forward Parallel Matrix Verify</text>

    
    <rect x="14" y="162" width="262" height="152" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">显存带宽终极破局：</text>
    <text x="24" y="204" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 彻底免除 4 次串行搬运 70GB 权重的浪费；</text>
    <text x="24" y="224" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 借助因果掩码实现一次性并行打分；</text>
    <text x="24" y="244" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 将算术强度瞬间提升 4 倍！</text>
    <line x1="24" y1="258" x2="266" y2="258" stroke="#eb6c36" stroke-width="1.2" />
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">4x Arithmetic Intensity Boost</text>
    <text x="24" y="296" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">用并行矩阵计算换取显存总线吞吐</text>
  </g>

  
  <text x="645" y="225" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Sample</text>
  <line x1="630" y1="233" x2="660" y2="233" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#sf-arr-accent)" />

  
  <g transform="translate(660, 136)">
    <rect width="260" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#2d3142" />
    <text x="69" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STAGE 3 · DECIDE</text>
    <text x="134" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">接受判定与加速</text>

    
    <rect x="14" y="42" width="232" height="110" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">P(accept) = min(1, p/q)</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1. 接受分支: 连续采纳命中词 (如 3 个)</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. 拒绝分支: 从残差分布 p'(x) 重采样</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">3. 1 次 Forward 产出 3~4 个 Tokens！</text>
    <text x="24" y="136" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">2.5x~3.8x End-to-End Speedup</text>

    
    <rect x="14" y="162" width="232" height="152" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">数学无损保证：</text>
    <text x="24" y="204" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 最终输出分布严格等价于 70B 原生采样；</text>
    <text x="24" y="224" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 智力水平与生成质量 0 衰减；</text>
    <text x="24" y="244" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 代码/JSON 场景推理吞吐暴增！</text>
    <line x1="24" y1="258" x2="236" y2="258" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">100% Exact Mathematical Equivalence</text>
    <text x="24" y="296" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">现代推理引擎核心加速黑科技</text>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="506.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="518.0" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">1B 草稿模型快速自回归推测</text>
  <rect x="330" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="350" y="518.0" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">70B 大模型单次前向并行矩阵验证与 2.5x~3.8x 无损加速核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
