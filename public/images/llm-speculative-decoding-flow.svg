<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">投机采样（Speculative Decoding）推理全景：草稿推测与大模型并行验证</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">小模型（Draft Model 1B）极速自回归推测 K 个候选词 ──► 大模型（Target Model 70B）单次前向并行矩阵乘法校验</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Step 1: Draft Speculation (Top Row) -->
    <g transform="translate(20, 20)">
      <rect width="860" height="95" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="860" height="28" rx="6" fill="#dbeafe"/>
      <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">步骤一：小草稿模型快速自回归推测 (Small Draft Model, e.g. LLaMA-1B)</text>

      <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <text x="0" y="16" fill="#1e40af">草稿模型体积小（显存搬运极快），连续生成 $K=4$ 个候选词：</text>
        <g transform="translate(380, 0)" font-family="ui-monospace, monospace" font-size="11">
          <rect x="0" y="0" width="70" height="24" rx="3" fill="#ffffff" stroke="#3b82f6"/>
          <text x="35" y="16" fill="#1d4ed8" text-anchor="middle">"The"</text>

          <rect x="78" y="0" width="80" height="24" rx="3" fill="#ffffff" stroke="#3b82f6"/>
          <text x="118" y="16" fill="#1d4ed8" text-anchor="middle">"capital"</text>

          <rect x="166" y="0" width="70" height="24" rx="3" fill="#ffffff" stroke="#3b82f6"/>
          <text x="201" y="16" fill="#1d4ed8" text-anchor="middle">"of"</text>

          <rect x="244" y="0" width="80" height="24" rx="3" fill="#ffffff" stroke="#3b82f6"/>
          <text x="284" y="16" fill="#1d4ed8" text-anchor="middle">"France"</text>
        </g>
        <text x="0" y="44" font-size="9.5" fill="#2563eb">物理耗时极低：总共只需约 5ms 即可产出 4 个候选 Tokens</text>
      </g>
    </g>

    <!-- Step 2: Target Parallel Verification (Middle Row) -->
    <g transform="translate(20, 125)">
      <rect width="860" height="125" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect width="860" height="28" rx="6" fill="#dcfce7"/>
      <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">步骤二：大目标模型单次前向并行矩阵校验 (Target Model, e.g. LLaMA-70B)</text>

      <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <text x="0" y="16" fill="#14532d">大模型无需分 4 轮加载 70GB 权重，而是<tspan font-weight="700" fill="#047857">仅做 1 次 Forward</tspan> 同步并行计算 4 个词的概率分布：</text>

        <!-- Verification Slots -->
        <g transform="translate(0, 26)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <!-- Token 1 -->
          <rect x="0" y="0" width="180" height="34" rx="4" fill="#ffffff" stroke="#10b981"/>
          <text x="10" y="16" font-weight="700" fill="#065f46">Token 1: "The"</text>
          <text x="10" y="28" font-size="9.5" fill="#10b981">✓ 概率通过 (Accept)</text>

          <!-- Token 2 -->
          <rect x="190" y="0" width="180" height="34" rx="4" fill="#ffffff" stroke="#10b981"/>
          <text x="10" y="16" font-weight="700" fill="#065f46">Token 2: "capital"</text>
          <text x="10" y="28" font-size="9.5" fill="#10b981">✓ 概率通过 (Accept)</text>

          <!-- Token 3 -->
          <rect x="380" y="0" width="180" height="34" rx="4" fill="#ffffff" stroke="#10b981"/>
          <text x="10" y="16" font-weight="700" fill="#065f46">Token 3: "of"</text>
          <text x="10" y="28" font-size="9.5" fill="#10b981">✓ 概率通过 (Accept)</text>

          <!-- Token 4 -->
          <rect x="570" y="0" width="240" height="34" rx="4" fill="#fee2e2" stroke="#f87171"/>
          <text x="10" y="16" font-weight="700" fill="#991b1b">Token 4: "France"</text>
          <text x="10" y="28" font-size="9.5" fill="#dc2626">✗ 拒绝并由大模型重采样纠正</text>
        </g>

        <text x="0" y="76" font-size="9.5" font-weight="700" fill="#047857">🎯 本次单轮 Forward 产出：成功接收 3 个词 + 大模型纠正 1 个词 = 单次生成 4 个 Tokens！（速度暴涨 2.8 倍）</text>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">加速本质：</tspan> 将大模型原本受限于显存带宽的低效串行生成，转换为 <tspan font-weight="700" fill="#2563eb">“算力密集型的并行验证”</tspan>；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#10b981" font-weight="700" text-anchor="middle">
        接受-拒绝采样在数学上严格保证了输出概率分布与大模型原生推理 100% 无损等价！
      </text>
    </g>
  </g>
</svg>
