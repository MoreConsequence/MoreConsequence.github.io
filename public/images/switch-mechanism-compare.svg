<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" rx="12" fill="#fafbff" stroke="#d7def0"/>

  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">三种并发模型的切换流程对比：层级越轻，搬得越少</text>

  <rect x="42" y="56" width="250" height="36" rx="8" fill="#7f1d1d" stroke="#ef4444"/>
  <text x="167" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">进程 (Process)</text>

  <rect x="325" y="56" width="250" height="36" rx="8" fill="#52400c" stroke="#eab308"/>
  <text x="450" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">线程 (Kernel Thread)</text>

  <rect x="608" y="56" width="250" height="36" rx="8" fill="#14532d" stroke="#22c55e"/>
  <text x="733" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">协程 (Goroutine)</text>

  <g font-size="13" font-weight="600">
    <rect x="42" y="104" width="250" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="167" y="126" text-anchor="middle" fill="#7f1d1d">① Trap 陷入内核态</text>
    <rect x="42" y="148" width="250" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="167" y="170" text-anchor="middle" fill="#7f1d1d">② 切换 CR3 + TLB 刷新</text>
    <rect x="42" y="192" width="250" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="167" y="214" text-anchor="middle" fill="#7f1d1d">③ 全量寄存器 PUSH/POP</text>
    <rect x="42" y="236" width="250" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="167" y="258" text-anchor="middle" fill="#7f1d1d">④ 新进程 TLB / 缓存全冷</text>
    <rect x="42" y="290" width="250" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="167" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">~1000 - 2000 ns</text>

    <rect x="325" y="104" width="250" height="34" rx="6" fill="#fefce8" stroke="#fde047"/>
    <text x="450" y="126" text-anchor="middle" fill="#854d0e">① Trap 陷入内核态</text>
    <rect x="325" y="148" width="250" height="34" rx="6" fill="#fefce8" stroke="#fde047"/>
    <text x="450" y="170" text-anchor="middle" fill="#854d0e">② 保留 CR3（共享地址空间）</text>
    <rect x="325" y="192" width="250" height="34" rx="6" fill="#fefce8" stroke="#fde047"/>
    <text x="450" y="214" text-anchor="middle" fill="#854d0e">③ 保存/恢复通用寄存器</text>
    <rect x="325" y="236" width="250" height="34" rx="6" fill="#fefce8" stroke="#fde047"/>
    <text x="450" y="258" text-anchor="middle" fill="#854d0e">④ 缓存热度大体保留</text>
    <rect x="325" y="290" width="250" height="40" rx="6" fill="#fef3c7" stroke="#eab308" stroke-width="1.5"/>
    <text x="450" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">~300 - 800 ns</text>

    <rect x="608" y="104" width="250" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="733" y="126" text-anchor="middle" fill="#065f46">① GMP 用户态调度（Ring 3）</text>
    <rect x="608" y="148" width="250" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="733" y="170" text-anchor="middle" fill="#065f46">② 仅保存 8 个寄存器</text>
    <rect x="608" y="192" width="250" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="733" y="214" text-anchor="middle" fill="#065f46">③ 2KB 动态栈切换</text>
    <rect x="608" y="236" width="250" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="733" y="258" text-anchor="middle" fill="#065f46">④ 0 系统调用</text>
    <rect x="608" y="290" width="250" height="40" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
    <text x="733" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">~10 - 30 ns</text>
  </g>

  <line x1="167" y1="352" x2="167" y2="380" stroke="#ef4444" stroke-width="2"/>
  <line x1="450" y1="352" x2="450" y2="380" stroke="#eab308" stroke-width="2"/>
  <line x1="733" y1="352" x2="733" y2="380" stroke="#22c55e" stroke-width="2"/>
  <line x1="167" y1="380" x2="733" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#s-arrow)"/>
  <text x="450" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">开销递减，Cache / TLB 保留程度递增</text>

  <rect x="42" y="420" width="816" height="28" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="450" y="439" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3730a3">关键差异不在寄存器，而在地址空间与特权级：CR3 越少动，微架构污染越小</text>
</svg>
