<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">三种并发载体切换机制对比：特权级、地址空间与微架构开销</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">从重量级进程（CR3 切页 + TLB 清空）到用户态 Goroutine（仅 8 寄存器 + 2KB 动态栈）的物理突破</text>
  </g>

  <!-- 3 Equal Columns (280px each, gap 30px) -->
  <g transform="translate(30, 75)">
    <!-- Column 1: Process -->
    <g filter="url(#card-shadow)">
      <rect width="280" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="280" height="40" rx="8" fill="#f1f5f9"/>
      <text x="140" y="25" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">1. 操作系统进程 (Process)</text>

      <g transform="translate(16, 54)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">
        <rect x="0" y="0" width="248" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="21" font-weight="600">① Trap 陷入内核态 (Ring 0)</text>

        <rect x="0" y="42" width="248" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="10" y="21" transform="translate(0, 42)" font-weight="700" fill="#c2410c">② 切换 CR3 + TLB 全量清空</text>

        <rect x="0" y="84" width="248" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="21" transform="translate(0, 84)">③ 保存/恢复全部 CPU 寄存器</text>

        <rect x="0" y="126" width="248" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="21" transform="translate(0, 126)">④ L1/L2/L3 硬件缓存冷启动污染</text>

        <!-- Latency Badge -->
        <rect x="0" y="174" width="248" height="38" rx="6" fill="#fef2f2" stroke="#fecaca"/>
        <text x="124" y="198" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">⏱️ 1000 ~ 2000 ns</text>
      </g>
    </g>

    <!-- Column 2: Kernel Thread -->
    <g transform="translate(310, 0)" filter="url(#card-shadow)">
      <rect width="280" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="280" height="40" rx="8" fill="#f1f5f9"/>
      <text x="140" y="25" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">2. 内核线程 (Kernel Thread)</text>

      <g transform="translate(16, 54)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">
        <rect x="0" y="0" width="248" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="21" font-weight="600">① 中断/系统调用陷入 Ring 0</text>

        <rect x="0" y="42" width="248" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="21" transform="translate(0, 42)">② 保持 CR3（共享进程虚拟内存）</text>

        <rect x="0" y="84" width="248" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="21" transform="translate(0, 84)">③ 保存通用寄存器与内核栈</text>

        <rect x="0" y="126" width="248" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="21" transform="translate(0, 126)">④ 共享地址空间，TLB 缓存保留</text>

        <!-- Latency Badge -->
        <rect x="0" y="174" width="248" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="124" y="198" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">⏱️ 300 ~ 800 ns</text>
      </g>
    </g>

    <!-- Column 3: Goroutine -->
    <g transform="translate(620, 0)" filter="url(#card-shadow)">
      <rect width="280" height="280" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="280" height="40" rx="8" fill="#eff6ff"/>
      <text x="140" y="25" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">3. Go 协程 (Goroutine)</text>

      <g transform="translate(16, 54)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">
        <rect x="0" y="0" width="248" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="10" y="21" font-weight="700" fill="#15803d">① 纯用户态调度 (Ring 3 无系统调用)</text>

        <rect x="0" y="42" width="248" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="10" y="21" transform="translate(0, 42)" font-weight="700" fill="#15803d">② 仅保存 8 个 Callee-saved 寄存器</text>

        <rect x="0" y="84" width="248" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="10" y="21" transform="translate(0, 84)" font-weight="700" fill="#15803d">③ 2KB 极小动态连续栈（非 8MB 锁死）</text>

        <rect x="0" y="126" width="248" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="10" y="21" transform="translate(0, 126)" font-weight="700" fill="#15803d">④ 0 内核切换，TLB/L1 Cache 100% 热</text>

        <!-- Latency Badge -->
        <rect x="0" y="174" width="248" height="38" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="124" y="198" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">🚀 10 ~ 30 ns (快 100 倍)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(30, 375)">
    <rect width="900" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <text x="450" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      💡 <tspan font-weight="700" fill="#0f172a">核心第一性原理：</tspan> 切换开销的本质从来不仅是保存几个寄存器，而是 <tspan font-weight="700" fill="#2563eb">CR3 页表切换所引发的硬件 TLB 全量失效与 CPU 流水线冲刷（Pipeline Flush）</tspan>。
    </text>
  </g>
</svg>
