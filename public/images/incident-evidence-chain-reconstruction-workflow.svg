<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">生产事故证据链重建流程：拒绝口头传闻，打造物理级事实铁证</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">口头传言推测 ──► 1. 毫秒级时序对齐 ──► 2. 指标/日志交叉印证 ──► 3. 故障注入反向复现 ──► 真正根因归档</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Cascading Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">阶段 1: 物理时间戳毫秒级对齐 (Timeline Synchronization)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">14:02:15.120 [K8s Pod 重启] ──► 14:02:15.125 [DB 连接池耗尽] ──► 14:02:15.130 [网关 502 爆发]</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将 Nginx、应用服务、数据库与操作系统日志全部统一转换至 UTC 毫秒时间轴，绘制精确因果时序！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">阶段 2: 指标 (Metrics) 与分布式追踪 (Tracing) 交叉印证</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Prometheus CPU 突刺 + OpenTelemetry TraceSpan 定位到某条未经索引的慢 SQL (耗时 12.5s)</text>
        <text x="15" y="62" font-size="8" fill="#047857">杜绝孤证！必须保证日志报错、指标波动与分布式追踪链路在时间与 Trace ID 上 100% 互相吻合！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">阶段 3: 本地/预发环境故障注入反向复现 (Reproduction)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">编写复现脚本: 模拟 500 并发压测同一接口，成功在本地 100% 复现完全一致的死锁崩溃现象！</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">无法在受控环境中稳定复现的"根因"，只能算作未经证实的猜测！必须完成闭环复现！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">阶段 4: 防御性工程改造与全自动回归用例合流 (Prevention)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">添加复合索引 + 慢查询超时熔断 + 写入 CI 压力测试用例，彻底从物理架构上消灭同类故障！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">复盘的终点不是写报告甩锅，而是将防线固化为不可逾越的自动化代码与架构约束！</text>
      </g>
    </g>
  </g>
</svg>