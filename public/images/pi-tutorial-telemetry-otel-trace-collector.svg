<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 基于 OpenTelemetry (OTel) 的 Agent 分布式链路追踪体系</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Root Span (Agent Turn: 12.4s) ──► Child Span (Step 1: LLM Reasoning 1.8s) ──► Child Span (Tool: view_file 4ms) ──► Child Span (Step 2)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Root Span: 全局会话轮次 (Trace: agent.turn / Duration: 8.5s)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">记录全局会话上下文、用户输入长度、总消耗 Token 与最终完成状态</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">全链路追踪的顶层父节点！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. Child Span: 大模型推理耗时 (Span: llm.stream / Duration: 1.2s)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">属性附带: provider="claude-3-7-sonnet", ttft_ms=180, input_tokens=42000, output_tokens=320</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">精准度量首字延迟与大模型吐字速率！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. Child Span: 工具沙箱物理执行 (Span: tool.execute / Duration: 450ms)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">属性附带: tool_name="run_command", exit_code=0, stdout_bytes=1024</text>
        <text x="15" y="62" font-size="8" fill="#047857">透明洞察本地操作系统的物理执行细节！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 导出至 Jaeger / Grafana Tempo (OTLP Export &amp; Real-time Observability)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">标准 OTLP gRPC 异步批量导出 ──► 0 阻塞核心执行 ──► 在大盘中实现微秒级瓶颈定位！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代 AI Agent 可观测性工程的最高标准！</text>
      </g>
    </g>
  </g>
</svg>