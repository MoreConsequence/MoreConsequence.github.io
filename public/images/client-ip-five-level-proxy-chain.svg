<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="client-ip-five-level-proxy-chain-title client-ip-five-level-proxy-chain-desc"><title id="client-ip-five-level-proxy-chain-title">五级候选读取：getClientIP 如何逐级降级</title><desc id="client-ip-five-level-proxy-chain-desc">Sequence showing getClientIP reading five request candidates in source order, sending candidates through normalizeCandidateIP, continuing on an empty result, and using RemoteAddr last.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');</style>
        <marker id="client-ip-five-level-proxy-chain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="client-ip-five-level-proxy-chain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="client-ip-five-level-proxy-chain-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <text x="40" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">LIBRESPEED GO · getClientIP</text>
      <text x="40" y="92" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">五级候选读取：getClientIP 如何逐级降级</text>
      <text x="40" y="120" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">字段顺序是源码合同；代理头来源与可信边界不在此图内</text>

      <!-- Fragment and lifelines. -->
      <rect x="48" y="216" width="864" height="296" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="48" y="216" width="48" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="72" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="112" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" letter-spacing="0.04em">priority 1→5 · each candidate normalized · first valid ends</text>

      <line x1="144" y1="200" x2="144" y2="512" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="200" x2="480" y2="512" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="816" y1="200" x2="816" y2="512" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars. -->
      <rect x="476" y="244" width="8" height="256" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="812" y="280" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="812" y="420" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages: horizontal calls, dashed returns, and one orthogonal self-message. -->
      <line x1="144" y1="268" x2="480" y2="268" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <line x1="480" y1="296" x2="816" y2="296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <line x1="816" y1="324" x2="480" y2="324" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <line x1="144" y1="352" x2="480" y2="352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <line x1="144" y1="380" x2="480" y2="380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <line x1="144" y1="408" x2="480" y2="408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <line x1="480" y1="436" x2="816" y2="436" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <line x1="816" y1="464" x2="480" y2="464" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <path d="M480 492 H520 Q528 492 528 500 V504 Q528 508 520 508 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>

      <!-- Message labels. Every mask is separated from its connector. -->
      <rect x="224" y="248" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">READ · 1 CF-Connecting-IPv6</text>
      <rect x="588" y="276" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK · ipv6=true</text>
      <rect x="580" y="304" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">VALID / EMPTY → RETURN / CONTINUE</text>
      <rect x="256" y="332" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">READ · 2 Client-IP</text>
      <rect x="256" y="360" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">READ · 3 X-Real-IP</text>
      <rect x="184" y="388" width="256" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">READ · 4 X-Forwarded-For · first token</text>
      <rect x="588" y="416" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK · ipv6=false</text>
      <rect x="580" y="444" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="453" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">VALID / EMPTY → RETURN / CONTINUE</text>
      <rect x="544" y="480" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="489" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle" letter-spacing="0.06em">READ · 5 RemoteAddr</text>

      <!-- Actors are drawn after messages so their opaque fills mask line ends. -->
      <rect x="64" y="144" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="144" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="76" y="152" width="48" height="16" rx="2" fill="none" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="100" y="164" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="144" y="176" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">HTTP request</text>
      <text x="144" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">headers + RemoteAddr</text>

      <rect x="400" y="144" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="144" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="412" y="152" width="48" height="16" rx="2" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="436" y="164" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">FUNC</text>
      <text x="480" y="176" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">getClientIP</text>
      <text x="480" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">first valid → return</text>

      <rect x="736" y="144" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="144" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="748" y="152" width="48" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="772" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">FUNC</text>
      <text x="816" y="176" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600" text-anchor="middle">normalizeCandidateIP</text>
      <text x="816" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" text-anchor="middle">TrimSpace · ParseIP</text>

      <!-- Legend. -->
      <line x1="40" y1="532" x2="920" y2="532" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
      <rect x="144" y="548" width="32" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="184" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">FOCAL FUNCTION</text>
      <line x1="344" y1="548" x2="344" y2="564" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="360" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">LIFELINE</text>
      <line x1="488" y1="556" x2="520" y2="556" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <text x="532" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">CALL</text>
      <line x1="616" y1="556" x2="648" y2="556" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#client-ip-five-level-proxy-chain-arrow)"/>
      <text x="660" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace">RETURN</text>
    </svg>
