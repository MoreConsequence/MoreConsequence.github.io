  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">READ-WRITE SPLITTING ARCHITECTURE · CONSISTENCY DEFENSE</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">读写分离一致性保障三大防御姿势</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">姿势 A 强行读主 (舍弃扩展保一致) vs 姿势 B 版本校验与读己之写 (极致平衡) vs 姿势 C 半同步 (写 RTT 买一致)</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="270" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="80" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="54" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">POSTURE A</text>
    <text x="104" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">强制主库路由</text>

    
    <rect x="14" y="42" width="242" height="100" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">读写同源，零延迟风险</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• 读写全部直连 Master 实例</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 承诺: 强一致性 (Strong Consistency)</text>
    <text x="24" y="118" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">• 代价: 读扩展能力完全归零</text>
    <text x="24" y="132" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Direct Master Read Route</text>

    
    <rect x="14" y="152" width="242" height="100" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="174" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">适用核心业务：</text>
    <text x="24" y="194" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 账户可用余额、资金流转；</text>
    <text x="24" y="214" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 关键订单创建与支付确认；</text>
    <text x="24" y="232" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 本来就不该走复制的绝对核心。</text>

    
    <rect x="14" y="262" width="242" height="98" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="284" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">架构认知</text>
    <text x="24" y="302" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">用最朴素的牺牲读扩展，彻底买断延迟事故风险。</text>
    <text x="24" y="326" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Zero Read-Replication Complexity</text>
    <text x="24" y="342" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Maximum Strict Safety</text>
  </g>

  
  <g transform="translate(340, 136)">
    <rect width="290" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#eb6c36" />
    <text x="79" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">POSTURE B · RECOMMENDED</text>
    <text x="154" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">版本校验与读己之写</text>

    
    <rect x="14" y="42" width="262" height="100" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">会话粘性 + 行版本兜底</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1. 读己之写: 写后 5 秒内会话强制读主</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. 版本校验: 从库 version &lt; req 重读主</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">3. 95% 流量走从库，5% 兜底重读</text>
    <text x="24" y="132" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Session Stickiness &amp; Token Check</text>

    
    <rect x="14" y="152" width="262" height="100" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="174" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">收益与工程权衡：</text>
    <text x="24" y="194" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 极大发挥从库海量读扩展红利；</text>
    <text x="24" y="214" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 用户刚提交修改后刷新体验完全平滑；</text>
    <text x="24" y="232" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 代码层增加轻量路由中间件。</text>

    
    <rect x="14" y="262" width="262" height="98" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="284" fill="#eb6c36" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">生产推荐架构</text>
    <text x="24" y="302" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">现代高并发 Web/App 首选：在极佳读吞吐与严格用户体感一致性之间取得极致平衡！</text>
    <text x="24" y="326" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Optimal Scale &amp; UX Consistency</text>
    <text x="24" y="342" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Standard Enterprise Route</text>
  </g>

  
  <g transform="translate(660, 136)">
    <rect width="260" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="80" height="18" rx="2" fill="#2d3142" />
    <text x="54" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">POSTURE C</text>
    <text x="104" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">半同步复制</text>

    
    <rect x="14" y="42" width="232" height="100" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">AFTER_SYNC 确认机制</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1. 主库写 Binlog 后等从库 ACK</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">2. 收到 ACK 再 COMMIT (无损切换)</text>
    <text x="24" y="118" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">3. 超时降级: timeout 后退回异步</text>
    <text x="24" y="132" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">rpl_semi_sync_master_wait_point</text>

    
    <rect x="14" y="152" width="232" height="100" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="174" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">机制边界与隐患：</text>
    <text x="24" y="194" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 写路径必定增加 1 次网络 RTT；</text>
    <text x="24" y="214" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 确认收到 ≠ 从库 SQL 重放完成；</text>
    <text x="24" y="232" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 超时自动降级需严格监控告警。</text>

    
    <rect x="14" y="262" width="232" height="98" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="284" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">定位与适用</text>
    <text x="24" y="302" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">同机房高可用容灾与无损切换标准配置。</text>
    <text x="24" y="326" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Lossless Failover Assurance</text>
    <text x="24" y="342" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Write Latency +1 RTT</text>
  </g>

  
