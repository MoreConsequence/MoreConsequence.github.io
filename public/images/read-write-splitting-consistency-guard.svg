<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="read-write-splitting-consistency-guard-title read-write-splitting-consistency-guard-desc"><title id="read-write-splitting-consistency-guard-title">读写分离一致性保障方案：强制主库路由、版本校验与半同步复制</title><desc id="read-write-splitting-consistency-guard-desc">架构对比图展示读写分离体系下强制主库读、读从加版本校验与会话粘性以及半同步 AFTER_SYNC 三大工程防御姿势。</desc>
  <defs>
    <marker id="cg-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
