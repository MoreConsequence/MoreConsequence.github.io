<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL 基于成本的优化器 (CBO) 核心算力模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">总成本 = I/O 成本 (磁盘页读取) + CPU 成本 (行记录比对) ｜ 优化器自动比对全表扫描 vs 各索引路径，选取绝对成本最低方案</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. I/O 成本常数与计算 (Server IO Cost: io_block_read_cost = 1.0)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">IO_Cost = (聚簇索引总页数 × 内存未命中率) × 1.0 ──► 度量从磁盘加载 16KB 页面的物理开销</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">全表扫描时的基础 I/O 账单！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. CPU 成本常数与比对 (Server CPU Cost: row_evaluate_cost = 0.2)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">CPU_Cost = 总行数 × 0.2 ──► 度量 CPU 逐行检查 WHERE 条件与表达式计算的开销</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">衡量纯计算与内存比较算力消耗！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 索引路径成本精算 (Index Range Scan Cost Calculation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Cost = (索引扫描页数 × 1.0) + (匹配行数 × 0.2) + (回表 I/O 成本 × 回表记录数)</text>
        <text x="15" y="62" font-size="8" fill="#047857">精确衡量索引扫描与二次回表的综合代价！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 动态决策胜出 (Optimizer Decision: Choose Lowest Cost Plan)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">比对方案: Plan A (全表扫描: 1,420.5) vs Plan B (走索引: 12.8) ──► 坚决采纳 Plan B！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">EXPLAIN FORMAT=JSON 查看真实执行计划成本输出！</text>
      </g>
    </g>
  </g>
</svg>