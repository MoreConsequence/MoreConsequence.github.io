<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="lamport-timestamp-partial-order-happens-before-title lamport-timestamp-partial-order-happens-before-desc"><title id="lamport-timestamp-partial-order-happens-before-title">Lamport 标量时钟偏序模型：L(e) = max(local, remote) + 1 与 因果关系判定</title><desc id="lamport-timestamp-partial-order-happens-before-desc">Lamport 标量时钟偏序模型：L(e) = max(local, remote) + 1 与 因果关系判定</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Lamport 逻辑时钟数学算法与偏序关系模型</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">本地事件: C = C + 1 ｜ 跨节点发包携带 C ｜ 接收事件: C = max(C_local, C_msg) + 1 ｜ 建立无物理时钟依赖的分布式因果序</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 本地事件递增规则</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">Rule 1: 本地自增</text>

          <text x="10" y="38" fill="#f5f5f5">内部状态变更：</text>
          <text x="10" y="54" fill="#cbd5e1">• 进程 P1 内部执行计算/写入</text>
          <text x="10" y="70" fill="#f5f5f5">• C_1 = C_1 + 1 (如 1 -&gt; 2)</text>
          <text x="10" y="86" fill="#f5f5f5">• 保证同一节点内部事件严格有序！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 单机时序自洽！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 纯内存计数器操作；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 0 物理硬件晶振依赖；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 逻辑时间起点。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 消息跨节点对齐规则</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">Rule 2: max(local, remote) + 1</text>

          <text x="10" y="38" fill="#f5f5f5">跨网络对齐机制：</text>
          <text x="10" y="54" fill="#f5f5f5">• P1 发送消息携带 C_1 = 4</text>
          <text x="10" y="70" fill="#f5f5f5">• P2 当前本地时钟 C_2 = 2</text>
          <text x="10" y="86" fill="#f5f5f5">• P2 接收后更新 C_2 = max(2, 4) + 1 = 5！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 保证因果先后关系永不倒流！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 强制接收事件逻辑时间大于发送事件；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 建立全局因果单向偏序链；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• Leslie Lamport 图灵奖核心贡献！</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 标量时钟局限与向量升级</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">标量单向性困境：</text>

          <text x="10" y="38" fill="#f5f5f5">• a -&gt; b 必定推出 L(a) &lt; L(b)</text>
          <text x="10" y="54" fill="#f5f5f5">• 但 L(a) &lt; L(b) 无法反推 a 是否因果先于 b！</text>
          <text x="10" y="70" fill="#f5f5f5">• 无法识别并发冲突 (Concurrent)</text>
          <text x="10" y="86" fill="#f5f5f5">• 倒逼演化出向量时钟 (Vector Clock)！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">演进价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 从一维标量迈向 N 维向量时序；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 支撑无主多写数据库冲突检测；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 分布式时序理论基石！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
