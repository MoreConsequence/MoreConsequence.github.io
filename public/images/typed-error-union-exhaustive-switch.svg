<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">编译期穷尽检查 (Exhaustive Check)：TypeScript never 类型守卫模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">当业务新增错误类型 (如 RateLimitError) 时 ──► default 分支 assertNever(err) 触发编译报错 ──► 强制开发者补全处理逻辑</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 漏分支暗坑：新增错误导致线上静默失败</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">type AppError = NotFoundError | TimeoutError | QuotaExceededError;</text>
          
          <text y="36" fill="#fca5a5">switch (err.type) {</text>
          <text y="50" fill="#cbd5e1">  case 'NotFound': return handle404();</text>
          <text y="64" fill="#cbd5e1">  case 'Timeout': return handleTimeout();</text>
          <text y="78" fill="#f87171">  // 🔴 漏写了 QuotaExceededError 处理分支！</text>
          <text y="92" fill="#fca5a5">}</text>
          
          <text y="116" fill="#ef4444">🔴 恶果：函数静默返回 undefined，下游引发空指针崩溃！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 大型协作项目中，加了新枚举类型极难通知到所有人；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 测试用例覆盖不全时直接带病上线；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须借助编译器做死锁级强制约束！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ assertNever 守卫：编译期拦截 100% 疏漏</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">function assertNever(x: never): never {</text>
          <text y="28" fill="#86efac">  throw new Error("Unexpected object: " + x);</text>
          <text y="42" fill="#4ade80">}</text>
          
          <text y="64" fill="#38bdf8">default:</text>
          <text y="78" fill="#34d399">  return assertNever(err);</text>
          <text y="92" fill="#86efac">  // 💥 编译报错: Argument of type 'QuotaExceededError' is not</text>
          <text y="106" fill="#86efac">  //    assignable to parameter of type 'never'!</text>
          
          <text y="128" fill="#4ade80">✓ 编译器直接在 IDE 红线标出，不改完根本无法通过构建！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 类型系统提供的绝对安全网；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 重构大型核心系统时充满信心；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造零死角 TypeScript 工程标准！</text>
      </g>
    </g>
  </g>
</svg>