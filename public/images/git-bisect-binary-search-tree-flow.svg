<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="git-bisect-binary-search-tree-flow-title git-bisect-binary-search-tree-flow-desc"><title id="git-bisect-binary-search-tree-flow-title">git bisect 二分排查算法原理：O(log N) 快速定位引入 Bug 的首个 Commit</title><desc id="git-bisect-binary-search-tree-flow-desc">git bisect 二分排查算法原理：O(log N) 快速定位引入 Bug 的首个 Commit</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2d3142" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f5f5f5"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Git Bisect 二分追凶算法与步长收敛模型 (Binary Regression Search)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1000 个提交逐个排查需数天时间 (O(N)) ──► Git Bisect 二分分治算法 ──► 仅需 10 步 (log2 1000 ≈ 10) 5 分钟精准锁定罪魁祸首 Commit</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 确立已知好坏基线 (Define Good &amp; Bad Boundaries)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2563eb">git bisect start ──► git bisect bad HEAD (当前损坏) ──► git bisect good v1.0.0 (上个月发布的稳定版)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">Git 自动计算出剩余待检提交数并估算所需测试步数！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 自动二分检出中间版本 (Checkout Midpoint: O(log N))</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#9a3412">Git 自动将工作区检出至中间提交 mid = (good + bad) / 2 ──► 开发者运行自动化测试验证</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">每次测试瞬间将嫌疑范围砍掉整整一半 (50%)！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 自动化脚本驱动二分 (git bisect run ./test.sh)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#15803d">编写自动化断言脚本: 退出码 0 代表 good，非 0 代表 bad ──► git bisect run 自动全速循环执行</text>
        <text x="15" y="62" font-size="8" fill="#047857">0 人工干预，数十秒内自动完成全部二分检索！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 精准锁定首个故障提交 (First Bad Commit Identified)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#6b21a8">终端明确输出: "[hash] is the first bad commit" ──► 查看作者、diff 改动与关联 PR ──► 瞬间修复！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">资深工程师排查偶发回归与历史暗坑的神级工具！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
