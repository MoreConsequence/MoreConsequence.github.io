<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="typescript-agent-production-idempotency-queue-title typescript-agent-production-idempotency-queue-desc"><title id="typescript-agent-production-idempotency-queue-title">TypeScript Agent 服务化三边界全景</title><desc id="typescript-agent-production-idempotency-queue-desc">TypeScript Agent 服务化架构图展示并发请求合并、幂等重放状态机、/1k Token 整数微美元成本记账以及生产边界全景。</desc>
