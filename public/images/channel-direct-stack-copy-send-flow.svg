<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Channel 跨 Goroutine 栈直接内存拷贝 (sendDirect Pipeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">发送端获取 hchan 锁 ──► 从 recvq 出队等待中的 sudog ──► 直接执行栈到栈 memmove ──► goready(recv_g) 唤醒就绪</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 互斥锁加锁与等待队列检索 (Lock &amp; Dequeue sudog)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">lock(&amp;c.lock) ──► 检查 recvq 是否有挂起的接收者 ──► 弹出队首 sudog 节点 (包含目标 G 与栈接收指针 elem)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">纳秒级原子弹出就绪接收者！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 跨栈直接内存搬运 (sendDirect: Stack to Stack memmove)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">typeBitsBulkBarrier 协助 ──► memmove(dst=sg.elem, src=ep, c.elemtype.size)</text>
        <text x="15" y="62" font-size="8" fill="#047857">0 堆内存分配，直接将数据写入对方 Goroutine 的局部变量栈空间！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 释放锁与唤醒目标协程 (Unlock &amp; goready)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">unlock(&amp;c.lock) ──► 调用 goready(sg.g, 3) ──► 将接收者 G 状态从 _Gwaiting 变为 _Grunnable</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">安全解除锁保护并将其推入调度就绪队列！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 接收者无缝恢复执行 (Receiver Seamless Resumption)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">接收者 G 被 GMP 调度执行 ──► 变量已经就绪，直接继续往下执行业务逻辑！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Go 语言在内存与调度协同上登峰造极的优化设计！</text>
      </g>
    </g>
  </g>
</svg>