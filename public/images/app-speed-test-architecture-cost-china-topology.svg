<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">中国大陆 APP 测速节点架构与三网带宽成本优化拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">三网独立单线边缘节点 (电信/联通/移动) ｜ 95 计费带宽削峰 ｜ GeoDNS 本省本运营商调度 ｜ 单节点成本降低 85%</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 三网单线边缘节点部署</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 中国特色网络拓扑破局</text>
          <text x="10" y="34" fill="#93c5fd">1. 电信用户 ──► 本省电信单线机房</text>
          <text x="10" y="50" fill="#86efac">2. 联通用户 ──► 本省联通单线机房</text>
          <text x="10" y="66" fill="#fed7aa">3. 移动用户 ──► 本省移动单线机房</text>
          <text x="10" y="88" fill="#34d399">✓ 绝不跨网结算，网络时延 &lt; 5ms！</text>
          <text x="10" y="104" fill="#4ade80">✓ 单线带宽单价仅为 BGP 的 1/5！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 彻底避开跨运营商互联互通瓶颈；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 精准度量最后 1 公里光纤质量；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造最具公信力的国家级测速体系。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 95 计费与并发削峰控制</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 运营商 95 峰值计费模型</text>
          <text x="10" y="34" fill="#86efac">1. 每月去掉最高 5% 突发点</text>
          <text x="10" y="48" fill="#86efac">2. 按第 95% 处的带宽点进行结算</text>
          <text x="10" y="68" fill="#38bdf8">3. 服务端并发令牌桶限制：</text>
          <text x="16" y="82" fill="#cbd5e1">   单节点限流 80% 峰值水位</text>
          <text x="10" y="104" fill="#34d399">✓ 避免单个突发拉高整月数十万账单！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 动态容量准入与排队等待；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 测速时长严格钳制在 10~15 秒；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 实现商业化成本与测量体验完美平衡。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 节点热插拔与智能降级</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 全局调度高可用容灾</text>
          <text x="10" y="34" fill="#fed7aa">1. 边缘节点秒级心跳探活</text>
          <text x="10" y="50" fill="#fed7aa">2. 若某省联通节点硬件断网：</text>
          <text x="16" y="66" fill="#f87171">   GeoDNS 毫秒级切换至 邻省联通节点</text>
          <text x="10" y="88" fill="#34d399">3. APP 客户端本地兜底节点列表</text>
          <text x="10" y="104" fill="#4ade80">✓ 保证极端断网下 100% 测速可用！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 零单点故障架构；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 客户端自动并行 Ping 竞速优选；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 打造国内顶尖的工业级测速底座。</text>
      </g>
    </g>
  </g>
</svg>