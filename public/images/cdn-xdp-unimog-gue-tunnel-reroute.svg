<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-labelledby="xdp-title xdp-desc">
<title id="xdp-title">XDP 无状态负载均衡 + GUE 跨机房隧道重定向</title>
<desc id="xdp-desc">架构图：误入 SHA 的报文在网卡 XDP 层被无状态拦截，经 GUE 隧道转交至 TCB 宿主 PEK，PEK 以 DSR 直接回源，实现 0 感知漫游。</desc>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<text x="40" y="28" fill="#2d3142" font-size="16" font-weight="400" font-family="'Instrument Serif', serif">eBPF/XDP 四层无状态网关 + GUE 专网隧道 · 漂移无感重定向</text>
<text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" letter-spacing="0.02em">RingBuffer 纳秒级拦截 → 一致性哈希判属 → GUE IP-in-UDP 封装 → 私网骨干转交 → DSR 直回</text>
<!-- Connectors -->
<line x1="200" y1="196" x2="240" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="416" y1="196" x2="468" y2="196" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<line x1="612" y1="196" x2="656" y2="196" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M 756,164 V 104 Q 756,96 748,96 H 128 Q 120,96 120,104 V 164" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Dashed failure path (without XDP) for contrast -->
<path d="M 328,228 V 260 Q 328,268 336,268 H 320 Q 312,268 312,260 V 228" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<!-- Labels -->
<rect x="188" y="176" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="212" y="185" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">误入</text>
<rect x="416" y="176" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="442" y="185" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">GUE 封装</text>
<rect x="612" y="176" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="632" y="185" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">转交</text>
<rect x="380" y="76" width="120" height="12" rx="2" fill="#f5f5f5"/><text x="440" y="85" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">DSR 直回 · 0 RTT 惩罚</text>
<rect x="292" y="272" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="328" y="281" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">无 XDP → RST</text>
<!-- Nodes -->
<g>
  <rect x="40" y="164" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="40" y="164" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="48" y="172" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/><text x="60" y="181" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">CLI</text>
  <text x="120" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">客户端</text>
  <text x="120" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">继续发送 DATA</text>
</g>
<g>
  <rect x="240" y="164" width="176" height="80" rx="6" fill="#f5f5f5"/><rect x="240" y="164" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="248" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/><text x="262" y="181" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">XDP</text>
  <text x="328" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">上海 SHA-PoP</text>
  <text x="328" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RingBuffer · 驱动层</text>
  <text x="328" y="232" fill="#2e5aa8" font-size="8" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">一致性哈希判属 → PEK</text>
</g>
<g>
  <rect x="468" y="164" width="144" height="64" rx="6" fill="#f5f5f5"/><rect x="468" y="164" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
  <rect x="476" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/><text x="490" y="181" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">GUE</text>
  <text x="540" y="200" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">私网骨干</text>
  <text x="540" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UDP 6080 封装</text>
</g>
<g>
  <rect x="656" y="164" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="656" y="164" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="664" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/><text x="678" y="181" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PEK</text>
  <text x="756" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">北京 PEK-PoP ★</text>
  <text x="756" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TCB 宿主 · 解封装</text>
  <text x="756" y="232" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">无感接管 · 0 RST</text>
</g>
<!-- Packet encapsulation inset -->
<g>
  <rect x="468" y="260" width="380" height="56" rx="6" fill="#f5f5f5"/><rect x="468" y="260" width="380" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="476" y="276" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em">GUE 封装结构</text>
  <rect x="476" y="284" width="80" height="20" rx="4" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="516" y="298" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">外层 IP</text>
  <rect x="560" y="284" width="60" height="20" rx="4" fill="rgba(46,90,168,0.10)" stroke="rgba(46,90,168,0.30)" stroke-width="0.8"/><text x="590" y="298" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">GUE</text>
  <rect x="624" y="284" width="100" height="20" rx="4" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/><text x="674" y="298" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">原始包</text>
  <rect x="728" y="284" width="112" height="20" rx="4" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="784" y="298" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">Client DATA</text>
</g>
<!-- Benefits -->
<g>
  <rect x="40" y="368" width="560" height="68" rx="6" fill="#f5f5f5"/><rect x="40" y="368" width="560" height="68" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <rect x="48" y="376" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/><text x="66" y="385" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">WHY</text>
  <text x="48" y="404" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif">为何在驱动层做无状态转发？</text>
  <text x="48" y="420" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">• 0 触内核 TCP 栈 · 无上下文切换 · 纳秒级 · 10Mpps 线速</text>
  <text x="48" y="432" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">• Maglev/ Katran 一致性哈希环 · 变更仅迁移 1/N 连接</text>
</g>
<g>
  <rect x="620" y="368" width="300" height="68" rx="6" fill="#f5f5f5"/><rect x="620" y="368" width="300" height="68" rx="6" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.22)" stroke-width="1"/>
  <rect x="628" y="376" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.35)" stroke-width="0.8"/><text x="648" y="385" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">QUIC</text>
  <text x="628" y="404" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif">根治方案：QUIC CID</text>
  <text x="628" y="420" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">连接与 4 元组解耦 · 任意 PoP</text>
  <text x="628" y="432" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">可解密 CID 漫游 · 0 丢线</text>
</g>
