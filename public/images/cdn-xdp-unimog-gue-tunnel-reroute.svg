<line x1="40" y1="456" x2="920" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<line x1="40" y1="488" x2="68" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="76" y="492" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">误入</text>
<line x1="140" y1="488" x2="168" y2="488" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/><text x="176" y="492" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">GUE 隧道</text>
<line x1="260" y1="488" x2="288" y2="488" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/><text x="296" y="492" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">DSR 直回</text>
<line x1="380" y1="488" x2="408" y2="488" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="416" y="492" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">未修复将 RST</text>
</svg>