<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="logical-clocks-lamport-vs-vector-clock-causality-title logical-clocks-lamport-vs-vector-clock-causality-desc"><title id="logical-clocks-lamport-vs-vector-clock-causality-title">分布式因果时钟：Lamport 逻辑时钟全序关系 vs 向量时钟 (Vector Clock) 偏序与并发冲突检测</title><desc id="logical-clocks-lamport-vs-vector-clock-causality-desc">分布式因果时钟：Lamport 逻辑时钟全序关系 vs 向量时钟 (Vector Clock) 偏序与并发冲突检测</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分布式因果时序：Lamport 逻辑时钟 vs 向量时钟 (Vector Clocks)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Lamport 时钟 (定义全序关系但无法判断因果性) vs 向量时钟 V = [v1, v2, v3] (精准判定因果先后与并发并发分叉冲突)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Lamport 逻辑时钟 (全序时间戳)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 状态转移规则: L_i = max(L_i, L_msg) + 1</text>
          <text y="30" fill="#f5f5f5">1. 本地事件: L = L + 1</text>
          <text y="46" fill="#f5f5f5">2. 发送消息携带 L; 接收消息时取最大值加 1</text>

          <text y="70" fill="#f5f5f5">✓ 保证先发因果: 若 a ──► b，则 L(a) &lt; L(b)</text>
          <text y="88" fill="#f5f5f5">⚠️ 致命盲区: 逆命题不成立！</text>
          <text y="104" fill="#f5f5f5">• 若 L(a) &lt; L(b)，完全不能断定 a 导致了 b，两者可能完全并发！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 需要为分布式事件提供全局一致的偏序/全序打破平局；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 空间开销仅为 1 个 64 位整数；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 分布式系统最经典的理论基石。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 向量时钟 (Vector Clocks - 因果与冲突)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 向量时钟 V = &lt;NodeA, NodeB, NodeC&gt;</text>
          <text y="30" fill="#f5f5f5">1. 事件 A: V_a = &lt;2, 1, 0&gt;</text>
          <text y="46" fill="#f5f5f5">2. 事件 B: V_b = &lt;3, 2, 1&gt; (V_a &lt;= V_b 成立 ──► 证明 A 因果先于 B！)</text>

          <text y="70" fill="#f5f5f5">3. 并发冲突判定 (Conflict):</text>
          <text y="86" fill="#f5f5f5">   V_x = &lt;2, 0, 1&gt; 与 V_y = &lt;1, 1, 1&gt; (互有大小)</text>
          <text y="104" fill="#f5f5f5">   ► 100% 判定为并发冲突，触发 Dynamo 购物车合并/CRDT！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• Amazon Dynamo、Riak 等 AP 型去中心化存储；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• Git 分支合并与协同文档 CRDT；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造无锁、最终一致性的高可用分布式系统！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
