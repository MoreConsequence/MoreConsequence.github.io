<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">分布式因果时序：Lamport 逻辑时钟 vs 向量时钟 (Vector Clocks)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Lamport 时钟 (定义全序关系但无法判断因果性) vs 向量时钟 V = [v1, v2, v3] (精准判定因果先后与并发并发分叉冲突)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Lamport Clock -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Lamport 逻辑时钟 (全序时间戳)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// 状态转移规则: L_i = max(L_i, L_msg) + 1</text>
          <text y="30" fill="#93c5fd">1. 本地事件: L = L + 1</text>
          <text y="46" fill="#93c5fd">2. 发送消息携带 L; 接收消息时取最大值加 1</text>
          
          <text y="70" fill="#4ade80">✓ 保证先发因果: 若 a ──► b，则 L(a) &lt; L(b)</text>
          <text y="88" fill="#f87171">⚠️ 致命盲区: 逆命题不成立！</text>
          <text y="104" fill="#fca5a5">• 若 L(a) &lt; L(b)，完全不能断定 a 导致了 b，两者可能完全并发！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 需要为分布式事件提供全局一致的偏序/全序打破平局；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 空间开销仅为 1 个 64 位整数；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 分布式系统最经典的理论基石。</text>
      </g>
    </g>

    <!-- Right: Vector Clocks -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 向量时钟 (Vector Clocks - 因果与冲突)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 向量时钟 V = &lt;NodeA, NodeB, NodeC&gt;</text>
          <text y="30" fill="#86efac">1. 事件 A: V_a = &lt;2, 1, 0&gt;</text>
          <text y="46" fill="#86efac">2. 事件 B: V_b = &lt;3, 2, 1&gt; (V_a &lt;= V_b 成立 ──► 证明 A 因果先于 B！)</text>
          
          <text y="70" fill="#fb923c">3. 并发冲突判定 (Conflict):</text>
          <text y="86" fill="#fed7aa">   V_x = &lt;2, 0, 1&gt; 与 V_y = &lt;1, 1, 1&gt; (互有大小)</text>
          <text y="104" fill="#34d399">   ► 100% 判定为并发冲突，触发 Dynamo 购物车合并/CRDT！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Amazon Dynamo、Riak 等 AP 型去中心化存储；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• Git 分支合并与协同文档 CRDT；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造无锁、最终一致性的高可用分布式系统！</text>
      </g>
    </g>
  </g>
</svg>