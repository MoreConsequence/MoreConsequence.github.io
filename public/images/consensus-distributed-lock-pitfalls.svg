<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">分布式锁经典崩溃场景：GC 停顿与锁过期覆盖时序</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Martin Kleppmann vs Antirez 世纪大辩论：STW 垃圾回收 / 进程休眠导致租约失效，引发并发双写数据损坏</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Actors Header (Client 1 vs Lock Server vs Client 2 vs Storage) -->
    <g transform="translate(40, 20)">
      <rect width="180" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="90" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">客户端 Client 1</text>

      <rect x="220" width="180" height="30" rx="4" fill="#fff7ed" stroke="#fdba74"/>
      <text x="310" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#c2410c" text-anchor="middle">分布式锁服务 (Redis)</text>

      <rect x="440" width="180" height="30" rx="4" fill="#f0fdf4" stroke="#86efac"/>
      <text x="530" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">客户端 Client 2</text>

      <rect x="660" width="160" height="30" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
      <text x="740" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7e22ce" text-anchor="middle">持久化存储 (DB/S3)</text>
    </g>

    <!-- Lifelines -->
    <line x1="130" y1="55" x2="130" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="310" y1="55" x2="310" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="530" y1="55" x2="530" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="740" y1="55" x2="740" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Sequence Flow -->
    <g transform="translate(130, 70)">
      <!-- 1. Client 1 acquires lock -->
      <g>
        <line x1="0" y1="0" x2="180" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <text x="90" y="-8" font-family="ui-monospace, monospace" font-size="7.5" fill="#1e40af" text-anchor="middle">SET lock:order nx ex 10s</text>
        <line x1="180" y1="18" x2="0" y2="18" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
        <text x="90" y="32" font-size="7.5" fill="#166534" text-anchor="middle">OK (持锁成功，TTL 10s)</text>
      </g>

      <!-- 2. Client 1 enters STW GC Pause -->
      <g transform="translate(0, 50)">
        <rect x="-80" y="0" width="160" height="90" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="0" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">🔴 JVM STW GC / 缺页中断</text>
        <text x="0" y="36" font-size="7.5" fill="#7f1d1d" text-anchor="middle">进程完全休眠停顿 15 秒！</text>
        <text x="0" y="52" font-size="7" fill="#dc2626" text-anchor="middle">期间无法发送心跳续期...</text>

        <!-- Lock Expires on Server -->
        <rect x="110" y="25" width="140" height="40" rx="3" fill="#fee2e2" stroke="#f87171"/>
        <text x="180" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">Redis 10s TTL 到期！</text>
        <text x="180" y="56" font-size="7" fill="#7f1d1d" text-anchor="middle">自动物理删除 lock:order</text>
      </g>

      <!-- 3. Client 2 acquires the same lock -->
      <g transform="translate(400, 110)">
        <line x1="0" y1="0" x2="-220" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <text x="-110" y="-8" font-family="ui-monospace, monospace" font-size="7.5" fill="#1e40af" text-anchor="middle">SET lock:order nx ex 10s</text>
        <line x1="-220" y1="18" x2="0" y2="18" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
        <text x="-110" y="32" font-size="7.5" fill="#166534" text-anchor="middle">OK (Client 2 成功获取到同一把锁!)</text>
      </g>

      <!-- 4. Client 2 writes storage -->
      <g transform="translate(400, 155)">
        <line x1="0" y1="0" x2="210" y2="0" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
        <text x="105" y="-8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">Client 2 写入新数据 State = B</text>
      </g>

      <!-- 5. Client 1 wakes up and blindly writes, causing silent corruption! -->
      <g transform="translate(0, 195)">
        <text x="0" y="-4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#dc2626">Client 1 停顿结束苏醒！以为自己仍持有锁</text>
        <line x1="0" y1="10" x2="610" y2="10" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
        <rect x="220" y="-4" width="220" height="26" rx="3" fill="#fee2e2" stroke="#ef4444"/>
        <text x="330" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 盲目覆盖写：State = A (覆盖了 B!)</text>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 335)">
      <rect width="860" height="40" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="430" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">
        ⚠️ <tspan font-weight="700">物理红线：</tspan> 任何基于单调时间的租约锁（Redis / ZooKeeper）在异步网络与 GC 停顿下都无法保证绝对互斥，<tspan fill="#1e40af">必须依赖存储层 Fencing Token 拦截旧请求</tspan>！
      </text>
    </g>
  </g>
</svg>
