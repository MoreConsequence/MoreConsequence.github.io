<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">高并发冲突下的锁选型四象限：悲观锁 vs 乐观锁</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">低冲突读多写少 (乐观锁吞吐碾压 10 倍) vs 超高冲突热点秒杀 (乐观锁自旋引发 CPU 100% 暴动，悲观锁/内存排队胜出)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Optimistic Lock -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 乐观锁 (CAS Version 模式)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">适宜场景：读多写少、写冲突率 &lt; 5%</text>
          
          <text y="38" fill="#86efac">核心优势：</text>
          <text y="52" fill="#cbd5e1">• 0 数据库行锁挂起与死锁等待</text>
          <text y="66" fill="#cbd5e1">• 吞吐量随并发线性增长</text>
          
          <text y="90" fill="#f87171">⚠️ 极端热点死穴 (10,000 人抢 1 件商品):</text>
          <text y="104" fill="#fca5a5">• 9,999 次请求 CAS 失败疯狂自旋重试！</text>
          <text y="118" fill="#ef4444">• 导致应用与数据库 CPU 瞬间 100% 满载打死！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用业务：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 用户资料更新、订单状态流转；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 博客与文档协作编辑；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高吞吐轻量服务。</text>
      </g>
    </g>

    <!-- Right: Pessimistic Lock -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 悲观锁 (FOR UPDATE 排他锁模式)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">适宜场景：写冲突极高、强金融资金扣减</text>
          
          <text y="38" fill="#fed7aa">核心优势：</text>
          <text y="52" fill="#cbd5e1">• 强行在数据库内核排队，100% 保证单次执行成功</text>
          <text y="66" fill="#34d399">• 0 无效自旋，CPU 负载平稳可控！</text>
          
          <text y="90" fill="#38bdf8">现代极速架构进化：</text>
          <text y="104" fill="#4ade80">• Redis + Lua 脚本内存级原子扣减 (100k QPS)</text>
          <text y="118" fill="#4ade80">• 异步 MQ 削峰解耦写入数据库！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">适用业务：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 银行账户余额划扣、优惠券秒杀抢购；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 严格防超卖核心系统；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级强一致性保障！</text>
      </g>
    </g>
  </g>
</svg>