<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="dense-vs-sparse-hybrid-search-pipeline-title dense-vs-sparse-hybrid-search-pipeline-desc"><title id="dense-vs-sparse-hybrid-search-pipeline-title">密集向量 (Dense Embedding) 与稀疏关键词 (BM25) 混合检索流水线</title><desc id="dense-vs-sparse-hybrid-search-pipeline-desc">密集向量 (Dense Embedding) 与稀疏关键词 (BM25) 混合检索流水线</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">现代 RAG 混合检索与重排序流水线 (Hybrid Retrieval &amp; Rerank)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Dense Vector (语义近似) + Sparse BM25 (专有名词/精确代码) ──► RRF 倒数排名融合 ──► Cross-Encoder 深度重排 ──► 95% 召回准确率</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 双路并行并行召回 (Dual-Channel Parallel Retrieval)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">通道 A: HNSW 向量索引 (余弦相似度 Top-50) ｜ 通道 B: 倒排索引 BM25 精准词匹配 (Top-50)</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">兼顾隐式语义关联与专有名词（如函数名、错误码）的绝对精确！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 倒数排名融合归一化 (Reciprocal Rank Fusion: RRF)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">RRF_Score(d) = Σ 1 / (k + rank_i(d)) (常数 k=60) ──► 无需调节不同维度的分数尺度</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">将两路异构检索结果自适应融合为单一有序候选集 (Top-30)！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. Cross-Encoder 深度重排序 (Deep Neural Reranker: bge-reranker)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">将 Query 与 Document 拼接输入交叉注意力 Transformer ──► 捕捉深度上下文交叉相关性 ──► 筛选 Top-5</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">彻底剔除看似向量相近但实际毫无关联的伪相关文档！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 上下文组装与大模型推理 (Context Assembly &amp; Generation)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">将最相关的 3~5 篇片段注入 System Prompt ──► 投喂 LLM ──► 0 幻觉精准生成专业技术答案！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">工业级高质量 RAG 架构标准形态！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
