<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">通用可伸缩性定律 (USL: Universal Scalability Law) 吞吐坍塌机理</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Amdahl 定律仅考虑串行争用 (σ Contention) ──► USL 引入一致性开销 (κ Coherence: 跨核数据同步) ──► 解释超高并发下吞吐不增反降的物理根因</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. 线性扩展区 (Linear Scale)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">低并发区间 (N &lt; 16 核心):</text>
          
          <text x="10" y="38" fill="#86efac">• 0 共享状态锁竞争</text>
          <text x="10" y="54" fill="#38bdf8">• 吞吐量随并发数 N 呈 1:1 完美线性暴增</text>
          <text x="10" y="70" fill="#34d399">• CPU 利用率从 10% 提升至 80%</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 理想的无状态水平扩容态！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 纯无状态 Web 服务标准特征；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 资源投入与产出完全成正比；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高效算力底座。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 串行争用瓶颈 (Amdahl σ)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">中高并发区间 (16 &lt; N &lt; 64):</text>
          
          <text x="10" y="38" fill="#fed7aa">• 临界区互斥锁 (Mutex) 争用加剧</text>
          <text x="10" y="54" fill="#38bdf8">• 吞吐量增速放缓进入对数平原期</text>
          <text x="10" y="70" fill="#34d399">• 增加更多 CPU 核心已无法提升总 QPS</text>
          
          <text x="10" y="100" fill="#fb923c">⚠️ 遭遇 Amdahl 算力天花板</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">优化手段：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 细粒度分段锁替代全局大粗锁；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 读写分离与无锁 CAS 优化；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 突破吞吐封顶界限。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">3. 吞吐坍塌倒退 (Coherence κ)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">超高并发与巨型多核 (N &gt; 64):</text>
          
          <text x="10" y="38" fill="#fca5a5">• 跨 NUMA 节点频繁嗅探 MESI 缓存行</text>
          <text x="10" y="54" fill="#ef4444">• 伪共享 (False Sharing) 导致总线风暴</text>
          <text x="10" y="70" fill="#f87171">• 吞吐量断崖式暴跌，系统卡死！</text>
          
          <text x="10" y="100" fill="#ef4444">🔴 USL 预测的毁灭性倒退区间！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产警示：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 必须采用 Share-Nothing 架构；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 每个 CPU Core 独立绑定局部内存队列；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 终极并发性能科学准则！</text>
      </g>
    </g>
  </g>
</svg>