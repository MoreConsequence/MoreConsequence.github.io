<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="universal-scalability-law-contention-coherence-title universal-scalability-law-contention-coherence-desc"><title id="universal-scalability-law-contention-coherence-title">通用可伸缩性定律 (USL)：并发排队延迟 (Contention) 与缓存一致性 (Coherence) 拐点</title><desc id="universal-scalability-law-contention-coherence-desc">通用可伸缩性定律 (USL)：并发排队延迟 (Contention) 与缓存一致性 (Coherence) 拐点</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">通用可伸缩性定律 (USL: Universal Scalability Law) 吞吐坍塌机理</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Amdahl 定律仅考虑串行争用 (σ Contention) ──► USL 引入一致性开销 (κ Coherence: 跨核数据同步) ──► 解释超高并发下吞吐不增反降的物理根因</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 线性扩展区 (Linear Scale)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">低并发区间 (N &lt; 16 核心):</text>

          <text x="10" y="38" fill="#f5f5f5">• 0 共享状态锁竞争</text>
          <text x="10" y="54" fill="#f5f5f5">• 吞吐量随并发数 N 呈 1:1 完美线性暴增</text>
          <text x="10" y="70" fill="#f5f5f5">• CPU 利用率从 10% 提升至 80%</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 理想的无状态水平扩容态！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 纯无状态 Web 服务标准特征；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 资源投入与产出完全成正比；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造高效算力底座。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">2. 串行争用瓶颈 (Amdahl σ)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">中高并发区间 (16 &lt; N &lt; 64):</text>

          <text x="10" y="38" fill="#f5f5f5">• 临界区互斥锁 (Mutex) 争用加剧</text>
          <text x="10" y="54" fill="#f5f5f5">• 吞吐量增速放缓进入对数平原期</text>
          <text x="10" y="70" fill="#f5f5f5">• 增加更多 CPU 核心已无法提升总 QPS</text>

          <text x="10" y="100" fill="#f5f5f5">⚠️ 遭遇 Amdahl 算力天花板</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">优化手段：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 细粒度分段锁替代全局大粗锁；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 读写分离与无锁 CAS 优化；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 突破吞吐封顶界限。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. 吞吐坍塌倒退 (Coherence κ)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">超高并发与巨型多核 (N &gt; 64):</text>

          <text x="10" y="38" fill="#f5f5f5">• 跨 NUMA 节点频繁嗅探 MESI 缓存行</text>
          <text x="10" y="54" fill="#f5f5f5">• 伪共享 (False Sharing) 导致总线风暴</text>
          <text x="10" y="70" fill="#f5f5f5">• 吞吐量断崖式暴跌，系统卡死！</text>

          <text x="10" y="100" fill="#f5f5f5">🔴 USL 预测的毁灭性倒退区间！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产警示：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 必须采用 Share-Nothing 架构；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 每个 CPU Core 独立绑定局部内存队列；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 终极并发性能科学准则！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
