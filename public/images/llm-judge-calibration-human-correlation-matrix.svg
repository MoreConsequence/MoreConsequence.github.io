<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LLM 裁判人类一致性校准：Cohen's Kappa 与 Spearman 秩相关度量</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">人类专家标注基准 ──► 裁判模型打分比对 ──► 消除偶然一致性 (Cohen's Kappa &gt; 0.85) ──► 达到可替代人类标注的工业可用阈值</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 人类专家黄金双盲标注集 (Human Ground Truth Golden Set)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">1,000 条高质量问答对 ──► 3 位资深领域专家独立双盲打分 ──► 仅保留人类内部一致性 &gt; 90% 的样本</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">构建绝对可信的校准锚点，任何 LLM 裁判上线前必须在此集上进行对齐验证！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. Cohen's Kappa 统计量剔除随机巧合 (Chance-Corrected Agreement)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Kappa = (P_observed - P_chance) / (1 - P_chance) ──► 严格剔除由于正负样本不均带来的虚假一致性</text>
        <text x="15" y="62" font-size="8" fill="#047857">Kappa &gt; 0.81 即达到近乎完美一致（Almost Perfect Agreement）的工业免检标准！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. Few-Shot 专家思维链提示词校准 (Few-Shot CoT Prompt Calibration)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">注入 5 个典型人类争议案例与专家详细判定理由 ──► 修正裁判模型的苛刻度与评分分布偏斜</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将 LLM 裁判的打分方差大幅压缩，彻底消灭神经质式的离群误判！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 评测成本直降 99% 与自动化 CI 闭环 (100x Cost Reduction)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">单次全量评测成本从人类标注的 $5,000 美元降低至 API 调用的 $12 美元，耗时从 3 天缩短至 10 分钟！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">实现每一次代码提交/模型迭代自动化运行全量综合能力验收！</text>
      </g>
    </g>
  </g>
</svg>