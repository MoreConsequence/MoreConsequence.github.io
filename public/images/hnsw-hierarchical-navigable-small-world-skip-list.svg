<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">HNSW 分层可导航小世界图：跳表多层拓扑与贪心对数寻径 O(log N)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">顶层稀疏长程高速跳跃 (Top Layer 2) ──► 中间层过渡路由 (Layer 1) ──► 底层稠密局部精搜 (Layer 0, 召回率 99.5%)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 顶层高速直达入口 (Layer 2 - Global Entry Point)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">从全局入口点 EntryPoint 出发 ──► 节点稀疏度极高、跨度极大 ──► 贪心搜索最近邻节点 (Greedy Search)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">仅需 2~3 次距离计算即可跨越整个向量空间，快速逼近目标所在的局部超空间！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 中间层降维下钻 (Layer 1 - Intermediate Routing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">以上一层找到的最近邻作为当前层入口 ──► 遍历当前层图邻接边 (M_max=32) ──► 逼近局部簇中心</text>
        <text x="15" y="62" font-size="8" fill="#047857">借鉴 Skip-List 跳表思想，以 O(log N) 对数复杂度实现超大容量向量空间极速收敛！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 底层全量稠密图精细探索 (Layer 0 - Dense Local Graph)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">维护容量为 efSearch 的优先队列 (Priority Queue) ──► 深度遍历近邻边 ──► 收集 Top-K 候选结果</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">Layer 0 包含全量数据点，小世界图六度分隔特性保证 99.5% 超高召回率！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 距离计算硬件级 SIMD 加速 (AVX-512 / ARM Neon)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">点积 (Dot Product) 与 L2 距离采用 AVX-512 向量化指令 ──► 单核 QPS 突破 20,000 / 秒！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代向量数据库（Milvus / Qdrant / Faiss）检索性能的绝对中流砥柱！</text>
      </g>
    </g>
  </g>
</svg>