<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="hnsw-hierarchical-navigable-small-world-skip-list-title hnsw-hierarchical-navigable-small-world-skip-list-desc"><title id="hnsw-hierarchical-navigable-small-world-skip-list-title">HNSW 分层小世界图索引结构：跳表启发多层近邻图快速收敛寻径</title><desc id="hnsw-hierarchical-navigable-small-world-skip-list-desc">HNSW 分层小世界图索引结构：跳表启发多层近邻图快速收敛寻径</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">HNSW 分层可导航小世界图：跳表多层拓扑与贪心对数寻径 O(log N)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">顶层稀疏长程高速跳跃 (Top Layer 2) ──► 中间层过渡路由 (Layer 1) ──► 底层稠密局部精搜 (Layer 0, 召回率 99.5%)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 顶层高速直达入口 (Layer 2 - Global Entry Point)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">从全局入口点 EntryPoint 出发 ──► 节点稀疏度极高、跨度极大 ──► 贪心搜索最近邻节点 (Greedy Search)</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">仅需 2~3 次距离计算即可跨越整个向量空间，快速逼近目标所在的局部超空间！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. 中间层降维下钻 (Layer 1 - Intermediate Routing)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">以上一层找到的最近邻作为当前层入口 ──► 遍历当前层图邻接边 (M_max=32) ──► 逼近局部簇中心</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">借鉴 Skip-List 跳表思想，以 O(log N) 对数复杂度实现超大容量向量空间极速收敛！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. 底层全量稠密图精细探索 (Layer 0 - Dense Local Graph)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">维护容量为 efSearch 的优先队列 (Priority Queue) ──► 深度遍历近邻边 ──► 收集 Top-K 候选结果</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">Layer 0 包含全量数据点，小世界图六度分隔特性保证 99.5% 超高召回率！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 距离计算硬件级 SIMD 加速 (AVX-512 / ARM Neon)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">点积 (Dot Product) 与 L2 距离采用 AVX-512 向量化指令 ──► 单核 QPS 突破 20,000 / 秒！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">现代向量数据库（Milvus / Qdrant / Faiss）检索性能的绝对中流砥柱！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
