<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">响应式架构分类树：粗粒度重渲染 (React) vs 细粒度 Signals 依赖图 (Solid/Vue)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">React (组件级全量重执行 + 递归 Diff) vs Vue 3 (Proxy 属性劫持) vs SolidJS (纯函数调用，0 组件实例开销)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 粗粒度组件级全量重跑 (React)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">const [count, setCount] = useState(0);</text>
          
          <text x="10" y="42" fill="#86efac">触发 setCount(1):</text>
          <text x="10" y="58" fill="#cbd5e1">• 整个 App 组件函数从头到尾重新执行！</text>
          <text x="10" y="74" fill="#cbd5e1">• 产生全新 JSX VDOM 子树</text>
          <text x="10" y="90" fill="#cbd5e1">• 依赖 useMemo/useCallback 做缓存</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 简单纯粹，心智符合数学函数！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 状态变更触发自顶向下的子树 Diff；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 依赖编译与人工优化规避无用重渲染；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 生态极其成熟庞大。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Proxy 属性劫持 (Vue 3)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">const state = reactive({ count: 0 });</text>
          
          <text x="10" y="42" fill="#86efac">触发 state.count++:</text>
          <text x="10" y="58" fill="#cbd5e1">• Proxy setter 拦截属性写入</text>
          <text x="10" y="74" fill="#cbd5e1">• 触发绑定的 componentEffect 回调</text>
          <text x="10" y="90" fill="#cbd5e1">• 仅当前组件重渲染并打补丁！</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 自动依赖收集，无需人工优化！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 兼具组件化组织与自动精准更新；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 模版静态提升优化编译期性能；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 学习曲线极佳。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 细粒度 Signals 零 VDOM (SolidJS)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">const [count, setCount] = createSignal(0);</text>
          
          <text x="10" y="42" fill="#fed7aa">触发 setCount(1):</text>
          <text x="10" y="58" fill="#cbd5e1">• 组件函数仅在初始化时运行 1 次！</text>
          <text x="10" y="74" fill="#cbd5e1">• 0 虚拟 DOM 协调开销</text>
          <text x="10" y="90" fill="#cbd5e1">• 直接执行 DOM.nodeValue = '1'！</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 性能接近原生纯手写 JavaScript！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 内存与 CPU 消耗达到物理极限；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 成为新一代全栈框架的性能标杆；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 代表现代前端演进未来！</text>
      </g>
    </g>
  </g>
</svg>