<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Linux 出口发包全链路：从 Socket 写入、TC 调度到网卡 TX DMA</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">应用 write() ──► TCP 发送缓冲排队 ──► TC qdisc (HTB/fq Pacing) ──► GSO/TSO 分段卸载 ──► TX Ring Buffer 硬件发包</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 4 Pipeline Columns (200px each) -->
    <g transform="translate(20, 20)">
      <!-- Stage 1: Socket & TCP Layer -->
      <g>
        <rect width="190" height="235" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
        <rect width="190" height="32" rx="6" fill="#dbeafe"/>
        <text x="95" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">1. Socket 与 TCP 发送缓冲</text>

        <g transform="translate(10, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
          <rect width="170" height="42" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
          <text x="8" y="16" fill="#1d4ed8" font-weight="700">copy_from_user</text>
          <text x="8" y="28" font-size="9" fill="#2563eb">将用户态数据拷贝入内核</text>

          <rect y="48" width="170" height="52" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
          <text x="8" y="16" fill="#1e40af" font-weight="700">sk_write_queue 排队</text>
          <text x="8" y="30" font-size="9" fill="#2563eb">• tcp_sendmsg 封装 SKB</text>
          <text x="8" y="42" font-size="9" fill="#2563eb">• BBR 计算 Pacing 速率</text>

          <rect y="106" width="170" height="40" rx="3" fill="#dbeafe"/>
          <text x="8" y="16" font-weight="700" fill="#1e40af">调用 dev_queue_xmit()</text>
          <text x="8" y="28" font-size="8.5" fill="#1d4ed8">将数据包推向网络设备层</text>
        </g>
      </g>

      <!-- Stage 2: TC Traffic Control -->
      <g transform="translate(210, 0)">
        <rect width="195" height="235" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="195" height="32" rx="6" fill="#dcfce7"/>
        <text x="97" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">2. TC 流量控制 (qdisc)</text>

        <g transform="translate(10, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
          <rect width="175" height="42" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="8" y="16" fill="#14532d" font-weight="700">HTB 分层限速整形</text>
          <text x="8" y="28" font-size="9" fill="#15803d">根据 Class 限制突发带宽</text>

          <rect y="48" width="175" height="52" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="8" y="16" fill="#166534" font-weight="700">fq 匀速起搏 (Pacing)</text>
          <text x="8" y="30" font-size="9" fill="#15803d">• 红黑树按 EDT 时间戳排序</text>
          <text x="8" y="42" font-size="9" fill="#15803d">• 纳秒级定时发包消除突发</text>

          <rect y="106" width="175" height="40" rx="3" fill="#d1fae5"/>
          <text x="8" y="16" font-weight="700" fill="#065f46">出队 enqueue / dequeue ──►</text>
          <text x="8" y="28" font-size="8.5" fill="#047857">调用 sch_direct_xmit()</text>
        </g>
      </g>

      <!-- Stage 3: Hardware Offload (TSO/GSO) -->
      <g transform="translate(425, 0)">
        <rect width="195" height="235" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <rect width="195" height="32" rx="6" fill="#f1f5f9"/>
        <text x="97" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">3. 硬件分段卸载 (TSO)</text>

        <g transform="translate(10, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
          <rect width="175" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="8" y="16" fill="#0f172a" font-weight="700">超大 SKB 发送 (64KB)</text>
          <text x="8" y="28" font-size="9" fill="#64748b">协议栈无需在 CPU 提前分片</text>

          <rect y="48" width="175" height="52" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
          <text x="8" y="16" fill="#1e40af" font-weight="700">网卡硬件 TSO 引擎</text>
          <text x="8" y="30" font-size="9" fill="#2563eb">网卡物理芯片自动切片为 MTU</text>
          <text x="8" y="42" font-size="9" fill="#2563eb">并硬件自动计算 TCP 校验和</text>

          <rect y="106" width="175" height="40" rx="3" fill="#f8fafc"/>
          <text x="8" y="16" fill="#475569">节省 CPU 算力高达 60% ──►</text>
          <text x="8" y="28" font-size="8.5" fill="#64748b">直达网卡驱动</text>
        </g>
      </g>

      <!-- Stage 4: TX Ring Buffer DMA -->
      <g transform="translate(640, 0)">
        <rect width="220" height="235" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="220" height="32" rx="6" fill="#dcfce7"/>
        <text x="110" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">4. TX Ring Buffer 与 DMA</text>

        <g transform="translate(10, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <rect width="200" height="42" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="8" y="16" fill="#14532d" font-weight="700">写入 TX 描述符环形队列</text>
          <text x="8" y="28" font-size="9" fill="#15803d">驱动向 tx_ring 提交物理地址</text>

          <rect y="48" width="200" height="52" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="8" y="16" fill="#166534" font-weight="700">网卡 DMA 读取并发送</text>
          <text x="8" y="30" font-size="9" fill="#15803d">• DMA 控制器直接从主存读包</text>
          <text x="8" y="42" font-size="9" fill="#15803d">• 经 PHY 芯片打入物理光纤</text>

          <rect y="106" width="200" height="40" rx="3" fill="#d1fae5" stroke="#10b981"/>
          <text x="8" y="16" fill="#065f46" font-weight="700">✓ 发送完成中断触发：</text>
          <text x="8" y="28" font-size="9" font-weight="700" fill="#047857">驱动释放 SKB 内存与描述符</text>
        </g>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">发包架构全景闭环：</tspan> Linux 发包链路通过 <tspan font-weight="700" fill="#2563eb">“TCP Pacing 匀速控流 + TSO 硬件分段卸载”</tspan>，
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
        在最大化网卡万兆/十万兆线速吞吐的同时，彻底消除了操作系统 CPU 的无谓分片开销。
      </text>
    </g>
  </g>
</svg>
