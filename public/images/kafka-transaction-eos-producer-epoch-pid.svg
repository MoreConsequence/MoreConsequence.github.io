<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="kafka-transaction-eos-producer-epoch-pid-title kafka-transaction-eos-producer-epoch-pid-desc"><title id="kafka-transaction-eos-producer-epoch-pid-title">Kafka 端到端 Exactly-Once 架构：PID、Sequence Number 与事务协调者…</title><desc id="kafka-transaction-eos-producer-epoch-pid-desc">Kafka 端到端 Exactly-Once 架构：PID、Sequence Number 与事务协调者 (Transaction Coordinator)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Kafka 端到端 Exactly-Once (EOS) 事务协调架构</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Producer PID + Sequence (单分区幂等去重) ──► Transaction Coordinator ──► 跨分区原子两阶段提交 ──► Consumer read_committed</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 生产者 PID 与单调递增 Sequence (Idempotent Producer: PID + Seq)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Broker 为 Producer 分配唯一 PID ──► 每条消息携带 SeqNum ──► Broker 仅接受 Seq == LastSeq + 1</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">重试产生的重复消息在 Broker 内存被直接静默丢弃！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 事务协调者与事务日志 (Transaction Coordinator &amp; __transaction_state)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Producer 发送 InitProducerId 绑定 transactional.id ──► 协调者在内部主题持久化 Ongoing 事务状态</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">实现生产者重启后跨会话状态继承与僵尸实例隔离！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 跨分区数据与位移原子提交 (Consume-Transform-Produce Atomicity)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">向业务 Topic 发送消息，同时向 __consumer_offsets 发送消费位移 ──► 协调者写入 Commit 标志标记</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">业务输出与消费进度要么同时生效，要么同时回滚！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 消费端 read_committed 隔离过滤 (Consumer LSO High-Watermark)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Consumer 仅读取到 LastStableOffset (LSO) ──► 自动跳过 Aborted 事务消息 ──► 真正达成流处理 Exactly-Once！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">现代流计算与事件驱动架构的工业级巅峰！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
