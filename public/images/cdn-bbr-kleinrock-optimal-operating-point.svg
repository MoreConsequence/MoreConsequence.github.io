<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-labelledby="bbr-title bbr-desc">
<title id="bbr-title">BBR Kleinrock 最优操作点 · BDP = BtlBw × RTprop</title>
<desc id="bbr-desc">双轴折线图：吞吐随在途量先升后平，时延先平后升，交点即 BDP 最优点，BBR 锁定该点，CUBIC 则盲目填满导致 Bufferbloat。</desc>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<text x="40" y="28" fill="#2d3142" font-size="16" font-weight="400" font-family="'Instrument Serif', serif">BBR 模型：Kleinrock 最优操作点（In-flight = BDP）</text>
<text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" letter-spacing="0.02em">BDP = BtlBw × RTprop · CUBIC 填满排队 vs BBR 探测瓶颈速率与最小 RTT</text>
<!-- Chart 1: Throughput -->
<g>
  <rect x="40" y="68" width="880" height="200" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="56" y="88" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif">1 · 吞吐量 Throughput vs 在途量 In-flight</text>
  <!-- grid -->
  <line x1="120" y1="208" x2="880" y2="208" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="120" y1="183" x2="880" y2="183" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="120" y1="158" x2="880" y2="158" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="120" y1="133" x2="880" y2="133" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <!-- axes -->
  <line x1="120" y1="208" x2="880" y2="208" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="208" x2="120" y2="108" stroke="#bfc0c0" stroke-width="1"/>
  <text x="880" y="224" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">In-flight →</text>
  <text x="104" y="112" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end">吞吐量</text>
  <text x="104" y="212" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end">0</text>
  <!-- BDP vertical -->
  <line x1="500" y1="108" x2="500" y2="208" stroke="rgba(235,108,54,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- polyline -->
  <polyline points="120,208 500,108 880,108" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="500" cy="108" r="4" fill="#eb6c36" stroke="#ffffff" stroke-width="1.2"/>
  <!-- labels -->
  <rect x="516" y="88" width="196" height="18" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="614" y="100" fill="#eb6c36" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">BDP · Kleinrock 最优点</text>
  <rect x="540" y="124" width="164" height="16" rx="4" fill="rgba(45,122,79,0.08)" stroke="rgba(45,122,79,0.25)" stroke-width="0.8"/><text x="622" y="135" fill="#2d7a52" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">达到瓶颈带宽 BtlBw 上限</text>
  <text x="310" y="144" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">欠载区</text>
  <text x="690" y="144" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">盈载区 · 排队堆积</text>
  <text x="500" y="224" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">BtlBw×RTprop</text>
</g>
<!-- Chart 2: RTT -->
<g>
  <rect x="40" y="292" width="880" height="200" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="56" y="312" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif">2 · 往返时延 RTT vs 在途量 In-flight</text>
  <line x1="120" y1="432" x2="880" y2="432" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="120" y1="407" x2="880" y2="407" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="120" y1="382" x2="880" y2="382" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="120" y1="357" x2="880" y2="357" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="120" y1="432" x2="880" y2="432" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="120" y1="432" x2="120" y2="332" stroke="#bfc0c0" stroke-width="1"/>
  <text x="880" y="448" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">In-flight →</text>
  <text x="104" y="336" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end">RTT</text>
  <text x="104" y="436" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end">0</text>
  <line x1="500" y1="332" x2="500" y2="432" stroke="rgba(235,108,54,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
  <polyline points="120,412 500,412 880,332" fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="500" cy="412" r="4" fill="#eb6c36" stroke="#ffffff" stroke-width="1.2"/>
  <rect x="140" y="392" width="140" height="16" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="210" y="403" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">RTprop 纯传播时延</text>
  <rect x="620" y="340" width="132" height="16" rx="4" fill="rgba(196,50,45,0.06)" stroke="rgba(196,50,45,0.22)" stroke-width="0.8"/><text x="686" y="351" fill="#c4442f" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">Bufferbloat 膨胀区</text>
  <text x="500" y="448" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">BtlBw×RTprop</text>
</g>
<!-- Legend -->
<line x1="40" y1="508" x2="920" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="524" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<line x1="120" y1="508" x2="120" y2="508" stroke="none"/>
</svg>