<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-labelledby="cdn-bbr-kleinrock-optimal-operating-point-title cdn-bbr-kleinrock-optimal-operating-point-desc"><title id="cdn-bbr-kleinrock-optimal-operating-point-title">BBR Kleinrock 最优操作点 · BDP = BtlBw × RTprop</title><desc id="cdn-bbr-kleinrock-optimal-operating-point-desc">双轴折线图：吞吐随在途量先升后平，时延先平后升，交点即 BDP 最优点，BBR 锁定该点，CUBIC 则盲目填满导致 Bufferbloat。</desc>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)" /></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5" />
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55" />
<text x="40" y="28" fill="#2d3142" font-size="16" font-weight="400" font-family="'Instrument Serif', serif">BBR 模型：Kleinrock 最优操作点（In-flight = BDP）</text>
<text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" letter-spacing="0.02em">BDP = BtlBw × RTprop · CUBIC 填满排队 vs BBR 探测瓶颈速率与最小 RTT</text>

