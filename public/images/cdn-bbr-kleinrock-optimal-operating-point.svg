  <rect x="140" y="364.0" width="140" height="16" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" /><text x="210" y="375.0" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">RTprop 纯传播时延</text>
