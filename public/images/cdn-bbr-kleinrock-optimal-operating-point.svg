  <polyline points="120,208 500,108 880,108" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round" />
  <circle cx="500" cy="108" r="4" fill="#eb6c36" stroke="#ffffff" stroke-width="1" />
  
  <rect x="516" y="88" width="196" height="18" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" /><text x="614" y="100" fill="#eb6c36" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">BDP · Kleinrock 最优点</text>
