<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 递归步数安全护栏与死循环主动干预 (Step Recursion Guard)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">步数超出 MaxSteps = 25 ──► 自动触发安全挂起 ──► 注入引导提示词强制要求模型给出阶段性总结或求助用户</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Uncontrolled Recursion -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 无限制递归：陷入死循环与资源耗尽</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">代码遇到复杂编译错误，模型产生执念：</text>
          
          <text y="38" fill="#ef4444">• Step 1..100: 反复微调一个错误变量名</text>
          <text y="54" fill="#fca5a5">• 无穷递归执行，耗费数小时未给用户任何反馈</text>
          <text y="70" fill="#ef4444">• 最终因上下文超长或内存溢出直接 Crash！</text>
          
          <text y="94" fill="#ef4444">🔴 极度破坏用户信任！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">架构缺陷：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 缺乏顶层状态机熔断机制；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 未能及时向人类请求干预；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 必须设置确定性步数界限！</text>
      </g>
    </g>

    <!-- Right: Controlled Guard -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ DSH 步数硬护栏：阶段汇报与主动求助</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">DSH 智能熔断与恢复机制：</text>
          
          <text y="36" fill="#86efac">1. 当 Step 达到 20 步 ──► 注入警告: "请收敛并提交阶段成果"</text>
          <text y="50" fill="#38bdf8">2. 达到 25 步硬上限 ──► 强行中断 Tool 派发</text>
          <text y="64" fill="#34d399">3. 自动生成当前进展、已解决问题与阻碍点清单</text>
          <text y="78" fill="#4ade80">4. 主动弹出 ask_question 请求人类工程师指引！</text>
          
          <text y="104" fill="#4ade80">✓ 始终保持人机协同的高效正反馈闭环！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免无意义的算力浪费与死循环；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 打造确定性、可预测、高可信的工程助手；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级自主 Agent 标杆！</text>
      </g>
    </g>
  </g>
</svg>