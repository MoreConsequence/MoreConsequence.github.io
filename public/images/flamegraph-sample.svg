<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="900" height="420" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">火焰图:宽度 = 采样占比,不是执行顺序</text>

  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12">
    <rect x="50" y="330" width="800" height="34" rx="3" fill="#334155"/>
    <text x="450" y="352" text-anchor="middle" fill="#e2e8f0">handler() — 100%</text>

    <rect x="50" y="288" width="200" height="34" rx="3" fill="#0ea5e9"/>
    <text x="150" y="310" text-anchor="middle" fill="#f8fafc">parse_request()</text>
    <rect x="250" y="288" width="440" height="34" rx="3" fill="#22c55e"/>
    <text x="470" y="310" text-anchor="middle" fill="#052e16">read_socket() — 55%</text>
    <rect x="690" y="288" width="160" height="34" rx="3" fill="#f59e0b"/>
    <text x="770" y="310" text-anchor="middle" fill="#451a03">json_encode()</text>

    <rect x="250" y="246" width="384" height="34" rx="3" fill="#3b82f6"/>
    <text x="442" y="268" text-anchor="middle" fill="#f8fafc">sys_read() — 48%</text>
    <rect x="634" y="246" width="56" height="34" rx="3" fill="#94a3b8"/>
    <text x="662" y="268" text-anchor="middle" font-size="10" fill="#0f172a">logic</text>

    <rect x="250" y="204" width="360" height="34" rx="3" fill="#a855f7"/>
    <text x="430" y="226" text-anchor="middle" fill="#f8fafc">copy_to_user() — 45%</text>
    <rect x="610" y="204" width="24" height="34" rx="3" fill="#94a3b8"/>

    <rect x="250" y="162" width="352" height="34" rx="3" fill="#ef4444"/>
    <text x="426" y="184" text-anchor="middle" fill="#fff1f2" font-weight="700">memcpy() — 44%</text>
  </g>

  <line x1="50" y1="386" x2="850" y2="386" stroke="#475569" stroke-width="2"/>
  <text x="450" y="408" text-anchor="middle" font-size="13" fill="#cbd5e1">宽度（x 轴）:该函数在全部样本中的占比 → 越宽,CPU 花得越多</text>

  <g font-size="12" fill="#cbd5e1">
    <text x="130" y="60" font-weight="700" fill="#f472b6">热点：memcpy() 44%</text>
    <text x="130" y="80">顶部收窄到唯一底层调用</text>
    <text x="130" y="100">→ 每秒 40%+ CPU 在拷数据</text>
    <line x1="380" y1="70" x2="400" y2="160" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4 3"/>

    <text x="560" y="60" font-weight="700" fill="#facc15">读法规则</text>
    <text x="560" y="80">① 自上而下找最宽的"叶子"</text>
    <text x="560" y="100">② 越靠底部越接近根因</text>
    <text x="560" y="120">③ 顶部窄 ≠ 不热，看累加宽度</text>
    <line x1="560" y1="130" x2="600" y2="160" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <rect x="50" y="55" width="16" height="16" fill="#0ea5e9"/>
  <text x="72" y="68" font-size="11" fill="#94a3b8">业务函数</text>
  <rect x="170" y="55" width="16" height="16" fill="#3b82f6"/>
  <text x="192" y="68" font-size="11" fill="#94a3b8">内核 syscall</text>
  <rect x="300" y="55" width="16" height="16" fill="#ef4444"/>
  <text x="322" y="68" font-size="11" fill="#94a3b8">底层热点</text>
</svg>
