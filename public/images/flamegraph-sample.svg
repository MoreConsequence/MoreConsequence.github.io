<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#ea580c"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Linux Perf 火焰图判读法则：横轴采样占比与调用栈聚合</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">横轴宽度 = 采样样本百分比（而非时间先后顺序） | 纵轴高度 = 调用栈深度（Callstack Frames）</text>
  </g>

  <!-- Left: Flamegraph Panel (610px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="610" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Y-Axis Header / Stack indicator -->
    <rect width="610" height="32" rx="8" fill="#f1f5f9"/>
    <text x="16" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">On-CPU 采样火焰图聚合视图（寻找最宽的平顶）</text>
    <text x="590" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" text-anchor="end">总采样样本: 10,000 samples (99Hz)</text>

    <!-- Stack Blocks -->
    <g transform="translate(25, 45)" font-family="ui-monospace, monospace" font-size="11">
      <!-- Frame Level 0 (Root) -->
      <rect x="0" y="210" width="560" height="32" rx="4" fill="#334155" stroke="#1e293b"/>
      <text x="280" y="230" fill="#f8fafc" font-weight="700" text-anchor="middle">all_threads / epoll_wait_loop() — [100% Total Samples]</text>

      <!-- Frame Level 1 -->
      <rect x="0" y="170" width="140" height="32" rx="4" fill="#60a5fa" stroke="#3b82f6"/>
      <text x="70" y="190" fill="#ffffff" font-weight="600" text-anchor="middle">parse_json() 25%</text>

      <rect x="145" y="170" width="310" height="32" rx="4" fill="#3b82f6" stroke="#2563eb"/>
      <text x="300" y="190" fill="#ffffff" font-weight="700" text-anchor="middle">http_read_socket() — 55%</text>

      <rect x="460" y="170" width="100" height="32" rx="4" fill="#93c5fd" stroke="#60a5fa"/>
      <text x="510" y="190" fill="#1e3a8a" font-weight="600" text-anchor="middle">auth_check() 18%</text>

      <!-- Frame Level 2 -->
      <rect x="145" y="130" width="280" height="32" rx="4" fill="#2563eb" stroke="#1d4ed8"/>
      <text x="285" y="150" fill="#ffffff" font-weight="700" text-anchor="middle">sys_read() / vfs_read() — 50%</text>

      <rect x="430" y="130" width="25" height="32" rx="4" fill="#cbd5e1" stroke="#94a3b8"/>

      <!-- Frame Level 3 -->
      <rect x="145" y="90" width="265" height="32" rx="4" fill="#1d4ed8" stroke="#1e40af"/>
      <text x="277" y="110" fill="#ffffff" font-weight="700" text-anchor="middle">copy_to_user() — 47%</text>

      <!-- Frame Level 4 (Top Hotspot Flat Plate) -->
      <rect x="145" y="50" width="250" height="32" rx="4" fill="#ea580c" stroke="#c2410c"/>
      <text x="270" y="70" fill="#ffffff" font-weight="700" text-anchor="middle">🔥 memcpy_erms() — 44.5% (真瓶颈)</text>
    </g>

    <!-- X-Axis Bar -->
    <line x1="25" y1="300" x2="585" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">0%</text>
    <text x="305" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">X 轴：函数在全部 CPU 采样中的累计占比（越宽耗时越长）</text>
    <text x="585" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="end">100%</text>
  </g>

  <!-- Right: Interpretation Rules Card (280px wide) -->
  <g transform="translate(655, 75)" filter="url(#card-shadow)">
    <rect width="275" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect width="275" height="32" rx="8" fill="#fff7ed"/>
    <text x="14" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c">🎯 资深工程师火焰图三步速读法</text>

    <g transform="translate(14, 46)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">
      <!-- Rule 1 -->
      <rect x="0" y="0" width="247" height="74" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="18" font-weight="700" fill="#ea580c">1. 抓最宽的“平顶”（Flat Tops）</text>
      <text x="10" y="36" fill="#475569">如果顶部很宽且没有子调用，</text>
      <text x="10" y="52" fill="#475569">说明 CPU 绝大部分耗在自身指令；</text>
      <text x="10" y="68" fill="#2563eb">图中的 memcpy 占了 44% CPU！</text>

      <!-- Rule 2 -->
      <rect x="0" y="84" width="247" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="102" font-weight="700" fill="#0f172a">2. 区分“自身开销”与“调用开销”</text>
      <text x="10" y="120" fill="#475569">`sys_read` 宽不代表它慢，是因</text>
      <text x="10" y="136" fill="#475569">它调用的子函数宽；层层下钻</text>
      <text x="10" y="152" fill="#475569">直至找到产生平顶的根本原因。</text>

      <!-- Rule 3 -->
      <rect x="0" y="174" width="247" height="96" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="192" font-weight="700" fill="#0f172a">3. 警惕 On-CPU 的“盲区陷阱”</text>
      <text x="10" y="210" fill="#475569">标准 perf 只能抓正在 CPU 上跑</text>
      <text x="10" y="226" fill="#475569">的代码；等互斥锁、等磁盘、</text>
      <text x="10" y="242" fill="#475569">等网络（Off-CPU 阻塞）在图上</text>
      <text x="10" y="258" font-weight="700" fill="#dc2626">是完全空白的，需结合 Off-CPU 图！</text>
    </g>
  </g>
</svg>
