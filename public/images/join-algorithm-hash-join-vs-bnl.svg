<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="join-algorithm-hash-join-vs-bnl-title join-algorithm-hash-join-vs-bnl-desc"><title id="join-algorithm-hash-join-vs-bnl-title">关联算法进化：Block Nested Loop (BNL) vs MySQL 8.0 现代 Hash Join</title><desc id="join-algorithm-hash-join-vs-bnl-desc">对比图展示 MySQL 5.7 BNL 分块嵌套循环反复全表扫被驱动表与 Buffer Pool 污染，对比 MySQL 8.0 Hash Join 的内存 Build 哈希表与单次 Probe 线性扫描的架构飞跃。</desc>
  <defs>
    <marker id="hj-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="hj-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">MULTI-TABLE JOIN EVOLUTION · BNL VS HASH JOIN</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">多表关联算法进化：BNL vs Hash Join</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">BNL (分块缓冲、重复全表扫、污染 Buffer Pool) vs MySQL 8.0 Hash Join (内存建哈希表、单次顺序探测、百倍提速)</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="69" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LEGACY · 5.7 BNL</text>
    <text x="134" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Block Nested Loop (BNL)</text>

    
    <rect x="14" y="42" width="392" height="80" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">分块装载 + 重复扫描机制</text>
    <text x="24" y="82" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">1. 驱动表切分成 10 块，放入 join_buffer</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">2. 每装入 1 块 ➔ 被驱动表全表扫描 1 次！</text>
    <text x="24" y="114" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Total Scans: 10 Full Table Scans</text>

    
    <rect x="14" y="132" width="392" height="114" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="154" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">严重的系统副作用：</text>
    <text x="24" y="174" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 时间复杂度: O(M * N) 伪笛卡尔积开销；</text>
    <text x="24" y="192" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 破坏 Buffer Pool: 重复大扫描刷爆 LRU 老生代；</text>
    <text x="24" y="210" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 导致全库热点数据被误淘汰，系统 P99 抖动飙升。</text>
    <text x="24" y="230" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Buffer Pool Thrashing Risk</text>

    
    <rect x="14" y="256" width="392" height="104" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="278" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">历史地位</text>
    <text x="24" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">MySQL 5.7 无索引关联的保底妥协方案。大表关联极易导致数据库直接卡死，已被 MySQL 8.0 彻底废弃替代。</text>
    <text x="24" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Deprecated in MySQL 8.0.20+</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">High CPU &amp; Disk IO Penalty</text>
  </g>

  
  <g transform="translate(480, 136)">
    <rect width="440" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="120" height="18" rx="2" fill="#eb6c36" />
    <text x="74" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">MODERN · 8.0 HASH</text>
    <text x="144" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Hash Join (现代哈希连接)</text>

    
    <rect x="14" y="42" width="412" height="80" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">两阶段：Build 内存建表 + Probe 单次流式探测</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1. Build: 小表全量在内存构建 Hash Table (O(M))</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. Probe: 大表仅顺序扫描 1 次，哈希 O(1) 匹配！</text>
    <text x="24" y="114" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">Total Scans: Exactly 1 Scan for Probe Table</text>

    
    <rect x="14" y="132" width="412" height="114" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="154" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">极致性能与稳定性飞跃：</text>
    <text x="24" y="174" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 时间复杂度: O(M + N) 线性极速！</text>
    <text x="24" y="192" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 0 Buffer Pool 污染: 大表单次顺序流式读过即走；</text>
    <text x="24" y="210" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 内存不足时自动优雅溢出为 On-Disk Hash Join。</text>
    <text x="24" y="230" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">100x Speedup Over BNL</text>

    
    <rect x="14" y="256" width="412" height="104" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="278" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">现代标准生产实践</text>
    <text x="24" y="298" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">MySQL 8.0 默认连接策略。无论有无等值索引，在大数据量无索引关联时均能提供稳定可控的极致吞吐。</text>
    <text x="24" y="322" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Linear Scalability &amp; Zero Pool Pollution</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Modern Relational Optimizer Standard</text>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">旧版 BNL 重复全表扫机制</text>
  <rect x="330" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="350" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">MySQL 8.0 Hash Join 单次 Probe 探测与线性加速核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
