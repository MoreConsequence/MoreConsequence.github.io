<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">多表关联算法革命：Block Nested-Loop (BNL) vs 内存 Hash Join</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">老版本 BNL (O(M×N) 笛卡尔积暴力嵌套循环扫描，极度消耗 CPU) vs MySQL 8.0 Hash Join (O(M+N) 极速哈希构建与探测，性能提升 100 倍)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: BNL -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 老旧 BNL 算法：O(M×N) 暴力循环扫描</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">SELECT * FROM t1 JOIN t2 ON t1.val = t2.val (无索引)</text>
          
          <text y="38" fill="#ef4444">执行机制：</text>
          <text y="52" fill="#fca5a5">1. 将小表 t1 读入 join_buffer</text>
          <text y="66" fill="#ef4444">2. 针对大表 t2 的每一行，逐一扫描 join_buffer 内存块</text>
          <text y="80" fill="#ef4444">3. 比较次数: 100,000 × 100,000 = 100 亿次 CPU 比对！</text>
          
          <text y="106" fill="#f87171">🔴 CPU 瞬间被打到 100% 满载，查询卡死数分钟！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 无索引多表关联时的致命性能杀手；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• Buffer Pool 容易被关联大表扫描彻底污染；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• MySQL 8.0 已经彻底将其废弃！</text>
      </g>
    </g>

    <!-- Right: Hash Join -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ MySQL 8.0 Hash Join：O(M+N) 极速哈希流</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">两个阶段：Build 阶段 + Probe 阶段</text>
          
          <text y="38" fill="#86efac">1. Build: 将小表 t1 在内存中构建为 Hash 表: Map[val] -&gt; Row</text>
          <text y="54" fill="#38bdf8">2. Probe: 流式扫描大表 t2，每行通过 Hash 查表 O(1) 匹配！</text>
          <text y="70" fill="#34d399">3. 比较次数仅需: 100,000 + 100,000 = 20 万次！</text>
          
          <text y="104" fill="#4ade80">✓ 耗时从 45 秒暴降至 0.12 秒，性能提升 375 倍！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 极大增强复杂 OLAP 分析与无索引查询韧性；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 内存不足时自动优雅降级为磁盘 Hash 分区；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化数据库内核顶级演进！</text>
      </g>
    </g>
  </g>
</svg>