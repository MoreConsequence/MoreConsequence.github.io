<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 128k 上下文窗口四大板块黄金预算配比拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 静态 System Prompt (10k) ｜ 2. 长期压缩摘要 (20k) ｜ 3. 近期活跃消息窗口 (35k) ｜ 4. 输出与预留缓冲区 (8k)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. System &amp; Tools (10k)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">不可驱逐的核心锚点：</text>
          
          <text x="8" y="38" fill="#86efac">• 角色设定与安全边界</text>
          <text x="8" y="54" fill="#38bdf8">• 完整 JSON Schema 工具集</text>
          <text x="8" y="70" fill="#34d399">• 100% 命中 Prompt Caching</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 永驻显存前缀基石！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 字节级稳定，严禁注入动态时间；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 享受 90% 费用打折；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 极速预热。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Compacted Memory (20k)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">长期结构化决策记忆：</text>
          
          <text x="8" y="38" fill="#86efac">• 历史 50 步的关键决策摘要</text>
          <text x="8" y="54" fill="#38bdf8">• 消除 90% 冗余中间文件读取</text>
          <text x="8" y="70" fill="#4ade80">• 动态增量滚动更新</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 突破窗口物理极限！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免长任务出现灾难性失忆；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 保持极高信息密度；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 长期记忆中枢。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Active Window (35k)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">近期活跃原始数据：</text>
          
          <text x="8" y="38" fill="#fed7aa">• 最近 5 轮完整用户交互</text>
          <text x="8" y="54" fill="#38bdf8">• 完整的测试报错堆栈</text>
          <text x="8" y="70" fill="#4ade80">• 未被截断的最新代码 Diff</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 保证当前推理绝对精准！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 提供法医级最近操作现场；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 支撑复杂算法的精细调试；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工作记忆核心。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. Output Reserve (8k)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">生成空间安全红线：</text>
          
          <text x="8" y="38" fill="#e9d5ff">• 预留给大模型生成长代码</text>
          <text x="8" y="54" fill="#38bdf8">• 绝不让输入挤占输出空间</text>
          <text x="8" y="70" fill="#4ade80">• 避免触发生成截断导致代码残缺</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 保证交付物完整落地！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">沉淀效益：</text>
        <text x="10" y="34" font-size="7.5" fill="#6b21a8">• 科学严谨的预算分配模型；</text>
        <text x="10" y="48" font-size="7.5" fill="#6b21a8">• 支撑系统在高压下稳健运行；</text>
        <text x="10" y="62" font-size="7.5" fill="#6b21a8">• 工业级大模型工程标准！</text>
      </g>
    </g>
  </g>
</svg>