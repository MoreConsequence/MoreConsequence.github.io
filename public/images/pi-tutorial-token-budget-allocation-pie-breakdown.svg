    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. Total &gt;= 20,000: 触发压缩，保留最近 16k</text>
    <text x="24" y="118" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">3. 冷历史折叠为 [SESSION SUMMARY] 节点</text>
    <text x="24" y="136" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Stable Prompt Cache Reuse Window</text>

