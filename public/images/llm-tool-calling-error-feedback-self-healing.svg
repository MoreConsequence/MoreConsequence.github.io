<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">给模型写的 API 错误合同：死板 500 报错 vs 结构化自愈纠错反馈</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">传统人类错误 (Internal Server Error 导致 Agent 死循环重试) ｜ 模型专用错误 (包含期望枚举、纠错建议与修正路径)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Human Error Shape -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统人类错误格式：导致 Agent 盲目死循环</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 传统后端返回给模型的错误</text>
          <text y="28" fill="#f87171">{ "error": "Invalid arguments", "code": 400 }</text>
          
          <text y="52" fill="#ef4444">🔴 Agent 模型面临的困境：</text>
          <text y="68" fill="#fca5a5">• 模型根本不知道究竟是哪个字段填错了；</text>
          <text y="84" fill="#fca5a5">• 模型只能靠瞎猜进行第 2 次、第 3 次调用；</text>
          <text y="100" fill="#fb7185">• 最终耗尽最大重试轮次，任务彻底失败！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">核心认知偏差：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 给模型调用的 API 不是给前端写网页；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 模糊的报错直接剥夺了 Agent 的自愈推理能力；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 错误信息本身必须具备操作指导性！</text>
      </g>
    </g>

    <!-- Right: Agent-Centric Error Shape -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 模型专用结构化契约：一键触发智能自愈</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 自愈型错误结构体</text>
          <text y="28" fill="#86efac">{</text>
          <text y="42" fill="#38bdf8">  "status": "error",</text>
          <text y="56" fill="#86efac">  "field": "region",</text>
          <text y="70" fill="#f87171">  "received": "bj",</text>
          <text y="84" fill="#4ade80">  "expected": ["cn-beijing", "cn-shanghai"],</text>
          <text y="98" fill="#34d399">  "suggestion": "请将 region 修正为标准枚举 'cn-beijing' 后重试"</text>
          <text y="112" fill="#86efac">}</text>
          <text y="130" fill="#34d399">✓ 模型读完瞬间理解，下一轮 100% 纠错成功！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Agent 自愈成功率从 20% 飙升至 95%+；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 大幅减少死循环重试带来的无效 Token 浪费；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造生产级企业智能体最核心的工程协议！</text>
      </g>
    </g>
  </g>
</svg>