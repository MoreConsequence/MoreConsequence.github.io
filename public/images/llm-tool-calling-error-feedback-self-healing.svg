<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="llm-tool-calling-error-feedback-self-healing-title llm-tool-calling-error-feedback-self-healing-desc"><title id="llm-tool-calling-error-feedback-self-healing-title">给模型写的 API：结构化错误形状与 Agent 闭环自愈契约</title><desc id="llm-tool-calling-error-feedback-self-healing-desc">给模型写的 API：结构化错误形状与 Agent 闭环自愈契约</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">给模型写的 API 错误合同：死板 500 报错 vs 结构化自愈纠错反馈</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">传统人类错误 (Internal Server Error 导致 Agent 死循环重试) ｜ 模型专用错误 (包含期望枚举、纠错建议与修正路径)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 传统人类错误格式：导致 Agent 盲目死循环</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 传统后端返回给模型的错误</text>
          <text y="28" fill="#f5f5f5">{ "error": "Invalid arguments", "code": 400 }</text>

          <text y="52" fill="#f5f5f5">🔴 Agent 模型面临的困境：</text>
          <text y="68" fill="#f5f5f5">• 模型根本不知道究竟是哪个字段填错了；</text>
          <text y="84" fill="#f5f5f5">• 模型只能靠瞎猜进行第 2 次、第 3 次调用；</text>
          <text y="100" fill="#fb7185">• 最终耗尽最大重试轮次，任务彻底失败！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">核心认知偏差：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 给模型调用的 API 不是给前端写网页；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 模糊的报错直接剥夺了 Agent 的自愈推理能力；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 错误信息本身必须具备操作指导性！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 模型专用结构化契约：一键触发智能自愈</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 自愈型错误结构体</text>
          <text y="28" fill="#f5f5f5">{</text>
          <text y="42" fill="#f5f5f5">  "status": "error",</text>
          <text y="56" fill="#f5f5f5">  "field": "region",</text>
          <text y="70" fill="#f5f5f5">  "received": "bj",</text>
          <text y="84" fill="#f5f5f5">  "expected": ["cn-beijing", "cn-shanghai"],</text>
          <text y="98" fill="#f5f5f5">  "suggestion": "请将 region 修正为标准枚举 'cn-beijing' 后重试"</text>
          <text y="112" fill="#f5f5f5">}</text>
          <text y="130" fill="#f5f5f5">✓ 模型读完瞬间理解，下一轮 100% 纠错成功！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">工业级收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• Agent 自愈成功率从 20% 飙升至 95%+；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 大幅减少死循环重试带来的无效 Token 浪费；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 打造生产级企业智能体最核心的工程协议！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
