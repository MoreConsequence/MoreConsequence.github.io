<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">自主 Agent 上下文动态压缩与精简流水线 (Context Compactor)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 工具输出大载荷裁剪 (Observation Truncation) ──► 2. 历史会话递归语义摘要 (Recursive Summary) ──► 3. 关键决策状态提取 ──► 维持 8K 恒定窗口</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 工具输出原始大载荷主动裁剪 (Observation Pruning &amp; Truncation)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">终端命令返回 2,000 行编译日志 ──► 仅保留前 10 行与最后 30 行关键错误 ──► 节省 90% 垃圾 Token</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">避免巨量控制台无用输出挤爆窗口！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 历史回合递进式结构化摘要 (Progressive Semantic Distillation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">每累积 10 轮对话 ──► 触发轻量小模型提炼为 300 字核心事实摘要 ──► 替换原始长篇消息历史</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将松散的自然语言对话压缩为致密的信息骨架！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 状态快照与任务账本持有 (State Snapshot &amp; Todo Ledger)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">维护外部结构化状态账本 (task_list.json / completed_steps) ──► 显式注入最新进展</text>
        <text x="15" y="62" font-size="8" fill="#047857">让 Agent 永远清晰知道“当前在哪、下一步该去哪”，0 迷失！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 永续无限轮次自主执行 (Infinite-Horizon Autonomous Loop)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">总活跃上下文严格受控在 8,000 Token 以内 ──► 支持连续自主运行数天数千步 ──► 成本维持极低常数！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">工业级自主 Agent 系统的终极护城河！</text>
      </g>
    </g>
  </g>
</svg>