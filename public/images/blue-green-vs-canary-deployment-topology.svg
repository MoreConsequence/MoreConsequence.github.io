<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="blue-green-vs-canary-deployment-topology-title blue-green-vs-canary-deployment-topology-desc"><title id="blue-green-vs-canary-deployment-topology-title">发布策略全景对比：蓝绿部署 (Blue-Green 瞬间切流) vs 金丝雀灰度 (Canary 渐进放量)</title><desc id="blue-green-vs-canary-deployment-topology-desc">发布策略全景对比：蓝绿部署 (Blue-Green 瞬间切流) vs 金丝雀灰度 (Canary 渐进放量)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">企业级发布模式对决：蓝绿部署 (Blue-Green) vs 金丝雀灰度 (Canary)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">蓝绿部署 (双倍硬件冗余，负载均衡器 1 秒原子切换，秒级回滚) vs 金丝雀灰度 (1% -&gt; 5% -&gt; 25% -&gt; 100% 渐进放量，指标异常自动熔断)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">蓝绿部署 (Blue-Green 瞬间全量切换)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">1. 存量稳定集群: Blue (100% 生产流量)</text>
          <text y="28" fill="#f5f5f5">2. 部署全新集群: Green (0% 流量，充分预热冒烟)</text>

          <text y="50" fill="#f5f5f5">3. 负载均衡原子切流：</text>
          <text y="64" fill="#f5f5f5">   • 修改 Ingress / Nginx upstream ──► 指向 Green</text>
          <text y="78" fill="#f5f5f5">   • 耗时 &lt; 1 秒，全站瞬间完成版本交接！</text>
          <text y="92" fill="#f5f5f5">4. 若异常: 1 秒切回 Blue 瞬间止血！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 需要 2 倍物理服务器硬件资源；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 数据库 Schema 必须保证前向与后向双向兼容；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 适合核心重大版本发布。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">金丝雀灰度 (Canary 渐进按权放量)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">基于 Envoy / Istio 流量路由：</text>

          <text y="36" fill="#f5f5f5">1. 部署 1 个新版本 Pod (承担 2% 流量)</text>
          <text y="50" fill="#f5f5f5">2. Prometheus 自动分析 5 分钟错误率与 P99</text>
          <text y="64" fill="#f5f5f5">3. 指标正常 ──► 自动放量至 10% ──► 50% ──► 100%</text>
          <text y="78" fill="#f5f5f5">4. 若 5xx &gt; 0.5% ──► Argo Rollouts 自动触发秒级回滚！</text>

          <text y="104" fill="#f5f5f5">✓ 将潜在 Bug 影响范围控制在极小边缘！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 硬件资源开销极小；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 自动化可观测性指标驱动发布与熔断；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 云原生微服务发布金牌标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
