<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">网络质量双维度：RFC 3550 Jitter 滤波与 Bufferbloat 缓冲膨胀</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">空载 RTT (基线) vs 满载 RTT (排队时延暴涨 500ms+) ｜ RFC 3550 一阶滑动平滑滤波 J = J + (|D| - J) / 16</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: RFC 3550 Jitter -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. RFC 3550 抖动 (Jitter) 滤波算法</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// RFC 3550 国际标准抖动平滑公式</text>
          <text y="30" fill="#93c5fd">D(i, j) = (R_j - S_j) - (R_i - S_i) // 相邻两包时延差</text>
          <text y="48" fill="#34d399">Jitter(i) = Jitter(i-1) + (|D(i-1, i)| - Jitter(i-1)) / 16</text>
          
          <text y="74" fill="#cbd5e1">1. 相当于时间常数约为 16 个采样周期的低通滤波器</text>
          <text y="90" fill="#34d399">2. 过滤掉偶发的单次单包网络扰动</text>
          <text y="106" fill="#4ade80">3. 真实反映音视频通话与竞技游戏的平稳度！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">游戏与语音指标：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 极佳: Jitter &lt; 2ms (丝滑对战，零卡顿)；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 警告: Jitter &gt; 15ms (语音断续，丢包严重)；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造超越单一带宽数字的立体网络画像！</text>
      </g>
    </g>

    <!-- Right: Bufferbloat -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. Bufferbloat (缓冲膨胀) 满载度量</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">// 缓冲膨胀测量流程 (Loaded Latency)</text>
          <text y="28" fill="#fed7aa">1. 空载基线: Idle RTT = 12ms (空闲状态时延)</text>
          <text y="44" fill="#f87171">2. 满载下行灌水时: Loaded RTT 飙升至 450ms！</text>
          <text y="60" fill="#ef4444">   • 路由器过度缓冲导致排队雪崩 (Queueing Delay)</text>
          <text y="76" fill="#f87171">   • 此时家人看视频，你的游戏瞬间红字跳 ping 400ms！</text>
          
          <text y="102" fill="#34d399">✓ 现代测速必须同时输出：空载时延 + 满载下载时延 + 满载上传时延！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">治理方案：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 路由器开启 SQM (Smart Queue Management) / fq_codel / CAKE；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 满载下时延增加控制在 &lt; 5ms 内；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 彻底消灭网络拥塞时的排队恶疾！</text>
      </g>
    </g>
  </g>
</svg>