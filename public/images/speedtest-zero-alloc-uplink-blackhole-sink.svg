  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">MOBILE ZERO HEAP ALLOCATION · ART GC, JETSAM &amp; STATIC SLICING</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">移动端零堆分配推流与 GC 消除架构</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">Android ART 掉帧 &amp; iOS Jetsam 崩溃 ➔ 2MB 静态常驻切片 ➔ TypedArray 视图 ➔ 0 次 GC</text>

  
  
