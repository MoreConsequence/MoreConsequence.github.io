    <text x="20" y="62" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">new byte[64KB] In Loop</text>
    <text x="20" y="78" fill="#2d3142" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 每秒产生 2,000 个短期堆对象</text>
