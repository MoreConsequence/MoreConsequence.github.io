<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">fsync 物理耗时与吞吐天花板 (The Physical Cost of fsync)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">每个事务单次 fsync: 机械硬盘 (100 TPS 物理死线) vs 企业级 NVMe (10,000 TPS 上限) ｜ 倒逼组提交 (Group Commit) 架构诞生</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: HDD vs NVMe -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 单事务独占 fsync：吞吐被物理硬件死死锁死</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">commit() ──► write() ──► fsync() ──► 等待硬件持久化</text>
          
          <text y="38" fill="#ef4444">物理延迟耗时账单：</text>
          <text y="52" fill="#fca5a5">• 7200 转机械硬盘: 10ms 磁头寻道 ──► 极限 100 TPS！</text>
          <text y="66" fill="#fca5a5">• SATA SSD: 1ms Flash 擦写 ──► 极限 1,000 TPS！</text>
          <text y="80" fill="#ef4444">• NVMe SSD: 100μs 刷盘 ──► 极限 10,000 TPS！</text>
          
          <text y="106" fill="#ef4444">🔴 面对百万级并发，单事务刷盘会导致系统瞬间瘫痪！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 磁盘写放大严重，硬件寿命骤减；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• CPU 几乎全在等待磁盘 I/O 完成（iowait 90%）；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须引入流水线组提交！</text>
      </g>
    </g>

    <!-- Right: Group Commit -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 组提交 (Group Commit)：单次 fsync 聚合 1000 事务</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">MySQL 3 阶段流水线: Flush ──► Sync ──► Commit</text>
          
          <text y="38" fill="#86efac">聚合机制：</text>
          <text y="52" fill="#34d399">1. Leader 线程收集 1,000 个 Follower 事务的日志</text>
          <text y="66" fill="#34d399">2. 仅发起 1 次系统调用: fsync(redoLogFd)</text>
          <text y="80" fill="#34d399">3. 一网打尽，1,000 个事务同时宣告持久化成功！</text>
          
          <text y="106" fill="#4ade80">✓ 单机吞吐轻松突破 100,000+ QPS 极限洪峰！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 随着并发度升高，组提交效率反而指数级提升；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 兼具 100% 强数据安全性与极致吞吐量；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 数据库内核最精妙的工程奇迹！</text>
      </g>
    </g>
  </g>
</svg>