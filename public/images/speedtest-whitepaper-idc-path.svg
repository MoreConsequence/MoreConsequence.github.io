<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="speedtest-whitepaper-idc-path-title speedtest-whitepaper-idc-path-desc">
<title id="speedtest-whitepaper-idc-path-title">测速节点不是孤立的服务器</title>
<desc id="speedtest-whitepaper-idc-path-desc">路径图区分终端、ISP 接入与骨干、IDC 机房网络和测速主机。下行与上行经过相同的逻辑阶段但方向相反；IDC 影响互联、往返时延基线、出口容量、排队与账单条件，但不等于 ISP 或测速节点本身。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');</style><marker id="speedtest-whitepaper-idc-path-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="speedtest-whitepaper-idc-path-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="speedtest-whitepaper-idc-path-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">NETWORK PLACEMENT · IDC</text>
<text x="40" y="76" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400" text-anchor="start">测速节点不是孤立的服务器</text>
<text x="40" y="104" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">一次测速同时经过接入网、网间互联、机房出口和应用端点</text>
<text x="56" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.16em">PLACEMENT · IDC / ISP / IXP</text><rect x="360" y="152" width="240" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="480" y="162" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">DOWNLOAD · NODE → CLIENT</text><rect x="360" y="344" width="240" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="480" y="354" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">UPLOAD · CLIENT → NODE</text><line x1="728" y1="240" x2="672" y2="240" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#speedtest-whitepaper-idc-path-arrow-link)"/><line x1="488" y1="240" x2="448" y2="240" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#speedtest-whitepaper-idc-path-arrow-link)"/><line x1="264" y1="240" x2="232" y2="240" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#speedtest-whitepaper-idc-path-arrow-link)"/><line x1="232" y1="288" x2="264" y2="288" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#speedtest-whitepaper-idc-path-arrow-accent)"/><line x1="448" y1="288" x2="488" y2="288" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#speedtest-whitepaper-idc-path-arrow-accent)"/><line x1="672" y1="288" x2="728" y2="288" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#speedtest-whitepaper-idc-path-arrow-accent)"/><rect x="56" y="216" width="176" height="96" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="56" y="216" width="176" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><rect x="68" y="228" width="60" height="16" rx="2" fill="none" stroke="#7a8399" stroke-width="0.8"/><text x="98" y="240" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">CLIENT</text><text x="144" y="272" fill="#2d3142" font-size="16" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">终端</text><text x="144" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">Wi-Fi · 5G · FTTH</text><rect x="264" y="216" width="184" height="96" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="264" y="216" width="184" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="276" y="228" width="40" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="296" y="240" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">ISP</text><text x="356" y="272" fill="#2d3142" font-size="14" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">接入与骨干</text><text x="356" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">last mile · transit</text><rect x="488" y="216" width="184" height="96" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="488" y="216" width="184" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><rect x="500" y="228" width="40" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/><text x="520" y="240" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">IDC</text><text x="580" y="272" fill="#2d3142" font-size="14" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">机房网络</text><text x="580" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">edge · cross-connect</text><rect x="728" y="216" width="176" height="96" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="728" y="216" width="176" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="740" y="228" width="44" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="762" y="240" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">NODE</text><text x="816" y="272" fill="#2d3142" font-size="14" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">测速主机</text><text x="816" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">NIC · kernel · HTTP</text><rect x="56" y="404" width="848" height="100" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><text x="72" y="428" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.16em">WHAT IDC CHANGES</text><line x1="272" y1="440" x2="272" y2="488" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><line x1="480" y1="440" x2="480" y2="488" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><line x1="688" y1="440" x2="688" y2="488" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><text x="72" y="456" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="600" text-anchor="start">RTT baseline</text><text x="72" y="478" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">距离 + 排队</text><text x="288" y="456" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="600" text-anchor="start">interconnect</text><text x="288" y="478" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">ISP / IXP / transit</text><text x="496" y="456" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="600" text-anchor="start">uplink + host</text><text x="496" y="478" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">出口、队列、NIC</text><text x="704" y="456" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="600" text-anchor="start">accounting</text><text x="704" y="478" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">端口 / 出口 / 重传</text><text x="56" y="526" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">IDC 是承载与互联环境；测速节点是其中的应用端点。CDN / PoP 可能改变端点位置和路由，不等同于专用测试节点。</text><line x1="40" y1="540" x2="920" y2="540" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="136" y="556" width="12" height="12" rx="2" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="0.8"/><text x="156" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">DOWNLOAD PATH</text><rect x="360" y="556" width="12" height="12" rx="2" fill="#eb6c36" stroke="#eb6c36" stroke-width="0.8"/><text x="380" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">UPLOAD PATH</text><rect x="568" y="556" width="12" height="12" rx="2" fill="#eb6c36" stroke="#eb6c36" stroke-width="0.8"/><text x="588" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">IDC BOUNDARY</text>

</svg>
