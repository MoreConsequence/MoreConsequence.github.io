<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 状态机架构：消灭 if-else 面条代码，拥抱形式化状态转移表</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">IDLE ──► THINKING ──► EXECUTING_TOOL ──► WAITING_APPROVAL ──► FINISHED / FAILED</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Spaghetti if-else -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 散落的 if-else 隐形状态债</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">if (hasPendingTool &amp;&amp; !isApproved) {</text>
          <text y="28" fill="#fca5a5">    if (toolName === 'deleteDB') {</text>
          <text y="42" fill="#fca5a5">        if (!userConfirmed) askUser();</text>
          <text y="56" fill="#fca5a5">        else if (retryCount &gt; 3) abort();</text>
          <text y="70" fill="#fca5a5">    }</text>
          <text y="84" fill="#f87171">}</text>
          
          <text y="106" fill="#ef4444">🔴 随着需求迭代：</text>
          <text y="120" fill="#fca5a5">• 状态变量相互耦合 (flag1 &amp;&amp; flag2 &amp;&amp; !flag3)</text>
          <text y="136" fill="#fb7185">• 产生无法触达的死状态与死锁分支！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">典型缺陷：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 新增一个工具调用权限审核，需要修改 10 处 if 分支；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 极难编写确定性单元测试覆盖所有组合爆炸；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 生产故障频发，排查犹如大海捞针！</text>
      </g>
    </g>

    <!-- Right: Formal State Table -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 形式化状态转移表 (TypeScript 强类型保证)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">const transitions: Record&lt;State, Partial&lt;Record&lt;Event, State&gt;&gt;&gt; = {</text>
          <text y="30" fill="#86efac">  IDLE:             { START: 'THINKING' },</text>
          <text y="46" fill="#86efac">  THINKING:         { CALL_TOOL: 'EXECUTING', NEED_AUTH: 'WAITING_AUTH', FINISH: 'DONE' },</text>
          <text y="62" fill="#86efac">  WAITING_AUTH:     { AUTH_GRANTED: 'EXECUTING', AUTH_DENIED: 'THINKING' },</text>
          <text y="78" fill="#86efac">  EXECUTING:        { TOOL_SUCCESS: 'THINKING', TOOL_ERROR: 'ERROR_HANDLING' },</text>
          <text y="94" fill="#34d399">};</text>
          <text y="114" fill="#38bdf8">► transition(curr, event): 查表瞬间完成合法转移！</text>
          <text y="130" fill="#34d399">► 遇到非法转移直接在类型期或入口抛错拦截！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">重构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 逻辑 100% 可视化，代码即状态转移图；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 单元测试只需对转移矩阵做遍历断言；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 完美支持 XState 等现代状态机框架！</text>
      </g>
    </g>
  </g>
</svg>