<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="loop-variable-goroutine-closure-shadowing-title loop-variable-goroutine-closure-shadowing-desc"><title id="loop-variable-goroutine-closure-shadowing-title">循环闭包变量捕获与 Go 1.22 语义演进</title><desc id="loop-variable-goroutine-closure-shadowing-desc">Go 语言语义演进对比图展示旧版循环单变量地址共享 Bug、手动遮蔽规避手段、Go 1.22 每次迭代独立变量语义修复，以及堆分配性能认知。</desc>
  <defs>
    <marker id="lv-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="lv-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">LOOP CLOSURE · VARIABLE SHARING BUG, SHADOWING &amp; GO 1.22 SEMANTICS</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">循环闭包变量捕获与 Go 1.22 演进</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">旧版单变量地址共享 Bug ➔ 手动 i:=i 遮蔽 ➔ Go 1.22 独立变量重构 ➔ 分配成本认知</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="205" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="62" y="25" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">GO &lt; 1.22 BUG</text>
    <text x="118" y="26" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">单变量地址共享</text>

    
    <rect x="12" y="42" width="181" height="96" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="62" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">Shared Variable Address</text>
    <text x="20" y="78" fill="#2d3142" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 循环所有迭代共用同一个 i 变量内存</text>
    <text x="20" y="94" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 并发 goroutine 延迟读取全部输出尾值</text>
    <text x="20" y="110" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Classic Concurrency Hazard</text>

    
    <rect x="12" y="148" width="181" height="96" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="170" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">严重影响：</text>
    <text x="20" y="190" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 历史 Go 代码中最常见的并发偶发缺陷；</text>
    <text x="20" y="208" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 极难通过常规单元测试稳定捕获；</text>
    <text x="20" y="226" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 极度依赖开发者个人经验与代码审查。</text>
  </g>

  
  <g transform="translate(260, 136)">
    <rect width="215" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#eb6c36" />
    <text x="62" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">WORKAROUND</text>
    <text x="118" y="26" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">手动遮蔽规避</text>

    
    <rect x="12" y="42" width="191" height="96" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="20" y="62" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">v := v / Explicit Params</text>
    <text x="20" y="78" fill="#2d3142" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 循环内部手动声明同名局部变量</text>
    <text x="20" y="94" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 或将变量作为显式形参传给匿名函数</text>
    <text x="20" y="110" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace">Manual Shadowing Idiom</text>

    
    <rect x="12" y="148" width="191" height="96" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="20" y="170" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">规避痛点：</text>
    <text x="20" y="190" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 代码冗余且不够直观优雅；</text>
    <text x="20" y="208" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 新手开发者极易遗漏该样板代码；</text>
    <text x="20" y="226" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 只是应用层的无奈妥协方案。</text>
  </g>

  
  <g transform="translate(490, 136)">
    <rect width="205" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#eb6c36" />
    <text x="62" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">GO 1.22+ FIX</text>
    <text x="118" y="26" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">语义彻底修复</text>

    
    <rect x="12" y="42" width="181" height="96" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="20" y="62" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Per-Iteration Variable</text>
    <text x="20" y="78" fill="#2d3142" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 每次迭代自动分配全新独立的变量实例</text>
    <text x="20" y="94" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 从编译器底层根除并发数据脏读</text>
    <text x="20" y="110" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace">Language-Level Safety Guarantee</text>

    
    <rect x="12" y="148" width="181" height="96" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="20" y="170" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">演进价值：</text>
    <text x="20" y="190" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 开发者不再需要手动编写 v := v；</text>
    <text x="20" y="208" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 闭包变量捕获行为完全符合直觉；</text>
    <text x="20" y="226" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 大幅提升 Go 并发代码编写体验。</text>
  </g>

  
  <g transform="translate(710, 136)">
    <rect width="210" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#2d3142" />
    <text x="62" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">PERF REALITY</text>
    <text x="118" y="26" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">性能分配认知</text>

    
    <rect x="12" y="42" width="186" height="96" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="62" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">Semantic != Zero Alloc</text>
    <text x="20" y="78" fill="#2d3142" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 语义修复消除了 Bug，未消除堆分配</text>
    <text x="20" y="94" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 闭包逃逸依然产生 1 allocs/op 开销</text>
    <text x="20" y="110" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Separate Correctness &amp; Performance</text>

    
    <rect x="12" y="148" width="186" height="96" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="170" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">工程总结：</text>
    <text x="20" y="190" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 正确性由语言保证，性能仍靠架构；</text>
    <text x="20" y="208" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 热循环仍然需要遵循逃逸优化准则；</text>
    <text x="20" y="226" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 兼顾开发效率与极致运行性能。</text>
  </g>

  
