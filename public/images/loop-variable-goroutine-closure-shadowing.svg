<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 循环变量与并发闭包捕获陷阱 (Loop Variable Pitfall)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Go 1.21 及之前 (所有 Goroutine 共享单个循环变量内存地址，打印全为最后值) ──► Go 1.22+ (语言级修复: 每次迭代自动生成全新变量作用域)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Go <= 1.21 Bug -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ Go ≤ 1.21 经典陷阱：所有协程共享同个指针</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">for _, v := range []int{1, 2, 3} {</text>
          <text y="28" fill="#ef4444">  go func() { fmt.Println(v) }() // 捕获的是 v 的指针地址！</text>
          <text y="42" fill="#f87171">}</text>
          
          <text y="66" fill="#ef4444">💥 执行结果：</text>
          <text y="80" fill="#fca5a5">• 循环极速跑完，v 的值最终停留在 3</text>
          <text y="94" fill="#ef4444">• 当 3 个 Goroutine 启动执行时，输出全部为: 3, 3, 3！</text>
          <text y="114" fill="#f87171">🔴 酿成数不清的线上批量任务重放灾难！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">历史修复方案：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 显式阴影变量: v := v；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 作为参数显式传入: go func(val int){...}(v)；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• Go 开发者踩坑率第一名问题！</text>
      </g>
    </g>

    <!-- Right: Go 1.22+ Fix -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Go 1.22+ 语言级规范终审修复</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// Go 1.22+ 官方规范重构：每次迭代创建全新实例！</text>
          <text y="28" fill="#86efac">for _, v := range []int{1, 2, 3} {</text>
          <text y="42" fill="#38bdf8">  go func() { fmt.Println(v) }() // 自动捕获当前迭代独立实例</text>
          <text y="56" fill="#86efac">}</text>
          
          <text y="80" fill="#4ade80">✓ 输出完美符合直觉: 1, 2, 3！</text>
          <text y="98" fill="#34d399">0 手工参数包装，0 样板代码，彻底根治十年顽疾！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构演进：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 语言规范向直觉与安全性全面靠拢；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 编译器优化确保 0 额外性能衰减；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化 Go 语言工程演进里程碑！</text>
      </g>
    </g>
  </g>
</svg>