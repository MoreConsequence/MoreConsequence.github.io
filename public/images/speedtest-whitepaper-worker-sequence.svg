<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="speedtest-whitepaper-worker-sequence-title speedtest-whitepaper-worker-sequence-desc">
<title id="speedtest-whitepaper-worker-sequence-title">Worker 合同：顺序由字符串驱动</title>
<desc id="speedtest-whitepaper-worker-sequence-desc">真实 Worker 时序展示 Main thread 创建 Worker、发送 start 和每 200ms 的 status，Worker 按默认 IP_D_U 调用 getIP、garbage、empty 和 telemetry；P 阶段只在 test_order 显式包含时出现。每个服务端激活条的上边界对齐请求箭头，下边界对齐返回箭头。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');</style><marker id="speedtest-whitepaper-worker-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="speedtest-whitepaper-worker-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="speedtest-whitepaper-worker-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">PROTOCOL · WORKER</text>
<text x="40" y="76" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400" text-anchor="start">Worker 合同：顺序由字符串驱动</text>
<text x="40" y="104" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">Main thread 负责控制与渲染，Worker 才持有测速数据流</text>
<text x="56" y="120" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.16em">SEQUENCE · DEFAULT IP_D_U</text><line x1="160" y1="196" x2="160" y2="532" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,3"/><line x1="480" y1="196" x2="480" y2="532" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,3"/><line x1="800" y1="196" x2="800" y2="532" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,3"/><rect x="520" y="400" width="352" height="48" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/><rect x="520" y="400" width="72" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/><text x="556" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.08em">OPTIONAL</text><text x="608" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">[P in test_order]</text><rect x="156" y="220" width="8" height="280" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><rect x="476" y="220" width="8" height="280" rx="0" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><rect x="796" y="284" width="8" height="20" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><rect x="796" y="328" width="8" height="20" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><rect x="796" y="372" width="8" height="20" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><rect x="796" y="416" width="8" height="16" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><rect x="796" y="456" width="8" height="20" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><line x1="164" y1="2