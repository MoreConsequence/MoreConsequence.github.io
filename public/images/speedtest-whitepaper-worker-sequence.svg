le" letter-spacing="0.04em">GET /garbage ×6</text><rect x="604" y="332" width="112" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="660" y="342" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">random bytes</text><rect x="604" y="352" width="112" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="660" y="362" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">POST /empty ×3</text><rect x="620" y="376" width="48" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="644" y="386" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">200</text><rect x="588" y="396" width="144" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="660" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">P? GET /empty ×10</text><rect x="500" y="436" width="96" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="548" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">P samples ×10</text><rect x="604" y="436" width="112" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="660" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">POST telemetry</text><rect x="604" y="480" width="112" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="660" y="490" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">id &lt;ULID&gt;</text><rect x="248" y="504" width="112" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="304" y="514" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">onend / done</text><rect x="80" y="136" width="160" height="64" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="80" y="136" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><rect x="92" y="148" width="40" height="16" rx="2" fill="none" stroke="#7a8399" stroke-width="0.8"/><text x="112" y="160" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">UI</text><text x="160" y="176" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">Main thread</text><text x="160" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">postMessage</text><rect x="400" y="136" width="160" height="64" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="400" y="136" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><rect x="412" y="148" width="60" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/><text x="442" y="160" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">WORKER</text><text x="480" y="176" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">Web Worker</text><text x="480" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">runNextTest</text><rect x="720" y="136" width="160" height="64" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="720" y="136" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="732" y="148" width="40" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="752" y="160" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">GO</text><text x="800" y="176" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">Go server</text><text x="800" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">HTTP handlers</text><text x="56" y="566" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">激活条上边界对齐请求箭头，下边界对齐返回箭头；虚线生命线只表示时间。P 只有显式写进 test_order 才发生。</text>

