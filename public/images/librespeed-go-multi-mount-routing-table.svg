00" text-anchor="middle">PHP 兼容路径</text><text x="196" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="middle">/empty.php · /garbage.php</text><rect x="424" y="276" width="220" height="96" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1" /><rect x="424" y="276" width="220" height="96" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1" /><rect x="436" y="288" width="64" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-width="1" /><text x="468" y="300" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">HANDLER</text><text x="534" y="324" fill="#2d3142" font-size="16" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">同一份 Go Handler</text><text x="534" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="middle">empty · garbage · getIP</text><rect x="728" y="276" width="168" height="96" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1" /><rect x="728" y="276" width="168" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" /><rect x="740" y="288" width="68" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="1" /><text x="774" y="300" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">CONTRACT</text><text x="812" y="324" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">兼容路径仍可用</text><text x="812" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="middle">same handler · 