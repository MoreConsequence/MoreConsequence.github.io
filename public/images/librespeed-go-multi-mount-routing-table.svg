<text x="40" y="92" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400" text-anchor="start">路由合同：三种 URL 形态，共用同一 Handler</text>
