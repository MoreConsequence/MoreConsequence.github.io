<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LibreSpeed Go 路由映射矩阵：一套逻辑 × 三种形态</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">原生简洁路由 ｜ PHP 老版本向前兼容路由 (/backend/garbage.php) ｜ 遥测数据读写管理面</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 原生现代路由 (Native API)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">GET  /garbage?ckSize=100</text>
          <text x="10" y="34" fill="#86efac">POST /empty (上行吸收)</text>
          <text x="10" y="50" fill="#86efac">GET  /empty (延迟与抖动)</text>
          <text x="10" y="66" fill="#38bdf8">GET  /getIP.json (客户端 IP)</text>
          
          <text x="10" y="96" fill="#34d399">✓ 专为现代化 JS SDK 设计</text>
          <text x="10" y="112" fill="#4ade80">✓ 路径清晰、语义纯粹！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 0 重定向开销，直接命中处理函数；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 参数经过严格上下界钳制校验；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造现代测速服务标准。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. PHP 兼容层 (Legacy PHP URLs)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">GET  /backend/garbage.php</text>
          <text x="10" y="34" fill="#fed7aa">POST /backend/empty.php</text>
          <text x="10" y="50" fill="#fed7aa">GET  /backend/getIP.php</text>
          
          <text x="10" y="76" fill="#34d399">内部实现：</text>
          <text x="10" y="92" fill="#cbd5e1">• 指向完全相同的 Go Handler</text>
          <text x="10" y="108" fill="#4ade80">✓ 老客户端无需改动一行代码无缝迁移！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 保持 100% 向后兼容性；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 保护既有全球客户端资产；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级平滑演进典范！</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 遥测与管理面 (Telemetry &amp; Stats)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">POST /results/telemetry.php</text>
          <text x="10" y="34" fill="#86efac">GET  /results/?id=01JK123...</text>
          <text x="10" y="50" fill="#38bdf8">GET  /stats (管理大盘认证)</text>
          
          <text x="10" y="76" fill="#34d399">安全机制：</text>
          <text x="10" y="92" fill="#cbd5e1">• Session Cookie 认证鉴权</text>
          <text x="10" y="108" fill="#4ade80">✓ IP 脱敏与 ULID ID 混淆保护！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">业务收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 兼具数据采集与隐私安全合规；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 提供开箱即用的可视化大盘；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造完整的测速业务闭环！</text>
      </g>
    </g>
  </g>
</svg>