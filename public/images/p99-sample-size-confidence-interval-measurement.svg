<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="p99-sample-size-confidence-interval-measurement-title p99-sample-size-confidence-interval-measurement-desc"><title id="p99-sample-size-confidence-interval-measurement-title">p99 分位数与样本量置信度：小样本下的伪精度与大数定律收敛曲线</title><desc id="p99-sample-size-confidence-interval-measurement-desc">p99 分位数与样本量置信度：小样本下的伪精度与大数定律收敛曲线</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">p99 分位数度量数学本质：样本量决定了度量精度的物理极限</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">100 个样本算 p99 只是最大值最大样本 (Max) ｜ 至少需要 3,000+ 样本才能获得 95% 置信度的稳定 p99 区间</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 小样本量伪精度：100 个请求算不出 p99</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 压测 100 次请求，排序后取第 99 位</text>
          <text y="30" fill="#f5f5f5">1. 第 99 位实际上就是倒数第 2 大的值</text>
          <text y="46" fill="#f5f5f5">2. 偶发一次 1s 垃圾回收，直接让"计算出的 p99"暴涨到 1s！</text>
          <text y="62" fill="#f5f5f5">3. 再次运行一次，没有撞上 GC，"p99"又变成 10ms！</text>

          <text y="88" fill="#f5f5f5">🔴 统计学荒谬真相：</text>
          <text y="104" fill="#fb7185">N=100 时，p99 的 95% 置信区间宽达 [p85, p100]，毫无统计意义！</text>
          <text y="120" fill="#f5f5f5">► 你以为测出了 SLA，其实只是测到了掷骰子的运气！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">常见工程误区：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 本机跑 50 次请求就声称 p99 优化了 30%；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 低流量接口按 1 分钟窗口聚合 p99 报表（样本仅几个）；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 导致监控大盘长年充斥虚假毛刺！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 科学分位数：大数定律与样本容量法则</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 二项分布与非参数分位数置信区间公式</text>
          <text y="30" fill="#f5f5f5">要让 p99 落在真实排名的 [98.5%, 99.5%] 内 (95% 置信度):</text>
          <text y="48" fill="#f5f5f5">► 最低必须采样样本量 N &gt;= 3,000 次！</text>

          <text y="72" fill="#f5f5f5">对于更极致的 p99.9 (千分之一长尾):</text>
          <text y="88" fill="#f5f5f5">► 最低必须采样样本量 N &gt;= 30,000 次！</text>

          <text y="112" fill="#f5f5f5">✓ 唯有在充沛样本量支撑下，分位数度量才具备科学效力！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产落地建议：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 压测评估必须满足最低样本数阈值；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 低 QPS 服务改用更长的时间窗口或直接看最大值 (Max)；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造经得起统计学推敲的真实 SLA！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
