<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">p99 分位数度量数学本质：样本量决定了度量精度的物理极限</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">100 个样本算 p99 只是最大值最大样本 (Max) ｜ 至少需要 3,000+ 样本才能获得 95% 置信度的稳定 p99 区间</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Small Sample Illusion -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 小样本量伪精度：100 个请求算不出 p99</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 压测 100 次请求，排序后取第 99 位</text>
          <text y="30" fill="#fca5a5">1. 第 99 位实际上就是倒数第 2 大的值</text>
          <text y="46" fill="#fca5a5">2. 偶发一次 1s 垃圾回收，直接让"计算出的 p99"暴涨到 1s！</text>
          <text y="62" fill="#fca5a5">3. 再次运行一次，没有撞上 GC，"p99"又变成 10ms！</text>
          
          <text y="88" fill="#ef4444">🔴 统计学荒谬真相：</text>
          <text y="104" fill="#fb7185">N=100 时，p99 的 95% 置信区间宽达 [p85, p100]，毫无统计意义！</text>
          <text y="120" fill="#ef4444">► 你以为测出了 SLA，其实只是测到了掷骰子的运气！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">常见工程误区：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 本机跑 50 次请求就声称 p99 优化了 30%；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 低流量接口按 1 分钟窗口聚合 p99 报表（样本仅几个）；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 导致监控大盘长年充斥虚假毛刺！</text>
      </g>
    </g>

    <!-- Right: Big Number Law -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 科学分位数：大数定律与样本容量法则</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">// 二项分布与非参数分位数置信区间公式</text>
          <text y="30" fill="#86efac">要让 p99 落在真实排名的 [98.5%, 99.5%] 内 (95% 置信度):</text>
          <text y="48" fill="#38bdf8">► 最低必须采样样本量 N &gt;= 3,000 次！</text>
          
          <text y="72" fill="#4ade80">对于更极致的 p99.9 (千分之一长尾):</text>
          <text y="88" fill="#4ade80">► 最低必须采样样本量 N &gt;= 30,000 次！</text>
          
          <text y="112" fill="#34d399">✓ 唯有在充沛样本量支撑下，分位数度量才具备科学效力！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">生产落地建议：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 压测评估必须满足最低样本数阈值；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 低 QPS 服务改用更长的时间窗口或直接看最大值 (Max)；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造经得起统计学推敲的真实 SLA！</text>
      </g>
    </g>
  </g>
</svg>