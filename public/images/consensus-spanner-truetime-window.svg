<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Google Spanner TrueTime 物理不确定性区间与提交等待（Commit Wait）</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">原子钟 + GPS 硬件将物理误差收敛至 $\epsilon \le 7\text{ms}$，通过 Commit Wait 等待 $2\epsilon$ 达成全球外部一致性（External Consistency）</text>
  </g>

  <!-- Main Content Card -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Timeline Coordinate (Top Half) -->
    <g transform="translate(40, 20)">
      <text x="0" y="16" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">TrueTime API 核心接口：`TT.now()` 返回时间不确定性区间 $[t_{earliest}, t_{latest}]$ (长度 $2\epsilon$)</text>

      <!-- Time axis -->
      <line x1="20" y1="65" x2="800" y2="65" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-slate)"/>
      <text x="800" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">绝对物理时间 (Absolute Time) →</text>

      <!-- Tx1 Interval Box -->
      <g transform="translate(100, 35)">
        <rect width="180" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>
        <text x="90" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">事务 $T_1$ 提交时间戳 $s_1$</text>
        <text x="90" y="32" font-family="ui-monospace, monospace" font-size="9.5" fill="#2563eb" text-anchor="middle">$[t_1 - \epsilon, t_1 + \epsilon]$</text>
      </g>

      <!-- Commit Wait Gap -->
      <g transform="translate(285, 35)">
        <rect width="140" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="70" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Commit Wait 等待</text>
        <text x="70" y="32" font-family="ui-monospace, monospace" font-size="9.5" fill="#d97706" text-anchor="middle">等待时间 $\ge 2\epsilon$</text>
      </g>

      <!-- Tx2 Interval Box (Guaranteed strictly after s1) -->
      <g transform="translate(430, 35)">
        <rect width="180" height="42" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
        <text x="90" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">事务 $T_2$ 发起时间戳 $s_2$</text>
        <text x="90" y="32" font-family="ui-monospace, monospace" font-size="9.5" fill="#059669" text-anchor="middle">$s_2 &gt; s_1$ (数学严格大于!)</text>
      </g>
    </g>

    <!-- Two-Column Breakdown (Bottom Half) -->
    <g transform="translate(20, 140)">
      <!-- Box 1: Why NTP Fails -->
      <g>
        <rect width="420" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect width="420" height="26" rx="6" fill="#f1f5f9"/>
        <text x="14" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#334155">1. 为什么传统 NTP 无法实现全局一致性？</text>

        <g transform="translate(14, 34)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">
          <text x="0" y="16">• NTP 误差高达 100ms~数秒，无法给出严格的误差上界 $\epsilon$；</text>
          <text x="0" y="32">• 若发生时钟回拨，后发生的写操作可能获得更小的时间戳；</text>
          <text x="0" y="48" font-weight="700" fill="#dc2626">• 结果：因果倒置、幽灵覆盖与读到陈旧旧版本。</text>
        </g>
      </g>

      <!-- Box 2: TrueTime Guarantee -->
      <g transform="translate(440, 0)">
        <rect width="420" height="110" rx="6" fill="#f0fdf4" stroke="#86efac"/>
        <rect width="420" height="26" rx="6" fill="#dcfce7"/>
        <text x="14" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">2. Spanner 的破局：用物理等待买来外部一致性</text>

        <g transform="translate(14, 34)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#14532d">
          <text x="0" y="16">• 每个数据中心部署 GPS 接收器与原子钟（互相独立校验）；</text>
          <text x="0" y="32">• 保证全球任何节点的时钟误差严格满足 $\epsilon \le 7\text{ms}$；</text>
          <text x="0" y="48" font-weight="700" fill="#047857">• 提交时强制休眠 $2\epsilon$，全球只读事务无需任何加锁即可极速快照读！</text>
        </g>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">Spanner 架构哲学：</tspan> 既然物理时钟不可能完美同步，那就 <tspan font-weight="700" fill="#2563eb">“显式承认不确定性区间 $\epsilon$ 并将其写入 API”</tspan>；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
        用微不足道的 10ms 提交等待，换取了全球分布式强一致性与无锁快照读的无上收益。
      </text>
    </g>
  </g>
</svg>
