<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Tree Shaking 底层机制：ESM 静态 AST 与 sideEffects 剪枝</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">CommonJS 动态 require 无法摇树 vs ESM 顶层静态 import ──► 死代码消除 (Dead Code Elimination)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: CommonJS -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ CommonJS (CJS) 无法被 Tree Shaking 摇树</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 运行时动态求值 (Dynamic Evaluation)</text>
          <text y="32" fill="#fca5a5">const lib = require(condition ? './a' : './b');</text>
          <text y="48" fill="#fca5a5">module.exports[dynamicKey] = fn;</text>
          
          <text y="70" fill="#f87171">🔴 打包工具 (Webpack / Rollup / Vite) 物理无能为力：</text>
          <text y="86" fill="#fca5a5">• 无法在构建期静态确定哪些导出真正被使用</text>
          <text y="102" fill="#fca5a5">• 只能将被引用的整个 500KB 大库全量打包进产物！</text>
          <text y="120" fill="#ef4444">► 导致产物暴增，首屏 JS 下载耗时恶化！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">典型受害者：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• lodash (CJS 版本): 引用 1 个 isEmpty 打包整库 70KB；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• moment.js: 无法剥离全球多国语言包；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 解决：全部替换为 lodash-es 或 date-fns！</text>
      </g>
    </g>

    <!-- Right: ESM -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ ESM 静态拓扑分析与 package.json sideEffects</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">// 静态 AST 编译期确定引用依赖图谱</text>
          <text y="32" fill="#86efac">import { add } from './math.js';</text>
          <text y="48" fill="#cbd5e1">// math.js 中未被引用的 multiply, divide</text>
          <text y="64" fill="#38bdf8">1. AST 标记为 unused harmony export</text>
          <text y="80" fill="#34d399">2. Terser / ESBuild 压缩器将无用函数物理删除 (DCE)</text>
          
          <text y="102" fill="#4ade80">✓ 结合 package.json: "sideEffects": false</text>
          <text y="118" fill="#86efac">   告知编译器整个模块无副作用，未引用文件直接跳过打包！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工程最佳实践：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 纯函数库显式配置 "sideEffects": false；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• CSS 文件需在 sideEffects: ["*.css"] 中显式声明排除；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 产物体积直降 60% ~ 90%，大幅优化 Core Web Vitals！</text>
      </g>
    </g>
  </g>
</svg>