<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="ebpf-pipe-title ebpf-pipe-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="ebpf-pipe-title">eBPF 虚拟机执行流水线：从 C 源码、Verifier 验证到 JIT 原生机器码</title>
  <desc id="ebpf-pipe-desc">流水线架构图展示 eBPF 程序从用户态 Clang 编译字节码、内核 Verifier 静态 DAG 安全扫描、JIT 直译物理 CPU 机器码到内核 Hook 点全速执行的全流程。</desc>
  <defs>
    <marker id="ep-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="ep-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">EBPF EXECUTION LIFECYCLE · VERIFIER &amp; JIT PIPELINE</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">eBPF 虚拟机执行流水线：从源码到 JIT 机器码</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">C 源码 ➔ Clang 编译 BPF 字节码 ➔ Verifier 静态 DAG 安全扫描 ➔ JIT 1:1 直译 x86_64 物理原生机器码</text>

  <!-- 4 Columns Grid (y=136..506, h=370) -->
  <!-- Col 1: User Space (x=40..220, w=180) -->
  <g transform="translate(40, 136)">
    <rect width="180" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 1</text>
    <text x="100" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">用户态编译</text>

    <!-- Source Code -->
    <rect x="14" y="42" width="152" height="96" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="22" y="64" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">eBPF C 源代码</text>
    <text x="22" y="84" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">SEC("xdp")</text>
    <text x="22" y="100" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">int filter(struct xdp_md *ctx)</text>
    <text x="22" y="118" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">return XDP_PASS;</text>

    <!-- Clang LLVM -->
    <rect x="14" y="150" width="152" height="110" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="22" y="172" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Clang / LLVM 编译</text>
    <text x="22" y="192" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">clang -target bpf -O2</text>
    <text x="22" y="210" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">生成 ELF 字节码文件</text>
    <text x="22" y="228" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">.bpf.o (RISC 64-bit)</text>
    <text x="22" y="246" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">包含 .text 与 .maps 节</text>

    <!-- Syscall -->
    <rect x="14" y="272" width="152" height="88" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="22" y="294" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">载入内核系统调用</text>
    <text x="22" y="314" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">bpf(BPF_PROG_LOAD)</text>
    <text x="22" y="332" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">向内核提交字节码数组</text>
    <text x="22" y="348" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">向 Verifier 请求入场</text>
  </g>

  <!-- Arrow 1 (x=220..250) -->
  <text x="235" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Load</text>
  <line x1="220" y1="230" x2="250" y2="230" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#ep-arr-accent)"/>

  <!-- Col 2: Kernel Verifier (x=250..470, w=220) - Focal -->
  <g transform="translate(250, 136)">
    <rect width="220" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="25" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 2</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">内核 Verifier 静态安全</text>

    <!-- Verifier Box -->
    <rect x="14" y="42" width="192" height="150" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="24" y="50" width="90" height="16" rx="2" fill="#e85d3f"/>
    <text x="69" y="62" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">KERNEL VERIFIER</text>
    <text x="122" y="63" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">四大铁面审查规则</text>

    <text x="24" y="86" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. DAG 有向无环图分析</text>
    <text x="24" y="100" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">   穷举遍历所有分支，严防死循环</text>

    <text x="24" y="120" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 内存边界守卫检查</text>
    <text x="24" y="134" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">   data + len &lt;= data_end 校验</text>

    <text x="24" y="154" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">3. 指针空值与类型追踪</text>
    <text x="24" y="168" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">   PTR_TO_MAP_VALUE 强制判空</text>

    <text x="24" y="186" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">4. 512B 栈深度与特权隔离</text>

    <!-- Safety Guarantee -->
    <rect x="14" y="202" width="192" height="158" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="224" fill="#e85d3f" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">内核零崩塌安全铁律</text>
    <text x="24" y="244" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">传统 LKM 内核模块一旦出现野指针，物理机瞬间 Crash 蓝屏；</text>
    <line x1="24" y1="256" x2="196" y2="256" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="276" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">eBPF Verifier 100% 静态证明：</text>
    <text x="24" y="296" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 绝对不破坏内核内存</text>
    <text x="24" y="314" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 绝对不耗尽 CPU 时钟</text>
    <text x="24" y="334" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">通过审查 ➔ 准予 JIT 编译</text>
  </g>

  <!-- Arrow 2 (x=470..500) -->
  <text x="485" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Passed</text>
  <line x1="470" y1="230" x2="500" y2="230" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#ep-arr-accent)"/>

  <!-- Col 3: BPF JIT Compiler (x=500..710, w=210) - Focal -->
  <g transform="translate(500, 136)">
    <rect width="210" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="25" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 3</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">BPF JIT 裸机直译</text>

    <!-- JIT Translation -->
    <rect x="14" y="42" width="182" height="142" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">1:1 寄存器直译映射</text>
    <text x="24" y="84" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">BPF R0 (Return) ➔ x86 RAX</text>
    <text x="24" y="100" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">BPF R1 (Arg 1)  ➔ x86 RDI</text>
    <text x="24" y="116" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">BPF R2 (Arg 2)  ➔ x86 RSI</text>
    <text x="24" y="132" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">BPF R10 (Stack) ➔ x86 RBP</text>
    <line x1="24" y1="144" x2="186" y2="144" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="162" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">BPF_ADD R1, R2 ➔ add %rsi, %rdi</text>
    <text x="24" y="176" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Machine Code: 48 01 f7</text>

    <!-- Native Performance -->
    <rect x="14" y="196" width="182" height="164" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="218" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">裸机执行极速性能</text>
    <text x="24" y="238" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">无解释器循环，指令直接打在 CPU 物理算术逻辑单元 (ALU)</text>
    <text x="24" y="256" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Latency: &lt; 2ns / op</text>
    <line x1="24" y1="268" x2="186" y2="268" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="288" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">JIT 安全加固 (Harden)：</text>
    <text x="24" y="306" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">bpf_jit_harden = 2 (代码盲化)</text>
    <text x="24" y="324" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace">防范 Spectre 侧信道探测</text>
    <text x="24" y="342" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">只读执行权限 (W^X)</text>
  </g>

  <!-- Arrow 3 (x=710..740) -->
  <text x="725" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Attach</text>
  <line x1="710" y1="230" x2="740" y2="230" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#ep-arr-accent)"/>

  <!-- Col 4: Kernel Hooks Execution (x=740..920, w=180) -->
  <g transform="translate(740, 136)">
    <rect width="180" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 4</text>
    <text x="100" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">内核 Hook 挂载</text>

    <!-- Hook Points -->
    <rect x="14" y="42" width="152" height="142" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="22" y="64" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Hook 挂载触发点</text>
    <text x="22" y="84" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">• XDP: 网卡驱动最前端</text>
    <text x="22" y="100" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">• TC: 流量控制排队层</text>
    <text x="22" y="116" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">• Kprobe: 内核任意函数</text>
    <text x="22" y="132" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">• Tracepoint: 静态观测点</text>
    <text x="22" y="148" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace">• LSM: 安全策略审计拦截</text>
    <text x="22" y="168" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">事件触发 ➔ 纳秒级拦截执行</text>

    <!-- BPF Maps Bridge -->
    <rect x="14" y="196" width="152" height="164" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
    <text x="22" y="218" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">BPF Maps 共享内存</text>
    <text x="22" y="238" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">内核与用户态数据桥梁：</text>
    <text x="22" y="256" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">• Hash Map (IP黑名单)</text>
    <text x="22" y="272" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">• Per-CPU Array (指标)</text>
    <text x="22" y="288" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">• RingBuffer (事件流)</text>
    <line x1="22" y1="300" x2="156" y2="300" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="22" y="320" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">用户态 Go / Python 控制面</text>
    <text x="22" y="338" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace">通过 epoll 零拷贝实时读写</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">用户态与 Hook 挂载层</text>
  <rect x="290" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="310" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">内核 Verifier 审查与 JIT 直译核心</text>
</svg>
