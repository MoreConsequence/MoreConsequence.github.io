<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">eBPF 虚拟机执行流水线：寄存器模型、静态验证器（Verifier）与 JIT 编译</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">C 源码 (Clang) ──► 64位字节码 ──► Verifier 静态有向无环图安全验证 ──► JIT 直译为 x86_64 裸机机器码</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 3 Stage Columns (265px each, gap 20px) -->
    <g transform="translate(20, 20)">
      <!-- Stage 1: Registers & Bytecode -->
      <g>
        <rect width="265" height="235" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect width="265" height="32" rx="6" fill="#f1f5f9"/>
        <text x="132" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">1. 虚拟机寄存器模型 (RISC)</text>

        <g transform="translate(12, 44)" font-family="ui-monospace, monospace" font-size="10">
          <rect width="241" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
          <text x="10" y="16" fill="#1e40af" font-weight="700">R0: 函数返回值 / 退出码</text>
          <text x="10" y="28" font-size="9" fill="#2563eb">R1~R5: 函数调用传参寄存器</text>

          <rect y="44" width="241" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="10" y="16" fill="#0f172a" font-weight="700">R6~R9: 被调用者保存寄存器</text>
          <text x="10" y="28" font-size="9" fill="#64748b">R10: 只读栈帧指针 (512B 栈)</text>

          <rect y="88" width="241" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="10" y="16" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" fill="#334155">指令编码格式 (64-bit)：</text>
          <text x="10" y="30" font-size="9" fill="#64748b">[ opcode:8 | dst:4 | src:4 | off:16 | imm:32 ]</text>
          <text x="10" y="42" font-size="9" fill="#64748b">1:1 精准对应现代 64 位物理 CPU 架构！</text>
        </g>
      </g>

      <!-- Stage 2: Verifier Safety Check -->
      <g transform="translate(285, 0)">
        <rect width="265" height="235" rx="6" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/>
        <rect width="265" height="32" rx="6" fill="#fee2e2"/>
        <text x="132" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. Verifier 静态安全性验证</text>

        <g transform="translate(12, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
          <rect width="241" height="36" rx="4" fill="#ffffff" stroke="#fecaca"/>
          <text x="10" y="16" fill="#991b1b" font-weight="700">DAG 控制流图遍历</text>
          <text x="10" y="28" font-size="9" fill="#7f1d1d">穷举所有分支，严防无限死循环</text>

          <rect y="44" width="241" height="36" rx="4" fill="#ffffff" stroke="#fecaca"/>
          <text x="10" y="16" fill="#991b1b" font-weight="700">内存指针越界防御</text>
          <text x="10" y="28" font-size="9" fill="#7f1d1d">严格校验 `data + len &lt; data_end`</text>

          <rect y="88" width="241" height="52" rx="4" fill="#fee2e2"/>
          <text x="10" y="16" fill="#b91c1c" font-weight="700">空指针与未初始化检测：</text>
          <text x="10" y="30" font-size="9" fill="#991b1b">• 绝不允许解引用未判空指针</text>
          <text x="10" y="42" font-size="9" font-weight="700" fill="#b91c1c">✓ 保证：无论代码如何写，绝不崩溃内核！</text>
        </g>
      </g>

      <!-- Stage 3: JIT Native Execution -->
      <g transform="translate(570, 0)">
        <rect width="270" height="235" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="270" height="32" rx="6" fill="#dcfce7"/>
        <text x="135" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. JIT 编译与裸机直接执行</text>

        <g transform="translate(12, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <rect width="246" height="42" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="10" y="16" fill="#14532d" font-weight="700">1:1 编译为原生机器码</text>
          <text x="10" y="30" font-size="9.5" fill="#15803d">零解释器开销，直译为 x86/ARM 指令</text>

          <rect y="50" width="246" height="50" rx="4" fill="#ecfdf5" stroke="#10b981"/>
          <text x="10" y="16" fill="#047857" font-weight="700">挂载至内核探针 Hook 点</text>
          <text x="10" y="30" font-size="9.5" fill="#065f46">XDP 驱动 / TC / Kprobe / Tracepoint</text>
          <text x="10" y="42" font-size="9.5" font-weight="700" fill="#047857">事件触发时以原生机器码光速执行！</text>

          <rect y="108" width="246" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="10" y="22" font-size="9.5" fill="#64748b">单次探针开销仅 ~5 纳秒！</text>
        </g>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">eBPF 革命的本质：</tspan> 它将操作系统内核从“固化的黑盒”变成了 <tspan font-weight="700" fill="#2563eb">“可安全动态编程的微型虚拟机”</tspan>；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#10b981" font-weight="700" text-anchor="middle">
        Verifier 保证安全性，JIT 保证极致裸机性能，构筑了现代云原生基础设施的终极底盘。
      </text>
    </g>
  </g>
</svg>
