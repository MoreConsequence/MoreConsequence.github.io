<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="iso-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <filter id="iso-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#iso-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="32" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">EDGE COMPUTING · V8 ISOLATE VS CONTAINER RUNTIME</text>
  <text x="40" y="52" fill="#0f172a" font-size="16" font-weight="700">边缘计算架构演进：传统容器架构 vs V8 Isolate 轻量沙箱体系对比</text>

  <!-- ================= TOP: TWO COMPONENT ARCHITECTURE CARDS (x: 40 ~ 920, w: 880) ================= -->
  
  <!-- Left Architecture: Traditional Containers (Heavy) [x: 40 ~ 460, w: 420] -->
  <g transform="translate(40, 75)" filter="url(#iso-shadow)">
    <rect width="420" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="420" height="5" rx="2" fill="#64748b"/>
    <rect x="14" y="12" width="180" height="22" rx="4" fill="#64748b"/>
    <text x="104" y="27" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">传统容器体系 (Docker / K8s)</text>

    <!-- Visual Stack -->
    <g transform="translate(14, 44)">
      <!-- Container 1 -->
      <rect x="0" y="0" width="120" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="60" y="20" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">Container #1</text>
      <rect x="8" y="28" width="104" height="20" rx="3" fill="#f1f5f9"/>
      <text x="60" y="42" fill="#475569" font-size="8.5" class="mono" text-anchor="middle">Node.js Runtime</text>
      <text x="60" y="70" fill="#dc2626" font-size="9" font-weight="700" text-anchor="middle">内存: 50MB~200MB</text>

      <!-- Container 2 -->
      <rect x="135" y="0" width="120" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="195" y="20" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">Container #2</text>
      <rect x="143" y="28" width="104" height="20" rx="3" fill="#f1f5f9"/>
      <text x="195" y="42" fill="#475569" font-size="8.5" class="mono" text-anchor="middle">Python Runtime</text>
      <text x="195" y="70" fill="#dc2626" font-size="9" font-weight="700" text-anchor="middle">内存: 80MB~300MB</text>

      <!-- Container 3 -->
      <rect x="270" y="0" width="120" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="330" y="20" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">Container #N</text>
      <rect x="278" y="28" width="104" height="20" rx="3" fill="#f1f5f9"/>
      <text x="330" y="42" fill="#475569" font-size="8.5" class="mono" text-anchor="middle">JVM Runtime</text>
      <text x="330" y="70" fill="#dc2626" font-size="9" font-weight="700" text-anchor="middle">内存: 500MB+</text>

      <!-- Host OS -->
      <rect x="0" y="95" width="390" height="26" rx="4" fill="#e2e8f0"/>
      <text x="195" y="112" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">Linux Kernel (Namespaces / Cgroups / RootFS)</text>
    </g>

    <!-- Metrics -->
    <line x1="14" y1="175" x2="406" y2="175" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="195" fill="#475569" font-size="10.5">· 冷启动时延：<tspan fill="#dc2626" font-weight="700">100 ms ~ 2000 ms (不可接受)</tspan></text>
    <text x="14" y="215" fill="#475569" font-size="10.5">· 单机并发密度：<tspan font-weight="700">仅支持 ~100 个实例</tspan></text>
  </g>

  <!-- Right Architecture: V8 Isolate Sandboxes (Ultra-Lightweight) [x: 500 ~ 920, w: 420] -->
  <g transform="translate(500, 75)" filter="url(#iso-shadow)">
    <rect width="420" height="235" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="5" rx="2" fill="#ea580c"/>
    <rect x="14" y="12" width="200" height="22" rx="4" fill="#ea580c"/>
    <text x="114" y="27" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">现代 V8 Isolate 边缘轻量沙箱</text>

    <!-- Visual Stack -->
    <g transform="translate(14, 44)">
      <!-- Single Process Container -->
      <rect x="0" y="0" width="390" height="120" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
      <text x="14" y="18" fill="#9a3412" font-size="9" font-weight="700" class="mono">SINGLE HOST PROCESS (C++ RUST ENGINE)</text>

      <!-- Isolate Grid -->
      <g transform="translate(10, 26)">
        <rect x="0" y="0" width="85" height="55" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
        <text x="42" y="20" fill="#1e40af" font-size="9" font-weight="700" text-anchor="middle">Isolate #1</text>
        <text x="42" y="36" fill="#059669" font-size="8.5" font-weight="600" text-anchor="middle">&lt; 3MB 内存</text>
        <text x="42" y="48" fill="#64748b" font-size="7.5" text-anchor="middle">0ms 冷启动</text>

        <rect x="95" y="0" width="85" height="55" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
        <text x="137" y="20" fill="#1e40af" font-size="9" font-weight="700" text-anchor="middle">Isolate #2</text>
        <text x="137" y="36" fill="#059669" font-size="8.5" font-weight="600" text-anchor="middle">&lt; 3MB 内存</text>
        <text x="137" y="48" fill="#64748b" font-size="7.5" text-anchor="middle">0ms 冷启动</text>

        <rect x="190" y="0" width="85" height="55" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
        <text x="232" y="20" fill="#1e40af" font-size="9" font-weight="700" text-anchor="middle">Isolate #3</text>
        <text x="232" y="36" fill="#059669" font-size="8.5" font-weight="600" text-anchor="middle">&lt; 3MB 内存</text>
        <text x="232" y="48" fill="#64748b" font-size="7.5" text-anchor="middle">0ms 冷启动</text>

        <rect x="285" y="0" width="85" height="55" rx="3" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
        <text x="327" y="20" fill="#ea580c" font-size="9" font-weight="700" text-anchor="middle">Isolate #10000</text>
        <text x="327" y="36" fill="#059669" font-size="8.5" font-weight="600" text-anchor="middle">海量高密隔离</text>
        <text x="327" y="48" fill="#c2410c" font-size="7.5" text-anchor="middle">共享 V8 引擎</text>
      </g>
    </g>

    <!-- Metrics -->
    <line x1="14" y1="175" x2="406" y2="175" stroke="#fed7aa" stroke-width="1"/>
    <text x="14" y="195" fill="#9a3412" font-size="10.5">· 冷启动时延：<tspan fill="#059669" font-weight="700">&lt; 5 ms (近乎即时响应)</tspan></text>
    <text x="14" y="215" fill="#9a3412" font-size="10.5">· 单机并发密度：<tspan font-weight="700" fill="#059669">单机支撑 10,000+ 个独立函数沙箱</tspan></text>
  </g>


  <!-- ================= BOTTOM: THREE COMPUTING PATTERNS (x: 40, y: 325, h: 105) ================= -->
  <g transform="translate(40, 325)">
    <rect width="880" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Pillar 1 -->
    <g transform="translate(16, 12)">
      <rect width="270" height="80" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="22" fill="#1e40af" font-size="10.5" font-weight="700">1. A/B 灰度与边缘路由重写</text>
      <text x="12" y="42" fill="#475569" font-size="9.5">解析 Cookie/Header，边缘瞬间分流；</text>
      <text x="12" y="60" fill="#475569" font-size="9.5">免去向源站发起多次重定向跳转。</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(305, 12)">
      <rect width="270" height="80" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" fill="#c2410c" font-size="10.5" font-weight="700">2. HTML 流式拼装 (HTMLRewriter)</text>
      <text x="12" y="42" fill="#9a3412" font-size="9.5">基于 TransformStream 零缓冲边拉边改；</text>
      <text x="12" y="60" fill="#9a3412" font-size="9.5">边缘微前端（Edge Micro-frontends）聚合。</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(594, 12)">
      <rect width="270" height="80" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="22" fill="#065f46" font-size="10.5" font-weight="700">3. 边缘鉴权与 JWT 即时验签</text>
      <text x="12" y="42" fill="#065f46" font-size="9.5">Web Crypto API 本地微秒级验签；</text>
      <text x="12" y="60" fill="#065f46" font-size="9.5">非法请求 100% 阻断在边缘，0 回源穿透。</text>
    </g>
  </g>
</svg>
