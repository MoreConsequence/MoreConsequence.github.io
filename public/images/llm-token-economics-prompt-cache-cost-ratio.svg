<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LLM Token 经济学：为什么同一类请求账单能相差 18.3 倍</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">全量重新计算 (天价账单) ｜ Prompt Caching 前缀缓存命中 (成本直降 90%) ｜ 静态 Prompt 前置与结构化上下文工程</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Uncached Disaster -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 错误架构：动态时间戳破坏前缀缓存</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">System Prompt 开头放入: "当前时间: 2026-08-30 16:40:12"</text>
          <text y="30" fill="#fca5a5">后面跟着 100KB 的系统知识库与工具描述定义</text>
          
          <text y="56" fill="#ef4444">🔴 致命代价：</text>
          <text y="72" fill="#fca5a5">1. 每次请求的时间戳不同，导致整个前缀哈希 100% 失效！</text>
          <text y="88" fill="#fb7185">2. 每次调用都必须全量支付 100KB Token 的高昂写入费！</text>
          <text y="104" fill="#ef4444">3. 单月账单高达 50,000 美元！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">典型反模式：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 把动态变量（UUID、当前时间、用户 ID）写在 Prompt 最前面；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 随意变动工具定义的声明顺序；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 亲手毁掉大模型厂商提供的免费缓存加速！</text>
      </g>
    </g>

    <!-- Right: Cached Golden Architecture -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 黄金架构：严格静态前置与高命中缓存</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">1. [静态区 100KB]: 固定系统设定 + 固定工具定义 (100% 命中缓存)</text>
          <text y="30" fill="#86efac">2. [动态区 1KB]: 用户提问 + 动态时间戳 (仅支付 1KB 增量费)</text>
          
          <text y="56" fill="#38bdf8">► 缓存命中 Token 享受 1 折特惠 (0.3$/M vs 3$/M)！</text>
          <text y="72" fill="#34d399">► 首字生成时延 (TTFT) 从 2.5s 骤降至 300ms！</text>
          <text y="90" fill="#4ade80">✓ 单月账单从 50,000$ 锐减到 2,730$ (省 18.3 倍！)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级 Prompt 治理军规：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">1. 静态前置原则：越稳定的内容越要往前面放；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">2. 工具声明一律按字典序严格固定序列化；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">3. 这就是现代 AI 系统工程师的核心护城河！</text>
      </g>
    </g>
  </g>
</svg>