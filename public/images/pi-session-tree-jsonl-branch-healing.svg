<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">JSONL 会话存储引擎：树状拓扑、时光倒流与崩溃自愈算法</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">不可变节点 (Parent 指针链) ──► 时光倒流回退 ──► 派生探索分支 ──► 异常掉电末尾残行自动检测与 Truncate 修复</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Parent 指针与不可变树拓扑 (Immutable Tree Model)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Node { ID: "n5", ParentID: "n4", Role: "assistant", Content: "..." } ──► 纯文本顺序追加</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">通过链表回溯算法随时重构任意历史节点到根节点的完整上下文因果链！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 时光倒流与分支派生 (Time Travel &amp; Branching)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">用户执行 /undo ──► 当前指针切回 n2 ──► 新消息以 n2 为父节点追加 n6 ──► 0 历史覆盖</text>
        <text x="15" y="62" font-size="8" fill="#047857">像 Git 分支一样自由切换探索路径，支持随时对比多个方案的修改效果！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 断电崩溃与末尾残行检测 (Crash Residual Line Detection)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">写入中途断电留下半截 JSON: {"id":"n7","content":"hello... ──► 启动扫描抛出 SyntaxError</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">检测末尾字节完整性，精准定位损坏字节偏移量 (Byte Offset)！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 物理截断自愈与状态恢复 (Atomic Truncate &amp; Self-Healing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">fs.ftruncateSync(fd, validOffset) ──► 抹除残行 ──► 重新载入有效树 ──► 0 报错丝滑启动</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">无需任何人工干预即可在极端崩溃后 100% 自动修复并接续任务！</text>
      </g>
    </g>
  </g>
</svg>