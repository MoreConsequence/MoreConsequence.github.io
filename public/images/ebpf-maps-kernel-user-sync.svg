<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="ebpf-maps-kernel-user-sync-title ebpf-maps-kernel-user-sync-desc"><title id="ebpf-maps-kernel-user-sync-title">BPF Maps 共享内存体系：Hash Map、Per-CPU 锁消除与 RingBuffer 事件流</title><desc id="ebpf-maps-kernel-user-sync-desc">架构对比图展示 BPF Maps 在内核态与用户态间的三大通信范式：通用 Hash Map、消除多核伪共享的 Per-CPU Array 以及 epoll 事件驱动的 BPF RingBuffer。</desc>
  <defs>
    <marker id="mp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="mp-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">BPF MAPS ARCHITECTURE · KERNEL-USER SHARED MEMORY</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">BPF Maps 共享内存体系：三大通信范式</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">内核 eBPF 与用户态 Go / C 之间零拷贝、无锁共享内存通信：通用 Hash、Per-CPU 锁消除与 RingBuffer 事件流</text>

  <!-- 3 Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Hash Map (x=40..310, w=270) -->
  <g transform="translate(40, 136)">
    <rect width="270" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#2d3142" stroke-width="1"/>
    <text x="52" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TYPE 1</text>
    <text x="100" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">BPF_MAP_TYPE_HASH</text>

    <!-- Schema -->
    <rect x="14" y="42" width="242" height="74" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="64" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">通用 Key-Value 哈希表</text>
    <text x="24" y="84" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Key: IP (32b) ➔ Val: Rule (64b)</text>
    <text x="24" y="100" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">支持内核/用户态双向原子查改</text>

    <!-- Use Cases -->
    <rect x="14" y="126" width="242" height="120" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">经典应用场景</text>
    <text x="24" y="168" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 动态 IP 黑名单 / 白名单过滤</text>
    <text x="24" y="186" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• TCP 四元组连接跟踪表 (Conntrack)</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 路由转发 FIB 表映射</text>
    <text x="24" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Lookup: bpf_map_lookup_elem()</text>

    <!-- Tradeoffs -->
    <rect x="14" y="256" width="242" height="104" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="278" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">性能权衡 (Tradeoff)</text>
    <text x="24" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">并发多核写入时存在 Bucket 自旋锁争用；高频计数不推荐使用。</text>
    <text x="24" y="322" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Lock Contention on Update</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Max Entries: 65536+</text>
  </g>

  <!-- Col 2: Per-CPU Array (x=340..620, w=280) - Focal -->
  <g transform="translate(340, 136)">
    <rect width="280" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="14" y="12" width="96" height="18" rx="2" fill="none" stroke="#eb6c36" stroke-width="1"/>
    <text x="62" y="25" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TYPE 2 (HOT)</text>
    <text x="120" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">PERCPU_ARRAY (锁消除)</text>

    <!-- Per-CPU Memory Strip -->
    <rect x="14" y="42" width="252" height="142" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
    <text x="24" y="64" fill="#eb6c36" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">各 CPU 独占物理内存数组</text>

    <!-- 4 CPU slices -->
    <rect x="24" y="74" width="232" height="22" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="32" y="89" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">CPU 0 Mem: [Cnt: 10420] ➔ 0 跨核开销</text>

    <rect x="24" y="100" width="232" height="22" rx="2" fill="rgba(235,108,54,0.1)" stroke="#eb6c36" stroke-width="1"/>
    <text x="32" y="115" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">CPU 1 Mem: [Cnt: 98402] ➔ 0 跨核开销</text>

    <rect x="24" y="126" width="232" height="22" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="32" y="141" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">CPU 2 Mem: [Cnt: 42100] ➔ 0 跨核开销</text>

    <text x="24" y="170" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">彻底消灭 CPU 缓存行伪共享 (False Sharing)!</text>

    <!-- Super Performance -->
    <rect x="14" y="196" width="252" height="164" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="218" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">高频指标极致性能</text>
    <text x="24" y="238" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">内核态 `*val += 1` 仅修改本地 L1 Cache，无需原子指令 `lock add`</text>
    <text x="24" y="256" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">QPS: 10,000,000+ / core</text>
    <line x1="24" y1="268" x2="256" y2="268" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
    <text x="24" y="288" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">用户态汇总聚合：</text>
    <text x="24" y="306" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">Go 应用一次性读取全核数值，在用户态 Sum 求和，零内核锁干扰。</text>
    <text x="24" y="328" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">适用于 Prometheus 监控指标打点</text>
    <text x="24" y="346" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">bpf_map_lookup_elem(percpu)</text>
  </g>

  <!-- Col 3: RingBuffer (x=650..920, w=270) -->
  <g transform="translate(650, 136)">
    <rect width="270" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#2d3142" stroke-width="1"/>
    <text x="52" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TYPE 3</text>
    <text x="100" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">BPF_MAP_TYPE_RINGBUF</text>

    <!-- RingBuffer Concept -->
    <rect x="14" y="42" width="242" height="84" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
    <text x="24" y="64" fill="#eb6c36" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">现代事件流推送神器</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">Linux 5.8+ 全局共享环形队列</text>
    <text x="24" y="100" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">全面替代旧 Perf Event Array</text>
    <text x="24" y="116" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">Memory Waste Reduced by 80%</text>

    <!-- Strengths -->
    <rect x="14" y="136" width="242" height="120" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="158" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">四大压倒性优势</text>
    <text x="24" y="178" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 变长记录 (Variable-Length Data)</text>
    <text x="24" y="196" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">2. 内核 Reserve ➔ Submit 零拷贝</text>
    <text x="24" y="214" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">3. 用户态 epoll 事件驱动唤醒</text>
    <text x="24" y="232" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">4. 多核心全局顺序定序</text>
    <text x="24" y="246" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ring_buffer__poll()</text>

    <!-- Use cases -->
    <rect x="14" y="266" width="242" height="94" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="288" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">适用场景</text>
    <text x="24" y="308" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">安全审计 (Falco)、系统调用 Trace、网络丢包原因实时捕获投递。</text>
    <text x="24" y="332" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Event-driven Stream Pipeline</text>
    <text x="24" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Zero Polling Waste</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">常规键值存储与事件流</text>
  <rect x="290" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="310" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Per-CPU Array 锁消除极致性能</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
