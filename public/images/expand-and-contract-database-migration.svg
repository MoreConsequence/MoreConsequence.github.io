<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="expand-and-contract-database-migration-title expand-and-contract-database-migration-desc"><title id="expand-and-contract-database-migration-title">数据库无停机迁移法：扩展与收缩 (Expand and Contract / Parallel Run) 阶段演进</title><desc id="expand-and-contract-database-migration-desc">数据库无停机迁移法：扩展与收缩 (Expand and Contract / Parallel Run) 阶段演进</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">数据库 0 停机迁移：扩展与收缩模式 (Expand and Contract Pattern)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">直接重命名列 (新旧版本代码读写必崩溃) vs 1. 扩展新列 ──► 2. 应用层双写与历史数据回填 ──► 3. 读切流至新列 ──► 4. 收缩删除旧列 (0 停机平滑演进)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 阶段 1: 扩展阶段 (Expand: ADD COLUMN phone_v2 NULL)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">向数据库新增可空新列 phone_v2 ──► 此时老版本代码继续使用 phone_v1 ──► 0 任何业务影响</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">无感扩建新数据通道！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 阶段 2: 应用层双写与历史数据刷洗 (Dual-Write &amp; Backfill)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">发布新版代码同时写入 v1 和 v2 ──► 启动后台任务逐批次将数亿历史数据转换为 v2 格式回填</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">平稳迁移海量存量数据！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 阶段 3: 读切流与完全依赖新列 (Read Switch to phone_v2)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">再次发布代码将所有读写逻辑完全切换至 phone_v2 ──► 彻底停止使用旧列 phone_v1</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">业务逻辑完全完成版本跨越！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 阶段 4: 收缩与旧列物理清理 (Contract: DROP COLUMN phone_v1)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">确认老系统已 100% 退役 ──► 执行 DDL 清理删除废弃旧列 ──► 完美达成 0 停机、0 报错重构演进！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">大型数据库架构重构的标准最高范式！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
