<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">数据库 0 停机迁移：扩展与收缩模式 (Expand and Contract Pattern)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">直接重命名列 (新旧版本代码读写必崩溃) vs 1. 扩展新列 ──► 2. 应用层双写与历史数据回填 ──► 3. 读切流至新列 ──► 4. 收缩删除旧列 (0 停机平滑演进)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 阶段 1: 扩展阶段 (Expand: ADD COLUMN phone_v2 NULL)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">向数据库新增可空新列 phone_v2 ──► 此时老版本代码继续使用 phone_v1 ──► 0 任何业务影响</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">无感扩建新数据通道！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 阶段 2: 应用层双写与历史数据刷洗 (Dual-Write &amp; Backfill)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">发布新版代码同时写入 v1 和 v2 ──► 启动后台任务逐批次将数亿历史数据转换为 v2 格式回填</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">平稳迁移海量存量数据！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 阶段 3: 读切流与完全依赖新列 (Read Switch to phone_v2)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">再次发布代码将所有读写逻辑完全切换至 phone_v2 ──► 彻底停止使用旧列 phone_v1</text>
        <text x="15" y="62" font-size="8" fill="#047857">业务逻辑完全完成版本跨越！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 阶段 4: 收缩与旧列物理清理 (Contract: DROP COLUMN phone_v1)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">确认老系统已 100% 退役 ──► 执行 DDL 清理删除废弃旧列 ──► 完美达成 0 停机、0 报错重构演进！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">大型数据库架构重构的标准最高范式！</text>
      </g>
    </g>
  </g>
</svg>