<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">PostgreSQL 表膨胀 (Table Bloat) 与死亡元组产生机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">PG 采用 Append-Only 堆表模型 ｜ UPDATE 实际执行 INSERT 新版本 + 标记旧版本为 Dead Tuple ｜ 引发存储空间膨胀 300%</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 初始插入阶段 (INSERT: Live Tuple #1 Created)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Header: xmin=100, xmax=0 ──► 数据存储在 Page 0 的 Line Pointer 1 ──► 属于活跃活元组</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">正常数据占据 8KB 物理页面的有效空间！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 更新产生死亡旧版本 (UPDATE: Old Tuple Dies, New Tuple Born)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">旧 Tuple #1 标记 xmax=101 (死亡) ──► 在页面尾部插入全新 Tuple #2 (xmin=101, xmax=0)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">旧记录并未被物理抹除，依然赖在磁盘页面中占据物理字节！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 恶性膨胀与查询性能衰退 (Severe Table Bloat)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">连续更新 100 万次 ──► 产生 100 万个 Dead Tuples ──► 8KB 页被垃圾填满，表体积膨胀至 10GB！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">全表扫描必须忍受大量无用 I/O 读取死元组，查询延迟暴增 10 倍！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 拯救者：Autovacuum 内存垃圾回收 (Autovacuum Reclamation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">后台清理 dead tuples ──► 更新 Free Space Map (FSM) ──► 空间可被后续新 INSERT 循环复用！</text>
        <text x="15" y="62" font-size="8" fill="#047857">维持 PostgreSQL 长期健康运行的核心守护进程！</text>
      </g>
    </g>
  </g>
</svg>