<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="z-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="440" rx="12" fill="#fafbff" stroke="#d7def0"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">数据从磁盘到网卡:三种路径,搬运次数对比</text>

  <text x="180" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">传统 read + write</text>
  <text x="490" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">sendfile</text>
  <text x="800" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">sendmsg + MSG_ZEROCOPY</text>

  <g font-size="12">
    <rect x="60" y="80" width="130" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="125" y="100" text-anchor="middle" fill="#3730a3">磁盘</text>
    <rect x="60" y="140" width="130" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="125" y="160" text-anchor="middle" fill="#334155">页缓存</text>
    <rect x="60" y="200" width="130" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="125" y="220" text-anchor="middle" fill="#334155">用户缓冲区</text>
    <rect x="60" y="260" width="130" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="125" y="280" text-anchor="middle" fill="#334155">socket 缓冲区</text>
    <rect x="60" y="320" width="130" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="125" y="340" text-anchor="middle" fill="#3730a3">网卡</text>

    <rect x="310" y="80" width="130" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="375" y="100" text-anchor="middle" fill="#3730a3">磁盘</text>
    <rect x="310" y="140" width="130" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="375" y="160" text-anchor="middle" fill="#334155">页缓存</text>
    <rect x="310" y="320" width="130" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="375" y="340" text-anchor="middle" fill="#3730a3">网卡</text>

    <rect x="620" y="80" width="130" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="685" y="100" text-anchor="middle" fill="#3730a3">磁盘</text>
    <rect x="620" y="200" width="130" height="30" rx="6" fill="#fefce8" stroke="#facc15"/>
    <text x="685" y="220" text-anchor="middle" fill="#854d0e">用户缓冲区（pin 住）</text>
    <rect x="620" y="320" width="130" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="685" y="340" text-anchor="middle" fill="#3730a3">网卡</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#z-arrow)">
    <path d="M 125 110 L 125 138"/>
    <path d="M 125 170 L 125 198"/>
    <path d="M 125 230 L 125 258"/>
    <path d="M 125 290 L 125 318"/>
    <path d="M 375 110 L 375 138"/>
    <path d="M 375 170 L 340 300"/>
    <path d="M 685 110 L 685 198"/>
    <path d="M 685 230 L 685 318"/>
  </g>

  <g font-size="11" fill="#64748b">
    <text x="135" y="126">DMA ①</text>
    <text x="135" y="186">CPU ②</text>
    <text x="135" y="246">CPU ③</text>
    <text x="135" y="306">DMA ④</text>
    <text x="385" y="126">DMA ①</text>
    <text x="353" y="290">DMA ②（scatter-gather）</text>
    <text x="695" y="126">DMA ①</text>
    <text x="695" y="316">DMA ②（pin 后直达）</text>
  </g>

  <rect x="60" y="366" width="280" height="30" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="200" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">4 次拷贝（2 CPU + 2 DMA）· 2 syscall</text>
  <rect x="310" y="366" width="280" height="30" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="450" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">2 次拷贝（0 CPU，全 DMA）· 1 syscall</text>
  <rect x="620" y="366" width="280" height="30" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="760" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">2 次拷贝（0 CPU）· 提交开销前置</text>

  <rect x="60" y="406" width="840" height="26" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="480" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">省钱的是 CPU 拷贝与 syscall，不是 DMA——数据终究要过网卡；先量瓶颈在哪一步再选路径</text>
</svg>
