<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="raft-consensus-term-log-replication-state-machine-title raft-consensus-term-log-replication-state-machine-desc"><title id="raft-consensus-term-log-replication-state-machine-title">Raft 共识机制全景：Leader 选举任期 (Term)、多数派日志复制与状态机应用 (Commit/Apply)</title><desc id="raft-consensus-term-log-replication-state-machine-desc">Raft 共识机制全景：Leader 选举任期 (Term)、多数派日志复制与状态机应用 (Commit/Apply)</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Raft 共识算法物理机制：任期递增、多数派日志复制与状态机提交</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Leader 接收写请求 ──► AppendEntries RPC 广播 ──► 超过半数 (Quorum) 落盘 ──► 更新 commitIndex ──► Apply 状态机生效并返回客户端</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. Leader 接收客户端写请求与本地日志追加 (Local Uncommitted Log)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Client.Set("k", "v") ──► Leader 追加 LogEntry { Term: 2, Index: 105, Command: Set("k", "v") }</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">此时该条日志处于 Uncommitted 未提交状态，禁止对外返回成功或应用到业务状态机！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. AppendEntries RPC 并行向 Follower 广播日志复制</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Leader ──► Follower 1 (ACK Ok), Follower 2 (ACK Ok), Follower 3 (超时丢包)</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">Follower 校验 prevLogTerm 与 prevLogIndex 一致性，一致则追加至本地 WAL 并返回成功！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. 多数派法定票数达成 (Quorum 达到 3/5) 与 commitIndex 推进</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Leader 收到 2 个 Follower 成功响应 (加自身共 3 票 &gt; 5/2) ──► commitIndex 推进至 105！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">Raft 强一致性定理保证：一旦某条日志在当前 Term 被多数派提交，未来任何 Leader 必包含该日志！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. Apply 状态机生效与向客户端响应成功 (Linearizable Commit)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">applyChan &lt;- LogEntry ──► 业务 StateMachine 执行 Set("k", "v") ──► 向 Client 返回成功！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">在下一次心跳 RPC 中将 commitIndex 广播给所有 Follower，驱动整个分布式集群状态机完全对齐！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
