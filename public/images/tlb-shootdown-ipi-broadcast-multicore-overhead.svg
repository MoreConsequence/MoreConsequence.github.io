<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">多核 TLB Shootdown 广播风暴：munmap 触发核间中断 (IPI) 停顿</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">某核心修改页表权限 ──► 必须通过 IPI 广播强制暂停其他 127 个 CPU 核心刷新 TLB ──► HugePages 将条目数压缩 512 倍平息风暴</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: TLB Shootdown Storm -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 4KB 小页与频繁内存释放：IPI 风暴</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// CPU 0 执行 munmap 释放 1GB 内存 (262,144 个 4KB 页)</text>
          <text y="28" fill="#fca5a5">1. CPU 0 无法直接修改其他核心的私有硬件 TLB 快表</text>
          <text y="44" fill="#ef4444">2. 必须向其他 127 个 CPU 发送 IPI 核间硬件中断！</text>
          <text y="60" fill="#ef4444">3. 全部 127 个 CPU 被迫暂停当前业务计算进入中断处理！</text>
          
          <text y="88" fill="#ef4444">🔴 恶果：在 128 核大机上产生长达 15% 的纯 CPU 停顿损耗！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 高并发多线程应用性能随核数增加发生负增长；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• P99 延迟出现数十毫秒级未知毛刺；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 现代高密度服务器必须治理！</text>
      </g>
    </g>

    <!-- Right: HugePages Mitigation -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 2MB 静态大页 (HugePages)：降维打击</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 采用 2MB 静态大页覆盖 1GB 内存</text>
          <text y="28" fill="#86efac">1. 页表条目数从 262,144 锐减至仅仅 512 个！</text>
          <text y="44" fill="#38bdf8">2. CPU 硬件 TLB 命中率直接飙升至 99.9%！</text>
          <text y="60" fill="#34d399">3. TLB Shootdown 刷新次数直接暴跌 512 倍！</text>
          
          <text y="88" fill="#4ade80">✓ IPI 广播停顿开销彻底归零！</text>
          <text y="104" fill="#4ade80">✓ 数据库与高并发服务端 QPS 提升 20%~35%！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• DPDK / Redis / PostgreSQL 生产环境必备参数；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底消灭多核扩展性瓶颈；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 榨干现代服务器硬件极限潜能！</text>
      </g>
    </g>
  </g>
</svg>