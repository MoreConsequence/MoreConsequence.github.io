<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">工业级 Agent 引擎四层模块化分层架构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 协议与适配接入层 (Protocol Layer) ──► 2. 状态机调度内核 (Core Loop Layer) ──► 3. 记忆与上下文管理层 (Memory Layer) ──► 4. 工具与沙箱驱动层 (Driver Layer)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 协议与接入层 (Protocol &amp; Transport Layer: MCP / SSE / WebSocket / CLI)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">支持外部 IDE、Web 前端、移动端或 MCP 客户端接入 ──► 统一输入输出事件流归一化 (Event Normalization)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">跨宿主多端无缝接入的标准化入口！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 状态机调度内核层 (Core Execution Loop: ReAct / Turn-Step FSM)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">驱动 Thought-Action-Observation 自主闭环 ──► 控制步骤上限、并发派发与错误自愈重试机制</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">Agent 决策与自主行动的中枢发动机！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 记忆与上下文治理层 (Memory &amp; Context Pipeline: Sliding Window &amp; Vector Store)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">管理短期工作记忆与长期持久化记忆 ──► 执行递归摘要压缩与 Prompt Caching 前缀对齐优化</text>
        <text x="15" y="62" font-size="8" fill="#047857">突破大模型窗口瓶颈并严控推理成本！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 沙箱与能力驱动层 (Sandbox &amp; Tool Driver: Docker / Bubblewrap / WASM)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">安全隔离执行 Bash 脚本、文件系统编辑与外部 API 调用 ──► 捕获物理系统 stdout/stderr 铁证！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">连接虚拟大模型与真实数字系统的最坚固桥梁！</text>
      </g>
    </g>
  </g>
</svg>