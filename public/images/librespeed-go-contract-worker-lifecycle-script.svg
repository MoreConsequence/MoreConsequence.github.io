<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LibreSpeed 测速合同：Worker 状态机与客户端主权计量</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">INIT (0) ──► IP/PING (1) ──► DOWNLOAD (2) ──► UPLOAD (3) ──► TELEMETRY (4) ──► DONE (5)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Worker State Machine -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Web Worker 独立线程状态流转</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="16" fill="#38bdf8">// speedtest_worker.js 独立线程</text>
          <text x="10" y="30" fill="#93c5fd">1. state=1: GET /getIP.php &amp; 并发 10 次 /empty.php 测 RTT</text>
          <text x="10" y="46" fill="#4ade80">2. state=2: 开 4 路 XHR 并发 GET /garbage.php 灌水 15 秒</text>
          <text x="10" y="62" fill="#fb923c">3. state=3: 开 4 路 XHR 并发 POST /empty.php 推流 15 秒</text>
          <text x="10" y="78" fill="#d8b4fe">4. state=4: POST /results/ 上报最终聚合度量数据</text>
          
          <text x="10" y="104" fill="#34d399">✓ 每 200ms 向 UI 主线程 postMessage 刷新仪表盘实时速率！</text>
          <text x="10" y="120" fill="#38bdf8">✓ 测速与 UI 渲染完全隔离，零掉帧卡顿！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">多连接并发设计：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 默认 4 个并发 HTTP 管道，快速填满 BDP 带宽时延积；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 避免单 TCP 连接慢启动阶段过长导致的测速失真；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 智能自适应动态调节并发连接数！</text>
      </g>
    </g>

    <!-- Right: Client Sovereignty -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 不对称计量权：客户端权威度量</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="16" fill="#4ade80">// 客户端自主统计算法</text>
          <text x="10" y="30" fill="#86efac">speed = (loadedBytes * 8) / (durationSec * 1024 * 1024) [Mbps]</text>
          
          <text x="10" y="54" fill="#38bdf8">🔴 为什么服务端不能代替客户端计算？</text>
          <text x="10" y="70" fill="#cbd5e1">1. 服务端无法感知客户端 TCP 接收窗口与渲染排队</text>
          <text x="10" y="86" fill="#cbd5e1">2. 服务端发送完成 != 客户端完整接收确认</text>
          <text x="10" y="102" fill="#34d399">3. 客户端体验到的真实吞吐才是唯一真实指标！</text>
          <text x="10" y="122" fill="#4ade80">✓ 服务端退化为纯粹的哑流量发生器与黑洞！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 服务端无需维护复杂的单连接计时与统计状态；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 极大节省服务端 CPU 与内存消耗；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 支撑极小节点支撑数十万用户同时在线测速！</text>
      </g>
    </g>
  </g>
</svg>