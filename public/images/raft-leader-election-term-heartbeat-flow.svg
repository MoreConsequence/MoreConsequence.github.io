<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="raft-leader-election-term-heartbeat-flow-title raft-leader-election-term-heartbeat-flow-desc"><title id="raft-leader-election-term-heartbeat-flow-title">Raft 节点状态机与 Leader 选举流转：Follower -&gt; Candidate -&gt; Leader 投票机制</title><desc id="raft-leader-election-term-heartbeat-flow-desc">Raft 节点状态机与 Leader 选举流转：Follower -&gt; Candidate -&gt; Leader 投票机制</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Raft 共识算法状态机与任期 (Term) 选举拓扑</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Follower ──(超时 150~300ms)──► Candidate（Term+1 拉票）──(N/2+1 票)──► Leader</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Follower (追随者状态)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">初始默认状态：</text>

          <text x="10" y="38" fill="#f5f5f5">• 保持沉默，响应来自 Leader 的心跳</text>
          <text x="10" y="54" fill="#cbd5e1">• 重置随机选举定时器 (150ms ~ 300ms)</text>
          <text x="10" y="70" fill="#f5f5f5">• 若心跳超时未收到 ──► 变身为 Candidate！</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 集群常规稳定基态！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 随机超时时间有效打散并发竞选冲突；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 严格服从合法 Leader 的指令；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 共识系统的基石。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">2. Candidate (候选人状态)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">自增任期: currentTerm += 1</text>

          <text x="10" y="38" fill="#f5f5f5">竞选投票流程：</text>
          <text x="10" y="54" fill="#f5f5f5">• 投自己一票，向所有节点广播 RequestVote</text>
          <text x="10" y="70" fill="#f5f5f5">• 收到多数派同意票 (Quorum &gt; N/2) ──► 晋升 Leader！</text>
          <text x="10" y="86" fill="#f5f5f5">• 收到新合法 Leader 心跳 ──► 自动退回 Follower</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 民主多数派决议机制！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 每个节点单任期内最多投一票 (先到先得)；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 候选人日志必须至少与选民一样新；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 确保数据不丢。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. Leader (领袖主节点)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">集群唯一写入口：</text>

          <text x="10" y="38" fill="#f5f5f5">• 周期性广播 AppendEntries 空心跳维持统治</text>
          <text x="10" y="54" fill="#f5f5f5">• 接收客户端写请求，分发日志条目</text>
          <text x="10" y="70" fill="#f5f5f5">• 多数派落盘后推进 commitIndex 并应用状态机！</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 强一致性中央指令中枢！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 易理解性与严谨数学证明的完美结合；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• etcd, TiKV, CockroachDB 核心动力；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代分布式系统的黄金皇冠！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
