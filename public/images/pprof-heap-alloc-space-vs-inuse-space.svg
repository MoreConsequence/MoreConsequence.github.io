<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go pprof 堆内存四大采样模式与诊断坐标 (Heap Profile Types)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">inuse_space (当前未释放内存，排查内存泄漏) ｜ alloc_space (历史累计分配量，排查 GC 频繁元凶) ｜ inuse_objects ｜ alloc_objects</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fef2f2"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. inuse_space (泄漏侦测)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#f87171">当前存活对象体积：</text>
          
          <text x="8" y="38" fill="#cbd5e1">• 度量当前时刻仍被根引用的堆内存字节大小</text>
          <text x="8" y="62" fill="#ef4444">• 若单调递增不回落</text>
          <text x="8" y="86" fill="#f87171">• 100% 存在内存泄漏！</text>
          
          <text x="8" y="116" fill="#ef4444">🔴 核心排障指标</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#991b1b">典型问题：</text>
        <text x="8" y="34" font-size="7.5" fill="#7f1d1d">• 全局 Map 未清理；</text>
        <text x="8" y="48" font-size="7.5" fill="#7f1d1d">• Goroutine 挂起持有大对象；</text>
        <text x="8" y="62" font-size="7.5" fill="#dc2626">• 定位内存不释放根因。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. alloc_space (GC 优化)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">历史累计分配总量：</text>
          
          <text x="8" y="38" fill="#fed7aa">• 从启动至今累计向堆申请的总字节（含已回收）</text>
          <text x="8" y="62" fill="#34d399">• 寻找短命垃圾对象制造源头</text>
          <text x="8" y="86" fill="#4ade80">• 解决 GC 频繁 STW 痛点！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">优化手段：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• sync.Pool 对象复用；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 消除不必要的闭包逃逸；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 降低 CPU 垃圾回收占比。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">3. inuse_objects (对象数)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">当前存活对象个数：</text>
          
          <text x="8" y="38" fill="#86efac">• 关注对象数量而非总字节</text>
          <text x="8" y="62" fill="#34d399">• 几千万个微小对象（如链表小节点）</text>
          <text x="8" y="86" fill="#38bdf8">• 会导致 GC 三色标记扫描极慢！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">诊断价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 发现指针爆炸问题；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 改用扁平连续数组优化；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 大幅提速 GC 标记。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">4. alloc_objects (高频分配)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">历史累计分配次数：</text>
          
          <text x="8" y="38" fill="#86efac">• 追踪 mallocgc 调用频率</text>
          <text x="8" y="62" fill="#38bdf8">• 发现字符串频繁拼接与临时切片</text>
          <text x="8" y="86" fill="#4ade80">• 指导字节级无分配优化！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 辅助 benchmark 进行 allocs/op 调优；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 全链路内存效率终审视界；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造 0 拷贝极速服务！</text>
      </g>
    </g>
  </g>
</svg>