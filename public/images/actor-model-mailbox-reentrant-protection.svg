<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">TypeScript 异步重入竞态防御：Actor Mailbox 串行化消费队列</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">多异步 Promise 并发交错修改共享状态 (产生脏读脏写) vs 邮箱队列 FIFO 串行化执行 (单写者原则 0 竞态锁)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Reentrant Bug -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 异步重入竞态：并发修改内存状态破产</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 虽然 JS 是单线程，但 await 间隙会交错执行！</text>
          <text y="30" fill="#fca5a5">Task 1: 读取 this.balance (100) ──► await db.query()</text>
          <text y="48" fill="#ef4444">Task 2: 在 await 间隙插队: this.balance = 50;</text>
          <text y="66" fill="#ef4444">Task 1 苏醒: 基于旧值 100 计算: this.balance = 100 - 20 = 80;</text>
          
          <text y="92" fill="#ef4444">🔴 致命惨案：Task 2 的扣款 50 被 Task 1 永久覆盖抹除！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Go 开发者误区：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 以为 JS 没有多线程共享内存就没有竞态并发 Bug；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 异步重入是 Node.js 后端最高频的数据破坏源头；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须对临界区进行排队！</text>
      </g>
    </g>

    <!-- Right: Actor Mailbox -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Actor Mailbox 模式：串行异步消息管道</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 所有修改操作推入当前 Actor 内部邮箱</text>
          <text y="28" fill="#86efac">actor.enqueue(async () =&gt; { ... });</text>
          
          <text y="50" fill="#38bdf8">1. 链式 Promise 队列: queue = queue.then(task)</text>
          <text y="66" fill="#34d399">2. 前一个 Task 包含全部 await 完全结束后才启下一个</text>
          <text y="82" fill="#34d399">3. 内存状态严格单写者保护，0 并发冲突！</text>
          
          <text y="108" fill="#4ade80">✓ 兼具单线程轻量高效与多任务严格数据安全！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 相当于 Go 的 channel + 单 goroutine worker 模式；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底消除异步竞态条件；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造金融级严谨的 TypeScript 业务内核！</text>
      </g>
    </g>
  </g>
</svg>