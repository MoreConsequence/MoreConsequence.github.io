<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">生产环境 Goroutine 泄漏三大典型根因拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 无缓冲 Channel 发送无人接收 ｜ 2. 互斥锁 / 条件变量死锁挂起 ｜ 3. HTTP / RPC 外部调用未设超时永久阻塞</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. Channel 发送端永久阻塞</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">ch := make(chan int) // 无缓冲！</text>
          <text x="10" y="34" fill="#fca5a5">go func() { ch &lt;- doQuery() }()</text>
          
          <text x="10" y="56" fill="#ef4444">主协程超时提前 return：</text>
          <text x="10" y="72" fill="#ef4444">• 子协程永远卡死在 ch &lt;- res</text>
          <text x="10" y="88" fill="#ef4444">• 每次请求永久泄漏 1 个 Goroutine！</text>
          
          <text x="10" y="116" fill="#f87171">🔴 泄漏率排名第一的杀手！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">解法：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 使用带容量切片: make(chan int, 1)；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 确保发送端即使无人读也能正常返回；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 彻底消除悬挂。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 同步锁死锁与条件等待</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">sync.WaitGroup / Mutex 异常：</text>
          
          <text x="10" y="38" fill="#fed7aa">• wg.Add(1) 后子协程 panic 提前退出</text>
          <text x="10" y="58" fill="#ef4444">• 未执行 wg.Done()</text>
          <text x="10" y="78" fill="#ef4444">• 主协程 wg.Wait() 陷入永久沉睡！</text>
          
          <text x="10" y="112" fill="#fb923c">⚠️ 协程陷入 _Gwaiting 无法自愈！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">解法：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 严格使用 defer wg.Done() 与 defer mu.Unlock()；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 杜绝异常分支导致锁遗留；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 严谨并发控制。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 外部网络 I/O 缺超时</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">http.Get("http://slow-api.com")</text>
          
          <text x="10" y="38" fill="#86efac">默认客户端缺陷：</text>
          <text x="10" y="54" fill="#ef4444">• http.DefaultClient 默认 Timeout=0 (无限期！)</text>
          <text x="10" y="74" fill="#ef4444">• 遇到网络断网或对端卡死，连接永远挂在 netpoll</text>
          
          <text x="10" y="108" fill="#4ade80">✓ 必须显式设置 Timeout 与 Context！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">解法：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 强制配置 http.Client{Timeout: 5*time.Second}；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 配合 context.WithTimeout 严格约束全链路；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化微服务韧性基石！</text>
      </g>
    </g>
  </g>
</svg>