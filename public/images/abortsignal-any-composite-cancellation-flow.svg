<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="abortsignal-any-composite-cancellation-flow-title abortsignal-any-composite-cancellation-flow-desc"><title id="abortsignal-any-composite-cancellation-flow-title">复合取消模式：AbortSignal.any() 多源合并 vs context.WithCancelCause…</title><desc id="abortsignal-any-composite-cancellation-flow-desc">复合取消模式：AbortSignal.any() 多源合并 vs context.WithCancelCause 错误溯源</desc><defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">多源取消信号聚合架构：AbortSignal.any 与 WithCancelCause</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">用户点击取消 ｜ 服务端 5s 硬超时 ｜ 路由切换 ──► 复合聚合为单一 Signal ──► 只要任一触发立即精准熔断并保留原始原因 (Cause)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 多源取消条件汇聚 (Multiple Inbound Cancellation Signals)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">来源 A: 用户在 UI 点击 Stop ｜ 来源 B: AbortSignal.timeout(5000) ｜ 来源 C: 前序任务报错</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">涵盖超时、人工打断与前置依赖失败！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 复合信号原子合并 (AbortSignal.any([userSig, timeoutSig]))</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">ES2024 / Node.js 20+ 原生支持 ──► 内部维护统一的事件监听 ──► 任一信号率先 abort 立即触发复合信号</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">消除传统手工 addEventListener 多次绑定的内存泄漏隐患！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 深入底层 I/O 与传输层熔断 (Underlying Socket &amp; Resource Teardown)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">向 fetch / ReadableStream 下发 abort ──► 浏览器立即向服务端发送 TCP RST / HTTP2 RST_STREAM</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">即刻切断下游数据流，绝不多跑一个字节！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 根因精确溯源 (Accurate Reason &amp; Cause Extraction)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">signal.reason / context.Cause(ctx) ──► 明确判定是 TimeoutError 还是 UserCancel ──► 针对性呈现 UI 友好提示！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">现代跨语言取消架构的最高艺术！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
