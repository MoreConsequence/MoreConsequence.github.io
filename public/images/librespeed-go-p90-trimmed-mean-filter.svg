<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p90-title p90-desc">
      <title id="p90-title">P90 与截尾均值：两个不同的统计算子</title>
      <desc id="p90-desc">Line and formula diagram separating a percentile from a trimmed mean, then comparing both definitions with the cumulative speed path found in the referenced worker source.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="p90-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <text x="40" y="32" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-weight="500" letter-spacing="0.18em">LINE · STATISTIC · EVIDENCE BOUNDARY</text>
      <text x="40" y="68" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400">P90 与截尾均值：两个不同的统计算子</text>
      <text x="40" y="96" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">示意样本只说明统计读法；源码实际路径单独标出，避免把概念写成实现</text>

      <!-- Line chart: deliberately qualitative; the points are not an evidence sample. -->
      <rect x="40" y="124" width="880" height="204" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="64" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" letter-spacing="0.12em">ILLUSTRATIVE SAMPLE ORDER · NOT A MEASUREMENT RESULT</text>
      <text x="64" y="176" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">示意速率</text>

      <line x1="96" y1="188" x2="864" y2="188" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="96" y1="220" x2="864" y2="220" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="96" y1="252" x2="864" y2="252" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="96" y1="284" x2="864" y2="284" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="96" y1="312" x2="864" y2="312" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <polyline points="112,276 216,236 320,252 424,204 528,244 632,188 736,268 840,220" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="112" cy="276" r="4" fill="#4f5d75"/>
      <circle cx="216" cy="236" r="4" fill="#4f5d75"/>
      <circle cx="320" cy="252" r="4" fill="#4f5d75"/>
      <circle cx="424" cy="204" r="4" fill="#4f5d75"/>
      <circle cx="528" cy="244" r="4" fill="#4f5d75"/>
      <circle cx="632" cy="188" r="4" fill="#4f5d75"/>
      <circle cx="736" cy="268" r="4" fill="#4f5d75"/>
      <circle cx="840" cy="220" r="4" fill="#4f5d75"/>

      <text x="112" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S1</text>
      <text x="216" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S2</text>
      <text x="320" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S3</text>
      <text x="424" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S4</text>
      <text x="528" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S5</text>
      <text x="632" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S6</text>
      <text x="736" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S7</text>
      <text x="840" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S8</text>

      <!-- Sorting is a conceptual operation, not a claim about the worker. -->
      <rect x="40" y="348" width="880" height="68" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="64" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SORTED ORDER · S_(1) ≤ ⋯ ≤ S_(n)</text>
      <line x1="220" y1="396" x2="780" y2="396" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <circle cx="220" cy="396" r="4" fill="#4f5d75"/>
      <circle cx="300" cy="396" r="4" fill="#4f5d75"/>
      <circle cx="380" cy="396" r="4" fill="#4f5d75"/>
      <circle cx="460" cy="396" r="4" fill="#4f5d75"/>
      <circle cx="540" cy="396" r="4" fill="#4f5d75"/>
      <circle cx="620" cy="396" r="4" fill="#4f5d75"/>
      <circle cx="700" cy="396" r="4" fill="#4f5d75"/>
      <circle cx="780" cy="396" r="4" fill="#4f5d75"/>
      <path d="M 620 380 V 368 Q 620 360 628 360 H 772 Q 780 360 780 368 V 380" fill="none" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="700" y="356" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">q0.90 · ONE POSITION</text>
      <text x="220" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S_(1)</text>
      <text x="780" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S_(n)</text>

      <!-- Two formula definitions. -->
      <rect x="40" y="432" width="416" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="64" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">P90 / QUANTILE</text>
      <text x="64" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">P90 是一个分位点</text>
      <text x="64" y="500" fill="#2d3142" font-size="16" font-family="'Geist Mono', monospace">P90(S) = q0.90(S)</text>

      <rect x="504" y="432" width="416" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="528" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">TRIMMED MEAN</text>
      <text x="528" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">截尾均值是保留区间的均值</text>
      <text x="528" y="500" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">S̄trim = Σ S_(j) / (n − k_l − k_h)</text>

      <!-- Actual source boundary, kept as a dashed note rather than a third statistic. -->
      <rect x="40" y="516" width="880" height="28" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="56" y="534" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">59CFF12 · worker: speed = totLoaded / (t / 1000) · interval = 200ms · 未发现 P90 / SORT / TRIM</text>

      <!-- Legend: horizontal strip at the bottom. -->
      <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="584" x2="72" y2="584" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="84" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">示意样本序列</text>

      <line x1="248" y1="584" x2="280" y2="584" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="292" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">分位点 / 保留区间焦点</text>

      <line x1="520" y1="584" x2="552" y2="584" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="564" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">源码核对边界</text>
    </svg>
