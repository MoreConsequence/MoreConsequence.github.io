<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="blameless-postmortem-continuous-improvement-loop-title blameless-postmortem-continuous-improvement-loop-desc"><title id="blameless-postmortem-continuous-improvement-loop-title">不指责复盘文化 (Blameless Postmortem)：从惩罚个人转向修复系统缺陷</title><desc id="blameless-postmortem-continuous-improvement-loop-desc">不指责复盘文化 (Blameless Postmortem)：从惩罚个人转向修复系统缺陷</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">不指责复盘文化 (Blameless Postmortem) 进化模型</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">指责与惩罚个人 (导致全员隐瞒故障、拒绝承认、系统脆弱依旧) vs 不指责复盘 (假设人总是会犯错，将注意力集中在构筑自动化防线与系统免疫)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 有毒的指责文化：隐瞒故障与恶性循环</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">事故复盘演变成批斗会：</text>
          <text y="28" fill="#f5f5f5">• "都是小张粗心删了库，扣发绩效！"</text>

          <text y="50" fill="#f5f5f5">致命组织后果：</text>
          <text y="64" fill="#f5f5f5">• 工程师不敢创新，能不动代码就不动</text>
          <text y="78" fill="#f5f5f5">• 发生故障时全员第一反应是隐瞒和删日志甩锅</text>
          <text y="92" fill="#f5f5f5">• 下一次小李依然会因为缺少防误删护栏再次踩雷！</text>

          <text y="116" fill="#f5f5f5">🔴 系统整体鲁棒性永远止步不前！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 团队信任彻底崩塌；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 无法探寻架构深层次漏洞；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 业余管理反面教材！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 不指责复盘：系统级免疫力进化</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">工程哲学: "人会犯错，是系统缺少了防线！"</text>

          <text y="36" fill="#f5f5f5">深入系统级根因：</text>
          <text y="50" fill="#f5f5f5">1. 为什么数据库能被单条命令删掉？──► 缺少 RBAC 权限隔离</text>
          <text y="64" fill="#f5f5f5">2. 为什么没走审计？──► 补齐自动化 SQL 审核平台</text>
          <text y="78" fill="#f5f5f5">3. 落实落地具体 Action Items，杜绝任何人再次犯错！</text>

          <text y="104" fill="#f5f5f5">✓ 将每一次危机化作系统无坚不摧的抗体！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 鼓励工程师主动坦白与分享失败案例；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 打造世界一流的工程文化与技术韧性；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• Google SRE 核心精髓！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
