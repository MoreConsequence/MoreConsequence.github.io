<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Subagents 编排拓扑：父 Agent 调度并行子进程与隔离工作区</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Parent Agent ──► 拆解任务 ──► 并行派发 Subagent A (前端) / Subagent B (后端) ──► 独立 Git Worktree ──► 汇总合并验证</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 任务拆解与派发 (Fork)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 父 Agent 派发子任务</text>
          <text x="10" y="34" fill="#93c5fd">spawnSubagent({</text>
          <text x="16" y="48" fill="#86efac">  role: "API Specialist",</text>
          <text x="16" y="62" fill="#86efac">  prompt: "重构 /v1/auth 路由",</text>
          <text x="16" y="76" fill="#fed7aa">  workspace: "branch"</text>
          <text x="10" y="90" fill="#93c5fd">})</text>
          
          <text x="10" y="112" fill="#4ade80">✓ 启动独立的轻量沙箱子进程！</text>
          <text x="10" y="126" fill="#34d399">✓ 拥有专属上下文与 Token 预算。</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 保持父 Agent 上下文清爽专注；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 子 Agent 并行全速执行，提速 3 倍；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高并发开发流水线。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Git Worktree 隔离工作区</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 物理文件目录隔离</text>
          <text x="10" y="34" fill="#86efac">git worktree add /tmp/agent_a branch_a</text>
          <text x="10" y="50" fill="#86efac">git worktree add /tmp/agent_b branch_b</text>
          
          <text x="10" y="74" fill="#38bdf8">1. 子 Agent A 与 B 互不干扰</text>
          <text x="10" y="90" fill="#34d399">2. 0 文件读写锁冲突与脏覆盖</text>
          <text x="10" y="108" fill="#4ade80">✓ 各自独立运行 npm test 验证！</text>
          <text x="10" y="124" fill="#34d399">✓ 完美支持跨模块并行重构！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 共享本地 .git 存储，0 额外磁盘复制；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 隔离分支开发，支持一键丢弃失败方案；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 极度优雅的文件隔离方案。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 结果汇总与集成验收</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 父 Agent 接收完成报告</text>
          <text x="10" y="34" fill="#fed7aa">1. 校验子 Agent 返回的 Git Patch</text>
          <text x="10" y="50" fill="#fed7aa">2. 主干分支执行自动合并 (Merge)</text>
          <text x="10" y="68" fill="#38bdf8">3. 全局运行总集成测试</text>
          <text x="10" y="88" fill="#4ade80">4. 成功后向用户汇报最终成果！</text>
          
          <text x="10" y="112" fill="#34d399">✓ 打造真正的"一人即团队"超强产能！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 将复杂大型工程拆解为精细化子任务；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 保持层级清晰的调度管理闭环；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 多智能体协作时代的顶级架构实践！</text>
      </g>
    </g>
  </g>
</svg>