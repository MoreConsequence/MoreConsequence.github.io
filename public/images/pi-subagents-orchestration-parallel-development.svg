<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="pi-subagents-orchestration-parallel-development-title pi-subagents-orchestration-parallel-development-desc"><title id="pi-subagents-orchestration-parallel-development-title">单体大上下文污染 vs 隔离 Subagent 并发编排架构</title><desc id="pi-subagents-orchestration-parallel-development-desc">架构对比图展示单体 Agent 在复杂任务中上下文膨胀与注意力污染的缺陷，对比 Pi 进程隔离 Subagent 编排架构在上下文纯净度、多模型特化与并行扇出汇聚方面的核心优势。</desc>
  <defs>
    <marker id="sa-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="sa-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">SUBAGENT ORCHESTRATION · CONTEXT ISOLATION &amp; PARALLEL EXECUTION</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">单体上下文污染 vs 隔离 Subagent 编排</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">单体会话膨胀至 90k 诱发幻觉 vs 进程物理隔离 (独立 5k 上下文 + 仅返回精炼摘要 + 并行扇出汇聚)</text>

  <!-- 2 Main Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Monolith Flaws (x=40..460, w=420) -->
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="79" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">MONOLITH CONTEXT</text>
    <text x="154" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">单体大上下文模式</text>

    <!-- Metrics Matrix -->
    <rect x="14" y="42" width="392" height="74" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">所有子任务混在同一历史上下文</text>
    <text x="24" y="82" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 上下文膨胀: 90k+ Tokens 严重吃满窗口</text>
    <text x="24" y="100" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 500 行测试日志严重污染大模型注意力</text>

    <!-- Visual Mechanism -->
    <rect x="14" y="126" width="392" height="120" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">严重工程隐患：</text>
    <text x="24" y="168" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 注意力稀释：产生不可控的代码幻觉；</text>
    <text x="24" y="186" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">2. 串行阻塞：多个子任务必须排队顺序执行；</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 成本爆炸：每轮思考都在全量传输 90k 历史。</text>
    <text x="24" y="224" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace">Attention Degradation &amp; Serial Bottleneck</text>

    <!-- Summary -->
    <rect x="14" y="256" width="392" height="104" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="24" y="278" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">评价</text>
    <text x="24" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">仅适用于 3 轮以内的微小任务，无法承担生产级多模块并发重构。</text>
    <text x="24" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Unfit for Multi-Module Engineering</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Fragile &amp; Expensive</text>
  </g>

  <!-- Col 2: Subagents Orchestration (x=480..920, w=440) - Focal -->
  <g transform="translate(480, 136)">
    <rect width="440" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="14" y="12" width="140" height="18" rx="2" fill="#eb6c36"/>
    <text x="84" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">SUBAGENT</text>
    <text x="164" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Pi 隔离 Subagent 编排</text>

    <!-- Metrics Matrix -->
    <rect x="14" y="42" width="412" height="74" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">主 Agent 规划 ➔ 轻量子进程并行执行</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• 子进程独立运行: 拥有私有 5k 干净上下文</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 仅返回精炼结论: 主上下文仅增加 100 Tokens</text>

    <!-- Visual Mechanism -->
    <rect x="14" y="126" width="412" height="120" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">三大核心工程优势：</text>
    <text x="24" y="168" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 物理隔离：子任务报错与调试日志绝不污染主干；</text>
    <text x="24" y="186" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">2. 模型特化：主 Agent 用旗舰模型，子 Agent 用小模型；</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 并行扇出：多子任务并发执行，耗时缩短 60% 以上！</text>
    <text x="24" y="224" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Context Purity &amp; High-Throughput Parallelism</text>

    <!-- Summary -->
    <rect x="14" y="256" width="412" height="104" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
    <text x="24" y="278" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">架构效益</text>
    <text x="24" y="298" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">将复杂 Monorepo 级开发解构为纯净子任务，支撑大规模自主并行编程。</text>
    <text x="24" y="322" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Zero-Context Pollution Subagent Design</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Clean Monadic Aggregation Model</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">单体大上下文模式与注意力污染缺陷</text>
  <rect x="370" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="390" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Pi 隔离 Subagent 编排与 Fan-out/Fan-in 聚合核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
