<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="pi-tui-markdown-highlight-cjk-alignment-title pi-tui-markdown-highlight-cjk-alignment-desc"><title id="pi-tui-markdown-highlight-cjk-alignment-title">终端文本排版深坑与 CJK wcwidth 字符宽度校准算法</title><desc id="pi-tui-markdown-highlight-cjk-alignment-desc">算法对比图展示传统字符长度计算导致终端表格错位与 ANSI 污染的缺陷，对比基于 Unicode UAX #11 的 wcwidth 东亚字符宽度校准与绝对对齐算法。</desc>
  <defs>
    <marker id="cw-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="cw-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">TERMINAL RENDERING ENGINE · CJK WCWIDTH &amp; EAST ASIAN WIDTH</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">终端排版深坑与 CJK 宽度校准算法</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">String.length 误判导致表格错位 vs Unicode UAX #11 东亚字符宽度 (全角 2 列/半角 1 列/结合符 0 列)</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="79" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TERMINAL PITFALLS</text>
    <text x="154" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">经典终端排版深坑</text>

    
    <rect x="14" y="42" width="392" height="74" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">String.length 造成的视觉偏差</text>
    <text x="24" y="82" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• '中'.length === 1 (但终端占 2 列宽)</text>
    <text x="24" y="100" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 导致表格边框支离破碎、右侧错位</text>

    
    <rect x="14" y="126" width="392" height="120" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">地狱级排版缺陷：</text>
    <text x="24" y="168" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. CJK 全角对不齐：汉字与 Emoji 撑破固定列宽；</text>
    <text x="24" y="186" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">2. ANSI 截断污染：折行处未闭合颜色导致下行整屏变红；</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 乱码截断：在 UTF-16 代理对中间截断产生问号。</text>
    <text x="24" y="224" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace">Visual Column Drift &amp; ANSI Bleeding</text>

    
    <rect x="14" y="256" width="392" height="104" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="278" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">评价</text>
    <text x="24" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">缺乏底层 Unicode 宽度校准的 TUI，中文显示体验将极度粗糙丑陋。</text>
    <text x="24" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Broken Layout on Multi-Byte Text</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Unprofessional Terminal Output</text>
  </g>

  
  <g transform="translate(480, 136)">
    <rect width="440" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="140" height="18" rx="2" fill="#eb6c36" />
    <text x="84" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">WCWIDTH ENGINE</text>
    <text x="164" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Pi wcwidth 字符校准引擎</text>

    
    <rect x="14" y="42" width="412" height="74" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Unicode UAX #11 东亚宽度精确计算</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• CJK / 全角标点 / Emoji (0x1f300..): 严格计为 2 列</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 结合字符 (0x0300..0x036f): 严格计为 0 列</text>

    
    <rect x="14" y="126" width="412" height="120" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="148" fill="#2d3142" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">校准引擎核心机制：</text>
    <text x="24" y="168" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 剥离 ANSI 颜色码后逐 CodePoint 累加视觉列宽；</text>
    <text x="24" y="186" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">2. 折行处自动补齐 \x1b[0m 并在下一行恢复前缀样式；</text>
    <text x="24" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 终端表格与 UI Border 达成绝对 0 像素垂直对齐！</text>
    <text x="24" y="224" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Pixel-Perfect Column Alignment &amp; Safe ANSI Wrapping</text>

    
    <rect x="14" y="256" width="412" height="104" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="278" fill="#eb6c36" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">渲染效益</text>
    <text x="24" y="298" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">赋予 CLI 终端无与伦比的高级质感与工业级双语对齐排版能力。</text>
    <text x="24" y="322" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Publication Grade TUI Rendering</text>
    <text x="24" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Unicode Compliant Column Calculator</text>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">传统字符长度计算与表格错位缺陷</text>
  <rect x="370" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="390" y="564" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Pi wcwidth 字符宽度校准与 ANSI 安全折行核心</text>
