<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="oauth2-jwt-token-revocation-blacklist-bloom-title oauth2-jwt-token-revocation-blacklist-bloom-desc"><title id="oauth2-jwt-token-revocation-blacklist-bloom-title">JWT 实时吊销双层防御：Redis 黑名单 + 布隆过滤器 (Bloom Filter) 快速初筛</title><desc id="oauth2-jwt-token-revocation-blacklist-bloom-desc">JWT 实时吊销双层防御：Redis 黑名单 + 布隆过滤器 (Bloom Filter) 快速初筛</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">JWT 混合吊销架构：内存布隆过滤器 + Redis 黑名单</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 本地 JWT 签名合法性校验 ──► 2. 本地内存布隆过滤器 0ms 判定 "绝未被吊销" (99.9% 请求直接放行) ──► 3. 疑似黑名单才查 Redis 确证</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 本地 CPU 极速验签 (Local Cryptographic Verification)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">通过 EdDSA / RSA-256 公钥校验签名与 exp 过期时间 ──► 纯内存纳秒级完成</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">排除伪造与过期请求！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. 本地内存布隆过滤器初筛 (In-Memory Bloom Filter: 0ms)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">检查 jti (JWT ID) 是否在吊销布隆过滤器中 ──► 若判定 "不存在" ──► 100% 绝对未被吊销，直接放行通过！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">99.9% 的正常请求在此 0 网络 I/O 瞬间直通！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. 命中疑似黑名单精细确证 (Redis Blacklist Lookup: SETEX ttl)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">仅当布隆过滤器命中 (存在假阳性可能) ──► 查 Redis: GET blacklist:jti ──► 确证已被吊销立即返回 HTTP 401</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">精准消灭假阳性，确保持久安全！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 黑名单自动过期收缩 (Automatic TTL Self-Pruning)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Redis 黑名单 key 的 TTL 仅需设为该 JWT 的剩余生命周期 ──► 到期自动销毁，黑名单容量永不膨胀！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">兼具无状态极速性能与即时安全吊销的终极融合！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
