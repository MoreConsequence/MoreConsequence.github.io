<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi Agent 上下文装配引擎：文件发现、动态钩子与 Token 预算控制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 仓库规则 (AGENTS.md) ──► 2. 会话历史分支 ──► 3. on_turn_start 扩展钩子 ──► 4. 严格滑动窗口截断预算</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 静态层: AGENTS.md 与系统指令 (System Prompt Injection)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">读取当前仓库 AGENTS.md + 核心系统 Prompt ──► 注入为 System Message (占 15% 预算)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">前置静态上下文享受供应商 100% 缓存命中，单月 Token 费用直降 90%！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 动态层: on_turn_start 插件钩子 (Dynamic Context Hook)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Extension.onTurnStart() ──► 动态注入 Git Diff、当前活跃文件、环境变量</text>
        <text x="15" y="62" font-size="8" fill="#047857">按需精准提供当前轮次必要上下文，拒绝盲目预加载海量无关文件污染模型注意力！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 历史层: 会话分支追溯与残行修复 (Session Tree Log)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">从 session.jsonl 提取当前分支全部轮次: User ──► Assistant ──► Tool Call ──► Tool Result</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">保证模型所见与实际执行记录 100% 字节对齐，严格还原因果推理链条！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 预算层: Compaction 上下文压缩与滑动窗口截断 (Budget Enforcement)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">总 Tokens &gt; MaxBudget (如 128k) ──► 触发自动摘要压缩 (Compaction) ──► 保证 0 溢出崩溃</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">将冗长工具输出替换为简明总结，保留核心结论，支撑 Agent 进行数百轮超长连续推理！</text>
      </g>
    </g>
  </g>
</svg>