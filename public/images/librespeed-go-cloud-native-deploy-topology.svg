<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LibreSpeed 云原生高可用部署拓扑 (Cloud-Native Deployment)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">BGP Anycast 全球边缘入口 ──► 极简 Scratch Docker 镜像 (仅 15MB) ──► K8s HPA 自动水平扩缩容 ──► 分布式 Redis/PG 遥测集群</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 全球 BGP Anycast 边缘路由加速 (Global BGP Anycast Entry)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">单一公网 Anycast IP ──► 动态将全球用户导流至最近的边缘机房 POP 点 ──► 物理时延压至 10ms 以内</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">构建跨大洲超低时延测速网络的核心基建！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 极简 Scratch 静态二进制镜像 (Docker Scratch Image: 15MB)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">CGO_ENABLED=0 编译纯静态 Go 二进制 ──► FROM scratch ──► 0 Shell、0 系统库漏洞、秒级秒启动</text>
        <text x="15" y="62" font-size="8" fill="#047857">攻击面极致缩减为 0，安全合规最高评级！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. Kubernetes 无状态弹性集群 (K8s HPA Auto-Scaling)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">基于网卡带宽与 CPU 使用率 ──► 自动从 3 副本扩容至 100 副本 ──► 轻松接纳 100Gbps 突发测速洪峰</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">真正的无状态水平扩展弹性架构！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 分布式遥测与 Grafana 监控大盘 (Telemetry &amp; Observability)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">Prometheus 采集 QPS 与网卡实时速率 ──► Grafana 实时绘制全球测速热力图</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">工业级现代测速平台终极架构全景！</text>
      </g>
    </g>
  </g>
</svg>