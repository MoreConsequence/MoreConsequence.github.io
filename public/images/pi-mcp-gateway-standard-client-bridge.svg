<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi MCP 客户端桥接器架构：连接全球开源工具生态</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Pi Core ──► McpBridge ──► 子进程/SSE 传输层 ──► 协议握手、工具发现、资源拉取与动态执行</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 传输层建立与生命周期托管 (Transport Lifecycle)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">const transport = new StdioClientTransport({ command: "docker", args: ["run", "-i", "mcp-server"] })</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">自动管理 MCP 子进程的拉起、心跳保活与异常退出崩溃自动重启！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 协议握手与工具能力自发现 (Protocol Handshake &amp; Tools Discovery)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">client.initialize() ──► client.listTools() ──► 自动转换 JSON Schema 为 Pi 工具注册格式</text>
        <text x="15" y="62" font-size="8" fill="#047857">零人工编码，开箱即用直接映射任意外部 MCP 工具入参规范！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 资源动态读取与提示词模板注入 (Resources &amp; Prompts Injection)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">client.readResource({ uri: "postgres://db/schema" }) ──► 动态注入当前 Agent 上下文</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将数据库元数据与 API 规范精准供给大模型，消除无谓的模糊猜测！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 双向调用分发与结构化结果返回 (Bidirectional Execution)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">LLM tool_call ──► client.callTool({ name, arguments }) ──► 结构化回传结果并写入日志</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">打造无缝连接 GitHub、Slack、Sentry、AWS 等全栈生态的万能超级 Agent！</text>
      </g>
    </g>
  </g>
</svg>