<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">for-select 循环内调用 time.After 内存泄漏物理机理</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">每次循环创建一个全新的 time.Timer ──► 定时器挂载到 P 的 timers 四叉堆 ──► 在超时时间到达前 GC 绝对无法回收 ──► 瞬间积压数百万定时器打爆内存</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: time.After Trap -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ for-select 内使用 time.After：定时器幽灵泄漏</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">for {</text>
          <text y="28" fill="#f87171">  select {</text>
          <text y="42" fill="#38bdf8">  case msg := &lt;-ch: process(msg) // 高频命中 (10,000 QPS)</text>
          <text y="56" fill="#ef4444">  case &lt;-time.After(5 * time.Minute): // 每次循环新建 5 分钟定时器！</text>
          <text y="70" fill="#f87171">  }</text>
          <text y="84" fill="#f87171">}</text>
          
          <text y="106" fill="#ef4444">💥 1 秒内产生 10,000 个未到期 Timer，死死锁住 5 分钟不释放！</text>
          <text y="120" fill="#f87171">🔴 内存暴涨数 GB，GC 扫描四叉堆导致 CPU 100% 暴动！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• Go 开发者最常犯的高危内存反模式；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 导致运行时 runtime.checkTimers 遍历开销急剧恶化；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须显式复用单实例 Timer！</text>
      </g>
    </g>

    <!-- Right: timer.Reset -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正确范式：循环外新建 + timer.Reset() 复用</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">timer := time.NewTimer(5 * time.Minute)</text>
          <text y="28" fill="#86efac">defer timer.Stop()</text>
          
          <text y="48" fill="#38bdf8">for {</text>
          <text y="62" fill="#34d399">  timer.Reset(5 * time.Minute) // Go 1.23+ 完美支持直接 Reset！</text>
          <text y="76" fill="#38bdf8">  select {</text>
          <text y="90" fill="#34d399">  case msg := &lt;-ch: process(msg)</text>
          <text y="104" fill="#fed7aa">  case &lt;-timer.C: handleTimeout()</text>
          <text y="118" fill="#38bdf8">  }</text>
          <text y="132" fill="#4ade80">}</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 全生命周期仅占用 1 个 Timer 内存结构体；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 0 堆内存分配积累，0 GC 扫描压力；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 高并发事件循环标准编写规范！</text>
      </g>
    </g>
  </g>
</svg>