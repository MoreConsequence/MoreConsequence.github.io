<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="gitops-declarative-drift-reconciliation-loop-title gitops-declarative-drift-reconciliation-loop-desc"><title id="gitops-declarative-drift-reconciliation-loop-title">GitOps 状态漂移检测与自愈循环：Git 声明源头 -&gt; 实时 Diff -&gt; 自动收敛</title><desc id="gitops-declarative-drift-reconciliation-loop-desc">GitOps 状态漂移检测与自愈循环：Git 声明源头 -&gt; 实时 Diff -&gt; 自动收敛</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2d3142" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f5f5f5"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">GitOps 生产状态漂移 (Configuration Drift) 自动自愈闭环</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">运维人员手动执行 kubectl edit (产生危险的不可追溯幽灵修改) ──► ArgoCD 毫秒级捕获 Diff ──► 强行自动覆盖恢复 Git 声明标准</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Manual Edit Disaster -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统手动修改：配置漂移与未知陷阱</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f87171">某工程师凌晨偷偷执行: kubectl scale --replicas=10</text>

          <text y="38" fill="#ef4444">灾难后果：</text>
          <text y="52" fill="#fca5a5">• Git 仓库中依然记录 replicas: 3</text>
          <text y="68" fill="#ef4444">• 下一次正常 CI/CD 发布时，配置被意外覆盖变回 3！</text>
          <text y="84" fill="#ef4444">• 导致白天高峰期集群瞬间容量腰斩发生严重雪崩！</text>

          <text y="106" fill="#f87171">🔴 传统运维模式中最恐怖的“幽灵修改”陷阱！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 生产实际状态与版本库代码脱节；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 故障时无法准确回滚；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 严禁手工操作生产集群！</text>
      </g>
    </g>

    <!-- Right: GitOps Auto Healing -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ GitOps 自动自愈：Git 作为唯一事实源</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#4ade80">ArgoCD Auto-Sync &amp; Self-Healing 机制：</text>

          <text y="36" fill="#86efac">1. 任何人在集群的手工乱改产生 OutOfSync 状态</text>
          <text y="50" fill="#38bdf8">2. ArgoCD 控制器在 3 秒内检测到状态漂移</text>
          <text y="64" fill="#34d399">3. 自动触发 Self-Heal ──► 强制将集群重置为 Git 声明！</text>
          <text y="78" fill="#4ade80">4. 任何变更必须提交 Git PR 并通过审计批准！</text>

          <text y="104" fill="#4ade80">✓ 生产环境 100% 审计合规与绝对可重现！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底根除暗度陈仓的不可控线上私自改动；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 赋予生产系统无可比拟的灾备重建能力；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化基础设施运维最高标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
