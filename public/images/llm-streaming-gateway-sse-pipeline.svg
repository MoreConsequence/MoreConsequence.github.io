<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">大模型长连接流式网关（SSE）全链路物理数据管道</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Client ──► 接入网关（分块分发与 Ping 保活） ──► vLLM 推理引擎（gRPC Async Generator 迭代吐词）</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 3 Stage Columns (265px each, gap 20px) -->
    <g transform="translate(20, 20)">
      <!-- Stage 1: Browser / Client -->
      <g>
        <rect width="265" height="235" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect width="265" height="32" rx="6" fill="#f1f5f9"/>
        <text x="132" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">1. 客户端 (Browser / App)</text>

        <g transform="translate(12, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <rect width="241" height="46" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="10" y="18" fill="#0f172a" font-weight="700">标准 EventSource / Fetch</text>
          <text x="10" y="32" font-family="ui-monospace, monospace" font-size="9.5" fill="#2563eb">Accept: text/event-stream</text>

          <rect y="54" width="241" height="60" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
          <text x="10" y="18" fill="#1e40af" font-weight="700">逐字打字机渲染</text>
          <text x="10" y="32" font-size="9.5" fill="#2563eb">• 首字时延 TTFT &lt; 300ms 即响应</text>
          <text x="10" y="46" font-size="9.5" fill="#2563eb">• 持续消费 data: {"delta":"..."}</text>

          <rect y="122" width="241" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="10" y="22" font-size="9.5" fill="#64748b">物理状态：单 HTTP 连接保持 30s</text>
        </g>
      </g>

      <!-- Stage 2: Streaming Gateway -->
      <g transform="translate(285, 0)">
        <rect width="265" height="235" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="265" height="32" rx="6" fill="#dcfce7"/>
        <text x="132" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 流式代理网关 (Gateway)</text>

        <g transform="translate(12, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <rect width="241" height="46" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="10" y="18" fill="#14532d" font-weight="700">禁用网关全量 Buffer 缓冲</text>
          <text x="10" y="32" font-family="ui-monospace, monospace" font-size="9.5" fill="#047857">X-Accel-Buffering: no (Nginx)</text>

          <rect y="54" width="241" height="60" rx="4" fill="#ecfdf5" stroke="#10b981"/>
          <text x="10" y="18" fill="#047857" font-weight="700">心跳保活与超时防护</text>
          <text x="10" y="32" font-size="9.5" fill="#065f46">• 每 15s 发送 `: ping\n\n` 空包</text>
          <text x="10" y="46" font-size="9.5" fill="#065f46">• 防止 LB/NAT 网关静默切断连接</text>

          <rect y="122" width="241" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="10" y="22" font-size="9.5" fill="#64748b">流控：连接池防击穿熔断保护</text>
        </g>
      </g>

      <!-- Stage 3: LLM Inference Engine -->
      <g transform="translate(570, 0)">
        <rect width="270" height="235" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.5"/>
        <rect width="270" height="32" rx="6" fill="#eff6ff"/>
        <text x="135" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">3. 推理引擎 (vLLM / TGI)</text>

        <g transform="translate(12, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <rect width="246" height="46" rx="4" fill="#ffffff" stroke="#93c5fd"/>
          <text x="10" y="18" fill="#1e40af" font-weight="700">gRPC 流式迭代器 (Async)</text>
          <text x="10" y="32" font-size="9.5" fill="#2563eb">每个 Forward 迭代 yield 1 个 Token</text>

          <rect y="54" width="246" height="60" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
          <text x="10" y="18" fill="#1d4ed8" font-weight="700">显存生命周期绑定</text>
          <text x="10" y="32" font-size="9.5" fill="#2563eb">• 持续持有 KV Cache Block</text>
          <text x="10" y="46" font-size="9.5" fill="#2563eb">• 输出 EOS 后瞬时解绑物理块</text>

          <rect y="122" width="246" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="10" y="22" font-size="9.5" fill="#64748b">单卡支持 100+ 活跃长连接</text>
        </g>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">长连接网关核心命题：</tspan> 大模型时代彻底终结了“100ms 快速短连接 RPC”的黄金假设；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#2563eb" text-anchor="middle">
        网关必须具备处理 30~60 秒超长连接、平滑分块流式传输、防假死心跳与动态反压的全新能力。
      </text>
    </g>
  </g>
</svg>
