<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Promise 并发原语全景矩阵：all vs allSettled vs race vs any</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">短路失败模式 (Fail-Fast: all) ｜ 弹性容错结算 (allSettled) ｜ 首个成功胜出 (First-Success: any) ｜ 竞态熔断 (First-Finished: race)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Promise.all</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">全部成功才成功：</text>
          <text x="8" y="34" fill="#86efac">• 结果保序: [r1, r2, r3]</text>
          
          <text x="8" y="58" fill="#f87171">🔴 一票否决 (Fail-Fast):</text>
          <text x="8" y="74" fill="#fca5a5">• 任一 Promise 失败</text>
          <text x="8" y="90" fill="#fca5a5">• 立即抛出该错误！</text>
          
          <text x="8" y="116" fill="#4ade80">✓ 适合强依赖并行业务</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• 组合查询个人资料；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 并行加载渲染依赖；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 缺一不可的核心接口。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Promise.allSettled</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">永不抛错 (Zero Reject):</text>
          <text x="8" y="34" fill="#86efac">• 等待全部任务结算</text>
          <text x="8" y="50" fill="#38bdf8">• 状态对象保序：</text>
          <text x="8" y="68" fill="#34d399">  { status: 'fulfilled' }</text>
          <text x="8" y="84" fill="#fca5a5">  { status: 'rejected' }</text>
          
          <text x="8" y="112" fill="#4ade80">✓ 弹性容错首选！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">适用场景：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• 批量埋点与日志上报；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• 批量关闭连接与清理；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 独立任务批量执行。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Promise.race</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">第一个完成者胜出：</text>
          <text x="8" y="34" fill="#fed7aa">• 无论是成功还是失败</text>
          <text x="8" y="50" fill="#fed7aa">• 谁快就直接采用谁！</text>
          
          <text x="8" y="74" fill="#38bdf8">经典范式：</text>
          <text x="8" y="90" fill="#34d399">Promise.race([fetch, timeout])</text>
          
          <text x="8" y="114" fill="#4ade80">✓ 极速超时熔断原语！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#c2410c">适用场景：</text>
        <text x="8" y="34" font-size="7.5" fill="#9a3412">• 网络请求客户端超时；</text>
        <text x="8" y="48" font-size="7.5" fill="#9a3412">• 多副本竞速读取；</text>
        <text x="8" y="62" font-size="7.5" fill="#ea580c">• 取最快可用节点响应。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">Promise.any</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">第一个成功者胜出：</text>
          <text x="8" y="34" fill="#e9d5ff">• 忽略所有失败任务</text>
          <text x="8" y="50" fill="#38bdf8">• 只要有 1 个成功即 resolve</text>
          
          <text x="8" y="74" fill="#f87171">全失败时抛错：</text>
          <text x="8" y="90" fill="#fca5a5">• AggregateError 汇聚</text>
          
          <text x="8" y="114" fill="#4ade80">✓ 多源镜像冗余首选！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">适用场景：</text>
        <text x="8" y="34" font-size="7.5" fill="#6b21a8">• CDN 多源自动灾备切换；</text>
        <text x="8" y="48" font-size="7.5" fill="#6b21a8">• 局域网服务并行发现；</text>
        <text x="8" y="62" font-size="7.5" fill="#6b21a8">• 极速高可用架构。</text>
      </g>
    </g>
  </g>
</svg>