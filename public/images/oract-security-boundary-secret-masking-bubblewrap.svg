<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ORACT 零信任安全边界：敏感信息动态脱敏与 Linux 沙箱双重防线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Secret 动态掩码 (Token/密钥输出自动打码为 [REDACTED]) ｜ Bubblewrap 物理沙箱 (只读系统盘、进程树隔离与网络严控)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Secret Masking -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Secret 动态脱敏与反向注入拦截</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// 动态双向流式脱敏过滤器</text>
          <text y="28" fill="#86efac">1. 捕获敏感环境变量: GITHUB_TOKEN=ghp_9a8b7c6d5e...</text>
          <text y="44" fill="#fb923c">2. 工具输出流经 MaskStream 过滤器:</text>
          <text y="58" fill="#f87171">   stdout: "Connecting with ghp_9a8b7c6d5e..."</text>
          <text y="74" fill="#4ade80">   ► 替换为: "Connecting with [REDACTED_GH_TOKEN]"</text>
          
          <text y="98" fill="#34d399">✓ 100% 杜绝机密凭证被写进 Session Log 或发往第三方 LLM！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 自动扫描 JWT、API Key、私钥与密码哈希；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 内存级替换，0 性能衰减；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造符合 SOC2 / ISO27001 合规的研发环境。</text>
      </g>
    </g>

    <!-- Right: Bubblewrap Linux Sandbox -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Bubblewrap 物理命名空间隔离</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// ORACT Linux Sandbox 配置</text>
          <text y="28" fill="#86efac">• 挂载模式: 根文件系统完全只读 (--ro-bind / /)</text>
          <text y="44" fill="#38bdf8">• 临时目录: 独立的 tmpfs 内存盘挂载至 /tmp</text>
          <text y="60" fill="#86efac">• 工作区: 仅当前 Git 仓库允许可读写 (--bind /repo /repo)</text>
          <text y="78" fill="#f87171">• 网络权限: 默认断网 (--unshare-net)，按需放行白名单</text>
          
          <text y="104" fill="#34d399">✓ 物理上杜绝 rm -rf / 与挖矿木马入侵！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 启动时间 &lt; 5 毫秒，远快于传统 Docker 容器；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 进程崩溃自动回收所有挂载资源；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 企业级最高等级的安全防护堡垒！</text>
      </g>
    </g>
  </g>
</svg>