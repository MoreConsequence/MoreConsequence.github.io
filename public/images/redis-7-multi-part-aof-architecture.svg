<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Redis 7.0 Multi-Part AOF (MP-AOF) 现代持久化架构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Base AOF (RDB 格式基础快照) + Incremental AOF (轻量增量命令日志) + Manifest (元数据清单文件管理)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Base AOF 基础快照文件</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">appendonly.aof.1.base.rdb</text>
          
          <text x="10" y="42" fill="#86efac">文件特性：</text>
          <text x="10" y="58" fill="#cbd5e1">• 重写 (Rewrite) 时由子进程生成</text>
          <text x="10" y="74" fill="#cbd5e1">• 采用紧凑的 RDB 二进制格式存储</text>
          <text x="10" y="90" fill="#34d399">• 体积相比纯文本 AOF 缩减 70%！</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 重启加载速度提升 5 倍！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 承载历史存量全量数据；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 不可变文件，只读加载；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极速启动底座。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Incremental AOF 增量日志</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">appendonly.aof.1.incr.aof</text>
          
          <text x="10" y="42" fill="#86efac">文件特性：</text>
          <text x="10" y="58" fill="#cbd5e1">• 主进程仅需追加写入极小的增量文件</text>
          <text x="10" y="74" fill="#38bdf8">• AOF Rewrite 期间主进程 0 内存缓冲区开销！</text>
          <text x="10" y="90" fill="#34d399">• 彻底告别旧版 Rewrite 导致的内存翻倍</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 极速轻量追加写入！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 消除重写期间的巨量内存拷贝与 CPU 抖动；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 写入延迟极度平稳；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化架构演进。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Manifest 清单控制文件</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">appendonly.aof.manifest</text>
          
          <text x="10" y="38" fill="#fed7aa">元数据清单格式：</text>
          <text x="10" y="54" fill="#38bdf8">file appendonly.aof.1.base.rdb seq 1 type b</text>
          <text x="10" y="70" fill="#34d399">file appendonly.aof.1.incr.aof seq 1 type i</text>
          
          <text x="10" y="96" fill="#4ade80">✓ 协调多个 AOF 片段原子性切换！</text>
          <text x="10" y="112" fill="#4ade80">✓ 0 历史冗余文件残留！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 完美解决 Redis 历史持久化遗留痛点；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• Redis 7.0 最具工程价值的技术升级；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级分布式持久化典范！</text>
      </g>
    </g>
  </g>
</svg>