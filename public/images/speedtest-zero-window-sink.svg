<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="sink-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr-muted-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-orange-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#sink-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="34" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">TCP FLOW CONTROL &amp; SINK MECHANISM</text>
  <text x="40" y="54" fill="#0f172a" font-size="16" font-weight="700">TCP 零窗口（Zero-Window）反压机制 vs 64KB 栈内存极速黑洞</text>

  <!-- ================= TOP: CONVENTIONAL CASE (BACKPRESSURE) ================= -->
  <g transform="translate(40, 75)">
    <rect width="880" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="16" y="14" width="210" height="22" rx="4" fill="#64748b"/>
    <text x="121" y="29" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">传统读取：反压引发断崖跌零</text>

    <!-- Node 1 [x: 16 ~ 206] -->
    <g transform="translate(16, 45)">
      <rect width="190" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="24" fill="#0f172a" font-size="11.5" font-weight="700">1. 客户端全力推流</text>
      <text x="14" y="44" fill="#64748b" font-size="10">多 TCP 并发全速灌入</text>
    </g>

    <!-- Arrow 1 -> 2 [x: 206 -> 236] -->
    <path d="M 206,78 H 234" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-muted-s)"/>

    <!-- Node 2 [x: 236 ~ 426] -->
    <g transform="translate(236, 45)">
      <rect width="190" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="22" fill="#0f172a" font-size="11.5" font-weight="700">2. io.ReadAll 堆分配</text>
      <text x="14" y="42" fill="#64748b" font-size="10">GC 频繁停顿，读取慢</text>
    </g>

    <!-- Arrow 2 -> 3 [x: 426 -> 456] -->
    <path d="M 426,78 H 454" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-muted-s)"/>

    <!-- Node 3 [x: 456 ~ 646] -->
    <g transform="translate(456, 45)">
      <rect width="190" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="22" fill="#0f172a" font-size="11.5" font-weight="700">3. 内核 Recv-Q 溢出</text>
      <text x="14" y="42" fill="#64748b" font-size="10">下发 ZeroWindow 报文</text>
    </g>

    <!-- Arrow 3 -> 4 [x: 646 -> 676] -->
    <path d="M 646,78 H 674" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-muted-s)"/>

    <!-- Node 4 [x: 676 ~ 866] -->
    <g transform="translate(676, 45)">
      <rect width="190" height="65" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="14" y="22" fill="#0f172a" font-size="11.5" font-weight="700">4. 客户端刹车</text>
      <text x="14" y="42" fill="#475569" font-size="10" font-weight="700">发送窗口闭锁 · 速率跌零</text>
    </g>
  </g>


  <!-- ================= BOTTOM: PRODUCTION SOLUTION (STACK SINK) ================= -->
  <g transform="translate(40, 220)">
    <rect width="880" height="125" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="16" y="14" width="240" height="22" rx="4" fill="#ea580c"/>
    <text x="136" y="29" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">64KB 栈内存黑洞：持续通畅</text>

    <!-- Node 1 [x: 16 ~ 206] -->
    <g transform="translate(16, 45)">
      <rect width="190" height="65" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="14" y="24" fill="#9a3412" font-size="11.5" font-weight="700">1. 客户端全力推流</text>
      <text x="14" y="44" fill="#ea580c" font-size="10">多 TCP 并发全速灌入</text>
    </g>

    <!-- Arrow 1 -> 2 [x: 206 -> 236] -->
    <path d="M 206,78 H 234" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange-s)"/>

    <!-- Node 2 [x: 236 ~ 426] -->
    <g transform="translate(236, 45)">
      <rect width="190" height="65" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="14" y="22" fill="#9a3412" font-size="11.5" font-weight="700">2. [64KB]byte 栈读取</text>
      <text x="14" y="42" fill="#ea580c" font-size="10">逃逸分析 0 堆分配</text>
    </g>

    <!-- Arrow 2 -> 3 [x: 426 -> 456] -->
    <path d="M 426,78 H 454" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange-s)"/>

    <!-- Node 3 [x: 456 ~ 646] -->
    <g transform="translate(456, 45)">
      <rect width="190" height="65" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="14" y="22" fill="#9a3412" font-size="11.5" font-weight="700">3. atomic 累加即丢</text>
      <text x="14" y="42" fill="#ea580c" font-size="10">单核吞吐 40Gbps+</text>
    </g>

    <!-- Arrow 3 -> 4 [x: 646 -> 676] -->
    <path d="M 646,78 H 674" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange-s)"/>

    <!-- Node 4 [x: 676 ~ 866] -->
    <g transform="translate(676, 45)">
      <rect width="190" height="65" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
      <text x="14" y="22" fill="#9a3412" font-size="11.5" font-weight="700">4. Recv-Q 始终通畅</text>
      <text x="14" y="42" fill="#ea580c" font-size="10" font-weight="700">0 拥塞反压 · 平稳吸收</text>
    </g>
  </g>
</svg>
