<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LibreSpeed 交互状态机与时序合同全景 (Speedtest State Machine)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">身份探测 (I) ──► 延迟与抖动 (P: 10次) ──► 下行测速 (D: 15s) ──► 上行测速 (U: 15s) ──► 遥测上报与持久化 (T)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 阶段 I：身份与就近测距 (Identity &amp; Distance Probing)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">GET /getIP.json ──► 提取客户端公网 IP、运营商 ASN 与地理距离 ──► 客户端完成初始化</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">建立测速会话的起点，为后续计量奠定基准！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 阶段 P：空闲延迟与 RFC 3550 抖动计算 (Ping &amp; Jitter)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">连续发起 10 次 GET /empty ──► 取最小值作为 Idle Ping ──► 递归滤波计算 Jitter 抖动值</text>
        <text x="15" y="62" font-size="8" fill="#047857">在无负载状态下精确测量物理往返时延基线！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 阶段 D &amp; U：双向极限推流与黑洞计量 (Downlink &amp; Uplink)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">下行: 多并发拉取 /garbage (客户端计时计量) ｜ 上行: 多并发推流 /empty (服务端 Read 计量)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">双方采用不对称计量权，确保测速结果客观权威！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 阶段 T：遥测加密落盘与防篡改分享卡片 (Telemetry &amp; Share)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">POST /results/telemetry.php ──► IP 物理脱敏 ──► 生成 ULID 唯一卡片 ──► 存入数据库</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">严密状态机闭环，支撑商业级测速平台运营！</text>
      </g>
    </g>
  </g>
</svg>