<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Redis Lua 脚本原子库存扣减与防重模型 (Atomic Lua Gate)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. SISMEMBER 校验重复购买 ──► 2. GET stock 查剩余库存 ──► 3. DECRBY 原子扣减 ──► 4. SADD 记录买家 ID ｜ 纯内存原子单线程执行，绝对 0 超卖</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Lua Script -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 核心 Lua 原子扣减脚本 (EVALSHA 0ms)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">-- 1. 防重复购买校验</text>
          <text y="28" fill="#cbd5e1">if redis.call('sismember', KEYS[2], ARGV[1]) == 1 then return -1 end</text>
          
          <text y="48" fill="#38bdf8">-- 2. 库存充足性判断</text>
          <text y="62" fill="#cbd5e1">local stock = tonumber(redis.call('get', KEYS[1]) or 0)</text>
          <text y="76" fill="#f87171">if stock &lt;= 0 then return 0 end</text>
          
          <text y="96" fill="#38bdf8">-- 3. 原子扣减与买家记录</text>
          <text y="110" fill="#4ade80">redis.call('decrby', KEYS[1], 1)</text>
          <text y="124" fill="#4ade80">redis.call('sadd', KEYS[2], ARGV[1])</text>
          <text y="138" fill="#4ade80">return 1 -- 抢购成功！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Redis 单线程串行执行 Lua 保证绝对原子性；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 避免多次网络往返 (RTT) 产生的竞态空隙；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 单机轻松承载 80,000+ QPS 极限扣减！</text>
      </g>
    </g>

    <!-- Right: Compensation -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">超时未支付逆向回退补偿 (Rollback Flow)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">15 分钟延迟消息到达 / 用户主动取消：</text>
          
          <text y="36" fill="#86efac">1. 检查订单状态是否仍为 "UNPAID"</text>
          <text y="50" fill="#38bdf8">2. 数据库更新状态为 "CLOSED"</text>
          
          <text y="72" fill="#4ade80">3. 执行 Redis 回退 Lua 脚本：</text>
          <text y="86" fill="#34d399">   • redis.call('incrby', KEYS[1], 1)</text>
          <text y="100" fill="#34d399">   • redis.call('srem', KEYS[2], ARGV[1])</text>
          <text y="114" fill="#4ade80">4. 库存无损归还，后续用户可继续抢购！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 形成完整的正向扣减与逆向补偿闭环；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 保证商品最终售罄率 100%；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级电商大促核心生命线！</text>
      </g>
    </g>
  </g>
</svg>