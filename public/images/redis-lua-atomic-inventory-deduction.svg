<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="redis-lua-atomic-inventory-deduction-title redis-lua-atomic-inventory-deduction-desc"><title id="redis-lua-atomic-inventory-deduction-title">Redis Lua 原子脚本扣库存：原子性校验、防超卖与回退补偿闭环</title><desc id="redis-lua-atomic-inventory-deduction-desc">Redis Lua 原子脚本扣库存：原子性校验、防超卖与回退补偿闭环</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Redis Lua 脚本原子库存扣减与防重模型 (Atomic Lua Gate)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. SISMEMBER 校验重复购买 ──► 2. GET stock 查剩余库存 ──► 3. DECRBY 原子扣减 ──► 4. SADD 记录买家 ID ｜ 纯内存原子单线程执行，绝对 0 超卖</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 核心 Lua 原子扣减脚本 (EVALSHA 0ms)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">-- 1. 防重复购买校验</text>
          <text y="28" fill="#cbd5e1">if redis.call('sismember', KEYS[2], ARGV[1]) == 1 then return -1 end</text>

          <text y="48" fill="#f5f5f5">-- 2. 库存充足性判断</text>
          <text y="62" fill="#cbd5e1">local stock = tonumber(redis.call('get', KEYS[1]) or 0)</text>
          <text y="76" fill="#f5f5f5">if stock &lt;= 0 then return 0 end</text>

          <text y="96" fill="#f5f5f5">-- 3. 原子扣减与买家记录</text>
          <text y="110" fill="#f5f5f5">redis.call('decrby', KEYS[1], 1)</text>
          <text y="124" fill="#f5f5f5">redis.call('sadd', KEYS[2], ARGV[1])</text>
          <text y="138" fill="#f5f5f5">return 1 -- 抢购成功！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• Redis 单线程串行执行 Lua 保证绝对原子性；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 避免多次网络往返 (RTT) 产生的竞态空隙；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 单机轻松承载 80,000+ QPS 极限扣减！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">超时未支付逆向回退补偿 (Rollback Flow)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">15 分钟延迟消息到达 / 用户主动取消：</text>

          <text y="36" fill="#f5f5f5">1. 检查订单状态是否仍为 "UNPAID"</text>
          <text y="50" fill="#f5f5f5">2. 数据库更新状态为 "CLOSED"</text>

          <text y="72" fill="#f5f5f5">3. 执行 Redis 回退 Lua 脚本：</text>
          <text y="86" fill="#f5f5f5">   • redis.call('incrby', KEYS[1], 1)</text>
          <text y="100" fill="#f5f5f5">   • redis.call('srem', KEYS[2], ARGV[1])</text>
          <text y="114" fill="#f5f5f5">4. 库存无损归还，后续用户可继续抢购！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 形成完整的正向扣减与逆向补偿闭环；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 保证商品最终售罄率 100%；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级电商大促核心生命线！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
