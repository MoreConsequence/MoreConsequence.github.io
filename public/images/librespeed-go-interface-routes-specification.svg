<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LibreSpeed Go 接口矩阵：12 条核心路由功能与协议规格</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">兼容 PHP 经典路由契约 ｜ /empty.php ｜ /garbage.php ｜ /getIP.php ｜ /results/ ｜ /backend/ 遥测导出与管理</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Table Layout (900px wide) -->
    <g transform="translate(15, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Header -->
      <rect width="870" height="28" fill="#f1f5f9" rx="4"/>
      <text x="15" y="18" font-size="9" font-weight="700" fill="#475569">HTTP 方法</text>
      <text x="100" y="18" font-size="9" font-weight="700" fill="#475569">路由路径 (Path)</text>
      <text x="280" y="18" font-size="9" font-weight="700" fill="#475569">核心用途与功能</text>
      <text x="540" y="18" font-size="9" font-weight="700" fill="#475569">响应格式与状态码</text>
      <text x="730" y="18" font-size="9" font-weight="700" fill="#475569">缓存策略</text>

      <!-- Row 1 -->
      <g transform="translate(0, 34)">
        <rect width="870" height="38" fill="#ffffff" stroke="#f1f5f9"/>
        <rect x="15" y="10" width="38" height="18" rx="3" fill="#eff6ff"/><text x="22" y="22" font-size="8" font-weight="700" fill="#1d4ed8">GET</text>
        <text x="100" y="23" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#0f172a">/empty.php</text>
        <text x="280" y="23" font-size="8" fill="#334155">Ping 时延与 Jitter 抖动探测</text>
        <text x="540" y="23" font-size="8" fill="#166534">200 OK (0 字节空响应)</text>
        <text x="730" y="23" font-size="8" fill="#dc2626">no-store (无缓存)</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 76)">
        <rect width="870" height="38" fill="#f8fafc" stroke="#f1f5f9"/>
        <rect x="15" y="10" width="38" height="18" rx="3" fill="#f0fdf4"/><text x="20" y="22" font-size="8" font-weight="700" fill="#15803d">POST</text>
        <text x="100" y="23" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#0f172a">/empty.php</text>
        <text x="280" y="23" font-size="8" fill="#334155">上行吞吐量测试 (Upload Blackhole)</text>
        <text x="540" y="23" font-size="8" fill="#166534">200 OK (黑洞丢弃入参数据)</text>
        <text x="730" y="23" font-size="8" fill="#dc2626">no-store (无缓存)</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 118)">
        <rect width="870" height="38" fill="#ffffff" stroke="#f1f5f9"/>
        <rect x="15" y="10" width="38" height="18" rx="3" fill="#eff6ff"/><text x="22" y="22" font-size="8" font-weight="700" fill="#1d4ed8">GET</text>
        <text x="100" y="23" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#0f172a">/garbage.php</text>
        <text x="280" y="23" font-size="8" fill="#334155">下行带宽测试 (1MB*ckSize 随机流)</text>
        <text x="540" y="23" font-size="8" fill="#166534">200 OK (application/octet-stream)</text>
        <text x="730" y="23" font-size="8" fill="#dc2626">no-store (无缓存)</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 160)">
        <rect width="870" height="38" fill="#f8fafc" stroke="#f1f5f9"/>
        <rect x="15" y="10" width="38" height="18" rx="3" fill="#eff6ff"/><text x="22" y="22" font-size="8" font-weight="700" fill="#1d4ed8">GET</text>
        <text x="100" y="23" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#0f172a">/getIP.php</text>
        <text x="280" y="23" font-size="8" fill="#334155">客户端公网 IP 与 ISP 运营商探测</text>
        <text x="540" y="23" font-size="8" fill="#166534">200 OK (JSON / text: client IP)</text>
        <text x="730" y="23" font-size="8" fill="#dc2626">no-store (无缓存)</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(0, 202)">
        <rect width="870" height="38" fill="#ffffff" stroke="#f1f5f9"/>
        <rect x="15" y="10" width="38" height="18" rx="3" fill="#f0fdf4"/><text x="20" y="22" font-size="8" font-weight="700" fill="#15803d">POST</text>
        <text x="100" y="23" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#0f172a">/results/telemetry.php</text>
        <text x="280" y="23" font-size="8" fill="#334155">测速完成度量上报与加密落库</text>
        <text x="540" y="23" font-size="8" fill="#166534">200 OK (id: ULID 溯源标识)</text>
        <text x="730" y="23" font-size="8" fill="#dc2626">no-store (无缓存)</text>
      </g>

      <!-- Row 6 -->
      <g transform="translate(0, 244)">
        <rect width="870" height="38" fill="#f8fafc" stroke="#f1f5f9"/>
        <rect x="15" y="10" width="38" height="18" rx="3" fill="#eff6ff"/><text x="22" y="22" font-size="8" font-weight="700" fill="#1d4ed8">GET</text>
        <text x="100" y="23" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#0f172a">/results/stats.php</text>
        <text x="280" y="23" font-size="8" fill="#334155">管理员遥测历史大盘统计数据导出</text>
        <text x="540" y="23" font-size="8" fill="#166534">200 OK (JSON / CSV 格式化报表)</text>
        <text x="730" y="23" font-size="8" fill="#f59e0b">private, max-age=60</text>
      </g>

      <!-- Row 7 -->
      <g transform="translate(0, 286)">
        <rect width="870" height="38" fill="#ffffff" stroke="#f1f5f9"/>
        <rect x="15" y="10" width="38" height="18" rx="3" fill="#eff6ff"/><text x="22" y="22" font-size="8" font-weight="700" fill="#1d4ed8">GET</text>
        <text x="100" y="23" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#0f172a">/ (静态 HTML/JS)</text>
        <text x="280" y="23" font-size="8" fill="#334155">测速前端 UI 与 Web Worker 脚本</text>
        <text x="540" y="23" font-size="8" fill="#166534">200 OK (text/html, text/javascript)</text>
        <text x="730" y="23" font-size="8" fill="#10b981">public, max-age=86400</text>
      </g>
    </g>
  </g>
</svg>