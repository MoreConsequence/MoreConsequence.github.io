<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi RPC 双向流多路复用 (Multiplexing) 与连接保活拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">短连接轮询 (高延迟、高 CPU 开销) vs 单 TCP/Stdio 连接多路复用 (请求-响应、流式上报、心跳 Ping-Pong 共享单通道)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Short Polling -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ HTTP 短轮询：高延迟与握手开销</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">每 200ms 发起一次 HTTP GET /agent/status：</text>
          
          <text y="38" fill="#ef4444">架构劣势：</text>
          <text y="52" fill="#fca5a5">• 反复 TCP 握手与 TLS 加解密，浪费大量 CPU</text>
          <text y="68" fill="#ef4444">• 存在 200ms 固定时延，无法做到丝滑逐字打字机</text>
          <text y="84" fill="#ef4444">• 用户按 Ctrl+C 中止无法即时打断后台正在执行的任务！</text>
          
          <text y="106" fill="#f87171">🔴 传统 Web 轮询难以满足实时交互需求！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 延迟高、体验卡顿；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 缺乏实时双向控制能力；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 必须升级为双向流通道！</text>
      </g>
    </g>

    <!-- Right: Multiplexing Stream -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Pi RPC 多路复用：0 延迟双向全双工</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">单通道双向事件流多路复用：</text>
          
          <text y="36" fill="#86efac">1. 下行流: 毫秒级推送 Thought &amp; Tool 执行事件</text>
          <text y="50" fill="#38bdf8">2. 上行流: 客户端随时注入 userInput 或 abort 取消</text>
          <text y="64" fill="#34d399">3. 心跳检测: 5s Ping-Pong 自动重连自愈</text>
          <text y="78" fill="#4ade80">4. 延迟 &lt; 1ms，CPU 占用近乎 0%！</text>
          
          <text y="104" fill="#4ade80">✓ 打造极致流畅、电光火石般的开发体验！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 兼具极致性能与优雅的工程抽象；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑 IDE 插件与 CLI 共享同一套 Agent 后台；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化 Agent SDK 行业标杆！</text>
      </g>
    </g>
  </g>
</svg>