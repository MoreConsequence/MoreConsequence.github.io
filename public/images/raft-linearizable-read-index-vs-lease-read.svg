<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Raft 线性一致性读三代演进：Log Read vs ReadIndex vs Lease Read</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Log Read (每次读都走一遍 Raft 日志复制，吞吐低下) ｜ ReadIndex (只发一轮轻量心跳确认 Leader 身份) ｜ Lease Read (本地租约直读 0 网络 RPC)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. Log Read (最原始读机制)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 将读请求伪装成一条空写日志</text>
          <text x="10" y="34" fill="#93c5fd">1. 写本地 WAL 日志文件 (磁盘 I/O)</text>
          <text x="10" y="50" fill="#93c5fd">2. AppendEntries 向全网多数派广播</text>
          <text x="10" y="66" fill="#93c5fd">3. 多数派落盘提交后才返回查询数据</text>
          
          <text x="10" y="90" fill="#ef4444">🔴 性能代价：</text>
          <text x="10" y="106" fill="#fca5a5">• 读吞吐量被磁盘写入与多数派网络死死锁死；</text>
          <text x="10" y="122" fill="#ef4444">• QPS 无法突破 5,000/秒！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">机制评估：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 保证绝对线性一致，但吞吐代价过大；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 现代分布式存储系统均已彻底废弃该方案；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 仅作为 Raft 论文理论对照基准。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. ReadIndex (心跳确认模式)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 0 磁盘 I/O，仅需 1 轮轻量网络心跳</text>
          <text x="10" y="34" fill="#86efac">1. 记录当前 commitIndex 为 readIndex</text>
          <text x="10" y="50" fill="#38bdf8">2. 向 Follower 发送广播心跳 (Heartbeat)</text>
          <text x="10" y="66" fill="#34d399">3. 多数派确认自己仍是合法 Leader！</text>
          <text x="10" y="84" fill="#38bdf8">4. 等待本地 applyIndex &gt;= readIndex 后直读！</text>
          
          <text x="10" y="108" fill="#4ade80">✓ 绝对防范网络分区脑裂读到脏数据！</text>
          <text x="10" y="122" fill="#4ade80">✓ 读吞吐量提升 20 倍以上！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 广泛应用于 etcd、TiKV 等核心系统；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 不依赖任何机器物理时钟精度；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 兼顾绝对安全与高吞吐的工业基石。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. Lease Read (本地租约极速读)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 0 磁盘 I/O + 0 网络 RPC！</text>
          <text x="10" y="34" fill="#fed7aa">1. Leader 获得多数派租约 (如 500ms)</text>
          <text x="10" y="50" fill="#fed7aa">2. Follower 保证在 500ms 内绝不发起新选举</text>
          <text x="10" y="68" fill="#34d399">3. 在租约有效期内，Leader 本地内存直读返回！</text>
          
          <text x="10" y="92" fill="#4ade80">✓ 单机读 QPS 突破 100 万/秒！</text>
          <text x="10" y="108" fill="#fbbf24">⚠️ 约束: 依赖物理时钟漂移在安全误差内</text>
          <text x="10" y="122" fill="#34d399">✓ 极致性能天花板！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 结合 NTP 时钟漂移上界严格计算租约时长；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 让分布式共识读性能完全等同于单机内存读；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造超低延迟线性一致性读引擎！</text>
      </g>
    </g>
  </g>
</svg>