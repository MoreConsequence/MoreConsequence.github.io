<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="hnsw-hierarchical-navigable-small-world-layers-title hnsw-hierarchical-navigable-small-world-layers-desc"><title id="hnsw-hierarchical-navigable-small-world-layers-title">HNSW 向量索引分层拓扑：跳表结构、最近邻贪婪搜索与 efSearch 召回精度</title><desc id="hnsw-hierarchical-navigable-small-world-layers-desc">HNSW 向量索引分层拓扑：跳表结构、最近邻贪婪搜索与 efSearch 召回精度</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">HNSW 分层可导航小世界图索引拓扑 (Hierarchical NSW Index)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">顶层稀疏图大步长跳跃 (Layer 2) ──► 中间层快速收敛 (Layer 1) ──► 底层全量致密图局部贪婪贪婪探索 (Layer 0) ──► O(log N) 毫秒级 ANN 搜索</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Layer 2: 顶层高速公路</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">极度稀疏的节点分布：</text>

          <text x="10" y="38" fill="#f5f5f5">• 类似 SkipList 跳表顶层</text>
          <text x="10" y="54" fill="#f5f5f5">• 跨越巨大向量空间距离的大步长跨越</text>
          <text x="10" y="70" fill="#f5f5f5">• 快速确定目标向量所在的大致几何聚类</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 仅需 2~3 次距离计算！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 解决高维空间的维度灾难；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 避免陷入局部极小值；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造广域检索通道。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">2. Layer 1: 中间过渡层</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">中等密度拓扑图：</text>

          <text x="10" y="38" fill="#f5f5f5">• 以上一层的局部最优节点为入口 (Entry)</text>
          <text x="10" y="54" fill="#f5f5f5">• 实施贪婪近邻探索 (Greedy Search)</text>
          <text x="10" y="70" fill="#f5f5f5">• 迅速向目标向量所在社区逼近</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 步长逐步收窄，精度快速递增</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 保持小世界图的聚类聚集系数；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 几何距离衰减导向；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 平滑桥接宏观与微观。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. Layer 0: 全量致密图</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">包含 100% 原始全量向量：</text>

          <text x="10" y="38" fill="#f5f5f5">• 设定 efSearch 候选队列大小 (如 64)</text>
          <text x="10" y="54" fill="#f5f5f5">• 开展详尽的局部多路贪婪优先搜索</text>
          <text x="10" y="70" fill="#f5f5f5">• 精准输出距离最近的 Top-K 向量！</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 召回率高达 99.2%，耗时仅 2ms！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 支撑数千万级高维向量低延迟查询；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• Milvus / Qdrant / PgVector 核心算法底座；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 向量数据库时代的经典杰作！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
