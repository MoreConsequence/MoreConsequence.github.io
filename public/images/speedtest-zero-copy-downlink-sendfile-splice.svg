<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">下行压榨万兆网卡：传统 write 内存拷贝 vs sendfile / splice 零拷贝</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">传统 read/write (4 次上下文切换 + 4 次数据拷贝，CPU 100% 跑不满万兆) ｜ 零拷贝 (内核页表直连网卡 DMA，单核轻松打满 10Gbps)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Traditional write -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 write 拷贝：CPU 成为万兆死锁瓶颈</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. 用户态 Buffer ──► 内核态 PageCache (CPU Copy)</text>
          <text y="30" fill="#fca5a5">2. 内核态 Socket Buffer ──► 网卡 DMA 发送</text>
          <text y="46" fill="#fca5a5">3. 每次 write() 触发 2 次系统调用上下文切换！</text>
          
          <text y="70" fill="#ef4444">🔴 性能死穴：</text>
          <text y="86" fill="#fca5a5">• 吞吐达 4Gbps 时，CPU 内存带宽已彻底打满；</text>
          <text y="102" fill="#fb7185">• CPU 忙于在 用户空间 与 内核空间 之间搬运字节；</text>
          <text y="118" fill="#ef4444">• 无法支撑万兆 (10Gbps) 满载发包需求！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">物理代价：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 大量 CPU 缓存（L1/L2/L3）被无意义的搬运数据彻底污染；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 造成显著的 GC 停顿与内存总线争用；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 生产服务器不得不堆砌数十颗昂贵 CPU 核心！</text>
      </g>
    </g>

    <!-- Right: Zero Copy sendfile -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 生产零拷贝架构：sendfile / splice 直通网卡</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">1. 创建常驻 tmpfs 共享内存高熵大文件</text>
          <text y="28" fill="#86efac">2. 调用 Linux 系统调用 sendfile(socketFd, fileFd, ...)</text>
          
          <text y="50" fill="#38bdf8">3. 内核将文件缓冲区描述符直接传递给 Socket 队列</text>
          <text y="66" fill="#34d399">4. 网卡支持 SG-DMA (Scatter-Gather DMA) 直接从内存取包！</text>
          
          <text y="90" fill="#4ade80">✓ 零 CPU 数据拷贝，零用户态内存开销！</text>
          <text y="106" fill="#4ade80">✓ 单核 CPU 即可轻而易举压榨出 9.92 Gbps 万兆线速！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工程极致优化：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 结合 TCP Segmentation Offload (TSO) 网卡硬件分包；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 单台 2U 节点即可轻松承载 40Gbps / 100Gbps 极速压测；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造超低成本、极致吞吐的现代下行灌水引擎！</text>
      </g>
    </g>
  </g>
</svg>