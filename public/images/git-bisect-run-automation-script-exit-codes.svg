<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="git-bisect-run-automation-script-exit-codes-title git-bisect-run-automation-script-exit-codes-desc"><title id="git-bisect-run-automation-script-exit-codes-title">git bisect run 自动化脚本退出码规范：0 (Good), 1-127 (Bad), 125 (Skip…</title><desc id="git-bisect-run-automation-script-exit-codes-desc">git bisect run 自动化脚本退出码规范：0 (Good), 1-127 (Bad), 125 (Skip 无法编译)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">git bisect run 脚本退出码语义契约 (Exit Code Contract)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">exit 0 (当前版本好) ｜ exit 1..124/126..127 (当前版本坏) ｜ exit 125 (无法编译或中间损坏，告知 Git 自动 skip 跳过)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Exit 0: 测试通过 (Good)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">npm test / go test 成功通过：</text>

          <text x="10" y="38" fill="#f5f5f5">• 退出码返回 0</text>
          <text x="10" y="54" fill="#f5f5f5">• Git 将当前提交标记为 good</text>
          <text x="10" y="70" fill="#f5f5f5">• 缩小搜索区间至 [mid, bad]</text>
          <text x="10" y="86" fill="#f5f5f5">• 自动检出下一个更晚的中间提交</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 判定当前版本功能正常！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 表明引入回归的 Bug 在当前提交之后；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 向右侧半区继续二分；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 推进追凶边界。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. Exit 1: 测试失败 (Bad)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">测试脚本断言失败：</text>

          <text x="10" y="38" fill="#f5f5f5">• 退出码返回 1 (或 1~127 非 125)</text>
          <text x="10" y="54" fill="#f5f5f5">• Git 将当前提交标记为 bad</text>
          <text x="10" y="70" fill="#f5f5f5">• 缩小搜索区间至 [good, mid]</text>
          <text x="10" y="86" fill="#f5f5f5">• 自动检出更早的历史提交验证</text>

          <text x="10" y="114" fill="#f5f5f5">🔴 确认当前版本已经损坏！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 表明 Bug 在当前提交或更早的提交中；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 向左侧半区继续二分；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 逼近破案原点。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. Exit 125: 编译报错 (Skip)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">遇到无法编译的脏提交：</text>

          <text x="10" y="38" fill="#f5f5f5">• 例如某历史提交临时语法错误</text>
          <text x="10" y="54" fill="#f5f5f5">• 脚本捕获编译失败并 exit 125</text>
          <text x="10" y="70" fill="#f5f5f5">• Git 自动执行 git bisect skip</text>
          <text x="10" y="86" fill="#f5f5f5">• 智能挑选临近其他提交继续二分！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 杜绝因无关编译错误中断全流程！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 极度精妙的特殊保留退出码；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 赋予自动化测试脚本超强的抗扰自愈能力；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• Git 高级工程实践权威规范！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
