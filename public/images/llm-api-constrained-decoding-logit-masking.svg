<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">结构化输出（Structured Outputs）与受限解码 Logit Masking 机理</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">JSON Schema 编译为上下文无关文法（CFG/FSM） ──► 采样时刻 Logit Masking 强制置为 -∞ ──► 100% 格式数学保证</text>
  </g>

  <!-- Main Pipeline (900px wide) -->
  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 3 Core Horizontal Pipeline Columns (270px + 290px + 270px) -->
    <g transform="translate(20, 20)">
      <!-- Col 1: Schema Compilation -->
      <g>
        <rect width="265" height="345" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
        <rect width="265" height="30" rx="6" fill="#dbeafe"/>
        <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">
          1. JSON Schema 编译阶段
        </text>

        <g transform="translate(12, 40)" font-family="ui-sans-serif, system-ui, sans-serif">
          <rect width="241" height="50" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
          <text x="10" y="16" font-size="9" font-weight="700" fill="#1d4ed8">客户端 Strict Schema：</text>
          <text x="10" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#2563eb">"properties": { "age": { "type": "number" } }</text>

          <!-- Arrow Down -->
          <path d="M 120 52 L 120 72" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

          <!-- FSM State Graph -->
          <g transform="translate(0, 74)">
            <rect width="241" height="135" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
            <text x="10" y="16" font-size="9" font-weight="700" fill="#1e40af">编译为有限状态机 (FSM / CFG)：</text>

            <!-- State 0 -->
            <circle cx="35" cy="50" r="16" fill="#2563eb"/>
            <text x="35" y="54" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">S0</text>
            <text x="35" y="76" font-size="7" fill="#64748b" text-anchor="middle">期望 '{'</text>

            <!-- Line S0 -> S1 -->
            <line x1="51" y1="50" x2="85" y2="50" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
            <text x="68" y="44" font-size="7" fill="#2563eb" text-anchor="middle">'{'</text>

            <!-- State 1 -->
            <circle cx="105" cy="50" r="16" fill="#2563eb"/>
            <text x="105" y="54" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">S1</text>
            <text x="105" y="76" font-size="7" fill="#64748b" text-anchor="middle">期望 '"age"'</text>

            <!-- Line S1 -> S2 -->
            <line x1="121" y1="50" x2="155" y2="50" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
            <text x="138" y="44" font-size="7" fill="#2563eb" text-anchor="middle">': '</text>

            <!-- State 2 -->
            <circle cx="175" cy="50" r="16" fill="#10b981"/>
            <text x="175" y="54" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">S2</text>
            <text x="175" y="76" font-size="7" fill="#166534" text-anchor="middle">期望数字</text>

            <text x="10" y="110" font-size="8" fill="#1e40af">• 将每个合法转移绑定到词表 Token 集合</text>
            <text x="10" y="124" font-size="8" fill="#1e40af">• 构建前缀树（Trie / Aho-Corasick）加速检索</text>
          </g>

          <text x="0" y="278" font-size="8.5" fill="#1d4ed8">
            • 离线预编译仅需数毫秒，后续 Token 生成零额外开销
          </text>
        </g>
      </g>

      <!-- Conveyor Arrow 1 -->
      <path d="M 270 190 L 290 190" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

      <!-- Col 2: Logit Masking in Action -->
      <g transform="translate(295, 0)">
        <rect width="280" height="345" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
        <rect width="280" height="30" rx="6" fill="#ffedd5"/>
        <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">
          2. 采样时刻 Logit Masking 物理过滤
        </text>

        <g transform="translate(12, 40)" font-family="ui-sans-serif, system-ui, sans-serif">
          <!-- Step: Generating at State S2 -->
          <rect width="256" height="36" rx="4" fill="#ffffff" stroke="#fed7aa"/>
          <text x="10" y="16" font-size="8.5" font-weight="700" fill="#9a3412">当前处于 State S2 (必须生成数字):</text>
          <text x="10" y="28" font-size="7.5" fill="#c2410c">已生成: `{"age": `</text>

          <!-- Vocabulary Filtering Table -->
          <g transform="translate(0, 44)">
            <rect width="256" height="150" rx="4" fill="#0f172a"/>
            <text x="10" y="18" font-size="8.5" font-weight="700" fill="#38bdf8">128,000 词表 Logits 过滤表：</text>

            <!-- Row 1: Valid -->
            <g transform="translate(10, 26)">
              <rect width="236" height="24" rx="3" fill="#1e293b"/>
              <text x="8" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#34d399">Token "2" (数字):</text>
              <text x="120" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">Logit = 8.42 (保留原值)</text>
            </g>

            <!-- Row 2: Valid -->
            <g transform="translate(10, 54)">
              <rect width="236" height="24" rx="3" fill="#1e293b"/>
              <text x="8" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#34d399">Token "18" (数字):</text>
              <text x="120" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">Logit = 9.10 (保留原值)</text>
            </g>

            <!-- Row 3: Invalid Alpha -->
            <g transform="translate(10, 82)">
              <rect width="236" height="24" rx="3" fill="#3b0764"/>
              <text x="8" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#f87171">Token "abc" (文本):</text>
              <text x="120" y="16" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#fb7185">Logit ──► -∞</text>
            </g>

            <!-- Row 4: Invalid Comma -->
            <g transform="translate(10, 110)">
              <rect width="236" height="24" rx="3" fill="#3b0764"/>
              <text x="8" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#f87171">Token "," (逗号):</text>
              <text x="120" y="16" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#fb7185">Logit ──► -∞</text>
            </g>
          </g>

          <text x="0" y="278" font-size="8.5" fill="#9a3412">
            • 数学证明：$e^{-\infty} = 0$，非法字符 Softmax 概率为 0%！
          </text>
        </g>
      </g>

      <!-- Conveyor Arrow 2 -->
      <path d="M 580 190 L 600 190" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-emerald)"/>

      <!-- Col 3: Mathematical Guarantee -->
      <g transform="translate(605, 0)">
        <rect width="255" height="345" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="255" height="30" rx="6" fill="#dcfce7"/>
        <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">
          3. 100% 格式绝对保证
        </text>

        <g transform="translate(12, 40)" font-family="ui-sans-serif, system-ui, sans-serif">
          <rect width="231" height="85" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="10" y="18" font-size="9.5" font-weight="700" fill="#14532d">✓ 核心收益：</text>
          <text x="10" y="34" font-size="8" fill="#15803d">• 客户端 JSON.parse 100% 成功</text>
          <text x="10" y="48" font-size="8" fill="#15803d">• 彻底消灭语法重试网络往返</text>
          <text x="10" y="62" font-size="8" fill="#15803d">• 消除格式幻觉，注意力集中于字段内容</text>
          <text x="10" y="76" font-size="8" font-weight="700" fill="#047857">• 节省 20%~40% 无效 Token 开销！</text>

          <rect y="95" width="231" height="100" rx="4" fill="#dcfce7" stroke="#34d399"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#065f46">主流引擎实现库：</text>
          <text x="10" y="34" font-size="8" fill="#047857">• <tspan font-weight="700">Outlines</tspan> (基于 Regex/FSM 索引)</text>
          <text x="10" y="48" font-size="8" fill="#047857">• <tspan font-weight="700">XGrammar</tspan> (字节级高效文法树)</text>
          <text x="10" y="62" font-size="8" fill="#047857">• <tspan font-weight="700">SGLang</tspan> (Jump-forward 投机解码加速)</text>
          <text x="10" y="78" font-size="8" font-weight="700" fill="#166534">已全量集成至 vLLM / SGLang / OpenAI</text>
        </g>
      </g>
    </g>
  </g>
</svg>
