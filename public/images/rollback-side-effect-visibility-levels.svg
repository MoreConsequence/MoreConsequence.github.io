<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rsevTitle rsevDesc">
<title id="rsevTitle">副作用的三个可见性等级</title>
<desc id="rsevDesc">副作用按谁已经观测到它分为三级。L1 内部未提交，只有执行它的事务知道，可无损撤销，由数据库管理系统保证。L2 已提交但未外泄，同一系统内的其他事务与你控制下的进程能看到，需要显式的语义逆操作，且不能盲目恢复旧值。L3 已越过系统边界，用户、第三方系统、对账文件与物理世界都已观测到，不可撤销，只能追加一条新事实。系统边界是分界线：越过它，撤销就从「让旧事没发生过」变成「发布一条新事实」。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">按「谁已经观测到它」分级，而不是按「有没有状态」</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">数据库有事务，是整个系统里最容易回滚的一层</text>

<text x="68" y="90" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.12em">等级</text>
<text x="300" y="90" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.12em">谁已经观测到</text>
<text x="660" y="90" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.12em">可逆性</text>

<!-- L1 -->
<rect x="48" y="100" width="864" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<line x1="286" y1="116" x2="286" y2="180" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="646" y1="116" x2="646" y2="180" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="68" y="130" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L1</text>
<text x="68" y="158" fill="#2d3142" font-size="13.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">内部未提交</text>
<text x="68" y="180" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">事务内、内存里、还没投递</text>
<text x="300" y="130" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">观测者</text>
<text x="300" y="156" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">只有执行它的那一个事务</text>
<text x="300" y="176" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">还没有任何外部观察者</text>
<text x="660" y="130" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">可逆性</text>
<text x="660" y="156" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">可无损撤销</text>
<text x="660" y="176" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">DBMS 保证，不需要你写代码</text>

<!-- L2 -->
<rect x="48" y="208" width="864" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<line x1="286" y1="224" x2="286" y2="288" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="646" y1="224" x2="646" y2="288" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="68" y="238" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L2</text>
<text x="68" y="266" fill="#2d3142" font-size="13.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">已提交，但未外泄</text>
<text x="68" y="288" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">写进库了，但没人从外部读过</text>
<text x="300" y="238" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">观测者</text>
<text x="300" y="264" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">同一系统内的其他事务</text>
<text x="300" y="284" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">以及你控制之下的进程</text>
<text x="660" y="238" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">可逆性</text>
<text x="660" y="264" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">需显式逆操作</text>
<text x="660" y="284" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不能盲目恢复旧值，会覆盖他人改动</text>

<!-- system boundary -->
<rect x="355" y="312" width="250" height="14" fill="#f5f5f5"/>
<text x="480" y="323" fill="#eb6c36" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">系统边界：越过这条线，撤销变成发布一条新事实</text>
<line x1="48" y1="332" x2="912" y2="332" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6 4"/>

<!-- L3 (accent) -->
<rect x="48" y="346" width="864" height="96" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<line x1="286" y1="362" x2="286" y2="426" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="646" y1="362" x2="646" y2="426" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="68" y="376" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L3</text>
<text x="68" y="404" fill="#2d3142" font-size="13.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">已越过系统边界</text>
<text x="68" y="426" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">消息已投递、通知已发出、用户已看见</text>
<text x="300" y="376" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">观测者</text>
<text x="300" y="402" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">用户、第三方系统、对账文件</text>
<text x="300" y="422" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">以及物理世界（已发货、已出票）</text>
<text x="660" y="376" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">可逆性</text>
<text x="660" y="402" fill="#eb6c36" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不可撤销</text>
<text x="660" y="422" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">只能追加一条相反方向的新事实</text>

<!-- footer -->
<line x1="48" y1="466" x2="912" y2="466" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="48" y="486" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">L3 的不可逆性不是技术限制，是信息论限制——你无法让一个已经接收到信息的观察者忘记它。</text>
<text x="48" y="502" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">既然撤销等价于发布一条新事实，它就必须走和正向流程同等的可靠性保证</text>

</svg>
