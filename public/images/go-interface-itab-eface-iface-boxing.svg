<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 接口底层物理布局：eface (空接口) vs iface (带方法 itab 动态分派)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">16B 结构 (类型元数据指针 + 数据指针) ｜ itab 虚函数方法表缓存 (动态分派仅 2.1ns) ｜ 标量零装箱 vs 大对象堆分配</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: eface vs iface Layout -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 接口 16 字节结构体物理切片</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="65" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">type eface struct { // any / interface{}</text>
          <text y="30" fill="#93c5fd">    _type *_type         // 8B: 纯动态类型元数据指针</text>
          <text y="46" fill="#93c5fd">    data  unsafe.Pointer // 8B: 实体真实数据指针</text>
          <text y="60" fill="#38bdf8">}</text>
        </g>

        <g transform="translate(0, 75)">
          <rect width="405" height="75" rx="4" fill="#0f172a"/>
          <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
            <text y="14" fill="#38bdf8">type iface struct { // io.Reader / 自定义带方法接口</text>
            <text y="30" fill="#93c5fd">    tab  *itab          // 8B: 接口类型 + 实体类型 + 方法函数指针表</text>
            <text y="46" fill="#93c5fd">    data unsafe.Pointer // 8B: 实体真实数据指针</text>
            <text y="62" fill="#38bdf8">}</text>
          </g>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">动态分派极速奥秘：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• itab 在全局哈希表中缓存，初始化一次终身复用；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 接口方法调用直接寻址: iface.tab.fun[0](iface.data)；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 单次动态调用开销仅 2.1ns，几乎等同于直接函数指针调用！</text>
      </g>
    </g>

    <!-- Right: Boxing & Nil Trap -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 装箱成本与经典的 nil != nil 陷阱</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="60" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">// 标量装箱优化 (Go 1.15+)</text>
          <text y="30" fill="#fed7aa">小于等于 8 字节且不取地址的标量 (如 int, bool, 指针)</text>
          <text y="46" fill="#34d399">直接存储在 data 槽位中，实现 0 内存分配装箱！</text>
        </g>

        <g transform="translate(0, 68)">
          <rect width="405" height="85" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">🔴 终极经典陷阱：var p *MyErr = nil 赋值给 error</text>
          <text x="10" y="34" font-family="ui-monospace, monospace" font-size="7.5" fill="#7f1d1d">var err error = p</text>
          <text x="10" y="50" font-family="ui-monospace, monospace" font-size="7.5" fill="#dc2626">err == nil 判定结果为 FALSE (假)！</text>
          <text x="10" y="68" font-size="7.5" fill="#7f1d1d">原因：err 的 tab 非空 (存储了 *MyErr 类型信息)，仅 data 为 nil！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">生产防坑军规：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 返回 error 接口时，发生成功分支必须显式写 return nil；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 严禁返回值为 nil 的具体结构体指针变量给 error 接口！</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#ea580c">• 只有 tab 和 data 同时为 nil 时，接口才等于 nil！</text>
      </g>
    </g>
  </g>
</svg>