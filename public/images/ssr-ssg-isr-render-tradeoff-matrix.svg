<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">全栈渲染模式权衡：CSR vs SSR vs SSG vs ISR 架构四象限</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">从客户端水合 (Hydration)、首屏时延 (TTFB / FCP)、服务器动态计算成本到边缘 CDN 缓存命中率</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. CSR 客户端渲染 (Client-Side Rendering: SPA)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">服务器返回空白 HTML ──► 浏览器下载 2MB JS ──► 客户端执行并发送 API 请求 ──► 渲染页面</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">首屏白屏时间较长，SEO 不友好；但二次路由切换极致丝滑，非常适合企业级后台 SaaS！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. SSR 服务端动态渲染 (Server-Side Rendering)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">每次请求由 Node.js 实时查库并渲染 HTML 直出 ──► 浏览器秒开完整页面 ──► 客户端执行 Hydration 水合</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">SEO 极佳、首屏极快；但服务器 CPU 压力大，TTFB 受数据库查询延迟制约！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. SSG 静态预渲染 (Static Site Generation - 本站架构)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">构建期 npm run build 生成纯静态 HTML/SVG ──► 部署至全球 CDN 边缘节点 ──► 0 服务器计算开销</text>
        <text x="15" y="62" font-size="8" fill="#047857">TTFB 压制在 10ms 以内，抗百万 QPS 突发流量，高可用与成本的绝对天花板！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. ISR 增量静态再生 (Incremental Static Regeneration)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">静态缓存优先响应 ──► 后台异步触发重新构建 (Stale-While-Revalidate) ──► 动态平滑更新边缘静态页</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">兼具 SSG 的极速边缘响应与 SSR 的动态内容时效性，现代大型电商与内容站首选！</text>
      </g>
    </g>
  </g>
</svg>