<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">RFC 2308 DNS 负向缓存 (Negative Caching) 与 SOA MINIMUM 陷阱</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">查询不存在的域名返回 NXDOMAIN (附带 SOA 记录) ──► 递归解析器将“不存在”结论缓存 MINIMUM TTL (如 86400s) ──► 刚配好的新域名无法访问</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Negative Caching Trap -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 运维暗坑：提前访问未配置的域名 (NXDOMAIN 缓存)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. 新服务未上线前手痒访问: api.newservice.com</text>
          <text y="28" fill="#ef4444">2. 权威 DNS 返回: NXDOMAIN (Non-Existent Domain)</text>
          
          <text y="50" fill="#ef4444">💥 SOA 记录携带: MINIMUM = 86400 (整整 24 小时！)</text>
          
          <text y="74" fill="#fca5a5">3. 随后在后台添加了 A 记录解析 ──► 以为立即生效</text>
          <text y="88" fill="#ef4444">4. 结果：Local DNS 牢牢缓存“不存在”，整整 1 天内持续报错！</text>
          <text y="104" fill="#f87171">🔴 导致新业务上线全局瘫痪！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 极难排查，不同网络节点表现不一致；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 即使刷新客户端 DNS 也无法改变公共 Local DNS 缓存；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须规范上线前 DNS 配置流程！</text>
      </g>
    </g>

    <!-- Right: Solution -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正确防御：调优 SOA MINIMUM 与主动刷新</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 策略 1: 权威 DNS 调小 SOA Negative TTL</text>
          <text y="28" fill="#86efac">example.com. IN SOA ns1.example.com. admin.example.com. (</text>
          <text y="42" fill="#38bdf8">    2026083001 ; Serial</text>
          <text y="56" fill="#34d399">    60         ; Negative Cache TTL (设为 60 秒！)</text>
          <text y="70" fill="#86efac">)</text>
          
          <text y="92" fill="#4ade80">// 策略 2: 变更后使用公共 DNS 刷新 API (Google / 1.1.1.1 Purge)</text>
          <text y="106" fill="#4ade80">✓ 即使误触发 NXDOMAIN，60 秒内即可自动恢复！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 赋予线上发布极强的容错弹性；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 避免因误触导致的长达数小时的业务中断；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化 SRE 域名运维核心规范！</text>
      </g>
    </g>
  </g>
</svg>