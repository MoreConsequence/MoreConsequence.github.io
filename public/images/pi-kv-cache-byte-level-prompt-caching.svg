<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">KV Cache 字节级对齐：Prompt Caching 缓存命中率从 0% 提升至 98%</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">动态前缀插入破坏缓存 (0% 命中，天价账单) vs 静态前缀严格冻结 + 尾部增量 Append (98% 命中，享受 1 折价格与毫秒级首字延迟)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Cache Miss Anti-Pattern -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 错误姿势：动态变量污染前缀导致 0% 命中</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 在 System Prompt 顶部插入动态时间戳</text>
          <text y="28" fill="#fca5a5">"Current Time: " + Date.now() + "
" + SystemPrompt</text>
          
          <text y="52" fill="#ef4444">🔴 灾难性后果：</text>
          <text y="68" fill="#fb7185">1. 每一个毫秒的改变都会彻底使整个 50k 上下文的前缀哈希失效！</text>
          <text y="84" fill="#ef4444">2. 供应商 GPU 每次都必须从第 0 个 Token 重新做 Attention 计算！</text>
          <text y="102" fill="#f87171">3. Prompt Caching 命中率 = 0%，成本增加 10 倍！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产陷阱：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 随机 UUID、动态系统时间严禁放入前缀；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 工具列表乱序排列同样会击穿缓存；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 极易被工程师忽视的隐蔽性能杀手！</text>
      </g>
    </g>

    <!-- Right: Cache Hit Best Practice -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正确姿势：静态不可变前缀 + 尾部追加</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 严格遵循 KV Cache 字节级对齐规范</text>
          <text y="28" fill="#86efac">1. [静态 System Prompt + 字典序工具定义] (前 50k Tokens 绝对不可变！)</text>
          <text y="44" fill="#38bdf8">2. [会话历史 Append-Only 追加] (只在末尾增加新 Turn)</text>
          <text y="60" fill="#fed7aa">3. [当前动态时间/环境] (以独立 User Message 放在最末尾！)</text>
          
          <text y="88" fill="#34d399">✓ 供应商 GPU 100% 命中已有 KV Cache 显存指针！</text>
          <text y="104" fill="#4ade80">✓ 首字时延 (TTFT) 从 4000ms 骤降至 180ms！</text>
          <text y="120" fill="#4ade80">✓ Token 计费直接打 1 折 (节省 90% 资金)！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 深度理解大模型物理硬件推理工作原理；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 用纯软件工程技巧撬动数十倍性能与成本飞跃；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造商业化 Agent 必修的内功底牌！</text>
      </g>
    </g>
  </g>
</svg>