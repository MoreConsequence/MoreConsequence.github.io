<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Map 内存永不缩容陷阱与自愈重置方案</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">delete(m, k) 仅清空槽位数据但绝不减少已分配的 2^B 个桶 ｜ 存过 1000 万条记录的 Map 即使清空仍常驻数 GB 内存 ｜ 必须定时置 nil 重新 make</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Map Leak -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ delete 永不缩容：幽灵内存持续常驻</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">1. 业务高峰期写入 10,000,000 条 Key ──► 扩容至 B=21 (约 200 万个桶)</text>
          <text y="28" fill="#f87171">2. 进程占用内存达到 2.5GB</text>
          
          <text y="50" fill="#ef4444">3. 随后执行 delete 删除了 9,999,999 条数据：</text>
          <text y="66" fill="#ef4444">• len(m) 变为 1</text>
          <text y="82" fill="#ef4444">• 但 200 万个 bmap 桶内存结构体绝对不释放！</text>
          <text y="98" fill="#f87171">• 进程依然死死霸占 2.5GB 内存无法归还操作系统！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 长时间运行的微服务内存不断膨胀虚高；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 极易在下一次突发峰值时触发 OOM-Killed；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• Go 最知名的内存设计特性！</text>
      </g>
    </g>

    <!-- Right: Map Reset -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 定时置换与重建：彻底归还内存</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 黄金实践：周期性新建 Map 覆盖旧实例</text>
          <text y="28" fill="#86efac">newMap := make(map[string]Val, len(oldMap))</text>
          <text y="42" fill="#38bdf8">for k, v := range oldMap { newMap[k] = v }</text>
          <text y="56" fill="#34d399">holder.Store(&amp;newMap) // 原子替换对外引用</text>
          <text y="70" fill="#4ade80">oldMap = nil          // 释放旧大 Map 引用！</text>
          
          <text y="94" fill="#4ade80">✓ 下一次 GC 瞬间将数 GB 旧桶数组彻底回收！</text>
          <text y="110" fill="#34d399">内存占用平稳回落至 10MB，系统恢复健康！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 维持长周期运行服务的极低常驻内存基线；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 杜绝内存泄漏隐患；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 高可靠后端生产级治理标准！</text>
      </g>
    </g>
  </g>
</svg>