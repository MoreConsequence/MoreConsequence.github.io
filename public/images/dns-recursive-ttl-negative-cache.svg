<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DNS 逐跳递归缓存与 SOA 负向缓存 (NXDOMAIN) 机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Local DNS 缓存穿透 ｜ 正向 A 记录 TTL 递减 ｜ SOA 记录 Minimum TTL 锁死错误解析</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Box: Resolution Hop (420px) -->
    <g transform="translate(20, 20)">
      <rect width="420" height="345" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="420" height="30" rx="6" fill="#dbeafe"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">1. DNS 四级逐跳缓存递减机制</text>

      <g transform="translate(15, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="390" height="38" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="10" y="22" font-size="8.5" font-weight="700" fill="#1d4ed8">1. 浏览器/OS 缓存 (TTL=60s: 最短生命周期)</text>

        <rect y="44" width="390" height="38" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="10" y="22" font-size="8.5" font-weight="700" fill="#1d4ed8">2. Local DNS (运营商 114.114.114.114 / 8.8.8.8)</text>

        <rect y="88" width="390" height="38" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="10" y="22" font-size="8.5" font-weight="700" fill="#1d4ed8">3. 权威 DNS (Authoritative Server: 真实配置 300s)</text>

        <rect y="136" width="390" height="90" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// 为什么改了权威 DNS 无法立即全网生效？</text>
          <text y="30" fill="#93c5fd">• 各省运营商 Local DNS 存在独立 TTL 倒计时器</text>
          <text y="46" fill="#93c5fd">• 部分劣质 Local DNS 强行篡改 TTL 锁死缓存 24 小时</text>
          <text y="64" fill="#34d399">► 生产切流量必须提前 1 天将 TTL 降至 60 秒！</text>
        </g>
      </g>
    </g>

    <!-- Right Box: Negative Caching SOA (420px) -->
    <g transform="translate(460, 20)">
      <rect width="420" height="345" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
      <rect width="420" height="30" rx="6" fill="#fecaca"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">2. 致命陷阱：SOA 负向缓存 (Negative TTL)</text>

      <g transform="translate(15, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="390" height="110" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">NXDOMAIN 域名不存在错误缓存流程：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">1. 上线前配置失误，用户访问了未绑定的新域名 api.test.com</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">2. 权威 DNS 返回 NXDOMAIN 错误 + SOA 记录 (TTL=86400s)</text>
        <text x="10" y="64" font-size="7.5" font-weight="700" fill="#dc2626">3. Local DNS 将"域名不存在"强行缓存整整 1 天！</text>
        <text x="10" y="80" font-size="7.5" fill="#7f1d1d">4. 即使你 1 秒后在权威后台补齐了解析，用户依然全天报 404！</text>

        <rect y="120" width="390" height="105" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// RFC 2308 破局解法：</text>
          <text y="30" fill="#86efac">1. 检查 SOA 记录末尾的 MINTTL (负向缓存时间)</text>
          <text y="46" fill="#86efac">2. 强制将 SOA MINTTL 从默认 86400 改为 300 秒</text>
          <text y="64" fill="#fbbf24">3. 采用 HTTPDNS (绕过运营商 Local DNS 递归劫持)</text>
          <text y="80" fill="#38bdf8">4. 客户端直连权威 IP，彻底消除负向缓存黑洞！</text>
        </g>
      </g>
    </g>
  </g>
</svg>