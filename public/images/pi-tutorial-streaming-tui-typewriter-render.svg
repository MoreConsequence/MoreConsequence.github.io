<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">终端 ANSI 转义码与流式打字机渲染机理 (ANSI Escape Codes)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 隐藏光标 \x1b[?25l ──► 2. 逐 Token 增量输出 ──► 3. 动态旋转加载动画 (Spinner) ──► 4. 恢复光标 \x1b[?25h</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 终端渲染模式初始化 (Terminal Raw Mode &amp; Hide Cursor)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">向 stdout 发送 \x1b[?25l 隐藏闪烁光标 ──► 开启 Raw Mode 捕获键盘即时按键</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">终端高级渲染的基础环境准备！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 异步思考动态动画 (Thought Spinner Frame: ⠋ ⠙ ⠹ ⠸ ⠼)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">每 80ms 擦除当前行 \r\x1b[K 并重绘下一个 Braille 字符 ──► 消除用户等待的焦虑感</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">现代命令行工具的灵动呼吸感！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 流式文本即时无闪烁打字机 (Instant Typewriter Stream)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">收到 text_delta 立即 process.stdout.write(chunk) ──► 0 缓冲延迟 ──► 完美与大模型生成同步</text>
        <text x="15" y="62" font-size="8" fill="#047857">极具沉浸感的高速代码生成视觉呈现！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 终端恢复与下一轮就绪 (Reset Attributes &amp; Show Cursor)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">发送 \x1b[0m 重置所有字体颜色 ──► 发送 \x1b[?25h 恢复光标 ──► 换行等待用户下一次输入！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">精细考究的终端编程标准！</text>
      </g>
    </g>
  </g>
</svg>