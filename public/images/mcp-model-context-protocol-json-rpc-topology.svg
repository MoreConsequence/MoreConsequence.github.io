<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="mcp-model-context-protocol-json-rpc-topology-title mcp-model-context-protocol-json-rpc-topology-desc"><title id="mcp-model-context-protocol-json-rpc-topology-title">模型上下文协议 (MCP) 分层拓扑：Host, Client 与 Local/Remote Server…</title><desc id="mcp-model-context-protocol-json-rpc-topology-desc">模型上下文协议 (MCP) 分层拓扑：Host, Client 与 Local/Remote Server JSON-RPC 通信</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">模型上下文协议 (MCP: Model Context Protocol) 全景三层拓扑</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Host (IDE/Chat UI) ──► MCP Client ──► JSON-RPC 2.0 (stdio/SSE) ──► 本地/远程 MCP Server (Resources, Prompts, Tools)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. MCP Host (应用宿主层)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">Cursor / Claude Desktop / Antigravity:</text>

          <text x="10" y="38" fill="#f5f5f5">• 用户人机交互界面与权限批准窗</text>
          <text x="10" y="54" fill="#f5f5f5">• 维护 LLM 对话上下文会话树</text>
          <text x="10" y="70" fill="#f5f5f5">• 统一生命周期管理多个 Client 实例</text>

          <text x="10" y="100" fill="#f5f5f5">✓ Agent 系统的上层统一入口！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">职责定位：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 负责安全沙箱策略与人工确认；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 协调多个模型与插件服务；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造一体化智能开发环境。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. JSON-RPC 2.0 传输桥梁</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">双向结构化通信管道：</text>

          <text x="10" y="38" fill="#f5f5f5">• stdio: 标准输入输出管道 (本地极速 0 延迟)</text>
          <text x="10" y="54" fill="#f5f5f5">• SSE: HTTP Server-Sent Events (远程云端服务)</text>
          <text x="10" y="70" fill="#f5f5f5">• tools/list 协议发现 ｜ tools/call 动态调用</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 终结 N 厂商 * M 插件的 N*M 适配噩梦！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 类似 LSP (Language Server Protocol) 统一天下；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 一次编写，适配所有兼容 MCP 的 AI 宿主；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 生态扩展性极强。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. MCP Server (能力提供端)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">三大核心能力支柱：</text>

          <text x="10" y="38" fill="#f5f5f5">• Resources: 静态文件/只读数据流暴露</text>
          <text x="10" y="54" fill="#f5f5f5">• Prompts: 预置可复用的专业提示词模板</text>
          <text x="10" y="70" fill="#f5f5f5">• Tools: 可调用的具体函数与命令操作</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 赋予 AI 直接操控真实世界代码与系统的神力！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">经典生态：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• Postgres MCP, Git MCP, Filesystem MCP；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 彻底解耦业务能力与底层大模型；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级 AI 协议标准终极形态！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
