<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi Subagent 树状层级委派与上下文隔离拓扑 (Hierarchical Delegation)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. Root Orchestrator (掌控全局目标) ──► 2. 独立派发 Research / Code / Test Subagents ──► 3. 各子代理专属小窗口 ──► 4. 汇聚高价值结论</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 根代理全局规划与上下文保护 (Root Orchestrator)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">保持根上下文高度纯净 (&lt; 20k Tokens) ──► 负责分解宏观目标、派发子任务并做最终把关</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">多 Agent 系统的中枢大脑！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 特化子代理独立会话沙箱 (Isolated Subagent Context Sessions)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">Research Subagent (深潜阅读 10 篇源码文件，消耗 80k Tokens，提炼出 500 字结论返回)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将海量中间垃圾细节完全隔离在子代理生命周期内！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 并发编程与测试验证工作流 (Parallel Coder &amp; Tester Subagents)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Coder 代理专注生成补丁 ──► Tester 代理在沙箱并发执行回归 ──► 报错自动在子代理内部自愈修复</text>
        <text x="15" y="62" font-size="8" fill="#047857">极大提升复杂任务交付效率！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 极速销毁与状态汇总 (Subagent Lifecycle Teardown &amp; Summary Merge)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">子代理任务完成瞬间释放全部上下文内存 ──► 仅将最终交付物合并至主工作区 ──► 达成最高工程优雅性！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">解决大模型上下文膨胀的终极武器！</text>
      </g>
    </g>
  </g>
</svg>