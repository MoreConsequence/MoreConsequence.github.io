<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Oract 硬件级沙箱资源隔离与 Cgroups v2 硬配额管道</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 创建临时 Cgroup ──► 2. 限制 memory.max = 512MB &amp; cpu.max = 200% ──► 3. 挂载只读文件系统 ──► 4. 超限瞬间 OOM-Kill 0 影响宿主</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Cgroup v2 隔离组动态创建 (Dynamic Cgroup Allocation)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">为当前 Agent 任务分配独立路径 /sys/fs/cgroup/oract_task_123 ──► 建立物理资源围栏</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">物理级资源隔离边界！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 内存与 CPU 硬性配额限制 (Hard Resource Quotas Enforcement)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">设置 memory.max = 512MB, pids.max = 100 ──► 彻底杜绝恶意代码内存泄漏或 Fork 炸弹打爆整机</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">保障宿主服务器与其他任务绝对安全！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. Bubblewrap 内核命名空间封装 (bwrap Namespace Encapsulation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">绑定当前工作目录 ──► unshare-user, unshare-ipc, unshare-net ──► 剥夺一切非必要 Linux Capabilities</text>
        <text x="15" y="62" font-size="8" fill="#047857">全方位物理级安全屏障！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 精准 OOM 拦截与结构化反馈 (Precise OOM Trapping &amp; Feedback)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">进程超限被 Linux 内核 OOM-Kill ──► Oract 捕获退出码 137 并生成结构化报错提示模型优化算法！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代代码沙箱工程最高实现标准！</text>
      </g>
    </g>
  </g>
</svg>