<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">代码编辑容错机制：模糊匹配与缩进自适应对齐算法</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 精确字符串匹配 ──► 2. 失败时降级至去除空白正则匹配 ──► 3. 自动识别源文件缩进 (2格/4格/Tab) ──► 4. 自动调整补丁缩进完美贴合</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 第一层: 严格字节精确匹配 (Exact Byte-for-Byte Match)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">首先尝试 100% 逐字符精确检索 ──► 若命中唯一起始行，直接执行毫秒级替换</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">最高性能与最高严格度基线！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 第二层: 换行符与尾随空格抹平 (Normalize CRLF &amp; Trailing Spaces)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">自动统一 \r\n 为 \n，忽略每行末尾多余空格 ──► 平抑 Windows 与 Linux 换行符差异</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">化解 50% 因操作系统环境差异引发的匹配失败！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 第三层: 缩进自适应探测 (Indent Style Detection &amp; Adaptation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">模型输出了 2 空格缩进，但原文件是 4 空格缩进 ──► 自动计算缩进比例并重写新补丁</text>
        <text x="15" y="62" font-size="8" fill="#047857">杜绝因 Python 缩进错误引发的代码语法崩溃！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 匹配失败结构化指引 (Informative Error Diagnostic)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">若仍未找到 ──► 返回目标文件实际当前片段 ──► 引导模型重新 view_file 后再次重试！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代代码编辑工具箱最高工业级容错标准！</text>
      </g>
    </g>
  </g>
</svg>