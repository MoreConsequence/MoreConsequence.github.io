<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AF_XDP (XSK) 零拷贝架构：UMEM 共享内存与四环流转模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Fill Ring (向驱动投递空闲块) ──► Rx Ring (驱动通知数据就绪) ──► Tx Ring (用户态投递待发包) ──► Completion Ring (硬件释放回执)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Fill Ring 注册空闲内存页 (User ──► Kernel)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">用户态将预分配的 UMEM 物理页偏移量 (Chunk Offset) 写入 Fill 环形队列 ──► 供网卡 DMA 填充</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">网卡驱动直接获得用户态内存指针，从根源上消灭内核态向用户态的二次 memcpy！</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. Rx Ring 网卡线速 DMA 收包 (NIC ──► User)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">网卡接收数据包直接 DMA 写入 UMEM ──► 驱动向 Rx Ring 生产就绪描述符 (Descriptor: Addr + Len)</text>
        <text x="15" y="62" font-size="8" fill="#047857">用户态轮询读取 Rx Ring 即可毫秒级直接解析以太网原始报文！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. Tx Ring 用户态零拷贝线速发包 (User ──► NIC)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">用户态在 UMEM 中组装报文 ──► 投递描述符至 Tx Ring ──► 调用 sendto() 触发网卡批量 DMA 发送</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">单核发包吞吐突破 3,000 万 PPS (Packets Per Second) 物理极限！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. Completion Ring 释放闭环与零内存泄漏 (Recycle Loop)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">网卡发包完毕后将 Chunk 地址回传至 Completion Ring ──► 用户态安全回收并重新推入 Fill Ring！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">形成完美的纯零拷贝闭环生态，性能媲美 DPDK 却保留完整 Linux 生态！</text>
      </g>
    </g>
  </g>
</svg>