<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">企业级 Agent CI 自动化回归评测流水线 (Continuous Evals)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 提交 Prompt / Tool 修改 PR ──► 2. 并发拉起 100 个沙箱评测用例 ──► 3. 自动计算 Pass Rate Diff ──► 4. 解决率下降强行阻断合并</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 评测触发与环境准备 (Pull Request Trigger &amp; Eval Dataset)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">工程师修改了 System Prompt 或新增了 Tool ──► CI 自动调取黄金评测集 (Golden Benchmark: 100 Tasks)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将不确定性的 AI 提示词工程转化为可严格量化的测试体系！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 并发容器化沙箱执行 (Parallel Test Execution: 100 Sandboxes)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">通过 Testcontainers 并发执行 100 个真实任务 ──► 捕获各用例的输出补丁、测试结果与 Token 开销</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">在 3 分钟内完成全量回归！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 差异化指标对比与回归检测 (Regression Analysis: Baseline vs PR)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">对比 Baseline 主干: 发现解决率提升 +3%，但在 Python 模块出现 1 个非预期回归缺陷</text>
        <text x="15" y="62" font-size="8" fill="#047857">精准锁定提示词微调带来的意外副作用！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 质量门禁自动裁决 (Automated Quality Gate &amp; Merge)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">0 回归且指标更优 ──► 自动打上通过标签并允许合并 ──► 确保 Agent 智商只增不降！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">企业级 LLM 应用敏捷迭代的护城河！</text>
      </g>
    </g>
  </g>
</svg>