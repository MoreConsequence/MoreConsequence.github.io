  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">PARALLEL EXECUTION &amp; CANCELLATION · ORDERED RE-INJECTION &amp; ABORTSIGNAL</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">并行工具保序回填与 AbortSignal 取消</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">工具批次并行 ➔ 原始索引按序回填 ➔ AbortSignal 级联强杀 ➔ 11 种原生事件流完整闭环</text>

  
  
