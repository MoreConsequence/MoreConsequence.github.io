<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 引擎级联取消与并发资源清理树 (Cascade Cancellation)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">用户点击 "Stop" ──► 触发根 AbortController.abort() ──► 级联中断 LLM HTTP 流 ──► 杀掉后台 Bash 子进程 ──► 状态机秒级优雅归位</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 根取消信号触发 (Root Abort Signal: User Click 'Stop')</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">用户点击界面中止按钮 ──► 根 controller.abort() 瞬间广播 ──► 状态机立即从 Running 置为 Cancelling</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">从发端截断全部异步执行意图！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 大模型 HTTP/2 流式连接即刻关闭 (Terminate In-Flight LLM Stream)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">底层 fetch / gRPC 连接瞬间关闭 TCP 连接 ──► 停止接收后续 Tokens ──► 避免继续产生不必要的计费</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">毫秒级止血 Token 费用消耗！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 本地后台子进程树精确查杀 (Kill Subprocess Tree: SIGTERM -&gt; SIGKILL)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">向当前正在执行的 build/test 子进程组发送 SIGTERM ──► 500ms 未响应发送 SIGKILL ──► 0 孤儿进程残留</text>
        <text x="15" y="62" font-size="8" fill="#047857">彻底杜绝后台死锁或占用 CPU 算力！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 会话状态平滑回滚与就绪 (Clean Rollback to Idle State)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">在会话日志中标记中断事件 ──► 保持工作区文件状态一致性 ──► 状态机归位 Idle，随时接收下一次新任务！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">优秀交互式 Agent 引擎必备的高品质体验！</text>
      </g>
    </g>
  </g>
</svg>