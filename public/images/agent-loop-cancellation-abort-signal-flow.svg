<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="agent-loop-cancellation-abort-signal-flow-title agent-loop-cancellation-abort-signal-flow-desc"><title id="agent-loop-cancellation-abort-signal-flow-title">并行工具执行保序回填与 AbortSignal 级联取消</title><desc id="agent-loop-cancellation-abort-signal-flow-desc">流程架构图展示 Pi 工具批次的并行执行与原始索引保序回填机制，以及用户主动中断时 AbortSignal 跨进程级联强杀与 11 种原生事件流闭环。</desc>
