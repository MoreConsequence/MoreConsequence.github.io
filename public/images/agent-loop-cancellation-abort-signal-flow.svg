    <rect x="12" y="42" width="191" height="96" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="20" y="62" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">executeParallel()</text>
