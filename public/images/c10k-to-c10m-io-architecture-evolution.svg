<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">从 C10K 到 C10M：四代高性能 I/O 架构演进史</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">一代: select/poll (O(N) 线性遍历) ──► 二代: epoll (O(1) 红黑树+就绪链表) ──► 三代: io_uring (SQ/CQ 共享内存零系统调用) ──► 四代: DPDK (内核旁路零拷贝)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fef2f2"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. select / poll (C1K)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#f87171">O(N) 线性轮询：</text>
          
          <text x="8" y="38" fill="#cbd5e1">• 每次调用将整个 fd 数组从用户态拷贝进内核</text>
          <text x="8" y="62" fill="#ef4444">• 内核 O(N) 逐个扫描 1024 个 fd 是否有数据</text>
          <text x="8" y="86" fill="#f87171">• 连接数越大，性能直线暴跌！</text>
          
          <text x="8" y="116" fill="#ef4444">🔴 极限: 1,000 连接</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#991b1b">瓶颈：</text>
        <text x="8" y="34" font-size="7.5" fill="#7f1d1d">• 频繁内存全量拷贝；</text>
        <text x="8" y="48" font-size="7.5" fill="#7f1d1d">• 线性扫描浪费 CPU；</text>
        <text x="8" y="62" font-size="7.5" fill="#dc2626">• 早期互联网无奈方案。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. epoll (C100K 革命)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">O(1) 事件回调通知：</text>
          
          <text x="8" y="38" fill="#86efac">• 内核红黑树管理 fd 集合 (单次注册)</text>
          <text x="8" y="62" fill="#34d399">• 网卡中断触发 ep_poll_callback 写入就绪链表</text>
          <text x="8" y="86" fill="#4ade80">• 仅返回真正活跃的连接！</text>
          
          <text x="8" y="116" fill="#4ade80">✓ 支撑 100 万并发常驻！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• Nginx / Netty / Redis 核心基石；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 彻底解决 C10K 难题；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 统治互联网二十年。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. io_uring (C1M 突破)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">双无锁环形队列 (SQ/CQ):</text>
          
          <text x="8" y="38" fill="#86efac">• 提交队列 (SQ) 与完成队列 (CQ) 共享内存</text>
          <text x="8" y="62" fill="#38bdf8">• 0 系统调用下发海量 I/O 请求</text>
          <text x="8" y="86" fill="#34d399">• 内核内核线程自动异步执行并回填</text>
          
          <text x="8" y="116" fill="#4ade80">✓ 单机突破 300 万 IOPS！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• 消除系统调用上下文切换开销；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• 统一文件与网络异步模型；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• Linux 现代 I/O 未来。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">4. DPDK (C10M 巅峰)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">内核旁路 (Kernel Bypass):</text>
          
          <text x="8" y="38" fill="#fed7aa">• 用户态驱动直接通过 DMA 读写网卡</text>
          <text x="8" y="62" fill="#34d399">• 彻底绕过 Linux 内核协议栈</text>
          <text x="8" y="86" fill="#4ade80">• 纯轮询模式 (PMD) 消除中断开销</text>
          
          <text x="8" y="116" fill="#4ade80">✓ 单机吞吐 10,000,000 PPS！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#c2410c">极端性能：</text>
        <text x="8" y="34" font-size="7.5" fill="#9a3412">• 万兆/十万兆网关、SDN 路由器专用；</text>
        <text x="8" y="48" font-size="7.5" fill="#9a3412">• 压榨物理硬件绝对极限；</text>
        <text x="8" y="62" font-size="7.5" fill="#ea580c">• 工业级网络终极圣杯！</text>
      </g>
    </g>
  </g>
</svg>