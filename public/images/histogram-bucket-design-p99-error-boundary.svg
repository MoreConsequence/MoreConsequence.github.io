<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">直方图桶边界科学设计：避免 p99 分位数插值失真与越界盲区</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">线性桶 (跨度过大导致插值误差 300%) vs 指数对数桶 (相对误差恒定) ｜ +Inf 越界桶让 p99 估计整段失效</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Bad Bucketing -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 拍脑袋分桶：p99 插值误差高达 500%</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 传统粗暴分桶: [0.1, 0.5, 1.0, 5.0, +Inf]</text>
          <text y="30" fill="#fca5a5">1. 真实大量长尾延迟集中在 1.1s ~ 1.3s</text>
          <text y="46" fill="#fca5a5">2. Prometheus 在 (1.0, 5.0) 桶内执行线性插值：</text>
          <text y="62" fill="#ef4444">   p99 估算结果直接得出 4.2s (虚假暴涨 300%！)</text>
          
          <text y="88" fill="#ef4444">🔴 越界灾难：若请求落入 +Inf 桶：</text>
          <text y="104" fill="#fb7185">Prometheus 无法插值，直接返回上界 5.0s，彻底失去度量意义！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• SLA 告警频繁误报，排查人员狼来了麻木；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 真正发生 10s 严重挂起时，监控大盘竟然看不出异常；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 劣质的分桶比没有监控更具误导性！</text>
      </g>
    </g>

    <!-- Right: Scientific Exponential Buckets -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 科学几何分桶：指数对数增长与动态收敛</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">// 几何指数分桶: prometheus.ExponentialBuckets</text>
          <text y="28" fill="#86efac">ExponentialBuckets(0.005, 1.5, 16)</text>
          <text y="44" fill="#38bdf8">► [5ms, 7.5ms, 11ms, ..., 1.1s, 1.7s, 2.5s, 3.8s, 5.7s]</text>
          
          <text y="68" fill="#34d399">1. 相对误差恒定 (Relative Error &lt;= 25%)</text>
          <text y="84" fill="#34d399">2. 短时延区高精度，长尾区宽容覆盖</text>
          <text y="100" fill="#4ade80">3. Native Histograms (稀疏指数桶) 极致节约时序存储！</text>
          <text y="118" fill="#34d399">✓ 精准捕捉 99.9% 极端慢请求波动！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级最佳实践：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 核心 SLA 阈值点必须精确落在某个桶边界上；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 确保落入 +Inf 桶的样本比例严格控制在 &lt; 0.01%；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造高保真、可信赖的生产可观测性度量！</text>
      </g>
    </g>
  </g>
</svg>