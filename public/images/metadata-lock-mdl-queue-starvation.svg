<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">元数据锁 (MDL) 阻塞风暴物理踩踏时序</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">慢查询持有 MDL_SHARED_READ ──► ALTER TABLE 申请 MDL_EXCLUSIVE 排队 ──► 阻断后续全部 SELECT/INSERT ──► 连接池 1 秒打爆全站瘫痪</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 会话 A 发起未提交的慢查询 (Session A: Holding MDL_SHARED_READ)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">BEGIN; SELECT * FROM orders WHERE status = 1; (持续运行或未 COMMIT)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">会话 A 隐式持有 orders 表的 MDL 读锁！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 会话 B 执行 DDL 申请排他写锁 (Session B: Waiting for MDL_EXCLUSIVE)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">ALTER TABLE orders ADD COLUMN remark VARCHAR(255); ──► 申请 MDL 独占写锁被阻塞排队</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">MySQL 规则：MDL 写锁的等待优先级高于后续的新读锁申请！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 会话 C/D/E 全线被堵死 (Sessions C/D/E: Blocked Behind Session B)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">业务端发送极简单的 SELECT id FROM orders ──► 被排队的 ALTER 强行拦截在队列后死等！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">引发灾难性雪崩：全站成千上万个请求瞬间卡死在 Waiting for table metadata lock！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 生产救命防御：lock_wait_timeout 熔断 (Defense: Lock Wait Timeout)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">SET lock_wait_timeout = 3; ──► DDL 拿不到锁在 3 秒内主动超时报错退出 ──► 彻底保住核心业务不崩！</text>
        <text x="15" y="62" font-size="8" fill="#047857">资深 DBA 生产变更第一保命守则！</text>
      </g>
    </g>
  </g>
</svg>