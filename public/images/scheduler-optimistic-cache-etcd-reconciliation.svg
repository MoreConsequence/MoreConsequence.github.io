<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">调度器乐观缓存 (SchedulerCache) 冲突与自愈流转模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">AssumePod (乐观预先占位) ──► 异步发起 API Server 绑定 ──► 成功则正式生效 ｜ 若因版本冲突失败则执行 Unreserve 自动回滚内存账本</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Success Assume -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正常路径：AssumePod 乐观占位秒级放行</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">1. Pod-1 决定调度至 Node-A (假设已绑定成功)</text>
          <text y="28" fill="#86efac">2. cache.AssumePod(pod1) ──► 扣减 Node-A 内存 2GB</text>
          
          <text y="50" fill="#38bdf8">3. 紧接着 Pod-2 到达调度器：</text>
          <text y="64" fill="#34d399">   • 看到 Node-A 剩余内存已减少 2GB</text>
          <text y="78" fill="#34d399">   • 绝不发生双重超卖冲突，安全调度至 Node-B！</text>
          <text y="92" fill="#4ade80">4. 后台 Bind 异步写入 etcd 顺利完成！</text>
          
          <text y="116" fill="#4ade80">✓ 吞吐量提升 50 倍，0 串行等待！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 将重型 etcd 事务与核心调度循环完全解耦；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 纯内存级乐观两阶段事务；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 超大规模调度核心秘诀。</text>
      </g>
    </g>

    <!-- Right: Conflict Rollback -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 异常冲突回滚：Unreserve 自动账本自愈</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">1. Assume 占位后，后台 Bind 向 API Server 提交</text>
          <text y="28" fill="#f87171">2. 偶发遇到 Node-A 刚好被管理员手动 cordon 封锁！</text>
          <text y="42" fill="#ef4444">3. API Server 返回 409 Conflict 拒绝绑定</text>
          
          <text y="66" fill="#38bdf8">自愈回滚流转：</text>
          <text y="80" fill="#34d399">• 触发 cache.ForgetPod(pod1) / Unreserve</text>
          <text y="94" fill="#34d399">• 将 Node-A 的 2GB 内存账本瞬间无损恢复！</text>
          <text y="108" fill="#4ade80">• Pod-1 重新入队进入下一轮调度！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">机制价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 保证调度器本地内存账本与全局 etcd 绝对最终一致；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 0 幽灵内存泄露，0 状态永久脱轨；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 分布式乐观并发控制的教科书！</text>
      </g>
    </g>
  </g>
</svg>