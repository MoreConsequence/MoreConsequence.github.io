<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="consensus-jepsen-defect-archives-matrix-title consensus-jepsen-defect-archives-matrix-desc"><title id="consensus-jepsen-defect-archives-matrix-title">Jepsen 经典历史缺陷检验档案：网络分区与脑裂测试矩阵</title><desc id="consensus-jepsen-defect-archives-matrix-desc">分类矩阵图展示 MongoDB、Kafka、etcd 和 Elasticsearch 在 Jepsen 混沌故障注入下暴露的经典脑裂、写丢失缺陷与工业级修复方案。</desc>
