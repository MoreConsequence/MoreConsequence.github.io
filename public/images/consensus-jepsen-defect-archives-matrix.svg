      <text x="20" y="258" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">禁用非同步副本竞选</text>
      <text x="20" y="276" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">min.insync.replicas ≥ 2</text>
      <text x="20" y="294" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">acks=all 确保严格多数派落盘</text>
      <text x="20" y="312" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">KRaft 模式彻底统一元数据</text>
    </g>

    
