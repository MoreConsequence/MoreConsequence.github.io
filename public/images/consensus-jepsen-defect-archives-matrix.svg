  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">POST-MORTEM CASE ARCHIVES · JEPSEN BATTLE-TESTED LESSONS</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">Jepsen 历史经典缺陷档案：分区与脑裂测试</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">在真实物理故障拷打下，揭露分布式系统在网络分区、时钟跳变和非受控选举中的隐蔽一致性破产</text>

  
