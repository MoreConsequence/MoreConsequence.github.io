<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="idempotent-state-machine-status-transitions-title idempotent-state-machine-status-transitions-desc"><title id="idempotent-state-machine-status-transitions-title">基于状态机的天然幂等设计：单向向前状态迁移与 CAS 乐观锁防重</title><desc id="idempotent-state-machine-status-transitions-desc">基于状态机的天然幂等设计：单向向前状态迁移与 CAS 乐观锁防重</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">业务领域状态机天然单向幂等流转模型</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">INIT (初始) ──► PROCESSING (处理中) ──► SUCCESS (成功终态) ｜ UPDATE ... SET status='SUCCESS' WHERE id=1 AND status='PROCESSING'</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. INIT ──► PROCESSING</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">UPDATE orders</text>
          <text x="10" y="34" fill="#f5f5f5">SET status = 'PROCESSING',</text>
          <text x="10" y="50" fill="#f5f5f5">    updated_at = NOW()</text>
          <text x="10" y="66" fill="#f5f5f5">WHERE id = 1001</text>
          <text x="10" y="82" fill="#f5f5f5">  AND status = 'INIT';</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 仅首个请求成功更新 1 行！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制特性：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 数据库行级排他锁原子保障；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 并发重复请求 rows_affected == 0；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 纯 SQL 级 0 外部依赖防重。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. PROCESSING ──► SUCCESS</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">UPDATE orders</text>
          <text x="10" y="34" fill="#f5f5f5">SET status = 'SUCCESS',</text>
          <text x="10" y="50" fill="#f5f5f5">    pay_time = NOW()</text>
          <text x="10" y="66" fill="#f5f5f5">WHERE id = 1001</text>
          <text x="10" y="82" fill="#f5f5f5">  AND status = 'PROCESSING';</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 严格单向不可逆跃迁！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制特性：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 无论重发多少次回调通知；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 已处于 SUCCESS 终态的记录绝不重复扣款；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造稳固状态跃迁防线。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 异常补偿与终态固化</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">超时 / 扣款失败流转：</text>

          <text x="10" y="38" fill="#f5f5f5">• PROCESSING ──► FAILED / CLOSED</text>
          <text x="10" y="54" fill="#f5f5f5">• 状态机禁止任何逆向跃迁</text>
          <text x="10" y="70" fill="#f5f5f5">• 晚到的成功回调识别为已关闭</text>
          <text x="10" y="86" fill="#f5f5f5">• 自动触发退款工单系统！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 100% 账目平整与资金安全！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 将复杂分布式并发转化为确定性状态机；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 业务系统架构最高审美标准；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 资深工程师核心内功！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
