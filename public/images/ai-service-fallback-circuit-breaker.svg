<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AI 多厂商容灾与降级调度矩阵 (Multi-Provider Fallback Matrix)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">主模型 429 RateLimit / 500 Error ──► 动态权重熔断器 (Circuit Breaker) ──► 降级至同梯队备用模型 ──► 99.99% 服务可用性</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 主力主干 (Tier-1 Primary)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">Primary: Claude-3.5-Sonnet</text>
          
          <text x="10" y="38" fill="#86efac">常规高负载调用：</text>
          <text x="10" y="54" fill="#38bdf8">• 承担 90% 复杂代码与推理请求</text>
          <text x="10" y="70" fill="#34d399">• 超时阈值设为 12s</text>
          <text x="10" y="86" fill="#cbd5e1">• 错误率 &lt; 0.5% 保持闭合健康态</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 极限逻辑与代码输出质量！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 优先保障最高智力水平；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 具备最强的指令遵循能力；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 业务旗舰首选。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 热备降级 (Tier-2 Backup)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">Backup: GPT-4o / DeepSeek-V3</text>
          
          <text x="10" y="38" fill="#fed7aa">主干发生 429 或 503 时：</text>
          <text x="10" y="54" fill="#38bdf8">1. 熔断器半开，3 秒内自动无缝重试</text>
          <text x="10" y="70" fill="#34d399">2. 协议垫片自动对齐 System Prompt</text>
          <text x="10" y="86" fill="#34d399">3. 用户端 0 感知完成请求响应！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 故障自愈率 100%！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底消灭单厂商宕机导致的全站瘫痪；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 跨云跨区域多活容灾；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 打造钢铁般 AI 基础设施。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 极速兜底 (Tier-3 Edge/Fast)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">Fast: Gemini-Flash / Llama-3-8B</text>
          
          <text x="10" y="38" fill="#86efac">极端全链路过载保护：</text>
          <text x="10" y="54" fill="#38bdf8">• 毫秒级极速首字输出</text>
          <text x="10" y="70" fill="#34d399">• 成本仅为主模型的 1/20</text>
          <text x="10" y="86" fill="#4ade80">• 支撑极端海量突发流量削峰</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 保证核心业务永不拒绝服务！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 成本与速度的终极兜底缓冲；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 兼顾 SLA 达标与预算受控；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级 AI 后端成熟标志！</text>
      </g>
    </g>
  </g>
</svg>