<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">消息队列体系全景技术选型矩阵 (MQ Technology Radar)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Redis Stream (0 运维额外中间件，极速微秒级延迟，但受限于 RAM 内存) ｜ Kafka (百万吞吐流计算基石) ｜ RocketMQ (金融级定时与半事务消息)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Redis Stream (轻量利刃)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">微秒级极速队列：</text>
          
          <text x="10" y="38" fill="#86efac">• 0 新增组件运维负担 (复用 Redis 架构)</text>
          <text x="10" y="54" fill="#34d399">• 延迟 &lt; 0.5ms，纯内存操作</text>
          <text x="10" y="70" fill="#f87171">• 缺点: 内存昂贵，无法积压数亿条历史消息</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 适合中小规模快速业务闭环！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 异步解耦、简单任务通知、短生命周期流；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 配合 MAXLEN 维持固定滑动窗口；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 架构性价比极高。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Apache Kafka (吞吐霸主)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">海量流处理骨干：</text>
          
          <text x="10" y="38" fill="#86efac">• 顺序写磁盘 + PageCache + Sendfile 零拷贝</text>
          <text x="10" y="54" fill="#38bdf8">• 单集群轻松吞吐数百万 QPS</text>
          <text x="10" y="70" fill="#34d399">• 磁盘廉价存储支持保留数月历史日志</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 大数据与日志流水线绝对事实标准！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 埋点日志收集、流计算 (Flink/Spark)；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 超大规模微服务事件驱动核心总线；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业界巨擘。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Apache RocketMQ (金融核心)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">阿里双十一淬炼：</text>
          
          <text x="10" y="38" fill="#fed7aa">• 原生半事务消息 (Half-Message 反查机制)</text>
          <text x="10" y="54" fill="#38bdf8">• 任意精度毫秒级定时/延时消息</text>
          <text x="10" y="70" fill="#4ade80">• 严格 FIFO 顺序消息与死信队列完备治理</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 交易/结算/电商核心系统首选！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 深度契合复杂业务场景的丰富功能集；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 交易一致性与资金安全最高保障；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级业务中台神器！</text>
      </g>
    </g>
  </g>
</svg>