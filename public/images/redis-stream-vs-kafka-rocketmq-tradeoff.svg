<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="redis-stream-vs-kafka-rocketmq-tradeoff-title redis-stream-vs-kafka-rocketmq-tradeoff-desc"><title id="redis-stream-vs-kafka-rocketmq-tradeoff-title">消息队列技术选型对比：Redis Stream (轻量低延迟) vs Kafka (海量吞吐) vs RocketMQ…</title><desc id="redis-stream-vs-kafka-rocketmq-tradeoff-desc">消息队列技术选型对比：Redis Stream (轻量低延迟) vs Kafka (海量吞吐) vs RocketMQ (复杂金融事务)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">消息队列体系全景技术选型矩阵 (MQ Technology Radar)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Redis Stream (0 运维额外中间件，极速微秒级延迟，但受限于 RAM 内存) ｜ Kafka (百万吞吐流计算基石) ｜ RocketMQ (金融级定时与半事务消息)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Redis Stream (轻量利刃)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">微秒级极速队列：</text>

          <text x="10" y="38" fill="#f5f5f5">• 0 新增组件运维负担 (复用 Redis 架构)</text>
          <text x="10" y="54" fill="#f5f5f5">• 延迟 &lt; 0.5ms，纯内存操作</text>
          <text x="10" y="70" fill="#f5f5f5">• 缺点: 内存昂贵，无法积压数亿条历史消息</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 适合中小规模快速业务闭环！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 异步解耦、简单任务通知、短生命周期流；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 配合 MAXLEN 维持固定滑动窗口；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 架构性价比极高。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. Apache Kafka (吞吐霸主)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">海量流处理骨干：</text>

          <text x="10" y="38" fill="#f5f5f5">• 顺序写磁盘 + PageCache + Sendfile 零拷贝</text>
          <text x="10" y="54" fill="#f5f5f5">• 单集群轻松吞吐数百万 QPS</text>
          <text x="10" y="70" fill="#f5f5f5">• 磁盘廉价存储支持保留数月历史日志</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 大数据与日志流水线绝对事实标准！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 埋点日志收集、流计算 (Flink/Spark)；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 超大规模微服务事件驱动核心总线；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业界巨擘。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. Apache RocketMQ (金融核心)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">阿里双十一淬炼：</text>

          <text x="10" y="38" fill="#f5f5f5">• 原生半事务消息 (Half-Message 反查机制)</text>
          <text x="10" y="54" fill="#f5f5f5">• 任意精度毫秒级定时/延时消息</text>
          <text x="10" y="70" fill="#f5f5f5">• 严格 FIFO 顺序消息与死信队列完备治理</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 交易/结算/电商核心系统首选！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 深度契合复杂业务场景的丰富功能集；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 交易一致性与资金安全最高保障；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级业务中台神器！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
