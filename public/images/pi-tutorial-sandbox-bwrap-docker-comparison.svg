<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 沙箱技术选型对比：Bubblewrap (本地极速) vs Docker (云端强隔离)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Bubblewrap (0 守护进程、启动仅 5ms、内存开销 0MB，CLI 最佳搭档) vs Docker (独立完整镜像、网络生态强大，多租户云端首选)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Bubblewrap -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Bubblewrap (bwrap: 本地 CLI 性能王者)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">极简非特权命名空间：</text>
          
          <text y="38" fill="#86efac">• 启动延迟: 5 毫秒 (极速秒开)</text>
          <text y="52" fill="#38bdf8">• 0 Docker Daemon 守护进程强依赖</text>
          <text y="66" fill="#34d399">• 直接复用宿主机已安装的 node / go / gcc 编译器</text>
          <text y="80" fill="#4ade80">• 内存开销: 0MB (纯内核原生 Namespace)</text>
          
          <text y="106" fill="#4ade80">✓ 单机本地开发体验极佳！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 个人开发机、本地终端 CLI 工具；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 追求毫秒级高频测试运行反馈；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 轻量高效首选。</text>
      </g>
    </g>

    <!-- Right: Docker Container -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Docker / MicroVM (云端企业级强隔离)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">完整容器镜像封装：</text>
          
          <text y="38" fill="#86efac">• 启动延迟: 500ms ~ 2000ms</text>
          <text y="52" fill="#38bdf8">• 包含独立操作系统 rootfs 与特定工具版本</text>
          <text y="66" fill="#34d399">• 提供完善的虚拟网络桥接与端口映射</text>
          <text y="80" fill="#4ade80">• 适合运行不可信的恶意多租户代码！</text>
          
          <text y="106" fill="#4ade80">✓ 企业级云端 SaaS 平台标准！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 云端 Web Agent、多租户代码评测沙箱；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 严格防范内核逃逸与多用户数据隔离；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 云原生行业标杆。</text>
      </g>
    </g>
  </g>
</svg>