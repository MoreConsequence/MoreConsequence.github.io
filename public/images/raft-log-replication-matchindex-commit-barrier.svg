<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="raft-log-replication-matchindex-commit-barrier-title raft-log-replication-matchindex-commit-barrier-desc"><title id="raft-log-replication-matchindex-commit-barrier-title">Raft 日志复制与提交屏障：nextIndex 与 matchIndex 多数派安全收敛</title><desc id="raft-log-replication-matchindex-commit-barrier-desc">Raft 日志复制与提交屏障：nextIndex 与 matchIndex 多数派安全收敛</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Raft 日志连续性校验与多数派提交模型 (Log Matching Property)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. Leader 追加本地日志 ──► 2. AppendEntries 带 prevLogIndex/Term ──► 3. 多数派落盘推进 commitIndex ──► 4. 覆盖 Follower 脏日志</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 客户端写入与未提交条目追加 (Append Uncommitted Entry)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Leader 收到 SET key=val ──► 追加到本地 WAL 日志 (Term: 2, Index: 101) ──► 尚未应用至状态机</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">日志先行，写入不可逆持久介质！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 前驱日志匹配性安全检查 (PrevLogIndex &amp; PrevLogTerm Check)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Follower 检查本地 Index 100 处的任期是否匹配 ──► 若不匹配则拒绝 ──► Leader 递减 nextIndex 逐步回退找到公共祖先</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">严密保障日志历史的绝对连续无分叉！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 多数派确认与提交屏障晋升 (Majority Quorum &amp; CommitIndex Advancement)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">超过 N/2+1 个节点返回成功 ──► Leader 将 commitIndex 推进至 101 ──► 应用到状态机并响应客户端成功</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">达成绝对不可逆的分布式法定承诺！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 领导者日志绝对权威覆盖 (Leader Append-Only Invariant)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Leader 绝不删除或修改自己的日志 ──► 强制将 Follower 上的冲突未提交脏日志直接截断覆盖！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">保持全集群日志副本 100% 严格一致收敛！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
