<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">histogram_quantile 线性插值数学公式与误差收敛</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Rank 目标样本定位 ──► 锁定上下界桶 [bucket_lower, bucket_upper] ──► 假设桶内均匀分布 (Uniform Distribution) ──► 线性公式计算分位数</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 计算目标排名序号 (Calculate Target Rank: φ * N)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">例如计算 P99 (φ = 0.99)，总请求量 N = 10,000 ──► Rank = 0.99 * 10,000 = 9,900</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">锁定全量样本中第 9,900 个请求的落点！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 遍历累加桶计数定位宿主区间 (Find Host Bucket Interval)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">发现 le="100ms" 累计 9,800 个，le="200ms" 累计 9,950 个 ──► 目标第 9,900 个必然落在 [100ms, 200ms] 桶内</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">桶内总容纳量 count = 9,950 - 9,800 = 150 个样本！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 假设均匀分布并实施线性插值 (Linear Interpolation Math Formula)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">P99 = lower + (upper - lower) * ((Rank - prev_count) / count) = 100 + (200 - 100) * ((9900 - 9800) / 150) = 166.67ms</text>
        <text x="15" y="62" font-size="8" fill="#047857">数学级严密还原长尾分位数估值！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 原生直方图 Native Histograms (Sparse Buckets Evolution)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">Prometheus 2.40+ 原生稀疏高精度直方图 ──► 0 手动配桶，自动以 1.05x 极细对数划分 ──► 误差彻底降至 &lt; 1%！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">时序可观测性演进的最新巅峰！</text>
      </g>
    </g>
  </g>
</svg>