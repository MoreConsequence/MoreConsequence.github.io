<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="histogram-quantile-interpolation-error-curve-title histogram-quantile-interpolation-error-curve-desc"><title id="histogram-quantile-interpolation-error-curve-title">histogram_quantile 线性插值算法数学机理与长尾估计偏差收敛</title><desc id="histogram-quantile-interpolation-error-curve-desc">histogram_quantile 线性插值算法数学机理与长尾估计偏差收敛</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">histogram_quantile 线性插值数学公式与误差收敛</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Rank 目标样本定位 ──► 锁定上下界桶 [bucket_lower, bucket_upper] ──► 假设桶内均匀分布 (Uniform Distribution) ──► 线性公式计算分位数</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 计算目标排名序号 (Calculate Target Rank: φ * N)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">例如计算 P99 (φ = 0.99)，总请求量 N = 10,000 ──► Rank = 0.99 * 10,000 = 9,900</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">锁定全量样本中第 9,900 个请求的落点！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 遍历累加桶计数定位宿主区间 (Find Host Bucket Interval)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">发现 le="100ms" 累计 9,800 个，le="200ms" 累计 9,950 个 ──► 目标第 9,900 个必然落在 [100ms, 200ms] 桶内</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">桶内总容纳量 count = 9,950 - 9,800 = 150 个样本！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 假设均匀分布并实施线性插值 (Linear Interpolation Math Formula)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">P99 = lower + (upper - lower) * ((Rank - prev_count) / count) = 100 + (200 - 100) * ((9900 - 9800) / 150) = 166.67ms</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">数学级严密还原长尾分位数估值！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 原生直方图 Native Histograms (Sparse Buckets Evolution)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Prometheus 2.40+ 原生稀疏高精度直方图 ──► 0 手动配桶，自动以 1.05x 极细对数划分 ──► 误差彻底降至 &lt; 1%！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">时序可观测性演进的最新巅峰！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
