<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lcacTitle lcacDesc">
<title id="lcacTitle">老代码是隐性约束的压缩：行行反直觉背后都是事故</title>
<desc id="lcacDesc">左侧是代码里"看起来没人会这么写"的反直觉分支；右侧是它对应的现实约束。每一条单独拿出来都不值得维护，五百条叠在一起就是没人愿意爬的金山。重构工具能识别"重复代码"、"过长函数"、"魔术数"，但识别不出"这一行 if 是五年前某次事故的解"。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">老代码看起来不可理解，是因为它编码了你不知道的约束</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">左侧每一行 if 是"谁会这么写"的反直觉分支，右侧是它编码的现实约束。重构工具读不出右侧。</text>

<!-- column headers -->
<text x="48" y="104" fill="#7a8399" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">代码里的反直觉分支</text>
<text x="544" y="104" fill="#eb6c36" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">它编码的现实约束</text>

<!-- Row 1 -->
<rect x="48" y="124" width="464" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="148" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">payment.go · line 187</text>
<text x="64" y="170" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">if currency == "JPY" &amp;&amp; amount &lt; 100 {</text>
<text x="64" y="186" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">    return ErrAmountTooSmall</text>

<path d="M 512 156 L 544 156" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="544" y="124" width="368" height="64" rx="4" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="560" y="148" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">JPY · 舍入事故 · 2019</text>
<text x="560" y="170" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">日元小于 100 的支付因小数舍入</text>
<text x="560" y="186" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">导致重复扣款，必须拦截</text>

<!-- Row 2 -->
<rect x="48" y="200" width="464" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="224" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">callback.go · line 92</text>
<text x="64" y="246" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">if retry &gt;= 3 {</text>
<text x="64" y="262" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">    return ErrGiveUp</text>

<path d="M 512 232 L 544 232" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="544" y="200" width="368" height="64" rx="4" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="560" y="224" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">回调重试 · 5 次事故 · 2021</text>
<text x="560" y="246" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">上游 5 次重试后用户被扣 5 次款，</text>
<text x="560" y="262" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">定为 3 次后熔断</text>

<!-- Row 3 -->
<rect x="48" y="276" width="464" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="300" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">order.go · line 51</text>
<text x="64" y="322" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">// 不要动这个字段，与 B 对账</text>
<text x="64" y="338" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">type Order struct { AuditID string }</text>

<path d="M 512 308 L 544 308" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="544" y="276" width="368" height="64" rx="4" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="560" y="300" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">跨系统不变量 · 对账事故 · 2020</text>
<text x="560" y="322" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">A 表的 AuditID 必须与 B 表的对账</text>
<text x="560" y="338" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">ID 一致，删了就会对账不平</text>

<!-- Row 4 -->
<rect x="48" y="352" width="464" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="376" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">expire.go · line 23</text>
<text x="64" y="398" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">if state == "pending" &amp;&amp;</text>
<text x="64" y="414" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">    now.Sub(issued) &gt; 24*time.Hour {</text>

<path d="M 512 384 L 544 384" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="544" y="352" width="368" height="64" rx="4" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="560" y="376" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">状态过期 · 重复结算 · 2022</text>
<text x="560" y="398" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">pending 状态超过 24 小时被另一</text>
<text x="560" y="414" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">条链路再次结算，故障转移不变量</text>

<!-- Row 5 -->
<rect x="48" y="428" width="464" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="452" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">risk.go · line 340</text>
<text x="64" y="474" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">if from == "vpn_" || from == "tor_" {</text>
<text x="64" y="490" fill="#2d3142" font-size="11" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">    return ErrSuspectedFraud</text>

<path d="M 512 460 L 544 460" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="544" y="428" width="368" height="64" rx="4" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="560" y="452" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">风控绕过 · 黑产 · 2023</text>
<text x="560" y="474" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">黑产绕过 IP 风控，使用 VPN/TOR</text>
<text x="560" y="490" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">出口伪装，损失 200w</text>

<!-- footer -->
<line x1="48" y1="504" x2="912" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="48" y="522" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">每条单独都不值得维护，五百条叠在一起就是一座没人愿意爬的金山。重写几乎一定会丢这些约束，丢了之后事故会以另一种形式重新出现。</text>

</svg>
