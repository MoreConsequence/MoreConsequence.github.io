<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="hallucination-detection-rag-triad-metrics-title hallucination-detection-rag-triad-metrics-desc"><title id="hallucination-detection-rag-triad-metrics-title">大模型幻觉度量三元组 (RAG Triad)：上下文相关性、真实忠实度与答案相关性</title><desc id="hallucination-detection-rag-triad-metrics-desc">大模型幻觉度量三元组 (RAG Triad)：上下文相关性、真实忠实度与答案相关性</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">大模型幻觉量化度量三大核心支柱 (The RAG Triad of Metrics)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 检索相关性 (Context Relevance) ｜ 2. 事实忠实度 (Faithfulness / Groundedness: 绝不胡编) ｜ 3. 答案相关性 (Answer Relevance: 答其所问)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 检索相关性 (Context Relevance)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">评估: Query ──► Context</text>

          <text x="10" y="38" fill="#f5f5f5">核心判定指标：</text>
          <text x="10" y="54" fill="#cbd5e1">• 检索出的文档是否包含解答问题的信息？</text>
          <text x="10" y="70" fill="#f5f5f5">• 剔除 80% 无关冗余噪音片段</text>
          <text x="10" y="86" fill="#f5f5f5">• 避免干扰大模型注意力焦点</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 达标阈值: Score &gt; 0.85</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 衡量向量召回与重排质量；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 垃圾进则垃圾出 (GIGO) 第一防线；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 输入纯洁性基石。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 事实忠实度 (Faithfulness)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">评估: Context ──► Response</text>

          <text x="10" y="38" fill="#f5f5f5">幻觉核心检验：</text>
          <text x="10" y="54" fill="#f5f5f5">• 提取回答中的每个独立事实命题</text>
          <text x="10" y="70" fill="#f5f5f5">• 逐条推演是否能在 Context 中找到铁证</text>
          <text x="10" y="86" fill="#f5f5f5">• 存在 1 条无来源断言即判定为幻觉！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 达标阈值: 必须 100% 忠实！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 医疗/金融/代码等严肃场景生死线；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 基于 NLI 自然语言蕴含推理判别；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 彻底消灭胡编乱造。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 答案相关性 (Answer Relevance)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">评估: Response ──► Query</text>

          <text x="10" y="38" fill="#f5f5f5">答其所问判定：</text>
          <text x="10" y="54" fill="#f5f5f5">• 即使回答 100% 真实，是否切题？</text>
          <text x="10" y="70" fill="#f5f5f5">• 杜绝答非所问、东拉西扯与复读废话</text>
          <text x="10" y="86" fill="#f5f5f5">• 确保精准切中用户的原始意图</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 达标阈值: Score &gt; 0.90</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 形成客观、可自动化 CI 跑分的评价闭环；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• Ragas / TruLens 评测框架底层理论；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• AI 系统量化工程化的最高标杆！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
