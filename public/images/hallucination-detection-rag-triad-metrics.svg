<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">大模型幻觉量化度量三大核心支柱 (The RAG Triad of Metrics)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 检索相关性 (Context Relevance) ｜ 2. 事实忠实度 (Faithfulness / Groundedness: 绝不胡编) ｜ 3. 答案相关性 (Answer Relevance: 答其所问)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 检索相关性 (Context Relevance)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">评估: Query ──► Context</text>
          
          <text x="10" y="38" fill="#86efac">核心判定指标：</text>
          <text x="10" y="54" fill="#cbd5e1">• 检索出的文档是否包含解答问题的信息？</text>
          <text x="10" y="70" fill="#34d399">• 剔除 80% 无关冗余噪音片段</text>
          <text x="10" y="86" fill="#34d399">• 避免干扰大模型注意力焦点</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 达标阈值: Score &gt; 0.85</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 衡量向量召回与重排质量；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 垃圾进则垃圾出 (GIGO) 第一防线；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 输入纯洁性基石。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 事实忠实度 (Faithfulness)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">评估: Context ──► Response</text>
          
          <text x="10" y="38" fill="#86efac">幻觉核心检验：</text>
          <text x="10" y="54" fill="#38bdf8">• 提取回答中的每个独立事实命题</text>
          <text x="10" y="70" fill="#34d399">• 逐条推演是否能在 Context 中找到铁证</text>
          <text x="10" y="86" fill="#4ade80">• 存在 1 条无来源断言即判定为幻觉！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 达标阈值: 必须 100% 忠实！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 医疗/金融/代码等严肃场景生死线；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 基于 NLI 自然语言蕴含推理判别；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 彻底消灭胡编乱造。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 答案相关性 (Answer Relevance)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">评估: Response ──► Query</text>
          
          <text x="10" y="38" fill="#fed7aa">答其所问判定：</text>
          <text x="10" y="54" fill="#38bdf8">• 即使回答 100% 真实，是否切题？</text>
          <text x="10" y="70" fill="#34d399">• 杜绝答非所问、东拉西扯与复读废话</text>
          <text x="10" y="86" fill="#4ade80">• 确保精准切中用户的原始意图</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 达标阈值: Score &gt; 0.90</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 形成客观、可自动化 CI 跑分的评价闭环；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• Ragas / TruLens 评测框架底层理论；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• AI 系统量化工程化的最高标杆！</text>
      </g>
    </g>
  </g>
</svg>