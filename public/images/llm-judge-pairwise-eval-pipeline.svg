<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LLM-as-a-Judge 评测的三笔偏差税与 Token 成本精算</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">位置偏差税 (Position Bias) ｜ 冗长偏好税 (Verbosity Bias) ｜ 偶然一致性税 (Chance Agreement) 与双向去偏</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Box: The 3 Biases (420px) -->
    <g transform="translate(20, 20)">
      <rect width="420" height="345" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
      <rect width="420" height="30" rx="6" fill="#fecaca"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">
        ❌ 裁判模型的三笔固有偏差税
      </text>

      <g transform="translate(15, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="390" height="70" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">1. 位置偏差税 (Position Tax):</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 排在第一位的答案胜率虚高 +20%~30%</text>
        <text x="10" y="50" font-size="7.5" fill="#7f1d1d">• 单向评测产生大量假阳性判定</text>

        <g transform="translate(0, 78)">
          <rect width="390" height="70" rx="4" fill="#ffffff" stroke="#fca5a5"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">2. 冗长啰嗦税 (Verbosity Tax):</text>
          <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 倾向给字数更多、排版更复杂的回答打高分</text>
          <text x="10" y="50" font-size="7.5" fill="#7f1d1d">• 严厉惩罚短小精悍的高质量准确输出</text>
        </g>

        <g transform="translate(0, 156)">
          <rect width="390" height="70" rx="4" fill="#ffffff" stroke="#fca5a5"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">3. 自我偏爱税 (Self-Enhancement Tax):</text>
          <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• GPT 裁判偏袒 GPT 家族，Claude 裁判偏袒 Claude</text>
          <text x="10" y="50" font-size="7.5" fill="#7f1d1d">• 相同分词习惯与 RLHF 风格导致隐式共鸣</text>
        </g>
      </g>
    </g>

    <!-- Right Box: Production De-biasing & Cost (420px) -->
    <g transform="translate(460, 20)">
      <rect width="420" height="345" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect width="420" height="30" rx="6" fill="#dcfce7"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">
        ✓ 生产去偏解法与 Token 账单
      </text>

      <g transform="translate(15, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="390" height="85" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="9.5" font-weight="700" fill="#15803d">1. 双向交换 (Swap-Pair) 盲测：</text>
        <text x="10" y="34" font-size="8" fill="#166534">• 每个样本跑两次 (A vs B 与 B vs A)</text>
        <text x="10" y="48" font-size="8" fill="#166534">• 仅双向一致判定胜出，冲突归为平局 (Tie)</text>
        <text x="10" y="64" font-size="8" font-weight="700" fill="#047857">• 消除 95% 以上位置固有偏见！</text>

        <g transform="translate(0, 95)">
          <rect width="390" height="135" rx="4" fill="#0f172a"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#38bdf8">2. 评测 Token 成本与预算核算：</text>
          <g transform="translate(10, 30)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
            <text y="14" fill="#93c5fd">• 500 样本评测集 × 2 (双向) = 1000 次判定</text>
            <text y="28" fill="#93c5fd">• 单次 Prompt (题目+两回答+CoT细则) ≈ 1500 Tokens</text>
            <text y="42" fill="#93c5fd">• 单次 CoT 输出 ≈ 300 Tokens</text>
            <text y="60" fill="#34d399">► 总消耗: 1.5M Input + 300K Output Tokens</text>
            <text y="76" fill="#fbbf24">► GPT-4o 裁判单次全量评测成本仅需 ~$6.0 美元！</text>
            <text y="92" fill="#f87171">相比人工评测（数千美元/天），降本 99% 并实现分钟级 CI 反馈！</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>