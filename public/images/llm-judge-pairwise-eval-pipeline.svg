<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="100%" height="100%" role="img" aria-labelledby="llm-judge-pairwise-eval-pipeline-title llm-judge-pairwise-eval-pipeline-desc"><title id="llm-judge-pairwise-eval-pipeline-title">LLM-as-a-Judge 对比评测偏差税与 Token 成本模型</title><desc id="llm-judge-pairwise-eval-pipeline-desc">LLM-as-a-Judge 对比评测偏差税与 Token 成本模型</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">LLM-as-a-Judge 评测的三笔偏差税与 Token 成本精算</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">位置偏差税 (Position Bias) ｜ 冗长偏好税 (Verbosity Bias) ｜ 偶然一致性税 (Chance Agreement) 与双向去偏</text>
  </g>

  <g transform="translate(30, 70)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />

    
    <g transform="translate(20, 20)">
      <rect width="420" height="284" rx="6" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="420" height="30" rx="6" fill="#fecaca" />
      <text x="12" y="20" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" font-weight="700" fill="#2d3142">
        ❌ 裁判模型的三笔固有偏差税
      </text>

      <g transform="translate(15, 42)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="390" height="70" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="18" font-size="9" font-weight="700" fill="#2d3142">1. 位置偏差税 (Position Tax):</text>
        <text x="10" y="34" font-size="7.5" fill="#2d3142">• 排在第一位的答案胜率虚高 +20%~30%</text>
        <text x="10" y="50" font-size="7.5" fill="#2d3142">• 单向评测产生大量假阳性判定</text>

        <g transform="translate(0, 78)">
          <rect width="390" height="70" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
          <text x="10" y="18" font-size="9" font-weight="700" fill="#2d3142">2. 冗长啰嗦税 (Verbosity Tax):</text>
          <text x="10" y="34" font-size="7.5" fill="#2d3142">• 倾向给字数更多、排版更复杂的回答打高分</text>
          <text x="10" y="50" font-size="7.5" fill="#2d3142">• 严厉惩罚短小精悍的高质量准确输出</text>
        </g>

        <g transform="translate(0, 156)">
          <rect width="390" height="70" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
          <text x="10" y="18" font-size="9" font-weight="700" fill="#2d3142">3. 自我偏爱税 (Self-Enhancement Tax):</text>
          <text x="10" y="34" font-size="7.5" fill="#2d3142">• GPT 裁判偏袒 GPT 家族，Claude 裁判偏袒 Claude</text>
          <text x="10" y="50" font-size="7.5" fill="#2d3142">• 相同分词习惯与 RLHF 风格导致隐式共鸣</text>
        </g>
      </g>
    </g>

    
    <g transform="translate(460, 20)">
      <rect width="420" height="288" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="420" height="30" rx="6" fill="#ffffff" />
      <text x="12" y="20" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" font-weight="700" fill="#2d3142">
        ✓ 生产去偏解法与 Token 账单
      </text>

      <g transform="translate(15, 42)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="390" height="85" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="18" font-size="9.5" font-weight="700" fill="#4f5d75">1. 双向交换 (Swap-Pair) 盲测：</text>
        <text x="10" y="34" font-size="8" fill="#2d3142">• 每个样本跑两次 (A vs B 与 B vs A)</text>
        <text x="10" y="48" font-size="8" fill="#2d3142">• 仅双向一致判定胜出，冲突归为平局 (Tie)</text>
        <text x="10" y="64" font-size="8" font-weight="700" fill="#4f5d75">• 消除 95% 以上位置固有偏见！</text>

        <g transform="translate(0, 95)">
          <rect width="390" height="135" rx="4" fill="#2d3142" />
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#f5f5f5">2. 评测 Token 成本与预算核算：</text>
          <g transform="translate(10, 30)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
            <text y="14" fill="#f5f5f5">• 500 样本评测集 × 2 (双向) = 1000 次判定</text>
            <text y="28" fill="#f5f5f5">• 单次 Prompt (题目+两回答+CoT细则) ≈ 1500 Tokens</text>
            <text y="42" fill="#f5f5f5">• 单次 CoT 输出 ≈ 300 Tokens</text>
            <text y="60" fill="#f5f5f5">► 总消耗: 1.5M Input + 300K Output Tokens</text>
            <text y="76" fill="#f5f5f5">► GPT-4o 裁判单次全量评测成本仅需 ~$6.0 美元！</text>
            <text y="92" fill="#f5f5f5">相比人工评测（数千美元/天），降本 99% 并实现分钟级 CI 反馈！</text>
          </g>
        </g>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
