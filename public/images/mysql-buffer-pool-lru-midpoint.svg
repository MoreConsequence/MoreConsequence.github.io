<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL InnoDB Buffer Pool 变种 LRU 链表与防扫描污染架构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">5/8 Midpoint 插入分割 ──► 1000ms 时间冷却区（innodb_old_blocks_time） ──► 真正热页晋升 Young 区</text>
  </g>

  <!-- Top Pane: Buffer Pool 3 Core Lists (900px) -->
  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#334155">【三大管理链表全景】</text>

    <g transform="translate(20, 30)">
      <!-- Free List -->
      <g>
        <rect width="270" height="46" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="12" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af">1. Free List (空闲物理页池)</text>
        <text x="12" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#2563eb">未被占用的 16KB 页框，供新数据载入</text>
      </g>

      <!-- Flush List -->
      <g transform="translate(295, 0)">
        <rect width="270" height="46" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="12" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#9a3412">2. Flush List (脏页落盘链表)</text>
        <text x="12" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#c2410c">按 oldest_modification_lsn 严格递增排序</text>
      </g>

      <!-- LRU List -->
      <g transform="translate(590, 0)">
        <rect width="270" height="46" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="12" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#166534">3. LRU List (冷热淘汰链表)</text>
        <text x="12" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#15803d">负责内存命中率与防全表扫描污染</text>
      </g>
    </g>
  </g>

  <!-- Bottom Main Pane: Midpoint LRU Segmented Structure (900px) -->
  <g transform="translate(30, 175)" filter="url(#card-shadow)">
    <rect width="900" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect width="900" height="32" rx="8" fill="#f8fafc"/>
    <text x="20" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">【Midpoint 变种 LRU 物理双向链表拓扑】</text>

    <!-- LRU Linked Chain Track -->
    <g transform="translate(20, 50)">
      <!-- Young Sublist (5/8 = 63%) -->
      <g>
        <rect width="520" height="135" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="520" height="28" rx="6" fill="#dcfce7"/>
        <text x="12" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">
          Young Sublist（热数据区，占 5/8 ≈ 63%）
        </text>

        <!-- Young Page Blocks -->
        <g transform="translate(15, 40)">
          <!-- Page 1 (Head) -->
          <rect width="95" height="42" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="47" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#14532d" text-anchor="middle">Page #42 (Head)</text>
          <text x="47" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#15803d" text-anchor="middle">最近最高频访问</text>

          <path d="M 95 21 L 115 21" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

          <!-- Page 2 -->
          <g transform="translate(120, 0)">
            <rect width="95" height="42" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
            <text x="47" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#14532d" text-anchor="middle">Page #108</text>
            <text x="47" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#15803d" text-anchor="middle">热点高频缓存</text>
          </g>

          <path d="M 215 21 L 235 21" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

          <!-- Page 3 (1/4 Protection Zone) -->
          <g transform="translate(240, 0)">
            <rect width="115" height="42" rx="4" fill="#ecfdf5" stroke="#34d399"/>
            <text x="57" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">Page #256</text>
            <text x="57" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#047857" text-anchor="middle">头部 1/4 保护区免移位</text>
          </g>

          <path d="M 355 21 L 375 21" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

          <!-- Page 4 (Young Tail) -->
          <g transform="translate(380, 0)">
            <rect width="95" height="42" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
            <text x="47" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#14532d" text-anchor="middle">Page #512 (Tail)</text>
            <text x="47" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#15803d" text-anchor="middle">即将降级 Old 区</text>
          </g>
        </g>

        <!-- Young Benefit note -->
        <text x="15" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#166534">
          ✓ 头部 1/4 免移位优化：访问前 1/4 热页不触发节点前移，消除链表自旋锁（Mutex）争用
        </text>
      </g>

      <!-- Midpoint Dividing Line & Arrow -->
      <g transform="translate(525, 0)">
        <!-- Midpoint Marker -->
        <line x1="15" y1="0" x2="15" y2="135" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/>
        <rect x="0" y="-12" width="30" height="20" rx="3" fill="#ea580c"/>
        <text x="15" y="2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">5/8</text>
      </g>

      <!-- Old Sublist (3/8 = 37%) -->
      <g transform="translate(560, 0)">
        <rect width="300" height="135" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
        <rect width="300" height="28" rx="6" fill="#ffedd5"/>
        <text x="12" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">
          Old Sublist（冷数据隔离区，占 3/8 ≈ 37%）
        </text>

        <!-- Old Page Blocks -->
        <g transform="translate(12, 40)">
          <!-- Page Old Head (Midpoint Insert Point) -->
          <g>
            <rect width="125" height="42" rx="4" fill="#fee2e2" stroke="#f87171"/>
            <text x="62" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">新载入页 (Old Head)</text>
            <text x="62" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#7f1d1d" text-anchor="middle">标记时间戳 t_load</text>
          </g>

          <path d="M 130 21 L 150 21" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>

          <!-- Page Old Tail (Eviction Victim) -->
          <g transform="translate(155, 0)">
            <rect width="115" height="42" rx="4" fill="#fee2e2" stroke="#ef4444"/>
            <text x="57" y="18" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">淘汰页 (LRU Tail)</text>
            <text x="57" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#991b1b" text-anchor="middle">最先被逐出内存</text>
          </g>
        </g>

        <!-- Old Logic note -->
        <text x="12" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#9a3412">
          • &lt;1000ms 再次访问：不晋升 (全表扫描自然衰减)
        </text>
        <text x="12" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#15803d">
          • &gt;1000ms 再次访问：判定为真热点，晋升 Young 头部！
        </text>
      </g>
    </g>

    <!-- Bottom Summary Box -->
    <g transform="translate(20, 205)">
      <rect width="860" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="430" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">
        💡 为什么朴素 LRU 会被全表扫描击穿？
      </text>
      <text x="430" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">
        朴素 LRU 新页插入头部，一条 <tspan font-weight="700" fill="#dc2626">SELECT *</tspan> 会瞬间把所有核心热数据全部挤出内存；InnoDB 通过 <tspan font-weight="700" fill="#2563eb">“Midpoint 5/8 插入 + 1000ms 隔离期”</tspan> 彻底阻断了扫描污染。
      </text>
    </g>
  </g>
</svg>
