<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">脱敏算法性能开销对比：反射深拷贝 vs JIT 预编译字符串单遍扫描</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">递归深拷贝反射 (QPS 3,200, 产生海量垃圾引发 GC 抖动) vs fast-json-stringify JIT 模式 (QPS 48,000, 吞吐飙升 15 倍)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Deep Clone -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 朴素实现：递归深度遍历与反射克隆</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">function sanitize(obj: any): any { ... }</text>
          <text y="30" fill="#fca5a5">1. Object.entries 递归递归深拷贝整个响应树</text>
          <text y="48" fill="#ef4444">2. 产生上万个微型中间临时对象，触发 V8 新生代 GC 停顿！</text>
          <text y="66" fill="#ef4444">3. 单次序列化耗时: 3.2 毫秒 | QPS: 3,100 req/s</text>
          
          <text y="92" fill="#ef4444">🔴 恶果：在高并发下 CPU 100% 满载，大部分时间在做 GC！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 业务接口延迟增加 200%；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 吞吐量遭遇严重天花板；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 无法满足万级微服务网关要求！</text>
      </g>
    </g>

    <!-- Right: JIT Stringify -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ JIT 预编译序列化 (fast-json-stringify)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 启动时将 DTO Schema 动态编译为纯字符串拼接函数</text>
          <text y="28" fill="#86efac">const stringify = fastJson({ ...schema });</text>
          
          <text y="50" fill="#38bdf8">1. 单遍扫描直接拼接目标 JSON 字符串，0 中间对象！</text>
          <text y="66" fill="#34d399">2. 脱敏逻辑内联生成为简单的 slice/substring 操作！</text>
          <text y="82" fill="#34d399">3. 单次耗时: 0.18 毫秒 | QPS: 48,500 req/s！</text>
          
          <text y="108" fill="#4ade80">✓ 性能媲美 C++ 原生序列化，GC 压力彻底归零！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 极致榨干 Node.js V8 引擎极限性能；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 兼具安全合规与超高并发吞吐；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造顶级微服务传输架构！</text>
      </g>
    </g>
  </g>
</svg>