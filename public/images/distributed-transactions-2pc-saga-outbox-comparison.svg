<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="distributed-transactions-2pc-saga-outbox-comparison-title distributed-transactions-2pc-saga-outbox-comparison-desc"><title id="distributed-transactions-2pc-saga-outbox-comparison-title">分布式事务终极对比：2PC vs SAGA vs Transactional Outbox 崩溃模型与责任边界</title><desc id="distributed-transactions-2pc-saga-outbox-comparison-desc">分布式事务终极对比：2PC vs SAGA vs Transactional Outbox 崩溃模型与责任边界</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分布式事务三大流派对比：2PC、SAGA、Outbox 崩溃后谁负责收拾</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">2PC (协调器收拾，持有全局锁) ｜ SAGA (编排器触发逆向业务补偿) ｜ Transactional Outbox (CDC 消息重试与消费端幂等最终一致)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 2PC (两阶段提交)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">• 一致性级别: ACID 强一致性</text>
          <text x="10" y="34" fill="#f5f5f5">• 锁持有时间: 跨网络长事务全局锁</text>
          <text x="10" y="50" fill="#f5f5f5">• 崩溃模型: 协调器宕机导致全员挂起</text>
          <text x="10" y="68" fill="#f5f5f5">• 吞吐上限: ~1,000 TPS (低)</text>
          <text x="10" y="86" fill="#f5f5f5">• 谁收拾残局: 协调器重放 Commit 日志</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 单体数据库内部多分区或金融核心账户；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 绝对不能容忍任何脏读/中间态的业务；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 硬件网络极度稳定的内部机房。</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. SAGA (长事务柔性补偿)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">• 一致性级别: BASE 最终一致性</text>
          <text x="10" y="34" fill="#f5f5f5">• 锁持有时间: 0 全局锁 (本地短事务提交)</text>
          <text x="10" y="50" fill="#f5f5f5">• 崩溃模型: 子事务可能暴露中间未决状态</text>
          <text x="10" y="68" fill="#f5f5f5">• 吞吐上限: 50,000+ TPS (极高)</text>
          <text x="10" y="86" fill="#f5f5f5">• 谁收拾残局: 编排器执行逆向补偿 (Compensate)</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 跨异构系统的长流程业务 (订机票/酒店)；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 业务具有明确天然可逆补偿手段；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 电商高并发订单结算中心。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. Transactional Outbox (CDC)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">• 一致性级别: 最终一致性 (At-Least-Once)</text>
          <text x="10" y="34" fill="#f5f5f5">• 锁持有时间: 仅本地单库事务毫秒锁</text>
          <text x="10" y="50" fill="#f5f5f5">• 崩溃模型: 网络抖动消息自动重发</text>
          <text x="10" y="68" fill="#f5f5f5">• 吞吐上限: 100,000+ TPS (极限)</text>
          <text x="10" y="86" fill="#f5f5f5">• 谁收拾残局: 消费端幂等去重表</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 异步领域事件通知、缓存刷新、搜索同步；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 微服务间事实状态分发与数据解耦；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代分布式云原生事实标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
