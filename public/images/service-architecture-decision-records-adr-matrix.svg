<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">第一行代码之前：架构决策记录 (ADR) 完整要素与论证闭环</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 状态与时间 (Status) ｜ 2. 物理上下文与约束 (Context) ｜ 3. 核心决策 (Decision) ｜ 4. 正负后果与妥协 (Consequences)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 决策状态与元数据 (Metadata &amp; Lifecycle)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">ADR-0042: 使用 PostgreSQL 作为统一状态存储 ｜ Status: Accepted ｜ Date: 2026-08-30</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">记录决策提出人、评审人、生效日期与生命周期状态 (Proposed / Accepted / Superseded)！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 物理约束与业务上下文 (Physical Constraints &amp; Context)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">业务日增量 500 万行、团队仅 3 名后端维护、要求强 ACID 事务与 JSON 灵活扩展</text>
        <text x="15" y="62" font-size="8" fill="#047857">清晰定义当前面临的真实业务挑战、硬件资源预算、团队技能储备与不可突破的红线边界！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 方案对比与决策论证 (Tradeoff Matrix &amp; Decision)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">对比方案: MongoDB (无强事务被否) vs MySQL (JSON 索引弱) vs PostgreSQL (完美契合，选定！)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">严禁直接给出结论！必须写明至少 2 个被否决备选方案的具体缺陷与放弃理由！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 承受的正负后果与长期妥协 (Positive &amp; Negative Consequences)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">正面: 架构大幅简化，零运维额外组件；负面: 需定期 VACUUM 维护表空间膨胀</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">诚实记录本决策带来的副作用与维护成本，让未来接手的工程师明确知晓当年的决策背景！</text>
      </g>
    </g>
  </g>
</svg>