<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="service-architecture-decision-records-adr-matrix-title service-architecture-decision-records-adr-matrix-desc"><title id="service-architecture-decision-records-adr-matrix-title">架构决策记录 (ADR)：从业务上下文、约束条件、方案权衡到不可逆后果的决策矩阵</title><desc id="service-architecture-decision-records-adr-matrix-desc">架构决策记录 (ADR)：从业务上下文、约束条件、方案权衡到不可逆后果的决策矩阵</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">第一行代码之前：架构决策记录 (ADR) 完整要素与论证闭环</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 状态与时间 (Status) ｜ 2. 物理上下文与约束 (Context) ｜ 3. 核心决策 (Decision) ｜ 4. 正负后果与妥协 (Consequences)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 决策状态与元数据 (Metadata &amp; Lifecycle)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">ADR-0042: 使用 PostgreSQL 作为统一状态存储 ｜ Status: Accepted ｜ Date: 2026-08-30</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">记录决策提出人、评审人、生效日期与生命周期状态 (Proposed / Accepted / Superseded)！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. 物理约束与业务上下文 (Physical Constraints &amp; Context)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">业务日增量 500 万行、团队仅 3 名后端维护、要求强 ACID 事务与 JSON 灵活扩展</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">清晰定义当前面临的真实业务挑战、硬件资源预算、团队技能储备与不可突破的红线边界！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. 方案对比与决策论证 (Tradeoff Matrix &amp; Decision)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">对比方案: MongoDB (无强事务被否) vs MySQL (JSON 索引弱) vs PostgreSQL (完美契合，选定！)</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">严禁直接给出结论！必须写明至少 2 个被否决备选方案的具体缺陷与放弃理由！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 承受的正负后果与长期妥协 (Positive &amp; Negative Consequences)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">正面: 架构大幅简化，零运维额外组件；负面: 需定期 VACUUM 维护表空间膨胀</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">诚实记录本决策带来的副作用与维护成本，让未来接手的工程师明确知晓当年的决策背景！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
