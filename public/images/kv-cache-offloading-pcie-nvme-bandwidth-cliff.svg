<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="kv-cache-offloading-pcie-nvme-bandwidth-cliff-title kv-cache-offloading-pcie-nvme-bandwidth-cliff-desc"><title id="kv-cache-offloading-pcie-nvme-bandwidth-cliff-title">KV Cache 多级分层卸载 (Offloading)：GPU HBM、Host RAM 与 NVMe SSD…</title><desc id="kv-cache-offloading-pcie-nvme-bandwidth-cliff-desc">KV Cache 多级分层卸载 (Offloading)：GPU HBM、Host RAM 与 NVMe SSD 带宽断崖</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">KV Cache 三级存储金字塔与带宽断崖：HBM vs CPU RAM vs NVMe SSD</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">GPU HBM (3.35 TB/s, 80GB) ──► PCIe 5.0 (64 GB/s, 512GB) ──► NVMe SSD (7 GB/s, 8TB) ｜ 异步流水线预取打破带宽瓶颈</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">L1: GPU HBM3 显存 (热数据)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">• 带宽: 3,350 GB/s (超高物理带宽)</text>
          <text x="10" y="34" fill="#f5f5f5">• 延迟: &lt; 10 纳秒</text>
          <text x="10" y="50" fill="#f5f5f5">• 容量: 仅 80GB / 96GB (极度昂贵稀缺)</text>

          <text x="10" y="74" fill="#f5f5f5">定位与策略：</text>
          <text x="10" y="90" fill="#f5f5f5">• 存放当前正在活跃生成的前 100 个请求</text>
          <text x="10" y="108" fill="#f5f5f5">✓ 保证 Tensor Core 0 饥饿极速计算！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 核心推理计算主战场；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 必须时刻保持高水位运转；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 显存管理的最高优先级调度目标。</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">L2: Host CPU RAM (温数据)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">• 带宽: 64 GB/s (PCIe 5.0 x16 通道)</text>
          <text x="10" y="34" fill="#f5f5f5">• 延迟: ~100 纳秒</text>
          <text x="10" y="50" fill="#f5f5f5">• 容量: 512GB ~ 2TB (成本低廉)</text>

          <text x="10" y="74" fill="#f5f5f5">定位与策略：</text>
          <text x="10" y="90" fill="#f5f5f5">• 存放被抢占挂起的会话与共享前缀</text>
          <text x="10" y="108" fill="#f5f5f5">✓ 异步 CUDA Stream 双缓冲流水线预取！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 隐藏在计算背后的异步预加载；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 吞吐量与容量的绝佳缓冲垫；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造超大容量并发池。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">L3: NVMe SSD 固态硬盘 (冷数据)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">• 带宽: 7.0 GB/s (PCIe 4.0 NVMe)</text>
          <text x="10" y="34" fill="#f5f5f5">• 延迟: ~10 微秒</text>
          <text x="10" y="50" fill="#f5f5f5">• 容量: 8TB ~ 30TB (极低成本)</text>

          <text x="10" y="74" fill="#f5f5f5">定位与策略：</text>
          <text x="10" y="90" fill="#f5f5f5">• 存放长达数十万字的跨天历史会话树</text>
          <text x="10" y="108" fill="#f5f5f5">✓ io_uring 异步直接 I/O 零阻塞读写！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 彻底消灭单机并发上限；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 支持全量保存数百万长对话历史；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级企业 AI 系统的终极存储底座！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
