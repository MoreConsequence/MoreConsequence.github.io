<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">KV Cache 三级存储金字塔与带宽断崖：HBM vs CPU RAM vs NVMe SSD</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">GPU HBM (3.35 TB/s, 80GB) ──► PCIe 5.0 (64 GB/s, 512GB) ──► NVMe SSD (7 GB/s, 8TB) ｜ 异步流水线预取打破带宽瓶颈</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1: L1 HBM -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">L1: GPU HBM3 显存 (热数据)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">• 带宽: 3,350 GB/s (超高物理带宽)</text>
          <text x="10" y="34" fill="#93c5fd">• 延迟: &lt; 10 纳秒</text>
          <text x="10" y="50" fill="#f87171">• 容量: 仅 80GB / 96GB (极度昂贵稀缺)</text>
          
          <text x="10" y="74" fill="#4ade80">定位与策略：</text>
          <text x="10" y="90" fill="#86efac">• 存放当前正在活跃生成的前 100 个请求</text>
          <text x="10" y="108" fill="#34d399">✓ 保证 Tensor Core 0 饥饿极速计算！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 核心推理计算主战场；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 必须时刻保持高水位运转；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 显存管理的最高优先级调度目标。</text>
      </g>
    </g>

    <!-- Col 2: L2 CPU RAM -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">L2: Host CPU RAM (温数据)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">• 带宽: 64 GB/s (PCIe 5.0 x16 通道)</text>
          <text x="10" y="34" fill="#86efac">• 延迟: ~100 纳秒</text>
          <text x="10" y="50" fill="#38bdf8">• 容量: 512GB ~ 2TB (成本低廉)</text>
          
          <text x="10" y="74" fill="#34d399">定位与策略：</text>
          <text x="10" y="90" fill="#fed7aa">• 存放被抢占挂起的会话与共享前缀</text>
          <text x="10" y="108" fill="#4ade80">✓ 异步 CUDA Stream 双缓冲流水线预取！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 隐藏在计算背后的异步预加载；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 吞吐量与容量的绝佳缓冲垫；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造超大容量并发池。</text>
      </g>
    </g>

    <!-- Col 3: L3 NVMe SSD -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">L3: NVMe SSD 固态硬盘 (冷数据)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">• 带宽: 7.0 GB/s (PCIe 4.0 NVMe)</text>
          <text x="10" y="34" fill="#fed7aa">• 延迟: ~10 微秒</text>
          <text x="10" y="50" fill="#38bdf8">• 容量: 8TB ~ 30TB (极低成本)</text>
          
          <text x="10" y="74" fill="#34d399">定位与策略：</text>
          <text x="10" y="90" fill="#fed7aa">• 存放长达数十万字的跨天历史会话树</text>
          <text x="10" y="108" fill="#4ade80">✓ io_uring 异步直接 I/O 零阻塞读写！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底消灭单机并发上限；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 支持全量保存数百万长对话历史；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级企业 AI 系统的终极存储底座！</text>
      </g>
    </g>
  </g>
</svg>