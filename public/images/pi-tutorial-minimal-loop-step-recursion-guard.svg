<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">极简 Agent 循环三大工程防御铁律 (Three Safety Guards)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 步数上限硬拦截 (MaxSteps = 15) ｜ 2. 工具异常结构化回传 (Never Throw) ｜ 3. 用户 Ctrl+C 信号无缝释放</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 步数硬熔断 (MaxSteps Guard)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">防止无限死循环烧 Token：</text>
          
          <text x="10" y="38" fill="#86efac">• while (steps &lt; MAX_STEPS)</text>
          <text x="10" y="54" fill="#38bdf8">• 达到 15 步强制 break 退出</text>
          <text x="10" y="70" fill="#f87171">• 输出警告: "已达到最大步数限制"</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 杜绝天价意外账单！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 每一个 Agent 循环的第一行代码；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 保证系统行为的确定性终止；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 必备安全底线。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 工具异常结构化捕获 (Never Throw)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">错误即反馈，绝不崩溃主进程：</text>
          
          <text x="10" y="38" fill="#86efac">• try { executeTool() } catch (err)</text>
          <text x="10" y="54" fill="#38bdf8">• return "Error: file not found"</text>
          <text x="10" y="70" fill="#4ade80">• 让大模型自主读取错误并自愈修复！</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 赋予 Agent 强大的自愈力！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 将物理异常转化为模型可理解的文本；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 避免一处报错导致整条链路死机；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 弹性韧性基石。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 信号优雅处理 (SIGINT Handlers)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">用户随时可控：</text>
          
          <text x="10" y="38" fill="#fed7aa">• process.on('SIGINT', abort)</text>
          <text x="10" y="54" fill="#38bdf8">• 瞬间关闭底层网络与子进程</text>
          <text x="10" y="70" fill="#4ade80">• 恢复终端光标与屏幕模式</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 体验极佳的交互控制！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 保持命令行环境干净整洁；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 0 终端卡死或光标丢失 bug；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 资深工程师细节！</text>
      </g>
    </g>
  </g>
</svg>