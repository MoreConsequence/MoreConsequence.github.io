<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">特性快照测试 (Characterization Test / Golden Master) 保护网架构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 遗留系统行为录制 ──► 2. 固化为 Golden 快照基线 ──► 3. 大刀阔斧重构代码 ──► 4. 自动化回归 Diff 对比断言行为 100% 不变</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 遗留大泥球黑盒行为捕获 (Legacy Black-Box Snapshot)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">无需理解 5000 行面条代码内部逻辑 ──► 构造 10,000 组随机与边界输入组合 ──► 捕获输出并固化为 snapshot.json</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将系统现有的一切行为（包括历史怪癖 Bug）完全冻结！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 搭建极速自动化断言脚手架 (Automated Baseline Assertion)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">编写单元测试: assert(NewSystem(input) == GoldenMaster(input)) ──► 毫秒级全量自动化跑通</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">为重构筑起坚不可摧的无形安全钢缆！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 大胆实施架构解耦与重构 (Aggressive Architecture Refactoring)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">提取策略模式 ──► 消除全局可变状态 ──► 拆解超长函数 ──► 引入领域驱动设计 (DDD)</text>
        <text x="15" y="62" font-size="8" fill="#047857">彻底摆脱“不敢动老代码”的恐惧心理！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 0 行为漂移完美交付 (Zero-Regression Verified Delivery)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">10,000 组快照对比 100% 字节级一致 ──► 代码可读性提升 10 倍 ──► 零事故平滑上线发布！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">重构遗留系统的最高工程艺术典范！</text>
      </g>
    </g>
  </g>
</svg>