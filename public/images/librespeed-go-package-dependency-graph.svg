<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LibreSpeed Go 极简分层架构：2,371 行源码的工业分工</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">main.go 启动引导 ──► config/viper 配置加载 ──► web/handlers 测速与遥测 ──► database 7 种驱动存储适配</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 启动入口与信号捕获 (cmd/speedtest/main.go: 27 行)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">读取 CLI 参数 ──► 注入 viper 配置 ──► 启动 HTTP/HTTPS Server ──► 监听 SIGINT 优雅退出</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">极度克制的启动引导，0 冗余全局变量！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 协议与中间件装配面 (pkg/web/router.go: 3 种路由形态)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">原生标准路径 (/garbage, /empty) ｜ 后端兼容路径 (/backend/...) ｜ 静态资源与模板托管</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">单份核心业务逻辑无缝适配三种前端调用契约！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 核心测量与业务逻辑 (pkg/web/handlers.go: 下行推流与黑洞吸收)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">GarbageChunkWriter 零分配推流 ｜ io.Copy(io.Discard, req.Body) 上行黑洞 ｜ IP 地址解析</text>
        <text x="15" y="62" font-size="8" fill="#047857">纯标准库手写，单核支撑 10Gbps+ 极限网络吞吐！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 遥测持久化驱动层 (pkg/database: 单一接口 7 个后端)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">DB 抽象接口 ──► MySQL / PostgreSQL / SQLite / Redis / BoltDB / Memory / CSV</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Go 语言接口隔离与依赖倒置原则的教科书级范例！</text>
      </g>
    </g>
  </g>
</svg>