<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">两阶段提交 (2PC) 崩溃恢复决策矩阵 (Crash Recovery Decision)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Redo 为 Prepare 状态 ──► 检查 Binlog 中是否存在相同 XID ──► 存在则自动提交 (Commit)，不存在则安全回滚 (Rollback)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Crash before Binlog -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 场景 A：写入 Binlog 前断电崩溃</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">1. Redo Log 写入: State = PREPARE, XID = 10086</text>
          <text y="30" fill="#ef4444">💥 突然断电！Binlog 尚未落盘 (Binlog 无 XID: 10086)</text>
          
          <text y="56" fill="#f87171">重启崩溃恢复决策：</text>
          <text y="70" fill="#fca5a5">• 扫描 Binlog 发现该事务并未完成写入</text>
          <text y="84" fill="#ef4444">• 若强制提交，会导致从库丢失该事务（主从不一致！）</text>
          <text y="98" fill="#4ade80">• 裁决: 调用 Undo Log 彻底执行 ROLLBACK 回滚！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">一致性保障：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 主库回滚未完成事务；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 从库从未收到 Binlog，双方状态保持 100% 绝对一致；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 0 数据错乱！</text>
      </g>
    </g>

    <!-- Right: Crash after Binlog -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 场景 B：写入 Binlog 后断电崩溃</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">1. Redo Log: PREPARE | Binlog: 写入成功 XID = 10086</text>
          <text y="30" fill="#fb923c">💥 此时断电！Redo Log 尚未更新为 COMMIT 状态</text>
          
          <text y="56" fill="#86efac">重启崩溃恢复决策：</text>
          <text y="70" fill="#34d399">• 扫描 Binlog 发现 XID: 10086 已经完整持久化</text>
          <text y="84" fill="#34d399">• 从库可能已经同步了该条 Binlog！</text>
          <text y="98" fill="#4ade80">• 裁决: 主库自动执行 COMMIT 补全提交状态！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 主库与从库数据丝毫不差；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 实现了跨存储引擎与 Server 层的分布式 2PC 闭环；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 数据库事务原子性与持久性的巅峰之作！</text>
      </g>
    </g>
  </g>
</svg>