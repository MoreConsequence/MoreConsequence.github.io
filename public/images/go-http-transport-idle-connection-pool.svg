<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go http.Transport 连接池陷阱：默认 DefaultMaxIdleConnsPerHost = 2</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">高并发突发 1000 QPS ──► 仅 2 条连接进池复用 ──► 其余 998 条连接被无情 close ──► TIME_WAIT 爆表与 TCP 握手雪崩</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Default Trap -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 默认配置灾难：99% 连接无法复用</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// http.DefaultTransport 源码默认值：</text>
          <text y="30" fill="#fca5a5">MaxIdleConns:        100, // 全局总空闲连接数</text>
          <text y="46" fill="#f87171">MaxIdleConnsPerHost: 2,   // 单 Host 仅允许 2 条空闲！</text>
          
          <text y="70" fill="#ef4444">🔴 当单微服务发起 500 QPS 并发调用时：</text>
          <text y="86" fill="#fca5a5">1. 请求处理完毕归还连接时，发现池中已有 2 条；</text>
          <text y="102" fill="#fca5a5">2. 触发 transport.putIdleConn: 直接将剩余 498 条物理关闭！</text>
          <text y="120" fill="#fb7185">► 下一秒新请求被迫重新执行 TCP 3次握手 + TLS 握手！</text>
          <text y="136" fill="#ef4444">► 产生海量 TIME_WAIT 套接字，端口耗尽崩溃！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产典型病症：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 服务间 RPC 延迟从 2ms 莫名其妙飙升至 50ms+；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• CPU 在 TLS 握手加解密阶段白白消耗 70%；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 根本原因：默认连接池配置未按业务规模调优！</text>
      </g>
    </g>

    <!-- Right: Production Best Practice -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 生产级 Client.Transport 黄金配置模版</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">var ProductionTransport = &amp;http.Transport{</text>
          <text y="30" fill="#86efac">    MaxIdleConns:        1000, // 支撑海量跨服务连接</text>
          <text y="46" fill="#34d399">    MaxIdleConnsPerHost: 200,  // 单 Host 允许 200 条热连接！</text>
          <text y="62" fill="#86efac">    MaxConnsPerHost:     500,  // 限制硬上限，防击穿下游</text>
          <text y="78" fill="#86efac">    IdleConnTimeout:     90 * time.Second,</text>
          <text y="94" fill="#cbd5e1">    TLSHandshakeTimeout: 10 * time.Second,</text>
          <text y="110" fill="#38bdf8">}</text>
          <text y="128" fill="#34d399">✓ 100% 命中热连接，网络延迟暴降至 0.5ms！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">配套代码红线：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">1. 读取响应后务必: io.Copy(io.Discard, resp.Body)；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">2. 显式调用 resp.Body.Close() 归还连接到池中；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">3. 严禁每次请求都 new http.Client() (必须全局单例复用)！</text>
      </g>
    </g>
  </g>
</svg>