<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="redis-stream-as-mq-pel-ack-vs-kafka-title redis-stream-as-mq-pel-ack-vs-kafka-desc"><title id="redis-stream-as-mq-pel-ack-vs-kafka-title">Redis 当消息队列的账本：List / PubSub / Stream PEL 待确认列表 vs 专业 Kafka…</title><desc id="redis-stream-as-mq-pel-ack-vs-kafka-desc">Redis 当消息队列的账本：List / PubSub / Stream PEL 待确认列表 vs 专业 Kafka 对比</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Redis 当消息队列的边界账本：Stream 消费组与 PEL 待确认队列</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Pub/Sub (无持久化，宕机即丢) ｜ List RPOPLPUSH (缺乏多消费者组) ｜ Stream XREADGROUP (PEL 待确认列表、XACK 与死信 XCLAIM 机制)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Redis 5.0+ Stream 完整消息队列模型</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// Stream 核心数据流</text>
          <text y="28" fill="#f5f5f5">XADD mystream * sensor-id 1234 temp 19.8</text>
          <text y="42" fill="#f5f5f5">XREADGROUP GROUP mygroup consumer1 STREAMS mystream &gt;</text>

          <text y="66" fill="#f5f5f5">1. PEL (Pending Entries List) 待确认列表:</text>
          <text y="80" fill="#f5f5f5">   • 记录所有"已分发但尚未收到 XACK 的在途消息"</text>
          <text y="94" fill="#f5f5f5">   • 消费者崩溃重启时，拉取 PEL 重新处理，0 丢失！</text>
          <text y="110" fill="#f5f5f5">2. XCLAIM / XAUTOCLAIM 机制: 超时自动转交给健康消费者！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制优势：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 相比 Kafka 极度轻量，无需额外搭建 ZooKeeper/KRaft；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 内存级吞吐，单机轻松承受数十万 QPS；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 适合中小型业务或轻量异步任务分发。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 物理天花板：为什么它不能替代 Kafka？</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">1. 内存容量是物理死穴 (RAM is Expensive):</text>
          <text y="28" fill="#f5f5f5">   • 消息全部驻留内存，积压 1000 万条直接触发 OOM 宕机！</text>
          <text y="44" fill="#f5f5f5">   • Kafka 基于磁盘 PageCache 顺序写，几 TB 积压稳如泰山！</text>

          <text y="68" fill="#f5f5f5">2. 主从异步复制与数据丢失窗 (Async Replication):</text>
          <text y="82" fill="#fb7185">   • Master 宕机 Failover 时，尚未同步到 Slave 的消息永久丢失！</text>

          <text y="106" fill="#f5f5f5">✓ 决策红线: 允许少量丢数据且无严重积压选 Redis，否则坚决上 Kafka！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">选型警示：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 不要把 Redis 当作大容量消息持久化存储；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 严格配置 XADD MAXLEN 驱逐淘汰老消息；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 清晰划分系统架构的边界与职责！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
