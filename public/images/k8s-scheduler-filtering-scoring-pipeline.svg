<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="k8s-scheduler-filtering-scoring-pipeline-title k8s-scheduler-filtering-scoring-pipeline-desc"><title id="k8s-scheduler-filtering-scoring-pipeline-title">Kubernetes kube-scheduler 两阶段调度流水线：PreFilter -&gt; Filter -&gt;…</title><desc id="k8s-scheduler-filtering-scoring-pipeline-desc">Kubernetes kube-scheduler 两阶段调度流水线：PreFilter -&gt; Filter -&gt; Score -&gt; Reserve -&gt; Bind</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">K8s kube-scheduler 调度框架五大阶段流水线 (Scheduling Framework)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. Filter (硬性约束过滤) ──► 2. Score (软性加权打分) ──► 3. Reserve (内存预扣账本) ──► 4. Permit ──► 5. Bind (异步向 etcd 写入绑定)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. Filter 阶段: 候选节点硬性过滤 (Predicate Filtering: NodeResourcesFit / MatchNodeSelector)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">检查可用 CPU/内存、污点容忍 (Tolerations)、端口冲突 ──► 从 1,000 个节点中筛选出 50 个合格节点</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">并发无锁快速初筛，一票否决淘汰不合规宿主！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. Score 阶段: 多策略综合加权打分 (Prioritizing: NodeResourcesBalancedAllocation / ImageLocality)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">评估镜像是否已预热缓存 (+20分)、资源碎片比例平衡度 (+40分)、拓扑分散防单点故障 (+30分) ──► 选出最高分胜出节点</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">实现集群资源利用率与高可用容灾的数学最优解！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. Reserve 阶段: 内存账本乐观预扣 (Optimistic Resource Reservation)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">在调度器本地账本中瞬间预先扣减目标节点资源 ──► 0ms 瞬间进入下一个 Pod 的调度！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">杜绝等待 etcd 网络写入期间发生资源超卖踩踏！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. Bind 阶段: 异步持久化至 etcd (Asynchronous Binding to API Server)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">后台 Goroutine 发起 Binding 创建请求 ──► 目标节点 Kubelet 监听到事件 ──► 启动容器运行！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">支持每秒上千 Pod 极限并发吞吐调度的核心秘诀！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
