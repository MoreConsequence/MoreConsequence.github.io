<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="two-phase-commit-2pc-coordinator-blocking-title two-phase-commit-2pc-coordinator-blocking-desc"><title id="two-phase-commit-2pc-coordinator-blocking-title">二阶段提交 (2PC) 物理时序：Prepare (投票) -&gt; Commit (提交) 与协调者单点阻塞</title><desc id="two-phase-commit-2pc-coordinator-blocking-desc">二阶段提交 (2PC) 物理时序：Prepare (投票) -&gt; Commit (提交) 与协调者单点阻塞</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">二阶段提交 (2PC: Two-Phase Commit) 强一致模型与阻塞缺陷</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Phase 1 (Prepare: 预留资源并写准备日志) ──► Phase 2 (Commit/Abort: 全量提交或全量回滚) ｜ 协调者宕机导致参与者资源永久锁死阻塞</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. Phase 1: 准备与投票阶段 (Prepare / Voting Phase)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">协调者向所有参与者发送 Prepare ──► 参与者执行本地事务、锁定行记录、写入 Undo/Redo 日志 ──► 响应 "VOTE_COMMIT"</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">全员进入待决状态，资源被死死锁住！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 协调者单点崩溃陷阱 (Coordinator Crash &amp; Resource Deadlock)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">协调者在此刻断电宕机 ──► 参与者无法得知最终应该提交还是回滚 ──► 数据库行锁永久无法释放</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">2PC 最大的致命物理缺陷：同步阻塞与单点故障！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. Phase 2: 决议与全量提交 (Decision &amp; Commit Phase)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">全员同意 ──► 协调者写入 Commit 决议日志 ──► 广播发送 Commit 指令 ──► 参与者正式提交并释放锁</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">达成跨数据库的严格 ACID 强一致性！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 工业界现代替代演进 (Evolution to Saga &amp; TCC)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">微服务超高并发场景全面放弃 2PC ──► 转为 Saga 异步补偿或 Seata TCC 模式 ──► 释放锁压力！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">从刚性强一致迈向柔性最终一致性的历史演进！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
