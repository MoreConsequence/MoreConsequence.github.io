<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="cache-aside-pattern-delete-vs-update-title cache-aside-pattern-delete-vs-update-desc"><title id="cache-aside-pattern-delete-vs-update-title">Cache-Aside 经典模式：先更 DB 再删 Cache vs 先删 Cache 读写并发竞态</title><desc id="cache-aside-pattern-delete-vs-update-desc">Cache-Aside 经典模式：先更 DB 再删 Cache vs 先删 Cache 读写并发竞态</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Cache-Aside 旁路缓存一致性时序：先更库再删缓存 (Standard)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">先删缓存再更库 (读写并发必写回脏旧数据) vs 先更库再删缓存 (极端偶发竞态可通过延迟双删/Binlog 监听平滑消解)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 先删缓存，再更新数据库：极高概率脏数据</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">并发读写竞态时序：</text>
          <text y="28" fill="#f5f5f5">1. 写线程 A: 删除 Redis 缓存 key</text>
          <text y="42" fill="#f5f5f5">2. 读线程 B: 查 Redis 未命中 ──► 查 DB 读出旧值 100</text>
          <text y="56" fill="#f5f5f5">3. 写线程 A: 更新 DB 为新值 200 事务提交</text>
          <text y="70" fill="#f5f5f5">4. 读线程 B: 将旧值 100 写入 Redis 缓存！</text>

          <text y="94" fill="#f5f5f5">💥 灾难后果：Redis 永久保持旧值 100，DB 永远为 200！</text>
          <text y="108" fill="#f5f5f5">🔴 只要缓存未过期，所有用户持续读到脏数据！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 数据库与缓存出现永久性不一致；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 极高并发下的致命设计反模式；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 严禁在生产中使用！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 先更新数据库，再删除缓存：业界标准实践</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">并发读写安全流转：</text>
          <text y="28" fill="#f5f5f5">1. 写线程 A: 先更新 DB 为新值 200 提交事务</text>
          <text y="42" fill="#f5f5f5">2. 写线程 A: 随后立即删除 Redis 缓存 key</text>

          <text y="64" fill="#f5f5f5">3. 后续读线程 C 访问：</text>
          <text y="78" fill="#f5f5f5">   • 发现缓存已失效 ──► 查 DB 读出最新值 200</text>
          <text y="92" fill="#f5f5f5">   • 将最新值 200 重新回填写入 Redis！</text>

          <text y="114" fill="#f5f5f5">✓ 绝大多数业务场景下 100% 最终一致！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 写入逻辑简单清晰，无需复杂锁协作；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 配合 Canal/CDC Binlog 异步重试保底删除；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级分布式缓存金标准！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
