<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Cache-Aside 旁路缓存一致性时序：先更库再删缓存 (Standard)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">先删缓存再更库 (读写并发必写回脏旧数据) vs 先更库再删缓存 (极端偶发竞态可通过延迟双删/Binlog 监听平滑消解)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Delete First Bug -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 先删缓存，再更新数据库：极高概率脏数据</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">并发读写竞态时序：</text>
          <text y="28" fill="#fca5a5">1. 写线程 A: 删除 Redis 缓存 key</text>
          <text y="42" fill="#38bdf8">2. 读线程 B: 查 Redis 未命中 ──► 查 DB 读出旧值 100</text>
          <text y="56" fill="#f87171">3. 写线程 A: 更新 DB 为新值 200 事务提交</text>
          <text y="70" fill="#ef4444">4. 读线程 B: 将旧值 100 写入 Redis 缓存！</text>
          
          <text y="94" fill="#ef4444">💥 灾难后果：Redis 永久保持旧值 100，DB 永远为 200！</text>
          <text y="108" fill="#f87171">🔴 只要缓存未过期，所有用户持续读到脏数据！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 数据库与缓存出现永久性不一致；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 极高并发下的致命设计反模式；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严禁在生产中使用！</text>
      </g>
    </g>

    <!-- Right: Update First Standard -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 先更新数据库，再删除缓存：业界标准实践</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">并发读写安全流转：</text>
          <text y="28" fill="#86efac">1. 写线程 A: 先更新 DB 为新值 200 提交事务</text>
          <text y="42" fill="#38bdf8">2. 写线程 A: 随后立即删除 Redis 缓存 key</text>
          
          <text y="64" fill="#34d399">3. 后续读线程 C 访问：</text>
          <text y="78" fill="#34d399">   • 发现缓存已失效 ──► 查 DB 读出最新值 200</text>
          <text y="92" fill="#4ade80">   • 将最新值 200 重新回填写入 Redis！</text>
          
          <text y="114" fill="#4ade80">✓ 绝大多数业务场景下 100% 最终一致！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 写入逻辑简单清晰，无需复杂锁协作；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 配合 Canal/CDC Binlog 异步重试保底删除；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级分布式缓存金标准！</text>
      </g>
    </g>
  </g>
</svg>