<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#ea580c"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">非对称网络分区脑裂（Split-Brain）与 Pre-Vote 预投票防护机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">孤立节点单向丢包导致 Term 无限膨胀打崩合法 Leader vs Pre-Vote 试探性选举防御</text>
  </g>

  <!-- Main Comparison Panes -->
  <g transform="translate(30, 75)">
    <!-- Left Pane: The Danger of Split Brain & Disrupted Leader (435px) -->
    <g filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
      <rect width="435" height="36" rx="8" fill="#fef2f2"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 无 Pre-Vote：孤立节点打崩正常集群</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Step 1 -->
        <rect width="403" height="40" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="12" y="18" fill="#991b1b" font-weight="700">1. 网络分区：Node 5 被单向孤立</text>
        <text x="12" y="32" font-size="9.5" fill="#7f1d1d">收不到 Leader (Term 1) 心跳，超时触发选举，递增至 Term 2, 3, 4...</text>

        <!-- Step 2 -->
        <rect y="48" width="403" height="52" rx="4" fill="#fee2e2" stroke="#f87171"/>
        <text x="12" y="66" fill="#7f1d1d" font-weight="700">2. 分区恢复：Node 5 带着高任期 (Term 10) 归来</text>
        <text x="12" y="80" font-size="9.5" fill="#991b1b">向集群广播 RequestVote(Term=10)；合法 Leader 收到更高 Term 强制降级！</text>
        <text x="12" y="93" font-size="9.5" font-weight="700" fill="#b91c1c">💥 灾难：集群被迫中断正常读写，重新进入无主选举震荡！</text>

        <!-- Step 3 -->
        <rect y="108" width="403" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="12" y="126" fill="#0f172a" font-weight="700">物理后果：</text>
        <text x="12" y="140" fill="#64748b" font-size="10">短暂抖动可导致微服务 RPC 出现连接重置与几百毫秒 P99 毛刺</text>
      </g>
    </g>

    <!-- Right Pane: Pre-Vote Solution (435px) -->
    <g transform="translate(465, 0)" filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="36" rx="8" fill="#f0fdf4"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">🛡️ 工业解法：Raft Pre-Vote（预投票机制）</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Step 1 -->
        <rect width="403" height="40" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
        <text x="12" y="18" fill="#14532d" font-weight="700">1. 选举前先发起试探性的 Pre-Vote</text>
        <text x="12" y="32" font-size="9.5" fill="#15803d">Node 5 发送 PreVote(Term=1)，<tspan font-weight="700" fill="#047857">暂不真正增加当前物理 Term</tspan></text>

        <!-- Step 2 -->
        <rect y="48" width="403" height="52" rx="4" fill="#ecfdf5" stroke="#10b981"/>
        <text x="12" y="66" fill="#065f46" font-weight="700">2. 其余健康节点直接拒绝预投票</text>
        <text x="12" y="80" font-size="9.5" fill="#047857">健康节点仍在稳定接收 Leader 心跳，判定 Leader 存活 ──► 拒绝 Pre-Vote</text>
        <text x="12" y="93" font-size="9.5" font-weight="700" fill="#047857">✓ 胜利：Node 5 得不到多数派支持，Term 永远停留在 1，无法干扰主集群！</text>

        <!-- Step 3 -->
        <rect y="108" width="403" height="42" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="12" y="126" fill="#1e40af" font-weight="700">工业生产事实标准：</text>
        <text x="12" y="140" fill="#2563eb" font-size="10">etcd、TiKV、Sofa-JRaft 等生产级 Raft 引擎默认全量开启 Pre-Vote</text>
      </g>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(30, 375)">
    <rect width="900" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <text x="450" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      💡 <tspan font-weight="700" fill="#0f172a">网络分区本质：</tspan> 在异步网络中，节点无法区分“Leader 宕机”与“自己单向断网”；<tspan font-weight="700" fill="#2563eb">Pre-Vote 将投票权判定前置</tspan>，杜绝了任期通胀破坏共识。
    </text>
  </g>
</svg>
