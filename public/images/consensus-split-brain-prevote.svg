<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="prevote-title prevote-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="prevote-title">非对称网络分区脑裂与 Pre-Vote 预投票防护机制</title>
  <desc id="prevote-desc">对比图展示传统 Raft 孤立节点 Term 盲目递增打崩正常 Leader 的缺陷，以及 Pre-Vote 试探机制在获得多数派许可前绝不递增 Term 的防护原理。</desc>
  <defs>
    <marker id="pv-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="pv-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">ASYMMETRIC PARTITION · PRE-VOTE PROTOCOL DEFENSE</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">非对称网络分区脑裂与 Pre-Vote 防护机制</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">经典 Raft 孤立节点 Term 暴增打崩现任 Leader；Pre-Vote 试探阶段绝不递增物理任期，从根源杜绝选举震荡</text>

  <!-- Left: Classic Raft Flaw (Mode A, x=40..460, w=420) -->
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="14" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="27" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">MODE A</text>
    <text x="100" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">经典 Raft 规范：任期盲目膨胀与 Leader 击坠</text>

    <!-- Step 1: Isolation & Inflation -->
    <rect x="14" y="46" width="392" height="64" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="68" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 非对称分区孤立 (Node 5)</text>
    <text x="26" y="86" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">收不到 Leader 心跳 ➔ 频繁触发 Election Timeout</text>
    <text x="26" y="100" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">物理 Term 持续自增: Term 1 ➔ 2 ➔ 10 ➔ 100</text>

    <!-- Step 2: Healing & Attack -->
    <rect x="14" y="118" width="392" height="64" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="140" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 分区自愈与广播 RequestVote</text>
    <text x="26" y="158" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Node 5 带着畸高 Term=100 广播拉票 RPC</text>
    <text x="26" y="172" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">全网节点收到大于自身的 Term</text>

    <!-- Step 3: Leader Step Down -->
    <rect x="14" y="190" width="392" height="64" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="212" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">3. 现任 Leader 被迫无条件退位</text>
    <text x="26" y="230" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">Raft 铁律：发现更高 Term 必须立即降级为 Follower</text>
    <text x="26" y="244" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">现任 Leader (Term 1) 瞬间失效</text>

    <!-- Step 4: Cluster Impact -->
    <rect x="14" y="262" width="392" height="98" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="286" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">经典 Raft 生产后果</text>
    <text x="26" y="306" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">Node 5 日志落后无法当选，原 Leader 已被击退</text>
    <text x="26" y="324" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">集群陷入无主震荡，在途读写请求全部阻塞超时</text>
    <text x="26" y="342" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">高可用 SLA 严重受损</text>
  </g>

  <!-- Right: Pre-Vote Protection (Mode B, x=500..920, w=420) - Focal -->
  <g transform="translate(500, 136)">
    <rect width="420" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="14" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="27" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">MODE B</text>
    <text x="100" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">生产级 Pre-Vote 预投票机制 (etcd / TiKV 标准)</text>

    <!-- Step 1: PreCandidate -->
    <rect x="14" y="46" width="392" height="64" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="26" y="68" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 进入 PreCandidate 试探阶段</text>
    <text x="26" y="86" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">物理 currentTerm 保持不变 (严格锁定在 Term 1)</text>
    <text x="26" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">发送 PreVote(nextTerm=2) 轻量探测包</text>

    <!-- Step 2: Leader Stickiness Check -->
    <rect x="14" y="118" width="392" height="64" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="26" y="140" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 接收节点 Leader 租约粘性判定</text>
    <text x="26" y="158" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Node 2/3/4 仍持续收到正常 Leader 心跳</text>
    <text x="26" y="172" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">判定 Leader 存活 ➔ 断然拒绝 PreVote 请求！</text>

    <!-- Step 3: Quorum Denied -->
    <rect x="14" y="190" width="392" height="64" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="212" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">3. 未获多数派许可，保持静默</text>
    <text x="26" y="230" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">Node 5 无法收集多数派赞成票，无法真正发起竞选</text>
    <text x="26" y="244" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">任期维持在 Term 1，0 状态污染</text>

    <!-- Step 4: Zero Impact Healing -->
    <rect x="14" y="262" width="392" height="98" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1.2"/>
    <text x="26" y="286" fill="#e85d3f" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Pre-Vote 生产级防护收益</text>
    <text x="26" y="306" fill="#e85d3f" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">分区自愈后 Term 完全一致，现任 Leader 毫发无损！</text>
    <text x="26" y="324" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Node 5 静默重新对齐并追赶日志，0 业务停顿</text>
    <text x="26" y="342" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">99.999% 线性一致性高可用保障</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="562" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="550" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">经典 Raft 漏洞缺陷</text>
  <rect x="300" y="550" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="320" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Pre-Vote 预投票状态机防护</text>
  <line x1="530" y1="556" x2="554" y2="556" stroke="#e85d3f" stroke-width="1.5" marker-end="url(#pv-arr-accent)"/>
  <text x="562" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">零任期膨胀与 0 停顿自愈</text>
</svg>
