<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="e-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="440" rx="12" fill="#fafbff" stroke="#d7def0"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">事件循环的一轮：任务 → 微任务检查点 → （渲染机会）→ 下一任务</text>

  <line x1="140" y1="80" x2="140" y2="390" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 6"/>
  <text x="96" y="86" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">时间轴</text>

  <g font-size="13">
    <rect x="180" y="76" width="640" height="70" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="200" y="100" font-size="14" font-weight="700" fill="#3730a3">1. 取一个任务，执行到 JS 栈清空</text>
    <text x="200" y="122" font-size="12.5" fill="#475569">脚本、setTimeout 回调、事件回调、IO 回调——本轮只取一个任务</text>
    <text x="200" y="140" font-size="12.5" fill="#64748b">执行期间产生的微任务不立即执行，先排队</text>

    <rect x="180" y="162" width="640" height="70" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="200" y="186" font-size="14" font-weight="700" fill="#065f46">2. 微任务检查点：清空整个微任务队列</text>
    <text x="200" y="208" font-size="12.5" fill="#475569">Promise reaction、queueMicrotask、MutationObserver 回调全部执行</text>
    <text x="200" y="226" font-size="12.5" fill="#64748b">期间新产生的微任务继续追加执行——直到队列为空为止</text>

    <rect x="180" y="248" width="640" height="70" rx="8" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
    <text x="200" y="272" font-size="14" font-weight="700" fill="#854d0e">3. 渲染机会（可能发生，也可能跳过）</text>
    <text x="200" y="294" font-size="12.5" fill="#475569">浏览器按刷新率、可见性与主线程占用决定是否渲染一帧</text>
    <text x="200" y="312" font-size="12.5" fill="#64748b">rAF 回调在此阶段执行；任务较多时一帧可能跨多轮</text>

    <rect x="180" y="334" width="640" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="200" y="354" font-size="14" font-weight="700" fill="#334155">4. 回到任务队列，取下一个任务</text>
    <text x="200" y="372" font-size="12.5" fill="#64748b">一轮结束，从第 1 步开始——所以"循环"不是队列，是这套流程</text>
  </g>

  <circle cx="140" cy="111" r="6" fill="#6366f1"/>
  <circle cx="140" cy="197" r="6" fill="#34d399"/>
  <circle cx="140" cy="283" r="6" fill="#facc15"/>
  <circle cx="140" cy="356" r="6" fill="#94a3b8"/>

  <path d="M 180 378 C 140 400, 96 400, 96 380" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#e-arrow)"/>
  <text x="96" y="404" text-anchor="middle" font-size="11" fill="#6366f1">回到步骤 1</text>
</svg>
