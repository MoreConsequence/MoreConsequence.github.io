<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="rb-title rb-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="rb-title">MySQL 主从复制链路与延迟构成物理分解</title>
  <desc id="rb-desc">数据流架构图展示主库 Binlog Dump、网络传输、从库 I/O 线程写 Relay Log 以及 MTS 多线程并行重放各环节构成的复制延迟账单。</desc>
  <defs>
    <marker id="rb-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="rb-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">MYSQL ASYNCHRONOUS REPLICATION · PIPELINE &amp; LATENCY BREAKDOWN</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">MySQL 主从复制链路与延迟构成分解</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">Master (Binlog Dump) ➔ 网络传输 ➔ Replica (I/O 线程写 Relay Log) ➔ MTS (WRITESET 并行重放)</text>

  <!-- 4 Columns Pipeline Grid (y=136..506, h=370) -->
  <!-- Col 1: Master (x=40..245, w=205) -->
  <g transform="translate(40, 136)">
    <rect width="205" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="70" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="47" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 1</text>
    <text x="90" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">主库提交发送</text>

    <!-- Content Box -->
    <rect x="12" y="42" width="181" height="110" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Binlog Dump 线程</text>
    <text x="20" y="78" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">1. 事务提交并落盘 Binlog</text>
    <text x="20" y="94" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">2. WRITESET 记录写集依赖</text>
    <text x="20" y="110" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace">3. Dump 线程推流至网络</text>
    <text x="20" y="128" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Latency: &lt;1ms (极低)</text>

    <!-- Details -->
    <rect x="12" y="162" width="181" height="198" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="184" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">主库责任边界：</text>
    <text x="20" y="204" fill="#6b6a64" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 异步模式下主库立即返回；</text>
    <text x="20" y="222" fill="#141413" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 不等待任何从库接收；</text>
    <text x="20" y="240" fill="#e85d3f" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 主库成功 ≠ 从库可见！</text>
    <line x1="20" y1="254" x2="185" y2="254" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="20" y="274" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Source Commit Line</text>
    <text x="20" y="292" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Asynchronous Handshake</text>
  </g>

  <!-- Arrow 1 (x=245..265) -->
  <text x="255" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TCP</text>
  <line x1="245" y1="230" x2="265" y2="230" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#rb-arr-accent)"/>

  <!-- Col 2: Relay IO (x=265..480, w=215) -->
  <g transform="translate(265, 136)">
    <rect width="215" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="70" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="47" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 2</text>
    <text x="90" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">网络拉取与中转</text>

    <!-- Content Box -->
    <rect x="12" y="42" width="191" height="110" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Replica I/O 线程</text>
    <text x="20" y="78" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">1. 从 TCP Socket 读取数据包</text>
    <text x="20" y="94" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">2. 顺序写入 relay-bin.log</text>
    <text x="20" y="110" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace">3. 无需 fsync，仅 write() 缓存</text>
    <text x="20" y="128" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Retrieved_Gtid_Set 水位推进</text>

    <!-- Details -->
    <rect x="12" y="162" width="191" height="198" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="184" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">延迟影响变量：</text>
    <text x="20" y="204" fill="#6b6a64" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 跨机房专线 RTT 物理延迟；</text>
    <text x="20" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 网络拥塞或丢包重传抖动；</text>
    <text x="20" y="240" fill="#141413" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 单连接流控限制。</text>
    <line x1="20" y1="254" x2="195" y2="254" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="20" y="274" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Relay Buffer Station</text>
    <text x="20" y="292" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Lightweight Network Queue</text>
  </g>

  <!-- Arrow 2 (x=480..500) -->
  <text x="490" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Apply</text>
  <line x1="480" y1="230" x2="500" y2="230" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#rb-arr-accent)"/>

  <!-- Col 3: MTS Applier (x=500..725, w=225) - Focal -->
  <g transform="translate(500, 136)">
    <rect width="225" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="12" y="12" width="76" height="18" rx="2" fill="#e85d3f"/>
    <text x="50" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STAGE 3 · MTS</text>
    <text x="96" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">MTS 并行重放核心</text>

    <!-- Content Box -->
    <rect x="12" y="42" width="201" height="110" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="20" y="62" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">SQL Coordinator &amp; Workers</text>
    <text x="20" y="78" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace">1. WRITESET 分析行冲突图</text>
    <text x="20" y="94" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">2. 4~16 个 Worker 多线程并发写</text>
    <text x="20" y="110" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace">3. 冲突事务严格保序串行执行</text>
    <text x="20" y="128" fill="#e85d3f" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">延迟最大产生根源 (Lag Bottleneck)</text>

    <!-- Details -->
    <rect x="12" y="162" width="201" height="198" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="184" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">重放阻塞四大杀手：</text>
    <text x="20" y="204" fill="#e85d3f" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 大事务/大批 UPDATE (堵塞单 Worker)；</text>
    <text x="20" y="222" fill="#141413" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">2. DDL 锁表排队；</text>
    <text x="20" y="240" fill="#6b6a64" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 从库慢查询与重放争抢锁与 I/O；</text>
    <text x="20" y="258" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">4. 行级写冲突退化为单线程。</text>
    <line x1="20" y1="270" x2="205" y2="270" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="20" y="290" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">Executed_Gtid_Set Watermark</text>
  </g>

  <!-- Arrow 3 (x=725..745) -->
  <text x="735" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Read</text>
  <line x1="725" y1="230" x2="745" y2="230" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#rb-arr-accent)"/>

  <!-- Col 4: Visibility (x=745..920, w=175) -->
  <g transform="translate(745, 136)">
    <rect width="175" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="70" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="47" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STAGE 4</text>
    <text x="90" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">从库数据可见</text>

    <!-- Content Box -->
    <rect x="12" y="42" width="151" height="110" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">落盘与内存就绪</text>
    <text x="20" y="78" fill="#6b6a64" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 写入从库 Buffer Pool</text>
    <text x="20" y="94" fill="#e85d3f" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 生成从库 Undo/Redo</text>
    <text x="20" y="110" fill="#141413" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 业务读请求可查到新值</text>
    <text x="20" y="128" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Replica Query Available</text>

    <!-- Details -->
    <rect x="12" y="162" width="151" height="198" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="184" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">架构决策启示：</text>
    <text x="20" y="204" fill="#6b6a64" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 读写分离必须设计容忍度；</text>
    <text x="20" y="222" fill="#e85d3f" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 敏感数据走版本校验；</text>
    <text x="20" y="240" fill="#141413" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 强一致强行读主。</text>
    <line x1="20" y1="254" x2="155" y2="254" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="20" y="274" fill="#e85d3f" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">Eventual Consistency</text>
    <text x="20" y="292" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Lag Inherent to Async</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">主库推流与从库网络中转</text>
  <rect x="310" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="330" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">MTS 多线程并行重放与延迟主要发生地核心</text>
</svg>
