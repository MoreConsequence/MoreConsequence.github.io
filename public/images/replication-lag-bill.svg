<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="r-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" rx="12" fill="#fafbff" stroke="#d7def0"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">异步复制的延迟账单：每跳一个环节，延迟加一笔</text>

  <g font-size="13">
    <rect x="40" y="70" width="170" height="64" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="125" y="92" text-anchor="middle" font-weight="700" fill="#3730a3">主库</text>
    <text x="125" y="112" text-anchor="middle" font-size="12" fill="#475569">事务提交</text>
    <text x="125" y="128" text-anchor="middle" font-size="12" fill="#475569">写 binlog（与事务原子）</text>

    <rect x="40" y="176" width="170" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="125" y="198" text-anchor="middle" font-weight="600" fill="#334155">binlog</text>
    <text x="125" y="218" text-anchor="middle" font-size="12" fill="#64748b">本地磁盘,顺序写</text>

    <rect x="300" y="70" width="200" height="64" rx="8" fill="#fefce8" stroke="#facc15"/>
    <text x="400" y="92" text-anchor="middle" font-weight="700" fill="#854d0e">IO 线程</text>
    <text x="400" y="112" text-anchor="middle" font-size="12" fill="#475569">网络拉取 binlog 事件</text>
    <text x="400" y="128" text-anchor="middle" font-size="12" fill="#475569">写入 relay log（无 fsync）</text>

    <rect x="300" y="176" width="200" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="400" y="198" text-anchor="middle" font-weight="600" fill="#334155">relay log</text>
    <text x="400" y="218" text-anchor="middle" font-size="12" fill="#64748b">从库本地,无 fsync 保障</text>

    <rect x="590" y="70" width="200" height="64" rx="8" fill="#fef2f2" stroke="#f87171"/>
    <text x="690" y="92" text-anchor="middle" font-weight="700" fill="#991b1b">SQL 线程</text>
    <text x="690" y="112" text-anchor="middle" font-size="12" fill="#475569">重放事务（协调器分发）</text>
    <text x="690" y="128" text-anchor="middle" font-size="12" fill="#475569">与从库读并发竞争锁</text>

    <rect x="590" y="176" width="200" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="690" y="198" text-anchor="middle" font-weight="600" fill="#334155">从库数据</text>
    <text x="690" y="218" text-anchor="middle" font-size="12" fill="#64748b">读请求的可见数据</text>
  </g>

  <path d="M 210 134 L 300 120" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#r-arrow)"/>
  <path d="M 210 208 L 300 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#r-arrow)"/>
  <path d="M 500 134 L 590 120" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#r-arrow)"/>
  <path d="M 500 208 L 590 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#r-arrow)"/>

  <g font-size="12" fill="#64748b">
    <text x="272" y="106">网络 RTT</text>
    <text x="555" y="106">单线程→多线程</text>
    <text x="540" y="204">应用后可见</text>
  </g>

  <line x1="40" y1="272" x2="820" y2="272" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">延迟的构成（典型量级）</text>

  <rect x="60" y="316" width="200" height="34" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="160" y="338" text-anchor="middle" font-size="12.5" fill="#3730a3">主库本地：&lt; 1ms</text>
  <rect x="280" y="316" width="220" height="34" rx="6" fill="#fefce8" stroke="#facc15"/>
  <text x="390" y="338" text-anchor="middle" font-size="12.5" fill="#854d0e">网络 + relay 写：0.1 - 5ms</text>
  <rect x="520" y="316" width="320" height="34" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="680" y="338" text-anchor="middle" font-size="12.5" fill="#991b1b">SQL 重放 + 锁等待：10ms - 秒级（大头）</text>

  <rect x="40" y="366" width="820" height="26" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="450" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">结论：延迟大头在 SQL 线程重放——大事务、慢 SQL、DDL 是延迟的放大器</text>
</svg>
