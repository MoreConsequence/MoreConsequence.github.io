<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL 异步复制链路与延迟账单分解：从 Binlog 到从库可见性</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">主库写 Binlog (1ms) ──► I/O 线程网络搬运 (5ms) ──► SQL 回放线程执行 (10ms~数秒，核心延迟瓶颈)</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 3 Pipeline Stages -->
    <g transform="translate(20, 20)">
      <!-- Stage 1: Master Node -->
      <g>
        <rect width="260" height="205" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect width="260" height="32" rx="6" fill="#f1f5f9"/>
        <text x="130" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">阶段一：主库 (Master)</text>

        <g transform="translate(14, 46)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
          <rect width="232" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="12" y="20" fill="#0f172a" font-weight="600">1. 业务事务 2PC 提交</text>

          <rect y="40" width="232" height="38" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
          <text x="12" y="58" fill="#1e40af" font-weight="700">2. 顺序写 Binlog 磁盘</text>
          <text x="12" y="71" fill="#2563eb" font-size="9.5">与 InnoDB Redo Log 组提交</text>

          <rect y="86" width="232" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="12" y="106" fill="#64748b">3. Binlog Dump 线程唤醒</text>

          <!-- Stage Latency -->
          <rect y="126" width="232" height="26" rx="4" fill="#f0fdf4" stroke="#86efac"/>
          <text x="116" y="143" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">耗时: &lt; 1 ms (极小)</text>
        </g>
      </g>

      <!-- Connector 1 -> 2 (Network Stream) -->
      <path d="M 285 105 L 315 105" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <text x="300" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2563eb" text-anchor="middle">网络 TCP</text>

      <!-- Stage 2: Slave IO Thread -->
      <g transform="translate(320, 0)">
        <rect width="260" height="205" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect width="260" height="32" rx="6" fill="#f1f5f9"/>
        <text x="130" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">阶段二：从库 I/O 线程 (IO Thread)</text>

        <g transform="translate(14, 46)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
          <rect width="232" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="12" y="20" fill="#0f172a" font-weight="600">1. 拉取 Binlog Event 事件流</text>

          <rect y="40" width="232" height="38" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
          <text x="12" y="58" fill="#1e40af" font-weight="700">2. 顺序写入中继日志 (Relay Log)</text>
          <text x="12" y="71" fill="#2563eb" font-size="9.5">PageCache 异步刷盘，无锁开销</text>

          <rect y="86" width="232" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="12" y="106" fill="#64748b">3. 更新 relay-log.info 位点</text>

          <!-- Stage Latency -->
          <rect y="126" width="232" height="26" rx="4" fill="#f0fdf4" stroke="#86efac"/>
          <text x="116" y="143" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">耗时: 1 ~ 5 ms (网络 RTT)</text>
        </g>
      </g>

      <!-- Connector 2 -> 3 (Queue) -->
      <path d="M 585 105 L 615 105" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
      <text x="600" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#ea580c" text-anchor="middle">重放队列</text>

      <!-- Stage 3: Slave SQL Applier Thread (Bottleneck) -->
      <g transform="translate(620, 0)">
        <rect width="260" height="205" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
        <rect width="260" height="32" rx="6" fill="#ffedd5"/>
        <text x="130" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">阶段三：从库 SQL 回放线程 (SQL Applier)</text>

        <g transform="translate(14, 46)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
          <rect width="232" height="32" rx="4" fill="#ffffff" stroke="#fed7aa"/>
          <text x="12" y="20" fill="#9a3412" font-weight="600">1. 解析 Relay Log 事务包</text>

          <rect y="40" width="232" height="38" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
          <text x="12" y="58" fill="#991b1b" font-weight="700">2. 串行/多线程重放 SQL 语句</text>
          <text x="12" y="71" fill="#dc2626" font-size="9.5">与从库长读查询争用行锁 / MDL 锁</text>

          <rect y="86" width="232" height="32" rx="4" fill="#ffffff" stroke="#fed7aa"/>
          <text x="12" y="106" fill="#9a3412">3. 数据写入从库 Buffer Pool 可见</text>

          <!-- Stage Latency (Bottleneck) -->
          <rect y="126" width="232" height="26" rx="4" fill="#fef2f2" stroke="#f87171"/>
          <text x="116" y="143" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">🔥 耗时: 10ms ~ 数秒 (延迟大头!)</text>
        </g>
      </g>
    </g>

    <!-- Bottom Diagnosis & Solution Bar -->
    <g transform="translate(20, 240)">
      <rect width="860" height="75" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      
      <g transform="translate(16, 14)" font-family="ui-sans-serif, system-ui, sans-serif">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#0f172a">🎯 从库延迟（Seconds_Behind_Master）三大根因与工业治理：</text>
        <g font-size="11" fill="#334155">
          <text x="0" y="34"><tspan font-weight="700" fill="#ea580c">1. 大事务拆分：</tspan> 严禁单事务批量更新百万行（主库执行 10 秒，从库必须同步重放 10 秒）；</text>
          <text x="0" y="50"><tspan font-weight="700" fill="#2563eb">2. 多线程并行复制 (MTS)：</tspan> 开启 `replica_parallel_type=LOGICAL_CLOCK`（基于组提交并发回放）；</text>
        </g>
      </g>
    </g>
  </g>
</svg>
