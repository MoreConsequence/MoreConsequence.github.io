<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 1.20+ 官方零拷贝类型强转标准范式 (Zero-Copy Cast)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">unsafe.String(unsafe.SliceData(b), len(b)) ｜ unsafe.Slice(unsafe.StringData(s), len(s)) ｜ 0 堆分配、0 内存拷贝、100% 官方 GC 安全保证</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Old Hack -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 旧版本黑魔法：*reflect.StringHeader 转换</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 危险老代码：强转 uintptr 指针</text>
          <text y="28" fill="#fca5a5">hdr := (*reflect.SliceHeader)(unsafe.Pointer(&amp;b))</text>
          <text y="42" fill="#ef4444">strHdr := reflect.StringHeader{Data: hdr.Data, Len: hdr.Len}</text>
          <text y="56" fill="#f87171">s := *(*string)(unsafe.Pointer(&amp;strHdr))</text>
          
          <text y="80" fill="#ef4444">💥 致命缺陷：</text>
          <text y="94" fill="#ef4444">• uintptr 不被 GC 识别为指针，若发生栈扩容或 GC 搬迁</text>
          <text y="108" fill="#f87171">• 指针悬挂导致野指针崩溃！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">历史风险：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• reflect.StringHeader 在 Go 1.20 已经被显式废弃；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 极易在未来 Go 版本中出现未定义行为；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严禁在生产中使用！</text>
      </g>
    </g>

    <!-- Right: Go 1.20+ Safe -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Go 1.20+ 官方标准：unsafe.String / Slice</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 1. []byte ──► string (0 拷贝):</text>
          <text y="28" fill="#86efac">func BytesToString(b []byte) string {</text>
          <text y="42" fill="#38bdf8">    return unsafe.String(unsafe.SliceData(b), len(b))</text>
          <text y="56" fill="#86efac">}</text>
          
          <text y="76" fill="#4ade80">// 2. string ──► []byte (0 拷贝只读切片):</text>
          <text y="90" fill="#34d399">func StringToBytes(s string) []byte {</text>
          <text y="104" fill="#38bdf8">    return unsafe.Slice(unsafe.StringData(s), len(s))</text>
          <text y="118" fill="#34d399">}</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 获得官方 GC 追踪指针安全性终身背书；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 吞吐量达到硬件寄存器级传输极限；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 高性能协议解析标准最佳实践！</text>
      </g>
    </g>
  </g>
</svg>