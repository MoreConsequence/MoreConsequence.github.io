<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 1.19+ GC 调优双旋钮：GOGC 与 GOMEMLIMIT 协同模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">目标触发阈值 = min(LiveHeap × (1 + GOGC/100), GOMEMLIMIT - OffHeap) ｜ 容器场景防 OOM 与算力开销的完美统一</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Pure GOGC Problem -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 单一 GOGC 时代：容器 OOM 与内存浪费两难</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">容器内存限制: 4GB ｜ GOGC = 100 (默认 100% 翻倍)</text>
          
          <text y="38" fill="#ef4444">致命困境：</text>
          <text y="52" fill="#fca5a5">• 存活对象达 2.2GB ──► 触发阈值算得: 2.2 × 2 = 4.4GB！</text>
          <text y="68" fill="#ef4444">• 堆内存直接突破 4GB 容器 Cgroup 限制 ──► 触发 OOM-Killed！</text>
          
          <text y="92" fill="#fb923c">若盲目把 GOGC 调小至 30：</text>
          <text y="106" fill="#fca5a5">• 内存安全了，但在低负载时每秒狂刷数十次 GC，白白浪费 30% CPU！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">云原生痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 无法充分利用已购买的容器物理内存；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 突发流量极易被打崩 OOM；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 倒逼 GC 调度器重大升级！</text>
      </g>
    </g>

    <!-- Right: GOMEMLIMIT Solution -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Go 1.19+ GOMEMLIMIT：软上限终极保护</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">配置: GOMEMLIMIT = 3600MiB (留 400MB 缓冲区给系统与栈)</text>
          
          <text y="38" fill="#86efac">自适应调度机制：</text>
          <text y="52" fill="#38bdf8">1. 低内存时: GOGC 充分发挥作用，减少 GC 次数最大化吞吐</text>
          <text y="68" fill="#34d399">2. 突发大内存时: 触碰 3.6GB 软上限自动触发 GC 兜底</text>
          <text y="84" fill="#34d399">3. 具备 1-2% CPU 限流保护，严防陷入 GC Thrashing 死循环！</text>
          
          <text y="108" fill="#4ade80">✓ 内存利用率提高 40%，且 100% 免疫 OOM！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Kubernetes 云原生微服务标准配置；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 兼顾高吞吐与高可用稳定性；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 语言运行时划时代的调优武器！</text>
      </g>
    </g>
  </g>
</svg>