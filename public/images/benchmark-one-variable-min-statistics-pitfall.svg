<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">基准测试方法论：为什么只取 min 最小值会掩盖真实的系统退化</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">单变量控制法则 ｜ min 掩盖了 GC 停顿与缓存抖动 ｜ 必须同时报告 p50/p90/p99 与多次重复测试置信区间</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: min trap -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ min 统计的虚假繁荣：掩盖了内存与锁争用</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 方案 A: min = 10ns, 但 p99 = 500ns (频繁触发 GC)</text>
          <text y="30" fill="#f87171">// 方案 B: min = 12ns, 但 p99 = 15ns (零堆分配平稳运行)</text>
          
          <text y="56" fill="#ef4444">🔴 若只看 min 最小值：</text>
          <text y="72" fill="#fca5a5">• 错误得出 "方案 A 比 方案 B 快 20%" 的荒谬结论！</text>
          <text y="88" fill="#fb7185">• 上线后高并发场景下，方案 A 直接被 GC 卡死崩溃！</text>
          <text y="106" fill="#ef4444">► min 仅代表了 CPU 处于极致冷缓存与零争用下的最理想幻觉！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">第二变量隐蔽陷阱：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 你以为你在对比算法复杂度，实际上在对比 CPU 频率升降；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 忽略了内存分配速率、TLB 缺失率与操作系统上下文切换；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 伪基准测试成为技术选型的灾难推手！</text>
      </g>
    </g>

    <!-- Right: Scientific Benchmark -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 科学基准测试：多维分布与严格单变量隔离</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">1. 严格单变量原则 (One Variable):</text>
          <text y="28" fill="#86efac">   固定 CPU 频率、锁定 CPU 亲和性、预热 JIT/缓存</text>
          
          <text y="48" fill="#38bdf8">2. 统计学完整度量:</text>
          <text y="62" fill="#cbd5e1">   同时记录 mean、stddev、p50、p90、p99、allocs/op</text>
          
          <text y="82" fill="#34d399">3. benchstat 差异统计学检验 (p &lt; 0.05):</text>
          <text y="96" fill="#4ade80">   name      old mean    new mean    delta</text>
          <text y="110" fill="#4ade80">   Process   12.4ns ± 2% 10.1ns ± 1% -18.5% (p=0.000 n=10)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级证据铁律：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 任何性能结论必须附带运行环境与重复次数；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 警惕编译器死代码消除 (DCE) 优化带来的 0ns 假象；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造坚不可摧的工程事实证据链！</text>
      </g>
    </g>
  </g>
</svg>