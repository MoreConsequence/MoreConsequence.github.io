<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="librespeed-go-redaction-flow-title librespeed-go-redaction-flow-desc">
<title id="librespeed-go-redaction-flow-title">RedactIP：两份载体，三类模式，统一占位符</title>
<desc id="librespeed-go-redaction-flow-desc">数据流图展示 RemoteAddr、ispinfo 和 log 经过 IPv4、IPv6、hostname 三类正则后写入脱敏占位符。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');</style><marker id="librespeed-go-redaction-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/></marker><marker id="librespeed-go-redaction-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/></marker><marker id="librespeed-go-redaction-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d5a8a"/></marker></defs>
<rect width="960" height="600" fill="#f5f4ed"/>
<text x="40" y="52" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">DATA FLOW · PRIVACY</text>
<text x="40" y="92" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400" text-anchor="start">RedactIP：两份载体，三类模式，统一占位符</text>
<text x="40" y="120" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">脱敏理解字段载体的语法，而不是只做字符串替换</text>
<text x="64" y="164" fill="#857a69" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">CARRIERS</text><text x="376" y="164" fill="#857a69" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">PATTERNS</text><text x="688" y="164" fill="#857a69" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">PLACEHOLDERS</text><rect x="64" y="212" width="240" height="96" rx="6" fill="#f5f4ed" stroke="none" stroke-width="1"/><rect x="64" y="212" width="240" height="96" rx="6" fill="rgba(45,90,138,0.07)" stroke="#2d5a8a" stroke-width="1"/><rect x="76" y="224" width="48" height="16" rx="2" fill="none" stroke="#2d5a8a" stroke-width="0.8"/><text x="100" y="236" fill="#2d5a8a" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">INPUT</text><text x="184" y="260" fill="#141413" font-size="16" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">IP / ispinfo / log</text><text x="184" y="280" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="middle">RemoteAddr + forms</text><rect x="376" y="212" width="240" height="96" rx="6" fill="#f5f4ed" stroke="none" stroke-width="1"/><rect x="376" y="212" width="240" height="96" rx="6" fill="rgba(232,93,63,0.10)" stroke="#e85d3f" stroke-width="1.2"/><rect x="388" y="224" width="48" height="16" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/><text x="412" y="236" fill="#e85d3f" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">REGEX</text><text x="496" y="260" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">IPv4 · IPv6 · hostname</text><text x="496" y="280" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="middle">replace in two carriers</text><rect x="688" y="212" width="208" height="96" rx="6" fill="#f5f4ed" stroke="none" stroke-width="1"/><rect x="688" y="212" width="208" height="96" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/><rect x="700" y="224" width="56" height="16" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/><text x="728" y="236" fill="#141413" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text><text x="792" y="260" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">0.0.0.0 · ::</text><text x="792" y="280" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="middle">&quot;hostname&quot;:&quot;REDACTED&quot;</text><line x1="304" y1="260" x2="376" y2="260" fill="none" stroke="#2d5a8a" stroke-width="1.2" marker-end="url(#librespeed-go-redaction-flow-arrow-link)"/><line x1="616" y1="260" x2="688" y2="260" fill="none" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#librespeed-go-redaction-flow-arrow)"/><rect x="64" y="364" width="832" height="72" rx="6" fill="#fffdfb" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/><text x="88" y="396" fill="#141413" font-size="16" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="start">语法形状也要保留：hostname 替换为 JSON 片段，而不是裸字符串。</text><line x1="40" y1="532" x2="920" y2="532" fill="none" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/><text x="40" y="560" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="136" y="548" width="12" height="12" rx="2" fill="#2d5a8a" stroke="#2d5a8a" stroke-width="0.8"/><text x="156" y="560" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="start">INPUT</text><rect x="356" y="548" width="12" height="12" rx="2" fill="#e85d3f" stroke="#e85d3f" stroke-width="0.8"/><text x="376" y="560" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="start">REDACTION FOCUS</text>
</svg>
