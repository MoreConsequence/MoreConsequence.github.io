<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi MCP 网关 (MCP Gateway) 统一路由与弹性熔断拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. Agent 发起 mcp_call ──► 2. Gateway 命名空间路由 (github.*, postgres.*) ──► 3. 熔断器监控 ──► 4. 故障时优雅降级</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 统一协议接入与命名空间分发 (Unified Namespace Routing)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">将所有外部 MCP Server 工具统一聚合并加前缀隔离: db_query -&gt; postgres:db_query</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">消除多工具源之间的函数名冲突！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 细粒度安全与鉴权中心 (Authentication &amp; Secret Injection)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">Gateway 在网关层统一注入 GitHub Token / DB 凭据 ──► 绝不向大模型泄露任何原始密钥明文</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">保障企业级敏感凭证绝对安全！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 服务熔断与超时保护 (Circuit Breaker &amp; Strict Timeout)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">单个 MCP Server (如远程 Sentry) 发生 5s 超时 ──► 自动熔断开启并返回结构化降级提示</text>
        <text x="15" y="62" font-size="8" fill="#047857">杜绝单个外部服务卡死整个 Agent 引擎！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 动态资源连接池复用 (Connection Pooling &amp; Fast Reconnect)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">维护与 10+ MCP Server 的长连接池 ──► 0 每次调用重新拉起进程开销 ──► 调用延迟降至 &lt; 2ms！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">大规模生产级 MCP 生态集成的核心中枢！</text>
      </g>
    </g>
  </g>
</svg>