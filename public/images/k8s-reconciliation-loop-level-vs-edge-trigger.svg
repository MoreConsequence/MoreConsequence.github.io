<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="k8s-reconciliation-loop-level-vs-edge-trigger-title k8s-reconciliation-loop-level-vs-edge-trigger-desc"><title id="k8s-reconciliation-loop-level-vs-edge-trigger-title">Kubernetes 水平触发 (Level-Triggered) 调谐哲学：基于最新状态对齐与自愈</title><desc id="k8s-reconciliation-loop-level-vs-edge-trigger-desc">Kubernetes 水平触发 (Level-Triggered) 调谐哲学：基于最新状态对齐与自愈</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">声明式控制系统哲学：边缘触发 (Edge) vs 水平触发 (Level)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">命令式边缘触发 (丢一个事件导致系统永久不一致) vs K8s 声明式水平触发 (Reconcile 永远依据当前最新状态对齐期望，具备天然自愈能力)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 命令式边缘触发 (Edge-Triggered)：脆弱易脱轨</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">依赖每次动作指令: "ScaleUp +1", "DeletePod"</text>

          <text y="38" fill="#f5f5f5">致命缺陷场景：</text>
          <text y="52" fill="#f5f5f5">• 网络闪断导致某一个 "Delete" 事件丢失</text>
          <text y="68" fill="#f5f5f5">• 控制器从此再也不会收到补发通知</text>
          <text y="84" fill="#f5f5f5">• 孤儿 Pod 永久存活在集群中，状态彻底脱轨！</text>

          <text y="106" fill="#f5f5f5">🔴 运维必须频繁人工介入执行状态修复！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 极难应对分布式环境下的网络分区与重启；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 状态累积漂移不可逆；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 传统自动化运维脚本的致命通病！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 声明式水平触发 (Level-Triggered)：终极自愈</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">K8s Reconcile(Request) 调谐模型：</text>

          <text y="36" fill="#f5f5f5">1. 观察当前实际状态 (Actual: 当前存活 2 个 Pod)</text>
          <text y="50" fill="#f5f5f5">2. 比对期望声明状态 (Desired: replicas = 3)</text>
          <text y="64" fill="#f5f5f5">3. 自动计算 Diff 差值 ──► 主动创建 1 个缺失 Pod</text>
          <text y="78" fill="#f5f5f5">4. 即使漏掉 100 个中间事件，下一次触发必然 100% 自愈！</text>

          <text y="104" fill="#f5f5f5">✓ 任何故障、断电、重启后秒级自动收敛！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 赋予 Kubernetes 无与伦比的混沌工程鲁棒性；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 重新定义现代云计算基础设施控制论；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 软件工程理论的伟大飞跃！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
