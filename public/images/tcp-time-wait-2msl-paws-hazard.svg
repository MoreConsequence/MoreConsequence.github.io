<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">TCP TIME_WAIT 状态 2MSL 时空消亡与 NAT PAWS 丢包黑洞</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">主动方 2MSL 吸收迷路延迟旧报文 ──► 结合时间戳安全 tcp_tw_reuse ──► 废弃 tcp_tw_recycle 防御 NAT 丢包</text>
  </g>

  <!-- Main Comparison Panes (435px each) -->
  <g transform="translate(30, 70)">
    <!-- Left Pane: Spacetime Sequence of 2MSL (435px) -->
    <g filter="url(#card-shadow)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">⏳ 2MSL 时空生命周期与迷路报文消亡时序</text>

      <!-- Actors Header -->
      <g transform="translate(30, 48)">
        <rect width="140" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="70" y="16" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">主动关闭方 (Client)</text>

        <rect x="235" width="140" height="24" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="305" y="16" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">被动关闭方 (Server)</text>
      </g>

      <!-- Lifelines -->
      <line x1="100" y1="75" x2="100" y2="350" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="335" y1="75" x2="335" y2="350" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Sequence Arrows -->
      <!-- FIN 1 -->
      <g transform="translate(100, 90)">
        <line x1="0" y1="0" x2="230" y2="20" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <text x="115" y="5" font-family="ui-monospace, monospace" font-size="8.5" fill="#1e40af" text-anchor="middle">FIN (seq=100)</text>
      </g>

      <!-- ACK 1 -->
      <g transform="translate(100, 125)">
        <line x1="235" y1="0" x2="5" y2="20" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
        <text x="115" y="5" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b" text-anchor="middle">ACK (ack=101)</text>
      </g>

      <!-- FIN 2 -->
      <g transform="translate(100, 160)">
        <line x1="235" y1="0" x2="5" y2="20" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <text x="115" y="5" font-family="ui-monospace, monospace" font-size="8.5" fill="#ea580c" text-anchor="middle">FIN (seq=300)</text>
      </g>

      <!-- Last ACK & Enter TIME_WAIT -->
      <g transform="translate(100, 195)">
        <line x1="0" y1="0" x2="230" y2="20" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
        <text x="115" y="5" font-family="ui-monospace, monospace" font-size="8.5" fill="#166534" text-anchor="middle">ACK (ack=301)</text>

        <!-- TIME_WAIT Box on Client -->
        <rect x="-80" y="5" width="75" height="110" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="-42" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1e40af" text-anchor="middle">TIME_WAIT</text>
        <text x="-42" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#2563eb" text-anchor="middle">锁定 2MSL</text>
        <text x="-42" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#2563eb" text-anchor="middle">(Linux 60s)</text>

        <!-- Wandering Delayed Packet absorbing -->
        <path d="M 235 50 Q 150 70 80 50 Q 10 30 -5 70" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 3"/>
        <text x="100" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#dc2626" text-anchor="middle">迷路延迟旧报文在 2MSL 内自然消亡 ──►</text>
      </g>

      <!-- Bottom Benefit Note -->
      <g transform="translate(15, 335)">
        <text x="0" y="10" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#1e40af">
          ✓ 彻底杜绝旧数据包串入同 4 元组的新建 TCP 连接中产生脏数据！
        </text>
      </g>
    </g>

    <!-- Right Pane: NAT PAWS Drop Hazard (435px) -->
    <g transform="translate(465, 0)" filter="url(#card-shadow)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ NAT 网关下 tcp_tw_recycle 丢包黑洞</text>

      <g transform="translate(20, 50)" font-family="ui-sans-serif, system-ui, sans-serif">
        <!-- NAT Gateway Scenario Layout -->
        <!-- Client 1 -->
        <rect width="110" height="36" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="55" y="16" font-size="8.5" font-weight="700" fill="#1e40af" text-anchor="middle">手机 A (TS=1000)</text>
        <text x="55" y="28" font-size="7.5" fill="#2563eb" text-anchor="middle">时间戳稍快</text>

        <!-- Client 2 -->
        <g transform="translate(0, 48)">
          <rect width="110" height="36" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="55" y="16" font-size="8.5" font-weight="700" fill="#1e40af" text-anchor="middle">手机 B (TS=800)</text>
          <text x="55" y="28" font-size="7.5" fill="#2563eb" text-anchor="middle">时间戳稍慢</text>
        </g>

        <!-- Lines to NAT Gateway -->
        <path d="M 110 18 L 155 40" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <path d="M 110 66 L 155 45" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

        <!-- NAT Gateway Box -->
        <g transform="translate(160, 20)">
          <rect width="105" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
          <text x="52" y="20" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">NAT 路由器</text>
          <text x="52" y="34" font-size="7.5" fill="#78350f" text-anchor="middle">转换共享同 1 公网 IP</text>
        </g>

        <!-- Line to Server -->
        <path d="M 265 45 L 295 45" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>

        <!-- Server with Recycle Enabled -->
        <g transform="translate(300, 10)">
          <rect width="95" height="70" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
          <text x="47" y="18" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">后端服务器</text>
          <text x="47" y="32" font-size="7" fill="#dc2626" text-anchor="middle">开启 recycle</text>
          <text x="47" y="46" font-size="6.5" fill="#7f1d1d" text-anchor="middle">记录 IP 最新 TS=1000</text>
        </g>

        <!-- The PAWS Drop Tragedy Box -->
        <g transform="translate(0, 105)">
          <rect width="395" height="85" rx="4" fill="#fef2f2" stroke="#f87171"/>
          <text x="10" y="18" font-size="9.5" font-weight="700" fill="#991b1b">PAWS 机制误杀过程：</text>
          <text x="10" y="34" font-size="8.5" fill="#7f1d1d">1. 手机 A 刚完成请求，服务端记录该公网 IP 的最新时间戳为 1000</text>
          <text x="10" y="48" font-size="8.5" fill="#7f1d1d">2. 手机 B 发送 SYN 报文（自带时间戳 800 &lt; 1000）</text>
          <text x="10" y="62" font-size="8.5" font-weight="700" fill="#dc2626">3. 服务端判定为“过期旧报文”，静默直接丢弃！手机 B 彻底断网！</text>
        </g>

        <!-- Production Recommendation -->
        <g transform="translate(0, 200)">
          <rect width="395" height="95" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="10" y="18" font-size="9.5" font-weight="700" fill="#0f172a">生产优化铁律：</text>
          <text x="10" y="34" font-size="8.5" fill="#166534">• 永远只启用 <tspan font-weight="700">tcp_tw_reuse = 1</tspan>（仅对客户端出向连接安全生效）</text>
          <text x="10" y="48" font-size="8.5" fill="#dc2626">• <tspan font-weight="700">tcp_tw_recycle 已在 Linux 4.12 彻底移除</tspan>，严禁盲目配置</text>
          <text x="10" y="62" font-size="8.5" fill="#2563eb">• 高并发服务端首选长连接连接池（Keep-Alive）与 HTTP/2/3 复用</text>
        </g>
      </g>
    </g>
  </g>
</svg>
