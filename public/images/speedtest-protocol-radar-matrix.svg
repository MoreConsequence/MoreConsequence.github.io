<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="radar-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#cbd5e1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#radar-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="34" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">ARCHITECTURE DECISION · MULTI-DIMENSION RADAR</text>
  <text x="40" y="54" fill="#0f172a" font-size="16" font-weight="700">测速服务核心协议与架构选型多维决策雷达矩阵</text>

  <!-- ================= LEFT: 5-AXIS RADAR CHART (cx: 230, cy: 245, r: 120) ================= -->
  <g id="radar-group">
    <!-- Concentric 5-gon Grid Webs -->
    <!-- Web 25% (r=30) -->
    <polygon points="230,215 259,236 248,269 212,269 201,236" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Web 50% (r=60) -->
    <polygon points="230,185 287,226 265,294 195,294 173,226" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Web 75% (r=90) -->
    <polygon points="230,155 316,217 283,318 177,318 144,217" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Web 100% (r=120) -->
    <polygon points="230,125 344,208 301,342 159,342 116,208" fill="#ffffff" fill-opacity="0.6" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- 5 Spokes -->
    <line x1="230" y1="245" x2="230" y2="125" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="230" y1="245" x2="344" y2="208" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="230" y1="245" x2="301" y2="342" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="230" y1="245" x2="159" y2="342" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="230" y1="245" x2="116" y2="208" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Spoke Dimension Labels -->
    <text x="230" y="112" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">管道吞吐激发力</text>
    <text x="360" y="210" fill="#0f172a" font-size="11" font-weight="700">防硬件透明压缩</text>
    <text x="310" y="362" fill="#0f172a" font-size="11" font-weight="700">0反压与低GC</text>
    <text x="150" y="362" fill="#0f172a" font-size="11" font-weight="700" text-anchor="end">代理/防火墙穿透</text>
    <text x="100" y="210" fill="#0f172a" font-size="11" font-weight="700" text-anchor="end">客户端零依赖</text>

    <!-- Radar Area 1: Legacy HTTP Download (Slate Gray) -->
    <polygon points="230,197 253,238 251,274 174,323 127,212" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Radar Area 2: Go Multi-TCP Chunked Stream (Production - Tech Blue & Orange Accent) -->
    <polygon points="230,131 344,208 297,337 163,337 127,212" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2.2"/>
    
    <!-- Data Points on Go Polygon -->
    <circle cx="230" cy="131" r="3.5" fill="#2563eb"/>
    <circle cx="344" cy="208" r="3.5" fill="#2563eb"/>
    <circle cx="297" cy="337" r="3.5" fill="#ea580c"/>
    <circle cx="163" cy="337" r="3.5" fill="#2563eb"/>
    <circle cx="127" cy="212" r="3.5" fill="#2563eb"/>

    <!-- Legend -->
    <rect x="70" y="390" width="320" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="80" y="398" width="12" height="10" rx="2" fill="#2563eb"/>
    <text x="98" y="407" fill="#1e40af" font-size="10" font-weight="700" class="mono">Go 并发 Chunk 流 (本文)</text>
    <rect x="250" y="398" width="12" height="10" rx="2" fill="#94a3b8"/>
    <text x="268" y="407" fill="#64748b" font-size="10" class="mono">传统普通文件下载</text>
  </g>


  <!-- ================= RIGHT: 3 ARCHITECTURE EVALUATION CARDS (x: 480 ~ 920, w: 440) ================= -->
  
  <!-- Card 1: Go Multi-TCP Chunk Stream (Our Solution) [y: 75, h: 100] -->
  <g transform="translate(480, 75)">
    <rect width="440" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="14" y="10" width="165" height="18" rx="3" fill="#2563eb"/>
    <text x="96" y="23" fill="#ffffff" font-size="8.5" font-weight="700" class="mono" text-anchor="middle">RECOMMENDED · 5/5</text>
    <text x="190" y="24" fill="#1e40af" font-size="13" font-weight="700">Go 多并发不可压缩 Chunk 流 (标杆)</text>
    <line x1="14" y1="36" x2="426" y2="36" stroke="#bfdbfe" stroke-width="1"/>
    <text x="14" y="56" fill="#334155" font-size="11">• <tspan font-weight="700" fill="#2563eb">优势</tspan>：静态随机池 0 算力防压缩，64KB 栈黑洞 0 堆分配 40Gbps+ 吞吐</text>
    <text x="14" y="74" fill="#334155" font-size="11">• <tspan font-weight="700" fill="#2563eb">生态</tspan>：基于标准 HTTP/1.1 REST，100% 穿透 CDN/Nginx，原生浏览器秒开</text>
    <text x="14" y="90" fill="#1e40af" font-size="10" class="mono">✓ 兼顾长肥管道注满、硬件防伪与零运维部署</text>
  </g>

  <!-- Card 2: WebSocket Stream [y: 185, h: 100] -->
  <g transform="translate(480, 185)">
    <rect width="440" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="14" y="10" width="165" height="18" rx="3" fill="#64748b"/>
    <text x="96" y="23" fill="#ffffff" font-size="8.5" font-weight="700" class="mono" text-anchor="middle">ALTERNATIVE · 3.5/5</text>
    <text x="190" y="24" fill="#0f172a" font-size="13" font-weight="700">WebSocket 长连接双向二进制流</text>
    <line x1="14" y1="36" x2="426" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="56" fill="#334155" font-size="11">• <tspan font-weight="700">优势</tspan>：单 TCP 双向全双工，天然支持自定义消息帧与心跳同步</text>
    <text x="14" y="74" fill="#334155" font-size="11">• <tspan font-weight="700">局限</tspan>：单连接易受 BDP 滑动窗口限制；中间代理长连接保活与握手开销大</text>
    <text x="14" y="90" fill="#64748b" font-size="10" class="mono">适合专业内网自研探针，公网通用性逊于标准 REST</text>
  </g>

  <!-- Card 3: Raw HTTP File Download [y: 295, h: 100] -->
  <g transform="translate(480, 295)">
    <rect width="440" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="14" y="10" width="165" height="18" rx="3" fill="#94a3b8"/>
    <text x="96" y="23" fill="#ffffff" font-size="8.5" font-weight="700" class="mono" text-anchor="middle">CONVENTIONAL · 2/5</text>
    <text x="190" y="24" fill="#0f172a" font-size="13" font-weight="700">传统普通静态大文件下载</text>
    <line x1="14" y1="36" x2="426" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="56" fill="#334155" font-size="11">• <tspan font-weight="700" fill="#ea580c">缺陷</tspan>：易受运营商硬件透明压缩欺骗（百兆测出万兆虚标）</text>
    <text x="14" y="74" fill="#334155" font-size="11">• <tspan font-weight="700" fill="#ea580c">失真</tspan>：受限于客户端磁盘落盘速度与慢启动爬坡，无法测准千兆</text>
    <text x="14" y="90" fill="#64748b" font-size="10" class="mono">严禁在生产级千兆与 5G 测速场景中使用</text>
  </g>
</svg>
