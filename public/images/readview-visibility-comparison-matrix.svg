<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ReadView 可见性算法判定矩阵 (ReadView Visibility Rules)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">trx_id &lt; min_trx_id (可见) ｜ trx_id ≥ max_trx_id (不可见) ｜ min ≤ trx &lt; max (检查是否在活跃 m_ids 中) ｜ RC 每次 SELECT 新建 vs RR 事务级复用</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. trx_id &lt; min_trx_id</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">已提交的历史事务：</text>
          
          <text x="8" y="42" fill="#86efac">• 该版本的事务在当前 ReadView 生成前已提交</text>
          <text x="8" y="66" fill="#38bdf8">• 判定结果: 100% 可见！</text>
          
          <text x="8" y="96" fill="#4ade80">✓ 直接读取当前版本</text>
          <text x="8" y="112" fill="#4ade80">✓ 无需回溯 Undo 链！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• 绝大多数稳定数据的快速命中路径；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• 纳秒级单次整数比对；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 打造极速快照读。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fef2f2"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. trx_id ≥ max_trx_id</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#f87171">未来的新事务：</text>
          
          <text x="8" y="42" fill="#fca5a5">• 该版本是在 ReadView 生成之后才开启的事务修改的</text>
          <text x="8" y="70" fill="#ef4444">• 判定结果: 绝对不可见！</text>
          
          <text x="8" y="104" fill="#f87171">🔴 必须沿着 DB_ROLL_PTR</text>
          <text x="8" y="120" fill="#f87171">   向前寻找更老版本！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#991b1b">隔离保障：</text>
        <text x="8" y="34" font-size="7.5" fill="#7f1d1d">• 彻底杜绝脏读与不可重复读；</text>
        <text x="8" y="48" font-size="7.5" fill="#7f1d1d">• 维持一致性快照视图；</text>
        <text x="8" y="62" font-size="7.5" fill="#dc2626">• 事务时空隔离的核心！</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. min ≤ trx &lt; max</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">活跃事务区间判定：</text>
          
          <text x="8" y="38" fill="#fed7aa">检查 trx_id 是否在 m_ids 中:</text>
          <text x="8" y="58" fill="#f87171">• 在 m_ids: 事务仍未提交，不可见！继续向前回溯</text>
          <text x="8" y="86" fill="#34d399">• 不在 m_ids: 事务已提交，可见！直接采用该版本</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#c2410c">判定逻辑：</text>
        <text x="8" y="34" font-size="7.5" fill="#9a3412">• 精准区分并发事务的提交状态；</text>
        <text x="8" y="48" font-size="7.5" fill="#9a3412">• 二分查找 m_ids 数组；</text>
        <text x="8" y="62" font-size="7.5" fill="#ea580c">• 严谨数学裁决。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">4. RC vs RR 隔离级别</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">ReadView 生成时机：</text>
          
          <text x="8" y="42" fill="#86efac">• RC (Read Committed):</text>
          <text x="8" y="58" fill="#cbd5e1">  每次 SELECT 都生成全新 ReadView！</text>
          
          <text x="8" y="82" fill="#4ade80">• RR (Repeatable Read):</text>
          <text x="8" y="98" fill="#34d399">  仅在第一条 SELECT 生成，全事务复用！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">本质区别：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• 一行代码决定了两种隔离级别；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 优雅统一于同一个 MVCC 引擎；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 顶级系统架构之美！</text>
      </g>
    </g>
  </g>
</svg>