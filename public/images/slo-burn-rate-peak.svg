<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="burn-rate-peak-title burn-rate-peak-desc"><title id="burn-rate-peak-title">burn-rate 八日峰值与告警线</title><desc id="burn-rate-peak-desc">SLO 99.9% 下连续八天每日一小时窗口最大 burn-rate：基线七天为 1.0，故障日冲到 25.5，超过 14.4 的 page 告警线后回落。</desc>
  <defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="40" y="48" fill="#2d3142" font-size="24" font-family="'Instrument Serif', Georgia, serif">burn-rate 八日峰值：平时 1.0，故障日 25.5</text>
  <text x="40" y="72" fill="#4f5d75" font-size="12" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">每日一小时窗口最大 burn，SLO 99.9%，合成 trace（burn.py，固定形状）</text>

  <!-- Gridlines + Y labels (domain 0-30, y = 420 - 12v) -->
  <line x1="120" y1="420" x2="904" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">0</text>
  <line x1="120" y1="300" x2="904" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">10</text>
  <line x1="120" y1="180" x2="904" y2="180" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">20</text>
  <line x1="120" y1="60" x2="904" y2="60" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="112" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">30</text>

  <!-- Threshold series (muted dashed, 14.4 -> y=248) -->
  <polyline points="120,248 232,248 344,248 456,248 568,248 680,248 792,248 904,248"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="836" y="224" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="866" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">page 14.4x</text>

  <!-- Focal series: daily peak burn [1,1,1,1,25.5,1,1,1] -> y=408 x7, 114 -->
  <polyline points="120,408 232,408 344,408 456,408 568,114 680,408 792,408 904,408"
            fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="120" cy="408" r="4" fill="#eb6c36"/>
  <circle cx="232" cy="408" r="4" fill="#eb6c36"/>
  <circle cx="344" cy="408" r="4" fill="#eb6c36"/>
  <circle cx="456" cy="408" r="4" fill="#eb6c36"/>
  <circle cx="568" cy="114" r="4" fill="#eb6c36"/>
  <circle cx="680" cy="408" r="4" fill="#eb6c36"/>
  <circle cx="792" cy="408" r="4" fill="#eb6c36"/>
  <circle cx="904" cy="408" r="4" fill="#eb6c36"/>
  <rect x="532" y="88" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="568" y="97" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">peak 25.5x</text>

  <!-- X labels -->
  <text x="120" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">D11</text>
  <text x="232" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">D12</text>
  <text x="344" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">D13</text>
  <text x="456" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">D14</text>
  <text x="568" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">D15</text>
  <text x="680" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">D16</text>
  <text x="792" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">D17</text>
  <text x="904" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">D18</text>

  <!-- Legend -->
  <line x1="40" y1="472" x2="960" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="484" width="16" height="8" fill="#eb6c36"/>
  <text x="144" y="492" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">日峰值 burn</text>
  <rect x="240" y="484" width="16" height="8" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="264" y="492" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">page 线 14.4x</text>
  <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">SOURCE: burn.py synthetic trace, SLO 99.9%, domain 0-30</text>
</svg>
