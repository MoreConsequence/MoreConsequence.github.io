<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 第三方插件沙箱隔离拓扑 (WASM / Worker Isolation)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">直接 eval() 运行第三方插件 (恶意代码盗取本地 SSH 密钥与 Token) vs WASM / 独立进程沙箱 (基于 Capability 安全凭证受控访问)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: eval unsafe -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 同进程裸运行：恶意插件完全沦陷</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">第三方插件直接在主进程中 require() 执行：</text>
          
          <text y="38" fill="#ef4444">致命供应链攻击：</text>
          <text y="52" fill="#fca5a5">• 插件恶意静默读取 ~/.ssh/id_rsa 私钥</text>
          <text y="68" fill="#ef4444">• 读取进程内存中的 ANTHROPIC_API_KEY</text>
          <text y="84" fill="#ef4444">• 向暗网恶意服务器偷偷外发敏感源码数据！</text>
          
          <text y="106" fill="#f87171">🔴 开发者本地电脑彻底裸奔沦陷！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">安全痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 插件生态缺乏最基本的权限隔离与沙箱约束；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 现代开源生态投毒事件频发；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 严禁裸跑未受信任扩展！</text>
      </g>
    </g>

    <!-- Right: WASM Capability Sandbox -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ WASI / 能力沙箱隔离：最小权限严密管控</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">Wasmtime / 独立 Worker 沙箱机制：</text>
          
          <text y="36" fill="#86efac">1. 0 默认文件系统与网络访问权 (Zero Ambient Authority)</text>
          <text y="50" fill="#38bdf8">2. 声明式权限清单: permissions: ["fs:read:/tmp/docs"]</text>
          <text y="64" fill="#34d399">3. 任何越权系统调用立即被内核级沙箱强行阻断！</text>
          <text y="78" fill="#4ade80">4. 插件崩溃 0 影响 Agent 主进程，秒级隔离自愈！</text>
          
          <text y="104" fill="#4ade80">✓ 打造绝对安全、值得信赖的开放生态！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底消除第三方扩展的安全后门隐患；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑数千开发者自由贡献插件市场；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化 Agent 平台的最高安全标准！</text>
      </g>
    </g>
  </g>
</svg>