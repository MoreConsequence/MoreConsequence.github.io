<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="distributed-transaction-selection-decision-tree-title distributed-transaction-selection-decision-tree-desc"><title id="distributed-transaction-selection-decision-tree-title">分布式事务选型决策树：业务强一致 vs 异步解耦 vs 逆向补偿路径判定</title><desc id="distributed-transaction-selection-decision-tree-desc">分布式事务选型决策树：业务强一致 vs 异步解耦 vs 逆向补偿路径判定</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分布式事务技术选型决策树 (Decision Tree)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">是否需要刚性强一致？ ──► 是否跨第三方外部系统？ ──► 业务能否支持资源预冻结？ ──► 毫秒级命中最佳落地架构</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">分支 1: 异步通知 / 跨服务数据分发 (Asynchronous Decoupling)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">下单后发送积分、通知发货、刷新缓存 ──► 坚决选择: Transactional Outbox + CDC Binlog + MQ 消费幂等</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">覆盖 80% 的常规业务解耦场景！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">分支 2: 核心资金划拨 / 高频强原子资源扣减 (High-Concurrency Real-Time Assets)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">支付扣款、余额划转、极速秒杀库存 ──► 坚决选择: TCC 模式 (Try 预冻结金额 + Confirm 真实入账 + 逆向 Cancel)</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">保障资金 0 差错与极致吞吐！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">分支 3: 超长业务链 / 包含外部第三方不可控 API (Complex Long-Running Workflows)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">旅游套餐预订 (机票 + 酒店 + 租车 + 信用卡预授权) ──► 坚决选择: Saga 编排器 (Temporal / Seata)</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">状态机清晰可视化，失败自动触发精确逆向补偿！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">分支 4: 单机多库极低频强一致 ACID (Low-Frequency Rigid ACID)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">严苛传统单体系统跨两个物理库 ──► 选用: 2PC / XA (或直接重构成分布式 NewSQL 数据库)</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">分布式架构设计的科学决策终局！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
