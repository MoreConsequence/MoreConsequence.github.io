<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi TUI 终端现代化代码 Diff 视觉渲染拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">文件标题卡片 ──► 删除行 (Soft Red 背景 + 深红文字) ──► 新增行 (Soft Green 背景 + 深绿文字) ──► 像素级对齐行号</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 1 Large Terminal Card (900px) -->
    <rect width="900" height="385" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="900" height="34" rx="8" fill="#1e293b"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="5" fill="#10b981"/>
    <text x="450" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">workspace/server.ts ── Patch Preview</text>

    <g transform="translate(20, 50)" font-family="ui-monospace, monospace" font-size="8">
      <g transform="translate(0, 0)">
        <rect width="860" height="24" rx="3" fill="#1e293b"/>
        <text x="10" y="16" fill="#64748b">@@ -10,6 +10,8 @@ export function startServer() {</text>
      </g>

      <g transform="translate(0, 30)">
        <rect width="860" height="24" rx="3" fill="#1e293b"/>
        <text x="10" y="16" fill="#94a3b8"> 10 │   const app = express();</text>
      </g>

      <g transform="translate(0, 60)">
        <rect width="860" height="24" rx="3" fill="#450a0a"/>
        <text x="10" y="16" fill="#f87171">-11 │   const port = 3000;</text>
      </g>

      <g transform="translate(0, 90)">
        <rect width="860" height="24" rx="3" fill="#052e16"/>
        <text x="10" y="16" fill="#4ade80">+11 │   const port = process.env.PORT || 8080;</text>
      </g>

      <g transform="translate(0, 120)">
        <rect width="860" height="24" rx="3" fill="#052e16"/>
        <text x="10" y="16" fill="#4ade80">+12 │   app.use(helmet()); // Added security headers</text>
      </g>

      <g transform="translate(0, 150)">
        <rect width="860" height="24" rx="3" fill="#1e293b"/>
        <text x="10" y="16" fill="#94a3b8"> 13 │   app.listen(port, () =&gt; {</text>
      </g>

      <g transform="translate(0, 190)">
        <rect width="860" height="120" rx="4" fill="#090d16" stroke="#1e293b"/>
        <text x="15" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">TUI Diff 渲染核心技术要点：</text>
        <text x="15" y="46" font-size="8" fill="#cbd5e1">• 使用 ANSI 24-bit TrueColor 背景色填充整行，彻底杜绝文字末尾黑边断裂；</text>
        <text x="15" y="66" font-size="8" fill="#cbd5e1">• 严格按最大行号宽度 (PadStart) 对齐行号列，保障代码缩进绝对平整；</text>
        <text x="15" y="86" font-size="8" fill="#4ade80">• 优雅清晰的代码对比，赋予开发者 100% 的审阅信心与掌控力！</text>
      </g>
    </g>
  </g>
</svg>