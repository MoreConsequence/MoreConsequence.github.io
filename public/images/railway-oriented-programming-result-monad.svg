<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">铁路导向错误处理：Result&lt;T, E&gt; 双轨流转与编译期穷尽检查</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">成功轨道 (Green Path: Ok(value)) ──► 失败轨道 (Red Path: Err(error)) ｜ 消除隐式 throw 导致的未知未捕获崩溃</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 throw/try-catch：类型签名的黑洞</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">function fetchUser(id: string): Promise&lt;User&gt;</text>
          <text y="30" fill="#fca5a5">// 函数签名对调用方撒了谎！它没有声明会抛出什么！</text>
          
          <text y="54" fill="#ef4444">🔴 致命缺陷：</text>
          <text y="70" fill="#ef4444">1. 谁也不知道它可能抛出 NetworkError 还是 NotFoundError</text>
          <text y="86" fill="#ef4444">2. 调用方漏写 catch ──► 进程触发 UnhandledRejection 崩溃！</text>
          <text y="102" fill="#f87171">3. catch (e: unknown) 丢失全部类型信息，排查极痛苦！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 异常像 goto 语句一样长距离无序跳跃；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 编译器无法提供任何漏处理提示；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 代码脆弱易碎！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Result&lt;T, E&gt; 显式类型值流转</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">function fetchUser(id: string): Promise&lt;Result&lt;User, UserError&gt;&gt;</text>
          
          <text y="36" fill="#86efac">const res = await fetchUser(id);</text>
          <text y="50" fill="#86efac">if (res.isErr()) {</text>
          <text y="64" fill="#38bdf8">  // 编译器强制要求必须处理所有 UserError 分支！</text>
          <text y="78" fill="#34d399">  return handleUserError(res.error);</text>
          <text y="92" fill="#86efac">}</text>
          <text y="106" fill="#4ade80">const user = res.value; // 安全访问数据！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 继承 Go/Rust 最优秀的显式错误哲学；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 编译器严格把关，杜绝未处理异常；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高韧性企业级代码库！</text>
      </g>
    </g>
  </g>
</svg>