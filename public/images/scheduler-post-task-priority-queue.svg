<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="scheduler-post-task-priority-queue-title scheduler-post-task-priority-queue-desc"><title id="scheduler-post-task-priority-queue-title">现代浏览器调度器 (scheduler.postTask) 三级优先级队列与 INP 优化</title><desc id="scheduler-post-task-priority-queue-desc">现代浏览器调度器 (scheduler.postTask) 三级优先级队列与 INP 优化</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">现代浏览器调度 API：scheduler.postTask 三级原生优先级与 INP 优化</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">user-blocking (立即响应输入, 0ms) ｜ user-visible (页面主体渲染) ｜ background (后台分析日志) ｜ 告别 setTimeout hack</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. user-blocking (最高优)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">scheduler.postTask(task, {</text>
          <text x="16" y="34" fill="#f5f5f5">  priority: 'user-blocking'</text>
          <text x="10" y="50" fill="#f5f5f5">});</text>

          <text x="10" y="74" fill="#f5f5f5">业务含义：</text>
          <text x="10" y="90" fill="#cbd5e1">• 用户直接交互动作（点击、按键）</text>
          <text x="10" y="106" fill="#cbd5e1">• 立即抢占执行，直接决定 INP 得分！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">核心目标：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 延迟严控在 16ms 以内；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 杜绝输入卡顿；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 保证触控反馈丝滑。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. user-visible (默认常规)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">scheduler.postTask(task, {</text>
          <text x="16" y="34" fill="#f5f5f5">  priority: 'user-visible'</text>
          <text x="10" y="50" fill="#f5f5f5">});</text>

          <text x="10" y="74" fill="#f5f5f5">业务含义：</text>
          <text x="10" y="90" fill="#cbd5e1">• 页面主要视图渲染与数据更新</text>
          <text x="10" y="106" fill="#cbd5e1">• 默认优先级，平稳有序推进！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">核心目标：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 承载 90% 核心应用业务逻辑；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 兼顾吞吐与合理响应；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造平稳用户体验。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. background (后台低优)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">scheduler.postTask(task, {</text>
          <text x="16" y="34" fill="#f5f5f5">  priority: 'background'</text>
          <text x="10" y="50" fill="#f5f5f5">});</text>

          <text x="10" y="74" fill="#f5f5f5">业务含义：</text>
          <text x="10" y="90" fill="#cbd5e1">• 日志打点、数据预加载与缓存修剪</text>
          <text x="10" y="106" fill="#cbd5e1">• 仅在完全闲置时执行，绝不抢占！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">核心目标：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 彻底消除后台任务造成的卡顿；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 现代 Web 性能优化的前沿秘密武器；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造极致性能体验！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
