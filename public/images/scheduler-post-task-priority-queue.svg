<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">现代浏览器调度 API：scheduler.postTask 三级原生优先级与 INP 优化</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">user-blocking (立即响应输入, 0ms) ｜ user-visible (页面主体渲染) ｜ background (后台分析日志) ｜ 告别 setTimeout hack</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. user-blocking (最高优)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">scheduler.postTask(task, {</text>
          <text x="16" y="34" fill="#fca5a5">  priority: 'user-blocking'</text>
          <text x="10" y="50" fill="#f87171">});</text>
          
          <text x="10" y="74" fill="#38bdf8">业务含义：</text>
          <text x="10" y="90" fill="#cbd5e1">• 用户直接交互动作（点击、按键）</text>
          <text x="10" y="106" fill="#cbd5e1">• 立即抢占执行，直接决定 INP 得分！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">核心目标：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 延迟严控在 16ms 以内；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 杜绝输入卡顿；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 保证触控反馈丝滑。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. user-visible (默认常规)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">scheduler.postTask(task, {</text>
          <text x="16" y="34" fill="#86efac">  priority: 'user-visible'</text>
          <text x="10" y="50" fill="#38bdf8">});</text>
          
          <text x="10" y="74" fill="#34d399">业务含义：</text>
          <text x="10" y="90" fill="#cbd5e1">• 页面主要视图渲染与数据更新</text>
          <text x="10" y="106" fill="#cbd5e1">• 默认优先级，平稳有序推进！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">核心目标：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 承载 90% 核心应用业务逻辑；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 兼顾吞吐与合理响应；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造平稳用户体验。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. background (后台低优)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">scheduler.postTask(task, {</text>
          <text x="16" y="34" fill="#86efac">  priority: 'background'</text>
          <text x="10" y="50" fill="#4ade80">});</text>
          
          <text x="10" y="74" fill="#34d399">业务含义：</text>
          <text x="10" y="90" fill="#cbd5e1">• 日志打点、数据预加载与缓存修剪</text>
          <text x="10" y="106" fill="#cbd5e1">• 仅在完全闲置时执行，绝不抢占！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">核心目标：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底消除后台任务造成的卡顿；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 现代 Web 性能优化的前沿秘密武器；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极致性能体验！</text>
      </g>
    </g>
  </g>
</svg>