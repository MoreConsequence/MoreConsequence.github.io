<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">两军问题 (Two Generals Problem) 与不可靠通信数学困境</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">信使可能在峡谷被截获 ──► 将军 1 发送进攻 ──► 将军 2 回复确认 ACK ──► 将军 2 担心 ACK 丢失不敢进攻 ──► 无限递归确认无法达成共识</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 第一轮消息投递 (General 1 -&gt; General 2: "Attack at 9am")</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">将军 1 派出信使穿过敌军峡谷 ──► 但信使有 50% 概率被敌军俘虏 ──► 将军 1 必须等待回复确认</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">单向发送永远无法确认对方是否收到！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 第二轮确认回复 (General 2 -&gt; General 1: "ACK received")</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">将军 2 收到指令并派出回信信使 ──► 但将军 2 不确定回信是否安全送达将军 1 ──► 若未送达自己贸然进攻必被歼灭</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将军 2 陷入死局，必须等待对 ACK 的再次确认 (ACK of ACK)！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 无限递归确认困境 (Infinite Regress of Acknowledgments)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">无论经过 N 轮 ACK 确认 ──► 最后一个发出消息的人永远无法 100% 确信对方是否收到 ──► 数学证明无解！</text>
        <text x="15" y="62" font-size="8" fill="#047857">分布式计算理论中最著名的不可能三角！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 工业界工程破局 (Engineering Realization: At-least-Once + Idempotency)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">承认物理网络无法做到绝对 Exactly-Once ──► 转为“至少一次投递 (重试) + 业务端幂等消费”来实现等效精准一次！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">计算机工程学实用主义哲学的伟大胜利！</text>
      </g>
    </g>
  </g>
</svg>