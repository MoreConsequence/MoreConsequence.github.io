<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="two-generals-problem-flp-impossibility-title two-generals-problem-flp-impossibility-desc"><title id="two-generals-problem-flp-impossibility-title">两军问题 (Two Generals Problem) 与不可靠网络下的确认困境</title><desc id="two-generals-problem-flp-impossibility-desc">两军问题 (Two Generals Problem) 与不可靠网络下的确认困境</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">两军问题 (Two Generals Problem) 与不可靠通信数学困境</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">信使可能在峡谷被截获 ──► 将军 1 发送进攻 ──► 将军 2 回复确认 ACK ──► 将军 2 担心 ACK 丢失不敢进攻 ──► 无限递归确认无法达成共识</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 第一轮消息投递 (General 1 -&gt; General 2: "Attack at 9am")</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">将军 1 派出信使穿过敌军峡谷 ──► 但信使有 50% 概率被敌军俘虏 ──► 将军 1 必须等待回复确认</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">单向发送永远无法确认对方是否收到！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 第二轮确认回复 (General 2 -&gt; General 1: "ACK received")</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">将军 2 收到指令并派出回信信使 ──► 但将军 2 不确定回信是否安全送达将军 1 ──► 若未送达自己贸然进攻必被歼灭</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">将军 2 陷入死局，必须等待对 ACK 的再次确认 (ACK of ACK)！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 无限递归确认困境 (Infinite Regress of Acknowledgments)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">无论经过 N 轮 ACK 确认 ──► 最后一个发出消息的人永远无法 100% 确信对方是否收到 ──► 数学证明无解！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">分布式计算理论中最著名的不可能三角！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 工业界工程破局 (Engineering Realization: At-least-Once + Idempotency)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">承认物理网络无法做到绝对 Exactly-Once ──► 转为“至少一次投递 (重试) + 业务端幂等消费”来实现等效精准一次！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">计算机工程学实用主义哲学的伟大胜利！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
