<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go sync.Map 双表架构与 misses 提升状态机</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">read 表 (atomic.Value 无锁并发读 7ns) ｜ dirty 表 (Mutex 保护写) ｜ misses 达到 len(dirty) 触发原子提升</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Dual Map Architecture -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. read 表与 dirty 表空间设计</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">1. read 表 (readOnly struct):</text>
          <text y="28" fill="#86efac">   • m: map[any]*entry (原子加载，多协程无锁并发读)</text>
          <text y="42" fill="#86efac">   • amended: bool (若 dirty 包含新 key 则为 true)</text>
          
          <text y="64" fill="#fb923c">2. dirty 表 (map[any]*entry):</text>
          <text y="78" fill="#fed7aa">   • 受 mu Mutex 保护，包含全部未提升的新写入键值</text>
          <text y="92" fill="#fed7aa">   • 与 read 表共享 *entry 指针，修改值无需加锁！</text>
          
          <text y="114" fill="#38bdf8">3. entry 状态原子迁移：</text>
          <text y="128" fill="#cbd5e1">   valid (存活) ──► nil (软删除) ──► expunged (抹除)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">读多写少极致性能：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 读命中 read 表仅需 1 次 atomic.Load (约 7ns)；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 更新已有 key 的 value 仅需 CAS 操作 entry.p；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 彻底规避了 RWMutex 的读锁争用瓶颈！</text>
      </g>
    </g>

    <!-- Right: Misses & Degradation -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. misses 账单转回与写多读少退化</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 穿透与提升流程 (missLocked)</text>
          <text y="28" fill="#fca5a5">1. read 未命中且 amended == true ──► 加互斥锁查 dirty 表</text>
          <text y="42" fill="#fca5a5">2. misses 计数器累加: m.misses++</text>
          
          <text y="64" fill="#ef4444">3. 触发提升阈值: if misses &gt;= len(dirty):</text>
          <text y="78" fill="#fb7185">   • 将 dirty 表直接原子赋值给 read 表！</text>
          <text y="92" fill="#fb7185">   • dirty 置 nil，misses 计数清零</text>
          
          <text y="114" fill="#f87171">🔴 写多读少/持续新增 Key 场景下：</text>
          <text y="128" fill="#fca5a5">频繁加锁穿透 + dirty 全量拷贝重建，性能暴跌 10 倍！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产选型铁律：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 适合：只读多写少（如全局配置缓存、只追加不常修改的反射 itab）；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 不适合：高频插入全新 Key、频繁删除、普通读写均衡场景；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 写多场景坚决使用分段锁 ConcurrentMap (Sharded Lock)！</text>
      </g>
    </g>
  </g>
</svg>