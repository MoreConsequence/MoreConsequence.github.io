<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go GMP 调度器全景模型：P 本地队列、Work Stealing 与信号抢占</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">G (Goroutine 协程) ｜ M (Machine 系统线程) ｜ P (Processor 逻辑上下文) ｜ sysmon SIGURG 异步信号抢占死循环</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1: P Local Queue -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. P 本地队列 (runq, 256 容量)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#34d399">// 无锁无争用调度快速路径</text>
          <text x="10" y="34" fill="#86efac">1. runnext: 优先执行新创建的 G</text>
          <text x="10" y="48" fill="#86efac">2. runq [256]guintptr 环形数组</text>
          <text x="10" y="66" fill="#38bdf8">✓ 当前 M 获取 G 调度时完全无需全局大锁！</text>
          <text x="10" y="84" fill="#34d399">✓ 耗时仅需 ~5ns 极速分派！</text>
          <text x="10" y="104" fill="#fbbf24">► 当本地队列满 256 时：</text>
          <text x="10" y="120" fill="#fed7aa">   将前半部分 128 个 G 打包移入全局队列 (globrunq)</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">防饥饿保障：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 每执行 61 次调度，必须强制去全局队列取 1 个 G；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 杜绝全局队列中的 G 被永久饿死！</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 兼顾高吞吐与全局公平性。</text>
      </g>
    </g>

    <!-- Col 2: Work Stealing -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. 工作窃取 (Work Stealing)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 当某个 P 本地队列为空时：</text>
          <text x="10" y="34" fill="#93c5fd">1. 检查全局队列 (globrunq)</text>
          <text x="10" y="48" fill="#93c5fd">2. 检查网络轮询器 (netpoll 就绪 G)</text>
          <text x="10" y="66" fill="#34d399">3. 遍历其他 P，随机选择一个繁忙目标</text>
          <text x="10" y="82" fill="#34d399">4. 窃取其本地队列一半 (50%) 的 G！</text>
          <text x="10" y="104" fill="#fbbf24">5. 若仍无就绪任务，M 进入自旋休眠</text>
          <text x="10" y="120" fill="#fed7aa">   避免空转白白消耗 CPU 电量！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">自适应动态平衡：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 自动削峰填谷，彻底避免多核计算负载不均；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 窃取操作采用原子 CAS 指令保护；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#1d4ed8">• 工业界最高效的并发任务分发模型！</text>
      </g>
    </g>

    <!-- Col 3: Async Preemption -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 信号抢占 (Go 1.14+ 非协作)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 破解死循环占用 (for {}) 顽疾</text>
          <text x="10" y="34" fill="#fed7aa">1. 监控线程 sysmon 发现某 G 运行 &gt; 10ms</text>
          <text x="10" y="50" fill="#f87171">2. 发送 OS 信号: tgkill(SIGURG)</text>
          <text x="10" y="68" fill="#38bdf8">3. 操作系统中断当前 M 线程并触发信号处理</text>
          <text x="10" y="84" fill="#34d399">4. sighandler 保存上下文寄存器，调用 gopreempt</text>
          <text x="10" y="104" fill="#4ade80">5. 强制将该 G 踢回全局队列，让出 CPU！</text>
          <text x="10" y="122" fill="#34d399">✓ 真正实现了硬实时非协作式可抢占调度！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">历史演进意义：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• Go 1.13 之前只有函数调用序言处协作抢占；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 纯密集计算循环会导致整个 GC STW 永久卡死；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#ea580c">• 信号抢占彻底解决了 Go 语言早期最大的调度死穴！</text>
      </g>
    </g>
  </g>
</svg>