<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">分布式锁技术栈选型矩阵：Redis Redlock vs etcd Raft</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Redis / Redlock (AP 倾向，极高吞吐，依赖系统时钟，适合非核心防重) vs etcd / Consul (CP 强一致，Raft 共识 + Lease 自动续租 + Watch 实时唤醒，适合核心分布式选举)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Redis -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Redis 单实例 / Redlock (偏 AP 高吞吐)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">SET lock_key uuid NX PX 30000</text>
          
          <text y="38" fill="#fed7aa">优势与局限：</text>
          <text y="52" fill="#38bdf8">• 吞吐量极高 (单机 100,000 QPS)</text>
          <text y="66" fill="#f87171">• 主从异步复制可能导致主节点宕机后丢锁</text>
          <text y="80" fill="#fca5a5">• Redlock 依赖物理时钟 (NTP Jump 会破坏安全性)</text>
          
          <text y="106" fill="#fb923c">⚠️ 适用场景: 用户防重复提交、非关键幂等</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构建议：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 适合容忍极端偶发重复的业务场景；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 配合 Redisson 看门狗 (Watchdog) 自动续期；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 轻量高并发首选。</text>
      </g>
    </g>

    <!-- Right: etcd -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">etcd / Consul (CP 强一致性 Raft 租约)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">clientv3.concurrency.NewMutex(session, "/lock")</text>
          
          <text y="38" fill="#86efac">强一致机制优势：</text>
          <text y="52" fill="#38bdf8">• 基于 Raft 多数派共识，Leader 挂掉 0 丢锁！</text>
          <text y="66" fill="#34d399">• Lease 心跳租约机制，节点宕机自动释放</text>
          <text y="80" fill="#4ade80">• Watcher 机制实现事件驱动精确唤醒，0 轮询开销！</text>
          
          <text y="106" fill="#4ade80">✓ 适用场景: Master 主从选举、核心调度元数据</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 绝对数学级线性一致性保障；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• Kubernetes 控制平面信赖的基石；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 核心严苛金融级系统必选！</text>
      </g>
    </g>
  </g>
</svg>