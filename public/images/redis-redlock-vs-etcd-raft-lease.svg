<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="redis-redlock-vs-etcd-raft-lease-title redis-redlock-vs-etcd-raft-lease-desc"><title id="redis-redlock-vs-etcd-raft-lease-title">分布式锁选型对比：Redis Redlock (AP 弱一致) vs etcd/Chubby (CP 强一致 Raft…</title><desc id="redis-redlock-vs-etcd-raft-lease-desc">分布式锁选型对比：Redis Redlock (AP 弱一致) vs etcd/Chubby (CP 强一致 Raft 租约)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分布式锁技术栈选型矩阵：Redis Redlock vs etcd Raft</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Redlock（AP，高吞吐，依赖时钟，适合防重）vs etcd/Consul（CP，Raft + Lease + Watch，适合选主）</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">Redis 单实例 / Redlock (偏 AP 高吞吐)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">SET lock_key uuid NX PX 30000</text>

          <text y="38" fill="#f5f5f5">优势与局限：</text>
          <text y="52" fill="#f5f5f5">• 吞吐量极高 (单机 100,000 QPS)</text>
          <text y="66" fill="#f5f5f5">• 主从异步复制可能导致主节点宕机后丢锁</text>
          <text y="80" fill="#f5f5f5">• Redlock 依赖物理时钟 (NTP Jump 会破坏安全性)</text>

          <text y="106" fill="#f5f5f5">⚠️ 适用场景: 用户防重复提交、非关键幂等</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构建议：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 适合容忍极端偶发重复的业务场景；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 配合 Redisson 看门狗 (Watchdog) 自动续期；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 轻量高并发首选。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">etcd / Consul (CP 强一致性 Raft 租约)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">clientv3.concurrency.NewMutex(session, "/lock")</text>

          <text y="38" fill="#f5f5f5">强一致机制优势：</text>
          <text y="52" fill="#f5f5f5">• 基于 Raft 多数派共识，Leader 挂掉 0 丢锁！</text>
          <text y="66" fill="#f5f5f5">• Lease 心跳租约机制，节点宕机自动释放</text>
          <text y="80" fill="#f5f5f5">• Watcher 机制实现事件驱动精确唤醒，0 轮询开销！</text>

          <text y="106" fill="#f5f5f5">✓ 适用场景: Master 主从选举、核心调度元数据</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 绝对数学级线性一致性保障；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• Kubernetes 控制平面信赖的基石；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 核心严苛金融级系统必选！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
