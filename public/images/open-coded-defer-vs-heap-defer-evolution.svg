<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go defer 性能三代演进史：从 35ns 到 0.2ns 极限优化</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">一代 (Go 1.12: 堆上分配 _defer 结构体，耗时 35ns) ──► 二代 (Go 1.13: 栈分配 _defer，耗时 12ns) ──► 三代 (Go 1.14+: 开放编码 Open-Coded，耗时 0.2ns 几无损耗)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 堆分配 defer (Go ≤ 1.12)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">deferproc: 动态创建 _defer 链表</text>
          
          <text x="10" y="38" fill="#fca5a5">• 每次遇到 defer 就在堆上分配一个 struct _defer</text>
          <text x="10" y="62" fill="#ef4444">• 挂入 Goroutine 的 g._defer 链表头</text>
          <text x="10" y="86" fill="#f87171">• 函数退出时 deferreturn 遍历链表执行</text>
          
          <text x="10" y="116" fill="#ef4444">🔴 耗时 ~35ns，开销巨大！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">历史痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 高频热点循环中严禁使用 defer；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 导致工程师被迫写大量样板重复代码；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 历史性能包袱。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 栈分配 defer (Go 1.13)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">deferprocStack: 栈上初始化</text>
          
          <text x="10" y="38" fill="#fed7aa">• 编译器在函数当前栈帧预先分配 _defer</text>
          <text x="10" y="62" fill="#34d399">• 0 堆内存分配与 0 GC 标记压力</text>
          <text x="10" y="86" fill="#fed7aa">• 依然需要维护 g._defer 链表指针</text>
          
          <text x="10" y="116" fill="#fb923c">✓ 耗时降至 ~12ns (提升 3 倍)！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底消除了堆分配带来的 GC 压力；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 循环内仍需回退为堆分配；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 重要的过渡演进。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 开放编码 defer (Go 1.14+)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">Open-Coded Defer: 编译器内联</text>
          
          <text x="10" y="38" fill="#86efac">• 0 _defer 结构体、0 链表操作！</text>
          <text x="10" y="58" fill="#38bdf8">• 仅在栈上分配 1 个 8 位掩码变量 df</text>
          <text x="10" y="78" fill="#34d399">• 退出前直接内联插入 defer 函数调用！</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 耗时暴降至 ~0.2ns (几无额外成本)！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 让工程师放心大胆在任何地方使用 defer；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 发生 panic 时通过栈元数据逆向查找回放；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 编译器最优雅的黑魔法！</text>
      </g>
    </g>
  </g>
</svg>