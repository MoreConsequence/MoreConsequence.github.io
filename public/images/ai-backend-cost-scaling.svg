<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="ai-backend-cost-scaling-title ai-backend-cost-scaling-desc"><title id="ai-backend-cost-scaling-title">LLM 与传统 RPC 的延迟与失败重试代价对比图</title><desc id="ai-backend-cost-scaling-desc">LLM 与传统 RPC 的延迟与失败重试代价对比图</desc>
  <defs>
    
    
  </defs>

  
  <rect width="960" height="440" fill="#f5f5f5" />
  <rect width="960" height="440" fill="url(#dot-grid)" opacity="0" />

  
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#ea580c" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">传统微服务 RPC vs 大模型（LLM）后端工程代价演变矩阵</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">没有凭空出现的新问题，只有参数被放大了两个数量级的物理与财务账单</text>
  </g>

  
  <g transform="translate(30, 75)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />

    
    <g transform="translate(20, 20)">
      <rect width="265" height="235" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
      <rect width="265" height="32" rx="6" fill="rgba(45,49,66,0.04)" />
      <text x="132" y="21" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">1. 请求时延与生命周期</text>

      <g transform="translate(12, 44)" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11">
        <rect width="241" height="42" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="18" fill="#4f5d75" font-size="9.5">传统微服务 / SQL：</text>
        <text x="10" y="34" font-weight="700" fill="#2d3142">P99 时延 &lt; 50 ms (毫秒级短生命)</text>

        <rect y="50" width="241" height="52" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
        <text x="10" y="68" fill="#4f5d75" font-size="9.5" font-weight="700">大模型（LLM）推理：</text>
        <text x="10" y="84" font-weight="700" fill="#2d3142">TTFT 首字 1~3s · 流式输出 30s</text>
        <text x="10" y="96" fill="#4f5d75" font-size="9.5">👉 时延放大 600 倍，长连接挂起</text>

        <rect y="110" width="241" height="42" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="126" fill="#2d3142" font-weight="700">工程后果：</text>
        <text x="10" y="140" fill="#2d3142" font-size="10">网关 Keep-Alive 句柄耗尽，超时极难设定</text>
      </g>
    </g>

    
    <g transform="translate(315, 20)">
      <rect width="265" height="235" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
      <rect width="265" height="32" rx="6" fill="rgba(45,49,66,0.04)" />
      <text x="132" y="21" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">2. 重试与失败经济代价</text>

      <g transform="translate(12, 44)" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11">
        <rect width="241" height="42" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="18" fill="#4f5d75" font-size="9.5">传统接口重试：</text>
        <text x="10" y="34" font-weight="700" fill="#2d3142">边际成本几乎为 0 (仅纳秒 CPU)</text>

        <rect y="50" width="241" height="52" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
        <text x="10" y="68" fill="#2d3142" font-size="9.5" font-weight="700">大模型重试账单：</text>
        <text x="10" y="84" font-weight="700" fill="#eb6c36">整段 Prompt 重新 Prefill 计费</text>
        <text x="10" y="96" fill="#eb6c36" font-size="9.5">👉 一次中断 = 真实美金财务账单损失</text>

        <rect y="110" width="241" height="42" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="10" y="126" fill="#2d3142" font-weight="700">工程对策：</text>
        <text x="10" y="140" fill="#4f5d75" font-size="10">KV 缓存命中优化 + 严格重试预算 (Budget)</text>
      </g>
    </g>

    
    <g transform="translate(610, 20)">
      <rect width="265" height="235" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
      <rect width="265" height="32" rx="6" fill="rgba(45,49,66,0.04)" />
      <text x="132" y="21" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 并发瓶颈与状态承载</text>

      <g transform="translate(12, 44)" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11">
        <rect width="241" height="42" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="18" fill="#4f5d75" font-size="9.5">传统并发模型：</text>
        <text x="10" y="34" font-weight="700" fill="#2d3142">无状态 (Stateless) · 单机承载 10万 QPS</text>

        <rect y="50" width="241" height="52" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="10" y="68" fill="#2d3142" font-size="9.5" font-weight="700">大模型推理并发：</text>
        <text x="10" y="84" font-weight="700" fill="#4f5d75">显存墙（GPU VRAM KV-Cache 绑定）</text>
        <text x="10" y="96" fill="#4f5d75" font-size="9.5">👉 单卡物理并发上限仅 16 ~ 64 实例</text>

        <rect y="110" width="241" height="42" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="126" fill="#4f5d75" font-weight="700">工程核心：</text>
        <text x="10" y="140" fill="#4f5d75" font-size="10">PagedAttention 显存虚拟化与排队削峰</text>
      </g>
    </g>

    
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
      <text x="430" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#4f5d75" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#2d3142">架构师视点：</tspan> AI 工程没有“魔法”，所有经典的后端系统挑战（限流、降级、幂等、断路、连接池）在 LLM 时代依然成立，
      </text>
      <text x="430" y="38" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#4f5d75" font-weight="700" text-anchor="middle">
        差别在于：过去犯错只是 CPU 空转，现在犯错会直接烧穿研发预算并拖死整条 GPU 集群。
      </text>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
