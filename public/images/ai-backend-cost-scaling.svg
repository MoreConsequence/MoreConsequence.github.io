<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="880" height="420" rx="12" fill="#fafbff" stroke="#d7def0"/>

  <text x="440" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">没有新问题，只是参数换了个数量级</text>

  <defs>
    <marker id="a-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="70" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">延迟</text>
  <text x="70" y="104" text-anchor="middle" font-size="12" fill="#64748b">对数刻度 · 数量级</text>

  <rect x="90" y="118" width="260" height="34" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="104" y="140" font-size="13" font-weight="600" fill="#3730a3">传统 RPC</text>
  <text x="300" y="140" text-anchor="end" font-size="13" font-weight="700" fill="#3730a3">50 ms</text>

  <rect x="90" y="162" width="330" height="34" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="104" y="184" font-size="13" font-weight="600" fill="#5b21b6">LLM 首 token（TTFT）</text>
  <text x="370" y="184" text-anchor="end" font-size="13" font-weight="700" fill="#5b21b6">3 s · 60×</text>

  <line x1="70" y1="216" x2="810" y2="216" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="70" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">一次失败重试的代价</text>
  <text x="70" y="268" text-anchor="middle" font-size="12" fill="#64748b">同样的问题，不同的账单</text>

  <rect x="90" y="282" width="200" height="34" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="104" y="304" font-size="13" font-weight="600" fill="#065f46">传统 API 重试</text>
  <text x="240" y="304" text-anchor="end" font-size="13" font-weight="700" fill="#065f46">≈ 0</text>

  <rect x="90" y="326" width="330" height="34" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="104" y="348" font-size="13" font-weight="600" fill="#991b1b">LLM 重试</text>
  <text x="370" y="348" text-anchor="end" font-size="13" font-weight="700" fill="#991b1b">整段预填充重新计费</text>

  <rect x="470" y="110" width="340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="640" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">每个老问题都被放大</text>
  <text x="500" y="176" font-size="13" fill="#334155">缓存未命中</text>
  <text x="500" y="204" font-size="13" fill="#334155">超时设错</text>
  <text x="500" y="232" font-size="13" fill="#334155">限流触发</text>
  <text x="500" y="260" font-size="13" fill="#334155">故障转移</text>
  <text x="500" y="288" font-size="13" fill="#334155">计量缺失</text>
  <text x="660" y="176" font-size="13" font-weight="600" fill="#64748b">→ 整段推理重新计费</text>
  <text x="660" y="204" font-size="13" font-weight="600" fill="#64748b">→ 用户等待翻倍</text>
  <text x="660" y="232" font-size="13" font-weight="600" fill="#64748b">→ 重试把账单再放大</text>
  <text x="660" y="260" font-size="13" font-weight="600" fill="#64748b">→ 半截回答推倒重来</text>
  <text x="660" y="288" font-size="13" font-weight="600" fill="#64748b">→ 月底账单才惊心</text>
  <rect x="500" y="316" width="280" height="28" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="640" y="335" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3730a3">结论：老问题没消失，只是账单变大了</text>
</svg>
