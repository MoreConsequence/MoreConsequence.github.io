<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#ea580c"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">传统微服务 RPC vs 大模型（LLM）后端工程代价演变矩阵</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">没有凭空出现的新问题，只有参数被放大了两个数量级的物理与财务账单</text>
  </g>

  <!-- Main Comparison Matrix (900px wide, 3 Equal Columns 280px) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Column 1: Latency & Duration -->
    <g transform="translate(20, 20)">
      <rect width="265" height="235" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect width="265" height="32" rx="6" fill="#f1f5f9"/>
      <text x="132" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">1. 请求时延与生命周期</text>

      <g transform="translate(12, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <rect width="241" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="10" y="18" fill="#64748b" font-size="9.5">传统微服务 / SQL：</text>
        <text x="10" y="34" font-weight="700" fill="#0f172a">P99 时延 &lt; 50 ms (毫秒级短生命)</text>

        <rect y="50" width="241" height="52" rx="4" fill="#fff7ed" stroke="#fdba74"/>
        <text x="10" y="68" fill="#c2410c" font-size="9.5" font-weight="700">大模型（LLM）推理：</text>
        <text x="10" y="84" font-weight="700" fill="#9a3412">TTFT 首字 1~3s · 流式输出 30s</text>
        <text x="10" y="96" fill="#ea580c" font-size="9.5">👉 时延放大 600 倍，长连接挂起</text>

        <rect y="110" width="241" height="42" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="10" y="126" fill="#991b1b" font-weight="700">工程后果：</text>
        <text x="10" y="140" fill="#7f1d1d" font-size="10">网关 Keep-Alive 句柄耗尽，超时极难设定</text>
      </g>
    </g>

    <!-- Column 2: Retry Cost & Blameworthiness -->
    <g transform="translate(315, 20)">
      <rect width="265" height="235" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect width="265" height="32" rx="6" fill="#f1f5f9"/>
      <text x="132" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">2. 重试与失败经济代价</text>

      <g transform="translate(12, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <rect width="241" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="10" y="18" fill="#64748b" font-size="9.5">传统接口重试：</text>
        <text x="10" y="34" font-weight="700" fill="#0f172a">边际成本几乎为 0 (仅纳秒 CPU)</text>

        <rect y="50" width="241" height="52" rx="4" fill="#fee2e2" stroke="#f87171"/>
        <text x="10" y="68" fill="#991b1b" font-size="9.5" font-weight="700">大模型重试账单：</text>
        <text x="10" y="84" font-weight="700" fill="#b91c1c">整段 Prompt 重新 Prefill 计费</text>
        <text x="10" y="96" fill="#dc2626" font-size="9.5">👉 一次中断 = 真实美金财务账单损失</text>

        <rect y="110" width="241" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="10" y="126" fill="#1e40af" font-weight="700">工程对策：</text>
        <text x="10" y="140" fill="#1d4ed8" font-size="10">KV 缓存命中优化 + 严格重试预算 (Budget)</text>
      </g>
    </g>

    <!-- Column 3: State & Concurrency Bound -->
    <g transform="translate(610, 20)">
      <rect width="265" height="235" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect width="265" height="32" rx="6" fill="#f1f5f9"/>
      <text x="132" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">3. 并发瓶颈与状态承载</text>

      <g transform="translate(12, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <rect width="241" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="10" y="18" fill="#64748b" font-size="9.5">传统并发模型：</text>
        <text x="10" y="34" font-weight="700" fill="#0f172a">无状态 (Stateless) · 单机承载 10万 QPS</text>

        <rect y="50" width="241" height="52" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="10" y="68" fill="#166534" font-size="9.5" font-weight="700">大模型推理并发：</text>
        <text x="10" y="84" font-weight="700" fill="#15803d">显存墙（GPU VRAM KV-Cache 绑定）</text>
        <text x="10" y="96" fill="#047857" font-size="9.5">👉 单卡物理并发上限仅 16 ~ 64 实例</text>

        <rect y="110" width="241" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="10" y="126" fill="#334155" font-weight="700">工程核心：</text>
        <text x="10" y="140" fill="#475569" font-size="10">PagedAttention 显存虚拟化与排队削峰</text>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">架构师视点：</tspan> AI 工程没有“魔法”，所有经典的后端系统挑战（限流、降级、幂等、断路、连接池）在 LLM 时代依然成立，
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#ea580c" font-weight="700" text-anchor="middle">
        差别在于：过去犯错只是 CPU 空转，现在犯错会直接烧穿研发预算并拖死整条 GPU 集群。
      </text>
    </g>
  </g>
</svg>
