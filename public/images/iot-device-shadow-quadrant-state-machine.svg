<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%" role="img" aria-labelledby="iot-shadow-title iot-shadow-desc">
  <title id="iot-shadow-title">设备影子（Device Shadow）异步双态流转四象限状态机</title>
  <desc id="iot-shadow-desc">展示设备影子期望态（Desired）与汇报态（Reported）的四象限状态流转：稳态对齐、配置下发中、现场带外漂移以及版本冲突对账。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.08)"/></pattern>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#grid-dots)"/>

  <!-- Title -->
  <text x="40" y="38" fill="#2d3142" font-size="22" font-family="'Instrument Serif', Georgia, serif">设备影子（Device Shadow）双态四象限状态机</text>
  <text x="40" y="60" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">期望态 (Desired) ── 实际态 (Reported) ── 单调版本号 ── 异步 Delta 差分计算</text>

  <!-- Quadrant 1 (Top-Left): Synchronized -->
  <rect x="40" y="80" width="420" height="180" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="52" y="92" width="160" height="18" rx="3" fill="rgba(45,49,66,0.06)"/>
  <text x="132" y="104" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Q1 · 稳态同步 (SYNCHRONIZED)</text>
  
  <text x="52" y="136" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">期望态 == 汇报态 (Delta = ∅)</text>
  <text x="52" y="156" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">设备物理配置与云端声明完全吻合。version 稳定，无在途下发任务。</text>

  <rect x="52" y="174" width="396" height="70" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="64" y="194" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">"state": { "desired": {"vlan": 10}, "reported": {"vlan": 10} }</text>
  <text x="64" y="212" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace">"metadata": {"desired": {"vlan": {"timestamp": 1780001000}}}</text>
  <text x="64" y="230" fill="#2e5aa8" font-size="8.5" font-family="'Geist Mono', monospace">状态特征：静默监听 · 零网络冗余开销 · 心跳只维持保活</text>

  <!-- Quadrant 2 (Top-Right): In-Flight -->
  <rect x="500" y="80" width="420" height="180" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <rect x="512" y="92" width="180" height="18" rx="3" fill="rgba(235,108,54,0.12)"/>
  <text x="602" y="104" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Q2 · 增量下发中 (DELTA IN-FLIGHT)</text>

  <text x="512" y="136" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist', sans-serif">云端变更期望态 (version + 1)</text>
  <text x="512" y="156" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">云端向 $shadow/update/delta 发布增量文档；设备收到后异步执行。</text>

  <rect x="512" y="174" width="396" height="70" rx="4" fill="rgba(235,108,54,0.06)" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
  <text x="524" y="194" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">"delta": { "vlan": 20 }  // 云端计算生成的最小差异树</text>
  <text x="524" y="212" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace">"version": 42 // 乐观锁单调递增，防止慢请求乱序覆写</text>
  <text x="524" y="230" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace">若设备离线：云端堆积 Delta，待设备重连第一时间追赶同步</text>

  <!-- Quadrant 3 (Bottom-Left): Out-of-Band Drift -->
  <rect x="40" y="290" width="420" height="180" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="52" y="302" width="180" height="18" rx="3" fill="rgba(45,49,66,0.06)"/>
  <text x="142" y="314" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Q3 · 现场带外漂移 (OOB DRIFT)</text>

  <text x="52" y="346" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">现场串口/本地 CLI 突发改动</text>
  <text x="52" y="366" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">工程师现场直连修改配置，设备主动上报新 reported，云端感知漂移。</text>

  <rect x="52" y="384" width="396" height="70" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="64" y="404" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">reported={"vlan": 30} ──► 触发对账裁决器 (Reconciler)</text>
  <text x="64" y="422" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace">策略 A (云端为主): 覆盖重写现场改动，下发 Delta 压回 Desired</text>
  <text x="64" y="440" fill="#2e5aa8" font-size="8.5" font-family="'Geist Mono', monospace">策略 B (三路归并): 提取现场差异补丁，经审批后反向吸收进 Desired</text>

  <!-- Quadrant 4 (Bottom-Right): Conflict & Retry -->
  <rect x="500" y="290" width="420" height="180" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="512" y="302" width="180" height="18" rx="3" fill="rgba(45,49,66,0.06)"/>
  <text x="602" y="314" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Q4 · 版本冲突与重试 (CONFLICT)</text>

  <text x="512" y="346" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">并发冲突拦截 (OCC Conflict 409)</text>
  <text x="512" y="366" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">携带过期 version 提交更新被原子拦截；或设备硬件执行失败报错。</text>

  <rect x="512" y="384" width="396" height="70" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="524" y="404" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">IF req.version &lt; shadow.version THEN REJECT_CONFLICT</text>
  <text x="524" y="422" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace">解决机制：重新拉取最新影子快照 ──► 重新计算增量补丁</text>
  <text x="524" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">结合 Full-Jitter 指数退避重试，杜绝并发覆写丢失更新 (Lost Updates)</text>

  <!-- Transition Connectors between Quadrants -->
  <!-- Q1 -> Q2: User edits config in Cloud -->
  <line x1="460" y1="130" x2="500" y2="130" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="466" y="112" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="480" y="121" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">EDIT</text>

  <!-- Q2 -> Q1: Device reports applied -->
  <line x1="500" y1="190" x2="460" y2="190" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="466" y="172" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="480" y="181" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">ACK</text>

  <!-- Q1 -> Q3: Local drift -->
  <line x1="150" y1="260" x2="150" y2="290" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="158" y="269" width="34" height="12" rx="2" fill="#f5f5f5"/>
  <text x="175" y="278" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">DRIFT</text>

  <!-- Q3 -> Q1: Reconciled -->
  <line x1="280" y1="290" x2="280" y2="260" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="288" y="269" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="306" y="278" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">MERGE</text>

  <!-- Q2 -> Q4: Conflict / Timeout -->
  <line x1="700" y1="260" x2="700" y2="290" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="708" y="269" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="722" y="278" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">FAIL</text>

  <!-- Footer Callout -->
  <rect x="40" y="490" width="880" height="60" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="56" y="514" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">架构真理：物理世界不可靠，影子是云端与硬件解耦的唯一契约</text>
  <text x="56" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">业务上层永远只面向高可用的云端影子进行毫秒级读写；下层复杂的弱网重传、版本去重与离线追赶由状态机全权托管。</text>
</svg>
