<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="html-event-loop-spec-lifecycle-timeline-title html-event-loop-spec-lifecycle-timeline-desc"><title id="html-event-loop-spec-lifecycle-timeline-title">HTML 规范事件循环全生命周期时间线：Task -&gt; Microtasks -&gt; Update Rendering</title><desc id="html-event-loop-spec-lifecycle-timeline-desc">HTML 规范事件循环全生命周期时间线：Task -&gt; Microtasks -&gt; Update Rendering</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">W3C / HTML5 规范级事件循环完整循环时序 (Spec Event Loop Timeline)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1 个宏任务 (Task) ──► 清空全部微任务 (Microtask Drainage) ──► 渲染机会评估 ──► rAF 回调 ──► 样式与布局 ──► 光栅化绘制</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 执行单个最老的宏任务 (Execute Oldest Task from Task Queue)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">从事件队列中取出且仅取出 1 个任务（用户输入事件 / setTimeout 到期回调 / I/O 回调）并执行</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">主线程执行栈同步跑完该任务！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. 微任务检查点彻底清空 (Perform a Microtask Checkpoint)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">循环执行所有 Promise.then 与 MutationObserver 回调，直到 Microtask 队列长度严格为 0</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">微任务递归生成微任务会彻底卡死主线程！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. 渲染机会评估与 rAF 执行 (Update the Rendering &amp; rAF)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">若当前处于 60/120Hz 刷新时间点 ──► 触发 requestAnimationFrame 回调 ──► 重新计算 Style 与 Layout</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">将页面最新状态提交给合成器线程！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 空闲时间片调度 (requestIdleCallback / MessageChannel)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">若单帧内仍有剩余空闲时间 (deadline.timeRemaining() &gt; 0) ──► 调度后台低优预加载与日志任务</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">彻底理解浏览器的终极心智模型！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
