<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">从 CAP 到 PACELC 理论：分布式系统工程选型与物理权衡矩阵</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">有分区（Partition）时在 A 与 C 之间权衡 ──► Else 无分区常态时在 延迟（Latency）与 一致性（Consistency）间权衡</text>
  </g>

  <!-- Main 4-Quadrant Matrix Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 4 Sub-Cards Grid (2x2, each 420px x 115px) -->
    <g transform="translate(20, 16)">
      <!-- Quadrant 1: PC/EC (Strict Strong) -->
      <g>
        <rect width="420" height="112" rx="6" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
        <rect width="420" height="28" rx="6" fill="#eff6ff"/>
        <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">1. PC / EC 阵营（强一致优先）</text>

        <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <text x="0" y="16" fill="#0f172a" font-weight="600">• 分区时选一致性 (PC) ；无分区时选一致性 (EC)</text>
          <text x="0" y="32" fill="#475569">• 无论何时宁可等待多节点同步完成，绝不返回脏数据</text>
          <text x="0" y="48" font-weight="700" fill="#2563eb">典型代表：Google Spanner、TiDB、CockroachDB、etcd</text>
        </g>
      </g>

      <!-- Quadrant 2: PC/EL (Consistent on Partition, Fast on Normal) -->
      <g transform="translate(440, 0)">
        <rect width="420" height="112" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <rect width="420" height="28" rx="6" fill="#f1f5f9"/>
        <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">2. PC / EL 阵营（分区保一致，常态保低延迟）</text>

        <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <text x="0" y="16" fill="#0f172a" font-weight="600">• 分区时停写保一致 (PC) ；无分区时异步写保低延迟 (EL)</text>
          <text x="0" y="32" fill="#475569">• 平时走本地缓存/内存快速返回，故障时严格选举与降级</text>
          <text x="0" y="48" font-weight="700" fill="#0f172a">典型代表：MySQL 主从半同步复制 (Semi-sync)、MongoDB (W:1)</text>
        </g>
      </g>

      <!-- Quadrant 3: PA/EL (Ultra High Availability) -->
      <g transform="translate(0, 122)">
        <rect width="420" height="112" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="420" height="28" rx="6" fill="#dcfce7"/>
        <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">3. PA / EL 阵营（极致高可用与低延迟）</text>

        <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <text x="0" y="16" fill="#14532d" font-weight="600">• 分区时保可用 (PA) ；无分区时异步低延迟 (EL)</text>
          <text x="0" y="32" fill="#15803d">• 接受数据版本冲突，依赖向量时钟与读修复最终收敛</text>
          <text x="0" y="48" font-weight="700" fill="#047857">典型代表：Amazon DynamoDB、Apache Cassandra、Couchbase</text>
        </g>
      </g>

      <!-- Quadrant 4: PA/EC (Rare Hybrid) -->
      <g transform="translate(440, 122)">
        <rect width="420" height="112" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <rect width="420" height="28" rx="6" fill="#f1f5f9"/>
        <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748b">4. PA / EC 阵营（理论稀有组合）</text>

        <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">
          <text x="0" y="16" fill="#64748b">• 分区时强保可用 (PA) ；无分区时却选择同步强一致 (EC)</text>
          <text x="0" y="32" fill="#64748b">• 工程中极少出现（逻辑自相矛盾），仅极少数特殊业务状态机</text>
          <text x="0" y="48" fill="#94a3b8">典型代表：罕见（几乎无主流工业存储采用）</text>
        </g>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">PACELC 颠覆 CAP 的核心认知：</tspan> 在 99.9% 正常无分区的物理时间内，系统依然面临 <tspan font-weight="700" fill="#ea580c">“要 5ms 低延迟还是要同步强一致”</tspan> 的残酷抉择！
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
        （分布式系统没有万能银弹，每一个系统都是在 Latency 与 Consistency 坐标系上的精妙取舍）
      </text>
    </g>
  </g>
</svg>
