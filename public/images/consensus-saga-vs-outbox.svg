<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">微服务最终一致性双雄：SAGA 补偿模式 vs 本地消息表（Transactional Outbox）</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">长事务编排与逆向补偿状态机 vs 本地单库事务原子双写与 CDC (Canal/Debezium) 异步投递</text>
  </g>

  <!-- Main Comparison Panes (435px each) -->
  <g transform="translate(30, 75)">
    <!-- Pane 1: SAGA Orchestrator -->
    <g filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="36" rx="8" fill="#eff6ff"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">模式 A：SAGA 状态机编排模式 (Saga Orchestration)</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Step 1 Forward -->
        <rect width="403" height="42" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="12" y="18" fill="#166534" font-weight="700">1. 正向事务链 (Forward Actions: $T_1 \to T_2 \to T_3$)</text>
        <text x="12" y="32" font-size="9.5" fill="#15803d">创建订单 $T_1$ ──► 扣减库存 $T_2$ ──► 扣减余额 $T_3$ (各服务本地提交)</text>

        <!-- Step 2 Compensate -->
        <rect y="48" width="403" height="52" rx="4" fill="#fff1f2" stroke="#fca5a5"/>
        <text x="12" y="18" fill="#991b1b" font-weight="700">2. 故障逆向补偿 (Compensating: $C_2 \leftarrow C_1$)</text>
        <text x="12" y="32" font-size="9.5" fill="#7f1d1d">若 $T_3$ 余额不足失败 ──► 编排器触发 $C_2$ (回滚库存) 与 $C_1$ (取消订单)</text>
        <text x="12" y="44" font-size="9.5" font-weight="700" fill="#b91c1c">⚠️ 业务要求：所有补偿动作必须满足绝对幂等与向前无死锁！</text>

        <!-- Use cases -->
        <rect y="106" width="403" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="12" y="18" font-weight="700" fill="#0f172a">适用场景：</text>
        <text x="12" y="32" font-size="9.5" fill="#475569">跨多部门长链路业务（电商下单、机票酒店联合预订、信贷审批）</text>
      </g>
    </g>

    <!-- Pane 2: Transactional Outbox + CDC -->
    <g transform="translate(465, 0)" filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="36" rx="8" fill="#f0fdf4"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">模式 B：本地消息表 + CDC (Transactional Outbox)</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Step 1 Single DB Tx -->
        <rect width="403" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="12" y="18" fill="#1e40af" font-weight="700">1. 单库本地事务原子写入 (Atomic Local Tx)</text>
        <text x="12" y="32" font-family="ui-monospace, monospace" font-size="9.5" fill="#2563eb">BEGIN; INSERT INTO orders; INSERT INTO outbox_msg; COMMIT;</text>

        <!-- Step 2 CDC Pipeline -->
        <rect y="48" width="403" height="52" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="12" y="18" fill="#166534" font-weight="700">2. CDC 引擎监听 Binlog 异步投递 (Zero-Loss Pipeline)</text>
        <text x="12" y="32" font-size="9.5" fill="#15803d">Canal / Debezium 解析 binlog 事件 ──► 投递至 Kafka ──► 下游幂等消费</text>
        <text x="12" y="44" font-size="9.5" font-weight="700" fill="#047857">✓ 优势：零分布式事务开销，业务代码无侵入，性能极高！</text>

        <!-- Use cases -->
        <rect y="106" width="403" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="12" y="18" font-weight="700" fill="#0f172a">适用场景：</text>
        <text x="12" y="32" font-size="9.5" fill="#475569">单服务触发跨系统通知、缓存失效、搜索索引同步、跨域事件驱动</text>
      </g>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(30, 375)">
    <rect width="900" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <text x="450" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      💡 <tspan font-weight="700" fill="#0f172a">架构决策黄金线：</tspan> 有复杂逆向回滚与长生命状态机选 <tspan font-weight="700" fill="#2563eb">SAGA</tspan>；纯单向通知与跨系统异步解耦一律选 <tspan font-weight="700" fill="#047857">Transactional Outbox + CDC</tspan>。
    </text>
  </g>
</svg>
