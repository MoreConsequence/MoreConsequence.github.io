<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">限流算法对决：令牌桶（Token Bucket）vs 漏桶（Leaky Bucket）</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">允许突发流量（Burst-friendly）vs 恒定速率平滑输出（Smooth Shaping）的底层物理权衡</text>
  </g>

  <!-- Two Main Panes (435px each, gap 30px) -->
  <g transform="translate(30, 75)">
    <!-- Left Pane: Token Bucket -->
    <g filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="36" rx="8" fill="#eff6ff"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">模式 A：令牌桶（Token Bucket）── 允许突发</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Token Inflow Box -->
        <rect x="0" y="0" width="403" height="30" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="12" y="19" fill="#166534" font-weight="700">⚡ 令牌生成源：以恒定速率 $r$（如 1000/s）向桶注水</text>

        <!-- Bucket Container -->
        <g transform="translate(0, 38)">
          <rect x="0" y="0" width="403" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="14" y="20" fill="#334155" font-weight="700">桶容量 (Capacity = Burst Limit，如 5000 个)</text>
          
          <!-- Tokens in bucket -->
          <g transform="translate(14, 30)" fill="#2563eb">
            <circle cx="12" cy="12" r="8"/>
            <circle cx="34" cy="12" r="8"/>
            <circle cx="56" cy="12" r="8"/>
            <circle cx="78" cy="12" r="8"/>
            <circle cx="100" cy="12" r="8"/>
            <circle cx="122" cy="12" r="8"/>
            <circle cx="144" cy="12" r="8"/>
            <text x="170" y="16" fill="#64748b" font-size="10">... 闲时攒满令牌，溢出丢弃</text>
          </g>

          <text x="14" y="68" fill="#047857" font-weight="600" font-size="10.5">🚀 突发收益：瞬时涌入 3000 请求，可瞬间拿走 3000 令牌全量秒级放行！</text>
        </g>

        <!-- Consumption & Result -->
        <rect x="0" y="132" width="403" height="42" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="12" y="18" fill="#1e40af" font-weight="700">适用场景：API 网关入口、面向真实用户交互</text>
        <text x="12" y="32" fill="#2563eb" font-size="10">（微秒级响应，允许用户页面加载时的并发资源请求突发）</text>

        <rect x="0" y="182" width="403" height="36" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="201" y="22" fill="#047857" font-weight="700" text-anchor="middle">工业实现：Go `golang.org/x/time/rate` / Redis 惰性计算</text>
      </g>
    </g>

    <!-- Right Pane: Leaky Bucket -->
    <g transform="translate(465, 0)" filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="435" height="36" rx="8" fill="#f1f5f9"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">模式 B：漏桶（Leaky Bucket）── 绝对匀速</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Request Inflow Box -->
        <rect x="0" y="0" width="403" height="30" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="12" y="19" fill="#c2410c" font-weight="700">🌊 突发请求流入：任意波峰波谷灌入漏桶</text>

        <!-- Bucket Container -->
        <g transform="translate(0, 38)">
          <rect x="0" y="0" width="403" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="14" y="20" fill="#334155" font-weight="700">排队等待队列 (Queue Buffer，溢出直接丢弃/429)</text>

          <!-- Water Drop Leaking -->
          <g transform="translate(14, 30)">
            <rect x="0" y="0" width="240" height="20" rx="3" fill="#cbd5e1"/>
            <text x="120" y="14" fill="#334155" font-size="10" text-anchor="middle">请求在内存 FIFO 队列中排队等待</text>
          </g>

          <text x="14" y="68" fill="#b91c1c" font-weight="600" font-size="10.5">⏱️ 恒定漏出：底部以严格恒定速率 $r$（如每 10ms 放行 1 个）滴漏</text>
        </g>

        <!-- Consumption & Result -->
        <rect x="0" y="132" width="403" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="12" y="18" fill="#0f172a" font-weight="700">适用场景：调用第三方易崩接口、消息削峰填谷</text>
        <text x="12" y="32" fill="#64748b" font-size="10">（无论上游多猛，绝对不允许超过下游数据库承载阈值）</text>

        <rect x="0" y="182" width="403" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="201" y="22" fill="#475569" font-weight="700" text-anchor="middle">工业实现：Uber `ratelimit` / Nginx `limit_req`</text>
      </g>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(30, 375)">
    <rect width="900" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <text x="450" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      💡 <tspan font-weight="700" fill="#0f172a">核心选型法则：</tspan> 想让用户体验快、容忍瞬时峰值选 <tspan font-weight="700" fill="#2563eb">令牌桶（Token Bucket）</tspan>；想让下游数据库与消息队列绝对安全、强制匀速平滑选 <tspan font-weight="700" fill="#ea580c">漏桶（Leaky Bucket）</tspan>。
    </text>
  </g>
</svg>
