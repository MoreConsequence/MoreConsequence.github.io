<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="rl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="12" fill="#fafbff" stroke="#d7def0"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">令牌桶 vs 漏桶：允许突发 vs 恒定速率</text>

  <text x="60" y="70" font-size="13" font-weight="700" fill="#0f172a">令牌桶（最常用）</text>
  <rect x="60" y="84" width="380" height="300" rx="8" fill="#fff" stroke="#d7def0"/>
  <g font-size="11">
    <rect x="100" y="116" width="120" height="24" rx="5" fill="#eef2ff" stroke="#6366f1"/>
    <text x="160" y="132" text-anchor="middle" fill="#3730a3">以 r 速率补充令牌</text>
    <rect x="200" y="170" width="170" height="140" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="285" y="188" text-anchor="middle" fill="#475569">桶容量 = 突发上限 burst</text>
    <g fill="#6366f1">
      <circle cx="236" cy="230" r="9"/>
      <circle cx="266" cy="230" r="9"/>
      <circle cx="296" cy="230" r="9"/>
      <circle cx="326" cy="230" r="9"/>
      <circle cx="356" cy="230" r="9"/>
      <circle cx="236" cy="268" r="9"/>
      <circle cx="266" cy="268" r="9"/>
    </g>
    <text x="285" y="332" text-anchor="middle" fill="#475569">令牌攒满后不再增长</text>
    <path d="M 285 312 L 285 330" stroke="#94a3b8" stroke-width="1.2"/>
  </g>
  <g stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#rl-arrow)">
    <path d="M 160 250 L 196 250"/>
    <path d="M 150 310 C 190 370, 340 356, 360 342"/>
  </g>
  <g font-size="10.5" fill="#065f46">
    <text x="96" y="244">来请求 → 取令牌</text>
    <text x="210" y="378">令牌富余时可突发（burst）放行</text>
  </g>

  <text x="500" y="70" font-size="13" font-weight="700" fill="#0f172a">漏桶（恒定输出）</text>
  <rect x="500" y="84" width="380" height="300" rx="8" fill="#fff" stroke="#d7def0"/>
  <g font-size="11">
    <path d="M 580 120 h 160 a 20 20 0 0 1 20 20 v 100 h -200 v -100 a 20 20 0 0 1 20 -20 z" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="660" y="152" text-anchor="middle" fill="#3730a3">桶：排队中的请求</text>
    <text x="660" y="170" text-anchor="middle" fill="#3730a3">（超出桶容量的直接拒绝）</text>
    <path d="M 640 240 L 640 262 L 680 262 L 680 240" fill="none" stroke="#6366f1" stroke-width="1.6"/>
    <path d="M 648 262 L 652 270 L 668 270 L 672 262 z" fill="#6366f1"/>
    <path d="M 660 300 L 660 330" stroke="#6366f1" stroke-width="1.6"/>
    <path d="M 650 332 L 670 332 L 660 344 z" fill="#6366f1"/>
    <text x="780" y="200" text-anchor="middle" fill="#475569">底部漏口：</text>
    <text x="780" y="216" text-anchor="middle" fill="#475569">以恒定速率 r 输出，</text>
    <text x="780" y="232" text-anchor="middle" fill="#475569">不因流量大而变快</text>
    <text x="780" y="276" text-anchor="middle" fill="#475569">输出节奏永远平滑 →</text>
    <text x="780" y="292" text-anchor="middle" fill="#475569">适合保护下游：</text>
    <text x="780" y="308" text-anchor="middle" fill="#475569">数据库、消息队列</text>
    <text x="660" y="376" text-anchor="middle" fill="#475569">突发请求被削平为匀速</text>
  </g>
</svg>
