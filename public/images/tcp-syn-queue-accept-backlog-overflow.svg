<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">TCP 握手双队列架构：SYN 半连接队列 vs Accept 全连接队列</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">SYN 洪水与 SYN Cookie 兜底 ｜ backlog 溢出静默丢弃 ACK 触发客户端重传风暴 ｜ tcp_abort_on_overflow 权衡</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: SYN Queue -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 半连接队列 (SYN Queue / SYN_RECV)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">// 收到客户端 SYN 报文后进入</text>
          <text y="32" fill="#93c5fd">1. 内核分配 request_sock 对象</text>
          <text y="48" fill="#93c5fd">2. 回复 SYN+ACK，等待客户端最后 1 个 ACK</text>
          <text y="68" fill="#f87171">🔴 SYN Flood 攻击风险：</text>
          <text y="84" fill="#fca5a5">攻击者伪造海量 IP 只发 SYN 不发 ACK，瞬间填满队列！</text>
          <text y="104" fill="#34d399">✓ 防护方案: net.ipv4.tcp_syncookies = 1</text>
          <text y="122" fill="#34d399">   队列满时不存状态，将连接特征编码为 ISN 校验和！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">容量调优参数：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• net.ipv4.tcp_max_syn_backlog = 8192</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 开启 syncookies 彻底免疫恶意半连接耗尽；</text>
        <text x="10" y="62" font-size="7.5" fill="#1d4ed8">• 收到最终 ACK 后瞬间移入 Accept 全连接队列！</text>
      </g>
    </g>

    <!-- Right: Accept Queue -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. 全连接队列 (Accept Queue / ESTABLISHED)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">// 三次握手已彻底完成，等待 accept() 取走</text>
          <text y="32" fill="#fed7aa">容量大小 = min(backlog, somaxconn)</text>
          <text y="52" fill="#f87171">🔴 当应用层处理太慢 (如 GC 卡顿 / CPU 100%):</text>
          <text y="68" fill="#fca5a5">全连接队列被迅速填满！</text>
          <text y="86" fill="#ef4444">Linux 默认行为：静默丢弃客户端发来的第 3 次 ACK！</text>
          <text y="104" fill="#fca5a5">► 客户端误以为握手成功，开始发数据，但服务端全丢弃！</text>
          <text y="122" fill="#fb7185">► 客户端持续重传，引发灾难性建联超时雪崩！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产排查与调优：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 查看溢出计数: netstat -s | grep overflowed</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 增大内核限额: net.core.somaxconn = 65535</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 增大应用层 listen(fd, 4096) 参数！</text>
      </g>
    </g>
  </g>
</svg>