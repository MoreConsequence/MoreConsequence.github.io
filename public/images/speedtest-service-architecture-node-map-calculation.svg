<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">你的带宽是怎么算出来的：现代测速服务全景节点地图与计算引擎</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">全球分布式边缘节点选路 ｜ 4~8 路高熵 TCP 满载灌水 ｜ 移动滑动窗口速率采样 ｜ 剔除慢启动与抖动极值</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 节点地图与智能选路</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 客户端启动阶段</text>
          <text x="10" y="34" fill="#93c5fd">1. 拉取全局可用测速节点列表 (XML/JSON)</text>
          <text x="10" y="50" fill="#93c5fd">2. 并发向最近 5 个节点发送 Ping 探测</text>
          <text x="10" y="68" fill="#34d399">3. 综合评估指标选出最优服务器：</text>
          <text x="16" y="84" fill="#4ade80">   Score = 0.6*RTT + 0.3*Jitter + 0.1*Load</text>
          <text x="10" y="104" fill="#38bdf8">✓ 确保在最佳信道条件下开始测速！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">选路精要：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 自动规避跨运营商和高拥塞节点；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 支持用户手动切换测试目标城市；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造全网最可信赖的选路基座。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 多路并发全双工压测</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 突破单 TCP 慢启动瓶颈</text>
          <text x="10" y="34" fill="#86efac">1. 动态自适应并发线程数 (4 ~ 16 路)</text>
          <text x="10" y="50" fill="#86efac">2. 下行高熵流灌水: 2 秒内填满千兆 BDP</text>
          <text x="10" y="68" fill="#38bdf8">3. 上行黑洞推流: 零分配二进制全速发送</text>
          <text x="10" y="90" fill="#34d399">✓ 15 秒内持续采集数十个时间切片样本</text>
          <text x="10" y="106" fill="#4ade80">✓ 压榨出硬件网卡与光纤的极限传输速率！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">并发调优：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免单连接丢包引发拥塞窗口腰斩；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 多连接互相补充，保持链路始终满载；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造工业级高稳定性压测数据流。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 过滤统计与最终速率计算</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 严谨的滑动窗口计算公式</text>
          <text x="10" y="34" fill="#fed7aa">1. 丢弃前 20% 慢启动预热数据点 (Warmup)</text>
          <text x="10" y="50" fill="#fed7aa">2. 丢弃后 10% 停机阶段数据点</text>
          <text x="10" y="68" fill="#38bdf8">3. 在稳态区间计算加权移动平均速率：</text>
          <text x="16" y="84" fill="#4ade80">   Speed = (∑ Bytes × 8) / (∑ Δt × 10^6) [Mbps]</text>
          <text x="10" y="104" fill="#34d399">✓ 过滤掉偶发噪点，输出最权威的真实带宽！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">度量美学：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 屏幕上的那个数字凝聚了全栈工程的极致严谨；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 从操作系统内核到浏览器渲染层层防护；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 这就是现代网络测速工程的魅力所在！</text>
      </g>
    </g>
  </g>
</svg>