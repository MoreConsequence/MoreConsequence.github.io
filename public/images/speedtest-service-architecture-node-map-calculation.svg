<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="speedtest-service-architecture-node-map-calculation-title speedtest-service-architecture-node-map-calculation-desc"><title id="speedtest-service-architecture-node-map-calculation-title">现代测速服务架构体系：全球边缘节点地图、双向管道与高吞吐度量算法</title><desc id="speedtest-service-architecture-node-map-calculation-desc">现代测速服务架构体系：全球边缘节点地图、双向管道与高吞吐度量算法</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">你的带宽是怎么算出来的：现代测速服务全景节点地图与计算引擎</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">全球分布式边缘节点选路 ｜ 4~8 路高熵 TCP 满载灌水 ｜ 移动滑动窗口速率采样 ｜ 剔除慢启动与抖动极值</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 节点地图与智能选路</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 客户端启动阶段</text>
          <text x="10" y="34" fill="#f5f5f5">1. 拉取全局可用测速节点列表 (XML/JSON)</text>
          <text x="10" y="50" fill="#f5f5f5">2. 并发向最近 5 个节点发送 Ping 探测</text>
          <text x="10" y="68" fill="#f5f5f5">3. 综合评估指标选出最优服务器：</text>
          <text x="16" y="84" fill="#f5f5f5">   Score = 0.6*RTT + 0.3*Jitter + 0.1*Load</text>
          <text x="10" y="104" fill="#f5f5f5">✓ 确保在最佳信道条件下开始测速！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">选路精要：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 自动规避跨运营商和高拥塞节点；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 支持用户手动切换测试目标城市；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造全网最可信赖的选路基座。</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 多路并发全双工压测</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 突破单 TCP 慢启动瓶颈</text>
          <text x="10" y="34" fill="#f5f5f5">1. 动态自适应并发线程数 (4 ~ 16 路)</text>
          <text x="10" y="50" fill="#f5f5f5">2. 下行高熵流灌水: 2 秒内填满千兆 BDP</text>
          <text x="10" y="68" fill="#f5f5f5">3. 上行黑洞推流: 零分配二进制全速发送</text>
          <text x="10" y="90" fill="#f5f5f5">✓ 15 秒内持续采集数十个时间切片样本</text>
          <text x="10" y="106" fill="#f5f5f5">✓ 压榨出硬件网卡与光纤的极限传输速率！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">并发调优：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 避免单连接丢包引发拥塞窗口腰斩；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 多连接互相补充，保持链路始终满载；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造工业级高稳定性压测数据流。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 过滤统计与最终速率计算</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 严谨的滑动窗口计算公式</text>
          <text x="10" y="34" fill="#f5f5f5">1. 丢弃前 20% 慢启动预热数据点 (Warmup)</text>
          <text x="10" y="50" fill="#f5f5f5">2. 丢弃后 10% 停机阶段数据点</text>
          <text x="10" y="68" fill="#f5f5f5">3. 在稳态区间计算加权移动平均速率：</text>
          <text x="16" y="84" fill="#f5f5f5">   Speed = (∑ Bytes × 8) / (∑ Δt × 10^6) [Mbps]</text>
          <text x="10" y="104" fill="#f5f5f5">✓ 过滤掉偶发噪点，输出最权威的真实带宽！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">度量美学：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 屏幕上的那个数字凝聚了全栈工程的极致严谨；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 从操作系统内核到浏览器渲染层层防护；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 这就是现代网络测速工程的魅力所在！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
