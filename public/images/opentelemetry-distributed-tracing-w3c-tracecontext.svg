<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="opentelemetry-distributed-tracing-w3c-tracecontext-title opentelemetry-distributed-tracing-w3c-tracecontext-desc"><title id="opentelemetry-distributed-tracing-w3c-tracecontext-title">分布式链路追踪：从 OpenTelemetry 看一次请求跨越网关、RPC 与数据库的一生</title><desc id="opentelemetry-distributed-tracing-w3c-tracecontext-desc">分布式链路追踪：从 OpenTelemetry 看一次请求跨越网关、RPC 与数据库的一生</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">OpenTelemetry 分布式追踪链路：W3C TraceContext 与 Span 树透传</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">W3C traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01 跨进程 HTTP/gRPC 透传形成全局调用树</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 网关入口 (API Gateway / Ingress) ── Root Span 创建 (耗时 5ms)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">GET /api/v1/orders ──► 生成全局 TraceID: 4bf92f3577b34da6a3ce929d0e0e4736, SpanID: 00f067aa0ba902b7</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">记录客户端 IP、UserAgent 与 HTTP 路由匹配，注入 W3C traceparent 请求头！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. 订单业务服务 (Order Service) ── Child Span (耗时 45ms)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">gRPC OrderService.CreateOrder ──► 继承 TraceID, ParentSpanID: 00f067aa0ba902b7</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">执行订单业务参数校验、风控过滤，并并行向用户服务与库存服务发起 RPC 子调用！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. 数据库与缓存层 (MySQL &amp; Redis) ── Leaf Span (耗时 12ms)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">SELECT * FROM users WHERE uid = ? ──► 记录 db.system: mysql, db.statement: SELECT...</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">自动采集 SQL 耗时、慢查询日志与连接池等待排队时延，精准定位性能瓶颈！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 异步遥测导出 (OTLP Exporter) ── 后台批量上报与拓扑大盘渲染</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Span 完成 ──► 无锁 RingBuffer 缓冲 ──► 异步批处理 OTLP/gRPC ──► Jaeger / Tempo 追踪大盘</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">主业务流程 0 阻塞，全链路火焰图精准呈现各节点耗时占比，告别盲人摸象！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
