<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">前端响应式演进史：从命令式 DOM 操作到虚拟 DOM 协调与细粒度 Signals</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">jQuery (手动操作节点) ──► AngularJS 1.x (脏检查 Dirty Checking) ──► React (VDOM Diffing) ──► Svelte/Solid (Signals 无 VDOM 编译期直出)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 第一代：命令式直接操作 DOM (jQuery / 原生 JS, 2006~2010)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">$('#btn').click(() =&gt; $('#count').text(n++)) ──► 状态与 UI 散落在各个事件回调中</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">当页面状态超过 20 个时，代码陷入“意大利面条式”互相修改与数据不一致灾难！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 第二代：声明式双向绑定与脏检查 (AngularJS / Knockout, 2010~2013)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">$scope.$watch() 循环遍历所有监听器 ──► 超过 2000 个 Watcher 后页面交互卡死</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">引入了声明式开发思想，但全量脏检查的性能瓶颈极其严重！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 第三代：纯函数组件与虚拟 DOM 协调 (React / Vue, 2013~2020)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">UI = f(State) ──► 生成轻量 JS 树 ──► O(N) 启发式 Diff ──► 批量 Patch 真实 DOM</text>
        <text x="15" y="62" font-size="8" fill="#047857">彻底解耦状态与渲染，确立现代前端架构十年统治地位！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 第四代：细粒度响应式与编译期抹除 (Svelte / SolidJS / Signals, 2020+)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">依赖图自动订阅 ──► 状态变更直接精准更新单个 DOM 文本节点 (0 VDOM Diff 开销)</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">回归极致性能巅峰，开启细粒度响应式全新时代！</text>
      </g>
    </g>
  </g>
</svg>