<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="characterization-test-golden-master-safety-net-title characterization-test-golden-master-safety-net-desc"><title id="characterization-test-golden-master-safety-net-title">特征快照测试 (Characterization Test)：重构遗留系统的 Golden Master 黄金安全网</title><desc id="characterization-test-golden-master-safety-net-desc">特征快照测试 (Characterization Test)：重构遗留系统的 Golden Master 黄金安全网</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">特征测试 (Characterization Test)：重构黑盒系统的黄金快照安全网</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 捕获线上真实入参 ──► 2. 固化现有老系统输出为 Golden Master 快照 ──► 3. 大胆重构核心代码 ──► 4. 自动化 Diff 零漂移比对</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 盲目重构：改代码容易，证明没改坏极难</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 面对 10 年历史遗留核心 Store 模块</text>
          <text y="28" fill="#f5f5f5">1. 缺乏单元测试，或者测试只覆盖了 10% 理想路径</text>
          <text y="44" fill="#f5f5f5">2. 满篇看不懂的业务 Bug 特殊兼容逻辑</text>
          <text y="60" fill="#f5f5f5">3. 工程师凭直觉重构后，自测基本功能正常</text>

          <text y="86" fill="#f5f5f5">🔴 上线灾难：</text>
          <text y="102" fill="#fb7185">偶发触发隐蔽边缘分支，全量订单状态错乱崩溃！</text>
          <text y="118" fill="#f5f5f5">► "重构成了技术债务的加速器"！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">重构死穴：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 你无法向任何人证明你的重构没有暗中改变隐式行为；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 遗留系统的 Bug 在上下游眼里往往已经是依赖的 Feature；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 导致团队陷入不敢碰、不敢改的僵死泥潭！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 特征测试快照：建立不可动摇的基准锚点</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 1. 给现有代码注入 1000 组真实历史输入</text>
          <text y="28" fill="#f5f5f5">const snapshot = runLegacyStore(inputs);</text>
          <text y="42" fill="#f5f5f5">fs.writeFileSync('golden_master.json', JSON.stringify(snapshot));</text>

          <text y="66" fill="#f5f5f5">// 2. 重构后执行特征比对</text>
          <text y="80" fill="#f5f5f5">const newResult = runRefactoredStore(inputs);</text>
          <text y="94" fill="#f5f5f5">assert.deepStrictEqual(newResult, JSON.parse(goldenMaster));</text>

          <text y="118" fill="#f5f5f5">✓ 100% 确保重构前后黑盒行为与输出 0 字节偏差！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">工程价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 赋予工程师大刀阔斧重构代码的绝对安全感；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 自动化 CI 毫秒级发现哪怕 1 个字段的非预期变动；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 打造遗留系统现代化改造的最强防弹衣！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
