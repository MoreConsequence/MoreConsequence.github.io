<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">特征测试 (Characterization Test)：重构黑盒系统的黄金快照安全网</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 捕获线上真实入参 ──► 2. 固化现有老系统输出为 Golden Master 快照 ──► 3. 大胆重构核心代码 ──► 4. 自动化 Diff 零漂移比对</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Refactor Blindness -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 盲目重构：改代码容易，证明没改坏极难</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 面对 10 年历史遗留核心 Store 模块</text>
          <text y="28" fill="#fca5a5">1. 缺乏单元测试，或者测试只覆盖了 10% 理想路径</text>
          <text y="44" fill="#f87171">2. 满篇看不懂的业务 Bug 特殊兼容逻辑</text>
          <text y="60" fill="#ef4444">3. 工程师凭直觉重构后，自测基本功能正常</text>
          
          <text y="86" fill="#ef4444">🔴 上线灾难：</text>
          <text y="102" fill="#fb7185">偶发触发隐蔽边缘分支，全量订单状态错乱崩溃！</text>
          <text y="118" fill="#ef4444">► "重构成了技术债务的加速器"！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">重构死穴：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 你无法向任何人证明你的重构没有暗中改变隐式行为；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 遗留系统的 Bug 在上下游眼里往往已经是依赖的 Feature；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 导致团队陷入不敢碰、不敢改的僵死泥潭！</text>
      </g>
    </g>

    <!-- Right: Golden Master Safety Net -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 特征测试快照：建立不可动摇的基准锚点</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 1. 给现有代码注入 1000 组真实历史输入</text>
          <text y="28" fill="#86efac">const snapshot = runLegacyStore(inputs);</text>
          <text y="42" fill="#38bdf8">fs.writeFileSync('golden_master.json', JSON.stringify(snapshot));</text>
          
          <text y="66" fill="#34d399">// 2. 重构后执行特征比对</text>
          <text y="80" fill="#86efac">const newResult = runRefactoredStore(inputs);</text>
          <text y="94" fill="#4ade80">assert.deepStrictEqual(newResult, JSON.parse(goldenMaster));</text>
          
          <text y="118" fill="#34d399">✓ 100% 确保重构前后黑盒行为与输出 0 字节偏差！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工程价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 赋予工程师大刀阔斧重构代码的绝对安全感；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 自动化 CI 毫秒级发现哪怕 1 个字段的非预期变动；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造遗留系统现代化改造的最强防弹衣！</text>
      </g>
    </g>
  </g>
</svg>