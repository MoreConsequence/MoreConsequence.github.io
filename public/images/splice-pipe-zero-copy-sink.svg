<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">上行黑洞终极架构：Linux splice() 管道直通零拷贝吞噬</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Socket RX Buffer ──► splice() ──► 内核管道 pipe ──► splice() ──► /dev/null (0 用户态内存拷贝，单核吸收 40Gbps)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 网卡 DMA 写入内核套接字接收队列 (Socket RX Ring Buffer)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">物理光纤万兆上行数据 ──► 网卡硬件通过 DMA 直推 Linux 内核 sk_buff 队列</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">全硬件自动化接收，0 CPU 开销！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. Linux splice() 纯内核页指针转移 (Zero-Copy Page Splicing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">splice(socketFd, NULL, pipeFd[1], NULL, 1048576, SPLICE_F_MOVE) ──► 仅重定向内存 page struct 指针</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">数据完全不拷贝进用户态虚拟内存空间！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 直通黑洞设备瞬间释放 (Direct Null Device Drain)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">splice(pipeFd[0], NULL, nullFd, NULL, 1048576, SPLICE_F_MOVE) ──► 立即解引用并返还给内核伙伴系统</text>
        <text x="15" y="62" font-size="8" fill="#047857">内存复用率 100%，0 内存碎片产生！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 统计与 TCP 窗口维护 (Throughput Counter &amp; Window Update)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">原子累加 bytesSpliced ──► 内核自动向客户端回送超大 TCP Receive Window ACK ──► 持续高速抽水！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代 Linux 极速高性能网络核心黑科技！</text>
      </g>
    </g>
  </g>
</svg>