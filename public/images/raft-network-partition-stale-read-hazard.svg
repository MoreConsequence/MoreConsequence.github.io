<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="raft-network-partition-stale-read-hazard-title raft-network-partition-stale-read-hazard-desc"><title id="raft-network-partition-stale-read-hazard-title">网络分区下的幽灵旧 Leader 脏读危机与线性一致性守卫</title><desc id="raft-network-partition-stale-read-hazard-desc">网络分区下的幽灵旧 Leader 脏读危机与线性一致性守卫</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">网络分区下旧 Leader 读穿透脏读危机 (Stale Read Hazard)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">直接本地读 (被隔离的旧 Leader 1 毫不知情，持续返回已被更新的过期脏数据) vs 线性一致性读 (强制确认多数派，隔离期拒绝读服务保护强一致)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 直接读取本地状态机：读穿透脏数据</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">网络分区时序：</text>
          <text y="28" fill="#f5f5f5">1. 节点 1, 2 与 节点 3, 4, 5 发生网络分裂</text>
          <text y="42" fill="#f5f5f5">2. 多数派分区 (3,4,5) 选出新 Leader 3 并写入 key=200</text>

          <text y="64" fill="#f5f5f5">3. 读请求到达少数派分区的旧 Leader 1：</text>
          <text y="78" fill="#f5f5f5">   • 旧 Leader 1 误以为自己依然合法</text>
          <text y="92" fill="#f5f5f5">   • 直接从本地读出旧值 key=100 回传客户端！</text>

          <text y="116" fill="#f5f5f5">🔴 发生严重破坏线性一致性的时间倒流读！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 金融交易可能读到已被消费的旧余额；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 分布式锁可能产生双重授权；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 严禁在强一致存储中裸读内存！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 线性一致性读屏障：多数派确权防御</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">ReadIndex / Lease 确权流转：</text>

          <text y="36" fill="#f5f5f5">1. 读请求到达旧 Leader 1 ──► 触发心跳确认</text>
          <text y="50" fill="#f5f5f5">2. 旧 Leader 1 无法收到多数派心跳 ACK</text>
          <text y="64" fill="#f5f5f5">3. 判定自己已失去合法领导权 ──► 立即拒绝请求并报错</text>
          <text y="78" fill="#f5f5f5">4. 客户端自动重试将请求路由至新 Leader 3 ──► 读到最新 200！</text>

          <text y="104" fill="#f5f5f5">✓ 100% 绝对线性一致，0 脏读可能！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 捍卫分布式数据一致性的最终防线；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• Kubernetes 与顶级 NewSQL 绝对信赖的基础；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 分布式系统最严密的数学证明！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
