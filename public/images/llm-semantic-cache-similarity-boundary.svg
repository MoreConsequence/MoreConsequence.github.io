<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">大模型语义缓存相似度边界与假阳性（False Positive）灾难窗口</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Cosine 相似度分数坐标轴 ──► 安全命中区 ($&gt;0.95$) vs 假阳性危险区 ($0.80 \sim 0.92$) vs 绝对未命中区 ($&lt;0.80$)</text>
  </g>

  <!-- Main Coordinate Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Coordinate Spectrum (Top Half) -->
    <g transform="translate(40, 25)">
      <text x="0" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">向量相似度（Cosine Similarity: 0.0 ~ 1.0）三段式决策光谱</text>

      <!-- Horizontal Axis Bar -->
      <g transform="translate(0, 30)">
        <!-- Zone 1: Miss (0.0 ~ 0.80) -->
        <rect x="0" y="0" width="380" height="45" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="190" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">绝对未命中区 (&lt; 0.80)</text>
        <text x="190" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">透传大模型重新生成</text>

        <!-- Zone 2: Danger / False Positive (0.80 ~ 0.95) -->
        <rect x="390" y="0" width="230" height="45" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
        <text x="505" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">⚠️ 假阳性灾难区 (0.80 ~ 0.95)</text>
        <text x="505" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">一字之差，语义彻底颠倒！</text>

        <!-- Zone 3: Safe Hit (0.95 ~ 1.0) -->
        <rect x="630" y="0" width="190" height="45" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
        <text x="725" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">✓ 安全命中区 (&gt; 0.95)</text>
        <text x="725" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#047857" text-anchor="middle">0ms 极速返回缓存结果</text>
      </g>
    </g>

    <!-- Danger Example Breakdown (Bottom Half) -->
    <g transform="translate(20, 125)">
      <rect width="860" height="125" rx="6" fill="#fff1f2" stroke="#fca5a5"/>
      <rect width="860" height="28" rx="6" fill="#fee2e2"/>
      <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">经典假阳性惨案：Embedding 高度相似，但逻辑完全对立！</text>

      <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <text x="0" y="16" fill="#0f172a">• Prompt A（已缓存）: <tspan font-family="ui-monospace, monospace" font-weight="700" fill="#1e40af">"帮我写一个从 Redis 批量读取数据的 Go 函数"</tspan></text>
        <text x="0" y="36" fill="#0f172a">• Prompt B（新请求）: <tspan font-family="ui-monospace, monospace" font-weight="700" fill="#991b1b">"帮我写一个向 Redis 批量写入数据的 Go 函数"</tspan></text>
        <text x="0" y="56" fill="#7f1d1d" font-size="10.5">
          👉 <tspan font-weight="700">Cosine 相似度高达 0.918</tspan>！若将阈值设为 0.90，系统将错误把“读函数”当成“写函数”返回给用户，引发严重业务 Bug！
        </text>
        <text x="0" y="74" fill="#047857" font-weight="700" font-size="10.5">
          🛡️ 防御法则：必须引入“关键词实体提取 + 轻量 Cross-Encoder 二次校验”，绝不能迷信单一向量分数！
        </text>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">语义缓存的物理红线：</tspan> 传统 Cache 失败只是 Cache Miss（多查一次 DB）；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#ea580c" font-weight="700" text-anchor="middle">
        语义缓存一旦发生 False Positive，返回的是完全张冠李戴的错误答案，对生产业务具备毁灭性打击！
      </text>
    </g>
  </g>
</svg>
