<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 命令行执行双重防御模型 (AST Analysis &amp; Allow/Deny List)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 拦截黑名单破坏性命令 ──► 2. AST 语法树深度剥离管道符与反引号 ──► 3. 校验白名单安全工具 ──► 4. 安全放行至沙箱</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 严禁黑名单直接秒杀 (Hard Denylist: Instant Rejection)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">命中: rm -rf /, :(){ :|:&amp; };:, mkfs, dd if=/dev/zero ──► 瞬间抛出 SecurityError 拒绝执行</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">零容忍阻断破坏性指令！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. Bash AST 语法树拆解 (Bash AST Tokenization &amp; Injection Check)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">解析管道符 |、分号 ;、反引号 `、子 Shell $(...) ──► 递归展开每一个子命令逐一过审</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">彻底瓦解利用特殊字符绕过黑名单的注入花招！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 常用开发工具白名单放行 (DevTools Allowlist Pass)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">放行 npm, git, go, cargo, pytest, tsc 等标准化开发测试命令 ──► 赋予 Agent 充分的工程行动力</text>
        <text x="15" y="62" font-size="8" fill="#047857">在安全性与自主性之间达成完美平衡！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 未知命令人机在环授权 (Human-in-the-Loop Confirmation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">遇到非白名单边缘命令 (如 sudo, curl) ──► 挂起状态机并弹出确认框请求开发者授权！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">严密捍卫本地系统的终极控制权！</text>
      </g>
    </g>
  </g>
</svg>