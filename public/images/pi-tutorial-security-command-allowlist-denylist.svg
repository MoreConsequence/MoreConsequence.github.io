<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="pi-tutorial-security-command-allowlist-denylist-title pi-tutorial-security-command-allowlist-denylist-desc"><title id="pi-tutorial-security-command-allowlist-denylist-title">50KB 滚动缓冲、递归进程树强杀与工作区信任门禁</title><desc id="pi-tutorial-security-command-allowlist-denylist-desc">执行引擎架构图展示 50KB 滚动缓冲防内存泄漏 OOM、POSIX 进程组递归强杀杜绝僵尸进程，以及 project_trust 工作区初始信任门禁流转机制。</desc>
  <defs>
    <marker id="bk-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="bk-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">BASH EXECUTION ENGINE · ROLLING BUFFER, KILL-TREE &amp; PROJECT TRUST</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">滚动缓冲、进程树强杀与工作区信任门禁</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">50KB 滚动缓冲 (头尾保留防 OOM) ➔ POSIX 进程组递归强杀 (清剿僵尸) ➔ project_trust 工作区信任门禁</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="270" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="69" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">ROLLING BUFFER</text>
    <text x="134" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">50KB 滚动丢弃缓冲</text>

    
    <rect x="14" y="42" width="242" height="110" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600">MAX_BUFFER = 50KB</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• 保留头部 10KB (启动信息/命令)</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 保留尾部 40KB (最新错误/结论)</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">• 中间插入 ... [Output truncated] ...</text>
    <text x="24" y="136" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Zero-OOM Crash Safety Guard</text>

    
    <rect x="14" y="162" width="242" height="152" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">内存保护机制：</text>
    <text x="24" y="204" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 杜绝 cat 100MB 巨型日志撑爆内存；</text>
    <text x="24" y="224" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 防止巨型输出撑破大模型上下文；</text>
    <text x="24" y="244" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 保证终端与 Agent 运行时绝对轻量。</text>
    <line x1="24" y1="258" x2="246" y2="258" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Bounded Memory Footprint</text>
    <text x="24" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Zero Memory Leakage Guarantee</text>
  </g>

  
  <text x="325" y="225" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Kill</text>
  <line x1="310" y1="233" x2="340" y2="233" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#bk-arr-accent)" />

  
  <g transform="translate(340, 136)">
    <rect width="290" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#eb6c36" />
    <text x="79" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">KILL PROCESS TREE</text>
    <text x="154" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">递归进程树强杀</text>

    
    <rect x="14" y="42" width="262" height="110" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">process.kill(-pid, "SIGKILL")</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1. spawn 时开启 detached: true 独立组</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. 超时/取消时向负 PID 发送强杀信号</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">3. 清剿父子衍生全量常驻进程与端口</text>
    <text x="24" y="136" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Zero Zombie Process Guarantee</text>

    
    <rect x="14" y="162" width="262" height="152" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">强杀核心价值：</text>
    <text x="24" y="204" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 解决普通 kill 只能杀父进程的缺陷；</text>
    <text x="24" y="224" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 防止 npm start 遗留常驻后台占用端口；</text>
    <text x="24" y="244" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 保证环境在每次命令执行后绝对干净。</text>
    <line x1="24" y1="258" x2="266" y2="258" stroke="#eb6c36" stroke-width="1.2" />
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">POSIX Process Group Management</text>
    <text x="24" y="296" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">工业级 Shell 执行可靠性底盘</text>
  </g>

  
  <text x="645" y="225" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Trust</text>
  <line x1="630" y1="233" x2="660" y2="233" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#bk-arr-accent)" />

  
  <g transform="translate(660, 136)">
    <rect width="260" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#2d3142" />
    <text x="69" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">PROJECT TRUST</text>
    <text x="134" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">工作区信任门禁</text>

    
    <rect x="14" y="42" width="232" height="110" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">Untrusted ➔ Trusted 状态机</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1. 首次进入未知目录: 默认 Untrusted</text>
    <text x="24" y="100" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. 强制只读运行，禁用外部网络访问</text>
    <text x="24" y="118" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">3. 用户显式 /trust 后方才解锁写权限</text>
    <text x="24" y="136" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Zero-Trust Directory Boundary</text>

    
    <rect x="14" y="162" width="232" height="152" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="184" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">工程落地效益：</text>
    <text x="24" y="204" fill="#eb6c36" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 杜绝克隆第三方恶意代码直接执行；</text>
    <text x="24" y="224" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 建立起 VS Code 级别的信任授权标准；</text>
    <text x="24" y="244" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 构筑出不可突破的多层安全防线！</text>
    <line x1="24" y1="258" x2="236" y2="258" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
    <text x="24" y="278" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Zero-Trust Workspace Gate</text>
    <text x="24" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Production Hardened Security</text>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="506.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="518.0" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">50KB 滚动缓冲与工作区信任门禁</text>
  <rect x="370" y="506.0" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="390" y="518.0" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">POSIX 进程组递归强杀杜绝僵尸进程核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
