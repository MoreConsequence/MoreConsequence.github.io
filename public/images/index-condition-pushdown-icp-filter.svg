<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">索引下推 (Index Condition Pushdown - ICP) 过滤机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">无 ICP (每条索引匹配都回表，交给 Server 层过滤) vs 开启 ICP (InnoDB 存储引擎在遍历索引时就地判断 WHERE 条件，回表次数骤降 95%)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">1. 传统无 ICP 时代的低效回表 (Traditional Without ICP)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">WHERE zipcode = '10001' AND name LIKE '%smith%' ──► 匹配 10,000 条 zipcode ──► 必须全量回表 10,000 次！</text>
      <text x="15" y="62" font-size="8" fill="#7f1d1d">回表后传给 MySQL Server 层才发现只有 5 条匹配 name，9,995 次回表完全是徒劳的无用功！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">2. ICP 条件下推至存储引擎 (Predicate Pushdown to InnoDB)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">联合索引: KEY (zipcode, name) ──► Server 层将 name LIKE '%smith%' 条件直接下推给 InnoDB 引擎</text>
        <text x="15" y="62" font-size="8" fill="#1d4ed8">利用联合索引中已有的 name 字段数据进行就地提前裁决！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 索引遍历时就地过滤 (In-Engine Index Filtering)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">InnoDB 在扫描索引时直接比对 name ──► 提前剔除 9,995 条不符合条件的记录 ──► 仅保留 5 条！</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将不合法的记录在回表前直接物理抹杀！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 极小代价精准回表 (5 Times Accurate Table Lookup)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">仅对精准命中的 5 条记录回表提取整行 ──► 回表 I/O 开销骤降 99.95% ──► 查询秒级秒开！</text>
        <text x="15" y="62" font-size="8" fill="#047857">MySQL 5.6+ 最具革命性的执行引擎优化之一！</text>
      </g>
    </g>
  </g>
</svg>