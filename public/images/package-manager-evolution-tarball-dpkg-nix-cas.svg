<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">包管理器三十年演进史：从 /usr/local 全局污染到 Nix 纯函数式确定性构建</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">第 1 代: make install (无记账) ──► 第 2 代: dpkg/rpm/apt (依赖地狱) ──► 第 3 代: Homebrew (声明式) ──► 第 4 代: Nix (不可变 CAS 存储)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">第 1 代: make install (1990s 蛮荒时代 - 无元数据与卸载无门)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">./configure &amp;&amp; make &amp;&amp; make install ──► 直接把二进制和 .so 动态库散落拷贝进 /usr/local/bin 和 /usr/lib</text>
      <text x="15" y="62" font-size="8" fill="#7f1d1d">缺乏全局元数据记账，无法干净卸载，同名动态库冲突直接导致整个操作系统被搞坏崩溃！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">第 2 代: dpkg / rpm / apt / yum (2000s 声明式包管理与依赖解析)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">apt-get install pkg ──► 引入 /var/lib/dpkg/status 本地账本 ──► 依赖图拓扑排序与校验</text>
        <text x="15" y="62" font-size="8" fill="#1d4ed8">实现了依赖自动级联安装与干净卸载，但依然受困于全系统单一版本的"依赖地狱 (Dependency Hell)"！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">第 3 代: Homebrew / Conda (用户态沙箱与 Formula 软链接体系)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">/opt/homebrew/Cellar/node/20.0.0 ──► symlink 软链接至 /opt/homebrew/bin/node</text>
        <text x="15" y="62" font-size="8" fill="#047857">无需 root 权限，多版本物理隔离存储，通过动态切换软链接实现版本平滑切换！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">第 4 代: Nix / Guix (纯函数式、不可变与内容寻址 CAS 存储)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">/nix/store/7a9b1c-openssl-3.0.1 ──► 路径哈希包含所有源码、编译参数与传递依赖的完整哈希！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">绝对不可变、100% 跨机器确定性复现、支持多版本无冲突并存与原子级瞬间回滚，终极形态！</text>
      </g>
    </g>
  </g>
</svg>