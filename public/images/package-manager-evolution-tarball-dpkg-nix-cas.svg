<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="package-manager-evolution-tarball-dpkg-nix-cas-title package-manager-evolution-tarball-dpkg-nix-cas-desc"><title id="package-manager-evolution-tarball-dpkg-nix-cas-title">操作系统包管理器演进三十年：从 make install 源码编译到 dpkg/rpm 到 Nix /…</title><desc id="package-manager-evolution-tarball-dpkg-nix-cas-desc">操作系统包管理器演进三十年：从 make install 源码编译到 dpkg/rpm 到 Nix / Homebrew 内容寻址存储 (CAS)</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">包管理器三十年演进史：从 /usr/local 全局污染到 Nix 纯函数式确定性构建</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">第 1 代: make install (无记账) ──► 第 2 代: dpkg/rpm/apt (依赖地狱) ──► 第 3 代: Homebrew (声明式) ──► 第 4 代: Nix (不可变 CAS 存储)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">第 1 代: make install (1990s 蛮荒时代 - 无元数据与卸载无门)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">./configure &amp;&amp; make &amp;&amp; make install ──► 直接把二进制和 .so 动态库散落拷贝进 /usr/local/bin 和 /usr/lib</text>
      <text x="15" y="62" font-size="8" fill="#2d3142">缺乏全局元数据记账，无法干净卸载，同名动态库冲突直接导致整个操作系统被搞坏崩溃！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">第 2 代: dpkg / rpm / apt / yum (2000s 声明式包管理与依赖解析)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">apt-get install pkg ──► 引入 /var/lib/dpkg/status 本地账本 ──► 依赖图拓扑排序与校验</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">实现了依赖自动级联安装与干净卸载，但依然受困于全系统单一版本的"依赖地狱 (Dependency Hell)"！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">第 3 代: Homebrew / Conda (用户态沙箱与 Formula 软链接体系)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">/opt/homebrew/Cellar/node/20.0.0 ──► symlink 软链接至 /opt/homebrew/bin/node</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">无需 root 权限，多版本物理隔离存储，通过动态切换软链接实现版本平滑切换！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">第 4 代: Nix / Guix (纯函数式、不可变与内容寻址 CAS 存储)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">/nix/store/7a9b1c-openssl-3.0.1 ──► 路径哈希包含所有源码、编译参数与传递依赖的完整哈希！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">绝对不可变、100% 跨机器确定性复现、支持多版本无冲突并存与原子级瞬间回滚，终极形态！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
