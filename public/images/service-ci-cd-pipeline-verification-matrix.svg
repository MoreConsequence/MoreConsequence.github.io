<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">CI/CD 持续交付证据矩阵：绿灯不是部署凭据，全链路四层验真体系</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 静态代码门禁 (Linter/TypeCheck) ──► 2. 单元与契约测试 ──► 3. 容器镜像不可变构建与签名 ──► 4. 生产金丝雀度量准入</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 静态代码分析与安全扫描 (Static Analysis &amp; SAST Gate)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">golangci-lint / eslint --max-warnings=0 &amp;&amp; trivy fs --security-checks vuln,config</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">从源头物理阻断语法违规、未处理错误、硬编码密码密钥与高危开源依赖漏洞进入主干！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 契约测试与并发反例断言 (Contract &amp; Concurrency Assertions)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">go test -race -count=100 ./... &amp;&amp; pact-verifier (校验上下游 Protobuf/JSON Schema 兼容性)</text>
        <text x="15" y="62" font-size="8" fill="#047857">自动化注入 100 并发相同请求与竞态分析，确保单机逻辑与微服务接口兼容性 100% 绿色！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 确定性镜像构建与 Cosign 密码学签名 (Immutable Artifact &amp; Sign)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">docker buildx build --sbom=true -t reg/app:sha-7a8b9c &amp;&amp; cosign sign --key k8s.key</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">镜像附带软件物料清单 (SBOM) 与 Git 提交哈希唯一绑定，K8s 准入控制器验签防篡改！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 生产灰度准入与 Prometheus 指标自动巡检 (Canary Rollout &amp; SLA)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">Argo Rollouts 引导 5% 流量 ──► 自动采样 10m 错误率 &amp; p99 ──► 达标全量推进，超限 1 秒回滚！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">用客观运行时的物理监控指标作为上线的唯一事实证据，彻底告别拍脑袋和凭感觉部署！</text>
      </g>
    </g>
  </g>
</svg>