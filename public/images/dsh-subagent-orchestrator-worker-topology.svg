<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 多 Agent 协同架构与任务并行分发拓扑 (Multi-Agent Swarm)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">主协调器 Orchestrator ──► 并发派发至特化子代理 (Coder / Reviewer / Tester / Researcher) ──► 聚合结果回传</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 主规划与任务拆解协调器 (Primary Orchestrator &amp; Task Decomposer)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">接收用户复杂任务 ──► 拆解为有向无环图 (DAG 子任务) ──► 统一把控上下文与全局交付质量</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">多 Agent 系统的中枢大脑！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 特化工作子代理并发执行 (Specialized Subagents Swarm)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">Research Agent (查阅一手文献) ｜ Coder Agent (编写核心实现) ｜ Tester Agent (运行沙箱自动化测试)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">各司其职，拥有独立精简的上下文预算！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 结构化点对点消息总线 (Structured Inter-Agent Message Bus)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">基于 send_message 强类型协议通信 ──► 传递纯净提取事实，0 冗余对话历史污染</text>
        <text x="15" y="62" font-size="8" fill="#047857">彻底消除多 Agent 级联幻觉与上下文膨胀！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 仲裁汇总与最终交付 (Synthesis &amp; Unified Delivery)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">协调器汇聚全部子工件 ──► 终审代码一致性并运行集成测试 ──► 向用户交付最终可工作产物！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代化复杂软件工程自动化的高阶形态！</text>
      </g>
    </g>
  </g>
</svg>