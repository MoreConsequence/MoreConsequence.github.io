<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">TypeScript 现代工具链分工：tsc 类型验证与 esbuild/SWC 极速转译解耦</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">解耦原则：构建转译交给 Go/Rust 原生工具 (esbuild/Turbopack, 100ms) ｜ 类型校验独立交给 tsc --noEmit (异步 CI 验证)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 传统 tsc 全量单线程编译瓶颈 (Monolithic tsc Bottleneck)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">tsc 同时做 [类型检查] + [AST 转译] + [代码发射] ──► 5 万行代码编译耗时 45 秒，极度卡顿！</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将不相干的职责耦合在一个单线程 Node.js 进程中是速度缓慢的根源！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 原生转译解耦 (Native Transpilation: esbuild / SWC / Turbopack)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Go/Rust 编写的 esbuild 多核并行直接擦除类型注解 ──► 5 万行代码转译仅需 0.12 秒！</text>
        <text x="15" y="62" font-size="8" fill="#047857">速度提升 300 倍，让本地开发与热重载体验达到丝滑秒级直出！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 独立类型检查闸门 (Async Type Checking: tsc --noEmit)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">通过 IDE 语言服务器 (LSP) 与 Git pre-commit / CI 流水线异步进行全量类型检查</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">既不拖慢构建发布速度，又 100% 坚守类型安全底线！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 现代工具链最佳实践全景 (Modern Toolchain Stack)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">pnpm + Turbopack + Vitest + Biome/ESLint ──► 打造兼顾极致速度与工程严密度的顶级体验！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">告别卡顿与混乱，拥抱现代全栈工程化巅峰！</text>
      </g>
    </g>
  </g>
</svg>