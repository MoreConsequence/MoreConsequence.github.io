<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">类型体操核心机理：分布式条件类型 (Distributive Law) 与方括号逃逸</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">裸泛型参数 T extends any 遇到联合类型自动展开分发 ｜ 用 [T] extends [any] 元组包裹强行关闭分发律保持整体判定</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 自动分发 (Distributive: 裸类型)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">type ToArray&lt;T&gt; = T extends any ? T[] : never;</text>
          <text y="36" fill="#86efac">传入联合类型: ToArray&lt;string | number&gt;</text>
          <text y="58" fill="#34d399">分发计算展开：</text>
          <text y="72" fill="#cbd5e1">► (string extends any ? string[] : never)</text>
          <text y="86" fill="#cbd5e1">  | (number extends any ? number[] : never)</text>
          <text y="112" fill="#4ade80">✓ 最终结果: string[] | number[] (各自为阵)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">应用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 官方 Exclude&lt;T, U&gt; 与 Extract&lt;T, U&gt; 底层机理；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 批量对联合类型每个成员进行映射变换；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 类型体操最强大的自动展开武器。</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 关闭分发 (Non-distributive: [T] 元组)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">type ToArrayStrict&lt;T&gt; = [T] extends [any] ? T[] : never;</text>
          <text y="36" fill="#86efac">传入联合类型: ToArrayStrict&lt;string | number&gt;</text>
          <text y="58" fill="#34d399">整体计算判定：</text>
          <text y="72" fill="#cbd5e1">► [string | number] extends [any]</text>
          <text y="86" fill="#cbd5e1">  直接判定整体成立，不进行任何拆分分发！</text>
          <text y="112" fill="#4ade80">✓ 最终结果: (string | number)[] (联合数组)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">应用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 判断某个类型是否是 never 或精确 any；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 保持联合类型的整体属性不被拆解；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高精度类型推导库的必修课。</text>
      </g>
    </g>
  </g>
</svg>