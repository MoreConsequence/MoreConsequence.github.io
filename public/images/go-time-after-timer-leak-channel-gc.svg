<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">time.After 循环泄漏真相：248B 定时器常驻直到 5 分钟超时</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">for select 中每次执行 time.After 均创建全新 Timer ──► 挂入 P 堆无法被 GC ──► time.NewTimer + Reset 复用彻底根治</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Leak Pattern -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 循环调用 time.After 内存雪崩</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">for {</text>
          <text y="28" fill="#fca5a5">    select {</text>
          <text y="42" fill="#cbd5e1">    case msg := &lt;-ch: handle(msg)</text>
          <text y="58" fill="#f87171">    case &lt;-time.After(5 * time.Minute): // 每次循环都 new！</text>
          <text y="72" fill="#fca5a5">        return</text>
          <text y="86" fill="#fca5a5">    }</text>
          <text y="100" fill="#f87171">}</text>
          
          <text y="120" fill="#ef4444">🔴 隐藏账单：若 ch 每秒来 1000 个消息：</text>
          <text y="136" fill="#fb7185">5 分钟内创建 30 万个 Timer 堆对象 (占用 ~75MB 常驻内存)！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">泄漏物理机理：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• time.After 底层创建 time.Timer 并挂入当前 P 的四叉堆；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 即使 case msg 命中了，该 Timer 依然在 P 堆中存活 5 分钟！</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 在 5 分钟倒计时结束前，GC 绝对无法回收它！</text>
      </g>
    </g>

    <!-- Right: NewTimer + Reset -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正确标准姿势：time.NewTimer + Reset 复用</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">timer := time.NewTimer(5 * time.Minute) // 循环外仅创建 1 次</text>
          <text y="28" fill="#34d399">defer timer.Stop()</text>
          <text y="44" fill="#86efac">for {</text>
          <text y="58" fill="#86efac">    timer.Reset(5 * time.Minute) // 每次处理前重置定时器 (0 分配)</text>
          <text y="72" fill="#cbd5e1">    select {</text>
          <text y="86" fill="#38bdf8">    case msg := &lt;-ch: handle(msg)</text>
          <text y="100" fill="#fbbf24">    case &lt;-timer.C:   return</text>
          <text y="114" fill="#86efac">    }</text>
          <text y="128" fill="#86efac">}</text>
          <text y="142" fill="#34d399">✓ 30 万次消息仅消耗 1 个 Timer 对象，内存占用归零！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">Go 1.23+ 现代 Timer 改进：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Go 1.23 起未被引用的 Timer 可被 GC 提前回收；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• Reset 无需再手工排空 timer.C 通道；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 但长循环中显式 NewTimer 复用依然是最高性能的最佳实践！</text>
      </g>
    </g>
  </g>
</svg>