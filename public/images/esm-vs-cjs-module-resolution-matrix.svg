<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="esm-vs-cjs-module-resolution-matrix-title esm-vs-cjs-module-resolution-matrix-desc"><title id="esm-vs-cjs-module-resolution-matrix-title">ESM 静态导入 (import) 与 CJS 动态加载 (require) 模块解析矩阵</title><desc id="esm-vs-cjs-module-resolution-matrix-desc">ESM 静态导入 (import) 与 CJS 动态加载 (require) 模块解析矩阵</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">JavaScript 模块体系物理鸿沟：ESM (静态) vs CommonJS (动态)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">ESM (编译期静态依赖图解析、顶级 await、只读 live binding) vs CJS (运行期动态 require、同步加载、值拷贝与 module.exports 篡改)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">CommonJS (Node.js 传统模型)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">const a = require('./a') // 运行期同步加载执行</text>
          <text y="28" fill="#f5f5f5">module.exports = { count: 1 }</text>

          <text y="50" fill="#f5f5f5">物理机制特性：</text>
          <text y="64" fill="#f5f5f5">• 值拷贝导出：外部修改无法同步内部</text>
          <text y="78" fill="#f5f5f5">• 允许条件 require('...')，导致构建器无法 Tree-Shaking</text>
          <text y="92" fill="#f5f5f5">• 无法同步 require ESM 模块 (ERR_REQUIRE_ESM)！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">历史局限：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 打包产物体积臃肿难以摇树；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 浏览器端无法原生直接运行；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 逐步过渡为兼容历史遗留模式。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">ECMAScript Modules (现代官方标准)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">import { count } from './a.js' // 编译期静态分析</text>
          <text y="28" fill="#f5f5f5">export const count = 1</text>

          <text y="50" fill="#f5f5f5">现代标准优势：</text>
          <text y="64" fill="#f5f5f5">• 实时动态绑定 (Live Bindings)：变量变更实时联动</text>
          <text y="78" fill="#f5f5f5">• 静态依赖图实现 100% 彻底 Dead-Code Elimination (DCE)</text>
          <text y="92" fill="#f5f5f5">• 现代浏览器与 Node.js 22+ 原生标准支持！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 产物体积削减 40% ~ 70%；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 统一前后端 JavaScript 模块规范；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代化前端基建唯一演进方向！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
