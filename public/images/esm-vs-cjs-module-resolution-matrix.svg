<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">JavaScript 模块体系物理鸿沟：ESM (静态) vs CommonJS (动态)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">ESM (编译期静态依赖图解析、顶级 await、只读 live binding) vs CJS (运行期动态 require、同步加载、值拷贝与 module.exports 篡改)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: CJS -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">CommonJS (Node.js 传统模型)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">const a = require('./a') // 运行期同步加载执行</text>
          <text y="28" fill="#f87171">module.exports = { count: 1 }</text>
          
          <text y="50" fill="#ef4444">物理机制特性：</text>
          <text y="64" fill="#fca5a5">• 值拷贝导出：外部修改无法同步内部</text>
          <text y="78" fill="#ef4444">• 允许条件 require('...')，导致构建器无法 Tree-Shaking</text>
          <text y="92" fill="#ef4444">• 无法同步 require ESM 模块 (ERR_REQUIRE_ESM)！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">历史局限：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 打包产物体积臃肿难以摇树；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 浏览器端无法原生直接运行；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 逐步过渡为兼容历史遗留模式。</text>
      </g>
    </g>

    <!-- Right: ESM -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">ECMAScript Modules (现代官方标准)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">import { count } from './a.js' // 编译期静态分析</text>
          <text y="28" fill="#86efac">export const count = 1</text>
          
          <text y="50" fill="#38bdf8">现代标准优势：</text>
          <text y="64" fill="#34d399">• 实时动态绑定 (Live Bindings)：变量变更实时联动</text>
          <text y="78" fill="#34d399">• 静态依赖图实现 100% 彻底 Dead-Code Elimination (DCE)</text>
          <text y="92" fill="#4ade80">• 现代浏览器与 Node.js 22+ 原生标准支持！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 产物体积削减 40% ~ 70%；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 统一前后端 JavaScript 模块规范；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化前端基建唯一演进方向！</text>
      </g>
    </g>
  </g>
</svg>