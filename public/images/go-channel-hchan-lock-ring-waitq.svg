<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Channel 底层 hchan 结构体与无锁/有锁调度链路</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">hchan 互斥锁 (lock) ｜ buf 环形缓冲区 (Ring Buffer) ｜ sendq / recvq 双向等待链表 (sudog 栈复制)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1: Direct Pass -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. 快速路径：直接内存拷贝 (34ns)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#34d399">// 当 recvq 中已有等待的 G 阻塞时</text>
          <text x="10" y="34" fill="#86efac">1. Sender 获取 hchan.lock</text>
          <text x="10" y="48" fill="#86efac">2. 从 recvq 弹出一个 sudog 结构体</text>
          <text x="10" y="64" fill="#38bdf8">3. sendDirect():</text>
          <text x="16" y="78" fill="#38bdf8">   直接将发送者数据写到接收者 G 的栈内存！</text>
          <text x="10" y="98" fill="#34d399">4. 唤醒接收者 G (goready(gp))</text>
          <text x="10" y="114" fill="#34d399">5. 释放锁 ──► 耗时仅 34.91ns！</text>
          <text x="10" y="130" fill="#86efac">✓ 完全绕过中间 ring buffer 缓冲拷贝！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">核心机制：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 跨 Goroutine 栈直接写入 (Stack-to-Stack)</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 零经过堆内存分配，GC 零压力</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 语言运行时最精妙的通信设计！</text>
      </g>
    </g>

    <!-- Col 2: Ring Buffer -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. 中速路径：环形缓冲区 (48ns)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 带缓冲 channel 且 buf 未满</text>
          <text x="10" y="34" fill="#93c5fd">1. 获取 hchan.lock</text>
          <text x="10" y="48" fill="#93c5fd">2. 计算 sendx 槽位地址: qcount++</text>
          <text x="10" y="64" fill="#93c5fd">3. typedmemmove 将数据拷入 buf[sendx]</text>
          <text x="10" y="80" fill="#93c5fd">4. sendx = (sendx + 1) % dataqsiz</text>
          <text x="10" y="98" fill="#34d399">5. 释放锁 ──► 耗时约 48ns</text>
          <text x="10" y="118" fill="#fbbf24">► 不需要触发 Goroutine 挂起与调度！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">缓冲区调优：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 缓冲容量应按并发峰值精确计算</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 消除发送者与接收者瞬时速率差异</text>
        <text x="10" y="62" font-size="7.5" fill="#1d4ed8">• 避免缓冲区过大导致内存隐式膨胀</text>
      </g>
    </g>

    <!-- Col 3: Block & Park -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">3. 慢速路径：阻塞挂起 (139ns)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// 缓冲区已满或无缓冲无接收者</text>
          <text x="10" y="34" fill="#fca5a5">1. 从当前 P 获取 sudog 结构体</text>
          <text x="10" y="48" fill="#fca5a5">2. 将待发送数据指针打包进 sudog</text>
          <text x="10" y="64" fill="#fca5a5">3. 挂入 hchan.sendq 等待队列尾部</text>
          <text x="10" y="80" fill="#ef4444">4. goparkunlock(): 释放锁并挂起当前 G！</text>
          <text x="10" y="100" fill="#fb7185">5. 调度器切换执行其他就绪 Goroutine</text>
          <text x="10" y="118" fill="#f87171">► 产生调度上下文切换开销 (139.0ns)！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产死锁红线：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 向 nil channel 发送/接收永远阻塞；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 向已关闭 channel 发送直接 panic；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 生产统一采用 select + ctx.Done() 超时退出！</text>
      </g>
    </g>
  </g>
</svg>