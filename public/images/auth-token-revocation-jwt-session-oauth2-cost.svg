<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">认证体系吊销税对比：JWT 无状态两难 vs 集中式 Session vs OAuth2</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">JWT (无状态但无法主动吊销，黑名单又重新引入状态) ｜ Redis Session (毫秒级即时踢人但强依赖存储) ｜ OAuth2 双 Token 换发</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. JWT: "无状态"的伪命题</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 自包含签名 Token</text>
          <text x="10" y="34" fill="#93c5fd">Header.Payload.Signature (有效期 7 天)</text>
          
          <text x="10" y="56" fill="#f87171">⚠️ 致命痛点：无法即时吊销 (Revocation)</text>
          <text x="10" y="70" fill="#fca5a5">• 用户改密或被封禁，JWT 依然合法有效！</text>
          <text x="10" y="86" fill="#fb7185">• 若建 Redis 黑名单，则彻底退化为有状态！</text>
          <text x="10" y="104" fill="#ef4444">► "既要无状态的性能，又要随时吊销的控制，物理上不可能！"</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">适用边界：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 短生命周期 Token (5~15 分钟)；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 跨异构微服务间的一次性授权凭证；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 严禁直接作为长期登录 Session！</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Redis 集中式 Session</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 客户端仅持 SessionID (32B UUID)</text>
          <text x="10" y="34" fill="#86efac">GET session:uuid ──► 内存直读用户状态</text>
          
          <text x="10" y="58" fill="#38bdf8">✓ 绝对控制力：</text>
          <text x="10" y="72" fill="#34d399">• DEL session:uuid 毫秒级踢人下线！</text>
          <text x="10" y="86" fill="#34d399">• 单点登录 (SSO) 互踢顶号实现极简！</text>
          <text x="10" y="104" fill="#fbbf24">⚠️ 成本: 每次请求必须消耗 1 次 Redis I/O</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 企业内部后台、金融交易核心系统；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 安全风控要求极高、随时需封号踢人的业务；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 简单直接、健壮无坑的工业级选择。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">3. OAuth2 双 Token 混合架构</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">1. Access Token (JWT 格式, 15 分钟)</text>
          <text x="16" y="32" fill="#93c5fd">   • 高频 API 调用无状态鉴权，0 DB 查询</text>
          
          <text x="10" y="54" fill="#4ade80">2. Refresh Token (不透明随机串, 30 天)</text>
          <text x="16" y="68" fill="#86efac">   • 存入数据库，换发新 Token 时查验</text>
          
          <text x="10" y="90" fill="#34d399">✓ 兼顾了高并发无状态与最长 15 分钟延迟吊销！</text>
          <text x="10" y="106" fill="#4ade80">✓ 现代移动 App 与开放平台黄金标准！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">架构平衡点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 将集中式 I/O 压力降低 99%；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 吊销窗口收敛在 15 分钟内；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 优雅解决安全与吞吐的工程矛盾。</text>
      </g>
    </g>
  </g>
</svg>