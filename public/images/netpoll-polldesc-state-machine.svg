<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">pollDesc 描述符原子状态机 (pdNil ⇄ pdWait ⇄ pdReady)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">rg / wg 指针状态三态流转 ｜ 杜绝数据包早到或超时竞态 ｜ SetDeadline 定时器与网络事件的完美解耦原子仲裁</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 状态 0: pdNil (空闲初始态)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">pd.rg = pdNil (0)</text>
          
          <text x="10" y="38" fill="#86efac">初始状态含义：</text>
          <text x="10" y="54" fill="#cbd5e1">• 没有 Goroutine 正在等待读该套接字</text>
          <text x="10" y="70" fill="#cbd5e1">• 也没有网络就绪事件提前到达</text>
          <text x="10" y="86" fill="#34d399">• 干净纯洁的空闲基线状态</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 纳秒级原子状态就绪！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 64 位整数字段 CAS 管理；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 0 锁高并发轻量流转；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造稳固状态基底。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 状态 G: pdWait (协程挂起)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">pd.rg = uintptr(unsafe.Pointer(g))</text>
          
          <text x="10" y="38" fill="#fed7aa">等待状态流转：</text>
          <text x="10" y="54" fill="#38bdf8">1. G 尝试读取遇到 EAGAIN</text>
          <text x="10" y="70" fill="#34d399">2. CAS 将 pd.rg 设为当前 G 指针</text>
          <text x="10" y="86" fill="#34d399">3. netpoll 捕获事件后据此唤醒目标 G！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 挂载确切的唤醒目标协程！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 若此时触发 Deadline 超时；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 定时器可直接 CAS 抢占 pd.rg 并唤醒；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 彻底消灭竞态条件。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 状态 1: pdReady (事件先到)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">pd.rg = pdReady (1)</text>
          
          <text x="10" y="38" fill="#86efac">早到事件缓存：</text>
          <text x="10" y="54" fill="#38bdf8">1. 网卡已收到数据，但 G 尚未调用 Read()</text>
          <text x="10" y="70" fill="#34d399">2. netpoll 将 pd.rg 标记为 pdReady</text>
          <text x="10" y="86" fill="#4ade80">3. G 随后调用 Read 时发现已就绪，0 挂起直接读！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 零延迟瞬间命中执行！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免数据已在内核缓冲区却依然挂起协程；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 极大提升高吞吐数据流处理效率；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化运行时极简状态机典范！</text>
      </g>
    </g>
  </g>
</svg>