<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">带宽时延积 (BDP) 物理管道模型：飞行数据量 (In-Flight Data) 计算</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">BDP = 带宽 (Bandwidth) × 往返时延 (RTT) ｜ 若 TCP 窗口 &lt; BDP，管道无法填满导致千兆宽带跑不满 ｜ 必须开启 Window Scale</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 管道截面积：物理带宽容量 (Bandwidth: 10,000 Mbps)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">万兆光纤每秒可发射 1.25 GB 数据 ──► 决定了单位时间内推入光纤的比特流密度</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">水管的横截面积越大，单位时间通水能力越强！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 管道物理长度：光纤传播时延 (RTT: 40ms 跨省传输)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">光信号在光纤中传播速度约 200,000 km/s ──► 往返 40ms 意味着光缆长度约 4,000 公里</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">光速物理不可逾越，时延决定了确认信号回传的周期！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 飞行数据量总容量 (BDP = 10Gbps × 40ms = 50 MegaBytes)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">在第一个 ACK 回来前，光缆管道中必须同时容纳 50MB 正在高速飞行的光脉冲包！</text>
        <text x="15" y="62" font-size="8" fill="#047857">若发送端 TCP 缓冲区只有 1MB，发完 1MB 就会停下来傻等，测速暴跌 98%！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 破解之道：TCP Window Scale (RFC 7323: 窗口扩大因子)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">突破 65535 字节上限 ──► 开启 wscale=14 允许 1GB 超大滑动窗口 ──► 瞬间填满 50MB 物理管道！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">彻底解开万兆网络测速的第一性物理枷锁！</text>
      </g>
    </g>
  </g>
</svg>