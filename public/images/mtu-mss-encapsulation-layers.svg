<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">网络协议栈多层封装开销解剖：为什么 1000M 宽带测速最多 940Mbps？</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Ethernet (14B) + VLAN (4B) + PPPoE (8B) + IPv4 (20B) + TCP (32B TS) + TLS (29B) + HTTP (9B) ──► 协议开销侵蚀 5.8% 物理带宽</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 数据链路与运营商接入层 (Ethernet / VLAN / PPPoE Overhead)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">以太网前导码与帧间隙 (20B) + 帧头/尾 (18B) + PPPoE (8B) ──► MTU 压缩至 1492 字节</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">家用宽带最普遍的二层协议开销损耗！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 传输层 TCP 头部与时间戳选项 (TCP Options Overhead)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">IPv4 (20B) + TCP 基本头 (20B) + TCP Timestamps (12B) ──► MSS 缩水至 1440 字节</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">每一个 1500 字节数据包必须固定携带 52 字节 IP/TCP 报头！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">3. 应用安全加密层 (TLS 1.3 Record &amp; Auth Tag)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">TLS Record Header (5B) + AEAD 认证标签 (16B) + 填充 (8B) ──► 有效载荷进一步被压缩</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">HTTPS 测速相比纯 HTTP 额外消耗约 2% 的协议头！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 最终纯应用有效载荷率 (Goodput = 94.12% of Line Rate)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">1000 Mbps 物理线速 × 94.12% = 941.2 Mbps 应用层最高测速值！</text>
        <text x="15" y="62" font-size="8" fill="#047857">这是物理与数学定理决定的绝对极限，并非宽带缩水！</text>
      </g>
    </g>
  </g>
</svg>