<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="comp-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr-muted-c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-blue-c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#comp-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="34" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">DATA ENTROPY &amp; COMPRESSION DEFENSE</text>
  <text x="40" y="54" fill="#0f172a" font-size="16" font-weight="700">运营商硬件透明压缩欺骗 vs 静态高随机内存池对比</text>

  <!-- ================= TOP: CONVENTIONAL CASE (LOW ENTROPY) ================= -->
  <g transform="translate(40, 75)">
    <rect width="880" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="16" y="14" width="170" height="20" rx="4" fill="#64748b"/>
    <text x="101" y="28" fill="#ffffff" font-size="10" font-weight="700" class="mono" text-anchor="middle">低随机数据 (全 0 或普通文本)</text>

    <!-- Node 1 [x: 16 ~ 266] -->
    <g transform="translate(16, 45)">
      <rect width="250" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="24" fill="#0f172a" font-size="11" font-weight="700">服务端下发 100MB 全 0 数据</text>
      <text x="14" y="44" fill="#64748b" font-size="10" class="mono">数据熵极低，重复模式明显</text>
    </g>

    <!-- Arrow 1 -> 2 [x: 266 -> 315] -->
    <path d="M 266,78 H 315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-muted-c)"/>

    <!-- Node 2 [x: 315 ~ 565] -->
    <g transform="translate(315, 45)">
      <rect width="250" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="24" fill="#0f172a" font-size="11" font-weight="700">中继设备硬件透明压缩 99%</text>
      <text x="14" y="44" fill="#64748b" font-size="10" class="mono">物理光纤上实际仅流过 1MB 流量！</text>
    </g>

    <!-- Arrow 2 -> 3 [x: 565 -> 614] -->
    <path d="M 565,78 H 614" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-muted-c)"/>

    <!-- Node 3 [x: 614 ~ 864] -->
    <g transform="translate(614, 45)">
      <rect width="250" height="65" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="14" y="24" fill="#0f172a" font-size="11" font-weight="700">客户端解压还原 100MB</text>
      <text x="14" y="44" fill="#475569" font-size="10" font-weight="700" class="mono">计算速率虚标 100 倍 (假网速)</text>
    </g>
  </g>


  <!-- ================= BOTTOM: PRODUCTION SOLUTION (HIGH ENTROPY POOL) ================= -->
  <g transform="translate(40, 220)">
    <rect width="880" height="125" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="16" y="14" width="210" height="20" rx="4" fill="#2563eb"/>
    <text x="121" y="28" fill="#ffffff" font-size="10" font-weight="700" class="mono" text-anchor="middle">静态 64MB 高随机不可压缩池</text>

    <!-- Node 1 [x: 16 ~ 266] -->
    <g transform="translate(16, 45)">
      <rect width="250" height="65" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="14" y="24" fill="#1e40af" font-size="11" font-weight="700">启动预生成 64MB 随机池</text>
      <text x="14" y="44" fill="#2563eb" font-size="10" class="mono">crypto/rand 填充 · 0 运行时算力</text>
    </g>

    <!-- Arrow 1 -> 2 [x: 266 -> 315] -->
    <path d="M 266,78 H 315" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-c)"/>

    <!-- Node 2 [x: 315 ~ 565] -->
    <g transform="translate(315, 45)">
      <rect width="250" height="65" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="14" y="24" fill="#1e40af" font-size="11" font-weight="700">任何硬件压缩算法失效 (0.0%)</text>
      <text x="14" y="44" fill="#2563eb" font-size="10" class="mono">物理光纤上 100% 真实流过 100MB！</text>
    </g>

    <!-- Arrow 2 -> 3 [x: 565 -> 614] -->
    <path d="M 565,78 H 614" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-c)"/>

    <!-- Node 3 [x: 614 ~ 864] -->
    <g transform="translate(614, 45)">
      <rect width="250" height="65" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="14" y="24" fill="#1e40af" font-size="11" font-weight="700">客户端真实接收核验</text>
      <text x="14" y="44" fill="#1d4ed8" font-size="10" font-weight="700" class="mono">100% 真实测量物理链路带宽</text>
    </g>
  </g>
</svg>
