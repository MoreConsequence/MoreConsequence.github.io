<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">强制同步布局 (Layout Thrashing) 震荡与批量读写治理</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">循环交替读写 DOM 强制浏览器重复重排 (单帧 120ms 巨卡) vs 读写分离批处理 (单帧 0.8ms 极速稳定 60FPS)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 循环交错读写：强制同步布局死锁</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">for (let i = 0; i &lt; 1000; i++) {</text>
          <text y="28" fill="#fca5a5">  // 1. 读取几何属性: 强制浏览器立即执行 Layout</text>
          <text y="42" fill="#ef4444">  const w = box.offsetWidth;</text>
          <text y="56" fill="#fca5a5">  // 2. 写入样式: 将布局树标记为脏 (Dirty)</text>
          <text y="70" fill="#ef4444">  box.style.width = (w + 1) + 'px';</text>
          <text y="84" fill="#f87171">}</text>
          
          <text y="108" fill="#ef4444">🔴 恶果：一帧内触发 1000 次强制重排！耗时 &gt; 120ms！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 页面滚动与拖拽发生极其严重的卡死掉帧；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• INP (Interaction to Next Paint) 指标严重恶化；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须规范 DOM 批处理契约！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 读写分离批处理 (FastDOM Pattern)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 阶段 1: 批量集中只读 (Batch Read - 仅 1 次 Layout)</text>
          <text y="28" fill="#86efac">const widths = boxes.map(b =&gt; b.offsetWidth);</text>
          
          <text y="50" fill="#38bdf8">// 阶段 2: 批量集中写入 (Batch Write)</text>
          <text y="64" fill="#34d399">requestAnimationFrame(() =&gt; {</text>
          <text y="78" fill="#86efac">  boxes.forEach((b, i) =&gt; b.style.width = (widths[i] + 1) + 'px');</text>
          <text y="92" fill="#34d399">});</text>
          
          <text y="116" fill="#4ade80">✓ 单帧总耗时降至 0.6ms！帧率稳定在 120 FPS！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 浏览器仅需执行单次合并布局计算；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 极致提升复杂数据可视化与富交互体验；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造媲美原生 App 的极致流畅度！</text>
      </g>
    </g>
  </g>
</svg>