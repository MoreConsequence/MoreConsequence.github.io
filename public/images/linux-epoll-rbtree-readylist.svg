<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Linux epoll 内核架构：红黑树注册、中断回调与就绪双向链表</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">epitem 红黑树 O(log N) 管理海量连接 ──► 网卡软中断驱动 ep_poll_callback ──► 就绪双向链表 (rdllist) O(1) 拷贝</text>
  </g>

  <!-- Main Comparison Panes (435px each) -->
  <g transform="translate(30, 70)">
    <!-- Left Pane: Red-Black Tree (435px) -->
    <g filter="url(#card-shadow)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">🌲 内核红黑树（struct eventpoll.rbr）</text>

      <!-- RB Tree Visual Nodes -->
      <g transform="translate(20, 50)" font-family="ui-sans-serif, system-ui, sans-serif">
        <!-- Root Node (Black) -->
        <g transform="translate(145, 0)">
          <circle cx="45" cy="20" r="20" fill="#1e293b"/>
          <text x="45" y="23" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">fd=20 (B)</text>
          <text x="45" y="48" font-family="ui-monospace, monospace" font-size="7.5" fill="#64748b" text-anchor="middle">epitem #20</text>
        </g>

        <!-- Left Branch -->
        <path d="M 170 35 L 90 65" stroke="#64748b" stroke-width="1.5"/>
        <path d="M 210 35 L 290 65" stroke="#64748b" stroke-width="1.5"/>

        <!-- Left Child (Red) -->
        <g transform="translate(60, 65)">
          <circle cx="30" cy="20" r="18" fill="#dc2626"/>
          <text x="30" y="23" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">fd=12 (R)</text>
        </g>

        <!-- Right Child (Black) -->
        <g transform="translate(260, 65)">
          <circle cx="30" cy="20" r="18" fill="#1e293b"/>
          <text x="30" y="23" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">fd=35 (B)</text>
        </g>

        <!-- Sub Leaves -->
        <path d="M 75 98 L 45 125" stroke="#64748b" stroke-width="1.2"/>
        <path d="M 105 98 L 135 125" stroke="#64748b" stroke-width="1.2"/>
        <path d="M 275 98 L 245 125" stroke="#64748b" stroke-width="1.2"/>
        <path d="M 305 98 L 335 125" stroke="#64748b" stroke-width="1.2"/>

        <g transform="translate(25, 125)">
          <circle cx="20" cy="15" r="14" fill="#1e293b"/>
          <text x="20" y="18" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">fd=5</text>
        </g>
        <g transform="translate(115, 125)">
          <circle cx="20" cy="15" r="14" fill="#1e293b"/>
          <text x="20" y="18" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">fd=18</text>
        </g>
        <g transform="translate(225, 125)">
          <circle cx="20" cy="15" r="14" fill="#dc2626"/>
          <text x="20" y="18" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">fd=28</text>
        </g>
        <g transform="translate(315, 125)">
          <circle cx="20" cy="15" r="14" fill="#dc2626"/>
          <text x="20" y="18" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">fd=80</text>
        </g>

        <!-- Explanation Card -->
        <g transform="translate(0, 165)">
          <rect width="395" height="150" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="10" y="18" font-size="10" font-weight="700" fill="#1e40af">红黑树核心职责与收益：</text>
          <text x="10" y="34" font-size="8.5" fill="#2563eb">• <tspan font-weight="700">epoll_ctl(EPOLL_CTL_ADD)</tspan> 将 fd 封装为 epitem 插入红黑树</text>
          <text x="10" y="48" font-size="8.5" fill="#2563eb">• 树常驻内核空间：彻底消灭 select/poll 每次重复拷贝百万 fd 开销</text>
          <text x="10" y="62" font-size="8.5" fill="#2563eb">• O(log N) 快速增删查改，支持单机轻松维护 1,000,000+ 连接</text>
          <text x="10" y="78" font-size="8.5" font-weight="700" fill="#1e40af">• 为每个 socket 的等待队列注册唤醒回调 ep_poll_callback</text>
        </g>
      </g>
    </g>

    <!-- Right Pane: Ready Doubly Linked List (435px) -->
    <g transform="translate(465, 0)" filter="url(#card-shadow)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">⚡ 就绪双向链表（struct eventpoll.rdllist）</text>

      <!-- Ready List Visual Conveyor -->
      <g transform="translate(20, 50)" font-family="ui-sans-serif, system-ui, sans-serif">
        <!-- Interrupt Trigger Box -->
        <rect width="395" height="42" rx="4" fill="#fff7ed" stroke="#fdba74"/>
        <text x="10" y="16" font-size="9" font-weight="700" fill="#9a3412">物理网卡数据到达 ──► 触发 SoftIRQ 软中断</text>
        <text x="10" y="30" font-size="8" fill="#ea580c">协议栈回调 ep_poll_callback，将对应 epitem 挂载入就绪链表</text>

        <!-- Ready Doubly Linked Chain -->
        <g transform="translate(0, 55)">
          <rect width="115" height="46" rx="4" fill="#10b981"/>
          <text x="57" y="18" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">epitem (fd=12)</text>
          <text x="57" y="32" font-size="8" fill="#d1fae5" text-anchor="middle">EPOLLIN (可读就绪)</text>

          <line x1="115" y1="23" x2="135" y2="23" stroke="#10b981" stroke-width="2"/>
          <line x1="135" y1="23" x2="115" y2="23" stroke="#10b981" stroke-width="2"/>

          <g transform="translate(135, 0)">
            <rect width="125" height="46" rx="4" fill="#10b981"/>
            <text x="62" y="18" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">epitem (fd=28)</text>
            <text x="62" y="32" font-size="8" fill="#d1fae5" text-anchor="middle">EPOLLOUT (可写就绪)</text>
          </g>

          <line x1="260" y1="23" x2="280" y2="23" stroke="#10b981" stroke-width="2"/>

          <g transform="translate(280, 0)">
            <rect width="115" height="46" rx="4" fill="#10b981"/>
            <text x="57" y="18" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">epitem (fd=80)</text>
            <text x="57" y="32" font-size="8" fill="#d1fae5" text-anchor="middle">EPOLLIN (新握手)</text>
          </g>
        </g>

        <!-- epoll_wait Action -->
        <g transform="translate(0, 115)">
          <rect width="395" height="40" rx="4" fill="#f0fdf4" stroke="#86efac"/>
          <text x="10" y="16" font-size="9.5" font-weight="700" fill="#166534">epoll_wait(epfd, events, maxevents, timeout):</text>
          <text x="10" y="30" font-size="8.5" fill="#15803d">仅线性移走就绪链表中的就绪项，复杂度恒为 <tspan font-weight="700">O(就绪事件数)</tspan>！</text>
        </g>

        <!-- Evaluation Cards -->
        <g transform="translate(0, 165)">
          <rect width="395" height="150" rx="4" fill="#d1fae5" stroke="#86efac"/>
          <text x="10" y="18" font-size="10" font-weight="700" fill="#065f46">攻克 C10K / C10M 历史分界线：</text>
          <text x="10" y="34" font-size="8.5" fill="#047857">• 100 万并发连接中哪怕只有 3 个活跃，epoll_wait 瞬间返回 3 个事件</text>
          <text x="10" y="48" font-size="8.5" fill="#047857">• 0 盲目全量轮询，CPU 使用率始终与真实活跃请求量严格成正比</text>
          <text x="10" y="62" font-size="8.5" fill="#047857">• 水平触发 (LT) 自动保留未读，边缘触发 (ET) 状态突变通知一次</text>
          <text x="10" y="78" font-size="8.5" font-weight="700" fill="#166534">• 彻底奠定现代 Nginx / Netty / Redis / Go 网络调度底座</text>
        </g>
      </g>
    </g>
  </g>
</svg>
