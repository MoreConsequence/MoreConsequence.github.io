<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Kubernetes 优雅下线为什么难：网络控制面与 Pod 销毁的异步竞态时序</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Pod 收到 SIGTERM 立即关闭端口 ──► 控制面异步更新 iptables/Ingress 延迟 3s ──► 502 Bad Gateway 爆发 ──► preStop sleep 解决竞态</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. kubectl delete pod 触发双通道异步并发执行 (Asynchronous Split)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">通道 A: EndpointController 剔除 IP ──► 更新 kube-proxy / Ingress (耗时 2~4 秒)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">通道 B: Kubelet 向容器发送 SIGTERM 信号 (耗时 10 毫秒！)</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">2. 致命时间差：若无 preStop Hook，容器立即关机导致 502/Connection Refused</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">在 Ingress 规则刷新的 2 秒空窗期内，新请求依然不断路由给已死掉的 Pod，产生海量 502 报错！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">这就是为什么代码明明写了优雅退出，每次发布上线依然会偶发报警的物理本质！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 黄金工程实践：注入 preStop Hook 强制睡眠等待网络收敛</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 15"] } } }</text>
        <text x="15" y="62" font-size="8" fill="#047857">让容器继续存活并处理已有在途连接 15 秒，等待全局 Ingress/iptables 100% 摘除流量！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 接收 SIGTERM 信号 ──► 拒绝新连接 ──► 排空已有在途请求 ──► 优雅退出</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">server.Shutdown(ctx) ──► 等待数据库事务与消息确认落盘 ──► 进程正常退出 (Exit 0)</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">全流程无任何连接被粗暴 RST，真正实现电信级 0 丢失、0 报错平滑发布！</text>
      </g>
    </g>
  </g>
</svg>