<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="distributed-transaction-patterns-2pc-tcc-saga-matrix-title distributed-transaction-patterns-2pc-tcc-saga-matrix-desc"><title id="distributed-transaction-patterns-2pc-tcc-saga-matrix-title">分布式事务四大家族全景对比：2PC (刚性强一致) vs TCC (应用层预留) vs Saga (长事务补偿) vs…</title><desc id="distributed-transaction-patterns-2pc-tcc-saga-matrix-desc">分布式事务四大家族全景对比：2PC (刚性强一致) vs TCC (应用层预留) vs Saga (长事务补偿) vs Outbox (异步最终一致)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分布式事务四大模式决策矩阵 (Distributed Transaction Patterns)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">2PC（XA 阻塞，吞吐最低）｜ TCC（快但侵入大）｜ Saga（正反补偿）｜ Outbox（本地事务+CDC）</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 2PC / XA (刚性锁)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">强一致 ACID 模型：</text>

          <text x="8" y="38" fill="#f5f5f5">• 数据库底层锁住行记录</text>
          <text x="8" y="54" fill="#f5f5f5">• 协调者单点阻塞缺陷</text>
          <text x="8" y="70" fill="#f5f5f5">• 吞吐量极低 (&lt; 500 TPS)</text>

          <text x="8" y="100" fill="#f5f5f5">🔴 微服务高并发严禁使用</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 单体多数据源、极低频跨库操作；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 银行总账结算；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 传统企业级软件。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. TCC (应用层预留)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">Try-Confirm-Cancel:</text>

          <text x="8" y="38" fill="#f5f5f5">• Try: 预冻结金额/库存</text>
          <text x="8" y="54" fill="#f5f5f5">• Confirm: 真正扣减生效</text>
          <text x="8" y="70" fill="#f5f5f5">• Cancel: 解冻释放资源</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 吞吐极高，0 跨服务长锁！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 核心支付对账、高频资金扣划；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 研发需写 3 倍业务逻辑代码；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 金融级硬核方案。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. Saga (工作流补偿)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">状态机长事务：</text>

          <text x="8" y="38" fill="#f5f5f5">• 正向执行: T1 -&gt; T2 -&gt; T3</text>
          <text x="8" y="54" fill="#f5f5f5">• 若 T3 失败 ──► 逆向自动执行:</text>
          <text x="8" y="70" fill="#f5f5f5">  C2(补偿 T2) -&gt; C1(补偿 T1)</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 适合跨数个服务的超长业务流程！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 机票/酒店预订、复杂审批工作流；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 业务允许短时间内的中间不一致；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级编排框架标准。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">4. Outbox (本地外箱)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">本地事务 + CDC:</text>

          <text x="8" y="38" fill="#f5f5f5">• 业务与事件在单库原子提交</text>
          <text x="8" y="54" fill="#f5f5f5">• Debezium 监听 Binlog 投递 MQ</text>
          <text x="8" y="70" fill="#f5f5f5">• 0 代码侵入，极高吞吐与最终一致！</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 90% 互联网异步解耦的最佳通用解！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 研发心智负担最低；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 彻底消灭双写丢失漏洞；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代化微服务首选架构！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
