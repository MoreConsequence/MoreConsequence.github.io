<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">分布式事务四大模式决策矩阵 (Distributed Transaction Patterns)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">2PC (底层 XA 锁阻塞，吞吐最低) ｜ TCC (业务 Try-Confirm-Cancel，性能极高但侵入大) ｜ Saga (长事务状态机正反向补偿) ｜ Transactional Outbox (本地事务 + CDC 异步解耦)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fef2f2"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">1. 2PC / XA (刚性锁)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#f87171">强一致 ACID 模型：</text>
          
          <text x="8" y="38" fill="#fca5a5">• 数据库底层锁住行记录</text>
          <text x="8" y="54" fill="#ef4444">• 协调者单点阻塞缺陷</text>
          <text x="8" y="70" fill="#f87171">• 吞吐量极低 (&lt; 500 TPS)</text>
          
          <text x="8" y="100" fill="#ef4444">🔴 微服务高并发严禁使用</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 单体多数据源、极低频跨库操作；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 银行总账结算；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 传统企业级软件。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. TCC (应用层预留)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">Try-Confirm-Cancel:</text>
          
          <text x="8" y="38" fill="#86efac">• Try: 预冻结金额/库存</text>
          <text x="8" y="54" fill="#38bdf8">• Confirm: 真正扣减生效</text>
          <text x="8" y="70" fill="#34d399">• Cancel: 解冻释放资源</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 吞吐极高，0 跨服务长锁！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 核心支付对账、高频资金扣划；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 研发需写 3 倍业务逻辑代码；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 金融级硬核方案。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Saga (工作流补偿)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">状态机长事务：</text>
          
          <text x="8" y="38" fill="#fed7aa">• 正向执行: T1 -&gt; T2 -&gt; T3</text>
          <text x="8" y="54" fill="#f87171">• 若 T3 失败 ──► 逆向自动执行:</text>
          <text x="8" y="70" fill="#fb923c">  C2(补偿 T2) -&gt; C1(补偿 T1)</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 适合跨数个服务的超长业务流程！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">适用场景：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 机票/酒店预订、复杂审批工作流；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 业务允许短时间内的中间不一致；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级编排框架标准。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">4. Outbox (本地外箱)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">本地事务 + CDC:</text>
          
          <text x="8" y="38" fill="#86efac">• 业务与事件在单库原子提交</text>
          <text x="8" y="54" fill="#38bdf8">• Debezium 监听 Binlog 投递 MQ</text>
          <text x="8" y="70" fill="#4ade80">• 0 代码侵入，极高吞吐与最终一致！</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 90% 互联网异步解耦的最佳通用解！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 研发心智负担最低；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底消灭双写丢失漏洞；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化微服务首选架构！</text>
      </g>
    </g>
  </g>
</svg>