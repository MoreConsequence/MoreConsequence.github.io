<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="lat-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#cbd5e1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#lat-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="34" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">THREE-DIMENSIONAL LATENCY METRIC SYSTEM</text>
  <text x="40" y="54" fill="#0f172a" font-size="16" font-weight="700">时延、抖动与满载缓冲膨胀（Bufferbloat）三维立体度量体系</text>

  <!-- ================= CARD 1: IDLE LATENCY ================= -->
  <g transform="translate(40, 80)">
    <rect width="275" height="240" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="275" height="5" rx="2" fill="#2563eb"/>
    <rect x="14" y="16" width="100" height="18" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="64" y="29" fill="#1e40af" font-size="9" font-weight="700" class="mono" text-anchor="middle">DIMENSION 1</text>

    <text x="14" y="58" fill="#0f172a" font-size="14" font-weight="700">1. 空闲时延 (Idle Latency)</text>
    <text x="14" y="78" fill="#64748b" font-size="10" class="mono">网络静息状态基准 (Ping)</text>
    <line x1="14" y1="92" x2="261" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <text x="14" y="116" fill="#334155" font-size="11">• 采样策略：连续 20 次轻量探针</text>
    <text x="14" y="138" fill="#334155" font-size="11">• 滤波算法：中位数滤波 (Median Filter)</text>
    <text x="14" y="160" fill="#334155" font-size="11">• 核心收益：剔除偶发无线噪点</text>
    <text x="14" y="182" fill="#334155" font-size="11">• 度量目标：物理端到端纯光缆 RTT</text>

    <rect x="14" y="198" width="247" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="137" y="216" fill="#1e40af" font-size="11" font-weight="700" class="mono" text-anchor="middle">基准指标：例如 12 ms</text>
  </g>

  <!-- ================= CARD 2: JITTER ================= -->
  <g transform="translate(342, 80)">
    <rect width="275" height="240" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="275" height="5" rx="2" fill="#0284c7"/>
    <rect x="14" y="16" width="100" height="18" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
    <text x="64" y="29" fill="#0369a1" font-size="9" font-weight="700" class="mono" text-anchor="middle">DIMENSION 2</text>

    <text x="14" y="58" fill="#0f172a" font-size="14" font-weight="700">2. 网络抖动 (Jitter)</text>
    <text x="14" y="78" fill="#64748b" font-size="10" class="mono">IETF RFC 3550 标准算法</text>
    <line x1="14" y1="92" x2="261" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <text x="14" y="116" fill="#334155" font-size="11">• 递推公式：Ji = Ji-1 + (|ΔRTT| - Ji-1)/16</text>
    <text x="14" y="138" fill="#334155" font-size="11">• 平滑系数：历史权重占 93.75%</text>
    <text x="14" y="160" fill="#334155" font-size="11">• 核心收益：平抑单次时钟毛刺</text>
    <text x="14" y="182" fill="#334155" font-size="11">• 度量目标：衡量连接波动稳定性</text>

    <rect x="14" y="198" width="247" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="137" y="216" fill="#0369a1" font-size="11" font-weight="700" class="mono" text-anchor="middle">稳定性指标：例如 1.2 ms</text>
  </g>

  <!-- ================= CARD 3: BUFFERBLOAT ================= -->
  <g transform="translate(645, 80)">
    <rect width="275" height="240" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="0" y="0" width="275" height="5" rx="2" fill="#ea580c"/>
    <rect x="14" y="16" width="100" height="18" rx="3" fill="#ea580c"/>
    <text x="64" y="29" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">KEY METRIC</text>

    <text x="14" y="58" fill="#9a3412" font-size="14" font-weight="700">3. 缓冲膨胀 (Bufferbloat)</text>
    <text x="14" y="78" fill="#ea580c" font-size="10" class="mono">满载灌流下的排队恶化</text>
    <line x1="14" y1="92" x2="261" y2="92" stroke="#fed7aa" stroke-width="1"/>

    <text x="14" y="116" fill="#334155" font-size="11">• 测量时机：上下行 100% 满载期间</text>
    <text x="14" y="138" fill="#334155" font-size="11">• 判定准则：满载时延 - 空闲时延</text>
    <text x="14" y="160" fill="#334155" font-size="11">• 风险判定：ΔRTT ≥ 100ms 告警</text>
    <text x="14" y="182" fill="#334155" font-size="11">• 物理根因：路由器缺乏 FQ-CoDel</text>

    <rect x="14" y="198" width="247" height="28" rx="4" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
    <text x="137" y="216" fill="#c2410c" font-size="11" font-weight="700" class="mono" text-anchor="middle">体验指标：大流量时游戏/语音卡顿</text>
  </g>
</svg>
