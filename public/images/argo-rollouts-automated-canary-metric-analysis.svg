<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Argo Rollouts 自动化指标分析与无人值守发布闭环</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 灰度切流 5% ──► 2. AnalysisTemplate 查询 Prometheus 错误率与 P99 ──► 3. 连续 3 次成功自动进阶放量 ──► 4. 超标瞬间自动 abort 回滚</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 步骤 1: 流量微量切分 (Step: setWeight: 5%, pause: 10m)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">通过 Envoy / Nginx 权重路由将 5% 的真实流量导入 Canary Pods ──► 维持 10 分钟收集指标</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">用最小范围真实流量检验新版本业务逻辑！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 步骤 2: 自动化 PromQL 质量审查 (AnalysisRun Query)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">执行 PromQL: sum(rate(http_requests_total{status=~"5.*"}[2m])) / sum(rate(http_requests_total[2m])) &lt; 0.01</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">用绝对客观的数学指标替代人工看大盘猜测！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 步骤 3: 阶梯推进放大 (Step: setWeight: 20% -&gt; 50% -&gt; 80%)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">每阶梯分析指标全部成功通过 ──► 自动扩容新 Pod 并调整路由权重 ──► 逐步承受大流量冲击</text>
        <text x="15" y="62" font-size="8" fill="#047857">平稳释放压力，验证数据库与下游承受力！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 步骤 4: 100% 全量晋升与老 Pod 优雅回收 (Promote &amp; Scale Down)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">新版本升级为 Stable 主干 ──► 老版本优雅等待 30 秒连接排空后缩容 ──► 无人值守发布圆满成功！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代 DevOps / GitOps 持续交付的终极形态！</text>
      </g>
    </g>
  </g>
</svg>