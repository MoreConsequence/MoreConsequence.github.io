<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="argo-rollouts-automated-canary-metric-analysis-title argo-rollouts-automated-canary-metric-analysis-desc"><title id="argo-rollouts-automated-canary-metric-analysis-title">Argo Rollouts 自动化金丝雀分析流水线：Prometheus 实时指标分析与自动回滚</title><desc id="argo-rollouts-automated-canary-metric-analysis-desc">Argo Rollouts 自动化金丝雀分析流水线：Prometheus 实时指标分析与自动回滚</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Argo Rollouts 自动化指标分析与无人值守发布闭环</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 灰度切流 5% ──► 2. AnalysisTemplate 查询 Prometheus 错误率与 P99 ──► 3. 连续 3 次成功自动进阶放量 ──► 4. 超标瞬间自动 abort 回滚</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 步骤 1: 流量微量切分 (Step: setWeight: 5%, pause: 10m)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">通过 Envoy / Nginx 权重路由将 5% 的真实流量导入 Canary Pods ──► 维持 10 分钟收集指标</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">用最小范围真实流量检验新版本业务逻辑！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 步骤 2: 自动化 PromQL 质量审查 (AnalysisRun Query)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">执行 PromQL: sum(rate(http_requests_total{status=~"5.*"}[2m])) / sum(rate(http_requests_total[2m])) &lt; 0.01</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">用绝对客观的数学指标替代人工看大盘猜测！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 步骤 3: 阶梯推进放大 (Step: setWeight: 20% -&gt; 50% -&gt; 80%)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">每阶梯分析指标全部成功通过 ──► 自动扩容新 Pod 并调整路由权重 ──► 逐步承受大流量冲击</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">平稳释放压力，验证数据库与下游承受力！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 步骤 4: 100% 全量晋升与老 Pod 优雅回收 (Promote &amp; Scale Down)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">新版本升级为 Stable 主干 ──► 老版本优雅等待 30 秒连接排空后缩容 ──► 无人值守发布圆满成功！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">现代 DevOps / GitOps 持续交付的终极形态！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
