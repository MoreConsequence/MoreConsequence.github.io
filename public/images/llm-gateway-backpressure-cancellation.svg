<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="llm-gateway-backpressure-cancellation-title llm-gateway-backpressure-cancellation-desc"><title id="llm-gateway-backpressure-cancellation-title">幽灵推理与全链路级联取消 (AbortSignal) 架构模型</title><desc id="llm-gateway-backpressure-cancellation-desc">架构机制图展示客户端断开连接后，流式网关通过 AbortSignal 与 gRPC CancelContext 将取消信号毫秒级透传至 GPU 调度器并即时释放物理 KV 显存块的防幽灵推理体系。</desc>
