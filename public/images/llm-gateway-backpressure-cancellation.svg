  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">GHOST INFERENCE &amp; CASCADE CANCELLATION · ZERO WASTED COMPUTE</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">幽灵推理防御与全链路级联取消机制</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">客户端断开 (关闭标签页/Stop按钮) ➔ 网关检测 Socket close ➔ AbortSignal 透传 ➔ GPU 毫秒级释放 KV 显存</text>

  
  
