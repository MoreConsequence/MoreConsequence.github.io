    <text x="134" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">幽灵推理危机</text>

    
    <rect x="14" y="42" width="242" height="110" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="24" y="64" fill="#2d3142" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">客户端已走，GPU 还在空转</text>
