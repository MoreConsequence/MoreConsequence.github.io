    <rect x="14" y="12" width="130" height="18" rx="2" fill="#eb6c36" />
    <text x="79" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">CASCADE ABORT</text>
    <text x="154" y="26" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">网关层 AbortSignal 透传</text>

    
    <rect x="14" y="42" width="262" height="110" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="24" y="64" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">req.on("close") ➔ AbortSignal</text>
    <text x="24" y="82" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1. 严密监听客户端 Socket 关闭事件</text>
