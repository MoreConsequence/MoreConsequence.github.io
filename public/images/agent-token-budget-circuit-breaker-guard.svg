<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 经济学防线：死循环检测与 Token 预算硬熔断 (Token Circuit Breaker)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Agent 陷入反复读文件死循环 (1 小时烧掉 $500 账单) vs 三级防线 (单轮步数上限 25 步 + 单任务 $5 预算硬熔断 + 重复 Tool 调用模式识别)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Infinite Burn -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 0 预算保护：死循环燃烧天价账单</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">代码出现幻觉死循环：</text>
          <text y="28" fill="#ef4444">1. run_command("cat file.txt") ──► 报错 NotFound</text>
          <text y="42" fill="#ef4444">2. 模型以为是语法问题 ──► 再次发起 run_command</text>
          <text y="56" fill="#fca5a5">3. 连续无休止执行了 5,000 轮循环！</text>
          <text y="70" fill="#ef4444">4. 消耗 1 亿 Tokens ──► 产生 $1,500 巨额账单！</text>
          
          <text y="94" fill="#ef4444">💥 用户信用卡直接被刷爆！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 缺乏基础工程防御能力的业余 Agent；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 带来不可预测的商业与财务灾难；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 必须构建硬性熔断护栏！</text>
      </g>
    </g>

    <!-- Right: Circuit Breaker Defense -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 三级硬熔断护栏：绝对安全可控</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">多重经济守卫规则：</text>
          
          <text y="36" fill="#86efac">1. MaxSteps = 30 (单任务执行最多 30 步)</text>
          <text y="50" fill="#38bdf8">2. MaxCostBudget = $2.0 (单任务费用硬上限)</text>
          <text y="64" fill="#34d399">3. Loop Detector: 连续 3 次相同 Tool+参数 ──► 强行中断</text>
          <text y="78" fill="#4ade80">4. 触发阈值立即安全暂停并主动询问用户反馈！</text>
          
          <text y="104" fill="#4ade80">✓ 成本 100% 确定性受控，安全高枕无忧！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 商业级 Agent 平台对用户最核心的安全承诺；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 避免意外财务损失与资源浪费；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级可靠性标准！</text>
      </g>
    </g>
  </g>
</svg>