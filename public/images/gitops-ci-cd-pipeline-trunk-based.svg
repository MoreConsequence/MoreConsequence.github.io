<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">现代 GitOps 声明式持续集成与持续交付 (CI/CD) 全景流水线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. Trunk-Based 提交 ──► 2. GitHub Actions 自动化质量门禁 ──► 3. Cosign 容器镜像签名 ──► 4. ArgoCD 声明式驱动 K8s 零接触部署</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 主干开发与短分支合并 (Trunk-Based Development: Small PRs)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">每天多次向 Main 分支提交轻量级小 PR (&lt; 200 行代码) ──► 彻底杜绝长期功能分支导致的合并地狱</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">保持代码库永远处于可随时发布状态！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 自动化质量闸门严密拦截 (CI Quality Gates &amp; Security Scan)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">并发执行: Lint 校验 ──► 单元与快照测试 (Coverage &gt; 80%) ──► Trivy 依赖漏洞扫描 ──► 构建严格无缓存 Docker 镜像</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将所有缺陷阻断在进入主干之前！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 软件供应链安全不可篡改 (Container Signing: Cosign / SLSA)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">生成不可变 Image Digest (sha256:...) ──► 签名并写入制品库 ──► 自动更新 Git 配置仓库声明 (Config Repo)</text>
        <text x="15" y="62" font-size="8" fill="#047857">构筑端到端防篡改供应链信任链！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. ArgoCD 声明式拉取同步 (GitOps Continuous Delivery: 0-Touch)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">K8s 集群内部 ArgoCD 实时比对 Git 期望状态 ──► 自动拉取并执行金丝雀渐进放量 ──► 达成 100% 零人工接触生产！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代顶级云原生工程交付的行业典范！</text>
      </g>
    </g>
  </g>
</svg>