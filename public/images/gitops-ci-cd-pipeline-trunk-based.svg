<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="gitops-ci-cd-pipeline-trunk-based-title gitops-ci-cd-pipeline-trunk-based-desc"><title id="gitops-ci-cd-pipeline-trunk-based-title">现代化 GitOps CI/CD 全景流水线：主干开发 -&gt; 自动化测试 -&gt; 镜像签名 -&gt; 声明式同步</title><desc id="gitops-ci-cd-pipeline-trunk-based-desc">现代化 GitOps CI/CD 全景流水线：主干开发 -&gt; 自动化测试 -&gt; 镜像签名 -&gt; 声明式同步</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">现代 GitOps 声明式持续集成与持续交付 (CI/CD) 全景流水线</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. Trunk-Based 提交 ──► 2. GitHub Actions 自动化质量门禁 ──► 3. Cosign 容器镜像签名 ──► 4. ArgoCD 声明式驱动 K8s 零接触部署</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 主干开发与短分支合并 (Trunk-Based Development: Small PRs)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">每天多次向 Main 分支提交轻量级小 PR (&lt; 200 行代码) ──► 彻底杜绝长期功能分支导致的合并地狱</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">保持代码库永远处于可随时发布状态！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 自动化质量闸门严密拦截 (CI Quality Gates &amp; Security Scan)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">并发执行: Lint 校验 ──► 单元与快照测试 (Coverage &gt; 80%) ──► Trivy 依赖漏洞扫描 ──► 构建严格无缓存 Docker 镜像</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">将所有缺陷阻断在进入主干之前！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 软件供应链安全不可篡改 (Container Signing: Cosign / SLSA)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">生成不可变 Image Digest (sha256:...) ──► 签名并写入制品库 ──► 自动更新 Git 配置仓库声明 (Config Repo)</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">构筑端到端防篡改供应链信任链！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. ArgoCD 声明式拉取同步 (GitOps Continuous Delivery: 0-Touch)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">K8s 集群内部 ArgoCD 实时比对 Git 期望状态 ──► 自动拉取并执行金丝雀渐进放量 ──► 达成 100% 零人工接触生产！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">现代顶级云原生工程交付的行业典范！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
