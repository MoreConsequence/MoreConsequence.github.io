<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Tool 输出智能截断与关键信息保真模型 (Output Compaction)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">grep 输出 10,000 行直接塞入上下文 (瞬间撑爆 128k 窗口引发 OOM) vs 智能头部+尾部截断 (保留前 50 行 + 关键错误行 + 后 50 行，Token 降低 95%)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Raw Dump Disaster -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 原始输出无脑注入：瞬间撑爆上下文</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">执行命令: run_command("npm test") 产生了 5MB 日志：</text>
          
          <text y="38" fill="#ef4444">灾难后果：</text>
          <text y="52" fill="#fca5a5">• 5MB 文本折合 120 万 Tokens！</text>
          <text y="68" fill="#ef4444">• 直接触发 Context Window Overflow 报错崩溃</text>
          <text y="84" fill="#ef4444">• 即使支持 1M 窗口，单次请求瞬间消耗 $15！</text>
          
          <text y="106" fill="#f87171">🔴 导致整个 Agent 会话链路彻底瘫痪！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 未对真实系统输出进行防御性长度治理；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 产生天价 Token 账单与延迟恶化；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 必须引入智能截断！</text>
      </g>
    </g>

    <!-- Right: Head Tail Truncation -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Head-Tail 智能截断：保留核心报错证据</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">智能截断与压缩算法：</text>
          
          <text y="36" fill="#86efac">1. 保留前 50 行 (命令启动与初始参数)</text>
          <text y="50" fill="#38bdf8">2. 中间 9,900 行冗余日志压缩为: "... [9,900 lines omitted] ..."</text>
          <text y="64" fill="#34d399">3. 自动扫描并保留包含 "FAIL", "Error", "Panic" 的关键行</text>
          <text y="78" fill="#4ade80">4. 保留最后 50 行 (最终摘要与退出码)</text>
          
          <text y="104" fill="#4ade80">✓ Token 消耗从 120 万降至 3k，信息量 100% 保全！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 兼具极致的 Token 经济性与精准的排障信息密度；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 让大模型推理注意力聚焦在真正的核心报错上；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级 Agent 引擎标准核心技巧！</text>
      </g>
    </g>
  </g>
</svg>