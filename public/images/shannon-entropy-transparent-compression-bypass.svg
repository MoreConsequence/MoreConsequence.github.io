<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">香农信息熵防伪：阻断中间路由器透明压缩作弊</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">若发送 0x00 全零包 ──► 运营商透明硬件压缩为 1KB 导致测速虚标 1000Gbps ｜ 必须采用 Shannon Entropy ≈ 8.0 纯随机二进制流</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 朴素实现：发送全零或重复文本 (Low Entropy)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">byte[] zeroBuf = new byte[1048576]; // 1MB 全 0 数据</text>
          
          <text y="38" fill="#ef4444">💥 中间链路硬件透明压缩 (WAN Optimizer / Gzip):</text>
          <text y="54" fill="#ef4444">1. 路由器硬件将 1MB 全 0 压缩成 128 字节特征码！</text>
          <text y="70" fill="#ef4444">2. 物理光纤只传输了 128 字节，客户端解压还原出 1MB</text>
          <text y="86" fill="#ef4444">3. 测速结果显示: 1,280,000 Mbps (1.28 Tbps 极其荒谬！)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">作弊与失真漏洞：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 测量的不是真实物理带宽，而是硬件解压芯片算力；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 测速结果完全失去科学性；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须对 payload 施加信息熵约束！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 高熵防伪：不可压缩纯随机二进制流</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// crypto/rand 预生成最高熵随机字节</text>
          <text y="28" fill="#86efac">Shannon Entropy: H(X) = -∑ P(xi) log2 P(xi) = 7.9998 bits/byte</text>
          
          <text y="50" fill="#38bdf8">1. 逼近理论极限 8.0 bits/byte (绝对不可压缩)</text>
          <text y="66" fill="#34d399">2. 任何硬件与算法对该数据包的压缩率严格为 0%</text>
          <text y="82" fill="#34d399">3. 迫使物理光纤实打实传输每一个真实比特！</text>
          
          <text y="108" fill="#4ade80">✓ 测量结果具备绝对物理权威性与法律公信力！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 国际电信联盟 ITU-T 与 IETF 权威标准；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底封死任何中间链路硬件优化欺骗；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚不可摧的测量科学基石！</text>
      </g>
    </g>
  </g>
</svg>