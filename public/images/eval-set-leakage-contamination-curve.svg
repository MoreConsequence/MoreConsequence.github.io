<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">评测集数据污染与虚假准确率膨胀曲线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">数据重叠率 0% 到 80%：模型泛化能力未变，基准测试跑分虚高暴涨，产生严重自欺欺人</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Left Chart Area (520px) -->
    <g transform="translate(30, 30)">
      <!-- Coordinate Axis -->
      <line x1="40" y1="280" x2="480" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="40" y1="280" x2="40" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
      
      <!-- Axis Labels -->
      <text x="480" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="end">评测集污染泄漏率 (0% → 80%)</text>
      <text x="35" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">评测准确率 (Accuracy %)</text>

      <!-- Y-ticks -->
      <text x="30" y="284" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="end">40%</text>
      <text x="30" y="200" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="end">60%</text>
      <text x="30" y="120" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="end">80%</text>
      <text x="30" y="40" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="end">100%</text>

      <line x1="40" y1="200" x2="480" y2="200" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="40" y1="120" x2="480" y2="120" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="40" y1="40" x2="480" y2="40" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- True Generalization Line (Flat ~ 58%) -->
      <line x1="40" y1="210" x2="460" y2="210" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4"/>
      <circle cx="100" cy="210" r="4" fill="#10b981"/>
      <circle cx="220" cy="210" r="4" fill="#10b981"/>
      <circle cx="340" cy="210" r="4" fill="#10b981"/>
      <circle cx="460" cy="210" r="4" fill="#10b981"/>
      <text x="465" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#047857">真实泛化准确率 (平坦恒定 58%)</text>

      <!-- Contaminated Apparent Curve -->
      <path d="M 40 210 Q 200 190 300 120 T 460 45" fill="none" stroke="#ef4444" stroke-width="3"/>
      <circle cx="40" cy="210" r="4" fill="#ef4444"/>
      <circle cx="140" cy="200" r="4" fill="#ef4444"/>
      <circle cx="250" cy="165" r="4" fill="#ef4444"/>
      <circle cx="350" cy="100" r="4" fill="#ef4444"/>
      <circle cx="460" cy="45" r="5" fill="#ef4444"/>
      <text x="465" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#dc2626">虚假评测跑分 (膨胀至 98%！)</text>
    </g>

    <!-- Right Summary Cards (300px) -->
    <g transform="translate(560, 30)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="310" height="135" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#991b1b">🔴 数据污染的致命隐患</text>
      <text x="12" y="38" font-size="8" fill="#7f1d1d">• 预训练/微调语料中混入 Benchmark 题目</text>
      <text x="12" y="54" font-size="8" fill="#7f1d1d">• 模型退化为“死记硬背”，泛化能力为零</text>
      <text x="12" y="70" font-size="8" fill="#7f1d1d">• 泄漏 20% 时分数虚高 +15%，泄漏 50% 破 90%</text>
      <text x="12" y="88" font-size="8" font-weight="700" fill="#dc2626">• 生产上线后面对真实用户流量瞬间崩盘！</text>

      <g transform="translate(0, 150)">
        <rect width="310" height="145" rx="6" fill="#f0fdf4" stroke="#86efac"/>
        <text x="12" y="20" font-size="10.5" font-weight="700" fill="#166534">✓ 生产防护与治理标准</text>
        <text x="12" y="38" font-size="8" fill="#15803d">1. <tspan font-weight="700">N-gram 哈希去重</tspan>：训练前过滤与评测集 13-gram 相似文本</text>
        <text x="12" y="56" font-size="8" fill="#15803d">2. <tspan font-weight="700">动态黄金测试集</tspan>：每月定期注入全新真实业务脱敏样本</text>
        <text x="12" y="74" font-size="8" fill="#15803d">3. <tspan font-weight="700">对抗合成测试 (Canary Tokens)</tspan>：注入特定签名探针监控外泄</text>
        <text x="12" y="92" font-size="8" fill="#047857">4. <tspan font-weight="700">不可判定问题过滤</tspan>：防止虚假幻觉误判</text>
      </g>
    </g>
  </g>
</svg>