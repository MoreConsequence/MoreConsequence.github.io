<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="eval-set-leakage-contamination-curve-title eval-set-leakage-contamination-curve-desc"><title id="eval-set-leakage-contamination-curve-title">评测集数据污染与虚假准确率膨胀曲线</title><desc id="eval-set-leakage-contamination-curve-desc">评测集数据污染与虚假准确率膨胀曲线</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">评测集数据污染与虚假准确率膨胀曲线</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">数据重叠率 0% 到 80%：模型泛化能力未变，基准测试跑分虚高暴涨，产生严重自欺欺人</text>
  </g>

  <g transform="translate(30, 70)">
    <rect width="900" height="344" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />

    
    <g transform="translate(30, 30)">
      
      <line x1="40" y1="280" x2="480" y2="280" stroke="#7a8399" stroke-width="1.8" />
      <line x1="40" y1="280" x2="40" y2="30" stroke="#7a8399" stroke-width="1.8" />

      
      <text x="480" y="295" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="10" fill="#4f5d75" text-anchor="end">评测集污染泄漏率 (0% → 80%)</text>
      <text x="35" y="20" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="10" fill="#4f5d75">评测准确率 (Accuracy %)</text>

      
      <text x="30" y="284" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" text-anchor="end">40%</text>
      <text x="30" y="200" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" text-anchor="end">60%</text>
      <text x="30" y="120" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" text-anchor="end">80%</text>
      <text x="30" y="40" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" text-anchor="end">100%</text>

      <line x1="40" y1="200" x2="480" y2="200" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="40" y1="120" x2="480" y2="120" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="40" y1="40" x2="480" y2="40" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3" />

      
      <line x1="40" y1="210" x2="460" y2="210" stroke="#4f5d75" stroke-width="2.4" stroke-dasharray="6 4" />
      <circle cx="100" cy="179.0" r="4" fill="#4f5d75" />
      <circle cx="220" cy="179.0" r="4" fill="#4f5d75" />
      <circle cx="340" cy="179.0" r="4" fill="#4f5d75" />
      <circle cx="460" cy="179.0" r="4" fill="#4f5d75" />
      <text x="465" y="214" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="9" font-weight="700" fill="#4f5d75">真实泛化准确率 (平坦恒定 58%)</text>

      
      <path d="M 40 210 Q 200 190 300 120 T 460 45" fill="none" stroke="#eb6c36" stroke-width="2.4" />
      <circle cx="40" cy="179.0" r="4" fill="#eb6c36" />
      <circle cx="140" cy="169.0" r="4" fill="#eb6c36" />
      <circle cx="250" cy="134.0" r="4" fill="#eb6c36" />
      <circle cx="350" cy="100" r="4" fill="#eb6c36" />
      <circle cx="460" cy="45" r="5" fill="#eb6c36" />
      <text x="465" y="48" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="9" font-weight="700" fill="#eb6c36">虚假评测跑分 (膨胀至 98%！)</text>
    </g>

    
    <g transform="translate(560, 30)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="310" height="104" rx="6" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#2d3142">🔴 数据污染的致命隐患</text>
      <text x="12" y="38" font-size="8" fill="#2d3142">• 预训练/微调语料中混入 Benchmark 题目</text>
      <text x="12" y="54" font-size="8" fill="#2d3142">• 模型退化为“死记硬背”，泛化能力为零</text>
      <text x="12" y="70" font-size="8" fill="#2d3142">• 泄漏 20% 时分数虚高 +15%，泄漏 50% 破 90%</text>
      <text x="12" y="88" font-size="8" font-weight="700" fill="#eb6c36">• 生产上线后面对真实用户流量瞬间崩盘！</text>

      <g transform="translate(0, 150)">
        <rect width="310" height="108" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="12" y="-11.0" font-size="10.5" font-weight="700" fill="#2d3142">✓ 生产防护与治理标准</text>
        <text x="12" y="7.0" font-size="8" fill="#4f5d75">1. <tspan font-weight="700">N-gram 哈希去重</tspan>：训练前过滤与评测集 13-gram 相似文本</text>
        <text x="12" y="25.0" font-size="8" fill="#4f5d75">2. <tspan font-weight="700">动态黄金测试集</tspan>：每月定期注入全新真实业务脱敏样本</text>
        <text x="12" y="43.0" font-size="8" fill="#4f5d75">3. <tspan font-weight="700">对抗合成测试 (Canary Tokens)</tspan>：注入特定签名探针监控外泄</text>
        <text x="12" y="61.0" font-size="8" fill="#4f5d75">4. <tspan font-weight="700">不可判定问题过滤</tspan>：防止虚假幻觉误判</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
