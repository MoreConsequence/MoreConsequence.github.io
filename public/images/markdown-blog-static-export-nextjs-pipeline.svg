<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="markdown-blog-static-export-nextjs-pipeline-title markdown-blog-static-export-nextjs-pipeline-desc"><title id="markdown-blog-static-export-nextjs-pipeline-title">Markdown 博客架构全景：AST 语法树编译、元数据校验与 Next.js 静态站点生成 (SSG) 管线</title><desc id="markdown-blog-static-export-nextjs-pipeline-desc">Markdown 博客架构全景：AST 语法树编译、元数据校验与 Next.js 静态站点生成 (SSG) 管线</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Markdown 技术博客生命周期：从本地源文件到静态 HTML 的全链路管线</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 源码读取与 Zod 校验 ──► 2. Unified AST 管道 (Remark + Rehype) ──► 3. Next.js 静态构建 (SSG) ──► 4. GitHub Pages 边缘分发</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">阶段 1: 源码解析与 Frontmatter 强模式校验 (Schema &amp; Metadata)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">content/posts/**/*.md ──► gray-matter 提取 ──► Zod Schema 严格断言 title, date, tags, slug</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">编译期杜绝任何字段缺失与日期格式错误，确保全站元数据 100% 结构化强类型安全！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">阶段 2: Unified AST 编译管道与图片双端契约 (Unified Markdown AST)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">remark-parse ──► mdast ──► remark-rehype ──► hast ──► rehypeNormalizeImagePaths ──► rehype-stringify</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">自动将 IDE 本地相对路径映射为 Web 站点兼容的绝对路径！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">阶段 3: Next.js 静态站点生成 (SSG / Static Export)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">generateStaticParams() ──► 预渲染 200+ 篇深度技术博文 ──► 产出 out/ 纯静态 HTML/CSS/JS</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">零动态服务端依赖，零数据库宕机风险，首屏毫秒级直出 (TTFB &lt; 20ms)！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">阶段 4: 自动化 CI 验证矩阵与 GitHub Pages 边缘分发</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">npm test &amp;&amp; npm run lint &amp;&amp; npm run build ──► GitHub Actions ──► 全球 Anycast CDN 极速加速</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">严格遵循 AGENTS.md 仓库工程合同，打造出版级、永久可信赖的资深工程师知识库！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
