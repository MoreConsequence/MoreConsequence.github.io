<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Markdown 技术博客生命周期：从本地源文件到静态 HTML 的全链路管线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 源码读取与 Zod 校验 ──► 2. Unified AST 管道 (Remark + Rehype) ──► 3. Next.js 静态构建 (SSG) ──► 4. GitHub Pages 边缘分发</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">阶段 1: 源码解析与 Frontmatter 强模式校验 (Schema &amp; Metadata)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">content/posts/**/*.md ──► gray-matter 提取 ──► Zod Schema 严格断言 title, date, tags, slug</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">编译期杜绝任何字段缺失与日期格式错误，确保全站元数据 100% 结构化强类型安全！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">阶段 2: Unified AST 编译管道与图片双端契约 (Unified Markdown AST)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">remark-parse ──► mdast ──► remark-rehype ──► hast ──► rehypeNormalizeImagePaths ──► rehype-stringify</text>
        <text x="15" y="62" font-size="8" fill="#047857">自动将 IDE 本地相对路径映射为 Web 站点兼容的绝对路径！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">阶段 3: Next.js 静态站点生成 (SSG / Static Export)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">generateStaticParams() ──► 预渲染 200+ 篇深度技术博文 ──► 产出 out/ 纯静态 HTML/CSS/JS</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">零动态服务端依赖，零数据库宕机风险，首屏毫秒级直出 (TTFB &lt; 20ms)！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">阶段 4: 自动化 CI 验证矩阵与 GitHub Pages 边缘分发</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">npm test &amp;&amp; npm run lint &amp;&amp; npm run build ──► GitHub Actions ──► 全球 Anycast CDN 极速加速</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">严格遵循 AGENTS.md 仓库工程合同，打造出版级、永久可信赖的资深工程师知识库！</text>
      </g>
    </g>
  </g>
</svg>