<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">etcd 租约事务与单调递增防护令牌 (Fencing Token) 架构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">etcd Raft 强一致版本 (Revision) 生成唯一递增 Token ──► 存储层校验并拦截过期旧 Token</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 3 Core Horizontal Pipeline Columns (270px + 290px + 270px) -->
    <g transform="translate(20, 20)">
      <!-- Col 1: etcd Lease & Txn -->
      <g>
        <rect width="265" height="345" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
        <rect width="265" height="30" rx="6" fill="#dbeafe"/>
        <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">
          1. etcd 强一致租约与版本生成
        </text>

        <g transform="translate(12, 40)" font-family="ui-sans-serif, system-ui, sans-serif">
          <rect width="241" height="50" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
          <text x="10" y="16" font-size="8.5" font-weight="700" fill="#1d4ed8">Raft 强一致事务 (Txn):</text>
          <text x="10" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#2563eb">If: CreateRevision(key) == 0</text>
          <text x="10" y="42" font-family="ui-monospace, monospace" font-size="7.5" fill="#166534">Then: Put(key, val, lease_id)</text>

          <!-- Revision Monotonic Counter -->
          <g transform="translate(0, 60)">
            <rect width="241" height="150" rx="4" fill="#0f172a"/>
            <text x="10" y="18" font-size="8.5" font-weight="700" fill="#38bdf8">全局单调递增版本号 (Revision):</text>

            <g transform="translate(8, 28)" font-family="ui-monospace, monospace" font-size="7.5">
              <rect width="225" height="26" rx="3" fill="#1e293b"/>
              <text x="8" y="18" fill="#fca5a5">Client 1 抢锁 ──► Token = 301</text>

              <rect y="32" width="225" height="26" rx="3" fill="#1e293b"/>
              <text x="8" y="18" fill="#93c5fd">Client 2 抢锁 ──► Token = 302</text>

              <rect y="64" width="225" height="26" rx="3" fill="#1e293b"/>
              <text x="8" y="18" fill="#86efac">Client 3 抢锁 ──► Token = 303</text>
            </g>

            <text x="10" y="132" font-size="7.5" fill="#94a3b8">
              • 每次状态变更全局 Revision 绝对递增
            </text>
            <text x="10" y="144" font-size="7.5" fill="#34d399">
              • 天然充当物理安全的 Fencing Token！
            </text>
          </g>
          <text x="0" y="278" font-size="8.5" fill="#1d4ed8">
            • 解决 Redis 异步复制丢锁导致的双主脑裂
          </text>
        </g>
      </g>

      <!-- Conveyor Arrow 1 -->
      <path d="M 270 190 L 290 190" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

      <!-- Col 2: Storage Fencing Validation -->
      <g transform="translate(295, 0)">
        <rect width="280" height="345" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
        <rect width="280" height="30" rx="6" fill="#ffedd5"/>
        <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">
          2. 存储层版本校验拦截 (Fencing)
        </text>

        <g transform="translate(12, 40)" font-family="ui-sans-serif, system-ui, sans-serif">
          <rect width="256" height="50" rx="4" fill="#ffffff" stroke="#fed7aa"/>
          <text x="10" y="18" font-size="8.5" font-weight="700" fill="#9a3412">存储层维护当前最高版本：</text>
          <text x="10" y="34" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#ea580c">Max_Observed_Token = 302</text>

          <!-- Action 1: Client 2 Valid Write -->
          <g transform="translate(0, 58)">
            <rect width="256" height="60" rx="4" fill="#f0fdf4" stroke="#86efac"/>
            <text x="8" y="16" font-size="8" font-weight="700" fill="#166534">① Client 2 写入 (Token = 302):</text>
            <text x="8" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#15803d">UPDATE tbl SET v=B WHERE token &gt; 301</text>
            <text x="8" y="44" font-size="7.5" font-weight="700" fill="#10b981">✓ 校验通过！更新 Max_Token = 302</text>
          </g>

          <!-- Action 2: Client 1 Stale Write Rejected -->
          <g transform="translate(0, 126)">
            <rect width="256" height="74" rx="4" fill="#fee2e2" stroke="#f87171"/>
            <text x="8" y="16" font-size="8" font-weight="700" fill="#991b1b">② Client 1 延迟到达 (Token = 301):</text>
            <text x="8" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#7f1d1d">UPDATE tbl SET v=A WHERE token &gt; 302</text>
            <text x="8" y="48" font-size="7.5" font-weight="700" fill="#dc2626">❌ 301 &lt; 302！被存储层物理拒绝！</text>
            <text x="8" y="62" font-size="7" fill="#991b1b">成功保护数据不被脏数据覆盖！</text>
          </g>

          <text x="0" y="278" font-size="8.5" fill="#9a3412">
            • 存储层作为终极裁判，无需锁服务完美同步
          </text>
        </g>
      </g>

      <!-- Conveyor Arrow 2 -->
      <path d="M 580 190 L 600 190" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-emerald)"/>

      <!-- Col 3: Industrial Solution Matrix -->
      <g transform="translate(605, 0)">
        <rect width="255" height="345" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="255" height="30" rx="6" fill="#dcfce7"/>
        <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">
          3. 工业级选型决策树
        </text>

        <g transform="translate(12, 40)" font-family="ui-sans-serif, system-ui, sans-serif">
          <rect width="231" height="90" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#15803d">场景 A：低成本防重 (非致命)</text>
          <text x="10" y="34" font-size="7.5" fill="#64748b">• 典型：定时任务防重复触发、发邮件</text>
          <text x="10" y="48" font-size="7.5" fill="#64748b">• 选型：<tspan font-weight="700" fill="#2563eb">Redis SETNX + Redisson 看门狗</tspan></text>
          <text x="10" y="62" font-size="7.5" fill="#64748b">• 成本最低、吞吐最高（10w+ QPS）</text>

          <rect y="98" width="231" height="110" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#15803d">场景 B：强一致资产 (容灾严苛)</text>
          <text x="10" y="34" font-size="7.5" fill="#64748b">• 典型：银行记账、库存扣减、选主协调</text>
          <text x="10" y="48" font-size="7.5" fill="#64748b">• 选型：<tspan font-weight="700" fill="#166534">etcd / ZooKeeper + Fencing Token</tspan></text>
          <text x="10" y="62" font-size="7.5" fill="#64748b">• CP 强一致，彻底杜绝脑裂与乱序</text>
          <text x="10" y="78" font-size="7.5" font-weight="700" fill="#047857">• 数据库端必须带 version 字段乐观锁！</text>
        </g>
      </g>
    </g>
  </g>
</svg>
