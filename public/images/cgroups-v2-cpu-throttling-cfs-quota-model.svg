<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="cgroups-v2-cpu-throttling-cfs-quota-model-title cgroups-v2-cpu-throttling-cfs-quota-model-desc"><title id="cgroups-v2-cpu-throttling-cfs-quota-model-title">Linux cgroups CFS 调度器与 CPU Throttling 机理：cpu.cfs_quota_us…</title><desc id="cgroups-v2-cpu-throttling-cfs-quota-model-desc">Linux cgroups CFS 调度器与 CPU Throttling 机理：cpu.cfs_quota_us 与时间片限流陷阱</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">K8s CPU Limits 底层 CFS 限流与时延毛刺机理 (CPU Throttling)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">100ms 周期内配额用尽 (cfs_quota_us) ──► 线程强制被内核挂起沉睡 ──► 哪怕整机 CPU 利用率仅 20%，容器依然被残酷卡顿</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 配额用尽强行限流：严重时延尖刺</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">Pod 配置: resources.limits.cpu = 1 (100ms 配额 100ms)</text>

          <text y="38" fill="#f5f5f5">突发高并发请求 (多线程并发处理):</text>
          <text y="52" fill="#f5f5f5">1. 8 个线程同时工作，在 12.5ms 内耗尽了全部 100ms 配额！</text>
          <text y="68" fill="#f5f5f5">2. Linux CFS 调度器强行剥夺 CPU 执行权</text>
          <text y="84" fill="#f5f5f5">3. 容器内所有线程被强制沉睡 87.5 毫秒等待下一周期！</text>

          <text y="106" fill="#f5f5f5">🔴 API 接口时延瞬间暴涨 100ms+，P99 惨遭屠杀！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产痛点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 整机 CPU 空闲得很，应用却频繁出现超时报错；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 现代微服务生产环境最知名的“幽灵抖动”；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 倒逼企业重新审视 CPU Limits！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 不设 CPU Limits / 突发配额：平滑无阻</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">黄金生产实践 (Zalando / Uber 架构方案):</text>

          <text y="36" fill="#f5f5f5">1. 仅设置 CPU requests (保证调度资源隔离底线)</text>
          <text y="50" fill="#f5f5f5">2. 移除 CPU limits (或启用 Linux 5.14+ CPU Burst)</text>
          <text y="64" fill="#f5f5f5">3. 突发流量时自由借用节点空闲算力极速处理回包</text>
          <text y="78" fill="#f5f5f5">4. 彻底消除 CFS Throttling 限流挂起！</text>

          <text y="104" fill="#f5f5f5">✓ 接口 P99 响应时延暴降 80%，运行丝滑如飞！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 算力资源利用率与时延稳定性的双重突破；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 国际一线互联网大厂 SRE 事实标准；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 云原生容器性能调优经典必修课！</text>
      </g>
    </g>
  </g>
