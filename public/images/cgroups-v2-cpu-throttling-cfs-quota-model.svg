<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">K8s CPU Limits 底层 CFS 限流与时延毛刺机理 (CPU Throttling)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">100ms 周期内配额用尽 (cfs_quota_us) ──► 线程强制被内核挂起沉睡 ──► 哪怕整机 CPU 利用率仅 20%，容器依然被残酷卡顿</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: CFS Throttling -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 配额用尽强行限流：严重时延尖刺</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">Pod 配置: resources.limits.cpu = 1 (100ms 配额 100ms)</text>
          
          <text y="38" fill="#ef4444">突发高并发请求 (多线程并发处理):</text>
          <text y="52" fill="#fca5a5">1. 8 个线程同时工作，在 12.5ms 内耗尽了全部 100ms 配额！</text>
          <text y="68" fill="#ef4444">2. Linux CFS 调度器强行剥夺 CPU 执行权</text>
          <text y="84" fill="#ef4444">3. 容器内所有线程被强制沉睡 87.5 毫秒等待下一周期！</text>
          
          <text y="106" fill="#f87171">🔴 API 接口时延瞬间暴涨 100ms+，P99 惨遭屠杀！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 整机 CPU 空闲得很，应用却频繁出现超时报错；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 现代微服务生产环境最知名的“幽灵抖动”；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 倒逼企业重新审视 CPU Limits！</text>
      </g>
    </g>

    <!-- Right: No Limit or Bursting -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 不设 CPU Limits / 突发配额：平滑无阻</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">黄金生产实践 (Zalando / Uber 架构方案):</text>
          
          <text y="36" fill="#86efac">1. 仅设置 CPU requests (保证调度资源隔离底线)</text>
          <text y="50" fill="#38bdf8">2. 移除 CPU limits (或启用 Linux 5.14+ CPU Burst)</text>
          <text y="64" fill="#34d399">3. 突发流量时自由借用节点空闲算力极速处理回包</text>
          <text y="78" fill="#4ade80">4. 彻底消除 CFS Throttling 限流挂起！</text>
          
          <text y="104" fill="#4ade80">✓ 接口 P99 响应时延暴降 80%，运行丝滑如飞！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 算力资源利用率与时延稳定性的双重突破；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 国际一线互联网大厂 SRE 事实标准；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 云原生容器性能调优经典必修课！</text>
      </g>
    </g>
  </g>
</svg>