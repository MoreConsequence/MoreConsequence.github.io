<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">TCP 拥塞控制两代范式：基于丢包 (CUBIC) vs 基于模型测量 (BBR)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">CUBIC 填满路由器缓冲区导致排队延迟飙升 (Bufferbloat) vs BBR 精准运行在 BDP 物理拐点 (最大带宽 + 最小时延)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Comparison Panes (435px each) -->
    <!-- Left: CUBIC Loss-based -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 基于丢包的传统拥塞控制 (Reno / CUBIC)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 误把"丢包"当作拥塞的唯一信号</text>
          <text y="32" fill="#fca5a5">1. cwnd 持续盲目增长，超过网络 BDP 管道容量</text>
          <text y="50" fill="#fca5a5">2. 溢出的包堆积在路由器队列 (Bufferbloat 严重)</text>
          <text y="68" fill="#f87171">3. RTT 延迟从 20ms 被活活撑大到 500ms！</text>
          <text y="86" fill="#ef4444">4. 队列溢出发生物理丢包 ──► cwnd 剧烈腰斩！</text>
          <text y="104" fill="#fb7185">5. 随后再次狂增，网络吞吐呈剧烈锯齿状震荡！</text>
          <text y="126" fill="#ef4444">❌ 在无线弱网 (偶发随机丢包) 下吞吐瞬间跌停！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">物理缺陷：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 无法区分是网络真的塞车，还是无线链路偶发误码丢包；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 导致长肥管道 (Long Fat Network) 带宽利用率极其低下；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 恶化全球跨国、跨大西洋与跨大洲网络延迟。</text>
      </g>
    </g>

    <!-- Right: BBR Model-based -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 基于模型测量的现代拥塞控制 (Google BBR)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">// 寻找 Kleinrock 最佳物理运行点 (BDP)</text>
          <text y="32" fill="#86efac">1. 独立测量 BtlBw (瓶颈最大可用带宽)</text>
          <text y="50" fill="#86efac">2. 独立测量 RTprop (物理传播最小往返时延)</text>
          <text y="68" fill="#38bdf8">3. 计算 BDP = BtlBw × RTprop</text>
          <text y="88" fill="#34d399">4. 动态调节发送节奏 (Pacing Rate = BtlBw):</text>
          <text y="104" fill="#34d399">   管道刚好填满，零排队队列，零 Bufferbloat！</text>
          <text y="126" fill="#4ade80">✓ 即使遇到 15% 随机丢包，吞吐依然保持在 90% 以上！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级收益 (YouTube / CDN 标配)：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 吞吐量提升 2x ~ 10x 倍（特别在跨国高延迟弱网）；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 显著消除长尾请求延迟，保障视频流畅播放；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• Linux 内核直接开启：sysctl net.ipv4.tcp_congestion_control=bbr</text>
      </g>
    </g>
  </g>
</svg>