<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="cc-title cc-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="cc-title">TCP 拥塞控制模型：CUBIC 丢包反馈 vs BBR 物理建模</title>
  <desc id="cc-desc">网络拥塞控制架构图展示发送闸门约束、CUBIC 基于丢包收缩与 Bufferbloat 缓冲区膨胀机理、BBR 基于 BDP 物理建模与零排队控制范式变革。</desc>
  <defs>
    <marker id="cc-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="cc-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">CONGESTION CONTROL PARADIGM · LOSS-BASED VS MODEL-BASED BBR</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">TCP 拥塞控制：CUBIC 丢包反馈 vs BBR 物理建模</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">min(cwnd, rwnd) 闸门 ➔ CUBIC Bufferbloat 膨胀 ➔ BBR BDP 建模 ➔ 零排队最大吞吐</text>

  <!-- 4 Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: 3 Gates (x=40..245, w=205) -->
  <g transform="translate(40, 136)">
    <rect width="205" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="62" y="25" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">3 GATES</text>
    <text x="118" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">三道发送闸门</text>

    <!-- Box -->
    <rect x="12" y="42" width="181" height="96" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">min(cwnd, rwnd)</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• rwnd: 接收端通告窗口 (流量控制)</text>
    <text x="20" y="94" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• cwnd: 网络路径在途窗口 (拥塞控制)</text>
    <text x="20" y="110" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Dual-Window Flight Size Limit</text>

    <!-- Details -->
    <rect x="12" y="148" width="181" height="212" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">闸门分工：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 接收方慢由 rwnd 兜底收窄；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 中间路由拥塞由 cwnd 约束调控；</text>
    <text x="20" y="226" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 确保网络不被单侧暴击打瘫。</text>
  </g>

  <!-- Col 2: CUBIC Loss-Based (x=260..475, w=215) - Focal -->
  <g transform="translate(260, 136)">
    <rect width="215" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#e85d3f"/>
    <text x="62" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">CUBIC</text>
    <text x="118" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">CUBIC 丢包驱动</text>

    <!-- Box -->
    <rect x="12" y="42" width="191" height="96" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="20" y="62" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Bufferbloat &amp; Sawtooth</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 死命撑大窗口直到路由器队列溢出</text>
    <text x="20" y="94" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 触发丢包后剧烈乘性收缩窗口</text>
    <text x="20" y="110" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace">High Queue Delay Penalty</text>

    <!-- Details -->
    <rect x="12" y="148" width="191" height="212" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">缺陷痛点：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 造成严重的 Bufferbloat 缓冲区膨胀；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 弱网随机丢包时误判拥塞断崖降速；</text>
    <text x="20" y="226" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 延迟波动大无法保障实时性。</text>
  </g>

  <!-- Col 3: BBR Model-Based (x=490..695, w=205) - Focal -->
  <g transform="translate(490, 136)">
    <rect width="205" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#e85d3f"/>
    <text x="62" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">BBR MODEL</text>
    <text x="118" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">BBR 物理建模</text>

    <!-- Box -->
    <rect x="12" y="42" width="181" height="96" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="20" y="62" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">BtlBw &amp; RTprop</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 测量瓶颈带宽与最小传播往返时延</text>
    <text x="20" y="94" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• BDP = BtlBw * RTprop 精准在途控制</text>
    <text x="20" y="110" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace">Zero Queue Delay Equilibrium</text>

    <!-- Details -->
    <rect x="12" y="148" width="181" height="212" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">模型优势：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 保持 100% 链路带宽利用率；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 杜绝中间路由器队列无意义积压；</text>
    <text x="20" y="226" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 获得极低且稳定的传输延迟。</text>
  </g>

  <!-- Col 4: Paradigm Shift (x=710..920, w=210) -->
  <g transform="translate(710, 136)">
    <rect width="210" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#141413"/>
    <text x="62" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">PARADIGM</text>
    <text x="118" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">控制范式变革</text>

    <!-- Box -->
    <rect x="12" y="42" width="186" height="96" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">State-Driven Pacing</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 从“等待丢包”转向“主动物理测量”</text>
    <text x="20" y="94" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 结合 pacing 平滑发包消除微突发</text>
    <text x="20" y="110" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Next-Gen Transport Base</text>

    <!-- Details -->
    <rect x="12" y="148" width="186" height="212" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">工程结论：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 现代长肥网络推荐首选 BBR；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 彻底颠覆 30 年丢包驱动传统；</text>
    <text x="20" y="226" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 驱动现代互联网传输革命。</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">发送闸门三要素与控制范式演进规律</text>
  <rect x="370" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="390" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">CUBIC 丢包 Bufferbloat 与 BBR 物理建模核心</text>
</svg>
