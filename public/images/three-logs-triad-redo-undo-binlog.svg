<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="tri-title tri-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="tri-title">MySQL 三大日志铁三角分工：Redo Log、Undo Log 与 Binlog</title>
  <desc id="tri-desc">对比架构图展示 MySQL 三大日志在归属层级、格式特性、核心职责以及刷盘参数上的明确分工与铁三角协作关系。</desc>
  <defs>
    <marker id="tr-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="tr-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">MYSQL THREE LOGS · REDO, UNDO &amp; BINLOG RESPONSIBILITY</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">MySQL 三大日志铁三角分工与物理特性</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">Redo Log (物理WAL/崩溃恢复/InnoDB独有) vs Undo Log (逻辑MVCC/事务回滚/InnoDB独有) vs Binlog (逻辑归档/主从复制/Server通用)</text>

  <!-- 3 Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Redo Log (x=40..310, w=270) - Focal -->
  <g transform="translate(40, 136)">
    <rect width="270" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="80" height="18" rx="2" fill="#e85d3f"/>
    <text x="54" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">REDO LOG</text>
    <text x="104" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Redo 重做日志 (WAL)</text>

    <!-- Specs -->
    <rect x="14" y="42" width="242" height="100" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">InnoDB 物理重做基石</text>
    <text x="24" y="82" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• 归属: InnoDB 引擎层独有</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 格式: 物理/物理逻辑页修改记录</text>
    <text x="24" y="118" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• 结构: 循环覆盖写 (Ring Buffer)</text>
    <text x="24" y="132" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Physical Page Modification Record</text>

    <!-- Details -->
    <rect x="14" y="152" width="242" height="100" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="174" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">核心使命与配置：</text>
    <text x="24" y="194" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">使命: 崩溃前滚恢复 (Roll-Forward)</text>
    <text x="24" y="214" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">配置: innodb_flush_log_at_trx_commit=1</text>
    <text x="24" y="232" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">保证已提交事务断电绝对不丢失！</text>

    <!-- Summary -->
    <rect x="14" y="262" width="242" height="98" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="284" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">持久性保障 (D)</text>
    <text x="24" y="302" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">为数据页落盘赢得缓冲时间，将随机写转化为纯顺序 WAL 追加。</text>
    <text x="24" y="326" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">LSN Monotonic Incremental</text>
    <text x="24" y="342" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Crash Recovery Engine Backbone</text>
  </g>

  <!-- Col 2: Undo Log (x=340..610, w=270) -->
  <g transform="translate(340, 136)">
    <rect width="270" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="80" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="54" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">UNDO LOG</text>
    <text x="104" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Undo 回滚日志 (MVCC)</text>

    <!-- Specs -->
    <rect x="14" y="42" width="242" height="100" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">InnoDB 逻辑回滚与快照</text>
    <text x="24" y="82" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">• 归属: InnoDB 引擎层独有</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 格式: 逻辑相反操作 (INSERT/UPDATE旧值)</text>
    <text x="24" y="118" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• 结构: Undo Tablespace 段页管理</text>
    <text x="24" y="132" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Logical Inverse Modification Records</text>

    <!-- Details -->
    <rect x="14" y="152" width="242" height="100" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="174" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">核心使命与机制：</text>
    <text x="24" y="194" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">使命: 事务回滚 + MVCC 快照读</text>
    <text x="24" y="214" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">清理: 后台 Purge 线程异步回收</text>
    <text x="24" y="232" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">支撑 0 锁并发一致性读取！</text>

    <!-- Summary -->
    <rect x="14" y="262" width="242" height="98" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="284" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">原子性与隔离性 (A &amp; I)</text>
    <text x="24" y="302" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">让出错事务随时无损回滚，让旧快照读看到时间静止的世界。</text>
    <text x="24" y="326" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Multi-Version Concurrency Control</text>
    <text x="24" y="342" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Automatic Purge Reclaim</text>
  </g>

  <!-- Col 3: Binlog (x=640..920, w=280) - Focal -->
  <g transform="translate(640, 136)">
    <rect width="280" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="#e85d3f"/>
    <text x="52" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">BINLOG</text>
    <text x="98" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Binlog 归档日志 (Server)</text>

    <!-- Specs -->
    <rect x="14" y="42" width="252" height="100" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">MySQL 服务层逻辑事件账</text>
    <text x="24" y="82" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• 归属: MySQL Server 层 (引擎共享)</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 格式: ROW / STATEMENT / MIXED 事件</text>
    <text x="24" y="118" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• 结构: 追加写入，滚动生成新段文件</text>
    <text x="24" y="132" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Server-Level Logical Event Stream</text>

    <!-- Details -->
    <rect x="14" y="152" width="252" height="100" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="174" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">核心使命与配置：</text>
    <text x="24" y="194" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">使命: 主从复制 + PITR 点对点恢复</text>
    <text x="24" y="214" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">配置: sync_binlog=1 (双1安全标准)</text>
    <text x="24" y="232" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">全量记录数据库所有的变更历史！</text>

    <!-- Summary -->
    <rect x="14" y="262" width="252" height="98" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="284" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">集群与灾备支柱</text>
    <text x="24" y="302" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">供异构从库订阅重放，配合 2PC XID 实现跨组件状态一致性。</text>
    <text x="24" y="326" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Point-in-Time Recovery Ready</text>
    <text x="24" y="342" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Replication Stream Backbone</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Undo 逻辑回滚与快照机制</text>
  <rect x="310" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="330" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Redo 物理恢复与 Binlog 复制归档核心</text>
</svg>
