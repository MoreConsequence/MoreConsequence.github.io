<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL 三大日志铁三角核心职责分工 (Three Logs Architecture)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Redo Log (InnoDB 物理崩溃恢复: Crash-Safe) ｜ Undo Log (原子性与 MVCC 多版本快照) ｜ Binlog (Server 层主从复制与时间点数据恢复)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 重做日志 (Redo Log: 物理日志)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">InnoDB 独有物理页修改记录：</text>
          <text x="10" y="34" fill="#86efac">"对 Page 10 偏移量 120 写入字节 0xAB"</text>
          
          <text x="10" y="58" fill="#cbd5e1">• 固定大小循环写入 (ib_logfile0/1)</text>
          <text x="10" y="74" fill="#cbd5e1">• WAL 机制保证事务持久性 (Durability)</text>
          <text x="10" y="90" fill="#34d399">• 掉电重启自动前滚未刷盘脏页</text>
          
          <text x="10" y="116" fill="#4ade80">✓ Crash-Safe 崩溃安全保障！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 纯物理级别顺序写入；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 赋能内存 Buffer Pool 异步刷盘；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 数据库性能发动机。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 回滚日志 (Undo Log: 逻辑日志)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">InnoDB 行版本逻辑逆操作：</text>
          <text x="10" y="34" fill="#86efac">"UPDATE 记录原值 / INSERT 记录对应主键"</text>
          
          <text x="10" y="58" fill="#cbd5e1">• 保障事务原子性 (ROLLBACK 自动逆向回滚)</text>
          <text x="10" y="74" fill="#38bdf8">• 串联成单向链表支撑 MVCC 快照读</text>
          <text x="10" y="90" fill="#34d399">• 读写并发 0 互斥锁</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 事务隔离与回滚基石！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 后台 Purge 线程清理无用 Undo 页；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 行级并发控制的核心依赖；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高并发隔离视图。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 归档日志 (Binlog: 逻辑事件)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">Server 层服务级追加日志：</text>
          <text x="10" y="34" fill="#fed7aa">记录 ROW 格式的事件变更数据流</text>
          
          <text x="10" y="58" fill="#cbd5e1">• 无限追加写入，不覆盖历史文件</text>
          <text x="10" y="74" fill="#38bdf8">• 支撑主从异步/半同步高可用复制</text>
          <text x="10" y="90" fill="#34d399">• 配合全量备份实现任意时间点 (PITR) 恢复</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 跨节点数据流转与容灾灵魂！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 独立于任何存储引擎存在；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 现代大数据 CDC (Canal/Flink) 核心源头；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级分布式生态枢纽！</text>
      </g>
    </g>
  </g>
</svg>