    <text x="624" y="110" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">后续请求自动判定为过期</text>
    <text x="624" y="128" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">异步回收旧块，0 性能抖动</text>

