    <text x="22" y="80" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Surrogate-Key:</text>
    <text x="22" y="96" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">  prod_9527 merchant_88</text>
    <text x="22" y="116" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Cache-Control: max-age=86400</text>
    <text x="22" y="132" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">ETag: "9527-v1"</text>
