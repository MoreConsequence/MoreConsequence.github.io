    <text x="326" y="68" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 边缘内存代数自增 (O(1))</text>
    <text x="326" y="90" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">GenMap["prod_9527"]++ ➔ 2</text>
    <text x="326" y="110" fill="#2d3142" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">无需遍历扫描 TB 级磁盘</text>
    <text x="326" y="128" fill="#eb6c36" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">内存单次修改耗时 &lt; 1µs</text>

