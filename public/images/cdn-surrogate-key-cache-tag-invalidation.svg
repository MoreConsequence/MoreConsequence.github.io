    <rect x="12" y="12" width="56" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="1"/>
    <text x="40" y="24" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">ORIGIN</text>
    <text x="76" y="25" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">源站响应注入标签</text>

