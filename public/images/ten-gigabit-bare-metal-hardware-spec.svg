<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">1U 裸金属万兆测速服务器工业级硬件拓扑 (Bare-Metal Topology)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">AMD EPYC 8 核 CPU ──► 64GB DDR4-3200 ECC ──► PCIe 4.0 x8 Intel E810 双口 25G/100G 网卡 ──► 0 外部依赖</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 计算单元 (CPU)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">AMD EPYC / Intel Xeon</text>
          
          <text x="8" y="42" fill="#86efac">• 8 物理核心 / 16 线程</text>
          <text x="8" y="58" fill="#86efac">• 32MB L3 超大缓存</text>
          <text x="8" y="74" fill="#86efac">• 单 Socket 规避跨 NUMA</text>
          
          <text x="8" y="104" fill="#4ade80">✓ 极高性价比算力基石！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">选型考量：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• 拒绝过度配置 64 核；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 高主频与大 L3 缓存对网络包转发至关重要；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 打造高能效计算比。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 内存通道 (RAM)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">64GB DDR4-3200 ECC</text>
          
          <text x="8" y="42" fill="#86efac">• 4 通道对称插满</text>
          <text x="8" y="58" fill="#86efac">• 内存带宽突破 100GB/s</text>
          <text x="8" y="74" fill="#86efac">• ECC 硬件纠错防位翻转</text>
          
          <text x="8" y="104" fill="#4ade80">✓ 吞吐零瓶颈！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">选型考量：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• 满足 memfd 内存盘高速推流；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• 支撑 64MB TCP 接收大窗口；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 打造坚固内存底座。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 万兆网卡 (NIC)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">Intel E810 / Mellanox CX5</text>
          
          <text x="8" y="42" fill="#fed7aa">• 双口 25G / 100G SFP28</text>
          <text x="8" y="58" fill="#fed7aa">• PCIe 4.0 x8 直连 CPU</text>
          <text x="8" y="74" fill="#fed7aa">• 硬件 TSO / LRO / RSS</text>
          
          <text x="8" y="104" fill="#4ade80">✓ 极限网络转发利器！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#c2410c">选型考量：</text>
        <text x="8" y="34" font-size="7.5" fill="#9a3412">• 硬件级卸载包分片与校验和；</text>
        <text x="8" y="48" font-size="7.5" fill="#9a3412">• 多队列 RSS 均匀分配中断；</text>
        <text x="8" y="62" font-size="7.5" fill="#ea580c">• 工业级网络硬件标准。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. 机架与能耗 (Chassis)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">1U 短深机架服务器</text>
          
          <text x="8" y="42" fill="#e9d5ff">• 功耗仅 180W 绿色节能</text>
          <text x="8" y="58" fill="#e9d5ff">• 冗余双电源 (1+1)</text>
          <text x="8" y="74" fill="#e9d5ff">• IPMI 远程带外管理</text>
          
          <text x="8" y="104" fill="#4ade80">✓ 边缘机房极简部署！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">选型考量：</text>
        <text x="8" y="34" font-size="7.5" fill="#6b21a8">• 紧凑占用机柜空间 (1U)；</text>
        <text x="8" y="48" font-size="7.5" fill="#6b21a8">• 极低功耗降低机房电费支出；</text>
        <text x="8" y="62" font-size="7.5" fill="#6b21a8">• 打造终极高性能测速节点！</text>
      </g>
    </g>
  </g>
</svg>