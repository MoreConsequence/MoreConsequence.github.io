<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">可观测性三大支柱联合排障闭环 (Metrics ──► Traces ──► Logs)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. Prometheus 指标大盘发现异常尖刺 ──► 2. 点击下钻 Jaeger 链路精准定位慢 RPC Span ──► 3. 关联 TraceID 检索 Loki 结构化日志锁定代码异常堆栈</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Metrics: 宏观感知与报警</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">Prometheus / Grafana:</text>
          
          <text x="10" y="38" fill="#86efac">• 存储低成本时序聚合统计值</text>
          <text x="10" y="54" fill="#f87171">• 14:02 捕获 5xx 错误率突增至 3.2%</text>
          <text x="10" y="70" fill="#fb923c">• 触发告警: "订单服务 P99 &gt; 2s"</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 告诉我们系统“生病了”！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 极低存储成本，长期趋势观测；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 排障故事的第一入口；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 宏观雷达。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Traces: 跨服务拓扑下钻</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">OpenTelemetry / Tempo:</text>
          
          <text x="10" y="38" fill="#86efac">• 从指标下钻提取故障 TraceID</text>
          <text x="10" y="54" fill="#38bdf8">• 观察 15 个微服务完整调用拓扑</text>
          <text x="10" y="70" fill="#f87171">• 发现瓶颈在库存服务: DB Query 1.8s</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 告诉我们“病灶在哪里”！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 还原请求在分布式网络间的漫游足迹；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 精确切除无关节点怀疑；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 空间定位。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Logs: 铁证现场精细取证</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">Loki / Elasticsearch:</text>
          
          <text x="10" y="38" fill="#fed7aa">• 精确检索: trace_id = "4bf92f35..."</text>
          <text x="10" y="54" fill="#f87171">• 提取确切错误: Deadlock found when trying to get lock</text>
          <text x="10" y="70" fill="#4ade80">• 打印出代码行号: inventory.go:142！</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 告诉我们“为什么会生病”！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 提供法医级代码异常现场证据；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 三位一体协同排障效率提升 10 倍；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 现代可观测性最高境界！</text>
      </g>
    </g>
  </g>
</svg>