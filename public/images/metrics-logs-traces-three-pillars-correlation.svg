<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="metrics-logs-traces-three-pillars-correlation-title metrics-logs-traces-three-pillars-correlation-desc"><title id="metrics-logs-traces-three-pillars-correlation-title">可观测性三支柱深度融合：Metrics (指标发现) -&gt; Traces (链路定位) -&gt; Logs (现场取证)</title><desc id="metrics-logs-traces-three-pillars-correlation-desc">可观测性三支柱深度融合：Metrics (指标发现) -&gt; Traces (链路定位) -&gt; Logs (现场取证)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">可观测性三大支柱联合排障闭环 (Metrics ──► Traces ──► Logs)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. Prometheus 指标大盘发现异常尖刺 ──► 2. 点击下钻 Jaeger 链路精准定位慢 RPC Span ──► 3. 关联 TraceID 检索 Loki 结构化日志锁定代码异常堆栈</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Metrics: 宏观感知与报警</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">Prometheus / Grafana:</text>

          <text x="10" y="38" fill="#f5f5f5">• 存储低成本时序聚合统计值</text>
          <text x="10" y="54" fill="#f5f5f5">• 14:02 捕获 5xx 错误率突增至 3.2%</text>
          <text x="10" y="70" fill="#f5f5f5">• 触发告警: "订单服务 P99 &gt; 2s"</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 告诉我们系统“生病了”！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 极低存储成本，长期趋势观测；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 排障故事的第一入口；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 宏观雷达。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. Traces: 跨服务拓扑下钻</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">OpenTelemetry / Tempo:</text>

          <text x="10" y="38" fill="#f5f5f5">• 从指标下钻提取故障 TraceID</text>
          <text x="10" y="54" fill="#f5f5f5">• 观察 15 个微服务完整调用拓扑</text>
          <text x="10" y="70" fill="#f5f5f5">• 发现瓶颈在库存服务: DB Query 1.8s</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 告诉我们“病灶在哪里”！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 还原请求在分布式网络间的漫游足迹；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 精确切除无关节点怀疑；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 空间定位。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. Logs: 铁证现场精细取证</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">Loki / Elasticsearch:</text>

          <text x="10" y="38" fill="#f5f5f5">• 精确检索: trace_id = "4bf92f35..."</text>
          <text x="10" y="54" fill="#f5f5f5">• 提取确切错误: Deadlock found when trying to get lock</text>
          <text x="10" y="70" fill="#f5f5f5">• 打印出代码行号: inventory.go:142！</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 告诉我们“为什么会生病”！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 提供法医级代码异常现场证据；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 三位一体协同排障效率提升 10 倍；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代可观测性最高境界！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
