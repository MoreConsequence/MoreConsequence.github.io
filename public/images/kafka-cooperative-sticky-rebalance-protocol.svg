<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Kafka 2.4+ 协作式粘性重平衡协议 (CooperativeStickyAssignor)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">渐进两阶段重平衡 (Two-Round Rebalance) ｜ 没受影响的分区 100% 持续消费 0 停顿 ｜ 仅孤儿分区进行增量单点平滑交接迁移</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Eager vs Cooperative -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 第一轮：90% 分区持续消费 0 停顿</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">Round 1 流转机制：</text>
          <text y="28" fill="#86efac">1. Consumer A, B, C 收到 Rebalance 广播通知</text>
          
          <text y="50" fill="#38bdf8">2. 革命性突破：</text>
          <text y="64" fill="#34d399">   • 绝对不丢弃当前持有的分区！</text>
          <text y="78" fill="#34d399">   • 边正常拉取消费消息，边上报当前持有情况</text>
          <text y="92" fill="#4ade80">   • 仅计算需要被剥离转移的极少数分区 (如 2 个)</text>
          
          <text y="116" fill="#4ade80">✓ 消费吞吐保持 95% 以上，彻底告别停机！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 粘性分配原则 (Sticky): 尽可能维持原有映射；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 消除无意义的“全量拔出再重新插回”；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 极简增量调整。</text>
      </g>
    </g>

    <!-- Right: Round 2 -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">✓ 第二轮：单点增量交接完成收敛</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">Round 2 增量交接流转：</text>
          
          <text y="36" fill="#86efac">1. 仅被指定转移的 Consumer 释放对应孤儿分区</text>
          <text y="50" fill="#38bdf8">2. 随后立即触发第二轮快速 SyncGroup</text>
          <text y="64" fill="#34d399">3. 新扩容的 Consumer D 优雅接管这 2 个孤儿分区</text>
          <text y="78" fill="#4ade80">4. 全程用时 &lt; 200ms，业务大盘 0 抖动平滑完成！</text>
          
          <text y="104" fill="#4ade80">✓ 生产环境扩缩容再无惧怕！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 彻底根除 Kafka 消费积压重平衡风暴；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 现已成为 Spring Kafka / sarama 默认推荐策略；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 消息中间件演进史上最震撼的重构成果！</text>
      </g>
    </g>
  </g>
</svg>