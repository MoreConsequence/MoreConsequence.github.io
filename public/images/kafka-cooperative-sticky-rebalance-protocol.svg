<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="kafka-cooperative-sticky-rebalance-protocol-title kafka-cooperative-sticky-rebalance-protocol-desc"><title id="kafka-cooperative-sticky-rebalance-protocol-title">Kafka 2.4+ 协作式粘性重平衡 (Cooperative Sticky Rebalance)：平滑迁移与 0…</title><desc id="kafka-cooperative-sticky-rebalance-protocol-desc">Kafka 2.4+ 协作式粘性重平衡 (Cooperative Sticky Rebalance)：平滑迁移与 0 停顿</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Kafka 2.4+ 协作式粘性重平衡协议 (CooperativeStickyAssignor)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">渐进两阶段重平衡 (Two-Round Rebalance) ｜ 没受影响的分区 100% 持续消费 0 停顿 ｜ 仅孤儿分区进行增量单点平滑交接迁移</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 第一轮：90% 分区持续消费 0 停顿</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">Round 1 流转机制：</text>
          <text y="28" fill="#f5f5f5">1. Consumer A, B, C 收到 Rebalance 广播通知</text>

          <text y="50" fill="#f5f5f5">2. 革命性突破：</text>
          <text y="64" fill="#f5f5f5">   • 绝对不丢弃当前持有的分区！</text>
          <text y="78" fill="#f5f5f5">   • 边正常拉取消费消息，边上报当前持有情况</text>
          <text y="92" fill="#f5f5f5">   • 仅计算需要被剥离转移的极少数分区 (如 2 个)</text>

          <text y="116" fill="#f5f5f5">✓ 消费吞吐保持 95% 以上，彻底告别停机！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 粘性分配原则 (Sticky): 尽可能维持原有映射；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 消除无意义的“全量拔出再重新插回”；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 极简增量调整。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 第二轮：单点增量交接完成收敛</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">Round 2 增量交接流转：</text>

          <text y="36" fill="#f5f5f5">1. 仅被指定转移的 Consumer 释放对应孤儿分区</text>
          <text y="50" fill="#f5f5f5">2. 随后立即触发第二轮快速 SyncGroup</text>
          <text y="64" fill="#f5f5f5">3. 新扩容的 Consumer D 优雅接管这 2 个孤儿分区</text>
          <text y="78" fill="#f5f5f5">4. 全程用时 &lt; 200ms，业务大盘 0 抖动平滑完成！</text>

          <text y="104" fill="#f5f5f5">✓ 生产环境扩缩容再无惧怕！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 彻底根除 Kafka 消费积压重平衡风暴；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 现已成为 Spring Kafka / sarama 默认推荐策略；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 消息中间件演进史上最震撼的重构成果！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
