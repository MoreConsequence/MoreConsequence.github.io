<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="redis-approximated-lru-pool-sampling-title redis-approximated-lru-pool-sampling-desc"><title id="redis-approximated-lru-pool-sampling-title">Redis 近似 LRU 采样池算法：16 槽 EvictionPool 淘汰候选排序与内存 0 额外开销</title><desc id="redis-approximated-lru-pool-sampling-desc">Redis 近似 LRU 采样池算法：16 槽 EvictionPool 淘汰候选排序与内存 0 额外开销</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Redis 近似 LRU 采样候选池算法 (Approximated LRU with EvictionPool)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">经典 LRU 双向链表 (每个 Key 耗费 24B 指针 + 并发锁竞争) vs Redis 随机抽样 5 个键放入 16 槽全局 EvictionPool (0 额外指针，精准度逼近真实 LRU)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. robj.lru 24-bit 紧凑时间戳 (Compact In-Header Timestamp)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">每个 Redis 对象头复用 24 位整数字段记录访问时钟 ──► 0 外部双向链表开销，亿级数据节省数 GB 内存！</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">极致的内存紧凑物理设计！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 随机抽样 N 个样本键 (Random Sampling: maxmemory-samples = 5)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">写操作触发内存超限 ──► 从字典中随机抽取 5~10 个键 ──► 计算各自闲置空闲时间 idle_time</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">常数级 O(1) 极速抽样，0 遍历全库开销！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 插入 16 槽 EvictionPool 候选排序数组 (Sorted Eviction Pool)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">维护容量为 16 的全局有序数组 ──► 按 idle_time 从小到大升序排列 ──► 淘汰空闲时间最大的尾部候选键</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">跨批次累积优秀淘汰样本，大幅修正单次随机误差！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 极速逐出与空间释放 (Evict and Free Memory Block)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">从 db 字典中物理删除目标 Key 并归还内存 ──► samples=10 时拟合度达到真实 LRU 的 99%！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">兼顾空间极限压缩与近乎完美的数学拟合典范！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
