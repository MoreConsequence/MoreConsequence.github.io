<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="retry-amplification-title retry-amplification-desc"><title id="retry-amplification-title">三层各允许三次尝试的重试放大示意图，以及幂等键如何把重复请求收敛到同一个权威结果</title><desc id="retry-amplification-desc">三层各允许三次尝试的重试放大示意图，以及幂等键如何把重复请求收敛到同一个权威结果</desc><defs>
    
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>

  
  <rect width="960" height="440" fill="#f5f5f5" />
  <rect width="960" height="440" fill="url(#dot-grid)" opacity="0" />

  
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#ea580c" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">微服务重试指数放大风暴（Retry Storm）与幂等键收敛机制</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">三层链路各重试 3 次导致下游 27 倍洪峰打崩数据库 vs 幂等键（Idempotency Key）状态机收敛为 1 次</text>
  </g>

  
  <g transform="translate(30, 75)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />

    
    <g transform="translate(20, 16)">
      <text x="0" y="14" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12.5" font-weight="700" fill="#2d3142">⚠️ 致命缺陷：无全局预算的局部重试导致流量雪崩（$3 \times 3 \times 3 = 27\times$ 放大）</text>

      <g transform="translate(0, 26)">
        
        <rect x="0" y="0" width="160" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="80" y="24" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">客户端 (Client)</text>
        <text x="80" y="44" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#4f5d75" text-anchor="middle">1 个 HTTP POST</text>

        
        <path d="M 160 32 L 210 32" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-slate)" />

        
        <rect x="220" y="0" width="180" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="310" y="24" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">API 网关 (Gateway)</text>
        <text x="310" y="44" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#4f5d75" text-anchor="middle">超时重试 ×3 ──► 3 请求</text>

        
        <path d="M 400 32 L 450 32" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-red)" />

        
        <rect x="460" y="0" width="180" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="550" y="24" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">订单服务 (Order Svc)</text>
        <text x="550" y="44" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#eb6c36" text-anchor="middle">下游重试 ×3 ──► 9 请求</text>

        
        <path d="M 640 32 L 690 32" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-red)" />

        
        <rect x="700" y="0" width="160" height="64" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
        <text x="780" y="24" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">🔥 支付 / 数据库</text>
        <text x="780" y="44" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#eb6c36" text-anchor="middle">承受 27 倍洪峰! 宕机</text>
      </g>
    </g>

    
    <line x1="20" y1="125" x2="880" y2="125" stroke="rgba(45,49,66,0.16)" stroke-width="1" />

    
    <g transform="translate(20, 138)">
      <text x="0" y="14" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12.5" font-weight="700" fill="#4f5d75">🛡️ 工业生产标准架构：幂等键（Idempotency Key）状态机收敛</text>

      
      <g transform="translate(0, 26)">
        
        <rect x="0" y="0" width="275" height="100" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="14" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142">1. 唯一索引表排重 (Unique Key)</text>
        <text x="14" y="42" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#2d3142">• 请求携带 `Idempotency-Key: uuid`</text>
        <text x="14" y="60" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#2d3142">• 数据库执行 `INSERT ... ON DUPLICATE`</text>
        <text x="14" y="78" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" font-weight="700" fill="#2d3142">👉 27 次重试仅第 1 次成功插入执行！</text>

        
        <rect x="290" y="0" width="275" height="100" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="304" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142">2. 状态机快速重放 (Playback)</text>
        <text x="304" y="42" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#2d3142">• 记录状态：`PROCESSING | SUCCESS`</text>
        <text x="304" y="60" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#2d3142">• 终态后到达的重试直接返回缓存响应</text>
        <text x="304" y="78" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" font-weight="700" fill="#4f5d75">👉 重试蜕化为只读查询，0 业务副作用</text>

        
        <rect x="580" y="0" width="280" height="100" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="594" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142">3. 重试退避与重试预算 (Budget)</text>
        <text x="594" y="42" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#4f5d75">• 指数退避 + Full Jitter 随机抖动打散</text>
        <text x="594" y="60" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" fill="#4f5d75">• 限制全局重试请求占正常流量 ≤ 10%</text>
        <text x="594" y="78" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="11" font-weight="700" fill="#4f5d75">👉 彻底根除共振雪崩与级联超时！</text>
      </g>
    </g>

    
    <g transform="translate(20, 280)">
      <rect width="860" height="38" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
      <text x="430" y="24" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600" fill="#4f5d75" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#2d3142">核心结论：</tspan> 网络不可靠是物理常态；任何非幂等写接口（扣款、下单、发货）在未设计幂等键之前，<tspan font-weight="700" fill="#4f5d75">绝对禁止盲目配置自动重试机制</tspan>。
      </text>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
