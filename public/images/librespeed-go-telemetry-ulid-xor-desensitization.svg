<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">LibreSpeed 遥测隐私防护：ULID、IP 掩码脱敏与 XOR 盐值签名</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">128 位 ULID 单调时序主键 ｜ IPv4 末 8 位 / IPv6 后 80 位正则物理抹除 ｜ 异或盐值签名防刷防篡改</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. ULID 高性能主键设计</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 26 字符 Base32 编码 (128-bit)</text>
          <text x="10" y="34" fill="#93c5fd">01ARZ3NDEKTSV4RRFFQ69G5FAV</text>
          <text x="10" y="52" fill="#34d399">1. 前 48-bit: 毫秒级时间戳 (天然单调递增)</text>
          <text x="10" y="68" fill="#34d399">2. 后 80-bit: 密码学安全随机熵</text>
          <text x="10" y="90" fill="#4ade80">✓ B-Tree 索引写入 0 页分裂，性能极高！</text>
          <text x="10" y="106" fill="#38bdf8">✓ URL 安全，告别 UUID 短横线冗余</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 遥测记录天然按时间聚集，查询极速；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 避免自增 ID 暴露总测速次数商业机密；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 完美适配分库分表与全球分布式写入！</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. GDPR 级别 IP 正则脱敏</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// IPv4 末 8 位掩码清除</text>
          <text x="10" y="34" fill="#86efac">114.247.50.123 ──► 114.247.50.0</text>
          
          <text x="10" y="56" fill="#38bdf8">// IPv6 后 80 位网络掩码物理抹除</text>
          <text x="10" y="72" fill="#cbd5e1">240e:390:xxxx:xxxx:: ──► 240e:390::</text>
          
          <text x="10" y="96" fill="#34d399">✓ 严格遵循欧盟 GDPR 隐私保护合规法案</text>
          <text x="10" y="112" fill="#34d399">✓ 既保留城市/运营商统计，又消除个人定位</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 数据库不存储任何可识别自然人的敏感信息；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 应对数据泄漏安全审查时拥有绝对合规抗辩权；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造安全可信的开源遥测基础设施！</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. XOR 盐值混淆与防刷验签</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 客户端上报 payload XOR 加密</text>
          <text x="10" y="34" fill="#fed7aa">for i := range data {</text>
          <text x="16" y="48" fill="#fed7aa">  data[i] ^= secretSalt[i % len(secretSalt)]</text>
          <text x="10" y="62" fill="#fed7aa">}</text>
          
          <text x="10" y="84" fill="#38bdf8">1. 校验时间戳与 Token 有效期 (120s 窗口)</text>
          <text x="10" y="100" fill="#38bdf8">2. HMAC-SHA256 签名完整性校验</text>
          <text x="10" y="118" fill="#4ade80">✓ 杜绝脚本恶意批量构造虚假 100Gbps 战绩！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 保证大盘排行榜数据真实可信；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 屏蔽低成本爬虫与垃圾数据污染；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 保护数据库存储与后端计算算力。</text>
      </g>
    </g>
  </g>
</svg>