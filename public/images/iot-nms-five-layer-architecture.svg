<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" role="img" aria-labelledby="iot-nms-arch-title iot-nms-arch-desc">
  <title id="iot-nms-arch-title">现代网络设备管理平台（NMS）五层全景架构</title>
  <desc id="iot-nms-arch-desc">展示现代网络设备云平台的五层分工体系：北向开放层、业务编排层、设备影子状态中枢、流式遥测管道以及南向协议接入网关与边缘硬件。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.08)"/></pattern>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#grid-dots)"/>

  <!-- Title block -->
  <text x="40" y="38" fill="#2d3142" font-size="22" font-family="'Instrument Serif', Georgia, serif">网络设备云平台（NMS/IoT Cloud）五层架构全景</text>
  <text x="40" y="60" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">北向开放编排 ── 设备影子数字孪生 ── 异步配置下发 ── 高频流式遥测 ── 南向协议集群</text>

  <!-- Layer 1: Northbound -->
  <rect x="40" y="80" width="880" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="52" y="88" width="160" height="18" rx="3" fill="rgba(45,49,66,0.06)"/>
  <text x="132" y="100" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LAYER 1 · 北向应用与开放层</text>
  <text x="52" y="132" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">运维 Web 控制台 &amp; 移动 App</text>
  <text x="52" y="148" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">设备拓扑可视化 · 配置编排模板 · 告警看板</text>
  <rect x="520" y="92" width="380" height="52" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="536" y="112" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">统一 OpenAPI / GraphQL 网关</text>
  <text x="536" y="132" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">OAuth2 / RBAC 鉴权 · 租户隔离 · 审计跟踪 · 外部 ITSM/ERP 对接</text>

  <!-- Layer 2: Orchestration Engine -->
  <rect x="40" y="176" width="880" height="82" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="52" y="184" width="180" height="18" rx="3" fill="rgba(45,49,66,0.06)"/>
  <text x="142" y="196" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LAYER 2 · 业务编排与配置下发引擎</text>
  
  <rect x="52" y="208" width="260" height="42" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="64" y="226" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">批量配置下发管道 (Config Pipeline)</text>
  <text x="64" y="242" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">YANG 语法校验 · 差异补丁生成 · 灰度批次调度</text>

  <rect x="332" y="208" width="276" height="42" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="344" y="226" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif">RFC 6241 Commit-Confirmed 防变砖</text>
  <text x="344" y="242" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">两阶段提交 · 倒计时守护狗 · 异常自动原路回滚</text>

  <rect x="628" y="208" width="272" height="42" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="640" y="226" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">固件 OTA 调度 &amp; 零配置上线 (ZTP)</text>
  <text x="640" y="242" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">A/B 双分区无损升级 · Option 66/67 即插即用</text>

  <!-- Layer 3: Device Shadow Core -->
  <rect x="40" y="278" width="880" height="82" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <rect x="52" y="286" width="200" height="18" rx="3" fill="rgba(235,108,54,0.12)"/>
  <text x="152" y="298" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LAYER 3 · 核心设备影子与状态中枢</text>

  <rect x="52" y="310" width="260" height="42" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="64" y="328" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Desired State（期望态快照）</text>
  <text x="64" y="344" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">云端声明式目标配置 · 乐观锁递增单调版本号</text>

  <rect x="332" y="310" width="276" height="42" rx="4" fill="rgba(235,108,54,0.06)" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
  <text x="344" y="328" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Delta 增量对账引擎 (Reconciliation)</text>
  <text x="344" y="344" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">三路归并 · 现场带外漂移检测 · 指数退避对账</text>

  <rect x="628" y="310" width="272" height="42" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="640" y="328" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Reported State（汇报态快照）</text>
  <text x="640" y="344" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">物理硬件真实运行状态 · 串口/现场改动反馈</text>

  <!-- Layer 4: Telemetry Pipeline -->
  <rect x="40" y="380" width="880" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="52" y="388" width="180" height="18" rx="3" fill="rgba(45,49,66,0.06)"/>
  <text x="142" y="400" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LAYER 4 · 流式遥测与时序大数据管道</text>

  <rect x="52" y="412" width="260" height="36" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="64" y="430" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">gNMI 毫秒级流式订阅</text>
  <text x="64" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP/2 + Protobuf 高频指标主动推送</text>

  <rect x="332" y="412" width="276" height="36" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="344" y="430" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Kafka / Pulsar 消息总线</text>
  <text x="344" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">海量指标吞吐削峰 · 分区有序解耦消费</text>

  <rect x="628" y="412" width="272" height="36" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="640" y="430" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">VictoriaMetrics / ClickHouse</text>
  <text x="640" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">接口流量 / 丢包 / 光模块功率实时告警</text>

  <!-- Layer 5: Southbound & Edge -->
  <rect x="40" y="476" width="880" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="52" y="484" width="210" height="18" rx="3" fill="rgba(45,49,66,0.06)"/>
  <text x="157" y="496" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LAYER 5 · 南向协议网关与边缘物理设备</text>

  <rect x="52" y="508" width="200" height="46" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="64" y="526" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">南向异构协议适配集群</text>
  <text x="64" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SNMP / CLI / NETCONF / gNMI</text>

  <rect x="272" y="508" width="200" height="46" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="284" y="526" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">C10M 长连接 &amp; 反向隧道</text>
  <text x="284" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Epoll/io_uring · SCM_RIGHTS 热更</text>

  <rect x="492" y="508" width="408" height="46" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="504" y="526" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">边缘硬件节点 (CPE / Switches / APs / Gateways)</text>
  <text x="504" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">NAT 穿透 · TPM 2.0 根信任 · A/B 分区守护 · Linux PTY 虚拟终端</text>

  <!-- Connectors -->
  <line x1="480" y1="156" x2="480" y2="176" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="258" x2="480" y2="278" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="480" y1="360" x2="480" y2="380" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="456" x2="480" y2="476" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>

  <!-- Footer indicator -->
  <text x="40" y="596" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">物理铁律：控制面与数据面严格解耦；配置以云端设备影子（Desired/Reported）为真理中枢；任何网络改动必须具备防变砖回滚机制。</text>
</svg>
