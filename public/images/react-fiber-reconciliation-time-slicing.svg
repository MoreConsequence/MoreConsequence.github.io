<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">React 16+ Fiber 架构：递归栈调度 vs 可中断单向链表时间切片</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">React 15 递归不可中断 (阻塞主线程 200ms) vs Fiber child/sibling/return 双向遍历 (每 5ms 让出主线程响应输入)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ React 15 栈调和器 (Stack Reconciler)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 递归遍历整棵虚拟 DOM 树</text>
          <text y="28" fill="#fca5a5">function diff(node) {</text>
          <text y="42" fill="#ef4444">  node.children.forEach(c =&gt; diff(c));</text>
          <text y="56" fill="#f87171">}</text>
          
          <text y="80" fill="#ef4444">🔴 致命缺陷：</text>
          <text y="94" fill="#ef4444">• 递归依赖 JS 执行栈，一旦启动绝无法中途暂停！</text>
          <text y="108" fill="#ef4444">• 大型组件树 Diff 耗时 150ms，完全冻结主线程！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 用户在输入框打字出现极其明显的按键延迟卡顿；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 动画发生严重掉帧；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法支撑超大型企业级 SPA 复杂度！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ React 16+ Fiber 链表时间切片</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 将树改造成单向链表: child / sibling / return</text>
          <text y="28" fill="#86efac">while (workInProgress &amp;&amp; !shouldYield()) {</text>
          <text y="42" fill="#86efac">  workInProgress = performUnitOfWork(workInProgress);</text>
          <text y="56" fill="#4ade80">}</text>
          
          <text y="78" fill="#38bdf8">1. 每次处理单个 Fiber 节点，检查 5ms 时间片预算</text>
          <text y="92" fill="#34d399">2. 收到用户高优先输入时立即暂停让出主线程！</text>
          <text y="106" fill="#4ade80">3. 闲置时自动继续完成剩余 Diff，保证 0 掉帧！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 相当于前端领域的协作式多任务操作系统；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 完美平衡后台重渲染与前台极致响应性；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 奠定现代 Web 交互流畅度的工业基石！</text>
      </g>
    </g>
  </g>
</svg>