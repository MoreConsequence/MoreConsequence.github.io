<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="optimistic-cas-retry-loop-model-title optimistic-cas-retry-loop-model-desc"><title id="optimistic-cas-retry-loop-model-title">乐观锁 CAS 自旋重试与 ABA 问题防御：version 版本号校验模型</title><desc id="optimistic-cas-retry-loop-model-desc">流程状态图展示乐观锁利用版本号 version 执行原子条件更新判定影响行数并进行自旋重试与退避的全流程机制。</desc>
  <defs>
    <marker id="ca-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="ca-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
    </marker>
  </defs>

  
  <rect width="960" height="600" fill="#f5f5f5" />

  
  <text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">OPTIMISTIC CONCURRENCY · CAS RETRY LOOP &amp; ABA DEFENSE</text>
  <text x="40" y="84" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">乐观锁 CAS 自旋重试与版本号校验模型</text>
  <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">读取快照版本 (v=1) ➔ 本地业务计算 ➔ 原子条件更新 (WHERE version=1) ➔ affected_rows (1=成功 / 0=冲突自旋重试)</text>

  
  
  <g transform="translate(40, 136)">
    <rect width="205" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="12" y="12" width="70" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="47" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STEP 1</text>
    <text x="90" y="26" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">快照版本读取</text>

    
    <rect x="12" y="42" width="181" height="110" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="62" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">SELECT balance, version</text>
    <text x="20" y="78" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">FROM acc WHERE id=1;</text>
    <text x="20" y="98" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">balance = 100, v = 1</text>
    <text x="20" y="116" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">普通快照读，0 锁开销</text>
    <text x="20" y="132" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Zero Blocking Overhead</text>

    
    <rect x="12" y="162" width="181" height="148" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="184" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">阶段特征：</text>
    <text x="20" y="204" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 不阻塞任何并发读写；</text>
    <text x="20" y="222" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 记录初始版本号 v_old=1；</text>
    <text x="20" y="240" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 为后续 CAS 校验设立基准。</text>
    <line x1="20" y1="254" x2="185" y2="254" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
    <text x="20" y="274" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Baseline Version Captured</text>
    <text x="20" y="292" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Non-Locking Read</text>
  </g>

  
  <text x="255" y="222" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Calc</text>
  <line x1="245" y1="230" x2="265" y2="230" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ca-arr-accent)" />

  
  <g transform="translate(265, 136)">
    <rect width="215" height="376" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <rect x="12" y="12" width="70" height="18" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="47" y="25" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STEP 2</text>
    <text x="90" y="26" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">内存业务计算</text>

    
    <rect x="12" y="42" width="191" height="110" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="62" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">应用层计算新状态：</text>
    <text x="20" y="80" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">new_bal = 100 - 10 = 90</text>
    <text x="20" y="98" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">v_new = v_old + 1 = 2</text>
    <text x="20" y="116" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">版本号严格单调递增</text>
    <text x="20" y="132" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">Defend Against ABA Bug</text>

    
    <rect x="12" y="162" width="191" height="148" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="184" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">ABA 防御原理：</text>
    <text x="20" y="204" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 即使余额从 100➔50➔100；</text>
    <text x="20" y="222" fill="#eb6c36" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• version 也从 1➔2➔3 永不倒退；</text>
    <text x="20" y="240" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 杜绝虚假一致性！</text>
    <line x1="20" y1="254" x2="195" y2="254" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
    <text x="20" y="274" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Monotonic Version Counter</text>
    <text x="20" y="292" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Zero State Confusion</text>
  </g>

  
  <text x="490" y="222" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CAS</text>
  <line x1="480" y1="230" x2="500" y2="230" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ca-arr-accent)" />

  
  <g transform="translate(500, 136)">
    <rect width="225" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="12" y="12" width="76" height="18" rx="2" fill="#eb6c36" />
    <text x="50" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STEP 3 · CORE</text>
    <text x="96" y="26" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">原子条件更新</text>

    
    <rect x="12" y="42" width="201" height="110" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="20" y="62" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">UPDATE acc SET</text>
    <text x="20" y="76" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">balance=90, version=2</text>
    <text x="20" y="92" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">WHERE id=1 AND version=1;</text>
    <text x="20" y="112" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">InnoDB 瞬时行锁执行原子判断</text>
    <text x="20" y="130" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Atomic Compare-And-Swap</text>

    
    <rect x="12" y="162" width="201" height="148" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="184" fill="#2d3142" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">原子性物理保障：</text>
    <text x="20" y="204" fill="#4f5d75" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 单条 UPDATE 自动持瞬时行锁；</text>
    <text x="20" y="222" fill="#eb6c36" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 按当前物理最新值校验 version；</text>
    <text x="20" y="240" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 任何并发写绝对无法插队！</text>
    <line x1="20" y1="254" x2="205" y2="254" stroke="#eb6c36" stroke-width="1.2" />
    <text x="20" y="274" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">Hardware-Level Atomicity</text>
    <text x="20" y="292" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Zero Dirty Overwrite</text>
  </g>

  
  <text x="735" y="222" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Branch</text>
  <line x1="725" y1="230" x2="745" y2="230" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ca-arr-accent)" />

  
  <g transform="translate(745, 136)">
    <rect width="175" height="376" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
    <rect x="12" y="12" width="70" height="18" rx="2" fill="#2d3142" />
    <text x="47" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STEP 4</text>
    <text x="90" y="26" fill="#2d3142" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">结果分支判定</text>

    
    <rect x="12" y="42" width="151" height="90" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
    <text x="20" y="62" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">affected_rows == 1</text>
    <text x="20" y="78" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">✓ 提交成功！</text>
    <text x="20" y="94" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">COMMIT &amp; Return OK</text>
    <text x="20" y="110" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Latency: ~1 DB RTT</text>

    
    <rect x="12" y="142" width="151" height="218" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
    <text x="20" y="164" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">affected_rows == 0</text>
    <text x="20" y="182" fill="#eb6c36" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">✗ 版本冲突！</text>
    <text x="20" y="200" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 回滚当前局部事务；</text>
    <text x="20" y="218" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">2. 指数退避 (Exponential Backoff)；</text>
    <text x="20" y="236" fill="#2d3142" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 重新跳转 Step 1！</text>
    <line x1="20" y1="248" x2="155" y2="248" stroke="#eb6c36" stroke-width="1.2" />
    <text x="20" y="268" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" font-weight="700">Max Retries: 3 ~ 5</text>
    <text x="20" y="284" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">Livelock Circuit Breaker</text>
  </g>

  
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" />
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="502.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
  <text x="140" y="514.0" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">快照读取与本地计算</text>
  <rect x="310" y="502.0" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" />
  <text x="330" y="514.0" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">原子 CAS UPDATE 与冲突自旋退避判定核心</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
