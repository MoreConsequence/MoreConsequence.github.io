<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Viper 配置加载优先级阶梯 (Configuration Precedence Ladder)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">CLI 命令行标志 (Flag) ──► OS 环境变量 (Env: SPEEDTEST_*) ──► 配置文件 (config.toml) ──► 内存编译期默认值 (Hardcoded Defaults)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 最高优：CLI 显式命令行标志 (Explicit Command Flags: Priority 1)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">./speedtest --bind-address 0.0.0.0 --port 8989 --telemetry-level full</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">终端启动参数拥有最高覆盖权，适合运维单次手动干预与调试！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 次高优：容器与云原生环境变量 (Cloud-Native Env: SPEEDTEST_*)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">export SPEEDTEST_PORT=8989 | export SPEEDTEST_DB_TYPE=postgresql</text>
        <text x="15" y="62" font-size="8" fill="#047857">12-Factor App 云原生黄金准则，无缝对接 Kubernetes ConfigMap / Secret！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 常规层：TOML / YAML 配置文件 (config.toml)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">从当前目录或 /etc/speedtest/config.toml 读取结构化系统配置</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">集中管理数百个细分参数，易于 Git 审计与版本化维护！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 兜底层：编译期硬编码默认值 (Zero-Config Sensible Defaults)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">viper.SetDefault("server.port", 8989) ──► 0 外部配置时依然能安全稳定启动！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">保证系统开箱即用（Out-of-the-Box）的极佳工程体验！</text>
      </g>
    </g>
  </g>
</svg>