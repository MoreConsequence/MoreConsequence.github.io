<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="viper-precedence-title viper-precedence-desc">
      <title id="viper-precedence-title">Viper 实际接入的配置优先级</title>
      <desc id="viper-precedence-desc">Layer stack showing the application-wired environment, config-file, and default sources, while marking generic Viper CLI flags as not bound by this application.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="viper-precedence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="viper-precedence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>
      <text x="40" y="32" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" font-weight="500" letter-spacing="0.18em">CONFIGURATION SURFACE · V1.10.1</text>
      <text x="40" y="60" fill="#2d3142" font-family="'Instrument Serif', 'Songti SC', serif" font-size="20">应用实际接入的 effective sources</text>
      <text x="40" y="88" fill="#4f5d75" font-family="'Geist', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12">向上优先级更高；虚线层是 Viper 的库能力，不是这个 commit 的配置值 wiring。</text>
      <text x="40" y="128" fill="#7a8399" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" letter-spacing="0.12em">HIGHER PRECEDENCE ↑</text>
      <text x="40" y="420" fill="#7a8399" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" letter-spacing="0.12em">LOWER PRECEDENCE</text>

      <!-- Output connector before the stack and result node -->
      <path d="M480 400 V440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#viper-precedence-arrow)"/>
      <rect x="496" y="412" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="420" fill="#7a8399" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="middle">UNMARSHAL</text>
      <path d="M80 392 V156" fill="none" stroke="#7a8399" stroke-width="1" marker-end="url(#viper-precedence-arrow)"/>

      <!-- Four layers, same width and height -->
      <rect x="112" y="144" width="736" height="64" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="132" y="164" width="48" height="20" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="156" y="176" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="middle">LIB</text>
      <text x="204" y="184" fill="#2d3142" font-family="'Geist', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600">CLI flags</text>
      <text x="824" y="176" fill="#7a8399" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="end">Viper capability only</text>
      <text x="824" y="192" fill="#7a8399" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="end">no BindPFlag in app</text>

      <rect x="112" y="208" width="736" height="64" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="132" y="228" width="48" height="20" rx="4" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="156" y="240" fill="#eb6c36" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="middle">APP</text>
      <text x="204" y="248" fill="#2d3142" font-family="'Geist', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600">环境变量</text>
      <text x="824" y="240" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="end">SPEEDTEST_&lt;KEY&gt; · AutomaticEnv()</text>
      <text x="824" y="256" fill="#7a8399" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="end">matched key</text>

      <rect x="112" y="272" width="736" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <rect x="132" y="292" width="48" height="20" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="156" y="304" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="middle">APP</text>
      <text x="204" y="312" fill="#2d3142" font-family="'Geist', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600">配置文件</text>
      <text x="824" y="304" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="end">settings.toml · ReadInConfig()</text>
      <text x="824" y="320" fill="#7a8399" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="end">-c selects file path</text>

      <rect x="112" y="336" width="736" height="64" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <rect x="132" y="356" width="48" height="20" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="156" y="368" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="middle">APP</text>
      <text x="204" y="376" fill="#2d3142" font-family="'Geist', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600">编译默认值</text>
      <text x="824" y="368" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="end">SetDefault(...)</text>
      <text x="824" y="384" fill="#7a8399" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="end">listen_port=8989 · database_type=postgresql</text>

      <!-- Effective Config result -->
      <rect x="352" y="440" width="256" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="460" fill="#2d3142" font-family="'Geist', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" text-anchor="middle">Config struct</text>
      <text x="480" y="476" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="middle">viper.Unmarshal(&amp;conf)</text>

      <!-- Horizontal legend strip -->
      <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="548" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" font-weight="500" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="536" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="168" y="548" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8">APP-WIRED SOURCE</text>
      <line x1="316" y1="544" x2="348" y2="544" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="360" y="548" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8">LIBRARY CAPABILITY / NOT WIRED</text>
      <text x="900" y="548" fill="#7a8399" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" text-anchor="end">SOURCE: config.go @ 59cff12 · Viper 1.10.1</text>
    </svg>
