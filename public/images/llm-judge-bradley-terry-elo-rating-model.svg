<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Bradley-Terry 概率胜率模型与 Elo 天梯积分演进</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">P(A wins B) = 1 / (1 + 10^((R_B - R_A)/400)) ｜ 最大似然估计 (MLE) 消除初值敏感，输出绝对能力天梯分</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 两两盲测对决 (Pairwise Battle)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 盲测输入统一 Prompt</text>
          <text x="10" y="34" fill="#93c5fd">Model A vs Model B</text>
          <text x="10" y="50" fill="#86efac">Judge 裁定: Model A 胜出 (Win)</text>
          
          <text x="10" y="74" fill="#4ade80">1. 生成对决胜负矩阵</text>
          <text x="10" y="90" fill="#4ade80">2. 累计万场战斗历史</text>
          <text x="10" y="108" fill="#34d399">✓ 摆脱绝对打分的主观刻度漂移！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 比单纯打 1~10 分更加符合人类心智直觉；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 易于收集海量相对排序数据；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造稳固的输入样本。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Bradley-Terry 数学拟合 (MLE)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 似然函数最大化求解</text>
          <text x="10" y="34" fill="#86efac">L(p) = ∏ [p_i / (p_i + p_j)]^w_ij</text>
          
          <text x="10" y="58" fill="#38bdf8">1. 凸优化 Logistic 回归求解参数</text>
          <text x="10" y="74" fill="#34d399">2. 将胜率转化为全局标量潜变量</text>
          <text x="10" y="92" fill="#4ade80">3. 无论对阵次序如何，结果收敛一致！</text>
          <text x="10" y="110" fill="#4ade80">✓ 消除配对顺序偏差！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 具备坚实的统计学数学证明；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 国际象棋与竞技体育顶级同款算法；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造公信力权威基准。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 连续天梯排位 (Elo Score)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 映射至 0~1400 标准天梯分</text>
          <text x="10" y="34" fill="#fed7aa">Elo = 1000 + 400 * log10(p_i / p_base)</text>
          
          <text x="10" y="58" fill="#38bdf8">• 1320 分: Claude 3.5 Sonnet</text>
          <text x="10" y="74" fill="#38bdf8">• 1315 分: DeepSeek-V3</text>
          <text x="10" y="90" fill="#38bdf8">• 1310 分: GPT-4o</text>
          
          <text x="10" y="112" fill="#34d399">✓ 胜率差 100 分代表胜率达到 64%！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 持续动态纳新模型参赛；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 直观反映代际模型性能断层；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 全球大模型竞技场的核心灵魂！</text>
      </g>
    </g>
  </g>
</svg>