<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">管理面安全认证体系：/stats 会话状态机与防暴力破解设计</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">密码校验 ──► 生成安全 Session Cookie (HttpOnly, SameSite=Strict) ──► 内存会话校验 ──► 访问速率限制防爆破</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 裸 Basic Auth 漏洞：明文与重放风险</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">Header: Authorization: Basic YWRtaW46cGFzc3dvcmQ=</text>
          
          <text y="38" fill="#ef4444">🔴 致命隐患：</text>
          <text y="54" fill="#fca5a5">1. Base64 属于公开可逆编码，无加密保护</text>
          <text y="70" fill="#ef4444">2. 每次请求重复发送账号密码，极易被中间代理嗅探！</text>
          <text y="86" fill="#ef4444">3. 无法主动失效，登出必须关闭整个浏览器窗口！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">安全危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 管理面板易遭受撞库与凭证泄露；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 遥测历史数据面临未授权脱库风险；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须引入受保护的会话机制！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Session Token + HttpOnly 铁壁防护</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 登录成功设置加密 Session Cookie</text>
          <text y="28" fill="#86efac">Set-Cookie: session=rnd_9a8b7c6; HttpOnly; SameSite=Strict</text>
          
          <text y="50" fill="#38bdf8">1. XSS 脚本 100% 无法读取 document.cookie</text>
          <text y="66" fill="#34d399">2. 密码经过 bcrypt 哈希比对，内存中永不存明文</text>
          <text y="82" fill="#34d399">3. 连续失败 5 次自动锁定 IP 15 分钟！</text>
          
          <text y="108" fill="#4ade80">✓ 兼具轻量级独立部署与金融级防爆破能力！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 纯标准库实现，0 外部重型认证中间件依赖；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑全球边缘测速节点的去中心化安全管理；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚固的安全防护工程！</text>
      </g>
    </g>
  </g>
</svg>