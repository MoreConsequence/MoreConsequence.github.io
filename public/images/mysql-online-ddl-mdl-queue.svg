<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL Online DDL 元数据锁 (MDL) 排队与连接池打满雪崩机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">长事务持有 MDL Read 锁 ──► ALTER 申请 MDL X 锁排队 ──► 阻塞后续所有普通 SELECT，瞬间击垮数据库</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Queue Conveyor (860px) -->
    <g transform="translate(20, 20)">
      <rect width="860" height="175" rx="6" fill="#0f172a"/>
      <text x="15" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">
        MySQL MDL 锁队列状态机 (MDL Lock Queue):
      </text>

      <!-- 4 Stages -->
      <g transform="translate(15, 45)" font-family="ui-sans-serif, system-ui, sans-serif">
        <!-- Stage 1: Active Slow Query -->
        <rect width="190" height="105" rx="4" fill="#1e293b" stroke="#3b82f6"/>
        <text x="10" y="20" font-size="9" font-weight="700" fill="#60a5fa">① 未提交慢查询 (Session 1)</text>
        <text x="10" y="38" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">SELECT * FROM orders ...</text>
        <text x="10" y="56" font-size="7.5" fill="#93c5fd">状态：执行中 / 未提交</text>
        <text x="10" y="74" font-size="7.5" font-weight="700" fill="#34d399">持有：MDL 共享读锁 (SHARED_READ)</text>

        <!-- Stage 2: ALTER Waiting -->
        <g transform="translate(205, 0)">
          <rect width="200" height="105" rx="4" fill="#3b0764" stroke="#f43f5e"/>
          <text x="10" y="20" font-size="9" font-weight="700" fill="#fb7185">② ALTER TABLE (Session 2)</text>
          <text x="10" y="38" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">ALTER TABLE orders ADD col...</text>
          <text x="10" y="56" font-size="7.5" fill="#fca5a5">申请：MDL 排他锁 (EXCLUSIVE)</text>
          <text x="10" y="74" font-size="7.5" font-weight="700" fill="#ef4444">状态：Blocked (等待 Session 1 释放)</text>
        </g>

        <!-- Stage 3: Subsequent Queries Blocked -->
        <g transform="translate(420, 0)">
          <rect width="405" height="105" rx="4" fill="#450a0a" stroke="#ef4444"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#f87171">③ 后续所有线上普通查询 (Session 3 ~ 1000)</text>
          <text x="10" y="38" font-family="ui-monospace, monospace" font-size="7.5" fill="#fca5a5">SELECT * FROM orders WHERE id = 123;</text>
          <text x="10" y="56" font-size="7.5" fill="#fca5a5">MDL 规则：写锁优先级高于读锁！</text>
          <text x="10" y="74" font-size="8" font-weight="700" fill="#ef4444">全部被挂起在 MDL 队列后面，连接数瞬间从 50 飙升到 2000+！</text>
        </g>
      </g>
    </g>

    <!-- Bottom Guidance (860px) -->
    <g transform="translate(20, 210)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="100" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="15" y="22" font-size="10.5" font-weight="700" fill="#166534">🛠️ 生产环境 Online DDL 防死锁与安全三定律：</text>
      <text x="15" y="42" font-size="8.5" fill="#15803d">1. <tspan font-weight="700">显式设置锁超时</tspan>：执行 DDL 前设置 lock_wait_timeout = 5（超时自动失败，绝不排队挂死全表）；</text>
      <text x="15" y="60" font-size="8.5" fill="#15803d">2. <tspan font-weight="700">前置检查长事务</tspan>：在 information_schema.innodb_trx 中确认当前没有任何正在执行超过 10 秒的长事务；</text>
      <text x="15" y="78" font-size="8.5" fill="#15803d">3. <tspan font-weight="700">大表采用第三方工具</tspan>：超过 1000 万行核心大表使用 gh-ost 或 pt-online-schema-change 异步影子表搬运。</text>
    </g>
  </g>
</svg>