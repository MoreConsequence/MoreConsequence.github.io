<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 内核四大核心子系统职责边界与交互矩阵</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. Session Manager (会话与事件溯源) ｜ 2. Model Router (智能多模型路由) ｜ 3. Tool Executor (契约调度) ｜ 4. Sandbox Driver (硬件隔离)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Session Manager</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">状态管理与持久化：</text>
          
          <text x="8" y="38" fill="#86efac">• Append-only JSONL 日志</text>
          <text x="8" y="54" fill="#38bdf8">• 状态投影与分支分叉</text>
          <text x="8" y="70" fill="#34d399">• 时光机秒级回退与恢复</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 数据的唯一事实来源！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 严格事件驱动；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 内存状态 100% 可重现；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 抗崩溃核心。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Model Router</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">模型路由与自愈：</text>
          
          <text x="8" y="38" fill="#86efac">• 提示词前缀缓存对齐</text>
          <text x="8" y="54" fill="#38bdf8">• 跨厂商 429 自动漂移</text>
          <text x="8" y="70" fill="#34d399">• 多级模型性价比路由</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 算力资源调配大脑！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 统一流式 SSE 协议；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 99.99% 持续高可用；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 成本降低 85%。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Tool Executor</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">工具契约与防护：</text>
          
          <text x="8" y="38" fill="#fed7aa">• JSON Schema 强类型校验</text>
          <text x="8" y="54" fill="#38bdf8">• 超长输出 Head-Tail 截断</text>
          <text x="8" y="70" fill="#4ade80">• 扩展钩子生命周期拦截</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 能力派发中枢！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 防御非法参数注入；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 保持上下文高信息密度；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 健壮执行中枢。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. Sandbox Driver</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">物理环境安全执行：</text>
          
          <text x="8" y="38" fill="#e9d5ff">• Bubblewrap 内核级命名空间</text>
          <text x="8" y="54" fill="#38bdf8">• 只读根文件系统挂载</text>
          <text x="8" y="70" fill="#4ade80">• 封锁出站网络杜绝外泄</text>
          
          <text x="8" y="100" fill="#4ade80">✓ 坚不可摧的物理盾牌！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">安全底线：</text>
        <text x="10" y="34" font-size="7.5" fill="#6b21a8">• 保护宿主系统绝对安全；</text>
        <text x="10" y="48" font-size="7.5" fill="#6b21a8">• 捕获真实测试铁证数据；</text>
        <text x="10" y="62" font-size="7.5" fill="#6b21a8">• 工业级基石！</text>
      </g>
    </g>
  </g>
</svg>