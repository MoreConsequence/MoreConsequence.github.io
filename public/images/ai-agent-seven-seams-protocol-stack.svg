<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AI Agent 分布式架构：七条系统接缝与协议分层模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">接缝 1: 模型传输协议 ｜ 接缝 2: 上下文裁剪预算 ｜ 接缝 3: 工具沙箱隔离 ｜ 接缝 4: 状态持久化与可审计重放</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">接缝 1 &amp; 2: 模型调用层与 Token 预算闸门 (Model Gateway &amp; Budget Control)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Client Prompt ──► [预算熔断/前缀缓存优化] ──► LLM API (OpenAI/Anthropic)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">流式 SSE 协议消费、TTFT 首字延迟控制、Prompt Cache 命中率监控，消除模型协议碎片化！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">接缝 3 &amp; 4: 上下文编排状态机与多轮会话压缩 (Context &amp; State Machine)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">[Memory Buffer] ──► [动态摘要/向量召回/滑动窗口] ──► Agent 状态机循环</text>
        <text x="15" y="62" font-size="8" fill="#047857">严格的确定性有限状态机 (FSM)，会话压缩消除长尾爆炸，会话状态在分布式节点间无缝漂移！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">接缝 5 &amp; 6: 工具调用 (Tool Calling) 契约与沙箱安全隔离 (Sandbox &amp; Side-effects)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">Tool Call Request ──► [Schema 校验/权限白名单] ──► [gRPC/Wasm 沙箱执行] ──► 结构化自愈回传</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">工具副作用 Saga 事务补偿、超时硬中断、结构化错误引导模型自愈，杜绝盲目死循环！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">接缝 7: 可观测性与确定性全链路回放 (Audit Trail &amp; Time Travel)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">[OpenTelemetry TraceID] ──► 完整 Logit/Token/工具输入输出落盘 ──► 离线单步 Debug</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">每一轮推理决策形成不可篡改的事件溯源 (Event Sourcing) 日志，支撑百万级生产合规审计！</text>
      </g>
    </g>
  </g>
</svg>