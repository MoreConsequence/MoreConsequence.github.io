<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">TypeScript 工程生态分工：包管理器 ──► 类型检查器 ──► 极速转译/打包器</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">pnpm (硬链接依赖拓扑) ｜ tsc (官方唯一真实类型检查) ｜ SWC / ESBuild (Go/Rust 编写 100x 极速转译) ｜ Vite (开发实时热更)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 3 Horizontal Columns (270px each) -->
    <g transform="translate(20, 20)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Col 1 -->
      <rect width="270" height="345" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <rect width="270" height="30" rx="6" fill="#dcfce7"/>
      <text x="135" y="20" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">1. 依赖管理层 (Package Manager)</text>

      <g transform="translate(12, 42)" font-size="8">
        <text y="14" font-weight="700" fill="#166534">• pnpm / npm / yarn</text>
        <text y="30" fill="#334155">职责：解析 semver 版本号，下载 npm 依赖，生成 lockfile 锁定文件；</text>
        <text y="50" font-weight="700" fill="#15803d">pnpm 核心优势：</text>
        <text y="68" fill="#334155">• 全局内容寻址存储 (CAS)，硬链接节约 70% 磁盘；</text>
        <text y="86" fill="#334155">• 严格非扁平 node_modules，根治幽灵依赖 (Phantom Dependency)！</text>
      </g>

      <!-- Col 2 -->
      <g transform="translate(290, 0)">
        <rect width="270" height="345" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
        <rect width="270" height="30" rx="6" fill="#dbeafe"/>
        <text x="135" y="20" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">2. 类型校验层 (Type Checker)</text>

        <g transform="translate(12, 42)" font-size="8">
          <text y="14" font-weight="700" fill="#1e40af">• tsc --noEmit</text>
          <text y="30" fill="#334155">职责：全量 AST 语法分析，推导泛型与类型体操，生成 .d.ts 类型声明；</text>
          <text y="50" font-weight="700" fill="#1d4ed8">权威定位：</text>
          <text y="68" fill="#334155">• 目前全球唯一完整的 TS 类型检查器；</text>
          <text y="86" fill="#334155">• 在 CI/CD 流水线中作为质量守门员，保证类型 100% 零错误！</text>
        </g>
      </g>

      <!-- Col 3 -->
      <g transform="translate(580, 0)">
        <rect width="280" height="345" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
        <rect width="280" height="30" rx="6" fill="#ffedd5"/>
        <text x="140" y="20" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">3. 转译与打包层 (Bundler &amp; Transpiler)</text>

        <g transform="translate(12, 42)" font-size="8">
          <text y="14" font-weight="700" fill="#c2410c">• Vite / ESBuild / SWC / Turbopack</text>
          <text y="30" fill="#334155">职责：直接抹除类型注解 (Type Strip)，转译 JSX/TS 为纯 JS，Tree Shaking 摇树并打包；</text>
          <text y="50" font-weight="700" fill="#9a3412">极速构建：</text>
          <text y="68" fill="#334155">• 用 Go / Rust 编写，构建速度比 tsc 快 20 ~ 100 倍；</text>
          <text y="86" fill="#334155">• 开发时毫秒级热更新 (HMR)，打造丝滑开发体验！</text>
        </g>
      </g>
    </g>
  </g>
</svg>