<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 三索引切片 (Full Slice Expression: s[i:j:k]) 边界约束模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">二索引 s[i:j] (cap 默认延伸至原切片末尾，append 容易踩踏原数组) vs 三索引 s[i:j:k] (严格限制 cap = k - i，append 强制触发新内存分配)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: 2-index bug -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 二索引切片：cap 泄漏引发后续踩踏</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">raw := []int{10, 20, 30, 40, 50} // len=5, cap=5</text>
          <text y="28" fill="#f87171">sub := raw[0:2]                   // len=2, cap=5！</text>
          
          <text y="50" fill="#ef4444">下游函数 append 操作：</text>
          <text y="64" fill="#ef4444">sub = append(sub, 999)</text>
          <text y="78" fill="#ef4444">• 因为 cap(sub)=5 &gt; len(sub)=2，无需扩容！</text>
          <text y="92" fill="#f87171">• 直接覆盖 raw[2] 处的 30 ──► 原数据被恶意破坏！</text>
          
          <text y="116" fill="#f87171">🔴 极其隐蔽的数据越界篡改！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 子函数副作用逆向污染父函数上下文；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 多协程并发传递时必然触发 data race；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• Go 语言最经典的切片陷阱！</text>
      </g>
    </g>

    <!-- Right: 3-index fix -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 三索引切片：严格限定 cap 强制内存隔离</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">raw := []int{10, 20, 30, 40, 50}</text>
          <text y="28" fill="#86efac">sub := raw[0:2:2] // len = 2-0 = 2, cap = 2-0 = 2！</text>
          
          <text y="50" fill="#38bdf8">下游函数 append 操作：</text>
          <text y="64" fill="#34d399">sub = append(sub, 999)</text>
          <text y="78" fill="#34d399">• runtime 发现 cap(sub)=2 已满，必须触发 growslice！</text>
          <text y="92" fill="#4ade80">• 自动为 sub 分配全新的底层数组，raw 保持完好！</text>
          
          <text y="116" fill="#4ade80">✓ 严格物理隔离，0 数据污染风险！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 向外部第三方函数暴露子切片时的第一防线；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 兼具零拷贝读取与写入绝对安全；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 资深系统工程师必备规范！</text>
      </g>
    </g>
  </g>
</svg>