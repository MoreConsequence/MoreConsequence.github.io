<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL 主从复制拓扑与 GTID 延迟水位线量化 (Replication Watermark)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Master (GTID: 1~100) ──► I/O Thread 写入 Relay Log (GTID: 1~95) ──► SQL Applier Thread 回放 (GTID: 1~80) ──► 延迟 20 个事务</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 主库事务提交与 Binlog 生成 (Master Executed_Gtid_Set: 1~100)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">主库写入完成 ──► Binlog Dump 线程将数据包通过 TCP Socket 发送给从库</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">主库的当前最新全局事务状态水位线！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 从库 I/O 线程网络接收 (Slave Retrieved_Gtid_Set: 1~95)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">从库 I/O 线程将收到的日志顺序写入中继日志 (Relay Log) ──► 产生网络传输延迟 (5 个事务)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">跨机房或公网专线抖动引发的接收排队！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">3. 从库 SQL 线程回放堵塞 (Slave Executed_Gtid_Set: 1~80)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">SQL 单线程或多线程回放慢 SQL / 大事务 ──► 发生严重回放阻塞 (落后 15 个事务)！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">导致 Seconds_Behind_Master 暴涨，读写分离直接读到陈旧历史数据！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 工业级读一致性防御：WAIT_FOR_EXECUTED_GTID_SET</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">写完主库返回 GTID: 100 ──► 读从库前执行等待水位线对齐 ──► 绝对保证 100% 读己所写！</text>
        <text x="15" y="62" font-size="8" fill="#047857">彻底攻克读写分离主从延迟顽疾的终极解法！</text>
      </g>
    </g>
  </g>
</svg>