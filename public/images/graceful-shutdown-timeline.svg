<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" rx="12" fill="#fafbff" stroke="#d7def0"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">SIGTERM 之后:30 秒停机窗口里的四件事</text>

  <rect x="60" y="56" width="780" height="24" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="450" y="73" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">terminationGracePeriodSeconds = 30s(默认)——窗口耗尽,进程被 SIGKILL</text>

  <g font-size="13">
    <rect x="60" y="96" width="160" height="32" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
    <text x="140" y="117" text-anchor="middle" font-weight="700" fill="#7f1d1d">SIGTERM</text>
    <text x="230" y="117" font-size="12.5" fill="#64748b">0s · signal.NotifyContext 收到</text>

    <rect x="60" y="140" width="250" height="56" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="80" y="162" font-weight="600" fill="#3730a3">第 1 步 关闸:停止接收新工作</text>
    <text x="80" y="184" font-size="12" fill="#475569">关闭 listener;keep-alive 上的新请求被拒</text>

    <rect x="330" y="140" width="270" height="56" rx="6" fill="#ecfdf5" stroke="#34d399"/>
    <text x="350" y="162" font-weight="600" fill="#065f46">第 2 步 排空:处理中请求完成</text>
    <text x="350" y="184" font-size="12" fill="#475569">http.Server.Shutdown,预算 10s</text>

    <rect x="620" y="140" width="220" height="56" rx="6" fill="#fefce8" stroke="#facc15"/>
    <text x="640" y="162" font-weight="600" fill="#854d0e">第 3 步 收尾:后台任务结束</text>
    <text x="640" y="184" font-size="12" fill="#475569">worker/队列消费,预算 15s</text>

    <rect x="60" y="212" width="780" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="80" y="234" font-weight="600" fill="#334155">第 4 步 兜底:关闭资源并退出</text>
    <text x="80" y="252" font-size="12" fill="#64748b">数据库连接池、消息队列客户端、flusher——顺序固定,每步给明确预算</text>
  </g>

  <line x1="140" y1="270" x2="140" y2="330" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="292" text-anchor="middle" font-size="11.5" fill="#64748b">30s</text>
  <line x1="140" y1="330" x2="820" y2="330" stroke="#cbd5e1" stroke-width="2.5"/>
  <circle cx="140" cy="330" r="5" fill="#ef4444"/>
  <circle cx="420" cy="330" r="5" fill="#6366f1"/>
  <circle cx="700" cy="330" r="5" fill="#facc15"/>
  <line x1="800" y1="322" x2="800" y2="338" stroke="#ef4444" stroke-width="2.5" marker-end="url(#g-arrow)"/>
  <text x="450" y="356" text-anchor="middle" font-size="12.5" fill="#475569">时间轴:关闸在前,排空与收尾并行,资源关闭最后——任何一步超预算,整个窗口作废</text>

  <rect x="60" y="366" width="780" height="26" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="450" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">预算公式:排空 + 收尾 + 资源关闭 ≤ gracePeriod - 信号抖动余量(建议留 5s)</text>
</svg>
