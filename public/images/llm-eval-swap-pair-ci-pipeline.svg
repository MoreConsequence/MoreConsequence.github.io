<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">双向交换评测 (Swap-Pair Eval) 与 CI/CD 自动化阻断流水线</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">PR 触发 ──► 双向顺序盲测 ──► 一致性校验与 Cohen's Kappa 过滤 ──► 胜率 Elo 结算 ──► 质量门禁阻断</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Step 1: Trigger & Dataset (260px) -->
    <g transform="translate(20, 20)">
      <rect width="260" height="345" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="260" height="30" rx="6" fill="#dbeafe"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">
        1. 黄金测试集采样与模型推理
      </text>

      <g transform="translate(12, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="236" height="50" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1d4ed8">Git PR 触发：修改了 Prompt / 模型</text>
        <text x="10" y="32" font-size="7.5" fill="#64748b">基线 Baseline vs 新候选 Candidate</text>

        <!-- Benchmark Dataset -->
        <g transform="translate(0, 58)">
          <rect width="236" height="150" rx="4" fill="#0f172a"/>
          <text x="10" y="18" font-size="8.5" font-weight="700" fill="#38bdf8">Golden Eval Benchmark (N=500)</text>

          <g transform="translate(8, 28)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
            <rect width="220" height="24" rx="3" fill="#1e293b"/>
            <text x="8" y="16" fill="#93c5fd">• 核心业务事实问答集 (30%)</text>

            <rect y="30" width="220" height="24" rx="3" fill="#1e293b"/>
            <text x="8" y="16" fill="#93c5fd">• 复杂指令遵循与多轮 (25%)</text>

            <rect y="60" width="220" height="24" rx="3" fill="#1e293b"/>
            <text x="8" y="16" fill="#93c5fd">• 安全红线与越狱注入 (25%)</text>

            <rect y="90" width="220" height="24" rx="3" fill="#1e293b"/>
            <text x="8" y="16" fill="#93c5fd">• 工具调用 Schema 稳定性 (20%)</text>
          </g>
        </g>
        <text x="0" y="278" font-size="8" fill="#1e40af">
          • 保证评测集与训练集物理隔离，零数据泄漏
        </text>
      </g>
    </g>

    <!-- Conveyor Arrow 1 -->
    <path d="M 285 210 L 305 210" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <!-- Step 2: Swap-Pair Dual Evaluation (290px) -->
    <g transform="translate(310, 20)">
      <rect width="290" height="345" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="290" height="30" rx="6" fill="#ffedd5"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">
        2. 双向交换 (Swap-Pair) 裁判矩阵
      </text>

      <g transform="translate(12, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <!-- Forward Test -->
        <rect width="266" height="90" rx="4" fill="#ffffff" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#9a3412">正向测试 (Forward Pass):</text>
        <text x="10" y="32" font-size="7.5" fill="#64748b">Prompt 结构: `[Model A: Candidate] vs [Model B: Baseline]`</text>
        <rect x="10" y="42" width="246" height="38" rx="3" fill="#fff7ed"/>
        <text x="16" y="58" font-size="8" fill="#c2410c">裁判打分输出：判定胜者 $W_1 \in \{A, B, \text{Tie}\}$</text>
        <text x="16" y="72" font-size="7.5" fill="#ea580c">附带 Chain-of-Thought (CoT) 详细理由</text>

        <!-- Backward Test -->
        <g transform="translate(0, 98)">
          <rect width="266" height="90" rx="4" fill="#ffffff" stroke="#fed7aa"/>
          <text x="10" y="18" font-size="8.5" font-weight="700" fill="#9a3412">反向测试 (Swapped Pass):</text>
          <text x="10" y="32" font-size="7.5" fill="#64748b">Prompt 结构: `[Model A: Baseline] vs [Model B: Candidate]`</text>
          <rect x="10" y="42" width="246" height="38" rx="3" fill="#fff7ed"/>
          <text x="16" y="58" font-size="8" fill="#c2410c">裁判打分输出：判定胜者 $W_2 \in \{A, B, \text{Tie}\}$</text>
          <text x="16" y="72" font-size="7.5" fill="#ea580c">盲测评估，杜绝裁判模型根据名称偏袒</text>
        </g>

        <rect y="196" width="266" height="60" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">双向裁决判决逻辑：</text>
        <text x="10" y="30" font-size="7.5" fill="#7f1d1d">• 若 $W_1 = \text{Cand}$ 且 $W_2 = \text{Cand}$ ──► 确认 Candidate 胜</text>
        <text x="10" y="44" font-size="7.5" fill="#dc2626">• 若 $W_1 \neq W_2$（出现位置冲突） ──► 强制降级为 Tie 平局！</text>
      </g>
    </g>

    <!-- Conveyor Arrow 2 -->
    <path d="M 605 210 L 625 210" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-emerald)"/>

    <!-- Step 3: Consistency & CI Gate (250px) -->
    <g transform="translate(630, 20)">
      <rect width="250" height="345" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect width="250" height="30" rx="6" fill="#dcfce7"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">
        3. Kappa 一致性与 CI 门禁
      </text>

      <g transform="translate(12, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="226" height="90" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#15803d">Cohen's Kappa 一致性统计：</text>
        <text x="10" y="34" font-family="ui-monospace, monospace" font-size="8" fill="#166534">\kappa = \frac{P_o - P_e}{1 - P_e}</text>
        <text x="10" y="52" font-size="7.5" fill="#047857">• \kappa \ge 0.65: 裁判可信度极高</text>
        <text x="10" y="66" font-size="7.5" fill="#047857">• \kappa &lt; 0.40: 裁判打分失真，告警！</text>
        <text x="10" y="80" font-size="7.5" fill="#15803d">• 结合人工抽检验证一致性</text>

        <!-- CI Quality Gate Card -->
        <g transform="translate(0, 100)">
          <rect width="226" height="150" rx="4" fill="#dcfce7" stroke="#34d399"/>
          <text x="10" y="18" font-size="9" font-weight="700" fill="#065f46">GitHub Actions 门禁判断：</text>

          <g transform="translate(8, 28)" font-size="7.5">
            <rect width="210" height="24" rx="3" fill="#ffffff"/>
            <text x="8" y="16" fill="#15803d">✓ 净胜率 (Win Rate) &gt; 52.0%</text>

            <rect y="30" width="210" height="24" rx="3" fill="#ffffff"/>
            <text x="8" y="16" fill="#15803d">✓ 安全红线用例 Pass Rate = 100%</text>

            <rect y="60" width="210" height="24" rx="3" fill="#fee2e2"/>
            <text x="8" y="16" fill="#dc2626">❌ 回归负向缺陷 (Regressions) = 0</text>
          </g>

          <text x="10" y="128" font-size="8" font-weight="700" fill="#166534">
            状态：✅ PR 合并允许 / ❌ 自动阻断
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
