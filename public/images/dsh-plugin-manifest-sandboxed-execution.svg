<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DSH 插件声明清单 (Plugin Manifest) 与沙箱生命周期</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. manifest.json 声明元数据 ──► 2. 独立 Worker 沙箱拉起 ──► 3. 双向事件流通信 ──► 4. 异常崩溃瞬间熔断自愈</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 静态插件清单描述 (Plugin Manifest: plugin.json)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">严密声明: id, name, version, tools, hooks, permissions (声明只读权限与网络白名单)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">插件生态的标准化注册身份证！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 独立 Worker 隔离进程拉起 (Isolated QuickJS / Node Worker)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">在受限的独立 JavaScript 运行时中实例化插件代码 ──► 剥离 eval() 与原生 require() 权限</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">杜绝恶意第三方插件侵入宿主内存！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 声明式生命周期钩子挂载 (Hook Registration &amp; Interception)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">注册 onMessage, beforeToolExecution 钩子 ──► 在受控通信信道中异步处理事件流</text>
        <text x="15" y="62" font-size="8" fill="#047857">安全可控的扩展点交互机制！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 崩溃熔断与热重载 (Crash Isolation &amp; Zero-Downtime Reload)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">插件代码抛出未捕获异常 ──► 宿主捕获并隔离该插件 ──► 核心 Agent 引擎继续流畅运行！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">开放插件架构的最高可靠性标准！</text>
      </g>
    </g>
  </g>
</svg>