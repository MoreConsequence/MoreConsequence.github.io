<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="es-module-static-analysis-tree-shaking-title es-module-static-analysis-tree-shaking-desc"><title id="es-module-static-analysis-tree-shaking-title">ESM 静态语法分析与死代码消除 (DCE)：构建期 AST 摇树算法</title><desc id="es-module-static-analysis-tree-shaking-desc">ESM 静态语法分析与死代码消除 (DCE)：构建期 AST 摇树算法</desc>
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2d3142" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f5f5f5"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Tree-Shaking 物理机理：ESM 静态分析 vs CommonJS 动态加载破产</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">CommonJS require() 运行时动态执行 (无法摇树，打包全量代码) vs ESM import 编译期确定依赖图 (精准剥离未引用死代码)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ CommonJS 动态模块：摇树彻底失效</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f87171">const module = require(getPath()); // 动态路径！</text>
          <text y="28" fill="#fca5a5">module.exports = { a, b, c, ...allUtils };</text>

          <text y="50" fill="#ef4444">🔴 编译器无法分析：</text>
          <text y="66" fill="#ef4444">1. require 是一个普通运行时函数，可以在 if 分支内调用</text>
          <text y="82" fill="#ef4444">2. 打包器根本无法在构建期证明哪些函数不会被用到！</text>
          <text y="98" fill="#ef4444">3. 只能将 500KB 的庞大工具库全量打包进产物！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 前端 Bundle 产物体积恶性膨胀；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 首屏 JS 解析与执行时间暴增 300%；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须全面拥抱 ESM！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ ESM 纯静态拓扑：精准物理抹除</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142"/>
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#4ade80">import { pick } from 'lodash-es';</text>

          <text y="36" fill="#38bdf8">构建期 AST 静态分析：</text>
          <text y="50" fill="#34d399">1. 依赖关系在顶层静态声明，禁止动态语法</text>
          <text y="64" fill="#34d399">2. 标记 pick 为 used，其余 200 个未引用函数标记为 dead</text>
          <text y="78" fill="#34d399">3. 代码发射期直接物理剔除 dead 代码！</text>

          <text y="104" fill="#4ade80">✓ 最终打包体积从 500KB 锐减至 1.2KB！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 生产产物极致紧凑轻量；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 提升首屏加载与冷启动速度；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化前端工程基石！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs></svg>
