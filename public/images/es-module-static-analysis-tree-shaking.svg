<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="es-module-static-analysis-tree-shaking-title es-module-static-analysis-tree-shaking-desc"><title id="es-module-static-analysis-tree-shaking-title">ESM 静态语法分析与死代码消除 (DCE)：构建期 AST 摇树算法</title><desc id="es-module-static-analysis-tree-shaking-desc">ESM 静态语法分析与死代码消除 (DCE)：构建期 AST 摇树算法</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Tree-Shaking 物理机理：ESM 静态分析 vs CommonJS 动态加载破产</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">CommonJS require() 运行时动态执行 (无法摇树，打包全量代码) vs ESM import 编译期确定依赖图 (精准剥离未引用死代码)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ CommonJS 动态模块：摇树彻底失效</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">const module = require(getPath()); // 动态路径！</text>
          <text y="28" fill="#f5f5f5">module.exports = { a, b, c, ...allUtils };</text>

          <text y="50" fill="#f5f5f5">🔴 编译器无法分析：</text>
          <text y="66" fill="#f5f5f5">1. require 是一个普通运行时函数，可以在 if 分支内调用</text>
          <text y="82" fill="#f5f5f5">2. 打包器根本无法在构建期证明哪些函数不会被用到！</text>
          <text y="98" fill="#f5f5f5">3. 只能将 500KB 的庞大工具库全量打包进产物！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 前端 Bundle 产物体积恶性膨胀；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 首屏 JS 解析与执行时间暴增 300%；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 必须全面拥抱 ESM！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ ESM 纯静态拓扑：精准物理抹除</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">import { pick } from 'lodash-es';</text>

          <text y="36" fill="#f5f5f5">构建期 AST 静态分析：</text>
          <text y="50" fill="#f5f5f5">1. 依赖关系在顶层静态声明，禁止动态语法</text>
          <text y="64" fill="#f5f5f5">2. 标记 pick 为 used，其余 200 个未引用函数标记为 dead</text>
          <text y="78" fill="#f5f5f5">3. 代码发射期直接物理剔除 dead 代码！</text>

          <text y="104" fill="#f5f5f5">✓ 最终打包体积从 500KB 锐减至 1.2KB！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 生产产物极致紧凑轻量；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 提升首屏加载与冷启动速度；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代化前端工程基石！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
