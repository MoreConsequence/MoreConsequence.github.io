<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Kprobe 动态插桩机理：断点指令替换（int3）与寄存器上下文捕获时序</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">备份目标指令 ──► 写入 0xCC (int3) 触发 CPU 异常 ──► 执行 eBPF 回调处理 ──► 单步恢复执行原指令</text>
  </g>

  <!-- Main Pipeline Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 4 Pipeline Steps (200px each, gap 15px) -->
    <g transform="translate(20, 20)">
      <!-- Step 1: Instruction Patching -->
      <g>
        <rect width="195" height="235" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect width="195" height="32" rx="6" fill="#f1f5f9"/>
        <text x="97" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">1. 注册插桩 (Register)</text>

        <g transform="translate(10, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
          <rect width="175" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="8" y="16" fill="#0f172a" font-weight="700">备份原指令字节</text>
          <text x="8" y="28" font-size="9" fill="#64748b">保存到 kprobe.opcode</text>

          <rect y="48" width="175" height="52" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
          <text x="8" y="16" fill="#991b1b" font-weight="700">注入断点指令</text>
          <text x="8" y="30" font-family="ui-monospace, monospace" font-size="9.5" fill="#dc2626">text_poke: 写入 0xCC</text>
          <text x="8" y="42" font-size="9" fill="#7f1d1d">(x86 int3 软件断点)</text>

          <rect y="106" width="175" height="42" rx="3" fill="#f8fafc"/>
          <text x="8" y="16" fill="#64748b">内核函数正常运行，</text>
          <text x="8" y="28" fill="#64748b">直到 CPU 执行到该地址 ──►</text>
        </g>
      </g>

      <!-- Step 2: Trap Exception -->
      <g transform="translate(210, 0)">
        <rect width="195" height="235" rx="6" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/>
        <rect width="195" height="32" rx="6" fill="#fee2e2"/>
        <text x="97" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">2. 触发陷阱 (Trap)</text>

        <g transform="translate(10, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
          <rect width="175" height="42" rx="3" fill="#ffffff" stroke="#fecaca"/>
          <text x="8" y="16" fill="#991b1b" font-weight="700">CPU 触发 #BP 异常</text>
          <text x="8" y="28" font-size="9" fill="#7f1d1d">暂停当前内核执行流</text>

          <rect y="48" width="175" height="52" rx="3" fill="#ffffff" stroke="#fecaca"/>
          <text x="8" y="16" fill="#991b1b" font-weight="700">保存物理寄存器现场</text>
          <text x="8" y="30" font-family="ui-monospace, monospace" font-size="9" fill="#7f1d1d">struct pt_regs 压栈</text>
          <text x="8" y="42" font-size="9" fill="#7f1d1d">(RAX, RDI, RSI, RSP 等)</text>

          <rect y="106" width="175" height="42" rx="3" fill="#fee2e2"/>
          <text x="8" y="16" fill="#991b1b" font-weight="700">跳转 kprobe_handler</text>
          <text x="8" y="28" font-size="9" fill="#7f1d1d">准备执行 eBPF 探针逻辑</text>
        </g>
      </g>

      <!-- Step 3: Run BPF Program -->
      <g transform="translate(420, 0)">
        <rect width="195" height="235" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="195" height="32" rx="6" fill="#dcfce7"/>
        <text x="97" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">3. 执行 eBPF 探针</text>

        <g transform="translate(10, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
          <rect width="175" height="42" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="8" y="16" fill="#14532d" font-weight="700">读取函数入参</text>
          <text x="8" y="28" font-size="9" fill="#15803d">PT_REGS_PARM1(ctx)</text>

          <rect y="48" width="175" height="52" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
          <text x="8" y="16" fill="#166534" font-weight="700">获取高精度时间戳</text>
          <text x="8" y="30" font-family="ui-monospace, monospace" font-size="9" fill="#047857">bpf_ktime_get_ns()</text>
          <text x="8" y="42" font-size="9" fill="#047857">记录函数开始时刻</text>

          <rect y="106" width="175" height="42" rx="3" fill="#d1fae5"/>
          <text x="8" y="16" font-weight="700" fill="#065f46">写入 BPF Map</text>
          <text x="8" y="28" font-size="9" fill="#047857">原子更新直通用户态</text>
        </g>
      </g>

      <!-- Step 4: Resume Execution -->
      <g transform="translate(630, 0)">
        <rect width="230" height="235" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
        <rect width="230" height="32" rx="6" fill="#dbeafe"/>
        <text x="115" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">4. 单步执行与恢复 (Resume)</text>

        <g transform="translate(10, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
          <rect width="210" height="42" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
          <text x="8" y="16" fill="#1d4ed8" font-weight="700">单步执行备份指令</text>
          <text x="8" y="28" font-size="9" fill="#2563eb">在独立缓冲区执行原指令字节</text>

          <rect y="48" width="210" height="52" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
          <text x="8" y="16" fill="#1e40af" font-weight="700">恢复 CPU 寄存器与 IP</text>
          <text x="8" y="30" font-size="9" fill="#2563eb">• 弹出 pt_regs</text>
          <text x="8" y="42" font-size="9" fill="#2563eb">• 指令指针跳转至下一条指令</text>

          <rect y="106" width="210" height="42" rx="3" fill="#f0fdf4"/>
          <text x="8" y="16" font-weight="700" fill="#047857">零业务侵入，无感继续运行</text>
          <text x="8" y="28" font-size="9" fill="#047857">应用与内核完全不感知探针存在！</text>
        </g>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">Kprobe vs Tracepoint 选型法则：</tspan> 动态探针 Kprobe <tspan font-weight="700" fill="#2563eb">可在任意内核函数插桩</tspan>（但有微量断点开销）；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">
        静态探针 Tracepoint 在内核编译期预埋，零断点异常损耗，是生产长期指标监控的绝对首选。
      </text>
    </g>
  </g>
</svg>
