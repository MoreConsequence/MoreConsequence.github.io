<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Google Spanner TrueClock 不确定性区间与 Commit Wait 等待模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">TT.now() 返回 [t.earliest, t.latest] (误差 ε ≤ 7ms) ｜ 事务分配时间戳 s = t.latest ｜ 强行等待 2ε 直至绝对时间流逝超过 s ｜ 保障全球外部一致性 (Linearizability)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. GPS + 原子钟混合授时 (TrueClock Hardware Infrastructure)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">数据中心部署 GPS 天线与铷原子钟 ──► 硬件级对抗物理时钟漂移 ──► 最大误差 ε 严控在 1~7ms 以内</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将不可预测的物理世界时钟不确定性约束在严格的数学区间内！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 事务时间戳分配 (Timestamp Assignment: s = TT.now().latest)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">事务 T1 准备提交 ──► 获取当前绝对时间上界: s = latest ──► 保证 s 一定在当前真实物理绝对时间之后</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">为因果关系提供不可颠覆的时间锚点！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 核心机制：Commit Wait 强制时钟等待 (Wait until TT.now().earliest &gt; s)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">事务 T1 强行休眠等待 2ε (约 7ms) ──► 确保物理世界真实绝对时间 100% 已经越过时间戳 s！</text>
        <text x="15" y="62" font-size="8" fill="#047857">等现实世界的物理时间追上时间戳，彻底消除任何时钟偏斜歧义！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 全球线性一致性达成 (Global External Consistency: T1 &lt; T2)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">后续在地球另一端开启的事务 T2 获取的时间戳必有 s2 &gt; s1 ──► 0 跨机房协调实现分布式快照读！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">分布式系统发展史上最具震撼力的设计！</text>
      </g>
    </g>
  </g>
</svg>