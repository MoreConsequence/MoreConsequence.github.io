<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#ea580c"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">两阶段提交（2PC）协调者单点阻塞困境与 3PC 局限性</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">参与者锁定资源进入 Prepared 状态后协调者突发宕机 ──► 资源无限期死锁与脑裂风险</text>
  </g>

  <!-- Main Card -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Box: 2PC Flow & Coordinator Crash Block (435px) -->
    <g transform="translate(20, 20)">
      <rect width="435" height="230" rx="6" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.2"/>
      <rect width="435" height="32" rx="6" fill="#fef2f2"/>
      <text x="217" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 2PC 致命死锁：协调者在 Commit 阶段前夕宕机</text>

      <g transform="translate(16, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Phase 1 -->
        <rect width="403" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="18" font-weight="700" fill="#0f172a">阶段一：Prepare 预备投票</text>
        <text x="12" y="30" font-size="9.5" fill="#64748b">协调者询问参与者 A/B ──► 双方写 Redo/Undo Log 并锁住数据行，回复 YES</text>

        <!-- Coordinator Crash Line -->
        <g transform="translate(0, 44)">
          <rect width="403" height="42" rx="4" fill="#fee2e2" stroke="#ef4444"/>
          <text x="12" y="18" font-weight="700" fill="#991b1b">⚡ 突发故障：协调者 (Coordinator) 彻底宕机！</text>
          <text x="12" y="32" font-size="9.5" fill="#7f1d1d">参与者 A、B 已进入 PREPARED 状态，手握排他行锁却等不到 Commit/Rollback 指令</text>
        </g>

        <!-- Consequence -->
        <g transform="translate(0, 94)">
          <rect width="403" height="50" rx="4" fill="#fff1f2" stroke="#fda4af"/>
          <text x="12" y="18" font-weight="700" fill="#9f1239">💥 致命死局（Indoubt 悬挂事务）：</text>
          <text x="12" y="32" font-size="9.5" fill="#881337">• A 不能单方面 Commit（B 可能没准备好）</text>
          <text x="12" y="44" font-size="9.5" fill="#881337">• A 不能单方面 Rollback（协调者可能已通知 B 提交了） ──► 永久阻塞！</text>
        </g>
      </g>
    </g>

    <!-- Right Box: 3PC Attempts & Real-world Solution (435px) -->
    <g transform="translate(465, 20)">
      <rect width="435" height="230" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.2"/>
      <rect width="435" height="32" rx="6" fill="#eff6ff"/>
      <text x="217" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">🛡️ 3PC 的尝试与现代工业解法</text>

      <g transform="translate(16, 44)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- 3PC Flow -->
        <rect width="403" height="48" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="18" font-weight="700" fill="#334155">3PC 的尝试：CanCommit ──► PreCommit ──► DoCommit</text>
        <text x="12" y="32" font-size="9.5" fill="#64748b">引入超时机制解除参与者永久阻塞，<tspan font-weight="700" fill="#dc2626">但在网络分区时仍会导致数据脑裂不一致！</tspan></text>
        <text x="12" y="44" font-size="9.5" fill="#64748b">(工业界极少直接采用 3PC)</text>

        <!-- Modern Solutions -->
        <g transform="translate(0, 56)">
          <rect width="403" height="85" rx="4" fill="#f0fdf4" stroke="#86efac"/>
          <text x="12" y="20" font-weight="700" fill="#166534">现代工业标准解法：</text>
          <text x="12" y="38" font-size="10" fill="#14532d"><tspan font-weight="700" fill="#2563eb">1. 强一致场景：</tspan> Raft-based 2PC（TiDB/Spanner，协调者与参与者全上 Raft）</text>
          <text x="12" y="54" font-size="10" fill="#14532d"><tspan font-weight="700" fill="#ea580c">2. 跨微服务场景：</tspan> SAGA 状态机编排 / 本地消息表 + CDC 最终一致性</text>
          <text x="12" y="72" font-size="10" fill="#15803d">👉 放弃传统同步 2PC 跨库大锁，采用异步补偿与最终一致解耦！</text>
        </g>
      </g>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">物理架构红线：</tspan> 传统 2PC 的本质是 <tspan font-weight="700" fill="#ea580c">“在不可靠网络上强行实现单机 ACID 幻觉”</tspan>，持有锁跨越网络 RTT 必定带来吞吐雪崩；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">
        分布式系统必须通过业务幂等、重试与逆向补偿（SAGA）拥抱最终一致性。
      </text>
    </g>
  </g>
</svg>
