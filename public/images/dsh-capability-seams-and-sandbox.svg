<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">能力缝隙 (Capability Seams) 与零信任沙箱：三位一体物理隔离模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 文件系统缝隙 (chroot/mount 沙箱) ｜ 2. 进程空间缝隙 (PID namespace + cgroups 熔断) ｜ 3. 网络通信缝隙 (Net namespace 封锁与代理白名单)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 文件系统缝隙 (FS Seam)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 只读绑定与工作区隔离</text>
          <text x="10" y="34" fill="#93c5fd">• /etc, /usr, /bin 严格只读挂载</text>
          <text x="10" y="50" fill="#93c5fd">• /workspace 独立临时目录可写</text>
          <text x="10" y="68" fill="#f87171">• 屏蔽 ~/.ssh, ~/.aws, ~/.env</text>
          <text x="10" y="88" fill="#34d399">✓ 杜绝任何跨目录遍历窃取凭证！</text>
          <text x="10" y="104" fill="#4ade80">✓ 保护宿主机核心机密资产。</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 基于 Linux bind mount 机制；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 进程退出自动销毁挂载点；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造干净的不可变构建空间。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 进程空间缝隙 (Process Seam)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// PID 隔离与资源硬限制</text>
          <text x="10" y="34" fill="#86efac">• unshare(CLONE_NEWPID)</text>
          <text x="10" y="50" fill="#86efac">• cgroups 限制 CPU 200%, 内存 4GB</text>
          <text x="10" y="68" fill="#38bdf8">• 超时 60s 自动发送 SIGKILL</text>
          <text x="10" y="88" fill="#34d399">✓ 防范 Fork 炸弹打满服务器 CPU！</text>
          <text x="10" y="104" fill="#4ade80">✓ 保证宿主机其他服务稳定运行。</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 限制单条命令的最大执行时长；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 物理切断对宿主机其他进程的 kill 权限；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚不可摧的运行时防线。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 网络通信缝隙 (Net Seam)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 默认断网与正向代理白名单</text>
          <text x="10" y="34" fill="#fed7aa">• unshare(CLONE_NEWNET) 封锁外网</text>
          <text x="10" y="50" fill="#38bdf8">• 仅放行 npmjs.org / golang.org</text>
          <text x="10" y="68" fill="#f87171">• 拦截所有非标私网 IP 访问</text>
          <text x="10" y="88" fill="#34d399">✓ 100% 杜绝反弹 Shell 与木马下载！</text>
          <text x="10" y="104" fill="#4ade80">✓ 终极保障数据安全不外泄。</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 将 Agent 执行环境与企业生产内网物理隔离；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 彻底阻断供应链恶意代码扩散；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 金融级 Agent 系统的标准安全底座！</text>
      </g>
    </g>
  </g>
</svg>