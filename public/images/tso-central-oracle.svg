<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="tso-central-oracle-title tso-central-oracle-desc">
  <title id="tso-central-oracle-title">TSO 集中式时间戳服务</title>
  <desc id="tso-central-oracle-desc">客户端 C1（与 PD 同机房）和 C2（跨地域）每次提交都向中心化 Timestamp Oracle 取一个全局单调递增时间戳；PD 是单点（挂则全集群停写），且跨地域写入被绑定在 PD 的物理位置 RTT 上。对比 HLC 可在本地派生时间戳免此次往返。</desc>

  <defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="40" y="48" fill="#2d3142" font-size="24" font-family="'Instrument Serif', Georgia, serif">TSO：集中式时间戳服务</text>
  <text x="40" y="72" fill="#4f5d75" font-size="12" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">每次提交都向中心 oracle 取单调 ts —— 强序的甜区与跨地域 RTT 代价</text>

  <!-- Zones -->
  <rect x="80" y="110" width="360" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="84" y="114" width="148" height="12" rx="2" fill="#f5f5f5"/>
  <text x="158" y="123" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">REGION A · PD 同机房</text>

  <rect x="480" y="110" width="320" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="484" y="114" width="124" height="12" rx="2" fill="#f5f5f5"/>
  <text x="546" y="123" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">REGION B · 跨地域</text>

  <!-- Arrows (drawn before boxes) -->
  <!-- C1 -> PD (same region) -->
  <path d="M 360,198 V 238 Q 360,246 352,246 H 256" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="270" y="234" width="150" height="12" rx="2" fill="#f5f5f5"/>
  <text x="278" y="243" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="start">取 ts（同机房 RTT 小）</text>

  <!-- C2 -> PD (cross region, long) -->
  <path d="M 620,198 V 286 Q 620,294 612,294 H 256" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="436" y="282" width="156" height="12" rx="2" fill="#f5f5f5"/>
  <text x="444" y="291" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="start">取 ts（跨地域 RTT 大）</text>

  <!-- Boxes -->
  <!-- PD (coral focal) -->
  <rect x="96" y="230" width="160" height="80" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="176" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">PD · Timestamp Oracle</text>
  <text x="176" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">全局单调 ts</text>

  <!-- C1 -->
  <rect x="300" y="150" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="360" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Client C1</text>
  <text x="360" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">写 Region A</text>

  <!-- C2 -->
  <rect x="560" y="150" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="620" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Client C2</text>
  <text x="620" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">写 Region B</text>

  <!-- Callouts (ink) -->
  <rect x="96" y="330" width="220" height="44" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="112" y="350" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">单点风险</text>
  <text x="112" y="366" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">PD 挂则全集群停写；靠副本 + lease 续命</text>

  <rect x="480" y="330" width="300" height="44" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="496" y="350" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">跨地域 RTT 税</text>
  <text x="496" y="366" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">Region B 每次提交都 RTT 到 PD，延迟绑死 oracle 位置</text>

  <!-- Contrast note -->
  <rect x="80" y="424" width="720" height="44" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="96" y="444" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">对比 HLC</text>
  <text x="160" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">时间戳在本地由 max(墙钟) + 逻辑计数器派生，免这次 PD 往返</text>
  <text x="96" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">代价：失去全局 oracle 的零协商强序，只得到有界 ε 近似线性一致</text>

  <!-- Legend -->
  <line x1="40" y1="492" x2="840" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="510" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="504" width="12" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="140" y="514" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">PD（集中式时间戳 focal）</text>
  <line x1="340" y1="510" x2="372" y2="510" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="380" y="514" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">取 ts 请求（实线）</text>
</svg>