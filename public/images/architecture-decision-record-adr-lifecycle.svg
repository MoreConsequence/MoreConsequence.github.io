<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">架构决策记录 (ADR: Architectural Decision Record) 状态跃迁流转模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Draft (起草) ──► Proposed (团队技术评审) ──► Accepted (采纳落地) / Rejected ──► 后续技术演进时标记为 Superseded (被新 ADR 替代)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 背景与决策问题阐述 (Context &amp; Problem Statement)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">明确当前系统遇到的核心物理瓶颈 (如订单数据库 CPU 100%) 与业务约束条件 ──► 避免空洞抽象讨论</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">从真实世界痛点出发！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 备选方案对比与决策依据 (Decision Drivers &amp; Options Matrix)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">对比方案 A (分库分表) vs 方案 B (引入 TiKV NewSQL) ──► 评估研发成本、学习曲线、一致性保障与运维风险</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将架构决策中的权衡 (Trade-offs) 彻底摆上台面！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 正式决策裁决与后果声明 (Decision Outcome &amp; Consequences)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">宣布采纳方案 ──► 明确列出正面收益 (写入吞吐提升 10 倍) 以及必须承担的负面代价 (跨分片事务延迟增加 5ms)</text>
        <text x="15" y="62" font-size="8" fill="#047857">让所有人对技术抉择的代价有清醒认知！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 与代码仓库同生命周期演进 (Versioned with Code in Git)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">保存在 docs/adr/0001-xxx.md ──► 成为新员工入职理解“为什么代码写成这样”的历史博物馆！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">优秀工程团队技术资产传承的最佳实践！</text>
      </g>
    </g>
  </g>
</svg>