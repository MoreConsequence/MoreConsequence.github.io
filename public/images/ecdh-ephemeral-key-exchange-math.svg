<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ECDHE 密钥协商数学模型与前向安全 (Forward Secrecy)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Client (私钥 a, 公钥 A = a⋅G) ｜ Server (私钥 b, 公钥 B = b⋅G) ｜ 双方独立计算出相同共享密钥 S = a⋅B = b⋅A = (a⋅b)⋅G ｜ 公网监听者无法推导</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 选定标准椭圆曲线基点 G (Domain Parameters: X25519 / P-256)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">全球公开固定的椭圆曲线方程 y² = x³ + ax + b 与基点 G ──► 具备极高计算强度的离散对数难题</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">密码学现代数学坚不可摧的理论基石！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 双方各自生成临时随机私钥对 (Ephemeral Keypair Generation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">Client 随机生成私钥 a ──► 计算公钥 A = a × G ｜ Server 随机生成私钥 b ──► 计算公钥 B = b × G</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">私钥 a 和 b 仅存在于单次连接内存中，用完即焚！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 公开交换公钥并独立推导共享密钥 (Shared Secret Calculation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Client 计算: K = a × B = a × (b × G) ｜ Server 计算: K = b × A = b × (a × G) ──► 完美得出相同 K！</text>
        <text x="15" y="62" font-size="8" fill="#047857">0 传输明文私钥，在公网众目睽睽之下隔空达成密钥一致！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 完美前向安全达成 (Perfect Forward Secrecy - PFS)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">未来即使黑客窃取了服务器的长期证书私钥 ──► 依然 100% 无法解密过去录制的历史通信流量！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代互联网加密通信的最高安全保障！</text>
      </g>
    </g>
  </g>
</svg>