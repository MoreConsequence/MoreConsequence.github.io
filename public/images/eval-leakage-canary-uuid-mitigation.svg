<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="eval-leakage-canary-uuid-mitigation-title eval-leakage-canary-uuid-mitigation-desc"><title id="eval-leakage-canary-uuid-mitigation-title">金丝雀标记防御：Canary GUID 追踪与动态评测集合成对抗</title><desc id="eval-leakage-canary-uuid-mitigation-desc">金丝雀标记防御：Canary GUID 追踪与动态评测集合成对抗</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">评测防污染攻防体系：Canary GUID 探针与动态动态等价题库生成</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">固定静态题库 (必然在 3 个月内被全网爬虫吃进预训练集) vs 动态参数化等价变换 (保持同等推理逻辑，数值与变量完全随机)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 静态公开榜单：刷榜与死记硬背</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 静态 GSM8K / HumanEval 题目</text>
          <text y="28" fill="#f5f5f5">1. 题目被各大爬虫抓取并进入 CommonCrawl 预训练集</text>
          <text y="44" fill="#f5f5f5">2. 模型死记硬背了答案，哪怕题目数字被改动依然答原答案！</text>

          <text y="68" fill="#f5f5f5">🔴 虚假繁荣：</text>
          <text y="84" fill="#fb7185">• 榜单评分 95% (看似超级智能)；</text>
          <text y="100" fill="#f5f5f5">• 真实业务场景报错率高达 40%！</text>
          <text y="118" fill="#f5f5f5">► 榜单彻底失去衡量智能水平的标尺价值！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产危害：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 误导企业选型，采购了高分低能的虚假模型；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 过拟合污染导致模型泛化能力严重退化；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 必须转向动态评测！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 动态参数化合成评测 (Synthetic Eval)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 动态生成参数化测试用例</text>
          <text y="28" fill="#f5f5f5">1. 变量随机化: 函数名、变量名、测试数值实时随机生成</text>
          <text y="44" fill="#f5f5f5">2. 逻辑等价替换: 用同构 AST 变换代码结构</text>
          <text y="60" fill="#f5f5f5">3. 沙箱动态执行验证标准答案 (Ground Truth)</text>

          <text y="88" fill="#f5f5f5">✓ 每一轮评测题目全网独一无二，0 被污染可能！</text>
          <text y="104" fill="#f5f5f5">✓ 真实还原模型的原生逻辑推理与代码编写实力！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 打造企业不可攻破的内部黄金测试集；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 精准指导 RLHF 与 DPO 偏好对齐训练；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业界最权威的真实力检验体系！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
