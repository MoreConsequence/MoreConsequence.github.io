<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">评测防污染攻防体系：Canary GUID 探针与动态动态等价题库生成</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">固定静态题库 (必然在 3 个月内被全网爬虫吃进预训练集) vs 动态参数化等价变换 (保持同等推理逻辑，数值与变量完全随机)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Static Benchmark Flaw -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 静态公开榜单：刷榜与死记硬背</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 静态 GSM8K / HumanEval 题目</text>
          <text y="28" fill="#fca5a5">1. 题目被各大爬虫抓取并进入 CommonCrawl 预训练集</text>
          <text y="44" fill="#ef4444">2. 模型死记硬背了答案，哪怕题目数字被改动依然答原答案！</text>
          
          <text y="68" fill="#ef4444">🔴 虚假繁荣：</text>
          <text y="84" fill="#fb7185">• 榜单评分 95% (看似超级智能)；</text>
          <text y="100" fill="#ef4444">• 真实业务场景报错率高达 40%！</text>
          <text y="118" fill="#f87171">► 榜单彻底失去衡量智能水平的标尺价值！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 误导企业选型，采购了高分低能的虚假模型；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 过拟合污染导致模型泛化能力严重退化；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须转向动态评测！</text>
      </g>
    </g>

    <!-- Right: Dynamic Synthetic Bench -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 动态参数化合成评测 (Synthetic Eval)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 动态生成参数化测试用例</text>
          <text y="28" fill="#86efac">1. 变量随机化: 函数名、变量名、测试数值实时随机生成</text>
          <text y="44" fill="#38bdf8">2. 逻辑等价替换: 用同构 AST 变换代码结构</text>
          <text y="60" fill="#34d399">3. 沙箱动态执行验证标准答案 (Ground Truth)</text>
          
          <text y="88" fill="#4ade80">✓ 每一轮评测题目全网独一无二，0 被污染可能！</text>
          <text y="104" fill="#4ade80">✓ 真实还原模型的原生逻辑推理与代码编写实力！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 打造企业不可攻破的内部黄金测试集；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 精准指导 RLHF 与 DPO 偏好对齐训练；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业界最权威的真实力检验体系！</text>
      </g>
    </g>
  </g>
</svg>