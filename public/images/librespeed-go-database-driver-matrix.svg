<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">遥测持久化驱动架构：单一接口与 7 种存储后端全景适配</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">type DB interface { InsertTelemetry(...), QueryTelemetry(...) } ｜ 关系型 (MySQL/PG/SQLite) ｜ 键值/嵌入式 (Redis/BoltDB) ｜ 纯内存/CSV 文件</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 关系型数据库 (SQL)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">PostgreSQL / MySQL / SQLite</text>
          
          <text x="8" y="42" fill="#86efac">• 强事务 ACID 保证</text>
          <text x="8" y="58" fill="#86efac">• 丰富复杂 SQL 聚合查询</text>
          <text x="8" y="74" fill="#86efac">• 适合百万级历史沉淀</text>
          
          <text x="8" y="104" fill="#4ade80">✓ 生产企业集群标配！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• 长期运营数据统计；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 运营商宽带达标报表；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 打造高可用数据底座。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 极速缓存 (Redis)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">Redis In-Memory</text>
          
          <text x="8" y="42" fill="#86efac">• 纳秒级极速写入吞吐</text>
          <text x="8" y="58" fill="#86efac">• TTL 自动过期修剪</text>
          <text x="8" y="74" fill="#86efac">• 支持分布式集群共享</text>
          
          <text x="8" y="104" fill="#4ade80">✓ 极高并发写入首选！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">适用场景：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• 百万级临时分享卡片；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• 边缘网关快速中转；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 打造超低时延写入。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 嵌入式 (BoltDB / SQLite)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">Embedded BoltDB</text>
          
          <text x="8" y="42" fill="#fed7aa">• 单二进制文件内嵌</text>
          <text x="8" y="58" fill="#fed7aa">• 0 外部依赖与运维负担</text>
          <text x="8" y="74" fill="#fed7aa">• B+ Tree 磁盘持久化</text>
          
          <text x="8" y="104" fill="#4ade80">✓ 单机极简部署神器！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#c2410c">适用场景：</text>
        <text x="8" y="34" font-size="7.5" fill="#9a3412">• 路由器与树莓派边缘部署；</text>
        <text x="8" y="48" font-size="7.5" fill="#9a3412">• 私有化单机开箱即用；</text>
        <text x="8" y="62" font-size="7.5" fill="#ea580c">• 极致轻量化工程。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. 纯内存与 CSV 文件</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">Memory / CSV Append</text>
          
          <text x="8" y="42" fill="#e9d5ff">• 纯只读或追加文件</text>
          <text x="8" y="58" fill="#e9d5ff">• 适合数据科学快速导出</text>
          <text x="8" y="74" fill="#e9d5ff">• 0 配置即可启动</text>
          
          <text x="8" y="104" fill="#4ade80">✓ 极速开发与测试！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">适用场景：</text>
        <text x="8" y="34" font-size="7.5" fill="#6b21a8">• 本地单元测试与 CI 流程；</text>
        <text x="8" y="48" font-size="7.5" fill="#6b21a8">• 临时测量脚本运行；</text>
        <text x="8" y="62" font-size="7.5" fill="#6b21a8">• 打造灵活适配架构。</text>
      </g>
    </g>
  </g>
</svg>