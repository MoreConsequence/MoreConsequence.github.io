<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MySQL 两阶段组提交三阶段流水线 (2PC Group Commit Pipeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Flush Stage (批量写 Redo/Binlog 内存) ──► Sync Stage (单次 fsync 刷盘) ──► Commit Stage (按序更新引擎事务状态)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Flush 阶段 (内存聚合写入)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 第一个到达的事务成为 Leader</text>
          <text x="10" y="34" fill="#86efac">Leader 获取 flush_lock 互斥锁</text>
          
          <text x="10" y="58" fill="#cbd5e1">• 后续到达的事务作为 Follower 排队</text>
          <text x="10" y="74" fill="#cbd5e1">• Leader 收集整个队列的 Binlog 数据</text>
          <text x="10" y="90" fill="#34d399">• 批量写入 OS Page Cache (0 fsync)</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 纳秒级极速内存搬运！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 锁定期间收集更多并发事务；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 一并写入 Redo Log 准备日志；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造高效组装车间。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. Sync 阶段 (集中 fsync 刷盘)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// Leader 获取 sync_lock 锁</text>
          <text x="10" y="34" fill="#fed7aa">释放 flush_lock (允许下一批开始聚合)</text>
          
          <text x="10" y="58" fill="#38bdf8">发起关键系统调用：</text>
          <text x="10" y="74" fill="#34d399">fsync(binlogFd); // 单次落盘！</text>
          <text x="10" y="90" fill="#cbd5e1">• 可配置 binlog_group_commit_sync_delay</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 一次 I/O 解决数百个事务持久化！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底攻克 2PC 刷盘性能瓶颈；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 与 Flush 阶段形成高效重叠流水线；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级吞吐保障核心！</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. Commit 阶段 (按序引擎提交)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// Leader 获取 commit_lock 锁</text>
          <text x="10" y="34" fill="#86efac">按 Flush 阶段排好的队列严格保序提交</text>
          
          <text x="10" y="58" fill="#38bdf8">调用 InnoDB 引擎层：</text>
          <text x="10" y="74" fill="#34d399">innobase_commit_ordered()</text>
          <text x="10" y="90" fill="#cbd5e1">• 唤醒所有等待的 Follower 线程并回包</text>
          
          <text x="10" y="116" fill="#4ade80">✓ 严格保证 Binlog 与 InnoDB 提交顺序一致！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">数据一致性：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 保证主从复制与跨机容灾零数据错乱；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 优雅解除分布式事务死锁；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级工程设计典范！</text>
      </g>
    </g>
  </g>
</svg>