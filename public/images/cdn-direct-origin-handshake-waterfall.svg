<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%" role="img" aria-labelledby="wh-title wh-desc">
<title id="wh-title">直连源站 3.0 RTT 握手瀑布 · 560ms TTFB 物理时序</title>
<desc id="wh-desc">序列图：北京客户端与美东源站 15,904km 跨洋链路的 TCP 与 TLS 1.3 握手分三轮往返，展示 3.0 RTT 约 560ms 的首字节时延瀑布。</desc>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<!-- Header -->
<text x="40" y="28" fill="#2d3142" font-size="16" font-weight="400" font-family="'Instrument Serif', serif">直连源站 3.0 RTT 握手瀑布与 560ms TTFB 物理时序</text>
<text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" letter-spacing="0.02em">v&lt;tspan baseline-shift="sub" font-size="7"&gt;fiber&lt;/tspan&gt;= c/1.468 ≈204.2 km/ms · 15,904 km → 77.88 ms 单程 · 跨洋 RTT 物理下限 165–185 ms</text>
<!-- Lifelines -->
<line x1="224" y1="128" x2="224" y2="484" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="736" y1="128" x2="736" y2="484" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<!-- Activation: Origin handles handshake -->
<rect x="732" y="176" width="8" height="244" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
<!-- Arrows -->
<line x1="224" y1="180" x2="736" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="736" y1="228" x2="224" y2="228" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="224" y1="276" x2="736" y2="276" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<line x1="736" y1="324" x2="224" y2="324" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
<line x1="224" y1="372" x2="736" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="736" y1="420" x2="224" y2="420" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Labels with 8px gap: mask y = arrow_y -20, text y = arrow_y -11 -->
<rect x="420" y="160" width="120" height="12" rx="2" fill="#f5f5f5"/>
<text x="480" y="169" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYN · seq=0</text>
<rect x="400" y="208" width="160" height="12" rx="2" fill="#f5f5f5"/>
<text x="480" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYN-ACK · 1.0 RTT ≈180ms</text>
<rect x="400" y="256" width="160" height="12" rx="2" fill="#f5f5f5"/>
<text x="480" y="265" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLIENT HELLO · TLS 1.3</text>
<rect x="396" y="304" width="168" height="12" rx="2" fill="#f5f5f5"/>
<text x="480" y="313" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SERVER HELLO · CERT · 2.0 RTT</text>
<rect x="404" y="352" width="152" height="12" rx="2" fill="#f5f5f5"/>
<text x="480" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP GET /index.html</text>
<rect x="412" y="400" width="136" height="12" rx="2" fill="#f5f5f5"/>
<text x="480" y="409" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 OK · TTFB≈560ms</text>
<!-- Right-side RTT ruler -->
<line x1="776" y1="180" x2="776" y2="420" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="792" y="216" width="92" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="838" y="227" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">1.0 RTT</text>
<rect x="792" y="264" width="92" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="838" y="275" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">1.0 RTT</text>
<rect x="792" y="312" width="92" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="838" y="323" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">1.0 RTT</text>
<rect x="792" y="392" width="92" height="18" rx="2" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
<text x="838" y="404" fill="#eb6c36" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">3.0 RTT</text>
<!-- Actors -->
<g>
  <rect x="144" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="144" y="72" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="152" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/><text x="164" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="224" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">北京客户端</text>
  <text x="224" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS4134 · 联通骨干</text>
</g>
<g>
  <rect x="656" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="656" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
  <rect x="664" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/><text x="678" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
  <text x="736" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">美东源站</text>
  <text x="736" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IAD · 15,904 km</text>
</g>
<!-- Legend -->
<line x1="40" y1="504" x2="920" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="522" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="534" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><text x="52" y="548" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">激活态</text>
<line x1="124" y1="543" x2="152" y2="543" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="160" y="548" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">TCP</text>
<line x1="208" y1="543" x2="236" y2="543" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/><text x="244" y="548" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">TLS 1.3</text>
<line x1="308" y1="543" x2="336" y2="543" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="344" y="548" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">返回</text>
<line x1="408" y1="543" x2="436" y2="543" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/><text x="444" y="548" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">首字节 TTFB</text>
</svg>