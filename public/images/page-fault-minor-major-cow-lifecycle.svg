<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Linux 缺页异常 (#PF) 三大处理分支与性能开销</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">次要缺页 (Minor: 内存直接分配，耗时 1μs) ｜ 重大缺页 (Major: 磁盘 Swap/文件换入，耗时 5ms 慢 5000 倍) ｜ 写时复制 (COW: 只读页分裂)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 次要缺页 (Minor Page Fault)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">发生场景：malloc / 匿名内存延迟分配</text>
          
          <text x="10" y="38" fill="#86efac">内核处理路径：</text>
          <text x="10" y="54" fill="#cbd5e1">1. 从物理伙伴系统 (Buddy) 分配空闲物理页</text>
          <text x="10" y="70" fill="#cbd5e1">2. 物理页清零 (Zeroing page)</text>
          <text x="10" y="86" fill="#34d399">3. 填充 PTE 页表条目并标记 Present</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 耗时仅约 1 ~ 2 微秒！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 0 磁盘 I/O 阻塞；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 惰性内存分配 (Lazy Allocation) 核心实现；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造超轻量进程启停。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. 重大缺页 (Major Page Fault)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">发生场景：mmap 文件读取 / Swap 换入</text>
          
          <text x="10" y="38" fill="#fca5a5">内核处理路径：</text>
          <text x="10" y="54" fill="#ef4444">1. 触发真实磁盘同步读取 I/O！</text>
          <text x="10" y="70" fill="#ef4444">2. 进程被强行置入 TASK_UNINTERRUPTIBLE (D状态)</text>
          <text x="10" y="86" fill="#ef4444">3. 等待磁盘将 4KB 数据拷贝至内存</text>
          
          <text x="10" y="114" fill="#f87171">🔴 耗时高达 5 ~ 10 毫秒 (慢 5000 倍)！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 导致接口 P99 延迟离奇飙升；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 系统 Load Average 异常虚高；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 生产必须尽量关闭 Swap！</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 写时复制 (Copy-On-Write)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">发生场景：fork() 之后子进程尝试写内存</text>
          
          <text x="10" y="38" fill="#86efac">内核处理路径：</text>
          <text x="10" y="54" fill="#38bdf8">1. MMU 捕获只读写保护违规 (#PF)</text>
          <text x="10" y="70" fill="#34d399">2. 检查发现该物理页 refcount &gt; 1</text>
          <text x="10" y="86" fill="#34d399">3. 复制 4KB 独立私有页，修改为可写</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 耗时约 3 微秒，兼顾安全与速度！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 赋予 Linux 极致轻量 fork() 进程创建能力；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• Redis bgsave 与 Docker 镜像共享基石；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 操作系统顶级设计哲学！</text>
      </g>
    </g>
  </g>
</svg>