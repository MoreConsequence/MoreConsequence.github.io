<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="bm-title bm-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="bm-title">裁判大模型四大物理系统性偏差矩阵剖析</title>
  <desc id="bm-desc">矩阵全景图展示 LLM-as-a-Judge 评测中出现的位置偏差、长度啰嗦偏差、家族自偏好与打分尺度压缩四大物理成因与表现特征。</desc>
  <defs>
    <marker id="bm-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="bm-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">LLM EVALUATION BIASES · FOUR SYSTEMIC PITFALLS</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">裁判大模型四大系统性偏差矩阵</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">位置偏差 (+30% 胜率翻转) ➔ 长度啰嗦偏差 (惩罚精炼) ➔ 家族自偏好 (同厂共鸣) ➔ 打分尺度压缩 (向 7~8 分聚拢)</text>

  <!-- 4 Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Position Bias (x=40..245, w=205) -->
  <g transform="translate(40, 136)">
    <rect width="205" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="80" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">BIAS 1</text>
    <text x="98" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">位置偏差</text>

    <!-- Box -->
    <rect x="12" y="42" width="181" height="96" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">+20%~30% 胜率翻转</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 仅调换候选回答上下顺序</text>
    <text x="20" y="94" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 判决结果发生剧烈波动</text>
    <text x="20" y="110" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Attention Decay &amp; Recency</text>

    <!-- Details -->
    <rect x="12" y="148" width="181" height="212" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">物理根因：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 自回归注意力前后分布不对称；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 第一个回答先入为主建立基线；</text>
    <text x="20" y="226" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 造成严重的次序不公。</text>
  </g>

  <!-- Col 2: Verbosity Bias (x=260..465, w=205) -->
  <g transform="translate(260, 136)">
    <rect width="205" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="80" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">BIAS 2</text>
    <text x="98" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">长度啰嗦偏差</text>

    <!-- Box -->
    <rect x="12" y="42" width="181" height="96" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">字数多 = 质量高？</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 800 字废话获极高评分</text>
    <text x="20" y="94" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 150 字精炼准确遭恶意低分</text>
    <text x="20" y="110" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Superficial Verbosity Trap</text>

    <!-- Details -->
    <rect x="12" y="148" width="181" height="212" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">物理根因：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• RLHF 标注员偏好长结构排版；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 模型内化“更长更专业”偏见；</text>
    <text x="20" y="226" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 严重损害代码与生产问答精炼度。</text>
  </g>

  <!-- Col 3: Self Bias (x=480..695, w=215) - Focal -->
  <g transform="translate(480, 136)">
    <rect width="215" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="12" y="12" width="90" height="18" rx="2" fill="#e85d3f"/>
    <text x="57" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">BIAS 3 · CORE</text>
    <text x="108" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">家族自偏好</text>

    <!-- Box -->
    <rect x="12" y="42" width="191" height="96" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="20" y="62" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">同厂模型评分偏高</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• GPT-4o 裁判显著偏向 GPT 系列</text>
    <text x="20" y="94" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• Claude 裁判偏向 Anthropic</text>
    <text x="20" y="110" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace">Token Distribution Resonance</text>

    <!-- Details -->
    <rect x="12" y="148" width="191" height="212" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">物理根因：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 共享相似的 BPE 分词习惯；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 相似的思维链与安全对齐语调；</text>
    <text x="20" y="226" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 必须采用异构多模型委员会化解。</text>
  </g>

  <!-- Col 4: Scale Drift (x=710..920, w=210) -->
  <g transform="translate(710, 136)">
    <rect width="210" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="80" height="18" rx="2" fill="#141413"/>
    <text x="52" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">BIAS 4</text>
    <text x="98" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">打分尺度压缩</text>

    <!-- Box -->
    <rect x="12" y="42" width="186" height="96" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">7.0 ~ 8.5 分聚拢塌陷</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 绝对打分方差 &lt; 0.5</text>
    <text x="20" y="94" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 无法灵敏捕获 1%~3% 优化</text>
    <text x="20" y="110" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Scale Variance Collapse</text>

    <!-- Details -->
    <rect x="12" y="148" width="186" height="212" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">物理根因：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 缺乏全局数值物理锚点；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 安全保守策略回避极端分值；</text>
    <text x="20" y="226" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 必须转型为成对盲测 (Pairwise)。</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">位置、长度与打分尺度物理偏差</text>
  <rect x="370" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="390" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">家族自偏好与 Token 分词共鸣核心根因</text>
</svg>
