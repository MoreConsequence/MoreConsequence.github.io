<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">LLM-as-a-Judge 评测四大系统性偏差矩阵</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">位置偏差 (Position) ｜ 长度啰嗦偏差 (Verbosity) ｜ 家族自偏好 (Self-Enhancement) ｜ 打分尺度漂移 (Scale Drift)</text>
  </g>

  <!-- 4 Core Bias Cards (215px each, spaced by 13px) -->
  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- Bias 1: Position Bias -->
    <g>
      <rect width="215" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="215" height="34" rx="8" fill="#eff6ff"/>
      <text x="107" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 位置偏差 (Position)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="191" height="130" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">// 对比评测 A vs B</text>
          <text x="8" y="34" fill="#fca5a5">[Model A 在前]:</text>
          <text x="14" y="48" fill="#ef4444">胜率 A: 68% ｜ 胜率 B: 32%</text>
          <text x="8" y="68" fill="#86efac">[交换顺序 B 在前]:</text>
          <text x="14" y="82" fill="#10b981">胜率 B: 64% ｜ 胜率 A: 36%</text>
          <text x="8" y="104" fill="#fbbf24">► 净偏好首位模型 +20%~30%</text>
          <text x="8" y="118" fill="#94a3b8">因注意力衰减与近因效应导致</text>
        </g>

        <!-- Solution Box -->
        <rect y="142" width="191" height="120" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">🛠️ 生产解法：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• <tspan font-weight="700">双向交换评测 (Swap-Pair)</tspan></text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 仅当 (A&gt;B 且 A'&gt;B') 时判定 A 胜</text>
        <text x="8" y="62" font-size="7.5" fill="#1d4ed8">• 出现冲突判定为 Tie 平局</text>
        <text x="8" y="78" font-size="7.5" fill="#2563eb">• 消除 95% 以上位置固有偏见</text>
      </g>
    </g>

    <!-- Bias 2: Verbosity Bias -->
    <g transform="translate(228, 0)">
      <rect width="215" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="215" height="34" rx="8" fill="#fff7ed"/>
      <text x="107" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. 长度啰嗦偏差 (Verbosity)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="191" height="130" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text x="8" y="18" fill="#fdba74">// 短小精悍 vs 冗长废话</text>
          <text x="8" y="36" fill="#f8fafc">回答 A (150 字, 100% 正确):</text>
          <text x="14" y="50" fill="#94a3b8">得分: 7.8 / 10</text>
          <text x="8" y="70" fill="#f8fafc">回答 B (800 字, 废话连篇):</text>
          <text x="14" y="84" fill="#fb923c">得分: 9.1 / 10 (裁判被字数蒙蔽)</text>
          <text x="8" y="106" fill="#f87171">► 误将“排版好/字数多”当专业</text>
          <text x="8" y="120" fill="#94a3b8">严重惩罚精简高效的高质量输出</text>
        </g>

        <!-- Solution Box -->
        <rect y="142" width="191" height="120" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#c2410c">🛠️ 生产解法：</text>
        <text x="8" y="34" font-size="7.5" fill="#9a3412">• <tspan font-weight="700">长度归一化惩罚因子</tspan></text>
        <text x="8" y="48" font-size="7.5" fill="#9a3412">• 显式 Prompt 约束：“严禁因长度加分”</text>
        <text x="8" y="62" font-size="7.5" fill="#9a3412">• 分维度评分（信息密度 vs 表达形式）</text>
        <text x="8" y="78" font-size="7.5" fill="#ea580c">• 引入紧凑性测试集 (Conciseness Eval)</text>
      </g>
    </g>

    <!-- Bias 3: Self-enhancement Bias -->
    <g transform="translate(456, 0)">
      <rect width="215" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="215" height="34" rx="8" fill="#f0fdf4"/>
      <text x="107" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. 家族自偏好 (Self-Enhance)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="191" height="130" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">// 同系模型裁判偏差</text>
          <text x="8" y="36" fill="#f8fafc">裁判: GPT-4o 裁判模型</text>
          <text x="8" y="52" fill="#38bdf8">• 评判 GPT-3.5: +15% 虚高</text>
          <text x="8" y="68" fill="#fca5a5">• 评判 Claude 3.5: 倾向苛刻</text>
          <text x="8" y="90" fill="#fbbf24">► 根因：相似的分词分布、</text>
          <text x="8" y="104" fill="#f8fafc">RLHF 语调偏好与句式共鸣</text>
          <text x="8" y="120" fill="#94a3b8">导致“老王卖瓜自卖自夸”</text>
        </g>

        <!-- Solution Box -->
        <rect y="142" width="191" height="120" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">🛠️ 生产解法：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• <tspan font-weight="700">异构多裁判委员会 (Panel of Judges)</tspan></text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• GPT-4o + Claude 3.5 + Gemini 加权</text>
        <text x="8" y="62" font-size="7.5" fill="#15803d">• 剔除与被测模型同厂的裁判分</text>
        <text x="8" y="78" font-size="7.5" fill="#047857">• 消除单一家族风格的系统性抬轿</text>
      </g>
    </g>

    <!-- Bias 4: Scale Drift -->
    <g transform="translate(684, 0)">
      <rect width="215" height="385" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
      <rect width="215" height="34" rx="8" fill="#faf5ff"/>
      <text x="107" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. 打分尺度漂移 (Scale Drift)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="191" height="130" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">// 绝对打分 (1~10) 尺度塌陷</text>
          <text x="8" y="36" fill="#f8fafc">样本 1 (极好): 给 9 分</text>
          <text x="8" y="52" fill="#f8fafc">样本 2 (一般): 给 8 分</text>
          <text x="8" y="68" fill="#f8fafc">样本 3 (有错): 给 8 分</text>
          <text x="8" y="90" fill="#f87171">► 分数集中在 7~9 分严重聚拢</text>
          <text x="8" y="104" fill="#f8fafc">标准差极小，无法区分微小迭代</text>
          <text x="8" y="120" fill="#94a3b8">温度与采样导致打分不可复现</text>
        </g>

        <!-- Solution Box -->
        <rect y="142" width="191" height="120" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">🛠️ 生产解法：</text>
        <text x="8" y="34" font-size="7.5" fill="#6b21a8">• <tspan font-weight="700">将绝对打分转为两两成对胜率 (Elo)</tspan></text>
        <text x="8" y="48" font-size="7.5" fill="#6b21a8">• 锚点标杆回答 (Anchor Response)</text>
        <text x="8" y="62" font-size="7.5" fill="#6b21a8">• 引入分级 Rubric 明确定义扣分项</text>
        <text x="8" y="78" font-size="7.5" fill="#9333ea">• 使用温度 T=0 提高评估复现率</text>
      </g>
    </g>
  </g>
</svg>
