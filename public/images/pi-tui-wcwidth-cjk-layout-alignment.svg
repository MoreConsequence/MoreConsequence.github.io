<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">终端 CJK 中英文与 Emoji 宽度对齐与表格排版算法 (wcwidth)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">直接 str.length 计算宽度 (导致中文字符与表格边框严重错位撕裂) vs wcwidth 精准双字宽计算 (完美呈现工业级精美表格与 Markdown)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: str.length Bug -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 使用 str.length：终端排版严重错位</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">JS 认为 "你好".length == 2：</text>
          
          <text y="38" fill="#ef4444">致命排版灾难：</text>
          <text y="52" fill="#fca5a5">• 但在终端物理屏幕上，2 个汉字占 4 列宽度！</text>
          <text y="68" fill="#ef4444">• 导致后续计算的右边框 │ 严重向右错位溢出！</text>
          <text y="84" fill="#ef4444">• Emoji (如 🚀) 占 2 列却被算作 1 列，表格面目全非！</text>
          
          <text y="106" fill="#f87171">🔴 命令行工具最辣眼睛的低级视觉缺陷！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">排版痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 未考虑 Unicode East Asian Width 规范；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 破坏中英混排与 Markdown 预览质感；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 必须引入 wcwidth 算法！</text>
      </g>
    </g>

    <!-- Right: wcwidth Alignment -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ wcwidth 算法：严丝合缝像素级对齐</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">Unicode 规范字符宽度精准计算：</text>
          
          <text y="36" fill="#86efac">1. ASCII 'a' ──► 宽度 = 1</text>
          <text y="50" fill="#38bdf8">2. CJK '汉' ──► 宽度 = 2 (East Asian Wide)</text>
          <text y="64" fill="#34d399">3. Emoji '🚀' ──► 宽度 = 2</text>
          <text y="78" fill="#4ade80">4. 完美计算每个单元格的右侧 Padding 空格补齐！</text>
          
          <text y="104" fill="#4ade80">✓ 呈现出出版物级别的精美终端 ASCII 边框！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底征服中英文混合排版的终端老大难问题；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 赋予 CLI 媲美 GUI 的精致工业美学；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级终端渲染工程标准！</text>
      </g>
    </g>
  </g>
</svg>