<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="seckill-inventory-atomic-three-gates-architecture-title seckill-inventory-atomic-three-gates-architecture-desc"><title id="seckill-inventory-atomic-three-gates-architecture-title">海量秒杀库存扣减架构：Lua 脚本原子预扣减、分布式三层闸门与防超卖机制</title><desc id="seckill-inventory-atomic-three-gates-architecture-desc">海量秒杀库存扣减架构：Lua 脚本原子预扣减、分布式三层闸门与防超卖机制</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">秒杀库存扣减三层闸门体系：Redis Lua 预扣减与异步排队落库</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">100 万 QPS 洪峰 ──► 闸门 1: 客户端/网关限流 (拦 90%) ──► 闸门 2: Redis Lua 原子预扣减 (拦 9.9%) ──► 闸门 3: Kafka 削峰写入 MySQL</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 第一道闸门：网关风控与限流</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 面对 100 万 QPS 突发流量</text>
          <text x="10" y="34" fill="#f5f5f5">1. 静态资源 CDN 缓存，答题验证码削峰</text>
          <text x="10" y="50" fill="#f5f5f5">2. 用户 UID 频次限制 (单用户 1 秒 1 次)</text>
          <text x="10" y="68" fill="#f5f5f5">3. 黑产设备指纹与 WAF 拦截：</text>
          <text x="16" y="82" fill="#f5f5f5">   直接在 Nginx 边缘丢弃 90% 恶意脚本流量！</text>
          <text x="10" y="104" fill="#f5f5f5">✓ 仅放行 10 万合法有效请求穿透到后端！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 保护核心业务集群不被第一波海啸冲垮；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 纯内存令牌桶极速丢弃；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造坚固的流量入口防洪堤。</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 第二道闸门：Redis Lua 预扣减</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// Lua 脚本单线程原子执行</text>
          <text x="10" y="34" fill="#f5f5f5">local stock = redis.call('get', KEYS[1])</text>
          <text x="10" y="48" fill="#f5f5f5">if tonumber(stock) &gt;= tonumber(ARGV[1]) then</text>
          <text x="16" y="62" fill="#f5f5f5">  redis.call('decrby', KEYS[1], ARGV[1])</text>
          <text x="16" y="76" fill="#f5f5f5">  return 1 -- 扣减成功</text>
          <text x="10" y="90" fill="#f5f5f5">else return 0 -- 库存售罄</text>
          <text x="10" y="104" fill="#f5f5f5">end</text>
          <text x="10" y="122" fill="#f5f5f5">✓ 纯内存 10 万 QPS 极速计算，100% 0 超卖！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 100 件商品瞬间被前 100 个请求扣完；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 后续 9.99 万个请求直接在 Redis 内存中秒拒；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 真正到达数据库的只有 100 个成功订单！</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 第三道闸门：异步削峰与落库</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 仅 100 个成功请求投递至 MQ</text>
          <text x="10" y="34" fill="#f5f5f5">kafka.Send("seckill_success_topic", order)</text>

          <text x="10" y="56" fill="#f5f5f5">1. 订单消费端平稳消费 (速度 100 单/秒)</text>
          <text x="10" y="70" fill="#f5f5f5">2. MySQL 最终事务落盘:</text>
          <text x="16" y="84" fill="#f5f5f5">   UPDATE goods SET stock = stock - 1</text>
          <text x="16" y="98" fill="#f5f5f5">   WHERE id = 1 AND stock &gt;= 1;</text>
          <text x="10" y="116" fill="#f5f5f5">✓ 数据库 CPU 波动 &lt; 5%，丝滑完成数十亿秒杀！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 将海量不可控洪峰转化为平稳均匀的清流；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 彻底消灭行锁争用导致的数据库死锁暴跌；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造现代电商大促最高殿堂级架构！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
