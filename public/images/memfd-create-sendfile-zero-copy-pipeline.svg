<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">下行推流零拷贝革命：memfd_create + sendfile DMA 直通网卡</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">传统 read/write (4 次上下文切换 + 4 次内存拷贝打爆总线) vs sendfile (0 CPU 拷贝，DMA 引擎直推网卡 Ring Buffer)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Traditional IO -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 I/O 模型：内存总线严重堵塞</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">1. read(fileFd, userBuf) ──► DMA 拷贝到内核页缓存</text>
          <text y="28" fill="#ef4444">2. CPU 拷贝到用户态 userBuf (第 1 次 CPU 耗时！)</text>
          <text y="44" fill="#f87171">3. write(socketFd, userBuf) ──► 用户态切入内核态</text>
          <text y="58" fill="#ef4444">4. CPU 拷贝到 Socket 发送缓冲区 (第 2 次 CPU 耗时！)</text>
          <text y="74" fill="#38bdf8">5. DMA 将 Socket 缓冲区数据推入网卡硬件</text>
          
          <text y="100" fill="#ef4444">🔴 恶果：推流 40Gbps 需消耗 160Gbps 内存带宽，CPU 100% 满载！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">性能瓶颈：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 内存总线（Memory Bus）成为最大瓶颈；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 频繁用户态/内核态上下文切换导致高时延；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 单机推流极限仅能达到 8~10Gbps！</text>
      </g>
    </g>

    <!-- Right: Zero-Copy -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ memfd_create + sendfile 零拷贝直通</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 创建纯 RAM 匿名文件并预填充 64MB 随机块</text>
          <text y="28" fill="#86efac">fd := memfd_create("speedtest_sink", MFD_CLOEXEC);</text>
          
          <text y="50" fill="#38bdf8">// 零拷贝直推网卡：仅传递文件描述符与内存指针</text>
          <text y="64" fill="#34d399">sendfile(socketFd, fd, &amp;offset, 1073741824); // 推流 1GB</text>
          
          <text y="86" fill="#4ade80">1. 数据完全不经过用户态内存，0 CPU 拷贝！</text>
          <text y="100" fill="#4ade80">2. DMA 引擎直接从 RAM 页面将数据推入网卡 TX Ring！</text>
          <text y="114" fill="#4ade80">✓ 单核推流突破 40Gbps，CPU 使用率仅 3%！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 彻底释放 CPU 算力与内存带宽；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 单台 1U 服务器支撑 100Gbps 超大带宽测速；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 工业级高性能服务端基建巅峰！</text>
      </g>
    </g>
  </g>
</svg>