<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="evidence-engineering-reproducibility-chain-title evidence-engineering-reproducibility-chain-desc"><title id="evidence-engineering-reproducibility-chain-title">证据工程与可复现性链条：环境基准、原始输出落盘与不可篡改审计流</title><desc id="evidence-engineering-reproducibility-chain-desc">证据工程与可复现性链条：环境基准、原始输出落盘与不可篡改审计流</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">证据工程四阶段：从执行环境锁定到原始输出落盘的可复现链路</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">锁定环境与依赖 ──► 自动化可复现命令 ──► 原始 Raw Output 全量归档 ──► 派生指标公式手算核验</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">阶段 1: 环境固化与版本元数据锁定 (Environment Pinning)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">OS: Linux 6.6, CPU: 8c AMD, Go: 1.23.1, Commit: 7a8b9c, Timestamp: 2026-08-30</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">记录完整硬件拓扑、内核版本、运行时版本、Git Commit Hash 与精确时间，消除环境差异！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">阶段 2: 独立可执行脚本与确定性输入 (Deterministic Input)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">./run_experiment.sh --iterations=1000 --seed=42 --concurrency=16</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">所有实验必须打包为单一脚本，提供确定性输入与伪随机种子，任何工程师一键均可原地 100% 复现！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">阶段 3: 原始输出 (Raw Output) 全量落盘归档</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">evidence/slug/date/raw_run.log &amp; perf.data (完整原始控制台输出与 Trace 追踪)</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">禁止仅保存二次加工的摘要数据，必须完整封存原始文本与二进制数据，支撑后续溯源与重新分析！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">阶段 4: 派生公式与手算双重校验 (Mathematical Verification)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">吞吐量 = (Total Bytes * 8) / Time; 相对提升 = (Old - New) / Old * 100%</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">显式写明统计聚合公式，手算复核分母与单位转换，确保文章正文数字全链条 100% 严丝合缝！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
