<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">证据工程四阶段：从执行环境锁定到原始输出落盘的可复现链路</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">锁定环境与依赖 ──► 自动化可复现命令 ──► 原始 Raw Output 全量归档 ──► 派生指标公式手算核验</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">阶段 1: 环境固化与版本元数据锁定 (Environment Pinning)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">OS: Linux 6.6, CPU: 8c AMD, Go: 1.23.1, Commit: 7a8b9c, Timestamp: 2026-08-30</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">记录完整硬件拓扑、内核版本、运行时版本、Git Commit Hash 与精确时间，消除环境差异！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">阶段 2: 独立可执行脚本与确定性输入 (Deterministic Input)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">./run_experiment.sh --iterations=1000 --seed=42 --concurrency=16</text>
        <text x="15" y="62" font-size="8" fill="#047857">所有实验必须打包为单一脚本，提供确定性输入与伪随机种子，任何工程师一键均可原地 100% 复现！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">阶段 3: 原始输出 (Raw Output) 全量落盘归档</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">evidence/slug/date/raw_run.log &amp; perf.data (完整原始控制台输出与 Trace 追踪)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">禁止仅保存二次加工的摘要数据，必须完整封存原始文本与二进制数据，支撑后续溯源与重新分析！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">阶段 4: 派生公式与手算双重校验 (Mathematical Verification)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">吞吐量 = (Total Bytes * 8) / Time; 相对提升 = (Old - New) / Old * 100%</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">显式写明统计聚合公式，手算复核分母与单位转换，确保文章正文数字全链条 100% 严丝合缝！</text>
      </g>
    </g>
  </g>
</svg>