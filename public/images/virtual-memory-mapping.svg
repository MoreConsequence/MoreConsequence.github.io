<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="vm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="12" fill="#fafbff" stroke="#d7def0"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">malloc(1GB) 之后：虚拟地址空间、多级页表与物理页框的关系</text>

  <text x="60" y="66" font-size="13" font-weight="700" fill="#0f172a">虚拟地址空间（进程视角）</text>
  <rect x="60" y="78" width="210" height="300" rx="8" fill="#fff" stroke="#d7def0"/>
  <g font-size="11">
    <rect x="72" y="90" width="186" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/>
    <text x="165" y="103" text-anchor="middle" fill="#3730a3">代码 / 数据</text>
    <text x="165" y="117" text-anchor="middle" fill="#3730a3" font-size="10">已映射（文件页）</text>
    <rect x="72" y="132" width="186" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/>
    <text x="165" y="145" text-anchor="middle" fill="#3730a3">堆（已 touch 部分）</text>
    <text x="165" y="159" text-anchor="middle" fill="#3730a3" font-size="10">已映射（匿名页）</text>
    <rect x="72" y="174" width="186" height="120" rx="5" fill="#fef9e7" stroke="#eab308" stroke-dasharray="4 3"/>
    <text x="165" y="228" text-anchor="middle" fill="#92400e">malloc 出来的大洞</text>
    <text x="165" y="244" text-anchor="middle" fill="#92400e">只有 VMA 记录，</text>
    <text x="165" y="260" text-anchor="middle" fill="#92400e">没有页表项、</text>
    <text x="165" y="276" text-anchor="middle" fill="#92400e">不占物理内存</text>
    <rect x="72" y="302" width="186" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/>
    <text x="165" y="315" text-anchor="middle" fill="#3730a3">栈</text>
    <text x="165" y="329" text-anchor="middle" fill="#3730a3" font-size="10">已映射（匿名页）</text>
    <rect x="72" y="344" width="186" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="165" y="361" text-anchor="middle" fill="#475569">其他区域（共享库、mmap…）</text>
  </g>

  <text x="320" y="66" font-size="13" font-weight="700" fill="#0f172a">地址翻译：页表 + TLB</text>
  <rect x="320" y="78" width="250" height="300" rx="8" fill="#fff" stroke="#d7def0"/>
  <g font-size="11">
    <rect x="332" y="90" width="226" height="40" rx="5" fill="#f0fdf4" stroke="#34d399"/>
    <text x="445" y="106" text-anchor="middle" fill="#065f46">TLB（Translation Lookaside Buffer）</text>
    <text x="445" y="122" text-anchor="middle" fill="#065f46" font-size="10">虚拟页号 → 物理页框号 的硬件缓存</text>
    <text x="445" y="158" text-anchor="middle" font-size="11" fill="#64748b">未命中 ↓ 查页表</text>
    <rect x="332" y="172" width="226" height="34" rx="5" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="445" y="185" text-anchor="middle" fill="#5b21b6">页全局目录（PGD）</text>
    <text x="445" y="199" text-anchor="middle" fill="#5b21b6" font-size="10">每进程一张 · 记录 4 级树的根</text>
    <rect x="382" y="212" width="176" height="30" rx="5" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="470" y="231" text-anchor="middle" fill="#5b21b6">页上级目录（PUD）</text>
    <rect x="432" y="248" width="126" height="30" rx="5" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="495" y="267" text-anchor="middle" fill="#5b21b6">页中间目录（PMD）</text>
    <rect x="482" y="284" width="76" height="30" rx="5" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="520" y="303" text-anchor="middle" fill="#5b21b6">页表项（PTE）</text>
    <text x="445" y="340" text-anchor="middle" fill="#64748b">多级表：没映射的级根本不分配，</text>
    <text x="445" y="356" text-anchor="middle" fill="#64748b">64 位下也只要几十 KB 而非天文数字</text>
  </g>

  <text x="620" y="66" font-size="13" font-weight="700" fill="#0f172a">物理内存（页框数组）</text>
  <rect x="620" y="78" width="240" height="300" rx="8" fill="#fff" stroke="#d7def0"/>
  <g font-size="10.5">
    <rect x="632" y="90" width="216" height="30" rx="5" fill="#ecfdf5" stroke="#34d399"/>
    <text x="740" y="109" text-anchor="middle" fill="#065f46">页框 #0 · 内核</text>
    <rect x="632" y="126" width="216" height="30" rx="5" fill="#ecfdf5" stroke="#34d399"/>
    <text x="740" y="145" text-anchor="middle" fill="#065f46">页框 #1 · 代码页</text>
    <rect x="632" y="162" width="216" height="30" rx="5" fill="#ecfdf5" stroke="#34d399"/>
    <text x="740" y="181" text-anchor="middle" fill="#065f46">页框 #2 · 堆页</text>
    <rect x="632" y="198" width="216" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="740" y="217" text-anchor="middle" fill="#64748b">页框 #3 · 空闲</text>
    <rect x="632" y="234" width="216" height="30" rx="5" fill="#fee2e2" stroke="#ef4444"/>
    <text x="740" y="253" text-anchor="middle" fill="#7f1d1d">页框 #4 · 回收中（待重新分配）</text>
    <rect x="632" y="270" width="216" height="30" rx="5" fill="#ecfdf5" stroke="#34d399"/>
    <text x="740" y="289" text-anchor="middle" fill="#065f46">页框 #5 · 堆页</text>
    <text x="740" y="330" text-anchor="middle" fill="#64748b">缺页（major fault）时：</text>
    <text x="740" y="346" text-anchor="middle" fill="#64748b">从磁盘读文件页 / 换出页，</text>
    <text x="740" y="362" text-anchor="middle" fill="#64748b">毫秒级；minor fault 直接复用</text>
  </g>

  <g stroke="#6366f1" stroke-width="1.6" fill="none" marker-end="url(#vm-arrow)">
    <path d="M 270 250 C 290 250, 290 290, 332 295"/>
    <path d="M 570 150 C 600 150, 600 160, 632 160"/>
    <path d="M 570 300 C 600 300, 600 205, 632 205"/>
  </g>
  <g font-size="11" fill="#4f46e5">
    <text x="282" y="290" font-size="10">首次 touch → 分配物理页 + 建立 PTE</text>
    <text x="576" y="146" font-size="10">PTE 命中页框</text>
    <text x="576" y="316" font-size="10">PTE 指向页框</text>
  </g>
</svg>
