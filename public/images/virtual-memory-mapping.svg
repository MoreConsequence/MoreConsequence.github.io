<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Linux 虚拟内存映射与缺页异常机理：从 malloc(1GB) 到物理页框分配</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">VMA 虚拟内存区域记录 vs 四级稀疏页表（PGD/PUD/PMD/PTE）vs 物理页框按需延迟分配（Lazy Allocation）</text>
  </g>

  <!-- 3 Equal Columns (280px each, gap 30px) -->
  <g transform="translate(30, 75)">
    <!-- Column 1: Virtual Address Space -->
    <g filter="url(#card-shadow)">
      <rect width="280" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="280" height="36" rx="8" fill="#f1f5f9"/>
      <text x="140" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">1. 进程虚拟地址空间 (VMA)</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <rect x="0" y="0" width="248" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="124" y="17" fill="#1e40af" font-weight="600" text-anchor="middle">代码段 / 数据段 (.text / .data)</text>

        <rect x="0" y="32" width="248" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="124" y="49" fill="#1e40af" font-weight="600" text-anchor="middle">堆内存 (已 Touch 写入部分)</text>

        <!-- Big Malloc Hole -->
        <rect x="0" y="64" width="248" height="88" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="124" y="88" fill="#c2410c" font-weight="700" text-anchor="middle">malloc(1GB) 虚拟内存空洞</text>
        <text x="124" y="106" fill="#9a3412" text-anchor="middle">仅内核生成 `vm_area_struct`</text>
        <text x="124" y="122" fill="#9a3412" text-anchor="middle">❌ 无页表项 · ❌ 0 字节物理内存</text>
        <text x="124" y="138" fill="#ea580c" font-weight="600" text-anchor="middle">瞬间完成（耗时 &lt; 1μs）</text>

        <rect x="0" y="158" width="248" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="124" y="175" fill="#1e40af" font-weight="600" text-anchor="middle">动态共享库映射区 (mmap)</text>

        <rect x="0" y="190" width="248" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="124" y="207" fill="#1e40af" font-weight="600" text-anchor="middle">用户调用栈 (Stack 8MB 上限)</text>
      </g>
    </g>

    <!-- Column 2: Address Translation & Multi-level Page Table -->
    <g transform="translate(310, 0)" filter="url(#card-shadow)">
      <rect width="280" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="280" height="36" rx="8" fill="#f1f5f9"/>
      <text x="140" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">2. 地址翻译：TLB 与四级页表</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- TLB Box -->
        <rect x="0" y="0" width="248" height="36" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="124" y="17" fill="#166534" font-weight="700" text-anchor="middle">CPU TLB 硬件快表 (0.5ns)</text>
        <text x="124" y="30" fill="#15803d" font-size="9.5" text-anchor="middle">虚拟页号 (VPN) ──► 物理页框号 (PFN)</text>

        <!-- Page Table Tree -->
        <g transform="translate(0, 44)" font-family="ui-monospace, monospace" font-size="10.5">
          <rect x="0" y="0" width="248" height="25" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="12" y="17" fill="#334155">CR3 ──► PGD (页全局目录)</text>

          <rect x="20" y="30" width="228" height="25" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="32" y="47" fill="#334155">└──► PUD (页上级目录)</text>

          <rect x="40" y="60" width="208" height="25" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="52" y="77" fill="#334155">     └──► PMD (页中间目录)</text>

          <rect x="60" y="90" width="188" height="25" rx="3" fill="#f8fafc" stroke="#2563eb"/>
          <text x="72" y="107" fill="#1d4ed8" font-weight="700">          └──► PTE (页表项)</text>
        </g>

        <!-- Note -->
        <rect x="0" y="168" width="248" height="48" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="184" fill="#475569" font-size="10">多级页表稀疏分配：未 touch 区域</text>
        <text x="10" y="198" fill="#475569" font-size="10">不分配 PMD/PTE，48位地址空间仅需</text>
        <text x="10" y="210" fill="#2563eb" font-size="10" font-weight="700">几十 KB 内存开销而非 512GB！</text>
      </g>
    </g>

    <!-- Column 3: Physical Page Frames -->
    <g transform="translate(620, 0)" filter="url(#card-shadow)">
      <rect width="280" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="280" height="36" rx="8" fill="#f1f5f9"/>
      <text x="140" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">3. 物理内存 (Page Frames)</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <rect x="0" y="0" width="248" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="12" y="20" fill="#334155">页框 #001 · 内核常驻代码</text>

        <rect x="0" y="36" width="248" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="12" y="56" fill="#334155">页框 #002 · 业务代码段 (只读)</text>

        <rect x="0" y="72" width="248" height="34" rx="4" fill="#ecfdf5" stroke="#10b981"/>
        <text x="12" y="93" fill="#047857" font-weight="700">页框 #003 · 匿名脏页 (已分配 4KB)</text>

        <rect x="0" y="112" width="248" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="12" y="132" fill="#64748b">页框 #004 · 空闲物理内存 (Free)</text>

        <!-- Page fault trigger -->
        <rect x="0" y="152" width="248" height="64" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="170" fill="#1e40af" font-weight="700">⚡ 首次写入触发 Page Fault：</text>
        <text x="10" y="188" fill="#334155" font-size="10.5">• Minor Fault：分配 4KB 物理页并填 PTE</text>
        <text x="10" y="204" fill="#334155" font-size="10.5">• Major Fault：从磁盘交换分区换入数据</text>
      </g>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(30, 375)">
    <rect width="900" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <text x="450" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      💡 <tspan font-weight="700" fill="#0f172a">核心结论：</tspan> Linux 采用 <tspan font-weight="700" fill="#2563eb">Overcommit 乐观承诺策略</tspan>，`malloc(1GB)` 仅申请虚拟区间；直到首字节写入（First Touch）产生缺页中断，内核才以 <tspan font-weight="700" fill="#ea580c">4KB 页为单位</tspan> 真实切出物理内存。
    </text>
  </g>
</svg>
