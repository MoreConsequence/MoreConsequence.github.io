<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Redis bgsave 物理机理：fork() 写时复制 (COW) 与内存翻倍风险</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">主进程 fork 子进程 (拷贝页表，共享物理内存) ──► 业务写操作触发 OS 页面拷贝 (Copy-On-Write) ──► 突发大写入可能导致 OOM 崩溃</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: fork & COW mechanism -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. fork() 与只读共享页表 (Shared Memory Pages)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">1. 主进程调用 fork() 创建子进程 (仅拷贝页表，耗时几毫秒)</text>
          <text y="28" fill="#86efac">2. 所有 4KB 物理内存页被操作系统标记为 Read-Only 共享</text>
          
          <text y="50" fill="#34d399">子进程行为：</text>
          <text y="64" fill="#cbd5e1">• 顺序遍历共享内存数据，写出 rdb.dump 文件</text>
          <text y="78" fill="#cbd5e1">• 0 内存开销，0 阻塞主进程处理客户端请求！</text>
          
          <text y="104" fill="#4ade80">✓ 极速高效的快照备份机制！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 内存利用率极高；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 产生不可变点快照（Point-in-Time Snapshot）；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极简备份方案。</text>
      </g>
    </g>

    <!-- Right: COW Memory Spike -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 突发写流量下的 Copy-On-Write 内存暴击</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">主进程修改某条 Key 数据 ──► 触发 CPU 缺页中断！</text>
          
          <text y="36" fill="#ef4444">OS COW 机制：</text>
          <text y="50" fill="#ef4444">1. 操作系统被迫将该 4KB 物理页单独复制一份全新副本！</text>
          <text y="64" fill="#ef4444">2. 主进程在私有新页上修改，子进程继续读旧只读页</text>
          
          <text y="88" fill="#f87171">💥 若 bgsave 期间发生海量写操作 (如 80% 数据被修改):</text>
          <text y="104" fill="#ef4444">🔴 实例内存占用从 16GB 瞬间飙升至 30GB，直接触发 OOM-Killer！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产防灾准则：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 单实例内存严禁超过 16GB；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 必须预留至少 40% 的机器物理空闲内存；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 开启 vm.overcommit_memory = 1！</text>
      </g>
    </g>
  </g>
</svg>