<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 会话树不可变 JSONL Schema 与父子指针拓扑</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">每一条记录包含 { id, parent_id, role, content, tool_calls } ──► 基于 parent_id 天然形成有向无环图 (DAG 会话树)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 根节点初始化 (Root Node: id="m1", parent_id=null)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">写入首条用户输入: "帮我实现 JWT 鉴权" ──► 作为整棵会话树的共同根基</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">会话 DAG 树源头！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 线性顺序增长 (Linear Growth: m2 -&gt; m3 -&gt; m4)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">每发生一次交互追加单行 JSON ──► parent_id 始终指向上一条记录 ──► 0 锁追加写入</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">享受极其轻量的高速磁盘追加性能！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 树状分叉创建平行分支 (Fork Branch: id="m4_alt", parent_id="m3")</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">用户想要尝试 Session Cookie 替代方案 ──► 直接指定 parent_id="m3" ──► 开启全新独立推演分支</text>
        <text x="15" y="62" font-size="8" fill="#047857">完全复用 m1..m3 历史，0 重复数据拷贝！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 线性回溯链重构 (Path Reconstruction: Leaf -&gt; Root)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">给定任意叶子节点 ID ──► 沿 parent_id 指针反向回溯并 reverse() ──► 0 毫秒重构当前活跃上下文！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代 AI IDE 必备的分支版本控制数据模型！</text>
      </g>
    </g>
  </g>
</svg>