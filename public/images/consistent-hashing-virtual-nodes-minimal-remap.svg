<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">一致性哈希数学本质：普通哈希雪崩 vs 哈希环最小化数据迁移</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">传统 hash(k) % N (加一台机器导致 85.4% 数据迁移与全网缓存雪崩) ｜ 一致性哈希 (新增节点仅迁移相邻段约 1/N 数据)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Modulo N Avalanche -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 hash(k) % N：扩容引发全网雪崩</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 假设原有 6 台机器 (N=6)，扩容到 7 台 (N=7)</text>
          <text y="30" fill="#fca5a5">1. hash("user_1") % 6 = 2 ──► hash("user_1") % 7 = 5 (失效！)</text>
          <text y="46" fill="#fca5a5">2. hash("user_2") % 6 = 4 ──► hash("user_2") % 7 = 1 (失效！)</text>
          
          <text y="70" fill="#ef4444">🔴 迁移比例统计学期望：</text>
          <text y="86" fill="#fb7185">数据重映射率高达: (N) / (N + 1) = 6/7 ≈ 85.7%！</text>
          <text y="104" fill="#ef4444">► 85.7% 的请求全部穿透击穿到下游数据库，瞬间压垮系统！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">致命痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 节点增减导致全量路由表剧烈震荡；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 缓存命中率瞬间断崖式下跌归零；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法支撑动态弹性伸缩的分布式系统！</text>
      </g>
    </g>

    <!-- Right: Consistent Hashing -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 一致性哈希环：加一台仅搬迁 14.6% 数据</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">1. 2^32 环形空间: 节点与 Key 映射到环上相同地址空间</text>
          <text y="28" fill="#86efac">2. 顺时针最近路由: Key 顺时针寻找第一个节点作为宿主</text>
          
          <text y="50" fill="#38bdf8">3. 引入虚拟节点 (如每节点 160 个虚拟槽位):</text>
          <text y="64" fill="#4ade80">   • 消除数据倾斜，方差 stddev &lt; 3%</text>
          <text y="78" fill="#34d399">   • 加一台机器时：理论仅迁移 1/(N+1) = 1/7 ≈ 14.28%！</text>
          
          <text y="102" fill="#4ade80">✓ 85.7% 的现有缓存命中坚如磐石，平滑无感扩缩容！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 广泛应用于 Memcached、Cassandra、DynamoDB、Envoy；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 节点宕机仅影响该节点负责的局部数据；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 分布式系统最优雅的数据路由数学基石！</text>
      </g>
    </g>
  </g>
</svg>