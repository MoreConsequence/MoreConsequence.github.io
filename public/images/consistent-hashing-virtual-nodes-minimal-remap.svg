<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="consistent-hashing-virtual-nodes-minimal-remap-title consistent-hashing-virtual-nodes-minimal-remap-desc"><title id="consistent-hashing-virtual-nodes-minimal-remap-title">一致性哈希数学直觉：2^32 哈希环、虚拟节点负载均衡与加减机器最小化数据迁移</title><desc id="consistent-hashing-virtual-nodes-minimal-remap-desc">一致性哈希数学直觉：2^32 哈希环、虚拟节点负载均衡与加减机器最小化数据迁移</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">一致性哈希数学本质：普通哈希雪崩 vs 哈希环最小化数据迁移</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">传统 hash(k) % N (加一台机器导致 85.4% 数据迁移与全网缓存雪崩) ｜ 一致性哈希 (新增节点仅迁移相邻段约 1/N 数据)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 传统 hash(k) % N：扩容引发全网雪崩</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 假设原有 6 台机器 (N=6)，扩容到 7 台 (N=7)</text>
          <text y="30" fill="#f5f5f5">1. hash("user_1") % 6 = 2 ──► hash("user_1") % 7 = 5 (失效！)</text>
          <text y="46" fill="#f5f5f5">2. hash("user_2") % 6 = 4 ──► hash("user_2") % 7 = 1 (失效！)</text>

          <text y="70" fill="#f5f5f5">🔴 迁移比例统计学期望：</text>
          <text y="86" fill="#fb7185">数据重映射率高达: (N) / (N + 1) = 6/7 ≈ 85.7%！</text>
          <text y="104" fill="#f5f5f5">► 85.7% 的请求全部穿透击穿到下游数据库，瞬间压垮系统！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">致命痛点：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 节点增减导致全量路由表剧烈震荡；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 缓存命中率瞬间断崖式下跌归零；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 无法支撑动态弹性伸缩的分布式系统！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 一致性哈希环：加一台仅搬迁 14.6% 数据</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">1. 2^32 环形空间: 节点与 Key 映射到环上相同地址空间</text>
          <text y="28" fill="#f5f5f5">2. 顺时针最近路由: Key 顺时针寻找第一个节点作为宿主</text>

          <text y="50" fill="#f5f5f5">3. 引入虚拟节点 (如每节点 160 个虚拟槽位):</text>
          <text y="64" fill="#f5f5f5">   • 消除数据倾斜，方差 stddev &lt; 3%</text>
          <text y="78" fill="#f5f5f5">   • 加一台机器时：理论仅迁移 1/(N+1) = 1/7 ≈ 14.28%！</text>

          <text y="102" fill="#f5f5f5">✓ 85.7% 的现有缓存命中坚如磐石，平滑无感扩缩容！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 广泛应用于 Memcached、Cassandra、DynamoDB、Envoy；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 节点宕机仅影响该节点负责的局部数据；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 分布式系统最优雅的数据路由数学基石！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
