<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">全球智能覆盖网探测路由：打破公网 BGP 次优路由与拥塞黑洞</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">公网 BGP 直连 (跨洋丢包率 8%, RTT 280ms) vs 边缘全互联私网中继 (经由法兰克福专线中转，丢包率 0%, RTT 160ms)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Public Internet BGP -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 公网 BGP 路由：商业利益驱动的次优黑洞</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 传统公网路由遵循 AS-Path 最短与商业计费</text>
          <text y="28" fill="#fca5a5">1. 从新加坡访问美东源站:</text>
          <text y="44" fill="#ef4444">   • 遭遇跨洋海底光缆拥塞与骨干网丢包</text>
          <text y="60" fill="#ef4444">   • 跨运营商互联对等点 (Peering) 吞吐严重受限</text>
          <text y="76" fill="#f87171">   • 实际 RTT: 280ms | 丢包率: 6%~10%</text>
          
          <text y="104" fill="#ef4444">🔴 动态 API 交互频繁超时失败！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• BGP 无法感知真实丢包与拥塞质量；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• TCP 遇到丢包窗口迅速减半断崖式下降；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法满足跨国业务实时性要求！</text>
      </g>
    </g>

    <!-- Right: Smart Overlay Mesh -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 智能覆盖网 (Smart Overlay Mesh)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 全球 PoP 节点高频探针与 Dijkstra 动态寻径</text>
          <text y="28" fill="#86efac">1. 每秒发送 UDP 探测包度量全网拓扑丢包与 Jitter</text>
          <text y="44" fill="#38bdf8">2. 发现直连拥塞时，毫秒级自动改道中继:</text>
          <text y="60" fill="#34d399">   新加坡 ──► 东京 PoP ──► 私有专网专线 ──► 美东源站</text>
          <text y="76" fill="#4ade80">   • 实际 RTT: 155ms | 丢包率: 0.00%</text>
          
          <text y="104" fill="#4ade80">✓ 动态 API 响应速度提升 300%！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 结合 BBR 算法榨干私有骨干专网带宽；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 彻底消除跨国链路抖动；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造全球极致流畅的动态交互体验！</text>
      </g>
    </g>
  </g>
</svg>