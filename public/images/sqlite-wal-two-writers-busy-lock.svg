<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">SQLite WAL 模式并发架构与 SQLITE_BUSY 物理锁冲突机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">读写互不阻塞 (Read-Write Concurrency) vs 单写者排他锁 (Single-Writer Lock) ──► 0.4ms 瞬间返回 BUSY</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: WAL Concurrency Flow -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. WAL 模式读写并发 (Read-Write Non-Blocking)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#34d399">// Write-Ahead Logging 架构</text>
          <text x="10" y="34" fill="#86efac">• 主数据库文件 db.sqlite (只读基础快照)</text>
          <text x="10" y="48" fill="#86efac">• 预写日志文件 db.sqlite-wal (追加写入新页)</text>
          <text x="10" y="62" fill="#86efac">• 共享内存映射 db.sqlite-shm (WAL 索引检索)</text>
          <text x="10" y="82" fill="#38bdf8">✓ 多个读者 (Reader 1~N) 纯读历史快照，零锁等待</text>
          <text x="10" y="98" fill="#38bdf8">✓ 写入者 (Writer) 追加写 WAL 文件，不阻塞读者</text>
          <text x="10" y="118" fill="#34d399">► 彻底终结了 Rollback Journal 时代的读写互相阻塞！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">核心优势：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 读性能提升 10x 倍，支持无限并发读连接；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 写入仅需顺序追加 WAL，磁盘 IO 更加平滑；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 定期通过 Checkpoint 将 WAL 刷回主数据库。</text>
      </g>
    </g>

    <!-- Right: Two Writers Collision -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. 双写者冲突与 SQLITE_BUSY 机制</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// 物理约束：SQLite 严格只允许 1 个写者！</text>
          <text x="10" y="34" fill="#fca5a5">T1: Writer A 开启写事务，持有 WAL 写锁</text>
          <text x="10" y="52" fill="#fca5a5">T2 (0.1ms后): Writer B 也尝试执行写入操作</text>
          <text x="10" y="70" fill="#ef4444">T3: SQLite 不提供内核排队队列！</text>
          <text x="10" y="86" fill="#ef4444">    在 0.4ms 内瞬间向 Writer B 抛出错误：</text>
          <text x="10" y="104" font-weight="700" fill="#fb7185">    --&gt; SQLITE_BUSY: database is locked !</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产标准解法：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">1. <tspan font-weight="700">配置忙碌重试超时</tspan>：PRAGMA busy_timeout = 5000;</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">2. <tspan font-weight="700">应用层单写队列</tspan>：所有写请求通过单一 Go channel / 队列串行化</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">3. <tspan font-weight="700">使用 BEGIN IMMEDIATE</tspan> 提早加锁，彻底杜绝死锁！</text>
      </g>
    </g>
  </g>
</svg>