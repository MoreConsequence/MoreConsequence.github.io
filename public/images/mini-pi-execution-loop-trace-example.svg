<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Mini Pi 真实任务端到端执行全链路轨迹 (Trace Walkthrough)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 用户: "修复 utils.ts 中的除零 Bug" ──► 2. Step 1: view_file ──► 3. Step 2: replace_file_content ──► 4. Step 3: run_command ──► 5. 交付</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Step 1: 现场勘查 (Thought: "首先查看 utils.ts 的 divide 函数实现")</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Tool Call: view_file({ AbsolutePath: "/workspace/utils.ts" }) ──► Observation: 获取到 15 行源码</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">定位确切代码病灶！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. Step 2: 精准补丁应用 (Thought: "在除数为 0 时增加防护判断")</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">Tool Call: replace_file_content({ TargetFile: "utils.ts", TargetContent: "return a / b", ReplacementContent: "if (b === 0) throw new Error(); return a / b" })</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">修改代码并持久化到本地工作区！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. Step 3: 运行测试实测验证 (Thought: "运行 jest 验证测试是否通过")</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Tool Call: run_command({ CommandLine: "npm test" }) ──► Observation: PASS src/utils.test.ts (Tests: 5 passed)</text>
        <text x="15" y="62" font-size="8" fill="#047857">取得物理系统绿灯铁证！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. Final Step: 成果交付总结 (Thought: "测试已全部通过，向用户提交修复报告")</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">模型输出结论文本 ──► 标记任务 Completed ──► 完美达成自主编码重构全闭环！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">300 行微内核支撑起强大的自主工程能力！</text>
      </g>
    </g>
  </g>
</svg>