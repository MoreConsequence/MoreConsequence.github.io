<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Google BBR 拥塞控制四阶段状态机 (BBR State Machine)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. Startup (2.89x 指数探测 BtlBw) ──► 2. Drain (排空队列积压) ──► 3. ProbeBW (8 步巡航探测新带宽) ──► 4. ProbeRTT (每 10s 抽空队列测 RTprop)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Startup (极速启动)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#38bdf8">pacing_gain = 2.89 (2/ln2)</text>
          
          <text x="8" y="38" fill="#86efac">• 快速成倍增加发包速率</text>
          <text x="8" y="58" fill="#cbd5e1">• 寻找瓶颈带宽 (BtlBw)</text>
          <text x="8" y="78" fill="#fed7aa">• 当连续 3 轮 RTT 带宽不再增长 25%，判定到达上限！</text>
          
          <text x="8" y="112" fill="#4ade80">✓ 极速吃满千兆物理带宽！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="8" y="34" font-size="7.5" fill="#1d4ed8">• 替代传统慢启动；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 仅耗费数个 RTT 即可达到峰值；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 打造极速爆发力。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. Drain (队列排空)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#fb923c">pacing_gain = 1 / 2.89 = 0.35</text>
          
          <text x="8" y="38" fill="#fed7aa">• Startup 期间超发的数据</text>
          <text x="8" y="58" fill="#fed7aa">• 会在路由器形成队列积压</text>
          <text x="8" y="78" fill="#34d399">• 主动降速发包，将多余的飞行数据彻底排空！</text>
          
          <text x="8" y="112" fill="#4ade80">✓ 队列积压迅速归零！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="8" y="34" font-size="7.5" fill="#9a3412">• 消除缓冲区膨胀诱因；</text>
        <text x="8" y="48" font-size="7.5" fill="#9a3412">• 将时延拉回真实物理基线；</text>
        <text x="8" y="62" font-size="7.5" fill="#ea580c">• 完美的自我修正。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. ProbeBW (稳态巡航)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#4ade80">8 阶段轮循 Gain 数组：</text>
          <text x="8" y="34" fill="#86efac">[1.25, 0.75, 1, 1, 1, 1, 1, 1]</text>
          
          <text x="8" y="58" fill="#38bdf8">• 1.25x 试探是否有更多带宽</text>
          <text x="8" y="78" fill="#34d399">• 0.75x 立即排空试探积压</text>
          <text x="8" y="98" fill="#cbd5e1">• 6 轮 1.0x 平稳稳态巡航</text>
          
          <text x="8" y="118" fill="#4ade80">✓ 99% 时间处于此高效稳态！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="8" y="34" font-size="7.5" fill="#15803d">• 敏锐感知链路带宽动态扩张；</text>
        <text x="8" y="48" font-size="7.5" fill="#15803d">• 吞吐量平稳如镜；</text>
        <text x="8" y="62" font-size="7.5" fill="#047857">• 现代拥塞控制核心。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4. ProbeRTT (测准时延)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="8" y="18" fill="#c084fc">每 10 秒触发 1 次：</text>
          
          <text x="8" y="38" fill="#e9d5ff">• 将 cwnd 强行削减至 4 个包</text>
          <text x="8" y="58" fill="#38bdf8">• 持续 200ms</text>
          <text x="8" y="78" fill="#34d399">• 彻底测准真正的物理纯光纤往返时延 (RTprop)</text>
          
          <text x="8" y="112" fill="#4ade80">✓ 时钟与测量基准校准！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="8" y="18" font-size="8.5" font-weight="700" fill="#7e22ce">设计智慧：</text>
        <text x="8" y="34" font-size="7.5" fill="#6b21a8">• 避免因路由排队导致 RTT 虚高；</text>
        <text x="8" y="48" font-size="7.5" fill="#6b21a8">• 终身校准物理参数；</text>
        <text x="8" y="62" font-size="7.5" fill="#6b21a8">• 顶级控制论工程！</text>
      </g>
    </g>
  </g>
</svg>