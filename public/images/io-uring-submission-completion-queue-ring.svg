<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Linux io_uring 双无锁环形队列 (SQ / CQ Ring Buffer) 架构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">提交队列 (SQ: Submission Queue) ｜ 完成队列 (CQ: Completion Queue) ｜ 用户态与内核态通过 mmap 共享内存 ｜ 0 系统调用完成海量 I/O 下发</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: SQ -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 提交队列 (Submission Queue: SQ Ring)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">struct io_uring_sqe { opcode, fd, addr, len, user_data };</text>
          
          <text y="38" fill="#86efac">无锁下发机制：</text>
          <text y="52" fill="#cbd5e1">1. 应用层在共享内存 SQ 环形队列写入多个 SQE 请求</text>
          <text y="66" fill="#cbd5e1">2. 原子更新 sq.tail 游标</text>
          <text y="80" fill="#34d399">3. 开启 IORING_SETUP_SQPOLL 模式时：</text>
          <text y="94" fill="#34d399">   内核轮询线程自动拾取执行，0 次系统调用！</text>
          
          <text y="118" fill="#4ade80">✓ 单次批量下发上万个 I/O 请求！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 彻底消灭系统调用上下文切换开销；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 批量并行异步下发；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极致低时延通道。</text>
      </g>
    </g>

    <!-- Right: CQ -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 完成队列 (Completion Queue: CQ Ring)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">struct io_uring_cqe { user_data, res, flags };</text>
          
          <text y="38" fill="#86efac">异步回填收割：</text>
          <text y="52" fill="#38bdf8">1. 硬件 I/O 完成后，内核直接向共享内存 CQ 写入 CQE</text>
          <text y="66" fill="#34d399">2. 原子更新 cq.tail 游标</text>
          <text y="80" fill="#34d399">3. 应用层主循环只需读取 cq.head 即可瞬间收割结果</text>
          
          <text y="108" fill="#4ade80">✓ 单机轻松突破 300 万 IOPS 性能巅峰！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 统一现代 Linux 所有文件与网络异步 I/O 模型；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• NVMe SSD 与万兆网络终极加速器；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Linux 操作系统跨时代的工程奇迹！</text>
      </g>
    </g>
  </g>
</svg>