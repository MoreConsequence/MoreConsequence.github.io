<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">InnoDB 16KB 物理页结构与 B+Tree 随机插入页分裂机制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">自增顺序写 (100% 紧凑填充) vs 随机 UUID 写 (频繁 50% 页分裂与 2x 存储膨胀)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Left: 16KB Anatomy (300px) -->
    <g transform="translate(20, 20)">
      <rect width="270" height="345" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="270" height="30" rx="6" fill="#dbeafe"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">1. InnoDB 16KB 页物理布局</text>

      <g transform="translate(12, 42)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="246" height="32" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="8" y="20" font-size="8.5" font-weight="700" fill="#1d4ed8">File Header (38B: 页号/校验和/前后指针)</text>

        <rect y="38" width="246" height="32" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="8" y="20" font-size="8.5" font-weight="700" fill="#1d4ed8">Page Header (56B: 槽位/空闲空间指针)</text>

        <rect y="76" width="246" height="32" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="8" y="20" font-size="8.5" font-weight="700" fill="#1d4ed8">Infimum / Supremum (26B: 虚拟上下界)</text>

        <rect y="114" width="246" height="70" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="8" y="20" font-size="9" font-weight="700" fill="#1e40af">User Records (用户真实行数据)</text>
        <text x="8" y="36" font-size="7.5" fill="#2563eb">• 按主键由小到大单向链表串联</text>
        <text x="8" y="52" font-size="7.5" fill="#2563eb">• 单页装载约数十至数百行</text>

        <rect y="190" width="246" height="32" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="8" y="20" font-size="8.5" font-weight="700" fill="#1d4ed8">Page Directory (页目录槽位二分查找)</text>

        <rect y="228" width="246" height="32" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="8" y="20" font-size="8.5" font-weight="700" fill="#1d4ed8">File Trailer (8B: 尾部校验和)</text>
      </g>
    </g>

    <!-- Right: Page Split Comparison (570px) -->
    <g transform="translate(310, 20)">
      <!-- Case A: Sequential Write -->
      <g>
        <rect width="570" height="160" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="570" height="28" rx="6" fill="#dcfce7"/>
        <text x="12" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#166534">
          模式 A: 自增主键顺序写入 (Sequential Fill Factor ~ 15/16)
        </text>

        <g transform="translate(15, 38)" font-family="ui-sans-serif, system-ui, sans-serif">
          <rect width="540" height="50" rx="4" fill="#0f172a"/>
          <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
            <text y="14" fill="#34d399">Page N [ID: 1000 ~ 1499] ──► 写满后原子分配新 Page N+1 [ID: 1500 ~ 1999]</text>
            <text y="28" fill="#86efac">✓ 零移动旧数据，零页分裂，页填充率高达 93.7% (15/16 紧凑装载)</text>
          </g>
          <text x="0" y="74" font-size="8.5" font-weight="700" fill="#15803d">
            🚀 优势：磁盘顺序 IO，B+Tree 叶子节点物理连续，范围查询性能极佳！
          </text>
        </g>
      </g>

      <!-- Case B: Random UUID Split -->
      <g transform="translate(0, 175)">
        <rect width="570" height="170" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
        <rect width="570" height="28" rx="6" fill="#fecaca"/>
        <text x="12" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">
          模式 B: 随机 UUID 插入 ──► 50% 物理页分裂 (Page Split)
        </text>

        <g transform="translate(15, 38)" font-family="ui-sans-serif, system-ui, sans-serif">
          <rect width="540" height="60" rx="4" fill="#0f172a"/>
          <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
            <text y="14" fill="#f87171">1. 新 UUID 随机命中已满的 Page N 中间位置</text>
            <text y="28" fill="#fca5a5">2. 申请新 Page N+1，强行将 Page N 尾部 50% 数据拷贝过去</text>
            <text y="42" fill="#fb7185">3. 修改父节点指针，更新双向链表 (产生大量随机 IO 与写放大)</text>
          </g>
          <text x="0" y="80" font-size="8.5" font-weight="700" fill="#dc2626">
            ❌ 恶果：页空间利用率骤降至 50% 碎片化，表体积膨胀 2 倍，Buffer Pool 缓存命中率雪崩！
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>