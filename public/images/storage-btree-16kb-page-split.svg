<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="sp-title sp-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
    </style>
  </defs>
  <title id="sp-title">InnoDB 16KB 页结构与 B+Tree 随机插入页分裂 (Page Split) 模型</title>
  <desc id="sp-desc">架构流程图展示 InnoDB 16KB 数据页内部物理布局以及在随机主键插入满载时触发中点分裂、两页半满导致叶填充率骤降至 69% 的物理过程。</desc>
  <defs>
    <marker id="sp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="sp-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">INNODB PAGE ARCHITECTURE · PAGE SPLIT MECHANICS</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">InnoDB 16KB 页结构与随机插入页分裂模型</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">16KB 物理页内部剖析 ➔ 随机插入触发满页中点 50/50 分裂 ➔ 生成两个半满页导致长期填充率暴跌至 69%</text>

  <!-- Top: 16KB Page Layout Strip (y=136..240, h=104) -->
  <g transform="translate(40, 136)">
    <rect width="880" height="104" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="10" width="130" height="16" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="79" y="21" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">INNODB 16KB PAGE</text>
    <text x="154" y="22" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">标准 16KB 数据页物理内部结构 (Physical Page Anatomy)</text>

    <!-- Visual Strip (y=34..90) -->
    <g transform="translate(14, 34)">
      <!-- Fil Header: 38B -->
      <rect x="0" y="0" width="100" height="56" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="50" y="22" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Fil Header (38B)</text>
      <text x="50" y="38" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Page LSN / Space ID</text>
      <text x="50" y="49" fill="#6b6a64" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Prev / Next Page Ptr</text>

      <!-- Page Header: 56B -->
      <rect x="106" y="0" width="110" height="56" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="161" y="22" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Page Header (56B)</text>
      <text x="161" y="38" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Slots / Free Bytes</text>
      <text x="161" y="49" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">槽数量与未分配游标</text>

      <!-- Infimum / Supremum: 26B -->
      <rect x="222" y="0" width="100" height="56" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="272" y="22" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Infimum/Supremum</text>
      <text x="272" y="38" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">26B 虚拟极值边界</text>
      <text x="272" y="49" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">逻辑链表首尾锚点</text>

      <!-- User Records (Focal) -->
      <rect x="328" y="0" width="310" height="56" rx="3" fill="rgba(232,93,63,0.08)" stroke="#e85d3f" stroke-width="1.2"/>
      <text x="483" y="22" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">User Records 用户记录堆 (128B / 行)</text>
      <text x="483" y="38" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">单页满载 ~128 行记录 (单向链表逻辑有序)</text>
      <text x="483" y="49" fill="#e85d3f" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Free Space 耗尽时触发分裂</text>

      <!-- Page Directory: ~100B -->
      <rect x="644" y="0" width="120" height="56" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="704" y="22" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Page Directory</text>
      <text x="704" y="38" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">页目录 (二分查找槽)</text>
      <text x="704" y="49" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">每个 Slot 管辖 4~8 条</text>

      <!-- Fil Trailer: 8B -->
      <rect x="770" y="0" width="82" height="56" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="811" y="22" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Fil Trailer</text>
      <text x="811" y="38" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">8B 尾校验和</text>
      <text x="811" y="49" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">防断电半写</text>
    </g>
  </g>

  <!-- Bottom: Page Split Process (y=256..506, h=250) -->
  <g transform="translate(40, 256)">
    <!-- Card 1: Full Page (w=260) -->
    <g transform="translate(0, 0)">
      <rect width="260" height="250" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
      <rect x="10" y="10" width="80" height="16" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
      <text x="50" y="21" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">BEFORE</text>
      <text x="96" y="22" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">原叶页满载 (Page #10)</text>

      <rect x="10" y="36" width="240" height="80" rx="3" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="0.8"/>
      <text x="18" y="56" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">16KB 满载 (128 行记录)</text>
      <text x="18" y="74" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">Free Space: 0 Bytes (已无缝隙)</text>
      <text x="18" y="92" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">新随机主键 ID=452 试图插入中间</text>
      <text x="18" y="106" fill="#6b6a64" font-size="7" font-family="'Geist', 'Noto Sans SC', sans-serif">页面无处安放，强制触发分裂！</text>

      <text x="10" y="138" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">分裂触发物理机理：</text>
      <text x="10" y="156" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 顺序追加插入：仅在最右页新建</text>
      <text x="10" y="174" fill="#e85d3f" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 随机 UUID 插入：散落在中间任意页</text>
      <line x1="10" y1="186" x2="250" y2="186" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
      <text x="10" y="206" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">必须在中点斩断，迁移 50% 数据</text>
      <text x="10" y="226" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">50/50 Midpoint Split</text>
    </g>

    <!-- Arrow 1 (x=260..290) -->
    <text x="275" y="125" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Split</text>
    <line x1="260" y1="133" x2="290" y2="133" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#sp-arr-accent)"/>

    <!-- Card 2: Split Action (w=280) - Focal -->
    <g transform="translate(290, 0)">
      <rect width="280" height="250" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
      <rect x="10" y="10" width="80" height="16" rx="2" fill="#e85d3f"/>
      <text x="50" y="21" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">ACTION</text>
      <text x="96" y="22" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">中点切开与物理迁移</text>

      <rect x="10" y="36" width="260" height="96" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
      <text x="18" y="56" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">1. 从 Tablespace 申请新物理页 Page #11</text>
      <text x="18" y="74" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">2. 拷贝 Page #10 后半段 64 行 ➔ Page #11</text>
      <text x="18" y="92" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">3. 插入新记录 ID=452 并在两页重构单向链表</text>
      <text x="18" y="110" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">4. 更新 Prev/Next 双向指针与父节点路由</text>

      <text x="10" y="152" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">瞬时 vs 长期代价：</text>
      <text x="10" y="170" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 瞬时写放大：产生 2 个新脏页 + 父更新</text>
      <text x="10" y="188" fill="#e85d3f" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 长期写放大：两个半满页永远空置 50%！</text>
      <line x1="10" y1="200" x2="270" y2="200" stroke="#e85d3f" stroke-width="0.6"/>
      <text x="10" y="220" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">Leaf Fill Ratio: ~100% ➔ ~69.6% 暴跌！</text>
      <text x="10" y="238" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Space Overhead: +43.5%</text>
    </g>

    <!-- Arrow 2 (x=570..600) -->
    <text x="585" y="125" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Result</text>
    <line x1="570" y1="133" x2="600" y2="133" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#sp-arr-accent)"/>

    <!-- Card 3: After Result (w=280) -->
    <g transform="translate(600, 0)">
      <rect width="280" height="250" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
      <rect x="10" y="10" width="80" height="16" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
      <text x="50" y="21" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">AFTER</text>
      <text x="96" y="22" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">分裂后稳态双半满页</text>

      <!-- 2 Sub-page Boxes -->
      <g transform="translate(10, 36)">
        <rect x="0" y="0" width="125" height="74" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
        <text x="10" y="20" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">Page #10 (前半)</text>
        <text x="10" y="36" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">64 行 (50% 填充)</text>
        <text x="10" y="52" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">8KB 空闲碎片</text>
        <text x="10" y="66" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif">等待后续插入填补</text>

        <rect x="135" y="0" width="125" height="74" rx="3" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="0.8"/>
        <text x="10" y="20" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">Page #11 (后半)</text>
        <text x="10" y="36" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">65 行 (50% 填充)</text>
        <text x="10" y="52" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">8KB 空闲碎片</text>
        <text x="10" y="66" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif">等待后续插入填补</text>
      </g>

      <text x="10" y="132" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">20 万行基准数据实测：</text>
      <text x="10" y="150" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">• 顺序插入总页数: 1581 页 (99.9%)</text>
      <text x="10" y="168" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600">• 随机插入总页数: 2268 页 (69.6%)</text>
      <line x1="10" y1="180" x2="270" y2="180" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
      <text x="10" y="200" fill="#e85d3f" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">总页数增加 43.5% 膨胀！</text>
      <text x="10" y="218" fill="#6b6a64" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">严重吃紧 Buffer Pool 缓存命中率</text>
      <text x="10" y="236" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Page Fragmentation Tax</text>
    </g>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">16KB 页结构与分裂前状态</text>
  <rect x="290" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="310" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">中点 50/50 分裂与 69% 填充率暴跌核心</text>
</svg>
