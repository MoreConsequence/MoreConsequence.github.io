<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">HTTP 缓存控制决策流：强缓存 vs 协商缓存完整状态机</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Cache-Control (max-age, no-cache, no-store) ──► ETag / If-None-Match (304 Not Modified 零包体传输)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Panes (285px each) -->
    <!-- Col 1: Strong Cache -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. 强缓存 (0 次网络请求)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#34d399">// 浏览器直接从内存/磁盘装载</text>
          <text x="10" y="36" fill="#86efac">Cache-Control: public, max-age=31536000, immutable</text>
          <text x="10" y="60" fill="#38bdf8">状态码: 200 OK (from memory/disk)</text>
          <text x="10" y="80" fill="#34d399">✓ 耗时: 0ms 瞬间直出！</text>
          <text x="10" y="98" fill="#34d399">✓ 完全不产生任何网络流量！</text>
          <text x="10" y="120" fill="#fbbf24">🎯 适用：带有内容 Hash 的静态资源</text>
          <text x="10" y="134" fill="#fed7aa">如 app.8f2a9c.js, style.e10b4d.css</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">核心参数含义：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• max-age=N: 缓存有效秒数</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• immutable: 用户刷新也不用发请求校验</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 网站更新仅需改变 HTML 内外链 URL！</text>
      </g>
    </g>

    <!-- Col 2: Validation Cache -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. 协商缓存 (304 校验)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 发请求至服务器对比指纹</text>
          <text x="10" y="34" fill="#93c5fd">Cache-Control: no-cache</text>
          <text x="10" y="52" fill="#cbd5e1">Client ──► If-None-Match: "v2-hash"</text>
          <text x="10" y="70" fill="#86efac">Server ──► 比对未变化: 返回 304 Not Modified</text>
          <text x="10" y="90" fill="#34d399">✓ 响应体为 0 字节，极大节省带宽！</text>
          <text x="10" y="112" fill="#f87171">若指纹变化: 返回 200 OK + 新数据</text>
          <text x="10" y="132" fill="#fbbf24">🎯 适用：主入口 index.html 与 API</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">重要区分：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• ETag: 基于文件内容 Hash 精确指纹</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• Last-Modified: 秒级修改时间 (精度略低)</text>
        <text x="10" y="62" font-size="7.5" fill="#1d4ed8">• no-cache 不等于不缓存，而是必须校验！</text>
      </g>
    </g>

    <!-- Col 3: No Store -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">3. 禁止缓存 (no-store)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">// 严禁任何形式存储</text>
          <text x="10" y="36" fill="#fca5a5">Cache-Control: no-store</text>
          <text x="10" y="60" fill="#f87171">• 浏览器不存内存与磁盘</text>
          <text x="10" y="78" fill="#f87171">• 中间代理与 CDN 不得缓存</text>
          <text x="10" y="96" fill="#f87171">• 每次必须穿透回源完整拉取</text>
          <text x="10" y="120" fill="#ef4444">🎯 适用：银行账户、个人敏感隐私、</text>
          <text x="10" y="134" fill="#ef4444">支付交易等高机密性实时接口</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">黄金组合法则：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• HTML 入口: no-cache (随时可更新发布)</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• JS/CSS 静态包: 1年 max-age + immutable</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 兼具极致性能秒开与随时随地秒级热发布！</text>
      </g>
    </g>
  </g>
</svg>