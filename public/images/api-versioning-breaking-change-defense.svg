<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="api-versioning-breaking-change-defense-title api-versioning-breaking-change-defense-desc"><title id="api-versioning-breaking-change-defense-title">API 版本演进与向后兼容防御：Additive Changes 原则与废弃策略</title><desc id="api-versioning-breaking-change-defense-desc">API 版本演进与向后兼容防御：Additive Changes 原则与废弃策略</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">API 契约无破坏性演进原则 (Non-Breaking API Evolution)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 禁改字段类型/删字段 ──► 2. 只增可选字段 ──► 3. 弃用走 Deprecation Header ──► 4. 重大变更升 /v2</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 增量扩展铁律 (Additive Only Rule)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">只新增可选字段，绝不删除字段、重命名字段或变更原有类型 (如 string -&gt; int) ──► 保障老版本客户端 100% 正常工作</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">向后兼容性的第一基石！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 宽容度原则与未知字段忽略 (Robustness Principle: Postel's Law)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">客户端与服务端序列化解析时必须忽略未知新字段 ──► 严禁因收到未定义字段直接 throw Error 崩溃</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">“严于律己，宽于待人”的经典网络健壮性法则！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 渐进式废弃与通知公告 (Gradual Deprecation Flow)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">在 HTTP Response 添加 Header: Deprecation: true 与 Sunset: 2027-01-01 ──► 监控各版本调用方流量分布</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">留出至少 6~12 个月平滑迁移窗口期！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 重大版本物理隔离 (Major Versioning: /api/v2/...)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">破坏性架构重构时发布全新 /v2 端点 ──► v1 与 v2 双轨并行运行 ──► 待 v1 流量降为 0 后优雅下线！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">大型云平台与公共 API 长期稳定运行的最高保障！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
