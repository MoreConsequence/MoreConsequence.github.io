<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">API 契约无破坏性演进原则 (Non-Breaking API Evolution)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 严禁修改已有字段类型或删除字段 ──► 2. 仅允许新增可选字段 (Additive Changes) ──► 3. 弃用字段走 Deprecation Header 告警 ──► 4. 重大变更升级 /v2 独立路由</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 增量扩展铁律 (Additive Only Rule)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">只新增可选字段，绝不删除字段、重命名字段或变更原有类型 (如 string -&gt; int) ──► 保障老版本客户端 100% 正常工作</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">向后兼容性的第一基石！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 宽容度原则与未知字段忽略 (Robustness Principle: Postel's Law)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">客户端与服务端序列化解析时必须忽略未知新字段 ──► 严禁因收到未定义字段直接 throw Error 崩溃</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">“严于律己，宽于待人”的经典网络健壮性法则！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 渐进式废弃与通知公告 (Gradual Deprecation Flow)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">在 HTTP Response 添加 Header: Deprecation: true 与 Sunset: 2027-01-01 ──► 监控各版本调用方流量分布</text>
        <text x="15" y="62" font-size="8" fill="#047857">留出至少 6~12 个月平滑迁移窗口期！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 重大版本物理隔离 (Major Versioning: /api/v2/...)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">破坏性架构重构时发布全新 /v2 端点 ──► v1 与 v2 双轨并行运行 ──► 待 v1 流量降为 0 后优雅下线！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">大型云平台与公共 API 长期稳定运行的最高保障！</text>
      </g>
    </g>
  </g>
</svg>