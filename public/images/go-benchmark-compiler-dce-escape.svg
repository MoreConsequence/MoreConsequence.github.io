<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Benchmark 七大陷阱：死代码消除 (DCE) 与虚假 0.2ns 错觉</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">返回值未赋值给全局变量 ──► 编译器发现无副作用直接将整个计算循环优化抹除 (0.24ns/op)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Wrong Benchmark -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 错误写法：被编译器完全优化抹除 (DCE)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">func BenchmarkHeavyCalc(b *testing.B) {</text>
          <text y="32" fill="#cbd5e1">    for i := 0; i &lt; b.N; i++ {</text>
          <text y="48" fill="#fca5a5">        _ = compute(1000) // 局部变量未使用！</text>
          <text y="64" fill="#cbd5e1">    }</text>
          <text y="80" fill="#f87171">}</text>
          
          <text y="104" fill="#ef4444">🔴 编译器 SSA 优化阶段：</text>
          <text y="120" fill="#fca5a5">"该循环计算结果从未被读取，且无 IO 副作用，全部删除！"</text>
          <text y="136" fill="#fb7185">► 测试结果：0.24 ns/op (其实什么都没跑！)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">经典翻车自欺欺人：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 以为自己写的算法达到了几十亿 QPS；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 上线真实业务后，性能暴跌 1000 倍；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 根本原因：测试用例被编译器死代码消除！</text>
      </g>
    </g>

    <!-- Right: Correct Benchmark -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正确标准姿势：赋值给包级导出全局变量</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">var GlobalSink int // 包级全局变量阻止内联消除</text>
          <text y="32" fill="#86efac">func BenchmarkHeavyCalc(b *testing.B) {</text>
          <text y="48" fill="#cbd5e1">    var r int</text>
          <text y="64" fill="#cbd5e1">    for i := 0; i &lt; b.N; i++ {</text>
          <text y="80" fill="#38bdf8">        r = compute(1000) // 循环内赋值给局部变量</text>
          <text y="96" fill="#cbd5e1">    }</text>
          <text y="112" fill="#34d399">    GlobalSink = r // 循环外一次性逃逸到全局变量</text>
          <text y="128" fill="#86efac">}</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">标准军规：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 保证计算结果被外部可见，阻止 DCE 抹除；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 避免在循环内部直接写全局变量（否则引入锁总线开销）；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 配合 b.ReportAllocs() 与 -gcflags="-m" 查看真实逃逸！</text>
      </g>
    </g>
  </g>
</svg>