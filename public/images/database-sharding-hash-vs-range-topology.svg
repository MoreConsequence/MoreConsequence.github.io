<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="database-sharding-hash-vs-range-topology-title database-sharding-hash-vs-range-topology-desc"><title id="database-sharding-hash-vs-range-topology-title">分库分表分片键策略对比：Hash 取模 (均匀离散) vs Range 范围分片 (时间局部性)</title><desc id="database-sharding-hash-vs-range-topology-desc">分库分表分片键策略对比：Hash 取模 (均匀离散) vs Range 范围分片 (时间局部性)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">数据库分片策略对比：哈希取模 (Hash) vs 范围分片 (Range)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Hash 取模分片 (数据均匀离散分布，但扩容需要数据重平衡且无法做范围查询) vs Range 范围分片 (天然支持按月范围扫描与归档，但最新分片容易打爆热点)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ Hash 取模分片 (如 CRC32(user_id) % 64)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">数据离散分布模型：</text>

          <text y="38" fill="#f5f5f5">• 64 个库表均匀分摊 1000 万用户数据</text>
          <text y="52" fill="#f5f5f5">• 写入 I/O 与存储容量绝对平局分配</text>
          <text y="66" fill="#f5f5f5">• 0 单个数据库节点被大促热点打爆！</text>

          <text y="90" fill="#f5f5f5">局限与代价：</text>
          <text y="104" fill="#f5f5f5">• 按时间范围查最近 7 天订单需要广播 64 个分片聚合 (Scatter-Gather)</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 用户账户、电商订单主键点查；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 写入吞吐量极高的核心在线交易表；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 绝大多数分库分表首选。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">Range 范围分片 (如按月份或自增 ID 区间)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">按时间或连续范围划分：</text>

          <text y="38" fill="#f5f5f5">• 2026_01, 2026_02 ... 独立物理表</text>
          <text y="52" fill="#f5f5f5">• 范围查询极度高效，仅需路由至单表</text>
          <text y="66" fill="#f5f5f5">• 历史旧数据冷热归档极其方便 (直接 DROP)</text>

          <text y="90" fill="#f5f5f5">致命短板：</text>
          <text y="104" fill="#f5f5f5">• 当月最新分片承载 100% 写流量，产生严重写入热点！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 财务流水、审计日志、时序监控数据；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 具有强烈生命周期与归档诉求的系统；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 冷热分离利器。</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
