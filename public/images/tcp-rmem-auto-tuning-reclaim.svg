<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">TCP 接收缓冲区自动调优：net.ipv4.tcp_rmem 三元组精妙控制</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">tcp_rmem = "4096 87380 67108864" (4KB 初始 ──► 85KB 默认 ──► 64MB 极限动态扩张 ｜ 支撑单连接万兆吃满)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. min: 4096 (4KB 初始底线)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">新连接建立时分配的最小缓冲区：</text>
          
          <text x="10" y="42" fill="#86efac">• 仅占用 1 个物理内存页 (4KB)</text>
          <text x="10" y="58" fill="#cbd5e1">• 极度节省服务器内存资源</text>
          <text x="10" y="74" fill="#cbd5e1">• 允许百万级空闲连接常驻</text>
          
          <text x="10" y="104" fill="#4ade80">✓ 高并发海量连接保护屏障！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 保证系统在内存吃紧时不会发生 OOM；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 支撑大规模边缘网关长连接；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造稳固基底。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. default: 87380 (85KB 稳态)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">常规 HTTP/RPC 请求默认窗口：</text>
          
          <text x="10" y="42" fill="#86efac">• 完美适配 100Mbps 常见带宽</text>
          <text x="10" y="58" fill="#38bdf8">• 保证 99% 普通流量极速响应</text>
          <text x="10" y="74" fill="#34d399">• 0 人工调优开销</text>
          
          <text x="10" y="104" fill="#4ade80">✓ Linux 通用业务黄金配置！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 兼顾并发容量与单连接性能；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 满足通用微服务与静态站访问；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 平衡的艺术。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. max: 67108864 (64MB 极限扩张)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">测速流量洪峰到达时的内核自适应：</text>
          
          <text x="10" y="42" fill="#fed7aa">• 检测到高带宽 × 较高 RTT</text>
          <text x="10" y="58" fill="#fed7aa">• 接收窗口自动从 85KB 动态暴增至 64MB</text>
          <text x="10" y="74" fill="#fed7aa">• 回送超大 Window Update 给对端！</text>
          
          <text x="10" y="104" fill="#4ade80">✓ 单连接跑满 10Gbps 的核心保障！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底避免测速上行反压丢速；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 万兆测速机房必备内核调优项；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级吞吐压榨利器！</text>
      </g>
    </g>
  </g>
</svg>