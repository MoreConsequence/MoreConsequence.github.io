<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="ai-gateway-streaming-chunk-pipeline-title ai-gateway-streaming-chunk-pipeline-desc"><title id="ai-gateway-streaming-chunk-pipeline-title">AI 网关流式传输流水线：SSE 解析、Backpressure 反压控制与 Token 计费挂钩</title><desc id="ai-gateway-streaming-chunk-pipeline-desc">AI 网关流式传输流水线：SSE 解析、Backpressure 反压控制与 Token 计费挂钩</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">AI 工程后端流式网关与反压流水线 (AI Gateway Streaming Pipeline)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">LLM Provider SSE 流 ──► 网关 Chunk 边界解析 ──► 敏感词前置审核 ──► 客户端 TCP 反压与 Token 实时记账</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 上游模型供应商 SSE 连接 (Upstream Model Provider SSE)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">HTTP/2 长连接接收 data: {"choices":[{"delta":{"content":"..."}}]} ──► 处理分包与跨 Chunk 截断</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">严控首字时延 (TTFT: Time-To-First-Token) &lt; 800ms！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 协议解析与增量安全过滤 (Incremental Security &amp; Safety Filter)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">维护 30 字符滑动窗口 ──► 实时 AC 自动机检测敏感词 ──► 触发违规瞬间切断连接并注入安全回复</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">杜绝等全部生成完毕才审核导致的巨大算力与 Token 浪费！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 客户端反压与连接保活 (Client TCP Backpressure &amp; Ping)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">客户端网络卡顿 ──► 网关探测到 Socket 缓冲区满 ──► 暂停向上游模型读取 ──► 防止网关 OOM 崩溃</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">每 15 秒发送 :keepalive 注释包防止 Nginx / Cloudflare 504 超时！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 异步 Token 扣费与链路遥测 (Async Token Accounting &amp; OTEL)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">连接结束提取 usage.total_tokens ──► 投递 Redis/Kafka 扣减用户额度 ──► 上报 OTel 追踪链！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">严谨的生产级企业 AI 后端工程体系！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
