<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AI 工程后端流式网关与反压流水线 (AI Gateway Streaming Pipeline)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">LLM Provider SSE 流 ──► 网关 Chunk 边界解析 ──► 敏感词前置审核 ──► 客户端 TCP 反压与 Token 实时记账</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 上游模型供应商 SSE 连接 (Upstream Model Provider SSE)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">HTTP/2 长连接接收 data: {"choices":[{"delta":{"content":"..."}}]} ──► 处理分包与跨 Chunk 截断</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">严控首字时延 (TTFT: Time-To-First-Token) &lt; 800ms！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 协议解析与增量安全过滤 (Incremental Security &amp; Safety Filter)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">维护 30 字符滑动窗口 ──► 实时 AC 自动机检测敏感词 ──► 触发违规瞬间切断连接并注入安全回复</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">杜绝等全部生成完毕才审核导致的巨大算力与 Token 浪费！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 客户端反压与连接保活 (Client TCP Backpressure &amp; Ping)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">客户端网络卡顿 ──► 网关探测到 Socket 缓冲区满 ──► 暂停向上游模型读取 ──► 防止网关 OOM 崩溃</text>
        <text x="15" y="62" font-size="8" fill="#047857">每 15 秒发送 :keepalive 注释包防止 Nginx / Cloudflare 504 超时！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 异步 Token 扣费与链路遥测 (Async Token Accounting &amp; OTEL)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">连接结束提取 usage.total_tokens ──► 投递 Redis/Kafka 扣减用户额度 ──► 上报 OTel 追踪链！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">严谨的生产级企业 AI 后端工程体系！</text>
      </g>
    </g>
  </g>
</svg>