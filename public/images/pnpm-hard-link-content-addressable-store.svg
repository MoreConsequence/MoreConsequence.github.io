<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="pnpm-hard-link-content-addressable-store-title pnpm-hard-link-content-addressable-store-desc"><title id="pnpm-hard-link-content-addressable-store-title">pnpm 全局内容寻址存储 (Content-Addressable Store) 与 Hard-Link 拓扑</title><desc id="pnpm-hard-link-content-addressable-store-desc">pnpm 全局内容寻址存储 (Content-Addressable Store) 与 Hard-Link 拓扑</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">pnpm 硬链接 (Hard Link) 与内容寻址存储拓扑 (Content-Addressable Store)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">全局存储 (~/.pnpm-store 仅存一份物理 inode) ──► 各项目通过 Hard Link 共享 0 拷贝 ──► 内部 .pnpm/ 虚拟目录编织精确 Symlink 依赖树</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 全局内容寻址中心库 (Global CAS: ~/.pnpm-store/v3/files)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">按文件哈希值分片持久化存储物理文件 ──► 跨 100 个工程使用同一个 react@18.2.0 时，磁盘物理空间仅占一份 5MB！</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">从根本上终结磁盘重复拷贝的物理浪费！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 操作系统硬链接秒级映射 (Hard Link to Project node_modules/.pnpm)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">执行 pnpm install 仅创建 inode 计数硬链接 ──► 0 磁盘 I/O 数据流拷贝 ──► 安装耗时直接从 30s 缩减至 1s！</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">压榨利用操作系统文件系统原生高级特性！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 虚拟隔离目录树结构 (.pnpm/react@18.2.0/node_modules/react)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">在 .pnpm 内部按 "包名+版本号" 平铺展开 ──► 真实物理依赖与依赖的依赖紧密在此嵌套软链</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">彻底满足 Node.js 原生模块寻址解析算法！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 根目录严格受限软链 (Root node_modules: Strict Symlinks)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">项目根目录仅软链接 package.json 声明的直接依赖 ──► 代码绝无法 require 未声明的幽灵包！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">软件工程领域最严谨优美的包管理架构设计！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
