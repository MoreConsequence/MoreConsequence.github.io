<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 上下文水位线监控与自动压缩触发状态机 (Watermark Compaction)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Normal (&lt; 80k Tokens) ──► High Watermark (达到 100k) ──► Trigger Compaction (提炼摘要) ──► Low Watermark (&lt; 40k) 回归 Normal</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 状态 1: 正常运行水位 (Normal Zone: Tokens &lt; 80k)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">完整保留所有原始对话与 Tool Call 结果 ──► 0 压缩计算开销 ──► 享受极速推理</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">常规任务运行黄金舒适区！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 状态 2: 触发高水位线预警 (High Watermark: Tokens &gt;= 100k)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">接近窗口上限 ──► 状态机原子跃迁至 Compacting ──► 锁定最新消息，将前 80% 历史切片打包</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">防范模型窗口直接爆炸崩溃！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 状态 3: 语义蒸馏与压缩合并 (Background Semantic Compaction)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">调用轻量模型将 50 轮冗余细节提炼为 1 篇 800 字的结构化架构决策事实摘要 (Summary)</text>
        <text x="15" y="62" font-size="8" fill="#047857">以极小代价保全任务全息记忆！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 状态 4: 回归低水位线并继续执行 (Low Watermark: Tokens &lt; 40k)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">上下文瞬间释放 60% 空间 ──► 重新对齐 Prompt Caching 前缀 ──► 无感继续执行后续编码！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">无限长程长任务运行的永动机机制！</text>
      </g>
    </g>
  </g>
</svg>