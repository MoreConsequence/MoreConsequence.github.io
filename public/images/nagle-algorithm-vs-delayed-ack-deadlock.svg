<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">网络传输经典灾难：Nagle 算法与 Delayed ACK 的 40ms 互相死等</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">发送端 Nagle 等待前一个包的 ACK 才发后续小包 ｜ 接收端 Delayed ACK 等待凑满 2 个包或 40ms 超时才回包 ｜ 导致 1 毫秒 RPC 暴增至 40ms</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 默认开启：40ms 互锁踩踏死等</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">1. Client 连续写两次: write(header); write(body);</text>
          <text y="28" fill="#86efac">2. Header 发出 ──► Client 进入 Nagle 挂起等待 ACK！</text>
          
          <text y="50" fill="#f87171">3. Server 收到 Header ──► 触发 Delayed ACK 定时器：</text>
          <text y="66" fill="#ef4444">   "我要等下一个包一起回 ACK，或者等 40ms 到期！"</text>
          
          <text y="90" fill="#ef4444">💥 结果：Client 在等 Server 的 ACK，Server 在等 Client 的 Body！</text>
          <text y="106" fill="#ef4444">🔴 极其尴尬地死等 40 毫秒后定时器超时才解套！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 同机房 RPC 调用 P99 延迟离奇卡顿 40ms；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 接口吞吐量骤降 90%；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 高性能服务端必设 TCP_NODELAY！</text>
      </g>
    </g>

    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ TCP_NODELAY + writev 批量聚合</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 方案 A: 禁用 Nagle 算法 (TCP_NODELAY = 1)</text>
          <text y="28" fill="#86efac">socket.setNoDelay(true); // Node / Go 默认开启！</text>
          
          <text y="50" fill="#38bdf8">Header 与 Body 连续瞬间发出，0 毫秒挂起！</text>
          
          <text y="72" fill="#34d399">// 方案 B: 向量写合并 (writev / Scatter-Gather I/O)</text>
          <text y="86" fill="#34d399">将 Header 和 Body 打包成单次系统调用推入网卡！</text>
          
          <text y="112" fill="#4ade80">✓ 单次 RPC 延迟从 40.2ms 骤降至 0.3ms！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 释放现代千兆/万兆低时延网络的真实潜力；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 微服务网关与 RPC 框架标配参数；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极低时延网络通道！</text>
      </g>
    </g>
  </g>
</svg>