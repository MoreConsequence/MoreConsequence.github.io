<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="stack-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr-blue-stack" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-orange-stack" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#stack-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="34" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">HARDWARE TO RUNTIME · ZERO-ALLOC ARCHITECTURE</text>
  <text x="40" y="54" fill="#0f172a" font-size="16" font-weight="700">从物理网卡、Linux 内核到 Go 运行时的软硬件分层数据栈</text>

  <!-- ================= 4 HORIZONTAL LAYER STACK CARDS ================= -->
  
  <!-- Layer 4: Application Zero-Alloc Engine (Top Layer) [y: 72, h: 72] -->
  <g transform="translate(40, 72)">
    <rect width="880" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="16" y="10" width="140" height="18" rx="3" fill="#ea580c"/>
    <text x="86" y="23" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">LAYER 4 · APPLICATION</text>
    
    <text x="170" y="24" fill="#9a3412" font-size="13" font-weight="700">应用层测速引擎：零堆分配（0 Alloc/op）内存模型</text>
    <text x="16" y="46" fill="#334155" font-size="11">• 下行推流：并发切片只读复用 <tspan font-weight="700" fill="#2563eb">64MB 静态随机池</tspan>（0 运行时 CPU 算力，100% 免疫压缩）</text>
    <text x="16" y="63" fill="#334155" font-size="11">• 上行吸收：<tspan font-weight="700" fill="#ea580c">[64KB]byte 栈内存</tspan> 循环即收即丢（逃逸分析驻留栈空间，CPU 原生原子累加，40Gbps+ 吞吐）</text>
  </g>

  <!-- Inter-layer Arrow 4 <-> 3 [x: 480, y: 144 -> 158] -->
  <path d="M 460,158 V 144" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arr-orange-stack)"/>
  <path d="M 500,144 V 158" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue-stack)"/>

  <!-- Layer 3: Go Runtime & Netpoller [y: 158, h: 72] -->
  <g transform="translate(40, 158)">
    <rect width="880" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="16" y="10" width="140" height="18" rx="3" fill="#2563eb"/>
    <text x="86" y="23" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">LAYER 3 · GO RUNTIME</text>

    <text x="170" y="24" fill="#1e40af" font-size="13" font-weight="700">Go 运行时网络轮询器与系统调用自省（Netpoller &amp; Syscall）</text>
    <text x="16" y="46" fill="#334155" font-size="11">• 协程调度：Non-blocking Socket + <tspan font-weight="700" class="mono">epoll / kqueue</tspan> 边沿触发，数万并发连接 0 阻塞开销</text>
    <text x="16" y="63" fill="#334155" font-size="11">• 内核自省：通过 <tspan class="mono" font-weight="600">syscall.RawConn</tspan> 零开销直读 <tspan font-weight="700" class="mono">TCP_INFO</tspan> 获取微秒级 Smoothed RTT 与拥塞窗口</text>
  </g>

  <!-- Inter-layer Arrow 3 <-> 2 [x: 480, y: 230 -> 244] -->
  <path d="M 460,244 V 230" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arr-orange-stack)"/>
  <path d="M 500,230 V 244" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue-stack)"/>

  <!-- Layer 2: Linux Kernel TCP Subsystem [y: 244, h: 72] -->
  <g transform="translate(40, 244)">
    <rect width="880" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="16" y="10" width="140" height="18" rx="3" fill="#475569"/>
    <text x="86" y="23" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">LAYER 2 · LINUX KERNEL</text>

    <text x="170" y="24" fill="#0f172a" font-size="13" font-weight="700">Linux 内核 TCP 协议栈与长肥管道调优（TCP Subsystem）</text>
    <text x="16" y="46" fill="#334155" font-size="11">• 套接字优化：<tspan class="mono">TCP_NODELAY</tspan> 禁用 Nagle 算法（0 延迟发包）+ <tspan class="mono">TCP_QUICKACK</tspan> 快速回包确认</text>
    <text x="16" y="63" fill="#334155" font-size="11">• 管道容量：放大 <tspan class="mono">SO_SNDBUF / SO_RCVBUF</tspan> 至 4MB，注满 BDP 跨省千兆在途飞行数据（In-flight）</text>
  </g>

  <!-- Inter-layer Arrow 2 <-> 1 [x: 480, y: 316 -> 330] -->
  <path d="M 460,330 V 316" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arr-orange-stack)"/>
  <path d="M 500,316 V 330" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue-stack)"/>

  <!-- Layer 1: Hardware NIC & PCIe DMA [y: 330, h: 72] -->
  <g transform="translate(40, 330)">
    <rect width="880" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="16" y="10" width="140" height="18" rx="3" fill="#64748b"/>
    <text x="86" y="23" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">LAYER 1 · HARDWARE NIC</text>

    <text x="170" y="24" fill="#0f172a" font-size="13" font-weight="700">物理网卡与直接内存访问（40G/100G NIC &amp; DMA Ring Buffer）</text>
    <text x="16" y="46" fill="#334155" font-size="11">• 硬件队列：多队列网卡（RSS）硬件哈希分流至各 CPU 核心，PCIe 3.0/4.0 DMA 直写内存环形缓冲区</text>
    <text x="16" y="63" fill="#334155" font-size="11">• 中断治理：NAPI 机制合并硬中断，大流量下自动切换为轮询（Polling），杜绝活锁卡死</text>
  </g>
</svg>
