<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="p90-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr-blue-p90" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#p90-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="34" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">DISCRETE SAMPLING &amp; STEADY FILTERING</text>
  <text x="40" y="54" fill="#0f172a" font-size="16" font-weight="700">100ms 离散时间切片采样与 P90 稳态滤波计算流程</text>

  <!-- Timeline Container [x: 40 ~ 920, y: 75 ~ 160] -->
  <g transform="translate(40, 75)">
    <rect width="880" height="85" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    
    <!-- Phase 1: Ramp Up (0 - 1.5s) [x: 15 ~ 145] -->
    <rect x="15" y="15" width="130" height="55" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="36" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">前 1.5s 慢启动爬坡</text>
    <text x="80" y="54" fill="#64748b" font-size="10" class="mono" text-anchor="middle">升窗低速 (剔除)</text>

    <!-- Phase 2: Steady State (1.5 - 9.5s) [x: 160 ~ 720] -->
    <rect x="160" y="15" width="560" height="55" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="440" y="36" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">中间 8.0s 核心稳态测量区间 (80 个 100ms 离散样本)</text>
    <text x="440" y="54" fill="#2563eb" font-size="10" class="mono" text-anchor="middle">✓ 单调时钟精确差值 · 排除 NTP 漂移与改时干扰</text>

    <!-- Phase 3: Teardown (9.5 - 10.0s) [x: 735 ~ 865] -->
    <rect x="735" y="15" width="130" height="55" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="800" y="36" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">后 0.5s 连接断开</text>
    <text x="800" y="54" fill="#64748b" font-size="10" class="mono" text-anchor="middle">拆除抖动 (剔除)</text>
  </g>

  <!-- Process Flow Arrow [y: 160 -> 195] -->
  <path d="M 480,160 V 195" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-p90)"/>

  <!-- Sorting & P90 Extraction Steps -->
  <g transform="translate(40, 195)">
    <!-- Step A: Sort [x: 0 ~ 420] -->
    <g transform="translate(0, 0)">
      <rect width="420" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="14" y="14" width="120" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="74" y="28" fill="#475569" font-size="9" font-weight="700" class="mono" text-anchor="middle">STEP 1: 升序排列</text>
      <text x="14" y="56" fill="#0f172a" font-size="12" font-weight="700">稳态样本集合次序化排序</text>
      <text x="14" y="78" fill="#475569" font-size="10" class="mono">Array.sort: [v1, v2, ..., v72 (P90), ..., v80]</text>
    </g>

    <!-- Arrow between Step A and B [x: 420 -> 460] -->
    <path d="M 420,50 H 460" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-p90)"/>

    <!-- Step B: P90 Selection [x: 460 ~ 880] -->
    <g transform="translate(460, 0)">
      <rect width="420" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="14" y="14" width="140" height="20" rx="4" fill="#2563eb"/>
      <text x="84" y="28" fill="#ffffff" font-size="9" font-weight="700" class="mono" text-anchor="middle">STEP 2: 提取 P90 统计量</text>
      <text x="14" y="56" fill="#1e40af" font-size="12" font-weight="700">过滤前 10% 偶发丢包与顶部 10% 瞬时毛刺</text>
      <text x="14" y="78" fill="#1d4ed8" font-size="10" font-weight="700" class="mono">输出最终具备最高置信度的持续最大可用带宽！</text>
    </g>
  </g>
</svg>
