<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi Agent 高性能 RPC SDK 跨进程与跨网络架构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 强类型 SDK 客户端 ──► 2. 双通道 Transport (stdio 零开销 / WebSocket 远程) ──► 3. JSON-RPC 2.0 编解码 ──► 4. Pi Agent 核心引擎</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 多语言强类型 SDK 客户端 (TypeScript / Python / Go Client SDK)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">暴露流式 API: client.prompt("实现登录").onChunk(render) ──► 自动处理请求重试、超时与取消</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">开发者极为友好的调用入口！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 双模可插拔传输层 (Pluggable Stdio / WebSocket Transport)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">本地 CLI / IDE 插件选用 stdio (0 网络协议栈开销，&lt; 0.1ms) ｜ 云端协作选用 WebSocket / gRPC</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">适配从单机轻量命令行到大型云端协同全场景！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 标准 JSON-RPC 2.0 协议规范 (Bidirectional Streaming Protocol)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">支持双向异步推送: 客户端下发 Input / 中止指令，服务端实时上报 Thought, ToolCall, Diff 事件</text>
        <text x="15" y="62" font-size="8" fill="#047857">严格标准化的工业级协议！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. Pi Agent 核心引擎解耦执行 (Headless Engine Execution)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">引擎作为 Headless 服务常驻后台 ──► 0 UI 渲染代码侵入 ──► 达成完美的职责分离与跨平台复用！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代 Agent 工具链最高架构形态！</text>
      </g>
    </g>
  </g>
</svg>