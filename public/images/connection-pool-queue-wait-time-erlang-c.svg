<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">连接池排队论：利特尔法则 (Little's Law) 与超载雪崩拐点</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">并发数 N = 吞吐率 λ × 平均服务时间 W ｜ 连接池满后请求推入等待队列 ｜ 超过 maxWaitTime 触发快速熔断</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 连接池黄金容量计算公式 (Optimal Pool Size Formula)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">Pool_Size = (CPU_Cores × 2) + Disk_Spindle_Count (PostgreSQL 官方基准)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">盲目设置 maxOpenConns = 1000 只会导致 CPU 发生剧烈线程上下文切换，吞吐反而断崖式暴跌！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. 稳态运行区间：直接复用活跃空闲连接 (Steady-State Hit: 0ms)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">空闲队列 (Idle Queue) 弹出可用 Socket ──► 0 TCP 三次握手 ──► 0 TLS 协商开销</text>
        <text x="15" y="62" font-size="8" fill="#047857">网络通信效率达到物理理论极限！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 流量尖峰排队缓冲 (Queue Wait &amp; Backpressure)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">连接全部繁忙 ──► 新请求进入 FIFO 等待队列 ──► maxWaitQueueSize 限制堆积上限</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">防止无限制积压导致 Node.js / Go 内存 OOM 崩溃！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">4. 超时快速失败与级联雪崩熔断 (Fail-Fast Timeout &amp; Shedding)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">排队耗时超过 acquireTimeout (如 500ms) ──► 立即返回 503 Service Unavailable 丢弃请求</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">保住正在处理的存量请求顺利完成，彻底阻断系统级联崩溃！</text>
      </g>
    </g>
  </g>
</svg>