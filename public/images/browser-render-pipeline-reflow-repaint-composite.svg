<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">16.6ms 帧预算渲染管道：重排 (Reflow)、重绘 (Repaint) 与纯合成加速</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">JS/rAF ──► Recalculate Style ──► Layout (重排: 极慢) ──► Paint (重绘) ──► Composite Layers (GPU 合成: 极快)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. JavaScript / rAF 执行 (JS Frame Budget: &lt; 8ms)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">requestAnimationFrame() 回调计算 ──► 留给 JS 的执行时间必须严控在 8ms 以内！</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">超过 8ms 将导致后续样式计算与光栅化无法在 16.6ms 窗口内完成，造成掉帧卡顿！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">2. Layout 几何重排 (Reflow - 最昂贵阶段)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">修改 width/height/top/left 或读取 offsetTop ──► 触发全局强制同步布局 (Layout Thrashing)</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">CPU 遍历整棵渲染树重新计算几何坐标，性能黑洞！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. Paint 栅格化重绘 (Repaint)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">修改 color/background-color/box-shadow ──► 生成绘图指令列表并填充像素位图</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">跳过了 Layout 计算，但大面积重绘依然消耗显著 CPU 时间！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. GPU 合成加速 (Composite Layers - 极致流畅 60/120 FPS)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">仅修改 transform / opacity / will-change ──► 直接由 GPU 独立图层合成器完成！</text>
        <text x="15" y="62" font-size="8" fill="#047857">100% 绕过主线程 Layout 与 Paint，即使主线程卡死动画依然丝滑！</text>
      </g>
    </g>
  </g>
</svg>