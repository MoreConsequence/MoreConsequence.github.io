<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">K8s QoS 质量等级与 Linux OOM-Killer 驱逐优先级矩阵</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Guaranteed (requests=limits, oom_score_adj=-997, 绝对免死金牌) ──► Burstable (弹性溢出) ──► BestEffort (0 资源声明, oom_score_adj=1000, 优先被杀)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. Guaranteed (免死金牌)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">配置规则: requests == limits</text>
          
          <text x="10" y="38" fill="#86efac">内核保护机制：</text>
          <text x="10" y="54" fill="#38bdf8">• 静态独占 CPU 核心 (CPU Manager)</text>
          <text x="10" y="70" fill="#34d399">• oom_score_adj 固定设为 -997</text>
          <text x="10" y="86" fill="#4ade80">• 节点内存告急时绝不被优先驱逐！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 核心数据库/结算服务唯一配置！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 获得最高优先级系统资源保障；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 杜绝邻居噪音 (Noisy Neighbor) 干扰；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造坚固核心底座。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. Burstable (弹性中坚)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">配置规则: requests &lt; limits</text>
          
          <text x="10" y="38" fill="#86efac">弹性调度特征：</text>
          <text x="10" y="54" fill="#38bdf8">• 允许在有空闲时超额使用资源</text>
          <text x="10" y="70" fill="#34d399">• oom_score_adj 按超额比例动态计算</text>
          <text x="10" y="86" fill="#34d399">• 驱逐优先级介于两者之间</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 90% 普通微服务的通用首选！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 兼顾高密度部署与资源利用率；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 允许突发峰值流量超额消耗；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 成本与弹性最佳平衡。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">3. BestEffort (替罪羊)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">配置规则: 0 requests, 0 limits</text>
          
          <text x="10" y="38" fill="#fca5a5">牺牲品特征：</text>
          <text x="10" y="54" fill="#ef4444">• oom_score_adj 设为最高值 1000</text>
          <text x="10" y="70" fill="#ef4444">• 节点一旦内存紧张，第一个被强杀！</text>
          <text x="10" y="86" fill="#f87171">• 0 任何 QoS 运行保证</text>
          
          <text x="10" y="114" fill="#ef4444">🔴 仅用于离线批处理与临时 Job</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 作为集群边角料算力的吸收海绵；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 严禁将在线对外业务设为 BestEffort；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• K8s 资源调度等级必修课！</text>
      </g>
    </g>
  </g>
</svg>