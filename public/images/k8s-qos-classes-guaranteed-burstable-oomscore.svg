<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="k8s-qos-classes-guaranteed-burstable-oomscore-title k8s-qos-classes-guaranteed-burstable-oomscore-desc"><title id="k8s-qos-classes-guaranteed-burstable-oomscore-title">Kubernetes 三大 QoS 服务质量等级与 oom_score_adj 驱逐排序模型</title><desc id="k8s-qos-classes-guaranteed-burstable-oomscore-desc">Kubernetes 三大 QoS 服务质量等级与 oom_score_adj 驱逐排序模型</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">K8s QoS 质量等级与 Linux OOM-Killer 驱逐优先级矩阵</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Guaranteed（requests=limits，免死金牌）──► Burstable（弹性溢出）──► BestEffort（零声明，优先被杀）</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Guaranteed (免死金牌)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">配置规则: requests == limits</text>

          <text x="10" y="38" fill="#f5f5f5">内核保护机制：</text>
          <text x="10" y="54" fill="#f5f5f5">• 静态独占 CPU 核心 (CPU Manager)</text>
          <text x="10" y="70" fill="#f5f5f5">• oom_score_adj 固定设为 -997</text>
          <text x="10" y="86" fill="#f5f5f5">• 节点内存告急时绝不被优先驱逐！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 核心数据库/结算服务唯一配置！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 获得最高优先级系统资源保障；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 杜绝邻居噪音 (Noisy Neighbor) 干扰；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造坚固核心底座。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. Burstable (弹性中坚)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">配置规则: requests &lt; limits</text>

          <text x="10" y="38" fill="#f5f5f5">弹性调度特征：</text>
          <text x="10" y="54" fill="#f5f5f5">• 允许在有空闲时超额使用资源</text>
          <text x="10" y="70" fill="#f5f5f5">• oom_score_adj 按超额比例动态计算</text>
          <text x="10" y="86" fill="#f5f5f5">• 驱逐优先级介于两者之间</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 90% 普通微服务的通用首选！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 兼顾高密度部署与资源利用率；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 允许突发峰值流量超额消耗；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 成本与弹性最佳平衡。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">3. BestEffort (替罪羊)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">配置规则: 0 requests, 0 limits</text>

          <text x="10" y="38" fill="#f5f5f5">牺牲品特征：</text>
          <text x="10" y="54" fill="#f5f5f5">• oom_score_adj 设为最高值 1000</text>
          <text x="10" y="70" fill="#f5f5f5">• 节点一旦内存紧张，第一个被强杀！</text>
          <text x="10" y="86" fill="#f5f5f5">• 0 任何 QoS 运行保证</text>

          <text x="10" y="114" fill="#f5f5f5">🔴 仅用于离线批处理与临时 Job</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 作为集群边角料算力的吸收海绵；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 严禁将在线对外业务设为 BestEffort；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• K8s 资源调度等级必修课！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
