<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="speedtest-whitepaper-measurement-model-title speedtest-whitepaper-measurement-model-desc">
<title id="speedtest-whitepaper-measurement-model-title">测速值是路径窗口里的字节</title>
<desc id="speedtest-whitepaper-measurement-model-desc">上下行数据流展示不同方向的测量点：下行在客户端统计收到的字节，上行在客户端统计已经交给网络栈的字节，最终结果受访问链路、路径、节点和队列共同约束。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');</style><marker id="speedtest-whitepaper-measurement-model-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="speedtest-whitepaper-measurement-model-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="speedtest-whitepaper-measurement-model-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">MODEL · GOODPUT</text>
<text x="40" y="76" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400" text-anchor="start">测速值是路径窗口里的字节</text>
<text x="40" y="104" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">先定义计量点，再讨论带宽、延迟和实现细节</text>
<text x="56" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.16em">MEASUREMENT MODEL</text><rect x="280" y="180" width="400" height="188" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><text x="304" y="196" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.16em">SAME PHYSICAL PATH</text><rect x="304" y="220" width="352" height="40" rx="4" fill="rgba(46,90,168,0.07)" stroke="rgba(46,90,168,0.24)" stroke-width="0.8"/><rect x="304" y="288" width="352" height="40" rx="4" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.24)" stroke-width="0.8"/><line x1="728" y1="240" x2="232" y2="240" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#speedtest-whitepaper-measurement-model-arrow-link)"/><line x1="232" y1="308" x2="728" y2="308" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#speedtest-whitepaper-measurement-model-arrow-accent)"/><rect x="384" y="204" width="192" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="480" y="214" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">NODE → CLIENT · ΔB_rx</text><rect x="384" y="272" width="192" height="12" rx="2" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="480" y="282" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.04em">CLIENT → NODE · ΔB_tx</text><text x="480" y="342" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="middle">同一路径，两个观察点</text><rect x="56" y="204" width="176" height="128" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="56" y="204" width="176" height="128" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><rect x="68" y="216" width="60" height="16" rx="2" fill="none" stroke="#7a8399" stroke-width="0.8"/><text x="98" y="228" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">CLIENT</text><text x="144" y="276" fill="#2d3142" font-size="16" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">客户端</text><text x="144" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">rx / tx measurement</text><rect x="728" y="204" width="176" height="128" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="728" y="204" width="176" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="740" y="216" width="44" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="762" y="228" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">NODE</text><text x="816" y="276" fill="#2d3142" font-size="16" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">测速节点</text><text x="816" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">/garbage · /empty</text><rect x="56" y="412" width="256" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><rect x="336" y="412" width="256" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><rect x="616" y="412" width="288" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="72" y="436" fill="#2e5aa8" font-size="16" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="600" text-anchor="start">R_down</text><text x="72" y="460" fill="#2d3142" font-size="12" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">= 8 · ΔB_rx / Δt</text><text x="352" y="436" fill="#eb6c36" font-size="16" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="600" text-anchor="start">R_up</text><text x="352" y="460" fill="#2d3142" font-size="12" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">= 8 · ΔB_tx / Δt</text><text x="632" y="436" fill="#2d3142" font-size="10" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="600" text-anchor="start">R ≤ min(C_access, C_path, C_node, C_queue)</text><text x="632" y="460" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">同一节点 ≠ 同一测量结果</text><line x1="40" y1="540" x2="920" y2="540" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="136" y="556" width="12" height="12" rx="2" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="0.8"/><text x="156" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">DOWNLOAD / RECEIVED</text><rect x="392" y="556" width="12" height="12" rx="2" fill="#eb6c36" stroke="#eb6c36" stroke-width="0.8"/><text x="412" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">UPLOAD / EMITTED</text><rect x="640" y="556" width="12" height="12" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.8"/><text x="660" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">MEASUREMENT WINDOW</text>

</svg>
