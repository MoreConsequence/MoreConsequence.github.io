<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="redis-eight-eviction-policies-matrix-title redis-eight-eviction-policies-matrix-desc"><title id="redis-eight-eviction-policies-matrix-title">Redis 八大内存淘汰策略矩阵：LRU, LFU, Random, TTL 与 noeviction 决策四象限</title><desc id="redis-eight-eviction-policies-matrix-desc">Redis 八大内存淘汰策略矩阵：LRU, LFU, Random, TTL 与 noeviction 决策四象限</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Redis 八大内存淘汰策略 (maxmemory-policy) 决策矩阵</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">全量键集 (allkeys) vs 过期键集 (volatile) ｜ LRU (最近最少使用) ｜ LFU (最不经常使用) ｜ Random ｜ volatile-ttl ｜ noeviction</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. allkeys-lfu (热点强力)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">全键频次感知：</text>

          <text x="8" y="38" fill="#f5f5f5">• 依据对数访问计数器 (LD/Counter)</text>
          <text x="8" y="54" fill="#f5f5f5">• 完美抵御单次全表批量扫描冲垮热点</text>
          <text x="8" y="70" fill="#f5f5f5">• 保留长期高频访问的核心 Key</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 通用缓存生产首选策略！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 读多写少、幂律分布明显的场景；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 缓存命中率最高；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 推荐默认配置。</text>
      </g>
    </g>

    <g transform="translate(225, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. allkeys-lru (时效优先)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">全键时效感知：</text>

          <text x="8" y="38" fill="#f5f5f5">• 依据最后访问时间戳 (LRU Clock)</text>
          <text x="8" y="54" fill="#f5f5f5">• 优先淘汰长时间未被访问的冷数据</text>
          <text x="8" y="70" fill="#f5f5f5">• 适合具有明确时间局部性的业务</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 经典时间滑动窗口！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 社交信息流、近期新闻查看；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 越新的数据被查概率越高；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 时效型系统标配。</text>
      </g>
    </g>

    <g transform="translate(450, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. volatile-ttl (过期就近)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">剩余寿命最短优先：</text>

          <text x="8" y="38" fill="#f5f5f5">• 仅从设置了 EXPIRE 的字典中抽样</text>
          <text x="8" y="54" fill="#f5f5f5">• 优先干掉即将过期的短命键</text>
          <text x="8" y="70" fill="#f5f5f5">• 保护未设过期时间的持久配置</text>

          <text x="8" y="100" fill="#f5f5f5">✓ 兼顾持久化与临时缓存！</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• Redis 既当数据库又当缓存；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 严防误删永久存储的重要数据；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 混合业务安全折中。</text>
      </g>
    </g>

    <g transform="translate(675, 0)">
      <rect width="210" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="210" height="34" rx="8" fill="#ffffff" />
      <text x="105" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">4. noeviction (绝不丢弃)</text>

      <g transform="translate(12, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="186" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="8" y="18" fill="#f5f5f5">默认出厂保守配置：</text>

          <text x="8" y="38" fill="#f5f5f5">• 内存达到 maxmemory 时拒绝新写入</text>
          <text x="8" y="54" fill="#f5f5f5">• 直接报错: OOM command not allowed</text>
          <text x="8" y="70" fill="#f5f5f5">• 读请求 (GET/PING) 依然正常可用</text>

          <text x="8" y="100" fill="#f5f5f5">🔴 强一致性业务保障</text>
        </g>

        <rect y="162" width="186" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">适用场景：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 纯内存主数据库、分布式锁持有器；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 严禁丢数据的交易结算系统；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 宁可报错不可静默丢数据！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
