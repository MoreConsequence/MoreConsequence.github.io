<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Netpoll 四次交接：Goroutine 阻塞读为何不消耗系统线程 (M)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">conn.Read(EAGAIN) ──► gopark(Gwaiting) 让出 M ──► 后台 epoll_wait 捕获就绪 ──► goready(Grunnable) 重新调度</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Horizontal Hand-off Steps (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Step 1 -->
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">交接 1: 非阻塞系统调用与 EAGAIN 拦截</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">conn.Read(buf) ──► syscall.Read(fd) 返回 -1 (EAGAIN / EWOULDBLOCK)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">Go 运行时将所有网络 Socket 均设为 O_NONBLOCK。底层系统调用立即返回，绝不会卡死操作系统线程！</text>

      <!-- Step 2 -->
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">交接 2: 注册 pollDesc 并主动 gopark 挂起</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">netpollblock(pd, 'r') ──► gopark(netpollblockcommit, pd, waitReasonIOWait)</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将当前 G 状态改为 _Gwaiting 并解绑 M。线程 M 毫秒级无缝切换去调度执行其他就绪的业务 Goroutine！</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">交接 3: 运行时调度循环与 sysmon 周期性 netpoll(epoll_wait)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">epoll_wait(epfd, events, 128, 0) ──► 批量返回 EPOLLIN / EPOLLOUT 活跃事件</text>
        <text x="15" y="62" font-size="8" fill="#047857">当网卡收到 TCP 报文触发内核就绪，netpoll 从事件 user_data 指针瞬间提取出之前休眠的 pd 与 rg (G 指针)！</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">交接 4: goready 唤醒并推入 P 本地运行队列</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">goready(gp, 0) ──► casgstatus(gp, _Gwaiting, _Grunnable) ──► runqput(pp, gp, next)</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">被唤醒的 G 重新获得执行权，二次执行 syscall.Read 成功读出数据返回给用户代码。同步直观代码背后享异步高吞吐！</text>
      </g>
    </g>
  </g>
</svg>