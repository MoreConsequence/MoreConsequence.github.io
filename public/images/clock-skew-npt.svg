<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="12" fill="#fafbff" stroke="#d7def0"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">NTP 步进校准的瞬间:系统时间往回跳了</text>

  <g stroke="#64748b" stroke-width="1.5">
    <line x1="60" y1="330" x2="860" y2="330"/>
    <line x1="60" y1="330" x2="60" y2="70"/>
  </g>
  <text x="30" y="200" text-anchor="middle" font-size="13" fill="#64748b" transform="rotate(-90 30 200)">系统时间读数</text>
  <text x="460" y="352" text-anchor="middle" font-size="13" fill="#64748b">真实时间</text>
  <text x="80" y="348" font-size="11" fill="#94a3b8">t₀</text>
  <text x="560" y="348" font-size="11" fill="#94a3b8">t₁</text>
  <text x="820" y="348" font-size="11" fill="#94a3b8">t₂</text>

  <polyline points="60,120 560,150 820,270" fill="none" stroke="#22c55e" stroke-width="3"/>
  <text x="700" y="250" font-size="13" font-weight="700" fill="#059669">单调时钟（始终前进）</text>

  <polyline points="60,120 300,135 330,135 500,260 820,320" fill="none" stroke="#ef4444" stroke-width="3"/>
  <text x="330" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">墙上时钟（NTP step 回拨）</text>

  <line x1="330" y1="80" x2="330" y2="330" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="330" y="90" width="170" height="120" rx="8" fill="#fee2e2" stroke="#f87171"/>
  <text x="415" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">回拨窗口</text>
  <text x="415" y="132" text-anchor="middle" font-size="12" fill="#7f1d1d">新时间戳 &lt; 旧时间戳</text>
  <text x="415" y="150" text-anchor="middle" font-size="12" fill="#7f1d1d">雪花 ID 出现重复/逆序</text>
  <text x="415" y="168" text-anchor="middle" font-size="12" fill="#7f1d1d">缓存/租约提前过期</text>
  <text x="415" y="186" text-anchor="middle" font-size="12" fill="#7f1d1d">审计日志顺序错乱</text>

  <path d="M 300 135 L 320 134" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#c-arrow)"/>
  <text x="255" y="126" text-anchor="end" font-size="12" fill="#64748b">NTP 发现偏差过大</text>
  <text x="255" y="144" text-anchor="end" font-size="12" fill="#64748b">采用 step（跳变）校准</text>

  <text x="700" y="90" font-size="12" fill="#64748b">之后 NTP 用 slew（平滑）</text>
  <text x="700" y="108" font-size="12" fill="#64748b">微调跟上,不再跳变</text>

  <rect x="60" y="372" width="800" height="28" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="460" y="391" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3730a3">教训:不可信的时钟,要给业务一个"不可信预算"——回拨处理必须显式编码</text>
</svg>
