<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">NTP 步进校准（Step）物理机理：时钟回跳与单调时钟行为对比</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Wall Clock (CLOCK_REALTIME) 回拨陷阱 vs Monotonic Clock (CLOCK_MONOTONIC) 严格单调递增保证</text>
  </g>

  <!-- Left Main Chart: Timeline & Clocks (580px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="570" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Chart Header -->
    <rect width="570" height="34" rx="8" fill="#f1f5f9"/>
    <text x="16" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">时钟读数物理轨迹对比（X: 物理流逝时间 / Y: 时钟读取值）</text>

    <!-- Axes -->
    <line x1="55" y1="285" x2="540" y2="285" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <line x1="55" y1="285" x2="55" y2="55" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="535" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">真实物理时间 (t)</text>
    <text x="45" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">系统时钟读数</text>

    <!-- Grid lines -->
    <line x1="55" y1="220" x2="520" y2="220" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="55" y1="150" x2="520" y2="150" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Danger Zone Highlight -->
    <rect x="235" y="55" width="115" height="230" fill="#fee2e2" opacity="0.45"/>
    <line x1="235" y1="55" x2="235" y2="285" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="350" y1="55" x2="350" y2="285" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="292" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">时钟回拨区间</text>
    <text x="292" y="90" font-family="ui-monospace, monospace" font-size="10" fill="#dc2626" text-anchor="middle">Δt &lt; 0 (逆序产生)</text>

    <!-- Monotonic Line (Green) -->
    <path d="M 55 245 L 235 170 L 350 120 L 515 55" fill="none" stroke="#10b981" stroke-width="3"/>
    <circle cx="235" cy="170" r="4" fill="#10b981"/>
    <circle cx="350" cy="120" r="4" fill="#10b981"/>

    <!-- Wall Clock Line (Red Stepped) -->
    <path d="M 55 255 L 235 150 L 235 240 L 350 190 L 515 115" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="235" cy="150" r="4" fill="#dc2626"/>
    <circle cx="235" cy="240" r="4" fill="#dc2626"/>

    <!-- NTP Step Action Marker -->
    <path d="M 245 155 L 245 230" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-red)"/>
    <rect x="252" y="180" width="85" height="24" rx="4" fill="#fff7ed" stroke="#fdba74"/>
    <text x="294" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#c2410c" text-anchor="middle">NTP Step 强制回退</text>

    <!-- Legend & Labels -->
    <g transform="translate(70, 298)">
      <line x1="0" y1="8" x2="20" y2="8" stroke="#10b981" stroke-width="3"/>
      <text x="26" y="12" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#047857">CLOCK_MONOTONIC（物理绝对递增，不受 NTP 调节）</text>

      <line x1="280" y1="8" x2="300" y2="8" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
      <text x="306" y="12" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">CLOCK_REALTIME（墙上时钟，随时可能阶跃跳变）</text>
    </g>
  </g>

  <!-- Right Cards: Pitfalls & Solutions (310px wide) -->
  <g transform="translate(615, 75)">
    <!-- Pitfalls Card -->
    <g filter="url(#card-shadow)">
      <rect width="315" height="160" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
      <rect width="315" height="28" rx="8" fill="#fef2f2"/>
      <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">⚠️ 墙上时钟回拨带来的系统级灾难</text>
      
      <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">
        <text x="0" y="14"><tspan font-weight="700" fill="#b91c1c">1. Snowflake 雪花 ID 冲突：</tspan> 时间戳逆序致主键重复</text>
        <text x="0" y="38"><tspan font-weight="700" fill="#b91c1c">2. 分布式租约瞬时失效：</tspan> Lease 提早释放引发脑裂</text>
        <text x="0" y="62"><tspan font-weight="700" fill="#b91c1c">3. 耗时度量负数异常：</tspan> `t2 - t1 &lt; 0` 破坏 Prometheus 桶</text>
        <text x="0" y="86"><tspan font-weight="700" fill="#b91c1c">4. 超时定时器失效：</tspan> 线程 Sleep 周期被异常拉长或提前唤醒</text>
      </g>
    </g>

    <!-- Solutions Card -->
    <g transform="translate(0, 175)" filter="url(#card-shadow)">
      <rect width="315" height="160" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <rect width="315" height="28" rx="8" fill="#eff6ff"/>
      <text x="14" y="19" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">🛡️ 工业生产环境标准解法</text>

      <g transform="translate(14, 38)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">
        <text x="0" y="14"><tspan font-weight="700" fill="#1d4ed8">1. 耗时计算严格用单调钟：</tspan> Go `time.Since()` 自带单调位</text>
        <text x="0" y="38"><tspan font-weight="700" fill="#1d4ed8">2. 强制 NTP Slew 平滑校准：</tspan> 最大 500ppm 调速微调，禁用 step</text>
        <text x="0" y="62"><tspan font-weight="700" fill="#1d4ed8">3. Snowflake 容忍回拨自旋：</tspan> 回拨 &lt;5ms 自旋等待，大回拨切机器号</text>
        <text x="0" y="86"><tspan font-weight="700" fill="#1d4ed8">4. 云原生 PTP 高精同步：</tspan> AWS Time Sync / Chrony 微秒级收敛</text>
      </g>
    </g>
  </g>
</svg>
