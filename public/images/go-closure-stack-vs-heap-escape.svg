<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go 闭包逃逸物理边界：栈上内联 (0 Alloc) vs 堆上打包 (1 Alloc)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">直接就地调用 (编译器内联 0ns) vs 将闭包作为回调保存到 struct / interface ──► 捕获变量被迫逃逸到堆</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Stack Inline -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. 栈上就地调用：0 内存分配 (0 allocs/op)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">func Run(val int) int {</text>
          <text y="32" fill="#86efac">    fn := func() int { return val * 2 } // 虽有捕获</text>
          <text y="50" fill="#86efac">    return fn() // 但生命周期从未超出当前函数栈帧！</text>
          <text y="68" fill="#34d399">}</text>
          
          <text y="94" fill="#38bdf8">► 编译器逃逸分析 (Escape Analysis):</text>
          <text y="110" fill="#cbd5e1">"fn 不会被外部引用，直接内联为 return val * 2"</text>
          <text y="128" fill="#34d399">✓ 0 堆分配，0 GC 压力，执行仅需 0.5ns！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">核心机制：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 闭包未逃逸时，Go 编译器不会为其创建堆对象；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 捕获的变量直接使用父栈帧的寄存器/局部变量；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 性能等同于纯手工手写内联代码。</text>
      </g>
    </g>

    <!-- Right: Heap Escape -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. 返回闭包/异步调用：堆逃逸 (1 allocs/op)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">func MakeAdder(base int) func(int) int {</text>
          <text y="32" fill="#fca5a5">    // base 变量在 MakeAdder 退出后仍需存活！</text>
          <text y="50" fill="#fca5a5">    return func(x int) int { return base + x }</text>
          <text y="68" fill="#f87171">}</text>
          
          <text y="94" fill="#ef4444">🔴 编译器逃逸判定：</text>
          <text y="110" fill="#fca5a5">1. base 逃逸到堆 (moved to heap: base)</text>
          <text y="126" fill="#fca5a5">2. 生成闭包结构体: &amp;{fn_ptr, &amp;base}</text>
          <text y="142" fill="#fb7185">► 产生 1 次 mallocgc 堆分配 (16B) 与 GC 追踪！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">高频路径优化建议：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 在超高 QPS 核心热路径上，避免将闭包保存进 map 或 channel；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 使用普通具名 struct + 方法替代闭包回调；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 彻底消除闭包堆分配带来的 GC 延迟抖动！</text>
      </g>
    </g>
  </g>
</svg>