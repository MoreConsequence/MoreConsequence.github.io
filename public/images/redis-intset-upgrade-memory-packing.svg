<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Redis intset 紧凑整数集合结构与级联升级模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">encoding (INT16 / INT32 / INT64) ｜ length (元素总数) ｜ contents 连续字节数组 ｜ 插入大整数时触发不可逆就地扩容与数据后移</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. INTSET_ENC_INT16 (2 字节)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">元素值范围: [-32768, 32767]</text>
          
          <text x="10" y="38" fill="#86efac">物理紧凑优势：</text>
          <text x="10" y="54" fill="#38bdf8">• 存放 1,000 个小 ID</text>
          <text x="10" y="70" fill="#34d399">• 内存仅占: 4B(enc) + 4B(len) + 2000B</text>
          <text x="10" y="86" fill="#4ade80">• 相比 HashTable (32KB) 节省 94%！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 极小内存占用巅峰！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 默认初始编码格式；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 连续内存天然具备 CPU 缓存行加速；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造致密整数池。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. INTSET_ENC_INT32 (4 字节)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">元素值范围: [-2^31, 2^31-1]</text>
          
          <text x="10" y="38" fill="#86efac">自适应升级流转：</text>
          <text x="10" y="54" fill="#34d399">1. 插入新值 65535 (超出 16 位)</text>
          <text x="10" y="70" fill="#38bdf8">2. realloc 扩容数组为 4 * (N+1) 字节</text>
          <text x="10" y="86" fill="#34d399">3. 从后向前将旧元素重定位至 4 字节槽！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 0 临时内存额外分配！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 升级过程保证原有排序不变；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 支持 O(log N) 二分极速查找；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 空间与性能自适应平衡。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. INTSET_ENC_INT64 (8 字节)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">雪花 ID / 64 位大整数：</text>
          
          <text x="10" y="38" fill="#fed7aa">• 升级不可逆：即使删除大整数也不降级</text>
          <text x="10" y="54" fill="#38bdf8">• 元素数超过 set-max-intset-entries (512)</text>
          <text x="10" y="70" fill="#fb923c">• 自动转化为 dict 哈希表！</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 兼顾小规模极简与大规模扩展！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 严控微观内存开销的经典教科书；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 赋予小集合无与伦比的存储密度；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• Redis 内存之神设计！</text>
      </g>
    </g>
  </g>
</svg>