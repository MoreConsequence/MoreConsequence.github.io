<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="redis-intset-upgrade-memory-packing-title redis-intset-upgrade-memory-packing-desc"><title id="redis-intset-upgrade-memory-packing-title">Redis intset 内部编码拓扑：int16 -&gt; int32 -&gt; int64 级联升级与紧凑内存布局</title><desc id="redis-intset-upgrade-memory-packing-desc">Redis intset 内部编码拓扑：int16 -&gt; int32 -&gt; int64 级联升级与紧凑内存布局</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Redis intset 紧凑整数集合结构与级联升级模型</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">encoding (INT16 / INT32 / INT64) ｜ length (元素总数) ｜ contents 连续字节数组 ｜ 插入大整数时触发不可逆就地扩容与数据后移</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. INTSET_ENC_INT16 (2 字节)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">元素值范围: [-32768, 32767]</text>

          <text x="10" y="38" fill="#f5f5f5">物理紧凑优势：</text>
          <text x="10" y="54" fill="#f5f5f5">• 存放 1,000 个小 ID</text>
          <text x="10" y="70" fill="#f5f5f5">• 内存仅占: 4B(enc) + 4B(len) + 2000B</text>
          <text x="10" y="86" fill="#f5f5f5">• 相比 HashTable (32KB) 节省 94%！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 极小内存占用巅峰！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 默认初始编码格式；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 连续内存天然具备 CPU 缓存行加速；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造致密整数池。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. INTSET_ENC_INT32 (4 字节)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">元素值范围: [-2^31, 2^31-1]</text>

          <text x="10" y="38" fill="#f5f5f5">自适应升级流转：</text>
          <text x="10" y="54" fill="#f5f5f5">1. 插入新值 65535 (超出 16 位)</text>
          <text x="10" y="70" fill="#f5f5f5">2. realloc 扩容数组为 4 * (N+1) 字节</text>
          <text x="10" y="86" fill="#f5f5f5">3. 从后向前将旧元素重定位至 4 字节槽！</text>

          <text x="10" y="114" fill="#f5f5f5">✓ 0 临时内存额外分配！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 升级过程保证原有排序不变；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 支持 O(log N) 二分极速查找；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 空间与性能自适应平衡。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. INTSET_ENC_INT64 (8 字节)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">雪花 ID / 64 位大整数：</text>

          <text x="10" y="38" fill="#f5f5f5">• 升级不可逆：即使删除大整数也不降级</text>
          <text x="10" y="54" fill="#f5f5f5">• 元素数超过 set-max-intset-entries (512)</text>
          <text x="10" y="70" fill="#f5f5f5">• 自动转化为 dict 哈希表！</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 兼顾小规模极简与大规模扩展！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 严控微观内存开销的经典教科书；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 赋予小集合无与伦比的存储密度；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• Redis 内存之神设计！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
