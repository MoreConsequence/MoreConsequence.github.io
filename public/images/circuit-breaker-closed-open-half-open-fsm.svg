<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">微服务熔断器三态有限状态机 (Circuit Breaker FSM)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Closed (正常全量放行) ──(错误率 &gt; 50%)──► Open (瞬间熔断，0ms 快速失败 Fallback) ──(等待冷却 30s)──► Half-Open (放行 5 个探针请求) ──► 自愈复原</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. Closed (闭合正常状态)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">全量放行所有业务请求：</text>
          
          <text x="10" y="38" fill="#86efac">• 滑动窗口统计错误率与慢调用比例</text>
          <text x="10" y="54" fill="#38bdf8">• 错误率 &lt; 50% 保持稳定闭合</text>
          <text x="10" y="70" fill="#f87171">• 若连续超时报错超标 ──► 瞬间跳闸切至 Open！</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 系统健康常规运行基态！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 极小开销滑动窗口统计；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 敏感捕捉下游异常征兆；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 筑起雪崩防护前哨。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fef2f2"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">2. Open (断开熔断状态)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#f87171">瞬间熔断隔离下游：</text>
          
          <text x="10" y="38" fill="#fca5a5">• 0 发起真实下游网络 RPC ──► 0 线程阻塞！</text>
          <text x="10" y="54" fill="#ef4444">• 本地 0ms 瞬间返回 Fallback 降级默认值</text>
          <text x="10" y="70" fill="#fb923c">• 启动 SleepWindow 冷却倒计时 (如 30 秒)</text>
          
          <text x="10" y="100" fill="#f87171">🔴 彻底遏制级联雪崩蔓延！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">架构救命：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 给下游故障服务留出宝贵恢复喘息时间；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 保护自身线程池不被下游拖垮；</text>
        <text x="10" y="62" font-size="7.5" fill="#dc2626">• 生产自保核心。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Half-Open (半开试探自愈)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">冷却倒计时归零试探：</text>
          
          <text x="10" y="38" fill="#fed7aa">• 仅允许放行 5 个微量探针请求</text>
          <text x="10" y="54" fill="#4ade80">• 若 5 个请求全部成功 ──► 判定恢复，切回 Closed！</text>
          <text x="10" y="70" fill="#f87171">• 只要有 1 个再次失败 ──► 重新进入 Open 并重置冷却！</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 无人值守智能自愈闭环！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 赋予分布式架构全自动自适应恢复韧性；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• Resilience4j, Sentinel 核心基石；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 打造高可用微服务必修课！</text>
      </g>
    </g>
  </g>
</svg>