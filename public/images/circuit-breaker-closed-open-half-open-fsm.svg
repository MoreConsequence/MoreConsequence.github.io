<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="circuit-breaker-closed-open-half-open-fsm-title circuit-breaker-closed-open-half-open-fsm-desc"><title id="circuit-breaker-closed-open-half-open-fsm-title">微服务熔断器三态有限状态机：Closed (关闭) -&gt; Open (打开) -&gt; Half-Open (半开探测)</title><desc id="circuit-breaker-closed-open-half-open-fsm-desc">微服务熔断器三态有限状态机：Closed (关闭) -&gt; Open (打开) -&gt; Half-Open (半开探测)</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">微服务熔断器三态有限状态机 (Circuit Breaker FSM)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">Closed (正常全量放行) ──(错误率 &gt; 50%)──► Open (瞬间熔断，0ms 快速失败 Fallback) ──(等待冷却 30s)──► Half-Open (放行 5 个探针请求) ──► 自愈复原</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. Closed (闭合正常状态)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">全量放行所有业务请求：</text>

          <text x="10" y="38" fill="#f5f5f5">• 滑动窗口统计错误率与慢调用比例</text>
          <text x="10" y="54" fill="#f5f5f5">• 错误率 &lt; 50% 保持稳定闭合</text>
          <text x="10" y="70" fill="#f5f5f5">• 若连续超时报错超标 ──► 瞬间跳闸切至 Open！</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 系统健康常规运行基态！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 极小开销滑动窗口统计；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 敏感捕捉下游异常征兆；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 筑起雪崩防护前哨。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. Open (断开熔断状态)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">瞬间熔断隔离下游：</text>

          <text x="10" y="38" fill="#f5f5f5">• 0 发起真实下游网络 RPC ──► 0 线程阻塞！</text>
          <text x="10" y="54" fill="#f5f5f5">• 本地 0ms 瞬间返回 Fallback 降级默认值</text>
          <text x="10" y="70" fill="#f5f5f5">• 启动 SleepWindow 冷却倒计时 (如 30 秒)</text>

          <text x="10" y="100" fill="#f5f5f5">🔴 彻底遏制级联雪崩蔓延！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构救命：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 给下游故障服务留出宝贵恢复喘息时间；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 保护自身线程池不被下游拖垮；</text>
        <text x="10" y="224" font-size="7.5" fill="#eb6c36">• 生产自保核心。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. Half-Open (半开试探自愈)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">冷却倒计时归零试探：</text>

          <text x="10" y="38" fill="#f5f5f5">• 仅允许放行 5 个微量探针请求</text>
          <text x="10" y="54" fill="#f5f5f5">• 若 5 个请求全部成功 ──► 判定恢复，切回 Closed！</text>
          <text x="10" y="70" fill="#f5f5f5">• 只要有 1 个再次失败 ──► 重新进入 Open 并重置冷却！</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 无人值守智能自愈闭环！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 赋予分布式架构全自动自适应恢复韧性；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• Resilience4j, Sentinel 核心基石；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 打造高可用微服务必修课！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
