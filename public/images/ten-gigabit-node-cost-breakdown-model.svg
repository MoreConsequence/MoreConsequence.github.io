<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">万兆测速节点 95 计费 (P95 Bandwidth) 成本优化数学模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">每月 8,640 个 5 分钟采样点 ──► 剔除最高 5% (432 个尖峰点) ──► 按第 433 个样本点结算 ──► 节省 60% 机房带宽成本</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 5 分钟离散采样采集 (5-Minute Discrete Sampling: 8,640 Points/Month)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">机房交换机 SNMP 协议每 5 分钟读取一次端口流量 ──► 记录 Max(Inbound, Outbound)</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">全月 30 天生成 8,640 个带宽数值样本！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#991b1b">2. 削峰 5% 突发洪峰 (Eliminate Top 5% Spikes: 432 Samples)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">将 8,640 个样本降序排列 ──► 前 432 个点 (相当于全月累计 36 小时的高峰测速) 全部免单抹去！</text>
        <text x="15" y="62" font-size="8" fill="#7f1d1d">测速服务由于具有典型的短时突发特征，完美契合 95 计费规则！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. 智能流量整形与削峰填谷 (Traffic Shaping &amp; Scheduling)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">当月消耗满 400 个高峰点后 ──► 调度器自动将后续大流量测速引流至备用低成本节点</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将 P95 计费账单死死锁死在预算安全线内！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">4. 商业级运营成本断崖式下降 (60% Cloud Cost Reduction)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">单台万兆节点月度带宽支出从 120,000 元骤降至 48,000 元 ──► 支撑百万人次高质量测速！</text>
        <text x="15" y="62" font-size="8" fill="#047857">技术与商业财务精算结合的工程典范！</text>
      </g>
    </g>
  </g>
</svg>