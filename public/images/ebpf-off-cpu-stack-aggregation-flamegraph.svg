<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Off-CPU 阻塞深度溯源：捕获 CPU 使用率极低但吞吐严重劣化的真凶</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">On-CPU 火焰图 (只能看算力热点，对阻塞完全盲区) vs Off-CPU 探针 (挂载 sched_switch，精准捕获互斥锁等待与磁盘 I/O 挂起)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: On-CPU Blindspot -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统 On-CPU 排查盲区：毫无线索</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 系统现象: QPS 从 50,000 暴跌至 200</text>
          <text y="28" fill="#fca5a5">1. 运维查看 top / htop: CPU 使用率仅 3%！</text>
          <text y="44" fill="#ef4444">2. 抓取 perf / pprof CPU Profile: 显示全片空白！</text>
          
          <text y="68" fill="#ef4444">🔴 致命困境：</text>
          <text y="84" fill="#fb7185">• 进程没有在 CPU 上运行，它在【睡眠/等待】！</text>
          <text y="100" fill="#ef4444">• 传统的 CPU 采样探针根本无法感知阻塞事件！</text>
          <text y="118" fill="#f87171">► 排查彻底陷入僵局！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 锁争用 (Mutex Lock) 无法被常规 CPU 工具定位；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 慢 SQL、网络 I/O 阻塞成为幽灵杀手；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须从调度器底层捕获挂起时间！</text>
      </g>
    </g>

    <!-- Right: Off-CPU Flamegraph -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ eBPF Off-CPU 溯源：精准捕获毫秒级阻塞</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 挂载 tracepoint:sched:sched_switch</text>
          <text y="28" fill="#86efac">1. 进程迁出 CPU 时: 记录 start_time 与调用栈</text>
          <text y="44" fill="#38bdf8">2. 进程迁回 CPU 时: 计算 delta_time = now - start_time</text>
          <text y="60" fill="#34d399">3. 在 BPF Map 中将 delta_time 累加至对应堆栈哈希！</text>
          
          <text y="88" fill="#4ade80">✓ 生成 Off-CPU 火焰图: 85% 耗时卡在 sync.(*Mutex).Lock！</text>
          <text y="104" fill="#4ade80">✓ 5 分钟精确定位锁粒度过粗代码行并解决！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 照亮系统性能调优的另一半盲区；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 零侵入、微秒级开销实时运行于生产环境；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级内核工程师降维打击式排障神器！</text>
      </g>
    </g>
  </g>
</svg>