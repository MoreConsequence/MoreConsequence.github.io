<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="1" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">分布式共识与高可用架构五部曲工程全景蓝图</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">从 Raft 状态机日志复制、CAP/PACELC 权衡，到跨分片分布式事务、时序因果偏序与混沌故障注入工程</text>
  </g>

  <g transform="translate(40, 75)" filter="url(#card-shadow)" font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- Layer 1 -->
    <g transform="translate(0, 0)">
      <rect width="880" height="65" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="6" height="65" rx="3" fill="#2563eb"/>
      <text x="25" y="24" font-size="11" font-weight="700" fill="#1e40af">第一篇：共识基石 —— 深入 Raft 状态机内核 (Raft Consensus &amp; State Machine)</text>
      <text x="25" y="44" font-family="ui-monospace, monospace" font-size="8.5" fill="#2563eb">Leader 选举 ──► 日志连续性匹配 ──► 多数派 Commit 提交 ──► Pre-Vote 防脑裂 ──► Joint Consensus 动态成员变更</text>
    </g>

    <!-- Layer 2 -->
    <g transform="translate(0, 75)">
      <rect width="880" height="65" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect width="6" height="65" rx="3" fill="#16a34a"/>
      <text x="25" y="24" font-size="11" font-weight="700" fill="#166534">第二篇：法定人数模型 —— Quorum 读写与 CAP/PACELC 权衡 (Quorum Models &amp; Tradeoffs)</text>
      <text x="25" y="44" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">W + R &gt; N 强一致充要条件 ──► 鸽巢原理数学证明 ──► Lease Read 租约读 ──► Read Index 状态机线性一致性</text>
    </g>

    <!-- Layer 3 -->
    <g transform="translate(0, 150)">
      <rect width="880" height="65" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
      <rect width="6" height="65" rx="3" fill="#ea580c"/>
      <text x="25" y="24" font-size="11" font-weight="700" fill="#c2410c">第三篇：跨分片原子性 —— 2PC、TCC、Saga 与事务性 Outbox (Distributed Transactions)</text>
      <text x="25" y="44" font-family="ui-monospace, monospace" font-size="8.5" fill="#c2410c">两阶段提交 2PC (协调者阻塞单点) ──► 事务性 Outbox (CDC/Debezium 异步解耦) ──► Saga 长事务补偿链</text>
    </g>

    <!-- Layer 4 -->
    <g transform="translate(0, 225)">
      <rect width="880" height="65" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <rect width="6" height="65" rx="3" fill="#dc2626"/>
      <text x="25" y="24" font-size="11" font-weight="700" fill="#991b1b">第四篇：分布式时序 —— 逻辑时钟、向量时钟到 Spanner TrueTime (Distributed Clocks)</text>
      <text x="25" y="44" font-family="ui-monospace, monospace" font-size="8.5" fill="#b91c1c">Lamport 偏序标量时钟 ──► 向量时钟因果分叉 (V_A ∥ V_B) ──► Google TrueTime GPS/原子钟不确定性窗口 [earliest, latest]</text>
    </g>

    <!-- Layer 5 -->
    <g transform="translate(0, 300)">
      <rect width="880" height="65" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
      <rect width="6" height="65" rx="3" fill="#9333ea"/>
      <text x="25" y="24" font-size="11" font-weight="700" fill="#7e22ce">第五篇：可靠性终审 —— 混沌工程、Jepsen 线性一致性黑盒检验 (Chaos Engineering &amp; Jepsen)</text>
      <text x="25" y="44" font-family="ui-monospace, monospace" font-size="8.5" fill="#7e22ce">网络分区注入 (Asymmetric/Bridge) ──► 节点假死/GC Stop-The-World ──► Knossos 状态机历史线性一致性全局验证</text>
    </g>
  </g>
</svg>
