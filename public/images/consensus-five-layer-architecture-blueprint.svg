<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" role="img" aria-labelledby="consensus-five-layer-architecture-blueprint-title consensus-five-layer-architecture-blueprint-desc"><title id="consensus-five-layer-architecture-blueprint-title">consensus five layer architecture blueprint</title><desc id="consensus-five-layer-architecture-blueprint-desc">consensus five layer architecture blueprint</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">分布式共识与高可用架构五部曲工程全景蓝图</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">从 Raft 状态机日志复制、CAP/PACELC 权衡，到跨分片分布式事务、时序因果偏序与混沌故障注入工程</text>
  </g>

  <g transform="translate(40, 75)" font-family="'Geist', 'Noto Sans SC', sans-serif">
    
    <g transform="translate(0, 0)">
      <rect width="880" height="65" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="6" height="65" rx="3" fill="#2563eb" />
      <text x="25" y="24" font-size="11" font-weight="700" fill="#2d3142">第一篇：共识基石 —— 深入 Raft 状态机内核 (Raft Consensus &amp; State Machine)</text>
      <text x="25" y="44" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">Leader 选举 ──► 日志连续性匹配 ──► 多数派 Commit 提交 ──► Pre-Vote 防脑裂 ──► Joint Consensus 动态成员变更</text>
    </g>

    
    <g transform="translate(0, 75)">
      <rect width="880" height="65" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="6" height="65" rx="3" fill="#4f5d75" />
      <text x="25" y="24" font-size="11" font-weight="700" fill="#2d3142">第二篇：法定人数模型 —— Quorum 读写与 CAP/PACELC 权衡 (Quorum Models &amp; Tradeoffs)</text>
      <text x="25" y="44" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">W + R &gt; N 强一致充要条件 ──► 鸽巢原理数学证明 ──► Lease Read 租约读 ──► Read Index 状态机线性一致性</text>
    </g>

    
    <g transform="translate(0, 150)">
      <rect width="880" height="65" rx="6" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
      <rect width="6" height="65" rx="3" fill="#ea580c" />
      <text x="25" y="24" font-size="11" font-weight="700" fill="#4f5d75">第三篇：跨分片原子性 —— 2PC、TCC、Saga 与事务性 Outbox (Distributed Transactions)</text>
      <text x="25" y="44" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">两阶段提交 2PC (协调者阻塞单点) ──► 事务性 Outbox (CDC/Debezium 异步解耦) ──► Saga 长事务补偿链</text>
    </g>

    
    <g transform="translate(0, 225)">
      <rect width="880" height="65" rx="6" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
      <rect width="6" height="65" rx="3" fill="#dc2626" />
      <text x="25" y="24" font-size="11" font-weight="700" fill="#2d3142">第四篇：分布式时序 —— 逻辑时钟、向量时钟到 Spanner TrueTime (Distributed Clocks)</text>
      <text x="25" y="44" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">Lamport 偏序标量时钟 ──► 向量时钟因果分叉 (V_A ∥ V_B) ──► Google TrueTime GPS/原子钟不确定性窗口 [earliest, latest]</text>
    </g>

    
    <g transform="translate(0, 300)">
      <rect width="880" height="65" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
      <rect width="6" height="65" rx="3" fill="#4f5d75" />
      <text x="25" y="24" font-size="11" font-weight="700" fill="#4f5d75">第五篇：可靠性终审 —— 混沌工程、Jepsen 线性一致性黑盒检验 (Chaos Engineering &amp; Jepsen)</text>
      <text x="25" y="44" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">网络分区注入 (Asymmetric/Bridge) ──► 节点假死/GC Stop-The-World ──► Knossos 状态机历史线性一致性全局验证</text>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
