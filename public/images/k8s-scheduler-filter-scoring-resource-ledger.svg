<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="k8s-scheduler-filter-scoring-resource-ledger-title k8s-scheduler-filter-scoring-resource-ledger-desc"><title id="k8s-scheduler-filter-scoring-resource-ledger-title">Kubernetes 调度器核心两轮筛选：Filter 过滤硬约束 vs Score 评分软偏好算法拓扑</title><desc id="k8s-scheduler-filter-scoring-resource-ledger-desc">Kubernetes 调度器核心两轮筛选：Filter 过滤硬约束 vs Score 评分软偏好算法拓扑</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">K8s 调度器不是找最空机器：Filter 硬过滤与 Score 软评分流水线</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">全量待选节点池 ──► 1. Predicates / Filter (硬性约束淘汰) ──► 2. Priorities / Score (多维度加权打分) ──► 3. Reserve 预留 ──► 4. 绑定 Pod</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. Filter 阶段: 硬性物理约束过滤 (一票否决淘汰制)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">NodeResourcesFit (CPU/内存容量) &amp;&amp; NodeName &amp;&amp; NodePorts &amp;&amp; NodeAffinity &amp;&amp; TaintsTolerations</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">检查污点容忍、端口冲突、亲和性标签与存储卷挂载限制，将不合格节点全部剔除！</text>

      
      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">2. Score 阶段: 软偏好多维度加权综合打分 (0 ~ 100 分)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Score = w1*LeastAllocated + w2*BalancedResourceAllocation + w3*ImageLocality + w4*TopologySpread</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">兼顾资源打散 (高可用) 与资源紧凑 (节省成本)，综合镜像本地命中率计算最优节点！</text>
      </g>

      
      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">3. Reserve 与 Permit 插件阶段 (乐观预占与同步等待)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">ReservePlugin 内存预占资源 ──► Permit 插件执行 Gang Scheduling 批处理同步等待</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">防止并发调度时多个 Pod 争抢同一份剩余资源发生超卖冲突，支持 AI 任务全量就绪再开跑！</text>
      </g>

      
      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. Bind 异步写入与 Kubelet 容器拉起 (Asynchronous Binding)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">POST /api/v1/namespaces/default/pods/pod-1/binding ──► apiserver ──► Kubelet 监听到事件启动容器</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">调度器完成 Bind 写入后立即开始调度下一个 Pod，调度吞吐 QPS 突破上千/秒！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
