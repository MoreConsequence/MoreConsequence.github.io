<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MCP Server 进程生命周期与崩溃自动自愈状态机</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Starting ──► Healthy (心跳正常) ──► Unhealthy (超时/内存暴涨) ──► Auto-Restart (100ms 重启拉起) ──► Restored</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 状态 1: 惰性冷启动 (Lazy On-Demand Spawning)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">仅在 Agent 首次真正调用该工具时拉起对应 MCP Server 进程 ──► 节省 90% 启动内存与 CPU 算力</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">保持系统初始状态极度轻盈！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 状态 2: 活跃探针与健康监控 (Active Liveness Probing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">每 10s 发送 ping 探针 ──► 监控 stdio 管道可读写性与进程 RSS 内存占用</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">实时洞察每一个扩展服务的真实健康度！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 状态 3: 异常崩溃瞬间捕获 (Crash Trapping &amp; Self-Heal)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">MCP Server 意外崩溃退出 ──► Gateway 在 50ms 内捕获并重启子进程 ──► 自动重建工具注册表</text>
        <text x="15" y="62" font-size="8" fill="#047857">对上层调用方完全透明无感！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 状态 4: 优雅下线与垃圾回收 (Graceful Decommission &amp; Cleanup)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">连续 10 分钟无调用 ──► 发送 SIGTERM 优雅停止 ──► 彻底释放系统资源！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代微服务与云原生守护进程的高品质工程设计！</text>
      </g>
    </g>
  </g>
</svg>