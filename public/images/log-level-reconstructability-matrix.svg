<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="log-level-reconstructability-matrix-title log-level-reconstructability-matrix-desc"><title id="log-level-reconstructability-matrix-title">按可重建性分的三类日志</title><desc id="log-level-reconstructability-matrix-desc">三类日志按可重建性排列：可重建的能从事后数据推导，打 DEBUG 安全；不可重建但可延迟的靠采样留存；不可重建且不可延迟的只在故障瞬间存在，必须写入时就保留在结构化事件里，不受级别开关管辖。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5" />

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不要问"重不重要"，问"事后能不能重建"</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">按可重建性分三类，第三类才是真正要守住的信息</text>


<line x1="72" y1="128" x2="72" y2="472" stroke="#7a8399" stroke-width="1" marker-end="url(#arrow)" />
<text x="56" y="304" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" transform="rotate(-90 56 304)" text-anchor="middle" letter-spacing="0.14em">可重建性递减</text>


<rect x="112" y="128" width="800" height="96" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
<rect x="128" y="144" width="60" height="20" rx="2" fill="transparent" stroke="#7a8399" stroke-width="1" />
<text x="158" y="158" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">第一类</text>
<text x="128" y="188" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">可重建</text>
<text x="264" y="188" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">能从请求入参、数据库状态或下游响应重新推导 —— 例：本次计算的中间步骤值</text>
<text x="264" y="208" fill="#2e5aa8" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">留存策略：打 DEBUG 是安全的，真出事可以靠重放或补查拿回来</text>


<rect x="112" y="240" width="800" height="96" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
<rect x="128" y="256" width="60" height="20" rx="2" fill="transparent" stroke="#7a8399" stroke-width="1" />
<text x="158" y="270" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">第二类</text>
<text x="128" y="300" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不可重建但可延迟</text>
<text x="304" y="300" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">只在当时内存里，但提前建好机制就能留下 —— 例：下游返回的原始响应体</text>
<text x="304" y="320" fill="#2e5aa8" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">留存策略：按采样率控制留存成本，不必全量打 INFO</text>


<rect x="112" y="352" width="800" height="96" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
<rect x="128" y="368" width="60" height="20" rx="2" fill="transparent" stroke="rgba(235,108,54,0.45)" stroke-width="0.8" />
<text x="158" y="382" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">第三类</text>
<text x="128" y="412" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不可重建且不可延迟</text>
<text x="328" y="412" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">只在故障那个瞬间存在 —— 例：锁等待队列、连接池水位、触发熔断的那条请求上下文</text>
<text x="328" y="432" fill="#eb6c36" font-size="10.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">留存策略：写入时就保留在结构化事件里，不受级别开关管辖</text>


<line x1="48" y1="480" x2="912" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" />
<text x="48" y="510" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">Code review 里只问一句：如果这行日志没打出来，事后我还有别的办法拿到这个信息吗？</text>
<text x="48" y="534" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">答不上来，它就不该受级别开关的管辖。</text>

</svg>
