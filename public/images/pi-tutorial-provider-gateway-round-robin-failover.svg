<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 模型网关 (Provider Gateway) 统一路由与弹性故障漂移</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">统一领域请求 Request ──► 动态权重路由与限流感知 ──► 适配器转义 ──► 主力 (Claude) 宕机 1ms 漂移至备用 (DeepSeek / OpenAI)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 统一领域接口规范 (Unified LLM Gateway Contract)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">业务层仅调用: gateway.complete({ messages, tools, model: "auto" }) ──► 0 厂商私有字段泄漏</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将异构大模型完全抽象为标准化算力资源！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 智能健康检查与权重调度 (Health Probing &amp; Weighted Routing)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">实时追踪各厂商的 P99 延迟、429 频次与可用率 ──► 自动优先将请求路由至响应最快的健康节点</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">最大化系统吞吐与降低响应延迟！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 跨厂商秒级故障漂移 (Zero-Downtime Failover Migration)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">主力 Claude 突发 500 Internal Error ──► 捕获异常并在 1ms 内将同一 Prompt 转换重发给 DeepSeek V3</text>
        <text x="15" y="62" font-size="8" fill="#047857">业务层感知 0 报错，丝滑继续流式输出！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 统一 Token 计量与成本对账 (Unified Cost Accounting)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">无论调用哪家服务商，自动归一化统计 input_tokens, cached_tokens, output_tokens 与实际美元开销！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">现代高可用 Agent 基础设施的核心基石！</text>
      </g>
    </g>
  </g>
</svg>