<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="librespeed-config-flow-title librespeed-config-flow-desc">
      <title id="librespeed-config-flow-title">LibreSpeed Go 配置兼容分支</title>
      <desc id="librespeed-config-flow-desc">Flowchart showing the asset-path fallback and the TLS and HTTP/2 listener decisions implemented at commit 59cff12.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="librespeed-config-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="librespeed-config-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="librespeed-config-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>
      <text x="40" y="32" fill="#4f5d75" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-size="8" font-weight="500" letter-spacing="0.18em">SOURCE PATHS · STATIC LIGHT</text>
      <text x="40" y="60" fill="#2d3142" font-family="'Instrument Serif', 'Songti SC', serif" font-size="20">配置值进入 Web 层后的两个兼容分支</text>
      <text x="40" y="88" fill="#4f5d75" font-family="'Geist', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12">可回退的是资产源；不满足 TLS 的 HTTP/2 只记录并忽略。</text>

