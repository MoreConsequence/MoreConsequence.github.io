<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Redis 内存淘汰机制：LRU 缓存污染 vs LFU 对数计数器免疫抗扫描</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">allkeys-lru (一次全量数据扫描导致热点 Key 被全部洗掉) vs allkeys-lfu (16 位时间衰减 + 8 位对数访问频次计数)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: LRU Scan Disaster -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ LRU 面对全表扫描：热点缓存瞬间洗劫一空</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 某后台报表任务执行全量冷数据查询</text>
          <text y="28" fill="#fca5a5">1. 读取 100 万个仅访问 1 次的历史冷 Key</text>
          <text y="44" fill="#f87171">2. LRU 时钟更新为当前最新时间！</text>
          <text y="60" fill="#ef4444">3. 内存满时，Redis 优先淘汰时间戳较旧的常驻核心热点！</text>
          
          <text y="86" fill="#ef4444">🔴 灾难性后果：</text>
          <text y="102" fill="#fb7185">全站首页极高频热点被全部踢出，后端数据库瞬间被压垮打崩！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">LRU 物理软肋：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 只看"最后一次访问时间"，不看"历史访问频次"；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 偶发的大规模扫描流会产生毁灭性的缓存污染 (Cache Pollution)；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 生产核心缓存集群严禁盲目配置 LRU！</text>
      </g>
    </g>

    <!-- Right: LFU Resistance -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ LFU (最不经常使用)：对数频次与时间衰减双控</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// LFU 24-bit 结构: 16-bit LDT (时间) + 8-bit LOG_C (频次)</text>
          <text y="30" fill="#86efac">1. 访问时按对数概率递增: 频次越高越难增长 (上限 255 相当于上百万次访问)</text>
          <text y="48" fill="#38bdf8">2. 随时间推移按 lfu-decay-time 线性衰减计数器</text>
          
          <text y="72" fill="#34d399">3. 全量扫描冷数据时：</text>
          <text y="86" fill="#4ade80">   冷 Key 频次仅为 5，热点 Key 频次高达 250！</text>
          <text y="102" fill="#4ade80">   内存淘汰坚决剔除冷 Key，核心热点稳如泰山！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">生产配置铁律：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 核心业务缓存全面升级为 maxmemory-policy allkeys-lfu；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 获得极强抵御突发流量扫描与批处理的能力；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造坚不可摧的高命中率缓存护城河！</text>
      </g>
    </g>
  </g>
</svg>