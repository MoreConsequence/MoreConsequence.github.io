<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="redis-maxmemory-eviction-lru-vs-lfu-scan-resistance-title redis-maxmemory-eviction-lru-vs-lfu-scan-resistance-desc"><title id="redis-maxmemory-eviction-lru-vs-lfu-scan-resistance-title">Redis maxmemory 淘汰策略实战：LRU 面对冷数据全表扫描的脆弱性 vs LFU 免疫抗扫描</title><desc id="redis-maxmemory-eviction-lru-vs-lfu-scan-resistance-desc">Redis maxmemory 淘汰策略实战：LRU 面对冷数据全表扫描的脆弱性 vs LFU 免疫抗扫描</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Redis 内存淘汰机制：LRU 缓存污染 vs LFU 对数计数器免疫抗扫描</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">allkeys-lru (一次全量数据扫描导致热点 Key 被全部洗掉) vs allkeys-lfu (16 位时间衰减 + 8 位对数访问频次计数)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ LRU 面对全表扫描：热点缓存瞬间洗劫一空</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 某后台报表任务执行全量冷数据查询</text>
          <text y="28" fill="#f5f5f5">1. 读取 100 万个仅访问 1 次的历史冷 Key</text>
          <text y="44" fill="#f5f5f5">2. LRU 时钟更新为当前最新时间！</text>
          <text y="60" fill="#f5f5f5">3. 内存满时，Redis 优先淘汰时间戳较旧的常驻核心热点！</text>

          <text y="86" fill="#f5f5f5">🔴 灾难性后果：</text>
          <text y="102" fill="#fb7185">全站首页极高频热点被全部踢出，后端数据库瞬间被压垮打崩！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">LRU 物理软肋：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 只看"最后一次访问时间"，不看"历史访问频次"；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 偶发的大规模扫描流会产生毁灭性的缓存污染 (Cache Pollution)；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 生产核心缓存集群严禁盲目配置 LRU！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ LFU (最不经常使用)：对数频次与时间衰减双控</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// LFU 24-bit 结构: 16-bit LDT (时间) + 8-bit LOG_C (频次)</text>
          <text y="30" fill="#f5f5f5">1. 访问时按对数概率递增: 频次越高越难增长 (上限 255 相当于上百万次访问)</text>
          <text y="48" fill="#f5f5f5">2. 随时间推移按 lfu-decay-time 线性衰减计数器</text>

          <text y="72" fill="#f5f5f5">3. 全量扫描冷数据时：</text>
          <text y="86" fill="#f5f5f5">   冷 Key 频次仅为 5，热点 Key 频次高达 250！</text>
          <text y="102" fill="#f5f5f5">   内存淘汰坚决剔除冷 Key，核心热点稳如泰山！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">生产配置铁律：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 核心业务缓存全面升级为 maxmemory-policy allkeys-lfu；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 获得极强抵御突发流量扫描与批处理的能力；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 打造坚不可摧的高命中率缓存护城河！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
