<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Context 树状级联取消传播拓扑 (Cancellation Propagation)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Root Background ──► WithCancel (cancelCtx) ──► 递归向下通知所有子 Context 关闭 Done() Channel ──► 瞬间回收下游协程</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 树状父子引用绑定 (parentCancelCtx Registration)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">child, cancel := context.WithCancel(parent) ──► 向上查找到祖先 cancelCtx 并在其 children map 注册</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">构建起严密的级联控制引用链！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 触发取消信号 (cancel(true, err) Invocation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">父级调用 cancel() 或超时定时器到期 ──► c.err = err ──► 原子关闭内部 d.done 阻塞通道</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">广播零开销纳秒级唤醒信号！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 递归向下遍历子节点 (Recursive Child Cancellation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">for child := range c.children { child.cancel(false, err) } ──► 递归级联关闭全部子孙 context</text>
        <text x="15" y="62" font-size="8" fill="#047857">数万个下游 RPC / DB 协程瞬间感知并主动退出！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 解绑与垃圾回收清理 (Unlink &amp; Memory Reclamation)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">c.children = nil ──► 从祖先节点解绑引用 ──► 协助 GC 瞬间回收整个 Context 子树内存！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">Go 微服务链路治理与防泄漏核心骨架！</text>
      </g>
    </g>
  </g>
</svg>