<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ReAct 自主代理认知决策闭环 (Reasoning + Acting Loop)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. Thought (基于当前状态推理下一步目标) ──► 2. Action (选择工具并下发参数) ──► 3. Observation (读取环境真实反馈) ──► 4. 递归收敛直到任务完结</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 认知状态推演 (Thought: Semantic Reasoning &amp; Planning)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">分析用户 Prompt 与当前上下文 ──► 拆解任务子步骤 ──► 明确当前瓶颈: "需要先排查 tests/xxx.test.ts 报错"</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">将复杂目标拆解为可落地的单步行动！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 结构化工具派发 (Action: Tool Execution Dispatch)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">生成 Tool Call: run_command("npm test") ──► 下发给系统终端安全沙箱执行</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将思维决策转化为真实的物理系统指令！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 环境反馈与观测解析 (Observation: Output Ingestion)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">捕获 stdout: "FAIL line 42: expected true, got false" ──► 组装 role: "tool" 消息注入对话上下文</text>
        <text x="15" y="62" font-size="8" fill="#047857">真实世界反馈作为下一轮思考的铁证输入！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 动态修正与目标收敛 (Self-Correction &amp; Termination)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">发现失败 ──► 自动进入下一轮 Thought 制定修复补丁 ──► 直至所有测试全绿 ──► 优雅输出最终交付！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">人类工程师自主解决复杂工程问题的完美数字映射！</text>
      </g>
    </g>
  </g>
</svg>