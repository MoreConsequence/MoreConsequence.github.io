<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="speedtest-whitepaper-evolution-title speedtest-whitepaper-evolution-desc">
<title id="speedtest-whitepaper-evolution-title">从插件到自托管再到开放测量</title>
<desc id="speedtest-whitepaper-evolution-desc">时间线展示四代测速演进：2000 speedtest.net 域名测速、2006 Ookla 成立、2009 M-Lab NDT、2016 LibreSpeed 与 fast.com、2018 Ookla HTML5 转正、2020 ndt7、Go 后端 speedtest-go；speedtest-go 为本文标本。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');</style><marker id="speedtest-whitepaper-evolution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="speedtest-whitepaper-evolution-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="speedtest-whitepaper-evolution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">EVOLUTION · TIMELINE</text>
<text x="40" y="76" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400" text-anchor="start">从插件到自托管再到开放测量</text>
<text x="40" y="104" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">每一代都重新定义一次被测对象；标本位于开源自托管一支</text>
<text x="56" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.16em">TIMELINE · 2000 → 2026</text><rect x="64" y="222" width="112" height="84" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="64" y="222" width="112" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="76" y="234" width="80" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="116" y="246" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">2000→2006</text><text x="120" y="272" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">Ookla</text><text x="120" y="294" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">Flash 多连接</text><line x1="120" y1="306" x2="120" y2="322" fill="none" stroke="#4f5d75" stroke-width="1.2"/><rect x="184" y="354" width="112" height="84" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="184" y="354" width="112" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="196" y="366" width="44" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="218" y="378" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">2009</text><text x="240" y="404" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">M-Lab NDT</text><text x="240" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">开放存档</text><line x1="240" y1="338" x2="240" y2="354" fill="none" stroke="#4f5d75" stroke-width="1.2"/><rect x="304" y="222" width="112" height="84" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="304" y="222" width="112" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="316" y="234" width="68" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="350" y="246" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">2016-03</text><text x="360" y="272" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">LibreSpeed</text><text x="360" y="294" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">开源自托管</text><line x1="360" y1="306" x2="360" y2="322" fill="none" stroke="#4f5d75" stroke-width="1.2"/><rect x="424" y="354" width="112" height="84" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="424" y="354" width="112" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="436" y="366" width="68" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="470" y="378" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">2016-05</text><text x="480" y="404" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">fast.com</text><text x="480" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">只测下行</text><line x1="480" y1="338" x2="480" y2="354" fill="none" stroke="#4f5d75" stroke-width="1.2"/><rect x="544" y="222" width="112" height="84" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="544" y="222" width="112" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="556" y="234" width="68" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="590" y="246" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">2018-01</text><text x="600" y="272" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">HTML5 转正</text><text x="600" y="294" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">插件退出</text><line x1="600" y1="306" x2="600" y2="322" fill="none" stroke="#4f5d75" stroke-width="1.2"/><rect x="664" y="354" width="112" height="84" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="664" y="354" width="112" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="676" y="366" width="68" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/><text x="710" y="378" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">2020-07</text><text x="720" y="404" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">ndt7</text><text x="720" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">单流 + BBR</text><line x1="720" y1="338" x2="720" y2="354" fill="none" stroke="#4f5d75" stroke-width="1.2"/><rect x="784" y="222" width="112" height="84" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="784" y="222" width="112" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><rect x="796" y="234" width="60" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/><text x="826" y="246" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">2020 →</text><text x="840" y="272" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">speedtest-go</text><text x="840" y="294" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="middle">Go 单二进制</text><line x1="840" y1="306" x2="840" y2="322" fill="none" stroke="#4f5d75" stroke-width="1.2"/><line x1="64" y1="330" x2="896" y2="330" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#speedtest-whitepaper-evolution-arrow-link)"/><text x="56" y="478" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">标本（橙色）只回答一次测试如何计量；去哪里测、能承载多少是部署与平台层的问题。</text><line x1="40" y1="540" x2="920" y2="540" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/><text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="136" y="556" width="12" height="12" rx="2" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="0.8"/><text x="156" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">TIMELINE</text><rect x="376" y="556" width="12" height="12" rx="2" fill="#eb6c36" stroke="#eb6c36" stroke-width="0.8"/><text x="396" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans SC', monospace" font-weight="400" text-anchor="start">SPECIMEN</text>

