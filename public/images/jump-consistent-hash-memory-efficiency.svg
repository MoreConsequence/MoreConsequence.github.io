<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="jump-consistent-hash-memory-efficiency-title jump-consistent-hash-memory-efficiency-desc"><title id="jump-consistent-hash-memory-efficiency-title">Jump Consistent Hash 跳跃一致性哈希：0 内存占用与 5 行代码极速算法</title><desc id="jump-consistent-hash-memory-efficiency-desc">Jump Consistent Hash 跳跃一致性哈希：0 内存占用与 5 行代码极速算法</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">Jump Consistent Hash (Google) 极简无内存哈希算法</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">传统环哈希 (需维护数万虚拟节点的红黑树数组，占用数 MB 内存) vs Jump Hash (纯数学伪随机跳跃，0 内存常驻，执行仅需 5 行汇编)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">传统虚拟节点环 (Ring Hash)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">100 个物理节点 * 200 虚拟节点 = 20,000 个槽位</text>

          <text y="38" fill="#cbd5e1">物理开销构成：</text>
          <text y="52" fill="#f5f5f5">• 维护 20,000 个 uint32 排序数组与红黑树</text>
          <text y="66" fill="#cbd5e1">• 每次查询需在内存中执行 binary search 二分查找</text>
          <text y="80" fill="#f5f5f5">• 跨线程并发需要加 RWMutex 读写锁保护</text>

          <text y="106" fill="#f5f5f5">✓ 适合支持任意节点随机上下线场景</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制特性：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 灵活性最高，支持删除任意中间节点；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 内存占用中等 (约几百 KB)；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 通用分布式键值存储标准。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ Google Jump Hash：5 行代码 0 内存神技</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">int32_t JumpConsistentHash(uint64_t key, int32_t num_buckets) {</text>
          <text y="28" fill="#f5f5f5">    int64_t b = -1, j = 0;</text>
          <text y="42" fill="#f5f5f5">    while (j &lt; num_buckets) {</text>
          <text y="56" fill="#f5f5f5">        b = j; key = key * 2862933555777941757ULL + 1;</text>
          <text y="70" fill="#f5f5f5">        j = (b + 1) * (double(1LL &lt;&lt; 31) / double((key &gt;&gt; 33) + 1));</text>
          <text y="84" fill="#f5f5f5">    }</text>
          <text y="98" fill="#f5f5f5">    return b; // 0 内存！速度快 10 倍！</text>
          <text y="112" fill="#f5f5f5">}</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 纯数学概率几何分布模拟；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 0 锁、0 内存结构体、极致 CPU 寄存器运算；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 连续编号桶 (0..N-1) 场景下的终极神器！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
