<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="esm-cjs-dual-package-exports-resolution-title esm-cjs-dual-package-exports-resolution-desc"><title id="esm-cjs-dual-package-exports-resolution-title">ESM / CJS 双包模块分辨率合同：package.json exports 字段三层语义与 Dual…</title><desc id="esm-cjs-dual-package-exports-resolution-desc">ESM / CJS 双包模块分辨率合同：package.json exports 字段三层语义与 Dual Package Hazard</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">ESM / CJS 双包分辨率合同：package.json exports 条件导出</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">import (ESM 静态树) vs require (CJS 运行时加载) ｜ Dual Package Hazard 双实例单例失效陷阱与解决契约</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 双包危害陷阱 (Dual Package Hazard)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">// 模块 A 用 import 'pkg' (加载 ./index.mjs)</text>
          <text y="28" fill="#f5f5f5">// 模块 B 用 require('pkg') (加载 ./index.cjs)</text>

          <text y="52" fill="#f5f5f5">🔴 灾难性后果：</text>
          <text y="68" fill="#f5f5f5">1. 内存中存在 pkg 的两份完全独立的模块副本！</text>
          <text y="84" fill="#fb7185">2. 单例模式 (Singleton) 彻底失效！</text>
          <text y="100" fill="#f5f5f5">3. if (instance instanceof Class) 判定为 false！</text>
          <text y="116" fill="#f5f5f5">► 导致全局 React 上下文、Redux Store、Symbol 注册表全部错乱！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">本质根因：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• Node.js 模块加载器将 .mjs 与 .cjs 视为两个不同 URL 资源；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 缺乏状态共享桥梁时，各自维护一份独立闭包变量；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 在大型工程中引发极为隐蔽的诡异 Bug！</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ 正确姿势：exports 条件映射与状态桥接</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">"exports": {</text>
          <text y="28" fill="#f5f5f5">  ".": {</text>
          <text y="42" fill="#f5f5f5">    "types": "./dist/index.d.ts",     // TS 类型优先</text>
          <text y="56" fill="#f5f5f5">    "import": "./dist/index.mjs",     // ESM 入口</text>
          <text y="70" fill="#f5f5f5">    "require": "./dist/index.cjs"     // CJS 入口</text>
          <text y="84" fill="#f5f5f5">  }</text>
          <text y="98" fill="#f5f5f5">}</text>
          <text y="116" fill="#f5f5f5">► 状态桥接：CJS 作为核心实现，ESM 做瘦包装薄层透传！</text>
          <text y="130" fill="#f5f5f5">► 确保无论以何种方式引入，单例状态永远全局唯一！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">现代发布规范：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 废弃旧时代 main / module 字段冲突，统一使用 exports；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 使用 attw (are-the-types-wrong) 工具自动化校验分辨率；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 打造生产级零缺陷的双生态兼容库！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
