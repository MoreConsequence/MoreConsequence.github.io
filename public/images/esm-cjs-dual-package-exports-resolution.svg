<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ESM / CJS 双包分辨率合同：package.json exports 条件导出</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">import (ESM 静态树) vs require (CJS 运行时加载) ｜ Dual Package Hazard 双实例单例失效陷阱与解决契约</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Dual Package Hazard -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 双包危害陷阱 (Dual Package Hazard)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">// 模块 A 用 import 'pkg' (加载 ./index.mjs)</text>
          <text y="28" fill="#f87171">// 模块 B 用 require('pkg') (加载 ./index.cjs)</text>
          
          <text y="52" fill="#ef4444">🔴 灾难性后果：</text>
          <text y="68" fill="#fca5a5">1. 内存中存在 pkg 的两份完全独立的模块副本！</text>
          <text y="84" fill="#fb7185">2. 单例模式 (Singleton) 彻底失效！</text>
          <text y="100" fill="#fca5a5">3. if (instance instanceof Class) 判定为 false！</text>
          <text y="116" fill="#ef4444">► 导致全局 React 上下文、Redux Store、Symbol 注册表全部错乱！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">本质根因：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• Node.js 模块加载器将 .mjs 与 .cjs 视为两个不同 URL 资源；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 缺乏状态共享桥梁时，各自维护一份独立闭包变量；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 在大型工程中引发极为隐蔽的诡异 Bug！</text>
      </g>
    </g>

    <!-- Right: exports Contract -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 正确姿势：exports 条件映射与状态桥接</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399">"exports": {</text>
          <text y="28" fill="#86efac">  ".": {</text>
          <text y="42" fill="#38bdf8">    "types": "./dist/index.d.ts",     // TS 类型优先</text>
          <text y="56" fill="#4ade80">    "import": "./dist/index.mjs",     // ESM 入口</text>
          <text y="70" fill="#fed7aa">    "require": "./dist/index.cjs"     // CJS 入口</text>
          <text y="84" fill="#86efac">  }</text>
          <text y="98" fill="#34d399">}</text>
          <text y="116" fill="#38bdf8">► 状态桥接：CJS 作为核心实现，ESM 做瘦包装薄层透传！</text>
          <text y="130" fill="#34d399">► 确保无论以何种方式引入，单例状态永远全局唯一！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">现代发布规范：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 废弃旧时代 main / module 字段冲突，统一使用 exports；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 使用 attw (are-the-types-wrong) 工具自动化校验分辨率；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 打造生产级零缺陷的双生态兼容库！</text>
      </g>
    </g>
  </g>
</svg>