<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">git bisect 自动化性能回归猎杀：O(log N) 快速锁定坏提交</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">git bisect start ──► 编写自动化测试脚本 check.sh ──► git bisect run ./check.sh ──► 毫秒级锁定首个劣质 Commit</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Manual Digging -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 人肉排查：1000 个提交排查到绝望</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">git log -n 1000 // 两个月内 1000 次提交</text>
          <text y="30" fill="#fca5a5">1. 人工逐个 checkout 切换分支</text>
          <text y="46" fill="#fca5a5">2. 手工编译、启动服务、运行测试</text>
          <text y="62" fill="#fca5a5">3. 遇到编译错误或环境问题频繁卡壳</text>
          
          <text y="88" fill="#ef4444">🔴 效率评估：</text>
          <text y="104" fill="#fca5a5">• 耗费 3 天时间依然找不到引入性能退化的提交；</text>
          <text y="120" fill="#fb7185">• 容易被人为误判污染排查结论！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">痛点总结：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• O(N) 线性复杂度排查效率低下；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 人肉测试具有随机性与疲劳误差；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 无法沉淀为自动化工程资产。</text>
      </g>
    </g>

    <!-- Right: git bisect run -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ git bisect run：10 步精准收敛</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#34d399"># 编写判断脚本 check.sh (退出码 0 为好，非 0 为坏)</text>
          <text y="28" fill="#86efac">go test -bench=BenchmarkCore -run=^$ | grep ...</text>
          
          <text y="50" fill="#38bdf8">git bisect start HEAD v1.0.0</text>
          <text y="66" fill="#34d399">git bisect run ./check.sh</text>
          
          <text y="88" fill="#4ade80">► Git 自动执行二分查找 (log2(1024) ≈ 10 次迭代！)</text>
          <text y="104" fill="#4ade80">► 5 分钟内自动输出精确元凶：</text>
          <text y="120" fill="#cbd5e1">  7b3a1c8 is the first bad commit (by engineer X)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工程价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 纯自动化无人值守猎杀 Regression；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 退出码 125 自动跳过无法编译的中间脏提交；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 资深工程师定位疑难杂症的核武器！</text>
      </g>
    </g>
  </g>
</svg>