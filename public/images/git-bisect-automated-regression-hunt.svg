<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="git-bisect-automated-regression-hunt-title git-bisect-automated-regression-hunt-desc"><title id="git-bisect-automated-regression-hunt-title">git bisect 自动化性能回归猎杀：二分搜索判定脚本与 10 次提交定位 Bug</title><desc id="git-bisect-automated-regression-hunt-desc">git bisect 自动化性能回归猎杀：二分搜索判定脚本与 10 次提交定位 Bug</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">git bisect 自动化性能回归猎杀：O(log N) 快速锁定坏提交</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">git bisect start ──► 编写自动化测试脚本 check.sh ──► git bisect run ./check.sh ──► 毫秒级锁定首个劣质 Commit</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">❌ 人肉排查：1000 个提交排查到绝望</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">git log -n 1000 // 两个月内 1000 次提交</text>
          <text y="30" fill="#f5f5f5">1. 人工逐个 checkout 切换分支</text>
          <text y="46" fill="#f5f5f5">2. 手工编译、启动服务、运行测试</text>
          <text y="62" fill="#f5f5f5">3. 遇到编译错误或环境问题频繁卡壳</text>

          <text y="88" fill="#f5f5f5">🔴 效率评估：</text>
          <text y="104" fill="#f5f5f5">• 耗费 3 天时间依然找不到引入性能退化的提交；</text>
          <text y="120" fill="#fb7185">• 容易被人为误判污染排查结论！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">痛点总结：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• O(N) 线性复杂度排查效率低下；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 人肉测试具有随机性与疲劳误差；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#eb6c36">• 无法沉淀为自动化工程资产。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">✓ git bisect run：10 步精准收敛</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g transform="translate(10, 15)" font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5"># 编写判断脚本 check.sh (退出码 0 为好，非 0 为坏)</text>
          <text y="28" fill="#f5f5f5">go test -bench=BenchmarkCore -run=^$ | grep ...</text>

          <text y="50" fill="#f5f5f5">git bisect start HEAD v1.0.0</text>
          <text y="66" fill="#f5f5f5">git bisect run ./check.sh</text>

          <text y="88" fill="#f5f5f5">► Git 自动执行二分查找 (log2(1024) ≈ 10 次迭代！)</text>
          <text y="104" fill="#f5f5f5">► 5 分钟内自动输出精确元凶：</text>
          <text y="120" fill="#cbd5e1">  7b3a1c8 is the first bad commit (by engineer X)</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">工程价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 纯自动化无人值守猎杀 Regression；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 退出码 125 自动跳过无法编译的中间脏提交；</text>
        <text x="10" y="224" font-size="7.5" font-weight="700" fill="#4f5d75">• 资深工程师定位疑难杂症的核武器！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
