<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Dynamo 弱一致性反熵三剑客：Read Repair vs Hinted Handoff vs Merkle Tree</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">同步读修复 (在线捎带补齐) ｜ 暂存写入 (临时节点代存故障写) ｜ Merkle 树后台反熵 (哈希树快速对齐全量差异)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 读修复 (Read Repair)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">// 客户端并发读取 R=2 副本</text>
          <text x="10" y="34" fill="#93c5fd">Node A (v2, 最新) | Node B (v1, 落后)</text>
          
          <text x="10" y="58" fill="#4ade80">协调者动作：</text>
          <text x="10" y="74" fill="#86efac">1. 立即向客户端返回最新值 v2</text>
          <text x="10" y="90" fill="#38bdf8">2. 异步向 Node B 发送写请求覆盖为 v2</text>
          
          <text x="10" y="114" fill="#34d399">✓ 随读随修，热点数据秒级收敛！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 0 额外后台轮询开销；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 仅在热点数据被访问时触发；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Cassandra 核心在线修复机制。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 暂存写入 (Hinted Handoff)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">// 目标节点 Node C 临时断网</text>
          <text x="10" y="34" fill="#86efac">1. 协调者将写操作暂存于本地 Hint 表</text>
          <text x="10" y="50" fill="#86efac">2. 客户端依然得到 W=2 写入成功响应！</text>
          
          <text x="10" y="74" fill="#38bdf8">3. 监测到 Node C 恢复上线:</text>
          <text x="10" y="90" fill="#34d399">   • 将暂存的 Hint 批量回放至 Node C</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 保证极端故障下的超高写入可用性！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• Sloppy Quorum 的关键补充；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 避免节点瞬时故障导致写入拒绝；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造 AP 高可用系统的首选。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. Merkle 树反熵 (Anti-Entropy)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">// 冷数据后台兜底同步</text>
          <text x="10" y="34" fill="#fed7aa">1. 节点间比对根哈希 Root Hash</text>
          <text x="10" y="48" fill="#38bdf8">   • 若根相同 ──► 百万数据 100% 一致！</text>
          
          <text x="10" y="70" fill="#34d399">2. 若根不同 ──► 仅下钻比对不一致子树</text>
          <text x="10" y="88" fill="#4ade80">   • 仅传输差异范围内的 Key-Value</text>
          
          <text x="10" y="112" fill="#4ade80">✓ 极小网络带宽完成全量数据修复！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 彻底解决冷门数据长期落后不一致难题；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 形成在线与离线修复的完美闭环；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级分布式存储的坚实后盾！</text>
      </g>
    </g>
  </g>
</svg>