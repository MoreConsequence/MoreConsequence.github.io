<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 466" width="960" height="466" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="raudTitle raudDesc">
<title id="raudTitle">删除式撤销与追加式撤销</title>
<desc id="raudDesc">两种撤销方式的对比。方式 A 删除式撤销：把记录删掉，试图让旧事没有发生过，账上结果为空，代价是审计链断裂、已读过它的观察者不会同步忘记、期间他人的有效改动会被一起覆盖。方式 B 追加式撤销即红冲：新增一条方向相反的凭证，两条记录并存、净额为零，收益是事故后能重建证据链、净额由对账口径算出而不覆盖他人改动、撤销路径可与正向路径共用同一套投递保证。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">撤销不是让旧事没发生过，是发布一条新的事实</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">财务领域的红冲是这个模式的成熟形态，值得直接借</text>

<!-- panel A -->
<rect x="48" y="100" width="400" height="290" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="68" y="128" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">方式 A</text>
<text x="68" y="156" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">删除式撤销</text>
<text x="68" y="180" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">试图让旧事「没发生过」</text>

<rect x="68" y="198" width="360" height="96" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="86" y="222" fill="#2d3142" font-size="10.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">T0   +¥50    发放券</text>
<text x="86" y="248" fill="#2d3142" font-size="10.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">T1   ✕       删除这条记录</text>
<line x1="86" y1="262" x2="410" y2="262" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="86" y="282" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">账上结果：空</text>

<line x1="68" y1="312" x2="408" y2="312" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="68" y="334" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.1em">代价</text>
<text x="68" y="354" fill="#2d3142" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 审计链断裂：无法证明它存在过</text>
<text x="68" y="372" fill="#2d3142" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 已读过它的观察者不会同步忘记</text>
<text x="68" y="390" fill="#2d3142" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 期间他人的有效改动会被一起覆盖</text>

<!-- panel B (accent) -->
<rect x="512" y="100" width="400" height="290" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="532" y="128" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">方式 B</text>
<text x="532" y="156" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">追加式撤销（红冲）</text>
<text x="532" y="180" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">承认撤销本身是一件新事</text>

<rect x="532" y="198" width="360" height="96" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="550" y="222" fill="#2d3142" font-size="10.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">T0   +¥50    发放券</text>
<text x="550" y="248" fill="#2d3142" font-size="10.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">T1   −¥50    红冲（新凭证）</text>
<line x1="550" y1="262" x2="874" y2="262" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="550" y="282" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">账上结果：两条并存，净额 ¥0</text>

<line x1="532" y1="312" x2="872" y2="312" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="532" y="334" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.1em">收益</text>
<text x="532" y="354" fill="#2d3142" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 两条都在，事故后能重建证据链</text>
<text x="532" y="372" fill="#2d3142" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 净额由对账口径算出，不覆盖他人改动</text>
<text x="532" y="390" fill="#2d3142" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 撤销路径可与正向路径共用同一套投递保证</text>

<!-- footer -->
<line x1="48" y1="414" x2="912" y2="414" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="48" y="434" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">方式 B 的硬要求在数据模型上：同一笔业务必须允许挂多条方向相反的事实，并且要有一个明确的净额口径——这个得在建表时就满足。</text>
<text x="48" y="450" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">事故现场改不动数据模型，只能在建模阶段留好位置</text>

</svg>
