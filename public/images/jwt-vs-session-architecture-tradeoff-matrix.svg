<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="jwt-vs-session-architecture-tradeoff-matrix-title jwt-vs-session-architecture-tradeoff-matrix-desc"><title id="jwt-vs-session-architecture-tradeoff-matrix-title">身份认证架构选型：无状态 JWT vs 有状态 Session 权衡矩阵</title><desc id="jwt-vs-session-architecture-tradeoff-matrix-desc">身份认证架构选型：无状态 JWT vs 有状态 Session 权衡矩阵</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">认证体系权衡架构：无状态 JWT vs 有状态 Session</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">JWT (无状态自包含、0 存储查询，但无法即时主动吊销) vs Redis Session (支持秒级踢人下线，但产生中心化缓存依赖与网络 I/O)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">无状态 JWT (Stateless Token)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">Header.Payload.Signature (自包含用户 ID 与权限)</text>

          <text y="38" fill="#f5f5f5">核心优势：</text>
          <text y="52" fill="#f5f5f5">• 0 数据库/Redis 查询，CPU 纯本地验签 (0ms)</text>
          <text y="66" fill="#f5f5f5">• 天然支持跨域名、微服务网关与移动端</text>

          <text y="90" fill="#f5f5f5">致命短板：</text>
          <text y="104" fill="#f5f5f5">• 用户修改密码或封禁账号后，已发出的 JWT 在过期前依然合法有效！</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 适合超大规模公网 API 鉴权；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 必须设置超短过期时间 (如 15 分钟)；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 配合 Refresh Token 轮换。</text>
      </g>
    </g>

    
    <g transform="translate(465, 0)">
      <rect width="435" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="435" height="34" rx="8" fill="#ffffff" />
      <text x="217" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">有状态 Session (Stateful Redis Store)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="405" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text y="14" fill="#f5f5f5">Cookie: session_id = random_uuid</text>

          <text y="38" fill="#f5f5f5">核心优势：</text>
          <text y="52" fill="#f5f5f5">• 绝对实时控制权：管理后台点“强制下线”瞬间 DEL key</text>
          <text y="66" fill="#f5f5f5">• 用户立即失去会话被踢出，安全性极高！</text>

          <text y="90" fill="#f5f5f5">物理代价：</text>
          <text y="104" fill="#f5f5f5">• 每次 API 请求必须进行一次 Redis 网络往返查询 (~1ms)</text>
        </g>

        <rect y="162" width="405" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 银行、电商管理后台与严肃企业内网标配；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 拥有 100% 绝对实时的安全吊销能力；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 安全与性能的经典平衡！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
