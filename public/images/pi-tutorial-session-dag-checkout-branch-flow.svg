<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pi 会话树分支切换 (Checkout) 与时光机状态流转模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">用户执行 /checkout &lt;node-id&gt; ──► 瞬间将当前 HEAD 指针移动至历史节点 ──► 状态机无感切换工作区上下文</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Before Checkout -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">分支 A: JWT 鉴权探索链路 (HEAD = m4_A)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">当前活跃上下文链路：</text>
          
          <text y="38" fill="#86efac">• Node 1 (Root): "实现用户鉴权模块"</text>
          <text y="52" fill="#38bdf8">• Node 2: "选择鉴权方案"</text>
          <text y="66" fill="#fb923c">• Node 3 (Fork Point): 决策分叉点</text>
          <text y="80" fill="#4ade80">• Node 4_A (HEAD): "编写 JWT 代码与黑名单机制"</text>
          
          <text y="104" fill="#4ade80">✓ 正常推进 JWT 方案开发！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">机制特性：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 发现 JWT 黑名单依赖 Redis 增加了架构复杂度；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 用户希望对比测试传统的 Session 方案；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 发起 /checkout Node 3。</text>
      </g>
    </g>

    <!-- Right: After Checkout -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 分支 B: Session 方案平行探索 (HEAD = m4_B)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">HEAD 指针移动至 Node 3 并派生新节点：</text>
          
          <text y="36" fill="#86efac">• Node 1..3: 100% 共享历史事实与需求背景</text>
          <text y="50" fill="#38bdf8">• Node 4_B (New HEAD): "编写 HttpOnly Cookie 逻辑"</text>
          <text y="64" fill="#34d399">• Node 4_A 数据依然 100% 完好保存在磁盘上！</text>
          <text y="78" fill="#4ade80">• 可随时在两条路线之间来回自由切换对比！</text>
          
          <text y="104" fill="#4ade80">✓ 赋予开发者前所未有的架构探索自由！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 终结破坏性重写导致的旧方案丢失；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 让 AI 真正具备多方案推演与版本控制能力；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 顶级 AI 交互工程最高境界！</text>
      </g>
    </g>
  </g>
</svg>