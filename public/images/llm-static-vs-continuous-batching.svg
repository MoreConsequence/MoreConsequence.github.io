<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">大模型批处理调度对比：静态批处理（Static Batch）vs 连续批处理（Continuous Batching）</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">木桶木屑效应（早完成请求被迫等待最长请求） vs 迭代级动态插队（Iteration-level Scheduling，算力利用率 100%）</text>
  </g>

  <!-- Main Comparison Card (900px wide) -->
  <g transform="translate(30, 75)">
    <!-- Left Box: Static Batching (435px) -->
    <g filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
      <rect width="435" height="36" rx="8" fill="#fef2f2"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统静态批处理：严重的木桶填充浪费</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Request 1 (Long: 500 tokens) -->
        <rect width="403" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="12" y="16" fill="#1e40af" font-weight="700">Req 1 (长文本): [ 500 Tokens 生成中... ]</text>
        <text x="12" y="28" font-size="9.5" fill="#2563eb">全程占用 GPU Slot</text>

        <!-- Request 2 (Short: 50 tokens finished early) -->
        <g transform="translate(0, 42)">
          <rect width="403" height="42" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
          <text x="12" y="16" fill="#991b1b" font-weight="700">Req 2 (短文本): [50 Tokens 结束] ──► <tspan fill="#dc2626">Padding 占位等待 450 轮！</tspan></text>
          <text x="12" y="30" font-size="9.5" fill="#7f1d1d">💥 算力空转：已完成请求不能提前返回，未完成请求必须填充空数据！</text>
        </g>

        <!-- Request 3 (New request queued outside) -->
        <g transform="translate(0, 90)">
          <rect width="403" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="12" y="16" fill="#0f172a" font-weight="700">Req 3 (新来请求): 外部队列盲等中 ⏳</text>
          <text x="12" y="30" font-size="9.5" fill="#64748b">必须等待整组 Batch 全部结束，才能开始下一批！首字时延（TTFT）极高！</text>
        </g>
      </g>
    </g>

    <!-- Right Box: Continuous Batching (435px) -->
    <g transform="translate(465, 0)" filter="url(#card-shadow)">
      <rect width="435" height="280" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="36" rx="8" fill="#f0fdf4"/>
      <text x="217" y="23" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">⚡ 迭代级连续批处理：无锁动态插拔</text>

      <g transform="translate(16, 48)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        <!-- Step 1 Early Finish & Evict -->
        <rect width="403" height="36" rx="4" fill="#ecfdf5" stroke="#10b981"/>
        <text x="12" y="16" fill="#065f46" font-weight="700">Req 2 遇到 EOS (结束符) ──► 立即结束并释放显存</text>
        <text x="12" y="28" font-size="9.5" fill="#047857">向客户端流式输出完毕，空出 GPU 计算槽位</text>

        <!-- Step 2 Dynamic Insert -->
        <g transform="translate(0, 42)">
          <rect width="403" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
          <text x="12" y="16" fill="#1e40af" font-weight="700">下一迭代瞬间插入 Req 3 ──► 0 等待即刻 Prefill！</text>
          <text x="12" y="30" font-size="9.5" fill="#2563eb">Req 1 与新进的 Req 3 在同一个 Forward 矩阵中混部并行解码！</text>
        </g>

        <!-- Output Metric -->
        <g transform="translate(0, 90)">
          <rect width="403" height="42" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
          <text x="12" y="16" fill="#065f46" font-weight="700">🎯 吞吐提升奇迹：</text>
          <text x="12" y="30" font-size="9.5" fill="#047857">GPU 算力利用率（MFU）提升 300%~500%，P99 首字延迟下降 80%！</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(30, 375)">
    <rect width="900" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <text x="450" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      💡 <tspan font-weight="700" fill="#0f172a">调度核心进化：</tspan> 从“请求级粗粒度排队”跃迁至 <tspan font-weight="700" fill="#2563eb">“Token 迭代级细粒度动态调度（Orca 架构）”</tspan>，是大模型推理吞吐翻倍的基石。
    </text>
  </g>
</svg>
