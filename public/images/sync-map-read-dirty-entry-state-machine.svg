<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go sync.Map 核心双表架构 (readOnly &amp; dirty Map)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">read 表 (atomic.Value 存储只读只增 map，0 锁快速命中) ｜ dirty 表 (互斥锁保护的全量 map) ｜ misses 达到 len(dirty) 触发 read 整体晋升</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">1. read 表 (无锁原子快照)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">read atomic.Pointer[readOnly]</text>
          
          <text x="10" y="38" fill="#86efac">读请求命中：</text>
          <text x="10" y="54" fill="#38bdf8">• 0 互斥锁、0 Goroutine 阻塞</text>
          <text x="10" y="70" fill="#34d399">• CAS 更新 entry.p 甚至支持无锁写覆盖！</text>
          <text x="10" y="86" fill="#cbd5e1">• amended=true 标记 dirty 表有新 Key</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 单次读取耗时仅 ~12ns！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 专为读多写少、只追加更新热点场景打造；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 支撑多核 CPU 线性扩展；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 打造极速快读通道。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2. dirty 表 (全量缓冲新写)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">dirty map[any]*entry (受 mu 保护)</text>
          
          <text x="10" y="38" fill="#fed7aa">新 Key 写入逻辑：</text>
          <text x="10" y="54" fill="#38bdf8">1. mu.Lock()</text>
          <text x="10" y="70" fill="#34d399">2. 写入 dirty 表，并设置 read.amended=true</text>
          <text x="10" y="86" fill="#fed7aa">3. 读未命中 read 时 ──► 查 dirty 并 misses++</text>
          
          <text x="10" y="114" fill="#fb923c">⚠️ 涉及锁保护与全量维护</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 缓冲新插入的 Key 集合；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 避免频繁修改不可变的 read 视图；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 写入缓冲屏障。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">3. 动态晋升 (Promotion)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">当 misses &gt;= len(dirty) 时：</text>
          
          <text x="10" y="38" fill="#86efac">原子晋升流转：</text>
          <text x="10" y="54" fill="#34d399">1. 将 dirty 直接赋给 read.m</text>
          <text x="10" y="70" fill="#38bdf8">2. dirty 置为 nil, misses 置 0</text>
          <text x="10" y="86" fill="#4ade80">3. 随后的读请求再次 100% 回归 0 锁极速路径！</text>
          
          <text x="10" y="114" fill="#4ade80">✓ 自适应自我愈合进化！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 自动根据访问频率在读优与写优间滑动；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 空间换时间换并发度的绝佳工业实践；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 标准库顶级架构典范！</text>
      </g>
    </g>
  </g>
</svg>