<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 经济学防线：三级 Token 预算与滑动窗口软硬截流</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">单轮预算 (防单次死循环吐废话) ──► 会话总预算 (触发 Compaction 压缩) ──► 租户级硬配额 (拦截死循环账单穿透)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 单轮输出 Token 软上限 (Turn-Level Hard Cap: 4,096 Tokens)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">max_tokens: 4096 ──► 超过即强制截断并注入提示: "Output truncated, please continue in next turn"</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">防止模型陷入无休止的代码递归或长日志倾倒死循环，保住单次调用时延与开销！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 会话累计预算与压缩水位 (Session Compaction Threshold: 80,000 Tokens)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">当 Context 超过 80k: 自动触发后台异步摘要 ──► 将历史 Tool 消息压缩为 1.5k 结构化状态事实</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">将百万字对话无缝压缩，在保留核心执行记忆的前提下节省 95% 上下文 Token 费用！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 租户与项目级滑动窗口熔断 (Tenant-Level Sliding Window: $50 / Day)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">Redis 记录过去 24 小时真实支出 ──► 达到 80% 触发飞书/Slack 预警 ──► 达到 100% 自动降级为小模型</text>
        <text x="15" y="62" font-size="8" fill="#047857">彻底封死企业 AI 应用被恶意利用或死循环导致的“一觉醒来欠费数十万”惨案！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 缓存命中激励与财务审计大盘 (FinOps Realtime Ledger)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">区分计费: 缓存命中 Token ($0.3/M) vs 写入 Token ($3.0/M) ──► 精确核算每个功能的 ROI 收益！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">让 AI 智能体的大规模企业级落地具备严密、可控的财务可行性！</text>
      </g>
    </g>
  </g>
</svg>