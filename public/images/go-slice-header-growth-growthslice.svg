<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go Slice 24B Header 结构与 growthslice 内存对齐扩容算法</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">容量小于 256 翻倍 ｜ 超过 256 采用平滑公式 (newcap += (newcap + 3*256)/4) ｜ roundupsize 内存规格向上取整</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Slice Header -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Slice 24 字节结构体物理布局</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="8" fill="#f8fafc">
          <text y="14" fill="#38bdf8">type slice struct {</text>
          <text y="32" fill="#93c5fd">    array unsafe.Pointer // 8B: 指向底层连续数组元素首地址</text>
          <text y="50" fill="#93c5fd">    len   int            // 8B: 当前逻辑元素个数</text>
          <text y="68" fill="#93c5fd">    cap   int            // 8B: 底层数组物理最大容量</text>
          <text y="86" fill="#38bdf8">}</text>
          
          <text y="112" fill="#34d399">✓ 切片传递仅拷贝 24B 值，开销极低</text>
          <text y="128" fill="#fbbf24">⚠️ 多个 Slice 共享同一底层数组时，修改会互相影响！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">重要边界：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• append 超出 cap 时，会分配全新底层数组并拷贝数据；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 扩容后原切片与新切片 array 指针分离，不再共享；</text>
        <text x="10" y="62" font-size="7.5" fill="#1d4ed8">• 预分配 make([]T, 0, cap) 消除全部扩容重分配开销！</text>
      </g>
    </g>

    <!-- Right: Growth Rule -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Go 1.18+ growthslice 扩容与对齐算法</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g transform="translate(10, 15)" font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">// 扩容容量计算两阶段</text>
          <text y="30" fill="#86efac">1. 若 old.cap &lt; 256 ──► newcap = old.cap × 2 (翻倍)</text>
          <text y="46" fill="#86efac">2. 若 old.cap &gt;= 256 ──► 平滑过渡公式：</text>
          <text y="60" fill="#cbd5e1">   newcap += (newcap + 3*256) / 4 (约 1.25x 增长)</text>
          
          <text y="82" fill="#fb923c">// 关键：roundupsize 物理内存对齐</text>
          <text y="98" fill="#fed7aa">将 newcap × sizeof(T) 向上对齐到 mallocgc class 规格</text>
          <text y="114" fill="#34d399">例如: 期望 41 字节 ──► 向上匹配 48B 规格</text>
          <text y="128" fill="#34d399">实际 cap = 48 ÷ sizeof(T) (实际容量通常略大于公式值)</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">工业级收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 避免了 Go 1.17 之前 1024 临界点断崖式 2x 变 1.25x 阶跃；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 向上对齐充分利用已分配的 Slab 内存页，消除内部碎片；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#047857">• 减少 30% 以上的 GC 垃圾回收压力！</text>
      </g>
    </g>
  </g>
</svg>