<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="llm-pagedattention-block-table-physical-mapping-title llm-pagedattention-block-table-physical-mapping-desc"><title id="llm-pagedattention-block-table-physical-mapping-title">llm pagedattention block table physical mapping</title><desc id="llm-pagedattention-block-table-physical-mapping-desc">llm pagedattention block table physical mapping</desc>
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">PagedAttention 核心机制：虚拟逻辑块到离散物理 GPU 显存页映射</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">借鉴 OS 分页思想 ｜ 消除内部显存碎片 ｜ 支持跨 Request 共享 Prompt 前缀 (Copy-on-Write)</text>
  </g>

  <g transform="translate(30, 70)">
    
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 请求逻辑 Token 序列 (Logical)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// Request A: 连续逻辑块</text>
          <text x="10" y="34" fill="#f5f5f5">Logical Block 0: Token 0~15</text>
          <text x="10" y="50" fill="#f5f5f5">Logical Block 1: Token 16~31</text>
          <text x="10" y="66" fill="#f5f5f5">Logical Block 2: Token 32~37 (未填满)</text>

          <text x="10" y="92" fill="#f5f5f5">✓ 逻辑上看似连续申请空间</text>
          <text x="10" y="108" fill="#cbd5e1">• 无需预先分配最大 2048 长度！</text>
          <text x="10" y="124" fill="#f5f5f5">• 按需分配单个 16-Token 块。</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">机制要点：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 块大小通常设为 16 或 32 Tokens；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 杜绝传统静态显存预占用的巨额浪费；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 显存利用率从 20% 飙升至 96%！</text>
      </g>
    </g>

    
    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 块表映射 (Block Table)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 块表记录动态映射关系</text>
          <text x="10" y="34" fill="#f5f5f5">Block 0 ──► Physical Frame #7</text>
          <text x="10" y="50" fill="#f5f5f5">Block 1 ──► Physical Frame #3</text>
          <text x="10" y="66" fill="#f5f5f5">Block 2 ──► Physical Frame #12</text>

          <text x="10" y="92" fill="#f5f5f5">// Copy-on-Write 分支:</text>
          <text x="10" y="108" fill="#f5f5f5">Request B 共享 Frame #7 (Ref=2)</text>
          <text x="10" y="124" fill="#f5f5f5">✓ 0 冗余内存复制多分支采样！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 纯软件级页表转换，硬件加速计算；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 并行采样多个候选输出时极度节省显存；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• vLLM 核心竞争力的数学基石。</text>
      </g>
    </g>

    
    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 离散物理显存池 (Physical VRAM)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">// 离散 HBM/SRAM 显存页</text>
          <text x="10" y="34" fill="#f5f5f5">Frame #3 : [ K-Cache | V-Cache ]</text>
          <text x="10" y="48" fill="#f5f5f5">Frame #7 : [ System Prompt 前缀 ]</text>
          <text x="10" y="62" fill="#f5f5f5">Frame #12: [ 动态增量 Token 缓存 ]</text>

          <text x="10" y="88" fill="#f5f5f5">1. 物理位置无需连续</text>
          <text x="10" y="104" fill="#f5f5f5">2. 彻底消灭外部显存碎片</text>
          <text x="10" y="120" fill="#f5f5f5">✓ 单机吞吐量提升 4 倍！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">物理收益：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 让单张 A100/H100 容纳 4x 并发请求；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• 彻底解决 LLM 推理吞吐瓶颈；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 现代 AI 推理系统工业标准。</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
