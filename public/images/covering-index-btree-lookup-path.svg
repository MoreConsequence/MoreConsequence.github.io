<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">覆盖索引 (Covering Index) 物理执行对比：0 回表 vs 痛苦回表</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">普通索引查出主键 ID ──► 必须拿着 ID 回到聚簇索引执行二次随机 I/O (回表) vs 覆盖索引 (所需字段全部在索引叶子节点，0 回表直接返回)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Secondary Index with Back to Table -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 普通二级索引：必须触发回表 (Back-to-Table)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">SELECT id, age, name FROM users WHERE age = 18;</text>
          <text y="28" fill="#fca5a5">索引仅包含: KEY (age)</text>
          
          <text y="50" fill="#ef4444">物理寻址过程：</text>
          <text y="66" fill="#ef4444">1. 扫描 idx_age 索引树 ──► 找到 10,000 个匹配行与主键 ID</text>
          <text y="82" fill="#ef4444">2. 拿着 10,000 个 ID 分别去聚簇索引树查 name 字段！</text>
          <text y="98" fill="#ef4444">3. 产生 10,000 次离散随机磁盘 I/O，耗时从 2ms 暴涨至 1.5s！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">性能瓶颈：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 回表引发大量离散随机读，打爆 SSD IOPS；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 当匹配行数 &gt; 20% 时，优化器会直接放弃索引走全表扫描；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 慢 SQL 的头号诱因！</text>
      </g>
    </g>

    <!-- Right: Covering Index -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 联合覆盖索引：Using index 零回表极速直出</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">建立联合索引: KEY (age, name)</text>
          <text y="28" fill="#86efac">EXPLAIN Extra: "Using index"</text>
          
          <text y="50" fill="#38bdf8">物理寻址过程：</text>
          <text y="66" fill="#34d399">1. 扫描 idx_age_name 索引树</text>
          <text y="82" fill="#34d399">2. 索引叶子节点本身就完整包含了 id, age, name 3 个字段！</text>
          <text y="98" fill="#4ade80">3. 100% 纯内存顺序扫描，0 次回表，耗时仅 0.3ms！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 吞吐量提升 50~100 倍；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 极大减轻主键聚簇索引的锁竞争与 I/O 压力；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 高性能数据库 SQL 优化的核心必杀技！</text>
      </g>
    </g>
  </g>
</svg>