<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent 会话持久化：不可变追加日志 (Append-Only JSONL) 与状态投影模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">事件流 session.jsonl 增量追加 ──► 进程重启时顺序回放 (Event Sourcing Playback) ──► 0ms 完美重构内存 AgentState 会话树</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. 原子事件增量持久化 (Atomic Append: session.jsonl)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">每发生一次 UserInput, ToolCall, ToolResult ──► 单行 JSON 极速写入磁盘 ──► 0 整体重写大文件开销，断电 0 损坏</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">数据存储不可篡改的最佳实践！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">2. 故障恢复与极速回放 (Crash Recovery &amp; Fast Playback)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">进程重启 ──► 顺序扫描 JSONL 行 ──► 状态机仅需 5ms 即可恢复全部对话历史与分支状态</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">赋予 Agent 极强的抗崩溃与会话恢复能力！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">3. 内存投影派生视图 (In-Memory State Projection)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">从事件日志投影出: 当前激活消息列表、已消耗 Token 汇总、工具成功率指标 ──► 业务层只读投影，0 脏写竞争</text>
        <text x="15" y="62" font-size="8" fill="#047857">严格的读写分离 (CQRS) 架构！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 会话树分叉与时光机回溯 (Session Tree Forking &amp; Time Travel)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">基于 parent_id 指针自由派生新分支 ──► 用户可随时回到 3 步之前的历史节点尝试全新探索路径！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">打造类似 Git 分支般的顶级会话交互体验！</text>
      </g>
    </g>
  </g>
</svg>