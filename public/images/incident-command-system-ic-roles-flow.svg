<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="incident-command-system-ic-roles-flow-title incident-command-system-ic-roles-flow-desc"><title id="incident-command-system-ic-roles-flow-title">生产事故指挥体系 (ICS: Incident Command System)：指挥官 (IC)、排查官与沟通官协同</title><desc id="incident-command-system-ic-roles-flow-desc">生产事故指挥体系 (ICS: Incident Command System)：指挥官 (IC)、排查官与沟通官协同</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">生产突发事故应急指挥体系 (ICS: Incident Command System)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">指挥官 Incident Commander (拥有绝对裁决权) ｜ 调查排查官 Ops Lead (专注技术排查) ｜ 通讯官 Comms Lead (对齐高管与客服大盘)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g>
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">1. 事故指挥官 (IC: Commander)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">拥有故障期间最高裁决权：</text>

          <text x="10" y="38" fill="#f5f5f5">• 严禁亲自下场写代码调试！</text>
          <text x="10" y="54" fill="#f5f5f5">• 负责分配任务、把控全局节奏</text>
          <text x="10" y="70" fill="#f5f5f5">• 拍板关键决策: "立即一键全量回滚！"</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 终结群龙无首与争吵推诿！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">职责定位：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 维持作战室 (War Room) 秩序；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 确保每 15 分钟进行一次进展同步；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 危机处理大脑。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#2d3142" text-anchor="middle">2. 技术排查官 (Ops / Tech Lead)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">技术深入止血与排障：</text>

          <text x="10" y="38" fill="#f5f5f5">• 调取日志、Trace、pprof dump 存证</text>
          <text x="10" y="54" fill="#f5f5f5">• 实施止血手段 (切流、降级、重启)</text>
          <text x="10" y="70" fill="#f5f5f5">• 向 IC 实时汇报技术根因假说与验证结果</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 专注技术硬核攻坚！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#2d3142">职责定位：</text>
        <text x="10" y="196" font-size="7.5" fill="#4f5d75">• 0 外部噪音干扰，心无旁骛排查；</text>
        <text x="10" y="210" font-size="7.5" fill="#4f5d75">• 遵循先止血再修 Bug 的原则；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 快速执行技术预案。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="320" rx="8" fill="#ffffff" stroke="rgba(235,108,54,0.50)" stroke-width="1" />
      <rect width="285" height="34" rx="8" fill="#ffffff" />
      <text x="142" y="22" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#4f5d75" text-anchor="middle">3. 通讯联络官 (Comms Lead)</text>

      <g transform="translate(15, 46)" font-family="'Geist', 'Noto Sans SC', sans-serif">
        <rect width="255" height="150" rx="4" fill="#2d3142" />
        <g font-family="'Geist Mono', monospace" font-size="7.5" fill="#f5f5f5">
          <text x="10" y="18" fill="#f5f5f5">对外信息盾牌与沟通桥梁：</text>

          <text x="10" y="38" fill="#f5f5f5">• 维护 status.example.com 公告页</text>
          <text x="10" y="54" fill="#f5f5f5">• 挡住焦急催促的高管与客服主管</text>
          <text x="10" y="70" fill="#f5f5f5">• 定期广播标准化公关话术与恢复预期</text>

          <text x="10" y="100" fill="#f5f5f5">✓ 保护排查团队不受外部打扰！</text>
        </g>

        <rect y="162" width="255" height="80" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="10" y="180" font-size="8.5" font-weight="700" fill="#4f5d75">架构价值：</text>
        <text x="10" y="196" font-size="7.5" fill="#2d3142">• 维持企业对外部客户的透明与诚信；</text>
        <text x="10" y="210" font-size="7.5" fill="#2d3142">• Google / PagerDuty SRE 经典作战规范；</text>
        <text x="10" y="224" font-size="7.5" fill="#4f5d75">• 工业级事故响应最高境界！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
