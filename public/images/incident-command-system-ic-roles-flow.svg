<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">生产突发事故应急指挥体系 (ICS: Incident Command System)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">指挥官 Incident Commander (拥有绝对裁决权) ｜ 调查排查官 Ops Lead (专注技术排查) ｜ 通讯官 Comms Lead (对齐高管与客服大盘)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 3 Columns (285px each) -->
    <g>
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#eff6ff"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. 事故指挥官 (IC: Commander)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#38bdf8">拥有故障期间最高裁决权：</text>
          
          <text x="10" y="38" fill="#86efac">• 严禁亲自下场写代码调试！</text>
          <text x="10" y="54" fill="#38bdf8">• 负责分配任务、把控全局节奏</text>
          <text x="10" y="70" fill="#34d399">• 拍板关键决策: "立即一键全量回滚！"</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 终结群龙无首与争吵推诿！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">职责定位：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 维持作战室 (War Room) 秩序；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 确保每 15 分钟进行一次进展同步；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 危机处理大脑。</text>
      </g>
    </g>

    <g transform="translate(300, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#f0fdf4"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. 技术排查官 (Ops / Tech Lead)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#4ade80">技术深入止血与排障：</text>
          
          <text x="10" y="38" fill="#86efac">• 调取日志、Trace、pprof dump 存证</text>
          <text x="10" y="54" fill="#38bdf8">• 实施止血手段 (切流、降级、重启)</text>
          <text x="10" y="70" fill="#4ade80">• 向 IC 实时汇报技术根因假说与验证结果</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 专注技术硬核攻坚！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">职责定位：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 0 外部噪音干扰，心无旁骛排查；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 遵循先止血再修 Bug 的原则；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 快速执行技术预案。</text>
      </g>
    </g>

    <g transform="translate(600, 0)">
      <rect width="285" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="285" height="34" rx="8" fill="#fff7ed"/>
      <text x="142" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3. 通讯联络官 (Comms Lead)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="255" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text x="10" y="18" fill="#fb923c">对外信息盾牌与沟通桥梁：</text>
          
          <text x="10" y="38" fill="#fed7aa">• 维护 status.example.com 公告页</text>
          <text x="10" y="54" fill="#38bdf8">• 挡住焦急催促的高管与客服主管</text>
          <text x="10" y="70" fill="#4ade80">• 定期广播标准化公关话术与恢复预期</text>
          
          <text x="10" y="100" fill="#4ade80">✓ 保护排查团队不受外部打扰！</text>
        </g>

        <rect y="162" width="255" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">架构价值：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 维持企业对外部客户的透明与诚信；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• Google / PagerDuty SRE 经典作战规范；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 工业级事故响应最高境界！</text>
      </g>
    </g>
  </g>
</svg>