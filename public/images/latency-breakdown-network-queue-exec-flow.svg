<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="100%" height="100%" role="img" aria-labelledby="latency-breakdown-network-queue-exec-flow-title latency-breakdown-network-queue-exec-flow-desc"><title id="latency-breakdown-network-queue-exec-flow-title">端到端时延归因全景分解：客户端建立 -&gt; 网关排队 -&gt; RPC 调用 -&gt; 数据库事务</title><desc id="latency-breakdown-network-queue-exec-flow-desc">端到端时延归因全景分解：客户端建立 -&gt; 网关排队 -&gt; RPC 调用 -&gt; 数据库事务</desc>
  <defs>
    
    
  </defs>
  <rect width="960" height="480" fill="#f5f5f5" />
  <rect width="960" height="480" fill="url(#dot-grid)" opacity="0" />

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb" />
    <text x="24" y="18" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2d3142">端到端服务时延四段式物理分解 (Latency Attribution Spectrum)</text>
    <text x="24" y="36" font-family="'Geist', 'Noto Sans SC', sans-serif" font-size="12" fill="#4f5d75">1. 传输耗时 (TCP/TLS/RTT: 30ms) ──► 2. 网关排队耗时 (Queue Wait: 15ms) ──► 3. 业务执行耗时 (CPU Exec: 5ms) ──► 4. 下游存储耗时 (DB I/O: 50ms)</text>
  </g>

  <g transform="translate(30, 70)">
    
    <g transform="translate(20, 15)" font-family="'Geist', 'Noto Sans SC', sans-serif">
      <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
      <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">1. 外部接入与网络传输 (Network Transport &amp; TLS Handshake: 30ms)</text>
      <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">DNS 解析 ──► TCP 三次握手 ──► TLS 1.3 密钥协商 ──► 跨国长距离光纤物理 RTT 往返</text>
      <text x="15" y="62" font-size="8" fill="#4f5d75">优化方向: 开启 HTTP/2 长连接复用、CDN 边缘接入与 TLS Session Ticket！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.30)" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">2. 网关排队与调度等待 (Gateway Queue &amp; Worker Starvation: 15ms)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">连接到达系统 ──► 在 TCP accept 队列或线程池工作队列排队等待空闲 Worker 调度</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">优化方向: 扩容工作线程池、改用异步事件驱动 I/O (epoll/Goroutine)！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#2d3142">3. 本地计算与内存处理 (CPU Processing &amp; Serialization: 5ms)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">鉴权解析 JWT ──► JSON 反序列化 ──► 业务状态机逻辑推演 ──► 组装下游 RPC 请求</text>
        <text x="15" y="62" font-size="8" fill="#4f5d75">优化方向: 消除反射、采用 Protocol Buffers / Sonic 极速序列化、避免逃逸分配！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
        <text x="15" y="24" font-size="10" font-weight="700" fill="#4f5d75">4. 下游依赖与持久化 I/O (Downstream RPC &amp; Database Lock: 50ms)</text>
        <text x="15" y="44" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">SQL 磁盘扫描与锁等待 ──► Redis 缓存网络查询 ──► 第三方支付 API 阻塞调用 ──► 占总时延 60%！</text>
        <text x="15" y="62" font-size="8" fill="#2d3142">优化方向: 加覆盖索引、读写分离、并行 RPC 调用与异步消息解耦！</text>
      </g>
    </g>
  </g>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs></svg>
