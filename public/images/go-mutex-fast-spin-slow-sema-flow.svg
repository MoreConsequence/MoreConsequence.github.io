<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go sync.Mutex 互斥锁三级自适应状态机 (Locking State Machine)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">1. 快速路径 (CAS 抢占 state 锁位: 10ns) ──► 2. 自旋路径 (CPU 激进自旋 30 个 cycle) ──► 3. 沉睡路径 (runtime_Semacquire 挂起至等待队列) ──► 饥饿模式防护</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Pipeline Stages (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <rect width="860" height="75" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">1. Fast Path: 单次 CAS 原子抢锁 (atomic.CompareAndSwapInt32: 0-&gt;1)</text>
      <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">若当前 mutex.state == 0 ──► 直接 CAS 标记 mutexLocked 位 ──► 成功直接返回进入临界区</text>
      <text x="15" y="62" font-size="8" fill="#1d4ed8">0 函数调用、0 调度器介入，纳秒级直接直通！</text>

      <g transform="translate(0, 83)">
        <rect width="860" height="75" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">2. Active Spin: CPU 积极自旋抢占 (runtime.procyield(30))</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#15803d">多核多 P 环境且自旋次数 &lt; 4 ──► 执行 PAUSE 指令空转几十纳秒 ──► 赌持锁者马上释放</text>
        <text x="15" y="62" font-size="8" fill="#047857">避免昂贵的 Goroutine 挂起与上下文切换开销！</text>
      </g>

      <g transform="translate(0, 166)">
        <rect width="860" height="75" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">3. Slow Path: 信号量挂起休眠 (runtime_SemacquireMutex)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#9a3412">自旋失败 ──► 将当前 G 挂入信号量 treap 等待树 ──► 调用 goparkunlock 彻底让出 CPU</text>
        <text x="15" y="62" font-size="8" fill="#ea580c">保护系统 CPU 算力不被极端冲突自旋打满！</text>
      </g>

      <g transform="translate(0, 249)">
        <rect width="860" height="75" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">4. 饥饿模式公平防死锁 (Starvation Mode: wait &gt; 1ms)</text>
        <text x="15" y="44" font-family="ui-monospace, monospace" font-size="8" fill="#6b21a8">若等待者排队超 1ms ──► 锁进入饥饿模式 ──► 禁止新来协程自旋抢跑，严格 FIFO 交接锁所有权！</text>
        <text x="15" y="62" font-size="8" fill="#6b21a8">兼顾极致高吞吐与尾部时延 (Tail Latency) 绝对公平！</text>
      </g>
    </g>
  </g>
</svg>