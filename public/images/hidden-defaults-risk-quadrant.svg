<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hidden-defaults-risk-quadrant-title hidden-defaults-risk-quadrant-desc"><title id="hidden-defaults-risk-quadrant-title">四类危险默认值</title><desc id="hidden-defaults-risk-quadrant-desc">按出错到被发现的时间与触发来源分四类默认值：放大类随负载放大、分钟级报警；阈值类被规模穿过、缓慢劣化；继承类随上游变更立刻显形但责任在外；静默类恒定存在从不报错，数月后才以数据或空间问题显形，是最优先要审计的一类。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#2d3142"/></marker>
<marker id="arrow-fwd-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">四类危险默认值：按出错到被发现的时间排序</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">排序轴是发现延迟，不是参数的重要性——被判据筛掉的类别不需要提前管理</text>

<!-- non-focal cells: store treatment -->
<rect x="208" y="148" width="324" height="154" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.28)" stroke-width="1"/>
<rect x="548" y="148" width="324" height="154" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.28)" stroke-width="1"/>
<rect x="208" y="318" width="324" height="154" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.28)" stroke-width="1"/>
<!-- focal cell: silent class -->
<rect x="548" y="318" width="324" height="154" rx="4" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>

<!-- axes: double-ended ink 1 -->
<line x1="188" y1="325" x2="892" y2="325" stroke="#2d3142" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow-fwd-ink)"/>
<line x1="540" y1="492" x2="540" y2="140" stroke="#2d3142" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow-fwd-ink)"/>
<!-- axis labels: jobs-minimal, one word beyond tips -->
<text x="180" y="329" fill="#2d3142" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.18em" text-anchor="end">立即</text>
<text x="900" y="329" fill="#2d3142" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.18em">延迟</text>
<text x="540" y="130" fill="#2d3142" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.18em" text-anchor="middle">随负载</text>
<text x="540" y="508" fill="#2d3142" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.18em" text-anchor="middle">恒定</text>

<!-- Q1 amplification (top-left): immediate, load-driven -->
<text x="224" y="172" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.10em">04 · 随负载 / 立即</text>
<text x="224" y="200" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">放大类</text>
<text x="224" y="224" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">随并发或重试次数放大，雪崩级联超时</text>
<text x="224" y="244" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">例：重试次数、连接池上限、并发信号量</text>
<text x="224" y="270" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">几乎不需提前审计：错了立刻报警</text>

<!-- Q2 inheritance (bottom-left): immediate, external -->
<text x="224" y="342" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.10em">02 · 恒定 / 立即</text>
<text x="224" y="370" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">继承类</text>
<text x="224" y="394" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">上游版本或基线镜像变更，症状立刻可见</text>
<text x="224" y="414" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">例：K8s QoS 默认、云 LB 空闲超时</text>
<text x="224" y="440" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">「我们什么都没改」本身就是线索</text>

<!-- Q3 threshold (top-right): delayed, load-driven -->
<text x="564" y="172" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.10em">03 · 随负载 / 延迟</text>
<text x="564" y="200" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">阈值类</text>
<text x="564" y="224" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">被规模或运行时长穿过，缓慢劣化</text>
<text x="564" y="244" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">例：fd 上限、somaxconn、日志滚动</text>
<text x="564" y="270" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">审计时机跟着容量规划走，不跟发布</text>

<!-- Q4 silent (bottom-right, focal): delayed, constant -->
<text x="564" y="342" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.10em">01 · 恒定 / 延迟</text>
<text x="564" y="370" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">静默类</text>
<text x="564" y="394" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">恒定存在，从不主动报错；数月后</text>
<text x="564" y="410" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">表现为数据或空间问题</text>
<text x="564" y="436" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">例：持久化默认值、autovacuum、备份保留</text>
<text x="564" y="458" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">危险在出错与发现之间隔了几个月</text>

<!-- legend / criterion -->
<line x1="48" y1="508" x2="912" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="48" y="534" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">判据：已被监控覆盖的行为即使错了也不需提前管理；没有被任何指标覆盖的行为，再小也必须显式化</text>

</svg>
