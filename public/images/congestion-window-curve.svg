<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-slate" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect width="960" height="440" fill="url(#dot-grid)"/>

  <!-- Title Block -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#0f172a">TCP 拥塞控制轨迹：丢包驱动（CUBIC/Reno）vs 模型驱动（BBR）</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">传统 AIMD 填满中间路由器 Buffer 诱发丢包锯齿 vs BBR 实时逼近物理 BDP（最大带宽 × 最小时延）</text>
  </g>

  <!-- Main Chart Card (900px wide) -->
  <g transform="translate(30, 75)" filter="url(#card-shadow)">
    <rect width="900" height="335" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Legend -->
    <g transform="translate(450, 16)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#ef4444"/>
      <text x="18" y="10" fill="#334155" font-weight="600">传统 CUBIC / Reno（填满缓冲，锯齿剧烈震荡）</text>

      <rect x="250" y="0" width="12" height="12" rx="2" fill="#10b981"/>
      <text x="268" y="10" fill="#047857" font-weight="700">Google BBR（精准稳态于 BDP，0 缓冲膨胀）</text>
    </g>

    <!-- Coordinate Axes -->
    <g transform="translate(50, 30)">
      <!-- Y Axis -->
      <line x1="40" y1="230" x2="40" y2="10" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
      <text x="35" y="0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="end">拥塞窗口 (cwnd) ↑</text>

      <!-- X Axis -->
      <line x1="40" y1="230" x2="820" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
      <text x="820" y="245" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="end">时间 (Time / RTT) →</text>

      <!-- BDP Target Line (Optimal Bandwidth-Delay Product) -->
      <line x1="40" y1="130" x2="810" y2="130" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="640" y="116" width="165" height="20" rx="3" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="722" y="130" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">最优物理极限 BDP 线</text>

      <!-- Router Buffer Limit (Drop Line) -->
      <line x1="40" y1="50" x2="810" y2="50" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 4"/>
      <rect x="640" y="36" width="165" height="20" rx="3" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="722" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#b91c1c" text-anchor="middle">路由器 Buffer 溢出丢包线</text>

      <!-- Curve 1: CUBIC Sawtooth (Red/Slate) -->
      <path d="M 40 230 
               Q 110 220 160 170 
               T 230 50 
               L 230 140 
               Q 300 130 350 50 
               L 350 140 
               Q 420 130 470 50 
               L 470 140 
               Q 540 130 590 50 
               L 590 140 
               Q 660 130 710 50 
               L 710 140 
               Q 760 130 800 50" 
            fill="none" stroke="#ef4444" stroke-width="2.5"/>

      <!-- Annotations for CUBIC -->
      <text x="140" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#b91c1c">慢启动指数激增</text>
      <text x="240" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#dc2626">💥 丢包减半 (AIMD 锯齿)</text>

      <!-- Curve 2: BBR State Curve (Emerald) -->
      <path d="M 40 230 
               Q 90 200 140 90 
               Q 160 60 180 145 
               L 220 130 
               Q 250 120 280 135 
               Q 320 125 350 130 
               Q 400 135 440 128 
               Q 480 130 520 132 
               Q 580 128 640 130 
               Q 720 132 800 130" 
            fill="none" stroke="#10b981" stroke-width="3"/>

      <!-- Annotations for BBR -->
      <text x="185" y="165" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Drain 缓冲排空</text>
      <text x="440" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">ProbeBW: 贴合 BDP 微调 (0 排队延迟)</text>
    </g>

    <!-- Bottom Insight Bar -->
    <g transform="translate(20, 265)">
      <rect width="860" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="430" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
        💡 <tspan font-weight="700" fill="#0f172a">网络传输本质：</tspan> CUBIC 把“丢包”当作拥塞信号，必然把路由器队列塞满引发 <tspan font-weight="700" fill="#ea580c">Bufferbloat（缓冲膨胀，RTT 飙升 10 倍）</tspan>；
      </text>
      <text x="430" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">
        BBR 独立测量 Bottleneck Bandwidth 与 minRTT，在“不排队”的前提下跑满物理链路带宽！
      </text>
    </g>
  </g>
</svg>
