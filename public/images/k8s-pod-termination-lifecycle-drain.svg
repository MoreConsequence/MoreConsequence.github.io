<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Kubernetes Pod 销毁与流量摘除竞态时序 (K8s Termination Race)</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Endpoint 摘除与 SIGTERM 发送完全并行异步 ──► 若无 preStop sleep 延迟，网关尚未刷新路由而应用已关，导致 502 错误</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Race without preStop -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 无 preStop 钩子：异步网络摘除导致的 502 突发报错</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">K8s 删除 Pod 触发两条完全独立的并行通道：</text>
          
          <text y="36" fill="#38bdf8">通道 A: Kubelet 立即向容器发送 SIGTERM ──► Go 服务瞬间关闭</text>
          <text y="52" fill="#ef4444">通道 B: kube-proxy / Ingress 异步刷新 iptables 路由 (需耗时 2~4 秒！)</text>
          
          <text y="76" fill="#ef4444">💥 恶性时间窗口 (Race Gap):</text>
          <text y="90" fill="#fca5a5">• 在这 3 秒内，Ingress 依然将新用户流量转发给该已关闭的 Pod！</text>
          <text y="104" fill="#ef4444">• 用户浏览器瞬间收到: 502 Bad Gateway / Connection Refused！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产危害：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 每次版本发布滚动更新均会出现微量报错；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 极度影响用户体验与 SLA 达成；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 云原生运维最经典的坑点！</text>
      </g>
    </g>

    <!-- Right: preStop Solution -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ 配置 preStop 钩子：保证绝对 0 报错平滑发布</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">lifecycle:</text>
          <text y="28" fill="#86efac">  preStop:</text>
          <text y="42" fill="#38bdf8">    exec:</text>
          <text y="56" fill="#34d399">      command: ["/bin/sh", "-c", "sleep 5"]</text>
          
          <text y="80" fill="#4ade80">自愈流程：</text>
          <text y="94" fill="#34d399">1. Kubelet 强行等待 5 秒 ──► 给予 Ingress 充裕时间完全剔除 IP</text>
          <text y="108" fill="#34d399">2. 随后才发送 SIGTERM ──► 此时 0 外部流量到达！</text>
          <text y="122" fill="#4ade80">✓ 线上滚动更新实现绝对 100% 0 报错平滑发布！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 终结 K8s 滚动发布时的 502/504 毛刺；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 生产微服务容器化发布的金标准规范；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代化 DevOps/SRE 终极修养！</text>
      </g>
    </g>
  </g>
</svg>