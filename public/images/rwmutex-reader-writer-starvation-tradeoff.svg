<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Go sync.RWMutex 写者优先与 readerCount 负数反转机理</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Lock() 写锁获取 ──► 将 readerCount 减去 rwmutexMaxReaders (变负数) ──► 拦截后续所有 RLock() 读锁 ──► 防范写者永久饿死</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Write Lock Logic -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fff7ed"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">1. 写锁获取：readerCount 负数宣告 (Lock)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#fb923c">1. w.Lock(): 获取内部互斥锁，排斥其他写者</text>
          <text y="28" fill="#fed7aa">2. r = atomic.AddInt32(&amp;rw.readerCount, -rwmutexMaxReaders)</text>
          
          <text y="50" fill="#38bdf8">数学级精妙状态反转：</text>
          <text y="64" fill="#cbd5e1">• readerCount 瞬间变为一个极大的负数！</text>
          <text y="78" fill="#34d399">• 若 r != 0 (仍有存量读未释放) ──► 写者在 writerSem 沉睡</text>
          <text y="92" fill="#4ade80">• 最后一个存量读释放时 (RUnlock) 自动唤醒写者！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#c2410c">机制要点：</text>
        <text x="10" y="34" font-size="7.5" fill="#9a3412">• 仅需 1 条原子加法指令即可向全系统宣告写意向；</text>
        <text x="10" y="48" font-size="7.5" fill="#9a3412">• 优雅记录未退出的存量读计数；</text>
        <text x="10" y="62" font-size="7.5" fill="#ea580c">• 打造写优先保障。</text>
      </g>
    </g>

    <!-- Right: Read Lock Interception -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#eff6ff"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. 读锁被拦截：排入等待队列 (RLock)</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#38bdf8">新读请求调用: rw.RLock()</text>
          
          <text y="36" fill="#86efac">判定逻辑：</text>
          <text y="50" fill="#38bdf8">1. atomic.AddInt32(&amp;rw.readerCount, 1)</text>
          <text y="64" fill="#f87171">2. 发现结果仍为负数 (&lt; 0)！</text>
          <text y="78" fill="#fca5a5">3. 明确得知有写者正在排队或持锁！</text>
          <text y="92" fill="#ef4444">4. 新读协程主动进入 readerSem 信号量休眠排队！</text>
          
          <text y="116" fill="#4ade80">✓ 杜绝海量读并发将写者永久饿死！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e40af">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#1d4ed8">• 完美解决读者贪婪导致的写饥饿死锁；</text>
        <text x="10" y="48" font-size="7.5" fill="#1d4ed8">• 支撑 95% 读 5% 写的超高并发场景；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• Go 标准库并发控制的巅峰设计！</text>
      </g>
    </g>
  </g>
</svg>