<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <pattern id="sec-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr-red-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-green-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
    <filter id="sec-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#sec-grid)"/>

  <!-- Eyebrow & Title -->
  <text x="40" y="32" fill="#2563eb" font-size="10" font-weight="600" class="mono" letter-spacing="0.14em">EDGE SECURITY · MULTI-TIER DDOS MITIGATION PIPELINE</text>
  <text x="40" y="52" fill="#0f172a" font-size="16" font-weight="700">边缘多层级 DDoS 分布式清洗与 eBPF/XDP 线速防御架构</text>

  <!-- ================= TOP: 4-TIER DEFENSE PIPELINE (x: 40 ~ 920, w: 880) ================= -->
  
  <!-- Tier 1: 10 Tbps Attack Ingress [x: 40 ~ 220, w: 180] -->
  <g transform="translate(40, 75)" filter="url(#sec-shadow)">
    <rect width="180" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="5" rx="2" fill="#dc2626"/>
    <text x="14" y="24" fill="#991b1b" font-size="9" font-weight="700" class="mono">INGRESS · 10 TBPS FLOOD</text>
    <text x="14" y="44" fill="#0f172a" font-size="13" font-weight="700">海量洪峰攻击入站</text>
    <line x1="14" y1="56" x2="166" y2="56" stroke="#fecaca" stroke-width="1"/>
    <text x="14" y="74" fill="#991b1b" font-size="10.5">SYN 洪泛 / UDP 反射</text>
    <text x="14" y="94" fill="#991b1b" font-size="10.5">DNS / NTP 放大攻击</text>
    <rect x="14" y="104" width="152" height="26" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="90" y="121" fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle">直连源站必遭秒杀 💥</text>
  </g>

  <!-- Arrow 1: Anycast Absorption [x: 220 -> 255] -->
  <path d="M 220,150 H 252" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red-s)"/>

  <!-- Tier 2: Anycast Spatial Dispersion [x: 255 ~ 445, w: 190] -->
  <g transform="translate(255, 75)" filter="url(#sec-shadow)">
    <rect width="190" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="0" y="0" width="190" height="5" rx="2" fill="#2563eb"/>
    <text x="14" y="24" fill="#1d4ed8" font-size="9" font-weight="700" class="mono">TIER 1 · ANYCAST DISPERSION</text>
    <text x="14" y="44" fill="#0f172a" font-size="13" font-weight="700">Anycast 空间稀释</text>
    <line x1="14" y1="56" x2="176" y2="56" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="74" fill="#475569" font-size="10.5">全球 300+ PoP 共同宣告</text>
    <text x="14" y="94" fill="#475569" font-size="10.5">流量打散: <tspan font-weight="700" fill="#2563eb">每机房仅 ~30G</tspan></text>
    <rect x="14" y="104" width="162" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="95" y="121" fill="#1d4ed8" font-size="10" font-weight="700" text-anchor="middle">化整为零 · 本地消化</text>
  </g>

  <!-- Arrow 2: To XDP Filter [x: 445 -> 480] -->
  <path d="M 445,150 H 477" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-s)"/>

  <!-- Tier 3: eBPF/XDP Line-Rate Drop [x: 480 ~ 680, w: 200] -->
  <g transform="translate(480, 75)" filter="url(#sec-shadow)">
    <rect width="200" height="150" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="5" rx="2" fill="#ea580c"/>
    <text x="14" y="24" fill="#c2410c" font-size="9" font-weight="700" class="mono">TIER 2 · eBPF / XDP ENGINE</text>
    <text x="14" y="44" fill="#0f172a" font-size="13" font-weight="700">网卡驱动层 XDP 丢包</text>
    <line x1="14" y1="56" x2="186" y2="56" stroke="#fed7aa" stroke-width="1"/>
    <text x="14" y="74" fill="#9a3412" font-size="10.5">网卡 RingBuffer 零拷贝拦截</text>
    <text x="14" y="94" fill="#9a3412" font-size="10.5">时延: <tspan font-weight="700">&lt; 10ns</tspan> / SYN Cookie</text>
    <rect x="14" y="104" width="172" height="26" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="0.8"/>
    <text x="100" y="121" fill="#ea580c" font-size="10" font-weight="700" text-anchor="middle">清洗 99% 四层攻击流量</text>
  </g>

  <!-- Arrow 3: To L7 WAF [x: 680 -> 715] -->
  <path d="M 680,150 H 712" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-green-s)"/>

  <!-- Tier 4: Layer 7 WAF & Clean Traffic [x: 715 ~ 920, w: 205] -->
  <g transform="translate(715, 75)" filter="url(#sec-shadow)">
    <rect width="205" height="150" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="205" height="5" rx="2" fill="#059669"/>
    <text x="14" y="24" fill="#065f46" font-size="9" font-weight="700" class="mono">TIER 3 · L7 WAF &amp; CLEAN ORIGIN</text>
    <text x="14" y="44" fill="#0f172a" font-size="13" font-weight="700">七层 WAF 与纯净回源</text>
    <line x1="14" y1="56" x2="191" y2="56" stroke="#bbf7d0" stroke-width="1"/>
    <text x="14" y="74" fill="#065f46" font-size="10.5">JA4 指纹识别 + 令牌桶限流</text>
    <text x="14" y="94" fill="#065f46" font-size="10.5">回源流量: <tspan font-weight="700">50 Mbps 纯净业务流</tspan></text>
    <rect x="14" y="104" width="177" height="26" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1"/>
    <text x="102" y="121" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">源站 100% 稳定运行 ✓</text>
  </g>


  <!-- ================= BOTTOM: DEFENSE MECHANISM MATRIX (x: 40, y: 245, w: 880, h: 185) ================= -->
  <g transform="translate(40, 245)">
    <rect width="880" height="185" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="12" width="240" height="22" rx="4" fill="#0f172a"/>
    <text x="136" y="27" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">边缘安全三大防线核心原理与吞吐能力</text>

    <!-- Pillar 1 [x: 16 ~ 290, w: 274] -->
    <g transform="translate(16, 44)">
      <rect width="274" height="125" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="24" fill="#1e40af" font-size="11" font-weight="700">1. Anycast 空间稀释 (BGP)</text>
      <line x1="12" y1="34" x2="262" y2="34" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="54" fill="#475569" font-size="10">利用全球 300+ 节点对等互联；</text>
      <text x="12" y="74" fill="#475569" font-size="10">将 10 Tbps 巨型洪峰吸附至各大洲；</text>
      <text x="12" y="94" fill="#1e40af" font-size="10" font-weight="700">任何单机房不发生物理链路拥塞。</text>
    </g>

    <!-- Pillar 2 [x: 303 ~ 577, w: 274] -->
    <g transform="translate(303, 44)">
      <rect width="274" height="125" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="24" fill="#c2410c" font-size="11" font-weight="700">2. eBPF/XDP 网卡级拦截</text>
      <line x1="12" y1="34" x2="262" y2="34" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="54" fill="#9a3412" font-size="10">绕过内核 TCP 协议栈（SKB 分配）；</text>
      <text x="12" y="74" fill="#9a3412" font-size="10">在网卡驱动层直接执行 XDP_DROP；</text>
      <text x="12" y="94" fill="#c2410c" font-size="10" font-weight="700">单机线速丢弃 4000 万 PPS 恶意包。</text>
    </g>

    <!-- Pillar 3 [x: 590 ~ 864, w: 274] -->
    <g transform="translate(590, 44)">
      <rect width="274" height="125" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="24" fill="#065f46" font-size="11" font-weight="700">3. 七层 WAF 与 TLS 卸载</text>
      <line x1="12" y1="34" x2="262" y2="34" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="54" fill="#065f46" font-size="10">JA4 客户端指纹精准阻断爬虫；</text>
      <text x="12" y="74" fill="#065f46" font-size="10">ACME 自动轮换 TLS 证书；</text>
      <text x="12" y="94" fill="#065f46" font-size="10" font-weight="700">TLS 1.3 0-RTT 防重放单向时间窗口。</text>
    </g>
  </g>
</svg>
