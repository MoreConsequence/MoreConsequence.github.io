<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="6" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">协议开销战争：四大传输协议在极限测速场景下的性能对比</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Raw TCP (0 额外协议头) ｜ WebSocket (2~10 字节轻量帧) ｜ HTTP/2 (流控与单连接队头阻塞) ｜ HTTP/3 QUIC (0-RTT 与 UDP 内核瓶颈)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 4 Columns (210px each) -->
    <!-- Col 1 -->
    <g>
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#eff6ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">1. Raw TCP / Socket</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="16" fill="#38bdf8">• 协议层开销: 0% (纯净)</text>
          <text x="8" y="30" fill="#93c5fd">• 内核开销: 极低 (DMA 直达)</text>
          <text x="8" y="44" fill="#34d399">• 吞吐上限: 9.92 Gbps (10G)</text>
          <text x="8" y="60" fill="#fbbf24">⚠️ 缺点: 无法穿透 Web 浏览器</text>
          <text x="8" y="74" fill="#fbbf24">  必须依赖原生 App / CLI！</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="18" font-size="8" font-weight="700" fill="#1e40af">适用场景：</text>
        <text x="8" y="34" font-size="7" fill="#1d4ed8">• iPerf3 局域网基准；</text>
        <text x="8" y="48" font-size="7.5" fill="#1d4ed8">• 运营商核心网硬件压测；</text>
        <text x="8" y="62" font-size="7" fill="#047857">• 传输效率绝对天花板。</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#f0fdf4"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">2. WebSocket</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="16" fill="#4ade80">• 协议层开销: 2~10 字节/帧</text>
          <text x="8" y="30" fill="#86efac">• 全双工持续二进制流</text>
          <text x="8" y="44" fill="#34d399">• 吞吐上限: ~9.5 Gbps</text>
          <text x="8" y="60" fill="#4ade80">✓ 浏览器原生全兼容</text>
          <text x="8" y="74" fill="#4ade80">✓ 无频繁 HTTP Header 开销</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="8" y="18" font-size="8" font-weight="700" fill="#166534">适用场景：</text>
        <text x="8" y="34" font-size="7" fill="#15803d">• Speedtest.net 网页端；</text>
        <text x="8" y="48" font-size="7" fill="#15803d">• 现代高性能 Web 测速；</text>
        <text x="8" y="62" font-size="7" fill="#047857">• 兼具兼容性与高吞吐。</text>
      </g>
    </g>

    <!-- Col 3 -->
    <g transform="translate(460, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#fff7ed"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">3. HTTP/2 (Multiplex)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="16" fill="#fb923c">• 单 TCP 连接多路复用</text>
          <text x="8" y="30" fill="#fed7aa">• 协议开销: 9 字节 Frame Header</text>
          <text x="8" y="44" fill="#f87171">• 致命缺陷: TCP 级队头阻塞</text>
          <text x="8" y="60" fill="#f87171">• 吞吐上限: ~6 Gbps</text>
          <text x="8" y="74" fill="#fed7aa">• 单连接流控限制并发吞吐</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="8" y="18" font-size="8" font-weight="700" fill="#c2410c">适用场景：</text>
        <text x="8" y="34" font-size="7" fill="#9a3412">• 普通 Web 网页资源加速；</text>
        <text x="8" y="48" font-size="7" fill="#9a3412">• 不适合作为万兆纯吞吐测速；</text>
        <text x="8" y="62" font-size="7" fill="#ea580c">• 丢包时吞吐断崖式下跌。</text>
      </g>
    </g>

    <!-- Col 4 -->
    <g transform="translate(690, 0)">
      <rect width="210" height="385" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
      <rect width="210" height="34" rx="8" fill="#faf5ff"/>
      <text x="105" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">4. HTTP/3 (QUIC / UDP)</text>

      <g transform="translate(12, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="186" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7" fill="#f8fafc">
          <text x="8" y="16" fill="#d8b4fe">• 基于 UDP 彻底解绑队头阻塞</text>
          <text x="8" y="30" fill="#e9d5ff">• 0-RTT 极速建连</text>
          <text x="8" y="44" fill="#f87171">• 致命瓶颈: 用户态 UDP 开销</text>
          <text x="8" y="60" fill="#f87171">• CPU 占满时吞吐仅 3~4 Gbps</text>
          <text x="8" y="74" fill="#e9d5ff">• 依赖 sendmmsg / GSO 优化</text>
        </g>

        <rect y="162" width="186" height="96" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="8" y="18" font-size="8" font-weight="700" fill="#7e22ce">适用场景：</text>
        <text x="8" y="34" font-size="7" fill="#6b21a8">• 弱网高丢包移动环境；</text>
        <text x="8" y="48" font-size="7" fill="#6b21a8">• 跨国高时延网络质量测量；</text>
        <text x="8" y="62" font-size="7" fill="#6b21a8">• 未来测速前沿演进方向。</text>
      </g>
    </g>
  </g>
</svg>