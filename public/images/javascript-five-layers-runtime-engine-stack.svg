<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">JavaScript 现代生态五层物理分层栈架构</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">ECMA 规范层 ──► 虚拟机引擎层 (V8/JSC) ──► 宿主运行时层 (Browser/Node/Bun) ──► 全栈框架层 ──► 编译打包工具链</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <rect width="900" height="385" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 5 Horizontal Stack Layers (860px) -->
    <g transform="translate(20, 15)" font-family="ui-sans-serif, system-ui, sans-serif">
      <!-- Layer 5: Tooling -->
      <rect width="860" height="56" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
      <text x="15" y="24" font-size="10" font-weight="700" fill="#7e22ce">Layer 5: 工程打包与编译工具链 (Toolchain &amp; Bundlers)</text>
      <text x="15" y="42" font-size="8" fill="#6b21a8">Vite / Turbopack / ESBuild / Rollup / SWC / TypeScript 编译器 ──► 代码转译、AST 摇树与模块打包</text>

      <!-- Layer 4: Frameworks -->
      <g transform="translate(0, 64)">
        <rect width="860" height="56" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#1e40af">Layer 4: 应用框架与 UI 抽象层 (Application Frameworks)</text>
        <text x="15" y="42" font-size="8" fill="#1d4ed8">Next.js / Nuxt / React / Vue / SolidJS / Svelte ──► 状态驱动、组件封装、SSR 服务端渲染与路由系统</text>
      </g>

      <!-- Layer 3: Host Runtimes -->
      <g transform="translate(0, 128)">
        <rect width="860" height="56" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#166534">Layer 3: 宿主运行时环境 (Host Runtimes &amp; I/O Subsystem)</text>
        <text x="15" y="42" font-size="8" fill="#15803d">Chromium / Safari WebKit ｜ Node.js (libuv) ｜ Deno ｜ Bun (Zig 替代) ──► 提供 DOM、网络、文件系统与事件循环</text>
      </g>

      <!-- Layer 2: JS Engines -->
      <g transform="translate(0, 192)">
        <rect width="860" height="56" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#c2410c">Layer 2: 虚拟机引擎层 (JavaScript Virtual Machine Engines)</text>
        <text x="15" y="42" font-size="8" fill="#9a3412">Google V8 (Ignition+TurboFan) ｜ Apple JavaScriptCore (JSC) ｜ Mozilla SpiderMonkey ｜ Hermes ──► 字节码解释与 JIT 编译</text>
      </g>

      <!-- Layer 1: ECMA Specs -->
      <g transform="translate(0, 256)">
        <rect width="860" height="56" rx="4" fill="#0f172a"/>
        <text x="15" y="24" font-size="10" font-weight="700" fill="#38bdf8">Layer 1: 核心语言规范与抽象机模型 (ECMAScript Specifications)</text>
        <text x="15" y="42" font-size="8" fill="#94a3b8">TC39 ECMAScript 标准 ｜ 内存模型与垃圾回收 (GC) ｜ 词法作用域与执行上下文 ｜ Promise / Async 规范标准</text>
      </g>
    </g>
  </g>
</svg>