<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <rect width="960" height="480" fill="url(#dot-grid)"/>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="14" height="24" rx="3" fill="#2563eb"/>
    <text x="24" y="18" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">大模型 Token 经济学与 Prompt Caching 降本模型</text>
    <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">全量 100K 上下文重复计算 ($0.30 / 请求) vs 前缀 KV Cache 命中 ($0.03 / 请求: 降本 90% + 首字时延缩短 80%)</text>
  </g>

  <g transform="translate(30, 70)" filter="url(#card-shadow)">
    <!-- 2 Panes (435px each) -->
    <!-- Left: Uncached -->
    <g>
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#fef2f2"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">❌ 传统无缓存模式：算力与资金重复空耗</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#f87171">多轮对话 / Agent 运行 10 轮迭代：</text>
          <text y="28" fill="#ef4444">• 每轮均携带 50,000 Token 的系统提示与知识库</text>
          <text y="44" fill="#ef4444">• GPU 必须重复计算 10 次前向 Attention 矩阵！</text>
          <text y="60" fill="#fca5a5">• 累计产生 500,000 Input Tokens 计费账单</text>
          <text y="76" fill="#ef4444">• TTFT 首字延迟高达 4.5 秒！</text>
          
          <text y="102" fill="#f87171">🔴 商业成本迅速失控，利润被大模型 Token 吞噬！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">生产痛点：</text>
        <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• 长上下文应用商业化落地最大拦路虎；</text>
        <text x="10" y="48" font-size="7.5" fill="#7f1d1d">• 用户交互等待极度缓慢；</text>
        <text x="10" y="62" font-size="7.5" font-weight="700" fill="#dc2626">• 必须重构 Prompt 结构！</text>
      </g>
    </g>

    <!-- Right: Prompt Cache -->
    <g transform="translate(465, 0)">
      <rect width="435" height="385" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <rect width="435" height="34" rx="8" fill="#f0fdf4"/>
      <text x="217" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓ Prompt Caching：KV 缓存复用降本 90%</text>

      <g transform="translate(15, 46)" font-family="ui-sans-serif, system-ui, sans-serif">
        <rect width="405" height="150" rx="4" fill="#0f172a"/>
        <g font-family="ui-monospace, monospace" font-size="7.5" fill="#f8fafc">
          <text y="14" fill="#4ade80">结构化前缀设计 (Stable Prefix Strategy):</text>
          
          <text y="36" fill="#86efac">1. 将不变的 System/Tools/Docs 严格置于最前缀</text>
          <text y="50" fill="#38bdf8">2. 首次写入 Cache ──► 随后 9 轮全部 100% 命中 Cache！</text>
          <text y="64" fill="#34d399">3. 缓存读取费率仅为原价的 10% (如 Claude/DeepSeek)</text>
          <text y="78" fill="#4ade80">4. TTFT 暴降至 400ms (提速 10 倍)！</text>
          
          <text y="104" fill="#4ade80">✓ 总成本节省 85%，响应丝滑如飞！</text>
        </g>

        <rect y="162" width="405" height="96" rx="4" fill="#f0fdf4" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">架构收益：</text>
        <text x="10" y="34" font-size="7.5" fill="#15803d">• 支撑 100 轮复杂 Agent 自主循环；</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• 商业毛利率实现从负到正的绝地翻盘；</text>
        <text x="10" y="62" font-size="7.5" fill="#047857">• 现代 AI 架构师必备经济学修养！</text>
      </g>
    </g>
  </g>
</svg>