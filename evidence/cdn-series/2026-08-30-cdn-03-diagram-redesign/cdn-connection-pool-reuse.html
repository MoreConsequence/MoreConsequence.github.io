<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cdn-connection-pool-reuse</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="cdn-pool-title cdn-pool-desc">
  <title id="cdn-pool-title">边缘动态请求终结与预热长连接池复用拓扑</title>
  <desc id="cdn-pool-desc">架构拓扑图展示客户端在边缘完成 4ms 本地握手，并通过骨干网 HTTP/2 预热多路复用连接池实现 0 握手零延迟回源。</desc>
  <defs>
    <marker id="cdn-pool-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="cdn-pool-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">DYNAMIC ACCELERATION · PRE-WARMED CONNECTION POOL</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">边缘动态请求终结与预热长连接池复用拓扑</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">Local Leg 城域 4ms 终结消灭跨洋协议握手，Backhaul Leg 预热多路复用连接池实现 0-RTT 极速回源</text>

  <!-- Actor 1: Client (x=40..250, w=210, h=330) -->
  <g transform="translate(40, 140)">
    <rect width="210" height="330" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="14" width="64" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="46" y="27" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CLIENT</text>
    <text x="88" y="28" fill="#141413" font-size="13" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">北京客户端终端</text>

    <rect x="14" y="48" width="182" height="74" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="70" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">动态不可缓存请求</text>
    <text x="24" y="90" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">POST /trade/checkout</text>
    <text x="24" y="108" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Cache: no-store, private</text>

    <rect x="14" y="132" width="182" height="74" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="154" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">本地接入网络</text>
    <text x="24" y="174" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">AS4837 (中国联通骨干)</text>
    <text x="24" y="192" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">城域光纤 RTT ≤ 4ms</text>

    <rect x="14" y="216" width="182" height="96" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="238" fill="#e85d3f" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">加速收益对比</text>
    <text x="24" y="258" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">公网直连 TTFB: 560ms</text>
    <text x="24" y="278" fill="#e85d3f" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">DCA 加速 TTFB: 187ms</text>
    <text x="24" y="296" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">时延降低 67%</text>
  </g>

  <!-- Middle Arrow Flow 1: Client <-> Edge (x=250..340) -->
  <line x1="250" y1="200" x2="332" y2="200" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#cdn-pool-arr)"/>
  <rect x="254" y="188" width="76" height="14" rx="2" fill="#f5f4ed"/>
  <text x="292" y="198" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">1. 本地握手 4ms</text>

  <line x1="250" y1="240" x2="332" y2="240" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#cdn-pool-arr-accent)"/>
  <rect x="254" y="228" width="76" height="14" rx="2" fill="#f5f4ed"/>
  <text x="292" y="238" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">2. POST 载荷</text>

  <line x1="332" y1="360" x2="258" y2="360" stroke="#e85d3f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#cdn-pool-arr-accent)"/>
  <rect x="254" y="348" width="76" height="14" rx="2" fill="#f5f4ed"/>
  <text x="292" y="358" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">5. 首包直出</text>

  <!-- Actor 2: Edge PEK-PoP Proxy & Pool Hub (x=340..620, w=280, h=330) - Focal Actor -->
  <g transform="translate(340, 140)">
    <rect width="280" height="330" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="14" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="27" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">EDGE HUB</text>
    <text x="100" y="28" fill="#141413" font-size="13" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">PEK-PoP 代理连接池枢纽</text>

    <!-- Local Leg Sub-card -->
    <rect x="14" y="48" width="252" height="74" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="70" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Local Leg: 边缘协议终结</text>
    <text x="26" y="90" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">TCP 握手 4ms + TLS 1.3 协商 4ms</text>
    <text x="26" y="108" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">第 8ms 即向客户端发送 ACK 开始传输</text>

    <!-- Backhaul Pool Sub-card -->
    <rect x="14" y="132" width="252" height="180" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="26" y="154" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Backhaul Leg: 预热长连接池</text>
    
    <!-- Pipe 1 -->
    <rect x="26" y="164" width="228" height="24" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="36" y="180" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">H2 Connection #1 · Keep-Alive</text>
    <text x="244" y="180" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">Stream ID: 101</text>

    <!-- Pipe 2 -->
    <rect x="26" y="194" width="228" height="24" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="36" y="210" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">H2 Connection #2 · Multiplexed</text>
    <text x="244" y="210" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">Idle (Ready)</text>

    <!-- Pipe 3 -->
    <rect x="26" y="224" width="228" height="24" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="36" y="240" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">H3/QUIC Pool · BBR Pacing</text>
    <text x="244" y="240" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0-Loss Tunnel</text>

    <text x="26" y="272" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">全双工多路复用 · 0 握手直连回源</text>
    <text x="26" y="292" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">回源建连开销从 360ms 彻底归零</text>
  </g>

  <!-- Right Arrow Flow 2: Edge <-> Origin (x=620..710) -->
  <line x1="620" y1="200" x2="702" y2="200" stroke="#e85d3f" stroke-width="1.5" marker-end="url(#cdn-pool-arr-accent)"/>
  <rect x="626" y="188" width="76" height="14" rx="2" fill="#f5f4ed"/>
  <text x="664" y="198" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">3. 0-RTT 回源</text>

  <line x1="702" y1="300" x2="628" y2="300" stroke="#6b6a64" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#cdn-pool-arr)"/>
  <rect x="626" y="288" width="76" height="14" rx="2" fill="#f5f4ed"/>
  <text x="664" y="298" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">4. 动态响应</text>

  <!-- Actor 3: Origin Backend (x=710..920, w=210, h=330) -->
  <g transform="translate(710, 140)">
    <rect width="210" height="330" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="14" width="64" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="46" y="27" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">ORIGIN</text>
    <text x="88" y="28" fill="#141413" font-size="13" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">美东源站集群</text>

    <rect x="14" y="48" width="182" height="74" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="70" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">数据中心位置</text>
    <text x="24" y="90" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">AWS us-east-1 (IAD)</text>
    <text x="24" y="108" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">弗吉尼亚 Ashburn 机房</text>

    <rect x="14" y="132" width="182" height="74" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="154" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">后端计算处理</text>
    <text x="24" y="174" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">T_calc = 20ms</text>
    <text x="24" y="192" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">数据库事务 + 微服务编排</text>

    <rect x="14" y="216" width="182" height="96" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="238" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">骨干回传时延</text>
    <text x="24" y="258" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">RTT_backhaul = 155ms</text>
    <text x="24" y="278" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">跨洋海底光缆私网专线</text>
    <text x="24" y="296" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">BBR Pacing 拥塞保护</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="562" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="550" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">终端 / 源站基础设施</text>
  <rect x="300" y="550" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="320" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">边缘预热连接池核心枢纽</text>
  <line x1="510" y1="556" x2="534" y2="556" stroke="#e85d3f" stroke-width="1.5" marker-end="url(#cdn-pool-arr-accent)"/>
  <text x="542" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">0-RTT 多路复用回源流</text>
</svg>
</main>
</body>
</html>
