<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cdn-dynamic-api-waterfall-comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="cdn-waterfall-title cdn-waterfall-desc">
  <title id="cdn-waterfall-title">直连跨洋源站 vs CDN 边缘动态加速时序瀑布对比</title>
  <desc id="cdn-waterfall-desc">时序对比图展示公网直连 3 次跨洋往返 560ms TTFB 与 CDN 边缘终结加预热长连接池 187ms TTFB 的时延消除机理。</desc>
  <defs>
    <marker id="cdn-wf-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="cdn-wf-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">LATENCY ATTRIBUTION · TIMELINE WATERFALL</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">直连跨洋源站 vs CDN 动态加速时序瀑布对比</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">单播直连承受 3 次跨洋 RTT 累积 560ms TTFB；边缘终结 + 预热连接池将首包时延压制至 187ms（暴降 67%）</text>

  <!-- Left Track: Mode A Direct Unicast (x=40..460, w=420) -->
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="14" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="27" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">MODE A</text>
    <text x="100" y="28" fill="#141413" font-size="13" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">公网直连跨洋源站 (TTFB = 560ms)</text>

    <!-- Phase 1: TCP Handshake (180ms) -->
    <rect x="14" y="46" width="392" height="64" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="68" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 跨洋 TCP 三次握手 (1.0 RTT)</text>
    <text x="26" y="86" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">SYN ➔ SYN-ACK ➔ ACK (15,904 km 海缆往返)</text>
    <text x="394" y="86" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">耗时: 180ms</text>

    <!-- Phase 2: TLS 1.3 Handshake (180ms) -->
    <rect x="14" y="118" width="392" height="64" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="140" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 跨洋 TLS 1.3 密钥协商 (1.0 RTT)</text>
    <text x="26" y="158" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">ClientHello ➔ ServerHello / Finished</text>
    <text x="394" y="158" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">耗时: 180ms</text>

    <!-- Phase 3: HTTP Request / Response (180ms + 20ms) -->
    <rect x="14" y="190" width="392" height="74" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="212" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">3. HTTP POST 传输与计算 (1.0 RTT + T_calc)</text>
    <text x="26" y="230" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">POST Payload ➔ DB 事务计算 ➔ 响应首包</text>
    <text x="394" y="230" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">耗时: 200ms</text>
    <text x="26" y="250" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">T_calc = 20ms 源站微服务处理耗时</text>

    <!-- Total Metric -->
    <rect x="14" y="272" width="392" height="88" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="296" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">端到端物理总耗时 (TTFB)</text>
    <text x="26" y="318" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">TTFB = 180 + 180 + 180 + 20 = 560ms</text>
    <text x="26" y="340" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">冷启动必须经历 3 次跨洋往返，延迟极度敏感</text>
  </g>

  <!-- Right Track: Mode B CDN Dynamic Acceleration (x=500..920, w=420) - Focal Track -->
  <g transform="translate(500, 136)">
    <rect width="420" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="14" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="27" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">MODE B</text>
    <text x="100" y="28" fill="#141413" font-size="13" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">CDN 动态内容加速 (TTFB = 187ms)</text>

    <!-- Phase 1: Local Leg Handshake (8ms) -->
    <rect x="14" y="46" width="392" height="64" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="26" y="68" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. Local Leg: 城域边缘极速终结</text>
    <text x="26" y="86" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace">TCP 握手 4ms + TLS 1.3 协商 4ms (北京 PEK-PoP)</text>
    <text x="394" y="86" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">耗时: 8ms</text>

    <!-- Phase 2: Local Payload Send (4ms) -->
    <rect x="14" y="118" width="392" height="64" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="140" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. Local Leg: 推送 POST 业务载荷</text>
    <text x="26" y="158" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">客户端直接向边缘代理推送请求数据</text>
    <text x="394" y="158" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">耗时: 4ms</text>

    <!-- Phase 3: Pre-warmed Zero-Handshake Forwarding (155ms + 20ms) -->
    <rect x="14" y="190" width="392" height="74" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="26" y="212" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">3. Backhaul Leg: 预热连接池 0-RTT 转发</text>
    <text x="26" y="230" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace">HTTP/2 多路复用直通 + BBR Pacing (155ms) + T_calc (20ms)</text>
    <text x="394" y="230" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">耗时: 175ms</text>
    <text x="26" y="250" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">回源建连握手耗时严格为 0ms</text>

    <!-- Total Metric -->
    <rect x="14" y="272" width="392" height="88" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1.2"/>
    <text x="26" y="296" fill="#e85d3f" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">端到端加速总耗时 (TTFB)</text>
    <text x="26" y="318" fill="#e85d3f" font-size="10" font-family="'Geist Mono', monospace" font-weight="700">TTFB = 8 + 4 + 155 + 20 = 187ms</text>
    <text x="26" y="340" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">时延从 560ms 暴降至 187ms，性能提升 67%！</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="562" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="550" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">传统直连跨洋步骤</text>
  <rect x="300" y="550" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="320" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">CDN 动态加速优化步骤</text>
  <line x1="510" y1="556" x2="534" y2="556" stroke="#e85d3f" stroke-width="1.5" marker-end="url(#cdn-wf-arr-accent)"/>
  <text x="542" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">时延缩减 67%</text>
</svg>
</main>
</body>
</html>
