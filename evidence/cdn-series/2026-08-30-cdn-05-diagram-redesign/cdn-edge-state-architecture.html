<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cdn-edge-state-architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="cdn-state-title cdn-state-desc">
  <title id="cdn-state-title">边缘分布式状态编排：最终一致性 KV vs 区域强一致 Raft 体系</title>
  <desc id="cdn-state-desc">架构拓扑图对比全球边缘只读 KV 的 AP 最终一致性本地读取，与区域 Raft 事务共识的 CP 强一致性 Durable Objects 状态机。</desc>
  <defs>
    <marker id="cdn-state-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="cdn-state-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">EDGE STATE ARCHITECTURE · KV AP VS RAFT CP</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">边缘状态编排：最终一致性 KV vs 区域强一致 Raft</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">只读 Edge KV 支撑 300+ PoP 微秒级就近读；区域 Raft 事务（Durable Objects）支撑零超卖强一致写</text>

  <!-- Left Column: Mode A Edge KV (x=40..460, w=420) -->
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="14" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="27" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">MODE A</text>
    <text x="100" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">边缘只读分布式 KV (AP 模型 · 最终一致性)</text>

    <!-- Read Path -->
    <rect x="14" y="46" width="392" height="64" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="68" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 全球边缘本地极速读取 (Read-at-Edge)</text>
    <text x="26" y="86" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">全量数据广播缓存在 300+ PoP 内存中</text>
    <text x="394" y="86" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">读时延: ≤ 100µs</text>

    <!-- Write Path -->
    <rect x="14" y="118" width="392" height="64" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="140" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 异步权威写入与 Gossip 广播</text>
    <text x="26" y="158" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">写入主节点 ➔ 全球后台异步推送同步</text>
    <text x="394" y="158" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">收敛耗时: 1~3s</text>

    <!-- Business Scenarios -->
    <rect x="14" y="190" width="392" height="64" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="212" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">适用业务形态 (99.9% 读 / 0.1% 写)</text>
    <text x="26" y="230" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 功能开关 (Feature Flags) · 灰度路由规则</text>
    <text x="26" y="244" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 商品类目字典 · 用户黑白名单 · 域名 SSL 证书配置</text>

    <!-- Total Metric -->
    <rect x="14" y="262" width="392" height="98" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="286" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">架构特征与物理权衡</text>
    <text x="26" y="306" fill="#6b6a64" font-size="9" font-family="'Geist Mono', monospace">一致性级别: AP 最终一致性 (Eventual Consistency)</text>
    <text x="26" y="324" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">全球 100% 读高可用，容忍秒级增量同步延迟</text>
    <text x="26" y="342" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">无需跨洋读锁，读性能达到物理极致</text>
  </g>

  <!-- Right Column: Mode B Raft Transaction (x=500..920, w=420) - Focal Column -->
  <g transform="translate(500, 136)">
    <rect width="420" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="14" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="27" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">MODE B</text>
    <text x="100" y="28" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">区域强一致 Raft 事务 (CP 模型 · Durable Objects)</text>

    <!-- Actor Model -->
    <rect x="14" y="46" width="392" height="64" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="26" y="68" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 单键单线程 Actor 协调器 (Zero Lock)</text>
    <text x="26" y="86" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">每个 Object ID 路由至唯一核心节点，内存排队执行</text>
    <text x="394" y="86" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">无锁竞争</text>

    <!-- Raft Quorum -->
    <rect x="14" y="118" width="392" height="64" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="26" y="140" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 区域 Raft 多数派共识 (Quorum ≥ 2/3)</text>
    <text x="26" y="158" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">WAL 日志强同步复制 + 嵌入式 SQLite / D1 事务</text>
    <text x="394" y="158" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="end">严格 ACID</text>

    <!-- Business Scenarios -->
    <rect x="14" y="190" width="392" height="64" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="26" y="212" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">适用业务形态 (严禁超卖 / 强一致协同)</text>
    <text x="26" y="230" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 秒杀实时库存扣减 · 订单支付状态机</text>
    <text x="26" y="244" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 在线协作光标同步 · 实时游戏房间状态 · 聊天室</text>

    <!-- Total Metric -->
    <rect x="14" y="262" width="392" height="98" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1.2"/>
    <text x="26" y="286" fill="#e85d3f" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">架构特征与物理保证</text>
    <text x="26" y="306" fill="#e85d3f" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">一致性级别: CP 线性一致性 (Linearizability)</text>
    <text x="26" y="324" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">严格杜绝并发双花与超卖，天然消除死锁</text>
    <text x="26" y="342" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">区域 15ms 内完成 Raft 共识，兼顾强一致与低时延</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="562" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="550" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">模式 A 边缘只读 KV (AP 最终一致)</text>
  <rect x="330" y="550" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="350" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">模式 B 区域 Raft 事务 (CP 强一致)</text>
  <line x1="570" y1="556" x2="594" y2="556" stroke="#e85d3f" stroke-width="1.5" marker-end="url(#cdn-state-arr-accent)"/>
  <text x="602" y="562" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">兼顾微秒级读与零超卖写</text>
</svg>
</main>
</body>
</html>
