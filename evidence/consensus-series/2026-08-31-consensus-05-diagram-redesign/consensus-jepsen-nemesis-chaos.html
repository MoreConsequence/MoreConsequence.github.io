<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>consensus-jepsen-nemesis-chaos</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="jep-title jep-desc">
  <title id="jep-title">Jepsen 混沌工程检验架构：Nemesis 故障注入与判定流水线</title>
  <desc id="jep-desc">架构图展示 Jepsen 测试主控调度多客户端记录纳秒级调用历史，Nemesis 并发注入网络分区、时钟跳变与进程挂起故障，并通过 Knossos 和 Elle 算法判定线性一致性的闭环流程。</desc>
  <defs>
    <marker id="jp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="jp-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">CHAOS ENGINEERING · JEPSEN NEMESIS &amp; VERIFICATION</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">Jepsen 混沌检验架构：Nemesis 注入与判定流水线</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">客户端记录纳秒级调用历史流水 ➔ Nemesis 随机注入网络/时钟/进程破坏 ➔ Knossos &amp; Elle 判定线性一致性</text>

  <!-- Left: Control Node (x=40..260, w=220) -->
  <g transform="translate(40, 136)">
    <rect width="220" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CONTROL</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Jepsen 控制主控节点</text>

    <!-- Generator -->
    <rect x="14" y="42" width="192" height="96" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">并发客户端生成器</text>
    <text x="24" y="84" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">30+ 并发 Worker 线程</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Ops: Read/Write/CAS/Bank</text>
    <text x="24" y="118" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">高频无间断向集群施压</text>

    <!-- History Log -->
    <rect x="14" y="150" width="192" height="130" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="172" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">纳秒级历史流水日志</text>
    <text x="24" y="192" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">{:f :write, :v 1, :t 1000}</text>
    <text x="24" y="208" fill="#141413" font-size="8" font-family="'Geist Mono', monospace">{:f :read,  :v nil, :t 1020}</text>
    <text x="24" y="224" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace">{:f :ok,    :v 1, :t 1050}</text>
    <line x1="24" y1="236" x2="196" y2="236" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="254" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">精确记录 [inv, res] 时间戳</text>
    <text x="24" y="270" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">为后续数学判定提供铁证</text>

    <!-- Bottom Stat -->
    <rect x="14" y="292" width="192" height="68" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="314" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">测试周期</text>
    <text x="24" y="332" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Duration: 60s ~ 600s 混沌</text>
    <text x="24" y="348" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">收集数十万条操作轨迹</text>
  </g>

  <!-- Arrow Control -> DB (x=260..300) -->
  <text x="280" y="192" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">RPC</text>
  <line x1="260" y1="200" x2="300" y2="200" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#jp-arr)"/>

  <!-- Middle: Cluster & Nemesis (x=300..630, w=330) - Focal -->
  <g transform="translate(300, 136)">
    <rect width="330" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="96" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="62" y="25" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CHAOS REALM</text>
    <text x="120" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">被测分布式集群 (5 Nodes)</text>

    <!-- Cluster Nodes Grid -->
    <rect x="14" y="42" width="302" height="66" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="62" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">被测系统 (etcd / TiKV / Cassandra)</text>
    <!-- 5 Node badges -->
    <rect x="24" y="72" width="50" height="24" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="49" y="88" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Node 1</text>
    <rect x="80" y="72" width="50" height="24" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="105" y="88" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Node 2</text>
    <rect x="136" y="72" width="50" height="24" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="161" y="88" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Node 3</text>
    <rect x="192" y="72" width="50" height="24" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="217" y="88" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Node 4</text>
    <rect x="248" y="72" width="50" height="24" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="273" y="88" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Node 5</text>

    <!-- Nemesis Box (Focal) -->
    <rect x="14" y="120" width="302" height="240" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="24" y="130" width="140" height="16" rx="2" fill="#e85d3f"/>
    <text x="94" y="142" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">NEMESIS (复仇女神注入)</text>

    <text x="24" y="166" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 网络分区与丢包破坏</text>
    <text x="24" y="182" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">iptables DROP (对称/非对称/环形孤岛)</text>

    <text x="24" y="204" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 进程假死与挂起</text>
    <text x="24" y="220" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">kill -STOP (模拟 JVM 超长 Full GC 假死)</text>

    <text x="24" y="242" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">3. 硬件掉电与崩溃重启</text>
    <text x="24" y="258" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">kill -9 $PID ➔ 重新拉起测试数据恢复</text>

    <text x="24" y="280" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">4. NTP 时钟骤跳回拨</text>
    <text x="24" y="296" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">date -s "+200ms" / chronyc makestep</text>

    <line x1="24" y1="308" x2="304" y2="308" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="24" y="326" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">全方位制造最残酷、最真实的物理灾难！</text>
    <text x="24" y="344" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">逼迫分布式共识状态机暴露出所有隐藏缺陷</text>
  </g>

  <!-- Arrow DB -> Verifier (x=630..670) -->
  <text x="650" y="272" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Verify</text>
  <line x1="630" y1="280" x2="670" y2="280" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#jp-arr-accent)"/>

  <!-- Right: Verifier Engines (x=670..920, w=250) -->
  <g transform="translate(670, 136)">
    <rect width="250" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">VERIFIER</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">一致性验证分析引擎</text>

    <!-- Knossos -->
    <rect x="14" y="42" width="222" height="110" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Knossos (WGL 算法)</text>
    <text x="24" y="84" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">基于图搜索的全局回溯剪枝</text>
    <text x="24" y="102" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">寻找合法的单机线性排列</text>
    <text x="24" y="120" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">无合法解 ➔ 判定线性违规！</text>
    <text x="24" y="138" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">输出违反因果的精确操作调用点</text>

    <!-- Elle -->
    <rect x="14" y="162" width="222" height="110" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="184" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Elle (新一代依赖图引擎)</text>
    <text x="24" y="204" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">分析 WR / WW / RW 依赖环</text>
    <text x="24" y="222" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">检测序列化分叉与脏读</text>
    <text x="24" y="240" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">有向环路 ➔ 判定一致性破产</text>
    <text x="24" y="258" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">可支撑百万级长事务快速判定</text>

    <!-- Final Verdict -->
    <rect x="14" y="284" width="222" height="76" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="306" fill="#e85d3f" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">最终结论 (Verdict)</text>
    <text x="24" y="326" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">Valid ✓ 强一致通过 / </text>
    <text x="24" y="344" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Invalid ✗ 生成反例时序图！</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">主控调度与判定组件</text>
  <rect x="300" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="320" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Nemesis 故障注入与混沌靶场</text>
</svg>
</main>
</body>
</html>
