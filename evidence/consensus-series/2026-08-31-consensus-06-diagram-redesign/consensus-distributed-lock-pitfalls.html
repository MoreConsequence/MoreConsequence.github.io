<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>consensus-distributed-lock-pitfalls</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="pit-title pit-desc">
  <title id="pit-title">分布式锁经典崩溃场景：STW GC 停顿与锁过期写覆盖时序</title>
  <desc id="pit-desc">时序模型图展示客户端 1 在持锁期间遭遇长时间 JVM GC 停顿，锁在服务端超时释放被客户端 2 抢占，苏醒后客户端 1 盲目写入造成数据覆盖损坏的致命漏洞。</desc>
  <defs>
    <marker id="pit-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="pit-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">DISTRIBUTED LOCK PITFALLS · MARTIN KLEPPMANN CRITIQUE</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">分布式锁崩溃场景：GC 停顿与旧写覆盖时序</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">客户端 1 遭遇 15s GC 停顿 ➔ 锁 10s 超时释放 ➔ 客户端 2 获锁写入 ➔ 客户端 1 苏醒覆盖脏数据</text>

  <!-- 3 Columns Container (y=136..506, h=370) -->
  <!-- Col 1: Client 1 (x=40..300, w=260) -->
  <g transform="translate(40, 136)">
    <rect width="260" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CLIENT 1</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">客户端 1 (Java 应用)</text>

    <!-- Step 1: Lock Acquired -->
    <rect x="14" y="42" width="232" height="66" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="62" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. t=0s 申请锁成功</text>
    <text x="24" y="80" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Acquire(lock, TTL=10s) ✓</text>
    <text x="24" y="96" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">认为自己独占该订单资源</text>

    <!-- Step 2: STW GC (Focal Alert) -->
    <rect x="14" y="118" width="232" height="120" rx="4" fill="rgba(232,93,63,0.08)" stroke="#e85d3f" stroke-width="1.2"/>
    <text x="24" y="140" fill="#e85d3f" font-size="10.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">2. 突发 JVM Full GC (STW)</text>
    <text x="24" y="160" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">停顿耗时: 15 秒！</text>
    <text x="24" y="178" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">全线程冻结，无法执行指令</text>
    <text x="24" y="196" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">无法向 Redis 发送续租心跳</text>
    <text x="24" y="218" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">本地时间感知完全停滞</text>

    <!-- Step 5: Wake up & Dirty Write -->
    <rect x="14" y="248" width="232" height="114" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="270" fill="#e85d3f" font-size="10.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">5. t=15s 苏醒并盲目写入</text>
    <text x="24" y="290" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">Write(DB, State = 'A')</text>
    <text x="24" y="308" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">自以为依然持锁，强行写库！</text>
    <text x="24" y="328" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">💥 覆盖 Client 2 的合法新数据！</text>
  </g>

  <!-- Arrow 1 (x=300..340) -->
  <line x1="300" y1="180" x2="340" y2="180" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#pit-arr-accent)"/>

  <!-- Col 2: Redis Lock Server (x=340..620, w=280) - Focal -->
  <g transform="translate(340, 136)">
    <rect width="280" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="25" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">REDIS</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Redis 锁服务 (Lock Hub)</text>

    <!-- State 1: Locked -->
    <rect x="14" y="42" width="252" height="66" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="62" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">t=0s: 授予 Client 1</text>
    <text x="24" y="80" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Key: lock:order ➔ TTL: 10s</text>
    <text x="24" y="96" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">倒计时开始递减</text>

    <!-- State 2: Expired & Deleted -->
    <rect x="14" y="118" width="252" height="120" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="140" fill="#e85d3f" font-size="10.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">3. t=10s: TTL 超时强制释放</text>
    <text x="24" y="160" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">未收到 Client 1 续约心跳</text>
    <text x="24" y="178" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">物理删除 key: lock:order</text>
    <text x="24" y="196" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">锁资源重新变为可用空闲状态</text>
    <text x="24" y="218" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">服务端无法感知 Client 1 正在挂起</text>

    <!-- State 3: Re-granted -->
    <rect x="14" y="248" width="252" height="114" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="270" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">t=11s: 授予 Client 2</text>
    <text x="24" y="290" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Key: lock:order ➔ Client 2</text>
    <text x="24" y="308" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">产生双客户端持锁物理幻觉！</text>
    <text x="24" y="328" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">单纯依赖锁服务无法保证安全</text>
  </g>

  <!-- Arrow 2 (x=620..660) -->
  <line x1="620" y1="280" x2="660" y2="280" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#pit-arr-accent)"/>

  <!-- Col 3: Client 2 & DB (x=660..920, w=260) -->
  <g transform="translate(660, 136)">
    <rect width="260" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CLIENT 2 &amp; DB</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">客户端 2 与后端存储</text>

    <!-- Step 4: Client 2 Writes -->
    <rect x="14" y="42" width="232" height="120" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">4. t=11s 申请锁并写入</text>
    <text x="24" y="84" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Acquire(lock) ➔ SUCCESS</text>
    <text x="24" y="102" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">Write(DB, State = 'B') ✓</text>
    <text x="24" y="120" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">合法执行业务更新并落盘</text>
    <text x="24" y="138" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">数据处于正确版本 B</text>

    <!-- Victim DB Storage -->
    <rect x="14" y="172" width="232" height="190" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <text x="24" y="196" fill="#e85d3f" font-size="10.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">受害存储：MySQL / PostgreSQL</text>
    <text x="24" y="216" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">由于缺乏存储层 Fencing 校验：</text>
    <text x="24" y="234" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">t=12s: DB Record = 'B' (最新)</text>
    <text x="24" y="252" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">t=15s: 被 Client 1 覆盖为 'A'！</text>
    <line x1="24" y1="264" x2="236" y2="264" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="24" y="284" fill="#e85d3f" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">数据静默损坏 (Silent Corruption)</text>
    <text x="24" y="302" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">业务无任何报错提示</text>
    <text x="24" y="320" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">必须靠存储层 Fencing Token 拦截！</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">正常客户端操作</text>
  <rect x="290" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="310" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">GC 停顿与旧写覆盖破坏点</text>
</svg>
</main>
</body>
</html>
