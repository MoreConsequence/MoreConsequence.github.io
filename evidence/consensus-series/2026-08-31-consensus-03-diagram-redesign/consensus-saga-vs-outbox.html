<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>consensus-saga-vs-outbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="saga-title saga-desc">
  <title id="saga-title">SAGA 状态机编排模式：正向长事务执行与逆向补偿模型</title>
  <desc id="saga-desc">流程架构图展示 SAGA 编排器在微服务长事务中的执行流：正向独立本地事务执行与失败时自动触发逆向幂等补偿事务的闭环机制。</desc>
  <defs>
    <marker id="saga-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="saga-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">MICROSERVICE TRANSACTIONS · SAGA ORCHESTRATION</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">SAGA 状态机编排：正向执行与逆向补偿</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">正向事务 T_1 ➔ T_2 ➔ T_3 各自独立本地提交；中途失败触发逆向补偿 C_2 ➔ C_1，彻底消解跨网长锁</text>

  <!-- Track 1: Happy Path (y=136..316, h=180) -->
  <g transform="translate(40, 136)">
    <rect width="880" height="175" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TRACK 1</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">正向全胜路径 (Happy Path): 独立本地事务链</text>

    <!-- Step T1 -->
    <rect x="14" y="42" width="230" height="118" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">T₁: 订单服务 (Order DB)</text>
    <text x="24" y="84" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">Insert Order (PENDING)</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Local Commit ✓ (0 跨库锁)</text>
    <text x="24" y="118" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">耗时: ≤ 1ms 单机事务</text>

    <!-- Arrow 1 (x=244..280) -->
    <line x1="244" y1="101" x2="280" y2="101" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#saga-arr)"/>

    <!-- Step T2 -->
    <rect x="280" y="42" width="230" height="118" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="290" y="64" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">T₂: 库存服务 (Stock DB)</text>
    <text x="290" y="84" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">Deduct Stock (sku_1, -1)</text>
    <text x="290" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Local Commit ✓ (0 跨库锁)</text>
    <text x="290" y="118" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">耗时: ≤ 1ms 单机事务</text>

    <!-- Arrow 2 (x=510..546) -->
    <line x1="510" y1="101" x2="546" y2="101" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#saga-arr)"/>

    <!-- Step T3 -->
    <rect x="546" y="42" width="320" height="118" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="556" y="64" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">T₃: 支付服务 (Pay DB) ➔ 最终成功</text>
    <text x="556" y="84" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">Deduct Balance (user_1, -¥100)</text>
    <text x="556" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Local Commit ✓ ➔ Mark Order SUCCESS</text>
    <text x="556" y="118" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">整条业务链路吞吐轻松突破 10,000+ QPS</text>
  </g>

  <!-- Track 2: Rollback Path (y=326..506, h=180) - Focal -->
  <g transform="translate(40, 326)">
    <rect width="880" height="180" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="52" y="25" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TRACK 2</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">中途失败与逆向补偿状态机：C₂ ➔ C₁ 自动幂等收敛</text>

    <!-- Fail at T3 -->
    <rect x="14" y="42" width="260" height="124" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="10.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">1. T₃ 执行失败 (余额不足 / 账户冻结)</text>
    <text x="24" y="84" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">PaymentService 抛出业务异常</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">触发 SAGA 编排器逆向补偿中断！</text>
    <text x="24" y="118" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">状态机反转调度队列</text>

    <!-- Arrow Back 1 (x=274..310) -->
    <line x1="274" y1="104" x2="310" y2="104" stroke="#e85d3f" stroke-width="1.4" marker-end="url(#saga-arr-accent)"/>

    <!-- Compensate C2 -->
    <rect x="310" y="42" width="260" height="124" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="320" y="64" fill="#e85d3f" font-size="10.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">2. C₂: 幂等退还库存 (Stock DB)</text>
    <text x="320" y="84" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">Release Stock (sku_1, +1)</text>
    <text x="320" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Local Commit ✓ (幂等防重复退)</text>
    <text x="320" y="118" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">库存数量恢复初始状态</text>

    <!-- Arrow Back 2 (x=570..606) -->
    <line x1="570" y1="104" x2="606" y2="104" stroke="#e85d3f" stroke-width="1.4" marker-end="url(#saga-arr-accent)"/>

    <!-- Compensate C1 -->
    <rect x="606" y="42" width="260" height="124" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="616" y="64" fill="#e85d3f" font-size="10.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">3. C₁: 幂等取消订单 (Order DB)</text>
    <text x="616" y="84" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">Update Status ➔ CANCELLED</text>
    <text x="616" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Local Commit ✓ (最终状态收敛)</text>
    <text x="616" y="118" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">全系统实现最终一致性 (BASE)</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">正向独立本地事务</text>
  <rect x="300" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="320" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">SAGA 逆向补偿与状态收敛</text>
</svg>
</main>
</body>
</html>
