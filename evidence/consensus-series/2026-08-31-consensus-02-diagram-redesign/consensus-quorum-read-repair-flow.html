<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>consensus-quorum-read-repair-flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="rr-title rr-desc">
  <title id="rr-title">Quorum 读取修复（Read Repair）与后台反熵同步机制</title>
  <desc id="rr-desc">流程架构图展示客户端 Quorum 读比对多版本时间戳并异步修复落后节点，以及冷数据通过后台 Merkle 树哈希递归精确定位分叉进行反熵同步的机理。</desc>
  <defs>
    <marker id="rr-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="rr-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">ANTI-ENTROPY RECOVERY · READ REPAIR &amp; MERKLE TREE</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">读修复（Read Repair）与后台反熵同步机制</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">热数据依靠 Quorum 读采样时间戳异步修补落后节点；冷数据依靠 Merkle 树哈希分片实现低开销全量收敛</text>

  <!-- Upper Track: Read Repair Flow (y=136..326, h=190) -->
  <g transform="translate(40, 136)">
    <rect width="880" height="190" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TRACK 1</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">热路径：客户端 Quorum 读触发异步读修复 (Read Repair)</text>

    <!-- Step 1: Read Sample -->
    <rect x="14" y="42" width="200" height="132" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. Quorum 读采样 (R=3)</text>
    <text x="24" y="84" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Node 1: v2 @ ts=100</text>
    <text x="24" y="100" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Node 2: v2 @ ts=100</text>
    <text x="24" y="116" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Node 3: v1 @ ts=80 (落后)</text>
    <text x="24" y="136" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">向 Coordinator 汇总比对</text>

    <!-- Arrow 1 (x=214..250) -->
    <line x1="214" y1="108" x2="250" y2="108" stroke="#6b6a64" stroke-width="1.2" marker-end="url(#rr-arr)"/>

    <!-- Step 2: Timestamp Arbitrate -->
    <rect x="250" y="42" width="280" height="132" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <text x="260" y="64" fill="#e85d3f" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">2. 时间戳版本仲裁与响应直出</text>
    <text x="260" y="84" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">MaxTimestamp = 100 ➔ 判定 v2 为有效值</text>
    <text x="260" y="102" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">即刻向客户端返回最新值 v2 (0 延迟阻塞)</text>
    <line x1="260" y1="114" x2="518" y2="114" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="260" y="132" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">识别到 Node 3 持有旧版本 v1 (ts=80)</text>
    <text x="260" y="150" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">后台触发异步写入修复协程</text>

    <!-- Arrow 2 (x=530..570) -->
    <line x1="530" y1="108" x2="570" y2="108" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#rr-arr-accent)"/>

    <!-- Step 3: Async Repair -->
    <rect x="570" y="42" width="296" height="132" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="580" y="64" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">3. 异步修补落后节点 (Node 3)</text>
    <text x="580" y="84" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Write(Node 3, key, val=v2, ts=100)</text>
    <text x="580" y="102" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Node 3 本地覆盖落盘 ➔ 数据重新对齐</text>
    <line x1="580" y1="114" x2="854" y2="114" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="580" y="132" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">热点数据在被读取的瞬间自动实现全网收敛</text>
    <text x="580" y="150" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">无需阻塞正常读路径，兼顾低延迟与一致性</text>
  </g>

  <!-- Lower Track: Merkle Tree Anti-Entropy Flow (y=340..516, h=176) -->
  <g transform="translate(40, 340)">
    <rect width="880" height="176" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="76" height="18" rx="2" fill="none" stroke="#141413" stroke-width="0.8"/>
    <text x="52" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TRACK 2</text>
    <text x="100" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">冷路径：后台 Merkle 树分片哈希递归反熵 (Anti-Entropy)</text>

    <!-- Node A Tree -->
    <rect x="14" y="40" width="260" height="122" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="60" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Node A (负责分片 [0..2³²-1])</text>
    <text x="24" y="80" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Root Hash: 0x8F4B...</text>
    <text x="24" y="98" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">├─ Leaf L1: 0x1A2B (一致)</text>
    <text x="24" y="114" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">└─ Leaf L2: 0x9F8E (分叉差异)</text>
    <text x="24" y="132" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">自底向上构建分层哈希</text>

    <!-- Middle Comparison -->
    <rect x="290" y="40" width="300" height="122" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
    <text x="300" y="60" fill="#e85d3f" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Merkle 树哈希递归比对</text>
    <text x="300" y="80" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">1. 交换 Root Hash ➔ 发现不一致</text>
    <text x="300" y="98" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">2. 递归二分定位 ➔ 锁定 Leaf L2</text>
    <line x1="300" y1="108" x2="578" y2="108" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="300" y="124" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">仅需传输数 KB 差异数据！</text>
    <text x="300" y="140" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">无需全表扫描 GB 级冷数据</text>

    <!-- Node B Tree -->
    <rect x="606" y="40" width="260" height="122" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="616" y="60" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Node B (副本分片 [0..2³²-1])</text>
    <text x="616" y="80" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Root Hash: 0x3C1D (不匹配)</text>
    <text x="616" y="98" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">├─ Leaf L1: 0x1A2B (一致)</text>
    <text x="616" y="114" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">└─ Leaf L2: 0x4D2A (缺漏数据)</text>
    <text x="616" y="132" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">精准拉取 L2 区间数据修补</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">数据节点与正常哈希</text>
  <rect x="300" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="320" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">反熵仲裁与修复核心</text>
  <line x1="510" y1="558" x2="534" y2="558" stroke="#e85d3f" stroke-width="1.5" marker-end="url(#rr-arr-accent)"/>
  <text x="542" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">异步数据修补流</text>
</svg>
</main>
</body>
</html>
