<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi-agent-economics-token-reduction-harness</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="eh-title eh-desc">
  <title id="eh-title">Databricks 百万行基准与极简 Harness 经济学模型</title>
  <desc id="eh-desc">基准对比图展示 Databricks 百万行代码实测中臃肿 Harness 导致上下文雪崩与高昂成本，对比 Pi 极简 Harness 架构通过 3x 上下文精简以一半成本打平旗舰通过率的经济学优势。</desc>
  <defs>
    <marker id="eh-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="eh-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">TOKEN ECONOMICS · DATABRICKS BENCHMARK &amp; HARNESS EFFICIENCY</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">Databricks 基准与极简 Harness 经济学</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">臃肿 Harness ($3.40/任务, 68k) vs Pi 极简架构 ($1.25/任务, 14.2k) ➔ 3x 上下文精简与 90% 最高通过率</text>

  <!-- 2 Main Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Bloated Harness (x=40..460, w=420) -->
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="79" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">BLOATED HARNESS</text>
    <text x="154" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">臃肿全能型 Harness</text>

    <!-- Metrics Matrix -->
    <rect x="14" y="42" width="392" height="74" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Databricks 实测基准数据 (GPT-5)</text>
    <text x="24" y="82" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 单任务成本: $3.40 / 任务 (高昂)</text>
    <text x="24" y="100" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">• 每轮上下文: 68.0k Tokens | Pass@1: 81.0%</text>

    <!-- Visual Mechanism -->
    <rect x="14" y="126" width="392" height="120" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="148" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">导致成本失控的根因：</text>
    <text x="24" y="168" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 工具 Schema 臃肿：注入几十个专用工具定义；</text>
    <text x="24" y="186" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">2. 全文件反复重写：缺少精准行级局部替换；</text>
    <text x="24" y="204" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 缺乏确定性截断：历史无效消息无限滚雪球。</text>
    <text x="24" y="224" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace">Context Avalanche &amp; Expensive Re-computation</text>

    <!-- Summary -->
    <rect x="14" y="256" width="392" height="104" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="278" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">评级</text>
    <text x="24" y="298" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">过度包装的黑盒框架在企业大仓库中产生巨大的 Token 浪费与幻觉。</text>
    <text x="24" y="322" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">Cost Inefficient &amp; High Hallucination</text>
    <text x="24" y="340" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Poor ROI for Monorepo Scaling</text>
  </g>

  <!-- Col 2: Pi Minimalist Harness (x=480..920, w=440) - Focal -->
  <g transform="translate(480, 136)">
    <rect width="440" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="140" height="18" rx="2" fill="#e85d3f"/>
    <text x="84" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">PI MINIMALIST</text>
    <text x="164" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Pi 极简 Harness 架构</text>

    <!-- Metrics Matrix -->
    <rect x="14" y="42" width="412" height="74" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Databricks 实测基准数据 (GLM 5.2 / Opus)</text>
    <text x="24" y="82" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• GLM 5.2 + Pi: $1.25 / 任务 | 14.2k tokens (87.5% 通过)</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• Opus 4.8 + Pi: $2.10 / 任务 | 90.0% 通过率 (全场第一)</text>

    <!-- Visual Mechanism -->
    <rect x="14" y="126" width="412" height="120" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="148" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">三大节约利器：</text>
    <text x="24" y="168" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">1. 提示词克制：单行工具简述，每轮减少 3x 上下文；</text>
    <text x="24" y="186" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">2. 四工具极简主义：万能 bash + edit 行替换减少中间回填；</text>
    <text x="24" y="204" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 16384/20000 确定性 Compaction 双闸门！</text>
    <text x="24" y="224" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">3x Leaner Context &amp; Ultra-Low Cost Execution</text>

    <!-- Summary -->
    <rect x="14" y="256" width="412" height="104" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="278" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">经济效益</text>
    <text x="24" y="298" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">用平价模型跑出旗舰质量，以透明工程控制实现真正的 Token 降本增效。</text>
    <text x="24" y="322" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Highest Cost/Performance Efficiency</text>
    <text x="24" y="340" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">Shopify &amp; Databricks Verified Architecture</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">臃肿 Harness 上下文雪崩与高昂成本缺陷</text>
  <rect x="370" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="390" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Pi 极简 Harness 架构与 3x 上下文精简核心</text>
</svg>
</main>
</body>
</html>
