<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi-compaction-context-budget-kv-cache</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">传统滑动窗口缺陷 vs KV Cache 友好的断点压缩机制</title>
  <desc id="cc-desc">架构对比图展示传统滑动窗口破坏工具对应契约并击穿 Prompt Cache 的缺陷，对比 Pi 锁定系统头部、摘要冷历史并保留热活跃区的 Cache-Aware 断点压缩机制。</desc>
  <defs>
    <marker id="cc-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="cc-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">CONTEXT BUDGET ENGINEERING · SLIDING WINDOW FLAWS VS CACHE-AWARE</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">滑动窗口缺陷 vs Cache 友好的压缩架构</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">粗暴滑动窗口 (破坏 Tool 对应/击穿缓存) vs Cache-Aware 前缀锁定 (头部锁死 + 结构化摘要 + 热区保留)</text>

  <!-- 2 Main Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Sliding Window Flaws (x=40..460, w=420) -->
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="130" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="79" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SLIDING WINDOW</text>
    <text x="154" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">传统滑动窗口裁剪</text>

    <!-- Metrics Matrix -->
    <rect x="14" y="42" width="392" height="74" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600">messages.splice(0, N) 粗暴截断</text>
    <text x="24" y="82" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• Prompt Cache 命中率: 跌至 0% (前缀哈希彻底破碎)</text>
    <text x="24" y="100" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 丢失开局 System 约束，破坏全局规则</text>

    <!-- Visual Mechanism -->
    <rect x="14" y="126" width="392" height="120" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="148" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">致命工程破坏：</text>
    <text x="24" y="168" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">1. 破坏 Tool 契约：删掉 assistant 留下 tool 报 400 错；</text>
    <text x="24" y="186" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">2. 丢失工作区背景：清除禁止修改 schema 等关键假设；</text>
    <text x="24" y="204" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 导致单轮推理费用和 TTFT 延迟飙升数倍。</text>
    <text x="24" y="224" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace">Broken Invariants &amp; Cache Annihilation</text>

    <!-- Summary -->
    <rect x="14" y="256" width="392" height="104" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="278" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">评价</text>
    <text x="24" y="298" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">仅适用于简单单轮问答机器人，绝对禁止在生产级 Agent Harness 中使用。</text>
    <text x="24" y="322" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">Unfit for Multi-Turn Autonomous Agents</text>
    <text x="24" y="340" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">High Cost &amp; Instability</text>
  </g>

  <!-- Col 2: Cache Aware Compaction (x=480..920, w=440) - Focal -->
  <g transform="translate(480, 136)">
    <rect width="440" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="140" height="18" rx="2" fill="#e85d3f"/>
    <text x="84" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">CACHE-AWARE</text>
    <text x="164" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Pi 断点保护压缩机制</text>

    <!-- Metrics Matrix -->
    <rect x="14" y="42" width="412" height="74" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="700">三层结构切分与摘要注入</text>
    <text x="24" y="82" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• 头部固定区: System Prompt + AGENTS.md (100% 命中缓存)</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 尾部活跃区: 严格保留最近 16,384 Token 热数据流</text>

    <!-- Visual Mechanism -->
    <rect x="14" y="126" width="412" height="120" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="148" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">核心设计优势：</text>
    <text x="24" y="168" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">1. 锁定 System 前缀，最大化利用 Prompt Cache 折扣；</text>
    <text x="24" y="186" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">2. 冷历史提炼为 [SESSION SUMMARY] 结构化事实节点；</text>
    <text x="24" y="204" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">3. 绝不拆散 tool_calls 与 tool 返回对！</text>
    <text x="24" y="224" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Preserves Tool Invariants &amp; Maximizes KV Cache</text>

    <!-- Summary -->
    <rect x="14" y="256" width="412" height="104" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="278" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">工程效益</text>
    <text x="24" y="298" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">使长任务推理费用降低 75% 以上，首字延迟由 10s 骤降至 600ms，支撑无限轮次长执行。</text>
    <text x="24" y="322" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Production Long-Running Agent Architecture</text>
    <text x="24" y="340" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">High Efficiency Context Compaction</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">传统滑动窗口缺陷与缓存击穿分析</text>
  <rect x="370" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="390" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">Pi Cache-Aware 断点保护与结构化摘要压缩核心</text>
</svg>
</main>
</body>
</html>
