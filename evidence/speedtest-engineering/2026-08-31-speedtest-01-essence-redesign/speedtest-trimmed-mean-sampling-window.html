<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>speedtest-trimmed-mean-sampling-window</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="tm-title tm-desc">
  <title id="tm-title">TCP Cubic vs BBR 升窗特性与 P90 截尾滤波</title>
  <desc id="tm-desc">拥塞控制与滤波模型架构图展示 TCP Cubic 与 BBR 在无线丢包下的升窗表现差异、100ms 离散时间片采样切片，以及剔除启停噪声的 P90 截尾均值数学滤波模型。</desc>
  <defs>
    <marker id="tm-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="tm-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">CONGESTION CONTROL &amp; TIME-SERIES SAMPLING · CUBIC VS BBR &amp; P90 FILTER</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">TCP Cubic vs BBR 对决与 P90 截尾滤波</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">无线偶发丢包 Cubic 折半 vs BBR 稳态吃满 ➔ 100ms 离散切片 ➔ 剔除启停噪声 ➔ P90 截尾均值</text>

  <!-- 4 Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Cubic (x=40..245, w=205) -->
  <g transform="translate(40, 136)">
    <rect width="205" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="62" y="25" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">TCP CUBIC</text>
    <text x="118" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">丢包驱动折半</text>

    <!-- Box -->
    <rect x="12" y="42" width="181" height="96" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">Loss-Based Reduction</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 误将 1% 无线误码视为网络拥塞</text>
    <text x="20" y="94" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 拥塞窗口乘性折半 cwnd * 0.7</text>
    <text x="20" y="110" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Sawtooth Throughput Flapping</text>

    <!-- Details -->
    <rect x="12" y="148" width="181" height="212" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">升窗局限：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 10 秒测试期内频繁剧烈锯齿波动；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 移动端 Wi-Fi/5G 实测严重缩水；</text>
    <text x="20" y="226" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 无法稳定激发千兆物理能力。</text>
  </g>

  <!-- Col 2: TCP BBR (x=260..475, w=215) - Focal -->
  <g transform="translate(260, 136)">
    <rect width="215" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#e85d3f"/>
    <text x="62" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">TCP BBR</text>
    <text x="118" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">物理模型注入</text>

    <!-- Box -->
    <rect x="12" y="42" width="191" height="96" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="20" y="62" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">BtlBw &amp; RTprop Modeling</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 以 Pacing Rate 恒定速率注满管道</text>
    <text x="20" y="94" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 免疫 2% 随机丢包，1~2 RTT 爬满</text>
    <text x="20" y="110" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace">Fast-Start Wire Rate Saturation</text>

    <!-- Details -->
    <rect x="12" y="148" width="191" height="212" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">BBR 突破：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 不把丢包作为唯一拥塞判定信号；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 极速跨越无线环境偶发丢包陷阱；</text>
    <text x="20" y="226" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 稳定输出千兆物理线速。</text>
  </g>

  <!-- Col 3: Time-Slice Sampling (x=490..695, w=205) - Focal -->
  <g transform="translate(490, 136)">
    <rect width="205" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#e85d3f"/>
    <text x="62" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">100MS SLICE</text>
    <text x="118" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">离散切片采样</text>

    <!-- Box -->
    <rect x="12" y="42" width="181" height="96" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="20" y="62" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace">R_k = (ΔB_k × 8) / 0.1s</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 10s 周期连续采集 100 个时间切片</text>
    <text x="20" y="94" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 剔除前 1.5s 慢启动与后 0.5s 拆除</text>
    <text x="20" y="110" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace">Noise Rejection Boundary</text>

    <!-- Details -->
    <rect x="12" y="148" width="181" height="212" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">采样策略：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 消除 TCP 握手慢启动阶段抖动；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 消除连接关闭阶段的缓冲区排空干扰；</text>
    <text x="20" y="226" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 锁定核心 8s 稳态区间。</text>
  </g>

  <!-- Col 4: P90 Filter (x=710..920, w=210) -->
  <g transform="translate(710, 136)">
    <rect width="210" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="12" y="12" width="100" height="18" rx="2" fill="#141413"/>
    <text x="62" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">P90 FILTER</text>
    <text x="118" y="26" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">截尾滤波平滑</text>

    <!-- Box -->
    <rect x="12" y="42" width="186" height="96" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="62" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">10% Trimmed Mean</text>
    <text x="20" y="78" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 剔除稳态两端 10% 极大/极小极值</text>
    <text x="20" y="94" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 输出高精度的 P90 有效吞吐</text>
    <text x="20" y="110" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Robust Steady Goodput</text>

    <!-- Details -->
    <rect x="12" y="148" width="186" height="212" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="20" y="170" fill="#141413" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">滤波价值：</text>
    <text x="20" y="190" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">• 抵御客户端垃圾回收 GC 偶发停顿；</text>
    <text x="20" y="208" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 杜绝单点离群值拉低整体均值；</text>
    <text x="20" y="226" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 提供工业级出版精度的测速结果。</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">TCP Cubic 丢包折半缺陷与 P90 截尾滤波平滑机制</text>
  <rect x="370" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="390" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">TCP BBR 物理模型注满与 100ms 离散切片采样核心</text>
</svg>
</main>
</body>
</html>
