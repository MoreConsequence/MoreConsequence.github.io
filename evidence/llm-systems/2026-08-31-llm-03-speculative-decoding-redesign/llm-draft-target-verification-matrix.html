<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>llm-draft-target-verification-matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="vm-title vm-desc">
  <title id="vm-title">投机采样数学无损证明：接受-拒绝采样算法</title>
  <desc id="vm-desc">数学推导架构图展示投机采样的接受概率判定公式、拒绝时的残差重采样分布以及全概率展开证明输出分布与大模型原生推理 100% 绝对等价的证明过程。</desc>
  <defs>
    <marker id="vm-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="vm-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">MATHEMATICAL RIGOR · ACCEPTANCE/REJECTION &amp; RESIDUAL RESAMPLING</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">投机采样数学无损证明：接受-拒绝采样模型</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">接受判定 P(accept) = min(1, p/q) ➔ 残差分布 p'(x) 重抽样 ➔ 全概率公式恒等证明 P(output) ≡ p(x)</text>

  <!-- 3 Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: Acceptance (x=40..310, w=270) -->
  <g transform="translate(40, 136)">
    <rect width="270" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="69" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">STEP 1 · ACCEPT</text>
    <text x="134" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">接受概率判定</text>

    <!-- Content Box -->
    <rect x="14" y="42" width="242" height="110" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600">P(accept x) = min(1, p(x)/q(x))</text>
    <text x="24" y="82" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• q(x): 小草稿模型预测概率</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• p(x): 大目标模型计算概率</text>
    <text x="24" y="118" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• 若 p(x) &gt;= q(x) ➔ 100% 必然接受！</text>
    <text x="24" y="136" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Exact Probability Match</text>

    <!-- Details -->
    <rect x="14" y="162" width="242" height="198" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="184" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">数学物理直觉：</text>
    <text x="24" y="204" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 只要大模型比草稿模型更倾向该词；</text>
    <text x="24" y="224" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 则无条件采纳该候选词；</text>
    <text x="24" y="244" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 仅当草稿模型高估概率时才随机淘汰。</text>
    <line x1="24" y1="258" x2="246" y2="258" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="278" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">Proportional Probability Filter</text>
    <text x="24" y="296" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">Zero Overestimation Bias</text>
  </g>

  <!-- Arrow 1 (x=310..340) -->
  <text x="325" y="225" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Reject</text>
  <line x1="310" y1="233" x2="340" y2="233" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#vm-arr-accent)"/>

  <!-- Col 2: Residual Resampling (x=340..630, w=290) - Focal -->
  <g transform="translate(340, 136)">
    <rect width="290" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="120" height="18" rx="2" fill="#e85d3f"/>
    <text x="74" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STEP 2 · RESIDUAL</text>
    <text x="144" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">残差分布重采样</text>

    <!-- Content Box -->
    <rect x="14" y="42" width="262" height="110" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">p'(x) = max(0, p(x) - q(x)) / Z</text>
    <text x="24" y="82" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">1. 当 u &gt; P(accept x) 触发拒绝</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. 不丢弃已算 Logits，构建残差分布</text>
    <text x="24" y="118" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">3. 从 p'(x) 中抽样出正确词并截断后续</text>
    <text x="24" y="136" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Residual Probability Mass Sampling</text>

    <!-- Details -->
    <rect x="14" y="162" width="262" height="198" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="184" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">残差纠偏数学本质：</text>
    <text x="24" y="204" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 将大模型“未被草稿模型覆盖的概率质量”归一化；</text>
    <text x="24" y="224" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 保证被拒绝时依然能纠正出一个正确 Token；</text>
    <text x="24" y="244" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 确保单次 Forward 至少产出 1 个保底 Token！</text>
    <line x1="24" y1="258" x2="266" y2="258" stroke="#e85d3f" stroke-width="0.6"/>
    <text x="24" y="278" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Guaranteed Forward Progress</text>
    <text x="24" y="296" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">绝无单步 0 产出的死循环</text>
  </g>

  <!-- Arrow 2 (x=630..660) -->
  <text x="645" y="225" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">Prove</text>
  <line x1="630" y1="233" x2="660" y2="233" stroke="#e85d3f" stroke-width="1.2" marker-end="url(#vm-arr-accent)"/>

  <!-- Col 3: Proof (x=660..920, w=260) - Focal -->
  <g transform="translate(660, 136)">
    <rect width="260" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#141413"/>
    <text x="69" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">STEP 3 · Q.E.D.</text>
    <text x="134" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">全概率恒等证明</text>

    <!-- Content Box -->
    <rect x="14" y="42" width="232" height="110" rx="4" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700">P(out) = min(q,p) + max(0, p-q)</text>
    <text x="24" y="82" fill="#e85d3f" font-size="10" font-family="'Geist Mono', monospace" font-weight="700">       ≡ p(x)   (Q.E.D. 证毕!)</text>
    <text x="24" y="100" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• 第一项: 接受概率 = min(q, p)</text>
    <text x="24" y="118" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">• 第二项: 纠偏概率 = max(0, p - q)</text>
    <text x="24" y="136" fill="#e85d3f" font-size="7" font-family="'Geist Mono', monospace">Strict Statistical Equivalence</text>

    <!-- Details -->
    <rect x="14" y="162" width="232" height="198" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="184" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">重大工业意义：</text>
    <text x="24" y="204" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 无论草稿模型多粗糙、多小；</text>
    <text x="24" y="224" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 输出统计分布与原生 70B 绝对等价；</text>
    <text x="24" y="244" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 彻底打破“加速必损智力”的教条！</text>
    <line x1="24" y1="258" x2="236" y2="258" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
    <text x="24" y="278" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Zero Accuracy Loss Assurance</text>
    <text x="24" y="296" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">Mathematical Ground Truth</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">接受概率判定与全概率恒等</text>
  <rect x="330" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="350" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">残差分布 p'(x) 重采样与无损精度 Q.E.D. 核心</text>
</svg>
</main>
</body>
</html>
