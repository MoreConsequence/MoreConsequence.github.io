<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibreSpeed Go garbage write loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 24px;
      background: #f5f5f5;
      color: #2d3142;
    }
    main { width: min(960px, 100%); }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="garbage-chunk-writer-zero-alloc-pipeline-title garbage-chunk-writer-zero-alloc-pipeline-desc">
      <title id="garbage-chunk-writer-zero-alloc-pipeline-title">garbage 随机块循环写出</title>
      <desc id="garbage-chunk-writer-zero-alloc-pipeline-desc">Flowchart showing startup generation of a 1 MiB random block, chunk selection, repeated writes of that block, and the loop ending after the requested count or a write error.</desc>
      <defs>
        <style>
          .eyebrow { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 500; letter-spacing: .18em; }
          .title { fill: #2d3142; font-family: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; font-size: 28px; font-weight: 400; }
          .subtitle { fill: #4f5d75; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 400; }
          .node-name { fill: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 600; }
          .tech { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 400; }
          .tag { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 600; letter-spacing: .08em; }
          .focal-name { fill: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 600; }
          .focal-tag { fill: #eb6c36; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 600; letter-spacing: .08em; }
          .branch-label { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 600; letter-spacing: .08em; }
          .legend { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 400; }
        </style>
        <marker id="garbage-chunk-writer-zero-alloc-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#4f5d75"/>
        </marker>
        <marker id="garbage-chunk-writer-zero-alloc-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#eb6c36"/>
        </marker>
        <marker id="garbage-chunk-writer-zero-alloc-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <text x="40" y="32" class="eyebrow">GARBAGE · WRITE LOOP</text>
      <text x="40" y="68" class="title">garbage：1 MiB 随机块如何进入循环写出</text>
      <text x="40" y="96" class="subtitle">启动期生成一次；请求期按 chunks 重复 w.Write(randomData)，直到写满或写入报错</text>

      <!-- Connectors are emitted before all nodes. The long left return path avoids the completion oval. -->
      <line x1="480" y1="156" x2="480" y2="180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#garbage-chunk-writer-zero-alloc-pipeline-arrow)"/>
      <line x1="480" y1="244" x2="480" y2="268" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#garbage-chunk-writer-zero-alloc-pipeline-arrow)"/>
      <line x1="480" y1="332" x2="480" y2="348" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#garbage-chunk-writer-zero-alloc-pipeline-arrow)"/>
      <line x1="584" y1="400" x2="672" y2="400" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#garbage-chunk-writer-zero-alloc-pipeline-arrow-accent)"/>
      <line x1="748" y1="432" x2="748" y2="456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#garbage-chunk-writer-zero-alloc-pipeline-arrow)"/>
      <line x1="480" y1="452" x2="480" y2="496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#garbage-chunk-writer-zero-alloc-pipeline-arrow)"/>
      <path d="M748,504 V544 Q748,552 740,552 H328 Q320,552 320,544 V408 Q320,400 328,400 H376" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#garbage-chunk-writer-zero-alloc-pipeline-arrow)"/>

      <!-- Branch labels use opaque masks and remain clear of both connector and nodes. -->
      <rect x="612" y="376" width="32" height="16" rx="4" fill="#f5f5f5"/>
      <text x="628" y="388" class="branch-label" text-anchor="middle">YES</text>
      <rect x="488" y="464" width="24" height="16" rx="4" fill="#f5f5f5"/>
      <text x="500" y="476" class="branch-label" text-anchor="middle">NO</text>

      <!-- Start -->
      <ellipse cx="480" cy="132" rx="96" ry="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="132" class="node-name" text-anchor="middle">server start</text>
      <text x="480" y="148" class="tech" text-anchor="middle">package initialization</text>

      <!-- Startup random block -->
      <rect x="348" y="180" width="264" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="348" y="180" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="360" y="188" width="48" height="16" rx="4" fill="transparent" stroke="#7a8399" stroke-width="0.8"/>
      <text x="384" y="200" class="tag" text-anchor="middle">INIT</text>
      <text x="480" y="212" class="node-name" text-anchor="middle">randomData = getRandomData</text>
      <text x="480" y="232" class="tech" text-anchor="middle">1 MiB · startup initialization</text>

      <!-- Request chunk selection -->
      <rect x="348" y="268" width="264" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="348" y="268" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="360" y="276" width="56" height="16" rx="4" fill="transparent" stroke="#7a8399" stroke-width="0.8"/>
      <text x="388" y="288" class="tag" text-anchor="middle">REQUEST</text>
      <text x="480" y="300" class="node-name" text-anchor="middle">chunks = 4</text>
      <text x="480" y="320" class="tech" text-anchor="middle">ckSize &gt; 1024 → chunks = 1024</text>

      <!-- Loop decision -->
      <polygon points="480,348 584,400 480,452 376,400" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="396" class="node-name" text-anchor="middle">i &lt; chunks?</text>
      <text x="480" y="412" class="tech" text-anchor="middle">for i := 0</text>

      <!-- Focal write step -->
      <rect x="672" y="368" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="368" width="152" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="680" y="376" width="40" height="16" rx="4" fill="transparent" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="700" y="388" class="focal-tag" text-anchor="middle">WRITE</text>
      <text x="748" y="412" class="focal-name" text-anchor="middle">w.Write(randomData)</text>
      <text x="748" y="428" class="tech" text-anchor="middle">1 MiB/pass · break on error</text>

      <!-- Increment before the loop returns -->
      <rect x="672" y="456" width="152" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="456" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="680" y="464" width="40" height="16" rx="4" fill="transparent" stroke="#7a8399" stroke-width="0.8"/>
      <text x="700" y="476" class="tag" text-anchor="middle">LOOP</text>
      <text x="748" y="496" class="node-name" text-anchor="middle">i++</text>

      <!-- Normal completion -->
      <ellipse cx="480" cy="520" rx="96" ry="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="520" class="node-name" text-anchor="middle">chunks complete</text>
      <text x="480" y="536" class="tech" text-anchor="middle">response ends</text>

      <line x1="40" y1="568" x2="920" y2="568" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="588" class="legend">LEGEND · OVAL start/end · RECT action · DIAMOND loop condition · coral = write step · arrows show order and return</text>
    </svg>
  </main>
</body>
</html>
