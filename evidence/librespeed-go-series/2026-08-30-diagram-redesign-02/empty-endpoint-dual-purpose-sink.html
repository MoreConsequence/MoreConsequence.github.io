<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibreSpeed Go empty endpoint dual purpose</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 24px;
      background: #f5f5f5;
      color: #2d3142;
    }
    main { width: min(960px, 100%); }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="empty-endpoint-dual-purpose-sink-title empty-endpoint-dual-purpose-sink-desc">
      <title id="empty-endpoint-dual-purpose-sink-title">empty 端点的双重职责</title>
      <desc id="empty-endpoint-dual-purpose-sink-desc">Flowchart showing GET and POST uses of the same empty handler converging on a Discard sink, then returning either 200 keep-alive or 400 on a copy error.</desc>
      <defs>
        <style>
          .eyebrow { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 500; letter-spacing: .18em; }
          .title { fill: #2d3142; font-family: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; font-size: 28px; font-weight: 400; }
          .subtitle { fill: #4f5d75; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 400; }
          .node-name { fill: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 600; }
          .tech { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 400; }
          .tag { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 600; letter-spacing: .08em; }
          .focal-name { fill: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 600; }
          .focal-tag { fill: #eb6c36; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 600; letter-spacing: .08em; }
          .branch-label { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 600; letter-spacing: .08em; }
          .legend { fill: #4f5d75; font-family: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 8px; font-weight: 400; }
        </style>
        <marker id="empty-endpoint-dual-purpose-sink-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#4f5d75"/>
        </marker>
        <marker id="empty-endpoint-dual-purpose-sink-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#eb6c36"/>
        </marker>
        <marker id="empty-endpoint-dual-purpose-sink-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <text x="40" y="32" class="eyebrow">EMPTY · DUAL PURPOSE</text>
      <text x="40" y="68" class="title">empty：同一个 sink，承接两种测量</text>
      <text x="40" y="96" class="subtitle">GET 带空 body 走延迟路径，POST 把请求体读入 ioutil.Discard；handler 不保存上传数据</text>

      <!-- Two caller intents converge on one handler. -->
      <path d="M384,148 H432 Q440,148 440,156 V212 Q440,220 448,220 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#empty-endpoint-dual-purpose-sink-arrow)"/>
      <path d="M576,148 H528 Q520,148 520,156 V212 Q520,220 512,220 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#empty-endpoint-dual-purpose-sink-arrow)"/>
      <line x1="480" y1="224" x2="480" y2="240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#empty-endpoint-dual-purpose-sink-arrow)"/>
      <line x1="480" y1="304" x2="480" y2="324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#empty-endpoint-dual-purpose-sink-arrow)"/>
      <line x1="480" y1="396" x2="480" y2="408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#empty-endpoint-dual-purpose-sink-arrow)"/>
      <line x1="580" y1="456" x2="680" y2="456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#empty-endpoint-dual-purpose-sink-arrow)"/>
      <line x1="480" y1="504" x2="480" y2="520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#empty-endpoint-dual-purpose-sink-arrow)"/>

      <!-- Branch labels: masks sit off the connector with visible breathing room. -->
      <rect x="400" y="124" width="32" height="16" rx="4" fill="#f5f5f5"/>
      <text x="416" y="136" class="branch-label" text-anchor="middle">GET</text>
      <rect x="536" y="124" width="32" height="16" rx="4" fill="#f5f5f5"/>
      <text x="552" y="136" class="branch-label" text-anchor="middle">POST</text>
      <rect x="612" y="432" width="32" height="16" rx="4" fill="#f5f5f5"/>
      <text x="628" y="444" class="branch-label" text-anchor="middle">YES</text>
      <rect x="520" y="500" width="32" height="16" rx="4" fill="#f5f5f5"/>
      <text x="536" y="512" class="branch-label" text-anchor="middle">NO</text>

      <!-- Input intents -->
      <ellipse cx="240" cy="148" rx="144" ry="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="240" y="144" class="node-name" text-anchor="middle">GET /empty</text>
      <text x="240" y="164" class="tech" text-anchor="middle">0-byte body · ping / RTT</text>

      <ellipse cx="720" cy="148" rx="144" ry="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="720" y="144" class="node-name" text-anchor="middle">POST /empty</text>
      <text x="720" y="164" class="tech" text-anchor="middle">upload body · client counts bytes</text>

      <circle cx="480" cy="220" r="4" fill="#2d3142"/>

      <!-- Shared handler -->
      <rect x="328" y="240" width="304" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="240" width="304" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="340" y="248" width="40" height="16" rx="4" fill="transparent" stroke="#7a8399" stroke-width="0.8"/>
      <text x="360" y="260" class="tag" text-anchor="middle">HANDLER</text>
      <text x="480" y="276" class="node-name" text-anchor="middle">empty(w, r)</text>
      <text x="480" y="296" class="tech" text-anchor="middle">same function for GET + POST</text>

      <!-- Focal sink -->
      <rect x="328" y="324" width="304" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="324" width="304" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="340" y="332" width="40" height="16" rx="4" fill="transparent" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="360" y="344" class="focal-tag" text-anchor="middle">SINK</text>
      <text x="480" y="356" class="focal-name" text-anchor="middle">read to ioutil.Discard</text>
      <text x="480" y="376" class="tech" text-anchor="middle">io.Copy(ioutil.Discard, r.Body)</text>
      <text x="480" y="392" class="tech" text-anchor="middle">GET empty · POST upload body</text>

      <!-- Error branch -->
      <polygon points="480,408 580,456 480,504 380,456" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="452" class="node-name" text-anchor="middle">copy error?</text>

      <ellipse cx="780" cy="456" rx="100" ry="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="780" y="452" class="node-name" text-anchor="middle">400 Bad Request</text>
      <text x="780" y="468" class="tech" text-anchor="middle">copy error</text>

      <ellipse cx="480" cy="544" rx="128" ry="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="540" class="node-name" text-anchor="middle">200 OK · keep-alive</text>
      <text x="480" y="556" class="tech" text-anchor="middle">GET: RTT · POST: upload</text>

      <line x1="40" y1="576" x2="920" y2="576" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="592" class="legend">LEGEND · OVAL request/result · RECT shared operation · DIAMOND error branch</text>
    </svg>
  </main>
</body>
</html>
