600" text-anchor="start">J↑ = 0.3J + 0.7Δ</text><text x="656" y="396" fill="#6b6a64" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="start">J↓ = 0.8J + 0.2Δ</text><text x="80" y="488" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" text-anchor="start">这是 Worker 的估计公式；它说明响应速度与遗忘速度不同，不等于 RFC 3550 的原样实现。</text><line x1="40" y1="532" x2="920" y2="532" fill="none" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/><text x="40" y="560" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="136" y="548" width="12" height="12" rx="2" fill="#2d5a8a" stroke="#2d5a8a" stroke-width="0.8"/><text x="156" y="560" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="start">SAMPLE</text><rect x="356" y="548" width="12" height="12" rx="2" fill="#e85d3f" stroke="#e85d3f" stroke-width="0.8"/><text x="376" y="560" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', 'SFMono-Regular', monospace" font-weight="400" text-anchor="start">FOCUS</text>
