<!DOCTYPE html>
<html lang="en">
<head>

      <text x="788" y="296" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Authenticated</text>

      <text x="788" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Path=BASE/stats · MaxAge=1h</text>

      <circle cx="312" cy="392" r="5" fill="#4f5d75"/>

      <text x="688" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">key := GenerateRandomKey(32) @ init</text>
      <text x="688" y="384" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">restart → old Cookie no longer validates</text>
