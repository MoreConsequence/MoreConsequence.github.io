<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一次测速的生命周期 · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --font-sans: 'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }
    .frame { width: 100%; max-width: 960px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 24px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.15;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sequence · LibreSpeed Go · lifecycle</p>
    <h1>一次测速的完整生命周期</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
      <title id="lifecycle-title">一次测速的完整生命周期</title>
      <desc id="lifecycle-desc">Sequence diagram showing the Worker dispatching identity, download, upload, optional ping, telemetry, and status steps in time order.</desc>
      <defs>
        <marker id="lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="lifecycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
        <marker id="lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <!-- Internal title is retained in the exported SVG. -->
      <text x="40" y="32" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" font-weight="500" letter-spacing="0.18em">SEQUENCE · TEST LIFECYCLE · 59CFF12</text>
      <text x="40" y="68" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-weight="400">一次测速的完整生命周期</text>
      <text x="40" y="96" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">Worker 按 test_order 串行推进；P 只有在顺序中出现时才运行</text>

      <!-- Lifelines and activation bars are behind the messages. -->
      <line x1="136" y1="164" x2="136" y2="532" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="360" y1="164" x2="360" y2="532" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="584" y1="164" x2="584" y2="532" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="808" y1="164" x2="808" y2="532" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Message endpoints attach to the facing outer edge of an activation bar. -->
      <rect x="132" y="180" width="8" height="352" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="356" y="180" width="8" height="352" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="0.8"/>
      <rect x="580" y="204" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="580" y="256" width="8" height="72" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="580" y="352" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="580" y="424" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="804" y="456" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Optional ping fragment. The default test_order is IP_D_U, so this is conditional. -->
      <rect x="332" y="404" width="264" height="56" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="332" y="404" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="352" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="380" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">[IF P IN TEST_ORDER]</text>

      <!-- Messages: time flows top to bottom. -->
      <line x1="140" y1="188" x2="356" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="364" y1="216" x2="580" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lifecycle-arrow-link)"/>
      <line x1="580" y1="240" x2="364" y2="240" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-arrow)"/>
      <line x1="364" y1="268" x2="580" y2="268" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lifecycle-arrow-link)"/>
      <line x1="580" y1="292" x2="364" y2="292" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-arrow)"/>
      <path d="M 364 316 H 396 Q 404 316 404 324 V 332 Q 404 340 396 340 H 364" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="364" y1="364" x2="580" y2="364" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lifecycle-arrow-link)"/>
      <line x1="580" y1="388" x2="364" y2="388" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-arrow)"/>
      <line x1="364" y1="440" x2="580" y2="440" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lifecycle-arrow-link)"/>
      <line x1="364" y1="472" x2="804" y2="472" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lifecycle-arrow-link)"/>
      <line x1="804" y1="496" x2="364" y2="496" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-arrow)"/>
      <line x1="356" y1="520" x2="140" y2="520" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-arrow)"/>

      <!-- Opaque arrow-label masks. -->
      <rect x="228" y="168" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START</text>

      <rect x="420" y="196" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="206" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET /GETIP</text>

      <rect x="456" y="220" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="230" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IP JSON</text>

      <rect x="436" y="248" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="258" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">D · GARBAGE</text>

      <rect x="444" y="272" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DL ΔBYTES</text>

      <rect x="416" y="320" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="330" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200MS · SPEED</text>

      <rect x="432" y="344" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="354" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">U · POST EMPTY</text>

      <rect x="444" y="368" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="378" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UL ΔBYTES</text>

      <rect x="484" y="420" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="430" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">P · 10× EMPTY</text>

      <rect x="636" y="452" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="692" y="462" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST TELEMETRY</text>

      <rect x="540" y="476" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ID</text>

      <rect x="220" y="500" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="268" y="510" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATUS JSON</text>

      <!-- Actor boxes are painted last so message strokes never cut through them. -->
      <rect x="64" y="108" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="108" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="116" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="84" y="126" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="136" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif" text-anchor="middle">主线程</text>
      <text x="136" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">start / status</text>

      <rect x="288" y="108" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="108" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="296" y="116" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="316" y="126" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="360" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif" text-anchor="middle">Web Worker</text>
      <text x="360" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">testState + totals</text>

      <rect x="512" y="108" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="108" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="520" y="116" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="540" y="126" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
      <text x="584" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif" text-anchor="middle">测试端点</text>
      <text x="584" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">/getIP · /garbage · /empty</text>

      <rect x="736" y="108" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="108" width="144" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="744" y="116" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="764" y="126" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="808" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif" text-anchor="middle">Telemetry</text>
      <text x="808" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">results/telemetry</text>

      <!-- Legend: horizontal strip at the bottom. -->
      <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="576" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="68" y="586" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">Worker state</text>

      <rect x="180" y="576" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="200" y="586" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">Activation</text>

      <line x1="320" y1="582" x2="352" y2="582" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lifecycle-arrow-link)"/>
      <text x="364" y="586" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">HTTP call</text>

      <line x1="496" y1="582" x2="528" y2="582" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-arrow)"/>
      <text x="540" y="586" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">Return</text>

      <rect x="640" y="576" width="32" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="684" y="586" fill="#4f5d75" font-size="8" font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif">Optional step</text>
    </svg>
  </main>
</body>
</html>
