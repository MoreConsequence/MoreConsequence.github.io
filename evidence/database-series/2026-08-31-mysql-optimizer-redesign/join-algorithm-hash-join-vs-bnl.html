<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>join-algorithm-hash-join-vs-bnl</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="hj-title hj-desc">
  <title id="hj-title">关联算法进化：Block Nested Loop (BNL) vs MySQL 8.0 现代 Hash Join</title>
  <desc id="hj-desc">对比图展示 MySQL 5.7 BNL 分块嵌套循环反复全表扫被驱动表与 Buffer Pool 污染，对比 MySQL 8.0 Hash Join 的内存 Build 哈希表与单次 Probe 线性扫描的架构飞跃。</desc>
  <defs>
    <marker id="hj-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="hj-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">MULTI-TABLE JOIN EVOLUTION · BNL VS HASH JOIN</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">多表关联算法进化：BNL vs Hash Join</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">BNL (分块缓冲、重复全表扫、污染 Buffer Pool) vs MySQL 8.0 Hash Join (内存建哈希表、单次顺序探测、百倍提速)</text>

  <!-- 2 Main Columns Architecture (y=136..506, h=370) -->
  <!-- Col 1: BNL (x=40..460, w=420) -->
  <g transform="translate(40, 136)">
    <rect width="420" height="376" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="12" width="110" height="18" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="69" y="25" fill="#141413" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">LEGACY · 5.7 BNL</text>
    <text x="134" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">Block Nested Loop (BNL)</text>

    <!-- Visual Structure -->
    <rect x="14" y="42" width="392" height="80" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="64" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">分块装载 + 重复扫描机制</text>
    <text x="24" y="82" fill="#6b6a64" font-size="8.5" font-family="'Geist Mono', monospace">1. 驱动表切分成 10 块，放入 join_buffer</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">2. 每装入 1 块 ➔ 被驱动表全表扫描 1 次！</text>
    <text x="24" y="114" fill="#6b6a64" font-size="7" font-family="'Geist Mono', monospace">Total Scans: 10 Full Table Scans</text>

    <!-- Details -->
    <rect x="14" y="132" width="392" height="114" rx="4" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="154" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">严重的系统副作用：</text>
    <text x="24" y="174" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">• 时间复杂度: O(M * N) 伪笛卡尔积开销；</text>
    <text x="24" y="192" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">• 破坏 Buffer Pool: 重复大扫描刷爆 LRU 老生代；</text>
    <text x="24" y="210" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 导致全库热点数据被误淘汰，系统 P99 抖动飙升。</text>
    <text x="24" y="230" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Buffer Pool Thrashing Risk</text>

    <!-- Summary -->
    <rect x="14" y="256" width="392" height="104" rx="4" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
    <text x="24" y="278" fill="#141413" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">历史地位</text>
    <text x="24" y="298" fill="#6b6a64" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">MySQL 5.7 无索引关联的保底妥协方案。大表关联极易导致数据库直接卡死，已被 MySQL 8.0 彻底废弃替代。</text>
    <text x="24" y="322" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">Deprecated in MySQL 8.0.20+</text>
    <text x="24" y="340" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">High CPU &amp; Disk IO Penalty</text>
  </g>

  <!-- Col 2: Hash Join (x=480..920, w=440) - Focal -->
  <g transform="translate(480, 136)">
    <rect width="440" height="376" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
    <rect x="14" y="12" width="120" height="18" rx="2" fill="#e85d3f"/>
    <text x="74" y="25" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">MODERN · 8.0 HASH</text>
    <text x="144" y="26" fill="#141413" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">Hash Join (现代哈希连接)</text>

    <!-- Visual Structure -->
    <rect x="14" y="42" width="412" height="80" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="1"/>
    <text x="24" y="64" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">两阶段：Build 内存建表 + Probe 单次流式探测</text>
    <text x="24" y="82" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace">1. Build: 小表全量在内存构建 Hash Table (O(M))</text>
    <text x="24" y="100" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">2. Probe: 大表仅顺序扫描 1 次，哈希 O(1) 匹配！</text>
    <text x="24" y="114" fill="#e85d3f" font-size="7" font-family="'Geist Mono', monospace" font-weight="600">Total Scans: Exactly 1 Scan for Probe Table</text>

    <!-- Details -->
    <rect x="14" y="132" width="412" height="114" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="154" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">极致性能与稳定性飞跃：</text>
    <text x="24" y="174" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">• 时间复杂度: O(M + N) 线性极速！</text>
    <text x="24" y="192" fill="#e85d3f" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">• 0 Buffer Pool 污染: 大表单次顺序流式读过即走；</text>
    <text x="24" y="210" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">• 内存不足时自动优雅溢出为 On-Disk Hash Join。</text>
    <text x="24" y="230" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">100x Speedup Over BNL</text>

    <!-- Summary -->
    <rect x="14" y="256" width="412" height="104" rx="4" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
    <text x="24" y="278" fill="#e85d3f" font-size="9.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">现代标准生产实践</text>
    <text x="24" y="298" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">MySQL 8.0 默认连接策略。无论有无等值索引，在大数据量无索引关联时均能提供稳定可控的极致吞吐。</text>
    <text x="24" y="322" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">Linear Scalability &amp; Zero Pool Pollution</text>
    <text x="24" y="340" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace">Modern Relational Optimizer Standard</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">旧版 BNL 重复全表扫机制</text>
  <rect x="330" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="350" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">MySQL 8.0 Hash Join 单次 Probe 探测与线性加速核心</text>
</svg>
</main>
</body>
</html>
