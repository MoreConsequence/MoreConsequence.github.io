  <title id="sqlite-wal-two-writers-busy-lock-title">SQLite WAL 模式并发模型与锁冲突机制</title>

    </marker>

    <text x="16" y="264" fill="#334155" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 严禁在写事务内做网络 I/O 或大运算</text>

    <text x="16" y="166" fill="#475569" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">4. BUSY 不是排队挂起，而是即时裁决拒绝</text>

    <text x="16" y="94" fill="#0f172a" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 实测 0.06ms 极速返回</text>

    <text x="16" y="264" fill="#0284c7" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 读吞吐可随 CPU 核心无限扩展</text>
    <text x="16" y="288" fill="#475569" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 生产环境默认推荐 journal_mode=WAL</text>
