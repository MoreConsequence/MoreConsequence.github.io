<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>readview-visibility-comparison-matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; background: #f5f4ed; color: #141413; }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="rv-title rv-desc">
  <title id="rv-title">ReadView 四大可见性规则：m_ids、min_trx_id 与 max_trx_id 判定矩阵</title>
  <desc id="rv-desc">决策矩阵图展示 InnoDB ReadView 结构中 min_trx_id、max_trx_id 与 m_ids 活跃数组如何判定历史版本的可见性，以及 RC 与 RR 隔离级别在快照生成时机上的物理差异。</desc>
  <defs>
    <marker id="rv-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6a64"/>
    </marker>
    <marker id="rv-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e85d3f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f5f4ed"/>

  <!-- Header -->
  <text x="40" y="48" fill="#6b6a64" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono SC', monospace" font-weight="500" letter-spacing="0.18em">INNODB READVIEW · MVCC VISIBILITY DECISION MATRIX</text>
  <text x="40" y="84" fill="#141413" font-size="28" font-family="'Instrument Serif', 'Noto Serif SC', serif" font-weight="400">ReadView 四大可见性规则与判定矩阵</text>
  <text x="40" y="112" fill="#6b6a64" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="400">min_trx_id ➔ m_ids 活跃集合 ➔ max_trx_id 边界判定 ➔ RC (每句新建快照) vs RR (首句定格全事务)</text>

  <!-- Top: 1D Trx ID Continuum & ReadView Structure (y=136..240, h=104) -->
  <g transform="translate(40, 136)">
    <rect width="880" height="104" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
    <rect x="14" y="10" width="130" height="16" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
    <text x="79" y="21" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">READVIEW SNAPSHOT</text>
    <text x="154" y="22" fill="#141413" font-size="11" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">ReadView 内存快照数据结构与三段式边界</text>

    <!-- Visual Strip (y=34..90) -->
    <g transform="translate(14, 34)">
      <!-- Zone 1: Committed (w=260) -->
      <rect x="0" y="0" width="260" height="56" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="130" y="22" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">trx_id &lt; min_trx_id (50)</text>
      <text x="130" y="38" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">✓ 100% 可见 (快照前已提交)</text>
      <text x="130" y="49" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">历史已定格数据</text>

      <!-- Boundary 1: min_trx_id -->
      <line x1="260" y1="0" x2="260" y2="56" stroke="#e85d3f" stroke-width="2"/>

      <!-- Zone 2: Active / m_ids (w=320) - Focal -->
      <rect x="268" y="0" width="320" height="56" rx="3" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
      <text x="428" y="22" fill="#e85d3f" font-size="9" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">min_trx_id &lt;= trx_id &lt; max_trx_id</text>
      <text x="428" y="38" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">活跃未提交列表 m_ids = [50, 65, 80, 95]</text>
      <text x="428" y="49" fill="#e85d3f" font-size="7" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">若在 m_ids 中 ➔ 不可见；若不在 ➔ 可见</text>

      <!-- Boundary 2: max_trx_id -->
      <line x1="596" y1="0" x2="596" y2="56" stroke="#e85d3f" stroke-width="2"/>

      <!-- Zone 3: Future Trx (w=256) -->
      <rect x="604" y="0" width="248" height="56" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="728" y="22" fill="#141413" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">trx_id &gt;= max_trx_id (101)</text>
      <text x="728" y="38" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">✗ 绝对不可见 (未来事务)</text>
      <text x="728" y="49" fill="#6b6a64" font-size="6.5" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">快照生成之后才开启的事务</text>
    </g>
  </g>

  <!-- Bottom: 4 Visibility Rules & Timing Comparison (y=256..506, h=250) -->
  <g transform="translate(40, 256)">
    <!-- Rule 1: Creator Self (w=205) -->
    <g transform="translate(0, 0)">
      <rect width="205" height="250" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
      <rect x="10" y="10" width="60" height="16" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
      <text x="40" y="21" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">RULE 1</text>
      <text x="78" y="22" fill="#141413" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">自身写入</text>

      <rect x="10" y="36" width="185" height="74" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="18" y="56" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">trx_id == creator_trx_id</text>
      <text x="18" y="74" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">当前事务自己改动的数据</text>
      <text x="18" y="92" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">➔ 100% 始终可见！</text>

      <text x="10" y="130" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">直觉解释：</text>
      <text x="10" y="148" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">即使当前事务还未 COMMIT，</text>
      <text x="10" y="166" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">自己刚 UPDATE 的行，自己执行普通 SELECT 必须能看见。</text>
      <line x1="10" y1="178" x2="195" y2="178" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
      <text x="10" y="198" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Self-Modification Bypass</text>
      <text x="10" y="216" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Result: ALWAYS VISIBLE</text>
    </g>

    <!-- Rule 2: Past Committed (w=205) -->
    <g transform="translate(225, 0)">
      <rect width="205" height="250" rx="6" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
      <rect x="10" y="10" width="60" height="16" rx="2" fill="#f5f4ed" stroke="#141413" stroke-width="0.6"/>
      <text x="40" y="21" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">RULE 2</text>
      <text x="78" y="22" fill="#141413" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">历史已提交</text>

      <rect x="10" y="36" width="185" height="74" rx="3" fill="#f5f4ed" stroke="#141413" stroke-width="0.8"/>
      <text x="18" y="56" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">trx_id &lt; min_trx_id</text>
      <text x="18" y="74" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">在快照创建前已完成提交</text>
      <text x="18" y="92" fill="#e85d3f" font-size="8" font-family="'Geist Mono', monospace" font-weight="700">➔ 100% 稳定可见！</text>

      <text x="10" y="130" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">版本链停止回溯：</text>
      <text x="10" y="148" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">沿 DB_ROLL_PTR 回退时，</text>
      <text x="10" y="166" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">一旦碰到满足此规则的版本，立即读取该行并停止回溯！</text>
      <line x1="10" y1="178" x2="195" y2="178" stroke="rgba(20,20,19,0.16)" stroke-width="0.6"/>
      <text x="10" y="198" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">Stop Traversal Point</text>
      <text x="10" y="216" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Result: VISIBLE &amp; RETURN</text>
    </g>

    <!-- Rule 3: Active List Check (w=205) - Focal -->
    <g transform="translate(450, 0)">
      <rect width="205" height="250" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
      <rect x="10" y="10" width="60" height="16" rx="2" fill="#e85d3f"/>
      <text x="40" y="21" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">RULE 3</text>
      <text x="78" y="22" fill="#141413" font-size="10" font-family="'Geist Mono', monospace" font-weight="700">活跃区间</text>

      <rect x="10" y="36" width="185" height="74" rx="3" fill="#fffdfb" stroke="#e85d3f" stroke-width="0.8"/>
      <text x="18" y="56" fill="#e85d3f" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">min &lt;= trx_id &lt; max</text>
      <text x="18" y="74" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace">1. 若 trx_id ∈ m_ids (未提交)</text>
      <text x="18" y="88" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">   ➔ 不可见，继续回溯！</text>
      <text x="18" y="102" fill="#141413" font-size="7.5" font-family="'Geist Mono', monospace">2. 若 ∉ m_ids ➔ 已提交可见！</text>

      <text x="10" y="130" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">并发隔离核心：</text>
      <text x="10" y="148" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">区分并发运行事务的已提交与未提交状态；</text>
      <line x1="10" y1="160" x2="195" y2="160" stroke="#e85d3f" stroke-width="0.6"/>
      <text x="10" y="180" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700">O(1) 或二分查找 m_ids 数组</text>
      <text x="10" y="198" fill="#141413" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">精准杜绝脏读 (Dirty Read)</text>
      <text x="10" y="216" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Result: CONDITIONAL</text>
    </g>

    <!-- Timing: RC vs RR (w=205) - Focal -->
    <g transform="translate(675, 0)">
      <rect width="205" height="250" rx="6" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1.2"/>
      <rect x="10" y="10" width="76" height="16" rx="2" fill="#141413"/>
      <text x="48" y="21" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="700" text-anchor="middle">RC VS RR</text>
      <text x="94" y="22" fill="#141413" font-size="10" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">快照生成时机</text>

      <rect x="10" y="36" width="185" height="74" rx="3" fill="#fffdfb" stroke="#141413" stroke-width="0.8"/>
      <text x="18" y="54" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">RC (Read Committed):</text>
      <text x="18" y="70" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">每条 SELECT 均创建新 ReadView</text>
      <text x="18" y="86" fill="#141413" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="700">RR (Repeatable Read):</text>
      <text x="18" y="102" fill="#e85d3f" font-size="7.5" font-family="'Geist Mono', monospace" font-weight="600">首条 SELECT 创建后全事务沿用！</text>

      <text x="10" y="130" fill="#141413" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="600">本质差异：</text>
      <text x="10" y="148" fill="#6b6a64" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif">算法完全一致，仅快照时机不同！</text>
      <line x1="10" y1="160" x2="195" y2="160" stroke="#e85d3f" stroke-width="0.6"/>
      <text x="10" y="180" fill="#e85d3f" font-size="8" font-family="'Geist', 'Noto Sans SC', sans-serif" font-weight="700">RR 彻底实现可重复读</text>
      <text x="10" y="198" fill="#141413" font-size="7.5" font-family="'Geist', 'Noto Sans SC', sans-serif">RC 减少 ReadView 内存驻留</text>
      <text x="10" y="216" fill="#6b6a64" font-size="7.5" font-family="'Geist Mono', monospace">Creation Timing Dissection</text>
    </g>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,20,19,0.16)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6b6a64" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="552" width="12" height="12" rx="2" fill="#fffdfb" stroke="#141413" stroke-width="1"/>
  <text x="140" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">自身写入与历史已提交规则</text>
  <rect x="330" y="552" width="12" height="12" rx="2" fill="rgba(232,93,63,0.06)" stroke="#e85d3f" stroke-width="1"/>
  <text x="350" y="564" fill="#6b6a64" font-size="9" font-family="'Geist', 'Noto Sans SC', sans-serif">m_ids 活跃区间判定与 RC/RR 快照时机核心</text>
</svg>
</main>
</body>
</html>
