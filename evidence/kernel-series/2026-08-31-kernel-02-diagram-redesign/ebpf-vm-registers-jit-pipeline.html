  <title id="ebpf-vm-registers-jit-pipeline-title">eBPF 虚拟机执行流水线：从 C 源码、Verifier 验证到 JIT 原生机器码</title>
  <desc id="ebpf-vm-registers-jit-pipeline-desc">高对比度工程架构图：eBPF 程序从用户态 Clang 编译字节码、内核 Verifier 静态 DAG 安全扫描、JIT 直译物理 CPU 机器码到内核 Hook 点全速执行的全流程。</desc>

  </g>

    <text x="14" y="204" fill="#0f172a" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="600">clang -target bpf -O2</text>
    <text x="14" y="226" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 生成 64 位 RISC 字节码</text>
    <text x="14" y="248" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 包含 .text 与 .maps 节</text>

    <text x="14" y="128" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">2. 内存边界守卫检查</text>
    <text x="14" y="146" fill="#0284c7" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">   data + len &lt;= end 校验</text>
    <text x="14" y="166" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">3. 指针空值与类型追踪</text>

    <text x="14" y="204" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">4. 512B 栈深度与特权隔离</text>

    <!-- Divider -->
    <line x1="14" y1="222" x2="206" y2="222" stroke="rgba(217, 83, 30, 0.25)" stroke-width="1" />

    <!-- Sub-block 2: Safety Proof -->
    <text x="14" y="248" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">内核零崩塌数学证明</text>
    <text x="14" y="272" fill="#d9531e" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">• 静态证明：绝对不破坏内核内存</text>
    <text x="14" y="294" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 静态证明：绝对不耗尽 CPU 时钟</text>
    <text x="14" y="316" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 杜绝传统 LKM 模块野指针 Crash</text>
    <text x="14" y="340" fill="#d9531e" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">➔ 100% 审查通过，准予送入 JIT</text>

    <!-- Sub-block 1: 1:1 Mapping -->
    <text x="14" y="66" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">1:1 寄存器直译映射</text>
    <text x="14" y="90" fill="#334155" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">BPF R0 (Return) ➔ x86 RAX</text>

    <!-- Divider -->

    <text x="14" y="252" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 无解释器循环，指令直接打入 ALU</text>

    <text x="14" y="296" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 内存 W^X 权限隔离，代码段只读</text>

    <text x="14" y="340" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">常量盲化防御 Spectre 侧信道</text>
  </g>

    <text x="14" y="334" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">可观测/网络/安全闭环</text>
