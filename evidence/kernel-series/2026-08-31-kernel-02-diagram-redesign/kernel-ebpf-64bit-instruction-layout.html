<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kernel-ebpf-64bit-instruction-layout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { width: min(960px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" role="img" aria-labelledby="kernel-ebpf-64bit-instruction-layout-title kernel-ebpf-64bit-instruction-layout-desc">
  <title id="kernel-ebpf-64bit-instruction-layout-title">eBPF 64 位定长指令格式结构布局与专用寄存器模型</title>
  <desc id="kernel-ebpf-64bit-instruction-layout-desc">高对比度工程规范架构图：eBPF 8 字节（64 位）定长指令编码字段划分，以及 11 个专用寄存器 R0 至 R10 的调用约定与 x86_64 物理映射语义。</desc>

  <!-- Canvas Background -->
  <rect width="960" height="560" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(40, 38)">
    <text x="0" y="0" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">eBPF 64 位定长指令格式与专用寄存器模型</text>
    <text x="0" y="26" fill="#475569" font-size="13" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">8 字节 RISC 架构物理布局 (opcode, dst, src, off, imm) 与 11 个专用寄存器物理 ABI 零损耗映射</text>
  </g>

  <!-- Top Section: 64-bit Instruction Format Box (y=84..244, h=160) -->
  <g transform="translate(40, 84)">
    <rect width="880" height="160" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <!-- Header Badge -->
    <rect x="14" y="12" width="80" height="22" rx="4" fill="#334155" />
    <text x="54" y="27" fill="#ffffff" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">ENCODING</text>
    <text x="104" y="28" fill="#0f172a" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">64 位（8 字节）定长指令物理位域布局</text>

    <!-- Visual Bit Strip (y=44..104, h=60) -->
    <g transform="translate(14, 44)">
      <!-- opcode: 8 bits (w=134) -->
      <rect x="0" y="0" width="134" height="60" rx="4" fill="rgba(217, 83, 30, 0.08)" stroke="#d9531e" stroke-width="1.8" />
      <text x="67" y="22" fill="#d9531e" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">opcode (8-bit)</text>
      <text x="67" y="38" fill="#475569" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle">bits [0 .. 7]</text>
      <text x="67" y="52" fill="#0f172a" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">操作码 (ALU/JMP/LD)</text>

      <!-- dst_reg: 4 bits (w=96) -->
      <rect x="142" y="0" width="96" height="60" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
      <text x="190" y="22" fill="#0f172a" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">dst_reg (4b)</text>
      <text x="190" y="38" fill="#475569" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle">bits [8 .. 11]</text>
      <text x="190" y="52" fill="#d9531e" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">目标寄存器</text>

      <!-- src_reg: 4 bits (w=96) -->
      <rect x="246" y="0" width="96" height="60" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
      <text x="294" y="22" fill="#0f172a" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">src_reg (4b)</text>
      <text x="294" y="38" fill="#475569" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle">bits [12 .. 15]</text>
      <text x="294" y="52" fill="#0f172a" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">源寄存器</text>

      <!-- offset: 16 bits (w=176) -->
      <rect x="350" y="0" width="176" height="60" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
      <text x="438" y="22" fill="#0f172a" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">offset (16-bit)</text>
      <text x="438" y="38" fill="#475569" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle">bits [16 .. 31]</text>
      <text x="438" y="52" fill="#334155" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">栈/结构体有符号偏移</text>

      <!-- imm: 32 bits (w=326) -->
      <rect x="534" y="0" width="318" height="60" rx="4" fill="rgba(2, 132, 199, 0.06)" stroke="#0284c7" stroke-width="1.5" />
      <text x="693" y="22" fill="#0284c7" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">imm (32-bit Immediate Value)</text>
      <text x="693" y="38" fill="#475569" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle">bits [32 .. 63]</text>
      <text x="693" y="52" fill="#0f172a" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600" text-anchor="middle">32 位常数立即数 (或 64 位宽立即数第一部分)</text>
    </g>

    <!-- Sub-note (C Struct Def) -->
    <text x="14" y="128" fill="#0284c7" font-size="12" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="600">struct bpf_insn { __u8 code; __u8 dst_reg:4, src_reg:4; __s16 off; __s32 imm; };</text>
    <text x="14" y="146" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">严格对齐 8 字节边界，零填充开销；CPU 取指可直接按步长进行批量解码执行。</text>
  </g>

  <!-- Bottom Section: 11 Dedicated Registers Matrix (y=260..485, h=225) -->
  <g transform="translate(40, 260)">
    <!-- Reg Group 1: R0 Return (x=0..200, w=200) -->
    <g transform="translate(0, 0)">
      <rect width="200" height="225" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <rect x="12" y="12" width="36" height="22" rx="4" fill="#334155" />
      <text x="30" y="27" fill="#ffffff" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">R0</text>
      <text x="56" y="28" fill="#0f172a" font-size="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">函数返回值 / 动作</text>

      <!-- Sub-card: Verdict -->
      <rect x="12" y="44" width="176" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="20" y="64" fill="#d9531e" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700">BPF Program Verdict</text>
      <text x="20" y="82" fill="#0f172a" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">XDP_PASS / XDP_DROP</text>

      <text x="12" y="116" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">物理映射：x86_64 %rax</text>
      <text x="12" y="136" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 内核 Helper 函数返回值在 R0</text>
      <text x="12" y="156" fill="#0284c7" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="600">bpf_map_lookup_elem()</text>
      <text x="12" y="174" fill="#334155" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• Verifier 强制要求针对 R0 判空</text>
      <text x="12" y="194" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">未判空直接解引用将拒绝载入</text>
    </g>

    <!-- Reg Group 2: R1 ~ R5 Arguments (x=215..465, w=250) - Accent Focal -->
    <g transform="translate(215, 0)">
      <rect width="250" height="225" rx="8" fill="rgba(217, 83, 30, 0.04)" stroke="#d9531e" stroke-width="2" />
      <rect x="12" y="12" width="68" height="22" rx="4" fill="#d9531e" />
      <text x="46" y="27" fill="#ffffff" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">R1 ~ R5</text>
      <text x="88" y="28" fill="#d9531e" font-size="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">函数调用入参 (Args)</text>

      <!-- Sub-card: Args -->
      <rect x="12" y="44" width="226" height="52" rx="4" fill="#ffffff" stroke="rgba(217, 83, 30, 0.3)" stroke-width="1.2" />
      <text x="20" y="64" fill="#d9531e" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700">R1: Context 指针</text>
      <text x="20" y="82" fill="#0f172a" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">struct xdp_md / sk_buff</text>

      <text x="12" y="116" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">物理映射 (x86_64 Calling Conv)：</text>
      <text x="12" y="136" fill="#0284c7" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="600">R1➔%rdi  R2➔%rsi  R3➔%rdx</text>
      <text x="12" y="154" fill="#0284c7" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="600">R4➔%rcx  R5➔%r8</text>

      <line x1="12" y1="168" x2="238" y2="168" stroke="rgba(217, 83, 30, 0.25)" stroke-width="1" />
      <text x="12" y="188" fill="#d9531e" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">与标准 Linux C ABI 100% 同构！</text>
      <text x="12" y="206" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">参数传递无需物理寄存器重排，直译零损耗</text>
    </g>

    <!-- Reg Group 3: R6 ~ R9 Callee-Saved (x=480..690, w=210) -->
    <g transform="translate(480, 0)">
      <rect width="210" height="225" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
      <rect x="12" y="12" width="68" height="22" rx="4" fill="#334155" />
      <text x="46" y="27" fill="#ffffff" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">R6 ~ R9</text>
      <text x="88" y="28" fill="#0f172a" font-size="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">被调用者保存 (Callee)</text>

      <!-- Sub-card: Semantics -->
      <rect x="12" y="44" width="186" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="20" y="64" fill="#0f172a" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700">Callee-Saved Semantics</text>
      <text x="20" y="82" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">跨 Helper 函数调用保持不变</text>

      <text x="12" y="116" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">物理映射：</text>
      <text x="12" y="136" fill="#334155" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">R6➔%rbx  R7➔%r13</text>
      <text x="12" y="154" fill="#334155" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">R8➔%r14  R9➔%r15</text>
      <text x="12" y="180" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 适合存放跨调用的长生命周期变量</text>
      <text x="12" y="200" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">无需在本地栈上频繁 spill / fill 换入换出</text>
    </g>

    <!-- Reg Group 4: R10 Read-Only Stack (x=705..880, w=175) -->
    <g transform="translate(705, 0)">
      <rect width="175" height="225" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <rect x="12" y="12" width="44" height="22" rx="4" fill="#334155" />
      <text x="34" y="27" fill="#ffffff" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">R10</text>
      <text x="64" y="28" fill="#0f172a" font-size="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">只读栈帧指针</text>

      <!-- Sub-card: Stack Limit -->
      <rect x="12" y="44" width="151" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="20" y="64" fill="#d9531e" font-size="11.5" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="700">READ-ONLY STACK</text>
      <text x="20" y="82" fill="#0f172a" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">Stack Cap: 512 Bytes</text>

      <text x="12" y="116" fill="#0f172a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="700">物理映射：x86_64 %rbp</text>
      <text x="12" y="136" fill="#d9531e" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-weight="600">• 严禁直接写入 R10 指针！</text>
      <text x="12" y="156" fill="#0284c7" font-size="11" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="600">*(R10 - 8) = key;</text>
      <text x="12" y="176" fill="#475569" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">• 仅允许负向偏移寻址</text>
      <text x="12" y="196" fill="#334155" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">Verifier 静态保证栈绝不溢出</text>
    </g>
  </g>

  <!-- Legend Strip at Bottom (y=500..545) -->
  <g transform="translate(40, 508)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="0" y="24" fill="#64748b" font-size="12" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">图例规范：</text>

    <rect x="75" y="11" width="14" height="14" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="96" y="23" fill="#334155" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">通用指令结构与寄存器</text>

    <rect x="270" y="11" width="14" height="14" rx="3" fill="rgba(217, 83, 30, 0.08)" stroke="#d9531e" stroke-width="1.8" />
    <text x="291" y="23" fill="#d9531e" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">核心操作码 opcode 与参数传递核心 (R1~R5)</text>

    <rect x="600" y="11" width="14" height="14" rx="3" fill="rgba(2, 132, 199, 0.06)" stroke="#0284c7" stroke-width="1.5" />
    <text x="621" y="23" fill="#0284c7" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">32 位立即数与系统调用上下文</text>
  </g>
</svg>
</main>
</body>
</html>
