name: Service CI

on:
  push:
    branches: ["main"]
    paths:
      - "experiments/service/**"
      - ".github/workflows/service-ci.yml"
  pull_request:
    paths:
      - "experiments/service/**"
      - ".github/workflows/service-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: experiments/service

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: experiments/service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: experiments/service/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify non-empty build output
        run: test -s dist/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: service-dist-node24
          path: experiments/service/dist/
          if-no-files-found: error
