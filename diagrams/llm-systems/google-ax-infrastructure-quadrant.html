<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ax-quad-title ax-quad-desc">
  <title id="ax-quad-title">五大 AI Agent 基础设施架构流派象限权衡对比</title>
  <desc id="ax-quad-desc">以安全隔离性为纵轴、状态持久与唤醒速度为横轴，深度对比 Google AX、原生 K8s Pod、Knative、Ray 与 Temporal 的架构定位。</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#f8fafc" rx="10"/>

  <!-- Title Header -->
  <text x="40" y="42" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">五大 AI Agent 基础设施技术流派 · 象限全景对比</text>
  <text x="40" y="68" fill="#475569" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">横轴：状态持久性与亚秒唤醒速度 | 纵轴：代码沙箱执行安全性与物理内核隔离</text>

  <!-- Quadrant Coordinate Area (Origin at 480, 280) -->
  <!-- Top-Right Quadrant: High Security, Fast Resume (Target Zone) -->
  <rect x="480" y="90" width="440" height="190" fill="#f0fdf4" stroke="#4f5d75" stroke-width="1"/>
  <text x="900" y="115" fill="#15803d" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">【理想黄金区】高密、安全、瞬时复苏</text>

  <!-- Top-Left Quadrant: High Security, Slow Resume -->
  <rect x="60" y="90" width="420" height="190" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="75" y="115" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">【传统重型容器区】安全但笨重冷启动</text>

  <!-- Bottom-Left Quadrant: Low Security, Slow / No Compute Sandbox -->
  <rect x="60" y="280" width="420" height="190" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="75" y="455" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">【纯逻辑编排区】无物理沙箱底座</text>

  <!-- Bottom-Right Quadrant: Low Security, Fast Resume -->
  <rect x="480" y="280" width="440" height="190" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="900" y="455" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">【内部受信任计算区】极快但不可运行外部代码</text>

  <!-- Coordinate Axes -->
  <!-- Horizontal Axis (X) -->
  <line x1="50" y1="280" x2="930" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="930" y="272" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">状态持久与唤醒速度 (极快 / 亚秒级热复原) ►</text>
  <text x="60" y="272" fill="#64748b" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">◄ 弱 / 冷启动致命</text>

  <!-- Vertical Axis (Y) -->
  <line x1="480" y1="480" x2="480" y2="80" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="490" y="92" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">▲ 安全隔离性 (独立微内核 / 任意代码执行)</text>
  <text x="490" y="475" fill="#64748b" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">▼ 弱 / 进程级共享</text>

  <!-- 1. Node: Google AX (Focal Node, Top Right) -->
  <g transform="translate(680, 120)">
    <rect width="230" height="120" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
    <rect width="230" height="32" rx="8" fill="#fef3c7"/>
    <text x="12" y="22" fill="#eb6c36" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">★ Google AX (Agent Executor)</text>
    <text x="12" y="52" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• gVisor 独立内核沙箱 (Ring 3 拦截)</text>
    <text x="12" y="72" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 内存/磁盘亚秒级快照挂起恢复</text>
    <text x="12" y="92" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 单机 500~1000 Actors 超高密度</text>
    <text x="12" y="110" fill="#eb6c36" font-size="11" font-weight="600" font-family="ui-monospace, monospace">有状态突发 Agent 的终极形态</text>
  </g>

  <!-- 2. Node: 原生 K8s Pod (Middle Left) -->
  <g transform="translate(240, 130)">
    <rect width="210" height="95" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="12" y="24" fill="#0f172a" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">原生 Kubernetes Pod / Job</text>
    <text x="12" y="46" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• runc 共享宿主内核，隔离中等</text>
    <text x="12" y="66" fill="#eb6c36" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 30~50 Pods/Node，资源浪费 95%</text>
    <text x="12" y="85" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">适合：长周期批处理或低并发任务</text>
  </g>

  <!-- 3. Node: Knative / Serverless FaaS (Far Left) -->
  <g transform="translate(75, 200)">
    <rect width="195" height="90" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="12" y="24" fill="#0f172a" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Knative / Serverless 容器</text>
    <text x="12" y="46" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 空闲缩容至 0，无等待成本</text>
    <text x="12" y="66" fill="#eb6c36" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 冷启动 15~30s 致命，状态全丢</text>
    <text x="12" y="84" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">适合：HTTP 短生命周期无状态调用</text>
  </g>

  <!-- 4. Node: Ray Actor / Dapr (Bottom Right) -->
  <g transform="translate(680, 340)">
    <rect width="220" height="95" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="12" y="24" fill="#0f172a" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">分布式 Actor (Ray / Dapr)</text>
    <text x="12" y="46" fill="#2e5aa8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 进程/协程级微秒切换，并发极高</text>
    <text x="12" y="66" fill="#eb6c36" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 零内核隔离沙箱，严禁跑外部代码</text>
    <text x="12" y="85" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">适合：内部可信大模型分布式计算</text>
  </g>

  <!-- 5. Node: Temporal / Cadence (Bottom Left) -->
  <g transform="translate(180, 360)">
    <rect width="215" height="90" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="12" y="24" fill="#0f172a" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">工作流引擎 (Temporal / Cadence)</text>
    <text x="12" y="46" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 代码级分布式可重入重试与重放</text>
    <text x="12" y="66" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 纯逻辑状态机，无物理计算沙箱</text>
    <text x="12" y="84" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">适合：确定性业务事务（退款/订单流）</text>
  </g>

  <!-- Tradeoff Curve / Arrow connecting the spectrum -->
  <path d="M 170 240 C 230 160, 500 130, 670 160" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="430" y="160" fill="#2e5aa8" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">架构演进跃迁：从传统容器到沙箱化 Agent</text>

  <!-- Bottom Legend -->
  <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="520" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">选型核心结论：自主编程与多轮 Agent 必须同时跨越“安全内核隔离”与“亚秒挂起热复原”双重硬指标，Google AX 填补了该象限空白。</text>
</svg>
