<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 530" width="1020" height="530" role="img" aria-labelledby="trans-title trans-desc">
  <title id="trans-title">MCP 本地 stdio 管道 vs 远程 SSE/HTTP 双通道传输拓扑</title>
  <desc id="trans-desc">对比 MCP 本地标准输入输出流管道通信与云原生远程下行 SSE、上行 HTTP POST 双通道网络架构及其会话路由机制。</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="530" fill="#f8fafc" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">MCP 本地 stdio 管道 vs 云原生 SSE/HTTP 远程传输</text>
  <text x="40" y="70" fill="#475569" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">进程级高速隔离（本地开发）与 HTTP+SSE 双通道（企业分布式微服务）的双模网络拓扑</text>

  <!-- Left: Stdio Transport (Local) -->
  <rect x="40" y="95" width="455" height="350" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="95" width="455" height="34" rx="8" fill="#eff6ff"/>
  <text x="56" y="118" fill="#2e5aa8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">模式 1 · 本地 stdio 管道传输 (Process-Bound)</text>

  <!-- Host Process Box -->
  <rect x="56" y="150" width="150" height="150" rx="6" fill="#f8fafc" stroke="#2e5aa8" stroke-width="1"/>
  <text x="131" y="180" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">MCP Host</text>
  <text x="131" y="200" fill="#475569" font-size="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">(操作系统父进程)</text>
  <text x="131" y="235" fill="#64748b" font-size="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Claude Desktop</text>
  <text x="131" y="255" fill="#64748b" font-size="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Cursor / IDE 宿主</text>

  <!-- Server Process Box -->
  <rect x="325" y="150" width="150" height="150" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="1"/>
  <text x="400" y="180" fill="#115e59" font-size="13" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">MCP Server</text>
  <text x="400" y="200" fill="#475569" font-size="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">(Fork/Exec 子进程)</text>
  <text x="400" y="235" fill="#64748b" font-size="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">本地 SQLite / 文件系统</text>
  <text x="400" y="255" fill="#64748b" font-size="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">独立沙箱安全隔离</text>

  <!-- Connectors: stdin, stdout, stderr -->
  <line x1="206" y1="185" x2="325" y2="185" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <text x="265" y="180" fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">stdin (FD 0)</text>

  <line x1="325" y1="225" x2="206" y2="225" stroke="#0d9488" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="265" y="220" fill="#115e59" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">stdout (FD 1)</text>

  <line x1="325" y1="265" x2="206" y2="265" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow-accent)"/>
  <text x="265" y="260" fill="#c2410c" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">stderr (FD 2)</text>

  <!-- Stdio Protocol Rules -->
  <text x="56" y="330" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">规约底线：</text>
  <text x="56" y="352" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">1. 换行符定界 (Line-delimited JSON): 严禁未经转义的裸换行；</text>
  <text x="56" y="374" fill="#991b1b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">2. 标准错误隔离: 业务日志必须输出到 stderr，向 stdout 打日志直接摧毁报文！</text>


  <!-- Right: SSE/HTTP Transport (Remote Cloud) -->
  <rect x="525" y="95" width="455" height="350" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="525" y="95" width="455" height="34" rx="8" fill="#f0fdf4"/>
  <text x="541" y="118" fill="#115e59" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">模式 2 · 云原生 SSE + HTTP 双通道 (Remote Cloud)</text>

  <!-- Sequence inside Remote Transport -->
  <rect x="541" y="145" width="130" height="26" rx="4" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="606" y="162" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Client / API 网关</text>
  <line x1="606" y1="171" x2="606" y2="350" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="830" y="145" width="130" height="26" rx="4" fill="#f0fdf4" stroke="#0d9488" stroke-width="1"/>
  <text x="895" y="162" fill="#115e59" font-size="11" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">云端 MCP 实例 (K8s)</text>
  <line x1="895" y1="171" x2="895" y2="350" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Step 1: GET /sse -->
  <line x1="606" y1="195" x2="895" y2="195" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <text x="750" y="190" fill="#2e5aa8" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">1. GET /sse (建立下行长连接)</text>

  <!-- Step 2: SSE returns endpoint -->
  <line x1="895" y1="225" x2="606" y2="225" stroke="#0d9488" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="750" y="220" fill="#0f766e" font-size="10" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">2. HTTP 200 · data: /messages?sessionId=xyz</text>

  <!-- Step 3: POST /messages -->
  <line x1="606" y1="260" x2="895" y2="260" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="750" y="255" fill="#c2410c" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">3. POST /messages (上行 RPC 请求)</text>

  <!-- Step 4: 202 Accepted -->
  <line x1="895" y1="285" x2="606" y2="285" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="750" y="280" fill="#475569" font-size="10" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">4. HTTP 202 Accepted (异步解耦)</text>

  <!-- Step 5: SSE pushes async result -->
  <line x1="895" y1="320" x2="606" y2="320" stroke="#0d9488" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="750" y="315" fill="#115e59" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">5. SSE 异步下推结果: event: message</text>

  <!-- Remote Rules -->
  <text x="541" y="375" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">为什么是 SSE + POST？</text>
  <text x="541" y="396" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">1. 天然穿透企业防火墙与 CDN 缓存；2. 上行 POST 兼容标准无状态负载均衡；</text>
  <text x="541" y="416" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">3. 跨 Pod 会话路由借助 Redis Pub/Sub 广播总线或 sessionId 一致性哈希保活。</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="40" y="458" width="940" height="54" rx="8" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="56" y="480" fill="#1e40af" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">选型决策：</text>
  <text x="125" y="480" fill="#334155" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">本地 CLI、桌面单机 Agent 默认且强制使用 stdio（零网络端口暴露，安全性极高）；</text>
  <text x="56" y="498" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">跨机器集群、私有云微服务、多用户高并发生产网关必须采用 SSE+POST 双通道。</text>
</svg>
