<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 530" width="1020" height="530" role="img" aria-labelledby="prim-title prim-desc">
  <title id="prim-title">MCP 三大核心原语形式化契约与交互生命周期</title>
  <desc id="prim-desc">展示 Tools、Resources、Prompts 三大原语在语义、副作用与生命周期上的形式化对比，以及客户端与服务端的典型时序闭环。</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="530" fill="#f8fafc" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">MCP 三大核心原语契约与交互时序闭环</text>
  <text x="40" y="70" fill="#475569" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Tools (有副作用写操作) · Resources (只读上下文与订阅) · Prompts (工作流模板) 的形式化规范</text>

  <!-- 3 Primitives Cards (Top Half) -->
  <!-- Primitive 1: Tools -->
  <rect x="40" y="95" width="298" height="185" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <rect x="40" y="95" width="298" height="32" rx="8" fill="#fff7ed"/>
  <text x="56" y="117" fill="#c2410c" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">原语 1 · Tools (工具执行)</text>

  <text x="56" y="146" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">语义定位：</text>
  <text x="120" y="146" fill="#991b1b" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">【模型主动触发，具有副作用】</text>

  <text x="56" y="172" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">典型用例: "创建订单"、"重启 Pod"、"发送告警"</text>
  <text x="56" y="196" fill="#0f172a" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">契约模型: 严谨 JSON Schema 入参与返回值</text>
  <text x="56" y="220" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">安全要求: 必须支持人工拦截 (Human-in-the-Loop)</text>
  <text x="56" y="244" fill="#64748b" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">RPC: tools/list, tools/call</text>


  <!-- Primitive 2: Resources -->
  <rect x="361" y="95" width="298" height="185" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="361" y="95" width="298" height="32" rx="8" fill="#eff6ff"/>
  <text x="377" y="117" fill="#2e5aa8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">原语 2 · Resources (只读资源)</text>

  <text x="377" y="146" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">语义定位：</text>
  <text x="441" y="146" fill="#1e40af" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">【用户驱动上下文，绝对无副作用】</text>

  <text x="377" y="172" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">典型用例: "读取系统日志"、"获取订单快照"</text>
  <text x="377" y="196" fill="#0f172a" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">契约模型: 基于标准 URI (如 postgres://orders)</text>
  <text x="377" y="220" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">进阶特性: 支持订阅推送 (resources/subscribe)</text>
  <text x="377" y="244" fill="#64748b" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">RPC: resources/list, resources/read</text>


  <!-- Primitive 3: Prompts -->
  <rect x="682" y="95" width="298" height="185" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="682" y="95" width="298" height="32" rx="8" fill="#f0fdf4"/>
  <text x="698" y="117" fill="#115e59" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">原语 3 · Prompts (工作流模板)</text>

  <text x="698" y="146" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">语义定位：</text>
  <text x="762" y="146" fill="#115e59" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">【服务预设的最佳实践编排引导】</text>

  <text x="698" y="172" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">典型用例: "线上故障排查引导"、"代码合规审查"</text>
  <text x="698" y="196" fill="#0f172a" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">契约模型: 动态参数插值与多角色消息注入</text>
  <text x="698" y="220" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">价值产出: 固化行业领域知识，降低大模型幻觉</text>
  <text x="698" y="244" fill="#64748b" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">RPC: prompts/list, prompts/get</text>


  <!-- Bottom Half: Lifecycle Sequence Diagram -->
  <rect x="40" y="295" width="940" height="215" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="295" width="940" height="30" rx="8" fill="#f8fafc"/>
  <text x="56" y="315" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">三原语标准交互时序链路 (Sequence Lifecycle)</text>

  <!-- Lifelines -->
  <!-- Client Lifeline -->
  <rect x="180" y="335" width="160" height="26" rx="4" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="260" y="352" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">MCP Client (Host)</text>
  <line x1="260" y1="361" x2="260" y2="495" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Server Lifeline -->
  <rect x="680" y="335" width="160" height="26" rx="4" fill="#f0fdf4" stroke="#0d9488" stroke-width="1"/>
  <text x="760" y="352" fill="#115e59" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">MCP Server (Microservice)</text>
  <line x1="760" y1="361" x2="760" y2="495" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Sequence Step 1: Read Resource -->
  <line x1="260" y1="385" x2="760" y2="385" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <text x="510" y="380" fill="#2e5aa8" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">1. resources/read?uri=postgres://prod/orders/schema (读取无副作用上下文)</text>

  <!-- Sequence Step 2: Return Resource Data -->
  <line x1="760" y1="415" x2="260" y2="415" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="510" y="410" fill="#475569" font-size="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">2. 返回结构化表元数据快照 (注入大模型 Prompt 上下文)</text>

  <!-- Sequence Step 3: LLM Analysis & Tool Call -->
  <line x1="260" y1="448" x2="760" y2="448" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="510" y="443" fill="#c2410c" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">3. tools/call {"name": "apply_db_migration", "sql": "..."} (模型主动执行写操作)</text>

  <!-- Sequence Step 4: Return Tool Result -->
  <line x1="760" y1="480" x2="260" y2="480" stroke="#0d9488" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="510" y="475" fill="#115e59" font-size="11" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">4. 下游微服务事务成功提交，返回结构化执行结果: {status: "ok", txId: 9812}</text>
</svg>
