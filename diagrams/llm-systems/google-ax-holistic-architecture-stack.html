<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540" role="img" aria-labelledby="ax-arch-title ax-arch-desc">
  <title id="ax-arch-title">Google AX 体系级解题架构总览</title>
  <desc id="ax-arch-desc">展示 Google AX 的三层分层控制架构：声明式控制面原语、Agent Substrate 密集运行时、以及底层 gVisor 独立内核沙箱隔离体系。</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="540" fill="#f8fafc" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Google AX · 体系级解题架构总览</text>
  <text x="40" y="70" fill="#475569" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">声明式控制面原语 + Agent Substrate 密集运行时 + gVisor 独立内核沙箱物理隔离</text>

  <!-- Layer 1: Declarative Control Plane -->
  <rect x="40" y="95" width="940" height="125" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="95" width="940" height="34" rx="8" fill="#eff6ff"/>
  <text x="56" y="118" fill="#2e5aa8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">第一层 · 声明式控制平面 (ax.io/v1alpha1 Declarative Control Plane)</text>

  <!-- 4 Primitives -->
  <rect x="56" y="137" width="215" height="72" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="68" y="157" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Task 原语</text>
  <text x="68" y="175" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">状态机驱动执行单元</text>
  <text x="68" y="193" fill="#2e5aa8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">资源配额熔断与超时闭环</text>

  <rect x="286" y="137" width="215" height="72" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="298" y="157" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Workspace 原语</text>
  <text x="298" y="175" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">代码仓库与环境热装载</text>
  <text x="298" y="193" fill="#2e5aa8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Git 快照增量与 MCP 拓扑预热</text>

  <rect x="516" y="137" width="215" height="72" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="528" y="157" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Gateway 原语</text>
  <text x="528" y="175" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">零信任出站防线</text>
  <text x="528" y="193" fill="#eb6c36" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">动态凭据剥离与域名白名单</text>

  <rect x="746" y="137" width="220" height="72" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="758" y="157" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Model 原语</text>
  <text x="758" y="175" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">大模型统一治理中枢</text>
  <text x="758" y="193" fill="#2e5aa8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Token FinOps 硬熔断与 429 级联</text>

  <!-- Layer Connector 1->2 -->
  <line x1="510" y1="220" x2="510" y2="240" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>

  <!-- Layer 2: Agent Substrate Runtime -->
  <rect x="40" y="240" width="940" height="135" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <rect x="40" y="240" width="940" height="34" rx="8" fill="#fff7ed"/>
  <text x="56" y="263" fill="#c2410c" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">第二层 · Agent Substrate 密集运行时 (Actor 复用与超融合调度)</text>

  <rect x="56" y="282" width="445" height="82" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="72" y="304" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">高密多路复用调度引擎 (Actor Multiplexing)</text>
  <text x="72" y="324" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 彻底解耦“1 Pod 1 Agent”，单宿主 Pod 承载 <tspan font-weight="700" fill="#0f172a">500+ Agent Actors</tspan></text>
  <text x="72" y="344" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 用户态轻量级线程切换，服务器节点数缩减 87.8%，消灭 CPU 空转</text>

  <rect x="521" y="282" width="445" height="82" rx="6" fill="#fff7ed" stroke="#eb6c36" stroke-width="1"/>
  <text x="537" y="304" fill="#c2410c" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">亚秒级挂起与唤醒引擎 (Sub-second Suspend &amp; Resume)</text>
  <text x="537" y="324" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 等待 LLM 吐字或人类审批时，就地释放 CPU 调度配额，内存增量刷盘</text>
  <text x="537" y="344" fill="#eb6c36" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 首个 Token 返回时 &lt;150ms 瞬时热复苏，兼具零冷启动与 Serverless 成本</text>

  <!-- Layer Connector 2->3 -->
  <line x1="510" y1="375" x2="510" y2="395" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Layer 3: Kernel & Sandbox Defense -->
  <rect x="40" y="395" width="940" height="115" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="395" width="940" height="34" rx="8" fill="#fef2f2"/>
  <text x="56" y="418" fill="#991b1b" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">第三层 · 底层内核与沙箱防御: gVisor (runsc) 零信任物理级隔离</text>

  <rect x="56" y="437" width="445" height="62" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="72" y="459" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Sentry 用户态独立内核</text>
  <text x="72" y="479" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">接管 300+ Linux 系统调用，不触碰宿主操作系统，阻断 0-day 漏洞逃逸</text>

  <rect x="521" y="437" width="445" height="62" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="537" y="459" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Gofer 代理与文件沙箱隔离</text>
  <text x="537" y="479" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">严格虚拟化文件系统边界，防止 Agent 任意读取宿主机敏感凭据与 /proc 状态</text>
</svg>
