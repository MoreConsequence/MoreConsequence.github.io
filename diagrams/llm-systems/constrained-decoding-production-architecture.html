<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" role="img" aria-labelledby="prod-arch-title prod-arch-desc">
  <title id="prod-arch-title">生产级结构化输出与约束解码完整端到端架构拓扑</title>

    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

  <rect width="1020" height="560" fill="#f8fafc" rx="10"/>

  <text x="40" y="44" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">生产级结构化输出（Structured Outputs）端到端架构</text>
  <text x="40" y="70" fill="#475569" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">网关 Schema LRU 预编译缓存与推理集群 Continuous Batching 语法掩码协同全闭环</text>

  <rect x="40" y="95" width="940" height="58" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="95" width="220" height="58" rx="8" fill="#eff6ff"/>
  <text x="56" y="120" fill="#1e40af" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">企业下游微服务生态</text>
  <text x="56" y="138" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">订单 / 用户 / 交易中枢</text>

  <line x1="510" y1="153" x2="510" y2="175" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>

  <rect x="40" y="175" width="940" height="30" rx="6" fill="#fff7ed"/>
  <text x="56" y="195" fill="#c2410c" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">第 2 层 · AI 原生网关编译与缓存（AI Backend Gateway）</text>

  <text x="668" y="236" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">3. 协议封装与内部下发</text>

  <text x="668" y="270" fill="#2563eb" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">基于内部双向 gRPC 管道高速直连推理集群</text>

  <rect x="40" y="315" width="940" height="150" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

  <text x="70" y="377" fill="#0f766e" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">动态批处理调度器</text>
  <text x="70" y="397" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 为当前流绑定专属 Grammar Processor</text>
  <text x="70" y="415" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 隔离异构并发请求的独立状态机游标</text>
  <text x="70" y="433" fill="#115e59" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• Jump-Forward 直写固定语法键名</text>

  <rect x="350" y="355" width="290" height="96" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="364" y="377" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">GPU 显存并行掩码过滤 (SIMD)</text>

  <text x="364" y="415" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">2. 调用 Bitset[State] 并行写入 -∞</text>
  <text x="364" y="433" fill="#eb6c36" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">3. 过滤后词表仅保留语法绝对合规项</text>

  <text x="668" y="377" fill="#1e40af" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">合规子集采样与状态机步进</text>
  <text x="668" y="397" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">1. 在过滤后子集执行 Softmax 采样</text>
  <text x="668" y="415" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">2. 步进状态机游标: S_next = DFA.Next(S, tok)</text>
  <text x="668" y="433" fill="#2563eb" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">3. 实时向客户端流式输出 SSE 数据块</text>

  <text x="510" y="528" fill="#475569" font-size="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">杜绝“重试循环”与 JSON 解析异常崩溃，端到端 P99 延迟缩短 60%，直接落库 MySQL / PG / Elasticsearch</text>
