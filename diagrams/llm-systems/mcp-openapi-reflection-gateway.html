<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="1020" height="520" role="img" aria-labelledby="mcp-gw-title mcp-gw-desc">
  <title id="mcp-gw-title">OpenAPI-to-MCP 智能转换网关架构</title>
  <desc id="mcp-gw-desc">企业级 OpenAPI / gRPC 到 MCP 的动态反射网关架构拓扑，包含元数据加载、原语投影、调用拦截与安全上下文注入，实现既有微服务零改造接入 Agent 生态。</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="520" fill="#f8fafc" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">OpenAPI-to-MCP 智能转换网关架构</text>
  <text x="40" y="70" fill="#475569" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">动态反射既有微服务契约：零代码改造接入全球 Agent 宿主，打通鉴权隔离与链路追踪闭环</text>

  <!-- Left Column: Agent Host Ecosystem -->
  <rect x="40" y="95" width="220" height="400" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="95" width="220" height="34" rx="8" fill="#eff6ff"/>
  <text x="54" y="118" fill="#1e40af" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">外部 Agent 宿主生态</text>

  <rect x="54" y="145" width="192" height="54" rx="6" fill="#f8fafc" stroke="#2e5aa8" stroke-width="1"/>
  <text x="66" y="168" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Claude Desktop / App</text>
  <text x="66" y="187" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">桌面级标准 MCP 客户端宿主</text>

  <rect x="54" y="215" width="192" height="54" rx="6" fill="#f8fafc" stroke="#2e5aa8" stroke-width="1"/>
  <text x="66" y="238" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">Cursor / 研发 IDE</text>
  <text x="66" y="257" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">代码生成与辅助运维 Agent</text>

  <rect x="54" y="285" width="192" height="54" rx="6" fill="#f8fafc" stroke="#2e5aa8" stroke-width="1"/>
  <text x="66" y="308" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">自研业务 Agent 编排平台</text>
  <text x="66" y="327" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">客服 / 数据分析 / 自动化工作流</text>

  <rect x="54" y="355" width="192" height="124" rx="6" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="66" y="378" fill="#1e40af" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">标准 MCP 通信契约</text>
  <text x="66" y="398" fill="#2563eb" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">tools/list (发现可用能力)</text>
  <text x="66" y="418" fill="#2563eb" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">tools/call (安全执行工具)</text>
  <text x="66" y="438" fill="#2563eb" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">resources/read (读取快照)</text>
  <text x="66" y="460" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">通道: stdio / SSE + POST</text>


  <!-- Center Column: Reflection & Adaptation Gateway -->
  <rect x="280" y="95" width="440" height="400" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="280" y="95" width="440" height="34" rx="8" fill="#fff7ed"/>
  <text x="296" y="118" fill="#c2410c" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">OpenAPI-to-MCP 智能转换网关 (Protocol Adapter)</text>

  <!-- Step 1 -->
  <rect x="296" y="145" width="408" height="68" rx="6" fill="#fffbeb" stroke="#eb6c36" stroke-width="1"/>
  <text x="312" y="167" fill="#b45309" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">1. 动态元数据加载与解析 (OpenAPI Spec Sync)</text>
  <text x="312" y="186" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">监听注册中心与 GET /v3/api-docs，抓取最新 API 文档与注解元数据</text>
  <text x="312" y="202" fill="#78350f" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">提取: path, method, parameters, requestBody, schema</text>

  <!-- Step 2 -->
  <rect x="296" y="223" width="408" height="68" rx="6" fill="#f0fdf4" stroke="#0d9488" stroke-width="1"/>
  <text x="312" y="245" fill="#0f766e" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">2. 双向原语投影引擎 (Primitive Projection Engine)</text>
  <text x="312" y="264" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">REST 路径映射为 Tool 名称 (POST /orders -> create_order)</text>
  <text x="312" y="280" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">严格校验: requestBody 转 JSON Schema 约束，只读 GET 映射为 Resource</text>

  <!-- Step 3 -->
  <rect x="296" y="301" width="408" height="68" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="312" y="323" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">3. 调用拦截与协议转义 (Dispatcher &amp; Transpiler)</text>
  <text x="312" y="342" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">拦截 Client 发起的 tools/call 请求，执行参数与 Schema 合规校验</text>
  <text x="312" y="358" fill="#334155" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">动态反序列化入参，组装为底层微服务 HTTP/REST 或 gRPC Payload</text>

  <!-- Step 4 -->
  <rect x="296" y="379" width="408" height="100" rx="6" fill="#faf5ff" stroke="#7a8399" stroke-width="1"/>
  <text x="312" y="401" fill="#6b21a8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">4. 企业治理安全切面 (Security &amp; Tracing Interceptor)</text>
  <text x="312" y="420" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">从 Agent 握手提取会话上下文，置换为内部微服务短期 JWT 权限令牌</text>
  <text x="312" y="437" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">注入分布式追踪头 (traceparent) 与租户隔离沙箱，拦截非授权高危写操作</text>
  <text x="312" y="456" fill="#7e22ce" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">高危操作 (转账/删库) 触发挂起，自动向客户端推送 Human-in-the-Loop 确认</text>


  <!-- Right Column: Internal Microservices -->
  <rect x="740" y="95" width="240" height="400" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="740" y="95" width="240" height="34" rx="8" fill="#f1f5f9"/>
  <text x="754" y="118" fill="#334155" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">核心微服务集群 (既有资产零改造)</text>

  <rect x="754" y="145" width="212" height="66" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="768" y="169" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">用户中心 (User Service)</text>
  <text x="768" y="188" fill="#2563eb" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">GET /users/{id} (Profile)</text>
  <text x="768" y="202" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">底层协议: Spring Boot RESTful</text>

  <rect x="754" y="221" width="212" height="66" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="768" y="245" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">订单交易中心 (Order Service)</text>
  <text x="768" y="264" fill="#0d9488" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">POST /orders/refund (退款)</text>
  <text x="768" y="278" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">底层协议: gRPC / Dubbo 3.0</text>

  <rect x="754" y="297" width="212" height="66" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="768" y="321" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">支付清算中心 (Pay Service)</text>
  <text x="768" y="340" fill="#c2410c" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">POST /payments/transfer</text>
  <text x="768" y="354" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">底层协议: 双向 mTLS + 幂等重试</text>

  <rect x="754" y="373" width="212" height="106" rx="6" fill="#f0fdf4" stroke="#0d9488" stroke-width="1"/>
  <text x="768" y="396" fill="#115e59" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">架构收益与工程价值</text>
  <text x="768" y="416" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 既有微服务代码 0 改动</text>
  <text x="768" y="434" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 接口变更通过 OpenAPI 自动同步</text>
  <text x="768" y="452" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 统一 WAF、限流与全链路审计</text>

  <line x1="246" y1="242" x2="280" y2="242" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>

</svg>
