<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="1020" height="520" role="img" aria-labelledby="token-limiter-title token-limiter-desc">
  <title id="token-limiter-title">AI 流式网关两阶段 Token 限流与精准对齐架构</title>
  <desc id="token-limiter-desc">展示从请求到达网关时的 Prompt 分词预估、Redis 令牌桶原子预扣、429 熔断阻断，到流式吐字结束时依据真实 usage 报文多退少补的结算对齐全生命周期闭环。</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="520" fill="#f8fafc" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">AI 流式网关两阶段 Token 限流（Two-Phase TPM Limiting）架构</text>
  <text x="40" y="70" fill="#475569" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">解决流式输出未知长度导致的穿透击穿：Pre-flight 准入预扣与 Reconciliation 结算多退少补</text>

  <!-- Client Ingress Top Pill -->
  <rect x="360" y="95" width="300" height="36" rx="6" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="510" y="118" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">客户端发起请求: POST /chat/completions (stream=true)</text>

  <line x1="510" y1="131" x2="510" y2="150" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>


  <!-- Phase 1: Pre-flight Phase Container -->
  <rect x="40" y="150" width="940" height="125" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="150" width="940" height="32" rx="8" fill="#fff7ed"/>
  <text x="56" y="171" fill="#c2410c" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">第一阶段 · 准入预扣（Pre-flight Phase）</text>

  <!-- Step 1 Cards -->
  <rect x="56" y="192" width="280" height="70" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="70" y="214" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">1. 快速 BPE 分词与估算</text>
  <text x="70" y="233" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">输入 Prompt Token 测算: N_input</text>
  <text x="70" y="250" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">输出预估: N_output_est = min(max_tokens, Cap)</text>

  <rect x="350" y="192" width="290" height="70" rx="6" fill="#fffbeb" stroke="#eb6c36" stroke-width="1"/>
  <text x="364" y="214" fill="#b45309" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">2. 预扣配额计算公式</text>
  <text x="364" y="234" fill="#eb6c36" font-size="12" font-weight="700" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">N_reserve = N_input + α · N_output_est</text>
  <text x="364" y="251" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">经验系数 α 通常取 0.5，防范突发长生成超支</text>

  <rect x="654" y="192" width="312" height="70" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="668" y="214" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">3. 分布式 Redis 令牌桶原子预扣</text>
  <text x="668" y="233" fill="#2563eb" font-size="11" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">Bucket.Deduct(user_key, N_reserve)</text>
  <text x="668" y="250" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">基于 Lua 脚本原子执行，保证分布式零竞争</text>


  <!-- Connecting Decision Diamond / Split -->
  <line x1="510" y1="275" x2="510" y2="295" stroke="#4f5d75" stroke-width="1"/>

  <!-- Decision Branch Buttons -->
  <rect x="180" y="295" width="280" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="320" y="315" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">✗ 令牌不足: 拒绝准入 (HTTP 429)</text>
  <text x="320" y="329" fill="#dc2626" font-size="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">返回 Too Many Tokens，零 GPU 算力消耗</text>

  <rect x="560" y="295" width="280" height="42" rx="6" fill="#f0fdf4" stroke="#0d9488" stroke-width="1"/>
  <text x="700" y="315" fill="#115e59" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">✓ 令牌充足: 放行进入流式转发</text>
  <text x="700" y="329" fill="#0f766e" font-size="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">建立 SSE 管道并转发至 vLLM 推理集群</text>

  <line x1="510" y1="295" x2="320" y2="295" stroke="#dc2626" stroke-width="1"/>
  <line x1="320" y1="295" x2="320" y2="295" stroke="#dc2626" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="510" y1="295" x2="700" y2="295" stroke="#0d9488" stroke-width="1"/>
  <line x1="700" y1="295" x2="700" y2="295" stroke="#0d9488" stroke-width="1" marker-end="url(#arrow)"/>


  <!-- Downward Line from Pass to Phase 2 -->
  <line x1="700" y1="337" x2="700" y2="355" stroke="#0d9488" stroke-width="1" marker-end="url(#arrow)"/>


  <!-- Phase 2: Reconciliation Phase Container -->
  <rect x="40" y="355" width="940" height="115" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="355" width="940" height="32" rx="8" fill="#f0fdf4"/>
  <text x="56" y="171" fill="#c2410c" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">第一阶段 · 准入预扣（Pre-flight Phase）</text>
  <text x="56" y="376" fill="#115e59" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">第二阶段 · 结算对齐（Reconciliation Phase - 多退少补）</text>

  <!-- Step 2 Cards -->
  <rect x="56" y="396" width="280" height="62" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
  <text x="70" y="417" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">1. 逐字累加与捕获 [DONE]</text>
  <text x="70" y="435" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">网关监听 usage 尾包报文，获取</text>
  <text x="70" y="450" fill="#2563eb" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">模型真实总消耗: N_real_total</text>

  <rect x="350" y="396" width="290" height="62" rx="6" fill="#fffbeb" stroke="#eb6c36" stroke-width="1"/>
  <text x="364" y="417" fill="#b45309" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">2. 计算预扣差额 Δ</text>
  <text x="364" y="437" fill="#eb6c36" font-size="12" font-weight="700" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">Δ = N_reserve - N_real_total</text>
  <text x="364" y="451" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">评估预扣与真实消耗的水位偏差</text>

  <rect x="654" y="396" width="312" height="62" rx="6" fill="#f0fdf4" stroke="#0d9488" stroke-width="1"/>
  <text x="668" y="417" fill="#0f766e" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">3. Redis 令牌桶精准原子结算</text>
  <text x="668" y="435" fill="#115e59" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 若 Δ &gt; 0: <tspan font-weight="700" fill="#0d9488">Bucket.Refund(Δ)</tspan> (多扣退还)</text>
  <text x="668" y="450" fill="#991b1b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">• 若 Δ &lt; 0: <tspan font-weight="700" fill="#dc2626">Bucket.Deduct(|Δ|)</tspan> (超额补扣)</text>


  <!-- Bottom Summary Callout -->
  <rect x="40" y="480" width="940" height="30" rx="6" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="510" y="500" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">商业价值：杜绝客户端恶意构造长文本 Prompt 耗尽 Token 额度，实现毫厘不差的生产级按量计费与租户配额防护。</text>

</svg>
