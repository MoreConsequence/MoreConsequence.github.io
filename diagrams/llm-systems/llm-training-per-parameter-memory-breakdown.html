<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" width="1020" height="480" role="img" aria-labelledby="mem-title mem-desc">
  <title id="mem-title">大模型训练单参数显存开销解剖 (16 ~ 18 Bytes 精算模型)</title>
  <desc id="mem-desc">展示大模型在混合精度与 AdamW 优化器下每个参数的显存占用比例，包括模型权重、梯度、优化器状态及激活值开销。</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="480" fill="#f8fafc" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" fill="#0f172a" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">大模型分布式训练单参数显存开销解剖 (16 ~ 18 Bytes 精算模型)</text>
  <text x="40" y="70" fill="#475569" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">以 FP16/BF16 混合精度与 AdamW 优化器为例：优化器状态独占 75% 静态显存空间</text>

  <!-- Visual Memory Bar Container -->
  <rect x="40" y="95" width="940" height="110" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="56" y="122" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">单参数物理存储切片 (以 16 字节静态底盘为例)</text>

  <!-- Segment 1: Weights 2B (12.5% = 117.5px) -->
  <rect x="56" y="135" width="115" height="52" rx="4" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="113" y="157" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">权重 W (FP16)</text>
  <text x="113" y="175" fill="#3b82f6" font-size="11" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">2 Bytes (12.5%)</text>

  <!-- Segment 2: Gradients 2B (12.5% = 115px) -->
  <rect x="177" y="135" width="115" height="52" rx="4" fill="#f0fdf4" stroke="#0d9488" stroke-width="1"/>
  <text x="234" y="157" fill="#115e59" font-size="13" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">梯度 G (FP16)</text>
  <text x="234" y="175" fill="#0d9488" font-size="11" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">2 Bytes (12.5%)</text>

  <!-- Segment 3: AdamW Optimizer 12B (75% = 490px) -->
  <rect x="298" y="135" width="490" height="52" rx="4" fill="#fff7ed" stroke="#eb6c36" stroke-width="1"/>
  <text x="543" y="155" fill="#c2410c" font-size="13" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">AdamW 优化器状态 (32位高精度 Master Weights + 动量 Momentum + 方差 Variance)</text>
  <text x="543" y="173" fill="#ea580c" font-size="11" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">FP32 主权重 4B  +  FP32 一阶动量 4B  +  FP32 二阶方差 4B  =  12 Bytes (75.0%)</text>

  <!-- Segment 4: Activation Memory (Dotted) -->
  <rect x="794" y="135" width="170" height="52" rx="4" fill="#f8fafc" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="879" y="157" fill="#475569" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">运行时前向激活值</text>
  <text x="879" y="175" fill="#64748b" font-size="11" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">~2 ~ 4 Bytes / Param</text>

  <!-- 3 Detailed Column Cards -->
  <!-- Card 1: 内存分项解析 -->
  <rect x="40" y="222" width="298" height="232" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="222" width="298" height="34" rx="8" fill="#eff6ff"/>
  <text x="56" y="244" fill="#2e5aa8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">1. 单参数显存分项构成</text>

  <text x="56" y="280" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">模型权重 (FP16/BF16)：</text>
  <text x="56" y="298" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">每个参数 2 字节，用于前向传播 GEMM。</text>

  <text x="56" y="328" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">梯度张量 (FP16/BF16)：</text>
  <text x="56" y="346" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">每个参数 2 字节，反向传播链式求导产生。</text>

  <text x="56" y="376" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">优化器状态 (AdamW FP32)：</text>
  <text x="56" y="394" fill="#c2410c" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">12 字节！防止梯度微小累加时数值下溢。</text>
  <text x="56" y="412" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">静态基础开销合计：16 字节 / 每个参数。</text>
  <text x="56" y="430" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">加激活值常按 18~20 字节作为规划基准。</text>

  <!-- Card 2: 175B 规模物理绝境 -->
  <rect x="361" y="222" width="298" height="232" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="361" y="222" width="298" height="34" rx="8" fill="#fef2f2"/>
  <text x="377" y="244" fill="#991b1b" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">2. 175B 模型物理绝境精算</text>

  <text x="377" y="280" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">静态存储绝对值：</text>
  <text x="377" y="298" fill="#991b1b" font-size="12" font-weight="600" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">175B × 18 Bytes ≈ 3,150 GB (3.15 TB)</text>

  <text x="377" y="328" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">H100 (80GB) 显存缺口：</text>
  <text x="377" y="346" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">仅静态放下就需要 ⌈3150 / 80⌉ ≈ 40 张卡！</text>

  <text x="377" y="376" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">单卡绝境结论：</text>
  <text x="377" y="394" fill="#991b1b" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">哪怕 Batch Size = 1，单卡连 1/40 都塞不下。</text>
  <text x="377" y="412" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">未计入 KV Cache 与反向传播中间激活值。</text>
  <text x="377" y="430" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">结论：分布式模型切分是唯一的物理生路。</text>

  <!-- Card 3: 架构演进与切分启示 -->
  <rect x="682" y="222" width="298" height="232" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="682" y="222" width="298" height="34" rx="8" fill="#fff7ed"/>
  <text x="698" y="244" fill="#c2410c" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">3. 架构演进与切分启示</text>

  <text x="698" y="280" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">切分启示 1 · 优化器是头号瓶颈：</text>
  <text x="698" y="298" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">优化器占 75% 显存，推动 ZeRO-1 诞生。</text>

  <text x="698" y="328" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">切分启示 2 · 单机内切矩阵 (TP)：</text>
  <text x="698" y="346" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">单卡算力有限，Megatron-LM 按行列分拆。</text>

  <text x="698" y="376" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">切分启示 3 · 跨机器切流水线 (PP)：</text>
  <text x="698" y="394" fill="#c2410c" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">按 Transformer 深度切层，规避跨机通信。</text>
  <text x="698" y="412" fill="#475569" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">全集群 3D 拓扑：TP × PP × DP 协同发力。</text>
  <text x="698" y="430" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">实现数万卡 GPU 算力利用率 (MFU) 最大化。</text>
</svg>
