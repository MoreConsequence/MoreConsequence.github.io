<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="pool-title pool-desc">
<title id="pool-title">边缘动态请求终结与私有骨干预热长连接池复用拓扑</title>
<desc id="pool-desc">架构图：北京客户端经城域边缘 PoP 本地 4ms 完成 TCP/TLS 终结，再通过私有骨干预热 HTTP/2 多路复用长连接池零握手回源至美东源站；连接分段隔离使纯动态 API 的 TTFB 从 560ms 降至 187ms。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
  
  
  
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<!-- Header -->
<text x="40" y="28" fill="#2d3142" font-size="16" font-weight="400" font-family="'Instrument Serif', serif">边缘动态请求终结与私有骨干预热长连接池复用</text>
<text x="40" y="48" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" letter-spacing="0.02em">客户端 → 边缘 PoP 本地终结(4ms) → HTTP/2 多路复用长连接池零握手回源 → 源站 · TTFB = 3×4 + 155 + 20 = 187ms（−67%）</text>
<!-- Connectors (drawn before nodes) -->
<line x1="208" y1="156" x2="292" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="468" y1="156" x2="520" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="688" y1="156" x2="768" y2="156" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<!-- Connector labels with mask (8px gap above line) -->
<rect x="226" y="136" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="250" y="145" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">TCP+TLS 4ms</text>
<rect x="470" y="136" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="492" y="145" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">POST 4ms</text>
<rect x="700" y="136" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="728" y="145" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">0-RTT 155ms</text>
<!-- Node: Client -->
<g>
  <rect x="32" y="116" width="176" height="80" rx="6" fill="#f5f5f5"/><rect x="32" y="116" width="176" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="40" y="124" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/><text x="54" y="133" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="120" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">北京客户端</text>
  <text x="120" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS4134 · 198.51.100.1</text>
</g>
<!-- Node: Edge PoP (Local Leg termination) -->
<g>
  <rect x="292" y="116" width="176" height="80" rx="6" fill="#f5f5f5"/><rect x="292" y="116" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="300" y="124" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/><text x="316" y="133" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
  <text x="380" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">北京边缘 PEK-PoP</text>
  <text x="380" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Local Leg 终结 · RTT 4ms</text>
</g>
<!-- Node: Pre-warmed Connection Pool (focal, coral) -->
<g>
  <rect x="520" y="104" width="168" height="104" rx="6" fill="#f5f5f5"/><rect x="520" y="104" width="168" height="104" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="528" y="112" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/><text x="544" y="121" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POOL</text>
  <text x="604" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">私有骨干预热连接池</text>
  <text x="604" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">H2 多路复用 · Keep-Alive</text>
  <!-- multiplexed streams over one pipe -->
  <line x1="536" y1="166" x2="672" y2="166" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="536" y1="176" x2="672" y2="176" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="536" y1="186" x2="672" y2="186" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="536" y="200" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">S1</text>
  <text x="560" y="200" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">S2</text>
  <text x="584" y="200" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">S3 … 数千 Stream</text>
</g>
<!-- Node: Origin -->
<g>
  <rect x="768" y="116" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="768" y="116" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="776" y="124" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/><text x="796" y="133" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORIGIN</text>
  <text x="848" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">美东源站 us-east-1</text>
  <text x="848" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DB/微服务 · Tcalc 20ms</text>
</g>
<!-- Bottom note card -->
<g>
  <rect x="32" y="240" width="896" height="96" rx="6" fill="#f5f5f5"/><rect x="32" y="240" width="896" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <rect x="40" y="248" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/><text x="72" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPLIT</text>
  <text x="40" y="278" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif">连接分段隔离（Connection Splitting）</text>
  <text x="40" y="294" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">• Local Leg：客户端 ↔ 边缘 4ms 终结，消灭跨洋 2 次 TCP/TLS 握手往返</text>
  <text x="40" y="310" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">• Backhaul Leg：边缘 ↔ 源站复用既有活跃 HTTP/2 管道，分配 Stream ID 即发，回源建连 = 0ms</text>
  <text x="40" y="326" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist', sans-serif">→ 纯动态 API TTFB = 3×4 + 155 + 20 = 187ms（较直连 560ms 降 67%）</text>
</g>

<line x1="40" y1="360" x2="920" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

<line x1="252" y1="393" x2="288" y2="393" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text x="296" y="397" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">零握手回源转发</text>

<rect x="636" y="388" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="658" y="397" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">私有骨干专网</text>
</svg>
