<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>按「谁已经观测到它」分三级</title>
<style>body{margin:0;background:#f5f5f5}svg{display:block;margin:0 auto}</style>
</head>
<body>
<svg viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rollback-side-effect-visibility-levels-title rollback-side-effect-visibility-levels-desc"><title id="rollback-side-effect-visibility-levels-title">副作用的可见性三级</title><desc id="rollback-side-effect-visibility-levels-desc">副作用按谁已经观测到它分三级：L1 内部未提交，观测者只有执行事务本身，可无损撤销；L2 已提交未外泄，同系统其他事务可见，需显式逆操作；越过系统边界后是 L3，消息已投递、用户已看见，撤销在语义上等于发布一条新事实。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">按「谁已经观测到它」分级，不按「有没有状态」</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">数据库有事务，是整个系统里最容易回滚的一层</text>

<text x="48" y="100" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">等级</text>
<text x="200" y="100" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">谁已经观测到</text>
<text x="668" y="100" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">可逆性</text>

<line x1="72" y1="124" x2="72" y2="308" stroke="#7a8399" stroke-width="1" marker-end="url(#arrow)"/>
<text x="60" y="220" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" transform="rotate(-90 60 220)" text-anchor="middle" letter-spacing="0.10em">可逆性递减</text>

<rect x="104" y="116" width="800" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="124" y="148" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">L1</text>
<text x="164" y="149" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">内部未提交</text>
<text x="200" y="176" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">事务内、内存里、还没投递</text>
<text x="200" y="196" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">观测者：只有执行它的那一个事务，没有任何外部观察者</text>
<text x="668" y="176" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">可无损撤销</text>
<text x="668" y="196" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">DBMS 保证，不需要你写代码</text>

<rect x="104" y="284" width="800" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="124" y="316" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">L2</text>
<text x="164" y="317" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">已提交，但未外泄</text>
<text x="200" y="344" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">写进库了，但没有人从系统外部读过</text>
<text x="200" y="364" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">观测者：同一系统内的其他事务，以及你控制之下的进程</text>
<text x="668" y="344" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">需显式逆操作</text>
<text x="668" y="364" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">盲目恢复旧值会覆盖他人改动</text>

<!-- system boundary between L2 and L3 -->
<line x1="104" y1="462" x2="904" y2="462" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="904" y="455" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end">系统边界：越过这条线，撤销变成发布一条新事实</text>

<rect x="104" y="466" width="800" height="52" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<text x="124" y="487" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">L3</text>
<text x="164" y="488" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">已越过系统边界</text>
<text x="424" y="487" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">消息已投递、通知已发出、用户已看见——外部观测者不可撤回</text>
<text x="904" y="512" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">可逆性：语义上不可撤销</text>

</svg>
</body>
</html>
