<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>取证系统的最小可工作集</title>
<style>body{margin:0;background:#f5f5f5}svg{display:block;margin:0 auto}</style>
</head>
<body>
<svg viewBox="0 0 960 500" width="960" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mfrfTitle mfrfDesc">
<title id="mfrfTitle">监控告警成功不等于事故复盘能成立</title>
<desc id="mfrfDesc">一笔支付请求同时走两条路。上面是监控路径：请求结束打点，告警能响，但告警响起来之后值班同学没有线索去拼完整链路。下面是取证路径：同一笔请求能否被复盘，取决于 request id 贯穿、append-only 事件日志、可重放查询路径三件事是否同时具备。任一缺失，复盘就会断在那个断点。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">监控告警响 ≠事故复盘能成立</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">一笔请求同时走两条路，下面这条断在三件事的任意一处，复盘就拼不起来了</text>

<!-- left input -->
<rect x="48" y="200" width="128" height="80" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="112" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">一笔请求</text>
<text x="112" y="254" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">支付订单 #8172</text>

<!-- top path: monitoring -->
<path d="M 176 218 V 140 H 376 V 140" fill="none" stroke="#4f5d75" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="216" y="92" width="140" height="48" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="286" y="112" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">指标聚合</text>
<text x="286" y="128" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">成功率 ↓</text>

<rect x="376" y="116" width="148" height="48" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
<text x="450" y="136" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">告警</text>
<text x="450" y="152" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">PagerDuty 响</text>

<!-- monitoring gap callout -->
<text x="450" y="184" fill="#7a8399" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">↑ 告警成功 ≠ 复盘成功</text>

<!-- bottom path: forensics three prerequisites -->
<path d="M 176 264 V 360 H 376 V 360" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>

<!-- three prerequisite boxes -->
<rect x="376" y="328" width="176" height="64" rx="4" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
<text x="464" y="352" fill="#2e5aa8" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">① request id</text>
<text x="464" y="372" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">跨层贯穿</text>

<rect x="376" y="396" width="176" height="64" rx="4" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
<text x="464" y="420" fill="#2e5aa8" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">② append-only 事件日志</text>
<text x="464" y="442" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">每次状态变迁落一笔</text>

<rect x="376" y="296" width="176" height="0" fill="none"/>

<!-- third prereq above to look better balanced: re-route -->
<rect x="376" y="240" width="176" height="64" rx="4" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
<text x="464" y="264" fill="#2e5aa8" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">③ 可重放查询路径</text>
<text x="464" y="284" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">从事件日志查不靠聚合</text>

<!-- three-branch input arrows from "一笔请求" to each prereq box via shared input column -->
<path d="M 176 240 L 240 240 V 264 H 376" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 176 240 L 240 240 V 352 H 376" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 176 240 L 240 240 V 416 H 376" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>

<!-- final result -->
<rect x="600" y="316" width="312" height="100" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="616" y="340" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">三件齐</text>
<text x="616" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">可重放：</text>
<text x="616" y="378" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">"那笔 502 之后还发生了什么"</text>
<text x="616" y="402" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">能查到、能回答、能复盘</text>

<rect x="600" y="116" width="312" height="48" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="616" y="138" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">三件不齐</text>
<text x="616" y="156" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">监控响，事故却说不清</text>

<!-- arrows from prereqs to result -->
<path d="M 552 264 H 600 V 340" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 552 352 H 600 V 360" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 552 416 H 600 V 380" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-linejoin="round" marker-end="url(#arrow)"/>

<!-- arrow from alert to gap callout -->
<path d="M 524 140 L 600 140 V 116" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="3,3" stroke-linejoin="round" marker-end="url(#arrow)"/>

<!-- legend -->
<line x1="48" y1="476" x2="912" y2="476" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="48" y="494" fill="#4f5d75" font-size="9" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">三条蓝箭头任一缺失，对应那一栏就只回告警、不回复盘</text>
</svg>
</body>
</html>
