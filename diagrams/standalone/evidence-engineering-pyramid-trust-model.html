<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工程可信度阶梯：从主观臆断到生产闭环</title>
<style>body{margin:0;background:#f5f5f5}svg{display:block;margin:0 auto}</style>
</head>
<body>
<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evidence-engineering-pyramid-trust-model-title evidence-engineering-pyramid-trust-model-desc"><title id="evidence-engineering-pyramid-trust-model-title">工程可信度金字塔</title><desc id="evidence-engineering-pyramid-trust-model-desc">可信度四级金字塔：底座 L0 是经验主观臆断，零证据效力；L1 是本地原型验证，约三成效力但缺真实负载；L2 是严格控制变量与统计检验的复现实验，任何人可复现；塔尖 L3 是生产全链路遥测金标准，合并依据只在这一层。证据效力随层数上升，权威随宽度递减。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">工程可信度阶梯：从主观臆断到生产闭环</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">层数越高越窄，证据效力越高；合并代码的依据只在塔尖那一层</text>

<!-- left axis -->
<line x1="72" y1="472" x2="72" y2="128" stroke="#7a8399" stroke-width="1" marker-end="url(#arrow)"/>
<text x="58" y="300" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" transform="rotate(-90 58 300)" text-anchor="middle" letter-spacing="0.10em">证据效力</text>

<!-- L0 base (widest) -->
<polygon points="120,472 840,472 800,396 160,396" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="480" y="428" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">L0 · 经验主观臆断</text>
<text x="480" y="450" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">"我觉得加索引会快" · 0 测量数据 · 禁止作为合并依据</text>
<text x="852" y="440" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">0% 证据效力</text>

<!-- L1 -->
<polygon points="160,392 800,392 760,316 200,316" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="480" y="348" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">L1 · 本地原型验证</text>
<text x="480" y="370" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">demo 跑通 · 单机单线程 · 距生产仍有巨大鸿沟</text>
<text x="812" y="360" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">≈30% 证据效力</text>

<!-- L2 -->
<polygon points="200,312 760,312 720,236 240,236" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="480" y="268" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">L2 · 严密基准与复现</text>
<text x="480" y="290" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">控制变量 · 多轮采样与统计检验 · raw 落盘 · 任何人可 100% 复现</text>
<text x="772" y="280" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">接近生产，仍非线上</text>

<!-- L3 apex (focal) -->
<polygon points="240,232 720,232 700,156 260,156" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
<text x="480" y="188" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">L3 · 生产全链路遥测</text>
<text x="480" y="210" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">真实负载 · 真实失败模式 · 金标准</text>
<text x="732" y="200" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">合并依据在这里</text>

<!-- progression annotations -->
<line x1="480" y1="128" x2="480" y2="148" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<text x="492" y="140" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">每上一级都要付出真实的测量与复现成本</text>

<!-- bottom takeaway -->
<line x1="48" y1="500" x2="912" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="48" y="530" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">引用任何数字之前先问：它在第几层？L0 的结论配不上任何一次上线决策</text>

</svg>
</body>
</html>
