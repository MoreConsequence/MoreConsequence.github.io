<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>兼容性的四个正交层次</title>
<style>body{margin:0;background:#f5f5f5}svg{display:block;margin:0 auto}</style>
</head>
<body>
<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dufTitle dufDesc">
<title id="dufTitle">兼容性的四个正交层次</title>
<desc id="dufDesc">兼容性混杂了四件互不相关的事。第一层语法兼容，由编译器强制守卫，破坏即编译失败。第二层语义兼容，由测试部分守卫，只覆盖测到的行为。第三层资源特征兼容，指堆分配量、锁与连接的持有时长、文件描述符与 goroutine 的生命周期，没有任何自动化守卫。第四层并发与节拍兼容，指重试次数、批处理大小、keepalive 与轮询频率，同样没有守卫且更隐蔽。前两层是正确性属性，破坏会当场失败；后两层是只在负载下才显现的属性，升级事故几乎全部来自后两层。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">「兼容」这个词混杂了四件互不相关的事</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">工具链能守住前两层，而升级事故几乎全部来自后两层</text>

<text x="68" y="90" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.12em">兼容层次</text>
<text x="300" y="90" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.12em">漂移的内容</text>
<text x="700" y="90" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.12em">自动化守卫</text>

<!-- layer 1 -->
<rect x="48" y="100" width="864" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<line x1="286" y1="116" x2="286" y2="168" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="686" y1="116" x2="686" y2="168" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="68" y="130" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">第 1 层</text>
<text x="68" y="158" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">语法兼容</text>
<text x="300" y="134" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">函数签名、类型、导出符号</text>
<text x="300" y="156" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">破坏它的代价是编译失败</text>
<text x="700" y="130" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">守卫</text>
<text x="700" y="156" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">编译器（强制）</text>

<!-- layer 2 -->
<rect x="48" y="190" width="864" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<line x1="286" y1="206" x2="286" y2="258" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="686" y1="206" x2="686" y2="258" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="68" y="220" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">第 2 层</text>
<text x="68" y="248" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">语义兼容</text>
<text x="300" y="224" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">输入输出、错误分类、边界行为</text>
<text x="300" y="246" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">没写进测试的那部分没有守卫</text>
<text x="700" y="220" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">守卫</text>
<text x="700" y="246" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">测试（只覆盖测到的）</text>

<!-- guard boundary -->
<rect x="400" y="280" width="180" height="14" fill="#f5f5f5"/>
<text x="490" y="291" fill="#eb6c36" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">编译器与测试的覆盖到此为止</text>
<line x1="48" y1="300" x2="912" y2="300" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6 4"/>

<!-- layer 3 (accent) -->
<rect x="48" y="312" width="864" height="84" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<line x1="286" y1="328" x2="286" y2="380" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="686" y1="328" x2="686" y2="380" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="68" y="342" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">第 3 层</text>
<text x="68" y="370" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">资源特征兼容</text>
<text x="300" y="346" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">堆分配量、锁与连接的持有时长</text>
<text x="300" y="368" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">文件描述符与 goroutine 的生命周期</text>
<text x="700" y="342" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">守卫</text>
<text x="700" y="368" fill="#eb6c36" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">无</text>

<!-- layer 4 (accent) -->
<rect x="48" y="402" width="864" height="84" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
<line x1="286" y1="418" x2="286" y2="470" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="686" y1="418" x2="686" y2="470" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="68" y="432" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">第 4 层</text>
<text x="68" y="460" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">并发与节拍兼容</text>
<text x="300" y="436" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">重试次数、批处理大小</text>
<text x="300" y="458" fill="#4f5d75" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">keepalive 与轮询频率，只在空闲时显形</text>
<text x="700" y="432" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">守卫</text>
<text x="700" y="458" fill="#eb6c36" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">无</text>

<!-- footer -->
<line x1="48" y1="514" x2="912" y2="514" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="48" y="536" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">前两层是正确性属性，破坏会当场失败；后两层是「只在负载下才显现」的属性，而测试环境没有负载。</text>
<text x="48" y="552" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">升级前问的不是「测试绿没绿」，是「这次改了哪个维度，那个维度有没有指标」</text>

</svg>
</body>
</html>
