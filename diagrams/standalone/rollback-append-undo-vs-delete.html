<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>删除式撤销 vs 追加式撤销（红冲）</title>
<style>body{margin:0;background:#f5f5f5}svg{display:block;margin:0 auto}</style>
</head>
<body>
<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rollback-append-undo-vs-delete-title rollback-append-undo-vs-delete-desc"><title id="rollback-append-undo-vs-delete-title">两种撤销方式对比</title><desc id="rollback-append-undo-vs-delete-desc">方式 A 删除式撤销试图让旧事没发生过：账面清空，但审计链断裂、已读过它的观察者不会同步忘记、还会覆盖他人的有效改动。方式 B 追加式撤销（红冲）新增一条方向相反的凭证：两条记录并存、净额为零，证据链可重建，撤销路径可与正向路径共用同一套投递保证。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">撤销不是让旧事没发生过，是发布一条新的事实</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">财务领域的红冲是这个模式的成熟形态，值得直接借用</text>

<!-- Panel A: delete-style -->
<rect x="48" y="92" width="424" height="332" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
<rect x="48" y="92" width="424" height="36" rx="8" fill="#ffffff"/>
<text x="260" y="116" fill="#2d3142" font-size="12" font-weight="700" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">✕ 方式 A · 删除式撤销</text>
<text x="64" y="152" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">试图让旧事「没发生过」</text>
<rect x="64" y="168" width="392" height="76" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="80" y="192" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">T0   +¥50    发放券</text>
<text x="80" y="214" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">T1   ✕       删除这条记录</text>
<text x="80" y="234" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">账上结果：空</text>
<text x="64" y="272" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">代价</text>
<text x="64" y="294" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 审计链断裂：无法证明它存在过</text>
<text x="64" y="314" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 已读过它的观察者不会同步忘记</text>
<text x="64" y="334" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 期间他人的有效改动会被一起覆盖</text>
<text x="64" y="366" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">撤销动作本身制造了新的信息损失</text>

<!-- Panel B: append-style (preferred) -->
<rect x="488" y="92" width="424" height="332" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<rect x="488" y="92" width="424" height="36" rx="8" fill="#ffffff"/>
<text x="700" y="116" fill="#2d3142" font-size="12" font-weight="700" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">✓ 方式 B · 追加式撤销（红冲）</text>
<text x="504" y="152" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">承认撤销本身是一件新事</text>
<rect x="504" y="168" width="392" height="76" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="520" y="192" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">T0   +¥50    发放券</text>
<text x="520" y="214" fill="#2d3142" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">T1   −¥50    红冲（新凭证）</text>
<text x="520" y="234" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">账上结果：两条并存，净额 ¥0</text>
<text x="504" y="272" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">收益</text>
<text x="504" y="294" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 两条都在，事故后能重建证据链</text>
<text x="504" y="314" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 净额由对账口径算出，不覆盖他人改动</text>
<text x="504" y="334" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">· 撤销路径可与正向路径共用同一套投递保证</text>
<text x="504" y="366" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">外部已观测到的事实：以新事实修正，而非抹除</text>

<!-- hard requirement strip -->
<rect x="48" y="448" width="864" height="72" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="64" y="476" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">方式 B 的硬要求在数据模型上：同一笔业务必须允许挂多条方向相反的事实，并且要有明确的净额口径</text>
<text x="64" y="500" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">这个得在建表时就满足——事故现场改不动数据模型，只能在建模阶段留好位置</text>

</svg>
</body>
</html>
