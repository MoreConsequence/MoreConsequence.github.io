<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>默认值审计流程</title>
<style>
  body { margin: 0; background: #f5f5f5; }
  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 400" width="960" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hdafTitle hdafDesc">
<title id="hdafTitle">默认值审计流程：三问筛选与可发现性排序</title>
<desc id="hdafDesc">从列出未显式设置的参数开始，依次问三件事：值现在是什么、错了症状长什么样、多久能发现。症状可观测的参数保留默认值，不可观测的才进入显式化候选。上游升级后回到第一问重跑，用于捕获默认值漂移。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="32" y="38" fill="#2d3142" font-size="19" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">审计的产物是一张台账，不是一份更长的配置文件</text>
<text x="32" y="60" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">目标不是列全，是排序；排序的轴是可发现性，不是重要性</text>

<!-- A -->
<rect x="32" y="96" width="192" height="72" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="52" y="122" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">起点</text>
<text x="52" y="144" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">列出未显式设置</text>
<text x="52" y="160" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">的参数</text>

<!-- Q1 -->
<rect x="264" y="96" width="192" height="72" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="284" y="122" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">第一问</text>
<text x="284" y="144" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">值现在是什么？</text>
<text x="284" y="160" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">从运行中的实例读，不从文档读</text>

<!-- Q2 -->
<rect x="496" y="96" width="192" height="72" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="516" y="122" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">第二问</text>
<text x="516" y="144" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">错了症状长什么样？</text>
<text x="516" y="160" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">答不出即进入候选</text>

<!-- Q3 -->
<rect x="728" y="96" width="200" height="72" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="748" y="122" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">第三问 · 排序轴</text>
<text x="748" y="144" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">多久能发现？</text>
<text x="748" y="160" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">指标能覆盖，还是要等投诉</text>

<!-- arrows row 1 -->
<line x1="224" y1="132" x2="264" y2="132" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="456" y1="132" x2="496" y2="132" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="688" y1="132" x2="728" y2="132" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

<!-- branch from Q3 -->
<path d="M 792 168 L 792 200 L 648 200 L 648 248" fill="none" stroke="#7a8399" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 856 168 L 856 200 L 840 200 L 840 248" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- O1 -->
<rect x="560" y="248" width="176" height="68" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="580" y="274" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">可观测</text>
<text x="580" y="294" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">保留默认值</text>
<text x="580" y="310" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">不进配置，不增加维护承诺</text>

<!-- O2 -->
<rect x="752" y="248" width="176" height="68" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
<text x="772" y="274" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">不可观测</text>
<text x="772" y="294" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">显式化</text>
<text x="772" y="310" fill="#4f5d75" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">同时写下发现方式</text>

<!-- feedback loop -->
<path d="M 840 316 L 840 348 L 128 348 L 128 168" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
<rect x="288" y="330" width="292" height="12" fill="#f5f5f5"/>
<text x="434" y="339" fill="#2e5aa8" font-size="10" text-anchor="middle" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">上游升级后重跑第一问：唯一能捕获默认值漂移的手段</text>

<!-- footer note -->
<line x1="32" y1="376" x2="928" y2="376" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="32" y="394" fill="#4f5d75" font-size="10" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">反直觉之处：看起来最重要的参数（连接池上限）往往不需要提前管理，因为错了立刻报警；看起来次要的参数（持久化默认值）才必须显式化。</text>
</svg>
</body>
</html>
