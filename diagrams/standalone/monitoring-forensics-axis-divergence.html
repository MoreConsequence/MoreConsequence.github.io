<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>监控与取证在六个维度上都不同</title>
<style>body{margin:0;background:#f5f5f5}svg{display:block;margin:0 auto}</style>
</head>
<body>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mfadTitle mfadDesc">
<title id="mfadTitle">监控与取证的六个维度分歧</title>
<desc id="mfadDesc">六个维度——优化目标、采样率、写者、读者、查询路径、成本模型——上监控和事故复盘的取舍都不同。把两件事塞进同一套存储，会让监控放弃实时性或取证放弃完整性。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<text x="48" y="42" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">监控和取证在六个维度上都不同</text>
<text x="48" y="64" fill="#4f5d75" font-size="11" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">每一条都不同就不是同一件事，合一份存储会让两边都做不好</text>

<!-- column headers -->
<text x="48" y="100" fill="#7a8399" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">维度</text>
<text x="248" y="100" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">监控</text>
<text x="544" y="100" fill="#eb6c36" font-size="10" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">事故复盘 · 取证</text>

<!-- Row 1: 优化目标 -->
<rect x="48" y="116" width="160" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="138" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">维度一</text>
<text x="64" y="158" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">优化目标</text>
<rect x="232" y="116" width="288" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="248" y="144" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">现在是不是在抖</text>
<text x="248" y="164" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">实时 · 低延迟 · 机器读</text>
<rect x="544" y="116" width="368" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="560" y="144" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">这笔请求究竟经历了什么</text>
<text x="560" y="164" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">事后 · 完整 · 人读</text>

<!-- Row 2: 采样率 -->
<rect x="48" y="196" width="160" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="218" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">维度二</text>
<text x="64" y="238" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">采样率</text>
<rect x="232" y="196" width="288" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="248" y="224" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">低（聚合后即丢信息）</text>
<text x="248" y="244" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">1s/10s 窗口已经够用</text>
<rect x="544" y="196" width="368" height="64" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
<text x="560" y="224" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">高（默认全采，缺就是证据缺）</text>
<text x="560" y="244" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">否则无法"找到那笔"</text>

<!-- Row 3: 写者 -->
<rect x="48" y="276" width="160" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="298" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">维度三</text>
<text x="64" y="318" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">写者</text>
<rect x="232" y="276" width="288" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="248" y="304" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">指标推算</text>
<text x="248" y="324" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">请求结束打点，不关心上下文</text>
<rect x="544" y="276" width="368" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="560" y="304" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">事件流</text>
<text x="560" y="324" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">每次状态变迁都要落一笔</text>

<!-- Row 4: 读者 -->
<rect x="48" y="356" width="160" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="378" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">维度四</text>
<text x="64" y="398" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">读者</text>
<rect x="232" y="356" width="288" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="248" y="384" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">值班 · 自动恢复</text>
<text x="248" y="404" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">机器读，决策是告警/不告警</text>
<rect x="544" y="356" width="368" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="560" y="384" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">复盘 · 法务 · 对账 · SLO 申诉</text>
<text x="560" y="404" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">人读，问题是要回答什么</text>

<!-- Row 5: 查询路径 -->
<rect x="48" y="436" width="160" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="458" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">维度五</text>
<text x="64" y="478" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">查询路径</text>
<rect x="232" y="436" width="288" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="248" y="464" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">已知模式</text>
<text x="248" y="484" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">成功率跌了 → 看 A → 看 B</text>
<rect x="544" y="436" width="368" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="560" y="464" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">未知（事后才想到要查什么）</text>
<text x="560" y="484" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">"那笔 502 之后还发生了什么"</text>

<!-- Row 6: 成本模型 (focal, accent) -->
<rect x="48" y="516" width="160" height="64" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="64" y="538" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">维度六</text>
<text x="64" y="558" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">成本模型</text>
<rect x="232" y="516" width="288" height="64" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>
<text x="248" y="544" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">按 series × 点位计费</text>
<text x="248" y="564" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">线性、可预估</text>
<rect x="544" y="516" width="368" height="64" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
<text x="560" y="544" fill="#2d3142" font-size="10.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">按事件量 × 保留期计费</text>
<text x="560" y="564" fill="#7a8399" font-size="9.5" font-family="'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">指数、读不可预测</text>

</svg>
</body>
</html>
