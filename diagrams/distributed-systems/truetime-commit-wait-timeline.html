<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" role="img" aria-labelledby="truetime-commit-wait-title truetime-commit-wait-desc">
  <title id="truetime-commit-wait-title">TrueTime 有界不确定性区间与 commit wait</title>
  <desc id="truetime-commit-wait-desc">两条事务各持一个 TT.now() 区间 [t−ε, t+ε]；T1 选 s=区间上界 260 后等待一个 2ε 窗口到真实时间 300 才提交，T2 的区间 [340,380] 整体落在 T1 提交点之后，因此 TS(T2)=380 大于 TS(T1)=260，真实时间意义上的外部一致成立。</desc>

  <defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="40" y="48" fill="#2d3142" font-size="24" font-family="'Instrument Serif', Georgia, serif">TrueTime：有界不确定性区间与 commit wait</text>
  <text x="40" y="72" fill="#4f5d75" font-size="12" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">两条事务的 TT.now() 区间如何通过 2ε 等待窗口保证外部一致</text>

  <!-- Time axis -->
  <line x1="80" y1="410" x2="800" y2="410" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="812" y="414" fill="#2d3142" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em" text-anchor="start" dominant-baseline="middle">真实时间 →</text>
  <text x="80" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">0</text>
  <text x="800" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">ms</text>

  <!-- T1 lane -->
  <text x="160" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="end">T1</text>
  <rect x="220" y="216" width="40" height="24" rx="4" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
  <text x="240" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">TT.now() 区间</text>
  <circle cx="260" cy="228" r="3" fill="#2d3142"/>
  <text x="266" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">s=260</text>
  <line x1="260" y1="228" x2="300" y2="228" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="264" y="196" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="308" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">commit wait 2ε</text>
  <circle cx="300" cy="228" r="6" fill="#eb6c36"/>
  <text x="312" y="232" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">TS(T1)=260 提交</text>

  <!-- T2 lane -->
  <text x="160" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="end">T2</text>
  <rect x="340" y="300" width="40" height="24" rx="4" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
  <text x="360" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">TT.now() 区间</text>
  <circle cx="380" cy="312" r="3" fill="#2d3142"/>
  <text x="386" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace">s=380</text>
  <line x1="380" y1="312" x2="420" y2="312" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="384" y="280" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="428" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">commit wait 2ε</text>
  <circle cx="420" cy="312" r="6" fill="#eb6c36"/>
  <text x="432" y="316" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">TS(T2)=380 提交</text>

  <!-- Bottom insight callout (ink, not coral to respect budget) -->
  <rect x="120" y="440" width="640" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="136" y="464" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">T2 的 TT.now() 区间 [340,380] 整体始于 T1 提交点(300)之后</text>
  <text x="136" y="484" fill="#2d3142" font-size="11" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">⇒ TS(T2)=380 &gt; TS(T1)=260：真实时间意义上的外部一致成立（代价是每事务 2ε 延迟税）</text>

  <!-- Legend -->
  <line x1="40" y1="516" x2="840" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="120" cy="532" r="5" fill="#eb6c36"/>
  <text x="132" y="536" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">提交点（外部一致）</text>
  <rect x="300" y="526" width="20" height="12" rx="4" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
  <text x="328" y="536" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">TT.now() 区间（宽=2ε）</text>
  <line x1="540" y1="532" x2="572" y2="532" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="580" y="536" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">commit wait 2ε</text>
</svg>
