<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="clock-ordering-quadrant-title clock-ordering-quadrant-desc">
  <title id="clock-ordering-quadrant-title">分布式时钟选型象限</title>
  <desc id="clock-ordering-quadrant-desc">按部署跨度（单地域→跨地域）与排序保证（无保证→线性一致）定位六种时钟方案；TrueTime 位于跨地域线性一致象限为首选，TSO 在单地域线性一致，HLC 在跨地域因果保序，Lamport 与向量时钟在单地域因果保序，物理时钟 NTP 在跨地域无保证。</desc>

  <defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
    
    
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="40" y="52" fill="#2d3142" font-size="24" font-family="'Instrument Serif', Georgia, serif">分布式时钟选型坐标</text>
  <text x="40" y="76" fill="#4f5d75" font-size="12" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">部署跨度 × 排序保证 —— 六个候选的定位</text>

  <!-- Axes cross at (480,330) -->
  <line x1="480" y1="330" x2="160" y2="330" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow-ink)"/>
  <line x1="480" y1="330" x2="800" y2="330" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow-ink)"/>
  <line x1="480" y1="330" x2="480" y2="130" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow-ink)"/>
  <line x1="480" y1="330" x2="480" y2="530" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow-ink)"/>

  <!-- Axis labels (one word per tip, beyond arrow tips) -->
  <text x="140" y="334" fill="#2d3142" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.18em" text-anchor="end" dominant-baseline="middle">单地域</text>
  <text x="820" y="334" fill="#2d3142" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.18em" text-anchor="start" dominant-baseline="middle">跨地域</text>
  <text x="480" y="118" fill="#2d3142" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.18em" text-anchor="middle">线性一致</text>
  <text x="480" y="548" fill="#2d3142" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.18em" text-anchor="middle">无保证</text>

  <!-- Items -->
  <!-- TrueTime (focal, coral) top-right -->
  <circle cx="660" cy="200" r="6" fill="#eb6c36"/>
  <text x="660" y="184" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">TrueTime</text>

  <!-- TSO top-left -->
  <circle cx="320" cy="200" r="4" fill="#2d3142"/>
  <text x="320" y="184" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">TSO</text>

  <!-- HLC right, causal+ -->
  <circle cx="650" cy="272" r="4" fill="#2d3142"/>
  <text x="650" y="290" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">HLC</text>

  <!-- Lamport bottom-left -->
  <circle cx="336" cy="412" r="4" fill="#2d3142"/>
  <text x="336" y="430" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Lamport</text>

  <!-- Vector clock bottom-left -->
  <circle cx="300" cy="446" r="4" fill="#2d3142"/>
  <text x="300" y="464" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">向量时钟</text>

  <!-- NTP bottom-right -->
  <circle cx="684" cy="452" r="4" fill="#2d3142"/>
  <text x="684" y="470" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">物理 NTP</text>

  <!-- Legend strip -->
  <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="120" cy="576" r="5" fill="#eb6c36"/>
  <text x="132" y="580" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">跨地域线性一致首选</text>
  <circle cx="320" cy="576" r="4" fill="#2d3142"/>
  <text x="332" y="580" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">其余方案（点位置 = 定位）</text>
</svg>
