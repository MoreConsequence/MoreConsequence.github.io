<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" role="img" aria-labelledby="a2a-delegate-chain-title a2a-delegate-chain-desc"><title id="a2a-delegate-chain-title">A2A 发现与委派时序</title><desc id="a2a-delegate-chain-desc">客户端先拉 coder 的能力卡发起代码任务，coder 再拉 reviewer 的卡把评审子任务转包出去，reviewer 只看到子任务输入，最终 coder 组装补丁与评审意见一次性返回。</desc>
  <defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="40" y="48" fill="#2d3142" font-size="24" font-family="'Instrument Serif', Georgia, serif">A2A 两步：先拉卡发现，再按卡委派</text>
  <text x="40" y="72" fill="#4f5d75" font-size="12" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">发现解决“找谁”，委派解决“给多少”——reviewer 只见子任务输入</text>

  <!-- Lifelines -->
  <line x1="160" y1="144" x2="160" y2="468" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="480" y1="144" x2="480" y2="468" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="800" y1="144" x2="800" y2="468" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Activation bars -->
  <rect x="156" y="172" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="476" y="244" width="8" height="196" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="796" y="352" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>

  <!-- Actor boxes -->
  <rect x="80" y="96" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="160" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Client</text>
  <text x="160" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">只知地址</text>

  <rect x="400" y="96" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="480" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">coder@2.1.0</text>
  <text x="480" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">skills[codegen]</text>

  <rect x="720" y="96" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="800" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">reviewer@1.0.0</text>
  <text x="800" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">skills[review]</text>

  <!-- M1: Client -> Coder GET card -->
  <line x1="164" y1="180" x2="472" y2="180" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="238" y="160" width="160" height="12" rx="2" fill="#f5f5f5"/>
  <text x="318" y="169" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">GET /.well-known/card</text>

  <!-- M2: Coder -> Client card (return dashed) -->
  <line x1="476" y1="216" x2="168" y2="216" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="238" y="196" width="160" height="12" rx="2" fill="#f5f5f5"/>
  <text x="318" y="205" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">skills[codegen]</text>

  <!-- M3: Client -> Coder POST tasks -->
  <line x1="164" y1="252" x2="472" y2="252" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="238" y="232" width="160" height="12" rx="2" fill="#f5f5f5"/>
  <text x="318" y="241" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">POST tasks{codegen}</text>

  <!-- M4: Coder -> Reviewer GET card -->
  <line x1="484" y1="288" x2="792" y2="288" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="578" y="268" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="638" y="277" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">GET card</text>

  <!-- M5: Reviewer -> Coder card (return dashed) -->
  <line x1="796" y1="324" x2="488" y2="324" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="578" y="304" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="638" y="313" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">skills[review]</text>

  <!-- M6: Coder -> Reviewer POST review -->
  <line x1="484" y1="360" x2="792" y2="360" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="558" y="340" width="160" height="12" rx="2" fill="#f5f5f5"/>
  <text x="638" y="349" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">POST tasks{review}</text>

  <!-- M7: Reviewer -> Coder verdict (return dashed) -->
  <line x1="796" y1="396" x2="488" y2="396" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="578" y="376" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="638" y="385" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">verdict LGTM</text>

  <!-- M8: Coder -> Client assembled (headline coral) -->
  <line x1="476" y1="432" x2="168" y2="432" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="238" y="412" width="160" height="12" rx="2" fill="#f5f5f5"/>
  <text x="318" y="421" fill="#7a8399" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">{patch, review}</text>

  <!-- Isolation callout (coral focal) -->
  <rect x="120" y="482" width="720" height="52" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="136" y="504" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">关键：reviewer 收到的输入是 patch:fix-retry，看不到原始任务</text>
  <text x="136" y="524" fill="#2d3142" font-size="11" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">委派边界 = 最小输入原则的协议实现；越权直调 review 返回 400</text>

  <!-- Legend -->
  <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="568" x2="144" y2="568" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <text x="152" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">HTTP 调用</text>
  <line x1="240" y1="568" x2="264" y2="568" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="272" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">返回</text>
  <line x1="330" y1="568" x2="354" y2="568" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="362" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif">组装结果</text>
</svg>
