<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iot-commit-confirmed-state-machine · diagram source</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f5f5f5;display:flex;justify-content:center}svg{width:100%;max-width:960px;height:auto}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" role="img" aria-labelledby="iot-cc-title iot-cc-desc">
  <title id="iot-cc-title">RFC 6241 Commit-Confirmed 两阶段防变砖配置回滚时序</title>
  <desc id="iot-cc-desc">展示网络设备管理中最关键的防失联机制：下发候选配置后启动看门狗定时器，若网络被切断或超时未收到二次确认，设备内核自动原路回滚。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="38" fill="#2d3142" font-size="22" font-family="'Instrument Serif', Georgia, serif">RFC 6241 Commit-Confirmed 两阶段防变砖时序</text>
  <text x="40" y="60" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">候选配置试运行 ── 硬件看门狗倒计时 ── 二次确认固化 vs 超时自动原路回滚</text>

  <!-- Actors (Top row: y=80..128, h=48) -->
  <!-- Actor 1: NMS Controller (x=160) -->
  <rect x="70" y="80" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="160" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">云端 NMS 控制器</text>
  <text x="160" y="120" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Config Orchestrator</text>

  <!-- Actor 2: Device NETCONF / Agent (x=480) -->
  <rect x="390" y="80" width="180" height="48" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <text x="480" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">设备管理代理 (Agent)</text>
  <text x="480" y="120" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">NETCONF &amp; Watchdog</text>

  <!-- Actor 3: Device OS / Hardware Datapath (x=800) -->
  <rect x="710" y="80" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">硬件底层 (Kernel/ASIC)</text>
  <text x="800" y="120" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Running &amp; Startup Config</text>

  <!-- Lifelines -->
  <line x1="160" y1="128" x2="160" y2="440" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="480" y1="128" x2="480" y2="440" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="800" y1="128" x2="800" y2="440" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Activation bars -->
  <rect x="156" y="152" width="8" height="288" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="476" y="152" width="8" height="288" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="796" y="180" width="8" height="88" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="796" y="388" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>

  <!-- Message 1: Copy-config to candidate -->
  <line x1="164" y1="160" x2="476" y2="160" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="238" y="142" width="160" height="14" rx="2" fill="#f5f5f5"/>
  <text x="318" y="152" fill="#2e5aa8" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">1. copy-config (Candidate)</text>

  <!-- Message 2: Check & prepare -->
  <line x1="484" y1="184" x2="796" y2="184" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="570" y="168" width="140" height="14" rx="2" fill="#f5f5f5"/>
  <text x="640" y="178" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">2. 语法校验 &amp; 备份 Running</text>

  <!-- Message 3: Commit Confirmed = 300s -->
  <line x1="164" y1="220" x2="476" y2="220" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="210" y="202" width="220" height="14" rx="2" fill="#f5f5f5"/>
  <text x="320" y="212" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">3. commit confirmed (timeout=300s)</text>

  <!-- Message 4: Apply to running & start timer -->
  <line x1="484" y1="244" x2="796" y2="244" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="550" y="226" width="180" height="14" rx="2" fill="#f5f5f5"/>
  <text x="640" y="236" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">4. 应用 Candidate + 启动倒计时</text>

  <!-- Branching Fragment Frame: ALT -->
  <rect x="60" y="278" width="840" height="170" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
  <rect x="60" y="278" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
  <text x="80" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

  <!-- Region 1: Happy Path -->
  <text x="110" y="291" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">[网络正常 · 云端健康检查通过]</text>
  
  <line x1="164" y1="320" x2="476" y2="320" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="230" y="304" width="180" height="14" rx="2" fill="#f5f5f5"/>
  <text x="320" y="314" fill="#2e5aa8" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">5a. commit (二次确认固化)</text>

  <line x1="484" y1="340" x2="796" y2="340" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="560" y="324" width="160" height="14" rx="2" fill="#f5f5f5"/>
  <text x="640" y="334" fill="#2e5aa8" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">关闭 Watchdog · 固化配置</text>

  <!-- Region divider -->
  <line x1="68" y1="362" x2="892" y2="362" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Region 2: Failure / Rollback Path -->
  <text x="110" y="377" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">[网络断开 / 路由异常 / 300秒超时未确认]</text>

  <path d="M 484 394 H 516 Q 524 394 524 402 V 410 Q 524 418 516 418 H 484" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="536" y="410" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">5b. Watchdog 倒计时归零触发</text>

  <line x1="484" y1="436" x2="796" y2="436" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="550" y="418" width="180" height="14" rx="2" fill="#f5f5f5"/>
  <text x="640" y="428" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">自动恢复旧 Running · 挽救失联</text>

  <!-- Callout box -->
  <rect x="60" y="476" width="840" height="64" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="76" y="498" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">核心铁律：永远不要相信没有看门狗（Watchdog）的单次配置下发</text>
  <text x="76" y="516" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">网络设备与普通 Web 服务不同：一条错误的 ACL 规则或静态路由即可切断管理连接；Commit-Confirmed 将故障上限锁定在 300 秒内自愈。</text>
  <text x="76" y="530" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace">RFC 6241 §8.4: candidate / confirmed-commit / rollback-on-error 业界通用标准</text>

  <!-- Legend -->
  <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="582" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="110" y1="578" x2="134" y2="578" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <text x="142" y="582" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">正常配置通道</text>
  <line x1="260" y1="578" x2="284" y2="578" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="292" y="582" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">防变砖倒计时与自动回滚触发</text>
</svg>
</body>
</html>
