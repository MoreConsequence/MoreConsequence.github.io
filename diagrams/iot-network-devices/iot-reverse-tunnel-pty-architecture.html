<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" role="img" aria-labelledby="iot-tunnel-title iot-tunnel-desc">
  <title id="iot-tunnel-title">NAT 穿透反向隧道与 Linux PTY 虚拟终端网关架构</title>
  <desc id="iot-tunnel-desc">展示内网设备穿透 NAT 防火墙与云端 Web 终端交互的拓扑：出站反向隧道维持、云端 Broker 审计录像、以及边缘 Linux PTY Master/Slave 伪终端桥接。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.08)"/></pattern>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#grid-dots)"/>

  <!-- Title -->
  <text x="40" y="38" fill="#2d3142" font-size="22" font-family="'Instrument Serif', Georgia, serif">NAT 穿透反向隧道与 Linux PTY 终端网关拓扑</text>
  <text x="40" y="60" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">公网入站阻断 ── 出站长连接反向穿透 ── 云端会话审计录像 ── 边缘 PTY 伪终端桥接</text>

  <!-- Container 1: Client Web Console -->
  <rect x="40" y="80" width="210" height="320" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="52" y="92" width="120" height="18" rx="3" fill="rgba(45,49,66,0.06)"/>
  <text x="112" y="104" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CLIENT CONSOLE</text>
  
  <text x="52" y="136" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">运维人员浏览器</text>
  <text x="52" y="154" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Web 终端界面 (React)</text>

  <rect x="52" y="174" width="186" height="52" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="64" y="194" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">xterm.js 核心引擎</text>
  <text x="64" y="210" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">ANSI 转义 / 光标定位 / UTF-8</text>

  <rect x="52" y="240" width="186" height="52" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="64" y="260" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">WebSocket 双工客户端</text>
  <text x="64" y="276" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">键盘输入 (stdin) / 输出渲染</text>

  <rect x="52" y="306" width="186" height="52" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="64" y="326" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">窗口自适应 (Resize)</text>
  <text x="64" y="342" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">rows/cols 动态同步</text>

  <!-- Container 2: Cloud Tunnel Broker -->
  <rect x="270" y="80" width="220" height="320" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <rect x="282" y="92" width="140" height="18" rx="3" fill="rgba(235,108,54,0.12)"/>
  <text x="352" y="104" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CLOUD BROKER</text>

  <text x="282" y="136" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">云端反向隧道网关</text>
  <text x="282" y="154" fill="#eb6c36" font-size="9" font-family="'Geist', sans-serif">Session Proxy &amp; Audit</text>

  <rect x="282" y="174" width="196" height="52" rx="4" fill="rgba(235,108,54,0.06)" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
  <text x="294" y="194" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif">安全鉴权与指令白名单</text>
  <text x="294" y="210" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">RBAC / 高危命令拦截 (rm -rf)</text>

  <rect x="282" y="240" width="196" height="52" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="294" y="260" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">会话审计录像引擎</text>
  <text x="294" y="276" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Asciinema 格式流式归档</text>

  <rect x="282" y="306" width="196" height="52" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="294" y="326" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">会话路由映射表</text>
  <text x="294" y="342" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">DeviceID ──► TunnelConn</text>

  <!-- Firewall Boundary Barrier -->
  <rect x="510" y="80" width="40" height="320" rx="4" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.22)" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="530" y="160" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" writing-mode="tb">NAT / 企业防火墙</text>
  <text x="530" y="280" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" writing-mode="tb">公网入站 100% 阻断</text>

  <!-- Container 3: Edge CPE Device -->
  <rect x="570" y="80" width="350" height="320" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="582" y="92" width="160" height="18" rx="3" fill="rgba(45,49,66,0.06)"/>
  <text x="662" y="104" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">EDGE CPE DEVICE</text>

  <text x="582" y="136" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">内网物理网络设备 (路由器 / 交换机)</text>
  <text x="582" y="154" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Linux Kernel + 嵌入式管理代理</text>

  <rect x="582" y="174" width="326" height="46" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="594" y="194" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">反向长连接隧道代理 (Reverse Tunnel Agent)</text>
  <text x="594" y="210" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">主动向云端出站建连 (Outbound TCP/WSS) · 保活心跳防 NAT 老化</text>

  <rect x="582" y="232" width="156" height="60" rx="4" fill="rgba(235,108,54,0.06)" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
  <text x="594" y="252" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif">PTY Master</text>
  <text x="594" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">/dev/ptmx 控制句柄</text>
  <text x="594" y="282" fill="#7a8399" font-size="8" font-family="'Geist', sans-serif">双向 Read/Write 流桥接</text>

  <rect x="752" y="232" width="156" height="60" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="764" y="252" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">PTY Slave</text>
  <text x="764" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">/dev/pts/X 伪终端</text>
  <text x="764" y="282" fill="#7a8399" font-size="8" font-family="'Geist', sans-serif">重定向 stdin/out/err</text>

  <rect x="582" y="304" width="326" height="54" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
  <text x="594" y="324" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">目标 CLI / Shell 进程</text>
  <text x="594" y="340" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">exec.Command("/bin/bash" 或 "vtysh" 路由控制台)</text>
  <text x="594" y="352" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">TIOCSWINSZ 响应 SIGWINCH 窗口重绘</text>

  <!-- Flow Arrows -->
  <line x1="250" y1="200" x2="270" y2="200" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <line x1="270" y1="266" x2="250" y2="266" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  
  <line x1="570" y1="200" x2="490" y2="200" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="490" y1="266" x2="570" y2="266" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>

  <line x1="738" y1="262" x2="752" y2="262" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="830" y1="292" x2="830" y2="304" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Callout Bottom -->
  <rect x="40" y="420" width="880" height="72" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <text x="56" y="444" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">物理铁律：为什么普通 TCP 端口映射无法替代反向 PTY 隧道？</text>
  <text x="56" y="462" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">1. 99% 的政企与分支机构局域网处于严苛 NAT 之后，无公网 IP 且严禁对外开端口；</text>
  <text x="56" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">2. 简单的 TCP 管道不具备终端语义（无退格回显、无 Tab 补全、无 Ctrl+C 信号处理），必须依靠 Linux PTY 虚拟终端驱动完整呈现交互状态。</text>

  <!-- Legend -->
  <line x1="40" y1="510" x2="920" y2="510" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="534" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="110" y1="530" x2="134" y2="530" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="142" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">主动出站反向隧道 / PTY 终端驱动链路</text>
  <line x1="380" y1="530" x2="404" y2="530" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <text x="412" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">全双工数据流 (Stdin/Stdout)</text>
